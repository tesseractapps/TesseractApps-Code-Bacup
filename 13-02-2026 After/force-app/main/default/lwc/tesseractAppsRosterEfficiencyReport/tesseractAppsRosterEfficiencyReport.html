<template>
    <div class="dashboard-container custom-scroll">
        <div style="display: flex; align-items: center; justify-content: space-between;">

            <p style="font-weight: bold; font-size:140% ">Efficiency Report</p>
        

            <div style="display: flex; justify-content: flex-end; Padding-Bottom: 1%">
                <lightning-button
                    label="Back"
                    onclick={handleBack}
                    variant="brand"
                    class="export-csv-btn">
                </lightning-button>
            </div>
        </div>

        <!-- <div class="metrics-grid">
            <template iterator:metric={sortedMetrics}>
                <div key={metric.value.title} class={metric.value.computedClass} onclick={handleMetricClick} data-id={metric.value.id}>
                    <h3 class="metric-title">{metric.value.title}</h3>
                    <p class="metric-value">{metric.value.value}</p>
                </div>
            </template>
        </div> -->

        <div class="metrics-grid">
            <template iterator:metric={sortedMetrics}>
                <div key={metric.value.title}
                    class={metric.value.computedClass}
                    onclick={handleMetricClick}
                    data-id={metric.value.id}>

                    <div style="display: flex; justify-content:space-between;">
                        <div>
                            <h3 class="metric-title">{metric.value.title}</h3>
                            <p class="metric-value">{metric.value.value}</p>
                        </div>
                        <!-- ✅ Show icon only when selected -->
                        <template if:true={metric.value.showIcon}>
                            <i class="material-icons metric-icon">task_alt</i>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- Filters -->
        <div class="filter-section">
            <div class="filter-grid">
                <!-- <div class="filter-item">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Frequency</span>
                        <lightning-combobox
                            name="frequency"
                            variant="label-hidden"
                            value={frequencyValue}
                            placeholder="Select Frequency"
                            options={frequencyOptions}
                            onchange={handlefrequencyChange}
                            class="filter-select">
                        </lightning-combobox>
                    </div>
                </div>
                <template if:false={isDaysDisabled}>
                    <div class="filter-item">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Days</span>
                            <lightning-combobox
                                name="days"
                                variant="label-hidden"
                                value={daysValue}
                                placeholder="Select"
                                options={daysOptions}
                                onchange={handledaysChange}
                                class="filter-select">
                            </lightning-combobox>
                        </div>
                    </div>
                </template> -->
                <div class="filter-item">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Facility</span>
                        <lightning-combobox
                            name="facility"
                            variant="label-hidden"
                            value={facilityValue}
                            placeholder="Select Facility"
                            options={facilityOptions}
                            onchange={handleFacilityChange}
                            class="filter-select">
                        </lightning-combobox>
                    </div>
                </div>
                <div class="filter-item">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Role</span>
                        <lightning-combobox
                            name="role"
                            variant="label-hidden"
                            value={selectedRole}
                            placeholder="Select Role"
                            options={roleOptions}
                            onchange={handleRoleChange}
                            class="filter-select">
                        </lightning-combobox>
                    </div>
                </div>
                <div class="filter-item">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Employment Type</span>
                        <lightning-combobox
                            name="employmentType"
                            variant="label-hidden"
                            value={selectedEmploymentType}
                            placeholder="Select Type"
                            options={employmentTypeOptions}
                            onchange={handleEmploymentTypeChange}
                            class="filter-select">
                        </lightning-combobox>
                    </div>
                </div>
                
                
                <!-- <div class="filter-buttons">
                    <lightning-button
                        icon-name="utility:filterList"
                        onclick={handleFilter}
                        class="filter-btn">
                    </lightning-button>
                    <lightning-button
                        icon-name="utility:download"
                        onclick={handleExport}
                        variant="brand"
                        class="export-btn">
                    </lightning-button>
                </div> -->
                <div class="filter-item"></div>
                <div class="filter-item">
                    <div class="date-picker-container">
                        
                        <div class="floating-label-new" style="width: 130px;">
                          <span class="label-text-drop">Start Date</span>
                          <lightning-input 
                                type="date" 
                                variant="label-hidden"
                                onchange={handleStartDateChange} 
                                value={selectedStartDate}
                                class="date-input">
                          </lightning-input>
                        </div>

                        <div class="floating-label-new" style="width: 130px;">
                          <span class="label-text-drop">End Date</span>
                          <lightning-input 
                                type="date" 
                                variant="label-hidden"
                                onchange={handleEndDateChange} 
                                value={selectedEndDate}
                                class="date-input">
                          </lightning-input>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>

        <!-- Staff Utilization Table -->
        <div class="table-header">
            <h2 class="table-title">Staff Utilization</h2>
            <div class="table-actions">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    onclick={handleRefresh}
                    alternative-text="Refresh">
                </lightning-button-icon>
                <lightning-button
                    label="Export CSV"
                    onclick={handleExport}
                    variant="brand"
                    class="export-csv-btn">
                </lightning-button>
            </div>
        </div>
        <template if:false={noRecordsFlag}>
            <div class="table-container">
                <!-- Table below the header -->
                <div class="table-wrapper">
                    <table class="staff-table">
                        <thead>
                            <tr>
                                <th class="table-th">Staff Name</th>
                                <th class="table-th">
                                    Set Hrs<br />
                                    <span class="sub-text">(SH)</span>
                                </th>
                                <th class="table-th">
                                    Rostered Hrs<br />
                                    <span class="sub-text">(RH)</span>
                                </th>
                                <th class="table-th">
                                    Completed Hrs<br />
                                    <span class="sub-text">(CH)</span>
                                </th>
                                <th class="table-th">
                                    RH Variance<br />
                                    <span class="sub-text">(RH-SH)</span>
                                </th>
                                <th class="table-th">
                                    CH Variance<br />
                                    <span class="sub-text">(CH-SH)</span>
                                </th>
                                <th class="table-th">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={staffData} for:item="staff">
                                <tr key={staff.id} class="table-row">
                                    <td class="table-td">
                                        <div class="staff-info">
                                            <div class="staff-name">
                                                {staff.name}
                                            </div>
                                            <div class="staff-class">{staff.classNumber}</div>
                                        </div>
                                    </td>
                                    <td class="table-td">{staff.setHours}</td>
                                    <td class="table-td">{staff.rosteredHours}</td>
                                    <td class="table-td">
                                        <template if:true={staff.completedHours}>
                                            {staff.completedHours}
                                        </template>
                                        <template if:false={staff.completedHours}>
                                            0
                                        </template>
                                    </td>
                                    <td class="table-td">
                                        <span class={staff.rhVarianceClass}>
                                            <template if:true={staff.showRhVariance}>
                                                {staff.rhVariance}
                                            </template>
                                            <template if:false={staff.showRhVariance}>
                                                0
                                            </template>
                                        </span>
                                    </td>
                                    <td class="table-td">
                                        <template if:true={staff.chVariance}>
                                            {staff.chVariance}
                                        </template>
                                        <template if:false={staff.chVariance}>
                                            0
                                        </template>
                                    </td>
                                    <td class="table-td">
                                        <span class={staff.statusClass}>
                                            {staff.status}
                                        </span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>  
                </div>
            </div>
        </template>
        <template if:true={noRecordsFlag}>
            <div class="no-data">
                <p>No records found</p>
            </div>
        </template>
       
    </div>
    <!-- Pagination -->
    <template if:false={noRecordsFlag}>
        <div class="fixed-pagination">
            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread " style="padding-top: 0.5em;width:95%;margin-left:2%">
                <div class="slds-col">
                    <div class="slds-list_inline">
                        <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                        <div class="slds-select_container">
                            <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                <template for:each={pageSizeOptions} for:item="option">
                                    <option key={option} value={option}>{option}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="slds-align_absolute-center" style="height:5rem;">
                    <lightning-button disabled={isFirstPage} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={handleFirstPage} style="margin-right:10px;"></lightning-button>
                    <lightning-button disabled={isFirstPage} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={handlePreviousPage} style="margin-right:5px;"></lightning-button>
                    &nbsp;
                    <span class="slds-badge">Showing {currentPage} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                    &nbsp;
                    <lightning-button disabled={isLastPage} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={handleNextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                    <lightning-button disabled={isLastPage} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={handleLastPage} icon-position="right"></lightning-button>
                </div>
                <div class="slds-clearfix">
                    <div class="slds-float_right">
                        <span class="slds-badge"> Total Records: {totalRecords}</span>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
</template>
