<template>
     <section class="staff-page slds-p-around_medium">
        <div class="staff-card slds-p-around_medium">

            <!-- HEADER -->
             <div style="display: flex;justify-content:space-between;">
            <div class="slds-m-bottom_medium">
                <h1 class="staff-title">Staff Directory</h1>
                <p class="staff-subtitle">
                    Manage staff members and assign reporting managers
                </p>
            </div>
            <div>
                <lightning-button
                    label="Back"
                    variant="brand"
                    onclick={backToHome}></lightning-button>
            </div>
            </div>

            <!-- SEARCH + FILTER ROW -->
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                <div class="slds-size_1-of-4 slds-p-right_small">
                    <lightning-input
                        type="search"
                        variant="label-hidden"  onchange={handleSearch}
                        placeholder="Search staff by name or email..." 
                        class="staff-search">
                    </lightning-input>
                </div>

                <!-- <div class="slds-size_1-of-3 slds-p-left_small">
                    
                    <div class="staff-filter slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                        <span class="staff-filter-label">All Departments</span>
                        <i class="material-icons staff-filter-icon">expand_more</i>
                    </div>
                </div> -->
            </div>

            <!-- TABLE -->
            <div class="slds-scrollable_x">
                <div class="staff-table-container" style="overflow-Y: auto;height:66vh;">
                    <table class="slds-table slds-table_cell-buffer staff-table">
                        <thead>
                            <tr>
                                <th scope="col" class="staff-th staff-th_employee">
                                    <div class="slds-p-around_small">Employee</div>
                                </th>
                               <!--  <th scope="col" class="staff-th staff-th_department">
                                    <div class="slds-p-around_small">Department</div>
                                </th>
                                <th scope="col" class="staff-th staff-th_position">
                                    <div class="slds-p-around_small">Position</div>
                                </th> -->
                                <th scope="col" class="staff-th staff-th_type">
                                    <div class="slds-p-around_small">Type</div>
                                </th>
                                <th scope="col" class="staff-th staff-th_reports">
                                    <div class="slds-p-around_small">Reports To</div>
                                </th>
                               <!--  <th scope="col" class="staff-th staff-th_role">
                                    <div class="slds-p-around_small">designation</div>
                                </th> -->
                                <th scope="col" class="staff-th staff-th_actions">
                                    <div class="slds-p-around_small">Actions</div>
                                </th>
                            </tr>
                        </thead>

                        <tbody>
                            <template for:each={staff} for:item="row">
                                <tr key={row.id}>
                                    <!-- EMPLOYEE -->
                                    <td class="staff-td staff-td_employee">
                                        <div class="slds-p-around_small">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <div class={row.avatarClass}>
                                                    <span class="staff-avatar__initials">
                                                        {row.initials}
                                                    </span>
                                                </div>
                                               <!--  <template if:true={row.hasProfilePic}>
                                                <img
                                                    src={row.profilePicUrl}
                                                    alt={row.name}
                                                    class="staff-avatar__img"
                                                    onerror={handleImageError}
                                                />
                                            </template>
                                            
                                                
                                            

                                            <template if:false={row.hasProfilePic}>
                                                <div class={row.avatarClass}>
                                                <span class="staff-avatar__initials">
                                                    {row.initials}
                                                </span>
                                                </div>
                                            </template> -->
                                        

                                                <div>
                                                    <div class="staff-emp-name">{row.name}</div>
                                                    <div class="staff-emp-email">{row.email}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>

                                    <!-- DEPARTMENT BADGE -->
                                   <!--  <td class="staff-td staff-td_department">
                                        <div class="slds-p-around_small">
                                            <span class={row.departmentClass}>{row.department}</span>
                                        </div>
                                    </td> -->

                                    <!-- POSITION -->
                                   <!--  <td class="staff-td staff-td_position">
                                        <div class="slds-p-around_small">
                                            {row.position}
                                        </div>
                                    </td> -->

                                    <!-- TYPE PILL -->
                                    <td class="staff-td staff-td_type">
                                        <div class="slds-p-around_small">
                                            <span class="staff-pill staff-pill_type">
                                                {row.type}
                                            </span>
                                        </div>
                                    </td>

                                    <!-- REPORTS TO -->
                                    <td class="staff-td staff-td_reports">
                                        <div class="slds-p-around_small slds-grid slds-grid_vertical-align-center">
                                            <i class="material-icons staff-reports-icon">
                                                group
                                            </i>
                                            <span class="staff-reports-name">
                                                {row.reportsTo}
                                            </span>
                                           <!--  <template if:true={row.reportsNote}>
                                                <span class="staff-reports-note">
                                                    &nbsp;({row.reportsNote})
                                                </span>
                                            </template> -->
                                        </div>
                                    </td>

                                    <!-- ROLE PILL -->
                                  <!--   <td class="staff-td staff-td_role">
                                        <div class="slds-p-around_small">
                                            <template if:true={row.role}>
                                                <span class="staff-pill staff-pill_role">
                                                    <span class="staff-role-indicator"></span>
                                                    {row.role}
                                                </span>
                                            </template>
                                        </div>
                                    </td> -->

                                    <!-- ACTIONS -->
                                    <td class="staff-td staff-td_actions">
                                       <!--  <div class="slds-p-around_small slds-grid slds-grid_vertical-align-center">
                                            <i class="material-icons staff-action-icon">
                                                edit
                                            </i>
                                            <span class="staff-action-text">Change</span>
                                        </div> -->
                                        <template if:false={row.isEditing}>
            <i
                class="material-icons staff-action-icon"
                data-id={row.id}
                onclick={handleEditClick}>
                edit
            </i>
            <span class="staff-action-text">Change</span>
                                       </template>

        <!-- Edit Mode -->
        <template if:true={row.isEditing}>
            <div style="display:flex;align-items: center;gap: 0.5rem;">
            <lightning-combobox
                data-id={row.id}
                options={staffOptions}
                value={row.selectedStaffId}
                placeholder="Select Approver"
                onchange={handleStaffChange}
                class="slds-m-right_x-small large-combobox" variant="label-hidden">
            </lightning-combobox>

            <lightning-button-icon
                icon-name="utility:check"
                variant="bare"
                alternative-text="Save"
                data-id={row.id}
                onclick={handleSave}>
            </lightning-button-icon>
            </div>
        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </section>
</template>
