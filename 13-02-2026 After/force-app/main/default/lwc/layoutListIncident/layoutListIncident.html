<!-- <template if:true={isTableView}> -->
  <div class="publishtable-wrapper custom-scroll">
    <table class="publishtable-table">
      <thead>
  <tr class="custom-table-header">
    <!-- Select All Published -->
<th style="width:40px; text-align:center;">
  <lightning-input
    type="checkbox"
    checked={isAllPublishedSelected}
    onchange={handleSelectAllPublished}>
  </lightning-input>
</th>

    <th><div class="slds-truncate">Form Name</div></th>
    <th><div class="slds-truncate">Created Date</div></th>
    <th><div class="slds-truncate">Created By</div></th>
    <th><div class="slds-truncate">Form Category</div></th>
    <th><div class="slds-truncate">Staff Name</div></th>
    <th><div class="slds-truncate">Actions</div></th>
  </tr>
</thead>


     <tbody>
  <template for:each={paginatedForms} for:item="form">
    <tr key={form.recordId}>

        <!-- Bulk Select Checkbox (Published only) -->
<td class="publishtable-cell publishtable-checkbox">

 <template if:true={form.isPublished}>
  <template if:false={form.hideCheckbox}>
    <lightning-input
      type="checkbox"
      data-id={form.recordId}
      checked={form.isSelected}
      onchange={handlePublishedCheckboxChange}>
    </lightning-input>
  </template>
</template>


</td>


      <!-- Form Name -->
      <td class="publishtable-cell publishtable-name">
        <i class="material-icons publishtable-docicon">description</i>
        <span class="publishtable-ellipsis" title={form.formName}>
          {form.formName}
        </span>
      </td>

      <!-- Created Date -->
      <td class="publishtable-cell">{form.dateTimeString}</td>

      <!-- Created By -->
      <td class="publishtable-cell">
        <div class="publishtable-userline" title={form.createdByName}>
          <span class="publishtable-avatar">
            {form.createdByInitials}
          </span>
          <span class="publishtable-usertext publishtable-ellipsis">
            {form.createdByName}
          </span>
        </div>
      </td>

      <!-- Form Category -->
      <td class="publishtable-cell">
        <span class={form.categoryClass}>
          {form.category}
        </span>
      </td>

      <!-- Staff Name (only for Published) -->
    <td class="publishtable-cell">

  <!-- DEFAULT → text only -->
  <template if:true={form.staffTextOnly}>
    <span class="staff-all-text">
      {form.staffTextLabel}
    </span>
  </template>

  <!-- Published → avatars -->
  <template if:true={form.isPublished}>
    <template if:false={form.staffTextOnly}>

      <div class="publishtable-avatars">

        <!-- Visible staff -->
        <template for:each={form.visibleStaff} for:item="p">

          <span key={p.id}
                class="publishtable-avatar-img"
                title={p.name}>

            <template if:true={p.pictureUrl}>
              <img src={p.pictureUrl} alt={p.name}/>
            </template>

            <template if:false={p.pictureUrl}>
              <span class="publishtable-avatar-fallback">
                {p.initials}
              </span>
            </template>

            <span class="form-access-tooltip-text">
              {p.name}
            </span>

          </span>

        </template>

        <!-- +N overflow -->
        <template if:true={form.hasExtraStaff}>

          <div class="form-access-avatar-wrapper form-access-extra-count"
               title={form.extraStaffNames}>

            +{form.extraStaffCount}

          </div>

        </template>

        <!-- No staff -->
        <template if:false={form.hasVisibleStaff}>

          <span class="nd-form-card__no-access"
                title="No Staff Assigned">

            <i class="material-icons" aria-hidden="true">
              group_off
            </i>

          </span>

        </template>

      </div>

    </template>
  </template>

  <!-- Draft → dash -->
  <template if:true={form.isDraft}>
    —
  </template>

</td>



      <!-- Actions -->
      <td class="publishtable-cell publishtable-actions">

  <!-- NOTHING for Default -->
<template if:false={form.isDefault}>


    <!-- Draft → Edit + Delete -->
    <template if:true={form.isDraft}>
      <button 
         class="ND-icon-btn ND-link--icon"
         data-id={form.recordId}
         onclick={handleEditDraft}>
        <i class="material-icons ND-link__icon">
          edit_document
        </i>
      </button>

      <button class="ND-icon-btn ND-icon-btn--danger"
              title="Delete"
              data-id={form.recordId}
              onclick={handleDeleteDraft}>
        <i class="material-icons">delete</i>
      </button>
    </template>

    <!-- Published → Grant Access -->
    <template if:true={form.isPublished}>
      <button
         class="ND-icon-btn ND-link--icon"
         data-id={form.recordId}
         onclick={handleGrantAccess}>
        <i class="material-icons ND-link__icon">
          person_add
        </i>
      </button>
    </template>

  </template>

</td>


    </tr>
  </template>

  <template if:false={paginatedForms.length}>
    <tr>
      <td colspan="7" class="publishtable-empty">
        No forms found.
      </td>
    </tr>
  </template>
</tbody>

    </table>
  </div>
<!-- </template> -->


<template if:true={totalRecords}>
    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-left_xx-large" style="padding-top: 0.5em;">
        <!-- RECORDS PER PAGE -->
        <div class="slds-col">
            <div class="slds-list_inline slds-p-bottom_xx-small">
                <label class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center" for="recordsPerPage">Page Size:</label>
                <div class="slds-select_container">
                    <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                        <template for:each={pageSizeOptions} for:item="option">
                            <option key={option} value={option}>{option}</option>
                        </template>
                    </select>
                </div>
            </div>
        </div>

        <!-- PAGE NAVIGATION -->
        <div class="slds-align_absolute-center" style="height:5rem">
            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
            &nbsp;
            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
            &nbsp;
            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
        </div>

        <!-- TOTAL RECORDS -->
        <div class="slds-clearfix slds-m-right_xx-large">
            <div class="slds-float_right">
                <span class="slds-badge">Total Records: {totalRecords}</span>
            </div>
        </div>
    </div>
</template>


<template if:true={isGrantAccessPopupOpen}>

  <div class="grant-modal-overlay">

    <div class="grant-modal">

      <!-- HEADER -->
      <div class="assign-modal-header">
        <span class="assign-title">Grant Access</span>
        <button class="assign-close-button" onclick={closeGrantAccessPopup}>✕</button>
      </div>

       <div class="assign-search-row">
  <!-- Search Participant -->
  <div class="floating-label-input">
    <span class="label-text-drop">Search Staff</span>
    <lightning-input
      type="search"
      placeholder="Search by Staff"
      onchange={handleStaffSearch}
      value={staffSearchKey}
      variant="label-hidden">
    </lightning-input>
  </div>

  <!-- Facility Dropdown -->
  <div class="floating-label-input">
    <span class="label-text-drop">Facility</span>
    <lightning-combobox
      value={selectedFacility}
      options={staffFacilityOptions}
      onchange={handleFacilityChange}
      variant="label-hidden">
    </lightning-combobox>
  </div>
</div>

      <!-- BODY -->
      <div class="grant-modal-body custom-scroll">

       
        <template for:each={paginatedStaff} for:item="staff">

          <div key={staff.Id} class="staff-row">

            <lightning-input
              type="checkbox"
              data-id={staff.Id}
              checked={staff.isSelected}
              onchange={handleStaffSelect}>
            </lightning-input>

            <span>{staff.firstName} {staff.lastName}</span>

          </div>

        </template>

      </div>

      <!-- PAGINATION -->
     <template if:true={totalStaffRecords}>
  <div class="slds-grid slds-wrap slds-p-around_medium slds-grid_vertical-align-center">

    <div class="slds-col slds-size_1-of-3">

  <div class="slds-list_inline slds-p-bottom_xx-small">

    <label
      class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center"
      for="staffRecordsPerPage">

      Page Size:

    </label>

    <div class="slds-select_container">

      <select
        class="slds-select"
        id="staffRecordsPerPage"
        onchange={handleStaffPageSizeChange}>

        <template
          for:each={staffPageSizeOptions}
          for:item="option">

          <option
            key={option.value}
            value={option.value}>

            {option.label}

          </option>

        </template>

      </select>

    </div>

  </div>

</div>


    <!-- CENTER : NAV -->
    <div class="slds-col slds-size_1-of-3 slds-text-align_center">

      <div class="slds-grid slds-gutters slds-align_absolute-center slds-nowrap">

        <lightning-button
          disabled={bDisableFirstStaff}
          icon-name="utility:jump_to_left"
          label="First"
          onclick={firstStaffPage}>
        </lightning-button>

        <lightning-button
          disabled={bDisableFirstStaff}
          icon-name="utility:chevronleft"
          label="Previous"
          onclick={previousStaffPage}>
        </lightning-button>

        <span class="slds-badge slds-m-horizontal_small">
          Showing {pageNumberStaff} of {totalStaffPages} Page(s)
        </span>

        <lightning-button
          disabled={bDisableLastStaff}
          icon-name="utility:chevronright"
          label="Next"
          onclick={nextStaffPage}>
        </lightning-button>

        <lightning-button
          disabled={bDisableLastStaff}
          icon-name="utility:jump_to_right"
          label="Last"
          onclick={lastStaffPage}>
        </lightning-button>

      </div>

    </div>

    <!-- RIGHT : TOTAL -->
    <div class="slds-col slds-size_1-of-3 slds-text-align_right">

      <span class="slds-badge">
        Total Staff: {totalStaffRecords}
      </span>

    </div>

  </div>
</template>


      <!-- FOOTER -->
      <div class="grant-modal-footer">

        <lightning-button
          label="Cancel"
          onclick={closeGrantAccessPopup}>
        </lightning-button>

        <lightning-button
          variant="brand"
          label="Grant Access"
          onclick={grantAccess}>
        </lightning-button>

      </div>

    </div>

  </div>

</template>





</template>
