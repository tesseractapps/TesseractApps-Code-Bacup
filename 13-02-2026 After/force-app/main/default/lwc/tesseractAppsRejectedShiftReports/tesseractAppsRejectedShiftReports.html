<template>
     <div>
         
            <!-- <div class="search-section">
                 <p style="font-weight: bold; padding: 1% 0% 2% 1%;font-size:140%">Rejected Shift Reports</p>
            </div> -->
            <div class="action-section">
                    <div class="slds-grid slds-wrap slds-grid_align-spread" style="width: 100%;align-items: center;">
    
    <!-- LEFT SIDE: Start + End Date Inputs -->
    <div class="slds-grid slds-wrap" style="gap: 1rem;">
        <!-- Start Date -->
        <div class="slds-col">
            <div class="floating-label">
                <span class="label-text-drop">Start Date</span>
                <lightning-input 
                    type="date" 
                    name="StartDateInputValue"  
                    value={startDate}  
                    onchange={handleDatesChanges}
                    variant="label-hidden">
                </lightning-input>
            </div>
        </div>

        <!-- End Date -->
        <div class="slds-col">
            <div class="floating-label">
                <span class="label-text-drop">End Date</span>
                <lightning-input 
                    type="date" 
                    name="EndDateInputValue"  
                    value={endDate} 
                    onchange={handleDatesChanges}
                    variant="label-hidden">
                </lightning-input>
            </div>
        </div>
    </div>

     <div class="slds-grid slds-wrap" style="gap: 0.5rem; margin-left: 1rem;">
                <div class="stat-card rejected">
                    <span class="label">Total Rejected</span>
                    <span class="value">{totalRejected}</span>
                </div>

                <div class="stat-card staff">
                    <span class="label">Unique Staff</span>
                    <span class="value">{uniqueStaff}</span>
                </div>

                <div class="stat-card avg">
                    <span class="label">Avg per Week</span>
                    <span class="value">{avgPerWeek}</span>
                </div>

                <div class="stat-card role" data-role={mostRejectedRole} onclick={handleRoleFilter} style="cursor: pointer;">
                    <span class="label">{mostRejectedRole}</span>
                            <template if:true={roleflag}>
                    <i class="material-iconsInvoice">task_alt</i>
                </template>
                </div>
            </div>
        

    <!-- RIGHT SIDE: Buttons -->
    <div class="slds-grid slds-grid_align-end" style="gap: 0.75rem;">
        <button class="custom-create-btn" onclick={handleShiftsCSVExport} title="Export Rejected Shift Reports">
            Export Rejected Shift Reports
        </button>
        <!-- <button class="custom-create-btn" onclick={handleBackToParent} title="Back(Ctrl + Shift + B)">
            Back
        </button> -->
    </div>
    </div>

</div>

            </div>
         
              
                <template if:true={sectionFlags.RejectedShiftReports}>
                    <div class="slds-grid slds-wrap slds-grid_align-center" >
                    
                            <div class="listview custom-scroll" style="padding: 1% 0 0 0;">
                                <table class="slds-table" style="table-layout: fixed;">
                                    <thead>
                                        <tr>
                                            <th class="slds-cell-wrap th">Date</th>
                                            <th class="slds-cell-wrap th">{staffPreferredName}</th>
                                            <th class="slds-cell-wrap th">{facilityPreferredName}</th>
                                            <th class="slds-cell-wrap th">Role</th>
                                            <th class="slds-cell-wrap th">Shift Time</th>
                                            <th class="slds-cell-wrap th">Participant</th>
                                             <th class="slds-cell-wrap th">Comments</th>
                                             <th class="slds-cell-wrap th">Rejected At</th>
                                             <th class="slds-cell-wrap th">Reassigned To</th>
                                             <th class="slds-cell-wrap th">Reassigned Time</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={shifts} for:item="row">
                                            <tr key={row.id} class="tr1">
                                                <!-- <td>{row.client}</td> -->
                                                <td class="slds-cell-wrap">{row.formattedDate}</td>
                                                <td class="slds-cell-wrap description" title={row.Staff__r.Display_Nickname__c}>{row.Staff__r.Display_Nickname__c}</td>
                                                <td class="slds-cell-wrap">{row.Facility__c}</td>
                                                <td class="slds-cell-wrap">{row.Add_Shift__r.Role__c}</td>
                                                
                                                <td class="slds-cell-wrap">{row.Add_Shift__r.Shift_Start_End_Time__c}</td>
                                                <td class="slds-cell-wrap description" title={row.participantName}>{row.participantName}</td>
                                                <td class="slds-cell-wrap description" title={row.RejectedComments__c}>{row.RejectedComments__c}</td>
                                                 <td class="slds-cell-wrap description" title={row.rejecteddate}>{row.rejecteddate}</td>
                                                <td class="slds-cell-wrap description" title={row.reassignedStaffName}>{row.reassignedStaffName}</td>
                                                <td class="slds-cell-wrap description" title={row.reassignedDate}>{row.reassignedDate}</td>
                                                
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                           
                            
                     <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination" style="padding-top: 0.5em;width:95%;margin-left:2%">
                    <!-- RECORDS PER PAGE -->
                    <div class="slds-col">
                        <div class="slds-list_inline ">
                            <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                            <label class="slds-text-color_weak" for="recordsPerPage"></label><!--slds-p-horizontal_x-small-->
                            <div class="slds-select_container">
                                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template> 
                                </select>
                            </div>
                        </div>
                    </div>
                    <!-- PAGE NAVIGATION -->
                    <div class="slds-align_absolute-center" style="height:5rem;">
                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                        &nbsp;
                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                        &nbsp;
                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                    </div>
                    <!-- TOTAL RECORDS -->
                    <div class="slds-clearfix">
                        <div class="slds-float_right">
                            <span class="slds-badge"> Total Records: {totalRecords}</span>
                        </div>
                    </div>
                </div>
            
                
                    


                </div>
                </template>

               
    <template if:true={exportFlag}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open"
        >
            <div class="slds-modal__container">

                <!-- HEADER -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        Export CSV Report
                    </h2>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium">

                    <p class="slds-text-body_small slds-m-bottom_medium">
                        Choose the level of detail you want in your export.
                    </p>

                    <!-- SUMMARY OPTION -->
                    <div class="slds-box slds-m-bottom_small option-box">
                        <lightning-input
                            type="radio"
                            name="exportType"
                            label="Summary Version"
                            value="summary"
                            checked={isSummary}
                            onchange={handleOptionChange}
                        >
                        </lightning-input>

                        <p class="slds-text-body_small slds-m-left_large">
                            Includes: Date, Staff, Facility, Role, Shift Time, Participant,
                            Comments, Reassigned To, Reassigned Time,Rejected At
                        </p>
                    </div>

                    <!-- DETAILED OPTION -->
                    <div class="slds-box option-box">
                        <lightning-input
                            type="radio"
                            name="exportType"
                            label="Detailed Version"
                            value="detailed"
                            checked={isDetailed}
                            onchange={handleOptionChange}
                        >
                        </lightning-input>

                        <p class="slds-text-body_small slds-m-left_large">
                            Includes: All summary fields plus Address, Facility,
                            Complete timestamps, and full reassignment details
                        </p>
                    </div>

                    <!-- INFO NOTE -->
                    <div class="slds-notify slds-notify_alert slds-theme_info slds-m-top_medium">
                        <span>
                            Note: This will export {totalRejectedshifts} rejected shift records.
                        </span>
                    </div>

                </div>

                <!-- FOOTER -->
                <footer class="slds-modal__footer slds-grid slds-grid_align-end">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancel}
                        class="slds-m-right_small"
                    >
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="Export CSV"
                        icon-name="utility:download"
                        onclick={handleExport}
                    >
                    </lightning-button>
                </footer>

            </div>
        </section>

        <!-- BACKDROP -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

 
       
    
</template>
