<template>
  <div if:true={cardview} class="main-container">
    <div class="content-wrapper">
      <template if:true={cardview}>
        <header class="header">
          <div class="search-section">
            <div
              class="floating-label slds-small-size_1-of-1 slds-medium-size_1-of-2"
            >
              <span class="label-text-drop">Search</span>
              <div class="custom-search-wrapper">
                <lightning-input
                  type="search"
                  name="fullname"
                  label="Participant Name"
                  variant="label-hidden"
                  value={fullName}
                  onchange={handleSearchKeyPress}
                >
                </lightning-input>
              </div>
            </div>

            <div class="button-group filter-toggle-group">
              <button
                type="button"
                class={activeButtonClass}
                onclick={handleActiveToggle}
              >
                Active
              </button>

              <button
                type="button"
                class={inactiveButtonClass}
                onclick={handleInactiveToggle}
              >
                Inactive
              </button>
            </div>
          </div>

          <div class="action-section">
            <button class="view-toggle-button">
              <i
                class="material-icons toggle-icon"
                data-name={viewToggleTarget}
                onclick={handleChange}
                title={viewToggleTitle}
                >{viewToggleIcon}</i
              >
            </button>
            <button class="custom-create-btn" onclick={handleSwitchToMultiClientUpload} title="Bulk Upload(Ctrl + Shift + U)">
                Bulk Upload
            </button>
            <button
              class="custom-create-btn"
              onclick={handleCreateNewParticipant}
              title="Create(Ctrl + Shift + C)"
            >
              Create Participant
            </button>
          </div>
        </header>

        <!-- Card view Display Code-->
        <template if:true={cardFlag}>
          <template if:false={noRecordsFlag}>
            <div if:true={isDesktop}>
              <template if:true={showSpinner}>
                <lightning-spinner
                  alternative-text="Refreshing Data"
                  size="medium"
                ></lightning-spinner>
              </template>

              <div
                class="slds-grid slds-gutters slds-wrap"
                style="margin-right: 0.1%; margin-left: 0.1%"
              >
                <template
                  for:each={recordsWithToggleStyle}
                  for:item="fac"
                  for:index="index"
                >
                  <div
                    key={fac.Id}
                    class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4"
                    style="padding: 1%"
                  >
                    <div
                      style="
                        border-radius: 4px;
                        border: 1px solid rgba(0, 41, 70, 0.6);
                        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                      "
                    >
                      <span
                        style="
                          border-top-left-radius: 4px;
                          border-top-right-radius: 4px;
                          height: 40px;
                          display: flex;
                          align-items: center;
                          justify-content: space-between;
                          background-color: #003466;
                          border-bottom: 1px black;
                          padding: 2px;
                          overflow: hidden;
                        "
                      >
                        <b
                          style="
                            flex-grow: 1;
                            overflow: hidden;
                            text-overflow: ellipsis;
                            white-space: nowrap;
                            color: white;
                          "
                        >
                          <lightning-formatted-text
                            class="name"
                            style="
                              font-size: 17px;
                              color: white;
                              padding-left: 15px;
                              flex-shrink: 1;
                            "
                            value={fac.Display_Nickname__c}
                          >
                          </lightning-formatted-text>
                        </b>

                        <template if:true={fac.Picture__c}>
                          <lightning-avatar
                            variant="circle"
                            src={fac.Picture__c}
                            initials="NA"
                            accept=".jpg, .jpeg, .png, .gif"
                            fallback-icon-name="standard:person_account"
                            alternative-text="image"
                            style="margin-right: 0.4rem"
                          ></lightning-avatar>
                        </template>
                        <template if:false={fac.Picture__c}>
                          <div class="material-avatar-fallback">
                            <i class="material-icons person">account_circle</i>
                          </div>
                        </template>
                      </span>
                      <span>
                        <table
                          style="
                            margin-bottom: 5px;
                            margin-top: 0.5rem;
                            table-layout: fixed;
                          "
                        >

                          <tr>
                            <td class="label-cell">&nbsp;Contact</td>
                            <td class="colon-cell">:</td>
                            <td class="value-cell">
                              <lightning-formatted-text
                                value={fac.Contact_Number__c}
                              ></lightning-formatted-text>
                            </td>
                          </tr>
                          <tr>
                            <td class="label-cell">&nbsp;Address</td>
                            <td class="colon-cell">:</td>
                            <td class="value-cell">
                              {fac.Address__Street__s},&nbsp;{fac.Address__City__s},&nbsp;{fac.Address__StateCode__s},&nbsp;{fac.Address__PostalCode__s}
                            </td>
                          </tr>
                          <tr>
                            <td class="label-cell">&nbsp;{facilityPreferredName}</td>
                            <td class="colon-cell">:</td>
                            <!-- <td class="value-cell">
                              <lightning-formatted-text
                                value={fac.Facility__r.Name}
                              ></lightning-formatted-text>
                            </td> -->
                            <td class="value-cell" title={fac.activeFaciltyDisplay}>
                               <lightning-formatted-text
                                value={fac.activeFaciltyDisplay}
                              ></lightning-formatted-text>
                             
                             </td>
                          </tr>

                          <tr>
                            <td class="label-cell">&nbsp;Status</td>
                            <td class="colon-cell">:</td>
                            <td
                              class="value-cell"
                              style="
                                display: flex;
                                align-items: center;
                                justify-content: space-between;
                              "
                            >
                              <div class="custom-toggle-wrapper">
                                <div
                                  class={fac.toggleTrackClass}
                                  onclick={handlefacStatus}
                                  data-id={fac.Id}
                                  data-name={fac.Status__c}
                                  data-client={fac.Name__c}
                                >
                                  <div
                                    class={fac.toggleKnobClass}
                                    data-id={fac.Id}
                                    data-name={fac.Status__c}
                                    data-client={fac.Name__c}
                                  ></div>
                                </div>
                                <span class={fac.toggleLabelClass}
                                  >{fac.toggleLabel}</span
                                >
                              </div>

                              <i
                                class="material-icons view-icon"
                                onclick={handleEditFacility}
                                data-id={fac.Id}
                                data-typeofservice={fac.Facility__r.Type_of_Service__c}
                                data-participanttype={fac.ParticipantType__c}
                                style="
                                  background: #0c78ba;
                                  color: white;
                                  width: 24px;
                                  height: 24px;
                                  display: flex;
                                  align-items: center;
                                  justify-content: center;
                                  border-radius: 20px;
                                  font-size: 16px;
                                  cursor: pointer;
                                  margin-right: 0.5rem;
                                "
                              >
                                visibility
                              </i>
                            </td>
                          </tr>
                        </table>
                      </span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </template>

        <template if:true={listFlag}>
          <template if:false={noRecordsFlag}>
            <div class="listview custom-scroll">
              <table
                class="slds-table slds-table_cell-buffer table"
                style="table-layout: fixed"
              >
                <thead class="table_th">
                  <tr>
                    <th class="slds-cell-wrap table_th">{participantPreferredName} Name</th>
                    <th class="slds-cell-wrap table_th" style="width: 10%">
                      Contact
                    </th>
                    <th class="slds-cell-wrap table_th">Address</th>
                    <th class="slds-cell-wrap table_th">{facilityPreferredName}</th>
                    <th class="slds-cell-wrap table_th" style="width: 6%">
                      Status
                    </th>
                    <th class="slds-cell-wrap table_th" style="width: 8%">
                      Action
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={recordsToDisplay} for:item="fac">
                    <tr key={fac.Id} class="tr1">
                      <td class="slds-cell-wrap table_td">{fac.Display_Nickname__c}</td>
                      <td class="slds-cell-wrap table_td">
                        {fac.Contact_Number__c}
                      </td>
                      <td class="slds-cell-wrap table_td">
                        {fac.Address__Street__s},&nbsp;{fac.Address__City__s},&nbsp;{fac.Address__StateCode__s},&nbsp;{fac.Address__PostalCode__s}
                      </td>
                      <td class="slds-cell-wrap table_td" title={fac.activeFaciltyDisplay}>
                        {fac.activeFaciltyDisplay}
                      </td>
                      <td class="slds-cell-wrap table_td">
                        {fac.Participant_Status__c}
                      </td>
                      <td class="slds-cell-wrap table_td">

                        <a
                          href="javascript:void(0)"
                          title="View"
                          onclick={handleEditFacility}
                          data-id={fac.Id}
                          data-typeofservice={fac.Facility__r.Type_of_Service__c}
                          data-participanttype={fac.ParticipantType__c}
                          style="text-decoration: none"
                        >
                          <i class="material-icons view-icon">visibility</i>
                        </a>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </template>

        <!-- if there is no facilities -->
        <template if:true={noRecordsFlag}>
          <div class="no-data">
            <p>No records found</p>
          </div>
        </template>
      </template>
    </div>

    <template if:false={noRecordsFlag}>
      <div if:true={isDesktop}>
        <div if:true={visible} class="fixed-pagination">
          <div
            class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
          >
            <!--PAGE NAVIGATION-->
            <div class="slds-align_absolute-center">
              <lightning-button
                disabled={bDisableFirst}
                icon-name="utility:jump_to_left"
                label="First"
                class="slds-p-horizontal_x-small"
                alternative-text="first page"
                onclick={firstPage}
              ></lightning-button>
              <lightning-button
                disabled={bDisableFirst}
                icon-name="utility:chevronleft"
                label="Previous"
                alternative-text="Previous"
                onclick={previousPage}
              ></lightning-button>
              &nbsp;
              <span class="slds-badge"
                >Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                &nbsp;&nbsp;Page(s)</span
              >
              &nbsp;
              <lightning-button
                disabled={bDisableLast}
                icon-name="utility:chevronright"
                label="Next"
                alternative-text="Next"
                onclick={nextPage}
                class="slds-p-horizontal_x-small"
                icon-position="right"
              ></lightning-button>
              <lightning-button
                disabled={bDisableLast}
                icon-name="utility:jump_to_right"
                label="Last"
                alternative-text="last page"
                onclick={lastPage}
                icon-position="right"
              ></lightning-button>
            </div>

            <!--TOTAL RECORDS-->
            <div class="slds-clearfix">
              <div class="slds-float_right">
                <span class="slds-badge"> Total Records: {totalRecords}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <template if:true={editclientflag}>
    <c-create-edit-client-lwc
      participant-id={clientid}
      onmyevent={handleChildEvent}
      faclist={finalListFacilities}
      individualflag={individualFlag} companyflag={companyFlag} ndiscreateflag={ndisCreateFlag}
    ></c-create-edit-client-lwc>
  </template>

  <template if:true={ParticpantRecordForm}>
    <div class="blur-overlay"></div>
    <div class="right-align fade-in" style="width: 70%">
      <div class={showParticipantFormClass}>
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <h3
            style="
              font-size: 140%;
              font-weight: bold;
              margin-bottom: 0.5%;
              margin-top: 1%;
              margin-left: 2%;
            "
          >
            Create Participant
          </h3>
    
        </div>
        <div class="container2">
          <lightning-record-edit-form
            object-api-name="Client__c"
            record-id={recordId}
            onsuccess={handleSuccess}
            onsubmit={handleSubmit}
            onerror={handleError}
          >
            <!-- <lightning-messages></lightning-messages> -->
            <div class="right-content custom-scroll">
<div class="slds-grid slds-wrap slds-gutters">

               <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                          <div class="floating-label">
                              <span class="label-text-drop"><span style="color:red">*</span>Type of Industry</span>
                                  <lightning-combobox value={selectedTypeOfIndustry} onchange={handleTypeOfIndustry} required="true" variant="label-hidden" options={typeOfIndustry}   
                              ></lightning-combobox>
                          </div>
              </div>

               <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                <span class="label-text-drop"><span style="color:red">*</span>Facility</span>
                                <div class="dropdown-container facility-dropdown" lwc:ref="dropdownContainer">
                                    <!-- Dropdown Button -->
                                    <button 
                                        type="button"
                                        class="dropdown-button1" 
                                        onclick={toggleFacilityDropdown}
                                        aria-expanded={facilityDropDownOpen}
                                        aria-haspopup="listbox"
                                    >
                                        <span class={selectedOptionClass}>
                                            {displayFaciltyDropDowntext}
                                        </span>
                                        <lightning-icon 
                                            icon-name={chevronIcon} 
                                            size="x-small" 
                                            class="chevron-icon">
                                        </lightning-icon>
                                    </button>
                                    <!-- Dropdown Menu -->
                                    <div if:true={facilityDropDownOpen} class="dropdown-menu">
                                        <!-- Options List -->
                                        <div class="options-list custom-scroll">
                                            <template for:each={multiFacilityDroDownList} for:item="option">
                                                <div key={option.id} class="option-item">
                                                    <button 
                                                        type="button"
                                                        class={option.buttonClass}
                                                        data-option-id={option.id}
                                                        disabled={option.isDisabled} title={option.label}>
                                                        {option.label}
                                                    </button>                                               
                                                    <div class="option-controls">
                                                        <!-- Status Badge -->
                                                        <!-- <span class={option.badgeClass}>
                                                            {option.statusText}
                                                        </span> -->
                                                        <!-- Toggle Switch -->
                                                        <div class="toggle-switch-container">
                                                            <lightning-input
                                                                type="toggle"
                                                                checked={option.checked}
                                                                data-option-id={option.id}
                                                                onchange={handleFacilityToggleActive}
                                                                variant="label-hidden"
                                                                class="toggle-input toggle_bar_right" message-toggle-active="" size="xx-small" 
                                                               message-toggle-inactive=""></lightning-input>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>                         
                            </div>
                </div>
              <template if:true={nonndisFlag}>
              <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                          <div class="floating-label">
                              <span class="label-text-drop"><span style="color:red">*</span>{participantPreferredName} Type</span>
                                  <lightning-combobox value={ParticipantType} onchange={handleParticipantType} required="true" variant="label-hidden" options={facilityTypeOptions}   
                              ></lightning-combobox>
                          </div>
              </div>
              </template>
      
</div>
              <template if:true={ndisCreateFlag}>
              <div class="container-box">
                <div
                  class="toggle-bar"
                  onclick={handleSectionToggle}
                  data-id="PartcipantDetails"
                  style="cursor: pointer"
                >
                  <span>{participantPreferredName}</span>
                  <span>{sectionIcons.PartcipantDetails}</span>
                </div>
                <div class="section-content" data-section="PartcipantDetails">
                  <template if:true={sectionFlags.PartcipantDetails}>
                    <div
                      class="slds-grid slds-wrap"
                      style="padding: 20px 0px 20px 0px"
                    >
                      <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small"
                      >
                        <div class="floating-label">
                          <span class="label-text-drop"
                            ><span style="color: red">*</span>First Name</span
                          >
                          <lightning-input-field
                            field-name="First_Name__c"
                            required
                            name="fname"
                            value={firstName}
                            onchange={handleNameChange}
                            variant="label-hidden"
                          ></lightning-input-field>
                        </div>
                      </div>
                      <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small"
                      >
                        <div class="floating-label">
                          <span class="label-text-drop"
                            ><span style="color: red">*</span>Last Name</span
                          >
                          <lightning-input-field
                            field-name="Last_Name__c"
                            name="lname"
                            value={lastName}
                            onchange={handleNameChange}
                            variant="label-hidden" required
                          ></lightning-input-field>
                        </div>
                      </div>
                         <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop">Nickname</span>
                            <lightning-input-field field-name="Nickname__c" variant="label-hidden"></lightning-input-field>
                        </div>
                      </div>

                      <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small"
                      >
                        <div class="floating-label">
                          <span class="label-text-drop"
                            ><span style="color: red">*</span>Gender</span
                          >
                          <lightning-input-field
                            field-name="Gendar__c"
                            variant="label-hidden" required
                          ></lightning-input-field>
                        </div>
                      </div>


                      <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small"
                      >
                        <div class={DateOfBirthClass}>
                          <span class="label-text-drop"
                            ><span style="color: red">*</span>Date of
                            Birth</span
                          >
                          <lightning-input-field
                            field-name="Date_Of_Birth__c"
                            variant="label-hidden"
                            onchange={handleErrorCss} required
                          ></lightning-input-field>
                        </div>
                      </div>



                      <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small"
                      >
                        <div class={ContactNumberClass}>
                          <span class="label-text-drop"
                            ><span style="color: red">*</span>Contact
                            Number</span
                          >
                          <lightning-input-field
                            field-name="Contact_Number__c"
                            required
                            variant="label-hidden" onchange={handleErrorCss}
                          ></lightning-input-field>
                        </div>
                      </div>
                      <!-- <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small"
                      >
                        <div class={emailClass}>
                          <span class="label-text-drop">Email ID</span>
                          <lightning-input-field
                            field-name="Email__c"
                            variant="label-hidden"
                            onchange={handleErrorCss}
                          ></lightning-input-field>
                        </div>
                      </div>     -->
                       <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small"
                      >
                        <div class={emailClass}>
                          <span class="label-text-drop"
                            ><span style="color: red">*</span>Email ID</span
                          >
                          <lightning-input-field
                            field-name="Email__c"
                            required
                            variant="label-hidden" onchange={handleErrorCss}
                          ></lightning-input-field>
                        </div>
                      </div>
                      
                      

                      <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4"
                        style="padding: 1% 1.3% 0% 1%"
                      >
                        <div class="floating-label">
                          <input
                            type="file"
                            onchange={onFileUpload}
                            accept=".jpg, .jpeg, .png, .gif"
                            name="uploadFile"
                            style="display: none"
                          />
                          <button
                            type="button"
                            onclick={triggerFileInput}
                            class="file-upload-button"
                            style="display: flex"
                          >
                            <i class="material-icons">upload</i> Upload Profile
                            Pic
                          </button>
                          <div class="slds-text-body_small">{fileName}</div>
                        </div>
                      </div>





                    <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">                             
                    <span style="display: flex; gap: 2%; align-items: center;">
                        <lightning-input-field field-name="Prefer_Nickname__c" variant="label-hidden" ></lightning-input-field>
                            <span>Prefer Nickname</span>
                    </span>  
                    </div>


                      
                      <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small"
                      >
                        <div>
                          <span
                            style="
                              display: flex;
                              gap: 2%;
                              align-items: center;
                            "
                          >
                            <lightning-input
                              type="toggle"
                              onchange={handleStatus}
                              checked={toggleValue}
                              message-toggle-active=""
                              size="xx-small"
                              message-toggle-inactive=""
                              variant="label-hidden"
                              style="transform: scale(0.8)"
                            >
                            </lightning-input>
                            <span>Status</span>
                          </span>
                        </div>
                      </div>
                

                      <div
                        class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small"
                      >
                        <template if:false={addStaffDisable}>
                          <a
                            href="javascript:void(0);"
                            onclick={handleAddMultiUsers}
                            disabled={addStaffDisable}
                            style="text-decoration: underline; color: #0070d2"
                          >
                            Preferred {staffPreferredName}
                          </a>
                        </template>
                        <template if:true={addStaffDisable}> </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
              <div class="container-box">
                <div
                  id="toggleAddress"
                  class="toggle-bar"
                  onclick={handleSectionToggle}
                  data-id="Addressdetails"
                  style="cursor: pointer"
                >
                  <span id="toggleAddressText">Address</span>
                  <span>{sectionIcons.Addressdetails}</span>
                </div>
                <div class="section-content" data-section="Addressdetails">
                  <template if:true={sectionFlags.Addressdetails}>
                    <div class="slds-grid slds-wrap">
                      <div class="slds-m-right_medium slds-m-left_medium">
                        <div style="color: red">{errorMessage}</div>
                        <lightning-input-address
                          address-label="Address"
                          street-label="Street"
                          city-label="Suburb"
                          country-label="Country"
                          province-label="State"
                          postal-code-label="Post Code"
                          street={street}

                            <span >{sectionIcons.OtherPreferences}</span>      
                        </div>
                        <div class="section-content" data-section="OtherPreferences">
                        <template if:true={sectionFlags.OtherPreferences}>
                            <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop">Gender</span> 
                                        <lightning-input-field field-name="Preferred_Gender__c" variant="label-hidden"></lightning-input-field>                                       
                                    </div>
                                </div>
                                
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                      <div class="floating-label custom-dropdown">
                                          <span class="label-text-drop">Nationality</span>
                                          <!-- Search input -->
                                          <lightning-input
                                              type="text"
                                              placeholder="Search Nationality"
                                              value={Nationality}
                                              onchange={handleSearchChange}
                                              onclick={toggleDrop}
                                              variant="label-hidden"
                                          ></lightning-input>

                                          <!-- Dropdown list -->
                                          <template if:true={showDropdown}>
                                              <ul
                                              class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid slds-dropdown_left custom-scroll"
                                              role="listbox"
                                              style="text-align: left; padding: 0 10px;"
                                              >
                                              <template for:each={filteredOptions} for:item="opt">
                                                  <li
                                                  key={opt.value}
                                                  class="slds-dropdown__item dropdown-option slds-p-around_x-small"
                                                  data-value={opt.value}
                                                  onclick={handleSelect}
                                                  role="option"
                                                  >
                                                  <span class="slds-truncate" style="font-size: 14px;">{opt.label}</span>
                                                  </li>
                                              </template>

                                              <template if:true={noResults}>
                                                  <li class="slds-dropdown__item">
                                                  <span class="slds-truncate slds-text-color_weak">
                                                      No results found
                                                  </span>
                                                  </li>
                                              </template>
                                              </ul>
                                          </template>
                                          </div>
                                </div>

                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                      <div class="floating-label2">
                                          <span class="label-text-drop">Languages</span>

                                          <div class="dropdown-container" lwc:ref="dropdownContainer">
                                              <button 
                                                  type="button"
                                                  class="dropdown-button1" 
                                                  onclick={handleDropdownToggle}
                                                  aria-expanded={isExpanded}
                                                  aria-haspopup="listbox"> 
                                                  <span class={selectedOptionClass}>{displayTextLang}</span>
                                                  <lightning-icon 
                                                      icon-name={chevronIcon} 
                                                      size="x-small" 
                                                      class="chevron-icon">
                                                  </lightning-icon>
                                              </button>

                                              <template if:true={isExpanded}>
                                                  <div class="dropdown-menu">
                                                      <div class="options-list custom-scroll">
                                                          <template for:each={Languages} for:item="value">
                                                              <div key={value.id} class="option-item">
                                                                  <button 
                                                                      type="button"
                                                                      class={value.buttonClass}
                                                                      data-option-id={value.id}>
                                                                      {value.label}
                                                                  </button>                                               
                                                                  <div class="option-controls">
                                                                      <div class="toggle-switch-container">
                                                                          <lightning-input 
                                                                              type="toggle" 
                                                                              onchange={handleLanguageToggle} 
                                                                              data-option-id={value.id} 
                                                                              checked={value.checked}
                                                                              class="toggle_bar_right"
                                                                              message-toggle-active="" size="xx-small" 
                                                                              message-toggle-inactive="">
                                                                          </lightning-input>
                                                                      </div>
                                                                  </div>
                                                              </div>
                                                          </template>
                                                      </div>
                                                  </div>
                                              </template>
                                          </div>  
                                      </div>
                                </div>
                                
                            </div>
                        </template>
                      </div>
                    </div>
                    
                    </template>
            </div>
            <div class="slds-align_absolute-center">
              <lightning-button
                label="Cancel"
                variant="brand-outline"
                onclick={handleeditClose}
                class="slds-m-around_small"
              ></lightning-button>
              <lightning-button
                label={buttonLabel}
                variant="brand"
                type="submit"
                class="slds-m-around_small"
                disabled={saveButtonDisable}
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </div>
      <div class={showPreferredStaffClass}>
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <!-- Left side: Staff Details -->
          <p
            style="
              font-weight: bold;
              font-size: 140%;
              margin: 0;
              margin-left: 2%;
              margin-top: 2%;
            "
          >
            Select Preferred Staff
          </p>

          <!-- Right side: Back button and image icon -->
          <div
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              margin-right: 2%;
              margin-top: 2%;
            "
          >
            <!-- <lightning-button label="Back" variant="brand" onclick={handleeditClose}></lightning-button>-->
          </div>
        </div>

        <div class="slds-scrollable_x custom-scroll slds-m-around_medium">
          <table
            class="role-assignment-grid slds-table slds-table_cell-buffer slds-table_bordered"
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th class="staff-name-column" scope="col">
                  <div class="floating-label">
                    <span class="label-text-drop">Search by Name</span>
                    <lightning-input
                      type="search"
                      variant="label-hidden"
                      value={searchStaff}
                      onchange={handleSearchStaffInput}
                    >
                    </lightning-input>
                  </div>
                </th>
                <template for:each={roles} for:item="role">
                  <th
                    key={role}
                    class="slds-text-align_center role-column"
                    scope="col"
                  >
                    <div class="slds-truncate" title={role}>{role}</div>
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template if:true={groupedStaffRoleData.length}>
                <template for:each={groupedStaffRoleData} for:item="staff">
                  <tr key={staff.Id} class={staff.rowClass}>
                    <td
                      class="slds-text-body_regular staff-name-cell"
                      data-label="Staff"
                    >
                      <div class="slds-truncate" title={staff.Name}>
                        {staff.Name}
                      </div>
                    </td>
                    <template for:each={staff.roleData} for:item="roleInfo">
                      <td
                        key={roleInfo.roleId}
                        class="slds-text-align_center role-cell slds-table_striped"
                        data-label={roleInfo.roleName}
                      >
                        <template if:true={roleInfo.hasRoleinstaff}>
                          <lightning-input
                            type="checkbox"
                            checked={roleInfo.hasRole}
                            data-staff-id={staff.Id}
                            data-role-id={roleInfo.roleId}
                            onchange={handleRoleToggle}
                            variant="label-hidden"
                            class="role-checkbox"
                          >
                          </lightning-input>
                        </template>
                        <template if:false={roleInfo.hasRoleinstaff}>
                          <span style="opacity: 0.3">—</span>
                        </template>
                      </td>
                    </template>
                  </tr>
                </template>
              </template>
              <template if:false={groupedStaffRoleData.length}>
                <tr>
                  <td colspan="100%">
                    <div class="slds-text-align_center slds-p-around_medium">
                      No staff found matching the search.
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="slds-align_absolute-center slds-m-around_small">
          <lightning-button
            label="Cancel"
            variant="brand-outline"
            onclick={handleeditClose1}
            class="slds-m-around_small"
          ></lightning-button>
          <lightning-button
            label="Save"
            variant="brand"
            onclick={handleUpdateStaff}
            class="slds-m-around_small"
            disabled={saveButtonDisable}
          ></lightning-button>
        </div>
      </div>
    </div>
    <!-- <template if:true={roleStaffFlag}> 
        </template> -->
  </template>
  <!-- </div> -->
  <template if:true={handleStatusFlag}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Please Confirm
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">
            <div>
              <h1>
                Are you sure you want to change status of the <br />
                {clientname}?
              </h1>
            </div>
            <div class="button-container slds-m-top_medium">
              <lightning-button
                label="No"
                variant="brand"
                onclick={handlestatusclose}
                class="slds-m-around_small"
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handlestatuschange}
                class="slds-m-around_small"
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- Multi-Upload Section -->
  <template if:true={isMultiClientUpload}>
     <c-tesseract-apps-participant-bulk-upload-lwc  onclienteventfrombulk={childevent}></c-tesseract-apps-participant-bulk-upload-lwc>    
  </template>
</template>
