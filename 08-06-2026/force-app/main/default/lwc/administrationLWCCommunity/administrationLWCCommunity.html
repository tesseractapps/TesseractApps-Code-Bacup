<template>
    <div>
        <div if:true={isDesktop}>
            <c-home-lwc></c-home-lwc>
                <div> 
                    <div class="slds-grid slds-var-m-left_x-large slds-var-m-right_x-large" style="margin-top:20px;">
                        
                        <div class={orgClass} data-name="Organisation" title="Organisation" alt="Organisation" name="Organisation" src={Organisation} onclick={navigateToFacilityPage}
                        style="cursor:pointer;text-align:center" > 
                        Organisation                                
                        </div>                        
                       
                           <div class={selectedClass} data-name="Facility" title="Facility" alt="Facility" name="Facility" src={facility} onclick={navigateToFacilityPage}
                                style="cursor:pointer;text-align:center" > 
                                Facilities                                
                            </div>                        
                            <template if:true={isExec}>      
                            <div class={clientClass} data-name="Clients" title="Clients" alt="Clients" name="Clients" src={client}
                            onclick={navigateToFacilityPage} style="cursor:pointer;text-align:center"> 
                                Participants
                            </div>
                            </template>   
                            <div class={staffClass} data-name="Staff" title="Staff" alt="Staff" name="Staff" src={employee}
                            onclick={navigateToFacilityPage}
                                style="cursor:pointer;text-align:center">
                                Staff
                            </div>
                            <div class={formClass} data-name="Form" title="Forms" alt="Customisable Forms" name="CustomisableForms" src={form}
                            onclick={navigateToFacilityPage}
                                style="cursor:pointer;text-align:center">
                                Forms
                            </div>
                        </div>
                    </div>                  

                    <div>
                        <template if:true={isOrgButton}>
                      <c-org-lwc-community ongetsearchvalue={handleSearchValue}></c-org-lwc-community>
                    </template>
                        <template if:true={isFacilityButton}>
                            <div style="margin-top:-9px;">
                                <c-facility-data-community
                                    selected-name={searchValue}></c-facility-data-community>
                            </div>
                        </template>
                        <template if:true={isClientButton}>
                            <div style="margin-top:-9px;">
                                <c-client-data-with-pagination
                                    selected-name={searchValue}></c-client-data-with-pagination>
                            </div>
                        </template>
                        <template if:true={isStaffButton}>
                            <div style="margin-top:-9px;">
                                <c-staff-data-community
                                    selected-name={searchValue} page-name={parentpagename}></c-staff-data-community>
                            </div>
                        </template>
                        <template if:true={isFormsButton}>
                            <div style="margin-top:-9px;">
                                <c-drag-drop-component
                                    ></c-drag-drop-component>
                            </div>
                        </template>
                       
                    </div>
                </div>            
        <!-- <c-footer-lwc></c-footer-lwc> -->
    </div>
</template>
