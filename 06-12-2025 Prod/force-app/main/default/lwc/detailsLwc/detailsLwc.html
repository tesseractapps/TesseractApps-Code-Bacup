<template>

  <div

      align-items: center;

    <!-- Left side: Staff Details -->

      <template if:false={isStaff}>
        <div
          class={detailsClass}
          data-name="details"
          onclick={handleClick}
          style="cursor: pointer; text-align: center"

          Details
        </div>
        <div
          class={fundClass}
          data-name="fundtranfer"
          onclick={handleClick}
          style="cursor: pointer; text-align: center">
          {FundsTracker}
        </div>
        <template if:true={isExec}>
          <div
            class={serviceClass}
            data-name="ServiceandSupportPlan"
            onclick={handleClick}
            style="cursor: pointer; text-align: center"
          >
            Services
          </div>
        </template>
      </template>
      <template if:true={ndisflag}>
        <div
          class={journelClass}
          data-name="ClientJournel"
          onclick={handleClick}
          style="cursor: pointer; text-align: center; font-color: white"

          Participant Journal
        </div>
      </template>

      <div
        class={attachClass}
        data-name="attachment"
        onclick={handleClick}
        style="cursor: pointer; text-align: center"
      >
        Attachments
      </div>
      <template if:true={ndisflag}>
        <div
          class={fundsClass}
          data-name="ParticipantForms"
          onclick={handleClick}
          style="cursor: pointer; text-align: center"
        >
          Forms
        </div>
      </template>
      <template if:true={isFeedback}>
        <div
          class={servClass}
          data-name="feedback"
          onclick={handleClick}
          style="cursor: pointer; text-align: center"
        >
          Feedback
        </div>
      </template>
      <template if:false={isStaff}>
        <div
          class={scheduleClass}
          data-name="schedule"
          onclick={handleClick}
          style="cursor: pointer; text-align: center"
        >
          Schedule
        </div>
      </template>
      <template if:true={ndisflag}>
        <div
          class={riskClass}
          data-name="risk"
          onclick={handleClick}
          style="cursor: pointer; text-align: center"
        >
          Risk Profile
        </div>
      </template>
            <template if:true={ndisflag}>

          Funds Tracker Edit

    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <template if:false={noimage}>
        <img
          src={image}
          alt="Info Icon"
          width="35px"
          height="35px"
          class="image"
          onclick={toggleHeader}
        />
      </template>
      <template if:true={noimage}>
        <div class="material-avatar-fallback" onclick={toggleHeader}>
          <i class="material-icons person">account_circle</i>
        </div>
      </template>
      <p style="font-weight: bold">{participant}</p>

        </lightning-icon>
      </template> -->
      <lightning-button
        label="Back"
        variant="brand"
        onclick={navigateToParticipant}
      ></lightning-button>
    </div>
  </div>

      <div>
        <div class="participantlayout">

            <div class="grid" key={clientData.Id}>
              <!-- First Grid Item -->
              <div class="grid-item">
                <template if:true={clientData.Picture__c}>
                  <img src={clientData.Picture__c} alt="Photo" />

                <template if:false={clientData.Picture__c}>
                  <div

              </div>

              <!-- Second Grid Item -->
              <div class="grid-item2" style="border-right-style: solid">
                <div class="status-row">

                    <b>Status:</b>

                  <p>
                    <b>{facilityPreferredName}:</b
                    >&nbsp;&nbsp;{clientData.Facility__r.Name}
                  </p>
                </div>
                <div class="status-row">
                  <p>
                    <b>Contact:</b>&nbsp;&nbsp;{clientData.Contact_Number__c}

                </div>
                <div class="status-row">
                  <p><b>Address:</b>&nbsp;&nbsp;{clientData.AddressData__c}</p>

                  <div class="text-container">
                    <p style="padding: 10px">
                      {clientData.Primay_Contact_First_Name__c}&nbsp;{clientData.Primay_Contact_Last_Name__c}<br />{clientData.Primary_Contact_Number__c}
                    </p>
                  </div>
                </div>
                <div class="grid-item4" style="margin-top: 5px">
                  <lightning-avatar
                    variant="circle"
                    src={secondary}
                    initials="S"
                    fallback-icon-name="standard:person_account"
                    alternative-text="Secondary Contact"
                  ></lightning-avatar>

                  <div class="text-container">
                    <p style="padding: 10px">
                      {clientData.Secondary_Contact_First_Name__c}&nbsp;{clientData.Secondary_Contact_Last_Name__c}<br />{clientData.Secondary_Contact_Number__c}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <template if:true={ClientJournel}>
    <div class="participantlayoutSnapshot custom-scroll">
      <div class="card1">
        <div class="section">
          <p><strong>Status:</strong> {status}</p>
          <p><strong>Risk Index:</strong> {riskIndex}</p>
        </div>

        <!-- Wrapper that defines scroll but styled to look like it's part of .card -->
        <div class="scroll-area">
          <div class="scroll-row">
            <div class="scroll-column">
              <p><strong>Medication:</strong></p>
              <lightning-formatted-rich-text
                value={medicationshtml}
              ></lightning-formatted-rich-text>
            </div>
            <div class="scroll-column">
              <p><strong>Allergies:</strong></p>
              <lightning-formatted-rich-text
                value={allergieshtml}
              ></lightning-formatted-rich-text>
            </div>
            <div class="scroll-column">
              <p><strong>Notes:</strong></p>
              <lightning-formatted-rich-text
                value={noteshtml}
              ></lightning-formatted-rich-text>
            </div>
            <lightning-icon
              icon-name="action:edit"
              alternative-text="edit"
              size="xx-small"
              title="edit"
              class="custom-icon-edit1"
              onclick={participantJournalmodelPop}
            ></lightning-icon>
          </div>
        </div>
      </div>

      <br />

      <template if:true={participantpopup}>
        <div class="blur-overlay"></div>
        <div class="right-align1 fade-in" style="width: 45%">
          <!-- Header -->

          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-top: 2%;
              margin-right: 2%;
              margin-left: 2%;
            "
          >
            <p style="font-weight: bold; font-size: 140%">
              {clientFullName} - Snapshot
            </p>
            <!-- <lightning-button label="Back" variant="brand" onclick={handleCloseparticipantpopup}></lightning-button> -->
          </div>

          <div class="container-box1">
            <div
              class="toggle-bar"
              onclick={handleSectionToggle}
              data-id="staffDetails1"
            >
              <span>Details</span>
            </div>
            <div class="section-content" data-section="staffDetails1">
              <div class="right-content custom-scroll">
                <template if:true={sectionFlags.staffDetails1}>
                  <div class="slds-grid slds-wrap">
                    <!-- Status Field -->
                    <div class="slds-size_1-of-1 slds-p-around_small">
                      <div class="slds-p-around_medium">
                        <div class="slds-form-element">
                          <label class="slds-form-element__label">
                            <span class="slds-text-title_bold">Status</span>
                          </label>
                          <div class="slds-form-element__control">
                            <div
                              class="slds-grid slds-gutters slds-align_absolute-center"
                            >
                              <!-- Available Checkbox -->
                              <div class="slds-col">
                                <lightning-input
                                  type="checkbox"
                                  label="Available"
                                  checked={isAvailable}
                                  onchange={handleAvailableChange}
                                >
                                </lightning-input>
                              </div>

                              <!-- Unavailable Checkbox -->
                              <div class="slds-col">
                                <lightning-input
                                  type="checkbox"
                                  label="Unavailable"
                                  checked={isUnavailable}
                                  onchange={handleUnavailableChange}
                                >
                                </lightning-input>
                              </div>

                              <!-- Unavailable Until Button -->
                              <div class="slds-col">
                                <div class="floating-label1">
                                  <span class="label-text-drop"
                                    ><span style="color: red">*</span
                                    >Unavailable Until</span
                                  >
                                  <lightning-input
                                    type="date"
                                    value={unavailableUntilDate}
                                    onchange={handleUnavailableUntilChange}
                                    disabled={disableUnavailabledate}
                                    variant="label-hidden"
                                    data-id="date"
                                    required
                                  >
                                  </lightning-input>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <!-- Risk Index Field -->
                    <div
                      class="slds-size_1-of-1"
                      style="padding-left: 4%; padding-right: 3%"
                    >
                      <div class="floating-label1">
                        <span class="label-text-drop">Risk Index</span>
                        <lightning-input
                          type="text"
                          variant="label-hidden"
                          onchange={handleField1Change}
                          value={riskIndex}
                          disabled
                        >
                        </lightning-input>
                      </div>
                    </div>

                    <!-- Medications Field -->
                    <div
                      class="slds-size_1-of-1"
                      style="padding-left: 2%; padding-right: 1%"
                    >
                      <div style="padding: 2%">
                        <span>Medications</span>
                        <lightning-textarea
                          name="medications"
                          variant="label-hidden"
                          onchange={handleAddShiftChange}
                          value={medications}
                          disabled={disablePostInsertButtons}
                        >
                        </lightning-textarea>
                      </div>
                    </div>

                    <!-- Allergies Field -->
                    <div
                      class="slds-size_1-of-1"
                      style="padding-left: 2%; padding-right: 1%"
                    >
                      <div style="padding: 2%">
                        <span>Allergies</span>
                        <lightning-textarea
                          name="allergies"
                          variant="label-hidden"
                          onchange={handleAddShiftChange}
                          disabled={disablePostInsertButtons}
                          value={allergies}
                        >
                        </lightning-textarea>
                      </div>
                    </div>

                    <!-- Notes Field -->
                    <div
                      class="slds-size_1-of-1"
                      style="padding-left: 2%; padding-right: 1%"
                    >
                      <div style="padding: 2%">
                        <span>Notes</span>
                        <lightning-textarea
                          name="notes"
                          variant="label-hidden"
                          onchange={handleAddShiftChange}
                          disabled={disablePostInsertButtons}
                          value={notes}
                        >
                        </lightning-textarea>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
            <!-- Save/Cancel Buttons -->
            <div
              class="slds-align_absolute-center slds-m-around_small"
              style="padding-bottom: 0.5rem"
            >
              <lightning-button
                label="Cancel"
                variant="brand-outline"
                onclick={handleCloseparticipantpopup}
              >
              </lightning-button>
              <lightning-button
                type="submit"
                variant="brand"
                onclick={handlesavebuttonforParticipantPopup}
                label="Update"
                disabled={isSaveDisabled}
                class="slds-m-left_small"
              >
              </lightning-button>
            </div>
          </div>
        </div>
      </template>

      <template if:true={isVisible}>
        <lightning-button
          variant="brand"
          label="Create Task"
          name="createTask"
          title="Create Task"
          onclick={handleClick}
          class=" slds-float_right slds-m-bottom_small"
        ></lightning-button>
      </template>

      <template if:true={isVisible}>
        <lightning-button
          variant="brand"
          label="Create Journal"
          name="addNew"
          title="Create Journal"
          onclick={handleClick}
          class="slds-m-right_x-small slds-float_right slds-m-bottom_medium"
        ></lightning-button
        ><br />
      </template>
      <br />
      <template if:false={noRecordsFlag}>
       <template if:true={iscreateNew}>
  <div class="history-table">
    <!-- Table header -->
    
    <template for:each={clientJournelList} for:item="journal">
      <!-- Outer card -->
  
      <div key={journal.Id} class="journal-card">
    <div class="history-header">
      <span class="description">Description</span>
      <span class="other">Created by</span>
      <span class="other">Type of Notes</span>
      <span class="other">Modified on</span>
    </div>
        <!-- Original Entry -->
        <div class="entry original-entry">
          <div class="entry-header">
          <span class="badge badge-green">Original Entry</span>
          <template if:true={journal.journaledit}>
           <lightning-button
                    icon-name="utility:edit"
                    variant="base"
                    title="Edit"
                    data-id={journal.Id}
                    data-name={journal.Description__c}
                    data-notestype={journal.Care_Notes__c}
                    onclick={handleEdit}
                    
                  >
              </lightning-button>
            </template>
            </div>
          <div class="history-row">
            <span class="description"> <lightning-formatted-rich-text value={journal.Description__c}></lightning-formatted-rich-text></span>
            <span class="other">{journal.CreatedBy.Name}</span>
            <span class="other">{journal.Care_Notes__c}</span>
            <span class="other">{journal.createdOnFormatted}</span>
          </div>
        </div>
        <!-- Corrections -->
        <template if:true={journal.corrections}>
          <template for:each={journal.corrections} for:item="corr">
            <div key={corr.label} class="entry correction-entry">
              <span class="badge badge-blue">{corr.label}</span>
              <span class="correction-meta">
                Updated on {corr.modifiedOn} by {corr.createdBy}
              </span>
              <span class="correction-reason">
                <i>Reason: {corr.reason}</i>
              </span>
              <div class="history-row">
                <span class="description"><lightning-formatted-rich-text value={corr.description}></lightning-formatted-rich-text></span>
                <span class="other">{corr.createdBy}</span>
                <span class="other">{corr.notes}</span>
                <span class="other">{corr.modifiedOn}</span>
              </div>
            </div>
          </template>
        </template>
      </div>
    </template>
  </div>
       </template>

      </template>
      <template if:true={noRecordsFlag}>
        <div class="no-data">
          <p>No records found</p>
        </div>
      </template>

      <template if:true={addNew}>
        <div class="blur-overlay"></div>
        <div
          class="right-align-create-journal"
          style="width: 50%; padding: 14px"
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              flex-wrap: nowrap;
              align-items: center;
              flex-direction: row;
              margin-bottom: 10px;
            "
          >
            <p
              style="
                font-weight: bold;
                font-size: 140%;
                margin: 0;
                padding: 2% 0 0 2%;
              "
            >
               {Journal}
            </p>
            <div style="display: flex; align-items: center; gap: 10px">
              <!-- <lightning-button label="Back" variant="brand" onclick={closeAddJournel}></lightning-button>                     -->
            </div>
          </div>
          <div class="right-content-create-journal custom-scroll">
            <div
              class="container-new-overlap custom-scroll"
              style="padding: 1%"
            >
              <div
                class="slds-grid slds-gutters slds-wrap slds-p-around_medium"
              >
                <!-- Notes Type -->
                 <template if:false={correctionflag}>
                <div class="slds-col slds-size_1-of-2">
                  <div class="floating-label">
                    <span class="label-text-drop"
                      ><span style="color: red">*</span>Notes Type</span
                    >
                    <lightning-combobox
                      name="journelProgress"
                      value={jNoteType}
                      disabled={notesflag}
                      placeholder="Select Notes Type"
                      options={options}
                      onchange={handleChange}
                      required="true"
                      variant="label-hidden"
                      data-id="Note"
                    >
                    </lightning-combobox>
                  </div>
                </div>
                </template>
                 <template if:true={correctionflag}>
                 <div class="slds-col slds-size_1-of-2">
                  <div class="floating-label" style="height:62px;">
                    <span class="label-text-drop"
                      ><span style="color: red">*</span>Reason for Correction</span
                    >
                    <lightning-textarea
                      name="reason"
                      value={reason}
                      onchange={handleReasonChange}
                      placeholder="Enter the reason for correction..."
                      maxlength="1000"
                      required="true"
                      variant="label-hidden"
                      data-id="reason"
                    >
                    </lightning-textarea>
                  </div>
                </div>
                </template>


 
  

                <!-- Description -->
                <div class="slds-col slds-size_1-of-2">
                  <div class="floating-label" style="height:auto">
                    <span class="label-text-drop"
                      ><span style="color: red">*</span>Description</span
                    >
                    <lightning-input-rich-text
                      required="true"
                      name="journeldescription"
                      value={description}
                      onchange={onchangeJournel}
                      onfocus={handleFocus}
                      placeholder="Enter your text here or start speaking..."
                      variant="label-hidden"
                      data-id="desc"
                      maxlength="3000"
                    >
                    </lightning-input-rich-text>
                  </div>
                   <div class="slds-p-top_medium">
                    <lightning-icon
                      icon-name={iconName}
                      alternative-text={altText}
                      onclick={toggleListening}
                      if:true={showMuteIcon}
                      class="slds-button slds-button_icon mute-icon"
                      style="margin-left: 5px"
                      size="small"
                    >
                    </lightning-icon>
                    <lightning-icon
                      icon-name="utility:clear"
                      alternative-text="Clear Text"
                      onclick={clearText}
                      if:true={showClearIcon}
                      class="slds-button slds-button_icon clear-icon"
                      size="small"
                    >
                    </lightning-icon>
                  </div> 
                </div>
              </div>

              <!-- Buttons -->
            </div>
          </div>
          <div class="slds-align_absolute-center" style="height: 3rem">
            <lightning-button
              slot="footer"
              label="Cancel"
              class="slds-m-right_medium"
              variant="brand-outline"
              onclick={closeAddJournel}
            >
            </lightning-button>
            <lightning-button
              slot="footer"
              label={buttonlabel}
              class="slds-m-right_small"
              variant="brand"
              onclick={handleSave}
            >
            </lightning-button>
          </div>
        </div>
      </template>

      <template if:true={createTask}>
        <div class="blur-overlay"></div>
        <div class="right-align-create-task" style="width: 40%">
          <div>
            <!-- <lightning-button label="Back" onclick={closeTask} variant="brand"
                                class="slds-m-left_small" style="position: absolute;right: 3%;top:3%;"></lightning-button> -->
            <c-task-create></c-task-create>
            <div
              class="slds-grid slds-align_absolute-center"
              style="padding-bottom: 10px"
            >
              <lightning-button
                slot="footer"
                label="Cancel"
                onclick={closeTask}
                variant="brand-outline"
              ></lightning-button>
              <lightning-button
                slot="footer"
                label="Save"
                onclick={createTaskParent}
                variant="brand"
                class="slds-m-left_small"
              ></lightning-button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- <template if:true={assignClient}>
