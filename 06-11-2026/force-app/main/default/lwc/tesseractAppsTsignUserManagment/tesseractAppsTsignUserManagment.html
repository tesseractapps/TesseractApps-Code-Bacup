<template>
    <div class="main-container">
        <!-- Full-page spinner overlay -->
        <!-- <template if:true={isLoading}>
            <div class="slds-spinner_container custom-spinner-container">
                <div role="status" class="slds-spinner slds-spinner_large slds-is-relative">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </template> -->
        <template if:true={isLoading}>
            <div class="overlay-logo"></div>
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
                <p class="progress-text">Loading<br />Please Wait...</p>
            </div>
        </template>        

        <div class="slds-grow slds-grid slds-grid_vertical" style="min-height: 0;">
            <header class="header">
                <div class="search-section">
                     <lightning-input
                            type="Search"
                            variant="label-hidden"
                            placeholder={placeholderText}
                            value={searchStaff}
                            onchange={handleSearchStaffInput}
                        ></lightning-input>
                    <!-- <div class="floating-label">
                        <span class="label-text-drop">Search</span>
                        <lightning-input
                            type="Search"
                            variant="label-hidden"
                            placeholder={placeholderText}
                            value={searchStaff}
                            onchange={handleSearchStaffInput}
                        ></lightning-input>
                    </div> -->
                </div>

                  <template if:true={teamSizeLimit}>
                    <div class="slds-m-right_medium slds-align-middle">
                        <span class={teamSizeBadgeClass}>
                             {activeUserCount} of {teamSizeLimit} Users Created
                        </span>
                    </div>
                </template>
            </header>

            <div class="content-wrapper slds-p-around_medium">
                <!-- Scrollable Table Section -->
                <div class="table-container userTableHeight custom-scroll">
                    <template if:false={noRecordsFlag}>
                        <table class="slds-table slds-table_cell-buffer fixed-table">
                            <thead>
                                <tr>
                                    <th class="slds-text-align_left sortable-header">
                                        Profile Pic 
                                    </th>
                                    <th class="slds-text-align_left sortable-header"
                                        data-field="nickName"
                                        onclick={handleSort}>
                                        <div class="sort-header-inner">
                                            <span class="sort-label">
                                                Name
                                            </span>
                                            <span class="sort-arrow"
                                                data-arrow={sortIcons.nickName}>
                                            </span>
                                        </div>
                                    </th>
                                    <th class="slds-text-align_left sortable-header"
                                        data-field="userEmail"
                                        onclick={handleSort}>
                                        <div class="sort-header-inner">
                                            <span class="sort-label">Email Address</span>
                                            <span class="sort-arrow"
                                                data-arrow={sortIcons.userEmail}></span>
                                        </div>
                                    </th>
                                    <th class="slds-text-align_left sortable-header"
                                        data-field="userPhone"
                                        onclick={handleSort}>
                                        <div class="sort-header-inner">
                                            <span class="sort-label">Contact Number</span>
                                            <span class="sort-arrow"
                                                data-arrow={sortIcons.userPhone}></span>
                                        </div>
                                    </th>
                                    <th class="slds-text-align_left">Access Level</th>
                                    <th class="slds-text-align_left">{facilityPreferredName} Level</th>
                                    <th class="slds-text-align_left">Reset Password</th>
                                    <th class="slds-text-align_left sortable-header"
                                        data-field="createdDate"
                                        onclick={handleSort}>
                                        <div class="sort-header-inner">
                                            <span class="sort-label">Created Date</span>
                                            <span class="sort-arrow" data-arrow={sortIcons.createdDate}></span>
                                        </div>
                                    </th>
                                    <th class="slds-text-align_left sortable-header"
                                        data-field="userStatus"
                                        onclick={handleSort}>
                                        <div class="sort-header-inner">
                                            <span class="sort-label">Status</span>
                                            <span class="sort-arrow"
                                                data-arrow={sortIcons.userStatus}></span>
                                        </div>
                                    </th>
                                    <th class="slds-text-align_left" style="width: 7%;">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={paginatedData} for:item="user">
                                    <tr key={user.userId} class="tr1">
                                        <td>
                                            <!-- Initials sit underneath; the photo covers them and
                                                 is hidden if it fails to load -->
                                            <span class="profile-thumb profile-thumb_placeholder">
                                                {user.initials}
                                                <template if:true={user.profilePicUrl}>
                                                    <img src={user.profilePicUrl}
                                                        alt={user.nickName}
                                                        class="profile-thumb_img"
                                                        onerror={handleRowImgError}/>
                                                </template>
                                            </span>
                                        </td>
                                        <td title={user.nickName}>{user.nickName}</td>
                                        <td title={user.userEmail}>{user.userEmail}</td>
                                        <td>{user.userPhone}</td>
                                        <td>
                                            <a href="javascript:void(0);" class="slds-text-link"
                                                onclick={showGrantAccess} data-id={user.userId}>Grant Access</a>
                                        </td>
                                       <td>
                                        <template if:true={user.isFacilityAccess}>
                                            <p>{facilityPreferredName} Access</p>
                                        </template>
                                        <template if:false={user.isFacilityAccess}>
                                            <!-- Only show the link for Manager / Org Admin -->
                                            <template if:true={user.canManageFacility}>
                                                <a href="javascript:void(0);" class="slds-text-link"
                                                onclick={facilityGrantAccess}
                                                data-id={user.staffId}>
                                                {facilityPreferredName} Access
                                                </a>
                                            </template>
                                            <template if:false={user.canManageFacility}>
                                                <p>{facilityPreferredName} Access</p>
                                            </template>
                                        </template>
                                    </td>
                                        <td>
                                            <template if:true={user.isActive}>
                                                <a href="javascript:void(0);" class="slds-text-link"
                                                    onclick={resetpasswordlink} data-id={user.userId}>Reset Password</a>
                                            </template>
                                            <template if:false={user.isActive}>
                                                <p>Reset Password </p>
                                            </template>
                                        </td>
                                        <td>{user.createdDate}</td>
                                        <td>
                                            <span class={user.statusClass}>{user.userStatus}</span>
                                        </td>
                                        <td>
                                            <a href="javascript:void(0)" data-id={user.staffId} 
                                                onclick={handleActionClick} title="Edit"
                                                style="text-decoration: none;">
                                                <i class="material-icons edit-icon"
                                                    data-id={user.staffId}>edit_document</i>
                                            </a>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template if:true={noRecordsFlag}>
                        <div class="no-data">
                            <p>No records found</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Pagination Section -->
        <template if:false={noRecordsFlag}>
            <div class="pagination-container slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination">
                <div class="slds-list_inline">
                    <span style="margin-right: 5px; margin-top: 5px;">Page Size:</span>
                    <div class="slds-select_container">
                        <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                            <template for:each={pageSizeOptions} for:item="option">
                                <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="slds-align_absolute-center">
                    <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
                        class="slds-p-horizontal_x-small" alternative-text="first page"
                        onclick={firstPage}></lightning-button>
                    <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
                        alternative-text="Previous" onclick={previousPage}></lightning-button>
                    &nbsp;
                    <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                    &nbsp;
                    <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                        alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small"
                        icon-position="right"></lightning-button>
                    <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                        alternative-text="last page" onclick={lastPage}
                        icon-position="right"></lightning-button>
                </div>

                <div class="slds-clearfix">
                    <div class="slds-float_right ">
                        <span class="slds-badge"> Total Records: {totalRecords}</span>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- ===================== POPUPS (NDIS "Edit Staff" style) ===================== -->

    <!-- Reset Password -->
    <template if:true={resetPasswordModal}>
        <section aria-modal="true" class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
            <div class="slds-modal__container confirmModal">
                <header class="slds-modal__header headercustom modal-header-custom">
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom title-center">Please Confirm</h2>
                    <button type="button" class="slds-button slds-button_icon close-btn" title="Close"
                        onclick={handleCloseresetPasswordModal} disabled={isResettingPassword}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="confirm-text">
                        Are you sure you want to reset the password for this user: <strong>{userEmail}</strong>?
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="No" onclick={handleCloseresetPasswordModal}
                        disabled={isResettingPassword}></lightning-button>
                    <lightning-button label="Yes" variant="brand" onclick={handleConfirmResetPassword}
                        disabled={isResettingPassword} class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Edit User (NDIS "Edit Staff" style popup) -->
    <template if:true={editButtonModule}>
        <section aria-modal="true" class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
            <div class="slds-modal__container createEditModal">

                <header class="slds-modal__header headercustom modal-header-custom">
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom title-center">User Details</h2>
                    <button type="button" class="slds-button slds-button_icon close-btn" title="Close" onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                </header>

                <div class="slds-modal__content slds-p-around_medium custom-scroll modal-body">
                    <template if:true={sectionFlags.staffDetails1}>
                        <h3 class="slds-text-title_bold modal-section-title">User Details</h3>
                        <div class="slds-grid slds-wrap">
                            <!-- First Name -->
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span class="required-mark">*</span>First Name</span>
                                    <lightning-input type="text" name="FirstName" variant="label-hidden"
                                        value={formData.user.FirstName} onchange={handleUserFirstNameChange} required>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Last Name -->
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span class="required-mark">*</span>Last Name</span>
                                    <lightning-input type="text" name="LastName" variant="label-hidden"
                                        value={formData.user.LastName} onchange={handleUserLastNameChange} required>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Username (Disabled) -->
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop">Username</span>
                                    <lightning-input type="text" name="Username" variant="label-hidden"
                                        value={formData.user.Username} disabled>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Phone Number -->
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span class="required-mark">*</span>Phone Number</span>
                                    <lightning-input
                                        type="tel"
                                        name="PhoneNumber"
                                        variant="label-hidden"
                                        value={formData.user.Phone}
                                        onchange={handleUserPhoneChange}
                                        required>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Facility -->
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop">Facility</span>
                                    <lightning-combobox
                                        label="Facility"
                                        variant="label-hidden"
                                        value={Facilityname}
                                        options={filteredFacilityValues}
                                        onchange={handleFacilityChange}
                                        required>
                                    </lightning-combobox>
                                </div>
                            </div>

                            <!-- User Type -->
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span class="required-mark">*</span>User Type</span>
                                    <lightning-combobox
                                        label="User Type"
                                        variant="label-hidden"
                                        value={usertypename}
                                        options={filteredUserTypeValues}
                                        onchange={handleUserTypeChange}
                                        disabled={isUserTypeDisabled}
                                        required>
                                    </lightning-combobox>
                                </div>
                            </div>

                            <!-- <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="status-field">
                                    <lightning-input type="toggle" checked={formData.staff.Status__c} variant="label-hidden"
                                        message-toggle-active="" message-toggle-inactive=""
                                        onchange={handleUserStatusChange}>
                                    </lightning-input>
                                    <span>Status</span>
                                </div>
                            </div>

                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                 <c-t-signaws-batch-lwc
                                        is-used-for-profile-pic 
                                        module-name="MyProfilePic"
                                        organisation-id={orgDetails.Id}
                                        onuploadsuccess={handleUplodadProfilePic}
                                    >
                                </c-t-signaws-batch-lwc> 
                             </div> -->
                            <!-- Status + Profile picture share one column - no empty gap between them,
                                 the button is level with the other inputs -->
                            <div class="slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_small">
                                <div class="status-photo-row">
                                    <!-- Status (toggle, as in NDIS) -->
                                    <div class="status-field">
                                        <lightning-input type="toggle" checked={formData.staff.Status__c} variant="label-hidden"
                                            message-toggle-active="" message-toggle-inactive=""
                                            onchange={handleUserStatusChange}>
                                        </lightning-input>
                                        <span>Status</span>
                                    </div>

                                    <!-- Profile picture -->
                                    <div class="profile-pic-field">
                                        <c-t-signaws-batch-lwc
                                            is-used-for-profile-pic
                                            module-name="MyProfilePic"
                                            organisation-id={orgDetails.Id}
                                            onuploadsuccess={handleUplodadProfilePic}>
                                        </c-t-signaws-batch-lwc>
                                    </div>
                                </div>
                            </div>




                                <!-- Profile picture -->
                               
                        <!--   <input type="file" accept="image/png, image/jpeg, image/jpg" onchange={handleFileSelect} style="display:none;" class="hidden-profile-input" />
                                <lightning-button
                                    label="Change Profile Picture"
                                    icon-name="utility:upload"
                                    onclick={triggerFileInput}
                                    disabled={isUploading}
                                    stretch
                                    class="full-width-button">
                                </lightning-button>
                                <template if:true={isattachError}>
                                    <p class="form-error">File Size Can not exceed 50MB</p>
                                </template> -->
                            
                        <!--     <template if:true={isFileExpand}>
                                <div class="slds-size_1-of-1 slds-p-around_small">
                                    <c-document-office-service
                                        record-id={selectedRecordId}
                                        module-path-from-parent="ticket"
                                        allow-multiple="false"
                                        onuploadcomplete={handleAwsUploadComplete}
                                        onfiledeleted={handleFileDeleted}>
                                    </c-document-office-service>
                                </div>
                            </template> -->
                        </div>

                        <!-- Address (the address component shows its own "Address" label) -->
                        <div class="slds-grid slds-wrap slds-m-top_x-small">
                            <div class="slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_small">
                                <c-t-sign-address-selector
                                    address={childAddress}
                                    onaddresschange={addressInputChange}>
                                </c-t-sign-address-selector>
                            </div>
                        </div>
                    </template>

                    <template if:true={isLoading}>
                        <div class="slds-spinner_container custom-spinner-container">
                            <div role="status" class="slds-spinner slds-spinner_large slds-is-relative">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                            </div>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleClose}></lightning-button>
                    <lightning-button variant="brand" onclick={handlesavebutton} label="Update" class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Grant Access (modules) -->
    <template if:true={grantAccessModal}>
        <section aria-modal="true" class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
            <div class="slds-modal__container confirmModal">
                <header class="slds-modal__header headercustom modal-header-custom">
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom title-center">User Details</h2>
                    <button type="button" class="slds-button slds-button_icon close-btn" title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                </header>

               <div class="slds-modal__content slds-p-around_medium custom-scroll slds-is-relative">
                        
                        <!-- Centered Text -->
                        <p class="slds-m-bottom_none slds-text-align_center">
                            <strong>User Type:</strong> {modalData.userType}
                        </p>
                        
                        <h3 class="slds-text-title_bold slds-text-align_center slds-m-top_x-small slds-m-bottom_medium">
                            All Modules
                        </h3>

                        <!-- Centered Checkbox Container -->
                        <div class="slds-grid slds-grid_align-center">
                            <!-- 
                                1. slds-size_1-of-3 restricts the width so the checkboxes shrink-wrap.
                                2. slds-text-align_left aligns the labels correctly.
                                3. No flexbox/inline styles needed.
                            -->
                            <div class="slds-text-align_left">
                                <template for:each={modulesChecked} for:item="module">
                                    <!-- Native SLDS spacing between each checkbox -->
                                    <div key={module.name} class="slds-p-vertical_xx-small">
                                        <lightning-input
                                            type="checkbox"
                                            label={module.name}
                                            name={module.name}
                                            value={module.name}
                                            checked={module.checked}
                                            onchange={handleCheckboxChange}>
                                        </lightning-input>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" onclick={handleConfirmReset} class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Facility Access -->
    <template if:true={facilityAccessModal}>
        <section aria-modal="true" class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
            <div class="slds-modal__container confirmModal accessModal">
                <header class="slds-modal__header headercustom modal-header-custom">
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom title-center">{facilityPreferredName} Access</h2>
                    <button type="button" class="slds-button slds-button_icon close-btn" title="Close" onclick={handleCloseFacilityModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                </header>

               <div class="slds-modal__content slds-p-around_medium custom-scroll">
                        <!-- Centered Text -->
                        <p class="slds-m-bottom_medium slds-text-align_center">
                            Select the {facilityPreferredName} / facilities this user should have access to:
                        </p>

                        <template if:false={isFacilityLoading}>
                            <template if:true={hasFacilityOptions}>
                                
                                <!-- Centered Grid Container -->
                                <div class="slds-grid slds-grid_align-center">
                                    <!-- 
                                        1. slds-size_1-of-2 restricts the width so the list shrinks neatly.
                                        2. slds-text-align_left keeps the labels aligned properly.
                                        3. custom-scroll keeps your existing scroll logic intact.
                                    -->
                                    <div class="checkbox-list checkbox-list_scroll custom-scroll  slds-text-align_left">
                                        <template for:each={facilityOptions} for:item="fac">
                                            <div key={fac.id} class="slds-p-vertical_xx-small">
                                                <lightning-input
                                                    type="checkbox"
                                                    label={fac.name}
                                                    name={fac.id}
                                                    value={fac.id}
                                                    checked={fac.checked}
                                                    onchange={handleFacilityCheckboxChange}>
                                                </lightning-input>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                
                            </template>
                            
                            <template if:false={hasFacilityOptions}>
                                <p class="slds-text-color_weak slds-text-align_center slds-m-top_small">
                                    No facilities available.
                                </p>
                            </template>
                        </template>
                    </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseFacilityModal}
                        disabled={isSavingFacility}></lightning-button>
                    <lightning-button label="Save" variant="brand" onclick={handleSaveFacilityAccess}
                        disabled={isSavingFacility} class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
