<template>
  <!-- <div if:true={isHome} class="att-shell"> -->
  <div class={shellClass}>

  <!-- Top bar -->
  <div class="att-topbar slds-grid slds-grid_vertical-align-center">
    <div class="att-tab-title">{pageTitle}</div>

    <template if:true={canManage}>
      <div class="slds-col_bump-left slds-m-right_small">
        <lightning-button
            class="att-archive-toggle-button"
            label={archiveToggleLabel}
            icon-name={archiveIcon}
            icon-position="right"
            onclick={handleToggleArchive}>
        </lightning-button>
      </div>
    </template>
    <template if:false={canManage}>
      <div class="slds-col_bump-left"></div>
    </template>

    <template if:false={showArchived}>
      <div class="slds-m-right_small">
        <lightning-button
            variant="brand"
            label="Add Attachment"
            icon-name="utility:add"
            icon-position="right"
            onclick={handleAttachment}>
        </lightning-button>
      </div>
    </template>
  </div>

    <div class="slds-grid slds-gutters_none main-container participantlayout att-content">

    <!-- ============ LEFT PANEL: FOLDER TREE ============ -->
    <div class="slds-col left-panel custom-scroll">

      <template if:true={canManage}>
        <div class="new-folder-container slds-m-bottom_small">
          <button class="new-folder-btn" onclick={openCreateFolderModal}>
            <span>+ New Folder</span>
          </button>
        </div>
      </template>

      <div class="leftlayout custom-scroll">
        <!-- All Documents Root -->
        <div class={allFolderClass} data-id="ALL" onclick={handleFolderClick}
             style="padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;">
          <span class="material-icons folder-icon" style="font-size:18px;color:#6b6f76;">folder</span>
          <span style="font-size:13px;">All Documents</span>
        </div>

        <template for:each={folderTree} for:item="folder">
         <c-t-sign-folder
              key={folder.Id}
              node={folder}
              level="0"
              is-staff={canManage}
              selected-id={currentFolderId}
              onfolderselect={handleFolderSelect}
              oneditfolder={handleFolderEdit}
              onpermissions={handleFolderPermissions}
              onrefreshfolders={loadFolders}>
          </c-t-sign-folder>
        </template>
      </div>
    </div>

    <!-- ============ RIGHT PANEL (contact-list style) ============ -->
    <div class="slds-col att-right">

      <div class="att-body slds-p-around_medium">

        <!-- Search + total -->
        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
          <div class="att-folder-label" title={folderLabel}>Folder: {folderLabel}</div>
          <div class="att-search-box">
            <lightning-input
                type="search"
                variant="label-hidden"
                placeholder="Search documents"
                value={searchKey}
                onkeyup={handleSearch}
                onchange={handleSearch}>
            </lightning-input>
          </div>

          <!-- <div class="slds-col_bump-left att-total">
            Total Records : <b>{totalRecords}</b>
          </div> -->
        </div>

        <!-- Table -->
        <div class="att-table-container">

          <template if:false={noRecordsFlag}>

            <!-- DOCUMENTS VIEW -->
            <template if:false={showArchived}>
              <div class="att-header-wrapper">
                <table class="att-table att-docs-table">
                  <thead>
                    <tr>
                      <th class="att-th att-sortable" data-table="attachments" data-field="Name" onclick={handleSort} title="Name">
                        <div class="att-sort-inner"><span>Name</span><span class="att-sort-arrow" data-arrow={tableSortState.attachments.icons.Name}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="attachments" data-field="type" onclick={handleSort} title="Type">
                        <div class="att-sort-inner"><span>Type</span><span class="att-sort-arrow" data-arrow={tableSortState.attachments.icons.type}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="attachments" data-field="comment" onclick={handleSort} title="Comments">
                        <div class="att-sort-inner"><span>Comments</span><span class="att-sort-arrow" data-arrow={tableSortState.attachments.icons.comment}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="attachments" data-field="UserName" onclick={handleSort} title="Uploaded By">
                        <div class="att-sort-inner"><span>Uploaded By</span><span class="att-sort-arrow" data-arrow={tableSortState.attachments.icons.UserName}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="attachments" data-field="lastModifiedUser" onclick={handleSort} title="Last Updated User">
                        <div class="att-sort-inner"><span>Last Updated User</span><span class="att-sort-arrow" data-arrow={tableSortState.attachments.icons.lastModifiedUser}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="attachments" data-field="lastModifiedDate" onclick={handleSort} title="Last Updated Date">
                        <div class="att-sort-inner"><span>Last Updated Date</span><span class="att-sort-arrow" data-arrow={tableSortState.attachments.icons.lastModifiedDate}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="attachments" data-field="Date" onclick={handleSort} title="Expiry Date">
                        <div class="att-sort-inner"><span>Expiry Date</span><span class="att-sort-arrow" data-arrow={tableSortState.attachments.icons.Date}></span></div>
                      </th>
                      <th class="att-th att-center" title="Actions">Actions</th>
                    </tr>
                  </thead>
                </table>
              </div>

              <div class="att-body-scroll custom-scroll">
                <table class="att-table att-docs-table">
                  <tbody>
                    <template for:each={tableRows} for:item="attachment">
                      <tr key={attachment.Id}>
                        <td class="att-td" title={attachment.Name}>{attachment.Name}</td>
                        <td class="att-td" title={attachment.type}>{attachment.type}</td>
                        <td class="att-td" title={attachment.comment}>{attachment.comment}</td>
                        <td class="att-td" title={attachment.UserName}>{attachment.UserName}</td>
                        <td class="att-td" title={attachment.lastModifiedUser}>{attachment.lastModifiedUser}</td>
                        <td class="att-td" title={attachment.lastModifiedDate}>{attachment.lastModifiedDate}</td>
                        <td class="att-td" title={attachment.Date}>{attachment.Date}</td>

                        <td class="att-td att-center">
                          <!-- VIEW -->
                          <a href={attachment.AmazonURL} data-id={attachment.Id} data-url={attachment.AmazonURL}
                            onclick={handleView} title="View Attachment" class="att-action-link">
                            <i class="material-icons att-action-icon">visibility</i>
                          </a>

                          <template if:true={canManage}>
                            <!-- EMAIL -->
                            <a href="javascript:void(0)" data-id={attachment.Id}
                              onclick={handleEmailAction} title="Send Email" class="att-action-link">
                              <i class="material-icons att-action-icon">outgoing_mail</i>
                            </a>

                            <!-- EMAIL HISTORY -->
                            <a href="javascript:void(0)" data-id={attachment.Id}
                              onclick={handleViewEmailHistory} title="Email History" class="att-action-link">
                              <i class="material-icons att-action-icon">history</i>
                            </a>
                          </template>

                          <!-- owner, or Org Admin on a Manager's doc -->
                          <template if:true={attachment.canModifyRow}>
                            <a href="javascript:void(0)" data-id={attachment.Id} data-key={attachment.Key}
                               data-type={attachment.type} data-name={attachment.Name}
                               onclick={handleEdit} title="Edit" class="att-action-link">
                              <i class="material-icons att-action-icon">edit</i>
                            </a>

                            <template if:true={attachment.canShare}>
                              <template if:false={isIndividualAccount}>
                                <a href="javascript:void(0)" data-id={attachment.Id}
                                  onclick={handleShare} title="Permissions" class="att-action-link">
                                  <i class="material-icons att-action-icon">passkey</i>
                                </a>
                              </template>
                            </template>

                            <a href="javascript:void(0)" data-id={attachment.Id}
                               onclick={handleArchive} title="Archive" class="att-action-link">
                              <i class="material-icons att-action-icon">archive</i>
                            </a>

                            <a href="javascript:void(0)" data-id={attachment.Id}
                               onclick={handleDelete} title="Delete" class="att-action-link">
                              <i class="material-icons att-action-icon">delete</i>
                            </a>
                          </template>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <!-- ARCHIVED VIEW -->
            <template if:true={showArchived}>
              <div class="att-header-wrapper">
                <table class="att-table att-archived-table">
                  <thead>
                    <tr>
                      <th class="att-th att-sortable" data-table="archived" data-field="Name" onclick={handleSort} title="Name">
                        <div class="att-sort-inner"><span>Name</span><span class="att-sort-arrow" data-arrow={tableSortState.archived.icons.Name}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="archived" data-field="Type" onclick={handleSort} title="Type">
                        <div class="att-sort-inner"><span>Type</span><span class="att-sort-arrow" data-arrow={tableSortState.archived.icons.Type}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="archived" data-field="ArchivedDate" onclick={handleSort} title="Archived Date">
                        <div class="att-sort-inner"><span>Archived Date</span><span class="att-sort-arrow" data-arrow={tableSortState.archived.icons.ArchivedDate}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="archived" data-field="ExpiryDate" onclick={handleSort} title="Expiry Date">
                        <div class="att-sort-inner"><span>Expiry Date</span><span class="att-sort-arrow" data-arrow={tableSortState.archived.icons.ExpiryDate}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="archived" data-field="ParentFolder" onclick={handleSort} title="Parent Folder">
                        <div class="att-sort-inner"><span>Parent Folder</span><span class="att-sort-arrow" data-arrow={tableSortState.archived.icons.ParentFolder}></span></div>
                      </th>
                      <th class="att-th att-sortable" data-table="archived" data-field="FolderPath" onclick={handleSort} title="Folder Path">
                        <div class="att-sort-inner"><span>Folder Path</span><span class="att-sort-arrow" data-arrow={tableSortState.archived.icons.FolderPath}></span></div>
                      </th>
                      <th class="att-th att-center" title="Actions">Actions</th>
                    </tr>
                  </thead>
                </table>
              </div>

              <div class="att-body-scroll custom-scroll">
                <table class="att-table att-archived-table">
                  <tbody>
                    <template for:each={data} for:item="file">
                      <tr key={file.Id}>
                        <td class="att-td" title={file.Name}>{file.Name}</td>
                        <td class="att-td" title={file.Type}>{file.Type}</td>
                        <td class="att-td" title={file.ArchivedDate}>{file.ArchivedDate}</td>
                        <td class="att-td" title={file.ExpiryDate}>
                          {file.ExpiryDate}
                          <template if:true={file.isExpired}>
                            <span class="expired-indicator"> (Expired)</span>
                          </template>
                        </td>
                        <td class="att-td" title={file.ParentFolder}>{file.ParentFolder}</td>
                        <td class="att-td" title={file.FolderPath}>{file.FolderPath}</td>
                        <td class="att-td att-center">
                          <a href={file.AmazonURL} data-id={file.Id} data-url={file.AmazonURL}
                             onclick={handleView} title="View Attachment" class="att-action-link">
                            <i class="material-icons att-action-icon">visibility</i>
                          </a>
                          <a href={file.AmazonURL} data-id={file.Id} data-url={file.AmazonURL} data-name={file.Name}
                             onclick={handleDownload} title="Download Attachment" class="att-action-link">
                            <i class="material-icons att-action-icon">download</i>
                          </a>
                          <a href="javascript:void(0)" data-id={file.Id}
                             onclick={handleRestore} title="Restore" class="att-action-link">
                            <i class="material-icons att-action-icon">unarchive</i>
                          </a>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

          </template>

          <template if:true={noRecordsFlag}>
            <div class="att-no-data">
              <p>{noRecordsText}</p>
            </div>
          </template>
        </div>

        <!-- Pagination -->
        <div class="att-pagination slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-top_medium">
          <div class="slds-list_inline">
            <span style="margin-right: 5px; margin-top: 5px;">Page Size:</span>
            <div class="slds-select_container">
              <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                <template for:each={pageSizeSelectOptions} for:item="option">
                  <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                </template>
              </select>
            </div>
          </div>

          <div class="slds-align_absolute-center">
            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
                alternative-text="first page" onclick={firstPage} style="margin-right: 10px;"></lightning-button>
            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
                alternative-text="Previous" onclick={previousPage} style="margin-right: 5px;"></lightning-button>
            <span class="slds-badge">Showing {pageNumber} of {totalPages} Page(s)</span>
            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
          </div>

          <div class="slds-clearfix">
            <div class="slds-float_right">
              <span class="slds-badge">Total Records: {totalRecords}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ ADD / UPDATE ATTACHMENT (popup) ============ -->
    <template if:true={showAttachmentModal}>
      <lightning-record-edit-form
          object-api-name="TSign_Document__c"
          record-id={selectedRecordId}
          onsuccess={handleSuccess}
          onsubmit={handleSubmit}
          onerror={handleError}>

        <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true" tabindex="-1">
          <div class="slds-modal__container" style="width: 45%; max-width: 45rem; min-width: 30rem;">

            <header class="slds-modal__header" style="background:#002a52;">
              <h2 class="slds-text-heading_medium slds-hyphenate"
                  style="color:white; font-weight:bold; text-align:center;">
                {attachmentModalTitle}
              </h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium custom-scroll"
                 style="max-height: 65vh; overflow-y: auto;">
              <lightning-messages></lightning-messages>

              <div class="slds-grid slds-wrap">
                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                  <div class="floating-label">
                    <span class="label-text-drop"><span style="color: red">*</span>Attachment Name</span>
                    <lightning-input-field field-name="Name" required="true" variant="label-hidden"></lightning-input-field>
                  </div>
                </div>

                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                  <div class="floating-label">
                    <span class="label-text-drop"><span style="color: red">*</span>Type</span>
                    <div class="type-dropdown-container">
                      <button type="button" class="type-dropdown-button" onclick={toggleTypeDropdown}
                              aria-expanded={isTypeOpen}>
                        <span class="type-selected-text" title={selectedType}>{typeDisplayText}</span>
                        <lightning-icon icon-name="utility:chevrondown" size="x-small"></lightning-icon>
                      </button>

                      <template if:true={isTypeOpen}>
                        <div class="type-dropdown-menu" onclick={stopMenuClick}>
                          <template if:true={canManage}>
                            <div class="type-add-section">
                              <lightning-input type="text" variant="label-hidden"
                                               placeholder="Add new type..."
                                               value={newTypeText}
                                               maxlength="50"
                                               onchange={handleNewTypeInput}
                                               onkeyup={handleNewTypeKeyUp}>
                              </lightning-input>
                              <lightning-button label="Add" variant="brand"
                                                onclick={handleAddType}
                                                disabled={isAddTypeDisabled}>
                              </lightning-button>
                            </div>
                            <div class="type-dropdown-divider"></div>
                          </template>

                          <div class="type-options-list">
                            <template for:each={typeOptionItems} for:item="opt">
                              <button key={opt.value} type="button" class={opt.cssClass}
                                      data-value={opt.value} title={opt.label}
                                      onclick={handleTypeSelect}>
                                {opt.label}
                              </button>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>

                <template if:true={textboxFlag}>
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                      <span class="label-text-drop">Other (Please Specify)</span>
                      <lightning-input-field field-name="Other_Comments__c" variant="label-hidden"></lightning-input-field>
                    </div>
                  </div>
                </template>

                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                  <div class="floating-label">
                    <span class="label-text-drop">Expiry Date</span>
                    <lightning-input-field field-name="Expiry_Date__c" variant="label-hidden"></lightning-input-field>
                  </div>
                </div>

                <div class="slds-size_1-of-1 slds-p-around_small">
                  <div class="floating-label" style="height: 62px">
                    <span class="label-text-drop">Comments</span>
                    <lightning-input-field field-name="Comments__c" variant="label-hidden" maxlength="1000"></lightning-input-field>
                  </div>
                </div>

                <!-- <div class="slds-col slds-size_1-of-1 slds-p-around_small slds-m-top_small">
                  <div class="slds-box drag-drop" ondragover={handleDragOver} ondrop={handleDrop}>
                    <p class="slds-text-align_center">
                      Drag and drop file here <br/>
                      <a href="javascript:void(0);" onclick={triggerFileInput}>Click to browse</a>
                    </p>
                    <input type="file" style="display:none" class="hidden-file-input" onchange={handleFileSelect}/>
                    <template if:true={isFileExpand}>
                      <c-document-office-service
                          record-id={selectedRecordId}
                          module-path-from-parent="ticket"
                          allow-multiple="false"
                          onuploadcomplete={handleAwsUploadComplete}
                          onfiledeleted={handleFileDeleted}>
                      </c-document-office-service>
                    </template>
                  </div>
                </div> -->

                <!-- EDIT: show the file currently attached to the record -->
                <template if:true={showExistingFile}>
                  <div class="slds-col slds-size_1-of-1 slds-p-around_small slds-m-top_small">
                    <span class="slds-text-color_weak">Current file: </span>
                    <a href="javascript:void(0)" data-id={selectedRecordId} data-url={existingFileUrl}
                      onclick={handleView} title="View Attachment">
                      <b>{existingFileName}</b>
                    </a>
                    <p class="slds-text-body_small slds-text-color_weak">
                      Upload a new file below only if you want to replace it.
                    </p>
                  </div>
                </template>

                <div class="slds-col slds-size_1-of-1 slds-p-around_small slds-m-top_small">
                  <c-t-signaws-batch-lwc
                      module-name="TSignApp"
                      organisation-id={organisationId}
                      onuploadsuccess={handleAttachmentUpload}
                      ondelete={handleAttachmentDelete}>
                  </c-t-signaws-batch-lwc>
                </div>

                <template if:true={isattachError}>
                  <div class="slds-size_1-of-1 slds-p-horizontal_small">
                    <p style="color: red">File Size Can not exceed 50MB</p>
                  </div>
                </template>
              </div>
            </div>

            <footer class="slds-modal__footer">
              <lightning-button label="Cancel" variant="brand-outline" onclick={hideModalBox}></lightning-button>
              <lightning-button class="slds-m-left_small" type="submit" variant="brand" label={attachmentSaveLabel}></lightning-button>
            </footer>

          </div>
        </section>
      </lightning-record-edit-form>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    </div>
  </div>

  <!-- ============ VIEW (iframe) ============ -->
  <template if:true={isModalOpen}>
    <div class="slds-grid slds-grid_align-end">
      <lightning-button class="slds-m-left_medium" label="Close" variant="brand" onclick={closeModal}
          style="margin-bottom: 0.5%;"></lightning-button>
    </div>
    <div style="padding: 1%" class="main-container-iframe custom-scroll">
      <iframe src={currentUrl} width="100%" height="1300px"></iframe>
    </div>
  </template>

  <!-- ============ DELETE CONFIRM ============ -->
  <template if:true={deleteFlag}>
    <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
        class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <header class="slds-modal__header" style="background: #002a52">
          <h2 class="slds-text-heading_medium slds-hyphenate" style="color: white; font-weight: bold; text-align: center">Delete</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">
            <p style="text-align: center">Are you sure you want to delete this file?</p>
            <div class="button-container slds-m-top_medium">
              <lightning-button label="No" variant="brand" onclick={handleclose} class="slds-m-around_small"></lightning-button>
              <lightning-button label="Yes" variant="brand" onclick={handledeletefile} class="slds-m-around_small"></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- ============ GRANT ACCESS / SHARE FOLDER (popup) ============ -->
  <template if:true={showAccessPanel}>
    <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true" tabindex="-1">
      <div class="slds-modal__container" style="width: 55%; max-width: 60rem; min-width: 34rem;">

        <header class="slds-modal__header" style="background:#002a52;">
          <h2 class="slds-text-heading_medium slds-hyphenate"
              style="color:white; font-weight:bold; text-align:center;">
            {accessPanelTitle}
          </h2>
        </header>

        <div class="slds-modal__content slds-p-around_medium custom-scroll"
             style="max-height: 65vh; overflow-y: auto;">

          <!-- SEARCH -->
          <div class="staff-search-section">
            <div class="section-label">Search Manager</div>
            <div class="staff-search-wrapper">
              <span class="material-icons search-icon">search</span>
              <input type="text"
                     class="staff-search-input"
                     placeholder="Search by name or email"
                     value={staffSearchKey}
                     oninput={handleStaffSearch} />
            </div>
          </div>

          <!-- TABLE -->
          <div class="staff-selection-table custom-scroll">
            <div class="staff-table-header">
              <div class="staff-checkbox-column">
                <input type="checkbox" checked={allVisibleStaffSelected} onchange={handleSelectAllStaff} />
              </div>
              <div class="staff-name-column">Name</div>
              <div class="staff-email-column">Email</div>
            </div>

            <template for:each={filteredStaffUsers} for:item="staff">
              <div key={staff.Id} class="staff-table-row">
                <div class="staff-checkbox-column">
                  <input type="checkbox" data-id={staff.Id} checked={staff.isSelected} onchange={handleStaffCheckbox} />
                </div>
                <div class="staff-name-column" title={staff.name}>{staff.name}</div>
                <div class="staff-email-column" title={staff.email}>{staff.email}</div>
              </div>
            </template>

            <template if:false={filteredStaffUsers.length}>
              <div class="no-staff-message">No managers found.</div>
            </template>
          </div>

          <!-- PAGINATION -->
          <div class="staff-pagination">
            <div class="staff-page-size">
              <label for="staffPageSizeSelect">Page Size:</label>
              <select class="slds-select" id="staffPageSizeSelect" onchange={handleStaffPageSize}>
                <template for:each={staffPageSizeOptions} for:item="option">
                  <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                </template>
              </select>
            </div>

            <div class="staff-page-nav">
              <lightning-button disabled={bDisableStaffFirst} icon-name="utility:jump_to_left" label="First" onclick={staffFirstPage}></lightning-button>
              <lightning-button disabled={bDisableStaffFirst} icon-name="utility:chevronleft" label="Previous" onclick={staffPreviousPage}></lightning-button>
              <span class="slds-badge">Showing {staffCurrentPage} of {staffTotalPages} Page(s)</span>
              <lightning-button disabled={bDisableStaffLast} icon-name="utility:chevronright" label="Next" icon-position="right" onclick={staffNextPage}></lightning-button>
              <lightning-button disabled={bDisableStaffLast} icon-name="utility:jump_to_right" label="Last" icon-position="right" onclick={staffLastPage}></lightning-button>
            </div>

            <span class="slds-badge">Total: {staffTotalRecords}</span>
          </div>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button label="Cancel" variant="brand-outline" onclick={handleAccessCancel}></lightning-button>
          <lightning-button class="slds-m-left_small" label="Save" variant="brand"
              icon-name="utility:save" onclick={handleAccessSave} disabled={saveButtonDisable}></lightning-button>
        </footer>

      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- ============ CREATE FOLDER ============ -->
  <template if:true={isCreateFolderModalOpen}>
    <div class="blur-overlay"></div>
    <section class="slds-modal slds-fade-in-open" role="dialog">
      <div class="slds-modal__container" style="max-width: 30%;">
        <header class="slds-modal__header" style="background:#002a52;">
          <h2 class="slds-text-heading_medium" style="color:white; text-align:center;">Create New Folder</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <lightning-input label="Folder Name" value={folderName} onchange={handleFolderNameChange} required></lightning-input>
          <div style="margin-top:15px;">
            <lightning-combobox label="Parent Folder" value={selectedParentFolderId} options={folderOptions}
                onchange={handleParentFolderChange}></lightning-combobox>
          </div>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button label="Cancel" onclick={closeFolderModal}></lightning-button>
          <lightning-button variant="brand" label="Create Folder" onclick={createFolder} class="slds-m-left_small"></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- ============ EDIT FOLDER ============ -->
  <template if:true={isEditFolderModalOpen}>
    <div class="blur-overlay"></div>
    <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true">
      <div class="slds-modal__container" style="max-width: 30%;">
        <header class="slds-modal__header" style="background:#002a52;">
          <h2 class="slds-text-heading_medium" style="color:white; text-align:center;">Edit Folder</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <lightning-input label="Folder Name" value={editFolderName}
              maxlength="80" onchange={handleEditFolderNameChange} required></lightning-input>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button label="Cancel" onclick={closeEditFolderModal}></lightning-button>
          <lightning-button variant="brand" label="Update Folder" onclick={saveEditFolder}
              class="slds-m-left_small" disabled={isEditFolderSaveDisabled}></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- ============ SEND EMAIL ============ -->
  <template if:true={isEmailModalOpen}>
    <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true" tabindex="-1">
      <div class="slds-modal__container" style="max-width: 50rem; width: 50%;">
        <header class="slds-modal__header" style="background:#002a52;">
          <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white; font-weight:bold; text-align:center;">
            Send Email
          </h2>
        </header>

        <div class="slds-modal__content slds-p-around_medium custom-scroll" style="max-height: 65vh; overflow-y: auto;">
          <div class="slds-m-bottom_small">
            <span class="slds-text-color_weak">Attachment: </span>
            <b>{emailFileName}</b>
          </div>

          <lightning-input
              type="text"
              name="fromAddress"
              label="From"
              value={fromAddress}
              disabled>
          </lightning-input>

          <lightning-input
              class="slds-m-top_small"
              type="text"
              name="toAddress"
              label="To"
              placeholder="Enter recipient email (separate multiple with comma)"
              value={toAddress}
              required
              onchange={handleEmailOnChange}>
          </lightning-input>

          <lightning-input
              class="slds-m-top_small"
              type="text"
              name="ccAddress"
              label="CC"
              placeholder="Enter CC email (optional)"
              value={ccAddress}
              onchange={handleEmailOnChange}>
          </lightning-input>

          <lightning-input
              class="slds-m-top_small"
              type="text"
              name="emailSubject"
              label="Subject"
              value={emailSubject}
              required
              onchange={handleEmailOnChange}>
          </lightning-input>

          <div class="slds-m-top_small">
            <lightning-input-rich-text
                name="emailBody"
                label="Body"
                value={emailBody}
                onchange={handleEmailOnChange}>
            </lightning-input-rich-text>
          </div>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button label="Cancel" variant="brand-outline" onclick={handleCloseEmailModal}
              disabled={isSendingEmail}></lightning-button>
          <lightning-button class="slds-m-left_small" label={sendEmailLabel} variant="brand"
              icon-name="utility:send" onclick={handleSendEmail} disabled={isSendingEmail}></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- ============ EMAIL HISTORY ============ -->
  <template if:true={showEmailHistoryModal}>
    <div class="incident-history-backdrop">
      <div class="incident-history-modal">

        <div class="incident-history-header">
          <h2 class="slds-text-heading_medium h2custom">
            Email History
          </h2>
          <button class="incident-history-close" onclick={closeEmailHistory} aria-label="Close">
            &times;
          </button>
        </div>

        <div class="history-document-name" title={emailHistoryFileName}>
          Document: <b>{emailHistoryFileName}</b>
        </div>

        <div class="history-timeline custom-scroll">
          <template for:each={groupedEmailHistory} for:item="group">
            <div key={group.date} class="history-date-section">

              <div class="history-date-label">{group.date}</div>

              <template for:each={group.entries} for:item="entry">
                <div key={entry.id} class="history-entry">

                  <div class="entry-time">
                    <span class="timeline-dot"></span>
                    {entry.time}
                  </div>

                  <div class="entry-content">
                    <div class="entry-header">
                      <div class="avatar-circle">{entry.initials}</div>
                      <div class="entry-meta">
                        <span class="entry-user">{entry.user}</span>
                        <span class="entry-action">{entry.action}</span>
                      </div>
                    </div>

                    <lightning-formatted-rich-text value={entry.changes}></lightning-formatted-rich-text>
                  </div>

                </div>
              </template>

            </div>
          </template>

          <template if:false={hasEmailHistory}>
            <div class="no-history-message">
              No emails have been sent for this document.
            </div>
          </template>
        </div>

      </div>
    </div>
  </template>

  <!-- ============ SPINNER ============ -->
  <template if:true={isShowSpinner}>
    <div class="overlay-logo"></div>
    <div class="spinner-wrapper">
      <div class="loader-container">
        <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
        <img src={imageUrl} alt="T Logo" class="Tlogo" />
      </div>
      <p class="progress-text">Loading<br />Please Wait...</p>
    </div>
  </template>

</template>
