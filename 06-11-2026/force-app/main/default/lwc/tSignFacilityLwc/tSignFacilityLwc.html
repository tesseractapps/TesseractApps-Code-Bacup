<template>
    <!-- Same layout as NDIS User Management: search on top, table fills, pager pinned at the bottom -->
    <div class="main-container">

        <!-- <template if:true={isLoading}> -->
        <template if:true={showSearchSpinner}>
            <div class="slds-spinner_container custom-spinner-container">
                <div role="status" class="slds-spinner slds-spinner_large slds-is-relative">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </template>
        <template if:true={showPageSpinner}>
            <div class="overlay-logo"></div>
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
                <p class="progress-text">Loading<br />Please Wait...</p>
            </div>
        </template>        

        <div class="slds-grow slds-grid slds-grid_vertical min-height-0">
            <header class="header">
                <div class="search-section">
                     <lightning-input
                            type="search"
                            variant="label-hidden"
                            placeholder="Search Facilities"
                            value={searchKey}
                            onchange={handleSearchChange}
                        ></lightning-input>
                   <!--  <div class="floating-label search-box">
                        <span class="label-text-drop">Search</span>
                       
                    </div> -->
                </div>
               <!--  <lightning-button label="Create Facility" icon-name="utility:add" variant="brand" onclick={handleNewFacility}></lightning-button> -->
            </header>

            <div class="content-wrapper slds-p-around_medium">
                <div class="table-container userTableHeight custom-scroll">
                    <template if:true={hasFacilities}>
                        <table class="slds-table slds-table_cell-buffer fixed-table">
                            <thead>
                                <tr>
                                    <th class="slds-text-align_left">Facility Name</th>
                                    <th class="slds-text-align_left">Contact Phone</th>
                                    <th class="slds-text-align_left">Contact Email</th>
                                    <th class="slds-text-align_left col-location">Location</th>
                                    <th class="slds-text-align_left">Created On</th>
                                    <th class="slds-text-align_center col-action">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={facilities} for:item="fac">
                                    <tr key={fac.Id} class="tr1">
                                        <td title={fac.Name}>{fac.Name}</td>
                                        <td>{fac.Phone__c}</td>
                                        <td title={fac.Email__c}>{fac.Email__c}</td>
                                        <td title={fac.formattedAddress}>{fac.formattedAddress}</td>
                                        <td>{fac.formattedDate}</td>
                                        <td class="slds-text-align_center">
                                            <a href="javascript:void(0)" data-id={fac.Id} onclick={handleEdit} title="Edit" class="edit-link">
                                                <i class="material-icons edit-icon" data-id={fac.Id}>edit_document</i>
                                            </a>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template if:false={hasFacilities}>
                        <div class="no-data">
                            <p>No Facilities Found</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Pagination (same as NDIS User Management) -->
        <div class="pagination-container slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination">
            <div class="slds-list_inline">
                <span class="page-size-label">Page Size:</span>
                <div class="slds-select_container">
                    <select class="slds-select" onchange={handlePageSizeChange}>
                        <template for:each={pageSizeOptions} for:item="option">
                            <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                        </template>
                    </select>
                </div>
            </div>

            <div class="slds-align_absolute-center">
                <lightning-button disabled={isFirstPage} icon-name="utility:jump_to_left" label="First"
                    class="slds-p-horizontal_x-small" alternative-text="first page"
                    onclick={handleFirst}></lightning-button>
                <lightning-button disabled={isFirstPage} icon-name="utility:chevronleft" label="Previous"
                    alternative-text="Previous" onclick={handlePrev}></lightning-button>
                &nbsp;
                <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                &nbsp;
                <lightning-button disabled={isLastPage} icon-name="utility:chevronright" label="Next"
                    alternative-text="Next" onclick={handleNext} class="slds-p-horizontal_x-small"
                    icon-position="right"></lightning-button>
                <lightning-button disabled={isLastPage} icon-name="utility:jump_to_right" label="Last"
                    alternative-text="last page" onclick={handleLast}
                    icon-position="right"></lightning-button>
            </div>

            <div class="slds-clearfix">
                <div class="slds-float_right">
                    <span class="slds-badge">Total Records: {totalRecords}</span>
                </div>
            </div>
        </div>

        <!-- Create / Edit popup (NDIS "Edit Staff" style) -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container createEditModal">

                    <header class="slds-modal__header headercustom modal-header-custom">
                        <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom title-center">{modalTitle}</h2>
                        <button class="slds-button slds-button_icon close-btn" title="Close" onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        </button>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium custom-scroll">
                        <h3 class="slds-text-title_bold modal-section-title">Facility Details</h3>
                        <div class="slds-grid slds-wrap">
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span class="required-mark">*</span>Facility Name</span>
                                    <lightning-input label="Facility Name" variant="label-hidden" value={currentFacility.Name} data-field="Name" onchange={handleFieldChange} required></lightning-input>
                                </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop">Contact Phone</span>
                                    <lightning-input label="Phone" variant="label-hidden" type="text" value={currentFacility.Phone__c} data-field="Phone__c" onchange={handleFieldChange}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span class="required-mark">*</span>Contact Email</span>
                                    <lightning-input label="Contact Email" variant="label-hidden" type="email" value={currentFacility.Email__c} data-field="Email__c" onchange={handleFieldChange} required></lightning-input>
                                </div>
                            </div>
                        </div>

                        <!-- Address (the address component shows its own "Address" label) -->
                        <div class="slds-grid slds-wrap slds-m-top_x-small">
                            <div class="slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_small">
                                <c-t-sign-address-selector
                                    address={childAddress}
                                    onaddresschange={handleAddressChange}>
                                </c-t-sign-address-selector>
                            </div>
                        </div>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                        <lightning-button label={buttonLabel} variant="brand" onclick={handleSave} class="slds-m-left_x-small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>
