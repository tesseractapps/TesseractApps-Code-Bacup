<template>
    <div class={computedClass} style={indentStyle}>

        <div class="folder-row" onclick={handleClick}>

            <!-- LEFT SIDE -->
            <div class="folder-left">

                <!-- TOGGLE -->
                <span class="material-icons toggle-icon" onclick={toggle}>
                    <template if:true={hasChildren}>
                        {toggleIcon}
                    </template>
                </span>

                <!-- ICON -->
                <span class="material-icons folder-icon">
                    {folderIcon}
                </span>

                <!-- NAME -->
                <span class="folder-name">
                    {node.Name}
                </span>

            </div>

            <!-- menu only for real folders the user can modify (not Public) -->
            <template if:true={showActions}>
                <!-- RIGHT SIDE (ACTIONS) -->
                <div class="folder-actions">

                    <span class="material-icons more-icon" onclick={toggleMenu}>
                        more_vert
                    </span>

                    <template if:true={showMenu}>
                        <div class="menu-dropdown">

                            <template if:true={node.canEdit}>
                                <div class="menu-item" data-id={node.Id} onclick={handleEdit}>
                                    <span class="material-icons menu-icon">edit</span>
                                    <span>Edit</span>
                                </div>
                            </template>

                            <template if:true={node.canShare}>
                                <div class="menu-item" data-id={node.Id} onclick={handlePermissions}>
                                    <span class="material-icons menu-icon">lock</span>
                                    <span>Permissions</span>
                                </div>
                            </template>

                            <div class="menu-item delete" data-id={node.Id} onclick={handleDelete}>
                                <span class="material-icons menu-icon">delete</span>
                                <span>Delete Folder</span>
                            </div>

                        </div>
                    </template>

                </div>
            </template>

        </div>

    </div>

    <!-- CHILDREN -->
    <template if:true={isOpen}>
        <template for:each={node.children} for:item="child">
            <c-t-sign-folder
                key={child.Id}
                node={child}
                level={nextLevel}
                selected-id={selectedId}
                is-staff={isStaff}
                onfolderselect={handleChildSelect}
                oneditfolder={handleChildEdit}
                onpermissions={handleChildPermissions}
                onrefreshfolders={handleRefreshFolders}>
            </c-t-sign-folder>
        </template>
    </template>
</template>
