<template>
    <template if:true={homeFlag}>
<!-- <div class="main-container"> -->
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <!-- Left side: Staff Details -->
            <p style="font-weight: bold; padding: 1% 0% 1% 1%;font-size:140% ">Edit Company - {editcompanyname} - {selectedCardType}</p>
            <!-- <lightning-button label="Back" variant="brand" onclick={navigateToCreateCompany}></lightning-button> -->
               
            <div style="display: flex; align-items: center; gap: 15px;"> 
                 
                    <!-- Toggle Button -->
                     <br><br>
                <lightning-input 
                    type="toggle" 
                    label="Show Advanced Fields" 
                    onchange={handleToggleAdvanced}
                    message-toggle-active=""
                      message-toggle-inactive="">
                </lightning-input> &nbsp;
                <lightning-button class='slds-m-right_small' label="Back" variant="brand" onclick={navigateToCreateCompany}></lightning-button>

            </div>
        </div>
        <div class="menu-container">
            <div class={profileClass}>Profile</div>    
              
        </div>
       
<!--     START: lightning-record-edit-form  -->
<!-- ===================================== -->

    <lightning-record-edit-form 
        record-id={recordId}
        object-api-name="Entity_Profile__c"
        onsuccess={handleSuccessProfile}
        onsubmit={handleSubmitProfile}
        onload={handleFormLoad}
        data-recordform="profileForm">

        <lightning-messages></lightning-messages>
                    <br>
        <!-- =========================== -->
        <!--      ENTITY DETAILS         -->
        <!-- =========================== -->

        <!-- <div class="section-header" >Entity Details</div> -->
         <div class="slds-m-left_small slds-text-title_bold">Entity Details</div>                                                                           
        <div class="slds-grid slds-wrap">

            <!-- Type -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop"><span style="color:red">*</span>Type</span>
                    <lightning-input-field
                        field-name="Designation__c"
                        variant="label-hidden"
                         name="designation"
                        required
                        onchange={handleChange}>
                    </lightning-input-field>
                </div>
            </div>

            <!-- Name (Non-Individual) -->
            <template if:false={isIndividual}>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop"><span style="color:red">*</span>Name</span>
                        <lightning-input-field
                            field-name="Name__c"
                            variant="label-hidden"

                            required>
                        </lightning-input-field>
                    </div>
                </div>
            </template>

            <!-- First Name + Last Name (Individual) -->
            <template if:true={isIndividual}>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop"><span style="color:red">*</span>First Name</span>
                        <lightning-input-field
                            field-name="First_Name__c"
                            name="firstName"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>
                    </div>
                </div>

                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop"><span style="color:red">*</span>Last Name</span>
                        <lightning-input-field
                            field-name="Last_Name__c"
                            name="lastName"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>
                    </div>
                </div>
            </template>

            <!-- Contact -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop"><span style="color:red">*</span>Contact Number</span>
                    <!-- <lightning-input-field
                        field-name="Contact__c"
                        onchange={handleContactChange}
                        variant="label-hidden"
                        required>
                    </lightning-input-field> -->
                    <lightning-input
                        type="text"
                        data-id="contactNumberField"
                        value={contactNumber}
                        maxlength="10"
                        onchange={handleContactChange}
                        variant="label-hidden"
                        required>
                    </lightning-input>
                </div>
            </div>

            <template if:true={showAdvanced}>
                 <!-- Fax -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">Fax</span>
                    <lightning-input-field 
                        field-name="Fax__c"
                        variant="label-hidden">
                    </lightning-input-field>
                </div>
            </div>
                
            </template>


            <!-- Email -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop"><span style="color:red">*</span>Email</span>
                    <lightning-input-field
                        field-name="Email__c"
                        variant="label-hidden"
                        required>
                    </lightning-input-field>
                </div>
            </div> 

            <!--  Email (your To_Email__c) -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">To Email</span>
                    <lightning-input-field
                        field-name="To_Email__c"
                        data-field="toEmail"
                        variant="label-hidden"
                        onchange={handleToEmailChange}>
                    </lightning-input-field>
                </div>
            </div>

            <!-- cc Email -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">Cc Email</span>
                    <lightning-input-field
                        field-name="cc__c"
                        data-field="ccEmail"
                        variant="label-hidden"
                        onchange={handleCcEmailChange}>
                    </lightning-input-field>
                </div>
            </div>

            <!-- Include Org Email -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <label style="display:flex; gap:5%; padding-top:2.5%;">
                    <lightning-input
                        type="checkbox"
                        label="Use Org Email"
                        checked={includeOrgEmail}
                        onchange={handleIncludeOrgEmail}>
                    </lightning-input>
                </label>
            </div>

            <template if:true={showAdvanced}>
                 <!-- Fax -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">Website</span>
                    <lightning-input-field 
                        field-name="Website__c"
                        variant="label-hidden">
                    </lightning-input-field>
                </div>
            </div>
                
            </template>


            <!-- Inactive Card -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <label style="display:flex; gap:5%;">
                    <lightning-input-field
                        field-name="Inactive_Card__c"
                        variant="label-hidden"
                        onchange={handleInactiveChange}>
                    </lightning-input-field>
                    <span>Inactive Card</span>
                </label>
            </div>

        </div>
            <!-- =========================== -->
    <!--          ACCOUNTING         -->
    <!-- =========================== -->

    <div class="slds-m-left_small slds-text-title_bold">Accounting</div>

     <div class="slds-grid slds-wrap">

        <!-- ABN (Non-Individual Required) -->
        <template if:false={isIndividual}>
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">
                        <span style="color:red">*</span> ABN
                    </span>
                    <lightning-input-field
                        field-name="ABN__c"
                        variant="label-hidden"
                        data-field="abnField"
                        onclick={handleabn}
                        required>
                    </lightning-input-field>
                </div>
            </div>
        </template>

        <!-- ABN (Individual — Non-mandatory except your custom rule) -->
        <template if:true={isIndividual}>
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">ABN</span>
                    <lightning-input-field
                        field-name="ABN__c"
                        variant="label-hidden"
                        data-field="abnField"
                        onclick={handleabn}
                        required={isAbnRequired}>
                    </lightning-input-field>
                </div>
            </div>
        </template>


        <template if:true={showAbnPopup}>

        <section aria-modal="true" class="slds-modal slds-fade-in-open" role="dialog">
        <div class="slds-modal__container modal-container" style="max-width:25%;">
        
        <header class="slds-modal__header" style="background:#002A52;">
            <h2 class="slds-text-heading_medium" style="color:white;font-weight:bold;text-align:center;">
                Select ABN 
            </h2>
        </header>

        <div class="slds-modal__content slds-p-around_medium">
            
            <lightning-radio-group
                name="abnOptions"
                label=""
                options={abnOptions}
                value={selectedAbnType}
                onchange={handleAbnSelection}>
            </lightning-radio-group>

            <!-- Custom ABN input -->
            <template if:true={isCustom}>
                <lightning-input 
                    label="Enter Custom ABN"
                    value={customAbn}
                    onchange={handleCustomAbn}>
                </lightning-input>
            </template>

            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-button 
                    label="Cancel" 
                    onclick={closeAbnPopup}
                    class="slds-m-around_small">
                </lightning-button>
                
                <lightning-button 
                    label="Apply" 
                    variant="brand"
                    onclick={applyAbnSelection}
                    class="slds-m-around_small">
                </lightning-button>
            </div>

        </div>

     
    </div>
</section>

<div class="slds-backdrop slds-backdrop_open"></div>

</template>



        <!-- ========== CUSTOMER TAX CODE ========== -->
        <template if:true={customerFlag}>
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new1">
                    <span class="label-text-drop1">
                        <span style="color:red">*</span>Tax Code
                    </span>

                    <div class="dropdown">
                        <button type="button"
                                class="dropdown-button slds-truncate"
                                title={selectedOption1}
                                onclick={toggleDropdown1}>
                            {selectedOption1}
                        </button>
                    </div>
                </div>
            </div>

            <!-- CUSTOMER ACCOUNT LIST INPUT -->
            <!-- <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new1">
                    <span class="label-text-drop1">
                        <span style="color:red">*</span>Account List
                    </span>

                    <div class="dropdown">
                        <input type="text"
                               class="dropdown-input"
                               placeholder="Search Name or Number"
                               value={customerSearchTerm}
                               onclick={handleCustomerALClick}
                               oninput={handleCustomerSearch}/>
                    </div>
                </div>
            </div> -->
                <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new1">
                    <span class="label-text-drop1">
                        <span style="color:red">*</span>Account List
                    </span>

                    <div class="dropdown">
                        <form autocomplete="off" style="margin:0; padding:0; display:contents;">
                        <input type="text"
                               class="dropdown-input"
                               placeholder="Search Name or Number"
                               value={customerSearchTerm}
                               onclick={handleCustomerALClick}
                               oninput={handleCustomerSearch}/>
                               </form>
                    </div>
                </div>
            </div>
        </template>


        <!-- ========== SUPPLIER TAX CODE ========== -->
        <template if:true={buyingFlag}>
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new1">
                    <span class="label-text-drop1">
                        <span style="color:red">*</span>Tax Code
                    </span>

                    <div class="dropdown">
                        <button type="button"
                                class="dropdown-button slds-truncate"
                                title={selectedOption1}
                                onclick={toggleDropdown}>
                            {selectedOption}
                        </button>
                    </div>
                </div>
            </div>

            <!-- SUPPLIER ACCOUNT LIST INPUT -->
            <!-- <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new1">
                    <span class="label-text-drop1">
                        <span style="color:red">*</span>Account List
                    </span>

                    <div class="dropdown">
                        <input type="text"
                               class="dropdown-input"
                               placeholder="Search Name or Number"
                               value={supplierSearchTerm}
                               onclick={handleSupplierALClick}
                               oninput={handleSupplierSearch}/>
                    </div>
                </div>
            </div> -->

            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new1">
                    <span class="label-text-drop1">
                        <span style="color:red">*</span>Account List
                    </span>

                    <div class="dropdown">
                        <form autocomplete="off" style="margin:0; padding:0; display:contents;">
                        <input type="text"
                               class="dropdown-input"
                               placeholder="Search Name or Number"
                               value={supplierSearchTerm}
                               onclick={handleSupplierALClick}
                               oninput={handleSupplierSearch}/>
                               </form>
                    </div>
                </div>
            </div>

        </template>

                    <!-- CREDIT LIMIT (visible only when showAdvanced = true) -->
    <template if:true={showAdvanced}>
        <div class="slds-size_1-of-4 slds-p-around_small">
            <div class="floating-label-new">
                <span class="label-text-drop">Credit Limit</span>
                <lightning-input-field 
                    field-name="Credit_Limit__c"
                    name="creditLimit"
                    variant="label-hidden"
                    onchange={handleChange}>
                </lightning-input-field>
            </div>
        </div>
             <template if:true={buyingFlag}>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Purchase Layout</span>
                        <lightning-input-field 
                            field-name="Purchase_Layout__c"
                            variant="label-hidden"
                            onchange={handleChange}>
                        </lightning-input-field>
                    </div>
                </div>

                 <!-- Available Credit -->
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Available Credit</span>
                        <lightning-input-field 
                            field-name="Available_Credit__c"
                            variant="label-hidden">
                        </lightning-input-field>
                    </div>
                </div>

                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Currently Past Due</span>
                        <lightning-input-field 
                            field-name="Currently_Past_Due__c"
                            variant="label-hidden">
                        </lightning-input-field>
                    </div>
                </div>

            </template>
        <!-- SALE LAYOUT (Customer only) -->
        <template if:true={sellingFlag}>
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">Sale Layout</span>
                    <lightning-input-field 
                        field-name="Sale_Layout__c"
                        name="saleLayout"
                        variant="label-hidden"
                        onchange={handleChange}>
                    </lightning-input-field>
                </div>
            </div>
             <template if:true={paymentCustomerFlag}>
                                <div class="slds-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop">Payment Method</span>
                                        <lightning-input-field 
                                            field-name="Payment_Method__c"
                                            variant="label-hidden"
                                            onchange={handleChange}>
                                        </lightning-input-field>
                                    </div>
                                </div>
                </template>
             <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Invoice Delivery</span>
                        <lightning-input-field 
                            field-name="Invoice_Delivery__c"
                            variant="label-hidden"
                            onchange={handleChange}>
                        </lightning-input-field>
                    </div>
                </div>
        </template>
    </template>



    </div>

        <!-- =========================== -->
    <!--            ADDRESS          -->
    <!-- =========================== -->

    <div class="slds-m-left_small slds-text-title_bold">Address</div>

    <div class="slds-grid slds-wrap">

        <!-- Full Address Block -->
        <div class="slds-size_1-of-4 slds-p-around_small">

            <div style="color:red;">{errorMessage}</div>

            <lightning-input-address
                address-label="Address"
                street-label="Street"
                city-label="Suburb"
                country-label="Country"
                province-label="State"
                postal-code-label="Post Code"
                street={street}
                city={city}
                country={country}
                province={province}
                postal-code={postalcode}
                onchange={addressInputChange}
                show-address-lookup
                required>
            </lightning-input-address>

        </div>

    </div>
        <!-- =========================== -->
    <!--        ADVANCED FIELDS      -->
    <!--     (Show only if toggled)  -->
    <!-- =========================== -->

    <template if:true={showAdvanced}>
        <div class="slds-grid slds-wrap slds-p-vertical_medium">

            <!-- Supplier Payment Details -->
            <template if:true={paymentSupplierFlag}>
                <div class="slds-size_1-of-1 slds-p-around_small">
                    <p class="section-subtitle slds-text-title_bold">Supplier Payment Details</p>

                    <div class="slds-grid slds-wrap">

                        <div class="slds-size_1-of-4 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">BSB Number</span>
                                <lightning-input-field 
                                    field-name="BSB_Number__c"
                                    variant="label-hidden">
                                </lightning-input-field>
                            </div>
                        </div>

                        <div class="slds-size_1-of-4 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Bank Account Number</span>
                                <lightning-input-field 
                                    field-name="Bank_Account_Number__c"
                                    variant="label-hidden">
                                </lightning-input-field>
                            </div>
                        </div>

                        <div class="slds-size_1-of-4 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Bank Account Name</span>
                                <lightning-input-field 
                                    field-name="Bank_Account_Name__c"
                                    variant="label-hidden">
                                </lightning-input-field>
                            </div>
                        </div>

                        <div class="slds-size_1-of-4 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Statement Text</span>
                                <lightning-input-field 
                                    field-name="Statement_Text__c"
                                    variant="label-hidden">
                                </lightning-input-field>
                            </div>
                        </div>
                        <div class="slds-size_1-of-4 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Remittance Advice Delivery Status</span>
                                <lightning-input-field field-name="Remittance_Advice_Delivery_Status__c"
                                  name="remittanceStatus" 
                                  value={remittanceStatus}
                                   variant="label-hidden" 
                                   onchange={handleChange}>
                                </lightning-input-field>
                            </div>
                        </div>
                        <template if:true ={isRemittanceEmail}>
                            <div class="slds-size_1-of-4 slds-p-around_small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Email</span> 
                                    <lightning-input-field field-name="Email__c"
                                     variant="label-hidden">
                                    </lightning-input-field>
                                </div>
                            </div>
                        </template>   
                    </div>
                </div>
            </template>

        </div>

        <!-- =========================== -->
        <!--    ADDITIONAL INFORMATION   -->
        <!-- =========================== -->

        <div class="slds-m-left_small slds-text-title_bold">Payment Terms</div>

        <div class="slds-grid slds-wrap slds-p-vertical_medium">

            <!-- Payment is Due -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">Payment is Due</span>
                    <lightning-input-field 
                        field-name="Payment_is_Due__c"
                        variant="label-hidden">
                    </lightning-input-field>
                </div>
            </div>

            <!-- Discount Days -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">Discount Days</span>
                    <lightning-input-field 
                        field-name="Discount_Days__c"
                        variant="label-hidden">
                    </lightning-input-field>
                </div>
            </div>

            <!-- Balance Due Days -->
            <template if:false={buyingFlag}>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Balance Due Days</span>
                        <lightning-input-field 
                            field-name="Balance_Due_Days__c"
                            variant="label-hidden">
                        </lightning-input-field>
                    </div>
                </div>
            </template>

            <!-- Balance Due Date (For suppliers) -->
            <template if:true={buyingFlag}>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Balance Due Date</span>
                        <lightning-input-field 
                            field-name="Balance_Due_Date__c"
                            variant="label-hidden">
                        </lightning-input-field>
                    </div>
                </div>
            </template>

            <!-- Discount for Early Payment -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">% Discount for Early Payment</span>
                    <lightning-input-field 
                        field-name="Discount_for_Early_Payment__c"
                        variant="label-hidden">
                    </lightning-input-field>
                </div>
            </div>

            <!-- Monthly Charge -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">% Monthly Charge for Late Payment</span>
                    <lightning-input-field 
                        field-name="Monthly_Charge_for_Late_Payment__c"
                        variant="label-hidden">
                    </lightning-input-field>
                </div>
            </div>

            <!-- Volume Discount -->
            <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                    <span class="label-text-drop">Volume Discount %</span>
                    <lightning-input-field 
                        field-name="Volume_Discount__c"
                        variant="label-hidden">
                    </lightning-input-field>
                </div>
            </div>

        </div>

    </template>
        <!-- =========================== -->
    <!--       ACTION BUTTONS        -->
    <!-- =========================== -->

    <div class="slds-grid slds-align_absolute-center slds-m-around_small">

        <lightning-button  
            variant="brand-outline" 
            label="Cancel" 
            onclick={navigateToCreateCompany}>
        </lightning-button>

        <lightning-button 
            variant="brand" 
            type="submit" 
            label="Save"
            onclick={handleNext1}
            disabled={nextButtonDisable1}
            class="slds-m-left_small">
        </lightning-button>

    </div>


    </lightning-record-edit-form>
      <!-- <old code end LRE Form ends> -->
   <template if:true={customerFlag}>
     <template if:true={isDropdownOpen1}>
        <div data-id="taxTableSelling" style={toggleDropdownAccount1}>
            <table class="dropdown-table">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Description</th>
                        <th>Rate</th>
