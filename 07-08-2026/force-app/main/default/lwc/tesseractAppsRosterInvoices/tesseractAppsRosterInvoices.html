<template>
  <div class="main-container">
    <template if:false={tilesflag}>
      <div style="padding: 1%">
        <div class="metrics-grid">
          <div
            class="metric-card highlighted"
            onclick={handleMetricClick}
            data-id="Pending"
          >
            <div class="invoiceTiles">
              <div>
                <h3 class="metric-title">Pending</h3>
                <p class="metric-value">{pendingInvoices}</p>
              </div>
              <!-- <template if:true="{selectedMetricId" ="" ="" ="Pending" }>
                <i class="material-icons metric-icon">task_alt</i>
              </template> -->
              <template if:true={pendingInvoicestask}>
                <i class="material-iconsInvoice">task_alt</i>
              </template>
            </div>
          </div>

          <div
            class="metric-card highlighted1"
            onclick={handleMetricClick}
            data-id="Generated"
          >
            <div class="invoiceTiles">
              <div>
                <h3 class="metric-title">Generated</h3>
                <p class="metric-value">{generatedInvoices}</p>
              </div>
              <!-- <template if:true="{selectedMetricId" ="" ="" ="Generated" }>
                <i class="material-icons metric-icon">task_alt</i>
              </template> -->
              <template if:true={generatedInvoicestask}>
                <i class="material-iconsInvoice">task_alt</i>
              </template>
            </div>
          </div>

          <div
            class="metric-card highlighted2"
            onclick={handleMetricClick}
            data-id="Overdue"
          >
            <div class="invoiceTiles">
              <div>
                <h3 class="metric-title">Cancelled Invoices</h3>
                <p class="metric-value">{overdueInvoices}</p>
              </div>
              <!-- <template if:true="{selectedMetricId" ="" ="" ="Overdue" }>
                <i class="material-icons metric-icon">task_alt</i>
              </template> -->
              <template if:true={overdueInvoicestask}>
                <i class="material-iconsInvoice">task_alt</i>
              </template>
            </div>
          </div>

          <div
            class="metric-card highlighted3"
            onclick={handleMetricClick}
            data-id="Total"
          >
            <div class="invoiceTiles">
              <div>
                <h3 class="metric-title">Total Value</h3>
                <p class="metric-value">${totalAmount}</p>
              </div>
              <!-- <template if:true="{selectedMetricId" ="" ="" ="Total" }>
                <i class="material-icons metric-icon">task_alt</i>
              </template> -->
              <template if:true={totalAmounttask}>
                <i class="material-iconsInvoice">task_alt</i>
              </template>
            </div>
          </div>
        </div>
        <template if:true={isModalRelate}>
          <header class="header1">
            <div class="search-section">
              <div class="floating-label-new">
                <span class="label-text-drop">Start Date</span>
                <lightning-input
                  type="date"
                  label="Start Date"
                  name="start"
                  value={startDate}
                  variant="label-hidden"
                  onchange={handleDateChange}
                ></lightning-input>
              </div>
              <div class="floating-label-new">
                <span class="label-text-drop">End Date</span>
                <lightning-input
                  type="date"
                  label="End Date"
                  name="end"
                  value={endDate}
                  variant="label-hidden"
                  onchange={handleDateChange}
                ></lightning-input>
              </div>
  <!-- <div class="floating-label-new">
      <span class="label-text-drop">{participantPreferredName}</span>
      <c-tesseract-apps-multi-combobox
          placeholder="Select Participants"
          options={ParticipantOptions}
          value={partcipantIdList}
          onchange={handleServiceStaffchange}>
      </c-tesseract-apps-multi-combobox>
  </div> -->
              <!-- <lightning-button  variant="brand"  label="Participants" title="Participants"  onclick={handleCheckBoxVisible}> </lightning-button> -->
              <!-- <i
                class="material-icons"
                title={participantPreferredName}
                onclick={handleCheckBoxVisible}
                >filter_alt</i
              > -->
            </div>
            <div class="action-section">
              <template if:true={addServiceVisible}>
                <template if:false={generatedflag}>
              <template if:false={cancelledflag}>
                  <lightning-button
                  variant="brand"
                  label="Add Service"
                  title="Add Service"
                  onclick={handleAddService}
                  class="slds-m-left_small"
                >
                </lightning-button>
              </template>
              </template>
              </template>

            
              <template if:false={generatedflag}>
                <lightning-button
                  variant="brand"
                  label="Generate Invoice"
                  title="Generate Invoice"
                  onclick={handleGenerateInvoice}
                  disabled={disableBool}
                >
                </lightning-button>
              </template>
              <!-- <lightning-button
                variant="brand"
                label="Back"
                title="Back"
                onclick={HandleBack}
                style="margin-left: 1px"
              >
              </lightning-button> -->
            </div>
          </header>
        </template>
      </div>
    </template>

    <div class="main-content-wrapper">
      <template if:true={participantCheckBox}>
        <div class="sidebar">
          <div class="close-btn" onclick={handleCheckBoxVisible}>&times;</div>

          <div style="border-radius: 5px 5px 0 0">
            <h5 class="facility-header">{participantPreferredName}</h5>
            <div
              class="box-facility-role"
              style="
                margin-bottom: 10px;
                padding: 0px 15px;
                overflow-x: HIDDEN;
                overflow-y: AUTO;
                max-height: 250px;
              "
            >
              <lightning-checkbox-group
                label=""
                name="progress"
                options={ParticipantOptions}
                value={partcipantIdList}
                onchange={handleServiceStaffchange}
              ></lightning-checkbox-group>
            </div>
          </div>
          <div style="border-radius: 5px 5px 0 0">
            <h5 class="facility-header">Status</h5>
            <div
              class="box-facility-role"
              style="
                margin-bottom: 10px;
                padding: 0px 15px;
                overflow-x: HIDDEN;
                overflow-y: AUTO;
                max-height: 120px;
              "
            >
              <lightning-checkbox-group
                label=""
                name="progress"
                options={serviceStatusOption}
                value={statusService}
                onchange={handleServiceChange}
              ></lightning-checkbox-group>
            </div>
          </div>
        </div>
      </template>
      
      <template if:true={pendingflag}>
        <template if:true={isInvoiceflag}>
          <div style="padding: 1% 1% 0 2%; flex-shrink: 0;">
            <header class="bulk-action-header">
                <div class="table-title table-header">{participantPreferredName} Services</div>
                <div class="action-section" style="padding-bottom:1%; display:flex; gap:12px; align-items:center; flex-wrap:nowrap;">
                    <div style="min-width:150px;">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Plan Type</span>
                            <lightning-combobox
                                name="planType"
                                value={servicesPlanType}
                                options={planTypeOptions}
                                variant="label-hidden"
                                onchange={handlePlanTypeChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                    <div style="min-width:180px;">
                        <div class="floating-label-new">
                            <span class="label-text-drop">{staffPreferredName}</span>
                            <lightning-input
                                label="Client ID or Name"
                                onchange={handleSearchInput}
                                type="search"
                                variant="label-hidden"
                                value={searchKey}>
                            </lightning-input>
                        </div>
                    </div>
                    <div style="min-width:200px;">
                        <div class="floating-label-new">
                            <span class="label-text-drop">{participantPreferredName}</span>
                            <c-tesseract-apps-multi-combobox
                                placeholder="Select Participants"
                                options={ParticipantOptions}
                                value={partcipantIdList}
                                onchange={handleServiceStaffchange}>
                            </c-tesseract-apps-multi-combobox>
                        </div>
                    </div>
                </div>
            </header>
          </div>
          
          <div class="slds-grow" style="min-height:0; display: flex; flex-direction: column; padding: 0 1% 1% 1%;">
            <template if:true={noRecordsFlag}>
              <div class="no-data">
                <p>No records found</p>
              </div>
            </template>
            <template if:false={noRecordsFlag}>
              <div class="table-container yourInvoiceTable" style="min-height: 0; display: flex; flex-direction: column; flex: 1 1 auto;">
                <div class="header-wrapper">
                  <table class="staff-table fixed-table">
                   <!--  <thead>
                      <tr>
                        <th class="table-th tableCheckbox">
                          <lightning-input
                            type="checkbox"
                            onchange={handleSelectAll}>
                          </lightning-input>
                        </th>
                        <th class="table-th">{staffPreferredName} Name</th>
                        <th class="table-th">{participantPreferredName} Name</th>
                        
                        <th class="table-th">Service Item Name</th>
                        <th class="table-th">Entity Name</th>
                        <th class="table-th">Service Date</th>
                        <th class="table-th">Billable Hours</th>
                        
                        <th class="table-th">Claim</th>
                        <th class="table-th">Unit Price</th>
                        <th class="table-th">GST</th>
                        <th class="table-th">Amount</th>
                        <th class="table-th">Status</th>
                      </tr>
                    </thead> -->
                    <thead>
                        <tr>
                            <th class="table-th tableCheckbox">
                                <lightning-input
                                    type="checkbox"
                                    checked={isAllSelected}
                                    onchange={handleSelectAll}>
                                </lightning-input>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="Resource_Name__c"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">{staffPreferredName} Name</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.Resource_Name__c}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="participantFullName"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">{participantPreferredName} Name</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.participantFullName}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="Support_Item_Name__c"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">Service Item Name</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.Support_Item_Name__c}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="serviceEntityName"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">Entity Name</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.serviceEntityName}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="ServiceDate"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">Service Date</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.ServiceDate}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="Qty__c"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">Billable Hours</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.Qty__c}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="reimbursementAmount"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">Claim</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.reimbursementAmount}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="unitprice"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">Unit Price</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.unitprice}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="GST__c"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">GST</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.GST__c}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="participantInvoiceAmount"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">Amount</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.participantInvoiceAmount}></span>
                                </div>
                            </th>
                            <th class="table-th sortable-header"
                                data-table="pendingServices"
                                data-field="uistatus"
                                onclick={handleSort}>
                                <div class="sort-header-inner">
                                    <span class="sort-label">Status</span>
                                    <span class="sort-arrow"
                                          data-arrow={tableSortState.pendingServices.icons.uistatus}></span>
                                </div>
                            </th>
                        </tr>
                    </thead> 
                  </table>
                </div>
                <div class="table-body custom-scroll">
                  <table class="staff-table fixed-table">
                    <tbody>
                      <template for:each={accList} for:item="acc">
                        <tr key={acc.Id} class="table-row">
                          <td class="table-td tableCheckbox">
                            <lightning-input
                              type="checkbox"
                              checked={acc.isChecked}
                              data-id={acc.Id}
                              data-status={acc.Status__c}
                              data-bill={acc.Bill_Participant__c}
                              data-fundstrackerid={acc.fundsTrackerId}
                              onchange={handleCheckboxChange}
                            ></lightning-input>
                          </td>
                          <td class="table-td description" title={acc.Resource_Name__c}>{acc.Resource_Name__c}</td>
                          <td class="table-td description" title={acc.participantFullName}>
                            {acc.participantFullName}
                          </td>
                          <!-- <td class="table-td description">{acc.Service_Type_Name__c}</td> -->
                          <td class="table-td description" title={acc.Support_Item_Name__c}>{acc.Support_Item_Name__c}</td>
                          <!-- <td class="table-td description" title={acc.serviceEntityName}>{acc.serviceEntityName}</td> -->
                          <td class="table-td bulkInvoiceTabledropdown">
                            <template if:true={acc.isEditingServiceEntity}>
                              <div class="qty-edit-container">
                                <c-tesseract-apps-single-combobox
                                  variant="label-hidden"
                                  value={acc.serviceEntityId}
                                  options={entityOptions} 
                                  data-id={acc.Id}
                                  onchange={handleServiceEntityChange}
                                  class="qty-value">
                                </c-tesseract-apps-single-combobox>
                                <a
                                  href="javascript:void(0)"
                                  class="save-link"
                                  title="Save"
                                  data-id={acc.Id}
                                  onclick={saveServiceEntityRow}
                                >
                                  <i class="material-icons save-icon">check</i>
                                </a>
                              </div>
                            </template>
                            <template if:false={acc.isEditingServiceEntity}>
                              <div class="qty-edit-container">
                                <span class="qty-value-myob">{acc.serviceEntityName}</span>
                                <!-- <template if:true={invoice.isXeroInvoiceMissing}> -->
                                  <a
                                    href="javascript:void(0)"
                                    data-id={acc.Id}
                                    onclick={enableServiceEntityEdit}
                                    title="Edit Entity"
                                  >
                                    <i class="material-icons edit-icon">edit</i>
                                  </a>
                                <!-- </template> -->
                              </div>
                            </template>
                          </td>
                          <td class="table-td">{acc.ServiceDate}</td>
                          <td class="table-td">
                            <template if:true={acc.isEditingQty}>
                              <div class="qty-edit-container">
                                <lightning-input
                                  type="number"
                                  step="0.01"
                                  min="0"
                                  value={acc.Qty__c}
                                  variant="label-hidden"
                                  onchange={handleQtyChange}
                                  data-id={acc.Id}
                                  data-quantity={acc.Qty__c}
                                  onkeydown={handleQtyKeyDown}
                                  class="qty-value"
                                ></lightning-input>
                                <a
                                  href="javascript:void(0)"
                                  class="save-link"
                                  data-id={acc.Id}
                                  title="Save"
                                  onclick={saveRow}
                                >
                                  <i class="material-icons save-icon">check</i>
                                </a>
                              </div>
                            </template>
                            <template if:false={acc.isEditingQty}>
                              <div class="qty-edit-container">
                                <span class="qty-value">{acc.Qty__c}</span>
                                <a
                                  href="javascript:void(0)"
                                  data-id={acc.Id}
                                  data-status={acc.Status__c}
                                  data-quantity={acc.Qty__c}
                                  onclick={enableQtyEdit}
                                  title="Edit Service"
                                >
                                  <i class="material-icons edit-icon">edit</i>
                                </a>
                              </div>
                            </template>
                          </td>
                          <td class="table-td">{acc.reimbursementAmount}</td>
                          <td class="table-td">
                            <lightning-formatted-number
                              value={acc.unitprice}
                              format-style="currency"
                              currency-code="AUD">
                            </lightning-formatted-number>
                          </td>
                          <td class="table-td">{acc.GST__c}</td>
                          <td class="table-td">
                            <lightning-formatted-number
                              value={acc.participantInvoiceAmount}
                              format-style="currency"
                              currency-code="AUD">
                            </lightning-formatted-number>
                          </td>
                          <td class="table-td">
                            <span class="slds-badge status-badge pending-status">
                              {acc.uistatus}
                            </span>
                            <template if:true={acc.showCreateCompanyIcon}>
                              <a
                                href="javascript:void(0);"
                                data-id={acc.Id}
                                data-facility-id={acc.matchedFacilityId}
                                data-fundstrackerid={acc.fundsTrackerId}
                                data-participant-id={acc.participantId}
                                data-company-entity-id={acc.companyEntityId}
                                data-entity-profile-id={acc.entityProfileId}
                                onclick={handleOpenCreateCompany}
                                title="Create Company/Entity"
                                class="status-icon-link"
                              >
                                <i class="material-icons view-icon">add_home_work</i>
                              </a>
                            </template>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>
          </div>
          <template if:false={noRecordsFlag}>
            <div class="fixed-pagination">
              <div class="pagination-container slds-grid slds-grid_vertical-align-center slds-grid_align-spread -p-around_medium">
                <div class="slds-list_inline slds-grid slds-grid_vertical-align-center">
                  <span class="slds-m-right_x-small">Page Size:</span>
                  <div class="slds-select_container">
                    <select class="slds-select" onchange={handleRecordsPerPage}>
                      <template for:each={pageSizeOptions} for:item="option">
                        <option key={option.value} value={option.value} selected={option.selected}>
                          {option.label}
                        </option>
                      </template>
                    </select>
                  </div>
                </div>
                <div class="slds-align_absolute-center">
                  <lightning-button
                    disabled={bDisableFirst}
                    icon-name="utility:jump_to_left"
                    label="First"
                    alternative-text="first page"
                    onclick={firstPage}
                    class="slds-m-right_x-small">
                  </lightning-button>
                  <lightning-button
                    disabled={bDisableFirst}
                    icon-name="utility:chevronleft"
                    label="Previous"
                    alternative-text="Previous"
                    onclick={previousPage}
                    class="slds-m-right_x-small">
                  </lightning-button>
                  <span class="slds-badge slds-m-horizontal_x-small">
                    Showing {pageNumber} of {totalPages} Page(s)
                  </span>
                  <lightning-button
                    disabled={bDisableLast}
                    icon-name="utility:chevronright"
                    label="Next"
                    alternative-text="Next"
                    onclick={nextPage}
                    icon-position="right"
                    class="slds-m-left_x-small">
                  </lightning-button>
                  <lightning-button
                    disabled={bDisableLast}
                    icon-name="utility:jump_to_right"
                    label="Last"
                    alternative-text="last page"
                    onclick={lastPage}
                    icon-position="right"
                    class="slds-m-left_x-small">
                  </lightning-button>
                </div>
                <div class="slds-clearfix">
                  <div class="slds-float_right">
                    <span class="slds-badge">Total Records: {totalRecords}</span>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </template>
      </template>

      <template if:true={generatedflag}>
        <div style="padding: 1% 1% 0 2%; flex-shrink: 0;">
          <header class="bulk-action-header">
              <div class="table-title table-header">{participantPreferredName} Invoices</div>
              <div class="action-section" style="padding-bottom:1%; display:flex; gap:12px; align-items:center; flex-wrap:nowrap;">
                  <div style="min-width:180px;">
                      <div class="floating-label-new">
                          <span class="label-text-drop">Plan Type</span>
                          <lightning-combobox
                              value={invoicePlanType}
                              options={planTypeOptions}
                              onchange={handleInvoicePlanTypeChange}
                              variant="label-hidden">
                          </lightning-combobox>
                      </div>
                  </div>
                  <div style="min-width:200px;">
                      <div class="floating-label-new">
                          <span class="label-text-drop">{participantPreferredName}</span>
                          <c-tesseract-apps-multi-combobox
                              placeholder="Select Participants"
                              options={ParticipantOptions}
                              value={invoicePartcipantIdList}
                              onchange={handleInvoiceParticipantChange}>
                          </c-tesseract-apps-multi-combobox>
                      </div>
                  </div>
                  <template if:true={showExportCSV}>
                      <lightning-button
                          label="Export CSV"
                          title="Export CSV"
                          variant="brand"
                          onclick={handleExportCSV}
                          class="slds-m-left_small">
                      </lightning-button>
                  </template>
                  <lightning-button
                      variant="brand"
                      label="Bulk Action"
                      title="Bulk Action"
                      onclick={handleBulkInvoiceEmail}
                      disabled={disableBulkInvoice}>
                  </lightning-button>
              </div>
          </header>
        </div>
        
        <div class="slds-grow" style="min-height:0; display: flex; flex-direction: column; padding: 0 1% 1% 1%;">
          <template if:true={noRecordsInvoiceFlag}>
            <div class="no-data">
              <p>No records found</p>
            </div>
          </template>
          <template if:false={noRecordsInvoiceFlag}>
            <div class={tableContainerClass} style="min-height: 0; display: flex; flex-direction: column; flex: 1 1 auto;">
              <!-- HEADER -->
              <div class="header-wrapper">
                <table class="staff-table fixed-table">
                 <!--  <thead>
                    <tr>
                      <th class="table-th tableCheckbox">
                        <lightning-input
                          type="checkbox"
                          variant="label-hidden"
                          checked={isIssuedHeaderChecked}
                          onchange={handleSelectAllInvoices}>
                        </lightning-input>
                      </th>
                      <th class="table-th">Invoice No</th>
                      <th class="table-th">{participantPreferredName} Name</th>
                      <th class="table-th">Entity Name</th>
                      <th class="table-th">Ledger Item</th>
                      <th class="table-th">Date Generated</th>

                                          data-field="amount"
                                          onkeydown={handleQtyKeyDown}

                                          label="Amount"
                                          variant="label-hidden"

                                            data-field="Amount"

                                          </a>
                                      </div>
                                    </template>
                                    <template if:false={row.isEditingAmount}>

                                        <lightning-formatted-number
                                          value={row.amount}

                                          minimum-fraction-digits="2"
                                          maximum-fraction-digits="2"
                                          class="qty-value"

                                              <a

                                                data-field="Amount"
                                                title="Edit"

                                                <i class="material-icons edit-icon">edit</i>
                                              </a>
                                      </div>
                                    </template>
                                  </template>
                                  <template if:false={otherThanNdis}>

                                      <lightning-formatted-number
                                        value={row.amount}
                                        format-style="currency"
                                        currency-code="AUD"
                                        minimum-fraction-digits="2"
                                        maximum-fraction-digits="2"
                                      ></lightning-formatted-number>
                                    </template>
                                    <template if:true={Miscellaneous}>
                                      <template if:true={row.isEditingAmount}>
                                        <div class="qty-edit-container">
                                          <lightning-input
                                            type="number"
                                            step="0.01"
                                            min="0"
                                            value={row.amount}
                                            onchange={handleFieldChange}
                                            data-id={row.Id}
                                            data-field="amount"
                                            onkeydown={handleQtyKeyDown}
                                            class="qty-value"
                                            label="Amount"
                                            variant="label-hidden"
                                            style="width: 50%">
                                          </lightning-input>
                                        <a
                                              href="javascript:void(0)"
                                              data-id={row.Id}
                                              data-field="Amount"
                                              title="Save"
                                              onclick={handleSave}>
                                              <i class="material-icons save-icon">check</i>
                                            </a>
                                        </div>
                                      </template>
                                      <template if:false={row.isEditingAmount}>
                                        <div class="qty-edit-container">
                                          <lightning-formatted-number
                                            value={row.amount}
                                            format-style="currency"
                                            currency-code="AUD"
                                            minimum-fraction-digits="2"
                                            maximum-fraction-digits="2"
                                            class="qty-value"
                                          ></lightning-formatted-number>
                                          <a
                                            href="javascript:void(0)"
                                            data-id={row.Id}
                                            data-field="Amount"
                                            title="Edit"

                                            <i class="material-icons edit-icon">edit</i>
                                          </a>
                                        </div>
                                      </template>
                                    </template>
                                  </template>
                                </td>
                                <td class="table-td" title={row.serviceTotalAmount}>
                                  <lightning-formatted-number
                                    value={row.serviceTotalAmount}
                                    format-style="currency"
                                    currency-code="AUD"
                                    minimum-fraction-digits="2"
                                    maximum-fraction-digits="2">
                                  </lightning-formatted-number>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <template if:true={addServicePaginationVisible}>
                      <div class="fixed-pagination-addservice">
                        <div
                          class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
                        >
                          <!--RECORDS PER PAGE-->
                          <div class="slds-col">
                            <div class="slds-list_inline slds-p-bottom_xx-small">
                              <label
                                class="slds-text-color_weak slds-p-horizontal_x-small" style="margin-top: 4%;"
                                for="recordsPerPage"
                                >Page Size:</label
                              >
                              <div class="slds-select_container">
                                <select
                                  class="slds-select"
                                  id="recordsPerPage1"
                                  onchange={handleRecordsPerPage3}
                                >
                                  <template
                                    for:each={pageSizeOptions3}
                                    for:item="option"
                                  >
                                    <option key={option.value} value={option.value} selected={option.selected}>
                                      {option.label}
                                    </option>
                                  </template>
                                </select>
                              </div>
                            </div>
                          </div>

                          <!--PAGE NAVIGATION-->
                          <div class="slds-align_absolute-center" >
                            <lightning-button
                              disabled={bDisableFirst3}
                              icon-name="utility:jump_to_left"
                              label="First"
                              class="slds-p-horizontal_x-small"
                              alternative-text="first page"
                              onclick={firstPage3}
                            ></lightning-button>
                            <lightning-button
                              disabled={bDisableFirst3}
                              icon-name="utility:chevronleft"
                              label="Previous"
                              alternative-text="Previous"
                              onclick={previousPage3}
                            ></lightning-button>

                            <span class="slds-badge"
                              >Showing {pageNumber3} &nbsp;of&nbsp; {totalPages3}
                              &nbsp;&nbsp;Page(s)</span
                            >
                            &nbsp;
                            <lightning-button
                              disabled={bDisableLast3}
                              icon-name="utility:chevronright"
                              label="Next"
                              alternative-text="Next"
                              onclick={nextPage3}
                              class="slds-p-horizontal_x-small"
                              icon-position="right"
                            ></lightning-button>
                            <lightning-button
                              disabled={bDisableLast3}
                              icon-name="utility:jump_to_right"
                              label="Last"
                              alternative-text="last page"
                              onclick={lastPage3}
                              icon-position="right"
                            ></lightning-button>
                          </div>
                          <!--TOTAL RECORDS-->
                          <div class="slds-clearfix">
                            <div class="slds-float_right">
                              <span class="slds-badge">
                                Total Records: {totalRecords3}</span
                              >
                            </div>
                          </div>
                        </div>
                      </div>
                    </template> </template>
                  <!-- <br /> -->
              </div> 

              <footer class="slds-modal__footer"> 
                  <lightning-button 
                      variant="neutral" 
                      label="Cancel" 
                      onclick={cancelAddService}> 
                  </lightning-button> 

                  <lightning-button 
                      class="slds-m-left_small" 
                      variant="brand" 
                      label="Save" 
                      onclick={saveAddService}> 
                  </lightning-button> 
              </footer> 

          </div> 
        </section> 
        <div class="slds-backdrop slds-backdrop_open"></div> 
    </template> 
    <template if:true={showNoFundsModal}>

        <div class="slds-modal__container modal-custom1 "> 
        
          <!-- HEADER --> 
          <header class="slds-modal__header headercustom"> 
              <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom"> Please Confirm</h2> 
          </header>

  <template if:true={invoiceEmailFlag}>
      <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true" 
          class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
              <div class="slds-modal__container modal-container" style="max-width:25%;">
                  <header class="slds-modal__header" style="background: #002A52;">
                      <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align: center;">Please Confirm</h2>
                  </header>
                  <div class="slds-modal__content slds-p-around_medium" style="text-align: center;">
                      <div class="slds-m-around_small center-container-pop">
                          <div class="floating-label">
                              <span class="label-text-drop"><span style="color:red">*</span>To Address</span>
                              <lightning-input 
                                  type="text" 
                                  label="To Address"
                                  name="toAddress" 
                                  variant="label-hidden" 
                                  value={toAddress}
                                  onchange={handleEmailOnChange} 
                                  required>
                              </lightning-input>
                          </div>
                          <br/>
                          <div class="floating-label">
                              <span class="label-text-drop">Cc Address</span>
                              <lightning-input 
                                  type="text" 
                                  label="CC Address" 
                                  variant="label-hidden"
                                  name="ccAddress" 
                                  value={ccAddress}
                                  onchange={handleEmailOnChange} 
                                  required>
                              </lightning-input>
                          </div>
                          <br/>
                          <div class="floating-label">
                              <span class="label-text-drop">Email Subject</span>
                              <lightning-input
                                  name="emailSubject"
                                  label="Email Subject"
                                    variant="label-hidden"
                                  value={emailSubject}
                                  onchange={handleEmailOnChange}
                                  class="slds-m-bottom_small">
                              </lightning-input>
                          </div>  <br/>
                          <div class="custom-rich-text-container">
                              <span class="label-text-drop">Email Body</span>
                              <lightning-input-rich-text
                                  name="emailBody"
                                  value={emailBody}
                                  onchange={handleEmailOnChange}
                                  variant="label-hidden"
                                    class="rich-text-editor"
                                  >                        <!--class="slds-m-top_small"
                                  style="min-height: 250px;"-->
                              </lightning-input-rich-text>
                          </div>
                      <div class="button-container slds-p-around_small">

                          class="-m-around_x-small"></lightning-button>
                          <lightning-button label="Send Email" variant="brand" onclick={handleSendEmail}
                              class="-m-around_x-small"></lightning-button>
                      </div>
                  </div>
              </div>
          </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>

                <lightning-progress-bar value={progressValue} size="large"></lightning-progress-bar>

            <img src={imageUrl} alt="T Logo" class="Tlogo" />
          </div>

          <!-- Progress text instead of progress bar -->

      <template if:true={showGenerateInvoicePopup}>
          <section role="dialog" tabindex="-1" aria-modal="true"  class="slds-modal slds-fade-in-open">
              <div class="slds-modal__container modal-custom2">
                  <!-- HEADER -->
                  <header class="slds-modal__header headercustom">
                      <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">
                          Generate Invoice
                      </h2>
                  </header>

                  <!-- BODY -->
                  <div class="slds-modal__content slds-p-around_medium  custom-scroll">
                      <template for:each={groupedEntities}  for:item="entity">
                          <div  key={entity.entityId} class="slds-m-bottom_small">
                              <div class="entityHeader">
                                <lightning-input
                                    type="checkbox"
                                    checked={entity.checked}
                                    data-entityid={entity.entityId}
                                    onchange={handleEntitySelection}>    <!--  label={entity.entityLabel}-->
                                </lightning-input>
                                <span class="entityName">
                                    {entity.entityName}
                                </span>
                                <!-- <span class="entityType">
                                    (Entity Name)
                                </span> -->
                              </div>

                              <div class="table-container yourInvoiceTable1 slds-m-top_small">
                                  <div class="header-wrapper">
                                      <table class="staff-table fixed-table">
                                          <thead>
                                              <tr>
                                                <th class="table-th tableCheckbox">
                                                      <lightning-input
                                                          type="checkbox"
                                                          checked={entity.allSelected}
                                                          data-entityid={entity.entityId}
                                                          onchange={handleEntityServiceSelectAll}>
                                                      </lightning-input>
                                                  </th>
                                                  <th class="table-th"> Participant Name</th>
                                                  <th class="table-th"> Service Item Name</th>
                                                  <th class="table-th"> Service Item Number</th>
                                                  <th class="table-th"> Service Date</th>
                                                  <th class="table-th"> Amount</th>
                                              </tr>
                                          </thead>
                                      </table>
                                  </div>

                                  <div class="table-bodytotal">
                                      <table class="staff-table fixed-table">
                                          <tbody>
                                            <template for:each={entity.services} for:item="service">
                                                <tr key={service.Id}>
                                                    <td class="table-td tableCheckbox">
                                                        <lightning-input
                                                            type="checkbox"
                                                            checked={service.checked}
                                                            data-entityid={entity.entityId}
                                                            data-serviceid={service.Id}
                                                            onchange={handleServiceSelection}>
                                                        </lightning-input>
                                                    </td>

                                                    <td class="table-td" title={service.participantFullName}>{service.participantFullName}</td>
                                                    <td class="table-td" title={service.Support_Item_Name__c}>{service.Support_Item_Name__c}</td>
                                                    <td class="table-td" title={service.Lineitem__c}>{service.Lineitem__c}</td>
                                                    <td class="table-td">{service.ServiceDate}</td>
                                                    <td class="table-td">
                                                        <lightning-formatted-number
                                                            value={service.participantInvoiceAmount}
                                                            format-style="currency"
                                                            currency-code="AUD">
                                                        </lightning-formatted-number>
                                                    </td>
                                                 </tr>
                                             </template>
                                          </tbody>
                                      </table>
                                  </div>
                              </div>
        
                          </div>
                      </template>

                  </div>

                  <!-- FOOTER -->

                  <footer class="slds-modal__footer">
                      <!-- Left Side -->
                     <div class="invoice-note">
                          <!-- <strong>Note:</strong> Invoices will be generated <strong>Entity-wise</strong> and <strong>Participant-wise</strong> based on the selected records.   <br/>-->
                            <strong>Note: </strong>Services will be grouped by <strong>Entity</strong> and then by <strong>Participant</strong>. A separate invoice will be generated for each participant
                            within the selected entity.  <br/>
                            Click <strong>Confirm</strong> to generate the invoices or <strong>Cancel</strong> to review your selection.
                      </div>

                      <!-- Right Side -->
                     <div class="slds-text-align_right">
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            onclick={handleCloseGenerateInvoicePopup}>
                        </lightning-button>
                        <lightning-button
                            class="slds-m-left_small"
                            variant="brand"
                            label="Confirm"
                            onclick={handleGenerateSelectedInvoices}>
                        </lightning-button>
                      </div>
                  </footer>

              </div>
          </section>

          <div class="slds-backdrop slds-backdrop_open"></div>
      </template>
   
</template>
