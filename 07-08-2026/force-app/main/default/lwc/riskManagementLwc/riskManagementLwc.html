<template>
    <div>
        <lightning-button variant="brand" label="Risk Identification" title="Risk" slot="actions"
                            onclick={handleRiskManagement} class="slds-float_right slds-m-right_xx-large"></lightning-button>
    </div>
    <template if:true={isOpenModal}>
        <div class="blur-overlay"></div>
        <div  class="right-align fade-in" style="width:104%;">
            <div style="padding: 2% 2% 0 2%;">
                <!-- Risk Identification Header with Back Button -->
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <p style="font-weight: bold; font-size: 140%; margin-left: 2%;">Risk Identification</p>
                    <lightning-button label="Back" variant="brand" onclick={hideModalBox}></lightning-button>
                </div>
            
                <!-- New Section for Inputs (Attachment Name & Manual Handling) -->
                <div class="slds-p-around_medium">
                    <div class="container-box">
                        <div  class="toggle-bar"  onclick={handleSectionToggle} data-id="RiskDetails" style="cursor: pointer;">
                            <span>Risk</span>
                            <span>{sectionIcons.RiskDetails}</span>      
                        </div>
                        <div class="section-content" data-section="RiskDetails">
                            <template if:true={sectionFlags.RiskDetails}>    
                                <div class="slds-grid slds-wrap" style="padding-top: 20px;margin-left:20px;">            
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">     
                                        <lightning-checkbox-group 
                                            name="manualHandling" 
                                            label="Manual Handling"
                                            options={manualHandlingOptions}
                                            value={manualHandling}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>                  
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="mealManagement" 
                                            label="Meal Management"
                                            options={mealManagementOptions}
                                            value={mealManagement}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>
                                    <!-- Medical Conditions -->
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="medicalConditions" 
                                            label="Medical Conditions"
                                            options={medicalConditionsOptions}
                                            value={medicalConditions}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <!-- Behavioural & Mental Health -->
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="behaviouralMentalHealth" 
                                            label="Behavioural and Mental Health"
                                            options={behaviouralMentalHealthOptions}
                                           value={behaviouralMentalHealth}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="identificationLegal" 
                                            label="Identification Legal"
                                            options={identificationLegalOptions}
                                          value={identificationLegal}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <!-- Money Handling -->
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="moneyHandling" 
                                            label="Money Handling"
                                            options={moneyHandlingOptions}
                                            value={moneyHandling}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>                                    

                                    <!-- Environmental & Social -->
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="environmentalSocial" 
                                            label="Environmental & Social Needs"
                                            options={environmentalSocialOptions}
                                            value={environmentalSocial}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="riskyBehaviours" 
                                            label="Risky or Unsafe Behaviours"
                                            options={riskyBehavioursOptions}
                                           value={riskyBehaviours}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <!-- Relationships -->
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="relationships" 
                                            label="Relationships - Carer, Family Members, Other Support Providers"
                                            options={relationshipOptions}
                                          value={relationships}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="homeSupport" 
                                            label="Supports to be provided in Home Environment"
                                            options={homeSupportOptions}
                                             value={homeSupport}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="mobility" 
                                            label="Movement/Mobility"
                                            options={mobilityOptions}
                                           value={mobility}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="otherMedicalConditons" 
                                            label="Medical Conditions"
                                            options={medicalConditionsOption}
                                            value={otherMedicalConditons}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-checkbox-group 
                                            name="biological" 
                                            label="Biological/Infection Control"
                                            options={biologicalOptions}
                                           value={biological}
                                            onchange={handleSelection}>
                                        </lightning-checkbox-group>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input 
                                        name="livesAlone"
                                            type="checkbox" 
                                            label="Lives Alone with No Other Face-to-Face Services/Supports" 
                                            checked={livesAlone}
                                            onchange={handleSelection}>
                                        </lightning-input>
                                    </div>
                    
                                </div>
                            </template>
                        </div> 
                    </div>
                    <div class="container-box">
                        <div id="RiskManage" class="toggle-bar" onclick={handleSectionToggle} data-id="RiskManage">
                          <span>Risk Manage</span>
                          <span style="cursor: default;">{sectionIcons.RiskManage}</span>    
                        </div>
                    </div>
                    <div class="section-content" data-section="RiskManage">
                        <div class="section-content" data-section="RiskManage">
                            <div style="overflow-x: auto;">
                                <div style="margin-left:0%;width:100%;margin-top:1.5%">
                                    <table class="slds-table" style="table-layout: fixed;">
                                        <thead>
                                            <tr class="slds-text-title_bold">
                                                <th class="th">Area</th>
                                                <th>Risks Identified</th>
                                                <th class="slds-cell-wrap th">Impact on Whom</th>
                                                <th class="slds-cell-wrap th">Likelihood</th>
                                                <th class="slds-cell-wrap th">Consequences</th>
                                                <th class="slds-cell-wrap th">Risk Index</th>
                                                <th class="slds-cell-wrap th">Risk Management Strategy</th>
                                                <th class="slds-cell-wrap th" style="width:13%;">Plan</th>
                                                <th class="slds-cell-wrap th">Person Responsible</th>
                                                <th class="slds-cell-wrap th">Date Completed</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={selectedCategories} for:item="row">
                                                <tr key={row.category}>
                                                    <td title={row.area}>{row.area}</td>
                                                    <!-- <td class="slds-cell-wrap description">{row.category}</td> -->

                                                    <td class="description" title={row.category}>
                                                        {row.category}
                                                        <template if:true={row.isOtherSelected}>
                                                             -{row.otherText}
                                                            <!-- <lightning-input type="text" 
                                                                data-id={row.category} 
                                                                data-field="otherRisk" 
                                                                value={row.otherText} 
                                                                placeholder="Enter other risk" 
                                                                onchange={handleInputChange}>
                                                            </lightning-input> -->
                                                        </template>
                                                    </td>

                                                    <td class="slds-cell-wrap">
                                                        <lightning-combobox data-id={row.category} data-area={row.area} data-field="impact"
                                                            options={impactOptions} value={row.impact} 
                                                            onchange={handleInputChange}>
                                                        </lightning-combobox>
                                                    </td>
                                            
                                                    <td class="slds-cell-wrap">
                                                        <lightning-combobox data-id={row.category} data-field="likelihood"
                                                            options={likelihoodOptions} value={row.likelihood} 
                                                            onchange={handleInputChange}>
                                                        </lightning-combobox>
                                                    </td>
                                            
                                                    <td class="slds-cell-wrap">
                                                        <lightning-combobox data-id={row.category} data-field="consequences"
                                                            options={consequencesOptions} value={row.consequences} 
                                                            onchange={handleInputChange}>
                                                        </lightning-combobox>
                                                    </td>
                                            
                                                    <td class="slds-cell-wrap">
                                                        <lightning-input type="text" data-id={row.category} data-field="riskRating"
                                                            value={row.riskRating} disabled>
                                                        </lightning-input>
                                                    </td>
                                            
                                                    <td class="slds-cell-wrap">
                                                        <lightning-input type="text" data-id={row.category} data-field="strategy" 
                                                            value={row.strategy} onchange={handleInputChange}>
                                                        </lightning-input>
                                                    </td>
                                            
                                                    <td class="slds-cell-wrap">
                                                        <lightning-input type="file"  data-uniqueid={row.uniqueId} name="file" variant="label-hidden"  onchange={handleDocumentchange}  style="width:2%"></lightning-input>
                                                       
                                                        <div class="slds-text-body_small">{row.fileName}
                                                            <template if:true={showSpinner}>
                                                                <lightning-spinner alternative-text="Uploading the file......" size="medium">
                                                                </lightning-spinner>
                                                            </template>

                                                            <template if:true={isattachError}>
                                                                <p style="color:red">File Size Cannot exceed 512MB</p>
                                                            </template>
                                                        </div>
                                                    </td>
                                            
                                                    <td class="slds-cell-wrap">
                                                        <lightning-input type="text" data-id={row.category} data-field="responsiblePerson" 
                                                            value={row.responsiblePerson} onchange={handleInputChange}>
                                                        </lightning-input>
                                                    </td>
                                            
                                                    <td class="slds-cell-wrap">
                                                        <lightning-input type="date" data-id={row.category} data-field="dateCompleted" 
                                                            value={row.dateCompleted} onchange={handleInputChange}>
                                                        </lightning-input>
                                                    </td>
                                                </tr>
                                            </template>                                              
                                            
                                        </tbody>
                                    </table>
                                </div>
                                <div class="slds-align_absolute-center slds-m-around_small">
                                    <lightning-button label="Save" variant="brand" class="slds-m-around_small" onclick={handleSave} disabled={isSaveDisabled}></lightning-button>
                                    <lightning-button label="Cancel" variant="brand-outline" onclick={hideModalBox} class="slds-m-around_small"></lightning-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </template>
</template>
