<template>
  <div class="checklist-wrapper">

    <!-- ===================== TOP HEADER ===================== -->
    <div class="top-header">
      <div class="header-left">
        <span class="section-title">Checklist</span>
      </div>
       <template if:false={hideActions}>
        <div class="header-right">
          <lightning-button
            variant="brand"
            label="Add Checklist"
            icon-name="utility:add"
            onclick={openAddPopup}>
          </lightning-button>
        </div>
      </template>
    </div>

    <!-- ===================== TABLE ===================== -->
    <div class="table-wrapper">
      <div class="table-container checklistTable">

          <!-- HEADER -->
          <div class="header-wrapper">
            <table class={tableGridClass}>
              <thead>
                <tr>
                  <th title="Description">Description</th>
                  <th title="Mandatory">Mandatory</th>
                  <th title="Created By">Created By</th>
                  <th title="Updated By">Updated By</th>
                  <th title="Last Updated Date &amp; Time">Last Updated Date &amp; Time</th>
                  <template if:false={hideActions}>
                     <th class="center" title="Actions">Actions</th>
                  </template>
                 
                </tr>
              </thead>
            </table>
          </div>

          <!-- BODY -->
          <div class="custom-scroll checklistTableHeight">
            <table class={tableGridClass}>
              <tbody>
                <template if:true={checklistItems.length}>
                  <template for:each={checklistItems} for:item="item">
                    <tr key={item.key}>
                      <td title={item.Description__c}>{item.Description__c}</td>
                      <td title={item.mandatoryLabel}>{item.mandatoryLabel}</td>
                      <td title={item.createdBy}>{item.createdBy}</td>
                      <td title={item.updatedBy}>{item.updatedBy}</td>
                      <td title={item.lastUpdated}>{item.lastUpdated}</td>
                    <template if:false={hideActions}>
                      <td class="table-td center action-cell">
                        <a href="javascript:void(0);"
                          data-key={item.key}
                          onclick={openEditPopup}
                          title="Edit"
                          class="icon-link">
                          <i class="material-icons edit-icon">edit</i>
                        </a>
                        <a href="javascript:void(0);"
                          data-key={item.key}
                          onclick={openDeleteConfirm}
                          title="Delete"
                          class="icon-link">
                          <i class="material-icons delete-icon">delete</i>
                        </a>
                      </td>
                      </template>
                    </tr>
                  </template>
                </template>

                <template if:false={checklistItems.length}>
                  <tr>
                    <td colspan="6" class="no-data">
                      No records found.
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
      </div>

      <!-- ===================== PAGINATION ===================== -->
      <template if:true={checklistItems.length}>
        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination">

          <!-- RECORDS PER PAGE -->
          <div class="slds-col">
            <div class="slds-list_inline">
              <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
              <label class="slds-text-color_weak" for="checklistRecordsPerPage"></label>
              <div class="slds-select_container">
                <select class="slds-select" id="checklistRecordsPerPage" onchange={handleRecordsPerPage}>
                  <template for:each={pageSizeOptions} for:item="option">
                    <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                  </template>
                </select>
              </div>
            </div>
          </div>

          <!-- PAGE NAVIGATION -->
          <div class="slds-align_absolute-center">
            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button>
            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
            &nbsp;
            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
            &nbsp;
            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
          </div>

          <!-- TOTAL RECORDS -->
          <div class="slds-clearfix">
            <div class="slds-float_right">
              <span class="slds-badge"> Total Records: {totalRecords}</span>
            </div>
          </div>

        </div>
      </template>

    </div>

    <!-- ===================== ADD / EDIT DESCRIPTION POPUP ===================== -->
    <template if:true={showAddEditPopup}>
      <div ></div>
      <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container" style="max-width: 32%;">

          <header class="slds-modal__header headercustom">
            <h2 class="slds-text-heading_medium slds-hyphenate h2custom">
              {popupTitle}
            </h2>
          </header>

          <div class="slds-modal__content slds-p-around_medium">

            <!-- Mandatory Checkbox -->
            <div class="slds-m-bottom_medium">
                <lightning-input
                    type="checkbox"
                    label="Mandatory"
                    checked={isMandatory}
                    onchange={handleMandatoryChange}>
                </lightning-input>
            </div>
            <!-- Description -->
            <lightning-textarea
              label="Description"
              value={descriptionDraft}
              max-length="50"
              onchange={handleDescriptionChange}
              placeholder="Enter checklist description">
            </lightning-textarea>
          </div>

          <footer class="slds-modal__footer">
            <lightning-button
              variant="neutral"
              label="Cancel"
              onclick={closeAddEditPopup}>
            </lightning-button>
            <lightning-button
              variant="brand"
              label={saveButtonLabel}
              class="slds-m-left_small"
              onclick={saveDescription}>
            </lightning-button>
          </footer>

        </div>
      </section>
      <!-- <div class="slds-backdrop slds-backdrop_open"></div> -->
    </template>

    <!-- ===================== DELETE CONFIRM ===================== -->
    <template if:true={showDeleteConfirm}>
        <section
            aria-describedby="checklist-delete-content"
            aria-labelledby="checklist-delete-heading"
            aria-modal="true"
            class="slds-modal slds-fade-in-open"
            role="dialog"
            tabindex="-1" style="z-index: 9999;"
        >
            <div
                class="slds-modal__container modal-container"
                style="max-width: 25%;"
            >

                <!-- HEADER -->
                <header
                    class="slds-modal__header"
                    style="background: #002a52;"
                >
                    <h2
                        id="checklist-delete-heading"
                        class="slds-text-heading_medium slds-hyphenate"
                        style="
                            color: white;
                            font-weight: bold;
                            text-align: center;
                        "
                    >
                        Delete
                    </h2>
                </header>

                <!-- CONTENT -->
                <div
                    id="checklist-delete-content"
                    class="slds-modal__content slds-p-around_medium modal-content"
                >
                    <div
                        class="slds-m-around_small"
                        style="text-align: center;"
                    >

                        <!-- MESSAGE -->
                        <div>
                            <p style="text-align: center;">
                                Are you sure you want to delete this checklist item?
                            </p>
                        </div>

                        <!-- BUTTONS -->
                        <div class="button-container slds-m-top_medium">

                            <lightning-button
                                label="No"
                                variant="brand"
                                onclick={closeDeleteConfirm}
                                class="slds-m-around_small"
                            >
                            </lightning-button>

                            <lightning-button
                                label="Yes"
                                variant="brand"
                                onclick={confirmDelete}
                                class="slds-m-around_small"
                            >
                            </lightning-button>

                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- BACKDROP -->
        <!-- <div class="slds-backdrop slds-backdrop_open"></div> -->
    </template>

  </div>

  <template if:true={isShowSpinner}>
    <div class="overlay-logo"></div>

    <div class="spinner-wrapper">
      <div class="loader-container">
        <img
          src={logoUrl}
          alt="Breathing Frame"
          class="breathing-frame"
        />
        <img src={imageUrl} alt="T Logo" class="Tlogo" />
      </div>

      <!-- Progress text instead of progress bar -->
      <p class="progress-text">Loading<br />Please Wait...</p>
    </div>
  </template>  
</template>
