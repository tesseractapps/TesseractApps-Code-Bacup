<template>
    <div style="width:100%;">
        <div class="fade-in rotate right-align" style="width:85%;">
            <div class="container">
                <div class="header">Create Staff</div>
                <div class="container-box">
                    <div id="staff-details" class="toggle-bar">
                      <span id="staff-details-text">Participant Details</span>
                      <span onclick={handleSectionToggle} data-id="staffDetails">{sectionIcons.staffDetails}</span>      
                    </div>
                    <template if:true={sectionFlags.staffDetails}>
                        <div class="slds-grid slds-wrap" style="padding: 0 20px 20px 20px;">
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4" >
                                <div class="date-input-container">
                                    <label class="floating-label">
                                      <span class="label-text">First Name</span>
                                      <input type="text" name="firstName" value={clientData.firstName} required="True" onchange={handleInputChange} class="styled-date-input" />
                                    </label>
                                  </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                <div class="date-input-container">
                                    <label class="floating-label">
                                      <span class="label-text">LastName</span>
                                      <input type="text" name="lastName" value={clientData.lastName} onchange={handleInputChange} class="styled-date-input" />
                                    </label>
                                  </div>
                            </div>
                            
                           <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                <div>
                                    <lightning-combobox label="Gender" name="gender" required options={genderOptions} value={clientData.gender} onchange={handleInputChange} style="width:90%;"></lightning-combobox>
                                </div>
                            </div> 
                           
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                <div >
                                    <lightning-combobox label="State" name="state" required options={stateOptions} value={clientData.state} onchange={handleInputChange} style="width:90%;"></lightning-combobox>
                                </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                <div class="date-input-container">
                                    <label class="floating-label">
                                      <span class="label-text">Contact Number</span>
                                      <input type="text" name="contactNumber" value={clientData.contactNumber} onchange={handleInputChange} class="styled-date-input" />
                                    </label>
                                  </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                <div class="date-input-container">
                                    <label class="floating-label">
                                      <span class="label-text">Driver's Licence</span>
                                      <input type="text" name="driversLicence" value={clientData.driversLicence} onchange={handleInputChange} class="styled-date-input" />
                                    </label>
                                  </div>
                            </div>
                            
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                <div class="date-input-container" >
                                    <label class="floating-label">
                                      <span class="label-text">Date of Birth</span>
                                      <input type="date" name="dateOfBirth" value={clientData.dateOfBirth} onchange={handleInputChange} class="styled-date-input"  style="width:138%;"/>
                                    </label>
                                  </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                
                                <div class="date-input-container">
                                    <label class="floating-label">
                                      <span class="label-text">Email</span>
                                      <input type="text"  name="emailAddress" value={clientData.emailAddress} onchange={handleInputChange} class="styled-date-input"/>
                                    </label>
                                  </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                
                                <div>
                                <label style="display: flex;gap:2%;padding-top:10%;">
                                     <input type="checkbox" name="status" value={clientData.status} onchange={handleInputChange}  />
                                      <span>Status</span>
                                </label>  
                                    
                                  </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                <div >
                                    <lightning-combobox label="Facility" name="facility" required options={facilityOptions} value={clientData.facility} onchange={handleInputChange} style="width:90%;"></lightning-combobox>
                                </div>
                            </div>
                            
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                <div>
                                    <lightning-input 
                                        type="file" 
                                        onchange={onFileUpload} 
                                        accept=".jpg, .jpeg, .png, .gif" 
                                        name="uploadFile" 
                                        label="Upload Profile Picture" >
                                    </lightning-input>
                                    <div class="slds-text-body_small">{fileName}</div>
                                </div>
                            </div>
                            
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>    
</template>
