<template>
  <div class="main-container">
    <template if:true={isHome}>
    <div class="slds-grow slds-scrollable_y custom-scroll" style="min-height:0;">
      <div if:false={signInSignOut}></div>
      <div class="container-box" style="margin-top: 1%">
        <span style="font-size: medium; font-weight: bold">Shift Details</span>
        <div style="float: right" class="slds-size_1-of-4">
          <span style="margin-right: 10px">
            <lightning-button-icon
              icon-name="utility:left"
              onclick={navigateToPrevious}
            ></lightning-button-icon>
          </span>
          <span style="margin-right: 10px">
            <lightning-button
              label="Today"
              onclick={navigateToToday}
            ></lightning-button>
          </span>
          <span>
            <lightning-button-icon
              icon-name="utility:right"
              onclick={navigateToNext}
            ></lightning-button-icon>
          </span>
          <span style="float: right">
            <lightning-input
              label="Date"
              type="date"
              name="select-date"
              variant="label-hidden"
              value={datePickerString}
              onchange={navigateToDay}
              style="width: 130px"
            >
            </lightning-input>
          </span>
        </div>
        <!-- <div style="width:1200px;height:auto; margin-top:30px;"> 
                      <lightning-datatable key-field="Id" data={signinList} columns={columns} column-width-mode="fixed"  onrowselection={handleSelected} max-row-selection="1" ></lightning-datatable>
                  </div> -->
        <template if:false={noRecordsFlag}>
          <div style="margin-top: 2.5%; overflow-y: auto; max-height: 400px;" class="custom-scroll shiftTable">
            <div class="header-wrapper"> 
            <table class="staff-table">
              <thead>
                <tr>
                  <th class="table-th" title="Select">Select</th>
                  <th class="table-th" title="Location">Location</th>
                  <th class="table-th" title="Date">Date</th>
                  <th class="table-th" title="Start Time">Start Time</th>
                  <th class="table-th" title="End Time">End Time</th>
                  <th class="table-th" title="Role">Role</th>
                  <th class="table-th" title={facilityPreferredName}>{facilityPreferredName}</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={signinList} for:item="list">
                  <tr key={list.Id} class="tr1 table-row">
                    <td class="table-td" title="Select">
                      <lightning-input
                        type="radio"
                        name="rowSelection"
                        data-id={list.Id}
                        checked={list.isSelected}
                        onchange={handleSelected}
                      ></lightning-input>
                    </td>
                    <td class="table-td" title={list.Shift_Locations__c}>{list.Shift_Locations__c}</td>
                    <td class="table-td" title={list.uidate}>{list.uidate}</td>
                    <td class="table-td" title={list.Start_time_Formula__c}>{list.Start_time_Formula__c}</td>
                    <td class="table-td" title={list.End_time_formula__c}>{list.End_time_formula__c}</td>
                    <td class="table-td" title={list.Role_formula__c}>{list.Role_formula__c}</td>
                    <td class="table-td" title={list.Add_Shift__r.Facility__r.Name}>{list.Add_Shift__r.Facility__r.Name}</td>
                  </tr>
                </template>
              </tbody>
            </table>
            </div>
          </div>

        <div class="slds-grid slds-wrap" style="margin: 1% 0 0 5%">
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          >
            <b style="font-size: medium">Location:&nbsp;</b>{Location}
          </div>
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          >
            <b style="font-size: medium">Start Time:&nbsp;</b>{startTime}
          </div>
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          >
            <b style="font-size: medium">End Time:&nbsp;</b>{endtime}
          </div>
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          >
            <b style="font-size: medium">Date:&nbsp;</b>{DateShift}
          </div>
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          >
            <b style="font-size: medium">Role:&nbsp;</b>{role}
          </div>
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          >
            <b style="font-size: medium">{facilityPreferredName}:&nbsp;</b
            >{facility}
          </div>
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          >
            <b style="font-size: medium">{participantPreferredName}:&nbsp;</b
            >{participant}
          </div>
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          >
            <b style="font-size: medium">Status:&nbsp;</b>{status}
          </div>
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          >
            <span style="white-space: normal; word-wrap: break-word"
              ><b style="font-size: medium">Shift Notes:&nbsp;</b>{shiftNotes}
            </span>
          </div>
          <div
            class="slds-size_1-of-2 slds-m-bottom_medium slds-text-align_left"
          ></div>
          <div class="slds-grid slds-wrap slds-m-top_medium">
            <lightning-button
              label="Checklist"
              variant="brand"
              onclick={HandlegetCheckLIst}
              disabled={disableChecklistButtons}
              style="margin-right: 1rem"
            ></lightning-button>
            <lightning-button
              label="Shift Notes"
              variant="brand"
              onclick={HandleActivityLog}
               disabled={disableChecklistButtons}
              style="margin-right: 1rem"
            ></lightning-button>
            <lightning-button
              label="Journal"
              variant="brand"
              onclick={handleClientjournal}
               disabled={disableChecklistButtons}
              style="margin-right: 1rem"
            ></lightning-button>
            <!-- <lightning-button label="Sign in" variant="brand" onclick={handleSigninTime} style="margin-right: 1rem;" disabled={bDisable}></lightning-button>
                        <lightning-button label="Sign out" variant="brand" onclick={handleSignOutTime} disabled={signoutDisable} style="margin-right: 1rem;"></lightning-button> -->
            <template if:true={isSigninVisible}>
              <lightning-button
                label="Sign in"
                variant="brand"
                onclick={handleSigninTime}
                style="margin-right: 1rem"
                disabled={bDisable}
              ></lightning-button>
            </template>
            <template if:true={isBreakinVisible}>
              <lightning-button
                label="Break in"
                name="breakIn"
                variant="brand"
                onclick={handleBreakTime}
                style="margin-right: 1rem"
                disabled={breakInDisable}
              ></lightning-button>
            </template>

            <template if:true={isBreakoutVisible}>
              <lightning-button
                label="Break out"
                name="breakout"
                variant="brand"
                onclick={handleBreakTime}
                disabled={breakOutDisable}
                style="margin-right: 1rem"
              ></lightning-button>
            </template>
            <template if:true={isSignoutVisible}>
              <lightning-button
                label="Sign out"
                variant="brand"
                onclick={handleSignOutTime}
                disabled={signoutDisable}
                style="margin-right: 1rem"
              ></lightning-button>
            </template>
            <lightning-input
              type="checkbox"
              label="Request Sign in"
              name="signIn"
              onchange={handleSignInReQUest}
              style="margin-right: 1rem"
              disabled={requestSignDisbale}
            ></lightning-input>
            <lightning-input
              type="checkbox"
              label="Request Sign out"
              name="signOut"
              onchange={handleSignOutReQUest}
              checked={requestSignOut}
              style="margin-right: 1rem"
              disabled={requestSignOutDisbale}
            ></lightning-input>
          </div>
        </div>
      </template>
      <template if:true={noRecordsFlag}>
        <div class="no-data">
          <p>No records found</p>
        </div>
      </template>

      <template if:true={shiftnotesTemplate}>
        <section
          aria-describedby="modal-content-id-1"
          aria-labelledby="modal-heading-01"
          aria-modal="true"
          class="slds-modal slds-fade-in-open"
          role="dialog"
          tabindex="-1"
        >
          <div class="slds-modal__container" style="max-width: 40%">
            <header class="slds-modal__header" style="background: #002a52">
              <h2
                id="modal-heading-01"
                class="slds-text-heading_medium slds-hyphenate modal-title"
                style="color: white; font-weight: bold; text-align: center"
              >
                Please Confirm
              </h2>
              <!-- <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare" size="medium"
                                    onclick={handleShiftNotesTemplateClose} class="custom-close-icon" 
                                    style="position: absolute; top: 10px; right: 15px; --slds-c-icon-color-foreground: white;">
                                </lightning-button-icon> -->
            </header>

            <div
              class="slds-modal__content slds-p-around_medium modal-content custom-scroll"
              id="modal-content-id-1"
            >
              <!-- Activity Section -->
              <template if:true={isShowActivityinReview}>
                <div class="container-box">
                  <div class="toggle-bar">
                    <b> <span>Activity:</span></b>
                  </div>
                  <div
                    class="slds-theme_default slds-m-bottom_small reviewActivity"
                  >
                    <template if:true={finalReviewActivity}>
                      <template
                        for:each={finalReviewActivity}
                        for:item="activity"
                      >
                        <div key={activity.Id}>
                          <p>{activity.serialNumber}. {activity.Notes__c}</p>
                        </div>
                      </template>
                    </template>
                  </div>
                </div>
              </template>

              <template if:true={isShowChecklsitinReview}>
                <div class="container-box">
                  <div class="toggle-bar">
                    <b><span>Checklist:</span> </b>
                  </div>

                  <div class="checklist-container">
                    <template for:each={checklistData} for:item="check">
                      <div key={check.Id} class="checklist-item">
                        <!-- <template if:true={check.isCompleted}>
                          <lightning-icon
                            icon-name="action:approval"
                            alternative-text="approval"
                            size="xx-small"
                            title="Completed"
                            class="icon-approved"
                          ></lightning-icon>
                        </template>
                        <template if:false={check.isCompleted}>
                          <lightning-icon
                            icon-name="utility:circle"
                            alternative-text="circle"
                            size="medium"
                            title="circle"
                          ></lightning-icon>
                        </template> -->
                        <template if:true={check.isCompleted}>
                          <span
                            class="material-icons icon-approved"
                            title="Checked"
                          >
                            check_circle
                          </span>
                        </template>
                        <template if:false={check.isCompleted}>
                          <span class="material-icons" title="Uncheck">
                            circle
                          </span>
                        </template>

                        <span class="mandatory-mark" if:true={check.isMandatory}
                          >*
                        </span>
                        <span class="checklist-description"
                          >{check.description}</span
                        >
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <template if:true={isExtentedShift}>
                <div style="justify-content: flex-end; margin-top: 18px">
                  <div style="text-align: center">
                    <p>
                      Your late sign out will be recorded as an extended shift.
                    </p>

                    <p>Do you wish to continue?</p>
                  </div>
                  <div class="button-container1">
                    <template if:true={isExtentedShift}>
                      <lightning-button
                        label="No,Sign Out"
                        variant="brand"
                        onclick={handleeditClose}
                        class="slds-m-around_small"
                        style="margin-left: 2rem"
                      ></lightning-button>
                      <lightning-button
                        label="Review Extension"
                        variant="brand"
                        onclick={handleExtendedShiftReview}
                        class="slds-m-around_small"
                      ></lightning-button>
                    </template>
                  </div>
                </div>
              </template>
              <template if:true={extendedShiftDetailsFlag}>
                <div class="shift-container">
                  <!-- Shift Details Section -->
                  <div class="shift-details">
                    <b>Shift End Time:&nbsp;</b>{endtime} <br />
                    <b>Shift Duration(hh:mm):&nbsp;</b>{AddShiftDuartion} <br />
                    <b>Extended Duration(hh:mm):&nbsp;</b
                    >{extendedDurationFormatted} <br />
                  </div>

                  <!-- Comment Box Section -->
                  <div class="comment-box">
                    <lightning-textarea
                      name="ExtendedComments"
                      label="Comments:"
                      variant="label-hidden"
                      placeholder="Comments"
                      value={extendedComments}
                      onchange={handleReasons}
                    >
                    </lightning-textarea>
                  </div>
                </div>

                <template if:false={sleepoverTemplate}>
                  <div class="button-container1">
                    <lightning-button
                      label="Cancel"
                      variant="brand"
                      onclick={handleShiftNotesTemplateClose}
                      class="slds-m-around_small"
                      style="margin-left: 2rem"
                    ></lightning-button>
                    <lightning-button
                      label="Yes,Sign Out"
                      variant="brand"
                      onclick={handleeditClose}
                      class="slds-m-around_small"
                    ></lightning-button>
                  </div>
                </template>
              </template>

              <div if:true={sleepoverTemplate}>
                <template if:true={LoghoursButtontemplate}>
                  <div style="margin-left: 11px; text-align: center">
                    <b
                      ><h1>
                        Were you occupied with work during the sleepover shift?
                      </h1>
                    </b>
                  </div>
                </template>

                <template if:true={logSleepoverHours}>
                  <div class="slds-m-around_medium">
                    <!-- Use SLDS Grid for Side-by-Side Layout -->
                    <div class="slds-grid slds-gutters slds-wrap">
                      <!-- Hours Dropdown (Half Width) -->
                      <div class="slds-col slds-size_1-of-2">
                        <div class="floating-label-new">
                          <span class="label-text-drop">Select Hours</span>
                          <lightning-combobox
                            variant="label-hidden"
                            value={selectedHours}
                            options={generateHoursOptions}
                            onchange={handleHoursChange}
                          >
                          </lightning-combobox>
                        </div>
                      </div>

                      <!-- Minutes Dropdown (Half Width) -->
                      <div class="slds-col slds-size_1-of-2">
                        <div class="floating-label-new">
                          <span class="label-text-drop">Select Minutes</span>
                          <lightning-combobox
                            variant="label-hidden"
                            label="Select Minutes"
                            value={selectedMinutes}
                            options={generateMinutesOptions}
                            onchange={handleMinutesChange}
                          >
                          </lightning-combobox>
                        </div>
                      </div>
                    </div>

                    <!-- Display Converted Hours -->
                    <p class="slds-m-top_medium">
                      <strong>Night Shift Hours(hh:mm): </strong>
                      {SleepoverShiftFormattedHours} <br />
                      <!--  <strong>Final Shift Hours: </strong> {FinalShiftDuartion} -->
                    </p>
                    <div style="margin-top: 10px">
                      <lightning-textarea
                        name="nightShiftHourComents"
                        variant="label-hidden"
                        placeholder="Comments"
                        validity={nightShiftHourComments}
                        onchange={handleReasons}
                      ></lightning-textarea>
                    </div>
                  </div>
                </template>
                <div class="button-container1">
                  <template if:true={LoghoursButtontemplate}>
                    <lightning-button
                      label="Yes,Log Work Hours"
                      variant="brand"
                      onclick={handleSleepoverLogHours}
                      class="slds-m-around_small"
                      style="margin-left: 2rem"
                    ></lightning-button>
                    <lightning-button
                      variant="brand"
                      label="No,Sign Out"
                      onclick={handleeditClose}
                      class="slds-m-around_small"
                    ></lightning-button>
                  </template>
                  <template if:true={sleepOverFinalLogOut}>
                    <lightning-button
                      label="Sign Out"
                      variant="brand"
                      onclick={handleeditClose}
                      class="slds-m-around_small"
                      style="margin-left: 2rem"
                    ></lightning-button>
                    <lightning-button
                      variant="brand"
                      label="Cancel"
                      onclick={handleShiftNotesTemplateClose}
                      class="slds-m-around_small"
                    ></lightning-button>
                  </template>
                </div>
              </div>
              <template if:true={addShiftNotes}>
                <div style="justify-content: flex-end; margin-top: 18px">
                  <div style="text-align: center">
                    <h1>Are you sure you want to sign Out?</h1>
                  </div>

                  <div class="button-container1">
                    <lightning-button
                      label="Cancel"
                      variant="outline"
                      onclick={handleShiftNotesTemplateClose}
                      class="slds-m-around_small"
                    ></lightning-button>
                    <lightning-button
                      label="Yes, Sign Out"
                      variant="brand"
                      onclick={handleeditClose}
                      class="slds-m-around_small"
                    ></lightning-button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
      </template>
    </div>
    <template if:false={noRecordsFlag}>
      <div class="container-box">
        <div class="toggle-bar">
          <span>Reimbursement</span>
        </div>
        <div class="slds-grid slds-gutters" style="padding: 1%">
          <div
            class="slds-col"
            style="
              margin-left: 10px;
              width: 100px;
              height: 180px;
              padding: 50px;
              background: var(--medium-Light-Grey, #dfdce3);
            "
          >
            <span>
              <lightning-input
                type="file"
                label="Upload Attachment"
                variant="brand"
                disabled={attachDisable}
                onchange={onFileUpload}
              ></lightning-input>
            </span>
          </div>

          <div class="slds-col">
            <span>
              <!-- <lightning-input type="number"  step=".01" value={others} label="Mileage in Km's" name="others" onchange={handleChange}></lightning-input> -->
              <lightning-combobox
                name="vehicle"
                label="Type of Vehicle"
                value={vehicleValue}
                placeholder="Select Type of Vehicle"
                options={vehicleOptions}
                onchange={handleChange}
              ></lightning-combobox>
              <lightning-input
                type="number"
                step=".01"
                value={amount}
                label="Amount"
                name="Amount"
                onchange={handleChange}
                max-row-selection="1"
              ></lightning-input>
            </span>
          </div>
          <div class="slds-col">
            <span>
              <lightning-input
                type="number"
                step=".01"
                value={others}
                label="Mileage in Km's"
                name="others"
                onchange={handleChange}
              ></lightning-input>
              <lightning-textarea
                name="comment"
                label="Comments:"
                onchange={handleChange}
                value={comments}
                required="true"
              ></lightning-textarea>
            </span>
            <span style="float: right; margin-top: 37px">
              <lightning-button
                variant="brand"
                label="Send for Approval"
                title="Send for Approval"
                onclick={onSubmitForApproval}
                disabled={attachDisable}
                class="slds-m-left_large"
              >
              </lightning-button>
            </span>
          </div>
        </div>
        <br /><br />
        <div class="slds-text-body_small">
          {fileName}
          <template if:true={showSpinner}>
            <lightning-spinner
              alternative-text="Uploading the file......"
              size="medium"
            >
            </lightning-spinner>
          </template>
        </div>
      </div>
    </template>
    </div>
    </template>
    <template if:false={isHome}>
       <template if:false={isFileViewOpen}>
      <div style="display:flex;justify-content: flex-end;padding:1%;">
        <lightning-button
              label="Create journal"
              variant="brand"
              onclick={handleJournal}
              style="margin-right: 1rem">
        </lightning-button>
         <lightning-button
              label="Back"
              variant="brand"
              onclick={handleBack}
            ></lightning-button>
            
            </div>
      <div class="participantJournalContainer">
       <div class="table-container participantJournalTable">

    <!-- HEADER -->
    <div class="header-wrapper">
        <table class="staff-table" role="table">

            <thead>
                               <th class="table-th sortable-header"
                    title="Type"
                    data-field="Care_Notes__c"
                    onclick={handleSort}> Type
                  <!--   <div class="sort-header-inner">
                        <span class="sort-label">Type</span>
                        <span class="sort-arrow" data-arrow={sortIcons.Care_Notes__c}></span>
                    </div> -->
                </th>

                <th class="table-th sortable-header"
                    title="Description"
                    data-field="descriptionPreview"
                    onclick={handleSort}>Description
                   <!--  <div class="sort-header-inner">
                        <span class="sort-label">Description</span>
                        <span class="sort-arrow" data-arrow={sortIcons.descriptionPreview}></span>
                    </div> -->
                </th>

                 <th class="table-th sortable-header"
                    title="Description"
                    data-field="descriptionPreview"
                    onclick={handleSort}>Participant
                   <!--  <div class="sort-header-inner">
                        <span class="sort-label">Description</span>
                        <span class="sort-arrow" data-arrow={sortIcons.descriptionPreview}></span>
                    </div> -->
                </th>

                <th class="table-th sortable-header"
                    title="Created By"
                    data-field="createdname"
                    onclick={handleSort}>Created By
                   <!--  <div class="sort-header-inner">
                        <span class="sort-label">Created By</span>
                        <span class="sort-arrow" data-arrow={sortIcons.createdname}></span>
                    </div> -->
                </th>

                <th class="table-th sortable-header"
                    title="Created On"
                    data-field="createdOnFormatted"
                    onclick={handleSort}>Created On
                  <!--   <div class="sort-header-inner">
                        <span class="sort-label">Created On</span>
                        <span class="sort-arrow" data-arrow={sortIcons.createdOnFormatted}></span>
                    </div> -->
                </th>

                <th class="table-th sortable-header"
                    title="Shift Details"
                    data-field="shiftDetails"
                    onclick={handleSort}>Shift Details
                   <!--  <div class="sort-header-inner">
                        <span class="sort-label">Shift Details</span>
                        <span class="sort-arrow" data-arrow={sortIcons.shiftDetails}></span>
                    </div> -->
                </th>

                    <th class="table-th center" title="Action">
                        Action
                    </th>
                </tr>
            </thead>
        </table>
    </div>
    <!-- BODY -->
    <div class="body-scroll custom-scroll journalTableHeight slds-scrollable_y slds-grow">
        <table class="staff-table">
            <tbody>
               <template if:false={noRecordsFlag1}>
                <template for:each={displayedClientJournels} for:item="journal">
                    <tr key={journal.Id} class="table-row">

                        <td class="table-td">{journal.Care_Notes__c}</td>

                        <td class="table-td description-cell" title={journal.descriptionPreview}>
                            {journal.descriptionPreview}
                        </td>

                         <td class="table-td">{journal.Client__r.Display_Nickname__c}</td>

                        <td class="table-td">{journal.createdname}</td>

                        <td class="table-td">{journal.createdOnFormatted}</td>

                        <td class="table-td">{journal.shiftDetails}</td>
                      
                         <td class="table-td center">
                        <div class="action-icons">

                          <!-- Edit -->
                          <div class="action-slot">
                              <template if:true={journal.journaledit}>
                                  <span
                                      class="material-symbols-outlined action-icon edit-icon"
                                      title="Edit"
                                      data-id={journal.Id}
                                      data-name={journal.Description__c}
                                      data-notestype={journal.Care_Notes__c}
                                      data-participantid = {journal.Client__r.Id}
                                      onclick={handleEdit}>
                                      edit_document
                                  </span>
                              </template>
                          </div>

                          <!-- View -->
                          <div class="action-slot">
                              <span
                                  class="material-symbols-outlined action-icon view-icon"
                                  title="View"
                                  data-id={journal.Id}
                                  onclick={handleView}>
                                  visibility
                              </span>
                          </div>

                          <!-- History -->
                          <div class="action-slot">
