                                                data-index={index}
                                                value={con.lastName}
                                                placeholder={con.lastNamePlaceholder}
                                                onchange={handleContactsChange}>
                                            </lightning-input>
                                        </td>

                                        <td>
                                            <lightning-input 
                                                name="contactNumber"
                                                type="tel"
                                                variant="label-hidden"
                                                data-index={index}
                                                value={con.contactNumber}
                                                placeholder={con.phonePlaceholder}
                                                onchange={handleContactsChange}
                                                maxlength="10"
                                                pattern="[0-9]{10}"
                                                message-when-pattern-mismatch="Enter a valid 10-digit number">
                                            </lightning-input>
                                        </td>

                                        <td>
                                            <lightning-input 
                                                name="email"
                                                type="email"
                                                variant="label-hidden"
                                                data-index={index}
                                                value={con.email}
                                                placeholder={con.emailPlaceholder}
                                                onchange={handleContactsChange}>
                                            </lightning-input>
                                        </td>
                                         <td style="text-align:center;">
                                            <lightning-input 
                                                type="checkbox"
                                                name="notify"
                                                data-index={index}
                                                checked={con.notify}
                                                onchange={handleContactsChange}>
                                            </lightning-input>
                                        </td>

                                        <!-- Delete button -->
                                        <td style="text-align:center;">
                                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-center action-cell">
                                            <lightning-button-icon 
                                                icon-name="utility:delete"
                                                alternative-text="Delete Row"
                                                data-index={index}
                                                class="slds-m-right_x-small"
                                                onclick={removeContactRow}>
                                            </lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:add"
                                                alternative-text="Add Row"
                                                data-index={index}
                                                variant="brand"
                                                class={con.addButtonClass}
                                                onclick={addContactRow}>
                                            </lightning-button-icon>
                                          </div>
                                        </td>

                                    </tr>
                                </template>
                            </tbody>
                        </table>
                      </div>
                        <!-- Backdrop -->
                    <template if:true={showContactTypeModal}>
                        <section role="dialog" class="slds-modal slds-fade-in-open">
                            <div class="slds-modal__container" style="max-width: 25%;">

                                <!-- Header -->
                                <header class="slds-modal__header" style="background: #002a52;">
                                    <h2 class="slds-text-heading_medium" style="color: white; text-align: center;">
                                        Add Contact Type
                                    </h2>
                                </header>

                                <!-- Body -->
                                <div class="slds-modal__content slds-p-around_medium">
                                    <lightning-input
                                        label="Contact Type Name"
                                        value={newContactTypeName}
                                        onchange={handleNewContactTypeInput}
                                        required>
                                    </lightning-input>

                                    <!-- Existing custom types -->
                                    <template if:true={customContactTypes.length}>
                                        <div class="slds-m-top_medium">
                                            <p class="">Custom Contact Types</p>

                                          <template for:each={customContactTypes} for:item="type">
                                              <div key={type.value}
                                                  class="slds-grid slds-grid_align-spread slds-m-top_x-small">

                                                  <span class={type.cssClass}>
                                                      {type.label}
                                                  </span>

                                                  <lightning-button-icon
                                                      icon-name="utility:delete"
                                                      alternative-text="Delete"
                                                      data-value={type.value}
                                                      onclick={stageDeleteContactType}>
                                                  </lightning-button-icon>

                                              </div>
                                          </template>

                                        </div>
                                    </template>
                                </div>

                                <!-- Footer -->
                                <footer class="slds-modal__footer">
                                    <lightning-button
                                        label="Cancel"
                                        onclick={closeContactTypeModal}>
                                    </lightning-button>

                                    <lightning-button
                                        variant="brand"
                                        label="Save"
                                        onclick={saveContactType}>
                                    </lightning-button>
                                </footer>

                            </div>
                        </section>

                        <div class="slds-backdrop slds-backdrop_open"></div>
                    </template>
                      
                </template>
              </div>
            </div>

          <div class="container-box">

                  <span>Other Preferences</span>

                        <span 
                            class={sectionIcons1.OtherPreferences1.class}

                      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                          <div class="floating-label">
                              <span class="label-text-drop">Gender</span> 
                              <lightning-input-field field-name="Preferred_Gender__c" variant="label-hidden"></lightning-input-field>                                       
                          </div>
                      </div>
                     
                      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                            <div class="floating-label custom-dropdown">
                                <span class="label-text-drop">Nationality</span>
                                <!-- Search input -->
                                <lightning-input
                                    type="text"
                                    placeholder="Search Nationality"
                                    value={Nationality}
                                    onchange={handleSearchChange}
                                    onclick={toggleDrop}
                                    variant="label-hidden"
                                ></lightning-input>

                                <!-- Dropdown list -->
                                <template if:true={showDropdown}>

                                        onclick={handleSelect}
                                        role="option"
                                        >
                                        <span class="slds-truncate" style="font-size: 14px;">{opt.label}</span>
                                        </li>
                                    </template>

                                    <template if:true={noResults}>

                                        </li>
                                    </template>
                                    </ul>
                                </template>
                                </div>

                                        <span class={selectedOptionClass}>{displayTextLang}</span>
                                        <lightning-icon 
                                            icon-name={chevronIcon} 
                                            size="x-small" 
                                            class="chevron-icon">
                                        </lightning-icon>
                                    </button>

                                    <template if:true={isExpanded}>
                                        <div class="dropdown-menu">
                                            <div class="options-list custom-scroll">
                                                <template for:each={Languages} for:item="value">
                                                    <div key={value.id} class="option-item">
                                                        <button 
                                                            type="button"
                                                            class={value.buttonClass}
                                                            data-option-id={value.id}>
                                                            {value.label}
                                                        </button>                                               
                                                        <div class="option-controls">

                                                                    type="toggle"

                                                                    checked={value.checked}
                                                                    class="toggle_bar_right"

                                                                </lightning-input>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>  
                            </div>
