<template>
    <template if:true={isHome}>
        <div class="main-container">
            <!-- Header Section -->
            <template if:true={chartofAccountsflag}>
                <div style="display: flex; align-items: center; justify-content: space-between; ">
                      <p style="font-weight: bold; padding: 1% 0% 1% 1%;font-size:140% ">  Chart of Accounts - {companyname}</p>
                    
                </div>
                <!-- <div style="display: flex; align-items: center; justify-content: space-between;">
                  
                        <lightning-input type="toggle" data-id="statusToggle" label="Active/Inactive" name="input1"  message-toggle-active="" message-toggle-inactive=""
                            onchange={HandleActiveInactive} checked={isActive} style="float: right; size: 50px; margin-left: 62%;">
                        </lightning-input>
                    
                    <button 
                    class="slds-button slds-button_icon slds-button_icon-border" 
                    title="Refresh" 
                    onclick={fetchReplist} style="margin-right: 1%;">
                    <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                    </svg>
                </button> -->
                <header class="header">
                    <div class="search-section">
                
                        <div class="floating-label-new  slds-small-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                            <span class="label-text-drop1">Start Date</span>
                            <lightning-input type="date" name="sdate" variant="label-hidden" value={sdate} label="Start Date" onchange={hadleDates}></lightning-input>
                        </div>
                        <div class="floating-label-new  slds-small-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                            <span class="label-text-drop1">End Date</span>
                            <lightning-input type="date" value={edate} variant="label-hidden" name="edate" label="End Date" onchange={hadleDates}></lightning-input> <!--disabled={datesFlag}-->
                        </div>
                    </div>
                    <div class="action-section">
                        <lightning-input type="toggle" data-id="statusToggle" label="Active/Inactive" name="input1"  message-toggle-active="" message-toggle-inactive=""
                            onchange={HandleActiveInactive} checked={isActive}>
                        </lightning-input>
                        
                        <button 
                            class="slds-button slds-button_icon slds-button_icon-border" 
                            title="Refresh" 
                            onclick={fetchReplist}>
                            <svg class="slds-button__icon" aria-hidden="true">
                                <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                            </svg>
                        </button>
                    </div>
                </header>
                    
                <div class="table-container coa-table">
                    <!-- HEADER -->
                    <div class="header-wrapper">
                        <table class="staff-table fixed-table">
                            <thead>
                                <tr class="table-row">
                                    <th class="table-th" title="Account Number">Account Number</th>
                                    <th class="table-th" title="Account Name">Account Name</th>
                                    <th class="table-th" title="Amount">Amount</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                    <!-- BODY -->
                    <div class="table-body custom-scroll">
                    <table class="staff-table fixed-table">
                        <tbody>
                            <!-- Render Account List -->
                            <template for:each={hierarchyData} for:item="accountList">
                                <!-- Render Categories if Account List is expanded -->
                                <template if:true={accountList.expanded}>
                                    <template for:each={accountList.categories} for:item="category">
                                        <!-- Category Row -->
                                        <tr key={category.accountNumber} class="table-row">
                                            <td class="table-td" style="padding-left: 30px;">
                                                <!-- Category Expand/Collapse icon -->
                                                <lightning-icon
                                                    icon-name={category.iconName}
                                                    alternative-text="Expand/Collapse"
                                                    size="xx-small"
                                                    class="slds-m-right_xx-small slds-cursor_pointer"
                                                    onclick={toggleCategory}
                                                    data-id={category.accountNumber}>
                                                </lightning-icon>
                                                <strong>{category.accountNumber}</strong> <!-- Account Number of Category -->
                                            </td>
                                            <td class="table-td" style="padding-left: 30px; font-size: 96%;">
                                                <strong>{category.accountName}</strong> <!-- Account Name of Category -->
                                            </td>
                                            <td class="table-td">
                                                <lightning-formatted-number
                                                    value={category.amount}
                                                    format-style="currency"
                                                    currency-code="AUD"
                                                    minimum-fraction-digits="2"
                                                    maximum-fraction-digits="2">
                                                </lightning-formatted-number>
                                            </td>

                                        </tr>

                                        <!-- Render Subcategories if Category is expanded -->
                                        <template if:true={category.expanded}>
                                            <template for:each={category.subCategories} for:item="subCategory">
                                                <!-- Subcategory Row -->
                                                <tr key={subCategory.accountNumber} class="table-row">
                                                    <td class="table-td" style="padding-left: 60px;">
                                                        <!-- Subcategory Expand/Collapse icon -->
                                                        <lightning-icon
                                                            icon-name={subCategory.iconName}
                                                            alternative-text="Expand/Collapse"
                                                            size="xx-small"
                                                            class="slds-m-right_xx-small slds-cursor_pointer"
                                                            onclick={toggleSubCategory}
                                                            data-category-id={category.accountNumber}
                                                            data-subcategory-id={subCategory.accountNumber}>
                                                        </lightning-icon>
                                                        <strong>{subCategory.accountNumber}</strong> <!-- Account Number of Subcategory -->
                                                    </td>
                                                    <td class="table-td" style="padding-left: 60px; font-size: 96%;">
                                                        <strong>{subCategory.accountName}</strong> <!-- Account Name of Subcategory -->
                                                    </td>
                                                    <td class="table-td">
                                                    <lightning-formatted-number
                                                    value={subCategory.amount}
                                                    format-style="currency"
                                                    currency-code="AUD"
                                                    minimum-fraction-digits="2"
                                                    maximum-fraction-digits="2">
                                                    </lightning-formatted-number>
                                                    </td>

                                                </tr>

                                                <!-- Render Ledgers if Subcategory is expanded -->
                                                <template if:true={subCategory.expanded}>
                                                    <template for:each={subCategory.ledgers} for:item="ledger">
                                                        <!-- Ledger Row -->
                                                        <tr key={ledger.accountNumber} class="table-row">
                                                            <td class="table-td" style="padding-left: 90px;">
                                                                <!-- Ledger Expand/Collapse icon -->
                                                                <lightning-icon
                                                                    icon-name={ledger.iconName}
                                                                    alternative-text="Expand/Collapse"
                                                                    size="xx-small"
                                                                    class="slds-m-right_xx-small slds-cursor_pointer"
                                                                    onclick={toggleLedger}
                                                                    data-subcategory-id={subCategory.accountNumber}
                                                                    data-ledger-id={ledger.accountNumber}>
                                                                </lightning-icon>
                                                                <strong>{ledger.accountNumber}</strong> <!-- Account Number of Ledger -->
                                                            </td>
                                                            <td class="table-td" style="padding-left: 90px; font-size: 96%;">
                                                                <strong>{ledger.accountName}</strong> <!-- Account Name of Ledger -->
                                                            </td>
                                                            <td class="table-td">
                                                                <lightning-formatted-number
                                                                value={ledger.amount}
                                                                format-style="currency"
                                                                currency-code="AUD"
                                                                minimum-fraction-digits="2"
                                                                maximum-fraction-digits="2">
                                                                </lightning-formatted-number>
                                                            </td>
                                                        </tr>

                                                        <!-- Render Ledger Items if Ledger is expanded -->
                                                        <template if:true={ledger.expanded}>
                                                            <template for:each={ledger.items} for:item="item">
                                                                <!-- Ledger Item Row -->
                                                                <tr key={item.accountNumber} class="table-row">
                                                                    <td class="table-td" style="padding-left: 120px;">
                                                                        <!-- Ledger Item icon (if needed) -->
                                                                        {item.accountNumber} <!-- Account Number of Ledger Item -->
                                                                    </td>
                                                                    <td class="table-td" style="padding-left: 120px;" ondblclick={handleDoubleClick} data-id={item.Id}>
                                                                    {item.accountName} <!-- Account Name of Ledger Item -->
                                                                    </td>
                                                                    <td class="table-td">
                                                                        <lightning-formatted-number
                                                                        value={item.amount}
                                                                        format-style="currency"
                                                                        currency-code="AUD"
                                                                        minimum-fraction-digits="2"
                                                                        maximum-fraction-digits="2">
                                                                        </lightning-formatted-number>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </template>
                                                    </template>
                                                </template>
                                            </template>
                                        </template>
                                    </template>
                                </template>
                            </template>

                        </tbody>
                    </table>
                    </div>
                </div>
            </template>
            
        </div>
    </template>
    <template if:true={entryDetailedTable}>
        <div class="main-container">
            <div style="display: flex; align-items: center; justify-content: space-between;  padding: 0% 0% 1% 0;">
              
                <p style="font-weight: bold; font-size: 140%; padding: 0% 0% 0% 1%">Entry Details</p>
                <lightning-button label="Back" variant="brand" onclick={handleClose}  style="margin-left: 81%; margin-top:1%;"></lightning-button>
                <button 
                            class="slds-button slds-button_icon slds-button_icon-border"  style="margin-right: 1%; margin-top:1%;"
                            title="Refresh" 
                            onclick={fetchReplist1}>
                            <svg class="slds-button__icon" aria-hidden="true">
                                <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                            </svg>
                        </button>
            </div>
            <!-- <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <h3 style="font-weight: bold;font-size:150%; margin: 0; padding: 3% 0 0 3%;">Entry Details</h3>
    
                <lightning-button class="slds-m-left_small" label="Back" onclick={handleClose} variant="brand" style="padding-right: 3.5%;padding-top:2%;"></lightning-button>
            </div> -->
            <div class="table-container entry-table">
                <!-- HEADER -->
                <div class="header-wrapper">
                    <table class="staff-table fixed-table">
                        <thead>
                            <tr class="table-row">
                                <th class="table-th" title="S.No">S.No</th>
                                <th class="table-th" title="Item Name">Item Name</th>
                                <th class="table-th" title="Ledger Name">Ledger Name</th>
                                <th class="table-th" title="Sub Category">Sub Category</th>
                                <th class="table-th" title="Category">Category</th>
                                <th class="table-th" title="Entity Name">Entity Name</th>
                                <th class="table-th" title="Company Name">Company Name</th>
                                <th class="table-th" title="Created Date">Created Date</th>
                                <th class="table-th" title="Amount">Amount</th>
                            </tr>
                        </thead>
                    </table>
                </div>
                <!-- BODY -->
                <div class="table-body custom-scroll">
                    <table class="staff-table fixed-table">
                        <tbody>
                            <template for:each={entryData} for:item="entry">
                                <tr key={entry.Id} class="table-row">
                                    <td class="table-td" title={entry.SNo}>{entry.SNo}</td>
                                    <td class="table-td" title={entry.ledgerItemName}>{entry.ledgerItemName}</td>
                                    <td class="table-td" title={entry.ledgerName}>{entry.ledgerName}</td>
                                    <td class="table-td" title={entry.subCategory}>{entry.subCategory}</td>
                                    <td class="table-td" title={entry.category}>{entry.category}</td>
                                    <td class="table-td" title={entry.entityName}>{entry.entityName}</td>
                                    <td class="table-td" title={entry.companyName}>{entry.companyName}</td>
                                    <td class="table-td" title={entry.createdDate}>{entry.createdDate}</td>
                                    <td class="table-td" title={entry.amount}>{entry.amount}</td>
                                </tr>
                            </template>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
     </template>
      <!-- create Company-->
      <!-- <template if:true={createCompanyflag}>
        <c-create-company-lwc  orgidtrack={orgid}></c-create-company-lwc>
     </template> -->
</template>
