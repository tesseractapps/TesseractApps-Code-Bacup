<template>
  <div class="main-container">

    <!-- ✅ GLOBAL LOADING OVERLAY -->
    <template if:true={isPageLoading}>
      <div class="global-loading-overlay">
        <lightning-spinner alternative-text="Loading data from Xero" size="medium" variant="brand"></lightning-spinner>
        <span class="global-loading-text">{loadingMessage}</span>
      </div>
    </template>

    <div class="menu-container">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 1rem;
          margin-bottom: 1rem;
        "
      >
        <!-- Tabs -->
        <div style="display: flex">
          <div
            class={payrollTabClass}
            onclick={handleTabChange}
            data-tab="payroll"
          >
            Employees
          </div>
          <div
            class={invoicesTabClass}
            onclick={handleTabChange}
            data-tab="invoices"
          >
            Contacts
          </div>
          <!-- <div
            class={earningRatesTabClass}
            onclick={handleTabChange}
            data-tab="earningRates"
          >
            Earning Rates
          </div> -->
        </div>
      </div>
    </div>

    <template if:true={showPayroll}>
      <div style="padding: 1%">

        <div class="metrics-grid">

            <div
              class="metric-card highlighted2"
              onclick={handleAllStaff}
              data-id="All"
            >
              <div class="invoiceTiles">
                <div>
                  <h3 class="metric-title">All</h3>
                  <p class="metric-value">{totalCount}</p>
                </div>
                <template if:true={allStaff}>
                  <i class="material-iconsInvoice">task_alt</i>
                </template>
              </div>
            </div>

            <div
              class="metric-card highlighted3"
              onclick={handleMatchedStaff}
              data-id="Sync"
            >
              <div class="invoiceTiles">
                <div>
                  <h3 class="metric-title">Sync</h3>
                  <p class="metric-value">{matchedCount}</p>
                </div>
                <template if:true={matchedStaff}>
                  <i class="material-iconsInvoice">task_alt</i>
                </template>
              </div>
            </div>

            <div
              class="metric-card highlighted1"
              onclick={handleSystemStaff}
              data-id="System Only"
            >
              <div class="invoiceTiles">
                <div>
                  <h3 class="metric-title">System Only</h3>
                  <p class="metric-value">{onlyInSystemCount}</p>
                </div>
                <template if:true={systemStaff}>
                  <i class="material-iconsInvoice">task_alt</i>
                </template>
              </div>
            </div>

            <div
              class="metric-card highlighted"
              onclick={handleXeroStaff}
              data-id="Xero Only"
            >
              <div class="invoiceTiles">
                <div>
                  <h3 class="metric-title">Xero Only</h3>
                  <p class="metric-value">{onlyInXeroCount}</p>
                </div>
                <template if:true={xeroStaff}>
                  <i class="material-iconsInvoice">task_alt</i>
                </template>
              </div>
            </div>
        </div>

        <!-- ✅ All Staff Table -->
        <template if:true={allStaff}>

          <div class="slds-m-bottom_small slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
              <!-- Search on the LEFT -->
              <div class="slds-col slds-size_3-of-12">
                  <lightning-input 
                      type="search" 
                      label="Search" 
                      variant="label-hidden"
                      placeholder="Search by Staff Member or Email Address."
                      value={allStaffSearchTerm}
                      onchange={handleAllStaffSearch}>
                  </lightning-input>
              </div>

              <!-- Button on the RIGHT -->
              <!-- <div class="slds-col slds-no-flex">
                  <lightning-button 
                      label="Re Sync" 
                      variant="brand" 
                      onclick={handleOpenUpdatePopup}>
                  </lightning-button>
              </div> -->
          </div>

          <div class="table-container custom-scroll">
          <table class="staff-table" role="grid" style="table-layout: fixed">
            <thead>
              <tr>
                <!-- <th class="table-th" scope="col" style="width:6%">
                  <div title="Select"> Select </div>
                </th> -->
                <th class="table-th" scope="col">
                  <div title="Staff Member">Staff Member</div>
                </th>
                <th class="table-th" scope="col">
                  <div  title="Email Address">Email Address</div>
                </th>
                <th class="table-th" scope="col" style="width:17%">
                  <div  title="Date of Birth">Date of Birth</div>
                </th>
                <th class="table-th" scope="col" style="width:12%">
                  <div title="Sync Status">Sync Status</div>
                </th>
                <th class="table-th" scope="col" style="width:12%">
                  <div title="Actions">Actions</div>
                </th>
              </tr>
            </thead>

            <tbody>
              <template if:true={hasNoStaff}>
                <tr class="tr1">
                  <td colspan="6" class="slds-text-align_center slds-p-vertical_xx-large">
                    <div class="no-data">
                      <p>No records found</p>
                    </div>
                  </td>
                </tr>
              </template>

              <template if:false={hasNoStaff}>
                <template for:each={paginatedStaffList} for:item="staff">
                  <tr key={staff.id} class="tr1 {staff.rowClass}">
                    <!-- <td data-label="Select" class="table-td" style="width:6%">
                      <template if:true={staff.showAllSet}>
                        <input 
                          type="checkbox" 
                          name="staff_member" 
                          value={staff.id}
                          checked={staff.isSelected}
                          onchange={handleCheckboxChange}
                          data-id={staff.id}>
                      </template>
                    </td> -->
                    <!-- Staff Member -->
                    <td data-label="Staff Member" class="table-td" >
                      <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-avatar
                          variant="circle"
                          initials={staff.initials}
                          fallback-icon-name="standard:user"
                          size="medium"
                          class="slds-m-right_small">
                        </lightning-avatar>
                        <span class="slds-text-body_regular staff-name description">{staff.name}</span>
                      </div>
                    </td>

                    <!-- Email -->
                    <td data-label="Email Address" class="table-td description">
                      <span class="slds-text-body_regular">{staff.email}</span>
                    </td>

                    <!-- Date of Birth -->
                    <td data-label="Date of Birth" class="table-td description" style="width:17%">
                      <span class="slds-text-body_regular">{staff.dateOfBirth}</span>
                    </td>

                    <!-- Sync Status -->
                    <td data-label="Sync Status" class="table-td" style="width:12%">
                      <lightning-badge
                        label={staff.statusLabel}
                        class={staff.statusClass}>
                      </lightning-badge>
                    </td>

                    <!-- Actions -->
                    <td data-label="Actions" class="table-td" style="width:12%">
                      <div class="slds-grid slds-grid_vertical-align-center action-cell">

                        <!-- ✅ Add to Xero -->
                        <template if:true={staff.showXeroButton}>
                          <template if:true={staff.isCreatingInXero}>
                            <lightning-spinner alternative-text="Creating in Xero" size="small" variant="brand" class="row-spinner"></lightning-spinner>
                          </template>
                          <template if:false={staff.isCreatingInXero}>
                            <span class="material-symbols-outlined xero-icon"
                                    title="Add to Xero"
                                    onclick={handleCreateInXero}
                                    data-id={staff.id}>
                                receipt_long
                            </span>
                          </template>
                        </template>

                        <!-- ✅ Add to System -->
                        <template if:true={staff.showSystemButton}>
                          <template if:true={staff.isCreatingInSystem}>
                            <lightning-spinner alternative-text="Adding to System" size="small" variant="brand" class="row-spinner"></lightning-spinner>
                          </template>
                          <template if:false={staff.isCreatingInSystem}>
                            <span class="material-symbols-outlined system-icon"
                                  title="Add to System"
                                  onclick={handleCreateInSystem}
                                  data-id={staff.id}
                                  data-firstname={staff.firstName}
                                  data-lastname={staff.lastName}
                                  data-email={staff.email}
                                  data-xero-id={staff.xeroId}
                                  data-staffdata={staff.staffData}>
                              browser_updated
                            </span>
                          </template>
                        </template>

                        <!-- ✅ All Set + syncing spinner -->
                        <template if:true={staff.showAllSet}>
                          <template if:true={staff.isSyncing}>
                            <lightning-spinner alternative-text="Syncing" size="small" variant="brand" class="row-spinner"></lightning-spinner>
                          </template>
                          <template if:false={staff.isSyncing}>
                            <div class="all-set-container">
                              <lightning-badge
                                label="All Set"
                                class={staff.statusClass}>
                              </lightning-badge>
                            </div>
                          </template>
                        </template>

                      </div>
                    </td>
                  </tr>
                </template>
              </template>
            </tbody>
          </table>

          </div>

          <!-- ✅ Pagination for All Staff -->
           <div
                class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination"
                style="padding-top: 0.5em"
              >
                <div class="slds-col">
                  <div class="slds-list_inline slds-p-bottom_xx-small">
                    <label
                      class="slds-text-color_weak slds-p-horizontal_x-small"
                      for="recordsPerPage"
                      style="padding-top: 4%"
                      >Page Size:</label
                    >
                    <div class="slds-select_container slds-align_absolute-center">
                      <select
                        class="slds-select"
                        id="recordsPerPage"
                        onchange={handleAllPageSizeChange}
                      >
                        <template for:each={pageSizeOptions} for:item="option">
                          <option key={option} value={option}>{option}</option>
                        </template>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="slds-align_absolute-center">
                  <lightning-button
                    label="« First"
                    onclick={handleAllFirstPage}
                    disabled={allDisableFirstPrev}
                    class="slds-p-horizontal_x-small">
                  </lightning-button>

                  <lightning-button
                    label="‹ Prev"
                    onclick={handleAllPrevPage}
                    disabled={allDisableFirstPrev}
                    class="slds-p-horizontal_x-small">
                  </lightning-button>

                  &nbsp;
                  <span class="slds-badge">
                    Showing {allCurrentPage} &nbsp;of&nbsp; {allTotalPages} &nbsp;&nbsp;Page(s)
                  </span>
                  &nbsp;

                  <lightning-button
                    label="Next ›"
                    onclick={handleAllNextPage}
                    disabled={allDisableNextLast}
                    class="slds-p-horizontal_x-small">
                  </lightning-button>

                  <lightning-button
                    label="Last »"
                    onclick={handleAllLastPage}
                    disabled={allDisableNextLast}
                    class="slds-p-horizontal_x-small">
                  </lightning-button>
                </div>

                <div class="slds-clearfix">
                  <div class="slds-float_right">
                    <span class="slds-badge">
                      Total Records: {allTotalRecords}</span
                    >
                  </div>
                </div>
          </div>
        </template>

        <!-- ✅ Sync Staff Table -->
        <template if:true={matchedStaff}>

          <div class="slds-m-bottom_small slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
              <div class="slds-col slds-size_3-of-12">
                  <lightning-input 
                      type="search" 
                      label="Search" 
                      variant="label-hidden"
                      placeholder="Search by Staff Member or Email Address."
                      value={matchedStaffSearchTerm}
                      onchange={handleMatchedStaffSearch}>
                  </lightning-input>
              </div>

              <div class="slds-col slds-no-flex">
                  <lightning-button 
                      label="Re Sync" 
                      variant="brand" 
                      onclick={handleOpenUpdatePopup}>
                  </lightning-button>
              </div>
          </div>

          <div class="table-container custom-scroll">
            <table class="staff-table" role="grid" style="table-layout: fixed">
              <thead>
                <tr>
                  <th class="table-th" scope="col" style="width:6%">
                    <div title="Select"> Select</div>
                  </th>
                  <th class="table-th" scope="col">
                    <div title="Staff Member">Staff Member</div>
                  </th>
                  <th class="table-th" scope="col">
                    <div title="Email Address">Email Address</div>
                  </th>
                  <th class="table-th" scope="col" style="width:17%">
                    <div title="Date of Birth">Date of Birth</div>
                  </th>
                  <th class="table-th" scope="col" style="width:12%">
                    <div title="Sync Status">Sync Status</div>
                  </th>
                  <th class="table-th" scope="col" style="width:12%">
                    <div title="Actions">Actions</div>
                  </th>
                </tr>
              </thead>

              <tbody>
                <template if:true={hasNoMatchedStaff}>
                  <tr class="tr1">
                    <td colspan="6" class="slds-text-align_center slds-p-vertical_xx-large">
                      <div class="no-data">
                        <p>No records found</p>
                      </div>
                    </td>
                  </tr>
                </template>

                <template if:false={hasNoMatchedStaff}>
                  <template for:each={paginatedMatchedList} for:item="staff">
                    <tr key={staff.id} class="tr1 {staff.rowClass}">
                      <td data-label="Select" class="table-td" style="width:6%">
                        <template if:true={staff.showAllSet}>
                          <input 
                            type="checkbox" 
                            name="staff_member" 
                            value={staff.id}
                            checked={staff.isSelected}
                            onchange={handleCheckboxChange}
                            data-id={staff.id}>
                        </template>
                      </td>
                      <!-- Staff Member -->
                      <td data-label="Staff Member" class="table-td">
                        <div class="slds-grid slds-grid_vertical-align-center">
                          <lightning-avatar
                            variant="circle"
                            initials={staff.initials}
                            fallback-icon-name="standard:user"
                            size="medium"
                            class="slds-m-right_small">
                          </lightning-avatar>
                          <span class="slds-text-body_regular staff-name description">{staff.name}</span>
                        </div>
                      </td>

                      <!-- Email -->
                      <td data-label="Email Address" class="table-td description">
                        <span class="slds-text-body_regular">{staff.email}</span>
                      </td>

                      <!-- Date of Birth -->
                      <td data-label="Date of Birth" class="table-td description" style="width:17%">
                        <span class="slds-text-body_regular">{staff.dateOfBirth}</span>
                      </td>

                      <!-- Sync Status -->
                      <td data-label="Sync Status" class="table-td" style="width:12%">
                        <lightning-badge
                          label={staff.statusLabel}
                          class={staff.statusClass}>
                        </lightning-badge>
                      </td>

                      <!-- Actions -->
                      <td data-label="Actions" class="table-td" style="width:12%">
                        <div class="slds-grid slds-grid_vertical-align-center action-cell">

                          <!-- ✅ Add to Xero -->
                          <template if:true={staff.showXeroButton}>
                            <template if:true={staff.isCreatingInXero}>
                              <lightning-spinner alternative-text="Creating in Xero" size="small" variant="brand" class="row-spinner"></lightning-spinner>
                            </template>
                            <template if:false={staff.isCreatingInXero}>
                              <span class="material-symbols-outlined xero-icon slds-m-right_x-small"
                                      title="Add to Xero"
                                      onclick={handleCreateInXero}
                                      data-id={staff.id}>
                                  receipt_long
                              </span>
                            </template>
                          </template>

                          <!-- ✅ Add to System -->
                          <template if:true={staff.showSystemButton}>
                            <template if:true={staff.isCreatingInSystem}>
                              <lightning-spinner alternative-text="Adding to System" size="small" variant="brand" class="row-spinner"></lightning-spinner>
                            </template>
                            <template if:false={staff.isCreatingInSystem}>
                              <span class="material-symbols-outlined system-icon"
                                    title="Add to System"
                                    onclick={handleCreateInSystem}
                                    data-id={staff.id}
                                    data-firstname={staff.firstName}
                                    data-lastname={staff.lastName}
                                    data-email={staff.email}
                                    data-xero-id={staff.xeroId}
                                    data-staffdata={staff.staffData}>
                                  browser_updated
                              </span>
                            </template>
                          </template>

                          <!-- ✅ All Set + syncing spinner -->
                          <template if:true={staff.showAllSet}>
                            <template if:true={staff.isSyncing}>
                              <lightning-spinner alternative-text="Syncing" size="small" variant="brand" class="row-spinner"></lightning-spinner>
                            </template>
                            <template if:false={staff.isSyncing}>
                              <div class="all-set-container">
                                <lightning-badge
                                  label="All Set"
                                  class={staff.statusClass}>
                                </lightning-badge>
                              </div>
                            </template>
                          </template>

                        </div>
                      </td>
                    </tr>
                  </template>
                </template>
              </tbody>
            </table>

          </div>

          <!-- ✅ Pagination for Sync Staff -->
           <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination"
              style="padding-top: 0.5em"
            >
              <div class="slds-col">
                <div class="slds-list_inline slds-p-bottom_xx-small">
                  <label
                    class="slds-text-color_weak slds-p-horizontal_x-small"
                    for="matchedRecordsPerPage"
                    style="padding-top: 4%"
                    >Page Size:</label
                  >
                  <div class="slds-select_container slds-align_absolute-center">
                    <select
                      class="slds-select"
                      id="matchedRecordsPerPage"
                      onchange={handleMatchedPageSizeChange}
                    >
                      <template for:each={pageSizeOptions} for:item="option">
                        <option key={option} value={option}>{option}</option>
                      </template>
                    </select>
                  </div>
                </div>
              </div>

              <div class="slds-align_absolute-center">
                <lightning-button
                  label="« First"
                  onclick={handleMatchedFirstPage}
                  disabled={matchedDisableFirstPrev}
                  class="slds-p-horizontal_x-small"
                ></lightning-button>

                <lightning-button
                  label="‹ Prev"
                  onclick={handleMatchedPrevPage}
                  disabled={matchedDisableFirstPrev}
                  class="slds-p-horizontal_x-small"
                ></lightning-button>

                &nbsp;
                <span class="slds-badge">
                  Showing {matchedCurrentPage} &nbsp;of&nbsp; {matchedTotalPages} &nbsp;&nbsp;Page(s)
                </span>
                &nbsp;

                <lightning-button
                  label="Next ›"
                  onclick={handleMatchedNextPage}
                  disabled={matchedDisableNextLast}
                  class="slds-p-horizontal_x-small"
                ></lightning-button>

                <lightning-button
                  label="Last »"
                  onclick={handleMatchedLastPage}
                  disabled={matchedDisableNextLast}
                  class="slds-p-horizontal_x-small"
                ></lightning-button>
              </div>

              <div class="slds-clearfix">
                <div class="slds-float_right">
                  <span class="slds-badge">Total Records: {matchedTotalRecords}</span>
                </div>
              </div>
            </div>

        </template>

        <!-- ✅ System Only Staff Table -->
        <template if:true={systemStaff}>

          <!-- SEARCH INPUT -->
           <div class="slds-m-bottom_small slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
              <div class="slds-col slds-size_3-of-12">
                  <lightning-input 
                      type="search" 
                      label="Search" 
                      variant="label-hidden"
                      placeholder="Search by Staff Member or Email Address."
                      value={systemStaffSearchTerm}
                      onchange={handleSystemStaffSearch}>
                  </lightning-input>
              </div>

              <div class="slds-col slds-no-flex">
                  <lightning-button 
                      label="Bulk Upload" 
                      variant="brand" 
                      onclick={handleBulkUpdatePopup}>
                  </lightning-button>
              </div>
          </div>
          

          <div class="table-container custom-scroll">
          <table class="staff-table" role="grid" style="table-layout: fixed">
            <thead>
              <tr>
                <th class="table-th" scope="col" style="width:6%">
                  <div title="Select"> Select</div>
                </th>
                <th class="table-th" scope="col">
                  <div title="Staff Member">Staff Member</div>
                </th>
                <th class="table-th" scope="col">
                  <div title="Email Address">Email Address</div>
                </th>
                <th class="table-th" scope="col" style="width:17%">
                  <div title="Date of Birth">Date of Birth</div>
                </th>
                <th class="table-th" scope="col" style="width:12%">
                  <div title="Sync Status">Sync Status</div>
                </th>
                <th class="table-th" scope="col" style="width:12%">
                  <div title="Actions">Actions</div>
                </th>
              </tr>
            </thead>

            <tbody>
              <template if:true={hasNoSystemStaff}>
                <tr class="tr1">
                  <td colspan="5" class="slds-text-align_center slds-p-vertical_xx-large">
                    <div class="no-data">
                      <p>No records found</p>
                    </div>
                  </td>
                </tr>
              </template>

              <template if:false={hasNoSystemStaff}>
                <template for:each={paginatedSystemList} for:item="staff">
                  <tr key={staff.id} class="tr1 {staff.rowClass}">
                    <td data-label="Select" class="table-td" style="width:6%">
                      <input 
                        type="checkbox" 
                        name="staff_member" 
                        value={staff.id}
                        checked={staff.isSelected}
                        onchange={handleBulkCheckboxChangeforStaff}
                        data-id={staff.id}>
                    </td>
                    <!-- Staff Member -->
                    <td data-label="Staff Member" class="table-td">
                      <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-avatar
                          variant="circle"
                          initials={staff.initials}
                          fallback-icon-name="standard:user"
                          size="medium"
                          class="slds-m-right_small">
                        </lightning-avatar>
                        <span class="slds-text-body_regular staff-name description">
                          {staff.name}
                        </span>
                      </div>
                    </td>

                    <!-- Email -->
                    <td data-label="Email Address" class="table-td description">
                      <span class="slds-text-body_regular">{staff.email}</span>
                    </td>

                    <!-- Date of Birth -->
                    <td data-label="Date of Birth" class="table-td description" style="width:17%">
                      <span class="slds-text-body_regular">{staff.dateOfBirth}</span>
                    </td>

                    <!-- Sync Status -->
                    <td data-label="Sync Status" class="table-td" style="width:12%">
                      <lightning-badge
                        label={staff.statusLabel}
                        class={staff.statusClass}>
                      </lightning-badge>
                    </td>

                    <!-- Actions -->
                    <td data-label="Actions" class="table-td" style="width:12%">
                      <div class="slds-grid slds-grid_vertical-align-center action-cell">

                        <!-- ✅ Add to Xero -->
                        <template if:true={staff.showXeroButton}>
                          <template if:true={staff.isCreatingInXero}>
                            <lightning-spinner alternative-text="Creating in Xero" size="small" variant="brand" class="row-spinner"></lightning-spinner>
                          </template>
                          <template if:false={staff.isCreatingInXero}>
                            <span class="material-symbols-outlined xero-icon slds-m-right_x-small"
                                  title="Add to Xero"
                                  onclick={handleCreateInXero}
                                  data-id={staff.id}>
                              receipt_long
                          </span>
                          </template>
                        </template>

                        <!-- ✅ Add to System -->
                        <template if:true={staff.showSystemButton}>
                          <template if:true={staff.isCreatingInSystem}>
                            <lightning-spinner alternative-text="Adding to System" size="small" variant="brand" class="row-spinner"></lightning-spinner>
                          </template>
                          <template if:false={staff.isCreatingInSystem}>
                            <span class="material-symbols-outlined system-icon"
                                  title="Add to System"
                                  onclick={handleCreateInSystem}
                                  data-id={staff.id}
                                  data-firstname={staff.firstName}
                                  data-lastname={staff.lastName}
                                  data-email={staff.email}
                                  data-xero-id={staff.xeroId}
                                  data-staffdata={staff.staffData}>
                              browser_updated
                            </span>
                          </template>
                        </template>

                        <!-- ✅ All Set + syncing spinner -->
                        <template if:true={staff.showAllSet}>

                    </lightning-button>
                </template>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
  </template>

  <!-- ✅ Result Popup: Success / Failure breakdown -->
  <template if:true={showResultPopup}>
      <section role="dialog" tabindex="-1" aria-modal="true"
              aria-labelledby="resultPopupHeading"
              class="slds-modal slds-fade-in-open">
          <div class="slds-modal__container" style="max-width: 600px; width: 80%;">
              <header class="slds-modal__header">
                  <h2 id="resultPopupHeading"
                      class="slds-text-heading_medium slds-hyphenate">
                      Update Results
                  </h2>
              </header>

              <div class="slds-modal__content slds-p-around_medium"
                  id="resultPopupContent"
                  style="max-height: 60vh; overflow-y: auto;">

                  <!-- Failed records -->
                  <template for:each={resultFailedList} for:item="item">
                      <div key={item._key} style="margin-bottom: 1.25rem;">
                          <p style="font-weight: 600; font-size: 0.95rem; margin: 0 0 0.25rem 0;">
                              {item.name}
                          </p>
                          <p style="color: #b00020; margin: 0; font-size: 0.875rem;">
                              {item.reason}
                          </p>
                      </div>
                  </template>

                  <template for:each={resultSuccessList} for:item="item">
                      <div key={item._key} style="margin-bottom: 1.25rem;">
                          <p style="font-weight: 600; font-size: 0.95rem; margin: 0 0 0.25rem 0;">
                              {item.name}
                          </p>
                          <p style="color: #027e46; margin: 0; font-size: 0.875rem;">
                              {item.reason}
                          </p>
                      </div>
                  </template>

                  <template if:false={resultTotalCount}>
                      <p class="slds-text-align_center slds-m-top_medium">
                          No records were processed.
                      </p>
                  </template>

              </div>

              <footer class="slds-modal__footer">
                  <lightning-button
                      label="Close"
                      variant="brand"
                      onclick={closeResultPopup}>
                  </lightning-button>
              </footer>
          </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
  </template>

  <!-- ✅ BULK UPLOAD CONFIRMATION POPUP -->
  <template if:true={showBulkPopup}>
    <section role="dialog" tabindex="-1" aria-modal="true"
            aria-labelledby="bulkPopupHeading"
            class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container" style="max-width: 500px;">
            <header class="slds-modal__header">
                <h2 id="bulkPopupHeading"
                    class="slds-text-heading_medium slds-hyphenate">
                    {bulkPopupTitle}
                </h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <p>
                    You have selected&nbsp;<strong>{selectedIds.length}</strong>&nbsp;{bulkPopupRecordLabel}(s). Do you want to create them in Xero?
                </p>
                <p class="slds-text-color_weak slds-m-top_small">
                    Each selected record will be created as a new Xero record using its current system data.
                </p>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={closeBulkPopup}
                    class="slds-m-right_small">
                </lightning-button>

                <template if:true={bulkUploading}>
                    <lightning-button
                        label="Uploading..."
                        variant="brand"
                        disabled
                        icon-name="utility:spinner">
                    </lightning-button>
                </template>
                <template if:false={bulkUploading}>
                    <lightning-button
                        label="Confirm Upload"
                        variant="brand"
                        onclick={handleConfirmBulkUpload}>
                    </lightning-button>
                </template>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
  </template>

</template>
