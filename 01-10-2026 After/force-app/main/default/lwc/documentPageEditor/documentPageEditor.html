                                    data-url={template.AWS_Document__c}>

                                    <i class="material-icons view-icon">
                                        visibility
                                    </i>

                                </a>

                                <template if:false={template.hideActions}>

                                <!-- DELETE -->
                                <a
                                    href="javascript:void(0)"
                                    title="Delete"

                                    data-name={template.name}
                                    onclick={handleDeleteTemplate}

                                    <i class="material-icons delete-icon">
                                        delete
                                    </i>

                                </a>

                                <a

                                    data-url={template.AWS_Document__c}
                                    data-type={template.Type__c}
                                    data-email={template.clientEmail}>

                                        send

                                        <i class="material-icons">
                                            download

                      </lightning-input>
                    </td>
                    <td>
                      <strong style="font-size: 13px; color: #002A52;">{org.name}</strong>
                    </td>
                    <td>
                      <span style="font-size: 13px; color: #444;">{org.createdDate}</span>
                    </td>
                    <td style="width: 130px; text-align: center;">
                      <template if:true={org.isAssigned}>
                        <span class="slds-badge slds-theme_success" style="font-size: 11px;">Assigned</span>
                      </template>
                      <template if:false={org.isAssigned}>
                        <span class="slds-badge" style="font-size: 11px; background: #f3f3f3; color: #555;">Unassigned</span>
                      </template>
                    </td>
                  </tr>
                </template>
                <template if:false={assignableOrganisationsFiltered.length}>
                  <tr>
                    <td colspan="4" class="no-data" style="text-align:center; padding: 2rem; color:#666;">
                      No organisations found.
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Footer with Cancel & Save buttons -->
      <footer class="slds-modal__footer" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <span class="slds-text-body_small slds-text-color_weak">
            Select the organisations that should have access to this template in their Template Library.
          </span>
        </div>
        <div>
          <lightning-button
            label="Cancel"
            variant="neutral"
            onclick={closeAssignModal}
            class="slds-m-right_small">
          </lightning-button>
          <lightning-button
            label="Save Assignments"
            variant="brand"
            icon-name="utility:save"
            disabled={isSaveAssignmentsDisabled}
            onclick={handleSaveAssignments}>
          </lightning-button>
        </div>
      </footer>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open"></div>
</template>


  <!-- 🔥 GLOBAL UPGRADE MODAL -->
<template if:true={showUpgradeModal}>
    <c-upgrade-modal 
        is-open={showUpgradeModal} 
        onclose={closeUpgradeModal}>
    </c-upgrade-modal>
</template>

<template if:true={assignmentFlag}>

    <div class="blur-overlay"></div>

    <div class="right-align grant-access-panel">

        <!-- HEADER -->
        <div class="grant-access-header">
            <h3>Grant Access</h3>
        </div>

        <!-- CONTENT -->
        <div class="grant-access-content custom-scroll">

            <!-- =========================================
                 STAFF TYPE (TRANSFER BOX)
            ========================================== -->
            <div class="staff-type-section">

                <div class="section-label">Select Staff Type</div>

                <div class="staff-type-transfer">

                    <!-- AVAILABLE -->
                    <div class="staff-type-column">
                        <div class="column-label">Available</div>

                        <div class="staff-type-list">
                            <template for:each={availableRoleOptions} for:item="role">
                                <div key={role.value}
                                     class={role.cssClass}
                                     data-role={role.value}
                                     onclick={handleRoleSelect}>
                                    {role.label}
                                </div>
                            </template>

                            <template if:false={availableRoleOptions.length}>
                                <div class="empty-role-text">No staff types available</div>
                            </template>
                        </div>
                    </div>

                    <!-- TRANSFER BUTTONS -->
                    <div class="role-transfer-buttons">
                        <button type="button" class="transfer-button"
                                title="Add selected staff type"
                                onclick={moveRoleRight}
                                disabled={disableMoveRight}>
                            <span class="material-icons">chevron_right</span>
                        </button>

                        <button type="button" class="transfer-button"
                                title="Remove selected staff type"
                                onclick={moveRoleLeft}
                                disabled={disableMoveLeft}>
                            <span class="material-icons">chevron_left</span>
                        </button>
                    </div>

                    <!-- SELECTED -->
                    <div class="staff-type-column">
                        <div class="column-label">Selected</div>

                        <div class="staff-type-list">
                            <template for:each={selectedRoleOptions} for:item="role">
                                <div key={role.value}
                                     class={role.cssClass}
                                     data-role={role.value}
                                     onclick={handleSelectedRoleSelect}>
                                    {role.label}
                                </div>
                            </template>

                            <template if:false={selectedRoleOptions.length}>
                                <div class="empty-role-text">Select staff type</div>
                            </template>
                        </div>
                    </div>

                </div>
            </div>


            <!-- =========================================
                 SEARCH + TABLE + PAGINATION
                 (only after a staff type is selected)
            ========================================== -->
            <template if:true={hasSelectedRoles}>

                <!-- SEARCH -->
                <div class="staff-search-section">
                    <div class="section-label">Search Staff</div>

                    <div class="staff-search-wrapper">
                        <span class="material-icons search-icon">search</span>
                        <input type="text"
                               class="staff-search-input"
                               placeholder="Search by name, type or email"
                               value={staffSearchKey}
                               oninput={handleStaffSearch} />
                    </div>
                </div>

                <!-- TABLE -->
                <div class="staff-selection-table custom-scroll">

                    <div class="staff-table-header">
                        <div class="staff-checkbox-column">
                            <input type="checkbox"
                                   checked={allVisibleStaffSelected}
                                   onchange={handleSelectAllStaff} />
                        </div>
                        <div class="staff-name-column">Staff Name</div>
                        <div class="staff-role-column">User Type</div>
                        <div class="staff-email-column">Email</div>
                    </div>

                    <template for:each={filteredStaffUsers} for:item="staff">
                        <div key={staff.Id} class="staff-table-row">
                            <div class="staff-checkbox-column">
                                <input type="checkbox"
                                       data-id={staff.Id}
                                       checked={staff.isSelected}
                                       onchange={handleStaffCheckbox} />
                            </div>
                            <div class="staff-name-column" title={staff.name}>{staff.name}</div>
                            <div class="staff-role-column" title={staff.role}>{staff.role}</div>
                            <div class="staff-email-column" title={staff.email}>{staff.email}</div>
                        </div>
                    </template>

                    <template if:false={filteredStaffUsers.length}>
                        <div class="no-staff-message">
                            No staff found for the selected staff type.
                        </div>
                    </template>

                </div>

                <!-- PAGINATION -->
                <div class="staff-pagination">

                    <div class="staff-page-size">
                        <label for="staffPageSizeSelect">Page Size:</label>
                        <select class="slds-select" id="staffPageSizeSelect" onchange={handleStaffPageSize}>
                            <template for:each={staffPageSizeOptions} for:item="option">
                                <option key={option.value} value={option.value} selected={option.selected}>
                                    {option.label}
                                </option>
                            </template>
                        </select>
                    </div>

                    <div class="staff-page-nav">
                        <lightning-button disabled={bDisableStaffFirst} icon-name="utility:jump_to_left"
                            label="First" onclick={staffFirstPage}></lightning-button>
                        <lightning-button disabled={bDisableStaffFirst} icon-name="utility:chevronleft"
                            label="Previous" onclick={staffPreviousPage}></lightning-button>

                        <span class="slds-badge">Showing {staffCurrentPage} of {staffTotalPages} Page(s)</span>

                        <lightning-button disabled={bDisableStaffLast} icon-name="utility:chevronright"
                            label="Next" icon-position="right" onclick={staffNextPage}></lightning-button>
                        <lightning-button disabled={bDisableStaffLast} icon-name="utility:jump_to_right"
                            label="Last" icon-position="right" onclick={staffLastPage}></lightning-button>
                    </div>

                    <span class="slds-badge">Total: {staffTotalRecords}</span>
                </div>

            </template>


            <!-- INITIAL MESSAGE -->
            <template if:false={hasSelectedRoles}>
                <div class="select-role-message">
                    Select a staff type above to view available staff.
                </div>
            </template>

        </div>


        <!-- FOOTER -->
        <div class="grant-access-footer">
            <lightning-button
                label="Cancel"
                variant="brand-outline"
                onclick={handleShareClose}>
            </lightning-button>

            <lightning-button
                label="Save"
                variant="brand"
                onclick={handleassignmentinsert}
                disabled={saveButtonDisable}>
            </lightning-button>
        </div>

    </div>

</template>
 
<template if:true={showCreateFromScratch}>
    <c-tesseractapps-create-template
        onback={handleBackFromCreateTemplate}
        onsave={handleCreateTemplateSave}
         orgid={orgid}>
    </c-tesseractapps-create-template>
</template>
<template if:true={showQuillCreateDocument}>
    <c-tesserapps-document-editor
        onback={handleBackFromDocumentEditor}
        orgid={orgid}
        template-data={selectedQuillTemplate}
        ondocumentsuccess={handleDocumentSuccess}
        oncontinuetotsign={handleContinueToTsign}
        send-document-form={selectedQuillRecipient}>
    </c-tesserapps-document-editor>
</template>
<template if:true={showEditTemplate}>
    <c-tesseractapps-create-template
        onback={handleBackFromCreateTemplate}
        onsave={handleCreateTemplateSave}
        orgid={orgid}
        template-data={selectedQuillEditTemplate}>
    </c-tesseractapps-create-template>
</template>
</template>
