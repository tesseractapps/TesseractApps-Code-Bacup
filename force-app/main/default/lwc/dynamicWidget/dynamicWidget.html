<template>
    <div class="dynamic-widget-container" data-widget-type={type}>
        <!-- Loading state -->
        <template if:true={isLoading}>
            <div class="widget-loading">
                <div class="loading-animation">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">Loading {widgetTitle}...</p>
                </div>
            </div>
        </template>

        <!-- Chart Components -->
        <template if:false={isLoading}>
            <!-- Staff Status Chart Widget -->
            <template if:true={isShiftWidget}>
                <div class="chart-container">
                    <c-shiftwith-staff-status-bar-chart
                        facility-id={facilityId} 
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-shiftwith-staff-status-bar-chart>
                </div>
            </template>

            <!-- Sign In Status Chart Widget -->
            <template if:true={isSignInWidget}>
                <div class="chart-container">
                    <c-sign-in-status-chart
                        facility-id={facilityId} 
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-sign-in-status-chart>
                </div>
            </template>

            <!-- Invoice Status Chart Widget -->
            <template if:true={isInvoiceWidget}>
                <div class="chart-container">
                    <c-invoice-status-bar-chart
                        facility-id={facilityId} 
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-invoice-status-bar-chart>
                </div>
            </template>

            <!-- Task Management Widget -->
            <template if:true={isTaskWidget}>
                <div class="task-container">
                    <c-tesseract-apps-task
                        facility-id={facilityId} 
                        ontaskedit={handleTaskEdit}
                        class="task-component">
                    </c-tesseract-apps-task>
                </div>
            </template>

            <!-- Leave Management Chart Widget -->
            <template if:true={isLeaveWidget}>
                <div class="chart-container">
                    <c-tesseract-apps-leave-management-chart
                        facility-id={facilityId} 
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-tesseract-apps-leave-management-chart>
                </div>
            </template>

            <!-- Participant Management Widget -->
            <template if:true={isParticipantWidget}>
                <div class="management-container">
                    <c-tesseract-apps-participantsgor-org-admin
                        facility-id={facilityId} 
                        ongrandchildevent={handleGrandChildEvent}
                        class="management-component">
                    </c-tesseract-apps-participantsgor-org-admin>
                </div>
            </template>

            <!-- Incident Register Chart Widget -->
            <template if:true={isIncidentWidget}>
                <div class="chart-container">
                    <c-incident-registerchart
                        facility-id={facilityId} 
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-incident-registerchart>
                </div>
            </template>

            <!-- Performance Management Chart Widget -->
            <template if:true={isPerformanceWidget}>
                <div class="chart-container">
                    <c-performance-management-chart 
                        facility-id={facilityId}
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-performance-management-chart>
                </div>
            </template>

            <!-- Human Resources Dashboard Widget -->
            <template if:true={isHRWidget}>
                <div class="dashboard-container">
                    <c-human-resources-menu-dashboard 
                        facility-id={facilityId}
                        ongrandchildevent={handleGrandChildEvent}
                        class="dashboard-component">
                    </c-human-resources-menu-dashboard>
                </div>
            </template>

            <!-- Participants Fund Chart Widget -->
            <template if:true={isFundWidget}>
                <div class="chart-container">
                    <c-participants-funds-chart-lwc
                        facility-id={facilityId} 
                        class="chart-component">
                    </c-participants-funds-chart-lwc>
                </div>
            </template>

            <!-- Staff Status Chart Widget (Alternative) -->
            <template if:true={isStaffStatusWidget}>
                <div class="chart-container">
                    <c-staff-status-chart 
                        facility-id={facilityId}
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-staff-status-chart>
                </div>
            </template>

            <!-- Staff Status Chart Widget (Alternative) -->
            <template if:true={isPayrollWidget}>
                <div class="chart-container">
                    <c-payroll-chart 
                        facility-id={facilityId}
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-payroll-chart>
                </div>
            </template>

            <!-- isIctTimesheetWidget Widget (Alternative) -->
            <template if:true={isIctTimesheetWidget}>
                <div class="chart-container">
                    <c-ict-tmesheet-chart-lwc 
                        facility-id={facilityId}
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-ict-tmesheet-chart-lwc >
                </div>
            </template>


            <template if:true={isStaffDashboardWidget}>
                <div class="chart-container">
                    <c-tesseract-apps-staff-dashboard-lwc
                        facility-id={facilityId} 
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-tesseract-apps-staff-dashboard-lwc>
                </div>
            </template>

            <template if:true={isParticipantScheduleWidget}>
                <div class="chart-container">
                    <c-participant-schedule-chart 
                        facility-id={facilityId}
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-participant-schedule-chart>
                </div>
            </template>

            <template if:true={isRejectedShiftsWidget}>
                <div class="chart-container">
                    <c-rejected-shifts-chart 
                        facility-id={facilityId}
                        ongrandchildevent={handleGrandChildEvent}
                        class="chart-component">
                    </c-rejected-shifts-chart>
                </div>
            </template>

            <!-- Default/Placeholder Widget -->
            <template if:true={isDefaultWidget}>
                <div class="placeholder-widget">
                    <div class="placeholder-content">
                        <div class="placeholder-icon">
                            <lightning-icon icon-name="utility:apps" size="large"></lightning-icon>
                        </div>
                        <h3 class="placeholder-title">{widgetTitle}</h3>
                        <p class="placeholder-description">
                            This widget type "{type}" is not yet implemented or the component is not available.
                        </p>
                        <div class="placeholder-actions">
                            <lightning-button 
                                label="Configure Widget" 
                                variant="brand" 
                                onclick={handleConfigureWidget}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Error State -->
            <template if:true={hasError}>
                <div class="error-widget">
                    <div class="error-content">
                        <div class="error-icon">
                            <lightning-icon icon-name="utility:error" size="large" variant="error"></lightning-icon>
                        </div>
                        <h3 class="error-title">Widget Error</h3>
                        <p class="error-description">{errorMessage}</p>
                        <div class="error-actions">
                            <lightning-button 
                                label="Retry" 
                                variant="neutral" 
                                onclick={handleRetry}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </template>
        </template>
    </div>
</template>
