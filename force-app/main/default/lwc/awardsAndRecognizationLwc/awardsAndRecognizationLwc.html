<template>
<div class="main-container">

        <template if:true={homeflag}>
          
 <div class="header">
 <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={fetchAwards}>
                    <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                    </svg>
                    
                </button>
                  <button class="custom-create-btn" onclick={handleAward} title="Issue Award">
                  Issue Award
              </button>
                 
                </div>
      
          


              <div class="content-wrapper">
              <template if:true={orgadmin}>
                <div class="table-container slds-p-around_medium custom-scroll">
        <table class="slds-table slds-table_cell-buffer fixed-table">
                    <thead>
                        <tr>
                            <th>Award</th>
                            <th>Facility</th>
                            <th>Staff</th>
                            <th>Date</th>
                            <th>Issued by</th>
                            <th>Certificate</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={orgAwards} for:item="Award">
                            <tr key={Award.Id} class="tr1">
                                <td>{Award.Awards__c}</td>
                                <td>{Award.facilityName}</td>
                                <td>{Award.fullName}</td>
                                <td>{Award.Todate}</td>
                                <td>{Award.Issued_by__c}</td>
                                <td  class="slds-cell-wrap">
                                    <div if:true={Award.Certificate__c} class="slds-align_absolute-center"> 
                                        <a href={Award.Certificate__c} data-url={Award.Certificate__c} data-awardname={Award.Awards__c}  title="View"
                                        onclick={handleView}>
                                             <!-- <lightning-icon icon-name="action:preview" size="xx-small" title="Certificate" style="cursor:pointer;background:#0099DE;"></lightning-icon> -->
                                        <i class="material-icons view-icon">visibility</i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </template>
                        
                    </tbody>
                </table>
            </div>
                  <!--Pagination Start-->
                  <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination" style="padding-top: 0.5em;width:95%;margin-left:2%">
                    <!-- RECORDS PER PAGE -->
                    <div class="slds-col">
                        <div class="slds-list_inline ">
                            <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                            <label class="slds-text-color_weak" for="recordsPerPage"></label><!--slds-p-horizontal_x-small-->
                            <div class="slds-select_container">
                                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template> 
                                </select>
                            </div>
                        </div>
                    </div>
                    <!-- PAGE NAVIGATION -->
                    <div class="slds-align_absolute-center" style="height:5rem;">
                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                        &nbsp;
                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                        &nbsp;
                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                    </div>
                    <!-- TOTAL RECORDS -->
                    <div class="slds-clearfix">
                        <div class="slds-float_right">
                            <span class="slds-badge"> Total Records: {totalRecords}</span>
                        </div>
                    </div>
                </div>
              </template>
              </div>
            </template>
     
      <template if:true={staffuser}>
 <div class="content-wrapper">
             <div class="table-container slds-p-around_medium custom-scroll">
        <table class="slds-table slds-table_cell-buffer fixed-table">
                  <thead>
                      <tr>
                          <th>Award</th>
                          <th>Facility</th>
                          <th>Staff</th>
                          <th>Date</th>
                          <th>Issued by</th>
                          <th>Certificate</th>
                      </tr>
                  </thead>
                  <tbody>
                      <template for:each={Awards} for:item="Award">
                          <tr key={Award.Id} class="tr1">
                              <td>{Award.Awards__c}</td>
                              <td>{Award.facilityName}</td>
                              <td>{Award.fullName}</td>
                              <td>{Award.Todate}</td>
                              <td>{Award.Issued_by__c}</td>
                              <td  class="slds-cell-wrap">
                                <div if:true={Award.Certificate__c} class="slds-align_absolute-center"> 
                                    <a href={Award.Certificate__c} data-url={Award.Certificate__c} data-awardname={Award.Awards__c}  
                                    onclick={handleView}>
                                         <!-- <lightning-icon icon-name="action:preview" size="xx-small" title="Certificate" style="cursor:pointer;background:#0099DE;"></lightning-icon> -->
                                   <i class="material-icons view-icon">visibility</i>
                                        </a>
                                </div>
                            </td>
                          </tr>
                      </template>
                      
                  </tbody>
              </table>
 </div>
          </div>
      </template>
        <template if:true={isModalOpen}>
        
            <div class="slds-p-around_medium custom-scroll" style="overflow-y: auto;">
                <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
                onclick={closepdf} style="float:right;margin-bottom:5px;"></lightning-button>

            <iframe src={currentUrl} width="100%"  class={awardClass}></iframe>
            </div>
        
        </template>
          
      </div>
    <template if:true={Awardflag}>
        <div class="blur-overlay"></div>
        <div class="right-align" style="width:40%;">

            <div style="display: flex; align-items: center; justify-content: space-between;">
                <h3 style="font-size:140%;font-weight:bold;margin-bottom:0.5%;margin-top:1%;margin-left:2%;">Issue Award</h3>
                <!-- <div style="display: flex; align-items: center; gap: 10px;margin-right:2.2%;margin-top:1%;">
                    <lightning-button label="Back" variant="brand" onclick={handleCancel} ></lightning-button> 
            </div> -->
            </div>

            
        <lightning-record-edit-form object-api-name="Award__c"   onsuccess={handleSuccess} onsubmit={handleSubmit}>
            <lightning-messages></lightning-messages>
        <div class="seperator">
          <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
              
              
                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop"><span style="color:red">*</span>Awards</span>
                        <lightning-input-field field-name="Awards__c" onchange={handleInput} disabled={isdisablefields} required="true" variant="label-hidden" ></lightning-input-field>
                    </div>
                </div>
              
              <!-- <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Facility</span>
                    <lightning-input-field field-name="Facility__c" onchange={handlefacility} required="true" variant="label-hidden"></lightning-input-field>
                </div>
            </div> -->
             <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Facility</span>
                    <lightning-combobox  data-id="facility" name="StaffFacility" class="StaffFacility" variant="label-hidden" options={finalListFacilities} value={StaffFacility} required onchange={handlefacility} 
                                  ></lightning-combobox>
                </div>
            </div>
              
              <!-- <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Staff</span>
                    <lightning-input-field field-name="Staff__c" onchange={handleInput} disabled={isdisablefields} required="true" onclick={handleStartDateChange} variant="label-hidden"></lightning-input-field>
                </div>
            </div> -->
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Staff</span>
                   <lightning-combobox  data-id="staff" name="selectedStaff" class="StaffFacility" variant="label-hidden" options={staffOptions} value={selectedStaff} onchange={handleStaffChange} disabled={isdisablefields} required onclick={handleStartDateChange} 
                                  ></lightning-combobox>
                </div>
            </div>
              
              <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Issued by</span>
                    <lightning-input-field field-name="Issued_by__c" onchange={handleInput} disabled={isdisablefields} required="true" value={manager} variant="label-hidden"></lightning-input-field>
                </div>
            </div>
              
              <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Date</span>
                    <lightning-input-field field-name="Date__c" value={currentDate} variant="label-hidden"></lightning-input-field>
                </div>
            </div>
              
              
          </div>
          </div>
          <div class="slds-align_absolute-center">
             <lightning-button label="Cancel" variant="brand-outline" onclick={handleCancel}
            class="slds-m-around_small"></lightning-button> 
            <lightning-button type="submit" variant="brand" label="Submit" disabled={saveButtonDisable}></lightning-button>
           
        </div>
        
      </lightning-record-edit-form>
    
    </div>
      </template>
      <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Refreshing Data" size="medium"></lightning-spinner>
      </template>
</template>
