<template>
        <h3 slot="title" class="slds-m-left_large">
            <img src={paysetting} alt="" width="60px" height="60px" >
           <span style="font-size:14px;font-weight:bold"> Payroll Settings</span> 
        </h3>
       <!--  <a>
            <lightning-icon icon-name="utility:settings"  title="Chart of Accounts" style="float:right;margin-right:5px;color:white;" onclick={HandleOpenChartOfAccount}  ></lightning-icon>
        </a> -->
        
        <template if:true={ispayset}>
            <div if:true={isDesktop} class="payGrouptable">
                    <!--Refresh Button-->
                    <div class="slds-float_right" style="margin-right:25px;">
                        <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={fetchPayrollSetting}>
                            <svg class="slds-button__icon" aria-hidden="true">
                                <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                            </svg>
                        </button></div>

                    <lightning-button label="Create New Pay Group"
                        class="slds-float_right slds-m-right_large slds-m-bottom_large" onclick={handlePaySettings}
                        variant="brand">
                    </lightning-button>
                    <lightning-button label="Finalise 2023-2024"
                        class="slds-float_right slds-m-right_large slds-m-bottom_large" onclick={handleFinalised}
                        variant="brand">
                    </lightning-button>
                    <!-- <lightning-button label="Super Send"
                        class="slds-float_right slds-m-right_large slds-m-bottom_large" onclick={handleSuperSend}
                        variant="brand">
                    </lightning-button> -->
                    <lightning-input name="enter-search" label="Search Payroll Group Name" style="width: 200px; margin-left:23px"
                    type="search" onchange={onSearchPayrollSetting}></lightning-input>

                    <div class="slds-m-right_large slds-m-left_large slds-m-bottom_large slds-m-top_medium slds-m-top_medium"
                        style="margin-top:2%">
                        <table
                            class="slds-table slds-table_cell-buffer"
                            style="table-layout:fixed">
                            <thead >
                                <tr >
                                    <th class="slds-cell-wrap th" >Facility Name</th>
                                    <th class="slds-cell-wrap th" >Group Name</th>
                                    <th class="slds-cell-wrap th" >Frequency</th>
                                    <th class="slds-cell-wrap th" >Period</th>
                                    <th class="slds-cell-wrap th" >Next Pay Date</th>
                                    <!--<th class="slds-cell-wrap">Status</th>-->
                                    <th class="slds-cell-wrap th" >Employees</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={payrunSetting} for:item="prun">
                                    <tr key={prun.Id} class="tr1">
                                        <td class="slds-cell-wrap">
                                            <a data-id={prun.Id} data-groupname={prun.Group_Name__c} data-fequency={prun.Frequency__c} href="javascript:void(0)" onclick={openPaysettings}>
                                                {prun.Facility__r.Name}
                                            </a>
                                        </td>
                                        <td class="slds-cell-wrap">{prun.Group_Name__c}</td>
                                        <td class="slds-cell-wrap">{prun.Frequency__c}</td>
                                        <td class="slds-cell-wrap">{prun.Period__c}</td>
                                        <td class="slds-cell-wrap">{prun.nextDate}</td>
                                        <!--<td class="slds-cell-wrap">{prun.Status__c}</td>-->
                                        <td class="slds-cell-wrap">{prun.StaffList__c}</td>
                                    </tr>
                                </template>
                            </tbody>

                        </table>
                    </div>
               
                <template if:true={totalRecords}>
                    <div if:true={visible}>
                        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
                            style="padding-top: 0.5em;">

                            <!--PAGE NAVIGATION-->
                            <div class="slds-align_absolute-center" style="height:5rem">
                                <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left"
                                    label="First" class="slds-p-horizontal_x-small" alternative-text="first page"
                                    onclick={firstPage}></lightning-button>
                                <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft"
                                    label="Previous" alternative-text="Previous"
                                    onclick={previousPage}></lightning-button>
                                &nbsp;
                                <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                                    &nbsp;&nbsp;Page(s)</span>
                                &nbsp;
                                <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                                    alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small"
                                    icon-position="right"></lightning-button>
                                <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                                    alternative-text="last page" onclick={lastPage}
                                    icon-position="right"></lightning-button>
                            </div>

                            <!--TOTAL RECORDS-->
                            <div class="slds-clearfix">
                                <div class="slds-float_right " style="margin-right:25px;">
                                    <span class="slds-badge"> Total Records: {totalRecords}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
        <template if:true={isaddpayrun}>
            <div if:true={isDesktop}>
                <div style="margin-left:93.5%;margin-bottom:10px;"><lightning-button   label="Back" variant="brand"
                    onclick={closeaddPayRun} ></lightning-button></div>
                <div class="slds-grid slds-wrap" style="margin-left:3px;margin-right:3px;">
                    
                    <div class="slds-size_1-of-3 ">
                        <lightning-input type="text" name="groupName" value={groupName} label="Group Name"
                            onchange={handleFacilityChange} required="true"
                            class="slds-m-left_large slds-m-right_large"></lightning-input>
                    </div>
                    <div class="slds-size_1-of-3 ">
                        <lightning-combobox name="facility" label="Name of the Facility" value={selectedFacility}
                            placeholder="Select Facility" options={facilityNewList} onchange={handleFacilityChange}
                            required="true" class="slds-m-left_large slds-m-right_large"></lightning-combobox>
                    </div>

                    <div class="slds-size_1-of-3 ">
                        <lightning-combobox name="typeofEmployment" label="Frequency"
                            class="slds-m-left_large slds-m-right_large" onchange={handleFacilityChange}
                            value={selectedTypeofEmployment} placeholder="Select Type of Employment"
                            options={employmentTypePicklistValues.data.values} required="true">
                        </lightning-combobox>
                    </div>
                    
                    <div class="slds-size_1-of-3 ">
                        <lightning-input type="date" name="sdate" value={sdate} label="Start Date"
                            onchange={handleFacilityChange} required="true"
                            class="slds-m-left_large slds-m-right_large"></lightning-input>
                    </div>

                    <div class="slds-size_1-of-3">
                        <lightning-input type="date" value={edate} name="edate" label="End Date"
                            onchange={handleFacilityChange}
                            class="slds-m-left_large slds-m-right_large" disabled="true"></lightning-input>
                    </div>

                    
                    <div class="slds-size_1-of-3">
                        <lightning-input type="date" name="ndate" value={ndate} label="Next Payrun Date" onchange={handleFacilityChange}
                            class="slds-m-left_large slds-m-right_large " required="true"></lightning-input>
                    </div>
                    <hr>
                    <template if:true={facilitynewValue}>
                        <div class="slds-m-top_large slds-m-bottom_medium" style="margin-left: 22px;margin-right: 22px;">
                            <lightning-datatable data={staffrecords} columns={columns} onrowselection={onRowSelection}
                                key-field="id" class="slds-m-top_large">
                            </lightning-datatable>
                        </div>
                        <template if:true={buttonsONPayroll}>
                            <div slot="footer" class=" slds-align_absolute-center slds-m-bottom_medium">
                                <lightning-button class="slds-m-left_medium" slot="footer" label="Save" variant="brand"
                                    onclick={savePayrunSetting}></lightning-button>
                                <lightning-button class="slds-m-left_medium" slot="footer" label="Close" variant="brand"
                                    onclick={closeaddPayRun}></lightning-button>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
        </template>
        <template if:true={isopenPaysettings}>
           <!--  new value passed to child component by praveen -->
            <c-paysettings-details payset-id={paysetId} pay-group-name={payGroupName} fequency={fequency}></c-paysettings-details>
        </template> 
        <template if:true={isFinalisedFlag}>
            <c-finalised-lwc onfinalisedback={handleFinalisedBack}></c-finalised-lwc>
        </template>
       
  
</template>
