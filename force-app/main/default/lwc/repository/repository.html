<template>  
    <div class="main-container">
   <template if:true={isHome}> 
     
      <div style="display: flex; align-items: center; justify-content: flex-end;">

         <div style="display: flex; align-items: center;  margin-right:1%;padding: 1% 0% 0% 0%; gap:10px;">
                <button 
                 class="slds-button slds-button_icon slds-button_icon-border" 
                 title="Refresh" 
                 onclick={fetchReplist}>
                 <svg class="slds-button__icon" aria-hidden="true">
                     <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                 </svg>
             </button>
            <button class="custom-create-btn" onclick={handleAttachment} title="Add Attachment">
                Add Attachment
            </button>
     
             
         </div>
     </div>


     <template if:true={isOpenModal}>
    <div class="blur-overlay"></div>
    <div class="right-align" style="width:40%;">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <h3 style="font-weight: bold;font-size:150%; margin: 0; padding: 3% 0 0 3%;">Add Attachment</h3>

            <!-- <lightning-button class="slds-m-left_small" label="Back" onclick={hideModalBox} variant="brand" style="padding-right: 3.5%;padding-top:2%;"></lightning-button> -->
        </div>
        
            <div class=" slds-p-around_medium">
                <lightning-record-edit-form object-api-name="Repository__c" onsuccess={handleSuccess} onsubmit={handleSubmit}  record-id={recordId} >
                    <lightning-messages></lightning-messages>
                    <div class="seperator">
                        <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                        <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop"><span style="color:red">*</span>Name</span>
                                <lightning-input-field field-name="Name" required="true" variant="label-hidden"> </lightning-input-field>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop"><span style="color:red">*</span>Uploaded by</span>
                                <lightning-input-field field-name="User__c" required="true" value={uploadedByUser} variant="label-hidden" disabled> </lightning-input-field>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop"><span style="color:red">*</span>Type</span>
                            <lightning-input-field field-name="Type__c" required="true" variant="label-hidden" onchange={changeExpense}> </lightning-input-field>
                        </div>
                    </div>
                    <template if:true={textboxFlag}>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label" >
                        <span class="label-text-drop">Please Specify</span>
                        <lightning-input-field field-name="Other_Comments__c" variant="label-hidden"> </lightning-input-field>
                    </div>
                    </div>
                    </template>
                    <template if:false={textboxFlag}>
                                
                    </template>

                    <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop"><span style="color:red">*</span>Date</span>
                            <lightning-input-field field-name="Date__c" date-style="long" required="true" variant="label-hidden" onchange={changeExpense}> </lightning-input-field>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label" style="height:63px">
                            <span class="label-text-drop">Comments</span>
                            <lightning-input-field field-name="Comments__c" variant="label-hidden" onchange={changeExpense}> </lightning-input-field>
                        </div>
                    </div>

                    <!-- <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label">
                            
                            <input type="file" id="fileInput" onchange={onFileUpload} accept=".jpg, .jpeg, .png, .gif" name="uploadFile" style="display: none;">
                            <button type="button" onclick={triggerFileInput} class="file-upload-button">
                                &#8684; Upload File
                            </button>
                            <div class="slds-text-body_small">{fileName}
                                <template if:true={showSpinner}>
                                    <lightning-spinner alternative-text="Uploading the file......" size="medium">                        
                                        </lightning-spinner>
                                </template>
                                </div>
                            <template if:true={isattachError}>
                            <p style="color:red">File Size Can not exceed 512MB </p>  
                            </template>
                        </div>
                    </div> -->
                     
                    <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label">
                            
                             <input type="file"  onchange={onFileUpload} accept=".jpg, .jpeg, .png, .gif" name="uploadFile" style="display: none;">
                             <button type="button" onclick={triggerFileInput} class="file-upload-button" style="display:flex;">
                                <i class="material-icons ">upload</i> Upload File
                            </button>
                            <div class="slds-text-body_small">{fileName}
                                <template if:true={showSpinner}>
                                    <lightning-spinner alternative-text="Uploading the file......" size="medium">                        
                                        </lightning-spinner>
                                </template>
                                </div>
                            <template if:true={isattachError}>
                            <p style="color:red">File Size Can not exceed 512MB </p>  
                            </template>
                        </div>
                    </div>
                </div>
                </div>
                <!-- modal footer start-->
                <div class="slds-grid slds-grid_align-center">
                    <lightning-button  label="Cancel" onclick={hideModalBox} variant="brand-outline"></lightning-button>
                    <lightning-button type="submit" variant="brand" label="Save" class="slds-m-left_small"></lightning-button>
                    
                </div>                        
                </lightning-record-edit-form>  
            
        </div>
    </div>
  </template>  
     
   </template>
  
    
     
  
  <template if:true={isHome}> 
      <template if:true={data}>
        <div class="content-wrapper">
         <div class="table-container custom-scroll">
             <template if:false={noRecordsFlag}>
             <table class="slds-table slds-table_cell-buffer" style="table-layout:fixed;">
                 <thead>
                     <tr>
                         <th class="slds-cell-wrap th">Name</th>
                         <th class="slds-cell-wrap th">Type</th>
                         <th class="slds-cell-wrap th">Size</th>
                         <th class="slds-cell-wrap th">Comments</th>
                         <th class="slds-cell-wrap th">Uploaded by</th>
                         <th class="slds-cell-wrap th">Date</th>
                         <th class="slds-cell-wrap th">Actions</th>
                     </tr>
                 </thead>
                 <tbody>
                     <template for:each={data} for:item="attachment">
                         <tr key={attachment.Id} class="tr1">
                             <td class="slds-cell-wrap">{attachment.Name}</td>
                             <td class="slds-cell-wrap">{attachment.Type__c}</td>
                             <td class="slds-cell-wrap">{attachment.Size__c}</td>
                             <td class="slds-cell-wrap description" title={attachment.Comments__c}>{attachment.Comments__c}</td>
                             <td class="slds-cell-wrap">{attachment.User_Name__c}</td>
                             <td class="slds-cell-wrap">{attachment.Date_Format__c}</td>
                             <td>
                                <template if:true={attachment.isView}>
                                    <a href={attachment.Amazon_file_URL__c}
                                    data-id={attachment.Id}
                                    data-url={attachment.Amazon_file_URL__c}
                                    onclick={handleView}
                                    title="View Repository"
                                    style="text-decoration: none;">
                                    
                                    <i class="material-icons view-icon">visibility</i>
                                    </a>&nbsp;
                                </template>

                                 <!-- <template if:true={attachment.isView}>
                                     <a href={attachment.Amazon_file_URL__c} data-id={attachment.Id} onclick={handleView} data-url={attachment.Amazon_file_URL__c} title="View Repository"><lightning-icon icon-name="action:preview" size="xx-small" title="View" style="cursor:pointer;background:#808080;"></lightning-icon></a>&nbsp;  
                                 </template> -->
                                 <!-- <template if:true={attachment.isEdit}> 
                                     <a href="javascript:void(0)" data-id={attachment.Id} onclick={handleEdit} title="Edit Repository"><lightning-icon icon-name="action:edit" size="xx-small" title="Edit" style="cursor:pointer;color:white;background:#0099DE;"></lightning-icon></a>&nbsp; 
                                 </template> -->
                                <template if:true={attachment.isEdit}>
                                    <a href="javascript:void(0)" 
                                    
                                    title="Edit Repository"
                                    style="text-decoration: none;">
                                    
                                    <i class="material-icons edit-icon" data-id={attachment.Id} 
                                    onclick={handleEdit}>edit_document</i>
                                    </a>
                                </template>
                                <template if:true={attachment.isDelete}> 
                                    <a href="javascript:void(0)" 
                                    data-id={attachment.Id} 
                                    onclick={handleDeleteflag} 
                                    title="Delete Repository"
                                    style="text-decoration: none;">
                                    
                                    <i class="material-icons delete-icon">delete</i>
                                    </a>&nbsp; 
                                </template>



                                 <!-- <template if:true={attachment.isDelete}> 
                                     <a href="javascript:void(0)" data-id={attachment.Id} onclick={handleDeleteflag} title="Delete Repository"><lightning-icon icon-name="action:delete" size="xx-small" title="Delete"></lightning-icon></a>&nbsp; 
                                 </template> -->
                                 <template if:true={isExec}>
                                    <a href="javascript:void(0)"
                                    data-id={attachment.Id}
                                    onclick={handlePermission}
                                    title="Permissions"
                                    style="text-decoration: none;">
                                    
                                    <i class="material-icons rule-icon">passkey</i>
                                    </a>
                                </template>

                             </td>
                         </tr>
                     </template>
                 </tbody>
             </table>
             </template>
             <template if:true={noRecordsFlag}>
                <div class="no-data">
                    <p>No records found</p>
                </div>
            </template>
         </div>
         </div>
     </template>
     

      <template if:true={showSpinner}>         
         <lightning-spinner alternative-text="Loading page....." size="medium"> Your page is loading</lightning-spinner>         
      </template>
      <template if:false={noRecordsFlag}>
      <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-left_xx-large fixed-pagination" style="padding-top: 0.5em;">
      <!--RECORDS PER PAGE-->
      <div class="slds-col">
            <div class="slds-list_inline slds-p-bottom_xx-small">
               <label class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center" for="recordsPerPage">Page Size:</label>
               <div class="slds-select_container">
                  <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                        <template for:each={pageSizeOptions} for:item="option">
                           <option key={option} value={option}>{option}</option>
                        </template>
                  </select>
               </div>
            </div>
      </div>

      <!--PAGE NAVIGATION-->
      <div class="slds-align_absolute-center" style="height:5rem">
            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
            &nbsp;
            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
            &nbsp;
            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
      </div>
      <!--TOTAL RECORDS-->
      <div class="slds-clearfix slds-m-right_xx-large">
            <div class="slds-float_right">
               <span class="slds-badge"> Total Records: {totalRecords}</span>
            </div>
      </div>
      </div>  
      </template>    
   </template>  
  
   <template if:true={isModalOpen}>
    <div class="slds-grid slds-grid_align-end">
      <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
                onclick={closeRepository} style="margin-right:1%;margin-top: 1%;"></lightning-button>
                </div>
                <div class="main-container-iframe custom-scroll">
      
         <iframe src={currentUrl} width="100%" height="1200px" ></iframe>
     
      </div>
   </template>

    <template if:true={isOpenPermission}>
        <div class="blur-overlay"></div>            
        <div class="right-align" style="width:70%;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <h3 style="font-size:140%;font-weight:bold;margin-bottom:0.5%;margin-top:1%;margin-left:2%;"></h3>
                
            </div> 
            <div class="container2" >
                <lightning-button class="slds-m-left_medium" style="position:relative; right:0%; margin-bottom:5px;margin-right:1%;margin-top:1%;left:93%;top:1%;" variant="brand" label="Back" onclick={handleBack}></lightning-button>      
                <div class="containerpermission">      
                    <div class="slds-col slds-size_1-of-2" style="padding-left: 1%;padding-right: 1%;padding-top: 2%;">
                        <div class="floating-label-role" style="width: 100%;">
                            <span class="label-text-drop" style="padding-top:1%;">Select Users</span>
                                <lightning-dual-listbox name="roles" class="list-box" style="padding-bottom: 1%;"
                                    label="Select Users"
                                    source-label="Available"
                                    selected-label="Selected"
                                    variant="label-hidden"
                                    options={userTypeOption} value={selectedRoles}
                                    onchange={handleRoleSelection}></lightning-dual-listbox>   
                                    
                                        <!-- <lightning-dual-listbox name="roles" class="list-box" style="padding-bottom: 1%;"
                                                                label="Select Users"
                                                                source-label="Available"
                                                                selected-label="Selected"
                                                                variant="label-hidden"
                                                                options={filteredUserTypeOption} value={selectedRoles}
                                                                onchange={handleRoleSelection}></lightning-dual-listbox> -->
                                
                                    
                        </div></div>      
                    <!-- User List Table -->
                    <template if:true={userListTable}>
                        <div class="table-container-permission custom-scroll">
                        <table class="slds-table slds-table_cell-buffer" style="table-layout:fixed">
                            <thead>
                                <tr>
                                    <th class="slds-cell-wrap th" style="width:7%;">Select</th>
                                    <th class="slds-cell-wrap th">User Name</th>
                                    <th class="slds-cell-wrap th">User Type</th>
                                    <th class="slds-cell-wrap th">Email ID</th> 
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredUsers} for:item="user">
                                    <tr key={user.Id}>
                                        <td><lightning-input type="checkbox" data-id={user.Id} checked={user.hasViewPermission} onchange={handleUserSelection}></lightning-input></td>
                                        <td class="slds-cell-wrap">{user.FirstName} {user.LastName}</td>
                                        <td class="slds-cell-wrap">{user.User_Type__c}</td>
                                        <td class="slds-cell-wrap">{user.Email}</td> 
                                    </tr>
                                </template>
                            </tbody>
                        </table> 
                        </div>
                    </template>          

                    <!-- Permissions Checkboxes -->
                    <div class="permissions">
                     
                        <div style="flex: 1; display: flex; justify-content: flex-start;">
                            <template if:true={isViewEnable}> 
                                <lightning-input type="checkbox" name="view" label="View" onclick={handlePermissionChange} ></lightning-input>
                            </template>
                        </div>
                           
                        
                        <div style="flex: 1; display: flex; justify-content:center; gap: 10px; margin-right:32%;">
                            <lightning-button label="Cancel" variant="brand-outline" onclick={hideModalBox} ></lightning-button>
                            <lightning-button label="Submit" variant="brand" onclick={handleSubmitPermissions}  disabled={saveDisabled}></lightning-button>
                        </div>
                    </div>   
                    <!-- Submit and Close Buttons -->
                </div>     
            </div>
        </div>
   </template>
  
</div>
<template if:true={DeleteFlag}>
    <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
        class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
    
        <div class="slds-modal__container modal-container" style="max-width:25%;">
         <header class="slds-modal__header" style="background: #002A52;">
            
            <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
        </header> 
        <div class="slds-modal__content slds-p-around_medium modal-content" >                                
            <div class="slds-m-around_small" style="text-align:center">
                <div><p style="text-align: center;">Are you sure you want to delete this attachment?</p></div>
                <div class="button-container slds-m-top_medium">
                    <lightning-button label="No" variant="brand" onclick={handleclose}
                    class="slds-m-around_small"></lightning-button>
                    <lightning-button label="Yes" variant="brand"  onclick={handleDelete} class="slds-m-around_small" ></lightning-button>
                    
                </div>
            </div>
        </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

 <template if:true={showLoadingSpinner}>
      <div class="overlay-logo"></div>
        
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
        
                <!-- Progress text instead of progress bar -->
                <p class="progress-text"></br>Please Wait...</p>
            </div>
   </template>
</template>
