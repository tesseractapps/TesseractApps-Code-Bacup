<template>
  <!-- Main Container -->
  <div class="container">
      
      <!-- Multi-Upload Section -->
      <template if:true={isMultiUserUpload}>
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
          <!-- Title (Left) -->
          <p style="font-weight: bold; margin: 0; font-size: 140%; padding: 1% 0% 2% 1%;">
              Access Manager
          </p>
      
          <!-- Button Group (Right-Aligned) -->
          <div style="display: flex; gap: 8px;">
              <lightning-button 
                  label="Instructions" 
                  variant="brand" 
                  onclick={handleInstructions}
                  class="slds-m-right_small">
              </lightning-button>

              <lightning-button 
                  label="Download Template" 
                  variant="brand" 
                  onclick={handleDownloadTemplate}
                  class="slds-m-right_small">
              </lightning-button>
      
              <lightning-button 
                  label="Back" 
                  variant="brand" 
                  onclick={handleSwitchToSingleUserForm} 
                  class="slds-m-right_small">
              </lightning-button>
          </div>
      </div>      
        
        <div class="upload-button-container">
                <label for="uploadPdf" class="upload-label">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="48" height="48">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                    <p>Click here to upload a file</p>
                </label>
                <input 
                    type="file" 
                    id="uploadPdf" 
                    accept=".csv" 
                    onchange={handleUploadFinished} 
                    class="file-input">
            </div>

            <template if:true={tableData.length}>
              <div class="slds-p-around_medium">
                  <span style="font-size: 20px; font-weight: bold;">User List</span>
                  <div>
                      <table class="slds-table slds-table_cell-buffer fixed-table">
                          <thead>
                              <tr>
                                  <th class="slds-text-align_left">
                                      <lightning-input type="checkbox" onchange={handleSelectAll} checked={isAllSelected}></lightning-input>
                                  </th>
                                  <th class="slds-text-align_left">First Name</th>
                                  <th class="slds-text-align_left">Last Name</th>
                                  <th class="slds-text-align_left">Gender</th>
                                  <th class="slds-text-align_left">Contact Number</th>
                                  <th class="slds-text-align_left">Email ID</th>
                                  <th class="slds-text-align_left">Date of Birth</th>
                                  <th class="slds-text-align_left">Role</th>
                                  <th class="slds-text-align_left">User Type</th>
                                  <th class="slds-text-align_left">Facility</th>
                                  <th class="slds-text-align_left">Status</th>
                                  <template if:true={isProcessed}>
                                      <th class="slds-text-align_left">Processed Status</th>
                                  </template>
                              </tr>
                          </thead>
                          <tbody>
                              <template for:each={paginatedData} for:item="user">
                                  <tr key={user.id} data-id={user.id}>
                                      <td>
                                          <lightning-input type="checkbox" 
                                                           name="userCheckbox" 
                                                           checked={user.isSelected} 
                                                           onchange={handleRowSelection} 
                                                           data-id={user.id}></lightning-input>
                                      </td>
                                      <td>{user.FirstName}</td>
                                      <td>{user.LastName}</td>
                                      <td>{user.Gender}</td>
                                      <td>{user.PhoneNumber}</td>
                                      <td>{user.EmailAddress}</td>
                                      <td>{user.DateofBirth}</td>
                                      <td>{user.Role}</td>
                                      <td>{user.UserType}</td>
                                      <td>{user.Facility}</td>
                                      <td>{user.Status}</td>   
                                      <template if:true={isProcessed}>
                                        <td>
                                            <a href="javascript:void(0);" onclick={handleErrorClick}>{user.ProcessedStatus}</a>
                                        </td>
                                    </template>
                                    
                                  </tr>
                              </template>
                          </tbody>
                      </table>
                    </div>
                  </div>
    
                  <!-- Pagination Section -->
                  <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;width:95%;margin-left:2%">
          <div class="slds-col">
              <div class="slds-list_inline">
                  <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                  <div class="slds-select_container">
                      <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                          <template for:each={pageSizeOptions} for:item="option">
                              <option key={option} value={option}>{option}</option>
                          </template>
                      </select>
                  </div>
              </div>
          </div>
          <div class="slds-align_absolute-center" style="height:5rem;">
              <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button>
              <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
              &nbsp;
              <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
              &nbsp;
              <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
              <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
          </div>
          <div class="slds-clearfix">
              <div class="slds-float_right">
                  <span class="slds-badge"> Total Records: {totalRecords}</span>
              </div>
                  </div>
              </div>

              <!-- Popup for displaying error message -->
              <template if:true={isErrorPopupVisible}>
                    <section class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <header class="slds-modal__header">
                              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleClosePopup}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                              </button>
                            <h2 class="slds-text-heading_medium">Error Details</h2>
                          </header>
                        <div class="slds-modal__content slds-p-around_medium">
                        <p>{errorMessage}</p>
                      </div>
                    </div>
                  </section>
              </template>
          </template>
          
            
    
        <!-- Action Buttons -->
        <div class="slds-grid slds-align_absolute-center slds-m-top_medium" style="padding-bottom: 1%;">
          <lightning-button 
              label="Submit" 
              variant="brand" 
              onclick={handleFinalSubmit} 
              disabled={enableddisabled}
              class="slds-m-right_small">
          </lightning-button>
          <lightning-button 
              label="Cancel" 
              variant="Brand-Outline" 
              onclick={handleSwitchToSingleUserForm}>
          </lightning-button>
      </div>
    </template>
    
      <!-- Single User Form Section -->
      <template if:false={isMultiUserUpload}>
    <!-- Header Section -->
      <div style="display: flex; align-items: center; justify-content: space-between; ">
        <P style="font-weight: bold; margin: 0; font-size: 140%; padding:1% 0% 2% 1%;">Access Manager</P>


        <lightning-button 
                label="Bulk Upload" 
                variant="brand" 
                onclick={handleSwitchToMultiUserUpload} 
                class="slds-m-right_small">
        </lightning-button>
        
    </div>
  

    <!-- Form Fields -->
    <div class="slds-grid slds-wrap" style="padding: 20px 0px;">
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>First Name</span>
          <lightning-input 
            label="First Name" 
            variant="label-hidden" 
            value={firstName} 
            onchange={handleFieldChange} 
            data-field="firstName" 
            required>
          </lightning-input>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Last Name</span>
          <lightning-input 
            label="Last Name" 
            variant="label-hidden" 
            value={lastName} 
            onchange={handleFieldChange} 
            data-field="lastName" 
            required>
          </lightning-input>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Gender</span>
          <lightning-combobox 
            label="Gender" 
            value={selectedGender} 
            options={genderOptions} 
            onchange={handleGenderChange} 
            required 
            variant="label-hidden">
          </lightning-combobox>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Contact Number</span>
          <lightning-input 
            label="Phone Number" 
            variant="label-hidden" 
            type="tel" 
            value={phoneNumber} 
            onchange={PhonenumberChange}  
            pattern="[0-9]{10}" 
            maxlength="10" 
            required>
          </lightning-input>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Email ID</span>
          <lightning-input 
            label="Email Address" 
            variant="label-hidden" 
            type="email" 
            value={email} 
            onchange={handleFieldChange} 
            data-field="email" 
            required>
          </lightning-input>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Date of Birth</span>
          <lightning-input 
            label="Date of Birth" 
            variant="label-hidden" 
            type="date" 
            value={dateOfBirth} 
            onchange={handleFieldChange} 
            data-field="dateOfBirth" 
            required>
          </lightning-input>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Role</span>
          <lightning-combobox 
            label="Role" 
            variant="label-hidden" 
            value={selectedRole} 
            options={filteredRoleOptions} 
            onchange={handlerolechange} 
            required>
          </lightning-combobox>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>User Type</span>
          <lightning-combobox 
            label="User Type" 
            variant="label-hidden" 
            value={selectedUserType} 
            options={UserTypeValues} 
            onchange={handleUserTypeChange} 
            disabled={isUserTypeDisabled} 
            required>
          </lightning-combobox>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Facility</span>
          <lightning-record-picker
                    label="Facility"
                    placeholder="Search Facility..."
                    object-api-name="Facility__c"
                    value={selectedFacility}
                    onchange={handleFacilityChange}
                    variant="label-hidden"
                    filter={filter}>
          </lightning-record-picker>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Hourly Rate</span>
          <lightning-input 
            label="Hourly Rate" 
            variant="label-hidden" 
            type="number" 
            value={hourlyRate} 
            onchange={handleFieldChange} 
            data-field="hourlyRate" 
            step="0.01" 
            min="0" 
            required>
          </lightning-input>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Tax File Number</span>
          <lightning-input 
            label="Tax File Number" 
            type="number" 
            value={taxFileNumber} 
            onchange={handleFieldChange} 
            data-field="taxFileNumber" 
            required 
            variant="label-hidden">
          </lightning-input>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Tax Free Threshold</span>
          <lightning-combobox 
            label="Tax Free Threshold" 
            value={selectedTaxFree} 
            options={taxFreeOptions} 
            onchange={handleTaxFreeThreesholdChange} 
            required 
            variant="label-hidden">
          </lightning-combobox>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <div class="floating-label">
          <span class="label-text-drop"><span style="color:red">*</span>Start Date</span>
          <lightning-input 
            label="Start Date" 
            type="date" 
            value={startDate} 
            onchange={handleFieldChange} 
            data-field="startDate" 
            required 
            variant="label-hidden">
          </lightning-input>
        </div>
      </div>
      <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
        <lightning-input 
          type="toggle" 
          label="Status" 
          onchange={handleStatus} 
          message-toggle-active="" 
          size="xx-small" 
          message-toggle-inactive="">
        </lightning-input>
      </div>
    </div>

    <!-- Address Section -->
    <div class="slds-grid slds-wrap slds-gutters" style="padding-left: 23px;">
      <div style="color:red;">{errorMessage}</div>                      
          <lightning-input-address
               address-label="Address"
                      street-label="Street"
                      city-label="Suburb"
                      country-label="Country"
                      province-label="State"
                      postal-code-label="Post Code"
                      street={street}
                      city={city}
                      country={country}
                      province={province}
                      postal-code={postalcode}
                      onchange={addressInputChange}
                      show-address-lookup required="true">
                      </lightning-input-address>    
    </div>

    <!-- Action Buttons -->
    <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
      <lightning-button 
        label="Create" 
        variant="brand" 
        onclick={handleUserCreation} 
        class="slds-m-horizontal_small">
      </lightning-button>
      <lightning-button 
        label="Cancel" 
        variant="brand-outline" 
        onclick={handleResetForm} 
        class="slds-m-horizontal_small">
      </lightning-button>
    </div>

    <!--Grant Access-->
      <template if:true={showModal}>
          <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                              class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" style="width:55%; margin-left:25%;">
                              
                              <div class="slds-modal__container" >
                                <header class="slds-modal__header" style="background:#124795;border-radius:15px 15px 0 0">
                                
                                <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">User Details</h2>
                            </header> 
                            <div class="slds-modal__content slds-p-around_medium"  style="border-radius:0 0 15px 15px">                                
                                <div class="slds-m-around_small">
                                    <div class="slds-modal__content slds-p-around_medium">
                                        <p><strong>Role:</strong> {userRoledata}</p>
                                    </br>
                                        <p><strong>User Type:</strong> {modalData.userType}</p>
                                    </br>
                                    <p><strong>All Modules:</strong></p>
                                    <div style="Padding-left: 80px">
                                        <template for:each={modules} for:item="module">
                                            <lightning-input 
                                            key={module}
                                            type="checkbox" 
                                            label={module} 
                                            name={module} 
                                            value={module} 
                                            onchange={handleCheckboxChange}>
                                            </lightning-input>
                                        </template>
                                        
                                    </div>
                                                        
                                    </div>
                                    <!-- <div style="margin-top: 10px; display: flex; justify-content: center; gap: 8px; align-items: center;"> -->
                                    <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
                                        <lightning-button label="Save" variant="brand" onclick={handleConfirmReset} class="slds-m-around_small"></lightning-button>
                                        <lightning-button label="Cancel" variant="Brand-Outline" class="slds-m-around_small" onclick={handleCloseModal}></lightning-button>
                                    </div>                                    
                                </div>
                            </div>
                            </div>                          
          </section>
                  <div class="slds-backdrop slds-backdrop_open"></div>
      </template>
      </template>

  </div>
</template>
