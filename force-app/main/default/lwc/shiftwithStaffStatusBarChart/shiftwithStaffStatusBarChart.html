<template>
    <div class="container-box">
        <div>
            <div class="title-bar">
                <a href="#" data-name="Roster Manager" onclick={handleRedirectClick} class="title-link">
                    Roster Manager
                </a>
                <div class="week-selector">
                    <button onclick={handlePreviousWeek} class="arrow-button">❮</button>
                    
                    <!-- Clickable Week Number to reset -->
                    <span class="week-label week-reset" onclick={handleResetToCurrentWeek}>
                        Week
                    </span>
                    
                    <button onclick={handleNextWeek} class="arrow-button">❯</button>
                </div>

            </div>

            <div class="slds-p-around_medium">
                <canvas class="barChart"></canvas>
            </div>
        </div>
    </div>
</template>
