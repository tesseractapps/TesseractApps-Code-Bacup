<template>
    <div class="back-button-container">
        <lightning-button 
            variant="brand" 
            label="Back" 
            onclick={handleBackToForm}>
        </lightning-button>
    </div>

    
    <h3 class="saved-layouts-heading">Your Forms</h3>
    <!-- Your Form Layouts Table (Remaining layouts) -->
    <!-- Custom Layouts Table -->
<table class="saved-layouts-table">
    <thead>
        <tr>
            <th>Title</th>
            <th>Layout Name</th> <!-- Display Name__c in this column -->
            <th>Created Date & Time</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <template for:each={customLayouts} for:item="layout">
            <tr key={layout.layoutName}>
                <td>{layout.title}</td>
                <td>{layout.displayName}</td> <!-- Display Name__c -->
                <td>{layout.dateTimeString}</td>
                <td>
                    <lightning-icon 
                        icon-name="action:edit" 
                        alternative-text="Edit" 
                        title="Edit"
                        size="xx-small"
                        data-id={layout.layoutName} 
                        onclick={handleEditLayout}
                        class="icon-button"
                        style="cursor:pointer;color:white;background-color:#0099DE;">
                    </lightning-icon>
                    <span class="separator"></span>
                    <lightning-icon 
                        icon-name="action:delete" 
                        alternative-text="Delete" 
                        title="Delete"
                        size="xx-small"
                        data-id={layout.layoutName} 
                        onclick={handleDeleteLayout}
                        class="icon-button">
                    </lightning-icon>
                </td>
                
            </tr>
        </template>
    </tbody>
</table>

<h3 class="saved-layouts-heading">Default Forms</h3>
<!-- Default Layouts Table -->
<table class="saved-layouts-table">
    <thead>
        <tr>
            <th>Layout Name</th> <!-- Display Name__c in this column -->
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <template for:each={defaultLayouts} for:item="layout">
            <tr key={layout.layoutName}>
                <td>{layout.displayName}</td> <!-- Display Name__c -->
                <td>
                    <lightning-button 
                        variant="base" 
                        label="Clone" 
                        data-id={layout.layoutName} 
                        onclick={handleCloneLayout}>
                    </lightning-button>
                </td>
            </tr>
        </template>
    </tbody>
</table>




</template>
