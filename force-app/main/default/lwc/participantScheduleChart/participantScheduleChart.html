<template>
    <div class="container-box">
        <div style="background-color:white; margin-top:3%; border-radius: 5%; margin-left: 0; padding-left:4%"> 
            <h3 slot="title">
                <span style="font-size: 100%;font-weight:bold;">Participant Schedule</span>
            </h3>
        </div>
    </br>
    <div class="schedule-container">
        <div class="schedule">
            <!-- Time Slots -->
            <div class="time-slots">
                <template for:each={timeSlots} for:item="timeSlot">
                    <div key={timeSlot} class="time-slot">
                        {timeSlot}
                    </div>
                </template>
            </div>

            <!-- Events -->
            <div class="schedule-grid">
                <template for:each={events} for:item="event">
                    <div key={event.id} class="event grid-line" style={event.style}>
                        <div class="event-indicator" style={event.indicatorStyle}></div>
                        <div class="event-details">
                            <p class="event-time">{event.time}</p>
                            <p class="event-title">{event.title}</p>
                        </div>
                    </div>
                </template>
            </div>            
        </div>
    </div>
    </div>
</template>
