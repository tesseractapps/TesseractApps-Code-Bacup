<template>
    
    <header class="header">
        <div class="search-section">
                <div class="floating-label">
                <lightning-combobox class="wide-combobox" label="Role" variant="label-hidden" value={selectedRole} options={roleOptions} onchange={handlerolechange} required></lightning-combobox>
            </div>
        </div>
    </header>

    <div class="content-wrapper">
        <!-- Scrollable Table Section -->
        <div class="table-container slds-p-around_medium custom-scroll">
            <table class="slds-table slds-table_cell-buffer fixed-table">
                <thead>
                    <tr>
                        <th class="slds-text-align_left">Staff Name</th>
                        <th class="slds-text-align_left">Facility</th>
                        <th class="slds-text-align_left">User Type</th>
                        <th class="slds-text-align_left">Status</th>
                        <th class="slds-text-align_left">Last Updated Date</th>
                        <th class="slds-text-align_left">Created Date</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={paginatedData} for:item="user">
                        <tr key={user.userId} class="tr1">
                            <td>{user.userName}</td>                        
                            <td>{user.staffFacility}</td>
                            <td>{user.userType}</td>
                            <td>{user.userStatus}</td>
                            <td>{user.staffActivatedDate}</td>
                            <td>{user.staffCreatedDate}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination Section -->
    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination" style="padding-top: 0.5em;width:95%;margin-left:2%">
        <div class="slds-col">
            <div class="slds-list_inline">
                <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                <div class="slds-select_container">
                    <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                        <template for:each={pageSizeOptions} for:item="option">
                            <option key={option} value={option}>{option}</option>
                        </template>
                    </select>
                </div>
            </div>
        </div>
        <div class="slds-align_absolute-center" style="height:5rem;">
            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button>
            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
            &nbsp;
            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
            &nbsp;
            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
        </div>
        <div class="slds-clearfix">
            <div class="slds-float_right">
                <span class="slds-badge"> Total Records: {totalRecords}</span>
            </div>
        </div>
    </div>

</template>
