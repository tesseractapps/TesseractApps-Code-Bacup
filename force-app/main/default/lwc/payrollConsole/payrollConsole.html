<template>
    <div class="payrollContainer">
        <div>
            <img src={recruitment} alt="Payrun" width="45px" height="45px" style="margin-right:0.1%;">
                <strong>Payroll</strong>
        </div>
        <!-- <lightning-card title=""> -->
             <!-- <c-home-lwc></c-home-lwc> -->
            <div if:true={isDesktop}>
                <div class="slds-grid slds-var-m-left_x-large slds-var-m-right_x-large">
                    <br>
                        <div class={PayRunClass} title="Payroll" alt="Payroll" name="payroll" src={recruitment} onclick={handlePayRun}
                        style="cursor:pointer;text-align:center;font-color:white;" data-name="payrun"> 
                        Payroll
                    </div><br/>              
                    <div class={expenseClass} data-name="expanseFlag" title="Expenses" alt="Expenses" name="expenses" src={employee}
                            onclick={handleExpenses}
                        style="cursor:pointer;text-align:center;font-color:white;"> 
                        Expenses
                    </div><br/>
                    <div class={invoiceClass} data-name="invoiceFlag" title="Invoices" alt="invoices" name="invoices" src={rewards}
                        onclick={handleInvoice}
                        style="cursor:pointer;text-align:center;font-color:white;">
                        Invoices
                    </div><br/>
                    <div class={reportingClass} data-name="isReportsTab" title="Reporting" alt="Reporting" name="reporting" src={training}
                        onclick={handleReports}
                        style="cursor:pointer;text-align:center;font-color:white;">
                        Reporting
                    </div><br/>
                    <div class={payrunsettingClass} data-name="ispayrollSettings" title="Payroll Settings" alt="Payroll Settings" name="paysettings" src={paysetting}
                        onclick={handlePayrollSettings}
                        style="cursor:pointer;text-align:center;font-color:white">
                        Payroll Settings
                    </div><br/>  
                    <template if:true={Accountantlogin}>
                        <div class="slds-size_1-of-3">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-combobox name="organisation" label="Organisation Name" value={selectedOrg} placeholder="Select Organisation" options={orgOptions} 
                                onchange={handleOrgsChange}></lightning-combobox>                               
                            </div>
                        </div> 
                        <template if:true={showSpinner}>
                            <lightning-spinner alternative-text="Loading page....." size="medium"> Your page is loading</lightning-spinner>
                        </template>
                    </template>
                   
                                                       
                </div>
                
            </div>
        <!-- </lightning-card> -->
    </div>
    
    <!-- <div class="slds-size_1-of-4 slds-float_right" style="margin-top:100px;"></div>            
    <div class="slds-size_1-of-4 slds-float_right">
        <lightning-icon icon-name="standard:agent_home" onclick={navigatetoHome} slot="actions"
            style="cursor:pointer;z-index:100000; margin-top:-3%;" size="medium" class="slds-float_right slds-m-right_small">
        </lightning-icon> 
    </div> -->

    <div style="width:100%;background:white;" class="payrollcontainerchild">
        <div>
            <template if:true={payrun}>                
                <div>
                    <c-pay-run></c-pay-run>
                </div>                
            </template>                         
        </div>
        <div>
            <template if:true={expanseFlag}>               
                    <div>
                        <c-payroll-expenses></c-payroll-expenses>
                    </div>
            </template>
        </div>
        <div>
            <template if:true={ispayrollSettings}>
                <div>
                    <c-payrun-setting></c-payrun-setting>
                </div>
            </template>
        </div>
        <div style="width: auto; height: auto;">
            <template if:true={invoiceFlag}>
                <div>
                    <c-payroll-invoice></c-payroll-invoice>
                </div>
            </template>
        </div>
        <div style="width: auto; height: auto;">
            <template if:true={isReportsTab}>
                <div style="margin-left:4%">
                    <c-payroll-reporting></c-payroll-reporting>
                </div>
            </template> 
        </div>
    
    </div>
</template>
