<template>

    <div class="layout">
        <p style="font-weight: bold; font-size: 140%; padding:1% 0% 1% 1%">Performance Management</p>
    </br>
        <template if:true={homeflag}>
            
            <div class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium"
                style="margin-left: 1%; margin-right: 1%;">

                <!-- Left Section: Title and Combobox -->
                <div class="slds-col slds-size_1-of-2 slds-grid slds-grid_vertical-align-center">
                    <p style="font-weight: bold; font-size: 120%; margin: 0;font-family: 'Roboto', sans-serif;">Assessment Year</p>
                    
                    <lightning-combobox
                        variant="label-hidden"
                        class="slds-m-left_medium"
                        name="Assessment year"
                        placeholder="Select Year"
                        value={selectedYear}
                        options={yearOptions}
                        onchange={handleYearChange}>
                    </lightning-combobox>
                
                </div>
            
                <!-- Right Section: Filter, Search, and Button -->
                <div class="slds-col slds-size_1-of-2 slds-grid slds-grid_align-end slds-grid_vertical-align-center">
                    <span class="filter-text slds-m-right_small" style="font-family: 'Roboto', sans-serif;">Filter By</span>
                    <lightning-icon 
                        icon-name="utility:filterList" 
                        size="x-small" 
                        alternative-text="Filter" 
                        class="filter-icon slds-m-right_small" 
                        onclick={togglePopover}>
                    </lightning-icon>

                    
            
                    <lightning-input
                        variant="label-hidden"
                        class="slds-m-right_small"
                        type="search"
                        placeholder="Search Staff"
                        value={searchStaff}
                        onchange={handleSearchChange}
                        oninput={handleSearchChange}
                        onkeyup={handleKeyup}>
                    </lightning-input>
                    

                
            
                    <lightning-button
                        label="Create New Goal"
                        style="font-family: 'Roboto', sans-serif;"
                        variant="brand"
                        onclick={handleNewGoal}>
                    </lightning-button>
                </div>
            </div>

            <div class="sidebar" if:true={isPopoverVisible}>
                <div class="close-btn" onclick={closePopover}>&times;</div>
                <div class="sidebar-content">

                    <h5 class="month-header">Months</h5> 
                    <div class="box-facility-role" style="margin-bottom:10px;">
                        <template if:true={monthOptions}>
                            <lightning-checkbox-group label="" name="months" options={monthOptions} value={monthValue}
                                onchange={handleCheckBoxChange}>
                            </lightning-checkbox-group>
                        </template>
                    </div>
                    
                    <!-- Role Type -->
                    <h5 class="role-header">Select Role Type</h5> 
                    <div class="box-facility-role">
                        <template if:true={OrgNisationRoles}>
                            <lightning-checkbox-group label="" name="progress" options={OrgNisationRoles} value={chosenRole}
                                onchange={handleCheckBoxChange}>
                            </lightning-checkbox-group> 
                        </template>
                    </div>
                </div>
            </div>
            

            
            
            
            

          
            <template if:true={orgadmin}>
                <!-- <div class="container-table-new"> -->
                  <!-- <template if:true={performanceTableFlag}> -->
                    <table class="slds-table slds-table_cell-buffer table1">
                        <thead>
                            <tr>
                                <th class="slds-text-align_left">Staff Name</th>
                                <th class="slds-text-align_left">Role</th>
                                <th class="slds-text-align_left">Reviewer</th>
                                <th class="slds-text-align_left">Review Period From</th>
                                <th class="slds-text-align_left">Review Period To</th>
                                <th class="slds-text-align_left">Status</th>
                                <th class="slds-text-align_left">Outcome</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredPerformanceData} for:item="performance">
                                <tr key={performance.Id} class="tr">
                                    <td>
                                        <a href="javascript:void(0);" onclick={handleStaffView} data-id={performance.Id} style="color: blue;">
                                            {performance.fullName}
                                        </a>
                                    </td>

                                    <td class="role">{performance.staffRole}</td>
                                    <td>{performance.reviewerName}</td>
                                    <td>{performance.formattedReviewFrom}</td>
                                    <td>{performance.formattedReviewTo}</td>
                                    <td>{performance.status}</td>
                                    <td>{performance.outcome}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                <template if:true={paginationVisible}>
                <!--Pagination Start-->
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;width:95%;margin-left:2%">
                        <!-- RECORDS PER PAGE -->
                        <div class="slds-col">
                            <div class="slds-list_inline ">
                                <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                                <label class="slds-text-color_weak" for="recordsPerPage"></label><!--slds-p-horizontal_x-small-->
                                <div class="slds-select_container">
                                    <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                        <template for:each={pageSizeOptions} for:item="option">
                                            <option key={option} value={option}>{option}</option>
                                        </template> 
                                    </select>
                                </div>
                            </div>
                        </div>
                        <!-- PAGE NAVIGATION -->
                        <div class="slds-align_absolute-center" style="height:5rem;">
                            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                        </div>
                        <!-- TOTAL RECORDS -->
                        <div class="slds-clearfix">
                            <div class="slds-float_right">
                                <span class="slds-badge"> Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </template>
                <!-- </div> -->
            </template>
        </template>
           
        <template if:true={goalNewForm}>
          <div class="blur-overlay"></div>
            <div class="right-align" style="width:80%;">
                <div style="background:#f5faff; padding: 10px;">
                    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 0;">
                        <p style="font-weight: bold; font-size: 140%; margin: 0; font-family: 'Roboto', sans-serif; text-align: center;">
                            Goal Creation & Details
                        </p>
                        <lightning-button label="Back" variant="brand" onclick={handleClose}></lightning-button>
                        
                    </div>
                    
                    <lightning-record-edit-form object-api-name="Performance__c" record-id={recordId} onsubmit={SubmitAll} onsuccess={handleSuccessPerformance}  data-recrdform="performanceGoalForm"><lightning-messages> </lightning-messages> <!-- onsubmit={SubmitAll} -->
                        <div class="container-box">
                          <!-- <div  class="toggle-bar" onclick={handleSectionToggle} data-id="performanceDetails">
                              <span>Create goal</span>
                              <span style="cursor: default;">{sectionIcons.performanceDetails}</span>
            
                          </div> -->
                          <div  class="toggle-bar" onclick={handleSectionToggle} data-id="performanceDetails" style="cursor: pointer;">
                            <span>Create goal</span>
                            <span >{sectionIcons.performanceDetails}</span>      
                          </div>
                          <div class="section-content" data-section="performanceDetails">
                          <template if:true={sectionFlags.performanceDetails}>
                            <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                                <!-- Staff -->
                                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop"><span style="color:red">*</span>Staff Name</span>
                                        <lightning-combobox name="staff" variant="label-hidden" value={selectedStaffId} options={staffOptions} required="true" onchange={handleStaffChange} disabled={isStaffDisabled}></lightning-combobox>
                                    </div>
                                </div>
                            
                                <!-- Reviewer -->
                                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop"><span style="color:red">*</span>Reviewer</span>
                                        <lightning-combobox name="reviewer" variant="label-hidden" value={reviewerId} options={reviewerOptions} required="true" onchange={handleReviewerChange}></lightning-combobox>
                                    </div>
                                </div>
                            
                                <!-- Review Period From -->
                                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop"><span style="color:red">*</span>Review Period From</span>
                                        <lightning-input-field field-name="Review_Period_From__c" variant="label-hidden" value={reviewFromDate} required="true"  onchange={handleChangePerform}></lightning-input-field>   <!--min={todayDate}-->
                                    </div>
                                    <div if:true={dateErrorMessageFrom} style="color: red;">{dateErrorMessageFrom}</div>
                                </div>
                            
                                <!-- Review Period To -->
                                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop"><span style="color:red">*</span>Review Period To</span>
                                        <lightning-input-field field-name="Review_Period_To__c" variant="label-hidden" value={reviewToDate} required="true" onchange={handleChangePerform}></lightning-input-field>
                                    </div>
                                    <div if:true={dateErrorMessageTo} style="color: red;">{dateErrorMessageTo}</div>
                                </div>
                            
                                <!-- Milestone Setting Meeting -->
                                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop">Milestone Setting Meeting</span>
                                        <lightning-input-field field-name="Goal_setting_meeting_conducted_with_Staf__c" variant="label-hidden" value={goalSettingMeeting}></lightning-input-field>
                                    </div>
                                </div>
                            
                                <!-- Mid Year Review Required -->
                                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="slds-grid slds-wrap">
                                        <div class="slds-size_1-of-1">
                                            <label style="display: flex; gap: 5%; padding-top: 2.5%;">
                                                <lightning-input-field field-name="Mid_Year_Reveiw_Required__c" value={isMidYearReviewRequired} variant="label-hidden" onchange={handleMidYearReviewChange}></lightning-input-field>
                                                <span>Mid Year Review Required</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            
                                <!-- Mid Year Review Date -->
                                <template if:true={isMidYearReviewRequired}>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop">Mid Year Review Date</span>
                                            <lightning-input-field field-name="Mid_Year_Reveiw_Date__c" variant="label-hidden" value={midYearReviewDate}></lightning-input-field>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            
                            
                            <div class="slds-small-size_1-of-1 slds-medium-size_1-of-2  slds-p-around_small">
                                <a href="javascript:void(0)" onclick={toggleDetails}>{showHideLink}</a>
                            </div>
                            <template if:true={isDetailsVisible}>
                                <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop">Staff Email</span>
                                            <lightning-input-field field-name="Staff_Email__c" variant="label-hidden" value={staffEmail} disabled="True"></lightning-input-field>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop">Facility</span>
                                            <lightning-input-field field-name="Facility__c" variant="label-hidden" value={facility} disabled="True"></lightning-input-field>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop">Role</span>
                                            <lightning-input-field field-name="Role__c" variant="label-hidden" value={staffRole} disabled="True"></lightning-input-field>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop">Date of Joining</span>
                                            <lightning-input-field field-name="Date_Of_Joining__c" variant="label-hidden" value={dateOfJoining} disabled="True"></lightning-input-field>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop">Level</span>
                                            <lightning-input-field field-name="Level__c" variant="label-hidden" value={levelId} disabled="True"></lightning-input-field>
                                        </div>
                                    </div>
                                    <!-- <div class="slds-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop">Library Goal</span>
                                            <lightning-input-field field-name="Library_Goal__c" variant="label-hidden" value={libraryGoalId} disabled="True"></lightning-input-field>
                                        </div>
                                    </div> -->
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop">Reviewer Email</span>
                                            <lightning-input-field field-name="Reviewer_Email__c" variant="label-hidden" value={reviewerEmail} disabled="True"></lightning-input-field>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <div class="container-box" style="margin-top: 1%;">

                                <!-- <h3 style="font-weight:bold;  padding: 10px;"> Create Goal</h3> -->
                                  
                                <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop"><span style="color:red">*</span>Library Goal</span>
                                            <lightning-combobox name="libraryGoal" variant="label-hidden" value={libraryGoalId} options={libraryGoalOptions} required="true"  onchange={handleLibraryGoal}></lightning-combobox>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop"><span style="color:red">*</span>Actual Weightage of the Goal</span>
                                            <lightning-input type="text" name="goalActualWeightage" variant="label-hidden" required="true" value={goalActualWeightage} onchange={handleChange} disabled="True"></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop"><span style="color:red">*</span>Goal Name</span>
                                            <lightning-input type="text" name="goalName" variant="label-hidden" value={goalName} required="true" onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop"><span style="color:red">*</span>Priority</span>
                                            <lightning-combobox name="priority" variant="label-hidden" value={priority}  options={priorityOptions} required="true" onchange={handleChange}></lightning-combobox>
                                        </div>
                                    </div>
                                    
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop"><span style="color:red">*</span>Start Date</span>
                                            <lightning-input type="date" name="startDate" value={startDate} onchange={handleChange} variant="label-hidden" required="true"  placeholder="Select a date"></lightning-input>    <!--min={todayDate}-->
                                        </div> 
                                        <div if:true={dateErrorMessageStart} style="color: red;">{dateErrorMessageStart}</div> 
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop"><span style="color:red">*</span>End Date</span>
                                            <lightning-input type="date" name="endDate" variant="label-hidden" value={endDate} required="true" onchange={handleChange}></lightning-input>
                                        </div>
                                        <div if:true={dateErrorMessageEnd} style="color: red;">{dateErrorMessageEnd}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop"><span style="color:red">*</span>Target Date</span>
                                            <lightning-input type="date" name="targetDate" value={targetDate} onchange={handleChange} variant="label-hidden" required="true"></lightning-input>
                                        </div>
                                        <div if:true={dateErrorMessageTarget} style="color: red;">{dateErrorMessageTarget}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-new">
                                            <span class="label-text-drop">Related Link</span>
                                            <lightning-input type="url" name="relatedLink" variant="label-hidden" value={relatedLink} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-textarea">
                                            <span class="label-text-drop">Description</span>
                                            <lightning-textarea name="description" variant="label-hidden" value={description} onchange={handleChange}></lightning-textarea>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-textarea">
                                            <span class="label-text-drop">Success Criteria</span>
                                            <lightning-textarea name="successCriteria" variant="label-hidden" value={successCriteria} onchange={handleChange}></lightning-textarea>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label-textarea">
                                            <span class="label-text-drop">Conversation Notes</span>
                                            <lightning-textarea name="conversationNotes" variant="label-hidden" value={conversationNotes} onchange={handleChange}></lightning-textarea>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                        <div class="slds-grid slds-wrap">
                                            <div class="slds-size_1-of-1">
                                                <label style="display: flex;gap:5%;padding-top:2.5%">
                                                    <lightning-input  type="checkbox" variant="label-hidden"  name="isPrivate" checked={isPrivate}  onchange={handlePriorityChange}></lightning-input>
                                                      <span>Private</span>
                                                </label>
                                               
                                            </div>
                                        </div>
                                    </div>
                                    <!-- 
        
                                    <div class="slds-small-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small ">
                                        <div class="date-input-container">
                                            <label class="floating-label">
                                                <span class="label-text">Conversation Notes</span>
                                                <input type="longtextarea" class="styled-date-input" name="conversationNotes" value={conversationNotes}  onchange={handleChange}  />
                                            </label>
                                        </div>
                                    </div> -->
                                    
                                        <!-- <div class="slds-float_right" style="display: flex; justify-content: flex-end; ">
                                            <lightning-button label="Add Goal" variant="brand" onclick={handleAddGoal} style="width: 150px;"></lightning-button>
                                        </div>
                                     -->
                                     <!-- <div class="slds-grid" style="justify-content: flex-end; margin-left: 92%;">
                                        <lightning-button label="Add Goal" variant="brand" onclick={handleAddGoal} style="width: 150px;"></lightning-button>
                                    </div>
                                     -->
                                     <!-- <div class="slds-grid slds-grid_align-end slds-large-size_1-of-1 slds-medium-size_1-of-1 slds-small-size_1-of-1">
                                        <lightning-button label="Add Goal" variant="brand" onclick={handleAddGoal} style="width: 150px;"></lightning-button>
                                    </div> -->
                                    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 10px;">
                                        <p style=" margin: 0;  text-align: center;">
                                           
                                        </p>
                                        <lightning-button label="Add Goal" variant="brand" onclick={handleAddGoal}></lightning-button>
                                        
                                    </div>
                                </div>
                            
                            </div>
                          </template>
                          </div>
                        </div>
                   
                        
                    <!-- Dynamic Goal Fields -->
                     
                     
                    <div class="container-box">

                        <!-- <h3 style="font-weight:bold;  padding: 10px;"> Create Goal</h3> -->
                           <div  class="toggle-bar" onclick={handleSectionToggle} data-id="manageGoalDetails">
                             <span>Manage Goals</span>
                             <span style="cursor: default;">{sectionIcons.manageGoalDetails}</span>
                           </div>
                           <div class="section-content" data-section="manageGoalDetails">
                            <template if:true={sectionFlags.manageGoalDetails}>
                                <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                               <!-- <div class="container-table "> -->
                                <div class="container-table-new">
                                    <div class="slds-grid slds-wrap" style="padding: 0 20px 20px 20px;">
                                        <table class="slds-table slds-table_cell-buffer table2">
                                            <thead>
                                                <tr>
                                                    <th>Goal Name</th>
                                                    <th>Private</th>
                                                    <th>Start Date</th>
                                                    <th>End Date</th>
                                                    <th>Target Date</th>
                                                    <th>Priority</th>
                                                    <th>Actual Weightage</th>
                                                    <th>Action</th>
                                                    
                                                </tr>
                                            </thead>
                                            <tbody>
