<template>
    <template if:true={isLoading}>
        <div class="overlay-logo"></div>
    
        <div class="spinner-wrapper">
            <div class="loader-container">
                <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                <img src={imageUrl} alt="T Logo" class="Tlogo" />
            </div>
    
            <!-- Progress text instead of progress bar -->
            <p class="progress-text">ChaT Loading....</p>
        </div>
    </template>
    <div slot="title" style="font-weight: bold;
    font-size: 140%;
    padding: 1% 0% 1% 1%;">
        ChaT
    </div>
    <!-- <lightning-button label="Delete UAT Users" onclick={deleteUATUsersAndRelatedData}></lightning-button> -->
        <div class="container">
            <!-- User List Section -->
            <div class="user-list-container-head custom-scroll">
                <div class="user-greeting">
                    <div class="avatar-container">
                        <template if:true={currentUserAvatar}>
                            <img src={currentUserAvatar} alt="User Avatar" class="avatar" />
                        </template>
                        <template if:false={currentUserAvatar}>
                            <span class="avatar-placeholder">👤</span>
                        </template>
                    </div>
                    <div class="user-name">
                        <strong class="greeting-text">Hey!</strong>
                        <span class="username-text">{currentUserNameAPI}</span>
                    </div>
                </div>
                
                <!-- Search Bar -->
                <div class="search-bar-container">
                    <lightning-input
                        type="search"
                        placeholder="Search users..."
                        value={searchQuery}
                        onchange={handleSearch}
                        style="width: 89%;"
                        variant="label-hidden">
                    </lightning-input>
                
                    <!-- Plus Button beside Search Bar -->
                    <button class="toggle-new-chats" onclick={toggleNewUserPopup}>
                        <lightning-icon icon-name={toggleIcon} alternative-text="Add New Chat" size="xx-small"></lightning-icon>
                    </button>
                    <button class="toggle-new-group" onclick={toggleGroupPopup}>
                        <lightning-icon icon-name="action:new_group" alternative-text="Create Group" size="xx-small"></lightning-icon>
                    </button>
                </div>
                <div class="user-list-container custom-scroll">
                    <template if:false={showNewUserPopup}>
                        <div class="tab-container">
                            <button class={getChatTabClass} onclick={switchToChats}>Chats</button>
                            <button class={getGroupTabClass} onclick={switchToGroups}>Groups</button>
                        </div>
                    </template>
                    
                    <template if:true={isGroupTabActive}>
                        <template if:false={showNewUserPopup}>
                    <template if:true={groupChats.length}>
                        <ul class="group-list">
                            <template for:each={groupChats} for:item="group">
                                <li key={group.id} class="group-card" onclick={selectGroupChat} data-id={group.id}>
                                    <div class="group-card-content">
                                        <!-- Group Avatar -->
                                        <div class="group-avatar-container">
                                            <template if:true={group.avatar}>
                                                <img src={group.avatar} alt="Group Avatar" class="group-avatar" />
                                            </template>
                                            <template if:false={group.avatar}>
                                                <span class="group-avatar-placeholder">👥</span>
                                            </template>
                                        </div>
                            
                                        <!-- Group Info -->
                                        <div class="group-info">
                                            <strong class="group-name">{group.name}</strong>
                                            <span class="last-message-group">{group.lastMessage}</span>
                                        </div>
                            
                                        <!-- Last Message Time -->
                                        <div class="last-message-time-group">{group.lastMessageTime}</div>
                                    </div>

                                
                                </li>
                            </template>
                            
                        </ul>
                    </template>
                </template>
                </template>
                    
                <!-- Show Existing Chats when showNewUserPopup is FALSE -->
    <template if:false={showNewUserPopup}>
        <template if:true={isChatTabActive}>
        <template if:true={filteredExistingChats.length}>
            <ul>
                <template for:each={filteredExistingChats} for:item="user">
                    <li key={user.id} class="user-card" onclick={selectUser} data-id={user.userId}>
                        <div class="user-card-content">
                            <div class="user-details">
                                <div class="avatar-container">
                                    <template if:true={user.avatar}>
                                        <img src={user.avatar} alt="User Avatar" class="avatar" />
                                    </template>
                                    <template if:false={user.avatar}>
                                        <span class="avatar-placeholder">👤</span>
                                    </template>
                                </div>
                                <div class="user-info">
                                    <strong>{user.name}</strong> <br>
                                    <span class="last-message">{user.lastMessage}</span>
                                </div>
                            </div>
                            <div class="last-message-time">{user.lastMessageTime}</div>
                        </div>
                    </li>
                    
                    
                </template>
            </ul>
        </template>
        <template if:false={filteredExistingChats.length}>
            <div class="no-chats-container">
                <p class="no-chats-text">No chats available.</p>
            </div>
        </template>
    </template>
    </template>

    <!-- Show New User List when showNewUserPopup is TRUE -->
    <!-- Show New User List when showNewUserPopup is TRUE -->
<template if:true={showNewUserPopup}>
    <h3 class="new-user-header">Select a User to Start a Chat</h3>
    <template if:true={filteredNewChats.length}>
        <ul class="new-user-list">
            <template for:each={filteredNewChats} for:item="user">
                <li key={user.id} class="user-card" data-id={user.userId} onclick={selectNewUser}>
                    <div class="user-card-content">
                        <div class="user-details">
                            <div class="avatar-container">
                                <template if:true={user.avatar}>
                                    <img src={user.avatar} alt="User Avatar" class="avatar" />
                                </template>
                                <template if:false={user.avatar}>
                                    <span class="avatar-placeholder">👤</span>
                                </template>
                            </div>
                            <div class="user-info">
                                <strong>{user.name}</strong>
                            </div>
                        </div>
                    </div>
                </li>
            </template>
        </ul>
    </template>
    <template if:false={filteredNewChats.length}>
        <p>No new users available.</p>
    </template>
</template>

<!-- Group Creation Modal -->

                                            </template>
                                        </p>
                                    </div>

                                </div>

                    <div class="chat-input-container">

                    <!-- Group Messages -->
                    <!-- Group Messages -->
                    <div class="group-messages-container custom-scroll" onscroll={handleGroupScroll}>
                        <template for:each={messages} for:item="msg">
                            <template if:true={msg.isDateSeparator}>
                                <div key={msg.id} class="date-separator">
                                    {msg.text}
                                </div>
                            </template>
                            
                            <template if:true={msg.isPoll}>
                                <div key={msg.id} class={msg.computedClass}>
                                    <!-- Sender Name & Timestamp (Outside Bubble) -->
                                    <div class="poll-metadata">
                                        <span class="poll-sender">{msg.senderName}</span>
                                        <span class="poll-timestamp">{msg.createdAt}</span>

                                                <li key={option.value} class="poll-option-item">
                                                    <button class="poll-option-button"
                                                            data-id={msg.id}

                                                                    <template for:each={option.voters} for:item="voter">
                                                                        <li key={voter}>{voter}</li>
                                                                    </template>
                                                                </ul>
                                                            </template>

                                    </div>

                                </div>

                                                        </template>
                                                        <button class="delete-message" data-id={msg.id} onclick={openGroupDeleteModal}></button>
                                                    </div>
                                                </template>
                                            </template>
                                        </span>
                                    </div>
                                </template>
                            </template>
                        </template>
                    </div>

<!-- 📌 Custom Poll Modal -->
<template if:true={showPollModal}>
    <div class="custom-poll-overlay">
        <div class="custom-poll-container">
            <h3 class="custom-poll-title">Create a Poll</h3>
            
            <lightning-input 
                type="text" 
                label="Poll Question" 
                value={pollQuestion} 
                onchange={handlePollQuestionChange} 
                class="custom-poll-question-input">
            </lightning-input>
            
            <ul class="custom-poll-options-list">
                <template for:each={pollOptions} for:item="option">
                    <li key={option.id} class="custom-poll-option-item">
                        <input type="text" data-id={option.id} value={option.value} 
                               oninput={handlePollOptionChange} class="custom-poll-textbox" />
                        <button data-id={option.id} onclick={removePollOption} class="custom-poll-delete-btn">×</button>
                    </li>
                </template>
            </ul>

            <button class="custom-poll-add-btn" onclick={addPollOption}>+ Add Option</button>

            <div class="custom-poll-buttons">
                <button class="custom-poll-submit-btn" onclick={sendPollMessage}>Send Poll</button>
                <button class="custom-poll-cancel-btn" onclick={closePollModal}>Cancel</button>
            </div>
        </div>
    </div>
</template>
