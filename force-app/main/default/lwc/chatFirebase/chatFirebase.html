<template>
    <template if:true={isLoading}>
        <div class="overlay-logo"></div>
    
        <div class="spinner-wrapper">
            <div class="loader-container">
                <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                <img src={imageUrl} alt="T Logo" class="Tlogo" />
            </div>
    
            <!-- Progress text instead of progress bar -->
            <p class="progress-text">ChaT Loading....</p>
        </div>
    </template>
    <!-- <div slot="title" style="font-weight: bold;
    font-size: 140%;
    padding: 1% 0% 1% 1%;">
        ChaT
    </div> -->
        <div class="main-container custom-scroll">
            <!-- User List Section -->
            <div class="user-list-container-head custom-scroll">
                <div class="user-greeting">
                    <div class="avatar-container">
                        <template if:true={currentUserAvatar}>
                            <img src={currentUserAvatar} alt="User Avatar" class="avatar" />
                        </template>
                        <template if:false={currentUserAvatar}>
                            <span class="avatar-placeholder">👤</span>
                        </template>
                    </div>
                    <div class="user-name">
                        <strong class="greeting-text">Hey!</strong>
                        <span class="username-text">{currentUserNameAPI}</span>
                    </div>
                </div>
                
                <!-- Search Bar -->
                <div class="search-bar-container">
                    <lightning-input
                        type="search"
                        placeholder="Search users..."
                        value={searchQuery}
                        onchange={handleSearch}
                        style="width: 89%;"
                        variant="label-hidden">
                    </lightning-input>
                
                    <!-- Plus Button beside Search Bar -->
                    <button class="toggle-new-chats" onclick={toggleNewUserPopup}>
                        <lightning-icon icon-name={toggleIcon} alternative-text="Add New Chat" size="xx-small"></lightning-icon>
                    </button>
                </div>
                <div class="user-list-container custom-scroll">
                <!-- Show Existing Chats when showNewUserPopup is FALSE -->
    <template if:false={showNewUserPopup}>
        <template if:true={filteredExistingChats.length}>
            <ul>
                <template for:each={filteredExistingChats} for:item="user">
                    <li key={user.id} class="user-card" onclick={selectUser} data-id={user.id}>
                        <div class="user-card-content">
                            <div class="user-details">
                                <div class="avatar-container">
                                    <template if:true={user.avatar}>
                                        <img src={user.avatar} alt="User Avatar" class="avatar" />
                                    </template>
                                    <template if:false={user.avatar}>
                                        <span class="avatar-placeholder">👤</span>
                                    </template>
                                </div>
                                <div class="user-info">
                                    <strong>{user.name}</strong> <br>
                                    <span class="last-message">{user.lastMessage}</span>
                                </div>
                            </div>
                            <div class="last-message-time">{user.lastMessageTime}</div>
                        </div>
                    </li>
                </template>
            </ul>
        </template>
        <template if:false={filteredExistingChats.length}>
            <div class="no-chats-container">
                <p class="no-chats-text">No chats available.</p>
            </div>
        </template>
    </template>

    <!-- Show New User List when showNewUserPopup is TRUE -->
    <!-- Show New User List when showNewUserPopup is TRUE -->
<template if:true={showNewUserPopup}>
    <h3 class="new-user-header">Select a User to Start a Chat</h3>
    <template if:true={filteredNewChats.length}>
        <ul class="new-user-list">
            <template for:each={filteredNewChats} for:item="user">
                <li key={user.id} class="user-card" data-id={user.id} onclick={selectNewUser}>
                    <div class="user-card-content">
                        <div class="user-details">
                            <div class="avatar-container">
                                <template if:true={user.avatar}>
                                    <img src={user.avatar} alt="User Avatar" class="avatar" />
                                </template>
                                <template if:false={user.avatar}>
                                    <span class="avatar-placeholder">👤</span>
                                </template>
                            </div>
                            <div class="user-info">
                                <strong>{user.name}</strong>
                            </div>
                        </div>
                    </div>
                </li>
            </template>
        </ul>
    </template>
    <template if:false={filteredNewChats.length}>
        <p>No new users available.</p>
    </template>
</template>

            </div>



                <template if:false={filteredUsers}>
                    <p>No users found.</p>
                </template>
            </div>

            <!-- Chat Room Section -->
            <div class="chat-container">

                <template if:false={selectedUserId}>
                    <div class="select-user-message">
                        <lightning-icon icon-name="utility:comments" alternative-text="Chat Icon" size="large" class="chat-icon"></lightning-icon>
                        <p>Welcome! Select a user to begin your conversation.</p>
                    </div>                    
                </template>
                <!-- Chat Header with Selected User Info -->
                <template if:true={selectedUserId}>
                    <div class="chat-header">
                        <div class="header-content">
                            <div class="avatar-container">
                                <template if:true={selectedUserAvatar}>
                                    <img src={selectedUserAvatar} alt="User Avatar" class="avatar" />
                                </template>
                                <template if:false={selectedUserAvatar}>
                                    <span class="avatar-placeholder">👤</span>
                                </template>
                            </div>
                            <strong class="user-name">{selectedUserName}</strong>
                        </div>
                    </div>
                </template>

                <div class="messages-container custom-scroll" onscroll={handleScroll}>
                    <template for:each={messages} for:item="msg">
                        <template if:true={msg.isDateSeparator}>
                            <div key={msg.id} class="date-separator">{msg.text}</div>
                        </template>
                        <template if:false={msg.isDateSeparator}>
                            <div key={msg.id} class="message-wrapper">
                                <div class={msg.senderClass}>
                                    <p>{msg.text}</p>
                                </div>
                                <span class={msg.timestampClass}>{msg.createdAt}</span>
                            </div>
                        </template>
                    </template>
                
                    <!-- ✅ Unread Messages Button (Hidden until needed) -->
                    <template if:true={unreadMessagesCount}>
                        <button class="unread-messages-button" onclick={handleUnreadMessagesClick}>
                            {unreadMessagesCount} New Messages
                        </button>
                    </template>
                </div>
                
                
                
                
                

                <template if:true={selectedUserId}>
                    <div class="chat-input-container">
                        <textarea 
                            class="custom-message-input custom-scroll-textarea" 
                            placeholder="Type your message..." 
                            value={messageInput} 
                            oninput={handleMessageChange} 
                            onkeypress={handleKeyPress}
                        ></textarea>

                        <button class="custom-send-button" onclick={sendMessage} disabled={isSending}>
                            <span>Send</span>
                            <img src={sendIconUrl} alt="Send" class="custom-send-icon">

                        </button>
                    </div>
                </template>
                
            </div>
        </div>
    
</template>
