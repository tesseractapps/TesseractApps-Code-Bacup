<template>
    <div class="main-container">
        <div class="learning-hub">
            <!-- Header Section -->
            <div class="hub-header">
            
                         <div class="floating-label">
                      
                        <lightning-input
        type="search"
        variant="label-hidden"
        placeholder="Search"
        value={searchTerm}
        onchange={handleSearch}>
    </lightning-input>
                         </div>
                    <!-- </div>
                </div> -->
                <div class="platform-filter">
                    <select value={selectedPlatform} onchange={handlePlatformChange} class="platform-select">
                        <template for:each={platformOptions} for:item="option">
                            <option key={option.value} value={option.value}>{option.label}</option>
                        </template>
                    </select>
                </div>
            </div>

            <!-- Video Categories -->
            <div class="categories-container custom-scroll">
                <template for:each={filteredVideoData} for:item="category">
                    <div key={category.id} class="category-section">
                        <div class="category-header">
                            <span class="category-title">
                                {category.dynamicTitle}
                            </span>
                            <!-- <div class="platform-tabs">
                                <button class="tab-button active">Web</button>
                                <button class="tab-button">Mobile</button>
                            </div> -->
                            <!-- <div class="platform-tabs">
<button
    class={category.tabClasses.web}
    data-platform="web"
    data-category-id={category.id}
    onclick={handlePlatformTabClick}
>
    Web
</button>

<button
    class={category.tabClasses.mobile}
    data-platform="mobile"
    data-category-id={category.id}
    onclick={handlePlatformTabClick}
>
    Mobile
</button>


</div> -->

                        </div>

                        <div class="video-grid">
                            <template for:each={category.filteredVideos} for:item="video">
                                
                                <div 
                                    key={video.id} 
                                    class="video-card"
                                    data-video-id={video.id}
                                    data-category-id={category.id}
                                    onclick={handleVideoClick}
                                >
                                    <div class="video-thumbnail">
                                        <img src={video.thumbnail} alt={video.title} class="thumbnail-image" />
                                        <div class="duration-badge">{video.duration}</div>
                                        <!-- <div class="thumbnail-gradient-overlay">
                    <div class="thumbnail-title">{video.title}</div>
                </div> -->
                                        <!-- <template if:true={video.completed}>
                                            <div class="completion-badge">
                                                <lightning-icon icon-name="utility:check" alternative-text="Completed" size="xx-small"></lightning-icon>
                                                <span>Completed</span>
                                            </div>
                                        </template> -->
                                        <div class="play-overlay">
                                            <lightning-icon icon-name="utility:play" alternative-text="Play" size="medium"></lightning-icon>
                                        </div>
                                    </div>
                                    <div class="video-info">
                                        <h3 class="video-title">{video.title}</h3>
                                        <div class="video-meta">
                                            <span class="platform-tag">{video.platform}</span>
                                            <!-- <span class="upload-date">{video.uploadedDate}</span> -->
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template if:false={category.filteredVideos.length}>
                                <div class="no-videos-msg">
                                    No videos available in this platform.
                                </div>
                            </template>
                        </div>
                        <div class="category-divider"></div>
                    </div>
                </template>
            </div>

            <!-- Video Modal -->
            <template if:true={isVideoModalOpen}>
                <div class="modal-backdrop">
                    <div class="video-modal">
                        

                        <div class="video-container-mix">
                        <div class="video-gradient-overlay">
                            <div class="video-title-text">{selectedVideo.title}</div>
                        </div>

                        <div class="modal-header top-right">
                         
                            <button class="close-button" onclick={closeVideoModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            </button>
                        </div>

    <video 
        class="video-player"
        src={selectedVideo.videoUrl}
        poster={selectedVideo.thumbnail}
        controls
        disablepictureinpicture
        oncontextmenu={handleContextMenu}
        ontimeupdate={handleVideoTimeUpdate}
    ></video>
</div>

                        </div>
                    
                </div>
            </template>
        </div>
    </div>
</template>
