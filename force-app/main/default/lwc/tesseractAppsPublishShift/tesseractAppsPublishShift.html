                                    <th>Role</th>
                                    <th>{facilityPreferredName}</th>
                                    <th>EOI</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={unAllocatedTableList} for:item="shift">
                                    <tr key={shift.Id} class="tr1" ><!-- class={shift.className} -->
                                        <td>{shift.serialNumber}</td>
                                        <td>{shift.Quantity__c}</td>
                                        <td>{shift.Un_Allocated__c}</td>
                                        <td>{shift.date}</td>
                                        <td>{shift.Shift_Start_End_Time__c}</td>
                                        <td>{shift.duration}</td>
                                        <td>{shift.Shift_Type__c}</td>
                                        <td>{shift.Role__c}</td>
                                        <td>{shift.Facility_Name__c}</td>
                                        <td>{shift.EOIvalue}</td>
                                        <td><p><a href="javascript:void(0)"  data-shiftid={shift.Id}  onclick={handleUnAllocatedEdit}> Edit</a>&nbsp;|&nbsp; <a href="javascript:void(0)" data-shiftid={shift.Id}  data-quantity={shift.Un_Allocated__c} data-eoivalue={shift.EOIvalue}  data-startdate={shift.Start_Date__c} data-fac={shift.Facility__c} onclick={handleUnAllocated}> Allocate</a></p></td>      
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>

            <template if:true={isAllocateTable}>
                <!-- <template if:true={otherThanNDISUser}>
                    <div class="slds-size_1-of-4 slds-p-around_small">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Role</span>
                            <lightning-combobox name="serviceStaff"  variant="label-hidden" options={RoleFilter} value={isRoleChangedDuringFilterChange} onchange={handleRoleFilterChange}  disabled={disablePostInsertButtons}
                                ></lightning-combobox>
                        </div>
                    </div>
                </template> -->
                <div class="slds-col slds-size_12-of-12 slds-p-horizontal_small">
                    <div class="slds-box slds-theme_default slds-m-bottom_small"><!--  Box 5 -->
                            <table>
                                <thead>
                                    <tr>
                                        <th>Sl.No</th>
                                        <th>Full Name</th>
                                        <th>Role</th>
                                        <th>{facilityPreferredName}</th>
                                        <th>Hourly Rate</th>
                                        <th>Shift Duration</th>
                                        <th>Shift Wages</th>
                                        <th>Status</th>
                                        <th>SCR</th>
                                        <th>Class</th>
                                        <th>Allocate</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={staffHorlyRateList} for:item="staff">
                                        <tr key={staff.Id} class="tr1"><!-- class={staff.className} -->
                                            <td>{staff.serialNumber}</td>
                                            <td>{staff.fullName}</td>
                                            <td>{staff.role}</td>
                                            <td>{staff.facilityname}</td>
                                            <td>{staff.Hourlyrate}</td>
                                            <td>{staff.duration}</td>
                                            <td>${staff.shiftWage}</td>
                                            <td>{staff.activeOrInactive}</td>
                                            <td>{staff.scr}</td>
                                            <td>{staff.ClassAndLevel}</td>
                                            <td>
                                                <lightning-input type="toggle" variant="label-hidden" data-id={staff.Id} message-toggle-active="" size="xx-small" 
                                                            message-toggle-inactive="" onchange={handleAllocateToggle}  checked={staff.isAllocate}></lightning-input>
                                            </td>
                                            
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        
                    </div>
                    <div style="display:flex;justify-content:flex-end">
                        <lightning-button label="Allocate" title="Allocate" onclick={HandleAllocate} variant="brand" disabled={isDisableAllocated}></lightning-button>
                    </div>
                </div>
            </template>
            
        </div>
        <template if:true={isShowSpinner}>
            <div >
              <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
          </div>
        </template>
       
    </div>
    <template if:true={fatigueManagementFlag}> 
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
        class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
       
        <div class="slds-modal__container modal-container" style="max-width:25%;">
            <!-- Centered Header -->
            <header class="slds-modal__header" style="background: #002A52;">
                <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align: center;">Warning</h2>
            </header> 

            <!-- Modal Content -->
            <div class="slds-modal__content slds-p-around_medium ">                                
                <div class="slds-m-around_small" style="text-align:center">
                    <div>
                       
                            <p>
                                The interval between shifts is less than 8 hours for the following staff
                                <span><b>{fatigueConfirmationMessge}</b></span>. Would you like to assign this shift?
                            </p>
                        
                    </div>
                    
                    <!-- Centered Buttons -->
                    <div class="button-container slds-m-top_medium">
                        
                        <lightning-button label="No" variant="brand" onclick={handleDeselectStaff} class="slds-m-around_small"></lightning-button>
                        <lightning-button label="Yes" variant="brand" onclick={handleFinalAllocate} class="slds-m-around_small"></lightning-button>
                       
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={setHoursIndicatorflag}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
            class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
           
            <div class="slds-modal__container modal-container" style="max-width:25%;">
                <!-- Centered Header -->
                <header class="slds-modal__header" style="background: #002A52;">
                    <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Warning</h2>
                </header> 
    
                <!-- Modal Content -->
                <div class="slds-modal__content slds-p-around_medium modal-content">                                
                    <div class="slds-m-around_small" style="text-align:center">
                        <div>
                            
                                <p>
                                    Set hours for the following staff is exceeded.<span><b>{setHoursIndiactorConfirmation}</b></span>. 
                                    Would you like to assign this shift?
                                </p>
                            
                        </div>
                        
                        <!-- Centered Buttons -->
                        <div class="button-container slds-m-top_medium">
                            
                            <lightning-button label="No" variant="brand" onclick={handleDeselectStaff} class="slds-m-around_small"></lightning-button>
                            <lightning-button label="Yes" variant="brand" onclick={HandleNavigateToFatigue} class="slds-m-around_small"></lightning-button>
                           
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
    
    
</template>
