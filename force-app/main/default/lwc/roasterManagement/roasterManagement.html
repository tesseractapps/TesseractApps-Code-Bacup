            <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
        </header> 
        <div class="slds-modal__content slds-p-around_medium"  style="border-radius:0 0 15px 15px">                                
            <div class="slds-m-around_small">
                <div><h1>Are you sure you want to submit timesheet for&nbsp;{confirmationData.totalHours}&nbsp;</h1></div>
                <div style="margin-top:10px;align-items:center;">
                    <lightning-button label="Yes" variant="brand"  onclick={handlesubmit} class="slds-m-around_small" style="margin-left:4rem;"></lightning-button>
                    <lightning-button label="No" variant="brand" onclick={handlesubmissionclose}
                    class="slds-m-around_small"></lightning-button>
                </div>
            </div>
        </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
<template if:true={invoiceDeleteFlag}>
    <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
        class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
    
        <div class="slds-modal__container" style="width:10%;">
         <header class="slds-modal__header" style="background:#124795;border-radius:15px 15px 0 0">
            
            <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:left;">Please Confirm</h2>
        </header> 
        <div class="slds-modal__content slds-p-around_medium"  style="border-radius:0 0 15px 15px">                                
            <div class="slds-m-around_small">
                <div><h1>Are you sure you want to delete the invoice ?</h1></div>
                <div style="margin-top:10px;align-items:center;">
                    <lightning-button label="Yes" variant="brand"  onclick={handledelete} class="slds-m-around_small" style="margin-left:4rem;"></lightning-button>
                    <lightning-button label="No" variant="brand" onclick={handledeleteclose}
                    class="slds-m-around_small"></lightning-button>
                </div>
            </div>
        </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

<template if:true={isShowChecklsit}>
                       
  <div class="blur-overlay"></div>
        <div class="right-align1" style="width:40%;">
      <div style="display:flex;justify-content: flex-end;padding-right:1%;"><lightning-button label="Back" variant="brand" onclick={handleeditCloseCheckList} ></lightning-button></div>

  <div class="container-box">
      <div  class="toggle-bar"  style="cursor: pointer;">
        <span>Checklist</span>
      </div>
    
      <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
          <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout slds-table_resizable-cols cheListtable">
              <thead>
                  <tr>
                      
                      <th>Description</th>
                      <th>Mandatory</th>
                      <th>Completed</th>
                  </tr>
              </thead>
              <tbody>
                  <template for:each={checklistData} for:item="item">
                      <tr key={item.id}>
                          <td class="description">{item.description}</td>
                          <td>
                              <template if:true={item.isMandatory}>
                                  <lightning-badge label="Yes"></lightning-badge>
                              </template>
                              <template if:false={item.isMandatory}>
                                  <lightning-badge label="No"></lightning-badge>
                                  
                              </template>
                          </td>
                          <td>
                              <lightning-input 
                                  type="checkbox" 
                                  data-id={item.id} 
                                  checked={item.isCompleted}
                                  disabled=true
                                  >
                              </lightning-input>
                          </td>
                      </tr>
                  </template>
              </tbody>
          </table>

      </div>
        
     
  </div>
</div>        
</template>
  <template if:true={isShowActivity}>

  <div class="blur-overlay"></div>
  <div class="right-align1" style="width:40%;">
  <div style="display:flex;justify-content: flex-end;padding-right:1%;"><lightning-button label="Back" variant="brand" onclick={handleeditCloseCheckList} ></lightning-button></div>

  <div class="container-box">
  <div  class="toggle-bar"  style="cursor: pointer;">
  <span>Activity</span>
  </div>
    <template if:true={activitydata}>
      <template for:each={activitydata} for:item="activity">
          <div key={activity.Id} class="activity-card" >
              <div class="left-strip">
              <div class="content">
                  <div class="title">{activity.Notes__c}</div>
              </div>
                  <!-- <div class="time">{activity.Time}</div> -->
              </div>
          </div>
      </template>
    </template>
  </div>
  </div>        
  </template>

  <template if:true={moreFlag}>
    <div class="popup" style={popupStyle}>
      <span class="close-icon" onclick={closeTooltip}>✖</span>
    <template for:each={shifts} for:item="shift">

      <div key={shift.Id} class="shift-card">
         <template if:true={editTimings}> 
          <a  href="javascript:void(0)" data-id={shift.Id} data-shiftwages={shift.Shift_Wage__c} data-addshiftid={shift.Add_Shift__c} data-shifttype={shift.Add_Shift__r.Shift_Type__c} data-staffid={shift.Staff__c}  data-extendedwages={shift.Variance_Wage__c} data-sleepovernightwages={shift.Sleepover_Variance_Wages__c} data-extendedduation={shift.Extended_Duration__c} data-extendedinhourandmins={shift.Extended_Duration_in_Hours_and_Mins__c}
          data-currentshiftrates={shift.Staff_Final_Hourly_Rate__c}  data-isextended={shift.Extended_Shift__c} data-extendedvariancerate={shift.Variance_Rate__c} data-sleepovernightshift={shift.Sleepover_Night_Shift_hours__c} data-sleepovernightshiftrate={shift.Sleepover_Night_Shift_Hourly_Rate__c} data-enddate={shift.End_Date__c} data-totaltime={shift.Add_Shift__r.Shift_Start_End_Time__c}  onclick={handleEditShift}   title="Edit Shift" >{shift.Add_Shift__r.Shift_Start_End_Time__c}</a>
        </template>
        <template if:false={editTimings}> 
          {shift.Add_Shift__r.Shift_Start_End_Time__c}
        </template>
          <p></p>
          <p>Actual Duration:{shift.Duration__c}</p>
          <p>Shift Duration: {shift.Actual_Duration_In_Hours_and_Mins__c}</p>
          <template if:true={shift.Extended_Duration__c}>
            <p> Var :{shift.Extended_Duration_in_Hours_and_Mins__c} </p>
          </template>
       
         
      </div>
  </template>
  </div>

  </template>

    stafffullname={staffFullname} staffrole={staffRole} orgid={orgId}></c-tesseract-apps-accounting-r-m-invoice> 
  </template> -->
