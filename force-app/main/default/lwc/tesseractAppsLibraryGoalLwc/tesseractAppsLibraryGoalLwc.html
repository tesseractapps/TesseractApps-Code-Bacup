<template>
    <div class="container">
        <template if:true={homeflag}>
            <!-- <div class="slds-grid slds-wrap slds-align_absolute-center slds-p-around_medium "> -->
                <!-- <div class="slds-grid slds-wrap">
                    <p style="font-weight: bold; font-size: 1.8rem; margin: 0;">Library Goal</p>
                    
                     <lightning-button label="Create Library Goal" variant="brand"
                         onclick={handleNewLibrary}  disabled={isCreateDisabled} ></lightning-button>
                </div> -->

                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <!-- Left side: Staff Details -->
                    <p style="font-weight: bold; font-size: 140%; padding: 1% 0% 0% 1%">Library Goal</p>
                
                    <!-- Right side: Back button and image icon -->
                    <div style="display: flex; align-items: center; margin-right:1%; padding-top: 1.5%;">
                        <lightning-button label="Create Library Goal" variant="brand" style="font-family: 'Roboto', sans-serif;"
                         onclick={handleNewLibrary}  disabled={isCreateDisabled} ></lightning-button>
                    </div>
                </div>
            </br>
            <!-- </div> -->
            <!-- <div class="container-table-new"> -->
                <!-- <template if:true={libraryGoalTable}> -->
                <table class="slds-table slds-table_cell-buffer">
                    <thead>
                        <tr>
                            <th class="slds-text-align_left">Library Goal</th>
                            <th class="slds-text-align_left">Level</th>
                            <th class="slds-text-align_left">Role</th>
                            <th class="slds-text-align_left">Actual Weightage</th>
                            <!-- <th class="slds-text-align_left">Actions</th> -->
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={libraryGoalData} for:item="library">
                            <tr key={library.Id} class="tr">
                                <td>{library.Name}
                                    <!-- <a href="javascript:void(0);"  data-id={library.Id} style="color: blue;">    
                                        {library.Name}
                                    </a> -->     <!--onclick={handleLibraryView}--> 
                                </td>
                                <td>{library.Level__c}</td>
                                <td>{library.Role__c}</td>
                                <td>{library.Actual_Weightage_of_the_Goal__c}</td>
                            </tr>
                        </template>
                                
                    </tbody>
                </table>
                <template if:true={paginationVisible}>
                  <!--Pagination Start-->
                  <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;width:95%;margin-left:2%">
                    <!-- RECORDS PER PAGE -->
                    <div class="slds-col">
                        <div class="slds-list_inline ">
                            <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                            <label class="slds-text-color_weak" for="recordsPerPage"></label><!--slds-p-horizontal_x-small-->
                            <div class="slds-select_container">
                                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template> 
                                </select>
                            </div>
                        </div>
                    </div>
                    <!-- PAGE NAVIGATION -->
                    <div class="slds-align_absolute-center" style="height:5rem;">
                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                        &nbsp;
                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                        &nbsp;
                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                    </div>
                    <!-- TOTAL RECORDS -->
                    <div class="slds-clearfix">
                        <div class="slds-float_right">
                            <span class="slds-badge"> Total Records: {totalRecords}</span>
                        </div>
                    </div>
                  </div>
                </template>
            <!-- </div> -->
            <!-- </template> -->
        </template>
        <template if:true ={addLibraryGoalFlag}>
            <div class="blur-overlay"></div>
                <div class="right-align" style="width:30%;">
                    <div style="background:#f5faff; padding: 10px;">
                    
                        <!-- <lightning-button style="margin-left:78%; " label="Back" variant="brand" onclick={handleClose}></lightning-button>
                        <h2 style="font-weight:bold; font-family: 'Roboto', sans-serif; padding-left: 6%;">New Library Goal</h2> -->
                        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 0;">
                            <p style="font-weight: bold; font-size: 140%; padding-left:1%; margin: 0; font-family: 'Roboto', sans-serif; text-align: center;">
                                New Library Goal
                            </p>
                            <lightning-button label="Back" variant="brand" onclick={handleClose}></lightning-button>
                            
                        </div>
                    
                    <lightning-record-edit-form object-api-name="Library_Goal__c" record-id={recordId} onsuccess={handleSuccess} onsubmit={handleSubmit}><lightning-messages> </lightning-messages>
                        <div class="container-box">
                            <div class="slds-grid slds-wrap slds-p-around_small">
                                <div class="slds-size_1-of-1 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop"><span style="color:red">*</span>Library Goal</span>
                                        <lightning-input-field field-name="Name" variant="label-hidden" required="true"></lightning-input-field>
                                    </div>
                                </div>
                                <!-- <div class="slds-size_1-of-2 slds-p-around_small">
                                    
                                </div> -->
                                <div class="slds-size_1-of-1 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop"><span style="color:red">*</span>Level</span>
                                        <lightning-combobox name="levelId" variant="label-hidden" value={levelId}  options={levelOptions} required="true" onchange={handleChange}></lightning-combobox>
                                    </div>
                                </div>
                                <div class="slds-size_1-of-1 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop">Role</span>
                                        <lightning-combobox name="role" variant="label-hidden" value={orgRoles} options={organisationRoles} onchange={handleChange}></lightning-combobox>
                                    </div>
                                </div>
                                <div class="slds-size_1-of-1 slds-p-around_small">
                                    <div class="floating-label-new">
                                        <span class="label-text-drop"><span style="color:red">*</span>Actual Weightage</span>
                                        <lightning-input-field field-name="Actual_Weightage_of_the_Goal__c" variant="label-hidden" required="true" value={actualWeightage} onchange={handleChange}></lightning-input-field>
                                    </div>
                                </div>
                                <div class="slds-size_1-of-1 slds-p-around_small">
                                    <div class="floating-label-textarea">
                                        <span class="label-text-drop">Description</span>
                                        <lightning-textarea name="description" variant="label-hidden" value={description} onchange={handleChange}></lightning-textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-align_absolute-center ">
                                <lightning-button type="submit" variant="brand" label="Submit" disabled={saveButtonDisable}></lightning-button>
                                <lightning-button label="Cancel" variant="Brand-Outline" onclick={handleClose} class="slds-m-around_small"></lightning-button>
                            </div>
                        </div>
                        
                    </lightning-record-edit-form>
                </div>
                </div>
        </template>
        
    </div>
</template>
