   <template if:true={isFileSTP}>

                variant="inverse"
                size="small" ></lightning-icon>
                <span class="slds-assistive-text">Close</span>

        </header>

                    <p><b>Pay run</b> {groupName}</p> 
                </div>
                <div class="fileSTPHeadings">
                    <p><b>ABN</b> {orgABN}</p>            
                </div>
                <div class="fileSTPHeadings">
                    <p><b>Branch</b> 1</p>             
                </div>
                <br/>

                <div class="authorizationtoFile">
                    Authorization to file
                </div>
                <br/>
                <div class="currentUser">
                    {currentUser}
                </div>
                <br/>
            
                <div class="paragraph">
                    <p><b> &bull; </b>I have reviewed the information to be filed in this payroll report and that it is true and correct.</p> 
                </div>
                <br/>

                <div class="paragraph">
                    <p><b> &bull; </b>I am authorized to file the information in this payroll report to the commissioner and make this declaration</p> 
                </div>
                <br/>

                <div class="paragraph">
                    <p><b> &bull; </b>I have read and accepted the terms and conditions of the <a href="https://www.sbr.gov.au/sbr-products-register/sbr-end-user-agreement" target="_blank">SBR end user agreement</a></p> 
                </div>
                <br/>

                <div class="paragraph">
                    <p><b> &bull; </b>I understand that Pinnacle IT Services Australia Pty Ltd is not providing an agent service and is not responsible for the
                            accuracy of what I am filling, preparation of any taxation, superannuation or other related documents on behalf of my business/entity.</p>                                
                </div>
                <br/>
                    
                <div class="byClickingParagraph">
                    <p><b> &bull; </b> By clicking &lsquo;Submit to ATO&rsquo; you are signing this declaration and authorizing Pinnacle IT Services to file this report with
                            the ATO on your behalf</p> 
                </div>
                <br/>
        
        </div>

        <!-- modal footer start-->
        <footer class="slds-modal__footer">
            <lightning-input type="checkbox" name="valid" label={chkLabel} onchange ={handleStpauth}> 
            </lightning-input>    
            <button class="slds-button slds-button_neutral" disabled={hideSTPButton} onclick={submitSTP}>Submit to ATO</button>
        </footer>

        </div>
        </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    </div>
    </div>
