  <template if:true={isOpenModal}>
    <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
    class="slds-modal slds-fade-in-open slds-modal_small" role="dialog" tabindex="-1">        
      <div class="slds-modal__container ">
        <!-- modal header start -->
        <header class="slds-modal__header">
          <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"  onclick={hideModalBox}>
            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
              size="small"></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>
          <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate" style="font-weight: bold;">Upgraded Features</h2>
        </header>
        
        <div class="slds-modal__content slds-p-around_medium">
          <h2 class="slds-text-heading_medium">What's New?</h2><br>
          <p><strong>v1.17.0</strong></p> 
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Extended Shift: Option to add extended shift hours and rates when shift timings are extended.</li>
            <li>Sleepover Night Shift: Track night hours and reflect them in payslips.</li>
            <li>Rounding Off: Automatically round off sign in and sign out timestamps.</li>
            <li>Roster Manager Filters: Added filters for shift type and status in Roster Manager.</li>
            <li>BMS Identifier & Software ID: Generation of BMS Identifier and Software ID.</li>
            <li>Weekly Calendar: Added weekly calendar view for staff scheduling.</li>
            <li>Sign in Task: Automatic task creation in the dashboard when a staff member requests sign in.</li>
            <li>Bug Fixes: Major bug fixes across the application.</li> 
            <li>Invoice Redesign: Complete redesign of invoices across the web app, including PDF changes for ICT Timesheet, Roster Timesheet, Payroll Invoice, and Participant Services.</li>
            <li>Mobile Geolocation: Enable/disable geolocation feature on mobile.</li> 
            <li>Disable Screenshot: Option to disable screenshot capture on mobile.</li>
            <li>Risk Management: Added an "Other" checkbox option across all sections to provide more flexibility in risk categorization.</li>                    
          </ul><br>
          <p><strong>v1.16.0</strong></p> 
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Fatigue Management: Fatigue warning triggered if the gap between two shifts is ≤8 hours (for completed shifts only, not recurring).</li>
            <li>Participant View: Calendar view added, allowing shift creation/editing for multiple staff. Prevents multiple participants in one shift.</li>
            <li>Participant Address: When creating a service, the participant’s address is now saved in the shift.</li>
            <li>Classification Rating: Classification rating is now captured based on SCHADS award rates.</li>
            <li>ICT Timesheets - Clone: The Clone feature removed, and a checkbox was added for previous date shifts (Mon-Fri).</li>
            <li>Participant Dashboard: Enhanced schedule visibility in the dashboard.</li>
            <li>Chat Enhancements: Edit/Delete messages, create group chats, and conduct polls.</li>
            <li>T sign: Supports Word document uploads.</li> 
            <li>ICT Dashboard Upgrade: The ICT dashboard has been enhanced with improved functionality and a more user-friendly interface for better tracking and management of timesheets and other ICT-related tasks.</li>                   
          </ul><br>
          <p><strong>v1.15.0</strong></p> 
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Shift Compliance Rating (SCR): Tracks employee shift compliance with legal and company policies.</li>
            <li>Sleepover: Manages overnight shifts and staff accommodations.</li>
            <li>ICT Timesheet - Multiple Breaks & UI Upgrade: Supports multiple breaks and a UI improvement for better usability.</li>
            <li>Roster Management - UI Upgrade: Enhanced timesheet and reimbursement UI for easier roster management.</li>
            <li>ICT Dashboard - Leave Management Updates: Added leave management features to the ICT Dashboard.</li>
            <li>Activity Log and Checklist in Sign-In: Access activity logs and checklists during sign-in for better task tracking both in Mobile and Web application.</li>
            <li>Logout Button: Easy-to-use logout button added for better security.</li>
            <li>Chat - Mobile & Web: Real-time chat feature available on both platforms.</li>
            <li>Sign in Page Upgrade: Redesigned Sign in page with improved functionality and UI.</li>
            <li>Table - Upgraded: Enhanced Documentation table for better data management in HR and Staff modules.</li>
            <li>Homepage - Organisation Name: Organisation name now displayed on the homepage.</li>
            <li>Participant Schedule in Dashboard: Integrated participant schedule into the main dashboard for better management.</li>
            <li>T sign in Service Agreement: Integrated T sign for electronic signature in service agreements.</li>
            <li>Risk Management: Introduced risk management features for participant safety.</li>          
          </ul><br>
          <p><strong>v1.14.0</strong></p> 
          <ul class="slds-list_dotted slds-m-top_large">
            <li>New UI/UX: A new UI/UX with revamped interface with slide windows for editing/creating and a side menu for easy navigation.</li>
            <li>Roster Management: A calendar view has been added with enhanced functionality, including recurring options for daily, weekly, and monthly schedules, along with a checklist for staff convenience.</li>
            <li>Performance Management Module: A new module where HR Admins can create a library and set performance goals, staff can define their own goals, and HR can review and verify staff performance.</li>
            <li>Access Manager: Manage user roles and access levels; Org Admins can handle account creation, password resets, and access grants.</li>
            <li>Dashboard: Personalized user dashboards based on access and role.</li>
            <li>T Sign: An electronic signature feature for quick document signing, allowing signatures to be sent to multiple recipients. A chat feature is also enabled for recipients to clarify doubts with HR.</li>
            <li>Mobile UI: New mobile UI with a shift carousel, map view, slide menu, and updated color theme for a fresh look.</li>            
          </ul><br>          
          <p><strong>v1.13.0</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Active, Inactive and All in Admin: Added a button to filter active, inactive, or all staff, participants, or facilities, with a confirmation prompt before changing status to inactive.</li>
            <li>Public Holidays in My Profile: Pre-populated state field, adjusted leave calculations by state, and added public holiday filtering and sorting by state and financial year.</li>
            <li>Speech to Text - Web: Implemented speech-to-text for shift notes in Roster Management, notes in Participant Journal, and rich text in Incident Register.</li>
            <li>Customizable Forms: Added a Forms tab in Admin for form customization.</li>
            <li>Speech to Text - Mobile: Developed speech-to-text for shift notes, Participant Journal, and Incident Register in the mobile app.</li>
            <li>LMS in Mobile App: Implemented a separate Leave Management System (LMS) module in the mobile app.</li>            
          </ul><br>
          <p><strong>v1.12.0</strong></p><br>
          <p><strong>Roster Management:</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Drag-and-Drop Bug Fix: Fixed drag-and-drop allocation for unassigned staff roles.</li>
            <li>Shift Notes Limit Increase: Increased shift notes character limit to 2000.</li>
            <li>Delete Shift: Added delete icon for accepted shifts.</li>
            <li>Split Shifts: Allowed splitting shifts for multiple staff with unique services.</li>
            <li>Prevent Shifts for Inactive Facility Staff: Blocked shift creation for staff linked to inactive facilities.</li>
            <li>Customizable Services Table: Added customizable table for services in Roster Admin.</li>
            <li>Edit Services: Enabled service editing, with certain fields disabled in the Participants module.</li>
            <li>NDIS Catalogue Update: Updated NDIS rates for 2024-2025 in Roster Management.</li>
          </ul><br>
          <p><strong>UI/UX Enhancements:</strong></p>
          <!-- <h2 class="slds-text-heading_medium">UI/UX Enhancements:</h2> -->
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Expand/Collapse Functionality: Added expand/collapse in various modules for easier navigation.</li>
            <li>My Profile UI Upgrade: Improved My Profile UI for better accessibility.</li>
          </ul><br>
          <p><strong>Participants Module:</strong></p>
          <!-- <h2 class="slds-text-heading_medium">Participants Module:</h2> -->       
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Upload Profile Picture: Added profile picture upload in the Participants module.</li>
            <li>Participant Schedule: Implemented Schedule tab for better activity tracking.</li>
          </ul><br>
          <p><strong>Admin Module:</strong></p>
          <!-- <h2 class="slds-text-heading_medium">Admin Module:</h2><br> -->
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Add Multiple Staff: Filtered staff by facility and role in Admin and Participants modules.</li>
            <li>Permissions for Repository and Participants: Admin controlled access to files in Repository and Participants modules.</li>
          </ul><br>
          <p><strong>General Updates:</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Hide Inactive Facilities: Hid inactive facilities in dropdowns across the app.</li>
          </ul><br>

          <p><strong>v1.11.0</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Roster Management: Major bug fixes in Roster Management drag and drop functionality.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>UI enhancements: The application now supports expand and collapse functionality across various modules, enhancing navigation and user experience.The My Profile tab has undergone a UI enhancement, improving accessibility and making it easier to manage personal information.</li>
          </ul>          
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Mobile App Enhancements: The mobile version has been updated to support Incident Register and Reimbursement Approval/Submissions enhancing mobile functionality.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>SCHADS Award - Inclusive or Exclusive Superannuation: A new option has been introduced in Staff Employment Details to choose between inclusive or exclusive superannuation, which affects payroll calculations.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Break Time Inclusion and Exclusion in Shift Duration: For SCHADS Award staff, break time is now included in shift duration calculations, while for non-SCHADS Award staff, break time is excluded.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Roster Management - Night Shift Support: The Roster Manager now supports the proper handling of night shifts, ensuring accurate shift tracking and scheduling for nighttime work.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Update Show Activity Logs Table: The activity logs table has been updated from a standard format to a customized version, improving visibility and usability of tracked activities.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Awards and Recognition - Separate Certificates for Each Award: Employees now receive individual certificates for each award, and both staff and admins can download certificates associated with each award.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Multiple Staff Assigning to Participants: The system now allows the assignment of multiple staff members to individual participants, enabling more flexible care and service management.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Incident Register: Once an incident is resolved, it becomes non-editable and generates a downloadable PDF. Fields like email, phone, and facility name are prepopulated based on user or participant data. Key question labels are updated, and an "Other" option with a text box is added for incident types.</li>
          </ul><br>

          <p><strong>v1.10.0</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Roster Management: Services created in the Participants module can now be acquired via the Roster Management-Staff hyperlink, and recurring services can be configured.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Participant Login: A dedicated login has been established for participants, allowing access to only the participant module.</li>
          </ul>          
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Feedback Functionality: Feedback options have been integrated into both participant and admin logins to enable staff feedback within the Participants module.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Payroll Accountant Login: Separate logins for payroll accountants have been created, supporting both single and multiple organisations.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Geolocation Tracking: Polylines have been added to enhance geolocation tracking capabilities.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Reimbursements Update: A new field in Admin - Payroll Settings allows for input of cost per km for reimbursements, enabling staff to enter mileage and amounts for automatic reimbursement calculations.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>My Profile Reports: My Profile tab allows users to securely download payslips and timesheets with a user-friendly, mobile-responsive interface for efficient payroll and work-hour management.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Awards: The application now enables employees to receive awards. Staff and admins can download certificates associated with awards.</li>
          </ul><br>

          <p><strong>v1.9.0</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Wyzed Integration
              : Seamless integration with Wyzed for enhanced e-learning and training. Users can access training modules, track progress, and manage certifications directly within the platform.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Roster Management - UI Uplift
              : User Interface improvements for Roster Management. The interface has been redesigned for better usability and aesthetic consistency, improving shift scheduling, staff allocation and roster management efficiency.</li>
          </ul>          
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Awards and Recognition
              : A new system to acknowledge employee achievements. Managers can approve awards to the staff within the platform.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Activity Statements
              : Enhanced activity statement generation. Users can generate detailed activity statements for compliance and reporting purposes, with improved filtering and customization options.</li>
          </ul><br>

          <p><strong>v1.8.0</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Enhance UI/UX Consistency
              : Standardized formatting and capitalization across Admin, Payroll, and Sign-In modules.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Improve ICT Timesheet Functionality
              : Added break times in ICT timesheets.</li>
          </ul>          
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Strengthen HR and Admin Modules
              : New document attachment features, ABN fields, and updated leave management.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Optimize Roster Management
              : Accurate SCHADS award rates for NDIS users and overtime implementation.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Leave Management System
              : Enhanced leave types, workflows, and balance displays.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Chat of Expenses
              : Added functionality to manage and import various expenses via Excel in the Payroll module.</li>
          </ul>          
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Address Critical Bugs
              : Resolved defects in Participant Module, Sign-In Module, and other areas.</li>
          </ul><br>

          <p><strong>v1.7.0</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>UI upgraded to card view and tables across the entire application, including image uploads for participant,facility and staff modules
              : Modernized the user interface with card views and improved table layouts throughout the application, and added image upload functionality for participant and staff modules.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Importing bulk expenses and invoices through CSV file: Added functionality to import multiple expenses and invoices via CSV file upload.</li>
          </ul>          
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Security on AWS Payslip and attachments links: Enhanced security measures for AWS-hosted payslip and attachment links.</li>
          </ul>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Bug fixes on Payroll YTD values: Resolved issues affecting the accuracy of Year-To-Date payroll</li>
          </ul>          
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Improved UI for issue register and contact us, added email alerts for new ticket creations
              : Enhanced the user interface for the issue register and contact us pages, and implemented email alerts for newly created tickets.</li>
          </ul><br>
          <p><strong>v1.6.3</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Finalised - Upgraded UI.</li>
          </ul><br>
          <p><strong>v1.6.2</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>A new "Finalise" button has been added to the Payroll module.</li>
          </ul><br>
          <p><strong>v1.6.1</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Year-to-Date (YTD) values will now reset to zero at the start of each financial year.</li>
          </ul><br>
          <p><strong>v1.6.0</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>New enhancements on UI changes and functionalities within Human Resources module.</li> <!--<b style="font-size:40px;">.</b> -->
            <li>Enhanced support ticket functionality to provide 24/7 customer support operations.</li>
            <li>Enhancements on layouts of Invoices in Payroll module.</li>
            <li>Updated Superannuation and Tax rates for the financial year of 2024-2025.</li>
            <li>Bug fixes throughout the application.</li>
            <li>Removed the excess code for better performance.</li>
            <li>Introduced new roles.</li>
            <li>Welcome email from address format has been updated.</li>
            <li>The Issue Register module has been developed.</li>
          </ul>
        </div>      
        <div class="slds-modal__footer">
          <lightning-button label="Cancel" variant="brand" onclick={hideModalBox} class="slds-m-around_small"></lightning-button>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={privacyOpen}>   
    <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
    class="slds-modal slds-fade-in-open slds-modal_small" role="dialog" tabindex="-1">
        
      <div class="slds-modal__container ">
        <!-- modal header start -->
        <header class="slds-modal__header">
          <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"  onclick={hideModalBox}>

              size="small"></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>

          <p><strong>1. Introduction</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Tesseract Apps is committed to protecting your privacy. This policy outlines our practices regarding the collection, use, and disclosure of your information on our website and application.</li>
          </ul><br>
          <p><strong>2. Information Collection</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>We may collect personal information such as your name, email address, phone number, and payment information when you use our services, application, or contact us. We also collect non-personal information such as usage data, device information, and cookies.</li>
          </ul><br>
          <p><strong>3. Use of Information</strong></p>
          <p><strong>We use your personal information to:</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Provide and improve our services.</li>
            <li>Process transactions.</li>
            <li>Communicate with you.</li>
            <li>For marketing purposes.</li>
          </ul><br>
          <p><strong>We use non-personal information to:</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Analyze usage patterns and improve user experience.</li>
            <li>Maintain and enhance the security of our services.</li>
          </ul><br>
          <p><strong>4. Information Sharing</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>We do not sell, trade, or otherwise transfer your personal information to outside parties except as necessary to provide our services, comply with the law, or protect our rights.</li>
          </ul><br>
          <p><strong>5. Security</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>We implement a variety of security measures to protect your personal information. However, no method of transmission over the internet or electronic storage is 100% secure.</li>
          </ul><br>
          <p><strong>6. Cookies</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>Our website and application may use cookies to enhance user experience. You can choose to set your browser or device to refuse cookies or alert you when cookies are being sent.</li>
          </ul><br>
          <p><strong>7. Changes to Privacy Policy</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>We reserve the right to update this privacy policy at any time. Any changes will be posted on this page.</li>
          </ul><br>
          <p><strong>8. Contact Us</strong></p>
          <ul class="slds-list_dotted slds-m-top_large">
            <li>If you have any questions regarding this privacy policy, you can contact us at: enquiries@tesseractapps.com</li>
          </ul>
        </div> 
        <div class="slds-modal__footer">
          <lightning-button label="Cancel" variant="brand" onclick={hideModalBox} class="slds-m-around_small"></lightning-button>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>

          </ul><br>
