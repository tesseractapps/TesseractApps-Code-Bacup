<template>
    <div class="slds-grid slds-wrap" >
        <div class="slds-size_1-of-6 slds-p-around_small slds-m-left_small">
            <div class="floating-label">
                <span class="label-text-drop"><span style="color:red">*</span>Company</span>
                <lightning-combobox label="Company" variant="label-hidden" name="selectedCompany" 
                    value={selectedCompany} options={companyOptions} onchange={handleChangeCompany} 
                    data-field="selectedCompany" required>
                </lightning-combobox>
            </div>
        </div>
         <button 
                class="slds-button slds-button_icon slds-button_icon-border"  style="margin-right: 1%; margin-top:1%;"
                title="Refresh" 
                onclick={fetchReplist}>
                <svg class="slds-button__icon" aria-hidden="true">
                    <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                </svg>
            </button>
    </div>
    <div class="slds-grid slds-wrap" >
        <template if:true={isSalesPurchases}>
            <!-- Left Section: Roster Management (6/12, Full height) -->
            <div class="slds-col slds-size_6-of-12 " style="height: 100%;">
                <div class="slds-theme_default slds-p-left_x-small slds-p-right_medium slds-p-top_x-small slds-p-bottom_x-small" style="height: 100%;">
                    <c-chart-of-accounts-sales-chart-lwc ongrandchildevent={handlechildevent} orgid={orgid} selectedcompany={selectedCompany}></c-chart-of-accounts-sales-chart-lwc>
                </div>
            </div>
        </template>
        <template if:true={isPurchases}>
           
            <div class="slds-col slds-size_6-of-12 " style="height: 100%;">
                <div class="slds-theme_default slds-p-left_x-small slds-p-right_medium slds-p-top_x-small slds-p-bottom_x-small" style="height: 100%;">
                    <c-chart-of-accounts-purchases-chart-lwc ongrandchildevent={handlechildevent} orgid={orgid} selectedcompany={selectedCompany}></c-chart-of-accounts-purchases-chart-lwc>
                </div>
            </div>
        </template>
        <template if:true={isSales}>
            <!-- Left Section: Roster Management (6/12, Full height) -->
            <div class="slds-col slds-size_5-of-12 " style="height: 100%;">
                <div class="slds-theme_default slds-p-left_x-small slds-p-right_medium slds-p-top_x-small slds-p-bottom_x-small" style="height: 100%;">
                    <c-accounting-sales-chart-lwc ongrandchildevent={handlechildevent} orgid={orgid} selectedcompany={selectedCompany}></c-accounting-sales-chart-lwc>
                </div>
            </div>
        </template>
       
        <!-- <template if:true={isPayroll}>
            <div class="slds-col slds-size_6-of-12 slds-p-right_medium slds-p-left_x-small">
                <div class="container-box">   
                    <c-invoice-status-bar-chart></c-invoice-status-bar-chart>
                </div>
            </div>
        </template> -->
        <!-- <div class="slds-grid slds-wrap custom-grid"> -->
            <div class="slds-col slds-size_6-of-12 slds-p-right_medium slds-p-left_x-small">
                <div class="container-box">
                    <c-payroll-chart></c-payroll-chart>
                </div>
            </div>
        <!-- </div>-->
        <template if:true={isBalanceSheet}>
            <!-- Left Section: Roster Management (6/12, Full height) -->
            <div class="slds-col slds-size_6-of-12 " style="height: 100%;">
                <div class="slds-theme_default slds-p-left_x-small slds-p-right_medium slds-p-top_x-small slds-p-bottom_x-small" style="height: 100%;">
                    <c-tesseract-apps-balancesheet-charts-lwc ongrandchildevent={handlechildevent} orgid={orgid} selectedcompany={selectedCompany}></c-tesseract-apps-balancesheet-charts-lwc>
                </div>
            </div>
        </template>
        <template if:true={isProfitAndLoss}>
            <!-- Left Section: Roster Management (6/12, Full height) -->
            <div class="slds-col slds-size_6-of-12 " style="height: 100%;">
                <div class="slds-theme_default slds-p-left_x-small slds-p-right_medium slds-p-top_x-small slds-p-bottom_x-small" style="height: 100%;">
                    <c-tesseract-apps-profit-and-loss-charts-lwc ongrandchildevent={handlechildevent} orgid={orgid} selectedcompany={selectedCompany}></c-tesseract-apps-profit-and-loss-charts-lwc>
                </div>
            </div>
        </template>
    </div>

        <div class="container-box">

                    <canvas class="barChart" style="display: block; height: 274px;width: 532px;"></canvas>
                </div>
            </div>
        </div> 
    </div> -->
</template>
