<template>
    <div class="main-container">
        <!-- Header Section with Company Selection -->
        <div class="slds-grid slds-wrap header-section">
            <div class="slds-size_1-of-6">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Company</span>
                    <lightning-combobox 
                        label="Company" 
                        variant="label-hidden" 
                        name="selectedCompany" 
                        value={selectedCompany} 
                        options={companyOptions} 
                        onchange={handleChangeCompany} 
                        data-field="selectedCompany" 
                        required>
                    </lightning-combobox>
                </div>
            </div>
            <button 
                class="slds-button slds-button_icon slds-button_icon-border refresh-btn"
                title="Refresh" 
                onclick={fetchReplist}>
                <svg class="slds-button__icon" aria-hidden="true">
                    <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                </svg>
            </button>
        </div>

        <!-- Fixed Size Charts Grid -->
        <div class="content-wrapper custom-scroll">
            <div class="charts-grid">

                 <template if:true={isSalesPurchases}>
                    <div class="chart-container fixed-chart">
                        <div class="chart-wrapper">
                            <c-chart-of-accounts-sales-chart-lwc ongrandchildevent={handlechildevent} orgid={orgid} selectedcompany={selectedCompany}></c-chart-of-accounts-sales-chart-lwc>
                        </div>
                    </div>
                </template>
                
                <!-- Sales Chart -->
                <template if:true={isSales}>
                    <div class="chart-container fixed-chart">
                        <div class="chart-wrapper">
                            <c-accounting-sales-chart-lwc 
                                ongrandchildevent={handlechildevent} 
                                orgid={orgid} 
                                selectedcompany={selectedCompany}>
                            </c-accounting-sales-chart-lwc>
                        </div>
                    </div>
                </template>
                
                <!-- Purchases Chart -->
                <template if:true={isPurchases}>
                    <div class="chart-container fixed-chart">
                        <div class="chart-wrapper">
                            <c-chart-of-accounts-purchases-chart-lwc 
                                ongrandchildevent={handlechildevent} 
                                orgid={orgid} 
                                selectedcompany={selectedCompany}>
                            </c-chart-of-accounts-purchases-chart-lwc>
                        </div>
                    </div>
                </template>

                <!-- Payroll Chart -->
                <template if:true={isPayroll}>
                    <div class="chart-container fixed-chart">
                        <div class="chart-wrapper">
                            <c-payroll-chart 
                                ongrandchildevent={handlechildevent} 
                                orgid={orgid} 
                                selectedcompany={selectedCompany}>
                            </c-payroll-chart>
                        </div>
                    </div>
                </template>

                <!-- Balance Sheet Chart -->
                <template if:true={isBalanceSheet}>
                    <div class="chart-container fixed-chart">
                        <div class="chart-wrapper">
                            <c-tesseract-apps-balancesheet-charts-lwc 
                                ongrandchildevent={handlechildevent} 
                                orgid={orgid} 
                                selectedcompany={selectedCompany}>
                            </c-tesseract-apps-balancesheet-charts-lwc>
                        </div>
                    </div>
                </template>

                <!-- Profit & Loss Chart -->
                <template if:true={isProfitAndLoss}>
                    <div class="chart-container fixed-chart">
                        <div class="chart-wrapper">
                            <c-tesseract-apps-profit-and-loss-charts-lwc 
                                ongrandchildevent={handlechildevent} 
                                orgid={orgid} 
                                selectedcompany={selectedCompany}>
                            </c-tesseract-apps-profit-and-loss-charts-lwc>
                        </div>
                    </div>
                </template>

            </div>
        </div>
    </div>
</template>
