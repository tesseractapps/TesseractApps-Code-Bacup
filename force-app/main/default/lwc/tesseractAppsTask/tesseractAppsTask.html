     <template if:true={signInRequesttemplate}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true" 
                  class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" style="width: 30%; height: auto; margin-left: 35%;">
                      <div class="slds-modal__container modal-container" style="max-width:25%;">
                          <header class="slds-modal__header" style="background: #002A52;">
                              <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white; font-weight:bold; text-align: center;">Action</h2>
                          </header>
                          <div class="slds-modal__content slds-p-around_medium">
                              <div class="slds-m-around_small center-container-pop">
                                <div class="slds-grid slds-grid_align-spread slds-p-around_small">
                                  <!-- Label on the Left -->
                                  <div class="slds-col" >
                                      <span>Geo Location</span>
                                  </div>
                        
                                  <!-- Checkbox on the Right -->
                                  <div class="slds-col slds-text-align_right" style="padding-right: 30%;">
                                      <lightning-input type="checkbox" variant="label-hidden" 
                                          name="AddShiftnotification" 
                                          checked={shiftEnableGeolocation}
                                          onchange={onchangeGeoLocation}>
                                      </lightning-input>
                                  </div> 
                              </div>                              
                                  <br/>
                                  <div class="slds-grid slds-grid_align-spread slds-p-around_small">
                                    <!-- Label on the Left -->
                                    <div class="slds-col" >
                                        <span>Enable Sign in</span>
                                    </div>
                          
                                    <!-- Checkbox on the Right -->
                                    <div class="slds-col slds-text-align_right" style="padding-right: 30%;">
                                        <lightning-input type="checkbox" variant="label-hidden" 
                                            name="AddShiftnotification" 
                                            checked={shiftEnableSignin}
                                            onchange={onchangeEnableSignin}>
                                        </lightning-input>
                                    </div> 
                                </div> 
                                <br/>
