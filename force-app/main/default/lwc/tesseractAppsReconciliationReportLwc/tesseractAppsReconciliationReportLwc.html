<template>
    <template if:true={isTitleAndBack}>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <!-- Left side: Staff Details -->
            <p style="font-weight: bold; padding: 1% 0% 1% 1%;font-size:140% "> Reconciliation - {companyname}</p>
            <template if:true={isBackToParent}>
                <lightning-button label="Back" variant="brand" onclick={handleBack} style=" margin-top:1%;margin-bottom:1%; margin-right:1%; "></lightning-button>  
            </template>
           
        </div>
    </template>
    <template if:true={isImportForms}>
       
        <div class="slds-grid" style="margin-bottom:20px; margin-top:-5%;">
            <!-- <div class="slds-size_1-of-5">
                <div> 
                    <lightning-input type="file" label="Please upload comma separated .csv file" accept=".csv" onchange={handleCSVUpload}></lightning-input>
                </div>
            </div>   -->
            <div class="slds-col slds-size_1-of-5 slds-p-around_small" style="margin-top:  5%;">
                    <div class="floating-label">
                        
                        <input type="file"  onchange={handleCSVUpload} accept=".csv"  style="display: none;">
                        <button type="button" onclick={triggerFileInput} class="file-upload-button">
                            &#8684; Upload File
                        </button>
                        <div class="slds-text-body_small">{fileName}
                            <template if:true={showSpinner}>
                                <lightning-spinner alternative-text="Uploading the file......" size="medium">                        
                                    </lightning-spinner>
                            </template>
                            </div>
                          <template if:true={isattachError}>
                          <p style="color:red">File Size Can not exceed 512MB </p>  
                          </template>
                    </div>
                </div>
            <div  style="margin-top:25px;margin-left:33%">
                <lightning-radio-group name="radioGroup"
                              label="Select Category"
                              options={Categoryoptions}
                              value={CategoryValue}
                              type="radio" onchange={handleCategoryChange}  >
                              
                </lightning-radio-group>
                
            </div>   
            <div  style="margin-top:25px;margin-right:1%" >
                <lightning-button label="Go" onclick={HandleManualdata} variant="brand" disabled={disableGo}></lightning-button>
            </div>
            
            <div style="margin-top:25px">
                <lightning-button label="Back" onclick={handleGetChartOfAccounts} variant="brand" ></lightning-button>
            </div>
            
        </div> 
        
      <div class="slds-grid slds-grid_align-spread">
        <!-- First Custom Table Section (First Table) -->
        <div class="slds-col" style="width: 40%;">
        <div class="table-border min-height">
            <!-- <div style="margin-left:95%">
                <a onclick={toggleSecondTableVisibility}>
                    <lightning-icon icon-name="action:edit" size="xx-small" title="Edit"></lightning-icon>
                </a>
            </div> -->

            <!-- Show table if data is available -->
            <template if:false={isDataEmpty}>
                <table class="slds-table slds-table_cell-buffer" style="table-layout:fixed;">
                    <thead>
                        <tr>
                            <!-- Master Checkbox for Select All -->
                            <th class="slds-cell-wrap th" style="width:10%;">
                                <input 
                                    type="checkbox" 
                                    checked={isAllSelected}
                                    onchange={handleSelectAll}
                                />
                            </th>
                            <th class="slds-cell-wrap th" style="width:20%;">Date</th>
                            <th class="slds-cell-wrap th" style="width:20%;">Amount</th>
                            <th class="slds-cell-wrap th">Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loop over the data and display rows -->
                        <template for:each={data} for:item="row">
                            <tr key={row.Id} class="tr1">
                                <!-- Individual Checkbox for Selection -->
                                <td>
                                    <input 
                                        type="checkbox" 
                                        data-id={row.Id} 
                                        data-name={row.Name} 
                                        onchange={handleRadioSelection}
                                        checked={row.isSelected}
                                    />
                                </td>
                                <td class="slds-cell-wrap">{row.Date}</td>
                                <td class="slds-cell-wrap">{row.Amount}</td>
                                <td class="slds-cell-wrap">{row.Description}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <!-- Show "No records available" when data is empty -->
            <template if:true={isDataEmpty}>
                <p>No records available.</p>
            </template>

            <!-- Pagination for the first table -->
            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style=" transform: scale(0.9);">
                <div class="slds-col"></div>
                <div class="slds-align_absolute-center" style="height: 5rem;">
                    <lightning-button class="small-button" disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage}></lightning-button>
                    <lightning-button class="small-button" disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                    <span class="slds-badge">Showing {pageNumber} of {totalPages} Page(s)</span>
                    <lightning-button class="small-button" disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} icon-position="right"></lightning-button>
                    <lightning-button class="small-button" disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                </div>
                
            </div>
            <div class="slds-clearfix">
                   <span class="slds-badge" style="margin-left: 75%;"> Total Records: {totalRecords}</span>
                </div>
        </div>
    </div>
        <!-- Second Custom Table Section (Second Table) -->
        <div class="slds-col"  style="width: 60%;" >
            <div class="table-border min-height">
                <table class="slds-table slds-table_cell-buffer" style="table-layout:fixed;">
                    <thead>
                        <tr>
                              <th class="slds-text-align_left slds-cell-wrap th" style="width:7%;">
                                <input 
                                    type="checkbox" 
                                    checked={isAllSelected1}
                                    onchange={handleSelectAll1}
                                />
                            </th>
                            <th class="slds-text-align_left slds-cell-wrap th">Account Name</th>
                            <th class="slds-text-align_left slds-cell-wrap th">Account Number</th>
                            <th class="slds-text-align_left slds-cell-wrap th" style="width:12%;">Date</th>
                            <th class="slds-text-align_left slds-cell-wrap th">Amount</th>
                            <th class="slds-text-align_left slds-cell-wrap th description">Description</th>
                            <th class="slds-text-align_left slds-cell-wrap th description" style="width:11%;">Category</th>
                            <th class="slds-text-align_left slds-cell-wrap th" style="width:11%;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={finalData} for:item="invoice">
                            <tr key={invoice.Id}>
                                <!-- Account Name (editable based on isEditable) -->
                                  <td>
                                    <input 
                                        type="checkbox" 
                                        data-id={invoice.Id} 
                                        data-name={invoice.Name} 
                                        onchange={handleRadioSelection1}
                                        checked={invoice.isSelected}
                                    />
                                </td>
                                <td>
                                    <template if:true={invoice.isEditable}>
                                        <lightning-input
                                            type="text"
                                            value={invoice.AccountName}
                                            onchange={handleFieldChange}
                                            onblur={handleBlur}
                                            data-id={invoice.Id}
                                            data-field="AccountName"
                                            style="padding-bottom: 8%;"
                                        ></lightning-input>
                                    </template>
                                    <template if:false={invoice.isEditable}>
                                        {invoice.AccountName}
                                    </template>
                                </td>

                                <!-- Account Number (editable based on isEditable) -->
                                <td>
                                    <template if:true={invoice.isEditable}>
                                        <lightning-input
                                            type="text"
                                            value={invoice.AccountNumber}
                                            onchange={handleFieldChange}
                                            onblur={handleBlur}
                                            data-id={invoice.Id}
                                            data-field="AccountNumber"
                                            style="padding-bottom: 8%;"
                                        ></lightning-input>
                                    </template>
                                    <template if:false={invoice.isEditable}>
                                        {invoice.AccountNumber}
                                    </template>
                                </td>

                                <!-- Date (non-editable) -->
                                <td>{invoice.Date}</td>

                                <!-- Amount (non-editable) -->
                                <td>{invoice.Amount}</td>

                                <!-- Description (non-editable) -->
                                <td  class="description" title={invoice.Description}>{invoice.Description}</td>

                                <!-- Category (editable based on isEditable) -->
                                <td>
                                    <template if:true={invoice.isEditable}>
                                        <lightning-input
                                            type="text"
                                            value={invoice.Category}
                                            onchange={handleFieldChange}
                                            onblur={handleBlur}
                                            data-id={invoice.Id}
                                            data-field="Category"
                                            style="padding-bottom: 8%;"
                                        ></lightning-input>
                                    </template>
                                    <template if:false={invoice.isEditable}>
                                        {invoice.Category}
                                    </template>
                                </td>

                                <!-- Action (You can add action buttons if needed) -->
                                <td>
                                    <!-- <lightning-button label="Action" onclick={handleAction}></lightning-button> -->
                                      <!-- <lightning-icon
                                            icon-name="action:edit"
                                            alternative-text="Edit"
                                            class="slds-m-left_x-small"
                                            size="xx-small"
                                            onclick={handleEditInvoice}
                                            data-id={invoice.Id}
                                            style="cursor: pointer; color: white; background: #0099DE;transform: scale(0.7);">
                                        </lightning-icon> -->
                                      <a href="javascript:void(0)"  onclick={handleEditInvoice}
                                            data-id={invoice.Id} title="Edit" style="text-decoration: none;">
                                            <i class="material-icons edit-icon" data-id={invoice.Id}>edit_document</i>
                                    </a>  
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <!-- Pagination for the second table -->
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                    <div class="slds-col"></div>
                   <div class="slds-align_absolute-center" style="height: 5rem;">
                            <lightning-button class="small-button" disabled={bDisableFirst1} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage1}></lightning-button>
                            <lightning-button class="small-button" disabled={bDisableFirst1} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage1}></lightning-button>
                            <span class="slds-badge">Showing {pageNumber1} of {totalPages1} Page(s)</span>
                            <lightning-button class="small-button" disabled={bDisableLast1} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage1} icon-position="right"></lightning-button>
                            <lightning-button class="small-button" disabled={bDisableLast1} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage1} icon-position="right"></lightning-button>
                        </div>
                    <div class="slds-clearfix">
                        <span class="slds-badge"> Total Records: {totalRecords1}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Finish Button -->
    <div>
        <lightning-button label="Finish" onclick={handleInsertChartOfAccount} variant="brand" style="float:right;margin-top: 30px;"></lightning-button>
    </div>

    <div style="padding-bottom: 100px;"></div>
    </template>

<template if:true={openAccountform}>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
        <div class="slds-modal__header">
        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Account Details</h1>
        </div>
        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
            <div class="slds-p-around_medium lgc-bg">
                <lightning-combobox   label="Category" name="category" value={Catgeory} placeholder="Select Category" options={typesOfcategoryOptions} onchange={handleChange} ></lightning-combobox>
            </div>
            <div class="slds-p-around_medium lgc-bg">
                <lightning-combobox   label="Account Name" name="name" value={AccountName} placeholder="Select Account Name" options={AcountNameOptions} onchange={handleChange} ></lightning-combobox>
            </div>
           <!--  <div class="slds-p-around_medium lgc-bg">
                <lightning-combobox   label="Category" name="category" value={Catgeory} placeholder="Select Progress" options={typesOfcategoryOptions} onchange={handleChange} ></lightning-combobox>
            </div> 
          <div class="slds-p-around_medium lgc-bg">
                <lightning-input type="text" label="Enter Account Name" name="name" value={AccountName} onchange={handleChange}></lightning-input>
            </div>-->
            <div class="slds-p-around_medium lgc-bg">
                <lightning-input type="text" label="Account Number" name="number" value={AccountNumber} onchange={handleChange} disabled="true"></lightning-input>
            </div> 
            
        </div>
        <div class="slds-modal__footer">
        <button class="slds-button slds-button_neutral" aria-label="Cancel and close" onclick={colseAccountForm}>Cancel</button>
        <button class="slds-button slds-button_brand" onclick={HandleSaveAccounts}>Save</button>
        </div>
        </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>

            <div class="search-section">

                    <span class="label-text-drop1">Start Date</span>
                     <lightning-input type="date" name="input1" variant="label-hidden"  onchange={chartOfAccountsDates}></lightning-input>
                </div>
                <div class="floating-label-new  slds-small-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <span class="label-text-drop1">End Date</span>
                    <lightning-input type="date" name="input2" variant="label-hidden" onchange={chartOfAccountsDates}></lightning-input>
                </div>
                <lightning-button label="Go to import" onclick={HandleBackToImport} variant="brand"></lightning-button>
            </div>
            <!-- Back Button -->
            <!-- <div style="margin-top:25px;margin-right:10px;">

                </a>
            </div> -->
            
        </div>
        
          <!-- Loop through each category in groupedData -->
          <template for:each={finalHtmlTable} for:item="categoryData">
            <!-- Category Heading -->
            <div key={categoryData.categoryName} class="slds-m-top_medium">
                <h3><b>{categoryData.categoryName}</b></h3>
           

            <!-- Table for each Category with a unique key -->
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Account Name</th>
                        <th scope="col">Account Number</th>
                        <th scope="col">Description</th>
                        <th scope="col">Dr/Cr</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loop through each record in categoryData.records -->
                    <template for:each={categoryData.records} for:item="record">
                        <tr key={record.Id}>
                            <td>{record.Date__c}</td>
                            <td>{record.Account_Name__c}</td>
                            <td>{record.Account_Number__c}</td>
                            <td>{record.Description__c}</td>
                            <td>${record.Amount__c}</td>
                        </tr>
                    </template>
                    <!-- Total Amount Row for Each Category -->
                    <tr>
                        <th colspan="4" style="text-align: right;"><b>Total:</b></th>
                        <th>${categoryData.totalAmount}</th>
                    </tr>
                </tbody>
            </table>
        </div>
        </template>
    </div>
</template>
