<template>
    <div class="main-container">
    <div  if:true={isHome}>
        
            <!-- <P style="font-weight: bold;font-size:140%; margin: 0; padding:1% 0% 1% 1%;">Leave Management</P> -->

        <template if:true={leaveflag}>
        <template for:each={clientData} for:item="clientData">
        <div class="grid"  key={clientData.Id}>
          
            <!-- First Grid Item -->
            <div class="grid-item">
                <img src={clientData.picture__c} alt="Photo">
                <div class="text-container">
                    <p><b>{clientData.Name}<br>{clientData.Last_Name__c}</b><br>{clientData.Gender__c}&nbsp;{clientData.Age__c}</p>
                    
                </div>
                
            </div>
          
            <!-- Second Grid Item -->
            <div class="grid-item2" style="border-right-style: solid;">
                <div class="status-row" >
                    <p><b>Annual Leaves:</b>&nbsp;&nbsp;{clientData.Annual_Leave__c}</p>
                </div>
                <div class="status-row">
                  <p><b>Sick Leaves:</b>&nbsp;&nbsp;{clientData.Sick_Leave__c}</p>
              </div>
              <div class="status-row">
                <p><b>Parental Leaves:</b>&nbsp;&nbsp;{clientData.Parental_Leave__c}</p>
            </div>
            <div class="status-row">
              <p><b>Other Leaves:</b>&nbsp;&nbsp;{clientData.Bereavement_Leave__c}</p>
          </div>
              
            </div>


<!--             <div class="grid-item2">
              
              <div class="status-row">
                <p>Primary:&nbsp;&nbsp;{clientData.Primay_Contact_First_Name__c}&nbsp;{clientData.Primay_Contact_Last_Name__c}</p>
            </div>
            <div class="status-row">
              <p>Secondary:&nbsp;&nbsp;{clientData.Secondary_Contact_First_Name__c}&nbsp;{clientData.Secondary_Contact_Last_Name__c}</p>
          </div>
            
          </div> -->
            
            
            
            <!-- Third Grid Item -->
           <div style="margin-top:10px;"><div class="assignments"><h5><b>Approver</b></h5></div>
     
            <div class="grid-item4" style="margin-top:5px;">
              <lightning-avatar variant="circle" src={primary} initials="P" fallback-icon-name="standard:person_account" alternative-text="Primary Contact"></lightning-avatar>

                <div class="text-container">
                    <p style="padding:10px;">{clientData.Primary_Contact_First_Name__c}&nbsp;{clientData.Primary_Contact_Last_Name__c}<br>{clientData.Primary_Contact_Number__c}</p>
                    
                    
                </div>
            </div>
            <div class="grid-item4" style="margin-top:5px;">
              <lightning-avatar variant="circle" src={secondary} initials="S" fallback-icon-name="standard:person_account" alternative-text="Secondary Contact" ></lightning-avatar>

                <div class="text-container">
                    <p style="padding:10px;">{clientData.Secondary_Contact_First_Name__c}&nbsp;{clientData.Secondary_Contact_Last_Name__c}<br>{clientData.Secondary_Contact_Number__c}</p>
                    
                    
                </div>
            </div>
            </div>
       
            
            <!-- Fourth Grid Item -->
            <!-- <div class="grid-item3">
                <div class="assignments">
                    <h5>Assignments</h5>
                    <p>Primary</p>
                    <p>Secondary</p>
                </div>
            </div> -->
          
        </div>
        </template>
        </template>

        <template if:false={leaveflag}>
            
            <div class="grid">
              
                <!-- First Grid Item -->
                <div class="grid-item">
                    
                    <div class="text-container">
                        <!-- Period:
                            <button class="arrow left" onclick={previousMonth}>&lt;</button>
                            <span>{currentMonthName}</span>
                            <button class="arrow right" onclick={nextMonth}>&gt;</button>
                     -->
                     <lightning-button-icon   icon-name="utility:chevronleft" onclick={previousMonth} style="background:white;color:red;border-radius:5px; margin-bottom: 5px;"></lightning-button-icon>
                     <lightning-button style="margin:0 5px 0 5px;"  label={currentMonthName} onclick={navigateToToday}></lightning-button>
                     <lightning-button-icon  icon-name="utility:chevronright" onclick={nextMonth} style="background:white;border-radius:5px;margin-bottom: 5px;"></lightning-button-icon>
                      
                        
                    </div>
                    
                </div>
              
                <!-- Second Grid Item -->
                <div class="grid-item2" style="border-right-style: solid;">
                    <div class="status-row" >
                        <p><b>New: {statusCounts.Requested}</b>&nbsp;&nbsp;</p>
                    </div>
                    <div class="status-row">
                      <p><b>Rejected: {statusCounts.Rejected}</b>&nbsp;&nbsp;</p>
                  </div>
                  <div class="status-row">
                    <p><b>Approved: {statusCounts.Approved}</b>&nbsp;&nbsp;</p>
                </div>
                <!-- <div class="status-row">
                  <p><b>Other Leaves:</b>&nbsp;&nbsp;</p>
              </div> -->
                  
                </div>
    
    
   
                
                
                
                <!-- Third Grid Item -->
               <div style="margin-top:10px;"><div class="assignments"></div>
         
                <div class="grid-item4" style="margin-top:5px;">
                    <div class="chart-container">
                        <canvas lwc:dom="manual" class="chart"></canvas>
                    </div>
                </div>
                <div class="grid-item4" style="margin-top:5px;">
                  
                </div>
                </div>
    
              
            </div>
            </template>
        
    
    <!-- leave Details Container -->
    <div class="job-details-container">
      <template if:true={isHome2}>
        <div class="slds-grid">
        <h3 style="font-weight:bold;margin-right:77%;">Leave History</h3>
      <!-- <lightning-button class="slds-m-left_medium" slot="footer" label="Request for Leave" variant="brand"
                onclick={handleleave} style="float:right;margin-bottom:5px;"></lightning-button>
    -->         </div>        
            <template if:true={staffuser}>
                <template if:true={leaves}>
                    <div class="table-container custom-scroll">
                    <table class="slds-table slds-table_cell-buffer" style="table-layout:fixed">
                        <thead>
                            <tr>
                                <th>Type of Leave</th>
                                <th>From</th>
                                <th>To</th>
                                <th>No.of Days</th>
                                <th  class="description">Reason</th>
                                <th>Approved by</th>
                                <th>View Files</th>
                                <th>Comments</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={leaves} for:item="leave">
                                <tr key={leave.Id} class="tr1">
                                    <td>{leave.Type_of_Leave__c}</td>
                                    <td>{leave.fromdate}</td>
                                    <td>{leave.Todate}</td>
                                    <td>{leave.Duration__c}</td>
                                    <td class="description">{leave.Reason__c}</td>
                                    <td>{leave.Approved_by__c}</td>
                                    <td style="padding-left:2%;width:5%;">
                                        <div if:true={leave.Leave_Document__c}>
                                        <a  data-url={leave.Leave_Document__c}  onclick={handleView}><lightning-icon icon-name="utility:preview" size="small" title="View file"></lightning-icon></a>
                                    </div>
                                    </td>
                                    <td class="description">{leave.Comments__c}</td>
                                    <td><label class={leave.Status__c}>{leave.Status__c}</label></td>
                                </tr>
                            </template>
                            
                        </tbody>
                    </table>
                    </div>
                    
                </template>
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;width:95%;margin-left:2%">
                    <!-- RECORDS PER PAGE -->
                    <div class="slds-col">
                        <div class="slds-list_inline ">
                            <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                            <label class="slds-text-color_weak" for="recordsPerPage"></label><!--slds-p-horizontal_x-small-->
                            <div class="slds-select_container">
                                <select class="slds-select" id="pageSizeOptions1" onchange={handleRecordsPerPage1}>
                                    <template for:each={pageSizeOptions1} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template> 
                                </select>
                            </div>
                        </div>
                    </div>
                    <!-- PAGE NAVIGATION -->
                    <div class="slds-align_absolute-center" style="height:5rem;">
                        <lightning-button disabled={bDisableFirst1} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage1} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                        <lightning-button disabled={bDisableFirst1} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage1} style="margin-right:5px;"></lightning-button>
                        &nbsp;
                        <span class="slds-badge">Showing {pageNumber1} &nbsp;of&nbsp; {totalPages1} &nbsp;&nbsp;Page(s)</span>
                        &nbsp;
                        <lightning-button disabled={bDisableLast1} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage1} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                        <lightning-button disabled={bDisableLast1} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage1} icon-position="right"></lightning-button>
                    </div>
                    <!-- TOTAL RECORDS -->
                    <div class="slds-clearfix">
                        <div class="slds-float_right">
                            <span class="slds-badge"> Total Records: {totalRecords1}</span>
                        </div>
                    </div>
                </div>
            </template>
            <template if:true={orgadmin}>
                <div class="table-container custom-scroll">
                 <template if:false={noRecordsFlag}>
                <table class="slds-table slds-table_cell-buffer">
                    <thead>
                        <tr>
                            <th>{staffPreferredName}</th>
                            <th>Type of Leave</th>
                            <th>From</th>
                            <th>To</th>
                            <th>No.of Days</th>
                            <th  class="description">Reason</th>
                            <th>Approved by</th>
                            <th>Comments</th>
                            <!-- <th>View Files</th> -->                                 
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={orgleaves} for:item="leave">
                            <tr key={leave.Id} class="tr1">
                                <td>
                                    <template if:true={leave.isLinkEnabled}>
                                    <a  data-url={leave.Leave_Document__c}  onclick={handleorgedit} data-id={leave.Id} data-staffid={leave.Staff__c}>{leave.Staff__r.Display_Nickname__c}</a>
                                        </template>
                                        <template if:false={leave.isLinkEnabled}>
                                        {leave.Staff__r.Display_Nickname__c}
                                    </template>
                                </td>
                                <td>{leave.Type_of_Leave__c}</td>
                                <td>{leave.fromdate}</td>
                                <td>{leave.Todate}</td>
                                <td>{leave.Duration__c}</td>
                                <td class="description">{leave.Reason__c}</td>
                                <td>{leave.Approved_by__c}</td>
                                <!-- <td style="padding-left:2%;width:5%;">
                                    <div if:true={leave.Leave_Document__c}>
                                    <a  data-url={leave.Leave_Document__c}  onclick={handleView}><lightning-icon icon-name="utility:preview" size="small" title="View file"></lightning-icon></a>
                                </div>
                                </td> -->
                                <td class="description">{leave.Comments__c}</td>
                                <td><label class={leave.Status__c}>{leave.Status__c}</label></td>
                            </tr>
                        </template>
                        
                    </tbody>
                </table>
                </template>
                <template if:true={noRecordsFlag}>
                    <div class="no-data">
                        <p>No records found</p>
                    </div>
                </template>
                </div>
                <template if:false={noRecordsFlag}>
                 <div  class="fixed-pagination">   
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;width:95%;margin-left:2%">
                    <!-- RECORDS PER PAGE -->
                    <div class="slds-col">
                        <div class="slds-list_inline ">
                            <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                            <label class="slds-text-color_weak" for="recordsPerPage"></label><!--slds-p-horizontal_x-small-->
                            <div class="slds-select_container">
                                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template> 
                                </select>
                            </div>
                        </div>
                    </div>
                    <!-- PAGE NAVIGATION -->
                    <div class="slds-align_absolute-center" style="height:5rem;">
                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                        &nbsp;
                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                        &nbsp;
                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                    </div>
                    <!-- TOTAL RECORDS -->
                    <div class="slds-clearfix">
                        <div class="slds-float_right">
                            <span class="slds-badge"> Total Records: {totalRecords}</span>
                        </div>
                    </div>
                </div>
                </div> 
                </template>
                    
            </template>
     </template>
        <template if:true={leaveflag}>
<div class="leaveRequestCont custom-scroll">
      <lightning-record-edit-form object-api-name="Leave__c"  record-id={leaverecordId} onsuccess={handleSuccess} onsubmit={handleSubmit}>
        <h3 style="font-weight:bold;">Request for Leave</h3>
        <div class="slds-grid slds-wrap">
           
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Type of Leave</span>
                    <lightning-input-field field-name="Type_of_Leave__c" onchange={handleInput} disabled={isdisablefields} required="true" variant="label-hidden"></lightning-input-field>
                </div>
            </div>
            
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label" style="height: 62px;">
                    <span class="label-text-drop"><span style="color:red">*</span>Reason</span>
                    <lightning-input-field field-name="Reason__c" style="height: 62px;"  disabled={isdisablefields} required="true" variant="label-hidden"></lightning-input-field>
                </div>
            </div>
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>From</span>
                    <lightning-input-field field-name="From__c" onchange={handleInput} disabled={isdisablefields} required="true" onclick={handleStartDateChange} variant="label-hidden"></lightning-input-field>   
                </div>
            </div>
            
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>To</span>
                    <lightning-input-field field-name="To__c" onchange={handleInput} disabled={isdisablefields} required="true" onclick={handleEndDateChange} variant="label-hidden"></lightning-input-field>   
                </div>
            </div>
            
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>State</span>
                    <lightning-input-field field-name="State__c" onchange={handleInput} disabled={isdisablefields} required="true" variant="label-hidden"></lightning-input-field>
                </div>
            </div>
            
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop">Duration</span>
                    <lightning-input-field field-name="Duration__c" value={duration} disabled=true variant="label-hidden"></lightning-input-field>
                </div>
            </div>
            <!-- <div class="slds-size_1-of-2">
                <div class="slds-m-right_medium slds-m-left_medium" >
                    <label style="margin-top:8%;">Balance</label>
                    <lightning-input  value={balance} style="width:65%;margin-left:34%;margin-top:-7%" disabled=true></lightning-input>
                </div>
            </div> -->
            
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop">Balance</span>
                    <lightning-input-field field-name="Balance__c" value={balance} disabled=true variant="label-hidden"></lightning-input-field>   
                </div>
            </div>
            
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop">Paid Leave</span>
                    <lightning-input-field field-name="Paid_Leave__c" value={paid} disabled=true variant="label-hidden"></lightning-input-field> 
                </div>
            </div>
            
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop">Unpaid Leave</span>
                    <lightning-input-field field-name="Unpaid_Leave__c" value={unpaid} disabled=true variant="label-hidden"></lightning-input-field>
                </div>
            </div>
            <template if:true={isstatus}>
            
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop">Status</span>
                    <lightning-input-field field-name="Status__c" onchange={handleStatus} variant="label-hidden"></lightning-input-field>   
                </div>
            </div>
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="floating-label" style="height: 62px;">
                    <span class="label-text-drop">Comments</span>
                    <lightning-input-field field-name="Comments__c" variant="label-hidden"></lightning-input-field>
                </div>
            </div>
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                <div class="slds-m-right_medium slds-m-left_medium" >
                    <p style="margin-left:3px;color:#5A5A5A;margin-top:5px;">Uploaded File:&nbsp;<a href={Docurl} data-url={Docurl}  
                        onclick={handleView} style="margin-left: 5px;">View File</a></p>
                </div>
            </div>
        </template>
            <!-- <div class="slds-size_1-of-2">
                <div class="slds-m-right_medium slds-m-left_medium" >
                    <lightning-input-field field-name="Leave_Document__c"></lightning-input-field>
                </div>
            </div> -->
            <template if:false={isstatus}>
            <div class="slds-size_1-of-2">
                <div class="slds-m-right_medium slds-m-left_medium">
                  <lightning-input type="file" onchange={onFileUpload} name="Upload File" label="Upload File" style="margin-left:5px;">  
                  </lightning-input>
                  <div class="slds-text-body_small">{fileName}</div>
                  <p if:true={imageerror} style="color: red;">{imageerror}</p>
                </div>
              </div>
            </template>
            
        </div>
        <div class="slds-align_absolute-center slds-m-around_small">
            <lightning-button label="Cancel" variant="Brand-Outline" onclick={handleCancel}
          class="slds-m-around_small"></lightning-button> 
          <lightning-button type="submit" variant="brand" label="Submit" disabled={saveButtonDisable}></lightning-button>
          
      </div>
    </lightning-record-edit-form>
</div>
    </template>
    
        
    </div>
    
    
   
    </div>
    <template if:true={isModalOpen}>          
        <div class="slds-grid slds-grid_align-end">
          <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
          onclick={closeviewfile} style="margin-right:1%;margin-top: 1%;"></lightning-button>
          </div>
          <div class="main-container-iframe custom-scroll">
          <iframe src={currentUrl} width="100%" height="1300px" ></iframe>
        </div>
    </template>
 </div>
 <template if:true={showSpinner}>
       <!--  <lightning-spinner alternative-text="Refreshing Data" size="medium"></lightning-spinner> -->
          <div class="overlay-logo"></div>
                        <div class="spinner-wrapper">
                            <div class="loader-container">
                                <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                                <img src={imageUrl} alt="T Logo" class="Tlogo" />
                            </div>
                            <p class="progress-text">Loading</br>Please Wait...</p>
                        </div>
      </template>


</template>
