<template>
  <template if:true={participantData}>
    <div class="role-content">
      <div class="slds-table" style="background-color: transparent">
        <table
          class="slds-table slds-table_fixed-layout slds-table_resizable-cols weekly-table glow-hover table2"
          role="grid"
        >
          <thead>
            <tr>
              <td class="firstcellwidth">
                <div class="staff-member">
                  <div class="floating-label-new">
                    <span class="label-text-drop">Search by Name</span>
                    <lightning-input
                      type="search"
                      variant="label-hidden"
                      value={searchName}
                      onchange={handleSearchName}
                    ></lightning-input>
                  </div>
                </div>
              </td>

              <template for:each={participantData.weekData} for:item="weekDay">
                <td key={weekDay.date} class={weekDay.holidayColor}>
                  <!-- <div class={weekDay.holidayColor}> -->
                  <div class="day-left">
                    <div class="day-name">{weekDay.day}</div>
                    <div class="day-date">{weekDay.UiFormattedDate}</div>
                  </div>

                  <!-- <p><b>{weekDay.day}</b> <br><b>{weekDay.UiFormattedDate}</b></p> -->
                  <div class="holiday-spacer-bottom">
                    <template if:true={weekDay.isHoliday}>
                      <div class="holiday-label" title={weekDay.holidayName}>
                        {weekDay.holidayName}
                      </div>
                    </template>
                  </div>
                  <!-- </div> -->
                </td>
              </template>
            </tr>
          </thead>
        </table>
        <div class="calendar-part custom-scroll">
          <table
            class="slds-table slds-table_bordered slds-table_fixed-layout table1"
            role="grid"
          >
            <tbody>
              <template
                for:each={participantData.Participnat}
                for:item="participantdata"
              >
                <tr key={participantdata.participantId}>
                  <!-- Staff Name and Info Column -->
                  <!-- <td style="width:16%"> -->
                  <td>
                    <div
                      class="card"
                      data-id={participantdata.participantId}
                      draggable="true"
                      ondragstart={handleDragStart}
                    >
                      <div class="avatar" if:true={participantdata.profileUrl}>
                        <lightning-avatar
                          variant="circle"
                          src={participantdata.profileUrl}
                          class="avatar-small"
                          fallback-icon-name="standard:person_account"
                        >
                        </lightning-avatar>
                      </div>
                      <div class="avatar" if:false={participantdata.profileUrl}>
                        <lightning-icon
                          icon-name="action:user"
                          variant="error"
                          size="small"
                          style="background: #02275b"
                          class="avatar-small fallback-icon"
                        ></lightning-icon>
                      </div>
                      <div class="info">
                        <!-- <span class="name"
                          >{participantdata.firstName}&nbsp;{participantdata.lastName}</span
                        > -->
                        <span class="name"
                          >{participantdata.fullName} </span
                        >
                        <a
                          href="javascript:void(0);"
                          class="details"
                          style="color: black"
                          onclick={handleRiskNavigation}
                          data-participantid={participantdata.participantId}
                          >{participantdata.riskStatus}</a
                        >
                        <!--   <span  class="details">{participantdata.riskStatus}</span >  -->
                        <span class="meta">${participantdata.wages}</span>
                      </div>
                    </div>
                  </td>
                  <template
                    for:each={participantdata.servicesByDay}
                    for:item="dayShift"
                  >
                    <td
                      key={dayShift.day}
                      class="day-cell"
                      ondragover={handleDragOver}
                      data-facvalue={participantdata.facilityIdValue}
                      ondrop={handleOpenParticipantShiftView}
                      data-participantid={participantdata.participantId}
                      data-weekname="{dayShift.day"
                      data-weekdate={dayShift.Shiftdate}
                      data-isholiday={dayShift.isHoliday}
                    >
                      <div class="day-cell-wrapper">
                        <div class={getIconContainerClass}>
                          <!-- day with no services -->
                          <template if:true={dayShift.isSizeZeroFlag}>
                            <div class="no-shifts">
                              <a
                                href="javascript:void(0)"
                                class="add-icon-link"
                              >
                                <lightning-icon
                                  icon-name="utility:add"
                                  size="xx-small"
                                  style="transform: scale(0.7)"
                                  data-participantid={participantdata.participantId}
                                  data-facvalue={participantdata.facilityIdValue}
                                  data-weekname={dayShift.day}
                                  data-weekdate={dayShift.Shiftdate}
                                  data-isholiday={dayShift.isHoliday}
                                  onclick={handleOpenParticipantShiftView}
                                >
                                </lightning-icon>
                              </a>
                            </div>
                          </template>

                          <template if:false={dayShift.isSizeZeroFlag}>
                            <template if:false={dayShift.hasHovered}>
                              <div class="no-shifts1">
                                <a
                                  href="javascript:void(0)"
                                  class="add-icon-link"
                                >
                                  <i
                                    class="material-icons add-icon"
                                    title="Add Shift"
                                    style="position: relative"
                                    data-participantid={participantdata.participantId}
                                    data-facvalue={participantdata.facilityIdValue}
                                    data-weekname={dayShift.day}
                                    data-weekdate={dayShift.Shiftdate}
                                    data-isholiday={dayShift.isHoliday}
                                    onclick={handleOpenParticipantShiftView}
                                    >add_circle</i
                                  >
                                </a>
                              </div>
                            </template>
                          </template>

                          <!-- day with one services -->
                          <template if:false={dayShift.isSizeZeroFlag}>
                            <template if:true={dayShift.isSizeOneFlag}>
                              <div class={getIconContainerClass}>
                                <template
                                  for:each={dayShift.services}
                                  for:item="serv"
                                >
                                  <div
                                    key={serv.Id}
                                    class={getIconItemClass}
                                    style={dayShift.firstRecordShiftColor}
                                  >
                                    <template if:true={isCompactView}>
                                      <template
                                        if:true={serv.unassignedService}
                                      >
                                        <div class="staff-info">
                                          <span class="rolename-firsticon"
                                            ><b>{serv.RoleName}</b></span
                                          >

                                          <div class="staff-info-time1">
                                            {serv.ShiftTime}
                                          </div>
                                        </div>
                                      </template>
                                      <template
                                        if:false={serv.unassignedService}
                                      >
                                        <div class="staff-info">
                                          <template
                                            if:false={serv.serviceStaffName}
                                          >
                                            <span class="rolename-firsticon"
                                              ><b>{serv.RoleName}</b></span
                                            >
                                          </template>

                                          <template
                                            if:true={serv.serviceStaffName}
                                          >
                                            <span class="rolename-firsticon"
                                              ><b>
                                                {serv.serviceStaffName}</b
                                              ></span
                                            >
                                          </template>

                                          <div class="staff-info-time1">
                                            <a
                                              href="javascript:void(0)"
                                              onclick={handleEditShiftScreen}
                                              data-participantid={participantdata.participantId}
                                              data-shiftstaffid={serv.shiftWithStaffId}
                                              style="color: inherit"
                                            >
                                              {serv.ShiftTime}
                                            </a>
                                          </div>
                                        </div>
                                      </template>
                                    </template>
                                    <template if:true={isExpandedView}>
                                      <template
                                        if:true={serv.unassignedService}
                                      >
                                        <div
                                          class="expanded-two-shift-row"
                                          style="
                                            display: flex;
                                            justify-content: space-between;
                                            align-items: flex-start;
                                            flex-direction: column;
                                          "
                                        >
                                          <div class="singleexp-details">
                                            <div class="overflowtext">
                                              {serv.RoleName}
                                            </div>

                                            <div class="overflowtext">
                                              {serv.ShiftTime}
                                            </div>

                                            <div class="overflowtext">
                                              {serv.Facility}
                                            </div>

                                            <div class="overflowtext">
                                              {serv.ShiftStreet},{serv.ShiftCity}
                                            </div>

                                            <div class="singleexp-detail-row">
                                              <span class="singleexp-label"
                                                >Services:</span
                                              >
                                              <span class="overflowtext"
                                                >{serv.serviceTypeName}</span
                                              >
                                            </div>

                                            <div class="singleexp-detail-row">
                                              <span class="singleexp-label"
                                                >Notes:</span
                                              >
                                              <span class="overflowtext"
                                                >{serv.Notes}</span
                                              >
                                            </div>
                                          </div>
                                        </div>
                                      </template>
                                      <template
                                        if:false={serv.unassignedService}
                                      >
                                        <div
                                          class="expanded-two-shift-row"
                                          style="
                                            display: flex;
                                            justify-content: space-between;
                                            align-items: flex-start;
                                            flex-direction: column;
                                          "
                                        >
                                          <div class="singleexp-details">
                                            <div class="overflowtext">
                                              {serv.serviceStaffName}
                                            </div>

                                            <div class="overflowtext">
                                              <a
                                                href="javascript:void(0)"
                                                onclick={handleEditShiftScreen}
                                                data-participantid={participantdata.participantId}
                                                data-shiftstaffid={serv.shiftWithStaffId}
                                                style="color: inherit"
                                              >
                                                {serv.ShiftTime}
                                              </a>
                                            </div>

                                            <div class="overflowtext">
                                              {serv.Facility}
                                            </div>

                                            <div class="overflowtext">
                                              {serv.ShiftStreet},{serv.ShiftCity}
                                            </div>

                                            <div class="singleexp-detail-row">
                                              <span class="singleexp-label"
                                                >Services:</span
                                              >
                                              <span class="overflowtext"
                                                >{serv.serviceTypeName}</span
                                              >
                                            </div>

                                            <div class="singleexp-detail-row">
                                              <span class="singleexp-label"
                                                >Notes:</span
                                              >
                                              <span class="overflowtext"
                                                >{serv.Notes}</span
                                              >
                                            </div>
                                          </div>
                                        </div>
                                      </template>
                                    </template>

                                    <div class="statuspart" style="width: 100%">
                                      <div
                                        class="slds-grid slds-grid_align-center slds-col"
                                      >
                                        <span class="status-gap"
                                          >{serv.uiStatus}</span
                                        >
                                        <span class={serv.uiStatus}
                                          >&#x2B24;</span
                                        >
                                      </div>
                                    </div>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </template>

                          <!-- day with more than one services -->
                          <template if:false={dayShift.isSizeZeroFlag}>
                            <template if:true={dayShift.moreThanFourFlag}>
                              <template if:true={dayShift.hasHovered}>
                                <template
                                  for:each={dayShift.services}
                                  for:item="serv"
                                >
                                  <template if:true={serv.isHovered}>
                                    <div
                                      key={serv.Id}
                                      class={expandedShiftClass}
                                      style={dayShift.firstRecordShiftColor}
                                    >
                                      <div
                                        class="expanded-two-shift-row"
                                        style="
                                          display: flex;
                                          justify-content: space-between;
                                          align-items: flex-start;
                                        "
                                      >
                                        <template if:true={isCompactView}>
                                          <div
                                            style="
                                              display: flex;
                                              flex-direction: column;
                                            "
                                          >
                                            <!-- <span class="rolename-firsticon"
                                              >{serv.serviceStaffName}</span
                                            > -->
                                            <template
                                              if:true={serv.unassignedService}
                                            >
                                              <span class="rolename-firsticon"
                                                ><b>{serv.RoleName}</b></span
                                              >
                                            </template>
                                            <template
                                              if:false={serv.unassignedService}
                                            >
                                              <template
                                                if:false={serv.serviceStaffName}
                                              >
                                                <span class="rolename-firsticon"
                                                  ><b>{serv.RoleName}</b></span
                                                >
                                              </template>

                                              <template
                                                if:true={serv.serviceStaffName}
                                              >
                                                <span class="rolename-firsticon"
                                                  ><b>
                                                    {serv.serviceStaffName}</b
                                                  ></span
                                                >
                                              </template>
                                            </template>

                                            <div class="staff-info-time1">
                                              <a
                                                href="javascript:void(0)"
                                                onclick={handleEditShiftScreen}
                                                data-participantid={participantdata.participantId}
                                                data-shiftstaffid={serv.shiftWithStaffId}
                                                style="color: inherit"
                                              >
                                                {serv.ShiftTime}
                                              </a>
                                            </div>
                                          </div>
                                        </template>
                                        <template if:true={isExpandedView}>
                                          <div
                                            class="expanded-two-shift-row"
                                            style="
                                              display: flex;
                                              justify-content: space-between;
                                              align-items: flex-start;
                                              flex-direction: column;
                                            "
                                          >
                                            <div class="singleexp-details">
                                              <div class="overflowtext">
                                                <!-- {serv.serviceStaffName} -->
                                                <template
                                                  if:true={serv.unassignedService}
                                                >
                                                  {serv.RoleName}
                                                </template>
                                                <template
                                                  if:false={serv.unassignedService}
                                                >
                                                  <template
                                                    if:false={serv.serviceStaffName}
                                                  >
                                                    {serv.RoleName}
                                                  </template>

                                                  <template
                                                    if:true={serv.serviceStaffName}
                                                  >
                                                    {serv.serviceStaffName}
                                                  </template>
                                                </template>
                                              </div>

                                              <div class="overflowtext">
                                                <a
                                                  href="javascript:void(0)"
                                                  onclick={handleEditShiftScreen}
                                                  data-participantid={participantdata.participantId}
                                                  data-shiftstaffid={serv.shiftWithStaffId}
                                                  style="color: inherit"
                                                >
                                                  {serv.ShiftTime}
                                                </a>
                                              </div>

                                              <div class="overflowtext">
                                                {serv.Facility}
                                              </div>

                                              <div class="overflowtext">
                                                {serv.ShiftStreet},{serv.ShiftCity}
                                              </div>

                                              <div class="singleexp-detail-row">
                                                <span class="singleexp-label"
                                                  >Services:</span
                                                >
                                                <span class="overflowtext"
                                                  >{serv.serviceTypeName}</span
                                                >
                                              </div>

                                              <div class="singleexp-detail-row">
                                                <span class="singleexp-label"
                                                  >Notes:</span
                                                >
                                                <span class="overflowtext"
                                                  >{serv.Notes}</span
                                                >
                                              </div>
                                            </div>
                                          </div>
                                        </template>
                                        <i
                                          class="material-icons back-icon"
                                          title="Back"
                                          data-serviceid={serv.Id}
                                          data-participantid={participantdata.participantId}
                                          data-day={dayShift.Shiftdate}
                                          onclick={handleCollapseServiceCard}
                                          style="cursor: pointer"
                                          >arrow_circle_left</i
                                        >
                                      </div>
                                      <div
                                        class="statuspart"
                                        style="width: 100%"
                                      >
                                        <div
                                          class="slds-grid slds-grid_align-center slds-col"
                                        >
                                          <span>{serv.uiStatus}</span>
                                          <span class={serv.uiStatus}
                                            >&#x2B24;</span
                                          >
                                        </div>
                                      </div>
                                    </div>
                                  </template>
                                </template>
                              </template>

                              <!-- If no card is expanded, show all services normally -->
                              <template if:false={dayShift.hasHovered}>
                                <template
                                  for:each={dayShift.services}
                                  for:item="serv"
                                >
                                  <div
                                    key={serv.Id}
                                    class={getIconItemClass}
                                    style={serv.inLineHeight}
                                    data-serviceid={serv.Id}
                                    data-participantid={participantdata.participantId}
                                    data-day={dayShift.Shiftdate}
                                    onclick={handleParticipantServiceClick}
                                  >
                                    <template if:true={isCompactView}>
                                      <div class="staff-info">
                                        <!-- <span class="rolename-firsticon"><b>{serv.serviceStaffName}</b></span> -->
                                        <div class="staff-info-time1">
                                          {serv.ShiftTime}
                                        </div>
                                      </div>
                                    </template>
                                    <template if:true={isExpandedView}>
                                      <div
                                        class="expanded-two-shift-row"
                                        style="
                                          display: flex;
                                          justify-content: space-between;
                                          align-items: flex-start;
                                          flex-direction: column;
                                        "
                                      >
                                        <div class="singleexp-details">
                                          <div class="overflowtext">
                                            <!-- {serv.serviceStaffName} -->
                                            <template
                                              if:true={serv.unassignedService}
                                            >
                                              {serv.RoleName}
                                            </template>
                                            <template
                                              if:false={serv.unassignedService}
                                            >
                                              <template
                                                if:false={serv.serviceStaffName}
                                              >
                                                {serv.RoleName}
                                              </template>

                                              <template
                                                if:true={serv.serviceStaffName}
                                              >
                                                {serv.serviceStaffName}
                                              </template>
                                            </template>
                                          </div>

                                          <div class="overflowtext">
                                            {serv.ShiftTime}
                                          </div>
                                        </div>
                                      </div>
                                    </template>
                                  </div>
                                </template>
                              </template>
                              <template if:false={dayShift.hasHovered}>
                                <div class="shiftsproMax">
                                  <a
                                    href="javascript:void(0)"
                                    class="add-icon-link"
                                  >
                                    <i
                                      class="material-icons more-icon"
                                      style="position: relative"
                                      onclick={handleShowMoreModal}
                                      title="View More Shifts"
                                      data-participantid={participantdata.participantId}
                                      data-weekdate={dayShift.Shiftdate}
                                      >more</i
                                    >
                                  </a>
                                </div>
                              </template>
                            </template>
                          </template>

                          <template if:true={dayShift.isSizeTwoFlag}>
                            <!-- If a card is expanded (hasHovered = true), show ONLY that card -->
                            <template if:true={dayShift.hasHovered}>
                              <template
                                for:each={dayShift.services}
                                for:item="serv"
                              >
                                <template if:true={serv.isHovered}>
                                  <div
                                    key={serv.Id}
                                    class={expandedShiftClass}
                                    style={serv.inLineHeight}
                                  >
                                    <div
                                      class="expanded-two-shift-row"
                                      style="
                                        display: flex;
                                        justify-content: space-between;
                                        align-items: flex-start;
                                      "
                                    >
                                      <template if:true={isCompactView}>
                                        <div
                                          style="
                                            display: flex;
                                            flex-direction: column;
                                          "
                                        >
                                          <!-- <span class="rolename-firsticon"
                                            >{serv.serviceStaffName}</span
                                          > -->
                                          <template
                                            if:true={serv.unassignedService}
                                          >
                                            <span class="rolename-firsticon"
                                              ><b>{serv.RoleName}</b></span
                                            >
                                          </template>
                                          <template
                                            if:false={serv.unassignedService}
                                          >
                                            <template
                                              if:false={serv.serviceStaffName}
                                            >
                                              <span class="rolename-firsticon"
                                                ><b>{serv.RoleName}</b></span
                                              >
                                            </template>

                                            <template
                                              if:true={serv.serviceStaffName}
                                            >
                                              <span class="rolename-firsticon"
                                                ><b>
                                                  {serv.serviceStaffName}</b
                                                ></span
                                              >
                                            </template>
                                          </template>

                                          <div class="staff-info-time1">
                                            <a
                                              href="javascript:void(0)"
                                              onclick={handleEditShiftScreen}
                                              data-participantid={participantdata.participantId}
                                              data-shiftstaffid={serv.shiftWithStaffId}
                                              style="color: inherit"
                                            >
                                              {serv.ShiftTime}
                                            </a>
                                          </div>
                                        </div>
                                      </template>

                                      <template if:true={isExpandedView}>
                                        <div
                                          class="expanded-two-shift-row"
                                          style="
                                            display: flex;
                                            justify-content: space-between;
                                            align-items: flex-start;
                                            flex-direction: column;
                                          "
                                        >
                                          <div class="singleexp-details">
                                            <div class="overflowtext">
                                              <!-- {serv.serviceStaffName} -->
                                              <template
                                                if:true={serv.unassignedService}
                                              >
                                                {serv.RoleName}
                                              </template>
                                              <template
                                                if:false={serv.unassignedService}
                                              >
                                                <template
                                                  if:false={serv.serviceStaffName}
                                                >
                                                  {serv.RoleName}
                                                </template>

                                                <template
                                                  if:true={serv.serviceStaffName}
                                                >
                                                  {serv.serviceStaffName}
                                                </template>
                                              </template>
                                            </div>

                                            <div class="overflowtext">
                                              <a
                                                href="javascript:void(0)"
                                                onclick={handleEditShiftScreen}
                                                data-participantid={participantdata.participantId}
                                                data-shiftstaffid={serv.shiftWithStaffId}
                                                style="color: inherit"
                                              >
                                                {serv.ShiftTime}
                                              </a>
                                            </div>

                                            <div class="overflowtext">
                                              {serv.Facility}
                                            </div>

                                            <div class="overflowtext">
                                              {serv.ShiftStreet},{serv.ShiftCity}
                                            </div>

                                            <div class="singleexp-detail-row">
                                              <span class="singleexp-label"
                                                >Services:</span
                                              >
                                              <span class="overflowtext"
                                                >{serv.serviceTypeName}</span
                                              >
                                            </div>

                                            <div class="singleexp-detail-row">
                                              <span class="singleexp-label"
                                                >Notes:</span
                                              >
                                              <span class="overflowtext"
                                                >{serv.Notes}</span
                                              >
                                            </div>
                                          </div>
                                        </div>
                                      </template>
                                      <i
                                        class="material-icons back-icon"
                                        title="Back"
                                        data-serviceid={serv.Id}
                                        data-participantid={participantdata.participantId}
                                        data-day={dayShift.Shiftdate}
                                        onclick={handleCollapseServiceCard}
                                        style="cursor: pointer"
                                        >arrow_circle_left</i
                                      >
                                    </div>
                                    <div class="statuspart" style="width: 100%">
                                      <div
                                        class="slds-grid slds-grid_align-center slds-col"
                                      >
                                        <span>{serv.uiStatus}</span>
                                        <span class={serv.uiStatus}
                                          >&#x2B24;</span
                                        >
                                      </div>
                                    </div>
                                  </div>
                                </template>
                              </template>
                            </template>

                            <!-- If no card is expanded, show all services normally -->
                            <template if:false={dayShift.hasHovered}>
                              <template
                                for:each={dayShift.services}
                                for:item="serv"
                              >
                                <div
                                  key={serv.Id}
                                  class={getIconItemClass}
                                  style={serv.inLineHeight}
                                  data-serviceid={serv.Id}
                                  data-participantid={participantdata.participantId}
                                  data-day={dayShift.Shiftdate}
                                  onclick={handleParticipantServiceClick}
                                >
                                  <template if:true={isCompactView}>
                                    <div class="staff-info">
                                      <!-- <span class="rolename-firsticon"
                                        ><b>{serv.serviceStaffName}</b></span
                                      > -->
                                      <template
                                        if:true={serv.unassignedService}
                                      >
                                        <span class="rolename-firsticon"
                                          ><b>{serv.RoleName}</b></span
                                        >
                                      </template>
                                      <template
                                        if:false={serv.unassignedService}
                                      >
                                        <template
                                          if:false={serv.serviceStaffName}
                                        >
                                          <span class="rolename-firsticon"
                                            ><b>{serv.RoleName}</b></span
                                          >
                                        </template>

                                        <template
                                          if:true={serv.serviceStaffName}
                                        >
                                          <span class="rolename-firsticon"
                                            ><b>
                                              {serv.serviceStaffName}</b
                                            ></span
                                          >
                                        </template>
                                      </template>
                                      <div class="staff-info-time1">
                                        {serv.ShiftTime}
                                      </div>
                                    </div>
                                  </template>

                                  <template if:true={isExpandedView}>
                                    <div
                                      class="expanded-two-shift-row"
                                      style="
                                        display: flex;
                                        justify-content: space-between;
                                        align-items: flex-start;

    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={shiftDeleteConfirmation}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container" style="width: 20%">
        <header
          class="slds-modal__header modal-header"
          style="background: #124795; border-radius: 15px 15px 0 0"
        >
          <h2
            class="slds-text-heading_medium slds-hyphenate modal-title"
            style="color: white; font-weight: bold; text-align: left"
          >
            Delete
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small">
            <div><h1>Are you sure you want to delete the shift?</h1></div>
            <div class="button-container">
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handleDeleteShift}
                class="slds-m-around_small"
              ></lightning-button>
              <lightning-button
                label="No"
                variant="brand"
                onclick={closeWarningMessage}
                class="slds-m-around_small"
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={fatigueManagementFlag}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container">
        <!-- Centered Header -->
        <header class="slds-modal__header modal-header">
          <h2 class="slds-text-heading_medium slds-hyphenate modal-title">
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small">
            <div>
              <h1>
                <p>
                  The interval between shifts is less than 8 hours for the
                  following staff. Would you like to assign this shift?
                </p>
              </h1>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container">
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handleFinalAllocate}
                class="slds-m-around_small"
              ></lightning-button>
              <lightning-button
                label="No"
                variant="brand"
                onclick={handleDeselectStaff}
                class="slds-m-around_small"
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={autoschdulePopup}>
    <div class="blur-overlay"></div>
    <div class="right-align1 fade-in" style="width: 45%">
      <div
        class="slds-m-around_xx-small slds-m-right_large"
        style="
          padding: 1% 2%;
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <p style="font-weight: bold; margin: 0; font-size: 140%">
          Auto Schedule
        </p>
        <!-- <lightning-button label="Back" title="Back" variant="brand" onclick={handleCloseautoSchedule}></lightning-button> -->
      </div>
      <div
        class="slds-modal__content slds-p-around_medium"
        style="background-color: #f3f5f7"
      >
        <div style="display: flex">
          <!-- Static Serial Numbers -->
          <div class="serial-number-column">
            <div class="serial-number">1.</div>
            <div class="serial-number">2.</div>
            <div class="serial-number">3.</div>
            <div class="serial-number">4.</div>
            <div class="serial-number">5.</div>
            <div class="serial-number">6.</div>
          </div>

          <!-- Table Content -->
          <div style="width: 100%">
            <table
              class="slds-table slds-table_cell-buffer slds-table_bordered"
            >
              <tbody>
                <template for:each={rows} for:item="row" for:index="index">
                  <tr
                    key={row.id}
                    ondragover={handleDragOver}
                    ondrop={handleDrop}
                    data-index={index}
                  >
                    <td
                      style="width: 40px"
                      draggable="true"
                      data-index={index}
                      ondragstart={handleDragStart}
                    >
                      <lightning-icon
                        icon-name="utility:rows"
                        alternative-text="Drag"
                        size="x-small"
                        class="drag-icon"
                      ></lightning-icon>
                    </td>

                    <td style="border-right: none">
                      <div if:true={row.isSlider}>
                        <div>
                          <strong>Geo Location</strong><br />
                          <span style="font-size: 80%">Radius (km)</span>
                        </div>
                      </div>
                      <template if:false={row.isSlider}>
                        <strong>{row.label}</strong>
                      </template>
                    </td>

                    <td style="border-left: none">
                      <template if:true={row.isCheckbox}>
                        <lightning-input
                          type="checkbox"
                          data-index={index}
                          checked={row.value}
                          onchange={handleInputChange}
                        ></lightning-input>
                      </template>

                      <template if:true={row.isRadio}>
                        <div class="radio-group">
                          <lightning-radio-group
                            data-index={index}
                            options={employmentTypeOptions}
                            value={row.value}
                            onchange={handleInputChange}
                            type="radio"
                            variant="label-hidden"
                          ></lightning-radio-group>
                        </div>
                      </template>

                      <template if:true={row.isIcon}>
                        <div
                          onclick={toggleArrow}
                          data-index={index}
                          style="
                            cursor: pointer;
                            display: flex;
                            align-items: center;
                            gap: 5px;
                          "
                        >
                          <lightning-icon
                            icon-name={row.iconName}
                            alternative-text="Arrow"
                            size="x-small"
                          ></lightning-icon>
                          <span>{row.directionLabel}</span>
                        </div>
                      </template>
                      <template if:true={row.isSlider}>
                        <div style="display: flex; flex-direction: column">
                          <lightning-slider
                            label="Radius (km)"
                            variant="label-hidden"
                            size="small"
                            value={row.value}
                            min="0"
                            max="200"
                            step="1"
                            data-index={index}
                            onchange={handleInputChange}
                            onmousedown={stopDragPropagation}
                            ontouchstart={stopDragPropagation}
                          ></lightning-slider>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="slds-p-around_medium slds-text-align_center">
        <lightning-button
          label="Cancel"
          onclick={handleCloseautoSchedule}
          class="slds-m-right_small"
        ></lightning-button>
        <lightning-button
          variant="brand"
          label="Run"
          onclick={handleRun}
        ></lightning-button>
      </div>
    </div>
  </template>
  <template if:true={publishTempalte}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Confirmation
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small">
            <!-- <div style="text-align:center">
                        <h1>
                            <p>
                               Are you sure want to publish the shifts? If yes please click on Submit.
                            </p>
                        </h1>
                    </div> -->
            <div
              style="display: flex; flex-direction: column; align-items: center"
            >
              <div class="slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Start Date</span>
                  <lightning-input
                    type="date"
                    name="start"
                    variant="label-hidden"
                    value={publishStartDate}
                    onchange={handlePublishDateChange}
                  >
                  </lightning-input>
                </div>
              </div>
              <div class="slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">End Date</span>
                  <lightning-input
                    type="date"
                    name="end"
                    variant="label-hidden"
                    value={publishEndDate}
                    onchange={handlePublishDateChange}
                  >
                  </lightning-input>
                </div>
              </div>
              <div>
                <lightning-input
                  type="checkbox"
                  label="I confirm that the roster between these dates is ready to publish."
                  checked={isCheckboxChecked}
                  onchange={handlePublishCheckboxChange}
                >
                </lightning-input>
              </div>
              <p>
                <b>Note: </b>End Date is required and must be after Start Date.
              </p>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container">
              <lightning-button
                label="Cancel"
                variant="brand-outline"
                onclick={handlePublishClose}
                class="slds-m-around_small"
              ></lightning-button>
              <lightning-button
                label="Submit"
                variant="brand"
                onclick={handleFinalPublish}
                disabled={isPublishDisable}
                class="slds-m-around_small"
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
