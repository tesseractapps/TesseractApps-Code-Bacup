<template>
  <template if:true={participantData} >
      <div  class="role-content">
       
          <div  class="slds-table" style="background-color: transparent;">
            <table class="slds-table slds-table_fixed-layout slds-table_resizable-cols weekly-table glow-hover table2" role="grid">
              <thead>
                <tr>
                  <td class="firstcellwidth">
                    <div class="staff-member">
                      <div class="floating-label-new">
                        <span class="label-text-drop">Search by Name</span>
                        <lightning-input type="search"  variant="label-hidden"  value={searchName} onchange={handleSearchName} ></lightning-input>
                    </div>
                    </div>
                  </td>
                
                  <template for:each={participantData.weekData} for:item="weekDay">
                    <td key={weekDay.date} class={weekDay.holidayColor}>
                      <!-- <div class={weekDay.holidayColor}> -->
                          <div class="day-left">
         
                                              <div class="day-name">{weekDay.day}</div>
                                              <div class="day-date">{weekDay.UiFormattedDate}</div>
                                              
                                          </div>
                      
                          <!-- <p><b>{weekDay.day}</b> <br><b>{weekDay.UiFormattedDate}</b></p> -->
                          <div class="holiday-spacer-bottom">
                                    <template if:true={weekDay.isHoliday}>
                                      <div class="holiday-label" title={weekDay.holidayName}>
                                        {weekDay.holidayName}
                                      </div>
                                    </template>
                                  </div>
                      <!-- </div> -->
                    </td>
                  </template>
                </tr>
                    </thead>
                      </table>
                      <div class="calendar-part custom-scroll">
  <table class="slds-table slds-table_bordered slds-table_fixed-layout table1" role="grid">
                          <tbody>
                <template for:each={participantData.Participnat} for:item="participantdata">
                  <tr key={participantdata.participantId}>
                      <!-- Staff Name and Info Column -->
                      <td style="width:16%">
                        <div class="card" data-id={participantdata.participantId} draggable="true" ondragstart={handleDragStart}>
                          <div class="avatar" if:true={participantdata.profileUrl} >
                             <lightning-avatar  variant="circle"  src={participantdata.profileUrl} class="avatar-small" fallback-icon-name="standard:person_account" 
                           >
                            </lightning-avatar>
                          </div>
                          <div class="avatar" if:false={participantdata.profileUrl} >
                            <lightning-icon icon-name="action:user" variant="error" size="small" style="background:#02275b;"  class="avatar-small fallback-icon"></lightning-icon>
                        </div>
                          <div class="info">
                        
                            <span class="name">{participantdata.firstName}&nbsp;{participantdata.lastName}</span >
                           <a href="javascript:void(0);" class="details" style="color:black" onclick={handleRiskNavigation} data-participantid={participantdata.participantId}>{participantdata.riskStatus}</a> 
                           <!--   <span  class="details">{participantdata.riskStatus}</span >  -->
                            <span  class="meta">${participantdata.wages}</span > 
                          </div>
                      </div>
                      </td>
                      <template for:each={participantdata.servicesByDay} for:item="dayShift">
                          <td key={dayShift.day} class={dayShift.dynamicStyleFalg} style={dayShift.firstRecordShiftColor} ondragover={handleDragOver}  data-facvalue={participantdata.facilityIdValue} ondrop={handleOpenParticipantShiftView} data-participantid={participantdata.participantId}
                                      data-weekname={dayShift.day data-weekdate={dayShift.Shiftdate} data-isholiday={dayShift.isHoliday}>
                           
                                      <!-- day with no services -->
                            <template if:true={dayShift.isSizeZeroFlag}>
                                <div class="no-shifts" >
                                  <a href="javascript:void(0)">
                                    <lightning-icon
                                      icon-name="utility:add"
                                      size="xx-small"
                                      style="transform: scale(0.7);"
                                      data-participantid={participantdata.participantId}
                                      data-facvalue={participantdata.facilityIdValue}
                                      data-weekname={dayShift.day}
                                      data-weekdate={dayShift.Shiftdate}
                                      data-isholiday={dayShift.isHoliday}
                                      onclick={handleOpenParticipantShiftView}  >
                                    </lightning-icon>
                                  </a>
                                </div>
                            </template>
                              <!-- day with one services -->
                              <template if:false={dayShift.isSizeZeroFlag}>
                                <template if:true={dayShift.isSizeOneFlag}>
                                    <template for:each={dayShift.services} for:item="serv">
                                        <div key={serv.Id} class="ServiceWithone colorContainer">
                                          <template if:true={serv.unassignedService}>
                                           <div class="serviceOneImage" >
                                            <lightning-icon 
                                                icon-name="standard:user" 
                                                alternative-text="user" 
                                                size="small" 
                                                title="user"
                                                class="default-iconSinglecell1"
                                                style="MARGIN-LEFT: 6PX;">
                                            </lightning-icon>
                                           </div>
                                          <div class="serviceText">
                                            <span class="staff-name"> {serv.RoleName}
                                            </span>
                                              <span class="shift-time"> {serv.ShiftTime}
                                            </span>
                                            <span class="unassignedstatus">
                                              <span  class={serv.cssUiStatus}>{serv.uiStatus}</span>
                                              <span class={serv.cssUiStatus} style="margin-left:3%;" >&#x2B24;</span> 
                                            </span>
                                             
                                          </div>
                                            
                                          </template>
                                          <template if:false={serv.unassignedService}>
                                            <div class="serviceOneImage" >
                                              <template if:false={serv.serviceStaffImage}>
                                                <lightning-icon 
                                                icon-name="standard:user" 
                                                alternative-text="user" 
                                                size="small" 
                                                title="user"
                                                class="default-iconSinglecell">
                                            </lightning-icon>
                                              </template>
                                              <template if:true={serv.serviceStaffImage}>
                                                  <lightning-avatar variant="circle" src={serv.serviceStaffImage} initials="P" fallback-icon-name="standard:person_account" style="position: relative;top: -4px;"></lightning-avatar>
                                              </template>
                                          </div>
                                          <div class="serviceText">
                                              <span class="staff-name"><b>{serv.serviceStaffName}</b></span>
                                              <span class="shift-time"><a href="javascript:void(0)" onclick={handleEditShiftScreen} data-participantid={participantdata.participantId} data-shiftstaffid={serv.shiftWithStaffId} style="color:inherit">
                                                {serv.ShiftTime}
                                              </a></span>
                                              <span class="status0ne">
                                                <span  class={serv.singleShiftUistatus}>{serv.uiStatus}</span>
                                                <span class={serv.singleShiftUistatus} style="margin-left:3%;" >&#x2B24;</span> 
                                              </span>
                                          </div>
                                          </template>
                                            
                                        </div>
                                    </template>
                                </template>
                            </template>
                            
                               <!-- day with more than one services -->
                               <template if:false={dayShift.isSizeZeroFlag}>
                                <template if:true={dayShift.moreThanOneflag}>
                                    <div class="shift-container">
                                        <template for:each={dayShift.services} for:item="serv">
                                            <div key={serv.Id}>
                            
                                                <!-- First Record (Top) -->
                                                <template if:true={serv.isFirstRecordType}>
                                                    <div class="top-record">
                                                        <span ><!-- class="serviceOneImage" -->
                                                        
                                                            <template if:false={serv.serviceStaffImage}>
                                                                <lightning-icon icon-name="standard:user" alternative-text="user" size="small"
                                                                    title="user"  class="toprecordIcon" >
                                                                </lightning-icon>
                                                            </template>
                                                            <template if:true={serv.serviceStaffImage}>
                                                              <lightning-avatar variant="circle" src={serv.serviceStaffImage} initials="P"
                                                              fallback-icon-name="standard:person_account" data-id={serv.Id} class="toprecordAvatar">
                                                             </lightning-avatar>
                                                                
                                                            </template>
                                                        </span>
                                                        <div class="service-details">
                                                          <template if:true={serv.unassignedService}>
                                                                   <span class="staff-name"> {serv.RoleName} </span>
                                    
                                                                   <span class="shift-time"> {serv.ShiftTime}</span>
                                                          </template>
                                                         <template if:false={serv.unassignedService}>
                                                                    <span class="staff-name"><b>{serv.serviceStaffName}</b></span>
                                                                          <span class="shift-time">
                                                                    <a href="javascript:void(0)" onclick={handleEditShiftScreen}
                                                                        data-participantid={participantdata.participantId}
                                                                        data-shiftstaffid={serv.shiftWithStaffId} style="color:inherit">
                                                                        {serv.ShiftTime}
                                                                    </a>
                                                              </span>
                                                         </template>
                                                           
                                                            
                                                              <span class="statustwo">
                                                                <div class={serv.twoRecordStatus}>
                                                                <span  class={serv.cssUiStatus}>{serv.uiStatus}</span>
                                                                <span class={serv.cssUiStatus} style="margin-left:3%;" >&#x2B24;</span> 
                                                                </div>
                                                              </span>
                                                              
                                                        </div>
                                                    </div>
                                                </template>
                            
                                                <template if:false={serv.isFirstRecordType}>
                                                  <div class="overlapping-container">
                                                    <template if:true={serv.isSecondRecord}>
                                                        <span class="overlapping-participant">
                                                            <template if:false={serv.serviceStaffImage}>
                                                                <lightning-icon icon-name="standard:user" alternative-text="user" size="small"
                                                                    class="default-icon1" data-id={serv.Id} data-shifttime={serv.ShiftTime}
                                                                    data-staffname={serv.serviceStaffName} data-servicestaffimage={serv.serviceStaffImage}
                                                                    data-participantid={participantdata.participantId}  data-rolename={serv.RoleName} data-status={serv.uiStatus} data-cssuistatus={serv.cssUiStatus}
                                                                    data-shiftstaffid={serv.shiftWithStaffId} data-unassignedservice={serv.unassignedService} onclick={showTooltip}>
                                                                </lightning-icon>
                                                            </template>
                                                            <template if:true={serv.serviceStaffImage}>
                                                                <lightning-avatar variant="circle" src={serv.serviceStaffImage} initials="P"
                                                                    fallback-icon-name="standard:person_account" data-id={serv.Id}
                                                                    data-shifttime={serv.ShiftTime} data-staffname={serv.serviceStaffName}
                                                                    data-servicestaffimage={serv.serviceStaffImage}
                                                                    data-participantid={participantdata.participantId} data-rolename={serv.RoleName}
                                                                    data-shiftstaffid={serv.shiftWithStaffId} data-unassignedservice={serv.unassignedService} data-status={serv.uiStatus} data-cssuistatus={serv.cssUiStatus} onclick={showTooltip} class="secondAvatar">
                                                                </lightning-avatar>
                                                            </template>
                                                        </span>
                                                    </template>
                            
                                                    <template if:true={serv.isThirdRecord}>
                                                        <span class="overlapping-participant1">
                                                            <template if:false={serv.serviceStaffImage}>
                                                                <lightning-icon icon-name="standard:user" alternative-text="user" size="small"
                                                                    class="default-icon2" data-id={serv.Id} data-shifttime={serv.ShiftTime}
                                                                    data-staffname={serv.serviceStaffName} data-servicestaffimage={serv.serviceStaffImage}
                                                                    data-participantid={participantdata.participantId} data-rolename={serv.RoleName}
                                                                    data-shiftstaffid={serv.shiftWithStaffId} data-unassignedservice={serv.unassignedService} data-status={serv.uiStatus} data-cssuistatus={serv.cssUiStatus} onclick={showTooltip}>
                                                                </lightning-icon>
                                                            </template>
                                                            <template if:true={serv.serviceStaffImage}>
                                                                <lightning-avatar variant="circle" src={serv.serviceStaffImage} initials="P"
                                                                    fallback-icon-name="standard:person_account" data-id={serv.Id}
                                                                    data-shifttime={serv.ShiftTime} data-staffname={serv.serviceStaffName}
                                                                    data-servicestaffimage={serv.serviceStaffImage}
                                                                    data-participantid={participantdata.participantId} data-rolename={serv.RoleName}
                                                                    data-shiftstaffid={serv.shiftWithStaffId} data-unassignedservice={serv.unassignedService} data-status={serv.uiStatus} data-cssuistatus={serv.cssUiStatus} onclick={showTooltip} class="thirdAvatar">
                                                                </lightning-avatar>
                                                            </template>
                                                        </span>
                                                    </template>

                                                     <!-- Fourth Record (More) -->
                                                    <template if:true={serv.isFourthRecord}>
                                                      <span class="more-shifts" onclick={handleShowMoreModal} title="View More Shifts"
                                                          data-participantid={participantdata.participantId} data-weekdate={dayShift.Shiftdate}>
                                                          <u>more</u>
                                                      </span>
                                                  </template>
                                                 
                                                </div>
                                                </template>
                                                <!-- Overlapping Section -->
                                  
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </template>
                            
                            
                              
                          </td>
                      </template>
                  </tr>
                </template>
              </tbody>
              </table>
                      </div>
          </div>
      </div>
  </template>

  <template if:true={isTooltip}>
    <div class="tooltip" style={shiftTooltipInformation.position} onclick={stopPropagation}>
        <span class="close-icon" onclick={closeTooltip}>✖</span>

        <div class="top-recordToopTip">
            <!-- Left Side: Image or Icon -->
            <template if:false={shiftTooltipInformation.servicestaffimage}>
                <lightning-icon 
                    icon-name="standard:user" 
                    alternative-text="user" 
                    size="small" 
                    title="user"
                    class="toolTipIcon"
                    data-id={shiftTooltipInformation.serviceid} 
                    data-shifttime={shiftTooltipInformation.shiftTime}  
                    data-staffname={shiftTooltipInformation.staffname}  
                    data-servicestaffimage={shiftTooltipInformation.serviceStaffImage}
                    data-participantid={shiftTooltipInformation.participantid} 
                    data-shiftstaffid={shiftTooltipInformation.shiftstaffid} 
                    onclick={showTooltip}>
                </lightning-icon>
            </template>

            <template if:true={shiftTooltipInformation.servicestaffimage}>
                <lightning-avatar 
                    variant="circle" 
                    src={shiftTooltipInformation.servicestaffimage} 
                    initials="P" 
                    fallback-icon-name="standard:person_account"
                    data-id={shiftTooltipInformation.serviceid} 
                    data-shifttime={shiftTooltipInformation.shiftTime}  
                    data-staffname={shiftTooltipInformation.staffname}  
                    data-servicestaffimage={shiftTooltipInformation.serviceStaffImage}
                    data-participantid={shiftTooltipInformation.participantid} 
                    data-shiftstaffid={shiftTooltipInformation.shiftstaffid} 
                    onclick={showTooltip} 
                    class="toolTipAvatar">
                </lightning-avatar>
            </template>

            <!-- Right Side: Name & Shift Time -->
            <div class="service-detailstooltip">
              <template if:true={shiftTooltipInformation.unassignedservice}>
                    <span ><b>{shiftTooltipInformation.rolename}</b></span>
                    <span>  {shiftTooltipInformation.shiftTime} </span>
              </template>
              <template if:false={shiftTooltipInformation.unassignedservice}>
                     <span ><b>{shiftTooltipInformation.staffname}</b></span>
                <span >
                    
                        <a href="javascript:void(0)" onclick={handleEditShiftScreen} 
                           data-participantid={shiftTooltipInformation.participantid} 
                           data-shiftstaffid={shiftTooltipInformation.shiftstaffid}>
                            {shiftTooltipInformation.shiftTime}
                        </a>
                  
                </span>
                 
              </template>
              <span class={shiftTooltipInformation.cssUiStatus}  >
                <span class="tooltipstatus"> 
                   <span  class={shiftTooltipInformation.cssUiStatus}>{shiftTooltipInformation.uiStatus}</span>
                   <span class={shiftTooltipInformation.cssUiStatus} style="margin-left:3%;" >&#x2B24;</span> 
                </span>
                                 
              </span>
               
            </div>
        </div>
    </div>
  </template>

  <template if:true={isModalOpen}>
    <div class="modal-overlay" onclick={handleCloseModal}></div>
    <div class="custom-modal" style={modalStyle}>
        <div class="modal-headerToooltip">
            <h2 style="color: white;">SERVICE DETAILS</h2>
            <div class="close-btn" onclick={handleCloseModal}>&times;</div>
        </div>
        <div class="modal-body custom-scroll">
            <template if:true={moreShiftlist.length} >
                <template for:each={moreShiftlist} for:item="shift">
                    <div key={shift.Id} class="shift-card" style={shift.ShiftwithStaff__r.Shiftcolor__c}   ><!-- class="shift-card" style={shift.ShiftwithStaff__r.Shiftcolor__c} -->
                        <div class="shift-info">
                          <template if:true={shift.unassignedService}>
                              <p class="staff-name1"><b> {shift.ShiftwithStaff__r.Role_formula__c}</b> </p>
                              <p class="staff-name1"><b>{shift.Start_Time_Formula__c}-{shift.End_Time_Formula__c}</b> </p>
                          </template>
                           <template if:false={shift.unassignedService}>
                                <p class="staff-name1"><b> {shift.Resource_Name__c}</b> </p>

                                <a href="javascript:void(0)" onclick={handleEditShiftScreen} data-shiftstaffid={shift.ShiftwithStaff__c} data-participantid={shift.Client__c}  ><!-- data-participantid={participantdata.participantId} -->
                                           <p class="shift-time-more">{shift.Start_Time_Formula__c}-{shift.End_Time_Formula__c}</p>
                                </a>
                           </template>
                            <span class={shift.cssUiStatus} style="left: -3px;bottom: 14px;font-size: 11px;" >
                                  <span  class={shift.cssUiStatus}>{shift.uiStatus}</span>
                                   <span class={shift.cssUiStatus} style="margin-left:3%;" >&#x2B24;</span> 
                            </span>
                           
                            
                        </div>
                    </div>
                </template>
            </template>
            <template if:false={moreShiftlist.length}>
                <p class="no-shift">No shift details to display.</p>
            </template>
        </div>
    </div>
  </template>


  <template if:true={openParticipantshiftView}>
    <div class="blur-overlay">
      <div class="right-align fade-in" style="width:60%;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <p style="font-weight: bold; padding: 1% 0% 2% 1%;font-size:140%">{headingLabel}</p>
           <!-- <div style="display: flex; align-items: center; gap: 10px;margin-right:1.5%;">
          
              <lightning-button  variant="brand"  label="Back" title="Back"  onclick={handleCloseCalenderParticipantView}> </lightning-button>
           </div> -->
        </div>
<div class="right-content custom-scroll">
        <div class="slds-grid slds-gutters slds-wrap slds-p-horizontal_small slds-p-bottom_small">
           <!--  First Column  -->
          <div class="slds-col slds-large-size_12-of-12 slds-medium-size_6-of-12 slds-small-size_12-of-12">
              <div class="slds-box slds-theme_default slds-m-bottom_small"> <!-- box one starts -->
                <div class="container-box">
                          <div class="toggle-bar">
                              <span >Shift Details</span>
                          </div>
                      <div class="slds-grid slds-wrap" style="padding-top: 1%;">
                          <div class="slds-size_1-of-5 slds-p-around_small">
                              <div class="floating-label-new">
                                  <span class="label-text-drop">Date</span>
                                  <lightning-input type="date" class="AddShiftStartDate" name="AddShiftStartDate" variant="label-hidden" value={addShiftData.AddShiftStartDate}  onchange={handleAddShiftChange} disabled={disablePostInsertButtons}></lightning-input>
                              </div>
                          </div>
                          <div class="slds-size_1-of-5 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Quantity</span>
                                <lightning-input type="number"  name="AddShiftQuantity" variant="label-hidden"  value={addShiftData.AddShiftQuantity} onchange={handleAddShiftChange} disabled="true" ></lightning-input>
                            </div>
                        </div>
                          <div class="slds-size_1-of-5 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Staff</span>
                                <lightning-combobox name="AddShiftStaffValue" class="AddShiftStaffValue" variant="label-hidden" options={staffComboBoxOptions} value={addShiftData.AddShiftStaffValue} onchange={handleAddShiftChange} disabled={disablePostInsertButtons} 
                                  ></lightning-combobox>
                            </div>
                         </div>
                          <div class="slds-size_1-of-5 slds-p-around_small">
                              <div class="floating-label-new">
                                  <span class="label-text-drop">Facilty</span>
                                  <lightning-combobox  name="AddShiftFacilityValue" class="AddShiftFacilityValue" variant="label-hidden" options={finalSelectedFacilities} value={addShiftData.AddShiftFacilityValue} onchange={handleAddShiftChange}  disabled="true"
                                  ></lightning-combobox>
                              </div>
                          </div>
                          <div class="slds-size_1-of-5 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Role</span>
                                <lightning-combobox  name="AddShiftRole" class="AddShiftRole" variant="label-hidden" options={roleOptions} value={addShiftData.AddShiftRole} onchange={handleAddShiftChange}  disabled={disablePostInsertButtons}
                                ></lightning-combobox>
                            </div>
                        </div> 
                        <div class="slds-size_1-of-5 slds-p-around_small">
                          <div class="floating-label-new">
                              <span class="label-text-drop">Shift Type</span>
                              <lightning-combobox name="AddShiftType" class="AddShiftType" variant="label-hidden" options={shiftTypeOptions} value={addShiftData.AddShiftType} onchange={handleAddShiftChange}  disabled={disablePostInsertButtons}
                              ></lightning-combobox>
                          </div>
                      </div> 
                     
                     <div class="slds-size_1-of-5 slds-p-around_small">
                      <div class="floating-label-new">
                          <span class="label-text-drop">Start Time</span>
                              <c-time-picker data-timetype="AddShiftStartTime" selected-hour={startTimeSelectedHour} selected-minute={startTimeSelectedMinute} data-ampm="AddShiftStartTimeAMPM"  displayed-time={addShiftData.AddShiftStartTimeAMPM} is-am={startTimeAMPM} disable-time-button={disableTimeButton} onsavetimefromchild={handleAddShiftTimeData} ></c-time-picker>
                      </div>
                   </div>
                   <div class="slds-size_1-of-5 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">End Time</span>
                              <c-time-picker data-timetype="AddShiftEndTime" data-ampm="AddShiftEndTimeAMPM"  selected-hour={endTimeSelectedHour}   selected-minute={endTimeSelectedMinute}   displayed-time={addShiftData.AddShiftEndTimeAMPM} is-am={endTimeAMPM} disable-time-button={disableTimeButton} onsavetimefromchild={handleAddShiftTimeData} ></c-time-picker>
                    </div>
                 </div>
                  <div class="slds-size_1-of-5 slds-p-around_small">
                  <div class="floating-label-new">
                      <span class="label-text-drop">Break(mins)</span>
                      <lightning-input type="number" name="AddShiftBreak" variant="label-hidden" value={addShiftData.AddShiftBreak} onchange={handleAddShiftChange}  disabled="true"></lightning-input>
                  </div>
               </div>
                 <template if:true={IsLongShift}>
                  
                  <!-- <div class="slds-size_1-of-2 slds-p-around_small">
                    <span class="slds-p-around_small"><b> Set  Rates</b> </span>
                  </div> -->
                  <!-- <div class="slds-size_1-of-2">
                    <div >
                      <lightning-icon icon-name="action:new" alternative-text="new" size="x-small" title="new" onclick={addRateRow} style="margin-left: 85%;"></lightning-icon>
                       
                    </div>
                  </div> -->
                    <div class="slds-size_1-of-5 slds-p-around_small">
                  &nbsp;
               </div>
                  <div class="slds-size_1-of-5 slds-p-around_large">
                      <div class="slds-grid slds-grid_align-spread slds-align-center">
                        <span style="margin-top: 1.5%;"><b>Custom Shifts</b></span>
                                               
                                    <i class="material-icons add-icon" onclick={addRateRow}>add_circle</i>
                                
                      </div>
                    </div>
                  <div class="slds-size_4-of-5 slds-p-around_small">
                     <template for:each={rateRows} for:item="row" for:index="index">
                        <div key={row.id} class="slds-grid slds-wrap slds-grid_vertical-align-center">

                          <div class="slds-size_1-of-12 slds-p-around_small slds-grid slds-align_absolute-center slds-grid_vertical-align-center" style="overflow: hidden;position:relative;">
                                                  
                                    <i class="material-icons delete-icon" onclick={deleteRateRow} data-index={index}>delete</i>
                                  
                          </div>
                          <div class="slds-size_3-of-12 slds-p-left_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Shift Type</span>
                                <lightning-combobox name="rowShiftType" data-index={index} options={longShiftOptions}
