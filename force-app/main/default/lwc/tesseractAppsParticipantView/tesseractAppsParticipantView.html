<template>
    <template if:true={participantData} >
        <div  class="role-content">
         
            <div  class="slds-table">
              <table class="slds-table slds-table_bordered slds-table_fixed-layout slds-table_resizable-cols weekly-table" role="grid">
                <tbody>
                  <tr>
                    <td>
                      <div class="staff-member">
                        <div class="floating-label">
                          <span class="label-text-drop">Search by Name</span>
                          <lightning-input type="search"  variant="label-hidden"  value={searchName} onchange={handleSearchName} ></lightning-input>
                      </div>
                      </div>
                    </td>
                  
                    <template for:each={participantData.weekData} for:item="weekDay">
                      <td key={weekDay.date} class="day-cell employee-column">
                        <div class={weekDay.holidayColor}>
                            <template if:true={weekDay.isHoliday}>
                            <span><b>{weekDay.holidayName}</b></span>
                            </template>
                        
                            <p><b>{weekDay.day}</b> <br><b>{weekDay.UiFormattedDate}</b></p>
                        </div>
                      </td>
                    </template>
                  </tr>
                  <template for:each={participantData.Participnat} for:item="participantdata">
                    <tr key={participantdata.participantId}>
                        <!-- Staff Name and Info Column -->
                        <td>
                          <div class="card" data-id={participantdata.participantId} draggable="true" ondragstart={handleDragStart}>
                            <div class="avatar" if:true={participantdata.profileUrl} draggable="false">
                               <lightning-avatar  variant="circle"  src={participantdata.profileUrl} class="avatar-small" fallback-icon-name="standard:person_account" 
                             >
                              </lightning-avatar>
                            </div>
                            <div class="avatar" if:false={participantdata.profileUrl} draggable="false">
                              <lightning-icon icon-name="action:user" variant="error" size="small" style="background:#02275b;"  class="avatar-small fallback-icon"></lightning-icon>
                          </div>
                            <div class="info">
                          
                              <span class="name">{participantdata.firstName}&nbsp;{participantdata.lastName}</span >
                             <a href="javascript:void(0);" class="details" style="color:black" onclick={handleRiskNavigation} data-participantid={participantdata.participantId}>{participantdata.riskStatus}</a> 
                             <!--   <span  class="details">{participantdata.riskStatus}</span >  -->
                              <span  class="meta">${participantdata.wages}</span > 
                            </div>
                        </div>
                        </td>
                        <template for:each={participantdata.servicesByDay} for:item="dayShift">
                            <td key={dayShift.day} class="slds-text-align_center" style={dayShift.firstRecordShiftColor}>
                              <!-- day with no services -->
                              <template if:true={dayShift.isSizeZeroFlag}>
                                  <div class="no-shifts" >
                                    <a href="javascript:void(0)">
                                      <lightning-icon
                                        icon-name="utility:add"
                                        size="xx-small"
                                        style="transform: scale(0.7);"
                                        data-participantid={participantdata.participantId}
                                        data-weekname={dayShift.day}
                                        data-weekdate={dayShift.Shiftdate}
                                        data-isholiday={dayShift.isHoliday}
                                        onclick={handleOpenParticipantShiftView}>
                                      </lightning-icon>
                                    </a>
                                  </div>
                              </template>
                                <!-- day with one services -->
                                <template if:false={dayShift.isSizeZeroFlag}>
                                  <template if:true={dayShift.isSizeOneFlag}>
                                      <template for:each={dayShift.services} for:item="serv">
                                          <div key={serv.Id} class="ServiceWithone colorContainer" >
                                              <div class="serviceOneImage" >
                                                  <template if:false={serv.serviceStaffImage}>
                                                    <lightning-icon 
                                                    icon-name="standard:user" 
                                                    alternative-text="user" 
                                                    size="small" 
                                                    title="user"
                                                    class="default-iconSinglecell">
                                                </lightning-icon>
                                                  </template>
                                                  <template if:true={serv.serviceStaffImage}>
                                                      <lightning-avatar variant="circle" src={serv.serviceStaffImage} initials="P" fallback-icon-name="standard:person_account"></lightning-avatar>
                                                  </template>
                                              </div>
                                              <div class="serviceText">
                                                  <span class="staff-name"><b>{serv.serviceStaffName}</b></span>
                                                  <span class="shift-time"><a href="javascript:void(0)" onclick={handleEditShiftScreen} data-participantid={participantdata.participantId} data-shiftstaffid={serv.shiftWithStaffId}>
                                                    {serv.ShiftTime}
                                                  </a></span>
                                              </div>
                                          </div>
                                      </template>
                                  </template>
                              </template>
                              
                                 <!-- day with more than one services -->
                                 <template if:false={dayShift.isSizeZeroFlag}>
                                  <template if:true={dayShift.moreThanOneflag}>
                                      <div class="shift-container">
                                          <template for:each={dayShift.services} for:item="serv">
                                              <div key={serv.Id}>
                              
                                                  <!-- First Record (Top) -->
                                                  <template if:true={serv.isFirstRecordType}>
                                                      <div class="top-record">
                                                          <span ><!-- class="serviceOneImage" -->
                                                              <template if:false={serv.serviceStaffImage}>
                                                                  <lightning-icon icon-name="standard:user" alternative-text="user" size="small"
                                                                      title="user"  class="toprecordIcon" >
                                                                  </lightning-icon>
                                                              </template>
                                                              <template if:true={serv.serviceStaffImage}>
                                                                <lightning-avatar variant="circle" src={serv.serviceStaffImage} initials="P"
                                                                fallback-icon-name="standard:person_account" data-id={serv.Id} class="toprecordAvatar">
                                                               </lightning-avatar>
                                                                  
                                                              </template>
                                                          </span>
                                                          <div class="service-details">
                                                              <span class="staff-name"><b>{serv.serviceStaffName}</b></span>
                                                              <span class="shift-time">
                                                                      <a href="javascript:void(0)" onclick={handleEditShiftScreen}
                                                                          data-participantid={participantdata.participantId}
                                                                          data-shiftstaffid={serv.shiftWithStaffId}>
                                                                          {serv.ShiftTime}
                                                                      </a></span>
                                                          </div>
                                                      </div>
                                                  </template>
                              
                                                  <template if:false={serv.isFirstRecordType}>
                                                    <div class="overlapping-container">
                                                      <template if:true={serv.isSecondRecord}>
                                                          <span class="overlapping-participant">
                                                              <template if:false={serv.serviceStaffImage}>
                                                                  <lightning-icon icon-name="standard:user" alternative-text="user" size="small"
                                                                      class="default-icon1" data-id={serv.Id} data-shifttime={serv.ShiftTime}
                                                                      data-staffname={serv.serviceStaffName} data-servicestaffimage={serv.serviceStaffImage}
                                                                      data-participantid={participantdata.participantId}
                                                                      data-shiftstaffid={serv.shiftWithStaffId} onclick={showTooltip}>
                                                                  </lightning-icon>
                                                              </template>
                                                              <template if:true={serv.serviceStaffImage}>
                                                                  <lightning-avatar variant="circle" src={serv.serviceStaffImage} initials="P"
                                                                      fallback-icon-name="standard:person_account" data-id={serv.Id}
                                                                      data-shifttime={serv.ShiftTime} data-staffname={serv.serviceStaffName}
                                                                      data-servicestaffimage={serv.serviceStaffImage}
                                                                      data-participantid={participantdata.participantId}
                                                                      data-shiftstaffid={serv.shiftWithStaffId} onclick={showTooltip} class="secondAvatar">
                                                                  </lightning-avatar>
                                                              </template>
                                                          </span>
                                                      </template>
                              
                                                      <template if:true={serv.isThirdRecord}>
                                                          <span class="overlapping-participant1">
                                                              <template if:false={serv.serviceStaffImage}>
                                                                  <lightning-icon icon-name="standard:user" alternative-text="user" size="small"
                                                                      class="default-icon2" data-id={serv.Id} data-shifttime={serv.ShiftTime}
                                                                      data-staffname={serv.serviceStaffName} data-servicestaffimage={serv.serviceStaffImage}
                                                                      data-participantid={participantdata.participantId}
                                                                      data-shiftstaffid={serv.shiftWithStaffId} onclick={showTooltip}>
                                                                  </lightning-icon>
                                                              </template>
                                                              <template if:true={serv.serviceStaffImage}>
                                                                  <lightning-avatar variant="circle" src={serv.serviceStaffImage} initials="P"
                                                                      fallback-icon-name="standard:person_account" data-id={serv.Id}
                                                                      data-shifttime={serv.ShiftTime} data-staffname={serv.serviceStaffName}
                                                                      data-servicestaffimage={serv.serviceStaffImage}
                                                                      data-participantid={participantdata.participantId}
                                                                      data-shiftstaffid={serv.shiftWithStaffId} onclick={showTooltip} class="thirdAvatar">
                                                                  </lightning-avatar>
                                                              </template>
                                                          </span>
                                                      </template>

                                                       <!-- Fourth Record (More) -->
                                                      <template if:true={serv.isFourthRecord}>
                                                        <span class="more-shifts" onclick={handleShowMoreModal} title="View More Shifts"
                                                            data-participantid={participantdata.participantId} data-weekdate={dayShift.Shiftdate}>
                                                            <u>more</u>
                                                        </span>
                                                    </template>
                                                  </div>
                                                  </template>
                                                  <!-- Overlapping Section -->
                                                
                              
                                                 
                              
                                              </div>
                                          </template>
                                      </div>
                                  </template>
                              </template>
                              
                              
                                
                            </td>
                        </template>
                    </tr>
                  </template>
                </tbody>
                </table>
            </div>
        </div>
    </template>
    <template if:true={isTooltip}>
      <div class="tooltip" style={shiftTooltipInformation.position} onclick={stopPropagation}>
          <span class="close-icon" onclick={closeTooltip}>✖</span>
  
          <div class="top-recordToopTip">
              <!-- Left Side: Image or Icon -->
              <template if:false={shiftTooltipInformation.servicestaffimage}>
                  <lightning-icon 
                      icon-name="standard:user" 
                      alternative-text="user" 
                      size="small" 
                      title="user"
                      class="toolTipIcon"
                      data-id={shiftTooltipInformation.serviceid} 
                      data-shifttime={shiftTooltipInformation.shiftTime}  
                      data-staffname={shiftTooltipInformation.staffname}  
                      data-servicestaffimage={shiftTooltipInformation.serviceStaffImage}
                      data-participantid={shiftTooltipInformation.participantid} 
                      data-shiftstaffid={shiftTooltipInformation.shiftstaffid} 
                      onclick={showTooltip}>
                  </lightning-icon>
              </template>
  
              <template if:true={shiftTooltipInformation.servicestaffimage}>
                  <lightning-avatar 
                      variant="circle" 
                      src={shiftTooltipInformation.servicestaffimage} 
                      initials="P" 
                      fallback-icon-name="standard:person_account"
                      data-id={shiftTooltipInformation.serviceid} 
                      data-shifttime={shiftTooltipInformation.shiftTime}  
                      data-staffname={shiftTooltipInformation.staffname}  
                      data-servicestaffimage={shiftTooltipInformation.serviceStaffImage}
                      data-participantid={shiftTooltipInformation.participantid} 
                      data-shiftstaffid={shiftTooltipInformation.shiftstaffid} 
                      onclick={showTooltip} 
                      class="toolTipAvatar">
                  </lightning-avatar>
              </template>
  
              <!-- Right Side: Name & Shift Time -->
              <div class="service-detailstooltip">
                  <span ><b>{shiftTooltipInformation.staffname}</b></span>
                  <span >
                      
                          <a href="javascript:void(0)" onclick={handleEditShiftScreen} 
                             data-participantid={shiftTooltipInformation.participantid} 
                             data-shiftstaffid={shiftTooltipInformation.shiftstaffid}>
                              {shiftTooltipInformation.shiftTime}
                          </a>
                    
                  </span>
              </div>
          </div>
      </div>
  </template>
  
    <template if:true={isModalOpen}>
      <div class="modal-overlay" onclick={handleCloseModal}></div>
      <div class="custom-modal" style={modalStyle}>
          <div class="modal-headerToooltip">
              <h2>SERVICE DETAILS</h2>
              <div class="close-btn" onclick={handleCloseModal}>&times;</div>
          </div>
          <div class="modal-body">
              <template if:true={moreShiftlist.length} >
                  <template for:each={moreShiftlist} for:item="shift">
                      <div key={shift.Id}  ><!-- class="shift-card" style={shift.ShiftwithStaff__r.Shiftcolor__c} -->
                          <div class="shift-info">
                              <p class="staff-name"><b> {shift.Resource_Name__c}</b> </p>
                              <p class="shift-time">{shift.Start_Time_Formula__c}-{shift.End_Time_Formula__c}</p>
                          </div>
                      </div>
                  </template>
              </template>
              <template if:false={moreShiftlist.length}>
                  <p class="no-shift">No shift details to display.</p>
              </template>
          </div>
      </div>
    </template>


    <template if:true={openParticipantshiftView}>
      <div class="blur-overlay">
        <div class="right-align fade-in" style="background:#f0f8ff; width:70%;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <p style="font-weight: bold; padding: 1% 0% 2% 1%;font-size:140%">{headingLabel}</p>
             <div style="display: flex; align-items: center; gap: 10px;margin-right:1.5%;">
            
              <template if:true={isCreateShiftButton}>
                <div >
                  <lightning-button label="Create Shift" title="Create Shift"  onclick={handleAddShiftSave} disabled={isDisableSaveButton} variant="brand"></lightning-button>
      
                </div>
              </template>
              <template if:false={isCreateShiftButton}>
                <div>
                  <lightning-button label="Update Shift" title="Update Shift"   onclick={handleUpdateShift} disabled={isDisableSaveButton} variant="brand"></lightning-button>
      
                </div>
              </template>
                <lightning-button  variant="brand"  label="Back" title="Back"  onclick={handleCloseCalenderParticipantView}> </lightning-button>
             </div>
          </div>
  
          <div class="slds-grid slds-gutters slds-wrap slds-p-horizontal_small slds-p-bottom_small">
             <!--  First Column  -->
            <div class="slds-col slds-large-size_6-of-12 slds-medium-size_6-of-12 slds-small-size_12-of-12">
                <div class="slds-box slds-theme_default slds-m-bottom_small"> <!-- box one starts -->
                  <div class="container-box">
                            <div class="toggle-bar">
                                <span >Shift Details</span>
                            </div>
                        <div class="slds-grid slds-wrap" style="padding-top: 1%;">
                            <div class="slds-size_1-of-2 slds-p-around_small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Date</span>
                                    <lightning-input type="date" class="AddShiftStartDate" name="AddShiftStartDate" variant="label-hidden" value={addShiftData.AddShiftStartDate}  onchange={handleAddShiftChange} disabled={disablePostInsertButtons}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-size_1-of-2 slds-p-around_small">
                              <div class="floating-label-new">
                                  <span class="label-text-drop">Quantity</span>
                                  <lightning-input type="number"  name="AddShiftQuantity" variant="label-hidden"  value={addShiftData.AddShiftQuantity} onchange={handleAddShiftChange} disabled="true" ></lightning-input>
                              </div>
                          </div>
                            <div class="slds-size_1-of-2 slds-p-around_small">
                              <div class="floating-label-new">
                                  <span class="label-text-drop">Staff</span>
                                  <lightning-combobox name="AddShiftStaffValue" class="AddShiftStaffValue" variant="label-hidden" options={staffComboBoxOptions} value={addShiftData.AddShiftStaffValue} onchange={handleAddShiftChange}  
                                    ></lightning-combobox>
                              </div>
                           </div>
                            <div class="slds-size_1-of-2 slds-p-around_small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Facilty</span>
                                    <lightning-combobox  name="AddShiftFacilityValue" class="AddShiftFacilityValue" variant="label-hidden" options={facilityOptions} value={addShiftData.AddShiftFacilityValue} onchange={handleAddShiftChange}  disabled={disablePostInsertButtons}
                                    ></lightning-combobox>
                                </div>
                            </div>
                            <div class="slds-size_1-of-2 slds-p-around_small">
                              <div class="floating-label-new">
                                  <span class="label-text-drop">Role</span>
                                  <lightning-combobox  name="AddShiftRole" class="AddShiftRole" variant="label-hidden" options={roleOptions} value={addShiftData.AddShiftRole} onchange={handleAddShiftChange}  
                                  ></lightning-combobox>
                              </div>
                          </div> 
                          <div class="slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Shift Type</span>
                                <lightning-combobox name="AddShiftType" class="AddShiftType" variant="label-hidden" options={shiftTypeOptions} value={addShiftData.AddShiftType} onchange={handleAddShiftChange}  disabled={disablePostInsertButtons}
                                ></lightning-combobox>
                            </div>
                        </div> 
                       
                       <div class="slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Start Time</span>
                                <c-time-picker data-timetype="AddShiftStartTime" selected-hour={startTimeSelectedHour} selected-minute={startTimeSelectedMinute} data-ampm="AddShiftStartTimeAMPM"  displayed-time={addShiftData.AddShiftStartTimeAMPM} is-am={startTimeAMPM} disable-time-button={disableTimeButton} onsavetimefromchild={handleAddShiftTimeData} ></c-time-picker>
                        </div>
                     </div>
                     <div class="slds-size_1-of-2 slds-p-around_small">
                      <div class="floating-label-new">
                          <span class="label-text-drop">End Time</span>
                                <c-time-picker data-timetype="AddShiftEndTime" data-ampm="AddShiftEndTimeAMPM"  selected-hour={endTimeSelectedHour}   selected-minute={endTimeSelectedMinute}   displayed-time={addShiftData.AddShiftEndTimeAMPM} is-am={endTimeAMPM} disable-time-button={disableTimeButton} onsavetimefromchild={handleAddShiftTimeData} ></c-time-picker>
                      </div>
                   </div>
                   <div class="slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Break(mins)</span>
                        <lightning-input type="number" name="AddShiftBreak" variant="label-hidden" value={addShiftData.AddShiftBreak} onchange={handleAddShiftChange}  disabled="true"></lightning-input>
                    </div>
                 </div>
                 <div class="slds-size_1-of-2 slds-p-around_small">
                  <div class="floating-label-new">
                     <!--  <span class="label-text-drop">Hourly Rate</span> -->
                     <span class="label-text-drop">{hourlrRateLabel}</span>
                      <lightning-input type="number" name="AddShiftStaffHourlyRate" variant="label-hidden" value={addShiftData.AddShiftStaffHourlyRate} onchange={handleAddShiftChange} disabled={hourlyrateDisable}></lightning-input>
                  </div>
               </div>
                   
                       <div class="slds-size_1-of-3 slds-p-around_small">
                        <div class="slds-grid slds-wrap">
                          <div class="slds-size_1-of-2">
                            <span >Notifications</span>
                          </div>
                          <div class="slds-size_1-of-2">
                              <lightning-input type="checkbox" variant="label-hidden" name="AddShiftnotification" checked={addShiftData.AddShiftnotification} disabled={disablePostInsertButtons} style="padding-left: 25%;" ></lightning-input>
                            </div> 
                        </div>
                       </div>
                      <div class="slds-size_1-of-3 slds-p-around_small">
                        <div class="slds-grid slds-wrap">
                          <div class="slds-size_1-of-2">
                            <span >Recurring</span>
                          </div>
                          <div class="slds-size_1-of-2">
                            <lightning-input type="checkbox" name="recurCheckBox"  variant="label-hidden"  checked={AddShiftRecurringCheckboxValue} onchange={handleRecurEveryChange}></lightning-input>
                          </div>
                        </div>
                      </div>
                       <template if:true={recurTemplate}> 
                            <template if:true={isIncludeParticipants}>
                              <div class="slds-size_1-of-3 slds-p-around_small">
                                <div class="slds-grid slds-wrap">
                                  <div class="slds-size_1-of-2">
                                    <span >Include Participants</span>
                                  </div>
                                  <div class="slds-size_1-of-4">
                                    <lightning-input type="checkbox" name="includeParticipants" variant="label-hidden"  value={AddShiftIncludePartcipants} onchange={handleRecurEveryChange}></lightning-input>
                                  </div>
                                </div>
                              </div>
                            </template>
                            <div class="slds-grid slds-wrap">
                              <div class="slds-size_1-of-4 slds-p-around_small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Recur</span>
                                    <lightning-combobox name="typeOfRecurOption"  class="typeOfRecurOption" variant="label-hidden" options={recurOptions}  value={RecurValue} onchange={handleRecurChange} 
                                    ></lightning-combobox>
                                </div>
                              </div>
                            <div class="slds-size_1-of-4 slds-p-around_small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Recur Every</span>
                                  <!--  <lightning-combobox name="recurEvery" variant="label-hidden" value={recurEveryValue} placeholder="Select Recurrence" options={recurEveryOptions}
                                      onchange={handleRecurEveryChange} ></lightning-combobox> -->
                                    <lightning-combobox placeholder="Select Recurrence" class="recurEvery" name="recurEvery" variant="label-hidden" options={recurEveryOptions}  value={recurEveryValue} onchange={handleRecurEveryChange} 
                                    ></lightning-combobox>
                                </div>
                            </div>
                            <div class="slds-p-around_small">
                              {RecurLabel}
                            </div>
                            <div class="slds-size_1-of-3 slds-p-around_small">
                              <div class="floating-label-new">
                                  <span class="label-text-drop">End Date</span>
                                  <lightning-input type="date"  name="recurEndDate" class="recurEndDate" value={recurEndDate} variant="label-hidden" onchange={handleRecurEveryChange}></lightning-input>
                              </div>
                            </div>
                            </div>
                          <template if:true={isRecurmontlyFlag} >
                          
                              <div class="slds-size_1-of-4 slds-p-around_small">
                                <p class="slds-p-left_small" > set for Day </p>
                              </div>
                              <div class="slds-size_1-of-4 slds-p-around_small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Recur Every</span>
                                    <lightning-combobox name="monthLyOptions" class="monthLyOptions" variant="label-hidden" options={monthLyOptions} value={monthOfDay}
                                    onchange={handleRecurEveryChange} ></lightning-combobox>
                                </div>
                              </div>
                              
                              <div class="slds-size_1-of-2 slds-p-around_small">
                                
                              </div>
                                                      
                            
                          </template>
                      </template> 
                      
                      
                    </div>
                    <template if:true={isRecurWeekFlag}>
                          <div class ="slds-p-left_small">
                            set for <br>
                          </div>
                        <div class="slds-grid slds-wrap">
                          <template for:each={weekDays} for:item="day">
                              <div key={day} class="slds-size_1-of-7 slds-p-around_small">
                                  <span>{day}</span>
                                  <lightning-input 
                                      type="checkbox" 
                                      name={day} 
                                      variant="label-hidden" 
                                      class="slds-p-left_small"
                                      onchange={handleCheckboxChange}>
                                  </lightning-input>
                              </div>
                          </template>
                      </div>
                    </template>
                    <template if:true={recurTemplate}> 
                      <div style="margin-top:3%">
                        <p style="margin-left: 2.3%;"> Repeats {RecurValue}, ending on {addShiftData.startDate}, with  {recurOccurencesValue} occurrences</p>
                      </div>
                  </template>
                  
                  
                  </div>
                  
                </div>
                <div class="slds-box slds-theme_default slds-m-bottom_small"><!-- box 2 starts -->
                  <div class="container-box">
                    <div class="toggle-bar">
                      <span>Checklist</span>
                    </div>
                    <!-- Row for description and "New" icon -->
                    <div class="slds-grid slds-wrap" style="padding-top: 1%;">
                      <!-- Description Input -->
                      <div class="slds-size_9-of-12 slds-p-around_small order-1">
                        <div class="floating-label-new">
                          <span class="label-text-drop">Description</span>
                          <lightning-input 
                            type="text"

                        <lightning-button label="No" variant="brand" onclick={handleDeselectStaff} class="slds-m-around_small"></lightning-button>
                       
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
