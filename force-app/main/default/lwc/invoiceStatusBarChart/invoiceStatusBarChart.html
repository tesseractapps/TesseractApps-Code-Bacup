<template>
    <div class="container-box">
            <div style="background-color:white; border-radius: 5%; margin-left: 0; padding-left:4%">
                <h3 slot="title">
                    <!-- <span style="font-size: 100%;font-weight:bold;">Invoice</span> -->
                    <a href="#" data-name="Invoice" onclick={grandchildevent} style="font-size: 100%;font-weight:bold;color:black">Invoice</a>
                </h3>
            </br>
            <div class="progress-container">
                <!-- Invoices Progress -->
                <div class="progress-item">
                    <span class="progress-label">Issued</span>
                    <div class="lightning-progress-bar circular-progress-bar tooltip-container"
                        role="progressbar"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        aria-valuenow={issuedInvoiceCount}
                        data-number={issuedInvoiceCount}
                        onmouseover={ontooltip}
                        onmouseleave={hidetooltip}
                        title={mouse}>

                        <span class="slds-progress-bar__value" style={invoicesStyle}></span>
                    </div>
                </div>

                <!-- Collected Progress -->
                <div class="progress-item">
                    <span class="progress-label">Received</span>
                    <div class="lightning-progress-bar circular-progress-bar tooltip-container"
                        role="progressbar"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        aria-valuenow={receivedInvoiceCount}
                        data-number={receivedInvoiceCount}
                        onmouseover={ontooltip}
                        onmouseleave={hidetooltip}
                        title={mouse}>

                        <span class="slds-progress-bar__value" style={collectedStyle}></span>
                    </div>
                </div>

                <!-- Pending Progress -->
                <div class="progress-item">
                    <span class="progress-label">Draft</span>
                    <div class="lightning-progress-bar circular-progress-bar tooltip-container"
                        role="progressbar"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        aria-valuenow={draftInvoiceCount}
                        data-number={draftInvoiceCount}
                        onmouseover={ontooltip}
                        onmouseleave={hidetooltip}
                        title={mouse}>

                        <span class="slds-progress-bar__value" style={pendingStyle}></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
