<template>
    <template if:true={isHome}>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <p style="font-weight: bold; padding: 1% 0 0 1%; font-size: 140%; "> Reports - {companyname}</p>
        </div>
    <div class="dashboard-wrapper">
        
            <div class="dashboard-grid">
                <template for:each={reportOptions} for:item="item">
                    <div key={item.name} class={item.class} data-name={item.name} onclick={handleCardClick}>
                        <div class="card-content">
                            <span class="card-label">{item.label}</span>
                            <img src={item.iconUrl} alt={item.label} class="card-icon" />
                        </div>
                    </div>
                </template>
            </div>

    </div>
    </template>
      <!-- LWC conditional rendering -->
      <template if:true={showProfitLoss}>
        <c-tesseract-apps-profitandloss-lwc orgid={orgid}  companyid={companyId} companyname ={companyname} onmyevent={handleChildEvent}></c-tesseract-apps-profitandloss-lwc>  
    </template>
    <template if:true={showSuperannuation}>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <!-- Left side: Staff Details -->
            <p style="font-weight: bold; padding: 1% 0% 1% 1%;font-size:140% "> Superannuation - {companyname}</p> 
            <lightning-button label="Back" variant="brand" onclick={handleBack} style=" margin-top:1%;margin-bottom:1%; margin-right:1%; "></lightning-button> 
        </div>
        <div style="padding: 1%;">
            <c-hr-community></c-hr-community>
        </div>
    </template>
    <template if:true={showBalanceSheet}>
        <c-tesseract-apps-balancesheet-lwc orgid={orgid}  companyid={companyId} companyname ={companyname} onmyevent={handleChildEvent}></c-tesseract-apps-balancesheet-lwc>
    </template>
    <template if:true={showReconciliation}>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <!-- Left side: Staff Details -->
            <p style="font-weight: bold; padding: 1% 0% 1% 1%;font-size:140% "> Reconciliation - {companyname}</p>
            <lightning-button label="Back" variant="brand" onclick={handleBack} style=" margin-top:1%;margin-bottom:1%; margin-right:1%; "></lightning-button>  
        </div>
        <div style="padding: 1%;">
            <c-hr-community></c-hr-community>
        </div>
    </template>
    <template if:true={showClientAccounts}>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <!-- Left side: Staff Details -->
            <p style="font-weight: bold; padding: 1% 0% 1% 1%;font-size:140% "> Client Accounts - {companyname}</p> 
            <lightning-button label="Back" variant="brand" onclick={handleBack} style=" margin-top:1%;margin-bottom:1%; margin-right:1%; "></lightning-button> 
        </div>
        <div style="padding: 1%;">
            <c-hr-community></c-hr-community>
        </div>
        
    </template>
    <template if:true={showActivityStatement}>
        <c-activity-statement-lwc companyid={companyId} companyname ={companyname} onmyevent={handleChildEvent}></c-activity-statement-lwc>
    </template>
    <template if:true={showWages}>
        <c-tesseract-apps-payroll-reporting-lwc companyid={companyId} companyname ={companyname} onmyevent={handleChildEvent}></c-tesseract-apps-payroll-reporting-lwc>
    </template>
    <template if:true={showDepartmentAccounts}>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <!-- Left side: Staff Details -->
            <p style="font-weight: bold; padding: 1% 0% 1% 1%;font-size:140% "> Departmental Accounts - {companyname}</p> 
            <lightning-button label="Back" variant="brand" onclick={handleBack} style=" margin-top:1%;margin-bottom:1%; margin-right:1%; "></lightning-button> 
        </div>
        <div style="padding: 1%;">
            <c-hr-community></c-hr-community>
        </div>
         <!-- <c-tesseract-apps-accounting-r-m-invoice orgid={orgid}></c-tesseract-apps-accounting-r-m-invoice> -->
    </template>
</template>
