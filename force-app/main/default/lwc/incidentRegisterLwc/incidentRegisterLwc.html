<!-- sldsValidatorIgnore -->
<template>   
    <div class="main-container">
            
            <template if:true={issueparent}>
                <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center" style="gap: 10px;margin-left:1%;padding-top:1%;padding-right:1.2%;"> 
                    <button class="custom-create-btn" onclick={handleCreateIssue} title="New Incident">
                        New Incident
                    </button>
                </div>
            </template>
        <!-- </div> -->
        
       <div if:true={issueparent}>
            <div> 
                <div > 
                    <div if:true={isDesktop}>
                        <div class="slds-grid slds-wrap slds-align_absolute-center slds-p-around_medium slds-p-horizontal_none">
                            <!-- Fields Section -->
                            <div class="slds-grid slds-wrap slds-gutters slds-grid_align-spread slds-p-around_medium">
                                <!-- Column 1: Incident Number -->
                                <div class="slds-col slds-size_1-of-5">
                                    <div class="floating-label">
                                        <span class="label-text-drop">Incident Number</span>
                                        <lightning-input type="search" variant="label-hidden" name="searchID" value={searchID} onchange={handleSearch} style="width: 100%;"></lightning-input>
                                    </div>
                                </div>
                        
                                <!-- Column 2: Participant Name -->
                                <div class="slds-col slds-size_1-of-5">
                                    <div class="floating-label">
                                        <span class="label-text-drop">Participant Name</span>
                                        <lightning-input type="search" variant="label-hidden" name="clientName" value={clientName} onchange={handleSearch} style="width: 100%;"></lightning-input>
                                    </div>
                                </div>
                        
                                <!-- Column 3: Facility Name -->
                                <div class="slds-col slds-size_1-of-5">
                                    <div class="floating-label">
                                        <span class="label-text-drop">Facility Name</span>
                                        <lightning-input type="search" variant="label-hidden" name="facilityName" value={facilityName} onchange={handleSearch} style="width: 100%;"></lightning-input>
                                    </div>
                                </div>
                        
                                <!-- Column 4: Status -->
                                <div class="slds-col slds-size_1-of-5">
                                    <div class="floating-label">
                                        <span class="label-text-drop">Status</span>
                                        <lightning-input type="search" variant="label-hidden" name="status" value={value} onchange={handleSearch} style="width: 100%;"></lightning-input><!--onchange={handleChange}-->
                                    </div>
                                </div>
                        
                                <!-- Column 5: Priority -->
                                <div class="slds-col slds-size_1-of-5">
                                    <div class="floating-label">
                                        <span class="label-text-drop">Priority</span>
                                        <lightning-input type="search" variant="label-hidden" name="priority" value={valuePriority} onchange={handleSearch} style="width: 100%;"></lightning-input><!--onchange={handleChange1}-->
                                    </div>
                                </div>
                            </div>
                        
                            <!-- Button Section -->
                            <div class="slds-grid slds-grid_align-end slds-gutters slds-p-horizontal_medium">
                                <!-- Search Button -->
                                <div class="slds-col">
                                    <lightning-button variant="brand" label="Search" title="Search Issue" onclick={handleSearch}></lightning-button>
                                </div>
                        
                                <!-- Clear Button -->
                                <div class="slds-col">
                                    <lightning-button variant="brand" label="Clear" title="Clear Issue" onclick={handleClear}></lightning-button>
                                </div>
                                <div class="slds-col"> <!-- class="slds-grid slds-grid_align-end slds-grid_vertical-align-center" style="gap: 10px;margin-left:1%;padding-top:1%;padding-right:1.2%;"-->
                        
                                    <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={getissues}>
                                        <svg class="slds-button__icon" aria-hidden="true">
                                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                                        </svg>
                                    </button>
                                    
                                </div>
                        
                                <!-- Export CSV Button -->
                                <!-- <div class="slds-col">
                                    <lightning-button variant="brand" label="Export CSV" title="Export CSV" onclick={generateCsv}></lightning-button>
                                </div> -->
                            </div>
                        </div>
                        
                        
                        
                            <!-- <lightning-input  class="slds-size_1-of-7 slds-m-around_small" type="search" label="Submitted By" name="submittedBy" value={submittedBy}></lightning-input><br/> -->
                            <div class="slds-grid slds-grow slds-gutters slds-wrap"> 
                            
                            </div> 
                    </div>
                
                
                    <!--  <div class="slds-float_right">
                    </div>  -->
                    <div> 
                        <div if:true={isDesktop}>
                            <template if:true={rec}> 
                                <div class="listview custom-scroll">
                                <table class="slds-table" style="table-layout: fixed;">
                                    <thead>
                                        <tr>
                                            <th class="slds-cell-wrap th">Incident Number</th>
                                            <th class="slds-cell-wrap th">Participant Name</th>
                                            <th class="slds-cell-wrap th">Facility Name</th>
                                            <th class="slds-cell-wrap th">Reporter Name</th>
                                            <th class="slds-cell-wrap th">Priority</th>
                                            <th class="slds-cell-wrap th">Assigned to</th>
                                            <th class="slds-cell-wrap th">Created on</th>
                                            <th class="slds-cell-wrap th">Status</th>
                                            <th class="slds-cell-wrap th">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template if:true={availableIssues}>
                                            <template for:each={availableIssues} for:item="issue">
                                                <tr key={issue.Id} class="tr1">
                                                    <!-- <td class="slds-cell-wrap">{issue.CaseNumber}</td> -->
                                                    <td class="slds-cell-wrap">
                                                        <a href="javascript:void(0);" data-id={issue.Id} onclick={handleShowHistory} style="color: #0070d2; text-decoration: underline;">
                                                            {issue.CaseNumber}
                                                        </a>
                                                    </td>
                                                    
                                                    <td class="slds-cell-wrap">{issue.Client_Name__c}</td>
                                                    <td class="slds-cell-wrap">{issue.Facility_Name__c}</td>
                                                    <td class="slds-cell-wrap">{issue.reporterName}</td>
                                                    <td class="slds-cell-wrap">{issue.Priority}</td>
                                                    <td class="slds-cell-wrap">{issue.assignTo}</td>
                                                    <td class="slds-cell-wrap">{issue.date}</td>
                                                    <td class="slds-cell-wrap">{issue.Status_1__c}</td>
                                                    <td>
                                                        <div>
                                                            <!-- <template if:true={isStaff}> -->
                                                                <template if:false={issue.isResolved}>
                                                                    <!-- <a  data-id={issue.Id} onclick={handleedit} style="margin-right:5px;"><lightning-icon icon-name="action:edit" size="xx-small" title="Certificate" style="cursor:pointer;color:white;background:#0099DE;"></lightning-icon></a> -->
                                                                    <a href="javascript:void(0);"
                                                                        data-id={issue.Id}
                                                                        onclick={handleedit}
                                                                        style="margin-right: 5px;">
                                                                            <i class="material-icons edit-icon" data-id={issue.Id}>edit_document</i>
                                                                        </a>

                                                                </template>      
                                                        <!--   </template> -->
                                                            <template if:true={issue.isResolved}>
                                                                <a  data-id={issue.Id} data-status={issue.Status_1__c} onclick={handlepdf} ><i class="material-icons edit-icon" data-id={issue.Id} title='download'>download_for_offline</i><!-- <img src={pdficon} width="35px" height="35px"> --><!-- <lightning-icon icon-name="action:download" size="xx-small" title="generate pdf"></lightning-icon> --></a>
                                                            </template>
                                                            <template if:true={issue.isResolved}>
                                                            <a data-id={issue.Id} onclick={handleCsvExport}>
                                                                <!-- <lightning-icon icon-name="utility:download" size="xx-small" title="Export CSV" style="cursor:pointer;color:green;margin-left:5px;"></lightning-icon> -->
                                                               <!--  <lightning-icon icon-name='doctype:csv' alternative-text='csv' size='small' title='csv'></lightning-icon> -->
                                                                 <i class="material-icons edit-icon" title='csv'>csv</i>
                                                            </a>
                                                        </template>
                                                        </div>                                            
                                                    </td>
                                                </tr>
                                            </template>
                                        </template>
                                    </tbody>
                                </table>
            </div>
                            </template> 
                            <template if:false={rec}>
                                <p style="font-weight:bold;color: #4CAF50;">No Data found</p>
                            </template>
                            <template if:true={error}>  
                                {error}                 
                            </template> 
                        </div>  
                    </div>  
                </div>

                <template if:true={showFormHistoryModal}>
                    <div class="incident-history-backdrop">
                        <div class="incident-history-modal">
                            <div class="incident-history-header">
                                <h2>Incident Edit History</h2>
                                <button class="incident-history-close" onclick={closeFormHistory}>×</button>
                            </div>
                            <div class="history-timeline custom-scroll">
                                <template for:each={groupedFormHistory} for:item="group">
                                    <div key={group.date} class="history-date-section">
                                        <div class="history-date-label">{group.date}</div>
                                        <template for:each={group.entries} for:item="entry">
                                            <div key={entry.timestamp} class="history-entry">
                                                <div class="entry-time">{entry.time}</div>
                                                <div class="entry-content">
                                                    <div class="entry-header">
                                                        <div class="avatar-circle">{entry.initials}</div>
                                                        <div class="entry-meta">
                                                            <span class="entry-user">{entry.user}</span>
                                                            <span class="entry-action">{entry.action}</span>
                                                        </div>
                                                    </div>
                                                    <div class="entry-body">{entry.changes}</div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template if:false={hasFormHistory}>
                                    <div class="no-history-message">No edit history available.</div>
                                </template>
                            </div>
                            <!-- <div class="incident-history-footer">
                                <lightning-button label="Close" onclick={closeFormHistory} variant="brand-outline"></lightning-button>
                            </div> -->
                        </div>
                    </div>
                </template>
                
                <template if:true={totalRecords}> 
                    <div if:true={isDesktop}>
                        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination" style="padding-top: 0.5em;">
                    
                            <!--PAGE NAVIGATION-->
                            <div class="slds-align_absolute-center" style="height:5rem">
                                <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                                <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                                &nbsp;
                                <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                                &nbsp;
                                <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                            </div>
                
                            <!--TOTAL RECORDS-->
                            <div class="slds-clearfix">
                                <div class="slds-float_right ">
                                    <span class="slds-badge"> Total Records: {totalRecords}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            <!-- if there is no facilities -->
            <template if:true={noRecordsFlag}>
                    <div class="slds-grid  slds-grid_align-spread slds-m-left_large" style="padding-top: 0.5em; font-size:15px;">
                        <b style="color: Red"><I> No Issues Registed </I> </b>
                    </div>
                </template>
            </div>
       </div>
        <!-- <div class="slds-m-top_x-large">
            <c-footer-lwc></c-footer-lwc>
        </div> -->
    
        <template if:true={isOpenModal}>
        <div class="form-section" style="margin-top:2%;margin-left:1.5%;margin-right:1.5%">
            <!-- Lightning Progress Indicator -->
            <lightning-progress-indicator current-step={currentStep} type="path">
                <lightning-progress-step label="Reporter Details" value="step1"></lightning-progress-step> <!-- onclick={handleStepClick}-->
                <lightning-progress-step label="Incident Details" value="step2"></lightning-progress-step> <!-- onclick={handleStepClick}-->
                <lightning-progress-step label="Action Taken" value="step3"></lightning-progress-step> <!-- onclick={handleStepClick}-->
                <lightning-progress-step label="Review and Submit" value="step4"></lightning-progress-step> <!-- onclick={handleStepClick}-->
            </lightning-progress-indicator>
        </div>

        <!-- Conditional Rendering of Components based on currentStep -->
        <div class="right-content custom-scroll">
        <template if:true={isStep1}>
            
                
                <lightning-messages></lightning-messages>
                            
                        <div class="slds-grid slds-wrap slds-gutters slds-p-horizontal_medium" style="padding: 20px 0px 20px 0px;">
                            <div class="slds-size_1-of-2" style="padding: 20px;">
                                
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>First Name</span>
                                    <lightning-input variant="label-hidden" value={userFName} onchange={handleFirstNameChange} required="true" disabled="true"></lightning-input>
                                
                                </div>
                            </div>
                            <div class="slds-size_1-of-2" style="padding: 20px;">
                                
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Last Name</span>
                                    <lightning-input variant="label-hidden" value={userLName} onchange={handleLastNameChange} required="true" disabled="true"></lightning-input>
                                
                                </div>
                            </div>
                            <div class="slds-size_1-of-2" style="padding: 20px;">
                                
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Participant</span>
                                    <lightning-combobox variant="label-hidden" value={client}  placeholder="Select Participant" options={clientOption}
                                    onchange={handleClientChange} required="true"></lightning-combobox>
                                
                                </div>
                            </div>
                            <div class="slds-size_1-of-2" style="padding: 20px;">
                                
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Facility</span>
                                    <lightning-combobox name="facility" variant="label-hidden" value={facilityName} placeholder="Select the Facility" options={facilityOptions} 
                                    onchange={handleFacilityChange} required="true"></lightning-combobox>                               
                                
                                </div>
                            </div>                
                            <div class="slds-size_1-of-2" style="padding: 20px;">
                                
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Email ID</span>
                                    <lightning-input variant="label-hidden" value={email} onchange={handleEmailChange} required="true"></lightning-input>
                                
                                </div>
                            </div>
                            <div class="slds-size_1-of-2" style="padding: 20px;">
                                
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Contact Number</span>
                                    <lightning-input variant="label-hidden" value={phone} onchange={handlePhoneChange} required="true"></lightning-input>
                                
                                </div>
                            </div>
                            <div class="slds-size_1-of-2" style="padding: 20px;">
                                
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Role</span>
                                    <lightning-combobox variant="label-hidden" value={role}  placeholder="Select Role" options={OrgNisationRoles}
                                    onchange={handleChangeRole} required="true" disabled="true"></lightning-combobox>
                                
                                </div>
                            </div>                        
                            <template if:true={isStaff}>
                                <div class="slds-size_1-of-2" style="padding: 20px;">
                                    
                                        <div class="floating-label">
                                            <span class="label-text-drop"><span style="color:red">*</span>Status</span>
                                        <lightning-combobox variant="label-hidden" value={status}  placeholder="Select Status" options={optionsStatus}
                                        onchange={handleChangeStatus} required="true"></lightning-combobox>
                                    
                                    </div>
                                </div> 
                            </template>
                            
                            <div class="slds-size_1-of-2" style="padding: 20px;">
                                
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Assigned to</span>
                                    <lightning-combobox variant="label-hidden" value={staffName1} placeholder="Select Employee" options={staffOptions2}                                        
                                        onchange={handleStaffChange1} required="true">
                                    </lightning-combobox>
                                
                                </div>
                            </div>
                                                            
                        </div>
                                        
                        <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
                            <!-- <lightning-button variant="brand" label="Save" onclick={handleSave1} style="margin-left:10px;"></lightning-button> -->
                            <lightning-button  variant="brand-outline" label="Cancel" onclick={handleCancel1} style="margin-left:10px;"></lightning-button>
                            <lightning-button variant="brand"  label="Next >>" onclick={handleNext1} style="margin-left:10px;"></lightning-button>
                        </div>
                    
        </template>
        <template if:true={isStep2}>
        <div>
            <div class="slds-grid slds-wrap" style="margin-left:2.5%;margin-right:2.5%;margin-top:2%;">
                <div class="slds-col slds-size_1-of-2">
                    <div class="slds-p-around_medium">
                        <div class="form-section">
                            <div class="form-group" style="margin-bottom:2%;">
                                <lightning-radio-group label="Priority of the incident" name="priority" options={priorityOptions} value={priorityValue}
                                    data-id="priorityId" onchange={handlePriorityChange} required></lightning-radio-group>
                            </div>
                            <div class="form-group" style="margin-bottom:2%;">
                                <lightning-radio-group label="People involved in this incident:" name="raisedBy" options={raisedByOptions} value={raisedByValue} required
                                    onchange={handleRaisedByChange}></lightning-radio-group>
                                    <template if:true={showOtherDescription}>
                                        <lightning-input-rich-text  value={others} data-id="other" onchange={handleInputother}></lightning-input-rich-text>
                                    </template>
                                    <template if:true={showClientDropdown}>
                                        <div style="padding: 10px;">
                                        <div class="floating-label">
                                            <span class="label-text-drop">Select Participant</span>
                                        <lightning-combobox 
                                            variant="label-hidden"
                                            value={client1}  placeholder="Select Participant" options={clientOption}
                                            onchange={handleClientChange1}>
                                        </lightning-combobox>
                                        </div>
                                    </div>
                                    </template>                            
                                    <template if:true={showFacilityDropdown}>
                                        <div style="padding: 10px;">
                                            <div class="floating-label">
                                                <span class="label-text-drop">Select Facility</span>
                                        <lightning-combobox 
                                        variant="label-hidden" 
                                            value={facilityName1} placeholder="Select the Facility" options={facilityOptions}                                        
                                            onchange={handleFacilityChange1}>
                                        </lightning-combobox>
                                        </div></div>
                                    </template>
                                    <template if:true={showEmployee}>
                                        <div style="padding: 10px;">
                                            <div class="floating-label">
                                                <span class="label-text-drop">Select Staff</span>
                                        <lightning-combobox 
                                            variant="label-hidden"
                                            value={staffName} placeholder="Select Staff" options={staffOptions2}                                        
                                            onchange={handleStaffChange}>
                                        </lightning-combobox>
                                            </div></div>
                                    </template>
                                    <template if:true={showParticipantRepresentative}>
                                        <lightning-input-rich-text  value={partcipantValue} data-id="participant" onchange={handleInputParticipantRepresent}></lightning-input-rich-text>
                                    </template>
                                    <template if:true={showSubContractor}>
                                        <lightning-input-rich-text  value={subContractor} data-id="subcontractor" onchange={handleInputSubContractor}></lightning-input-rich-text>
                                    </template>
                            </div>
                            <div class="form-group" style="margin-bottom:2%;">
                                <lightning-radio-group label="Select the most relevant incident type:" name="issueType" options={issueTypeOptions} value={issueTypeValue}
                                    onchange={handleIssueTypeChange} required></lightning-radio-group>

                                    <template if:true={mostRelevantOthers}>
                                        <lightning-input-rich-text  value={mostRelevantOtherValue} data-id="mostRelevantOthers" onchange={handleInputMostRelevantOther}></lightning-input-rich-text>
                                    </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="slds-p-around_medium">
                        <div class="form-section">
                            <p style="font-weight:bold;color:#5A5A5A">Date and Time of the incident</p>
                            <div class="Date-group" style="margin-bottom:2%;">

                                <lightning-input label="Date" type="date" value={incidentDate}
                                    onchange={handleIncidentDateTimeChange} style="width:35%;margin-right:10px;" required="true"></lightning-input>

                                <lightning-input label="Time" type="time" value={incidentTime}
                                    onchange={handleIncidentDateTimeChange} style="width:35%" required="true"></lightning-input>
                            </div>
                            <p style="font-weight:bold;color:#5A5A5A">Date and Time of the incident occurred</p>
                            <div class="Date-group" style="margin-bottom:2%;">
                                <lightning-input label="Date" type="date" value={allegedDate}
                                    onchange={handleAllegedDateTimeChange} style="width:35%;margin-right:10px;" required="true"></lightning-input>
                                    
                                    <lightning-input label="Time" type="time" value={allegedTime}
                                    onchange={handleAllegedDateTimeChange} style="width:35%" required></lightning-input>
                            </div>
                            <div class=" form-group  slds-grid" style="margin-bottom:2%; width:90%;">
                                
                                <div style="padding: 10px;">
                                    <div class="floating-label-textarea">
                                        <span class="label-text-drop"><span style="color:red">*</span>Please provide a detailed description of the incident</span>
                                <lightning-input-rich-text variant="label-hidden" value={description}  onfocus={handleFocus} 
                                placeholder="Enter your text here or start speaking..." onchange={handleDescriptionChange} required></lightning-input-rich-text>
                                    </div></div>
                                <div class="slds-p-top_small ">
                                    <lightning-icon
                                        icon-name={iconName}
                                        alternative-text={altText}
                                        onclick={toggleListening}
                                        if:true={showMuteIcon}
                                        class="slds-button slds-button_icon mute-icon" style="margin-left:5px;"
                                        size="small">
                                    </lightning-icon>
                                    <lightning-icon
                                        icon-name="utility:clear"
                                        alternative-text="Clear Text"
                                        onclick={clearText}
                                        if:true={showClearIcon}
                                        class="slds-button slds-button_icon clear-icon"
                                        size="small" >
                                    </lightning-icon>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
                <lightning-button label="<<Previous" variant="brand" onclick={handlePrevious2}></lightning-button>&ensp;&ensp; 
                <!-- <lightning-button label="Save" variant="brand" onclick={handleSave2}></lightning-button>&ensp;&ensp;  -->
                <lightning-button label="Cancel" variant="brand-outline" onclick={handleCancel2}></lightning-button>&ensp;&ensp; 
                <lightning-button label="Next>>" variant="brand" onclick={handleNext2}></lightning-button>
            </div>
        </div>
        </template>
        <template if:true={isStep3}>
        <div>
            <div class="slds-grid slds-wrap" style="margin-left:2.5%;margin-right:2.5%;margin-top:2%;">           
                <div class="slds-col slds-size_1-of-2">                       
                    <div class="slds-p-around_medium">
