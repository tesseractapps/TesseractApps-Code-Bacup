<template>
    <div class="container-box">
        <div style="background-color:white; border-radius: 5%; margin-left: 0; padding-left:4%">
            <h3 slot="title">
                <span style="font-size: 100%;font-weight:bold;">Sign in</span>
            </h3>
            <div class="slds-p-left_medium slds-p-bottom_x-small">
                <!-- Completed -->
            <div class="status">
                <!-- <div class="icon completed-icon"></div> -->
                <lightning-icon class = "custom-icon-completed" icon-name='action:check' alternative-text='check' size='Small' title='check'></lightning-icon>
                <div class="text">
                    <p class="label">Completed</p>
                    <p class="count">{completedCount} Completed</p>
                </div>
            </div>

            <!-- In Progress -->
            <div class="status">
                <!-- <div class="icon in-progress-icon">
                    <div class="clock-face">
                        <div class="hour-hand"></div>
                        <div class="minute-hand"></div>
                        <div class="center-dot"></div>
                    </div>
                </div> -->
                <lightning-icon class = "custom-icon-Progress" icon-name='action:defer' alternative-text='defer' size='small' title='defer'></lightning-icon>
                <div class="text">
                    <p class="label">In Progress</p>
                    <p class="count">{inProgressCount} In Progress</p>
                </div>
            </div>

            <!-- Location -->
            <div class="status">
                <!-- <div class="icon location-icon"></div> -->
                <lightning-icon class = "custom-icon-accepted" icon-name='action:following' alternative-text='following' size='small' title='following'></lightning-icon>
                <div class="text">
                    <p class="label">Accepted</p>
                    <p class="count">{acceptedCount} Accepted</p>
                </div>
            </div>
        </div>
            </div>
    </div>
</template>
