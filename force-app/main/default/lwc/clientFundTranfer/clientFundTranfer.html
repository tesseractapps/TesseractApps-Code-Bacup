<template><br/>
    <div class="participantlayout" style="margin-bottom:20px;">
        <div class="slds-grid">
            <div style="width:72%;" class="slds-border_right"> 
                <lightning-card title="Funds Tracker">        
                    <template if:true={displayFundTracker}>
                        <lightning-record-view-form record-id={clientId} object-api-name={objectApiName}>
                            <div class="slds-grid slds-wrap">
                                <div class="slds-size_1-of-2">
                                    <div class="slds-m-right_medium slds-m-left_medium">
                                        <lightning-output-field field-name="Total_Approved_Amounts__c"></lightning-output-field>
                                    </div>
                                </div>
                                <div class="slds-size_1-of-2">
                                    <div class="slds-m-left_large">
                                        <lightning-output-field field-name="Total_Spent_Funds__c"></lightning-output-field>
                                    </div>
                                </div>

                                <div class="slds-size_1-of-2">
                                    <div class="slds-m-right_medium slds-m-left_medium">
                                        <lightning-output-field field-name="Total_Available_Funds__c"></lightning-output-field>
                                    </div>
                                </div> 
                            </div>
                        </lightning-record-view-form>
                    </template>
                </lightning-card>
                
                <template if:true={displayFundTracker}>
                    <lightning-card title="Approved Services">
                        <lightning-button variant="brand" label="Add New Fund" title="Add New Fund" slot="actions"
                            onclick={handleFundSpent} class="slds-float_right" ></lightning-button>
                        
                        <template if:false={createAddNew}>
                            <template if:true={newAddFundTracker}>    
                                <div class="slds-grid slds-wrap" style="padding:1%;">                
                                <!-- <lightning-datatable data={accList} columns={columns} key-field="Id" hide-checkbox-column="false" column-width-mode="fixed" 
                                onrowaction={handleRowActions}>
                                </lightning-datatable> -->
                                 <table class="slds-table slds-table_cell-buffer" style="table-layout: fixed;">
                                    <thead>
                                        <tr>
                                            <th style="width:20%;">Service Type</th>
                                            <th>Approved Date</th>
                                            <th>Approved Fund</th>
                                            <th>Spent</th>
                                            <th style="align-items:center;">Available Funds</th>
                                            <th style="align-items:center;">Status</th>
                                            <th style="align-items:center;">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={accList} for:item="acc">
                                            <tr key={acc.id} class="tr1">
                                                <td class="description">{acc.registrationGroup}</td>
                                                <td>{acc.approvedDate}</td>
                                                <td>{acc.amountApproved}</td>
                                         
                                                <td>{acc.spentAmount}</td>
                                                <td>{acc.availableFunds}</td>
                      
                                                
                                                <td>{acc.status}</td>
                                                <td>
                                                        <lightning-icon data-accid={acc.id} icon-name="action:edit" data-name="edit" alternative-text="Edit" onclick={handleRowActions} size="xx-small" style="cursor:pointer;color:white;background:#0099DE; margin-right:2%;"></lightning-icon>
                                                    
                                                   
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table> 
                                </div>
                            </template>
                            
                        </template>
                        <template if:true={paginationVisible}>
                         <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;padding:1%;">
                            <!--RECORDS PER PAGE-->
                            <div class="slds-col">
                                <div class="slds-list_inline slds-p-bottom_xx-small">
                                    <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage">Page Size:</label>
                                    <div class="slds-select_container">
                                        <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                            <template for:each={pageSizeOptions} for:item="option">
                                                <option key={option} value={option}>{option}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!--PAGE NAVIGATION-->
                            <div class="slds-align_absolute-center" style="height:5rem">
                                <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                                <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                                &nbsp;
                                <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                                &nbsp;
                                <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                            </div>
                            <!--TOTAL RECORDS-->
                            <div class="slds-clearfix">
                                <div class="slds-float_right">
                                    <span class="slds-badge"> Total Records: {totalRecords}</span>
                                </div>
                            </div>
                         </div>
                        </template>
                        <!--Spinner Starting-->
                        <div if:true={showLoadingSpinner}>
                            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                        </div>
                    </lightning-card>
                </template>
                  
            </div>
            <div style="width:28%" >
                <c-pie-chart-lwc client-id={clientId}></c-pie-chart-lwc>
            </div>
        </div>
    </div>
    <template if:true={createAddNew}>
        <div class="blur-overlay"></div>
        <div class="right-align" style="width:40%;">
          
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <p style="font-weight: bold;font-size:140%; margin: 0; padding: 3% 0 0 3%;">Add New Fund</p>
            
                <div style="display: flex; align-items: center; gap: 10px;margin-right:3%;margin-top:2%;">
                    <lightning-button label="Back" variant="brand" onclick={hideModalBox}></lightning-button>                    
                </div>
             </div>
 
            <div class="slds-p-around_medium">
                <lightning-record-edit-form object-api-name="Funds_Tracker__c" onsuccess={handleSuccess} onsubmit={handleSubmit} onerror={handleError}>
                <lightning-messages></lightning-messages>
                <div class="container-box">

                        <div class="slds-grid slds-wrap"  style="padding: 20px 0px 20px 0px;">
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>Plan Type</span> 
                                    <lightning-input-field field-name="Plan_Type__c" variant="label-hidden"></lightning-input-field>                                       
                                </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>Service Type</span> 
                                    <lightning-input-field field-name="Registration_Group__c" variant="label-hidden"></lightning-input-field>                                       
                                </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>Amount</span> 
                                    <lightning-input-field field-name="Amount_approved__c" variant="label-hidden"></lightning-input-field>                                       
                                </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop">Status</span> 
                                    <lightning-input-field field-name="Status__c" variant="label-hidden"></lightning-input-field>                                       
                                </div>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>Approved Date</span> 
                                    <lightning-input-field field-name="Approved_Date__c" variant="label-hidden"></lightning-input-field>                                       
                                </div>
                            </div>                                            
                        </div>
                        <div class="slds-align_absolute-center" >
                            <lightning-button type="submit" variant="brand" label="Save"></lightning-button>&nbsp;&nbsp;&nbsp;
                            <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                        </div>
                    </br>    
                </div>       
                            <!-- modal footer start-->
                
                </lightning-record-edit-form>  
            </div>
        </div>
    </template>
    <template if:true={isEdit}> 
        <div class="blur-overlay"></div>                          
        <div class="right-align" style="width:40%;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <p style="font-weight: bold;font-size:150%; margin: 0; padding: 5% 0 0 5%;">Update Funds Tracker</p>
                
                    <div style="display: flex; align-items: center; gap: 10px;margin-right:4%;">
                        <lightning-button label="Back" variant="brand" onclick={hideModalBox}></lightning-button>                    
                    </div>
                </div>
                <div class="slds-p-around_medium">
                    <lightning-record-edit-form object-api-name="Funds_Tracker__c" onsuccess={handleSuccess} onsubmit={handleSubmit} record-id={recordId}>
                        <lightning-messages></lightning-messages>
                        <div class="container-box">
                            <div class="slds-grid slds-wrap"  style="padding: 20px 0px 20px 0px;">
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Plan Type</span> 
                                        <lightning-input-field field-name="Plan_Type__c" variant="label-hidden"></lightning-input-field>                                       
                                    </div>
                                </div>
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Service Type</span> 
                                        <lightning-input-field field-name="Registration_Group__c" variant="label-hidden"></lightning-input-field>                                       
                                    </div>
                                </div>
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Amount</span> 
                                        <lightning-input-field field-name="Amount_approved__c" variant="label-hidden"></lightning-input-field>                                       
                                    </div>
                                </div>
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop">Status</span> 
                                        <lightning-input-field field-name="Status__c" variant="label-hidden"></lightning-input-field>                                       
                                    </div>
                                </div>
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Approved Date</span> 
                                        <lightning-input-field field-name="Approved_Date__c" variant="label-hidden"></lightning-input-field>                                       
                                    </div>
                                </div>
                            </div>
                        </div><br/>
                    <!-- modal footer start-->
                    <div class="slds-align_absolute-center slds-m-around_small">
                        <lightning-button type="submit" variant="brand" label="Update"></lightning-button>&nbsp;&nbsp;
                        <button class="slds-button slds-button_outline-brand" onclick={hideModalBox}>Cancel</button><br/><br/>
                    </div>
                    </lightning-record-edit-form>  
                </div>
           <!--  </div> -->
        </div>                      
    </template>
</template>
