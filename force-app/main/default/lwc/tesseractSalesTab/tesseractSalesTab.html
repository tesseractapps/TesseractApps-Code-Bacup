<template>
    <div>
        <div if:true={isDesktop}>
            <div> 
                <div class="slds-grid slds-var-m-left_x-large slds-var-m-right_x-large" style="margin-top:20px;">
                    
                    <div class={orgClass} data-name="Organisation" title="Current Sales" alt="Current Sales" name="Organisation"  onclick={navigateToFacilityPage}
                    style="cursor:pointer;text-align:center" > 
                    Current Sales                                
                    </div>                        
                    
                    <div class={selectedClass} data-name="Facility" title="New Sales" alt="New Sales" name="Facility" onclick={navigateToFacilityPage}
                            style="cursor:pointer;text-align:center" > 
                        New Sales                                
                    </div>                       
                        
                </div>
            </div>
            <div>
                <template if:true={isOrgButton}>
                    <c-tesseract-sales ongetsearchvalue={handleSearchValue}></c-tesseract-sales>
                </template>
                <template if:true={isFacilityButton}>
                    <div style="margin-top:-9px;">
                       <!--  <c-facility-data-community
                            selected-name={searchValue}></c-facility-data-community> -->
                    </div>
                </template>
            </div>
        </div>            
    </div>
</template>
