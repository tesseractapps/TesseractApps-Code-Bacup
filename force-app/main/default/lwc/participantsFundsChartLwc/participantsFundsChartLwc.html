<template>
    <div class="container-box">
        <div style="background-color:white; border-radius: 5%;">
            <h3 slot="title">
                <!-- <span style="font-size: 100%;font-weight:bold;">Performance Management</span> -->
                <a href="#" data-name="Funds Tracker" onclick={grandchildevent} style="font-size: 100%;font-weight:bold;color:black">Funds Tracker</a>
            </h3>

            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_medium">
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_medium">
                    <lightning-combobox
                        name="Participant"
                        label="Participant"
                        value={selectedValue}
                        placeholder="Select an Participant"
                        options={Participantoptions}
                        onchange={handleParticipantChange}
                        class="custom-combobox">
                    </lightning-combobox>
                </div>
            </div>
                
            <div class="chart-container">
                <canvas width="300" height="350" lwc:dom="manual" class="chart" data-id="pieChart"></canvas>
            </div>

        </div>
    </div>

</template>
