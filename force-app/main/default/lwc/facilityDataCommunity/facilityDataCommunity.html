<template>
    <template if:true={facFlag}>
    <div class="container">
        
        <div slot="title" style="font-weight:bold; padding: 1% 0% 2% 1%; font-size:140%;">
            <!-- <img src={facility} alt="" width="45px" height="45px" style="margin-right:0.1%"> -->
            Facility Details
        </div>
        <header class="header">
            <div class="search-section">
                <div class="floating-label slds-small-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-6">
                    <span class="label-text-drop">Facility Name</span>
                    <lightning-input  type="search" label="Facility Name" name="fname" value={firstname} variant="label-hidden"></lightning-input>
                </div>
                
                <div class="button-group">
                    <lightning-button  variant="brand" label="Search" slot="actions" title="Search Issue" onclick={handleSearch}></lightning-button>
            <lightning-button  variant="brand" label="Clear " slot="actions" title="Clear Issue" onclick={handleClear}></lightning-button> 
             <lightning-button  variant="brand" label={facilitylabel} slot="actions" title="Active and Inactive facilities" onclick={handleToggleUsers}></lightning-button>
             </div>
            </div>
            <div class="action-section">
                    <lightning-icon icon-name="utility:list" label="List View" size="x-small" title="List View" data-name="listview" class={listViewClass} onclick={handleChange}
                    style="cursor:pointer;height:20px;"></lightning-icon>
                    <lightning-icon icon-name="utility:tile_card_list" label="Card View" size="x-small" title="Card View" data-name="cardview" class={cardViewClass} onclick={handleChange}
                    style="cursor:pointer;height:20px;"></lightning-icon>
                    <lightning-button  variant="brand" label="Create Facility" slot="actions"
                title="New Facility" onclick={handleCreateNewFacility} class="slds-float_right"></lightning-button>
            </div>
        </header>
    
        <!-- Card view Display Code-->
        <template if:true={cardFlag}>
            <template if:true={totalRecords}>
                <div if:true={isDesktop}>
                    <!--Refresh Button-->
                    <div class="slds-float_right">
                    </div>
                    <template if:true={showSpinner}>
                        <lightning-spinner alternative-text="Refreshing Data" size="medium"></lightning-spinner>
                    </template>

                    <div style="margin-top:2%;margin-left:1%;margin-right:-1%;" class=" slds-grid slds-gutters  slds-wrap slds-m-top_small"> 
                        <template for:each={recordsToDisplay} for:item="fac" for:index="index">
                            <div key={fac.Id} class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                                <div key={fac.Id} style="border-radius: 12px; border: 1px solid rgba(0, 41, 70, 0.6);box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);" class="slds-m-right_large slds-m-bottom_large">
                                    <span style="border-top-left-radius: 12px; border-top-right-radius: 12px; height:40px;display:flex;align-items: center; justify-content: space-between;background-color:#003466;border-bottom: 1px black;padding:2px; overflow: hidden;">
                                        
                                        <b style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;color:white;"> 
                                            <lightning-formatted-text class="name"
                                                    style="font-size:17px;color:white;padding-left:15px;flex-shrink:1;"
                                                    value={fac.Name}></lightning-formatted-text>
                                            </b>
                                        
                                    
                                    <template if:true={fac.Picture__c} >
                                        <lightning-avatar variant="circle" src={fac.Picture__c} initials="NA" accept=".jpg, .jpeg, .png, .gif"  fallback-icon-name="standard:person_account" alternative-text="image" style="margin-right:0.4rem;"></lightning-avatar>
                                    </template> 
                                    </span>
                                    <span>
                                        <table style="margin-bottom:5px;margin-top:0.5rem;table-layout:fixed;">
                                            <tr>
                                                <td style="font-weight:bold;width:6rem;padding-left:15px;">&nbsp;Contact:</td>
                                                <td style="padding-left:0.5rem;"><lightning-formatted-text
                                                        value={fac.Phone__c}></lightning-formatted-text>
                                                </td>
                                            </tr>
                                            
                                            <tr>
                                                <td style="font-weight:bold;width:6rem;padding-left:15px;">&nbsp;<a href="javascript:void(0)"
                                                        data-name={fac.Facility_Name__c} onclick={servicesList}>Services:
                                                    </a>
                                                    <lightning-helptext
                                                        content="Available Services"></lightning-helptext>&nbsp;
                                                </td>
                                                <td class="email" style="padding-left:0.5rem;"><lightning-formatted-text
                                                        value={fac.Services__c}></lightning-formatted-text>
                                                </td>
                                            </tr>
                                            
                                            <tr>
                                                <td style="font-weight:bold;width:6rem;padding-left:15px;">&nbsp;Email: </td>
                                                <td class="email" style="padding-left:0.5rem;"><lightning-formatted-text
                                                        value={fac.Email__c}></lightning-formatted-text>
                                                </td>
                                            </tr>
                                            
                                            <tr>
                                                <td style="font-weight:bold;width:6rem;padding-left:15px;">&nbsp;Status:</td>
                                                <td style="display: flex; align-items: center;flex-direction: row;margin-right: 2%;justify-content: space-between;">
                                                    
                                                    <lightning-input data-id={fac.Id} data-name={fac.Status__c} data-toggle="inputtoggle"
                                                        type="toggle" onchange={handlefacStatus} label=""
                                                        checked={fac.Status__c} message-toggle-active="" class="input__toggle"
                                                        message-toggle-inactive="" style="margin-right:68%">

                                                    </lightning-input>
                                                     <lightning-icon icon-name="action:preview" variant="base" alternative-text="Edit" title="Edit"
                                            onclick={handleviewFacility} data-id={fac.Id} size="xx-small" 
                                            style="cursor:pointer;color:white;background:#0099DE;">
                                        </lightning-icon> 
                                    
                                                </td>

                                            </tr>
                                            
                                        </table>
                                    </span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            
            </template>
        </template>
        <!-- List view Display Code-->  
        <template if:true={listFlag}>
            <div style="padding: 2% 1%;">
                <table
                class="slds-table slds-table_cell-buffer table"
                style="table-layout:fixed">
                    <thead class="table_th">
                        <tr>
                            <th class="slds-cell-wrap table_th">
                                Facility Name</th>
                            <th class="slds-cell-wrap table_th" style="width:10%;">
                                Contact Number</th>
                            <th class="slds-cell-wrap table_th">
                                Services</th>
                            <th class="slds-cell-wrap table_th">
                                Email</th>
                            <th class="slds-cell-wrap table_th" style="width:6%;">
                                Status</th>
                            <th class="slds-cell-wrap table_th" style="width:8%">
                                Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={recordsToDisplay} for:item="fac">
                            <tr key={fac.Id} class="tr1">
                                <td class="slds-cell-wrap table_td">{fac.Name}</td>
                                <td class="slds-cell-wrap table_td">{fac.Phone__c}</td>
                                <td class="slds-cell-wrap table_td">{fac.Services__c}</td>
                                <td class="slds-cell-wrap table_td">{fac.Email__c}</td>
                                <td class="slds-cell-wrap table_td">{fac.facility_status__c}</td>
                                <td class="slds-cell-wrap table_td">									
                                  <lightning-icon icon-name="utility:preview" alternative-text="Edit" title="Edit"
                                  onclick={handleviewFacility} data-id={fac.Id} size="small" variant="base"></lightning-icon>                                  
                                </td>
                            </tr>
                        </template>
  
                    </tbody>
                </table>
            </div>
        </template>      
        <template if:true={totalRecords}>

            <div if:true={isDesktop}>
                <div if:true={visible}>
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
                        style="padding-top: 0.5em;">

                        <!--PAGE NAVIGATION-->
                        <div class="slds-align_absolute-center" style="height:5rem">
                            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
                                class="slds-p-horizontal_x-small" alternative-text="first page"
                                onclick={firstPage}></lightning-button>
                            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
                                alternative-text="Previous" onclick={previousPage}></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                                &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                                alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small"
                                icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                                alternative-text="last page" onclick={lastPage}
                                icon-position="right"></lightning-button>
                        </div>

                        <!--TOTAL RECORDS-->
                        <div class="slds-clearfix">
                            <div class="slds-float_right ">
                                <span class="slds-badge"> Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </template>
        <!-- if there is no facilities -->
        <template if:false={noRecordsFlag}>
            <div class="slds-grid  slds-grid_align-spread slds-m-left_large"
                style="padding-top: 0.5em; font-size:20px;">
                <b style="color: #4CAF50;">No facilities are registered for this organisation.</b>
            </div>
        </template>
        
    </div>
  </template>
    <template if:true={isServiceModel}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal  slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeservicesList}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-03" class="slds-text-heading_medium slds-hyphenate"> <b>{facilityName}</b>
                    </h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-3">
                    <div class="slds-p-around_medium slds-m-left_large">
                        <h3><b class="slds-text-heading_medium slds-m-left_xx-large">Services</b>
                        </h3>
                    </div>
                    <div class=" slds-size_1-of-2 slds-m-left_xx-large">
                        <template for:each={lstOptions} for:item="services">
                            <div key={services.label} class="slds-m-left_xx-large">

                                <ul class="slds-list_dotted slds-m-around_small slds-m-left_xx-large">

                                    <li> {services.label} <br /></li><br />
                                </ul>
                            </div>
                        </template>
                    </div>

                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={facEditFlag}>
        <div class="blur-overlay"></div>
        <div class="right-align fade-in" style="width:70%;">    
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <h3 style="font-size:140%;font-weight:bold;margin-bottom:0.5%;margin-top:1%;margin-left:1.5%;">Create  Facility</h3>
                <div style="display: flex; align-items: center; gap: 10px;margin-top:1%;margin-right:1%">
                <lightning-button label="Back" variant="brand" onclick={handleeditClose}></lightning-button> 
            </div>
            </div>  
            <div class="container2" >
            
              <lightning-record-edit-form object-api-name="Facility__c" record-id={recordId} onsuccess={handleSuccess} onsubmit={handleSubmit} >
                <lightning-messages></lightning-messages>
                <div class="container-box">
                    <div  class="toggle-bar" onclick={handleSectionToggle} data-id="Facility" style="cursor: pointer;">
                      <span>Facility</span>
                      <span>{sectionIcons.Facility}</span>      
                    </div>
                    <div class="section-content" data-section="Facility">
                    <template if:true={sectionFlags.Facility}>
                    <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop"><span style="color:red">*</span>Facility</span>
                        <lightning-input-field field-name="Name" variant="label-hidden" required="true" name="name" onchange={handleChange}></lightning-input-field> 
                    </div>
                   </div>
                  
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Contact Number</span>
                        <lightning-input-field field-name="Phone__c" name="phone" variant="label-hidden" onchange={handleNameChange}></lightning-input-field> 
                    </div>
                   </div>
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Contact Name</span>
                        <lightning-input-field field-name="Manager_Name__c" variant="label-hidden"></lightning-input-field>
                    </div>
                   </div>
                  
                  
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Email ID</span>
                        <lightning-input-field field-name="Email__c" name="email" onchange={handleNameChange} variant="label-hidden"></lightning-input-field>
                    </div>
                   </div>
                   <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">ABN</span>
                        <lightning-input-field field-name="ABN__c" variant="label-hidden"></lightning-input-field>
                    </div>
                   </div>
                   <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                
                    <span style="display: flex;gap:2%;padding:10% 0 0% 10%;">
                        <span>Status</span>
                        <lightning-input  type="toggle" onchange={handleStatus} value={toggleValue}  name="toggle" message-toggle-active="" size="xx-small" 
                         message-toggle-inactive=""></lightning-input>
                    </span>  
                    
                   </div>
                  
                  
              <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4" style="padding:1% 1% 0% 1%">
                <div class="floating-label">      
                <input type="file" id="fileInput" onchange={onFileUpload} accept=".jpg, .jpeg, .png, .gif" name="uploadFile" style="display: none;">
                <button type="button" onclick={triggerFileInput} class="file-upload-button" >
                    &#8684; Upload Profile Pic
                </button>
                <div class="slds-text-body_small">{fileName}</div>
                </div>
              </div>
              <div class="slds-col slds-size_1-of-2" style="padding-left: 1%;padding-right: 1%;padding-top: 1%;">
                <div class="floating-label-role" style="width: 100%;">
                    <span class="label-text-drop"><span style="color:red">*</span>Services</span>

                    <lightning-input-field field-name="Services__c" required="true" variant="label-hidden"></lightning-input-field>

                    
                </div>
             </div>
                  <div class="slds-size_1-of-1 slds-large-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-left_medium">  
                        <div style="color:red;">{errorMessage}</div>                      
                       <lightning-input-address
                        address-label="Address"
                        street-label="Street"
                        city-label="Suburb"
                        country-label="Country"
                        province-label="State"
                        postal-code-label="Post Code"
                        street={street}
                        city={city}
                        country={country}
                        province={province}
                        postal-code={postalcode}
                        onchange={addressInputChange}
                        show-address-lookup required="true">
                        </lightning-input-address>     
                    </div>
                </div>
                  
                  </div>
                  <div class="slds-align_absolute-center slds-m-around_small">
                    <lightning-button label={buttonName} variant="brand" type="submit" class="slds-m-around_small" disabled={saveButtonDisable}></lightning-button>
                  <lightning-button label="Cancel" variant="brand-outline" onclick={handleeditClose}
                    class="slds-m-around_small"></lightning-button>
                </div>
                  </template>

                </div>
                  
                  </div>
                
                
                
              </lightning-record-edit-form>
        </div>
        </div>
    </template>
    <template if:true={facviewFlag}>
        <div class="container">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <!-- Left side: Staff Details -->
                <h3 style="font-size:140%;font-weight:bold;margin-bottom:0.5%;margin-top:1%;margin-left:1%;">Facility Details</h3>
            
                <!-- Right side: Back button and image icon -->
                <div style="display: flex; align-items: center; gap: 10px;margin-top:1%;margin-right:1%">
                    <lightning-icon icon-name="action:edit" alternative-text="Edit" title="Edit"
                    onclick={handleEdit}  size="xx-small" 
                    style="cursor:pointer;color:white;background:#0099DE;">
                   </lightning-icon>
                    <lightning-button label="Back" variant="brand" onclick={handleBack}></lightning-button>
                    
                </div>
            </div>
                      
                <div class="container2" >
                <template if:true={facilityflag}>
              <lightning-record-view-form object-api-name="Facility__c" record-id={recordId} onsuccess={handleSuccess} onsubmit={handleSubmit} >
                <lightning-messages></lightning-messages>
                
                <div class="container-box">
                    <div  class="toggle-bar" onclick={handleSectionToggle} data-id="Facility1" style="cursor: pointer;">
                      <span>Facility</span>
                      <span >{sectionIcons.Facility1}</span>      
                    </div>
                    <div class="section-content" data-section="Facility1">
                    <template if:true={sectionFlags.Facility1}>
                    <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                   <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                    <label class="labelClass" style="display: flex; align-items: left;">
                        <div style="flex: 0 0 20%; font-weight: bold;">Facility</div>
                        <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                        <div style="flex: 1 1 75%; text-align: left; padding-left: 8px; margin: 0;">
                            <lightning-output-field field-name="Name" variant="label-hidden" required="true" name="name" onchange={handleChange}></lightning-output-field>    
                        </div>
                    </label>
                </div>
                  
                   <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                    <label class="labelClass" style="display: flex; align-items: left;">
                        <div style="flex: 0 0 20%; font-weight: bold;">Contact Number</div>
                        <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                        <div style="flex: 1 1 75%; text-align: left; padding-left: 8px; margin: 0;">
                            <lightning-output-field field-name="Phone__c" name="phone" variant="label-hidden" style="pointer-events:none;" onchange={handleNameChange}></lightning-output-field>  
                        </div>
                    </label>
                </div>
                   <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                    <label class="labelClass" style="display: flex; align-items: left;">
                        <div style="flex: 0 0 20%; font-weight: bold;">Contact Name</div>
                        <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                        <div style="flex: 1 1 75%; text-align: left; padding-left: 8px; margin: 0;">
                            <lightning-output-field field-name="Manager_Name__c" variant="label-hidden"></lightning-output-field>  
                        </div>
                    </label>
                </div>
                   <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                    <label class="labelClass" style="display: flex; align-items: left;">
                        <div style="flex: 0 0 20%; font-weight: bold;">Email ID</div>
                        <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                        <div style="flex: 1 1 75%; text-align: left; padding-left: 8px; margin: 0;">
                            <lightning-output-field field-name="Email__c" name="email" onchange={handleNameChange} variant="label-hidden" style="pointer-events:none;"></lightning-output-field>  
                        </div>
                    </label>
                </div>
                   <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                    <label class="labelClass" style="display: flex; align-items: left;">
                        <div style="flex: 0 0 20%; font-weight: bold;">ABN</div>
                        <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                        <div style="flex: 1 1 75%; text-align: left; padding-left: 8px; margin: 0;">
                            <lightning-output-field field-name="ABN__c" variant="label-hidden"></lightning-output-field>   
                        </div>
                    </label>
                </div>
                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                    <label class="labelClass" style="display: flex; align-items: left;">
                        <div style="flex: 0 0 20%; font-weight: bold;">Status</div>
                        <div style="flex: 0 0 5%; font-weight: bold;text-align: center;">:</div>
                        <div style="flex: 1 1 75%; text-align: left; padding-left: 8px; margin: 0;">
                          <lightning-output-field field-name="Status__c" value={status} variant="label-hidden" ></lightning-output-field>
                        </div>
                    </label>
                </div>
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                    <label class="labelClass" style="display: flex; align-items: left;">
                        <div style="flex: 0 0 20%; font-weight: bold;">Services</div>
                        <div style="flex: 0 0 5%; font-weight: bold;text-align: center;">:</div>
                        <div class="slds-truncate" style="flex: 1 1 75%; text-align: left; padding-left: 8px; margin: 0;max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            <lightning-output-field field-name="Services__c" required="true" variant="label-hidden"></lightning-output-field>
                        </div>
                    </label>
                </div>
                  
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                    <label class="labelClass" style="display: flex; align-items: left;">

            </div> 
                <div class="container-box">

                    <div class="floating-label">
                        <span class="label-text-drop"><span style="color:red">*</span>Facility</span>

                    </div>
                   </div>
                  
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Contact Number</span>
                        <lightning-input-field field-name="Phone__c" name="phone" variant="label-hidden" onchange={handleNameChange}></lightning-input-field> 
                    </div>
                   </div>
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Contact Name</span>
                        <lightning-input-field field-name="Manager_Name__c" variant="label-hidden"></lightning-input-field>
                    </div>
                   </div>
                  
                  
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Email ID</span>
                        <lightning-input-field field-name="Email__c" name="email" onchange={handleNameChange} variant="label-hidden"></lightning-input-field>
                    </div>
                   </div>
                   <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">ABN</span>
                        <lightning-input-field field-name="ABN__c" variant="label-hidden"></lightning-input-field>
                    </div>

                    <div>

                          <span>Status</span>
                    </label>  
                      </div>
                   </div>
                  
                  
                  
              <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4" style="padding:1% 1.2% 0% 1.2%">

                <input type="file"  onchange={onFileUpload} accept=".jpg, .jpeg, .png, .gif" name="uploadFile" style="display: none;">
                <button type="button" onclick={triggerFileInput} class="file-upload-button" >
                    &#8684; Upload Profile Pic
                </button>
                <div class="slds-text-body_small">{fileName}</div>
                </div>
              </div>
              
                  
                  <div class="slds-col slds-size_1-of-2" style="padding-left: 1%;padding-right: 1%;padding-top: 1%;">

                    </div>
                 </div>
                  <div class="slds-size_1-of-1 slds-large-size_1-of-2">

                       <lightning-input-address

                        city-label="Suburb"

                </div>
                  
                  </div>

                </div>
                  </div>
                
                </div>
                
                
              </lightning-record-edit-form>
