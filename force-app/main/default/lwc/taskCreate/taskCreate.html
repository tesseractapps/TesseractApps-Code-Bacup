<template>
    <div class="task-heading">
        Create Task
    </div>
    <div class="slds-grid slds-wrap innercont" style="padding: 20px 20px 20px 20px;">
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Assign to</span>
                    <lightning-combobox 
                        name="user" 
                        required="true" 
                        variant="label-hidden" 
                        label="Assign to" 
                        value={selectedValue} 
                        placeholder="Select User" 
                        options={userOption} 
                        onchange={handleUser}>
                    </lightning-combobox>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop">Status</span>
                    <lightning-combobox 
                        name="status" 
                        required="true" 
                        variant="label-hidden" 
                        label="Status" 
                        value={statusValue} 
                        placeholder="Select Status" 
                        options={optionsStatus} 
                        onchange={handleChange}>
                    </lightning-combobox>
                </div>
            </div>        
            <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop">Priority</span>
                    <lightning-combobox 
                        name="priority" 
                        required="true" 
                        variant="label-hidden" 
                        label="Priority" 
                        value={priorityValue} 
                        placeholder="Select Priority" 
                        options={optionsPriority} 
                        onchange={handleChange}>
                    </lightning-combobox>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop">Subject</span>
                    <lightning-combobox 
                        name="subject" 
                        required="true" 
                        variant="label-hidden" 
                        label="Subject" 
                        value={subjectValue} 
                        placeholder="Select Subject" 
                        options={optionsSubject} 
                        onchange={handleChange}>
                    </lightning-combobox>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label">
                    <span class="label-text-drop">Due Date</span>
                    <lightning-input 
                        type="date" 
                        name="dueDate" 
                        value={dueDateValue} 
                        variant="label-hidden" 
                        label="Due Date" 
                        onchange={handleChange}>
                    </lightning-input>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label-long">
                    <span class="label-text-drop">Comments</span>
                    <lightning-textarea 
                        name="comments" 
                        value={commentsValue} 
                        variant="label-hidden" 
                        label="Comments" 
                        onchange={handleChange}>
                    </lightning-textarea>
                </div>
            </div>
        
        </div>
    </div>
