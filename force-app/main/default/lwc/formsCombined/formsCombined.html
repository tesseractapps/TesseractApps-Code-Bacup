<template>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 1% 2% 1% 1%;">
    <p style="font-weight: bold; font-size: 140%;">Customisable Forms</p>
    <lightning-button label="Close" title="Close" onclick={handleBackClick} variant="brand"></lightning-button>
</div>

  <div class="main-container">
  <div class="menu-container">
    <div class={designTabClass} onclick={handleDesignTab}>
      Design New Form
    </div>
    <div class={draftTabClass} onclick={handleDraftTab}>
      Draft Forms
    </div>
    <div class={createdTabClass} onclick={handleCreatedTab}>
      Published Forms
    </div>
    <!-- <div class={submitTabClass} onclick={handleSubmitTab}>
      Submitted Forms
    </div> -->
    
  </div>




  <!-- Design New Forms Tab -->
  <template if:true={isDesignTabSelected}>
    <template if:true={shouldRenderFormRender}>
      <div class="form-render-wrapper">
        <c-form-create orgid={orgid} layout-data={receivedLayoutData} onnavigateaway={handleConfirmedTabSwitch}></c-form-create>
        
      </div>
    </template>
  </template>
<template if:true={isDraftTabSelected}>
    <div class="draft-wrapper">
      <c-layout-list-component layout-data={receivedLayoutData} orgid={orgid}></c-layout-list-component>
    </div>
  </template>

    <template if:true={isCreatedTabSelected}>
    <div class="incident-wrapper">
      <!-- <c-form-render key={renderKey} orgid={orgid}></c-form-render> -->
      <c-forms-access key={renderKey} orgid={orgid} viewmode="create"></c-forms-access>
    </div>
  </template>
 
  <!-- <template if:true={isSubmittedTabSelected}>
    <div class="incident-wrapper">
      <c-forms-access key={renderKey} orgid={orgid} viewmode="submit"></c-forms-access>
    </div>
  </template> -->

  </div>
</template>
