<template>
    <lightning-card title="Support" icon-name="custom:custom63" >

        <div style="float:right;margin-top:-50px;margin-right:30px;">
            <lightning-button label="Back" variant="brand" onclick={handleback}></lightning-button>
        </div>
        <div class="slds-m-around_large slds-m-top_x-large" > 
            <div class="slds-m-around_medium"> 
                <div if:true={isDesktop}>
                    <div class="slds-grid slds-wrap slds-m-top_xx-large"> 
                        <lightning-input class="slds-size_1-of-7 slds-m-around_small" type="search" label="Case Number" name="searchID" value={searchID}></lightning-input><br/>
                        <!-- <lightning-input  class="slds-size_1-of-7 slds-m-around_small" type="search" label="Facility Name" name="facilityName" value={facilityName} ></lightning-input><br/> -->
                       <!--  <lightning-input  class="slds-size_1-of-7 slds-m-around_small" type="search" label="Client Name" name="clientName" value={clientName}></lightning-input><br/> -->
                        <!-- <lightning-input  class="slds-size_1-of-7 slds-m-around_small" type="search" label="Submitted By" name="submittedBy" value={submittedBy}></lightning-input><br/> -->
                        <lightning-button style="margin-top: 32px;" variant="brand" label="Search Issue" slot="actions" title="Search Issue" onclick={handleSearch} class="slds-float_right slds-m-left_xx-large slds-var-m-top_x-large "></lightning-button>
                        <lightning-button style="margin-top:32px;" variant="brand" label="Clear Issue" slot="actions" title="Clear Issue" onclick={handleClear} class="slds-float_right slds-m-left_large slds-var-m-top_x-large "></lightning-button>
                        <lightning-button style="margin-top:32px;" variant="brand" label="New Issue" slot="actions" title="New Issue" onclick={handleCreateIssue} class="slds-float_right slds-m-left_large slds-var-m-top_x-large"></lightning-button>
                    </div> 
                </div>
                
                <div class="slds-float_right">
                    <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={fetchIssues}>
                        <svg class="slds-button__icon" aria-hidden="true">
                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                        </svg>
                    </button></div>
                <div class="slds-var-m-top_xx-large"> 
                    <div if:true={isDesktop}>
                    <template if:true={totalRecords}>      
                        <lightning-datatable  
                        key-field="Id"  
                        data={availableIssues}
                            columns={columns}
                            hide-checkbox-column="false" onrowaction={handleRowActions}>
                        </lightning-datatable>  
                    </template> 
                    <template if:true={error}>  
                        {error}                 
                    </template> 
                    </div>  
                </div>  
                <!-- </div> -->
                <template if:true={totalRecords}> 
                    <div if:true={isDesktop}>
                        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;">
                    
                            <!--PAGE NAVIGATION-->
                            <div class="slds-align_absolute-center" style="height:5rem">
                                <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                                <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                                &nbsp;
                                <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                                &nbsp;
                                <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                            </div>
                
                            <!--TOTAL RECORDS-->
                            <div class="slds-clearfix">
                                <div class="slds-float_right ">
                                    <span class="slds-badge"> Total Records: {totalRecords}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                <!-- if there is no facilities -->
                <template if:true={noRecordsFlag}>
                    <div class="slds-grid  slds-grid_align-spread slds-m-left_large" style="padding-top: 0.5em; font-size:15px;">
                        <b style="color: Red"><I> No Issues Registed </I> </b>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>

    <template if:true={isOpenModal}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
          class="slds-modal slds-fade-in-open slds-modal_medium" role="dialog" tabindex="-1">
        
          <div class="slds-modal__container ">
            <!-- modal header start -->
            <header class="slds-modal__header">
              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                onclick={hideModalBox}>
                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                  size="small"></lightning-icon>
                <span class="slds-assistive-text">Close</span>
              </button>
              <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{headeringName}</h2>
            </header>
            <!-- modal body start -->
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
              <lightning-record-edit-form object-api-name="Case" record-id={recordId} onsuccess={handleSuccess} onsubmit={handleSubmit} >
                <lightning-messages></lightning-messages>
                <div class="slds-grid slds-wrap">


                  <!-- <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-left_medium">
                        <lightning-input-field field-name="Type_of_Issue__c" onchange={handleChange}></lightning-input-field>
                    </div>
                  </div> -->
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Issue_Description__c" required="true"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Date__c" value={selectedDate} required="true"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Subject" required="true"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Priority" required="true"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Description" required="true"></lightning-input-field>
                        </div>
                    </div> 
                    <template if:true={isStatusFlag}>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium" >
                                <lightning-input-field field-name="Status_1__c" value={status} required="true" onchange={handleChangeStatus} ></lightning-input-field>
                            </div>
                        </div> 
                    </template>
                    <template if:true={isRaised}>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium" >
                                <lightning-input-field field-name="Raised_By__c" value={userId} required="true" disabled="true"></lightning-input-field>
                            </div>
                        </div>
                    </template>
                        
                    <!-- <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Client__c"></lightning-input-field>
                        </div>
                    </div> -->
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Email__c" value={email} disabled="true" ></lightning-input-field>
                        </div>
                    </div> 
                    <template if:true={isStaff}>
                        <template if:true={isNew}>
                            <div class="slds-size_1-of-2">
                                <div class="slds-m-right_medium slds-m-left_medium" >
                                    <lightning-input type="file" onchange={onFileUpload} name="uploadFile" label="Upload File" style="margin-left:5px;">  
                                    </lightning-input>
                                    <div class="slds-text-body_small">{fileName}</div>
                                </div>
                            </div>
                            
                            <template if:true={showSpinner}>
                                <lightning-spinner alternative-text="Uploading the file......" size="medium">                        
                                    </lightning-spinner>
                            </template>
                            <template if:true={isattachError}>
                                <p style="color:red">File Size Can not exceed 512MB</p>                                  
                            </template>  
                        </template>
                    </template>
                    <template if:true={isStaff}>
                        <template if:false={isEdit}>                             
                        </template>
                    </template>
                    <template if:true={isOrgAdmin}>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Assign_Tesseract_Staff__c"></lightning-input-field>
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Comments_Added_by_Tesseract_Teams__c"></lightning-input-field>
                            </div>
                        </div>
                    </template>
                    <div if:true={viewfileName}><!-- Uploaded File:&nbsp;<a href={viewfileName} target="_blank">view file</a> -->
                        <div class="slds-m-right_medium slds-m-left_medium" style="margin-top:20px;">
                            <label style="margin-right:65px;color:#5A5A5A;font:12px;">Uploaded File</label>
                            <a href={viewfileName} data-url={viewfileName}  
                            onclick={handleView}>View File</a>
                        </div>
                    </div>
                    
                    <template if:false={isOrgAdmin}>                        
                    </template>
                </div>
                <div class="slds-align_absolute-center slds-m-around_small">
                    <lightning-button label={buttonName} variant="brand" type="submit" class="slds-m-around_small"></lightning-button>
                  <lightning-button label="Cancel" variant="brand" onclick={hideModalBox}
                    class="slds-m-around_small"></lightning-button>
                </div>
              </lightning-record-edit-form>
            </div>
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isModalOpen}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
         class="slds-modal slds-fade-in-open slds-modal_large" style="height: 750px;" role="dialog" tabindex="-1">
        
          <div class="slds-modal__container">
            <!-- modal header start -->
            <header class="slds-modal__header">
              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                onclick={closeModal}>
                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                  size="small"></lightning-icon>
                <span class="slds-assistive-text">Close</span>
              </button>
              <h2  class="slds-text-heading_medium slds-hyphenate">View Attachment</h2>
            </header>
            <!-- modal body start -->
            <div class="slds-modal__content slds-p-around_medium">
              <iframe src={currentUrl} width="1300px" height="1000px" ></iframe>
              </div>
              <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
              </footer>
            <!-- modal footer start-->
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
</template>
