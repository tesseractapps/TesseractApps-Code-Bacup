<template>
    <div class="calendar-container">
        <div class="calendar-header">
           <!--  <button onclick={prevMonth}>←</button>
            <h2>{monthName} {year}</h2>
            <button onclick={nextMonth}>→</button> -->
            <lightning-button-icon
            icon-name="utility:chevronleft"
            onclick={prevMonth}
            style="background:white;color:red;border-radius:5px; "
            alternative-text="Previous Month">
        </lightning-button-icon>
    
        <lightning-button
            style="margin: 0 5px;"
            label={monthAndYear}
            onclick={navigateToToday}>
        </lightning-button>
    
        <lightning-button-icon
            icon-name="utility:chevronright"
            onclick={nextMonth}
            style="background:white;border-radius:5px;"
            alternative-text="Next Month">
        </lightning-button-icon>
        </div>
        <div class="calendar-grid">
            <template for:each={daysOfWeek} for:item="day">
                <div class="day-name" key={day}>{day}</div>
            </template>
            <template for:each={calendarDays} for:item="day">
                <!-- <div key={day.key} class={day.class} title={day.tooltip}>
                    <div class={date}>{day.date}</div>
                    <template if:true={day.services}>
                        <div class="service-summary">
                            
                                {day.firstServiceName}
            <template if:true={day.hasMore}>
                <a class="service-link" data-date={day.dateStr} onclick={handleServiceClick}> &nbsp;+{day.moreCount} more </a>
            </template>
                           
                        </div>
                    </template>
                </div> -->
                <div key={day.key} class={day.class} title={day.tooltip}>
                    <!-- Main content area -->
                    <div class="main-content">
                        <div class="left-info">
                             <!-- <template if:true={day.holidayName}> -->
                                <!-- <div class="holiday-name">Holiday</div> --> <!-- <div class="holiday-name">{day.holidayName}</div> -->
                            <!-- </template>  -->
                            <!-- <template if:true={day.services}>
                                
                                <div class="service-name description" style="font-weight: bold;">{day.firstServiceName}</div>
                                <div class="service-time description">{day.firstServiceTime}</div>
                            
                            </template> -->
                            <template for:each={day.entries} for:item="entry">
                                <div key={entry.name}>
                                    <div class="service-name description" style="font-weight: bold;font-size:12px;text-align:left;">{entry.name}</div>
                                    <template if:false={entry.hyper}>
                                    <div class="service-time description" style="font-size:10px;text-align:left;">{entry.time}</div>
                                    </template>
                                    <template if:true={entry.hyper}>
                                    <div><a  class="service-time description" data-id={entry.id} style="font-size:10px;text-align:left;" onclick={handleEdit}>{entry.time}</a></div>
                                </template>
                                </div>
                            </template>
                             
                        </div>
                        <div style="font-weight: bold;">{day.date}</div>
                    </div>
            
                    <!-- Bottom footer: +more and icon -->
                    <div class="bottom-bar">
                        <div if:true={day.date}>
                        <template if:true={day.hasMore}>
                            <a class="more-link" data-date={day.dateStr} style="font-style: italic;" onclick={handleServiceClick}><!-- + {day.moreCount} --> more</a>
                        </template>
                       <!--  <template if:false={day.hasMore}>
                            <a class="more-link" data-date={day.dateStr} onclick={handleServiceClick}>Available</a>
                        </template> -->
                    </div>
                        
                    </div>
                    <div if:true={day.date}>
                    <div  if:true={day.noService}>
                        <lightning-icon 
                            icon-name="action:new" 
                            data-date={day.dateStr} 
                            alternative-text="Add" 
                            size="xx-small" 
                            class="add-icon" 
                            
                            style="position: absolute;bottom: 38%;right: 43%;transform: scale(0.65);"
                            onclick={handleAddDescription}>
                        </lightning-icon>
                    </div>
                    <div  if:false={day.noService}>
                        <lightning-icon 
                            icon-name="action:new" 
                            data-date={day.dateStr} 
                            alternative-text="Add" 
                            size="xx-small" 
                            class="add-icon" 
                            style="position: absolute;bottom: 4px;right: 0px;transform: scale(0.65);"
                            onclick={handleAddDescription}>
                        </lightning-icon>
                    </div>
                </div>
                </div>
            </template>
        </div>
        <div class="calendar-legend">
            <div class="legend-item">
                <span class="legend-color today-indicator"></span> Today
            </div>
            <div class="legend-item">
                <span class="legend-color has-service-indicator"></span> Occupied
            </div>
            <div class="legend-item">
                <span class="legend-color no-service-indicator"></span> Available
            </div>
            <div class="legend-item">
                <span class="legend-color holiday-indicator"></span> Holiday
            </div>
        </div>
    </div>
    <template if:true={isPopoverVisible}>
       <!--  <section class="popover">
            <h3>Services on {selectedDate}</h3>
            <ul>
                <template for:each={selectedServices} for:item="service">
                    <li key={service.Id}>
                        {service.Service_Type_Name__c} ({service.start_datetime__c} - {service.end_datetime__c})
                    </li>
                </template>
            </ul>
            <button onclick={closePopover}>Close</button>
        </section> -->
        <div class="popup" style={popupStyle}>
            <span class="close-icon" style="cursor: pointer;" onclick={closePopover}>✖</span>
            <h3 class="slds-m-bottom_small" style="font-weight:bold;">Assigned on {selectedDate}</h3>
            <ol class="styled-list">
                <template for:each={selectedServices} for:item="service" for:index="index" >
                    <li key={service.Id} class="slds-m-bottom_x-small">
                        <strong>{service.Resource_Name__c}</strong><br/>
                        {service.Service_Type_Name__c}
                        ({service.formattedStart} - {service.formattedEnd})
                    </li>
                </template>
            </ol>
            <h3 class="slds-m-bottom_small" style="font-weight:bold;">Unassigned on {selectedDate}</h3>
            <ol class="styled-list">
                <template for:each={selectedavailability} for:item="service" for:index="index" >
                    <li key={service.Id} class="slds-m-bottom_x-small">
                        <strong>{service.Shift_Type__c}</strong><br/>
                        <a class="more-link" data-id={service.Id} onclick={handleEdit}> ({service.formattedStart} - {service.formattedEnd})</a>
                    </li>
                </template>
            </ol>
        </div>
    </template>

    <template if:true={editButtonModule}>
        <div class="blur-overlay"></div>
        <div class="right-align1" style="width: 80%;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1% 2%;">
                <p style="font-weight: bold; font-size: 140%;">{buttonTitle}</p>
                
                <div style="display: flex; gap: 10px;">
                    <lightning-button 
                        label={buttonTitle} 
                        title={buttonTitle}  
                        onclick={handlesavebutton} 
                        variant="brand">
                    </lightning-button>
            
                    <lightning-button 
                        label="Back" 
                        variant="brand" 
                        onclick={handleClose}>
                    </lightning-button>
                </div>
            </div>                        
    
            <div class="slds-grid slds-wrap">
                <!-- Left Column -->
                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_medium">
                    <div class="container-box">
    
                        <!-- Shift Type Toggle -->
                        <div class="toggle-bar" onclick={handleSectionToggle} data-id="staffDetails1">
                            <span>Shift Type</span>
                        </div>
    
                        <!-- Shift Type Section -->
                        <div class="section-content" data-section="staffDetails1">
                            <br/>
                            <template if:true={sectionFlags.staffDetails1}>
                                <div class="slds-grid slds-wrap">
    
                                    <!-- Date (Today, Disabled) -->
                                    <div class="slds-size_1-of-2 slds-p-around_small">
                                        <div class="floating-label">
                                            <span class="label-text-drop">Date</span>
                                            <lightning-input 
                                                type="date" 
                                                value={todayDate} 
                                                disabled 
                                                variant="label-hidden">
                                            </lightning-input>
                                        </div>
                                    </div>
    
                                    <!-- Shift Type -->
                                    <div class="slds-size_1-of-2 slds-p-around_small">
                                        <div class="floating-label">
                                            <span class="label-text-drop"><span style="color:red">*</span>Shift Type</span>
                                            <lightning-combobox 
                                                label="Shift Type" 
                                                variant="label-hidden" 
                                                value={shiftTypeValue} 
                                                options={shiftTypeOptions} 
                                                onchange={handleShiftTypechange} 
                                                required>
                                            </lightning-combobox>
                                        </div>
                                    </div>
    
                                    <!-- Start Time -->
                                    <div class="slds-size_1-of-2 slds-p-around_small">
                                        <div class="floating-label">  
                                            <span class="label-text-drop"><span style="color:red">*</span>Start Time</span>
                                            <c-time-picker 
                                                selected-hour={startTimeSelectedHour}
                                                selected-minute={startTimeSelectedMinute}
                                                is-am={startTimeAMPM}
                                                displayed-time={AddShiftStartTimeAMPM} 
                                                onsavetimefromchild={handleStartTimeChange}>
                                            </c-time-picker>
                                        </div>
                                    </div>
    
                                    <!-- End Time -->
                                    <div class="slds-size_1-of-2 slds-p-around_small">
                                        <div class="floating-label">
                                            <span class="label-text-drop"><span style="color:red">*</span>End Time</span>
                                            <c-time-picker 
                                                displayed-time={AddShiftEndTimeAMPM}
                                                selected-minute={endTimeSelectedMinute}
                                                selected-hour={endTimeSelectedHour}
                                                is-am={endTimeAMPM}  
                                                onsavetimefromchild={handleEndTimeChange}>
                                            </c-time-picker>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_medium">
                    <div class="container-box">
    
                        <!-- Recurring Toggle -->
                        <div class="toggle-bar" onclick={handleSectionToggle} data-id="staffDetails1">
                            <span>Recurring</span>
                        </div>
    
                        <!-- Recurring Section -->
                        <div class="section-content" data-section="staffDetails1">
                            <br/>
                            <template if:true={sectionFlags.staffDetails1}>
                                <div class="slds-grid slds-wrap">
    
                                    <!-- Recurring Checkbox -->
                                    <div>
                                        <label style="display: flex; gap: 2%; padding: 3% 0 0% 10%;">
                                            <span>Recurring</span>
                                            <lightning-input 
                                                type="checkbox" 
                                                variant="label-hidden" 
                                                checked={AddShiftRecurringCheckboxValue} 
                                                onchange={handleReccuringChange}>
                                            </lightning-input>
                                        </label>
                                    </div>
                                    <div class="slds-size_1-of-2 slds-p-around_small">
                                    </div>
                                </div>
    
                                <div class="slds-grid slds-wrap">
    
                                    <!-- Recur Type -->
                                    <div class="slds-size_1-of-4 slds-p-around_small">
                                        <div class="floating-label">
                                            <span class="label-text-drop">Recur</span>
                                            <lightning-combobox 
                                                name="typeOfRecurOption"  
                                                class="typeOfRecurOption" 
                                                variant="label-hidden" 
                                                options={recurOptions}  
                                                value={RecurValue} 
                                                onchange={handleRecurChange}>
                                            </lightning-combobox>
                                        </div>
                                    </div>
    
                                    <!-- Recur Every -->
                                    <div class="slds-size_1-of-3 slds-p-around_small">
                                        <div class="floating-label">
                                            <span class="label-text-drop">Recur Every</span>
                                            <lightning-combobox 
                                                placeholder="Select Recurrence" 
                                                class="recurEvery" 
                                                name="recurEvery" 
                                                variant="label-hidden" 
                                                options={recurEveryOptions}  
                                                value={recurEveryValue} 
                                                onchange={handleRecurEveryChange}>
                                            </lightning-combobox>
                                        </div>
                                    </div>
    
                                    <!-- End Date -->
                                    <div class="slds-size_1-of-3 slds-p-around_small">
                                        <div class="floating-label">
                                            <span class="label-text-drop">End Date</span>
                                            <lightning-input 
                                                type="date"  
                                                name="recurEndDate" 
                                                class="recurEndDate" 
                                                value={recurEndDate} 
                                                variant="label-hidden" 
                                                onchange={handleRecurEndDateChange}>
                                            </lightning-input>
                                        </div>
                                    </div>
    
                                    <!-- Weekly Recur -->
                                    <template if:true={isRecurWeekFlag}>
                                        <div class="slds-grid slds-wrap">
                                            <template for:each={weekDays} for:item="day">
                                                <div key={day} class="slds-size_1-of-7 slds-p-around_small">
                                                    <span>{day}</span>
                                                    <lightning-input 
                                                        type="checkbox" 
                                                        name={day} 
                                                        variant="label-hidden" 
                                                        class="slds-p-left_small" 
                                                        onchange={handleCheckboxChange}>
                                                    </lightning-input>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
    
                                    <!-- Monthly Recur -->
                                    <template if:true={isRecurmontlyFlag}>
                                        <div class="slds-size_1-of-4 slds-p-around_small">
                                            <p class="slds-p-left_small">Set for Day</p>
                                        </div>
                                        <div class="slds-size_1-of-4 slds-p-around_small">
                                            <div class="floating-label">
                                                <span class="label-text-drop">Recur Every</span>
                                                <lightning-combobox 
                                                    name="monthLyOptions" 
                                                    class="monthLyOptions" 
                                                    variant="label-hidden" 
                                                    options={monthLyOptions} 
                                                    value={monthOfDay} 
                                                    onchange={handleMonthlyOptionChange}>
                                                </lightning-combobox>
                                            </div>
                                        </div>
                                        <div class="slds-size_1-of-2 slds-p-around_small"></div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slds-grid slds-wrap">
                <!-- Left Column -->
                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_medium">
                    <div class="container-box">
    
                        <!-- Recurring Toggle -->
                        <div class="toggle-bar" onclick={handleSectionToggle} data-id="staffDetails1">
                            <span>Staff Preferences</span>
                        </div>
    
                        <!-- Recurring Section -->
                        <div class="section-content" data-section="staffDetails1">
                            <br/>
                            <template if:true={sectionFlags.staffDetails1}>
                                <div class="slds-grid slds-wrap">
    
                                    <!-- Recurring Checkbox -->
                                    <div class="slds-size_1-of-2 slds-p-around_small">
                                        <label style="display: flex; gap: 2%; padding: 3% 0 0% 10%;">
                                            <div class="floating-label">
                                            <span class="label-text-drop"><span style="color:red">*</span>Role</span>
                                            <lightning-combobox 
                                                name="roleOptions"  
                                                class="roleOptions" 
                                                variant="label-hidden" 
                                                options={roleOptions}  
                                                value={roleValue} 
                                                onchange={handleRoleChange}>
                                            </lightning-combobox>
                                            </div>
                                        </label>
                                    </div>
                                    <div class="slds-size_1-of-2 slds-p-around_small"></div>

                                </div>

                                <div class="slds-grid slds-wrap" style="Padding:2%">
                                    <template if:true={rolestable}>
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                            <thead>
                                                <tr>
                                                    <th>Staff Name</th>
                                                    <th>Priority</th>
                                                    <th>Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={roleRows} for:item="row" for:index="index">
                                                    <tr key={row.id}>
                                                        <!-- Staff Combobox -->
                                                        <td>
                                                            <lightning-combobox
                                                                variant="label-hidden"
                                                                placeholder="Select Staff"
                                                                value={row.selectedStaff}
                                                                options={staffOptions}
                                                                data-index={index}
                                                                onchange={handleStaffChange}>
                                                            </lightning-combobox>
                                                        </td>
                                                
                                                        <!-- Priority Combobox -->
                                                        <td>
                                                            <lightning-combobox
                                                                variant="label-hidden"
                                                                value={row.priority}
                                                                options={priorityOptions}
                                                                data-index={index}
                                                                onchange={handlePriorityChange}>
                                                            </lightning-combobox>
                                                        </td>
                                                
                                                        <!-- Action Buttons -->
                                                        <td class="slds-button-group" role="group">
                                                            <lightning-icon 
                                                                icon-name="action:delete"  
                                                                alternative-text="Delete"  
                                                                size="xx-small" 
                                                                onclick={handleDelete} 
                                                                data-id={row.id}
                                                                data-index={index}>
                                                            </lightning-icon>
                                                
                                                            <template if:true={row.isLast}>
                                                                <lightning-icon 
                                                                    icon-name="action:new" 
                                                                    alternative-text="new" 
                                                                    size="x-small" 
                                                                    title="new" 
                                                                    onclick={handleAddRow} 
                                                                    style="margin-left:25%;margin-top:2%; background-color:#0099de;transform: scale(0.8);">
                                                                </lightning-icon>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>                                                
                                            </tbody>
                                        </table>
                                    </template>                                                                                                           
                                </div>                                
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_medium">
                    <div class="container-box">
    
                        
                        <div class="toggle-bar" onclick={handleSectionToggle} data-id="staffDetails1">
                            <span>Add Service</span>
                        </div>
    
                        
                        <div class="section-content" data-section="staffDetails1">
                            <br/>
                            <template if:true={sectionFlags.staffDetails1}>
                                <div class="slds-grid slds-wrap">
    
                                    
                                    <div class="slds-size_1-of-2 slds-p-around_small">
                                        <div class="floating-label">
                                            <span class="label-text-drop"><span style="color:red">*</span>Service Type</span>
                                            <lightning-combobox 
                                                label="Shift Type" 
                                                variant="label-hidden" 
                                                value={serviceTypevalue} 
                                                options={serviceTypeOptions} 
                                                onchange={handleserviceTypchange} 
                                                required>
                                            </lightning-combobox>
                                        </div>
                                    </div>
    
                                    
                                    <div class="slds-size_1-of-2 slds-p-around_small">
                                        
                                    </div>                              
                                </div>
                                <template if:true={CatlogTabel}>
                                <div class="slds-grid slds-wrap" style="Padding: 2%; height: 250px; overflow-y: auto;" >
                                    <template if:true={serviceEditGroupName}>
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>Select</th>
                                                    <th>Support Item Name</th>
                                                    <th>Support Item Number</th>
                                                    <th>Amount</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={serviceEditGroupName} for:item="row1">
                                                    <tr key={row1.Id}>
                                                        <td>
                                                            <input 
                                                                type="radio"  
                                                                name="editNdisRadioGroup" 
                                                                data-id={row1.Id} 
                                                                checked={row1.isSelected}
                                                                onchange={HandleEditNdisCheckBox}
                                                            />
                                                        </td>
                                                        <td>{row1.Support_Item_Name__c}</td>
                                                        <td>{row1.Support_Item_Number__c}</td>
                                                        <td>{row1.amount}</td>
                                                    </tr>
                                                </template>                                                
                                            </tbody>
                                        </table>
                                    </template>                                    
                                </div>
                                </template>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>   
</template>
