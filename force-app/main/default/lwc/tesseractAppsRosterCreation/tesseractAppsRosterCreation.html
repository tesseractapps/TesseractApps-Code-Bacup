<template>
  <template if:true={isHome}>
    <div class="main-container">
      <template if:true={isStaffView}>
        <div
          class="slds-grid slds-wrap slds-grid_align-spread slds-p-around_x-small"
        >
          <div class="slds-grid slds-grid_align-start">
            <div style="display: flex; align-items: center">
              <div class="roster-toggle-container">
                <div class="tab-view-wrapper">
                  <button
                    class={participantTabClass}
                    onclick={handleParticipantView}
                  >
                    {participantPreferredName} View
                  </button>
                  <button class={staffTabClass} onclick={handleStaffView}>
                    Staff View
                  </button>
                </div>
              </div>
            </div>
            <div class="slds-col">
              <div class="facility-multiselect" onclick={showFacilityDropdown}>
                <!-- BUBBLE SCROLLER -->
                <div
                  class="facility-bubble-container facility-scroll-horizontal"
                >
                  <template for:each={selectedFacilities} for:item="facility">
                    <span key={facility.value} class="facility-bubble">
                      {facility.label}
                      <span
                        class="facility-remove"
                        data-id={facility.value}
                        onclick={removeFacility}
                        >×</span
                      >
                    </span>
                  </template>

                  <!-- Input appears inline with bubbles -->
                  <input
                    type="text"
                    class="facility-search-input"
                    placeholder="Search"
                    value={facilitySearchTerm}
                    oninput={handleFacilitySearchChange}
                    onfocus={showFacilityDropdown}
                    onclick={stopPropagation}
                  />
                </div>

                <!-- DROPDOWN BELOW -->
                <template if:true={showFacilityOptions}>
                  <div
                    class="facility-dropdown custom-scroll"
                    onclick={stopPropagation}
                  >
                    <template
                      for:each={facilityCheckboxOptions}
                      for:item="facility"
                    >
                      <label key={facility.value} class="facility-option">
                        <input
                          type="checkbox"
                          value={facility.value}
                          checked={facility.checked}
                          onchange={handleFacilityCheckboxChange}
                        />
                        {facility.label}
                      </label>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <div
            class="slds-col"
            style="
              flex: 1 1 auto;
              justify-content: flex-end;
              display: flex;
              gap: 10px;
            "
          >
            <div style="display: flex; gap: 10px; align-items: center">
              <!-- RIGHT SIDE: Filter + Pagination (always right-aligned) -->

              <div
                class="slds-grid slds-grid_align-end slds-grid_vertical-align-center"
                style="gap: 0.5rem; padding-right: 1%"
              >
                <div>
                  <template if:true={shiftPublishStatus}>
                    <p
                      class="status-text"
                      style="
                        font-size: 14px;
                        white-space: nowrap;
                        font-weight: bold;
                      "
                    >
                      <i
                        class={statusIconClass}
                        style="vertical-align: middle; margin-right: 4px"
                      >
                        {statusIcon}
                      </i>

                      <span style={statusColorStyle}>{shiftPublishStatus}</span>
                    </p>
                  </template>
                </div>

                <button
                  class="toggle-button"
                  onclick={togglePopoverforShiftType}
                  style="
                    background: none;
                    border: none;
                    display: flex;
                    align-items: center;
                  "
                >
                  <i class="material-icons edit-icon">filter_alt</i>
                </button>

                <lightning-button-icon
                  icon-name="utility:chevronleft"
                  onclick={loadPreviousWeek}
                  style="cursor: pointer"
                >
                </lightning-button-icon>

                <div class={dateClass} style={datePickerStyle}>
                  <span class="label-text-drop">Date</span>
                  <lightning-input
                    type="date"
                    variant="label-hidden"
                    onchange={handleDatePickerChange}
                    value={formattedDate}
                    name="date"
                  >
                  </lightning-input>
                </div>

                <lightning-button-icon
                  icon-name="utility:chevronright"
                  onclick={loadNextWeek}
                  style="cursor: pointer"
                >
                </lightning-button-icon>
              </div>

              <!--  <button class="custom-create-btn" onclick={handleautoSchedule} title="Auto Schedule">Auto Schedule</button>
                  <button class="custom-create-btn" onclick={handlePublishShifts} title="Publish">Publish</button>
                  <button class="custom-create-btn" onclick={handlerosterInvoices} title="Manage Invoices">Manage Invoices</button> -->
            </div>
            <div>
              <div class="settings-dropdown-container">
                <!-- Settings Button -->
                <button
                  class="settings-button slds-button slds-button_icon slds-button_icon-container"
                  style="margin-top: 6px"
                  onclick={toggleDropdown}
                  aria-label="Settings menu"
                  aria-expanded={isOpen}
                  aria-haspopup="true"
                >
                  <i
                    class="material-icons add-icon"
                    style="font-size: 36px; color: black !important"
                    >more_vert</i
                  >
                </button>

                <!-- Dropdown Menu -->
                <div if:true={isOpen} class="dropdown-container">
                  <div
                    class={dropdownClass}
                    role="menu"
                    aria-orientation="vertical"
                  >
                    <!-- In this chat -->
                    <button
                      class="menu-item"
                      data-action="autoSchedule"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >acute</i
                      >
                      <span class="menu-label">Auto Schedule</span>
                    </button>

                    <!-- Open in new window -->
                    <button
                      class="menu-item"
                      data-action="publish"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >published_with_changes</i
                      >
                      <span class="menu-label">Publish</span>
                    </button>

                    <!-- Schedule meeting -->
                    <button
                      class="menu-item"
                      data-action="manageInvoices"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >request_quote</i
                      >
                      <span class="menu-label">Manage Invoices</span>
                    </button>

                    <!-- Screen sharing -->
                    <button
                      class="menu-item"
                      data-action="rosterSettings"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >settings</i
                      >
                      <span class="menu-label">Roster Settings</span>
                    </button>

                    <!-- Mark as unread -->
                    <button
                      class="menu-item"
                      data-action="underOverRoasting"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >difference</i
                      >
                      <span class="menu-label"
                        >Under/Over Efficiency Report</span
                      >
                    </button>

                    <template if:true={isExpandedView}>
                      <button
                        class="menu-item"
                        data-action="compactView"
                        onclick={handleMenuItemClick}
                        role="menuitem"
                      >
                        <i
                          class="material-icons add-icon"
                          style="font-size: 24px"
                          >collapse_content</i
                        >
                        <span class="menu-label">Compact View</span>
                        <span class="shortcut-hint">Ctrl + Shift + C</span>
                      </button>
                    </template>

                    <template if:false={isExpandedView}>
                      <button
                        class="menu-item"
                        data-action="expandView"
                        onclick={handleMenuItemClick}
                        role="menuitem"
                      >
                        <i
                          class="material-icons add-icon"
                          style="font-size: 24px"
                          >pan_zoom</i
                        >
                        <span class="menu-label">Expand View</span>
                        <span class="shortcut-hint">Ctrl + Shift + E</span>
                      </button>
                    </template>

                    <button
                      class="menu-item"
                      data-action="shiftReport"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >assignment</i
                      >
                      <span class="menu-label">Shift Report</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <template if:false={isParticipanTViewEnable}>
          <div
            class="sidebar1"
            if:true={isPopoverVisibleforShiftType}
            data-id="shift-type-popover"
          >
            <div class="sidebar-content" onclick={stopPropagation}>
              <div class="close-btn" onclick={closePopoverforShiftType}>
                &times;
              </div>
              <!-- <lightning-icon   icon-name="utility:close"  size="x-small" style="float: right;" onclick={closePopover} > -->

              <div style="border-radius: 5px 5px 0 0">
                <h5 class="facility-header">Shift Type</h5>
                <div
                  class="box-facility-role"
                  style="
                    margin-bottom: 10px;
                    padding: 0px 15px;
                    overflow-x: HIDDEN;
                    overflow-y: AUTO;
                    height: 12vh;
                  "
                >
                  <lightning-checkbox-group
                    label=""
                    name="ShiftTypeforFilter"
                    options={shiftTypeOptions}
                    value={shiftTypefilterValue}
                    onchange={handleCheckBoxChange}
                  ></lightning-checkbox-group>
                </div>
                <!-- Role Type here -->

                <!-- <h5 class="role-header">Status</h5>
                <div
                  class="box-facility-role"
                  style="
                    margin-bottom: 10px;
                    padding: 0px 15px;
                    overflow: hidden auto;
                    height: 9vh;
                  "
                >
                  <template if:true={OrgNisationRoles}>
                    <lightning-checkbox-group
                      label=""
                      name="StatusforFilter"
                      options={StatusOptionsforfilter}
                      value={statusfilterValue}
                      onchange={handleCheckBoxChange}
                    ></lightning-checkbox-group>
                  </template>
                </div> -->
              </div>
              <div></div>
            </div>
          </div>
        </template>
        <div
          class="slds-grid slds-p-bottom_x-small"
          style="width: 100%; align-items: center"
        >
          <!-- LEFT SIDE: role-tabs-bar (conditionally shown) -->
          <div style="flex-grow: 1">
            <template if:false={isParticipanTViewEnable}>
              <div class="role-tab-scroll-container">
                <lightning-button-icon
                  icon-name="utility:chevronleft"
                  onclick={scrollTabsLeft}
                  alternative-text="Scroll Left"
                  variant="bare"
                  size="small"
                >
                </lightning-button-icon>

                <div
                  class="role-tab-wrapper"
                  data-id="roleTabsContainer"
                  onscroll={handleScroll}
                >
                  <template for:each={computedRoleTabs} for:item="role">
                    <button
                      key={role.value}
                      class={role.computedClass}
                      data-role={role.value}
                      onclick={handleRoleTabClick}
                    >
                      {role.label}
                    </button>
                  </template>
                </div>

                <lightning-button-icon
                  icon-name="utility:chevronright"
                  onclick={scrollTabsRight}
                  alternative-text="Scroll Right"
                  variant="bare"
                  size="small"
                >
                </lightning-button-icon>
              </div>
            </template>
          </div>

          <!-- RIGHT SIDE: Filter + Pagination (always right-aligned) -->
          <!-- <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center" style="gap: 0.5rem;padding-right:1%;">
        <button class="toggle-button" onclick={togglePopoverforShiftType}
                style="background: none; border: none; display: flex; align-items: center;">
            <i class="material-icons edit-icon">filter_alt</i>
        </button>

        <lightning-button-icon icon-name="utility:chevronleft" onclick={loadPreviousWeek}
                        style="cursor: pointer;">
        </lightning-button-icon>

        <div class="floating-label-new" style={datePickerStyle}>
            <span class="label-text-drop">Date</span>
            <lightning-input type="date" variant="label-hidden"
                             onchange={handleDatePickerChange} value={formattedDate}>
            </lightning-input>
        </div>

        <lightning-button-icon icon-name="utility:chevronright" onclick={loadNextWeek}
                        style="cursor: pointer;">
        </lightning-button-icon>
    </div> -->
          <!-- RIGHT SIDE: Legend + Filter + Pagination -->
          <div
            class="slds-grid slds-grid_align-end slds-grid_vertical-align-center"
            style="gap: 0.5rem; padding-right: 1%"
          >
            <!-- ✅ LEGEND added just before filter -->
            <div
              class="status-legend slds-grid slds-grid_vertical-align-center slds-theme_default slds-border_left slds-border_right slds-border_bottom"
              style="
                gap: 1rem;
                padding: 0.5%;
                border-radius: 0.25rem;
                background: #f4f6f9;
              "
            >
              <template for:each={processedStatusOptions} for:item="status">
                <span
                  key={status.value}
                  class={status.wrapperClass}
                  data-value={status.value}
                  onclick={handleStatusLegendClick}
                >
                  <span class={status.dotClass}></span> {status.label}
                </span>
              </template>
            </div>
          </div>
        </div>

        <template if:true={isParticipanTViewEnable}>
          <div
            class="sidebarInParticpantView"
            if:true={isPopoverVisible}
            data-id="participant-popover"
          >
            <div class="sidebar-content" onclick={stopPropagation}>
              <div class="close-btn" onclick={closePopover}>&times;</div>
              <!-- <lightning-icon   icon-name="utility:close"  size="x-small" style="float: right;" onclick={closePopover} > -->

              <div style="border-radius: 5px 5px 0 0">
                <h5 class="facility-header">{facilityPreferredName} Name</h5>
                <div
                  class="box-facility-role"
                  style="
                    margin-bottom: 10px;
                    padding: 0px 15px;
                    overflow-x: HIDDEN;
                    overflow-y: AUTO;
                    height: 30vh;
                  "
                >
                  <template if:true={facilityOptions}>
                    <lightning-checkbox-group
                      label=""
                      name="Facility"
                      options={facilityOptions}
                      value={facilityValue}
                      onchange={handleCheckBoxChange}
                    >
                    </lightning-checkbox-group>
                  </template>
                </div>
              </div>
            </div>
          </div>
          <div
            class="sidebar2"
            if:true={isPopoverVisibleforShiftType}
            data-id="shift-type-popover-participant"
          >
            <div class="sidebar-content" onclick={stopPropagation}>
              <div class="close-btn" onclick={closePopoverforShiftType}>
                &times;
              </div>
              <!-- <lightning-icon   icon-name="utility:close"  size="x-small" style="float: right;" onclick={closePopover} > -->

              <div style="border-radius: 5px 5px 0 0">
                <h5 class="facility-header">Shift Type</h5>
                <div
                  class="box-facility-role"
                  style="
                    margin-bottom: 10px;
                    padding: 0px 15px;
                    overflow-x: HIDDEN;
                    overflow-y: AUTO;
                    height: 18vh;
                  "
                >
                  <lightning-checkbox-group
                    label=""
                    name="ShiftTypeforFilter"
                    options={shiftTypeOptions}
                    value={shiftTypefilterValue}
                    onchange={handleCheckBoxChange}
                  ></lightning-checkbox-group>
                </div>
                <!-- Role Type here -->

                <!-- <h5 class="role-header">Status</h5>
                <div
                  class="box-facility-role"
                  style="
                    margin-bottom: 10px;
                    padding: 0px 15px;
                    overflow: hidden auto;
                    height: 9vh;
                  "
                >
                  <template if:true={OrgNisationRoles}>
                    <lightning-checkbox-group
                      label=""
                      name="StatusforFilter"
                      options={StatusOptionsforfilter}
                      value={statusfilterValue}
                      onchange={handleCheckBoxChange}
                    ></lightning-checkbox-group>
                  </template>
                </div> -->
              </div>
              <div></div>
            </div>
          </div>
        </template>

        <template if:false={isParticipanTViewEnable}>
          <template for:each={staffData} for:item="role">
            <!-- <div class="container-box" key={role.roleName} name={role.roleName} label={role.roleName} onclick={handleAccordian}> -->
            <!-- <div  class="toggle-bar" onclick={handleSectionToggle} data-id={role.roleName}>
                  <span>{role.roleName}</span>
                  <span style="cursor: default;">{role.arrowcode}</span>
                </div> -->
            <template if:true={role.isExpanded}>
              <div
                class="role-content role-section"
                key={role.roleName}
                name={role.roleName}
              >
                <div class="slds-table" style="background-color: transparent">
                  <table
                    class="slds-table slds-table_fixed-layout slds-table_resizable-cols glow-hover table1"
                    role="grid"
                  >
                    <thead>
                      <tr>
                        <td class="firstcellwidth">
                          <div class="staff-member">
                            <div class="floating-label-new">
                              <span class="label-text-drop"
                                >Search by Name</span
                              >
                              <lightning-input
                                type="search"
                                variant="label-hidden"
                                value={searchName}
                                onchange={handleSearchName}
                              ></lightning-input>
                            </div>
                          </div>
                        </td>

                        <template for:each={role.weekData} for:item="weekDay">
                          <td key={weekDay.date} class={weekDay.holidayColor}>
                            <div class="day-cell-header">
                              <div class="day-content-wrapper">
                                <!-- Left: Day + Date + Holiday -->
                                <div class="day-left">
                                  <div class="day-name">{weekDay.day}</div>
                                  <div class="day-date">
                                    {weekDay.UiFormattedDate}
                                  </div>
                                </div>
                                <div class={weekDay.Today}>
                                  <!-- Right: Qty + Unallocated -->
                                  <div class="day-right">
                                    <div class="qty">
                                      Qty: {weekDay.quantity}
                                    </div>
                                    <a
                                      href="javascript:void(0)"
                                      class="unallocated-link"
                                      data-role={role.roleName}
                                      data-date={weekDay.weekDays}
                                      data-isholiday={weekDay.isHoliday}
                                      data-unallocated={weekDay.quantity}
                                      onclick={handleUnAllocated}
                                    >
                                      Unallocated: {weekDay.unallocated}
                                    </a>
                                  </div>
                                </div>
                              </div>
                              <div class="add-shift-wrapper">
                                <a href="javascript:void(0)">
                                  <lightning-icon
                                    icon-name="utility:add"
                                    size="xx-small"
                                    class="add-icon-link1"
                                    data-role={role.roleName}
                                    data-date={weekDay.weekDays}
                                    data-isholiday={weekDay.isHoliday}
                                    onclick={handlePublishShift}
                                    style="transform: scale(0.7)"
                                  >
                                  </lightning-icon>
                                </a>
                              </div>
                              <div class="holiday-spacer-bottom">
                                <template if:true={weekDay.isHoliday}>
                                  <div
                                    class="holiday-label"
                                    title={weekDay.holidayName}
                                  >
                                    {weekDay.holidayName}
                                  </div>
                                </template>
                              </div>
                            </div>
                          </td>
                        </template>
                      </tr>
                    </thead>
                  </table>

                  <div class="calendar-part custom-scroll">
                    <table
                      class="slds-table slds-table_bordered slds-table_fixed-layout table1"
                      role="grid"
                    >
                      <tbody>
                        <template for:each={role.staffData} for:item="staff">
                          <tr key={staff.staffId}>
                            <!-- Staff Name and Info Column -->
                            <td>
                              <div
                                class="card"
                                data-id={staff.staffId}
                                data-facilityval={staff.facilityIdValue}
                                draggable="true"
                                ondragstart={handleDragStart}
                                data-param="draggingFromStaff"
                                data-exceedhours={staff.completedHours}
                                data-sethours={staff.setHours}
                              >
                                <div
                                  class="avatar"
                                  if:true={staff.profileUrl}
                                  draggable="false"
                                >
                                  <lightning-avatar
                                    variant="circle"
                                    src={staff.profileUrl}
                                    class="avatar-small"
                                    fallback-icon-name="standard:person_account"
                                  >
                                  </lightning-avatar>
                                </div>
                                <div
                                  class="avatar"
                                  if:false={staff.profileUrl}
                                  draggable="false"
                                >
                                  <lightning-icon
                                    icon-name="action:user"
                                    variant="error"
                                    size="small"
                                    style="background: #02275b"
                                    class="avatar-small fallback-icon"
                                  ></lightning-icon>
                                </div>
                                <div class="info">
                                  <a
                                    href="javascript:void(0);"
                                    class="name"
                                    data-staffroll={role.roleName}
                                    data-stafffirstname={staff.firstName}
                                    data-stafflastname={staff.lastName}
                                    data-fullname={staff.disPlayName}
                                    onclick={handleWeeklyCalander}
                                    >{staff.disPlayName}</a
                                  >
                                  <span class="details"
                                    >{staff.completedHours}/{staff.setHours}h
                                    ${staff.wages}</span
                                  >
                                  <span class="meta"
                                    >SCR {staff.SCR}, Class
                                    {staff.ClassAndLevel}</span
                                  >
                                </div>
                              </div>
                            </td>

                            <!-- Days Data Column (7 days) -->
                            <template
                              for:each={staff.shiftsByDay}
                              for:item="dayShift"
                            >
                              <td
                                key={dayShift.day}
                                colspan={dayShift.rowSpan}
                                class="day-cell"
                                ondragover={handleDragOver}
                                data-weekname={dayShift.day}
                                data-staffid={staff.staffId}
                                data-fullname={staff.disPlayName}
                                data-weekdate={dayShift.Shiftdate}
                                data-isholiday={dayShift.isHoliday}
                                data-role={role.roleName}
                                data-facilityval={staff.facilityIdValue}
                                data-exceedhours={staff.completedHours}
                                data-sethours={staff.setHours}
                                data-isleave={dayShift.isLeave}
                                ondrop={handleDrop}
                                style={dayShift.inlineStyle}
                              >
                                <div class="day-cell-wrapper">
                                  <template if:true={dayShift.isLeave}>
                                    <template if:true={dayShift.isVisible}>
                                      <div class="centered-content">
                                        <b>{dayShift.leaveType}</b>
                                      </div>
                                    </template>
                                  </template>
                                  <template if:false={dayShift.isLeave}>
                                    <template if:true={dayShift.shifts.length}>
                                      <div class={getIconContainerClass}>
                                        <template
                                          for:each={dayShift.newUIGroupOfShifts}
                                          for:item="shift"
                                        >
                                          <!-- COLLAPSED VIEW -->
                                          <template if:false={shift.isHovered}>
                                            <template
                                              if:false={dayShift.anyShiftInGroupHovered}
                                            >
                                              <div
                                                key={shift.Id}
                                                class={getIconItemClass}
                                                data-id={shift.Id}
                                                draggable="true"
                                                ondragstart={handleShiftTranfer}
                                                data-shiftrate={shift.shiftRate}
                                                data-param="draggingFromShift"
                                                data-shifttime={shift.ShiftTime}
                                                data-shifttype={shift.shiftType}
                                                data-recurstatus={shift.isRecurring}
                                                data-refid={shift.refID}
                                                data-staffid={staff.staffId}
                                                data-day={dayShift.Shiftdate}
                                                data-shiftstreet={shift.ShiftStreet}
                                                data-status={shift.status}
                                                data-index={shift.index}
                                                data-exceedhours={staff.completedHours}
                                                data-role={role.roleName}
                                                data-sethours={staff.setHours}
                                                style={shift.inLineHeight}
                                                ondragover={handleDragOver}
                                                ondrop={handleShiftTransferDrop}
                                              >
                                                <!-- SINGLE -->
                                                <template
                                                  if:true={dayShift.isSingleGroupRecord}
                                                >
                                                  <div
                                                    class="staff-info-time1"
                                                    data-id={shift.Id}
                                                    onclick={handleShiftCardClick}
                                                    data-day={dayShift.Shiftdate}
                                                    data-staffid={staff.staffId}
                                                  >
                                                    <div class="staff-info">
                                                      <template
                                                        if:true={isCompactView}
                                                      >
                                                        <template
                                                          if:false={shift.participantName}
                                                        >
                                                          <span
                                                            class="rolename-firsticon"
                                                            ><b
                                                              >{role.roleName}</b
                                                            ></span
                                                          >
                                                        </template>

      aria-modal="true"
      aria-describedby="modal-content-id-2"
      class="slds-modal slds-fade-in-open slds-modal_medium"
    >
      <div class="slds-modal__container">
        <!-- modal header start -->
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
            title="Close"
            onclick={handleHideServiceModal}
          >
            <lightning-icon
              icon-name="utility:close"
              alternative-text="close"
              variant="inverse"
              size="small"
            ></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>
          <h2
            id="modal-heading-02"
            class="slds-text-heading_medium slds-hyphenate"
          >
            Update Support Plan
          </h2>
        </header>

        <!-- modal body start -->
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content-id-2"
        >
          <lightning-record-edit-form
            object-api-name="Services_and_Support_Plan__c"
            data-recid="serviceEdit"
            onsuccess={handleServiceEditSuccess}
            onsubmit={handleServiceEditSubmit}
            record-id={serviceEditID}
          >
            <lightning-messages></lightning-messages>
            <div class="slds-grid slds-wrap">
              <div class="slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Service Users</span>
                  <lightning-input-field
                    field-name="Service_Users__c"
                    variant="label-hidden"
                    required="true"
                    disabled="true"
                  ></lightning-input-field>
                </div>
              </div>
              <div class="slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Plan Type</span>
                  <lightning-input-field
                    field-name="Plan_Type__c"
                    variant="label-hidden"
                    disabled="true"
                  ></lightning-input-field>
                </div>
              </div>
              <div class="slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Date of Service</span>
                  <lightning-input-field
                    field-name="Date_of_Service__c"
                    variant="label-hidden"
                    name="date"
                    disabled="true"
                  ></lightning-input-field>
                </div>
              </div>
              <div class="slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">GST</span>
                  <lightning-input-field
                    field-name="GST__c"
                    variant="label-hidden"
                    disabled="true"
                  ></lightning-input-field>
                </div>
              </div>
              <div class="slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Start time</span>
                  <lightning-input-field
                    field-name="Start_Time_24_Format__c"
                    variant="label-hidden"
                    name="startTime"
                    disabled="true"
                  ></lightning-input-field>
                </div>
              </div>
              <div class="slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">End time</span>
                  <lightning-input-field
                    field-name="End_Time_24_Format__c"
                    variant="label-hidden"
                    name="endTime"
                    disabled="true"
                  ></lightning-input-field>
                </div>
              </div>
              <div class="slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Billable Hours</span>
                  <lightning-input-field
                    field-name="Qty__c"
                    variant="label-hidden"
                  ></lightning-input-field>
                </div>
              </div>
              <div class="slds-size_1-of-2 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Service Type</span>
                  <lightning-combobox
                    variant="label-hidden"
                    options={serviceEditFundOption}
                    value={ServiceTypeEditvalue}
                    onchange={handleEditServiceChange}
                  ></lightning-combobox>
                </div>
              </div>
            </div>

            <template if:true={NdisServiceGroupNameinEdit}>
              <div style="margin-bottom: 4%" class="servicetable">
                <table class="table2">
                  <thead>
                    <tr class="tr1">
                      <!-- Add a header for checkboxes -->
                      <th>Select</th>
                      <th>Support Item Name</th>
                      <th>Support Item Number</th>
                      <th>Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Iterate through `serviceGroupName` to display rows -->
                    <template for:each={serviceEditGroupName} for:item="row">
                      <tr key={row.Id} class="tr1">
                        <!-- Checkbox for selection -->
                        <td
                          style="
                            text-align: center;
                            vertical-align: middle;
                            padding-top: 5px;
                            box-sizing: border-box;
                          "
                        >
                          <input
                            type="radio"
                            data-id={row.Id}
                            data-name={row.Name}
                            onchange={HandleEditNdisCheckBox}
                            checked={row.isSelected}
                          />
                        </td>
                        <td>{row.Support_Item_Name__c}</td>
                        <td>{row.Support_Item_Number__c}</td>
                         <!--  <td>{row.amount}</td> -->
                               <td>
                                  <lightning-formatted-number 
                                  value={row.amount} 
                                  format-style="currency" 
                                  currency-code="AUD"
                                  minimum-fraction-digits="2" 
                                  maximum-fraction-digits="2">
                              </lightning-formatted-number>
                               </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
            <!-- modal footer start-->
            <button
              class="slds-button slds-button_neutral"
              onclick={handleHideServiceModal} style="margin-left: 45%">
              Cancel
            </button>
            &nbsp;&nbsp; 
            <lightning-button
              type="submit"
              variant="brand"
              label="Update"
              
            ></lightning-button>
            
          </lightning-record-edit-form>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={ServiceWarningMessage}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Delete
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">
            <div>
              <p style="text-align: center">
                Are you sure you want to delete the
                <b>{participantServiceDeleteInfo.serviceName} </b>service for
                the
                <b>{participantServiceDeleteInfo.partcipantName} </b>
                {participantPreferredName}?
              </p>
            </div>
            <div class="button-container slds-m-top_medium">
              <lightning-button
                label="No"
                variant="brand"
                onclick={closeWarningMessage}
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handleDeleteService}
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={shiftDeleteConfirmation}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Delete
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small">
            <div style="text-align: center; font-weight: bold">
              <h1>Are you sure you want to delete the shift?</h1>
              <template if:true={shiftDeleteCOnfirmationInfo.recurStatus}>
                <lightning-input
                  type="checkbox"
                  label="Include recurring shifts"
                  onchange={handleDeleteRecurShifts}
                ></lightning-input>
              </template>
            </div>
            <div class="button-container">
              <lightning-button
                label="No"
                variant="brand"
                onclick={closeWarningMessage}
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handleDeleteShift}
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={fatigueManagementFlag}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">
            <div>
              <p style="text-align: center">
                The interval between shifts is less than 8 hours for the
                following staff. Would you like to assign this shift?
              </p>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container slds-m-top_medium">
              <lightning-button
                label="No"
                variant="brand"
                onclick={handleDeselectStaff}
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handleFinalAllocate}
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={setHoursExceedsLimit}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">
            <div>
              <p style="text-align: center">
                Set hours for the following staff is exceeded. Would you like to
                assign this shift?
              </p>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container slds-m-top_medium">
              <lightning-button
                label="No"
                variant="brand"
                onclick={handleSetHoursClose}
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={createCalenderShift}
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={isShiftDragAndDrop}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <template if:false={draggingShiftFatigueCheck}>
          <div class="slds-modal__content slds-p-around_medium modal-content">
            <div class="slds-m-around_small" style="text-align: center">
              <div>
                <p style="text-align: center">
                  You’re about to reassign this shift to
                  <b> {draggingStaffFullName}</b>. <br />Do you want to
                  continue?
                </p>
                <template if:true={darggingShiftRecurtempalte}>
                  <div class="recurring-section">
                    <p class="recurring-label">
                      This is a recurring shift. Would you like to apply this
                      change to:
                    </p>

                    <div class="radio-wrapper">
                      <lightning-radio-group
                        name="radioGroup"
                        options={draggingRecurOption}
                        value={draggingRecurShiftValue}
                        type="radio"
                        onchange={handleDraagingRecurChangeValue}
                      >
                      </lightning-radio-group>
                    </div>
                  </div>
                </template>
                <br />
                <p>
                  <template if:true={draggingSleepoverFalg}>
                    <b>Note:</b> This change will update the staff Sleeopover
                    Allowance from <b>${draggingStaffRate}</b> to
                    <b>${droppedStaffRate}</b>.
                  </template>
                  <template if:false={draggingSleepoverFalg}>
                    <b>Note:</b> This change will update the staff pay rate from
                    <b>${draggingStaffRate}/hr</b> to
                    <b>${droppedStaffRate}/hr</b>.
                  </template>
                </p>
              </div>

              <!-- Centered Buttons -->
              <div class="button-container slds-m-top_medium">
                <lightning-button
                  label="No"
                  variant="brand"
                  onclick={handleSetHoursClose}
                ></lightning-button>
                <lightning-button
                  label="Yes"
                  variant="brand"
                  onclick={handleAssignDragAndDrop}
                ></lightning-button>
              </div>
            </div>
          </div>
        </template>
        <template if:true={draggingShiftFatigueCheck}>
          <div class="slds-modal__content slds-p-around_medium modal-content">
            <div class="slds-m-around_small" style="text-align: center">
              <div>
                <p style="text-align: center">
                  The interval between shifts is less than 8 hours for
                  <b> {draggingStaffFullName}</b>.<br />
                  Would you like to reassign this shift?
                </p>
                <template if:true={darggingShiftRecurtempalte}>
                  <div class="recurring-section">
                    <p class="recurring-label">
                      This is a recurring shift. Would you like to apply this
                      change to:
                    </p>

                    <div class="radio-wrapper">
                      <lightning-radio-group
                        name="radioGroup"
                        options={draggingRecurOption}
                        value={draggingRecurShiftValue}
                        type="radio"
                        onchange={handleDraagingRecurChangeValue}
                      >
                      </lightning-radio-group>
                    </div>
                  </div>
                </template>
                <p>
                  <template if:true={draggingSleepoverFalg}>
                    <b>Note:</b> This change will update the staff Sleeopover
                    Allowance from <b>${draggingStaffRate}</b> to
                    <b>${droppedStaffRate}</b>.
                  </template>
                  <template if:false={draggingSleepoverFalg}>
                    <b>Note:</b> This change will update the staff pay rate from
                    <b>${draggingStaffRate}/hr</b> to
                    <b>${droppedStaffRate}/hr</b>.
                  </template>
                </p>
              </div>

              <!-- Centered Buttons -->
              <div class="button-container slds-m-top_medium">
                <lightning-button
                  label="No"
                  variant="brand"
                  onclick={handleSetHoursClose}
                ></lightning-button>
                <lightning-button
                  label="Yes"
                  variant="brand"
                  onclick={handleAssignDragAndDrop}
                ></lightning-button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
