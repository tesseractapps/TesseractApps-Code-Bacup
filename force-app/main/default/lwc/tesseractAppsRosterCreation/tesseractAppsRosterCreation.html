              </div>

                  </div>

                      <a href="javascript:void(0)" onclick={handleGetlocation} style="margin-left: 5px;" >Get Locations</a>
                    </template>
                    <template if:true={hideLocation}>
                      <a href="javascript:void(0)" onclick={hideHandleLocation} >Hide Location</a>
                    </template>
                    <template if:true={isShowMap}>
                      <div class="map-container" style="height: 500px;width:100%;"></div>
                    </template>
                  </div>
                </div>
              </div>
          </div>

         <!--   Bottom Row -->
          <div class="slds-col slds-size_12-of-12 slds-p-horizontal_small">
              <div class="slds-box slds-theme_default slds-m-bottom_small"><!-- Box 6 -->
                <table class="slds-table slds-table_cell-buffer table2" >
                  <thead>
                      <tr>
                          <th>Staff Name</th>
                          <th>Participant Name</th>
                          <th class="description">Service Type</th>
                          <th>Available Funds</th>
                          <th>Unit Price</th>
                          <th>Billable Hours</th>
                          <th>Amount</th>
                          <th>GST</th>

                            <th>Action</th>
                          </template>
                          
                      </tr>
                  </thead>
                  <tbody>
                      <template for:each={servicesList} for:item="service">
                          <tr key={service.Id} class="tr1">
                              <td class="description" title={service.Resource_Name__c}>{service.Resource_Name__c}</td>
                              <td class="description" title={service.Participant_Name__c}>{service.Participant_Name__c}</td>
                              <td class="description" title={service.Service_Type_Name__c}>{service.Service_Type_Name__c}</td>
                              <td>{service.Available_Fund__c}</td>
                              
                              <td >{service.Unit_Price__c}</td>
                              <td >{service.Qty__c}</td>
                              <td>{service.Amount__c}</td>
                              <td>{service.GST__c}</td>
                              <template if:false={disableAllserviceSection}>
                              <td > 
                                 <!--  <a href="javascript:void(0)" data-id={service.Id} data-participantid={service.Client__c} data-serviceid={service.Funds_Tracker__c} data-servicename={service.Service_Type_Name__c}    data-servicetype={service.Service_Type__c}
                                  data-servicedate={service.Date_of_Service__c}
                                  onclick={HandleServiceEdit} title="Edit Service"><lightning-icon icon-name="action:edit" size="xx-small" title="Edit" style="cursor:pointer;color:white;background:#0099DE;"></lightning-icon></a>&nbsp; 
                                  <a href="javascript:void(0)" >
                                    <lightning-icon name="delete" icon-name="action:delete"  size="xx-small"  onclick={handleDeleteConfirmation} data-servicename={service.Service_Type_Name__c} data-participantname={service.Participant_Name__c}  data-id={service.Id}  style="cursor:pointer"> </lightning-icon>
                                  </a> -->
                                  <div style="display: flex;  align-items: center;">
                                  <a href="javascript:void(0)"  data-id={service.Id} data-participantid={service.Client__c} data-serviceid={service.Funds_Tracker__c} data-servicename={service.Service_Type_Name__c}    data-servicetype={service.Service_Type__c} data-servicedate={service.Date_of_Service__c}
                                  onclick={HandleServiceEdit} title="Edit" style="text-decoration: none;">
                                    <i class="material-icons edit-icon">edit_document</i>
                                  </a>
                                  <a href="javascript:void(0)" data-servicename={service.Service_Type_Name__c} data-participantname={service.Participant_Name__c}  data-id={service.Id} onclick={handleDeleteConfirmation} title="Delete"  style="text-decoration: none;">
                                  <i class="material-icons delete-icon1">delete</i>
                               </a>
                               </div>

                            </td>
                          </template>
                          </tr>
                      </template>
                      
                  </tbody>
              </table>
               </div>
          </div>
      </div>
    </div>
    <template if:true={isShowSpinner}>
      <div >
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </div>
  </template>
  <template if:true={holidayPopup}>
    <section 
        aria-describedby="modal-content-id-1" 
        aria-labelledby="modal-heading-01" 
        aria-modal="true"
        class="slds-modal slds-fade-in-open" 
        role="dialog" 
        tabindex="-1" 
        style="width: 70%; margin-left: 20%;">
        
        <div class="slds-modal__container">
            <header 
                class="slds-modal__header" 
                style="background:#002A52;">
                <h2 
                    class="slds-text-heading_medium slds-hyphenate" 
                    style="color: white; font-weight: bold; text-align: center;">
                    Public Holidays Detected During Recurring Shifts
                </h2>
            </header> 

            <div 
                class="slds-modal__content slds-p-around_medium" 
                >
                <div class="slds-text-align_center">
                  <p>Select a holiday to apply holiday rates and create a shift.</p>
                </div>
                <div class="slds-m-around_small">
                    <div class="slds-col slds-size_12-of-12 slds-p-horizontal_small">
                        <div class="slds-box slds-theme_default slds-m-bottom_small">
                          <div style="max-height: 180px; overflow-y: auto;">
                            <table class="slds-table slds-table_cell-buffer table2">
                                <thead>
                                    <tr>
                                        <th>
                                        </th>
                                        <th>Date</th>
                                        <th>Holiday Name</th>
                                        <th>Rate</th>
                                    </tr>
                                </thead>
                                <tbody>
                                  <template for:each={holidaysList} for:item="holidays" for:index="index">
                                    <tr key={holidays} class="tr1">
                                      <td>
                                        <lightning-input 
                                          type="checkbox" 
                                          name="holidayCheckBox" 
                                          variant="label-hidden" 
                                          checked={holidays.checked}
                                          data-index={index}
                                          data-date={holidays.Date__c} 
                                          onchange={handleholidayChange} >
                                        </lightning-input>
                                      </td>
                                      <td>{holidays.Date__c}</td>
                                      <td>{holidays.Name}</td>
                                      <td>{holidays.Rate__c}</td>
                                    </tr>
                                  </template>                                  
                                </tbody>
                            </table>
                            </div>
                        </div>
                          <p>Note: Unselected holidays won't create shifts and require manual creation. </p>

                        <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
                          <lightning-button 
                                label="Cancel" 
                                variant="brand-outline" 
                                class="slds-m-around_small" 
                                onclick={handleholidayPopup}>
                            </lightning-button>
                            <lightning-button 
                                label="Save" 
                                variant="brand" 
                                onclick={handleholidayPopupSave} 
                                disabled={HolidaySaveButton}
                                class="slds-m-around_small">
                            </lightning-button>
                            
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
          </div>
  </template>

  <template if:true={isPublishShift}>

  <template if:true={isServiceEdit}>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true" aria-describedby="modal-content-id-2" class="slds-modal slds-fade-in-open slds-modal_medium">
        <div class="slds-modal__container">
            <!-- modal header start -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleHideServiceModal}>

                    <span class="slds-assistive-text">Close</span>
                </button>

            </header>
            
            <!-- modal body start -->
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                <lightning-record-edit-form object-api-name="Services_and_Support_Plan__c" data-recid="serviceEdit" onsuccess={handleServiceEditSuccess} onsubmit={handleServiceEditSubmit} record-id={serviceEditID}>
                    <lightning-messages></lightning-messages>
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Service Users</span>

                        </div>
                       </div>
                       <div class="slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Plan Type</span>
                            <lightning-input-field field-name="Plan_Type__c" variant="label-hidden" disabled="true"></lightning-input-field>   
                        </div>
                       </div>
                       <div class="slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Date of Service</span>
                            <lightning-input-field field-name="Date_of_Service__c" variant="label-hidden" name="date"  disabled="true" ></lightning-input-field>

                       </div>
                       <div class="slds-size_1-of-2 slds-p-around_small">

                       </div>

                        <div class="floating-label-new">
                            <span class="label-text-drop">Start time</span>
                            <lightning-input-field field-name="Start_Time_24_Format__c" variant="label-hidden" name ="startTime" disabled="true" ></lightning-input-field> 
                        </div>
                       </div>
                       <div class="slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label-new">
                            <span class="label-text-drop">End time</span>

                       </div>
                       <div class="slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Billable Hours</span>
                            <lightning-input-field field-name="Qty__c" variant="label-hidden" ></lightning-input-field>

                       </div>
                       <div class="slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Service Type</span>
                            <lightning-combobox variant="label-hidden" options={serviceEditFundOption} value={ServiceTypeEditvalue}  onchange={handleEditServiceChange} 
                            ></lightning-combobox>
                        </div>
                      </div>
                      
                      
                    </div>

                  
                    <template if:true={NdisServiceGroupNameinEdit}>
                    <div  style="margin-bottom:4%;" class="servicetable">
                     
                        <table class="table2">
                          <thead >
                              <tr class="tr1">
                                  <!-- Add a header for checkboxes -->
                                  <th>Select</th>
                                  <th>Support Item Name</th>
                                  <th>Support Item Number</th>
                                  <th>Amount</th>
                              </tr>
                          </thead>
                          <tbody>

                                              />

                                      <td>{row.amount}</td>

                          </tbody>
                      </table>
                      
                     
                      
                  </div>
                </template>
                <!-- modal footer start-->
                
                    <lightning-button type="submit" variant="brand" label="Update" style="margin-left:45%;" ></lightning-button>&nbsp;&nbsp;
                    <button class="slds-button slds-button_neutral" onclick={handleHideServiceModal}>Cancel</button>
                
                </lightning-record-edit-form>  
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
