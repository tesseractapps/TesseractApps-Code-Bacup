<template>
    <template if:true={isHome}>
        <div class="container">

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding:1% 0%;">
                <!-- Company Name Combobox, aligned to flex-start -->
                 <div style="justify-content: flex-start;">
                    <div class="floating-label-new" style="width: 180px;">
                        <span class="label-text-drop"><span style="color:red">*</span>Company Name</span>
                        <!-- <lightning-combobox name="companyName" variant="label-hidden" value={selectedCompany} options={facilityOptions} required="true" onchange={handleChange} style="width: 178px;"></lightning-combobox>  -->
                        <lightning-combobox name="companyName" variant="label-hidden" value={selectedCompany} options={companyOptionsAll} required="true" onchange={handleChange} style="width: 178px;"></lightning-combobox> 
                    </div> 
                </div>
            
                <!-- Buttons container, aligned to flex-end with gap between buttons -->
                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px;">
                    <lightning-button label="Create Company" style="font-family: 'Roboto', sans-serif;" variant="brand" onclick={handleCreateCompany} ></lightning-button> <!--disabled={disableCreate}-->
                    <!-- <lightning-button class="slds-m-left_small" label="Back" onclick={handleBack} variant="brand"></lightning-button> -->
                </div>
            </div>
            
            <!-- <div style="display: flex; align-items: center; justify-content: space-between;">
                <div class="floating-label-new">
                    <span class="label-text-drop"><span style="color:red">*</span>Company Name</span>
                    <lightning-combobox name="companyName" variant="label-hidden" value={selectedCompany} options={facilityOptions} required="true" onchange={handleChange}></lightning-combobox>
                </div>
            
                <div style="display: flex; align-items: center; gap: 10px;">
                    <lightning-button label="Create Company" style="font-family: 'Roboto', sans-serif;" variant="brand" onclick={handleCreateCompany} disabled={disableCreate}></lightning-button>
                </div>
            
            
                <div style="display: flex; align-items: center; gap: 10px;">
                    <lightning-button class="slds-m-left_small" label="Back" onclick={handleBack} variant="brand"></lightning-button>
                </div>
            </div>
             -->
            <table class="slds-table">
                <thead>
                    <tr>
                        <th scope="col">Company Name</th>
                        <th scope="col">ABN</th>
                        <th scope="col">Phone Number</th>
                        <th scope="col">Email Address</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={companyData} for:item="company">
                        <tr key={company.Id} class="tr">
                            <td>{company.Company_Name__c}</td>
                            <td>{company.ABN__c}</td>
                            <td>{company.Phone_Number__c}</td>
                            <td>{company.Email__c}</td>
                            <td>
                                <!-- <lightning-icon icon-name="action:edit" alternative-text="Edit" class="slds-m-left_x-small" size="xx-small"
                                onclick={handleEdit} data-id={company.Id}  style="cursor:pointer;color:white;background:#0099DE;"></lightning-icon> -->
                                <a href="javascript:void(0)" data-id={company.Id}  onclick={handleEdit} title="Edit" style="text-decoration: none;">
                                    <i class="material-icons edit-icon" data-id={company.Id}>edit_document</i>
                                </a>
                                
                            </td> 
                        </tr>
                    </template>
                </tbody>
            </table>
            <template if:true={paginationVisible}>
                <!--Pagination Start-->
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;width:95%;margin-left:2%">
                        <!-- RECORDS PER PAGE -->
                        <div class="slds-col">
                            <div class="slds-list_inline ">
                                <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                                <label class="slds-text-color_weak" for="recordsPerPage"></label><!--slds-p-horizontal_x-small-->
                                <div class="slds-select_container">
                                    <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                        <template for:each={pageSizeOptions} for:item="option">
                                            <option key={option} value={option}>{option}</option>
                                        </template> 
                                    </select>
                                </div>
                            </div>
                        </div>
                        <!-- PAGE NAVIGATION -->
                        <div class="slds-align_absolute-center" style="height:5rem;">
                            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                        </div>
                        <!-- TOTAL RECORDS -->
                        <div class="slds-clearfix">
                            <div class="slds-float_right">
                                <span class="slds-badge"> Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </template> 
        </div>
    </template>
    <template if:true={createCompanyFlag}>

            <lightning-button class="slds-m-left_small" label="Back" onclick={handleClose} variant="brand" style="margin-right: 1%; padding-top:1%;"></lightning-button>
        </div>
        <template if:true={isCreate}>
            <div class="slds-col slds-large-size_1-of-6 slds-p-around_small"> 
                <div class="floating-label-new">

                </div>
            </div>
        </template>

            <div class="section-content" data-section="financialYearDetails">

                        <lightning-messages></lightning-messages> -->
                    <div style="padding: 1% 1%;">

                            <div class="floating-label-new">
                                <span class="label-text-drop">Company</span>

                            </div>

                            <div class="slds-size_1-of-12 ">
                                <lightning-combobox style="margin-left: 0.5%; padding-top:0.5%" name="year" placeholder="Select Year" value={selectedYear} variant="label-hidden"
                                    options={yearOptions}  onchange={handleChange}> </lightning-combobox>
                            </div>
                            <div class="slds-size_6-of-12 ">

                                    options={monthOptions}  onchange={handleChange}> </lightning-combobox>

                        </div>

                                    options={monthOptions}  onchange={handleChange}> </lightning-combobox>  
                            </div>
                        </div> -->
                    </div>
                    <!-- </lightning-record-edit-form> -->
                </template>
            </div>
        </div>
        <div class="container-box">

            <div  class="toggle-bar" onclick={handleSectionToggle} data-id="accountListDetails" style="cursor: pointer;">

                <span >{sectionIcons.accountListDetails}</span>      
            </div>
            <div class="section-content" data-section="accountListDetails">
                <template if:true={sectionFlags.accountListDetails}>    
                    <!-- <div class="slds-grid slds-wrap" style="padding: 1% 1%;"> -->
                        <!-- <div class="slds-col slds-large-size_1-of-6 slds-p-around_small"> 
                            <div class="floating-label-new">

                                <lightning-combobox name="company" variant="label-hidden" value={selectedcomp2} options={companyOptions} disabled="True" ></lightning-combobox>
                            </div>

                        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 1% 1%;">  
                        <template if:true={addIndustry}>
                            <div class="slds-col slds-large-size_1-of-6 slds-p-around_small"> 
                                <div class="floating-label-new">
                                    <span class="label-text-drop"><span style="color:red">*</span>Industry</span>
                                    <lightning-input name="selectedIndustry1" variant="label-hidden" placeholder="Enter Industry Name" required="true" value={selectedIndustry1}   data-field="selectedIndustry1" onchange={handleIndustyChange} ></lightning-input>
                                </div>
                            </div>
                        </template>
                        
                        <template if:false={addIndustry}>

                            <!-- <div class="slds-grid slds-wrap" style="margin-left:1%; width: 65%">  -->

                                    </div> 
                                <!-- </div> -->
                                    <!-- <br/>

                                <!-- <lightning-input  class="slds-size_1-of-4 slds-m-around_small" type="search" label="Last Name" name="lname" value={lname} ></lightning-input><br/> -->
                            
                            </div>
                        </template>
                       
                        <div style="display: flex; gap: 8px; margin-right:1%;">
                            <lightning-button 
                                label="Instructions"

                                onclick={handleInstructions}
                                class="slds-m-right_small">
                            </lightning-button>
              
                            <lightning-button

                                variant="brand" 
                                onclick={handleDownloadTemplate}
                                class="slds-m-right_small">
                            </lightning-button>
                    
                            <lightning-button 
                                label="Import" 
                                variant="brand" 
                                onclick={handleButtonImport} 
                                class="slds-m-right_small"
                                disabled={enableddisabled}>

                            <input 
                                type="file" 
                                accept=".csv" 
                                onchange={handleImport} 
                                style="display: none;" 
                                class="file-input"/>
                        </div>
                     
                       
                    </div>
                    <!-- Render Account List -->
                    <div class="table-wrapper">
                        <div class="scrollable-table">
                        <table class="slds-table slds-table_bordered" style="table-layout: fixed; width: 100%;">
                            <thead>
                                <tr>
                                    <th>Account Number</th>
                                    <th>Account Name</th>
                                </tr>
                            </thead>
                            <tbody style="border-bottom: 1px solid #d8dde6;">
                                <template for:each={hierarchyData} for:item="accountList">
                                    <!-- Render Categories if Account List is expanded -->
                                    <template if:true={accountList.expanded}>
                                        <template for:each={accountList.categories} for:item="category">
                                            <!-- Category Row -->
                                            <tr key={category.accountNumber}>
                                                <td style="padding-left: 30px;">
                                                    <!-- Category Expand/Collapse icon -->
                                                    <lightning-icon 
                                                        icon-name={category.iconName}
                                                        alternative-text="Expand/Collapse"
                                                        size="xx-small"
                                                        class="slds-m-right_xx-small slds-cursor_pointer"
                                                        onclick={toggleCategory}
                                                        data-id={category.accountNumber}>
                                                    </lightning-icon>
                                                    <strong>{category.accountNumber}</strong> <!-- Account Number of Category -->
                                                </td>
                                                <td style="padding-left: 30px; font-size: 96%;">
                                                    <strong>{category.name}</strong> <!-- Account Name of Category -->
                                                </td>                               
                                            </tr>
                                
                                            <!-- Render Subcategories if Category is expanded -->
                                            <template if:true={category.expanded}>
                                                <template for:each={category.subCategories} for:item="subCategory">
                                                    <!-- Subcategory Row -->
                                                    <tr key={subCategory.accountNumber}>
                                                        <td style="padding-left: 60px;">
                                                            <!-- Subcategory Expand/Collapse icon -->
                                                            <lightning-icon 
                                                                icon-name={subCategory.iconName}
                                                                alternative-text="Expand/Collapse"
                                                                size="xx-small"
                                                                class="slds-m-right_xx-small slds-cursor_pointer"
                                                                onclick={toggleSubCategory}
                                                                data-category-id={category.accountNumber}
                                                                data-subcategory-id={subCategory.accountNumber}>
                                                            </lightning-icon>
                                                            <strong>{subCategory.accountNumber}</strong> <!-- Account Number of Subcategory -->
                                                        </td>
                                                        <td style="padding-left: 60px; font-size: 96%;">
                                                            <strong>{subCategory.name}</strong> <!-- Account Name of Subcategory -->
                                                        </td>
                                                    
                                                    </tr>
                                
                                                    <!-- Render Ledgers if Subcategory is expanded -->
                                                    <template if:true={subCategory.expanded}>
                                                        <template for:each={subCategory.ledgers} for:item="ledger">
                                                            <!-- Ledger Row -->
                                                            <tr key={ledger.accountNumber}>
                                                                <td style="padding-left: 90px;">
                                                                    <!-- Ledger Expand/Collapse icon -->
                                                                    <lightning-icon 
                                                                        icon-name={ledger.iconName}
                                                                        alternative-text="Expand/Collapse"
                                                                        size="xx-small"
                                                                        class="slds-m-right_xx-small slds-cursor_pointer"
                                                                        onclick={toggleLedger}
                                                                        data-subcategory-id={subCategory.accountNumber}
                                                                        data-ledger-id={ledger.accountNumber}>
                                                                    </lightning-icon>
                                                                    <strong>{ledger.accountNumber}</strong> <!-- Account Number of Ledger -->
                                                                </td>
                                                                <td style="padding-left: 90px; font-size: 96%;">
                                                                    <strong>{ledger.name}</strong> <!-- Account Name of Ledger -->
                                                                </td>
                                                            </tr>
                                
                                                            <!-- Render Ledger Items if Ledger is expanded -->
                                                            <template if:true={ledger.expanded}>
                                                                <template for:each={ledger.items} for:item="item">
                                                                    <!-- Ledger Item Row -->
                                                                    <tr key={item.accountNumber}>
                                                                        <td style="padding-left: 120px;">
                                                                            <!-- Ledger Item icon (if needed) -->
                                                                            {item.accountNumber} <!-- Account Number of Ledger Item -->
                                                                        </td>
                                                                        <td style="padding-left: 120px;">  <!-- Account Name of Ledger Item -->
                                                                            <!-- {item.name}   -->
                                                                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                                                                <span>{item.name}</span>
                                                                                <!-- <lightning-icon
                                                                                    icon-name="action:edit"

                                                                                    size="xx-small"
                                                                                    onclick={handleEditItem}

                                                                                    data-name={item.name}
                                                                                    data-accountno={item.accountNumber}
                                                                                    style="cursor: pointer; color: white; background: #0099DE;transform: scale(0.7);">
                                                                                </lightning-icon> -->
                                                                                <a href="javascript:void(0)"  
                                                                                    onclick={handleEditItem}
                                                                                    data-id={item.Id}
                                                                                    data-name={item.name}
                                                                                    data-accountno={item.accountNumber} title="Edit" style="text-decoration: none;">
                                                                                    <i class="material-icons edit-icon"  data-id={item.Id}>edit_document</i>
                                                                                </a>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                </template>
                                                            </template>
                                                        </template>
                                                    </template>
                                                </template>
                                            </template>
                                        </template>
                                    </template>
                                </template>                                                   
                                <template if:false={hierarchyData}>
                                    <p>No data available.</p>
                                </template>
                            </tbody>
                        </table>
                        </div>
                    </div>   
                   
                        <!-- <lightning-button label={buttonLabel} variant="brand" onclick={handleSave} style="float: right; margin:1%;"></lightning-button> -->
                        <!-- <div style="display: flex; align-items: center; justify-content: end; margin:2% 3%;">

                        <template if:true={isClear}>

                                <lightning-button label="Cancel" variant="outline"  title="Cancel" onclick={handleClearNewIndustry}></lightning-button>
                            </div>
                        </template>
                       
                </template>
            </div>
        </div>

                    </div>
                    
                    <div class="slds-size_1-of-5  slds-p-around_small">

                        </div>
                    </div>
