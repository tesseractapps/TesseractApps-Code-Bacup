                                    <lightning-input
                                        type="search"
                                        variant="label-hidden"
                                        value={searchStaff}
                                        onchange={handleSearchStaffInput}>
                                    </lightning-input>
                                </div>
                            </th>
                            <template for:each={roles} for:item="role">
                                <th key={role} class="slds-text-align_center role-column" scope="col">
                                    <div class="slds-truncate" title={role}>{role}</div>
                                </th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template if:true={groupedStaffRoleData.length}>
                            <template for:each={groupedStaffRoleData} for:item="staff">
                                <tr key={staff.Id} class={staff.rowClass}>
                                    <td class="slds-text-body_regular staff-name-cell" data-label="Staff">
                                        <div class="slds-truncate" title={staff.Name}>{staff.Name}</div>
                                    </td>
                                    <template for:each={staff.roleData} for:item="roleInfo">
                                        <td key={roleInfo.roleId} class="slds-text-align_center role-cell slds-table_striped" data-label={roleInfo.roleName}>
                                            <template if:true={roleInfo.hasRoleinstaff}>
                                                <lightning-input
                                                    type="checkbox"
                                                    checked={roleInfo.hasRole}
                                                    data-staff-id={staff.Id}
                                                    data-role-id={roleInfo.roleId}
                                                    onchange={handleRoleToggle}
                                                    variant="label-hidden"
                                                    class="role-checkbox">
                                                </lightning-input>
                                            </template>
                                            <template if:false={roleInfo.hasRoleinstaff}>
                                                <span style="opacity: 0.3;">—</span>
                                            </template>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </template>
                        <template if:false={groupedStaffRoleData.length}>
                            <tr>
                                <td colspan="100%">
                                    <div class="slds-text-align_center slds-p-around_medium">
                                        No staff found matching the search.
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
                <div class="slds-align_absolute-center slds-m-around_small">
                  <lightning-button label="Cancel" variant="brand-outline" onclick={handleeditClose1} class="slds-m-around_small"></lightning-button>
                  <lightning-button label="Save" variant="brand" onclick={handleUpdateStaff} class="slds-m-around_small" disabled={saveButtonDisable}></lightning-button> 
              </div>
        </div>
      </div>
      
    </template>

</template>
