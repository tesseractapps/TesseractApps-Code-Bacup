<template>
    <div style="width:100%;padding:1%;">
      <template if:true={isHome}>
        <div style="background: var(--Primary_White, #FFFFFF);">
          <div class="slds-grid  slds-m-bottom_xx-small" style="display: flex; align-items: center;background:#003466;height:50px;border-radius:5px;">
              <lightning-button-icon icon-name="utility:chevronleft" class="slds-m-right_small"
                                       onclick={navigateToPrevious} style="background:white;border-radius:5px;margin-left:40%"></lightning-button-icon>
              <lightning-button label="Today" onclick={navigateToToday}></lightning-button>
              <lightning-button-icon icon-name="utility:chevronright" class="slds-m-left_small"
                                       onclick={navigateToNext} style="background:white;border-radius:5px;"></lightning-button-icon>
                 <lightning-input label="Date" type="date" name="select-date" variant="label-hidden"
                  class="lwc-datepicker slds-m-left_small" value={datePickerString} onchange={navigateToDay}>
              </lightning-input>
        </div>
          
          
                <div class="container-box">
                    <div  class="toggle-bar" onclick={handleSectionToggle} data-id="Approvals">
                      <span>Approvals</span>
                      <span style="cursor: default;">{sectionIcons.Approvals}</span>
    
                    </div>
                    <div class="section-content" data-section="Approvals">
                    <template if:true={sectionFlags.Approvals}>
                <!-- <h3 slot="title">
                  <img src={employee} alt="Add Staff" width="75px" height="50px" >     
                </h3>  -->             
              <div style="Padding:1%;">
            <template if:true={isReimburesementsTable}>
                <table class="slds-table slds-table_cell-buffer" style="table-layout: fixed;" >
                  <thead>
                      <tr>
                          <th>Res No</th>
                          <th>Staff Name</th>
                          <th>Shift Date</th>
                          <!-- <th>Login Time</th>
                          <th>Logout Time</th> -->
                          <th>Mileage in Km's</th>
                          <th>Cost per Km</th>
                          <th style="width:9%;">Mileage Amount</th>
                          
                          <th>Amount</th>
                          <th>Total Amount</th>
                          <th>Status</th>
                          <th>Approved Date</th>
                          <th>View Files</th>
                          <template if:true={isOrgAdminVisible}>
                            <th>Action</th>
                          </template>
                          
                      </tr>
                  </thead>
                  <tbody>
                   
                      <template for:each={allReimburesments} for:item="module">
                          <tr key={module.Id} class="tr1">
                              <td class="description">{module.Name}</td>
                              <td class="description">{module.ShiftwithStaff__r.Staff__r.NameToDisplay__c}</td>
                              <td>{module.shiftdate}</td>
                             <!--  <td>{module.Shift_login_time_Formula__c}</td>
                              <td>{module.Shift_log_out_time_formula__c}</td> -->
                              <td>{module.Mileage_Others__c}</td>
                              <td>{module.Cost_per_KM__c}</td>
                              <td>{module.Mileage_Amount__c}</td>
                              <td>{module.Amount__c}</td>
                              <td>{module.Total_Amount__c}</td>
                              <td>{module.Approval_Status__c}</td>
                              <td>{module.Approved_Date__c}</td>
                              <td>
                                  <template if:true={module.Amazon_file_URL__c}>
                                      <a href={module.Amazon_file_URL__c} >
                                          <lightning-icon icon-name="utility:preview" size="small" title="View File" data-url={module.Amazon_file_URL__c}  
                                          onclick={handleView}></lightning-icon>
                                      </a>
                                  </template>
                              </td>
                              <template if:true={isOrgAdminVisible}>
                                <td>
                                  <lightning-button label="Action" data-moduleid={module.Id} data-modulestatus={module.Approval_Status__c} onclick={handleApprove} variant="brand"></lightning-button>
                                </td>
                              </template>
                            
                          </tr>
                      </template>
                    
                  </tbody>
              </table>
            </template>
            <template if:false={isReimburesementsTable}>
                    <span style="color:#008000;Font-weight:bold;">{Loadingdata}</span>
            </template>
              </div>
              </template>
              </div>
              </div>
               
            
            
                <div class="container-box">
                    <div  class="toggle-bar" onclick={handleSectionToggle} data-id="Submissions">
                      <span>Submissions</span>
                      <span style="cursor: default;">{sectionIcons.Submissions}</span>
    
                    </div>
                    <div class="section-content" data-section="Submissions">
                    <template if:true={sectionFlags.Submissions}>
            <div style="Padding:1%;">        
              <div > 
                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Type of Submission</span>
                        <lightning-combobox name="Submissions" label="Type of Submission" 
                        value={facSelectedValue} placeholder="Select Submission" 
                        options={subMissionOptions} onchange={handleSubmissions} 
                        variant="label-hidden"></lightning-combobox>
                    </div>
                 </div>
                <!-- <div class="slds-col slds-size_1-of-6"> 
                    
                </div> -->
            
                <!-- Data Table Section -->
                <div > 
                    <template if:true={visibleSubmissionSection}>
                        <template if:true={rejectedSubmission}>
                            <div class="rosterlayout custom-datatable" style="min-height: auto;">     
                                <table class="slds-table slds-table_cell-buffer">
                                    <thead>
                                        <tr>
                                            <th>Select</th>
                                            <th class="description">Shift Date</th>
                                            <th>Login Time</th>
                                            <th>Logout Time</th>
                                            <th>Mileage/Others</th>
                                            <th>Amount</th>
                                            <th>Comments</th>
                                            <th>Approver Comments</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={rejectedlist} for:item="list">
                                            <tr key={list.Id} class="tr1">
                                                <td>
                                                    <lightning-input type="radio" name="rowSelection" data-id={list.Id} data-shiftstaff={list.ShiftwithStaff__c} data-status={list.Approval_Status__c} onchange={handleSelected}></lightning-input>
                                                </td>
                                                <td class="description">{list.ShiftDate__c}</td>
                                                <td>{list.Shift_login_time_Formula__c}</td>
                                                <td >{list.Shift_log_out_time_formula__c}</td>
                      
                                                <td>{list.Mileage_Others__c}</td>
                                                <td>{list.Amount__c}</td>
                                                <td>{list.Comments__c}</td>
                                                <td>{list.Approver_Comments__c}</td>
                                                
                                                 <!-- <td>
                                                    
                                                        <lightning-icon data-id={docdata.Id} data-staff={docdata.Staff__c} name="edit" icon-name="action:edit" alternative-text="Edit" onclick={handleRowActions} size="xx-small" style="cursor:pointer;color:white;background:#0099DE; margin-right:2%;"></lightning-icon>
                                                        <lightning-icon data-id={docdata.Id} data-staff={docdata.Staff__c} name="delete" icon-name="action:delete" alternative-text="Delete" onclick={handleRowActions} size="xx-small" style="cursor:pointer;color:white;margin-right:2%;"></lightning-icon>
                                                        <lightning-icon data-id={docdata.Id} data-url={docdata.View_File__c} name="view_details" icon-name="action:preview" alternative-text="Edit" title="Edit"
                                                        onclick={handleRowActions}  size="xx-small" variant="inverse" style="cursor:pointer;color:white;background:#0099DE;">
                                                    </lightning-icon>
                                                    
                                                </td>  -->
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>      
                                <!-- <lightning-datatable key-field="Id" data={rejectedlist} columns={columns} 
                                    column-width-mode="auto" onrowselection={handleSelected}   
                                    max-row-selection="1" style="width: 100%; "></lightning-datatable> -->
                            </div>    
                        </template>
                        <template if:false={rejectedSubmission}>
                            <div class="rosterlayout custom-datatable" style="min-height: auto;">    
                                <table class="slds-table slds-table_cell-buffer">
                                    <thead>
                                        <tr>
                                            <th>Select</th>
                                            <th class="description">Location</th>
                                            <th>Date</th>
                                            <th>Start Time</th>
                                            <th>End Time</th>
                                            <th>Role</th>
                                            <th>Facility Name</th>
                                            
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={signinList} for:item="list">
                                            <tr key={list.Id} class="tr1">
                                                <td>
                                                    <lightning-input type="radio" name="rowSelection" data-id={list.Id}  data-logout={list.Log_Out_Date_Time__c}  onchange={HandleSignInrowSelection}></lightning-input>
                                                </td>
                                                <td class="description">{list.Shift_Locations__c}</td>
                                                <td>{list.formattedStartDate}</td>
                                                <td >{list.Start_time_Formula__c}</td>
                      
                                                <td>{list.End_time_formula__c}</td>
                                                <td>{list.Role_formula__c}</td>
                                                <td>{list.Facility_Names__c}</td>
                                               
                                                
                                                 <!-- <td>
                                                    
                                                        <lightning-icon data-id={docdata.Id} data-staff={docdata.Staff__c} name="edit" icon-name="action:edit" alternative-text="Edit" onclick={handleRowActions} size="xx-small" style="cursor:pointer;color:white;background:#0099DE; margin-right:2%;"></lightning-icon>
                                                        <lightning-icon data-id={docdata.Id} data-staff={docdata.Staff__c} name="delete" icon-name="action:delete" alternative-text="Delete" onclick={handleRowActions} size="xx-small" style="cursor:pointer;color:white;margin-right:2%;"></lightning-icon>
                                                        <lightning-icon data-id={docdata.Id} data-url={docdata.View_File__c} name="view_details" icon-name="action:preview" alternative-text="Edit" title="Edit"
                                                        onclick={handleRowActions}  size="xx-small" variant="inverse" style="cursor:pointer;color:white;background:#0099DE;">
                                                    </lightning-icon>
                                                    
                                                </td>  -->
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>        
                                <!-- <lightning-datatable key-field="Id" data={signinList} columns={SubmissionColums} 
                                    column-width-mode="auto" onrowselection={HandleSignInrowSelection}  
                                    max-row-selection="1" style="width: 100%;"></lightning-datatable> -->
                            </div>
                        </template>
                    </template>
                </div>
            </div>
           
            
          
              <!-- Additional Reimbursement Section -->
              <div class="rosterlayout">  
                 <!--  <h2 class="slds-m-bottom_medium" style="font-size: medium"><b>Reimbursement</b></h2> -->
                  <div class="slds-grid slds-wrap slds-gutters" >
                      <div class="slds-col" style="width:100px;height:180px;padding:50px;background: var(--medium-Light-Grey, #DFDCE3);">
                          <lightning-input type="file" label="Upload Attachment" variant="brand" disabled={attachDisable} 
                              onchange={onFileUpload}></lightning-input> 
                          <span>{fileName}</span>
                      </div>   
                      
                      <div class="slds-col">
                          <lightning-input  type="number" step=".01" value={others} label="Mileage in Km's" name="others" 
                              onchange={handleChange}></lightning-input>
                          <lightning-textarea name="comment" label="Comments:" required="true" value={comments}
                              onchange={handleChange}></lightning-textarea>               
                      </div>
          
                      <div class="slds-col">
                          <lightning-input type="number" step=".01" value={amount} label="Amount" 
                              name="Amount" onchange={handleChange}></lightning-input> 
                          <lightning-button variant="brand" label="Send for Approval" title="Send For Approval" 
                              onclick={onSubmitForApproval} disabled={attachDisable} 
                              class="slds-m-left_large" style="float:right;margin-top:100px;"></lightning-button>
                      </div>
                  </div>               
              </div>
              </div>
            </template>
        </div>
        </div>
          
      
          <br/><br/>
         
         
        </div>
    
      </template>
      
    
      <template if:true={ReimburesementRecordForm}>
        <div class="blur-overlay"></div>
        <div class="right-align" style="width:50%;">
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <h3 style="font-weight: bold;font-size:150%; margin: 0; padding: 3% 0 0 3%;">Approval Process</h3>
                <lightning-button class="slds-m-left_small" label="Back" onclick={handleClose} variant="brand" style="padding-right: 3.5%;padding-top:2%;"></lightning-button>
            </div>
            <div class="seperator">
                <div class=" slds-p-around_medium">
                    <lightning-record-edit-form object-api-name="Reimbursement__c" record-id={reimbursementId} onsuccess={handleSuccess} onsubmit={handleSubmit}>
                        <lightning-messages></lightning-messages>

                        <div class="slds-grid slds-wrap">
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <!-- <div class="slds-m-right_medium slds-m-left_medium">
                                    <lightning-output-field field-name="ShiftDate__c"></lightning-output-field>
                                </div> -->
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Shift Date</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-output-field field-name="ShiftDate__c" variant="label-hidden"></lightning-output-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Submitted Date</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-output-field field-name="Submitted_Date__c" variant="label-hidden"></lightning-output-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Login Time</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-output-field field-name="Shift_login_time_Formula__c" variant="label-hidden"></lightning-output-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Logout Time</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-output-field field-name="Shift_log_out_time_formula__c" variant="label-hidden"></lightning-output-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Cost per Km</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-output-field field-name="Cost_per_KM__c" variant="label-hidden"></lightning-output-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Mileage Amount</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-output-field field-name="Mileage_Amount__c" variant="label-hidden"></lightning-output-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Amount</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-output-field field-name="Amount__c" variant="label-hidden"></lightning-output-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Total  Amount</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-output-field field-name="Total_Amount__c" variant="label-hidden"></lightning-output-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Comments</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-output-field field-name="Comments__c" variant="label-hidden"></lightning-output-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Approval Status</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-input-field field-name="Approval_Status__c" variant="label-hidden" disabled={isButtonDisabled} onchange={handleApprovalStatus}></lightning-input-field>
                                    </div>
                                </label>
                            </div>
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <label class="labelClass" style="display: flex; align-items: left;">
                                    <div class="label-text-long">Approver Comments</div>
                                    <div class="label-separator">:</div>
                                    <div class="label-field-long">
                                        <lightning-input-field field-name="Approver_Comments__c" variant="label-hidden"></lightning-input-field>
                                    </div>
                                </label>
                            </div>
                            
                        </div>
                        <div class="slds-align_absolute-center slds-m-around_small">
                            <lightning-button label="Submit" variant="brand" type="submit" class="slds-m-around_small"></lightning-button>
                            <lightning-button label="Cancel" variant="brand-outline" onclick={handleClose} class="slds-m-around_small"></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </div>
        </div>
      </template>
    
      <template if:true={isModalOpen}>
        <div class="slds-p-around_medium">
        <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
                     onclick={closeModal} style="float:right;margin-bottom:5px;margin-right:2%;"></lightning-button>
        
        <iframe src={currentUrl} width="100%" height="1200px" ></iframe>
        </div>
        
     </template>
     <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Uploading the file......" size="medium"></lightning-spinner>
      </template>
    </div>
    </template>
