<template>
    <div class="dashboard-toggle-container">
        <div class="dashboard-strap">
            <span class="dashboard-tab">Dashboard</span>
        </div>
        <div class="dashboard-panel">
            <div class="dashboard-content">
                <div class="dashboard-title">Dashboard</div>
                <canvas class="status-bar-chart" lwc:dom="manual"></canvas>
            </div>
        </div>
        
    </div>
    
    
    <p style="font-weight: bold; font-size: 140%; padding:1% 0% 1% 1%">T Support</p> 
    <!-- <div class="slds-m-bottom_medium">
    
        <canvas class="status-bar-chart" lwc:dom="manual" style="max-width: 400px; max-height: 400px;"></canvas>

    </div> -->
    
    
         <div class="container">
              <div class="partition">
              <p style="font-weight: bold; font-size: 140%; padding:1% 0% 1% 1%">Tickets</p> 
              <div class="slds-grid slds-align-top slds-m-bottom_small" style="padding-left: 1%; gap: 1rem;">
               <!-- Filter Tickets Dropdown -->
               <div class="slds-size_1-of-5">
                   <div class="floating-label">
                       <span class="label-text-drop">Filter Tickets</span>
                       <lightning-combobox
                           variant="label-hidden"
                           class="filter-combobox"
                           value={selectedFilter}
                           options={filterOptions}
                           onchange={handleFilterChange}>
                       </lightning-combobox>
                   </div>
               </div>
           
               <!-- Priority Filter Dropdown -->
               <div class="slds-size_1-of-5">
                   <div class="floating-label">
                       <span class="label-text-drop">Priority</span>
                       <lightning-combobox
                           variant="label-hidden"
                           value={selectedPriority}
                           options={priorityOptions}
                           onchange={handlePriorityFilterChange}>
                       </lightning-combobox>
                   </div>
               </div>
           </div>
           
           
           

    <table class="slds-table slds-table_cell-buffer" style="table-layout:fixed; width: 99%;">
         <thead>
         <tr>
         <th class="slds-cell-wrap th">Ticket Number</th>
         <template if:true={isTesseractOrg}>
         <th class="slds-cell-wrap th">Raised By </th>
       </template>
         <th class="slds-cell-wrap th">Subject</th>
         <th class="slds-cell-wrap th">Username</th>
         <th class="slds-cell-wrap th">Date of Issue</th>
         <th class="slds-cell-wrap th">Priority</th>
         <th class="slds-cell-wrap th">Assigned to</th>
         <th class="slds-cell-wrap th">Status</th>
         <template if:true={canEditTickets}>
           <th class="slds-cell-wrap th">Action</th>
       </template>
       
         </tr>
         </thead>
         <tbody>
              <template for:each={paginatedTickets} for:item="t">
                  <tr key={t.Id}>
                   <td class="slds-cell-wrap">
                        <a href="javascript:void(0);" 
                           class="slds-text-link"
                           data-id={t.Id}
                           onclick={handleTicketClick}>
                           {t.Ticket_Name__c}
                        </a>
                    </td>
                    <template if:true={isTesseractOrg}>
                       <td title={t.fullOrganizationName}>{t.organizationName}</td>
                   </template>
                      <td class="slds-cell-wrap">{t.Subject__c}</td>
                      <td class="slds-cell-wrap">{t.User_Name__c}</td>
                      <td class="slds-cell-wrap">{t.formattedDateOfIssue}</td>
                      <td class="slds-cell-wrap">{t.Priority__c}</td>
                      <td class="slds-cell-wrap">
                        <template if:true={t.Assigned_To__r}>
                            {t.Assigned_To__r.Name}
                        </template>
                        <template if:false={t.Assigned_To__r}>
                            -
                        </template>
                    </td>                     
                      <td class="slds-cell-wrap">{t.Status__c}</td>
                      <template if:true={canEditTickets}>
                       <td class="slds-cell-wrap">
                           <template if:true={t.showEdit}>
                               <lightning-icon
                                   icon-name="action:edit"
                                   size="xx-small"
                                   title="Edit"
                                   data-id={t.Id}
                                   onclick={openEditPopup}
                                   style="cursor: pointer; color: white; background: #0099DE; border-radius: 50%; padding: 4px;">
                               </lightning-icon>
                           </template>
                       </td>
                       
                   </template>
                                      
                    
                  </tr>
              </template>
              <template if:true={showNoTicketsMessage}>
               <tr>
                   <td colspan={computedColSpan} style="text-align: center;">No tickets found.</td>
                 </tr>
                 
           </template>
           
          </tbody>
          
         </table>

         <template if:true={showEditPopup}>
              <div class="overview-modal-backdrop">
                  <div class="overview-modal-tabbed" style="max-width: 800px;">
                      <div class="overview-modal-header-tabbed">
                          <div class="overview-header-title">
                             <h3>Edit Ticket:</h3>
                             <h2>#{selectedTicket.Ticket_Name__c} — {selectedTicket.Subject__c}</h2>
                          </div>
                          <button class="overview-close-btn" onclick={closeEditPopup}>×</button>
                      </div>
          
                      <div class="overview-tab-content">
                       <div class="slds-grid slds-wrap">
                           <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                     <span class="label-text-drop">Assigned to</span>
                          <lightning-combobox
                              name="Assigned_To__c"
                              variant="label-hidden"
                              value={editTicket.Assigned_To__c}
                              options={ticketingMembers}
                              onchange={handleEditInputChange}>
                          </lightning-combobox>
                                </div>
                           </div>
                           <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                               <div class="floating-label">
                                    <span class="label-text-drop">Status</span>
                          <lightning-combobox
                              name="Status__c"
                              variant="label-hidden"
                              value={editTicket.Status__c}
                              options={statusOptions}
                              onchange={handleEditInputChange}>
                          </lightning-combobox>
                               </div></div>
                               <!-- <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                                   <div class="floating-label-textarea-comments">
                                        <span class="label-text-drop">Comments</span>
                          <lightning-textarea
                              name="Comments"
                              variant="label-hidden"
                              value={editTicket.Comments}
                              onchange={handleEditInputChange}>
                          </lightning-textarea>
                                   </div></div> -->
                      </div>
                           </div>
                      <div class="overview-modal-footer">
                          <lightning-button variant="brand" label="Save" onclick={saveTicketEdits}></lightning-button>
                          <lightning-button variant="neutral" label="Cancel" onclick={closeEditPopup} class="slds-m-left_small"></lightning-button>
                      </div>
                  </div>
                  </div>
              </div>
          </template>
          

         <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;">
   
              <!-- RECORDS PER PAGE -->
              <div class="slds-col">
                  <div class="slds-list_inline slds-p-bottom_xx-small">
                      <label class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center" for="recordsPerPage">
                          Page Size:
                      </label>
                      <div class="slds-select_container">
                          <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPageTickets}>
                              <template for:each={pageSizeOptions} for:item="option">
                                  <option key={option} value={option}>{option}</option>
                              </template>
                          </select>
                      </div>
                  </div>
              </div>
          
              <!-- PAGE NAVIGATION -->
              <div class="slds-align_absolute-center" style="height:5rem">
                  <lightning-button 
                      disabled={bDisableFirst}
                      icon-name="utility:jump_to_left"
                      label="First"
                      class="slds-p-horizontal_x-small"
                      alternative-text="First Page"
                      onclick={firstPageTickets}>
                  </lightning-button>
          
                  <lightning-button 
                      disabled={bDisableFirst}
                      icon-name="utility:chevronleft"
                      label="Previous"
                      alternative-text="Previous Page"
                      onclick={previousPageTickets}>
                  </lightning-button>
          
                  &nbsp;
                  <span class="slds-badge">
                      Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)
                  </span>
                  &nbsp;
          
                  <lightning-button 
                      disabled={bDisableLast}
                      icon-name="utility:chevronright"
                      label="Next"
                      class="slds-p-horizontal_x-small"
                      alternative-text="Next Page"
                      icon-position="right"
                      onclick={nextPageTickets}>
                  </lightning-button>
          
                  <lightning-button 
                      disabled={bDisableLast}
                      icon-name="utility:jump_to_right"
                      label="Last"
                      alternative-text="Last Page"
                      icon-position="right"
                      onclick={lastPageTickets}>
                  </lightning-button>
              </div>
          
              <!-- TOTAL RECORDS -->
              <div class="slds-clearfix slds-m-right_xx-large">
                  <div class="slds-float_right">
                      <span class="slds-badge">Total Tickets: {totalRecords}</span>
                  </div>
              </div>
          </div>
          
         </div>


         </div>


<template if:true={showTicketPopup}>
         <div class="overview-modal-backdrop">
              <div class="overview-modal-tabbed1">
                  <!-- Header -->
                  <div class="overview-modal-header-tabbed">
                      <div class="overview-header-title">
                          <h2>#{selectedTicket.Ticket_Name__c} &mdash; {selectedTicket.Subject__c}</h2>
                          <span class="overview-meta">
                              {selectedTicket.User_Name__c} &bull;
                              {selectedTicket.formattedDateOfIssue}
                          </span>
                      </div>
                      <button class="overview-close-btn" onclick={closeTicketPopup}>×</button>
                  </div>
          
                  <!-- Tabs -->
                  <div class="overview-tabs">
                      <div class={ticketTabClass} onclick={showTicketInfoTab}>Ticket Info</div>
                      <div class={conversationTabClass} onclick={showConversationTab}>Interactions</div>
                      <div class={resolutionTabClass} onclick={showResolutionTab}>Resolution</div>
                      <div class={attachmentTabClass} onclick={showAttachmentTab}>Attachment</div>
                      <div class={historyTabClass} onclick={showHistoryTab}>History</div>
                  </div>
          
                  <!-- Tab Content -->
                  <div class="overview-tab-content1">
                      <template if:true={showTicketInfo}>
                        <div class="overview-info-grid">
                             <div><strong>Status:</strong> {selectedTicket.Status__c}</div>
                             <div><strong>Submitted By:</strong> {selectedTicket.Submitted_By__c}</div>
                             <div><strong>Email:</strong> {selectedTicket.Email_ID__c}</div>
                             <div><strong>Phone:</strong> {selectedTicket.Contact_Number__c}</div>
                             <div><strong>Manager:</strong> {selectedTicket.Manager_Name__c}</div>
                             <div><strong>Priority:</strong> {selectedTicket.Priority__c}</div>
                             <div><strong>Module:</strong> {selectedTicket.Module__c}</div>
                             <div><strong>Category:</strong> {selectedTicket.Category__c}</div>
                             <div><strong>Platform:</strong> {selectedTicket.Platform__c}</div>
                             <div><strong>Attachment:</strong><template if:true={uploadedFileDetails}>
                                  <div class="ticket-info-row">
                                      
                                      <div class="slds-media slds-media_center">
                                          <div class="slds-media__figure">
                                              <lightning-icon icon-name={uploadedFileDetails.iconName} alternative-text="File" size="small"></lightning-icon>
                                          </div>
                                          <div class="slds-media__body">
                                              <a href={uploadedFileDetails.url} target="_blank" class="file-link">{uploadedFileDetails.filename}</a>
                                          </div>
                                      </div>
                                  </div>
                              </template>
                              </div>
                         </div>
                         <p style="margin-top:1rem;"><strong>Description:</strong></p>
                         <p>{selectedTicket.Description__c}</p>
                         
                      </template>
                      <!-- Conversation Container -->
                      <template if:true={showConversation}>
                       <template if:true={noConversations}>
                           <div class="start-conversation-wrapper">
                               <button class="start-conversation-button" onclick={toggleMessageInput}>
                                   💬 Start Conversation
                               </button>
                           </div>
                       </template>
                       <template if:false={noConversations}>
                       <div class="reply-button-container">
                           
                               <template if:false={showMessageInput}>
                                   <button class="reply-icon-button" onclick={toggleMessageInput}>
                                       💬 Reply
                                   </button>
                               </template>
                           
                   
                       </div>
                   
                       <!-- 📩 Message Thread Area -->
                       <div class="conversation-thread">
                   
                           <!-- Rendered messages go here -->
                           <div class="conversation-content" lwc:dom="manual"></div>
                   
                           <!-- ✍️ Input field (only when replying) -->
                           <template if:true={showMessageInput}>
                               <div class="new-message-container">
                                   <lightning-textarea
                                       class="reply-textarea"
                                       value={newMessage}
                                       onchange={handleNewMessageInput}
                                       placeholder="Type your reply...">
                                   </lightning-textarea>
                                   <lightning-button-icon
                                       icon-name="utility:send"
                                       variant="brand"
                                       alternative-text="Send"
                                       onclick={sendMessageToConversation}>
                                   </lightning-button-icon>
                               </div>
                           </template>
                       </div>
                   </template>
                   </template>
                   
                   

                    
<template if:true={showResolution}>
    <div class="resolution-container">

        <!-- Show saved resolution -->
        <template if:true={resolutionInput}>
           <template if:false={showResolutionInput}>
         <div class="resolution-block"
              onmouseover={showResolutionActions}
              onmouseout={hideResolutionActions}>
             
             <div class="resolution-header">
                 <div class="avatar-circle">{resolutionInitials}</div>
                 <strong>{resolutionSubmittedBy}</strong>
                 <div class="resolution-timestamp-wrapper">
                   <div class="resolution-date">{resolutionDate}</div>
                   <div class="resolution-time">{resolutionTime}</div>
               </div>                             
                 <span class="resolution-actions" style="display:none">
                     <lightning-icon icon-name="utility:edit" size="xx-small" class="icon-action" onclick={editResolution}></lightning-icon>
                     <lightning-icon icon-name="utility:delete" size="xx-small" class="icon-action" onclick={deleteResolution}></lightning-icon>
                 </span>
             </div>
              
             <div class="resolution-message">{resolutionInput}</div>
         </div>
       </template>
     </template>      

        <!-- Resolution input (conditionally shown) -->
        <template if:true={showResolutionInput}>
         <div class="floating-label-textarea-resolution">
              <span class="label-text-drop"><span style="color:red">*</span>Add Resolution</span>
            <lightning-textarea
                class="resolution-textarea"
                value={resolutionInput}
                variant="label-hidden"
                placeholder="Write your resolution..."
                onchange={handleResolutionChange}>
            </lightning-textarea>
         </div>

            <div class="save-resolution-wrapper">
                <lightning-button 
                    label="Save"
                    variant="brand"
                    onclick={saveResolution}>
                </lightning-button>
                &nbsp;
                <lightning-button
               variant="brand-outline"
               label="Cancel"
               onclick={cancelResolutionEdit}
               class="slds-m-left_small">
           </lightning-button>
            </div>
        </template>

        <!-- Centered Add Resolution button (only if no resolution and not adding) -->
        <template if:false={resolutionAdded}>
        <template if:false={selectedTicket.Resolution__c}>
            <template if:false={showResolutionInput}>
                <div class="add-resolution-wrapper">
                    <button class="add-resolution-btn" onclick={showResolutionInputField}>
                        ➕ Add Resolution
                    </button>
                </div>
            </template>
        </template>
        </template>

    </div>
</template>






<template if:true={showAttachment}>

    <!-- 🔖 POST ATTACHMENT PREVIEW -->
    <template if:true={postAttachmentFileUrl}>
        <div class="attachment-post-title">Post Attachment</div>

        <div class="slds-media slds-media_center attachment-post-preview">
            <div class="slds-media__figure">
                <lightning-icon icon-name={postAttachmentIcon} size="small"></lightning-icon>
            </div>
            <div class="slds-media__body">
                <a href={postAttachmentFileUrl} target="_blank">{postAttachmentFileName}</a>
            </div>
            <div class="attachment-post-actions slds-m-left_x-small">
              <div onclick={handleEditPostAttachment} style="cursor:pointer;" title="Edit">
                  <lightning-icon 
                      icon-name="action:edit" 
                      size="x-small" 
                      alternative-text="Edit"
                      class="slds-icon-text-default" style="cursor:pointer;color:white;background:#0099DE;">
                  </lightning-icon>
              </div>
              &nbsp;
              <div onclick={confirmDeletePostAttachment} style="cursor:pointer;" title="Delete">
                  <lightning-icon 
                      icon-name="action:delete" 
                      size="x-small" 
                      alternative-text="Delete"
                      class="slds-icon-text-default">
                  </lightning-icon>
              </div>
          </div>
          
        </div>
    </template>

    <!-- 📤 UPLOAD CONTAINER -->
    <template if:false={postAttachmentFileUrl}>
        <div class="attachment-upload-container">
            <div class="upload-icon-box">
                <lightning-icon icon-name="utility:upload" size="medium" class="upload-icon"></lightning-icon>
            </div>
            <div class="upload-text">
                <strong>Click to upload files</strong>
                <p class="upload-subtext">Supported formats: PNG, JPG. Max size: 5MB</p>
            </div>

            <input type="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"
                   onchange={onFileUpload}
                   style="display: none;"
                   class="post-upload-input"/>

            <lightning-button label="Upload File" variant="brand" onclick={triggerPostAttachmentUpload}></lightning-button>
        </div>
    </template>

    <!-- ❌ CUSTOM DELETE CONFIRMATION -->
    <template if:true={showAttachmentDeleteModal}>
        <section class="slds-modal slds-fade-in-open attachment-delete-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header" style="background: #003466; color: white;">
                    <h2 class="slds-modal__title">Delete Post Attachment</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    Are you sure you want to delete this attachment?
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={cancelDeletePostAttachment}></lightning-button>
                    <lightning-button variant="destructive" label="Delete" onclick={deletePostAttachment}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>





                      <template if:true={showApproval}>
                          <p><em>Approval tab content coming soon...</em></p>
                      </template>
                      <template if:true={showHistory}>
                        <div class="history-timeline">
                            <template for:each={groupedHistory} for:item="group">
                                <div key={group.date} class="history-date-section">
                                    <div class="history-date-label">{group.date}</div>
                                    <template for:each={group.entries} for:item="entry">
                                        <div key={entry.timestamp} class="history-entry">
                                            <div class="entry-time">{entry.time}</div>
                                            <div class="entry-content">
                                                <div class="entry-header">
                                                    <div class="avatar-circle">{entry.initials}</div>
                                                    <div class="entry-meta">
                                                        <span class="entry-user">{entry.user}</span>
                                                        <span class="entry-action">{entry.actionType}</span>
                                                    </div>
                                                </div>
                                                <div class="entry-body">{entry.content}</div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                    
                    
                  </div>
              </div>
          </div>
</template>
          
    
</template>
