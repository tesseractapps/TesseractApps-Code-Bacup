<template>
    <div class="container-box">
        <div style="background-color:white; margin: 3% 0; border-radius: 5%; padding: 2%;">
            <h3>
                <span style="font-size: 16px; font-weight: bold;">My details</span>
            </h3>

            <!-- Spinner for Loading -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>

            <!-- Error Message -->
            <template if:true={error}>
                <div class="slds-text-color_error slds-m-top_medium">{error}</div>
            </template>

            <!-- Chart Display -->
            <div class="chart-container">
                <canvas class="barChart"></canvas>
            </div>
        </div>
    </div>
</template>
