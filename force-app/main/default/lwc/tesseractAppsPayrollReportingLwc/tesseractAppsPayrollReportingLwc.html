<template>
    <!-- <div  slot="title" style="font-weight:bold; padding: 1% 0% 2% 1%; font-size:140%">
        Wages
    </div> -->
    <div style="display: flex; align-items: center; justify-content: space-between;">
        <p style="font-weight: bold; padding: 0% 0 0 1%; font-size: 140%; ">Wages - {companyname}</p>
        <lightning-button label="Back" variant="brand" onclick={handleBack} style=" margin-top:1%;margin-bottom:1%; margin-right:1%;"></lightning-button> 
    </div>
    <div style="margin-top:-2%;">  
         
        <div>
            <div>
                <lightning-record-view-form record-id={Picklist_Value} object-api-name={objectApiName}
                    mode="view" onsubmit={handleSubmit}>

                    <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                                
                                
                        <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                            <label class="labelClass" style="display: flex; align-items: left;">
                                <div style="flex: 0 0 30%; font-weight: bold;">Name</div>
                                <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                                <div style="flex: 1 1 65%; text-align: left; padding-left: 8px; margin: 0;">
                                    <lightning-output-field field-name="Name" variant="label-hidden"></lightning-output-field>
                                </div>
                            </label>
                        </div>
                        <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                            <label class="labelClass" style="display: flex; align-items: left;">
                                <div style="flex: 0 0 30%; font-weight: bold;">ABN</div>
                                <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                                <div style="flex: 1 1 65%; text-align: left; padding-left: 8px; margin: 0;">
                                    <lightning-output-field field-name="ABN__c" variant="label-hidden"></lightning-output-field>
                                </div>
                            </label>
                        </div>
                        <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                            <label class="labelClass" style="display: flex; align-items: left;">
                                <div style="flex: 0 0 30%; font-weight: bold;">Contact No</div>
                                <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                                <div style="flex: 1 1 65%; text-align: left; padding-left: 8px; margin: 0;">
                                    <lightning-output-field field-name="Contact_No__c" variant="label-hidden" style="pointer-events:none;"></lightning-output-field>
                                </div>
                            </label>
                        </div>
                        <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                            <label class="labelClass" style="display: flex; align-items: left;">
                                <div style="flex: 0 0 30%; font-weight: bold;">Email</div>
                                <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                                <div style="flex: 1 1 65%; text-align: left; padding-left: 8px; margin: 0;">
                                    <lightning-output-field field-name="Email__c" variant="label-hidden" style="pointer-events:none;"></lightning-output-field>
                                </div>
                            </label>
                        </div>
                        <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                            <label class="labelClass" style="display: flex; align-items: left;">
                                <div style="flex: 0 0 30%; font-weight: bold;">Address</div>
                                <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                                <div style="flex: 1 1 65%; text-align: left; padding-left: 8px; margin: 0;">
                                    <lightning-output-field field-name="Address__c" variant="label-hidden"></lightning-output-field>
                                </div>
                            </label>
                        </div>
                    </div>                    
                </lightning-record-view-form>
            </div><br/>
        </div>   
        
        <div class="slds-grid slds-gutters slds-grid_align-spread slds-align_absolute-center">
            <div class="slds-grid slds-gutters slds-grow" style="padding-left:1%;">
                <div class="slds-col slds-size_1-of-4">
                    <div class="floating-label">
                        <span class="label-text-drop">Start Date</span>
                        <lightning-input type="date" name="sdate"
                                    value={sdate} onchange={hadleDates} variant="label-hidden"></lightning-input>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="floating-label">
                        <span class="label-text-drop">End Date</span>
                        <lightning-input type="date" value={edate}
                        name="edate" onchange={hadleDates} variant="label-hidden"></lightning-input>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="floating-label">
                        <span class="label-text-drop">Name of the Facility</span>
                        <lightning-combobox  name="Facility"
                         required="true" value={selectedFacilityValue} placeholder="Select Facility"
                        options={facilityOptions} onchange={hadleDates} variant="label-hidden">
            </lightning-combobox>
                    </div>
                </div>
                <div class="slds-col">
                    <lightning-button variant="brand" label="Export Report" title="Export Report" 
                        onclick={downloadWagesExcel} class="slds-m-left_medium"></lightning-button>
                </div>
            </div>            
        </div>        
        
    </div>
</template>
