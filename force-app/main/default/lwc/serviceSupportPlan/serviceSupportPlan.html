<!--
@description       : 
@author            : Raja Sekhar Reddy
@group             : 
@last modified on  : 05-28-2023
@last modified by  : Raja Sekhar Reddy
-->
<template>
    <div class="participantlayout" style="margin-bottom:20px;">
        <lightning-accordion allow-multiple-sections-open class="accordionClass" active-section-name={activeSections}>
            <template if:true={participantlogin}>
                
                <lightning-accordion-section name="Services" label="Services">
                    <lightning-card>                   
                        <template if:true={listofSericeFlag}>
                            <button 
                                class="slds-button slds-button_icon slds-button_icon-border" 
                                title="Refresh" 
                                onclick={fetchReplist}>
                                <svg class="slds-button__icon" aria-hidden="true">
                                    <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                                </svg>
                            </button>
                            <lightning-button variant="brand" label="Generate Invoice" onclick={getSelectedRec} slot="actions" disabled={disableBool}
                                class="slds-m-right_xx-large slds-float_right slds-m-bottom_small"></lightning-button>
                                
                            <lightning-button variant="brand" label="Add New Service" onclick={handleAddNewService} slot="actions"
                                class="slds-m-right_x-small slds-float_right slds-m-bottom_medium"></lightning-button>
                            
                            <lightning-button variant="brand" label="Export Service Items" onclick={handleDownloadServices} slot="actions"
                                class="slds-m-right_x-small slds-float_right slds-m-bottom_medium"></lightning-button>
                            
                                <!--modal starts-->
                                <template if:true={isOpenModal}>                              
                        
                                    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
                                        <div class="slds-modal__container">
                                            <!-- modal header start -->
                                            <template if:true={showfunds}> 
                                                <header class="slds-modal__header">
                                                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                                                    <lightning-icon icon-name="utility:close"
                                                        alternative-text="close"
                                                        variant="inverse"
                                                        size="small" ></lightning-icon>
                                                    <span class="slds-assistive-text">Close</span>
                                                    </button>
            
                                                    <!--Client Fund Table-->
                                                
                                                    <h2 id="modal-heading-03" class="slds-text-heading_medium slds-hyphenate">Select Registration Group</h2>
                                                </header>
                                                <lightning-datatable class="fundTable" data={funddata} columns={fundcolumns} key-field="Id"  column-width-mode="fixed">
                                                </lightning-datatable>
                                                <footer class="slds-modal__footer">
                                                <lightning-button variant="brand" label="Create Services" onclick={openServicePage}></lightning-button>&nbsp;&nbsp;
                                                    <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                                                </footer>
                                            </template>    

                                            <template if:true={openservice}>                                            
                                                <header class="slds-modal__header">
                                                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                                                    <lightning-icon icon-name="utility:close"
                                                        alternative-text="close"
                                                        variant="inverse"
                                                        size="small" ></lightning-icon>
                                                    <span class="slds-assistive-text">Close</span>
                                                    </button>
                                                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Create Service Plan</h2><!--slds-text-heading_medium slds-hyphenate-->
                                                </header>
                                            
                                                <!-- modal body start -->
                                            
                                                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                                                    <lightning-record-edit-form object-api-name="Services_and_Support_Plan__c" onsuccess={handleSuccess} onsubmit={handleSubmit} onerror={handleError}>
                                                        <lightning-messages></lightning-messages>
                                                        <div class="slds-grid">
                                                            <div class="slds-col slds-size_1-of-2">                                                   
                                                                <lightning-input-field field-name="Funds_Tracker__c" value={selectedfund} disabled="true"></lightning-input-field>
                                                                <lightning-input-field field-name="Service_Users__c"></lightning-input-field>
                                                                <lightning-input-field field-name="Plan_Type__c" value={plantype}></lightning-input-field> 	
                                                                <lightning-input-field field-name="State__c" onchange={stateChange}></lightning-input-field>
                                                                <lightning-input-field field-name="Services__c" onchange={serviceChange} value={ndisName} disabled="true"></lightning-input-field>
                                                            <!--  <lightning-input type="text" label="Select Service Type"  onchange={serviceChange} value={ndisName} required="true"></lightning-input> --> <br/>                                  
                                                            </div>
                                                            <div class="slds-col slds-size_1-of-2">
                                                                <lightning-input-field field-name="Date_of_Service__c" name="date" onchange={timeChange}></lightning-input-field>
                                                                <lightning-input-field field-name="Start_Time_24_Format__c" name ="startTime" onchange={timeChange}></lightning-input-field>
                                                                <lightning-input-field field-name="End_Time_24_Format__c" name="endTime" onchange={timeChange}></lightning-input-field>
                                                                <div if:true={errorMessageFlag} style="color:red;"> <p>{errorMessage}</p> </div>                                                           
                                                                <lightning-input-field field-name="Qty__c" value={qty} disabled="true"></lightning-input-field>                                                            
                                                                <lightning-input-field field-name="GST__c"></lightning-input-field>   
                                                            </div>
                                                        </div>
                                                        <template if:true={serviceGroupName}>
                                                            <div class="slds-m-left_x-large slds-m-right_x-large" style="height: 200px;">                                             
                                                                <lightning-datatable class="ServiceTable" key-field="Id" data={serviceGroupName} columns={ndisState} column-width-mode="fixed"
                                                                max-row-selection="1" onrowselection={handleRowSelection}>
                                                                </lightning-datatable>
                                                            </div>
                                                        </template><br/><br/>
                                                        <!-- modal footer start-->
                                                        <footer class="slds-align_absolute-center">
                                                            <lightning-button type="submit" variant="brand" label="Save" disabled={saveDisabled}></lightning-button>&nbsp;&nbsp;
                                                            <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                                                        </footer>
                                                    </lightning-record-edit-form>  
                                                </div>
                                            </template>
                                        </div>
                                    </section>
                                    <div class="slds-backdrop slds-backdrop_open"></div>
                                    </template>
        
                                <!-- modal end -->  
                                <div class="slds-m-left_x-large slds-m-right_x-large">                            
                                    <lightning-datatable class="servTable" key-field="Id" data={accList} columns={columns} column-width-mode="fixed"  onrowaction={handleRowActions} onrowselection={handleSelected} >
                                    </lightning-datatable>
                                </div>

                                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;">
                                    <!--RECORDS PER PAGE-->
                                    <div class="slds-col">
                                        <div class="slds-list_inline slds-p-bottom_xx-small">
                                            <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage">Page Size:</label>
                                            <div class="slds-select_container">
                                                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                                    <template for:each={pageSizeOptions} for:item="option">
                                                        <option key={option} value={option}>{option}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
        
                                    <!--PAGE NAVIGATION-->
                                    <div class="slds-align_absolute-center" style="height:5rem">
                                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                                        &nbsp;
                                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                                        &nbsp;
                                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                                    </div>
                                    <!--TOTAL RECORDS-->
                                    <div class="slds-clearfix">
                                        <div class="slds-float_right">
                                            <span class="slds-badge"> Total Records: {totalRecords}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <!--Spinner Starting-->
                                <div if:true={showLoadingSpinner}>
                                    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                                </div>
                                <template if:true={isEdit}>
                                    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true" aria-describedby="modal-content-id-2" class="slds-modal slds-fade-in-open slds-modal_medium">
                                        <div class="slds-modal__container">
                                            <!-- modal header start -->
                                            <header class="slds-modal__header">
                                                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                                                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small" ></lightning-icon>
                                                    <span class="slds-assistive-text">Close</span>
                                                </button>
                                                    <h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Update Support Plan</h2>
                                            </header>
                                            
                                            <!-- modal body start -->
                                            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                                                <lightning-record-edit-form object-api-name="Services_and_Support_Plan__c" onsuccess={handleSuccess} onsubmit={handleSubmit} record-id={recordId}>
                                                    <lightning-messages></lightning-messages>
                                                    <div class="slds-grid">
                                                        <div class="slds-col slds-size_1-of-2">
                                                            <lightning-input-field field-name="Date_of_Service__c" name="date" disabled="true" ></lightning-input-field>
                                                            <lightning-input-field field-name="Start_Time_24_Format__c" name ="startTime"  disabled="true"></lightning-input-field>
                                                            <lightning-input-field field-name="End_Time_24_Format__c" name="endTime" disabled="true"></lightning-input-field>                                                          
                                                            <lightning-input-field field-name="Qty__c" disabled="true"></lightning-input-field>                                                            
                                                            <lightning-input-field field-name="GST__c" disabled="true"></lightning-input-field>  
                                                        </div>
                                                        <div class="slds-col slds-size_1-of-2">  
                                                            <!-- <lightning-input-field field-name="Funds_Tracker__c" value={selectedfund} disabled="true"></lightning-input-field> -->

                                                            <lightning-input-field field-name="Service_Users__c" disabled="true"></lightning-input-field>
                                                            <lightning-input-field field-name="Plan_Type__c" disabled="true"></lightning-input-field>
                                                            <div class="slds-grid slds-align-middle">
                                                                <label class="slds-form-element__label slds-size_1-of-3">Service Type</label>
                                                                <div class="slds-size_2-of-3">
                                                                    <lightning-combobox
                                                                        name="ServiceType"
                                                                        value={selectedfund}
                                                                        placeholder="Select Service Type"
                                                                        options={fundOption}
                                                                        onchange={handleServiceChange} style="margin-top:-5%;">
                                                                    </lightning-combobox>
                                                                </div>
                                                              </div>
                                                              <div class="slds-grid slds-align-middle">

                                                                <label class="slds-form-element__label slds-size_1-of-3 slds-m-top_medium">State</label>
                                                                <div class="slds-size_2-of-3">
                                                                  
                                                                    <lightning-combobox
                                                                        name="State"
                                                                        value={stateValue}
                                                                        placeholder="Select State"
                                                                        options={stateOptions}
                                                                        onchange={HandlestateChange} 
                                                                        data-ref="inedit">
                                                                    </lightning-combobox>
                                                                </div>
                                                              </div>
                                                             <br/>
                                                        </div>
                                                          
                                                    </div> <br/>
                                                    <template if:true={NdisServiceGroupNameinEdit}>
                                                    <div  class="servicetable">
                                                       
                                                          <table  >
                                                            <thead >
                                                                <tr>
                                                                    <!-- Add a header for checkboxes -->
                                                                    <th>Select</th>
                                                                    <th>Support Item Name</th>
                                                                    <th>Support Item Number</th>
                                                                    <th>Amount</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                <!-- Iterate through `serviceGroupName` to display rows -->
                                                                <template for:each={serviceGroupName} for:item="row">
                                                                    <tr key={row.Id} class="tr1">
                                                                        <!-- Checkbox for selection -->
                                                                        <td style="text-align: center; vertical-align: middle;padding-top: 5px;box-sizing: border-box;">
                                                                            <input 
                                                                                type="radio"  
                                                                                data-id={row.Id} 
                                                                                data-name={row.Name} 
                                                                                onchange={handleCheckboxSelection}
                                                                                checked={row.isSelected} 
                                                                                
                                                                                />
                                                                        </td>
                                                                        <td>{row.Support_Item_Name__c}</td>
                                                                        <td>{row.Support_Item_Number__c}</td>
                                                                        <td>{row.amount}</td>
                                                                    </tr>
                                                                </template>
                                                            </tbody>
                                                        </table>
                                                       
                                                    </div>
                                                </template>
                                                <!-- modal footer start-->
                            
                                                    <lightning-button type="submit" variant="brand" label="Update" style="margin-left:45%;" ></lightning-button>&nbsp;&nbsp;
                                                    <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                                                </lightning-record-edit-form>  
                                            </div>
                                        </div>
                                    </section>
                                    <div class="slds-backdrop slds-backdrop_open"></div>
                                </template> 
                        </template>
                    </lightning-card>
                </lightning-accordion-section>
            </template>
    
            <lightning-accordion-section name="Service Agreement" label="Service Agreement">                
                <lightning-card>                
                    <c-service-agreement client-id={clientId}></c-service-agreement>
                        <!-- <template if:true={imagelistFlag}>
                                <div class="slds-grid  slds-grid_align-spread slds-m-left_large" style="padding-top: 0.5em; font-size:15px;">
                                    <p style="color: #254ca1;">Service Agreement is not yet uploaded for the participant.</p>
                                </div>
                            </template> -->
                    </lightning-card>
            </lightning-accordion-section>
            
            <lightning-accordion-section name="Invoices" label="Invoices">
                <div class="slds-float_right" style="padding-bottom:1%;">
                <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={readInvoiceDetails}>
                    <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                    </svg>
                </button></div>
                <template if:true={isInvoiceflag}>
                    <div  >
                        <table
                            class="slds-table slds-table_cell-buffer"
                            style="table-layout:fixed">
                            <thead>
                                <tr>
                                    <th class="slds-cell-wrap">Invoice</th>
                                    <th class="slds-cell-wrap">User Name</th>
                                    <th class="slds-cell-wrap">Date of Invoice</th>
                                    <th class="slds-cell-wrap">Action</th>                                                            
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={invoiceTable} for:item="acc">
                                    <tr key={acc.Id} class="tr1">
                                        <td class="slds-cell-wrap">{acc.name}</td>
                                        <td class="slds-cell-wrap">{acc.userName}</td>
                                        <td class="slds-cell-wrap">{acc.dateIssued	}</td>  
                                          
                                        <td>
                                            <div><a href={acc.Amazon_Service_URL__c} data-id={acc.Id} data-url={acc.Amazon_Service_URL__c}  
                                                onclick={handleView} title="View Invoice"><lightning-icon icon-name="action:preview" size="xx-small" title="View" style="cursor:pointer;background:#808080;"></lightning-icon></a></div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    </template>

                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;">
                        <!--RECORDS PER PAGE-->
                        <div class="slds-col">
                            <div class="slds-list_inline slds-p-bottom_xx-small">
                                <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage">Page Size:</label>
                                <div class="slds-select_container">
                                    <select class="slds-select"  onchange={handleRecordsPerPage1}>
                                        <template for:each={pageSizeOptions1} for:item="option">
                                            <option key={option} value={option}>{option}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!--PAGE NAVIGATION-->
                        <div class="slds-align_absolute-center" style="height:5rem">
                            <lightning-button disabled={bDisableFirst1} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage1}></lightning-button>
                            <lightning-button disabled={bDisableFirst1} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage1}></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber1} &nbsp;of&nbsp; {totalPages1} &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast1} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage1} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast1} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage1} icon-position="right"></lightning-button>
                        </div>
                        <!--TOTAL RECORDS-->
                        <div class="slds-clearfix">
                            <div class="slds-float_right">
                                <span class="slds-badge"> Total Records: {totalRecords1}</span>
                            </div>
                        </div>
                    </div>

                    <template if:true={isModalOpen}>
                        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                         class="slds-modal slds-fade-in-open slds-modal_large" style="height: 750px;" role="dialog" tabindex="-1">
                        
                          <div class="slds-modal__container">
                            <!-- modal header start -->
                            <header class="slds-modal__header">
                              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                                onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                  size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                              </button>
                              <h2  class="slds-text-heading_medium slds-hyphenate">View Attachment</h2>
                            </header>
                            <!-- modal body start -->
                            <div class="slds-modal__content slds-p-around_medium">
                              <iframe src={currentUrl} width="1300px" height="1000px" ></iframe>
                              </div>
                              <footer class="slds-modal__footer">
                                    <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
                              </footer>
                            <!-- modal footer start-->
                          </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open"></div>
                    </template>
            </lightning-accordion-section>
            <!--invoice generate logic-->
            
            
        </lightning-accordion>
    </div>
</template>
