<template>
    <lightning-card title="">
        <c-home-lwc></c-home-lwc>
        <div if:true={isDesktop}>
            <div class="slds-grid slds-wrap">              
                <div class="slds-size_1-of-8" style="background-color:rgb(248, 248, 197);margin-top:-1.1%" >
                    <div class={selectedClass} style="height:110px">
                        <img style="max-height: 70px; max-width: 70px;position:absolute;left:3%;"
                            data-name="recruitment" title="Recruitment & Onboarding" alt="Recruitment & Onboarding"
                            name="recruitment" src={recruitment} onclick={handleOnboard} />
                    </div>
                    <div class={selectedClassemp} style="height:110px">
                        <img style="max-height: 70px; max-width: 70px;position:absolute;left:3%;"
                            data-name="employee" title="Employee Management" alt="Employee Management" name="employee"
                            src={employee} onclick={handleEmp} />
                    </div>
                    <div class={selectedClassrewards} style="height:110px">
                        <img style="max-height: 70px; max-width: 70px;position:absolute;left:3%;"
                            data-name="rewards" title="Rewards & Recognition " alt="Rewards & Recognition"
                            name="rewards" src={rewards} onclick={handleRewards} />
                    </div>
                    <div class={selectedClasstraining} style="height:110px">
                        <img style="max-height: 70px; max-width: 70px;position:absolute;left:3%;"
                            data-name="training" title="Training and Evaluation" alt="Training and Evaluation"
                            name="training" src={training} onclick={handleTraining} />
                    </div>
                </div>
              
                <div class="slds-size_7-of-8" >
                <!-- Recruitment & Onboarding Start-->
                <template if:true={onboardFlag}>
                    <div class="slds-size_8-of-8 slds-m-top_large ">
                        <div class=" slds-var-m-right_x-large" style="margin-left:4%;margin-right:4%">
                            <div class="slds-grid slds-wrap  slds-border_bottom" >
                              <div  onclick={openjobAdModal} style="cursor:pointer;text-align:center"
                                    class={selectedClassJob}>Job Advertisements</div>
                                <div onclick={openAppstatusModal} style="cursor:pointer;text-align:center"
                                    class={selectedClassApplication}>Appications</div>
                                    <div onclick={openInterviewModal} style="cursor:pointer;text-align:center"
                                    class={selectedClassinterview}>Interviews</div>
                                    <div onclick={offerDocumentation} style="cursor:pointer;text-align:center"
                                    class={selectedClassJoboffer}>Offer & Documentations</div>
                                    <div onclick={onBoarding} style="cursor:pointer;text-align:center"
                                    class={selectedClassonboard}>Onboarding</div>                                
                            </div>
                            <!--Job Advertisement start-->
                            <template if:true={isJobAdModalOpen}>
                                <!--Display list of Job Advertisement -->
                                <div if:true={jobAdDisplay}>
                                    <lightning-button label="Create New Job "
                                        class="slds-float_right slds-m-bottom_medium slds-m-top_medium"
                                        onclick={handleCreateNewJobAdd} variant="brand"></lightning-button>
                                    <table
                                        class="slds-table slds-border_left slds-border_right  slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-m-right_small"
                                        style="table-layout: fixed;">
                                        <thead>
                                            <tr>
                                                <th class="slds-cell-wrap ">
                                                    <div class="slds-align_absolute-center">
                                                        Job ID</div>
                                                </th>
                                                <th class="slds-cell-wrap ">
                                                    <div class="slds-align_absolute-center">Job Title</div>
                                                </th>
                                                <th class="slds-cell-wrap ">
                                                    <div class="slds-align_absolute-center">Job Description</div>
                                                </th>
                                                <th class="slds-cell-wrap ">
                                                    <div class="slds-align_absolute-center">Facility Name</div>
                                                </th>
                                                <th class="slds-cell-wrap ">
                                                    <div class="slds-align_absolute-center">Contract Type</div>
                                                </th>
                                                <th class="slds-cell-wrap ">
                                                    <div class="slds-align_absolute-center">Action</div>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={accounts} for:item="acc">
                                                <tr key={acc.Id}>
                                                    <td class="slds-cell-wrap">
                                                        <div class="slds-align_absolute-center"><lightning-formatted-url value={acc.jobTitle}
                                                            label={acc.Name}></lightning-formatted-url></div>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <div class="slds-align_absolute-center">{acc.Job_Title__c}</div>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <div class="slds-align_absolute-center">{acc.Job_description__c}
                                                        </div>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <div class="slds-align_absolute-center"> {acc.FName__c} </div>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <div class="slds-align_absolute-center">{acc.Contract_type__c}
                                                        </div>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-button class="slds-align_absolute-center"
                                                            label="Re-Publish" variant="brand"></lightning-button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                                <!--Display list of Job Advertisement End-->
                                <div if:false={jobAdDisplay}>
                                    <lightning-card title="Create New Job">
                                        <lightning-record-edit-form object-api-name="Advertisement__c">
                                            <div class="slds-grid slds-wrap">
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-input type="text" label="Job Title" required="true"
                                                            name="title" onchange={handleChangeAd}></lightning-input>
                                                    </div>
                                                </div>

                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-combobox name="facility" label="Facility Name"
                                                            value={selectedValue} placeholder="Select Facility"
                                                            options={facilityOptions} onchange={handleChangeAd}
                                                            required="true"></lightning-combobox>
                                                    </div>
                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-combobox name="location" label="Location"
                                                            value={selectedValue} placeholder="Select Location"
                                                            options={LocationPicklistValues.data.values}
                                                            onchange={handleChangeAd}></lightning-combobox>
                                                    </div>
                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-input type="text" label="Contact Name"
                                                            name="contactnumber" value={contact}></lightning-input>
                                                    </div>

                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-combobox name="contracttype" label="Contract Type"
                                                            value={selectedValue} placeholder="Select Contract Type"
                                                            options={contractPicklistValues.data.values}
                                                            onchange={handleChangeAd}></lightning-combobox>
                                                    </div>
                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-input type="text"
                                                            label="Contact Number(Depends on Contact)"
                                                            name="contactnumber" value={staffContact}></lightning-input>
                                                    </div>
                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-input type="date" label="Start Date" name="sDate"
                                                            onchange={handleChangeAd}></lightning-input>
                                                    </div>
                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-input type="text"
                                                            label="Contact Email(Depends on Contact)"
                                                            name="contactEmail" value={staffEmail}></lightning-input>
                                                    </div>
                                                </div>

                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-input type="date" label="End Date" name="eDate"
                                                            onchange={handleChangeAd}></lightning-input>
                                                    </div>
                                                </div>
                                                <div class="slds-size_1-of-1">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-textarea label="Job Description" name="description"
                                                            onchange={handleChangeAd}></lightning-textarea>
                                                    </div>
                                                </div>
                                                <div class="slds-size_1-of-1">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-textarea label="Roles and Responsibilities"
                                                            name="roles" onchange={handleChangeAd}></lightning-textarea>
                                                    </div>
                                                </div>

                                                <div slot="footer" class="slds-align_absolute-center slds-m-top_medium">
                                                    <lightning-button label="Save" onclick={handleSubmit}
                                                        variant="brand" class="slds-m-right_medium"></lightning-button>
                                                    <lightning-button label="Cancel" onclick={closeCreateNewJobAdd}
                                                        variant="brand" class="slds-m-right_medium"></lightning-button>
                                                    <lightning-button label="Publish" variant="brand"
                                                        class="slds-m-right_medium"></lightning-button>
                                                </div>
                                            </div>

                                        </lightning-record-edit-form>
                                    </lightning-card>
                                </div>
                            </template>
                            <!--Job Advertisement end-->
                            <!--Job Application Statusstart -->
                            <template if:true={isAppstatusModalOpen}>
                                <c-hrjob-application></c-hrjob-application>
                            </template>
                            <!--Job Application Statusend -->
                            <!--Interviews start -->
                            <template if:true={isinterviewsModalOpen}>
                                <c-hrinterview></c-hrinterview>
                            </template>
                            <!--Interviews end -->
                            <!--offerDocumentation start -->
                            <template if:true={offerdocumentation}>
                                <c-offer-documentation></c-offer-documentation>
                            </template>
                            <!--offerDocumentation end -->
                            <!--onBoarding start -->
                            <template if:true={onboarding}>
                                <c-on-boarding></c-on-boarding>
                            </template>
                            <!--onBoarding end -->
                        </div>
                    </div>
                </template>
                <!--  Recruitment & Onboarding End-->
                <template if:true={empManagementflag}>
                    <div class="slds-size_8-of-8 slds-m-top_large">
                        <div class=" slds-var-m-right_x-large" style="margin-right:4%;margin-left:4%">
                            <div class="slds-grid slds-wrap  slds-border_bottom" >
                                <!--<div  onclick={handleAddEmp} style="cursor:pointer;text-align:center" data-name="addemployee"
                                      class={selectedClassaddemp}>Add Employee</div>-->
                                      <div  onclick={handleAddEmp} style="cursor:pointer;text-align:center" data-name="viewemployee"
                                      class={selectedClassviewemp}>View Employee</div>
                                      <div  onclick={handleAddEmp} style="cursor:pointer;text-align:center" data-name="searchemployee"
                                      class={selectedClasssearchemp}>Search</div>
                                </div>                            
                            <template if:true={addEmployee}>
                                <div class="slds-size_7-of-7 ">
                                    <div class="slds-m-top_medium"><c-emp-management></c-emp-management></div>
                                    <div class="slds-align_absolute-center slds-m-around_small">
                                       <lightning-button label="Save" variant="brand" type="submit"
                                            onclick={handleSave} class="slds-m-around_small"></lightning-button>
                                        <lightning-button label="Cancel" variant="brand" onclick={cancelEmp}
                                            class="slds-m-around_small"></lightning-button> 
                                    </div>
                                </div>
                            </template>
                            <template if:true={viewEmployee}>
                                
                                <lightning-button label="Add Employee "
                                        class="slds-float_right slds-m-bottom_medium slds-m-top_medium"
                                        onclick={handleAddEmployee} variant="brand"></lightning-button>

                                <div class="slds-size_7-of-7 slds-m-top_xx-large">
                                    <table
                                        class="slds-table slds-border_left slds-border_right  slds-table_cell-buffer slds-table_bordered slds-table_col-bordered "
                                        style="table-layout: fixed;">
                                        <thead>
                                            <tr>
                                                <th>First Name</th>
                                                <th>Last Name</th>
                                                <th>Contact Number</th>
                                                <th>Email Address</th>
                                                <th>Emergency Contact</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={recentEmpData} for:item="acc">
                                                <tr key={acc.Id}>
                                                    <td class="slds-cell-wrap"> <a href={acc.Name}
                                                            targer="_blank">{acc.Name__c}
                                                        </a>
                                                    </td>
                                                    <td class="slds-cell-wrap">{acc.Last_Name__c}</td>
                                                    <td class="slds-cell-wrap">
                                                        {acc.Contact_Number__c}
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        {acc.Email_Address__c}
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        {acc.Emergency_Phone_Number__c}
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-button icon-name="utility:edit" variant="base"
                                                            data-id={acc.Id} onclick={handleEdit}></lightning-button>
                                                    </td>
                                                </tr>
                                            </template>

                                        </tbody>
                                    </table>
                                </div>
                            </template>
                            <template if:true={searchEmployee}>
                                <div class="slds-size_7-of-7 ">
                                    <div class="slds-m-top_medium"><c-search-employee></c-search-employee></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
                <!-- rewards start-->
                <template if:true={rewardsFlag}>
                    <div class="slds-size_7-of-8 slds-m-top_large">
                        <div class="slds-grid  slds-grid_align-spread slds-m-left_large"
                            style="padding-top: 0.5em; font-size:15px;">
                            <b style="color: Red"><I> Working on this page</I> </b>
                        </div>
                    </div>
                </template>
                <!-- rewards end-->
                <!-- training start-->
                <template if:true={trainingFlag}>
                    <div class="slds-size_7-of-8 slds-m-top_large">
                        <div class="slds-grid  slds-grid_align-spread slds-m-left_large"
                            style="padding-top: 0.5em; font-size:15px;">
                            <b style="color: Red"><I> Working on this page</I> </b>
                        </div>
                    </div>
                </template>
                <!-- training end-->  
                </div>             
            </div>
        </div>

        <!--mobile-->
        <div if:true={isMobile}>
            <div class="slds-grid slds-wrap" style="background-color:rgb(248, 248, 197);margin-top:-1.1%">              
               
                    <span class="slds-size_1-of-4">
                    <div class={selectedClass} style="height:90px">
                        <img style="max-height: 50px; max-width: 50px;position:absolute;"
                            data-name="recruitment" title="Recruitment & Onboarding" alt="Recruitment & Onboarding"
                            name="recruitment" src={recruitment} onclick={handleOnboard} />
                    </div></span>
                    <span class="slds-size_1-of-4">
                    <div class={selectedClassemp} style="height:90px">
                        <img style="max-height: 50px; max-width: 50px;position:absolute;"

                            src={employee} onclick={handleEmp} />
                    </div>
                    </span>
                    <span class="slds-size_1-of-4">
                    <div class={selectedClassrewards} style="height:90px">
                        <img style="max-height: 50px; max-width: 50px;position:absolute;"

                    </div>

                    </div>
                    </span>
               
            </div>

                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-input type="date" label="End Date" name="eDate"
                                                            onchange={handleChangeAd}></lightning-input>
                                                    </div>
                                                </div>
                                                <div class="slds-size_1-of-1">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-textarea label="Job Description" name="description"
                                                            onchange={handleChangeAd}></lightning-textarea>
                                                    </div>
                                                </div>
                                                <div class="slds-size_1-of-1">
                                                    <div class="slds-m-right_medium slds-m-left_medium">
                                                        <lightning-textarea label="Roles and Responsibilities"
                                                            name="roles" onchange={handleChangeAd}></lightning-textarea>
                                                    </div>
                                                </div>

                                                <div slot="footer" class="slds-align_absolute-center slds-m-top_medium">
                                                    <lightning-button label="Save" onclick={handleSubmit}
                                                        variant="brand" class="slds-m-right_medium"></lightning-button>
                                                    <lightning-button label="Cancel" onclick={closeCreateNewJobAdd}
                                                        variant="brand" class="slds-m-right_medium"></lightning-button>
                                                    <lightning-button label="Publish" variant="brand"
                                                        class="slds-m-right_medium"></lightning-button>
                                                </div>
                                            </div>

                                        </lightning-record-edit-form>
                                    </lightning-card>
                                </div>
                            </template>

                            <!--Job Application Statusstart -->
                            <template if:true={isAppstatusModalOpen}>
                                <c-hrjob-application></c-hrjob-application>
                            </template>
                            <!--Job Application Statusend -->
                            <!--Interviews start -->
                            <template if:true={isinterviewsModalOpen}>
                                <c-hrinterview></c-hrinterview>
                            </template>
                            <!--Interviews end -->
                            <!--offerDocumentation start -->
                            <template if:true={offerdocumentation}>
                                <c-offer-documentation></c-offer-documentation>
                            </template>
                            <!--offerDocumentation end -->
                            <!--onBoarding start -->
                            <template if:true={onboarding}>
                                <c-on-boarding></c-on-boarding>
                            </template>
                            <!--onBoarding end -->
                        </div>
                    </div>
                </template>
                <!--  Recruitment & Onboarding End-->
                <template if:true={empManagementflag}>
                    <div class="slds-size_8-of-8 slds-m-top_large">
                        <div>
                            <div class="slds-grid slds-wrap  slds-border_bottom" >
                                <div  onclick={handleAddEmp} style="cursor:pointer;text-align:center" data-name="viewemployee"
                                      class={selectedClassviewempmob}>View Employee</div>
                                <div  onclick={handleAddEmp} style="cursor:pointer;text-align:center" data-name="searchemployee"
                                      class={selectedClasssearchempmob}>Search</div>
                            </div>                            
                            <template if:true={addEmployee}>
                                <div class="slds-size_7-of-7 ">
                                    <div class="slds-m-top_medium"><c-emp-management></c-emp-management></div>
                                    <div class="slds-align_absolute-center slds-m-around_small">
                                       <lightning-button label="Save" variant="brand" type="submit"
                                            onclick={handleSave} class="slds-m-around_small"></lightning-button>
                                        <lightning-button label="Cancel" variant="brand" onclick={cancelEmp}
                                            class="slds-m-around_small"></lightning-button> 
                                    </div>
                                </div>
                            </template>
                            <template if:true={viewEmployee}>
                                
                                <lightning-button label="Add Employee "
                                        class="slds-float_right slds-m-bottom_medium slds-m-top_medium"
                                        onclick={handleAddEmployee} variant="brand"></lightning-button>

                                <div class="slds-size_7-of-7 slds-m-top_xx-large">
                                    <table
                                        class="slds-table slds-border_left slds-border_right  slds-table_cell-buffer slds-table_bordered slds-table_col-bordered "
                                        style="table-layout: fixed;">
                                        <thead>
                                            <tr>
                                                <th class="slds-cell-wrap">First Name</th>
                                                <th class="slds-cell-wrap">Last Name</th>
                                                <th class="slds-cell-wrap">Contact Number</th>
                                                <th class="slds-cell-wrap">Email Address</th>
                                                <th class="slds-cell-wrap">Emergency Contact</th>
                                                <th class="slds-cell-wrap">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={recentEmpData} for:item="acc">
                                                <tr key={acc.Id}>
                                                    <td class="slds-cell-wrap"> <a href={acc.Name}
                                                            targer="_blank">{acc.Name__c}
                                                        </a>
                                                    </td>
                                                    <td class="slds-cell-wrap">{acc.Last_Name__c}</td>
                                                    <td class="slds-cell-wrap">
                                                        {acc.Contact_Number__c}
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        {acc.Email_Address__c}
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        {acc.Emergency_Phone_Number__c}
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-button icon-name="utility:edit" variant="base"
                                                            data-id={acc.Id} onclick={handleEdit}></lightning-button>
                                                    </td>
                                                </tr>
                                            </template>

                                        </tbody>
                                    </table>
                                </div>
                            </template>
                            <template if:true={searchEmployee}>
                                <div class="slds-size_7-of-7 ">
                                    <div class="slds-m-top_medium"><c-search-employee></c-search-employee></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
                <!-- rewards start-->
                <template if:true={rewardsFlag}>
                    <div class="slds-size_7-of-8 slds-m-top_large">
                        <div class="slds-grid  slds-grid_align-spread slds-m-left_large"
                            style="padding-top: 0.5em; font-size:15px;">
                            <b style="color: Red"><I> Working on this page</I> </b>
                        </div>
                    </div>
                </template>
                <!-- rewards end-->
                <!-- training start-->
                <template if:true={trainingFlag}>
                    <div class="slds-size_7-of-8 slds-m-top_large">
                        <div class="slds-grid  slds-grid_align-spread slds-m-left_large"
                            style="padding-top: 0.5em; font-size:15px;">
                            <b style="color: Red"><I> Working on this page</I> </b>
                        </div>
                    </div>
                </template>
                <!-- training end-->  
                </div>             
           
        </div>
        <!-- Mobile end-->
        <div class="slds-m-top_x-large">
        <c-footer-lwc></c-footer-lwc>
        </div>
    </lightning-card>
</template>
