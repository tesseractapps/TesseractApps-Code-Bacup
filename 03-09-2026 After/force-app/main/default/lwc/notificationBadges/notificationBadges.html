<div
    class="alerts-link"
    onclick={toggleDropdown}
>
    <span class="alerts-text">Alerts</span>

    <template if:true={unreadCount}>
        <span class="alerts-count">
            {unreadCount}
        </span>
    </template>
</div>
        <!-- DROPDOWN -->

<template if:true={showDropdown}>

    <div class="dropdown">

        <div class="dropdown-header">
            <div class="header-left">
                <lightning-icon
                    icon-name="utility:notification"
                    size="x-small"
                    class="header-icon">
                </lightning-icon>

                <span class="header-title">
                    Actionable Alerts
                </span>

                <template if:true={unreadCount}>
                    <span class="header-count">
                        {unreadCount}
                    </span>
                </template>
            </div>

            <lightning-button-icon
                icon-name="utility:close"
                size="small"
                variant="bare"
                alternative-text="Close"
                onclick={toggleDropdown}>
            </lightning-button-icon>
        </div>
        <div class="notification-list  custom-scroll">
        <template if:true={moduleSummary.length}>                             
                    <template  for:each={notifications}  for:item="item"> 
                         <div
                            key={item.Id}
                            class="notification-item"
                            data-module={item.Module__c}
                            data-participantid={item.Client__c}
                            data-recordid={item.Record_Id__c}
                            data-facilityid={item.Facility__c}
                            data-facilityname={item.Facility__r.Name} 
                            data-message={item.Message__c}
                            onclick={handleRedirectClick}>
                            <div class="notification-content">
                                <div class="notification-header">
                                    <div class="title">
                                        {item.Title__c}
                                    </div>

                                    <div class="notification-time">
                                        {item.relativeTime}
                                    </div>
                                </div>

                                <div class="message">
                                    {item.Message__c}
                                </div>
                                <template if:true={item.Facility__r}>
                                    <div class="facility-chip">
                                        {item.Facility__r.Name}
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </template>
             <template if:false={moduleSummary.length}>
                <div class="empty-state">
                    No Alerts
                </div>
            </template>
            </div>
            </div>
        </template>
    </div>
</template>
