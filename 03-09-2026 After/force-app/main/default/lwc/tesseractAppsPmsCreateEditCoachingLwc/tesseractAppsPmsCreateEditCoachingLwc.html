<template>
    <template if:true={isHome}>
        <template if:false={viewMode}>
            <div class="slds-p-around_large coaching  custom-scroll">
                <div class="slds-text-heading_medium slds-m-bottom_medium">
                    <template if:true={createMode}>
                        <!-- <template if:true={isManagerCreated}>
                            Created Coaching Session
                        </template> -->
                        <template if:true={isManagerOrHrCreated}>
                            Created Coaching Session
                        </template>
                        <template if:false={isManagerOrHrCreated}>
                            Schedule Coaching Session
                        </template>
                        <!-- <template if:true={isScheduleCoaching}>
                            Schedule Coaching Session
                        </template> -->
                         <!-- <template if:true={isHrCreated}>
                            Created Coaching Session
                        </template>
                        -->
                    </template>

                    <template if:true={isEditMode}>
                        {coachingTitle}
                    </template>
                    <span class="slds-badge slds-theme_warning slds-badge_light slds-truncate coaching-badge"
                        title={coachingCreatedtype}>{coachingCreatedtype}
                    </span>
                    
                </div>
                <hr />
                <template if:false={isManagerOrHrCreated}>
                     <div class="slds-box slds-m-bottom_large">

                        <p class="slds-text-title_bold slds-m-bottom_small">Employee</p>

                        <div class="slds-grid slds-wrap slds-gutters">

                            <div class="slds-col slds-size_1-of-3">
                                <strong>Name:</strong>
                                <p class="slds-text-color_weak">{staffName}</p>
                            </div>

                            <div class="slds-col slds-size_1-of-3">
                                <strong>Role Selection:</strong>
                                <p class="slds-text-color_weak">{staffRole}</p>
                            </div>

                            <div class="slds-col slds-size_1-of-3">
                                <strong>Email:</strong>
                                <p class="slds-text-color_weak">{staffEmail}</p>
                            </div>

                        </div>

                        <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">

                            <div class="slds-col slds-size_1-of-3">
                                <strong>Role Criteria:</strong>
                                <p class="slds-text-color_weak">{templateCriteria}</p>
                            </div>

                            <!-- <div class="slds-col slds-size_1-of-3">
                                <strong>Review Completed:</strong>
                                <p class="slds-text-color_weak">{reviewDate}</p>
                            </div> -->

                        </div>

                    </div>
                </template>
                   

                <div class="slds-m-bottom_small">
                    <!-- <p class="slds-text-title_bold">Information & Meeting Details</p> -->
                    <div class="slds-grid slds-align-center slds-m-bottom_large">

                        <div class="slds-shrink-none">
                            <p class="slds-text-title_bold slds-m-bottom_none">
                                Information & Meeting Details
                            </p>
                        </div>

                        <div class="slds-grow slds-p-left_small">
                            <div class="section-line slds-m-top_small"></div>
                        </div>

                    </div>
                    <template if:false={isManagerOrHrCreated}>
                        <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">

                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span> Coaching Title
                                    </span>
                                    <lightning-input 
                                        name="coachingTitle"
                                        variant="label-hidden"
                                        value={coachingTitle}
                                        required
                                        onchange={handleChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span> Meeting Date
                                    </span>
                                    <lightning-input 
                                        type="date"
                                        name="meetingDate"
                                        variant="label-hidden"
                                        value={meetingDate}
                                        required
                                        onchange={handleChange}>
                                    </lightning-input>
                                </div>
                            </div>
                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span> Meeting Time
                                    </span>
                                    <!-- <lightning-input 
                                        type="time"
                                        name="meetingTime"
                                        variant="label-hidden"
                                        value={meetingTime}
                                        required
                                        onchange={handleChange}>
                                    </lightning-input> -->
                                     <c-tesseract-apps-time-picker
                                        selected-hour={meetingTimeSelectedHour}
                                        selected-minute={meetingTimeSelectedMinute}
                                        is-am={meetingTimeAMPM}
                                        displayed-time={meetingUiTime}
                                        disable-time-button={disableTimeButton}
                                        onsavetimefromchild={handlemeetingTimeData}
                                    ></c-tesseract-apps-time-picker>
                                </div>
                            </div>

                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Location</span>
                                    <lightning-input 
                                        name="location"
                                        variant="label-hidden"
                                        value={location}
                                        onchange={handleChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_medium">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span> Meeting Type
                                    </span>
                                    <lightning-combobox
                                        name="meetingType"
                                        variant="label-hidden"
                                        options={meetingTypeOptions}
                                        value={meetingType}
                                        required
                                        onchange={handleChange}>
                                    </lightning-combobox>
                                </div>
                            </div>
                            
                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_medium">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Description</span>
                                    <lightning-textarea 
                                        name="description"
                                        variant="label-hidden"
                                        value={description}
                                        onchange={handleChange}>
                                    </lightning-textarea>
                                </div>
                            </div>

                        </div>
                    </template>
                    
                     <template if:true={isManagerOrHrCreated}>
                        <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">

                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span> Coaching Title
                                    </span>
                                    <lightning-input 
                                        name="coachingTitle"
                                        variant="label-hidden"
                                        value={coachingTitle}
                                        required
                                        onchange={handleChange}>
                                    </lightning-input>
                                </div>
                            </div>
                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span> Coaching Type
                                    </span>
                                    <lightning-combobox
                                        name="coachingType"
                                        variant="label-hidden"
                                        options={coachingTypeOptions}
                                        value={coachingType}
                                        required
                                        onchange={handleChange}>
                                    </lightning-combobox>
                                </div>
                            </div>
                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span>Role Selection
                                    </span>

                                    <c-tesseract-apps-multi-combobox
                                        options={roleOptions}
                                        placeholder="Select Role"
                                        value={selectedRolesInApply}
                                        onchange={handleRoleChange}>
                                    </c-tesseract-apps-multi-combobox>

                                </div>
                            </div>     
                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Description</span>
                                    <lightning-textarea 
                                        name="description"
                                        variant="label-hidden"
                                        value={description}
                                        onchange={handleChange}>
                                    </lightning-textarea>
                                </div>
                            </div>
                        
                        </div>
                        <template if:true={showStaffMangerHRList}>
                            <div class="slds-box slds-m-top_large">

                                <!-- 1 INDIVIDUAL -->
                                <template if:true={isIndividual}>
                                    <p class="slds-text-title_bold slds-m-bottom_small">Employees</p>
                                    <div class="slds-grid slds-wrap slds-gutters coaching1 custom-scroll">

                                        <template for:each={employeeList} for:item="emp">
                                            <div key={emp.id} class="slds-col slds-size_1-of-3 slds-m-bottom_small">

                                                <div class="slds-grid slds-align-center">

                                                    <lightning-input 
                                                        type="checkbox"
                                                        value={emp.id}
                                                        checked={emp.isSelected}
                                                        onchange={handleSingleSelect}>
                                                    </lightning-input>

                                                    <!-- <lightning-avatar
                                                        src={emp.photo}
                                                        fallback-icon-name="standard:user"
                                                        size="small"
                                                        class="slds-m-horizontal_small">
                                                    </lightning-avatar> -->
                                                    <div class="avatar slds-m-right_small" draggable="false">

                                                        <template if:true={emp.staffProfileUrl}>
                                                            <lightning-avatar
                                                                variant="circle"
                                                                src={emp.staffProfileUrl}
                                                                class="avatar-small"
                                                                fallback-icon-name="standard:person_account">
                                                            </lightning-avatar>
                                                        </template>

                                                        <template if:false={emp.staffProfileUrl}>
                                                            <lightning-icon
                                                                icon-name="standard:user"
                                                                size="small"
                                                                class="avatar-small fallback-icon">
                                                            </lightning-icon>
                                                        </template>

                                                    </div>

                                                    <div>
                                                        <p class="slds-text-title_bold">{emp.name} &nbsp; &nbsp;
                                                            <template if:true={emp.role}>
                                                                ({emp.role})
                                                            </template>
                                                        </p>
                                                        <p class="slds-text-body_small">{emp.email}</p>
                                                    </div>

                                                </div>

                                            </div>
                                        </template>

                                    </div>
                                </template>

                                <!-- 2 GROUP -->
                                <template if:true={isGroup}>
                                    <p class="slds-text-title_bold slds-m-bottom_small">Employees</p>
                                    <div class="slds-grid slds-wrap slds-gutters coaching1 custom-scroll">

                                        <template for:each={employeeList} for:item="emp">
                                            <div key={emp.id} class="slds-col slds-size_1-of-3 slds-m-bottom_small">

                                                <div class="slds-grid slds-align-center">

                                                    <lightning-input 
                                                        type="checkbox"
                                                        value={emp.id}
                                                        checked={emp.isSelected}
                                                        onchange={handleMultiSelect}>
                                                    </lightning-input>

                                                    <!-- <lightning-avatar src={emp.photo}
                                                        fallback-icon-name="standard:user"
                                                        size="small"
                                                        class="slds-m-horizontal_small">
                                                    </lightning-avatar> -->
                                                
                                                    <div class="avatar slds-m-right_small" draggable="false">

                                                        <template if:true={emp.staffProfileUrl}>
                                                            <lightning-avatar
                                                                variant="circle"
                                                                src={emp.staffProfileUrl}
                                                                class="avatar-small"
                                                                fallback-icon-name="standard:person_account">
                                                            </lightning-avatar>
                                                        </template>

                                                        <template if:false={emp.staffProfileUrl}>
                                                            <lightning-icon
                                                                icon-name="standard:user"
                                                                size="small"
                                                                class="avatar-small fallback-icon">
                                                            </lightning-icon>
                                                        </template>

                                                    </div>
                                                    <div>
                                                        <!-- Use a div for the grid container -->
                                                        <div class="slds-grid slds-gutters slds-grid_vertical-align-center">
                                                            <!-- Name Column -->
                                                            <div class="slds-col slds-grow-none slds-text-title_bold">
                                                                {emp.name}
                                                            </div>
                                                            
                                                            <!-- Role Column (Only renders if role exists) -->
                                                            <template if:true={emp.role}>
                                                                <div class="slds-col">
                                                                    <span>({emp.role})</span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                        <p class="slds-text-body_small">{emp.email}</p>
                                                    </div>

                                                </div>

                                            </div>
                                        </template>

                                    </div>
                                </template>

                                <!-- 3 MANAGER + HR -->
                                <template if:true={isManagerHr}>
                                    <!-- <div class="slds-box slds-m-top_large"> -->

                                        <!-- MANAGER BOX -->
                                       
                                            <div class="slds-box slds-m-bottom_small ">
                                                <p class="slds-text-title_bold">Managers</p>
                                                
                                                <div class="slds-grid slds-wrap slds-gutters coaching1 custom-scroll">
                                                     <template for:each={managerList} for:item="mgr">
                                                    <div key={mgr.id} class="slds-col slds-size_1-of-3 slds-m-bottom_small">

                                                        <div class="slds-grid slds-align-center">
                                                            <lightning-input 
                                                                type="checkbox"
                                                                value={mgr.id}
                                                                checked={mgr.isSelected}
                                                                onchange={handleManagerSelect}>
                                                            </lightning-input>
                                                            
                                                            <div class="avatar slds-m-right_small" draggable="false">

                                                                <template if:true={mgr.staffProfileUrl}>
                                                                    <lightning-avatar
                                                                        variant="circle"
                                                                        src={mgr.staffProfileUrl}
                                                                        class="avatar-small"
                                                                        fallback-icon-name="standard:person_account">
                                                                    </lightning-avatar>
                                                                </template>

                                                                <template if:false={mgr.staffProfileUrl}>
                                                                    <lightning-icon
                                                                        icon-name="standard:user"
                                                                        size="small"
                                                                        class="avatar-small fallback-icon">
                                                                    </lightning-icon>
                                                                </template>
                                                            </div>
                                                            <div>
                                                                <!-- <p class="slds-text-title_bold">{mgr.name} &nbsp;  &nbsp;
                                                                    <template if:true={mgr.role}>
                                                                        ({mgr.role})
                                                                    </template>
                                                                </p> -->
                                                                <!-- Wrap name and role in a flex container for consistent alignment -->
                                                                <div class="slds-grid slds-grid_vertical-align-center slds-text-title_bold">
                                                                    <span>{mgr.name}</span>
                                                                    
                                                                    <template if:true={mgr.role}>
                                                                        <!-- Use a left margin utility instead of non-breaking spaces -->
                                                                        <span class="slds-m-left_x-small slds-text-weight_regular slds-text-color_weak">
                                                                            ({mgr.role})
                                                                        </span>
                                                                    </template>
                                                                </div>                                                                
                                                                <p class="slds-text-body_small">{mgr.email}</p>
                                                            </div>
                                                           
                                                        </div>
                                                    </div>
                                                </template>
                                                </div>
                                               
                                            </div>
                                        

                                        <!-- HR BOX -->
                                      
                                        <div class="slds-box slds-m-bottom_small">
                                            <p class="slds-text-title_bold">HR</p>
                                            <div class="slds-grid slds-wrap slds-gutters coaching1 custom-scroll">
                                                <template for:each={hrList} for:item="hr">
                                                    <div key={hr.id} class="slds-col slds-size_1-of-3 slds-m-bottom_small">

                                                        <div class="slds-grid slds-align-center">
                                                            <lightning-input 
                                                                type="checkbox"
                                                                value={hr.id}
                                                                checked={hr.isSelected}
                                                                onchange={handleHrSelect}>
                                                            </lightning-input>
                                                            <div class="avatar slds-m-right_small" draggable="false">

                                                                <template if:true={hr.staffProfileUrl}>
                                                                    <lightning-avatar
                                                                        variant="circle"
                                                                        src={hr.staffProfileUrl}
                                                                        class="avatar-small"
                                                                        fallback-icon-name="standard:person_account">
                                                                    </lightning-avatar>
                                                                </template>

                                                                <template if:false={hr.staffProfileUrl}>
                                                                    <lightning-icon
                                                                        icon-name="standard:user"
                                                                        size="small"
                                                                        class="avatar-small fallback-icon">
                                                                    </lightning-icon>
                                                                </template>
                                                            </div>
                                                            <div>
                                                                <span class="slds-text-title_bold">{hr.name}</span>
                                                                <p class="slds-text-body_small">{hr.email}</p>
                                                            </div>
                                                           
                                                        </div>
                                                    </div>
                                                </template>
                                             </div>
                                                
                                        </div>
                                        

                                    <!-- </div> -->
                                </template>

                                <!-- 4  MANAGERS ONLY -->
                                 <template if:true={isManagerCreated}>
                                    <template if:true={isManagersOnly}>
                                        <div class="slds-box">
                                            <p class="slds-text-title_bold">Managers</p>
                                            <div class="slds-grid slds-wrap slds-gutters coaching1 custom-scroll">

                                                <template for:each={managerList} for:item="mgr">
                                                    <div key={mgr.id} class="slds-col slds-size_1-of-3 slds-m-bottom_small">
                                                        <div class="slds-grid slds-align-center">
                                                            <lightning-input 
                                                                type="checkbox"
                                                                value={mgr.id}
                                                                checked={mgr.isSelected}
                                                                onchange={handleManagerSelect}>
                                                            </lightning-input>
                                                            <div class="avatar slds-m-right_small" draggable="false">

                                                                <template if:true={mgr.staffProfileUrl}>
                                                                    <lightning-avatar
                                                                        variant="circle"
                                                                        src={mgr.staffProfileUrl}
                                                                        class="avatar-small"
                                                                        fallback-icon-name="standard:person_account">
                                                                    </lightning-avatar>
                                                                </template>

                                                                <template if:false={mgr.staffProfileUrl}>
                                                                    <lightning-icon
                                                                        icon-name="standard:user"
                                                                        size="small"
                                                                        class="avatar-small fallback-icon">
                                                                    </lightning-icon>
                                                                </template>
                                                            </div>
                                                            <!-- <span class="slds-m-left_small">{mgr.name}</span> -->
                                                            <div>
                                                                <p class="slds-text-title_bold">{mgr.name} &nbsp;  &nbsp;
                                                                    <template if:true={mgr.role}>
                                                                        ({mgr.role})
                                                                    </template>
                                                                </p>
                                                                <p class="slds-text-body_small">{mgr.email}</p>
                                                            </div>
                                                        </div>
                                                        
                                                    </div>
                                                </template>

                                            </div>
                                        </div>
                                        
                                    </template>
                                 </template>
                                
                                <template if:true={isHrCreated}>
                                    <template if:true={isHrsOnly}>
                                        <div class="slds-box">
                                            <p class="slds-text-title_bold">HRs</p>
                                            <div class="slds-grid slds-wrap slds-gutters coaching1 custom-scroll">

                                                <template for:each={hrList} for:item="hr">
                                                    <div key={hr.id} class="slds-col slds-size_1-of-3 slds-m-bottom_small">

                                                        <div class="slds-grid slds-align-center">
                                                            <lightning-input 
                                                                type="checkbox"
                                                                value={hr.id}
                                                                checked={hr.isSelected}
                                                                onchange={handleHrSelect}>
                                                            </lightning-input>
                                                            <div class="avatar slds-m-right_small" draggable="false">

                                                                <template if:true={hr.staffProfileUrl}>
                                                                    <lightning-avatar
                                                                        variant="circle"
                                                                        src={hr.staffProfileUrl}
                                                                        class="avatar-small"
                                                                        fallback-icon-name="standard:person_account">
                                                                    </lightning-avatar>
                                                                </template>

                                                                <template if:false={hr.staffProfileUrl}>
                                                                    <lightning-icon
                                                                        icon-name="standard:user"
                                                                        size="small"
                                                                        class="avatar-small fallback-icon">
                                                                    </lightning-icon>
                                                                </template>
                                                            </div>
                                                            <div>
                                                                <span class="slds-text-title_bold">{hr.name}</span>
                                                                <p class="slds-text-body_small">{hr.email}</p>
                                                            </div>
                                                           
                                                        </div>
                                                    </div>
                                                </template>

                                            </div>
                                        </div>
                                        
                                    </template>
                                 </template>

                            </div>
                        </template>
                        

                        <!--  MEETING FIELDS -->
                        <div class="slds-grid slds-wrap slds-gutters slds-m-top_x-large">

                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span> Meeting Date
                                    </span>
                                    <lightning-input 
                                        type="date"
                                        name="meetingDate"
                                        variant="label-hidden"
                                        value={meetingDate}
                                        required
                                        onchange={handleChange}>
                                    </lightning-input>
                                </div>
                            </div>
                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span> Meeting Time
                                    </span>
                                    <!-- <lightning-input 
                                        type="time"
                                        name="meetingTime"
                                        variant="label-hidden"
                                        value={meetingTime}
                                        required
                                        onchange={handleChange}>
                                    </lightning-input> -->

                                     <c-tesseract-apps-time-picker
                                        selected-hour={meetingTimeSelectedHour}
                                        selected-minute={meetingTimeSelectedMinute}
                                        is-am={meetingTimeAMPM}
                                        displayed-time={meetingUiTime}
                                        disable-time-button={disableTimeButton}
                                        onsavetimefromchild={handlemeetingTimeData}
                                    ></c-tesseract-apps-time-picker>
                                </div>
                            </div>

                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">Location</span>
                                    <lightning-input 
                                        name="location"
                                        variant="label-hidden"
                                        value={location}
                                        onchange={handleChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <div class="slds-col slds-large-size_1-of-4 slds-size_1-of-1 slds-p-around_xx-small">
                                <div class="floating-label-new">
                                    <span class="label-text-drop">
                                        <span style="color:red">*</span> Meeting Type
                                    </span>
                                    <lightning-combobox
                                        name="meetingType"
                                        variant="label-hidden"
                                        options={meetingTypeOptions}
