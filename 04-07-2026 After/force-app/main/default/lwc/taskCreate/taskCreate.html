<template>

                    </div>
                     </div>

                        <span class="label-text">Time<span style="color:red">*</span></span>

                        </lightning-input>
                    </div> -->

                      >

                        selected-minute={startTimeSelectedMinute}
                        is-am={startTimeAMPM}

                        disable-time-button={disableTimeButton}
                        onsavetimefromchild={handleTaskTime}
                      ></c-tesseract-apps-time-picker>

                     </div>

                   <!--  <div class="floating-label">

                    <span class="label-text">Priority</span>
                    <lightning-combobox 
                        name="priority" 
                        variant="label-hidden" 
                        label="Priority" 
                        value={priorityValue} 
                        placeholder="Select Priority" 
                        options={optionsPriority} 
                        onchange={handleChange}>
                    </lightning-combobox>
                </div>
             </div>

                </div>

                <!-- Second Row -->

                    <span class="label-text">Comments</span>
                    <lightning-textarea 
                        name="comments" 
                        value={commentsValue} 
                        variant="label-hidden" 
                        label="Comments" 
                        onchange={handleChange}
                        maxlength="1000">
                        
                    </lightning-textarea>
                   </div>
                   </div>

                                                <p class="slds-text-align_center">
                                                    Drag and drop files here<br />
                                                    <a href="javascript:void(0);"  onclick={triggerFileInput}>Click to browse</a>
                                                </p>

                                                <input type="file" class="hidden-file-input"  onchange={handleFileUploadInputChange} multiple={allowMultiple}/><!-- accept=".pdf,.png,.jpg,.jpeg"-->

                                <div class="slds-text-body_small" style="display: flex;align-items:center;">
                                    {fileName}  
                                </div>
                            </template> -->
                            <template if:true={isFileExpand}>
                                    <c-document-office-service
                                        record-id={recordId}
                                        module-path-from-parent="ticket"
                                        onuploadcomplete={handleAwsUploadComplete}
                                        onfiledeleted={handleFileDeleted}
                                        oncancel={handlefilecancel}>

                                    </c-document-office-service>
                                </template>
                        </div>

                    <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-12">
                    <div class="floating-label">
                    <span class="label-text">Status</span>
                    <lightning-combobox 
                        name="status" 
                        required="true" 
                        variant="label-hidden" 
                        label="Status" 
                        value={statusValue} 
                        placeholder="Select Status" 
                        options={optionsStatus} 
                        onchange={handleChange}>
                    </lightning-combobox>
                     </div>
                    </div>

                    

                </div>

                        <div class="radio-item">
                            <lightning-input

                                name="reminderType"
                                value="Immediate"
                                checked={isImmediate}
                                onchange={handleReminderChange} disabled={disableedit}>
                            </lightning-input>

                            <div>
                                <div class="radio-title">
                                    Notify Immediately
                                </div>

                                <div class="radio-desc">
                                    Send reminder instantly
                                </div>
                            </div>
                        </div>

                       <!--  <div class="radio-item">

                    <span>Assignment Options <span style="color:red">*</span></span>

                <div class="assignment-container">

                    <div class="radio-section">

                        <div class="radio-item">
                            <lightning-input  name="assignmentType"
                                value="staff"
                                checked={isAssignToStaff}
                                onchange={handleAssignmentType}
                                type="radio" disabled={disableedit}>
                            </lightning-input>

                            <div>
                                <div class="radio-title">
                                    Assign to Staff Member
                                </div>

                                <div class="radio-desc">
                                    Select staff member
                                </div>
                            </div>
                        </div>

                       

                    </div>
                     <template if:true={isAssignToStaff}>
                    <div class="role-search">

                        <div class="floating-label">
                              <span class="label-text-drop">
                                 <!--  <span style="color:red">*</span> --><!-- {facilityPreferredName} --> Facility
                              </span>

                              <c-tesseract-apps-multi-combobox
                                  options={facilityOptions}
                                  placeholder="Select Facility"
                                  value={selctedMultipleFcailityValues}
                                  onchange={handleFacilityChange} disabled={disableedit} >
                              </c-tesseract-apps-multi-combobox>
                          </div>

                        <div class="floating-label">
                            <span class="label-text">
                                Select Role
                            </span>

                             <c-tesseract-apps-primary-multi-combobox
                                  options={roleoptionsforFacility}
                                  value={selectedRoleValueLabels}

                                  label-field="label"
                                  sub-label-field="facilityName"
                                  badge-field="typeOfService"
                                  value-field="combinedValue" 
                                  placeholder="Select Roles"
                                  hide-label
                                  hide-badge-container
                                  onchange={handleRolesChange} disabled={disableedit}>
                              </c-tesseract-apps-primary-multi-combobox>
                        </div>

                <template if:true={isAssignToStaff}>
                  <div class="content-wrapper">
                        <div class="slds-grow slds-scrollable_y custom-scroll" style="min-height: 0; display: flex; flex-direction: column;">
                            <div class="table-container staffTable">

                                <!-- HEADER -->
                                <div class="header-wrapper">
                                    <table class="staff-table">
                                        <thead>
                                            <tr>
                                                <th class="table-th" style="text-align: center;">No.</th>
                                                <th class="table-th">Staff Name</th>
                                                <th class="table-th">Email</th>
                                                <th class="table-th">Role</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>

                                <!-- BODY -->
                                <div class="body-scroll custom-scroll staffTableHeight">
                                    <table class="staff-table">
                                        <tbody>

                                            <template if:false={noRecordsFlag1}>
                                                <template for:each={staffPagedData} for:item="staff">

                                                    <tr key={staff.Id} class="table-row">

                                                        <td class="table-td">
                                                          <div class="serial-radio">
                                                                <lightning-input
                                                                    type="radio"
                                                                    name="staffSelection"
                                                                    value={staff.Id}
                                                                    checked={staff.isSelected}
                                                                    onchange={handleStaffSelection} disabled={disableedit}>
                                                                </lightning-input>

                                                                <span>{staff.serialNumber}</span>
                                                            </div>
                                                        </td>

                                                        <td class="table-td" title={staff.Display_Nickname__c}>

                                                         <div class="slds-grid slds-grid_vertical-align-center">
                                                            <template if:true={staff.picture__c}>
                                                                <lightning-avatar
                                                                    variant="circle"
                                                                    src={staff.picture__c}
                                                                    fallback-icon-name="standard:person_account"
                                                                    alternative-text="Profile Image"
                                                                    size="small"
                                                                    style="margin-right:0.4rem;flex-shrink:0;">
                                                                </lightning-avatar>
                                                            </template>

                                                            <template if:false={staff.picture__c}>
                                                                <div class="material-avatar-fallback">
                                                                    <i class="material-icons person">account_circle</i>
                                                                </div>
                                                            </template>

                                                            <span> {staff.Display_Nickname__c}</span>
                                                        </div>

                                                           
                                                        </td>

                                                        <td class="table-td" title={staff.email}>
                                                            {staff.email}
                                                        </td>

                                                        <td class="table-td" title={staff.roleNames}>
                                                            {staff.roleNames}
                                                        </td>

                                                    </tr>

                                                </template>
                                            </template>

                                            <template if:true={noRecordsFlag1}>
                                                <tr class="no-data-border">
                                                    <td colspan="4" class="no-data">
                                                        No records found
                                                    </td>
                                                </tr>
                                            </template>

                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                  </div>
                </template>

                   <div class="assignment-container">

                    <div class="radio-section"     style="margin-bottom: 1%;">

                       

                        <div class="radio-item">
                            <lightning-input
                               type="radio"
                                name="assignmentType"
                                value="shift"
                                checked={isLinkToShift}

                            </lightning-input>

                            <div>
                                <div class="radio-title">
                                    Link to Shift
                                </div>

                                <div class="radio-desc">
                                    Connect task with shift
                                </div>
                            </div>
                        </div>

                    </div>

                   

                   

                </div>
               <template if:true={isLinkToShift}>
                <div class="content-wrapper">
                    <div class="slds-grow slds-scrollable_y custom-scroll" style="min-height:0;display:flex;flex-direction:column;">
                        <div class="table-container shiftTable">

                            <!-- HEADER -->
                            <div class="header-wrapper">
                                <table class="staff-table">
                                    <thead>
                                        <tr>
                                            <th class="table-th" style="text-align: center;">No.</th>
                                            <th class="table-th">Staff Name</th>
                                            <th class="table-th">Role</th>
                                            <th class="table-th">Date</th>
                                            <th class="table-th">Timings</th>
                                            <th class="table-th">Shift Type</th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>

                            <!-- BODY -->
                            <div class="body-scroll custom-scroll staffTableHeight">
                                <table class="staff-table">
                                    <tbody>

                                        <template if:false={noShiftRecords}>
                                            <template for:each={shiftPagedData} for:item="shift">

                                                <tr key={shift.Id} class="table-row">

                                                    <td class="table-td">
                                                        <div class="serial-radio">
                                                            <lightning-input
                                                                 type="radio"
                                                                name="shiftSelection"
                                                                value={shift.Id}
                                                                data-shiftid={shift.Id}
                                                                data-staffid={shift.Staff__c}
                                                                checked={shift.isSelected}
                                                                onchange={handleShiftSelection} disabled={disableedit}>
                                                            </lightning-input>

                                                            <span>{shift.serialNumber}</span>
                                                        </div>
                                                    </td>

                                                    <td class="table-td">

                                                        <div class="slds-grid slds-grid_vertical-align-center">
                                                                            <template if:true={shift.Staff__r.picture__c}>
                                                                                <lightning-avatar
                                                                                    variant="circle"
                                                                                    src={shift.Staff__r.picture__c}
                                                                                    fallback-icon-name="standard:person_account"
                                                                                    alternative-text="Profile Image"
                                                                                    size="small"
                                                                                    style="margin-right:0.4rem;flex-shrink:0;">
                                                                                </lightning-avatar>
                                                                            </template>

                                                                            <template if:false={shift.Staff__r.picture__c}>
                                                                                <div class="material-avatar-fallback">
                                                                                    <i class="material-icons person">account_circle</i>
                                                                                </div>
                                                                            </template>

                                                                            <span> {shift.Staff__r.Display_Nickname__c}</span>
                                                                        </div> 
                                                    </td>

                                                    <td class="table-td">
                                                        {shift.Role__c}
                                                    </td>

                                                    <td class="table-td">
                                                        {shift.formattedDate}
                                                    </td>

                                                    <td class="table-td">
                                                        {shift.timeRange}
                                                    </td>

                                                    <td class="table-td">
                                                        {shift.Type_of_shift__c}
                                                    </td> 

                                                </tr>

                                            </template>
                                        </template>

                                        <template if:true={noShiftRecords}>
                                            <tr class="no-data-border">
                                                <td colspan="6" class="no-data">
                                                    No shifts found
                                                </td>
                                            </tr>
                                        </template>

                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
               </template>

            </div>
