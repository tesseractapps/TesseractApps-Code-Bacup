<template>
   <template if:true={showUpgradeModal}>
                <c-upgrade-modal 
                    is-open={showUpgradeModal} 
                    onclose={closeUpgradeModal}>
                </c-upgrade-modal>
     </template>
  
      <div class="main-container">
        <template if:true={isHome}>
    <div class="menu-container">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 1rem;
          margin-bottom: 1rem;
        "
      >
        <!-- Tabs -->
        <div style="display: flex">
          <div
            class={trainingTabClass}
            onclick={handleTabChange}
            data-tab="training"
          >
            Training
          </div>
          <div
            class={learnersTabClass}
            onclick={handleTabChange}
            data-tab="learners"
          >
            Learner
          </div>
        </div>
      </div>
    </div>

    <template if:true={showTraining}>
         <div class="tab-content-wrapper">
               <!--  trainig list visible here -->

               <div class="dashboard-container">

            <!-- HEADER / TITLE -->
            <div class="page-header slds-p-around_small">
            <div class="title-block">
                <h1>Master Training List</h1>
                <p class="sub">Configure training requirements for your facility - apply globally or by specific roles</p>
            </div>

            <div class="actions">
                <lightning-button variant="brand" label="Sync Courses"
                onclick={handleSyncWyzedTrainings}></lightning-button>

                 <lightning-button variant="brand" label="Go to Trainings" class="slds-m-left_medium"
                  onclick={navigateToWyzedAdmin}></lightning-button>
            </div>
            </div>

            <!-- METRIC TILES -->
            <div class="metrics-grid tiles slds-p-horizontal_small">
            <div class="metric-card highlight-mandatory">
                <div class="metric-title">Mandatory</div>
                <div class="metric-value">{mandatoryCount}</div>
            </div>
            <!-- <div class="metric-card highlight-visible">
                <div class="metric-title">Visible to Staff</div>
                <div class="metric-value">{visibleCount}</div>
            </div> -->
            <div class="metric-card highlight-renewal">
                <div class="metric-title">Renewal Required</div>
                <div class="metric-value">{renewalCount}</div>
            </div>
            </div>

   
            <div class="table-container training-table slds-m-around_small">

                <!-- HEADER -->
                <div class="header-wrapper">
                <table class="staff-table fixed-table" role="table">
                    <thead>
                    <tr>
                        <th class="table-th">Course Name</th>
                        <th class="table-th">Category</th>
                        <th class="table-th center">Roles Applicable</th>
                        <th class="table-th">Mandatory</th>
                     <!--    <th class="table-th">Visible to Staff</th> -->
                        <th class="table-th">Renewal Required</th>
                        <th class="table-th">Valid For</th>
                        <th class="table-th actions-col">Actions</th>
                    </tr>
                    </thead>
                </table>
                </div>

                <!-- BODY (scrollable) -->
                <div class="body-scroll custom-scroll custom-scroll1">
                <table class="staff-table fixed-table">
                    <tbody>
                    <template for:each={pagedList} for:item="t">
                        <tr key={t.id} class="table-row">
                        <td class="table-td">
                            <span class="ellipsis-text" title={t.name}>
                                {t.name}
                            </span>
                        </td>

                        <!-- Category -->
                        <td class="table-td">
                            <span class={t.categoryClass} title={t.category}>{t.category}</span>
                          <!-- <template if:true={t.category}>
                                <span class={t.categoryClass} title={t.category}>{t.category}</span>
                          </template>
                            <template if:false={t.category}>
                                  <span style="text-align: center;">
                                          -
                                  </span>
                            </template> -->
                            
                        </td>
                        <td class="table-td center">
                         <template if:true={t.roles}>
                              <div class="roles-cell" title={t.roles}>

                                    <span  class="role-pill slds-truncate">{t.roles}</span>
                                
                            </div>
                          </template>
                          <template if:false={t.roles}>
                                  <span style="text-align: center;">-</span>
                          </template> 

                             
                        </td>

                        <!-- Mandatory -->
                        <td class="table-td">
                            <lightning-input
                            type="toggle"
                            class="small-toggle"
                            message-toggle-active=""
                            message-toggle-inactive=""
                            checked={t.mandatory}
                            data-id={t.id}
                            data-field="mandatory"
                            onchange={toggleField}>
                            </lightning-input>
                        </td>

                        <!-- Renewal Required -->
                        <td class="table-td">
                            <lightning-input
                            type="toggle"
                            class="small-toggle"
                            message-toggle-active=""
                            message-toggle-inactive=""
                            checked={t.renewalRequired}
                            data-id={t.id}
                            data-field="renewalRequired"
                            onchange={toggleField}>
                            </lightning-input>
                        </td>

                        <!-- Valid For -->
                        <td class="table-td" title={t.validFor}>
                          <!-- <template if:true={t.validFor}>
                              {t.validFor}
                          </template>
                           <template if:false={t.validFor}>
                              <span style="text-align: center;">
                                      -
                              </span>
                          </template> -->
                            {t.validFor}
                          
                        </td>

                        <!-- Actions (Material Icons) -->
                        <td class="table-td actions-col">
                            <a href="javascript:void(0)" class="action-icon" title="Edit" data-id={t.id} onclick={handleEdit}>
                            <i class="material-icons edit-icon" aria-hidden="true">edit</i>
                            </a>
                            <a href="javascript:void(0)" class="action-icon" title="Assign" data-id={t.id} onclick={handleAssignCourse}>
                            <i class="material-icons edit-icon" aria-hidden="true">assignment_turned_in</i>
                            </a>
                        </td>

                        </tr>
                    </template>

                    <template if:true={hasNoStaff}>
                        <tr><td colspan="10" class="table-td no-data">No records found</td></tr>
                    </template>

                    </tbody>
                </table>
                </div>
            </div>

            <!-- PAGINATION & PAGE SIZE -->
            <div class="fixed-pagination">
                <div class="pagination-row">
                
                <div class="slds-list_inline slds-p-bottom_xx-small">
                <label
                  class="slds-text-color_weak slds-p-horizontal_x-small"
                  for="recordsPerPage"
                  style="padding-top: 4%"
                  >Page Size:</label
                >
                <div
                  class="slds-select_container slds-align_absolute-center"
                >
                  <select
                    class="slds-select"
                    id="recordsPerPage"
                    onchange={handleRecordsPerPage}
                  >
                <template for:each={pageSizeOptions} for:item="option">
                  <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                </template>
              </select>
            </div>
          </div>
          <!--PAGE NAVIGATION-->
          <div class="slds-align_absolute-center">
            <lightning-button
              disabled={bDisableFirst}
              icon-name="utility:jump_to_left"
              label="First"
              class="slds-p-horizontal_x-small"
              alternative-text="first page"
              onclick={firstPage}
            ></lightning-button>
            <lightning-button
              disabled={bDisableFirst}
              icon-name="utility:chevronleft"
              label="Previous"
              alternative-text="Previous"
              onclick={previousPage}
            ></lightning-button>
            &nbsp;
            <span class="slds-badge"
              >Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
              &nbsp;&nbsp;Page(s)</span
            >
            &nbsp;
            <lightning-button
              disabled={bDisableLast}
              icon-name="utility:chevronright"
              label="Next"
              alternative-text="Next"
              onclick={nextPage}
              class="slds-p-horizontal_x-small"
              icon-position="right"
            ></lightning-button>
            <lightning-button
              disabled={bDisableLast}
              icon-name="utility:jump_to_right"
              label="Last"
              alternative-text="last page"
              onclick={lastPage}
              icon-position="right"
            ></lightning-button>
          </div>
          <!--TOTAL RECORDS-->
          <div class="slds-clearfix">
            <div class="slds-float_right">
              <span class="slds-badge">
                Total Records: {totalTrainings}</span
              >
            </div>
          </div>
      </div>
      </div> <!-- closing fixed-pagination -->

    <!-- ADD / EDIT MODAL -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style = "max-width: 70%; min-width: 400px;">

                <!-- HEADER -->
                <header class="slds-modal__header headercustom">
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">{modalTitle}</h2>

                </header>

                <!-- BODY CONTENT -->
                <div class="slds-modal__content slds-p-around_medium custom-scroll"> 

                    <!-- ---------------- ROW 1 ---------------- -->
                    <div>
                        <lightning-input 
                            label="Training Name"
                            data-field="name"
                              value={editingDoc.name}
                            disabled="true"
                            onchange={handleModalChange}>
                        </lightning-input>

                        <lightning-combobox
                            label="Category"
                            value={editingDoc.category}
                            data-field="category"
                            required
                            options={categoryOptions}
                            onchange={handleModalChange}>
                        </lightning-combobox>

                        <lightning-combobox
                            label="Valid For"
                            value={editingDoc.validFor}
                            data-field="validFor"
                            required
                            options={validForOptions}
                            onchange={handleModalChange}>
                        </lightning-combobox>
                        
                    </div>
                     <!-- ROW: Facilities + Roles -->
                      <div class="slds-grid slds-wrap">

                          <!-- Facility -->
                          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                              <span class="label-text-drop">
                                  <span style="color:red">*</span>{facilityPreferredName}
                              </span>

                              <c-tesseract-apps-multi-combobox
                                  options={facilityOptions}
                                  placeholder="Select Facility"
                                  value={selctedMultipleFcailityValues}
                                  onchange={handleFacilityChange}>
                              </c-tesseract-apps-multi-combobox>
                          </div>

                          <!-- Roles -->
                          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                              <span class="label-text-drop">
                                  <span style="color:red">*</span>Roles
                              </span>

                              <c-tesseract-apps-primary-multi-combobox
                                  options={roleoptionsforFacility}
                                  value={selectedRoleValueLabels}
                                  label="Roles"
                                  label-field="label"
                                  sub-label-field="facilityName"
                                  badge-field="typeOfService"
                                  value-field="combinedValue" 
                                  placeholder="Select Roles"
                                  hide-label
                                  hide-badge-container
                                  onchange={handleRolesChange}>
                              </c-tesseract-apps-primary-multi-combobox>
                          </div>

                      </div>
                   

                    <!-- ---------------- ROW 3: TOGGLES ---------------- -->
                    <div class="toggles">
                      <div class="toggle-row">
                      <label class="slds-form-element__label">Mandatory</label>
                        <lightning-input
                            type="toggle"
                            message-toggle-active=""
                            message-toggle-inactive=""
                            variant="label-hidden"
                            class="toggle_bar_right"
                            checked={editingDoc.mandatory}
                            data-field="mandatory"                            
                            onchange={handleModalChange}>
                        </lightning-input>
                        </div>


                  <!--     <div class="toggle-row">
                      <label class="slds-form-element__label">Visible to Staff</label>
                      <lightning-input
                            type="toggle"
                            message-toggle-active=""
                            message-toggle-inactive=""
                            variant="label-hidden"
                            class="toggle_bar_right"
                            checked={editingDoc.visibleToStaff}
                            data-field="visibleToStaff"
                            onchange={handleModalChange}>
                        </lightning-input>
                        </div>
 -->

                        <div class="toggle-row">
                        <label class="slds-form-element__label">Renewal Required</label>
                        <lightning-input
                            type="toggle"
                            message-toggle-active=""
                            message-toggle-inactive=""
                            variant="label-hidden"
                            class="toggle_bar_right"
                            checked={editingDoc.renewalRequired}
                            data-field="renewalRequired"
                            onchange={handleModalChange}>
                        </lightning-input>
                        </div>

                    </div>

                

                    <!-- ---------------- ROW 5: NOTES ---------------- -->
                    <div>
                        <lightning-textarea
                            label="Notes"
                            value={editingDoc.notes}
                            data-field="notes"
                            maxlength="1000"
                            onchange={handleModalChange}>
                        </lightning-textarea>
                    </div>

                </div>

                <!-- FOOTER -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={closeModal}>
                    </lightning-button>

                    <lightning-button
                        class="slds-m-left_small"
                        variant="brand"
                        label="Save"
                        onclick={saveTraining}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showConfirmModal}>
      <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container modal-custom">
          <header class="slds-modal__header slds-hyphenate headercustom">
            <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">Confirm</h2>
          </header>

          <div class="slds-modal__content slds-p-around_medium modal-content">
           <!--  <p style="text-align: center">  This change will apply to all facilities. Do you want to continue?</p> -->
            <p style="text-align: center">
                {confirmMessage}
            </p>
            <div class="button-container slds-m-top_medium">
              <lightning-button
                label="No"
                variant="brand"
                onclick={handleCancelConfirm}
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handleConfirmUpdate}
              ></lightning-button>
            </div>
          </div>

        
        </div>
      </section>

      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

   
    </div>

        </div>

    </template>

                                                    data-firstname={staff.firstname}
                                                    data-lastname={staff.lastname}
                                                    onclick={handleCreateInSystem}>
                                                    
                                                </lightning-button> -->
                                                 <span class="material-symbols-outlined system-icon"
                                                  title="Add to System"
                                                  data-id={staff.id} 
                                                    data-email={staff.email}
                                                    data-firstname={staff.firstname}
                                                    data-lastname={staff.lastname}
                                                    onclick={handleCreateInSystem}>
                                              browser_updated </span>

                                                
                                            </template>

                                            <template if:true={staff.showAllSet}>
                                                <span class="status-pill status-active">
                                                    All Set
                                                </span>
                                            </template>

                                        </td> 

                                    </tr> 
                                </template>
                            </template>

                        </tbody> 
                    </table> 
            </div> 

        </div>            
          <!-- ✅ Pagination for All Staff -->
            <div class="fixed-pagination">
                <div
                      class="pagination-row slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
                      
                    >
                      <!--RECORDS PER PAGE-->
                      <div class="slds-col">
                        <div class="slds-list_inline slds-p-bottom_xx-small">
                          <label
                            class="slds-text-color_weak slds-p-horizontal_x-small"
                            for="recordsPerPage"
                            style="padding-top: 4%"
                            >Page Size:</label
                          >
                          <div
                            class="slds-select_container slds-align_absolute-center"
                          >
                            <select
                              class="slds-select"
                    
                              onchange={handleRecordsPerPage}
                            >
                          <template for:each={pageSizeOptions} for:item="option">
                            <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                          </template>
                        </select>
                      </div>
                    </div>
                  </div>

                  <!--PAGE NAVIGATION-->
                  <div class="slds-align_absolute-center">
                    <lightning-button
                      label="« First"
                      onclick={handleAllFirstPage}
                      disabled={allDisableFirstPrev}
                      class="slds-p-horizontal_x-small">
                    </lightning-button>

                    <lightning-button
                      label="‹ Prev"
                      onclick={handleAllPrevPage}
                      disabled={allDisableFirstPrev}
                      class="slds-p-horizontal_x-small">
                    </lightning-button>

                    &nbsp;
                    <span class="slds-badge">
                      Showing {allCurrentPage} &nbsp;of&nbsp; {allTotalPages} &nbsp;&nbsp;Page(s)
                    </span>
                    &nbsp;

                    <lightning-button
                      label="Next ›"
                      onclick={handleAllNextPage}
                      disabled={allDisableNextLast}
                      class="slds-p-horizontal_x-small">
                    </lightning-button>

                    <lightning-button
                      label="Last »"
                      onclick={handleAllLastPage}
                      disabled={allDisableNextLast}
                      class="slds-p-horizontal_x-small">
                    </lightning-button>
                  </div>

                  <!--TOTAL RECORDS-->
                  <div class="slds-clearfix">
                    <div class="slds-float_right">
                      <span class="slds-badge">
                        Total Records: {allTotalRecords}</span
                      >
                    </div>
                  </div>
                </div>
            </div>
     
            
         </div>

          <template if:true={createStaff}>
  
              <c-staff-data-community selected-name={orgid} xero-staff-first-name={staffFirstName} xero-staff-last-name={staffLastName} xero-staff-email={staffEmail} 
                    create-staff-for-xero-only="true"  create-staff-for-xero-all="true"  staff-wyzed-id={staffWyzedId}  onbacktoxero={handleBackToXero}>
                  </c-staff-data-community>
        </template>

        <template if:true={showRoleModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
          <div class="slds-modal__container" onclick={stopPropagation}>
                <!-- HEADER -->
                <header class="slds-modal__header" style="background: #002a52">
                    <h2  class="slds-text-heading_medium slds-hyphenate"
                         style="color: white; font-weight: bold; text-align: center">
                        Select User Role
                    </h2>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium">

                    
               <div class="slds-form-element">
               <!--  <label class="slds-form-element__label">Choose Role</label> -->

                <div class="slds-form-element__control">

                   <div class="slds-grid slds-grid_align-center slds-p-vertical_medium">

                  
                    <!-- ADMIN -->
                    <span class="slds-radio">
                        <input type="radio"
                              id="adminRadio"
                              name="role"
                              value="ADMIN"
                              checked={isAdminSelected}
                              onchange={handleRoleChange}/>
                        <label class="slds-radio__label" for="adminRadio">
                            <span class="slds-radio_faux"></span>
                            <span class="slds-form-element__label">Admin</span>
                        </label>
                    </span>

                    <!-- LEARNER -->
                    <span class="slds-radio slds-m-left_medium">
                        <input type="radio"
                              id="learnerRadio"
                              name="role"
                              value="LEARNER"
                              checked={isLearnerSelected}
                              onchange={handleRoleChange}/>
                        <label class="slds-radio__label" for="learnerRadio">
                            <span class="slds-radio_faux"></span>
                            <span class="slds-form-element__label">Learner</span>
                        </label>
                    </span>

                     </div>

                </div>
            </div>

                </div>

                <!-- FOOTER -->
                <footer class="slds-modal__footer slds-grid slds-grid_align-center">
                    <lightning-button 
                        label="Cancel" 
                        onclick={handleCloseModal}>
                    </lightning-button>

                    <lightning-button  class="slds-m-left_medium"
                        variant="brand"
                        label="Create Learner/Admin"
                        onclick={confirmCreateWyzed}>
                    </lightning-button>
                </footer>

            </div>
        </section>

          <div class="slds-backdrop slds-backdrop_open"></div>
      </template>

    
    </template>

    

  </template>
  
  </div>
   <template if:true={showSpinner}>
        <!-- <lightning-spinner alternative-text="Refreshing Data" size="medium"></lightning-spinner> -->

            <div class="overlay-logo"></div>
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
                <p class="progress-text">Loading</br>Please Wait...</p>
            </div>
      </template>
  
  

  <template if:true={showAssignStaffModal}>

    <section
        role="dialog"
        class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container" >

            <!-- HEADER -->
            <header class="slds-modal__header" style="background: #002a52">
                <h2 class="slds-text-heading_medium" style="color: white; font-weight: bold; text-align: center">
                    Assign Course To Staff
                </h2>
            </header>

            <!-- BODY -->
            <div class="slds-modal__content  slds-p-around_medium">
               <div class="header-wrapper">
                <span><strong>Note: Learners will be shown, admins will be skipped</strong></span>
                <table
                    class="slds-table slds-table_cell-buffer slds-table_bordered">
                   
                    <thead >
                        <tr class="slds-line-height_reset">

                            <th></th>
                            <th>Staff Name</th>
                            <th>Email</th>
                            <th>Phone</th>

                        </tr>
                      </thead>

                    <tbody class="custom-scroll" >

                        <template
                            for:each={filteredStaffList}
                            for:item="staff">

                            <tr key={staff.Id}>

                                <td>

                                    <lightning-input
                                        type="checkbox"
                                        checked={staff.isChecked}
                                        data-id={staff.Id}
                                        onchange={handleStaffSelection}>
                                    </lightning-input>

                                </td>

                                <td>{staff.Name}</td>

                                <td>
                                    {staff.Email_Address__c}
                                </td>

                                <td>
                                    {staff.Contact_Number__c}
                                </td>

                            </tr>

                        </template>

                    </tbody>

                </table>
               </div>
            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer ">

                <lightning-button
                    label="Cancel"
                    onclick={closeAssignModal}>
                </lightning-button>

                <lightning-button class="slds-p-left_small"
                    variant="brand"
                    label="Assign"
                    onclick={handleFinalAssign}  disabled={disableAssignButton}>
                </lightning-button>

            </footer>

        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>
    
</template>
