<template>
    <div class="main-container">

        <template if:true={timeSheet}>

            <!-- Header -->
            <header class="header">
                <div class="search-section">
                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                    <div class="floating-label">
                        <span class="label-text-drop">Select Facility</span>
                        <lightning-combobox name="Facility" label="Name of the Facility" value={facSelectedValue}
                        placeholder="Select Facility" options={facilityOptions} onchange={handleChange}
                        required="true" variant="label-hidden" disabled={userType}></lightning-combobox> 
                    </div>
                </div>
                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                <div class="floating-label">
                    <span class="label-text-drop">Filter Shifts</span>

                    <lightning-combobox
                       
                        value={selectedFilterValue}
                        placeholder="Select Filter"
                        options={filterOption}
                        variant="label-hidden"
                        onchange={handleFilterChange}>
                    </lightning-combobox>

                </div>
            </div>

                <template if:false={userType}>
                    <!-- <lightning-button 
                        variant="brand" 
                        label="Approve" 
                        title="Approve" 
                        onclick={handleBulkApproveClick} 
                        class="slds-m-left_x-small">
                    </lightning-button> -->
                    <button class="custom-create-btn" onclick={handleBulkApproveClick} title="Approve(Ctrl + Shift + O)">
                          Approve
                      </button>
                </template>
                </div>
                <div class="action-section">
                    <div>
                    <span class="Arrow" >
                      <lightning-button-icon icon-name="utility:left" class="slds-m-top_xx-small"
                      onclick={handlePrevWeek}></lightning-button-icon>
                    </span>
                    <span class="today">
                      <lightning-button label="Today" onclick={navigateToToday}></lightning-button>
                    </span>
                    <span class="Arrow">
                      <lightning-button-icon icon-name="utility:right" class="slds-m-top_xx-small"
                      onclick={handleNextWeek}></lightning-button-icon>
                    </span>
                </div>
                <lightning-combobox
                    class="view-combobox slds-m-left_small"
                    name="viewType"
                    variant="label-hidden"
                    value={selectedView}
                    placeholder="Select Status"
                    options={viewOptions}
                    onchange={handleViewChange}>
                </lightning-combobox>
                <lightning-input label="Date" type="date" name="select-date" variant="label-hidden"
                            class="lwc-datepicker" value={datePickerString}
                            onchange={navigateToDay}>
                </lightning-input>
                <template if:true={xeroFlag}>
                  <button  class="slds-button slds-button_icon slds-button_icon-border" title={Accountingtitle1} onclick={handleAddToXero1}>
                      <i class="material-icons1 edit-icon">export_notes</i>
                  </button>
                </template>
                    <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={handleRefresh}>
                        <svg class="slds-button__icon" aria-hidden="true">
                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                        </svg>
                    </button>
                    <lightning-button-icon 
                        icon-name="utility:download" 
                        variant="border-filled" 
                        onclick={handleDownloadClick}
                        alternative-text="Download">
                    </lightning-button-icon>
                   <!--  <lightning-button-icon 
                        icon-name="utility:print" 
                        variant="border-filled" 
                        onclick={handlePrint} 
                        alternative-text="Print">
                    </lightning-button-icon> -->
                </div>
            </header>

            <!-- Timesheet Table -->
            <div class="slds-grow slds-scrollable_y custom-scroll table-container" style="min-height:0;">
                <div class="listview" style="padding: 1%;">
                    <div class="slds-theme_default custom-table">
                        <!-- Column Headers -->
                        <div class="slds-grid custom-header-row">
                          <template if:true={xeroFlag}>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell custom-last-cell" style="width: 3%;" title="Selection Checkbox"></div>
                          </template>
                            <div class="slds-col slds-p-around_small slds-text-align_left slds-text-title_caps custom-cell custom-first-cell" style="width: 14%;" title={staffPreferredName}>
                                {staffPreferredName}
                                <lightning-input 
                                    type="text" 
                                    variant="label-hidden"
                                    label="Search Staff" 
                                    onchange={handleSearch}>
                                </lightning-input>
                            </div>
                            <template for:each={weekDays} for:item="day">
                                <div key={day.date} style={day.style}
                                    class="slds-col slds-p-around_small custom-cell" title={day.tooltip}>
                                    
                                        <!-- <div class="slds-text-title_caps">{day.dayName}</div>
                                        <div class="slds-text-body_small">{day.formatted}</div> -->

                                       <div class="day-left" title={day.tooltip}>
                                            <div class="day-name">{day.dayName}</div>
                                            <div class="day-date">{day.formatted}</div>
                                            <template if:true={day.tooltip}>
                                                <span class="holiday-name" style="font-size: 0.65rem; color: black; font-weight: bold; 
                                                                                    display: inline-block; 
                                                                                    max-width: 8.5em; 
                                                                                    white-space: nowrap; 
                                                                                    overflow: hidden; 
                                                                                    text-overflow: ellipsis;">
                                                      {day.tooltip}
                                                  </span>
                                            </template>
                                            <template if:false={day.tooltip}>
                                                <span class="holiday-name" style="font-size: 0.65rem; color: black; font-weight: bold;">
                                                    &nbsp;
                                                </span>
                                            </template>
                                        </div>
 
                                   
                                </div>
                            </template>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title="Total (hr)">Total</br>(hr)</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title="Mileage (km)">Mileage</br>(km)</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title="Expense">Expense</br></div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title="Sleepover (hr)">Sleepover</br>(hr)</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title="Variance (hr)">Variance</br>(hr)</div>
                            <template if:false={userType}>
                              <template if:true={xeroFlag}>
                                <div class="slds-col slds-p-around_small slds-text-align_center custom-cell custom-last-cell" style="width: 7%;" title="Action">Action</div>
                              </template>
                            </template>
                        </div>

                        <!-- Staff Rows with Pagination -->

                        <template if:true={hasProcessedStaff}>
                          <template for:each={processedStaff} for:item="staff">
                              <div key={staff.id} class="slds-grid custom-data-row">

                                <template if:true={xeroFlag}>
                                    <div class="slds-col slds-p-around_small slds-text-align_center custom-cell custom-last-cell" style="width: 3%;" title="Select Staff">
                                        <lightning-input
                                            type="checkbox"
                                            data-id={staff.staffId}
                                            checked={staff.isSelected}
                                            onchange={handleCheckboxStaffChange}>
                                        </lightning-input>
                                    </div>
                                  </template>
                                  <!-- Staff Name -->
                                  <div class="slds-col slds-p-around_small custom-cell custom-first-cell inrow" style="width: 14%;" title={staff.nameToDisplay}>
                                      <div class="slds-grid slds-grid_align-spread" style="height: 100%; width: 100%;">
                                          
                                          <!-- Left: Staff Name -->
                                          <div class="slds-text-body_regular slds-truncate" style="text-align: left;">
                                              {staff.nameToDisplay}
                                          </div>

                                          <!-- Right: Checkbox Icon or Mismatch Badge -->
                                          <div>
                                              <template if:true={staff.hasShiftForAnyDay}>
                                                  <template if:true={staff.hasMismatch}>
                                                      <div class="custom-green-badge" onclick={handleMismatchClick} 
                                                      data-staff-id={staff.staffId} data-staff-name={staff.staffName} title="Mismatches">
                                                          <span class="mismatch-count">{staff.mismatchCount}</span>
                                                      </div>
                                                  </template>
                                                  <template if:false={staff.hasMismatch}>
                                                      <lightning-icon
                                                          icon-name="action:check"
                                                          alternative-text="Shift OK"
                                                          size="xx-small"
                                                          onclick={handleCheckClick}
                                                          data-staff-id={staff.staffId}
                                                          data-staff-name={staff.staffName}
                                                          style="cursor: pointer; Transform: Scale(0.8);"
                                                          title="Shift OK">
                                                      </lightning-icon>
                                                  </template>
                                              </template>
                                          </div>

                                      </div>
                                  </div>


                                  <!-- Daily Shifts -->
                                  <template for:each={staff.shiftRows} for:item="shift">
                                      <div key={shift.key} class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title={shift.hours}>
                                          <template if:true={shift.hasShift}>
                                              <div class={shift.cellClass}>
                                                  <div class="slds-text-body_small">{shift.hours} hr</div>
                                              </div>
                                          </template>
                                          <template if:false={shift.hasShift}>
                                              <div class="slds-text-body_small">–</div>
                                          </template>
                                      </div>
                                  </template>

                                  <!-- Totals -->
                                  <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title={staff.totalDuration}>
                                      {staff.totalDuration}
                                  </div>
                                  <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title={staff.totalMileageOthers}>
                                      {staff.totalMileageOthers}
                                  </div>
                                  <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title={staff.totalMileageAmount}>
                                      
                                      <lightning-formatted-number 
                                              value={staff.totalMileageAmount}
                                              format-style="currency"
                                              currency-code="AUD"
                                              minimum-fraction-digits="2"
                                              maximum-fraction-digits="2">
                                      </lightning-formatted-number>
                                  </div>
                                  <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title={staff.totalSleepoverHours}>
                                      {staff.totalSleepoverHours}
                                  </div>
                                  <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title={staff.totalvariance}>
                                      {staff.totalvariance}
                                  </div>
                                <template if:false={userType}>
                                  <template if:true={xeroFlag}>
                                    <div class="slds-col slds-p-around_small slds-text-align_center custom-cell custom-last-cell" style="width: 7%;" title={Accountingtitle}>
                                        <a
                                          href="javascript:void(0)"
                                          data-id={staff.staffId}
                                          onclick={handleAddToXero}
                                          title={Accountingtitle}
                                        ><i class="material-icons1 edit-icon">inbox_text_share</i>
                                        </a> 
                                    </div>
                                  </template>
                                </template>
                              </div>
                          </template>
                         </template>
                          <template if:false={hasProcessedStaff}>
                            <div class="no-data" title="No records found">
                                <p>No records found</p>
                            </div>
                          </template>

                    </div>
                </div>
            </div>

            <template if:false={userType}>
                <!-- Pagination Controls -->
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination" style="width:95%;margin-left:2%">
                        <!-- RECORDS PER PAGE -->
                        <div class="slds-col">
                            <div class="slds-list_inline">
                                <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                                <label class="slds-text-color_weak" for="recordsPerPage"></label>
                                <div class="slds-select_container">
                                    <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                        <template for:each={pageSizeOptions} for:item="option">
                                            <option key={option} value={option}>{option}</option>
                                        </template> 
                                    </select>
                                </div>
                            </div>
                        </div>
                        <!-- PAGE NAVIGATION -->
                        <div class="slds-align_absolute-center">
                            <lightning-button disabled={isFirstPage} icon-name="utility:jump_to_left" label="First" 
                                alternative-text="first page" onclick={firstPage} class="slds-m-right_small"></lightning-button>
                            <lightning-button disabled={isFirstPage} icon-name="utility:chevronleft" label="Previous" 
                                alternative-text="Previous" onclick={handlePrev} class="slds-m-right_x-small"></lightning-button>
                            &nbsp;
                            <span class="slds-badge slds-m-horizontal_x-small">Showing {currentPage} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={isLastPage} icon-name="utility:chevronright" label="Next" 
                                alternative-text="Next" onclick={handleNext} class="slds-m-horizontal_x-small" icon-position="right"></lightning-button>
                            <lightning-button disabled={isLastPage} icon-name="utility:jump_to_right" label="Last" 
                                alternative-text="last page" onclick={lastPage} class="slds-m-left_small" icon-position="right"></lightning-button>
                        </div>
                        <!-- TOTAL RECORDS -->
                        <div class="slds-clearfix">
                            <div class="slds-float_right">
                                <span class="slds-badge">Total Records: {staffMembers.length}</span>
                            </div>
                        </div>
                </div>
            </template>
            
        </template>

        <template if:true={shiftInformation}>
            <div class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center slds-m-around_medium">

              <!-- Left Section: Title + Filter -->
              <div class="slds-grid slds-grid_vertical-align-center">
                  <p class="slds-text-heading_medium slds-m-right_medium">
                      {StaffName1} - Shifts
                  </p>
                <div class="floating-label">
                    <span class="label-text-drop">Filter Shifts</span>

                  <lightning-combobox
                      value={weeklyViewFilterValue}
                      placeholder="Select Filter"
                      options={filterOption}
                      variant="label-hidden"
                      onchange={handleWeeklyFilterChange}
                      class="slds-size_x-small">
                  </lightning-combobox>
                </div>
              </div>

              <!-- Right Section: Back Button -->
              <div>
                  <lightning-button
                      variant="brand"
                      label="Back"
                      title="Back(Ctrl + Shift + B)"
                      onclick={handleBackClick}>
                  </lightning-button>
              </div>

          </div>

            <!-- Header -->
            <header class="header1">
                <div class="search-section"></div>
                <div class="action-section1">

                  <template if:true={ismissmatchedshifts}>
                    <div style="display: flex;">
                      <lightning-input 
                          type="checkbox" 
                          checked={isChecked}
                          onchange={handleCheckboxChange}>
                      </lightning-input>
                      <span>Weekly shift</span>
                    </div>
                  </template>

                  <div class="legend">
                      <div class="legend-item">
                          <span class="dot scheduled"></span>
                          <span class="label scheduled-label">Scheduled Shift</span>
                      </div>
                      <div class="legend-item">
                          <span class="dot actual"></span>
                          <span class="label actual-label">Actual Shift</span>
                      </div>
                  </div>
                   <div class="legend">
                      <div class="legend-item">
                          <span class="dot accepted"></span>
                          <span class="label accepted-label">Accepted</span>
                      </div>
                      <div class="legend-item">
                          <span class="dot inprogress"></span>
                          <span class="label inprogress-label">In Progress</span>
                      </div>
                      <div class="legend-item">
                          <span class="dot completed"></span>
                          <span class="label completed-label">Completed</span>
                      </div>
                       <div class="legend-item">
                          <span class="dot cancelled"></span>
                          <span class="label cancelled-label">Cancelled</span>
                      </div>
                  </div>



                    <div class="badge blue">
                        <span>Sleepover:</span><span>{sleepoverDuration} hr</span>
                    </div> 
                    
                    <div class="badge green">
                        <span>Mileage:</span><span>{totalKms} km</span>
                    </div>
                    <div class="badge red">
                        <span>Expenses:</span><span>${totalexpenses}</span>
                    </div>
                    <div class="badge green">
                        <span>Approved:</span><span>{totalApprovedLoggedDuration} hr</span>
                    </div>
                    <div class="badge blue">
                        <span>Total:</span><span>{totalShiftDuration} hr</span>
                    </div>

                    <div class="slds-form-element">
                      <div class="floating-label1">
                        <span class="label-text-drop">Start Date</span>
                          <lightning-input
                              type="date"
                              name="select-date"
                              value={weekStartDate}
                              variant="label-hidden"
                              disabled
                              class="lwc-datepicker"
                              id="start-date-input">
                          </lightning-input>
                      </div>
                    </div>

                    <div class="slds-form-element">
                      <div class="floating-label1">
                        <span class="label-text-drop">End Date</span>
                          <lightning-input
                              type="date"
                              name="select-date"
                              value={weekEndDate}
                              variant="label-hidden"
                              disabled
                              class="lwc-datepicker"
                              id="end-date-input">
                          </lightning-input>
                      </div>
                    </div>

                    <div class="slds-form-element">
                        <lightning-button-icon 
                            icon-name="utility:download" 
                            variant="border-filled" 
                            onclick={handleDownloadClick}
                            alternative-text="Download"
                            class="slds-m-left_x-small">
                        </lightning-button-icon>
                    </div>

                    <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={handleRefresh1}>
                        <svg class="slds-button__icon" aria-hidden="true">
                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Timesheet1 Table -->
             <div class="slds-grow slds-scrollable_y custom-scroll" style="min-height:0;">
                 <div class="listview">
                    <div class="slds-theme_default custom-table">
                        <!-- Column Headers -->
                        <div class="slds-grid custom-header-row">
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%;" title="Date">Date</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 17%;" title="Shift">Shift</div>
                            <template if:false={otherThanNdis}>
                                <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 14%;" title="Services">Services</div>
                            </template>
                            <template if:true={otherThanNdis}>
                                <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 14%;" title={participantPreferredName}>{participantPreferredName}</div>
                            </template>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 14%;" title={facilityPreferredName}>{facilityPreferredName}</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 12%;" title="Start Time">Start Time</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 12%;" title="End Time">End Time</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 6%;" title="Break Time (min)">Break Time</br>(min)</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 6%;" title="Duration (hr)">Duration</br>(hr)</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 6%;" title="Mileage (km)">Mileage</br>(km)</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 6%;" title="Expense">Expense</div>
                            <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 6%;" title="Variance (hr)">Variance</br>(hr)</div>
                            <template if:false={userType}>
                                <div class="slds-col slds-p-around_small slds-text-align_center custom-cell custom-last-cell" style="width: 7%;" title="Actions">Actions</div>
                            </template>
                        </div>
                        
                        <!-- Data Rows with Key for Proper Reactivity -->
                         <template if:true={selectedStaffShifts.length}>
                         
                          <template for:each={selectedStaffShifts} for:item="shift" for:index="index">
                              <div key={shift.Id} class="slds-grid custom-row" data-shift-id={shift.Id}>
                                  <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 7%; display: flex; justify-content: center; align-items: center;" title={shift.shiftDate}>
                                      {shift.shiftDate}
                                  </div>
                                  <!-- <div class="slds-col slds-p-around_small slds-text-align_center custom-cell" style="width: 17%; display: flex; justify-content: space-between; align-items: center;" title={shift.shiftType}>
                                      {shift.shiftType}
                                      <div class="icon-allign">
                                        <span class={shift.uiStatus}
                                            title={shift.statusTitle}>
                                            ⬤</span>
                                          <template if:true={shift.showCancelIcon}>
                                                <i class="material-icons checklist-icon" data-id={shift.Id} data-shiftcancelnotes={shift.Shift_Cancel_Notes__c} title="Shift Cancel Notes" onclick={handleShiftCancelClick}>scan_delete</i>
                                          </template>
                                        
                                          <i class="material-icons checklist-icon" data-id={shift.Id} title="Docs/Forms" onclick={handleFormsClick}>docs</i>
                                          <i class="material-icons checklist-icon" data-id={shift.Id} title="Journal" onclick={handleJournalClick}>auto_stories</i>
                                          <i class="material-icons checklist-icon" data-id={shift.Id} title="Checklist" onclick={handleChecklistClick}>fact_check</i>
                                          <i class="material-icons overview-icon" data-id={shift.Id} title="Shift Notes" onclick={handleActivityClick}>overview</i>
                                          <i class="material-icons overview-icon" data-id={shift.Id} data-status={shift.Status__c}  data-date={shift.Date__c} title="Geo Location" onclick={handlegeolocationClick}>distance</i>
                                          
                                            <template if:true={shift.isSignatureClickable}>
                                                <i class={shift.signatureIconClass}
                                                  data-id={shift.Id}
                                                  data-signature={shift.Client_Signature__c}
                                                  title={shift.signatureTitle}
                                                  onclick={handleSignature}>
                                                  signature
                                                </i>
                                            </template>
                                            <template if:false={shift.isSignatureClickable}>
                                                <i class={shift.signatureIconClass}
                                                  data-id={shift.Id}
                                                  data-signature={shift.Client_Signature__c}
                                                  title={shift.signatureTitle}>
                                                  signature
                                                </i>
                                            </template>
                                      </div>
                                  </div> -->

                                  <div class="slds-col slds-p-around_small custom-cell"
                                      style="width: 17%; display: flex; flex-direction: column; align-items: center;"
                                      title={shift.shiftType}>

                                      <!-- Shift Type -->
                                      <div class="shift-type">
                                          {shift.shiftType} 
                                          <span class={shift.uiStatus}
                                                title={shift.statusTitle}>
                                              ⬤
                                          </span>
                                      </div>

                                      <!-- Icons -->
                                      <div class="icon-allign">

                                          <template if:true={shift.showCancelIcon}>
                                              <i class="material-icons checklist-icon"
                                                data-id={shift.Id}
                                                data-shiftcancelnotes={shift.Shift_Cancel_Notes__c}
                                                title="Shift Cancel Notes"
                                                onclick={handleShiftCancelClick}>
                                                  scan_delete
                                              </i>
                                          </template>

                    <div class="slds-modal__content slds-p-around_medium modal-content">
                        <div class="slds-m-around_small">
                            <div>
                                <p style="text-align:center;">
                                    This action will replace the current Logout Time with the Shift End Time.
                                    Do you want to continue?
                                </p>
                            </div>

                            <div class="button-container slds-m-top_medium"
                                style="display:flex;justify-content:center;">
                                <lightning-button
                                    label="No"
                                    variant="brand"
                                    onclick={handleEndTimeCancel}
                                    class="slds-m-around_small">
                                </lightning-button>

                                <lightning-button
                                    label="Yes"
                                    variant="brand"
                                    onclick={handleEndTimeConfirm}
                                    class="slds-m-around_small">
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>
