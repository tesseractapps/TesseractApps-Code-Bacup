<template if:true={assignflag}>
    <section 
        aria-describedby="modal-content-id-1" 
        aria-labelledby="modal-heading-01" 
        aria-modal="true"
        class="slds-modal slds-fade-in-open" 
        role="dialog" 
        tabindex="-1">

        <!-- Modal Container -->
        <div class="slds-modal__container slds-modal_small" style="max-width:16%;">

            <!-- Header -->
            <header class="slds-modal__header slds-text-align_center" style="background:#002A52;">
                <h2 class="slds-text-heading_medium slds-hyphenate"
                    style="color:white;font-weight:bold;">
                    Assign
                </h2>
            </header>

            <!-- Content -->
            <div class="slds-modal__content slds-p-around_medium">

                <!-- Instruction Text -->
                <div class="slds-m-bottom_medium slds-text-align_center">
                    <p>Please select Reporting Manager</p>
                </div>

                <!-- Centered Combobox (dropdown options remain left aligned) -->
                <div class="slds-grid slds-grid_align-center">
                    <div class="slds-size_1-of-1">

                        <lightning-combobox
                            options={staffOptions}
                            value={ManagerStaffId}
                            placeholder="Select Approver"
                            onchange={handleStaffChange}
                            variant="label-hidden">
                        </lightning-combobox>

                    </div>
                </div>

                <!-- Buttons -->
                <div class="slds-m-top_large slds-text-align_center">
                    <lightning-button 
                        label="Cancel"
                        variant="neutral"
                        onclick={handleAssignClose}
                        class="slds-m-right_small">
                    </lightning-button>

                    <lightning-button 
                        label="Assign"
                        variant="brand"
                        onclick={handleSave}>
                    </lightning-button>
                </div>

            </div>

        </div>
    </section>

    <!-- Backdrop -->
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

</template>
