                <!-- TABS -->
                <lightning-tabset variant="scoped">

                    <!-- KPI TAB -->
                    <lightning-tab label={selectedTemplate.kpiTabLabel}>
                        <template if:true={selectedTemplate.kpis.length}>
                            <template for:each={selectedTemplate.kpis} for:item="kpi">
                                <div key={kpi.Id} class="kpi-card">

                                    <div class="kpi-header">
                                        <div>
                                            <strong>{kpi.Name}</strong>
                                            <span class="badge">{kpi.Category__c}</span>
                                            <div class="kpi-desc">
                                                {kpi.KPI_Description__c}
                                            </div>
                                        </div>

                                        <div class="kpi-meta">
                                            <span>Target: <b>{kpi.KPI_Target__c}%</b></span>
                                            <span>Weight: <b>{kpi.KPI_Weight__c}%</b></span>
                                        </div>
                                    </div>

                                    <div class="kpi-body">

                                        <div class="rating-block">
                                            <label>Your Rating</label>
                                            <lightning-combobox
                                                data-id={kpi.Id}
                                                options={ratingOptions}
                                                value={kpi.staffRating}
                                                onchange={handleKpiRatingChange}
                                                variant="label-hidden" disabled={selectedTemplate.EditDisabled}>
                                            </lightning-combobox>
                                        </div>

                                    <!--  <div class="attachment-block">
                                            <label>Attachments</label>
                                            <div class="upload-box">
                                                Choose File
                                            </div>
                                        </div> -->

                                    </div>

                                    <div class="comment-block">
                                        <label>Comments & Achievements</label>
                                        <lightning-textarea
                                            data-id={kpi.Id}
                                            value={kpi.staffComment}
                                            onchange={handleKpiCommentChange} disabled={selectedTemplate.EditDisabled}>
                                        </lightning-textarea>
                                    </div>

                                </div>
                            </template>
                        </template>
                        <template if:false={selectedTemplate.kpis.length}>
                            <div class="no-data">
                                <p>No records found</p>
                            </div>
                        </template>


                    </lightning-tab>

                    <lightning-tab label={selectedTemplate.okrTabLabel}>
                        <template if:true={selectedTemplate.okrs.length}>
                            <template for:each={selectedTemplate.okrs} for:item="okr">
                                <div key={okr.Id} class="kpi-card">

                                    <div class="kpi-header">
                                        <div>
                                            <strong>{okr.OKR_Objective__c}</strong>
                                        <!--  <span class="badge">{okr.OKR_Objective__c}</span> -->
                                            <div class="kpi-desc">
                                                {okr.OKR_Description__c}
                                            </div>
                                        </div>

                                        <div class="kpi-meta">
                                            <span>Target: <b>{okr.Key_Target__c}%</b></span>
                                            <span>Weight: <b>{okr.OKR_Weight__c}%</b></span>
                                        </div>
                                    </div>

                                    <div class="kpi-body">

                                        <div class="rating-block">
                                            <label>Your Rating</label>
                                            <lightning-combobox
                                                data-id={okr.Id}
                                                options={ratingOptions}
                                                value={okr.staffRating}
                                                onchange={handleOkrRatingChange} disabled={selectedTemplate.EditDisabled}
                                                variant="label-hidden">
                                            </lightning-combobox>
                                        </div>

                                    </div>

                                    <div class="comment-block">
                                        <label>Comments & Achievements</label>
                                        <lightning-textarea
                                            data-id={okr.Id}
                                            value={okr.staffComment}
                                            onchange={handleOkrCommentChange} disabled={selectedTemplate.EditDisabled}>
                                        </lightning-textarea>
                                    </div>

                                </div>
                            </template>
                        </template>
                         <template if:false={selectedTemplate.okrs.length}>
                            <div class="no-data">
                                <p>No records found</p>
                            </div>
                        </template>
                    </lightning-tab>

                                    </div>

                                </div>
                            </template>
                         </template>
                         <template if:false={selectedTemplate.competencies.length}>

                                <p>No records found</p>
                            </div>
                        </template>

                    </lightning-tab>

                </div>
