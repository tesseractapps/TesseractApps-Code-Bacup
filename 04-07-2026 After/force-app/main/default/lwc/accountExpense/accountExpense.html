            <div if:true={isDesktop} style="width:100%;">
                <template if:true={staffexpensesData}>

                        <div class="table-container expense-table slds-m-around_small">
                            <!-- HEADER -->
                            <div class="header-wrapper">
                                <table class="staff-table fixed-table">
                                    <thead>
                                        <tr class="table-row">
                                            <th class="table-th" title="Purchases">Purchases</th>
                                            <th class="table-th" title="Description">Description</th>
                                            <th class="table-th" title="Entity Name">Entity Name</th>
                                            <th class="table-th" title="Date Generated">Date Generated</th>
                                            <th class="table-th" title="Ledger Item">Ledger Item</th>
                                            <th class="table-th" title="GST">GST</th>
                                            <th class="table-th" title="Amount">Amount</th>
                                            <th class="table-th" title="Actions">Actions</th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>

                                                    </a>
                                                </td>
                                                <td class="table-td" title={expense.allDescriptions}>{expense.description}</td>
                                                <td class="table-td" title={expense.entityName}> {expense.entityName}</td>
                                                <td class="table-td" title={expense.date}>{expense.date}</td>
                                                <td class="table-td" title={expense.ledgerItem}>{expense.ledgerItem}</td>
                                                <td class="table-td">
                                                    <lightning-formatted-number
                                                        value={expense.gst}
                                                        format-style="currency"
                                                        currency-code="AUD"
                                                        minimum-fraction-digits="2"
                                                        maximum-fraction-digits="2">
                                                    </lightning-formatted-number>
                                                </td>
                                                <td class="table-td">
                                                    <lightning-formatted-number
                                                        value={expense.amount}
                                                        format-style="currency"
                                                        currency-code="AUD"
                                                        minimum-fraction-digits="2"
                                                        maximum-fraction-digits="2">
                                                    </lightning-formatted-number>
                                                </td>
                                                <td class="table-td" title="Actions">
                                                     <a href="javascript:void(0)" data-id={expense.Id} data-url={expense.purchaseInvoiceUrl}
                                                        onclick={handleView} name="view_details" title="View"

                                                            <i class="material-icons view-icon" data-id={expense.Id}>visibility</i>
                                                        </a> &nbsp;

                                                    <a href="javascript:void(0)" data-id={expense.Id}  onclick={handleDelete} title="Delete"  style="text-decoration: none;">
                                                        <i class="material-icons delete-icon">delete</i>
                                                    </a>

                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>

                            <!-- <div  style="margin-left:56.5%">

                            </div>  -->
                        <template if:true={paginationVisible}>

                                <div class="slds-col">
                                    <div class="slds-list_inline ">
                                        <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                                        <label class="slds-text-color_weak" for="recordsPerPage"></label><!--slds-p-horizontal_x-small-->
                                        <div class="slds-select_container">
                                            <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                                <template for:each={pageSizeOptions} for:item="option">
                                                    <option key={option} value={option}>{option}</option>
                                                </template> 
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <!-- PAGE NAVIGATION -->
                                <div class="slds-align_absolute-center">
                                    <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->

                                    &nbsp;

                                    <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                                </div>

                                    <div class="slds-float_right">
                                        <span class="slds-badge"> Total Records: {totalRecords}</span>
                                    </div>
                                </div>
                            </div>

                                        </div>
