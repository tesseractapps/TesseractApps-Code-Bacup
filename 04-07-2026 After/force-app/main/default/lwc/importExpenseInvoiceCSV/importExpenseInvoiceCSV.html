<template>
    <div style="margin-top: 40px;margin-left: 1260px;">
        <lightning-button label="Back" onclick={handleBack} variant="brand" > </lightning-button>
    </div>

    <div class="slds-grid" style="margin-bottom:20px;margin-top:-40px;">
        <div class="slds-size_1-of-5">
            <div> 
                <lightning-input type="file" label="Please upload comma separated .csv file" accept=".csv" onchange={handleCSVUpload}></lightning-input>
            </div>
        </div>     
    </div> 

    <div style="display: flex; height: calc(100vh - 150px);">
        <div style="flex: 1; display: flex; flex-direction: column; border: 1px solid lightblue; border-radius: 5px; margin-right: 10px;">
            <lightning-datatable key-field="Id" data={data} columns={columns} column-width-mode="fixed" onrowaction={handleRowActions} onrowselection={handleRowSelection} style="flex: 1; background-color: white; margin-top: 9px; overflow-y: auto;">
            </lightning-datatable>
            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                <div class="slds-col">
                    <div class="slds-list_inline">
                        <label class="slds-text-color_weak" for="recordsPerPage">Page Size:</label>
                        <div class="slds-select_container">
                            <select class="slds-select" id="recordsPerPage" style="width: auto;" onchange={handleRecordsPerPage}>
                                <template for:each={pageSizeOptions} for:item="option">
                                    <option key={option} value={option}>{option}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="slds-align_absolute-center" style="height:5rem">
                    <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                    <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                    &nbsp;
                    <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                    &nbsp;
                    <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                    <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                </div>
                <div class="slds-clearfix">
                    <div style="margin-right:30px;">
                        <span class="slds-badge"> Total Records: {totalRecords}</span>
                    </div>
                </div>
            </div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column;">
            <div style="flex: 1; display: flex; flex-direction: column; border: 1px solid lightblue; border-radius: 5px; margin-bottom: 10px; padding: 10px; overflow-y: auto;">
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-bottom: 10px;">
                    <div> 
                        <lightning-input name="enter-search" label="Please enter keywords to search" type="search" onchange={handlesearch}></lightning-input>
                    </div>
                    <lightning-combobox name="dropDown" label="Select Key Words" value={value} placeholder="Select Key Words" options={options}
                       onchange={handlesearch} ></lightning-combobox>
                    <lightning-button label="Go To" name="expenses" onclick={handleMove} variant="brand" style="margin-top:13px"></lightning-button>
                    
                    <lightning-button label="Finish" onclick={handleinsertExpenseData} variant="brand" style="margin-top:13px"></lightning-button>
                </div>
                <lightning-datatable key-field="Id" data-tabale="expenseTable" data={ExpenseData} columns={expenseInvoiceColumns} column-width-mode="fixed" draft-values={draftvalues} onsave={handleSaveDraft} oncancel={handleCancel}  style="flex: 1; overflow-y: auto;">
                </lightning-datatable>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; border: 1px solid lightblue; border-radius: 5px; padding: 10px; overflow-y: auto;">
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-bottom: 10px;">
                    <div> 
                        <lightning-input name="enter-search" label="Please enter keywords to search" type="search" onchange={handlesearch}></lightning-input>
                    </div>
                    <lightning-combobox name="dropDown" label="Select Key Words" value={value} placeholder="Select Key Words" options={options}
                       onchange={handlesearch} ></lightning-combobox>
                    <lightning-button label="Go To" name="invoices" onclick={handleMove} variant="brand" style="margin-top:13px"></lightning-button>
                    
                    <lightning-button label="Finish" onclick={handleinsertInvoiceData} variant="brand" style="margin-top:13px"></lightning-button>
                </div>
                <lightning-datatable key-field="Id" data-tabale="invoiceTable" data={InvoiceData} columns={expenseInvoiceColumns} column-width-mode="fixed" draft-values={draftvalues} onsave={handleInvoiceSaveDraft} oncancel={handleCancel} style="flex: 1; overflow-y: auto;">
                </lightning-datatable>
            </div>
        </div>
    </div>
    <div style="padding-bottom: 100px;"></div> <!-- Add padding to avoid footer overlap -->
</template>
