<template>
  <div class="main-container custom-scroll">
    <div class="payruncontainer custom-scroll">
      <template if:true={isPayrollTitle}>
        <div class="slds-p-around_small" style="display: flex; align-items: center; justify-content: space-between;">
          <!-- Left side: Staff Details -->
          <p style="font-weight: bold; font-size:140% "> Payroll - {companyname}</p>
        </div>
      </template>
      <div class="slds-p-horizontal_small" style="display: flex; align-items: center; justify-content: space-between;">
        <p style="font-weight: bold; font-size:140% ">Payruns</p>
        <div style="display: flex; align-items: center; gap: 10px;">
          <template if:true={ispayrun}>
            <template if:true={AddPayRunButton}>
              <lightning-button label="Add Payrun" disabled={addPayRunBtn} onclick={handleaddPayrun} variant="brand"></lightning-button>
            </template>
          </template>
        </div>
      </div>
      <!-- <div class="payruntext">Pay runs</div> -->
      <!-- <div class="slds-float_right"><button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={RefreshHandle}><svg class="slds-button__icon" aria-hidden="true"><use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use></svg></button></div> -->
      <template if:true={isaddpayrun}>
        <div if:true={isDesktop}>
          <div class="slds-p-around_small">
            <div class="slds-size_1-of-2">
              <div class="slds-col slds-size_1-of-2" style="padding: 0 0 3% 0;">
                <div class="floating-label">
                  <span class="label-text-drop">
                    <span style="color:red">*</span>Name of the Payrun </span>
                  <lightning-combobox name="payrollSetting" label="Name of the Payrun" value={payrunSettingnewValue} placeholder="Select Payrun" options={payrollSettingNewList} onchange={handlePayrollSettingChange} required="true" variant="label-hidden"></lightning-combobox>
                </div>
              </div>
            </div>
            <template if:true={payrunSettingnewValue}>
              <div class="slds-grow" style="display:flex; flex-direction:column; min-height:0;">
                <div class="table-container addpayrun-table slds-grow slds-m-around_small" style="min-height: 0; display: flex; flex-direction: column; flex: 1 1 auto;">
                  <!-- HEADER -->
                  <div class="header-wrapper">
                    <table class="staff-table fixed-table">
                      <thead>
                        <tr class="table-row">
                          <th class="table-th" title="First Name">First Name</th>
                          <th class="table-th" title="Last Name">Last Name</th>
                          <th class="table-th" title="Frequency">Frequency</th>
                          <th class="table-th" title="Contact Number">Contact Number</th>
                        </tr>
                      </thead>
                    </table>
                  </div>
                  <!-- BODY -->
                  <div class="table-body custom-scroll">
                    <table class="staff-table fixed-table">
                      <tbody>
                        <template if:true={staffrecordsAddPayrun}>
                          <template for:each={staffrecordsAddPayrun} for:item="acc">
                            <tr key={acc.Staff__r.Id} class="table-row">
                              <td class="table-td" title={acc.Staff__r.Name}>{acc.Staff__r.Name}</td>
                              <td class="table-td" title={acc.Staff__r.Last_Name__c}>{acc.Staff__r.Last_Name__c}</td>
                              <td class="table-td" title={acc.Staff__r.Employment_type__c}>{acc.Staff__r.Employment_type__c}</td>
                              <td class="table-td" title={acc.Staff__r.Contact_Number__c}>{acc.Staff__r.Contact_Number__c}</td>
                            </tr>
                          </template>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
                <!--   <template if:true={staffrecordsAddPayrun}> -->
                <div slot="footer" class="slds-m-around_medium slds-align_absolute-center">
                  <lightning-button class="slds-m-left_medium" slot="footer" label="Save" variant="brand" onclick={saveaddPayRun} disabled={issavedpayrun}></lightning-button>
                  <lightning-button class="slds-m-left_medium" slot="footer" label="Close" variant="brand" onclick={closeaddPayRun}></lightning-button>
                </div>
                <!--  </template> -->
              </div>
            </template>
          </div>
        </div>
      </template>
      <template if:true={ispayrun}>
        <div if:true={isDesktop}>
          <div  class="slds-size_7-of-7">
            <!--slds-m-left_xx-largex slds-var-m-top_xx-large-->
            <div class="table-container payrun-table slds-grow slds-m-around_small" style="min-height: 0; display: flex; flex-direction: column; flex: 1 1 auto;">
              <!-- HEADER -->
              <div class="header-wrapper">
                <table class="staff-table fixed-table">
                  <thead>
                    <tr class="table-row">
                      <th class="table-th" title="Pay Schedule #">Pay Schedule #</th>
                      <th class="table-th" title="Cycle">Cycle</th>
                      <th class="table-th" title="Facility">Facility</th>
                      <th class="table-th" title="Payment Date">Payment Date</th>
                      <th class="table-th" title="Status">Status</th>
                    </tr>
                  </thead>
                </table>
              </div>
              <!-- BODY -->
              <div class="table-body custom-scroll">
                <table class="staff-table fixed-table">
                  <tbody>
                    <template for:each={payrun} for:item="acc">
                      <tr key={acc.Id} class="table-row">
                        <td class="table-td" title={acc.Period__c}>
                          <a data-id={acc.Id} data-name={acc.Status__c} data-date={acc.Next_Pay_Date__c} data-groupname={acc.Group_Name__c} data-enddate={acc.Period_End_Date__c} href="javascript:void(0)" onclick={openPaysettings}> {acc.Period__c} </a>
                        </td>
                        <td class="table-td" title={acc.Frequency__c}>{acc.Frequency__c}</td>
                        <td class="table-td" title={acc.Facility_Name__c}>{acc.Facility_Name__c}&nbsp;{acc.Frequency__c}</td>
                        <td class="table-td" title={acc.paymentDate}>{acc.paymentDate}</td>
                        <td class="table-td" title={acc.Status__c}>
                          <label class="status">{acc.Status__c}</label>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
            <div>
              <!-- <div class="payruntext">Historical Payruns</div> -->
              <!-- <strong style="font-size: medium;">Historical Pay runs</strong> -->
              <!--Refresh Button-->

              <div class="slds-p-horizontal_small" style="display: flex; align-items: center; justify-content: space-between;">
                <!-- Left side: Staff Details -->
                <p style="font-weight: bold; font-size:140%">Historical Payruns</p>
                <!-- Right side: Back button and image icon -->
                <div style="display: flex; align-items: center; gap: 10px;margin-right:5%;">

                    <span class="label-text-drop">
                      Search </span>
                    <lightning-input name="SearchPayroll" variant="label-hidden" label="Search" type="search" value={searchGroupName} onchange={handleSearch}></lightning-input>
                  </div>
                  <div class="floating-label slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2">
                    <span class="label-text-drop">Status</span>
                    <lightning-combobox name="status" variant="label-hidden" label="Status" value={payRollStatusValue} placeholder="Select Status" options={payRollStatusOptions} onchange={handleSearch}></lightning-combobox>
                  </div>
                  <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={fetchPayrun}>
                    <svg class="slds-button__icon" aria-hidden="true">
                      <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="table-container historical-payrun-table slds-grow slds-m-around_small" style="min-height: 0; display: flex; flex-direction: column; flex: 1 1 auto;">
                <template if:false={noRecordsFlag}>
                  <!-- HEADER -->
                  <div class="header-wrapper">
                    <table class="staff-table fixed-table">
                      <thead>
                        <tr class="table-row">
                          <th class="table-th" title="Pay Schedule #">Pay Schedule #</th>
                          <th class="table-th" title="Cycle">Cycle</th>
                          <th class="table-th" title="Facility">Facility</th>
                          <th class="table-th" title="Processed Date">Processed Date</th>
                          <th class="table-th" title="Status">Status</th>
                        </tr>
                      </thead>
                    </table>
                  </div>
                  <!-- BODY -->
                  <div class="table-body custom-scroll">
                    <table class="staff-table fixed-table">
                      <tbody>
                        <template for:each={payrunList} for:item="acc">
                          <tr key={acc.Id} class="table-row">
                            <td class="table-td" title={acc.Period__c}>
                              <a data-id={acc.Id} data-name={acc.Status__c} data-date={acc.Next_Pay_Date__c} data-groupname={acc.Group_Name__c} data-enddate={acc.Period_End_Date__c} href="javascript:void(0)" onclick={openPaysettings}> {acc.Period__c} </a>
                            </td>
                            <td class="table-td" title={acc.Frequency__c}>{acc.Frequency__c}</td>
                            <td class="table-td" title={acc.Facility_Name__c}>{acc.Facility_Name__c}&nbsp;{acc.Frequency__c}</td>
                            <td class="table-td" title={acc.paymentDate}>{acc.paymentDate}</td>
                            <template if:false={acc.StatusChecking}>
                              <td class="table-td" title={acc.Status__c}>
                                <label class={acc.Status__c}>{acc.Status__c}</label>
                              </td>
                            </template>
                            <template if:true={acc.StatusChecking}>
                              <td class="table-td" title={acc.Status__c}>
                                <label class="STP">{acc.Status__c}</label>
                                <lightning-icon icon-name="utility:threedots" alternative-text="threedots" title="Export to CSV" data-id={acc.Id} onclick={handleExportCSV} size="xx-small" variant="success" class="slds-float_right slds-m-right_medium slds-m-bottom_medium "></lightning-icon>
                              </td>
                            </template>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template if:true={noRecordsFlag}>
                  <div class="no-data">
                    <p>No records found</p>
                  </div>
                </template>
              </div>
              <template if:false={noRecordsFlag}>
                <template if:true={totalRecords}>
                  <div if:true={visible} class="fixed-pagination">
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                      <!--PAGE NAVIGATION-->
                      <div class="slds-align_absolute-center">
                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button> &nbsp; <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span> &nbsp; <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                      </div>
                      <!--TOTAL RECORDS-->
                      <div class="slds-clearfix">
                        <div class="slds-float_right ">
                          <span class="slds-badge"> Total Records: {totalRecords}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </template>
            </div>
          </div>
        </div>
      </template>
      <template if:true={isopenPaysettings}>
        <div if:true={isDesktop}>
          <div class="slds-p-around_small">
            <lightning-record-edit-form object-api-name="Payroll_Setting__c" record-id={paysetId}>
              <div class="slds-grid slds-wrap">

                    <div style="flex: 0 0 30%; font-weight: bold;" class="slds-p-around_small">Processed Date</div>
                    <div style="flex: 0 0 5%; font-weight: bold; text-align: center;" class="slds-p-around_small">:</div>

          <div class="slds-var-m-top_large slds-p-around_small">

              <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>

            <div class="table-container staffrecords-table slds-grow" style="min-height: 0; display: flex; flex-direction: column; flex: 1 1 auto;">

                    <tr class="table-row">
                      <th class="table-th" title="First Name">First Name</th>

                  </thead>
                </table>
              </div>

              <div class="table-body custom-scroll">
