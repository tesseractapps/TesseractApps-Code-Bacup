<template if:true={showPdfModal}>
  <section class="fillout-modal" role="dialog" aria-modal="true" aria-labelledby="fillout-pdf-modal-title">

      <header class="fillout-modal__header">
        <h2 id="fillout-pdf-modal-title">Detected Labels</h2>
        <button class="fillout-modal__close" title="Close" onclick={closePdfModal} aria-label="Close">×</button>

      <div class="fillout-modal__content">
        <template if:true={pdfLabels.length}>
          <div class="fillout-labels-list">
            <div class="fillout-labels-toolbar">
              <lightning-input type="checkbox" label="Select all" onchange={toggleSelectAll}></lightning-input>
              <lightning-button variant="neutral" label="Clear" onclick={clearSelection}></lightning-button>
            </div>

            <template for:each={pdfLabels} for:item="lbl">
              <label class="fillout-label-item" key={lbl.id}>
                <input type="checkbox" data-id={lbl.id} checked={lbl.selected} onchange={toggleOne}/>
                <span>{lbl.text}</span>
              </label>
            </template>
          </div>
        </template>

        <template if:false={pdfLabels.length}>
          <p class="fillout-muted">No labels detected. Try OCR fallback or a different PDF.</p>
        </template>
      </div>

      <footer class="fillout-modal__footer">
        <lightning-button variant="neutral" label="Cancel" onclick={closePdfModal}></lightning-button>

  <div class="fillout-modal__backdrop"></div>
</template>

                            <div key={row.id} class="grid-row">
                                <template for:each={row.cells} for:item="cell">
                                    <div key={cell.id}
                                        class={cell.dynamicCellClass}
                                        data-id={cell.id}
                                        data-row={cell.row}
                                        data-col={cell.col}
                                        colspan={cell.colspan}
                                        rowspan={cell.rowspan}
                                        onclick={handleCellClick}
                                        ondragover={handleDragOver}
                                        ondrop={handleDrop}
                                        onmousedown={handleAltCopyDragStart}
  onmouseenter={handleAltCopyDragMove}
                                        style={cell.style}>
                                        <template if:true={cell.field}>
                                            <div class="field-item dropped" draggable="true" onclick={handleAltPlaceholderClick} ondragstart={handleDragStartDropped} data-id={cell.field.id}>
                                            
      <!-- left: header + preview stacked -->
      <div class="field-main">
        <div class="field-head">
          <strong class="field-type">{cell.field.dataType}</strong>

            <template if:false={cell.field.isHeader}>
          <span class="field-name-wrap">

    </template>
  </span>

          </template> -->
          <!-- NORMAL TEXT INPUT -->

    <template if:false={cell.field.isRichTextInput}>
        <lightning-input
            type="text"
            variant="label-hidden"
            placeholder="Enter Input"
            disabled>
        </lightning-input>
    </template>

    <!-- Rich text input -->
    <template if:true={cell.field.isRichTextInput}>
        <div class="rich-text-preview"
             data-rich-id={cell.id}
             lwc:dom="manual">
        </div>
    </template>

</template>
          <template if:true={cell.field.isNumber}>
            <lightning-input type="number" variant="label-hidden" placeholder="Enter Input" disabled></lightning-input>
          </template>
          <template if:true={cell.field.isDate}>
            <lightning-input type="date" variant="label-hidden" disabled></lightning-input>
          </template>
          <template if:true={cell.field.isTime}>
            <lightning-input type="time" variant="label-hidden" disabled></lightning-input>
          </template>
          <template if:true={cell.field.isDropdown}>
            <lightning-combobox variant="label-hidden" disabled options={cell.field.previewOptions}></lightning-combobox>
          </template>
          <template if:true={cell.field.isCheckbox}>         
                <label class="checkbox-container">
                                  <input
                                    type="checkbox"
                              
                                    class="blue-checkbox"
                                    disabled
                                  />
                                  <span class="checkbox-label"></span>
                                </label>
            </template>

          <template if:true={cell.field.isRadio}>
            <lightning-radio-group variant="label-hidden" disabled options={cell.field.previewOptions}></lightning-radio-group>
          </template>
          <template if:true={cell.field.isUpload}>
            <button type="button"
            class="file-upload-button">
                                                        &#8684; Upload File
                                                    </button>
          </template>
          <template if:true={cell.field.isHeader}>
            <div class="fc-header-preview slds-truncate" title={cell.field.text} style={cell.field.inlineStyle}>
                {cell.field.text}
            </div>
          </template>

        <template if:true={cell.field.isTableBlock}>

        <div class="inner-table-wrapper">

        <!-- TABLE NAME -->
        <template if:true={cell.field.tableConfig.showTableName}>
        <div class="table-title">

        <template if:true={showPopup}>
        <lightning-input
        variant="label-hidden"
        placeholder="Enter table name"
        value={cell.field.tableConfig.tableName}
        data-type="tableName"
        onchange={handleInlineTableEdit}>
        </lightning-input>
        </template>

        <template if:false={showPopup}>
        <div class="table-text">
        {cell.field.tableConfig.tableName}
        </div>
        </template>

        </div>
        </template>


        <table class="inner-table">

        <!-- HEADER -->
        <template if:true={cell.field.tableConfig.hasHeader}>
        <tr>

        <template for:each={cell.field.tableConfig.columns} for:item="col">

        <th key={col.key} style={col.style} class={col.thClass}>

        <!-- HEADER INPUT WHEN EDITING -->
        <template if:true={col.isEditable}>
        <lightning-input
            variant="label-hidden"
            value={col.header}
            data-type="header"
            data-col={col.key}
            onchange={handleInlineTableEdit}>
        </lightning-input>
        </template>

        <!-- HEADER TEXT IN PREVIEW -->
        <template if:false={col.isEditable}>
        <div class="table-text">
        {col.header}
        </div>
        </template>

        </th>

        </template>

        </tr>
        </template>


        <!-- BODY -->
        <template for:each={cell.field.tableConfig.innerCells} for:item="row">

        <tr key={row.index}>

        <!-- ROW LABEL -->
        <template if:true={cell.field.tableConfig.hasRowLabels}>

        <th class="row-label-col">

        <template if:true={row.isEditable}>
        <lightning-input
        variant="label-hidden"
        value={row.rowLabel}
        data-type="row"
        data-row={row.index}
        onchange={handleInlineTableEdit}>
        </lightning-input>
        </template>

        <template if:false={row.isEditable}>
        <div class="table-text">
        {row.rowLabel}
        </div>
        </template>

        </th>

        </template>


        <!-- DATA CELLS -->
        <template for:each={row.renderCells} for:item="innerCell">

        <td
        key={innerCell.id}
        class="inner-cell"
        data-parent={cell.id}
        data-row={innerCell.rowIndex}
        data-col={innerCell.colIndex}
        data-id={innerCell.id}
        ondragover={handleInnerDragOver}
        ondragleave={handleInnerDragLeave}
        ondrop={handleInnerDrop}
        >

        <template if:false={innerCell.field}>
        <div class="inner-placeholder">
        Drop field

  </div>

  <!-- Facility Dropdown -->
  <div class="floating-label-input">
    <span class="label-text-drop">Facility</span>
    <lightning-combobox
      value={selectedFacility}
      options={staffFacilityOptions}
      onchange={handleFacilityChange}
      variant="label-hidden">
    </lightning-combobox>
  </div>
</div>

      <!-- BODY -->
      <div class="grant-modal-body custom-scroll">

       
        <template for:each={paginatedStaff} for:item="staff">

          <div key={staff.Id} class="staff-row">

            <lightning-input
              type="checkbox"
              data-id={staff.Id}
              checked={staff.isSelected}
              onchange={handleStaffSelect}>
            </lightning-input>

            <span>{staff.firstName} {staff.lastName}</span>

          </div>

        </template>

      </div>

      <!-- PAGINATION -->
     <template if:true={totalStaffRecords}>
  <div class="slds-grid slds-wrap slds-p-around_medium slds-grid_vertical-align-center">

    <div class="slds-col slds-size_1-of-3">

  <div class="slds-list_inline slds-p-bottom_xx-small">

    <label
      class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center"
      for="staffRecordsPerPage">

      Page Size:

    </label>

    <div class="slds-select_container">

      <select
        class="slds-select"
        id="staffRecordsPerPage"
        onchange={handleStaffPageSizeChange}>

        <template
          for:each={staffPageSizeOptions}
          for:item="option">

          <option
            key={option.value}
            value={option.value}>

            {option.label}

          </option>

        </template>

      </select>

    </div>

  </div>

</div>


    <!-- CENTER : NAV -->
    <div class="slds-col slds-size_1-of-3 slds-text-align_center">

      <div class="slds-grid slds-gutters slds-align_absolute-center slds-nowrap">

        <lightning-button
          disabled={bDisableFirstStaff}
          icon-name="utility:jump_to_left"
          label="First"
          onclick={firstStaffPage}>
        </lightning-button>

        <lightning-button
          disabled={bDisableFirstStaff}
          icon-name="utility:chevronleft"
          label="Previous"
          onclick={previousStaffPage}>
        </lightning-button>

        <span class="slds-badge slds-m-horizontal_small">
          Showing {pageNumberStaff} of {totalStaffPages} Page(s)
        </span>

        <lightning-button
          disabled={bDisableLastStaff}
          icon-name="utility:chevronright"
          label="Next"
          onclick={nextStaffPage}>
        </lightning-button>

        <lightning-button
          disabled={bDisableLastStaff}
          icon-name="utility:jump_to_right"
          label="Last"
          onclick={lastStaffPage}>
        </lightning-button>

      </div>

    </div>

    <!-- RIGHT : TOTAL -->
    <div class="slds-col slds-size_1-of-3 slds-text-align_right">

      <span class="slds-badge">
        Total Staff: {totalStaffRecords}
      </span>

    </div>

  </div>
</template>


      <!-- FOOTER -->
      <div class="grant-modal-footer">

        <lightning-button
          label="Cancel"
          onclick={closeGrantAccessPopup}>
        </lightning-button>

        <lightning-button
          variant="brand"
          label="Grant Access"
          onclick={grantAccess}>
        </lightning-button>

      </div>

    </div>

  </div>

</template>

<template if:true={isLoading}>
    <div class="overlay-logo"></div>

    <div class="spinner-wrapper">
      <div class="loader-container">
        <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
        <img src={imageUrl} alt="T Logo" class="Tlogo" />
      </div>

      <!-- Progress text instead of progress bar -->
      <p class="progress-text">Please wait...</p>
    </div>
  </template>


</template>
