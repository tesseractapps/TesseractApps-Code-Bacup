    <!-- TABS -->
    <lightning-tabset variant="scoped">

        <!-- KPI TAB -->
        <lightning-tab label={selectedTemplate.kpiTabLabel}>

            <template for:each={selectedTemplate.kpis} for:item="kpi">
                <div key={kpi.Id} class="kpi-card">

                    <div class="kpi-header">
                        <div>
                            <strong>{kpi.Name}</strong>
                            <span class="badge">{kpi.Category__c}</span>
                            <div class="kpi-desc">
                                {kpi.KPI_Description__c}
                            </div>
                        </div>

                        <div class="kpi-meta">
                            <span>Target : <b>{kpi.KPI_Target__c}%</b></span>
                            <span>Weight : <b>{kpi.KPI_Weight__c}%</b></span>
                        </div>
                    </div>

                    <div class="kpi-body">

                        <div class="rating-block">
                            <label>Your Rating</label>
                            <lightning-combobox
                                data-id={kpi.Id}
                                options={ratingOptions}
                                value={kpi.staffRating}
                                onchange={handleKpiRatingChange}
                                variant="label-hidden" disabled={selectedTemplate.EditDisabled}>
                            </lightning-combobox>
                        </div>

                       <!--  <div class="attachment-block">
                            <label>Attachments</label>
                            <div class="upload-box">
                                Choose File
                            </div>
                        </div> -->

                    </div>

                    <div class="comment-block">
                        <label>Comments & Achievements</label>
                        <lightning-textarea
                            data-id={kpi.Id}
                            value={kpi.staffComment}
                            onchange={handleKpiCommentChange} disabled={selectedTemplate.EditDisabled}>
                        </lightning-textarea>
                    </div>

                </div>
            </template>

        </lightning-tab>

        <lightning-tab label={selectedTemplate.okrTabLabel}>
            <template for:each={selectedTemplate.okrs} for:item="okr">
            <div key={okr.Id} class="kpi-card">

                <div class="kpi-header">
                    <div>
                        <strong>{okr.OKR_Objective__c}</strong>
                       <!--  <span class="badge">{okr.OKR_Objective__c}</span> -->
                        <div class="kpi-desc">
                            {okr.OKR_Description__c}
                        </div>
                    </div>

                    <div class="kpi-meta">
                        <span>Target : <b>{okr.Key_Target__c}%</b></span>
                        <span>Weight : <b>{okr.OKR_Weight__c}%</b></span>
                    </div>
                </div>

                <div class="kpi-body">

                    <div class="rating-block">
                        <label>Your Rating</label>
                        <lightning-combobox
                            data-id={okr.Id}
                            options={ratingOptions}
                            value={okr.staffRating}
                            onchange={handleOkrRatingChange} disabled={selectedTemplate.EditDisabled}
                            variant="label-hidden">
                        </lightning-combobox>
                    </div>

                </div>

                <div class="comment-block">
                    <label>Comments & Achievements</label>
                    <lightning-textarea
                        data-id={okr.Id}
                        value={okr.staffComment}
                        onchange={handleOkrCommentChange} disabled={selectedTemplate.EditDisabled}>
                    </lightning-textarea>
                </div>

            </div>
        </template>
        </lightning-tab>

        <lightning-tab label={selectedTemplate.competencyTabLabel}>
             <template for:each={selectedTemplate.competencies} for:item="comp">
            <div key={comp.Id} class="kpi-card">

                <div class="kpi-header">
                    <div>
                        <strong>{comp.Name}</strong>
                        <span class="badge">{comp.Competency_Category__c}</span>
                        <div class="kpi-desc">
                            {comp.Competency_Description__c}
                        </div>
                    </div>

                    <div class="kpi-meta">
                      <!--   <span>Target : <b>{comp.KPI_Target__c}%</b></span> -->
                        <span>Weight : <b>{comp.Competency_Weight__c}%</b></span>
                    </div>
                </div>

                <div class="kpi-body">

                    <div class="rating-block">
                        <label>Your Rating</label>
                       <lightning-combobox
                            data-id={comp.Id}
                            options={ratingOptions}
                            value={comp.staffRating}
                            onchange={handleCompetencyRatingChange} disabled={selectedTemplate.EditDisabled}
                            variant="label-hidden">
                        </lightning-combobox>
                    </div>

                </div>

                <div class="comment-block">
                    <label>Comments</label>
                    <lightning-textarea
                        data-id={comp.Id}
                        value={comp.staffComment}
                        onchange={handleCompetencyCommentChange} disabled={selectedTemplate.EditDisabled}>
                    </lightning-textarea>
                </div>

            </div>
        </template>

        </lightning-tab>

    </lightning-tabset>

    <!-- FOOTER -->
    <div class="footer">
        <lightning-button label="Close" onclick={handleClose}></lightning-button>
        <lightning-button label="Save Draft" variant="neutral" onclick={handleSaveDraft} disabled={selectedTemplate.EditDisabled}></lightning-button>
        <lightning-button label="Submit Review" variant="brand" onclick={handleSubmitreview} disabled={selectedTemplate.EditDisabled}></lightning-button>
    </div>

</div>
