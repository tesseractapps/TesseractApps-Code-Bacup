<!-- sldsValidatorIgnore -->
<template>   
    <lightning-card  >
       
          <div class=""> 
            <div if:true={isDesktop}>
                <div class="slds-grid slds-wrap slds-m-left_large"> 
                     <lightning-input class="slds-size_1-of-6 slds-m-around_small" type="search" label="First Name" name="fname" value={fname}></lightning-input><br/>
                     <lightning-input  class="slds-size_1-of-6 slds-m-around_small" type="search" label="Last Name" name="lname" value={lname} ></lightning-input><br/>
                     <lightning-input  class="slds-size_1-of-6 slds-m-around_small" type="search" label="Contact Number" name="phone" value={phone}></lightning-input><br/>
                     <lightning-input  class="slds-size_1-of-6 slds-m-around_small" type="search" label="Email" name="email" value={email}></lightning-input><br/>
                     <lightning-button style="margin-top: 32px;" variant="brand" label="Search" slot="actions" title="Search Issue" onclick={handleSearch} class="slds-float_right  slds-var-m-top_x-large "></lightning-button>
                     <lightning-button  style="margin-top:32px;" variant="brand" label="Clear " slot="actions" title="Clear Issue" onclick={handleClear} class="slds-float_right  slds-var-m-left_x-small slds-var-m-top_x-large"></lightning-button>
           
                </div> 
            </div>
            <div if:true={isMobile}>
                <div class="slds-grid slds-wrap slds-m-left_large"> 
                     <lightning-input class="slds-size_1-of-2 " type="search" label="First Name" name="fname" value={fname}></lightning-input><br/>
                     <lightning-input  class="slds-size_1-of-2 " type="search" label="Last Name" name="lname" value={lname} ></lightning-input><br/>
                     <lightning-input  class="slds-size_1-of-2 " type="search" label="Contact Number" name="phone" value={phone}></lightning-input><br/>
                     <lightning-input  class="slds-size_1-of-2 " type="search" label="Email" name="email" value={email}></lightning-input><br/>
                     <lightning-button  class="slds-size_1-of-2 slds-m-top_large" variant="brand" label="Search " slot="actions" title="Search Issue" onclick={handleSearch} ></lightning-button>
                     <lightning-button   class="slds-size_1-of-2 slds-m-top_large" variant="brand" label="Clear " slot="actions" title="Clear Issue" onclick={handleClear} ></lightning-button>
           
                </div> 
            </div>   
            <div class="slds-var-m-top_xx-large slds-var-m-left_xx-large slds-var-m-right_xx-large "> 
                <template if:true={totalRecords}>      
                    <lightning-datatable  
                    key-field="Id"  
                    data={availableIssues}
                        columns={columns}
                        hide-checkbox-column="false">
                    </lightning-datatable>  
                </template> 
                <template if:true={error}>  
                    {error}                 
                </template> 
                  
            </div>  
            </div>
            <template if:true={totalRecords}> 
                <div if:true={isDesktop}>
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;">
                
                <!--PAGE NAVIGATION-->
                    <div class="slds-align_absolute-center" style="height:5rem">
                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                        &nbsp;
                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                        &nbsp;
                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                    </div>
        
                    <!--TOTAL RECORDS-->
                    <div class="slds-clearfix">
                        <div class="slds-float_right slds-m-right_xx-large">
                            <span class="slds-badge"> Total Records: {totalRecords}</span>
                        </div>
                    </div>
                </div>
                </div>
           
            <div if:true={isMobile}>
                <div class="slds-grid " style="padding-top: 0.5em;">
                
                    <!--PAGE NAVIGATION-->
                        <div  class="slds-align_absolute-center" style="height:5rem">
                            <lightning-button variant="base" size="small" disabled={bDisableFirst} icon-name="utility:jump_to_left"  class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                            <lightning-button variant="base" size="small" disabled={bDisableFirst} icon-name="utility:chevronleft" alternative-text="Previous" onclick={previousPage}></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button  variant="base" size="small" disabled={bDisableLast} icon-name="utility:chevronright"  alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" ></lightning-button>
                            <lightning-button variant="base" size="small" disabled={bDisableLast} icon-name="utility:jump_to_right"  alternative-text="last page" onclick={lastPage} ></lightning-button>
                        </div>
                        
                </div> 
                 <!--TOTAL RECORDS-->                
                 <div style="margin-left:65%" class=" slds-badge">
                    Total Records: {totalRecords}
                    <br/>
               </div>  
            </div>
            </template>
           <!-- if there is no facilities -->
           <template if:false={totalRecords}>
                <div class="slds-grid  slds-grid_align-spread slds-m-left_large" style="padding-top: 0.5em; font-size:15px;">
                    <b style="color: Red"><I> No Issues Registed </I> </b>
                 </div>
            </template>
       
    </lightning-card>
    
    
</template>
