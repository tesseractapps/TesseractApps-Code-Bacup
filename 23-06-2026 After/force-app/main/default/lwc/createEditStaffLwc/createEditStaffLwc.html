                        <lightning-button 
                            label="Cancel"
                            variant="neutral" 
                            onclick={closeOtp}>
                        </lightning-button>

                        <lightning-button 
                            label="Verify" 
                            variant="brand"
                            onclick={handleVerifyOtp}>
                        </lightning-button>

                    </div>
                </div>
            </div>
        </section>
        <div class="blur-overlay-popup"></div>
    </template>
    <template if:true={hasFutureShifts}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
            class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
        
            <div class="slds-modal__container modal-container" style="max-width:25%;">
                <header class="slds-modal__header" style="background: #002A52;">
                
                    <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Warning</h2>
                </header> 
                <div class="slds-modal__content slds-p-around_medium modal-content"  >         <!-- style="border-radius:0 0 15px 15px" -->                       
                    <div class="slds-m-around_small" style="text-align:center">
                        <div>
                            <p> Status cannot be changed because there are scheduled shifts on the following dates:
                                    <br/>
                                <strong>{shiftDatesMessage}</strong>
                            </p>
                        </div>
                        <div class="slds-m-top_medium">
                            <lightning-button 
                                label="OK"
                                variant="brand"
                                onclick={handleFutureShiftClose}>
                            </lightning-button>
                        </div>
                        
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showContactTypeModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open popup-zindex">
            <div class="slds-modal__container" style="max-width: 25%;">

                <header class="slds-modal__header" style="background: #002a52;">
                    <h2 class="slds-text-heading_medium" style="color: white; text-align: center;">
                        Add Contact Type
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        label="Contact Type Name"
                        value={newContactTypeName}
                        onchange={handleNewContactTypeInput}
                        required>
                    </lightning-input>

                    <template if:true={customContactTypes.length}>
                        <div class="slds-m-top_medium">
                            <p class="">Custom Contact Types</p>

                            <template for:each={customContactTypes} for:item="type">
                                <div key={type.value}
                                    class="slds-grid slds-grid_align-spread slds-m-top_x-small">

                                    <span class={type.cssClass}>
                                        {type.label}
                                    </span>

                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        alternative-text="Delete"
                                        data-value={type.value}
                                        onclick={stageDeleteContactType}>
                                    </lightning-button-icon>

                                </div>
                            </template>

                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                            class="slds-m-right_small"
                        onclick={closeContactTypeModal}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="Save"
                        onclick={saveContactType}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="blur-overlay-popup"></div>
    </template>
    
</template>
