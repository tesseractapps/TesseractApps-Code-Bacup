<template>
    <div>
        <div>
            <h3 slot="title" style="padding: 8px 0px 0 20px;">
                <!-- <span style="font-size: 100%;font-weight:bold;">Staff Details</span> -->
                <a href="#" data-name="Staff" onclick={handleRedirectClick} style="font-size: 100%;font-weight:bold;color:black">{staffPreferredName} Details</a>
            </h3>
            <div class="slds-p-around_medium">
                <canvas class="staff-chart"></canvas>
            </div>

            <div class="slds-p-around_medium">
                <canvas class="staff-chart"></canvas>
            </div>

            <template if:true={showStaffModal}>
                <section class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" aria-modal="true">
                    <div class="slds-modal__container" style="max-width:30%">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">{selectedStatusLabel} Staff</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <template if:true={selectedStaffList.length}>
                                <ul>
                                    <template for:each={selectedStaffList} for:item="staff">
                                        <li key={staff.Id}>{staff.NameToDisplay__c}</li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={selectedStaffList.length}>
                                <p>No staff found.</p>
                            </template>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button label="Close" onclick={closeStaffModal}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>
    </div>
</template>
