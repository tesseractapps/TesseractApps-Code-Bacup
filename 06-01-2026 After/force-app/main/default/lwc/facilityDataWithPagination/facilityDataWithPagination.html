<template>
    <lightning-card>
        <h3 slot="title">
            <img src={facility} alt="" width="45px" height="45px" style="margin-right:0.1%">
            Facility Details
        </h3>
        <div if:true={isDesktop}>
            <lightning-button style="margin-top:-4%" variant="brand" label="Create New Facility" slot="actions"
                title="New Facility" onclick={handleCreateNewFacility} class="slds-float_right "></lightning-button>
        </div>
        <div if:true={isMobile}>
            <lightning-button variant="brand" label="Create New Facility" title="New Facility"
                onclick={handleCreateNewFacility} class="slds-float_right slds-m-bottom_medium"></lightning-button>

        </div>
        <!-- Card view Display Code-->
        <template if:true={totalRecords}>
            <div if:true={isDesktop}>
                <div style="margin-left: 5%;margin-top:2%" class=" slds-grid slds-gutters  slds-wrap slds-m-top_small">

                    <template for:each={recordsToDisplay} for:item="fac" for:index="index">
                        <div key={fac.Id} class="slds-size_1-of-3">
                            <div key={fac.Id} style="border-radius: 12px; border: 1px solid black;"
                                class="slds-m-left_small slds-m-bottom_small">
                                <span
                                    style="border-top-left-radius: 12px; border-top-right-radius: 12px; height:30px;display: block;background-color:#0176d3;border-bottom: 1px black;">
                                    <b> <i><lightning-formatted-text
                                                style="margin-left:10px;margin-top:5px;font-size:17px;color:white;"
                                                value={fac.Name}></lightning-formatted-text>
                                        </i></b>
                                    <lightning-icon icon-name="utility:edit" alternative-text="Edit" title="Edit"
                                        onclick={handleEditFacility} data-id={fac.Id} size="xx-small" variant="error"
                                        class="slds-float_right slds-m-right_small slds-m-bottom_medium ">
                                    </lightning-icon>
                                </span>
                                <span>
                                    <table class="slds-m-top_medium">
                                        <tr>
                                            <td class="slds-m-left_small">&nbsp;Contact&nbsp;&nbsp; </td>
                                            <td><lightning-formatted-text
                                                    value={fac.Phone__c}></lightning-formatted-text>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>&nbsp;</td>
                                        </tr>
                                        <tr>
                                            <td class="slds-m-left_small">&nbsp;<a href="javascript:void(0)"
                                                    data-name={fac.Facility_Name__c} onclick={servicesList}>Services
                                                </a>
                                                <lightning-helptext
                                                    content="Available Services"></lightning-helptext>&nbsp; &nbsp;
                                            </td>
                                            <td><lightning-formatted-text
                                                    value={fac.Services__c}></lightning-formatted-text>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>&nbsp;</td>
                                        </tr>
                                        <tr>
                                            <td class="slds-m-left_small">&nbsp;Email &nbsp;&nbsp; </td>
                                            <td><lightning-formatted-text
                                                    value={fac.Email__c}></lightning-formatted-text>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>&nbsp;</td>
                                        </tr>
                                        <tr>
                                            <td class="slds-m-left_small">&nbsp;Status &nbsp;&nbsp; </td>
                                            <td>
                                                <lightning-input data-id={fac.Id} data-name={fac.Status__c}
                                                    type="toggle" onchange={handlefacStatus} label=""
                                                    checked={fac.Status__c} message-toggle-active=""
                                                    message-toggle-inactive="">

                                                </lightning-input>
                                            </td>

                                        </tr>
                                        <tr>
                                            <td>&nbsp;</td>
                                        </tr>
                                    </table>
                                </span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div if:true={isMobile}>
                <div style="border-radius: 12px;margin-top:7%;margin-right:5%"
                    class=" slds-grid slds-gutters  slds-wrap">
                    <template for:each={recordsToDisplay} for:item="fac" for:index="index">
                        <div key={fac.Id} style="border-radius: 12px; border: 1px solid black;"
                            class="slds-m-left_large slds-m-bottom_small  slds-size_1-of-1 ">
                            <span
                                style="border-top-left-radius: 12px; border-top-right-radius: 12px;display: block;background-color:rgb(94, 110, 201);border-bottom: 1px black;"><b
                                    style="font: size 20px; ">

                                    <lightning-formatted-text style="font-size:15px;color:white"
                                        class="slds-m-left_medium slds-m-top_large"
                                        value={fac.Name}></lightning-formatted-text>
                                    <lightning-icon icon-name="utility:edit" alternative-text="Edit" title="Edit"
                                        onclick={handleEditFacility} data-id={fac.Id} size="xx-small" variant="error"
                                        class="slds-float_right slds-m-right_small slds-m-bottom_medium ">
                                    </lightning-icon>
                                </b>
                                <br /><br />
                            </span>
                            <span>
                                <table class="slds-m-top_medium">
                                    <tr>
                                        <td class="slds-m-left_small">&nbsp;Contact </td>
                                        <td><lightning-formatted-text value={fac.Phone__c}></lightning-formatted-text>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>&nbsp;</td>
                                    </tr>
                                    <tr>
                                        <td class="slds-m-left_small">&nbsp;<a href="javascript:void(0)"
                                                data-name={fac.Facility_Name__c} onclick={servicesList}>Services
                                            </a>
                                            <lightning-helptext content="Available Services"></lightning-helptext>&nbsp;
                                            &nbsp;
                                        </td>
                                        <td><lightning-formatted-text
                                                value={fac.Services__c}></lightning-formatted-text>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>&nbsp;</td>
                                    </tr>
                                    <tr>
                                        <td class="slds-m-left_small">&nbsp;Email </td>
                                        <td><lightning-formatted-text value={fac.Email__c}></lightning-formatted-text>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>&nbsp;</td>
                                    </tr>
                                    <tr>
                                        <td class="slds-m-left_small">&nbsp;Status &nbsp;&nbsp; </td>
                                        <td>
                                            <lightning-input data-id={fac.Id} data-name={fac.Status__c} type="toggle"
                                                onchange={handlefacStatus} label="" checked={fac.Status__c}
                                                message-toggle-active="" message-toggle-inactive="">

                                            </lightning-input>
                                        </td>

                                    </tr>
                                    <tr>
                                        <td>&nbsp;</td>
                                    </tr>
                                </table>
                            </span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
        <template if:true={totalRecords}>

            <div if:true={isDesktop}>
                <div if:true={visible}>
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
                        style="padding-top: 0.5em;">

                        <!--PAGE NAVIGATION-->
                        <div class="slds-align_absolute-center" style="height:5rem">
                            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
                                class="slds-p-horizontal_x-small" alternative-text="first page"
                                onclick={firstPage}></lightning-button>
                            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
                                alternative-text="Previous" onclick={previousPage}></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                                &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                                alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small"
                                icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                                alternative-text="last page" onclick={lastPage}
                                icon-position="right"></lightning-button>
                        </div>

                        <!--TOTAL RECORDS-->
                        <div class="slds-clearfix">
                            <div class="slds-float_right ">
                                <span class="slds-badge"> Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div if:true={isMobile}>
                <div if:true={visible}>
                    <div class="slds-grid " style="padding-top: 0.5em;">

                        <!--PAGE NAVIGATION-->
                        <div class="slds-align_absolute-center" style="height:5rem">
                            <lightning-button variant="base" size="small" disabled={bDisableFirst}
                                icon-name="utility:jump_to_left" class="slds-p-horizontal_x-small"
                                alternative-text="first page" onclick={firstPage}></lightning-button>
                            <lightning-button variant="base" size="small" disabled={bDisableFirst}
                                icon-name="utility:chevronleft" alternative-text="Previous"
                                onclick={previousPage}></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                                &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button variant="base" size="small" disabled={bDisableLast}
                                icon-name="utility:chevronright" alternative-text="Next" onclick={nextPage}
                                class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                            <lightning-button variant="base" size="small" disabled={bDisableLast}
                                icon-name="utility:jump_to_right" alternative-text="last page" onclick={lastPage}
                                icon-position="right"></lightning-button>
                        </div>

                    </div>
                    <!--TOTAL RECORDS-->
                    <div style="margin-left:65%" class=" slds-badge">
                        Total Records: {totalRecords}
                        <br />
                    </div>
                </div>
            </div>
        </template>
        <!-- if there is no facilities -->
        <template if:false={totalRecords}>
            <div class="slds-grid  slds-grid_align-spread slds-m-left_large"
                style="padding-top: 0.5em; font-size:20px;">
                <b style="color: #4CAF50;">No facilities are registered for this organisation.</b>
            </div>
        </template>
    </lightning-card>

    <template if:true={isServiceModel}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal  slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeservicesList}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-03" class="slds-text-heading_medium slds-hyphenate"> <b>{facilityName}</b>
                    </h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-3">
                    <div class="slds-p-around_medium slds-m-left_large">
                        <h3><b class="slds-text-heading_medium slds-m-left_xx-large">Services</b>
                        </h3>
                    </div>
                    <div class=" slds-size_1-of-2 slds-m-left_xx-large">
                        <template for:each={lstOptions} for:item="services">
                            <div key={services.label} class="slds-m-left_xx-large">

                                <ul class="slds-list_dotted slds-m-around_small slds-m-left_xx-large">

                                    <li> {services.label} <br /></li><br />
                                </ul>
                            </div>
                        </template>
                    </div>

                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
