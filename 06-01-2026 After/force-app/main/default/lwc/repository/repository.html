                                </tbody>
                            </table> 
                            </div>
                        </template>          

                        <!-- Permissions Checkboxes -->
                        <div class="permissions">
                        
                            <div style="flex: 1; display: flex; justify-content: flex-start;">
                                <template if:true={isViewEnable}> 
                                    <lightning-input type="checkbox" name="view" label="View" onclick={handlePermissionChange} ></lightning-input>
                                </template>
                            </div>
                              
                            
                            <div style="flex: 1; display: flex; justify-content:center; gap: 10px; margin-right:32%;">
                                <lightning-button label="Cancel" variant="brand-outline" onclick={hideModalBox} ></lightning-button>
                                <lightning-button label="Submit" variant="brand" onclick={handleSubmitPermissions}  disabled={saveDisabled}></lightning-button>
                            </div>
                        </div>   
                        <!-- Submit and Close Buttons -->
                    </div>     
                </div>
            </div>
      </template>
    
  </div>
  <template if:true={DeleteFlag}>
      <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
          class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
      
          <div class="slds-modal__container modal-container" style="max-width:25%;">
          <header class="slds-modal__header" style="background: #002A52;">
              
              <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
          </header> 
          <div class="slds-modal__content slds-p-around_medium modal-content" >                                
              <div class="slds-m-around_small" style="text-align:center">
                  <div><p style="text-align: center;">Are you sure you want to delete this attachment?</p></div>
                  <div class="button-container slds-m-top_medium">
                      <lightning-button label="No" variant="brand" onclick={handleclose}
                      class="slds-m-around_small"></lightning-button>
                      <lightning-button label="Yes" variant="brand"  onclick={handleDelete} class="slds-m-around_small" ></lightning-button>
                      
                  </div>
              </div>
          </div>
          </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

 <template if:true={showLoadingSpinner}>
      <div class="overlay-logo"></div>
        
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
        
                <!-- Progress text instead of progress bar -->
                <p class="progress-text"></br>Please Wait...</p>
            </div>
  </template>

  



  
   
</template>
