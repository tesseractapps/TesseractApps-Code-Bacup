<template>
    <!-- <div class="main-container"> -->
    <template if:true={isHome}>
            <div class="main-container">

         

        
            <header class="header">
                <div class="search-section">
                    <div class="floating-label slds-small-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-6">
                        <span class="label-text-drop">Search</span>
                        <lightning-input  type="search" label="Search Participant" onchange={handleSearch} value={inputValue} variant="label-hidden" ></lightning-input>
                    </div>
                
                        <div class="button-group filter-toggle-group">
                            <button type="button"
                                    class={activeButtonClass}
                                    onclick={handleActiveToggle}>
                                Active
                            </button>

                            <button type="button"
                                    class={inactiveButtonClass}
                                    onclick={handleInactiveToggle}>
                                Inactive
                            </button>
                        </div>
        <div class="slds-col">
            <div class="facility-multiselect" onclick={showFacilityDropdown}>
                <div class="facility-bubble-container facility-scroll-horizontal">
                    <template for:each={selectedFacilities} for:item="facility">
                        <span key={facility.value} class="facility-bubble">
                            {facility.label}
                            <span class="facility-remove" data-id={facility.value} onclick={removeFacility}>×</span>
                        </span>
                    </template>

                    <input type="text"
                        class="facility-search-input"
                        placeholder="Search"
                        value={facilitySearchTerm}
                        oninput={handleFacilitySearchChange}
                        onfocus={showFacilityDropdown}
                        onclick={stopPropagation} />
                </div>

                <template if:true={showFacilityOptions}>
                    <div class="facility-dropdown custom-scroll" onclick={stopPropagation}>
                        <template for:each={filteredFacilityCheckboxOptions} for:item="facility">
                            <label key={facility.value} class="facility-option">
                                <input type="checkbox"
                                    value={facility.value}
                                    data-label={facility.label}
                                    checked={facility.checked}
                                    onchange={handleFacilityCheckboxChange} />
                                {facility.label}
                            </label>
                        </template>
                    </div>
                </template>
            </div>

        </div>



                </div>
                <div class="action-section">
                       
                                     <button class="view-toggle-button"
                                                >
                                            <i class="material-icons toggle-icon" data-name={viewToggleTarget}
                                                onclick={handleChange}
                                                title={viewToggleTitle}>{viewToggleIcon}</i>
                                        </button>
                        
                        <template if:false={isStaff}>
                         
                             <button class="custom-create-btn" onclick={handleSwitchToMultiClientUpload} title="Bulk Upload(Ctrl + Shift + U)">
                                Bulk Upload
                            </button>
                            <button class="custom-create-btn" onclick={handleFormsClick} title="Manage Forms(Ctrl + Shift + F)">
                                Manage Forms
                            </button>

                            <button class="custom-create-btn" onclick={handleCreateNewFacility} title= "Create(Ctrl + Shift + C)">
                                 Create Participant
                            </button>
                            <!-- <lightning-button variant="brand" label="Create Participant" slot="actions" title="New Participant" onclick={handleCreateNewFacility}  ></lightning-button> -->
                        </template>
                </div>
            </header>

       
          <template if:true={showSpinner}>
              <lightning-spinner alternative-text="Refreshing Data" size="medium"></lightning-spinner>
          </template>
          
          <!-- Card view Display Code start -->
          <template if:true={cardFlag}>
              <template if:false={noRecordsFlag}>
                  <div if:true={isDesktop} class="content-wrapper">
                    <div class="slds-float_right">
                    </div>

                    <div class="slds-grid slds-gutters slds-wrap" style="margin-right:0.1%;margin-left:0.1%;">

                          <template for:each={recordsWithToggleStyle} for:item="fac" for:index="index">
                              <div key={fac.Id} class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4" style="padding:1%;">
                                  <div key={fac.Id} style="border-radius: 4px; border: 1px solid rgba(0, 41, 70, 0.6);box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);" >
                                       
                                        <span style="border-top-left-radius: 4px; border-top-right-radius: 4px; height:40px;display:flex;align-items: center; justify-content: space-between;background-color:#003466;border-bottom: 1px black;padding:2px; overflow: hidden;">
                                           
                                            <b style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;color:white;"> <lightning-formatted-text style="font-size:17px;color:white;padding-left:15px;flex-shrink:1;" class="name" value={fac.Display_Nickname__c}></lightning-formatted-text>
                                            </b>                                          
                                           
                                            <template if:true={fac.Picture__c} >
                                                <lightning-avatar variant="circle" src={fac.Picture__c} initials="AW" fallback-icon-name="standard:person_account" alternative-text="image" style="margin-right:0.4rem;flex-shrink: 0;"></lightning-avatar>                                            
                                            </template>  
                                            <template if:false={fac.Picture__c}>
                                                            <div class="material-avatar-fallback">
                                                                <i class="material-icons person">account_circle</i>
                                                            </div>
                                                        </template>
                                        </span>
                                        <span>
                                          <table style="margin-bottom:5px;margin-top:0.5rem;table-layout:fixed;">
                                              <tr>
                                                    <td class="label-cell">&nbsp;Contact</td>
                                                    <td class="colon-cell">:</td>
                                                    <td class="value-cell">
                                                        <lightning-formatted-text value={fac.Contact_Number__c}></lightning-formatted-text>
                                                    </td>
                                                </tr>
                                              
                                             
                                              <tr>
                                                    <td class="label-cell">&nbsp;Address</td>
                                                    <td class="colon-cell">:</td>
                                                    <td class="value-cell">
                                                        <!-- <lightning-formatted-text value={fac.Address1__c}></lightning-formatted-text> -->
                                                        {fac.Address1__c},&nbsp;{fac.Address__City__s},&nbsp;{fac.Address__StateCode__s},&nbsp;{fac.Address__PostalCode__s}
                                                    </td>
                                                </tr>
                                              
                                    
                                              <tr>
                                                    <td class="label-cell">&nbsp;{facilityPreferredName}</td>
                                                    <td class="colon-cell">:</td>
                                                    <td class="value-cell" title={fac.activeFaciltyDisplay}>
                                                      <!--   <lightning-formatted-text value={fac.Facility_Name__c}></lightning-formatted-text> -->
                                                       <lightning-formatted-text value={fac.activeFaciltyDisplay}></lightning-formatted-text> 
                                                    </td>
                                                </tr>
                                              
                                    

                                              <tr>
                                            <template if:false={isStaff}>
                                                    <td class="label-cell">&nbsp;Status</td>
                                                    <td class="colon-cell">:</td>
                                                    <td class="value-cell" style="display: flex; align-items: center; justify-content: space-between;">
                                                        <div class="custom-toggle-wrapper">
                                                                <div class={fac.toggleTrackClass} onclick={handlefacStatus}
                                                                data-id={fac.Id} data-name={fac.Status__c} data-client={fac.Display_Nickname__c}>
                                                                    <div class={fac.toggleKnobClass} data-id={fac.Id} data-name={fac.Status__c} data-client={fac.Display_Nickname__c}></div>
                                                                </div>
                                                                <span class={fac.toggleLabelClass}>{fac.toggleLabel}</span>
                                                        </div> 
                                                        <i class="material-icons view-icon"
                                                        onclick={handleEditFacility}
                                                        data-id={fac.Id}
                                                        data-name={fac.Display_Nickname__c}
                                                        data-typeofservice={fac.Facility__r.Type_of_Service__c}
                                                        data-participanttype={fac.ParticipantType__c}
                                                        style="
                                                            background: #0C78BA;
                                                            color: white;
                                                            width: 24px;
                                                            height: 24px;
                                                            display: flex;
                                                            align-items: center;
                                                            justify-content: center;
                                                            border-radius: 20px;
                                                            font-size: 16px;
                                                            cursor: pointer;
                                                            margin-right: 0.5rem;">
                                                        visibility
                                                        </i>    
                                                    </td>
                                                </template>
                                                <template if:true={isStaff}>
                                                    <td class="label-cell" style="visibility: hidden;">&nbsp;Status</td>
                                                    <td class="colon-cell" style="visibility: hidden;">:</td>
                                                    <td class="value-cell" style="display: flex; align-items: center; justify-content: space-between;">
                                                        <div class="custom-toggle-wrapper" style="visibility: hidden;">
                                                                <div class={fac.toggleTrackClass} onclick={handlefacStatus}
                                                                data-id={fac.Id} data-name={fac.Status__c} data-client={fac.Display_Nickname__c}>
                                                                    <div class={fac.toggleKnobClass} data-id={fac.Id} data-name={fac.Status__c} data-client={fac.Display_Nickname__c}></div>
                                                                </div>
                                                                <span class={fac.toggleLabelClass}>{fac.toggleLabel}</span>
                                                        </div> 
                                                        <i class="material-icons view-icon"
                                                        onclick={handleEditFacility}
                                                        data-id={fac.Id}
                                                        data-typeofservice={fac.Facility__r.Type_of_Service__c}
                                                        data-participanttype={fac.ParticipantType__c} 
                                                        style="
                                                            background: #0C78BA;
                                                            color: white;
                                                            width: 24px;
                                                            height: 24px;
                                                            display: flex;
                                                            align-items: center;
                                                            justify-content: center;
                                                            border-radius: 20px;
                                                            font-size: 16px;
                                                            cursor: pointer;
                                                            margin-right: 0.5rem;">
                                                        visibility
                                                        </i>    
                                                    </td>
                                                </template>
                                                </tr>
                                              
                                          </table>
                                        </span>
                                  </div>
                              </div>
                          </template>
                      </div>
                  </div>
              </template>
          </template>
          <!-- Card view Display Code end-->
          <!--LIGHTNING DATATABLE start-->
          <template if:true={listFlag}>
            <template if:false={noRecordsFlag}>
           <div class="listview custom-scroll">
                  
                  <table
                  class="slds-table slds-table_cell-buffer table"
                  style="table-layout:fixed">
                      <thead >
                          <tr>
                              <th class="slds-cell-wrap th table_th">
                                  {participantPreferredName} Name</th>
                              <th class="slds-cell-wrap th table_th" style="width:10%;">
                                  Contact Number</th>
                              <th class="slds-cell-wrap th table_th">
                                  Address</th>
                              <th class="slds-cell-wrap th table_th">
                                  {facilityPreferredName}</th>
                              <template if:true={statusFlag}>
                                  <th class="slds-cell-wrap th table_th" style="width:6%;">
                                      Status</th>
                              </template>
                              <th class="slds-cell-wrap th table_th" style="width:6%;">
                                  Action</th>
                          </tr>
                      </thead>
                      <tbody>
                          <template for:each={recordsToDisplay} for:item="acc">
                              <tr key={acc.Id} class="tr1">
                                  <td class="slds-cell-wrap table_td"> 
                                      {acc.Display_Nickname__c}                                    
                                  </td>
                                  <td class="slds-cell-wrap table_td">{acc.Contact_Number__c}</td>
                                  <td class="slds-cell-wrap table_td">
                                      {acc.AddressData__c}
                                  </td>
                                  <td class="slds-cell-wrap table_td" title={acc.activeFaciltyDisplay}>
                                     <!--  {acc.Facility_Name__c} -->
                                      {acc.activeFaciltyDisplay} 
                                  </td>
                                  <template if:true={statusFlag}>
                                      <td class="slds-cell-wrap table_td">
                                          {acc.Participant_Status__c}
                                      </td>
                                  </template>
                                  <td class="slds-cell-wrap table_td">
                                      <!-- <lightning-icon icon-name="utility:preview" variant="base" data-id={acc.Id} title="Edit"
                                      alternative-text="Edit" size="small" onclick={handleEditFacility}></lightning-icon> -->
                                      <a href="javascript:void(0)" data-id={acc.Id}  data-name={acc.Display_Nickname__c}  name="view_details" data-typeofservice={acc.Facility__r.Type_of_Service__c}  
                                                        data-participanttype={acc.ParticipantType__c} onclick={handleEditFacility} title="View"
                                                         style="text-decoration: none;">
                                      <i class="material-icons view-icon">visibility</i>
                                      </a>
                                  </td>
                              </tr>
                          </template>
  
                      </tbody>
                  </table>
                  
              </div>
              </template>
          </template>
          

          <!--LIGHTNING DATATABLE start-->
          <template if:false={noRecordsFlag}>
          
              <div if:true={isDesktop}>
                  <div if:true={visible} class="fixed-pagination">
                      <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
  
                          <!--PAGE NAVIGATION-->
                          <div class="slds-align_absolute-center">
                              <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
                                  class="slds-p-horizontal_x-small" alternative-text="first page"
                                  onclick={firstPage}></lightning-button>
                              <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
                                  alternative-text="Previous" onclick={previousPage}></lightning-button>
                              &nbsp;
                              <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                                  &nbsp;&nbsp;Page(s)</span>
                              &nbsp;
                              <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                                  alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small"
                                  icon-position="right"></lightning-button>
                              <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                                  alternative-text="last page" onclick={lastPage}
                                  icon-position="right"></lightning-button>
                          </div>
  
                          <!--TOTAL RECORDS-->
                          <div class="slds-clearfix">
                              <div class="slds-float_right slds-m-right_xx-large">
                                  <span class="slds-badge"> Total Records: {totalRecords}</span>
                              </div>
                          </div>
                      </div>
                  </div>
              </div>
          
          </template>
          <!-- if there is no facilities -->
          <template if:true={noRecordsFlag}>
          <div class="no-data">
            <p>No records found</p>
         </div>
         </template>
         </div>
      
      </template>
  
      
      
      <template if:true={isDetails}>
        <div class="main-container">
          <c-details-lwc record-id={recordId} selected-name={orgId} ></c-details-lwc>
        </div>
      </template>
      <template if:true={handleStatusFlag}>
            <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
                
                <div class="slds-modal__container modal-container" style="max-width:25%;">
                    <header class="slds-modal__header" style="background: #002A52;">
                    
                        <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
                    </header> 
                    <div class="slds-modal__content slds-p-around_medium modal-content" >                                
                        <div class="slds-m-around_small" style="text-align:center">
                            <div><p style="text-align: center;">Are you sure you want to change status of the </br>{client}?</p></div>
                            <div  style="margin-top:10px;text-align: center;">
                                <lightning-button label="No" variant="brand" onclick={handlestatusclose}
                                class="slds-m-around_small"></lightning-button>
                                <lightning-button label="Yes" variant="brand" onclick={handlestatuschange} class="slds-m-around_small"></lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <template if:true={editstaffflag}>
        <div class="main-container">
            <c-details-lwc record-id={recordId} onclientevent={childevent} riskindexdetailsfromparent={riskindexdetails} participantdetails={participantdetails} state={state} ndisflag={ndisFlag} participant={participant} individualflag={individualFlag} companyflag={CompanyFlag} ndiscreateflag={ndisCreateFlag} onhidefacilityevent={handleHideFacilityEvent} navigated-from-notifications={navigatedFromNotifications}></c-details-lwc>
        </div>
        </template>
        <!-- Multi-Upload Section -->
        <template if:true={isMultiClientUpload}>

            <c-tesseract-apps-participant-bulk-upload-lwc  onclienteventfrombulk={childeventNavigate}></c-tesseract-apps-participant-bulk-upload-lwc>    

        </template>
    <!-- </div> -->
    <template if:true={ParticpantRecordForm}>
        <div class="blur-overlay"></div>
        <div class="right-align" style="width:80%;">
            <div class={showParticipantFormClass}>
          <div class="slds-p-around_medium">

            <div style="display: flex; align-items: center; justify-content: space-between;">
                <!-- Left side: Staff Details -->
                <p style="font-weight: bold;font-size:140%; margin: 0;">Create New Participant</p>
            
                <!-- Right side: Back button and image icon -->
                <div style="display: flex; align-items: center; gap: 10px;">
                    <!-- <lightning-button label="Back" variant="brand" onclick={handleeditClose}></lightning-button>                     -->
                </div>
            </div>
              
             
                <lightning-record-edit-form object-api-name="Client__c" record-id={recordId} onsuccess={handleSuccess} onsubmit={handleSubmit} onerror={handleError}>
                  <!-- <lightning-messages></lightning-messages> -->

                
                  <div class="right-content custom-scroll">
<div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop"><span style="color:red">*</span>Type of Industry</span>
                                    <lightning-combobox value={selectedTypeOfIndustry} onchange={handleTypeOfIndustry} required="true" variant="label-hidden" options={typeOfIndustry}   
                                ></lightning-combobox>
                            </div>
                </div>

                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                <span class="label-text-drop"><span style="color:red">*</span>Facility</span>
                                <div class="dropdown-container facility-dropdown12" lwc:ref="dropdownContainer">
                                    <!-- Dropdown Button -->
                                    <button 
                                        type="button"
                                        class="dropdown-button1" 
                                        onclick={toggleFacilityDropdown}
                                        aria-expanded={facilityDropDownOpen}
                                        aria-haspopup="listbox"
                                    >
                                        <span class={selectedOptionClass} title={displayFaciltyDropDowntext}>
                                            {displayFaciltyDropDowntext}
                                        </span>
                                        <lightning-icon 
                                            icon-name={chevronIcon} 
                                            size="x-small" 
                                            class="chevron-icon">
                                        </lightning-icon>
                                    </button>
                                    <!-- Dropdown Menu -->
                                    <div if:true={facilityDropDownOpen} class="dropdown-menu">
                                        <!-- Options List -->
                                        <div class="options-list custom-scroll">
                                            <template for:each={multiFacilityDroDownList} for:item="option">
                                                <div key={option.id} class="option-item">
                                                    <button 
                                                        type="button"
                                                        class={option.buttonClass}
                                                        data-option-id={option.id}
                                                        title={option.label}
                                                        disabled={option.isDisabled}>
                                                        {option.label}
                                                    </button>                                               
                                                    <div class="option-controls">
                                                        <!-- Status Badge -->
                                                        <!-- <span class={option.badgeClass}>
                                                            {option.statusText}
                                                        </span> -->
                                                        <!-- Toggle Switch -->
                                                        <div class="toggle-switch-container">
                                                            <lightning-input
                                                                type="toggle"
                                                                checked={option.checked}
                                                                data-option-id={option.id}
                                                                onchange={handleFacilityToggleActive}
                                                                variant="label-hidden"
                                                                class="toggle-input toggle_bar_right" message-toggle-active="" size="xx-small" 
                                                               message-toggle-inactive=""></lightning-input>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>                         
                            </div>
                </div>
                    <!-- <div class="slds-grid slds-wrap"> -->
                    <!-- <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>Facility</span>
                                        <lightning-combobox value={facilityId} onchange={handleFacilityChange} required="true" variant="label-hidden" options={finalListFacilities}   
                                    ></lightning-combobox>
                                </div>
                    </div> -->
                    <template if:true={nonndisFlag}>
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>Participant Type</span>
                                        <lightning-combobox value={ParticipantType} onchange={handleParticipantType} required="true" variant="label-hidden" options={facilityTypeOptions}   
                                    ></lightning-combobox>
                                </div>
                    </div>
                    </template>
                    <!-- </div> -->
</div>

                    <template if:true={ndisCreateFlag}>
                    <div class="container-box">
                        <div  class="toggle-bar" onclick={handleSectionToggle} data-id="PartcipantDetails" style="cursor: default;">
                            <span>Participant</span>
                            <span>{sectionIcons.PartcipantDetails}</span>      
                        </div>
                        <div class="section-content" data-section="PartcipantDetails">
                        <template if:true={sectionFlags.PartcipantDetails}>
                            <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>First Name</span>
                                        <lightning-input-field field-name="First_Name__c" required name="fname" value={firstName} onchange={handleNameChange} variant="label-hidden"></lightning-input-field>
                                    </div>
                                </div>
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Last Name</span>
                                        <lightning-input-field field-name="Last_Name__c" name="lname" value={lastName} onchange={handleNameChange} variant="label-hidden" required></lightning-input-field>
                                    </div>
                                </div>
                                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop">Nickname</span>
                                        <lightning-input-field field-name="Nickname__c" variant="label-hidden"></lightning-input-field>
                                    </div>
                                </div>
                                
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class="floating-label">
                                        <span class="label-text-drop"><span style="color:red">*</span>Gender</span>
                                        <lightning-input-field field-name="Gendar__c" variant="label-hidden" required></lightning-input-field>
                                    </div>
                                </div>
                                <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                                    <div class={DateOfBirthClass}>
                                        <span class="label-text-drop"><span style="color:red">*</span>Date of Birth</span>
                                        <lightning-input-field field-name="Date_Of_Birth__c" onchange={handleErrorCss} variant="label-hidden" required></lightning-input-field>
                                    </div>
