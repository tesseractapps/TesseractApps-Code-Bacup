<template>
    <!-- <div class="hrlayout"> -->

    <div class="main-container custom-scroll">
        <template if:true={isHome}>


            <lightning-accordion allow-multiple-sections-open class="accordionClass" active-section-name={activeSections}>
                <div class="container-box">
                    <div class="toggle-bar" onclick={handleSectionToggle} data-id="Payslips">
                        <span>Payslips</span>
                        <span  style="cursor: default;">{sectionIcons.Payslips}</span>
                    </div>
                    <template if:true={sectionFlags.Payslips}>
                        <div class="slds-grid slds-wrap slds-grid_align-center" style="padding: 20px 0px 20px 0px;">
                            
                        
                            <div class="slds-grid slds-gutters slds-wrap" style="width: 99%; margin-left: 0.5%; align-items: center;">
    
                                <!-- Start Date Input -->
                                <div class="slds-col slds-size_1-of-4">
                                    <div class="floating-label">
                                        <span class="label-text-drop">Start Date</span>
                                        <lightning-input 
                                            type="date" 
                                            name="StartDateInput"  
                                            value={startDate}  
                                            onchange={hadleDates}
                                            variant="label-hidden">
                                        </lightning-input>
                                    </div>
                                </div>
                            
                                <!-- End Date Input -->
                                <div class="slds-col slds-size_1-of-4">
                                    <div class="floating-label">
                                        <span class="label-text-drop">End Date</span>
                                        <lightning-input 
                                            type="date" 
                                            name="EndDateInput"  
                                            value={endDate} 
                                            onchange={hadleDates}
                                            variant="label-hidden">
                                        </lightning-input>
                                    </div>
                                </div>
                            
                                <!-- Push Export Button to the Right -->
                                <div class="slds-col slds-size_1-of-2 slds-grid slds-grid_align-end">
                                    <lightning-button 
                                        label="Export Detailed Wages Report" 
                                        variant="brand" 
                                        onclick={handleDetailedWagesCSV} 
                                        style="margin-top: 8px;">
                                    </lightning-button>
                                </div>
                            
                            </div>
                            
                            
                                <template if:false={noRecordsFlag}>
                                <table class="slds-m-top_large slds-table slds-table_cell-buffer" style="table-layout: fixed;margin-top:10px;">
                                    <thead>
                                        <tr class="tr1">
                                            <!-- <th class="slds-cell-wrap">{staffPreferredName} Name</th> -->
                                            <th class="slds-cell-wrap">Period Start Date</th>
                                            <th class="slds-cell-wrap">Period End Date</th>
                                            <th class="slds-cell-wrap">Processed Date</th>
                                            <th class="slds-cell-wrap">Hours</th>
                                            <th class="slds-cell-wrap">Pre Tax</th>                                
                                            <th class="slds-cell-wrap">Post Tax </th>
                                            <th class="slds-cell-wrap">Gross</th>                                
                                            <th class="slds-cell-wrap">Tax </th>
                                            <th class="slds-cell-wrap">Reimbursement </th>
                                            <th class="slds-cell-wrap">Guaranteed Super</th>
                                            <th class="slds-cell-wrap">Voluntary Super</th>
                                            <th class="slds-cell-wrap">Net Payable</th>
                                            <th class="slds-cell-wrap">View Payslip</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template if:true={isAccepted}>
                                            <template for:each={isAccepted} for:item="acc">
                                                <tr key={acc.Id}>
                                                    <!-- <td class="slds-cell-wrap">{acc.sName}</td> -->
                                                    <td class="slds-cell-wrap">{acc.sDate}</td>
                                                    <td class="slds-cell-wrap">{acc.eDate}</td>
                                                    <td class="slds-cell-wrap">{acc.npdate}</td>
                                                    <td class="slds-cell-wrap">{acc.totalHours}</td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-formatted-number 
                                                            value={acc.preTax}
                                                            format-style="currency"
                                                            currency-code="AUD"
                                                            minimum-fraction-digits="2"
                                                            maximum-fraction-digits="2">
                                                         </lightning-formatted-number>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-formatted-number 
                                                            value={acc.postTax}
                                                            format-style="currency"
                                                            currency-code="AUD"
                                                            minimum-fraction-digits="2"
                                                            maximum-fraction-digits="2">
                                                         </lightning-formatted-number>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-formatted-number 
                                                            value={acc.grossSalary}
                                                            format-style="currency"
                                                            currency-code="AUD"
                                                            minimum-fraction-digits="2"
                                                            maximum-fraction-digits="2">
                                                         </lightning-formatted-number>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-formatted-number 
                                                            value={acc.tax}
                                                            format-style="currency"
                                                            currency-code="AUD"
                                                            minimum-fraction-digits="2"
                                                            maximum-fraction-digits="2">
                                                         </lightning-formatted-number>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-formatted-number 
                                                            value={acc.reimbursement}
                                                            format-style="currency"
                                                            currency-code="AUD"
                                                            minimum-fraction-digits="2"
                                                            maximum-fraction-digits="2">
                                                         </lightning-formatted-number>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-formatted-number 
                                                            value={acc.superAnnuation}
                                                            format-style="currency"
                                                            currency-code="AUD"
                                                            minimum-fraction-digits="2"
                                                            maximum-fraction-digits="2">
                                                         </lightning-formatted-number>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-formatted-number 
                                                            value={acc.voluntarySuper}
                                                            format-style="currency"
                                                            currency-code="AUD"
                                                            minimum-fraction-digits="2"
                                                            maximum-fraction-digits="2">
                                                         </lightning-formatted-number>
                                                    </td>
                                                    <td class="slds-cell-wrap">
                                                        <lightning-formatted-number 
                                                            value={acc.netPay}
                                                            format-style="currency"
                                                            currency-code="AUD"
                                                            minimum-fraction-digits="2"
                                                            maximum-fraction-digits="2">
                                                         </lightning-formatted-number>
                                                    </td>                                        
                                                    <td class="slds-cell-wrap">
                                                        <div class="slds-align_absolute-center"> 
                                                            <a href={acc.amazonUrl} data-url={acc.amazonUrl}  
                                                                onclick={handleView}>
                                                                    <!-- <lightning-icon icon-name="utility:preview" size="small" title="View payslip"></lightning-icon> -->
                                                                     <i class="material-icons view-icon">visibility</i>
                                                            </a>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </template>
                                    </tbody>
                                </table>
                                </template>

                                <template if:true={noRecordsFlag}>
                                        <div class="no-data">
                                            <p>No records found</p>
                                        </div>
                                </template>

                                <!--Pagination Start-->
                                <template if:false={noRecordsFlag}>
                                <template if:true={paginationVisible}>
                                 <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread " style="padding-top: 0.5em;width:95%;margin-left:2%">
                                    <!--RECORDS PER PAGE-->
                                    <div class="slds-col">
                                        <div class="slds-list_inline slds-p-bottom_xx-small">
                                            <span style="margin-top:5px;margin-left:10px;margin-right:5px;">Page Size:</span>
                                            <label class="slds-text-color_weak" for="payslipsRecordsPerPage"></label>
                                            <div class="slds-select_container">
                                                <select class="slds-select" id="payslipsRecordsPerPage" onchange={handleRecordsPerPage}>
                                                    <template for:each={pageSizeOptions} for:item="option">
                                                        <option key={option} value={option}>{option}</option>
                                                    </template> 
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <!--PAGE NAVIGATION-->
                                    <div class="slds-align_absolute-center" style="height:5rem">
                                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage} ></lightning-button>
                                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                                        &nbsp;
                                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                                        &nbsp;
                                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                                    </div>
                                    <!--TOTAL RECORDS-->
                                    <div class="slds-clearfix">
                                        <div class="slds-float_right" style="margin-right:10px;">
                                            <span class="slds-badge"> Total Records: {totalRecords}</span>
                                        </div>
                                    </div>
                                 </div>
                                </template>
                                </template>
                    
                        


                    </div>
                </template>
            </div>

            <div class="container-box">
                <div class="toggle-bar" onclick={handleSectionToggle} data-id="TimesheetReport">
                    <span>Timesheet Report</span>
                    <span  style="cursor: default;">{sectionIcons.TimesheetReport}</span>
                </div>
                <template if:true={sectionFlags.TimesheetReport}>
                    <div class="slds-grid slds-wrap slds-grid_align-center" style="padding: 20px 0px 20px 0px;">
                        
                        <div class="slds-grid slds-gutters slds-wrap" style="width: 99%; margin-left: 0.5%; align-items: center;">
    
                            <!-- Start Date Input -->
                            <div class="slds-col slds-size_1-of-4">
                                <div class="floating-label">
                                    <span class="label-text-drop">Start Date</span>
                                    <lightning-input 
                                        type="date" 
                                        name="StartDateInputValue"  
                                        value={startDateValue}  
                                        onchange={handleDatesChanges}
                                        variant="label-hidden">
                                    </lightning-input>
                                </div>
                            </div>
                        
                            <!-- End Date Input -->
                            <div class="slds-col slds-size_1-of-4">
                                <div class="floating-label">
                                    <span class="label-text-drop">End Date</span>
                                    <lightning-input 
                                        type="date" 
                                        name="EndDateInputValue"  
                                        value={endDateValue} 
                                        onchange={handleDatesChanges}
                                        variant="label-hidden">
                                    </lightning-input>
                                </div>
                            </div>
                        
                            <!-- Push Export Button to the Right -->
                            <div class="slds-col slds-size_1-of-2 slds-grid slds-grid_align-end">
                                <lightning-button 
                                    label="Export Timesheet Report" 
                                    variant="brand" 
                                    onclick={handleTimesheetReportCSV} 
                                    style="margin-top: 8px;">
                                </lightning-button>
                            </div>
                        
                        </div>
                        
                        
                            <!-- <div class="slds-grid" style="width:99%;margin-left:15px;">
                                <lightning-input type="date" name="StartDateInputValue"  value={startDateValue} label="Start Date"  onchange={handleDatesChanges} ></lightning-input> &emsp;&emsp;&emsp;
                                <lightning-input type="date" name="EndDateInputValue"  value={endDateValue} label="End Date"  onchange={handleDatesChanges} ></lightning-input>
                                <lightning-button class="slds-m-left_medium" label="Export Timesheet Report" variant="brand"
                                onclick={handleTimesheetReportCSV} style="float:right;margin-top:25px;"></lightning-button>                    
                            </div> -->
                            <template if:false={noRecordsFlag1}>
                            <div style="margin-top: 25px;">
                                
                                <table class="slds-table" style="table-layout: fixed;">
                                    <thead>
                                        <tr>
                                            <th class="slds-cell-wrap th">Start Date</th>
                                            <th class="slds-cell-wrap th">End Date</th>
                                            <th class="slds-cell-wrap th">Approved by</th>
                                            <th class="slds-cell-wrap th">Status</th>
                                            <th class="slds-cell-wrap th">Hours</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={weeklySummaries} for:item="row">
                                            <tr key={row.id} class="tr1">
                                                <!-- <td>{row.client}</td> -->
                                                <td class="slds-cell-wrap">{row.startDate}</td>
                                                <td class="slds-cell-wrap">{row.endDate}</td>
                                                <td class="slds-cell-wrap">{row.approvers}</td>
                                                <td class="slds-cell-wrap">{row.statuses}</td>
                                                <td class="slds-cell-wrap" style="text-align: right;">{row.totalHours}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                
                                
                            </div>
                            <div class="slds-col" style="margin-top: 10px; margin-left: auto; text-align: right;">
                                <strong>Total hours: </strong><b>{ictApprovedHours}</b>
                            </div>
                            </template>
                            <template if:true={noRecordsFlag1}>
                                        <div class="no-data">
                                            <p>No records found</p>
                                        </div>
                            </template>
                            <!--Pagination Start-->
                             <template if:false={noRecordsFlag1}>
                            <template if:true={paginationVisible1}>
                             <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread " style="padding-top: 0.5em;width:95%;margin-left:2%">
                                <!-- RECORDS PER PAGE -->
                                <div class="slds-col">
                                    <div class="slds-list_inline ">
                                        <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                                        <label class="slds-text-color_weak" for="timesheetRecordsPerPage"></label><!--slds-p-horizontal_x-small-->
                                        <div class="slds-select_container">
                                            <select class="slds-select"  onchange={handleRecordsPerPage1}>
                                                <template for:each={pageSizeOptions1} for:item="option">
                                                    <option key={option} value={option}>{option}</option>
                                                </template> 
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <!-- PAGE NAVIGATION -->
                                <div class="slds-align_absolute-center" style="height:5rem;">
                                    <lightning-button disabled={bDisableFirst1} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage1} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                                    <lightning-button disabled={bDisableFirst1} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage1} style="margin-right:5px;"></lightning-button>
                                    &nbsp;
                                    <span class="slds-badge">Showing {pageNumber1} &nbsp;of&nbsp; {totalPages1} &nbsp;&nbsp;Page(s)</span>
                                    &nbsp;
                                    <lightning-button disabled={bDisableLast1} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage1} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                    <lightning-button disabled={bDisableLast1} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage1} icon-position="right"></lightning-button>
                                </div>
                                <!-- TOTAL RECORDS -->
                                <div class="slds-clearfix">
                                    <div class="slds-float_right">
                                        <span class="slds-badge"> Total Records: {totalRecords1}</span>
                                    </div>
                                </div>
                             </div>
                            </template>
                            </template>
                            
            
                
                    


                </div>
            </template>
        </div>

        </lightning-accordion>



         

                     
     </template>
      <template if:true={isModalOpen}>
        <div class="slds-grid slds-grid_align-end">
            <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
            onclick={closeviewfile} style="margin-right:1%;margin-top: 1%;margin-bottom:0.5%;"></lightning-button>
        </div>
         <div class="main-container-iframe custom-scroll">
          <iframe src={currentUrl} width="100%" height="1300px" ></iframe>
          </div>
          
</template>
      </div>  
   
   <!--  </div> -->
</template>
