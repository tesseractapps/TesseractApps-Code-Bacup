<template>
  <template if:true={showConfirm}>
    <div class="upload-confirm slds-m-top_small slds-p-around_small slds-box">

      <!-- Files list (single-row layout per file) -->
<template if:true={files.length}>
  <div class="slds-col slds-size_1-of-1 slds-m-top_medium">
    <template for:each={files} for:item="f">
      <div key={f.fileId} class="row row-inline">
        <!-- Name -->
        <div class="cell name" title={f.file.name}>
          {f.file.name} <span class="muted">({f.humanSize})</span>
        </div>

        <!-- Progress bar -->
        <div class="cell bar">
          <lightning-progress-bar value={f.progress} variant="base"></lightning-progress-bar>
        </div>

        <!-- % -->
        <div class="cell percent">{f.progress}%</div>

        <!-- Status -->
        <div class="cell status-text">{f.status}</div>

        <!-- Delete (custom button with Material icon) -->
        <div class="cell actions">
          <button
            class="icon-btn delete"
            title="Delete"
            onclick={deleteOne}
            data-fileid={f.fileId}
            disabled={f.deleteDisabled}
            aria-disabled={f.deleteDisabled}>
            <span class="mi" aria-hidden="true">delete</span>
          </button>

          <!-- Inline deleting ring (optional) -->
          <template if:true={f.deleting}>
            <lightning-progress-ring value={f.deleteProgress} size="x-small" class="ring-inline"></lightning-progress-ring>
          </template>
        </div>
      </div>
    </template>
  </div>
</template>

<!-- Centered Upload / Cancel -->
<template if:true={pendingMode}>
  <div class="slds-m-top_small btn-row btn-row--center">
    <button
      type="button"
      class="btn btn-primary"
      onclick={confirmClick}
      disabled={confirmDisabled}
      aria-disabled={confirmDisabled}>
      <span class="mi" aria-hidden="true">cloud_upload</span>
      <span>Upload</span>
    </button>

    <button
      type="button"
      class="btn btn-neutral slds-m-left_x-small"
      onclick={cancelClick}
      disabled={isUploading}
      aria-disabled={isUploading}>
      <span class="mi" aria-hidden="true">close</span>
      <span>Cancel</span>
    </button>
  </div>
</template>


    </div>
  </template>
</template>
