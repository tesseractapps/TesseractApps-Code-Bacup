  <template if:true={releaseNotes}>

      <div
        class="slds-modal__container"

        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="
              color: white;
              font-weight: bold;
              text-align: center;
              padding: 2%;
            "
          >
            Upgraded Features
          </h2>
        </header>
        <div style="background-color: white">
          <div
            class="slds-modal__content custom-scroll"
            style="padding: 3%; height: 77vh"
          >
            <div class="slds-m-around_small center-container-pop">
              <div class="slds-modal__content slds-p-around_medium">
                <h2 class="slds-text-heading_medium">What's New?</h2>
                <br />
                <h2><strong>v1.28.0</strong></h2>
                <ul class="slds-list_dotted slds-m-top_large" style="list-style: disc; padding-left: 1.25rem;">                
                  <li>Bulk Upload Enhancements: Implemented Staff, Participant and Facility bulk uploads.</li>
                  <li>Staff Documentation: Now the Admin has the feasibility to either approve or reject the documents uploaded by Staff which can improve the documentation.</li>
                  <li>Participant Nickname Feature and Notifications: Admins can assign a nickname to each participant for quick and intuitive identification across the platform and notified when a service is created or updated or when a staff is assigned.</li>
                  <li>Chat: The web and platform now includes real-time messaging authenticated via CometChat, enhancing team communication.</li>
                  <li>MYOB Integration: New improvements streamline synchronisation between the platform and MYOB, ensuring accurate financial and payroll data.</li>
                  <li>Repository – Documents Enhancements: Improved the documents repository structure, making organisation, retrieval, and versioning more efficient.</li>
                  <li>Login Page Upgrade: Introduced a modern UI with improved accessibility and performance for login.</li>
                  <li>Fund Tracker - Entity Name Update: Implemented a complete solution to address incorrect approved dates and entity naming issues within the fund tracker.</li>
                  <li>Facility - Documentation: Four new tabs—Documents, Identity, Trainings, and Shift Compliance have been added under Facility Documentation, allowing all related documents and identity details to be configured in one place.</li>
                  <li>Cancel Shift and Fortnight View: In the Roster Manager the admins can cancel a shift and also can view the calendar fortnightly.</li>
                  <li>Accounting: Enhancements include editable shift hours/wages before STP submission, improved payslip visibility rules, editable NDIS invoices, global invoice search, email-confirmation prompts, credit-note handling, purchase attachments, refined entity creation, CC email support, CSV exports, drill-down editing in Profit & Loss and new cash-transaction capability.</li>
                </ul><br/>

                <h2><strong>v1.27.0</strong></h2>
                <ul class="slds-list_dotted slds-m-top_large" style="list-style: disc; padding-left: 1.25rem;">                
                  <li>Participant Login – Participants can now log in to the application and access multiple modules seamlessly.</li>
                  <li>T-Sign Enhancement – Added an ABN field to the T-Sign form.</li>
                  <li>Rejected Shifts – Shifts starting within the next 24 hours can no longer be rejected.</li>
                  <li>Public Holidays – Updated with the latest public holiday data.</li>
                  <li>Mobile: Shift Card – Participant name is now displayed on the Shift Card.</li>
                  <li>Mobile: Calendar View – Shift-related data is now displayed directly in the Calendar.</li>
                  <li>Mobile: My Roster – Added Day and Week views for shifts.</li>
                  <li>Mobile: Geolocation & Notifications – Implemented forced sign-in geolocation and notification permissions.</li>
                  <li>Facility Management – Each facility can now create its own custom roles.</li>
                  <li>Childcare Pay Guides – Updated pay guides are now available within the application.</li>
                  <li>Roster Manager – Added an ‘All’ option to view all staff at once.</li>
                  <li>Manage Forms – Introduced a ‘Submitted Forms’ tab where users can view all submitted forms.</li>
                  <li>Keyboard Shortcuts – Added keyboard shortcuts for navigation and common actions.</li>
                  <li>Global Search (Admin Module) – Implemented a global search function in the Admin module.</li>
                  <li>Early Sign-Out Notification – Admins will now receive notifications when staff sign out early.</li>
                  <li>Request Sign-In Enhancements – Added two new fields displaying staff location status and distance from site.</li>
                  <li>Payslip Revamp – Payslips are now broken down into M (Morning), A (Afternoon), N (Night), S (Sleepover) categories and Leave summary. Improved rendering of Pay Points in staff payslips. Added disclaimers for paid breaks in invoices and payslips.</li>
                  <li>T-Sign Document Limit – Implemented a limit for Word document uploads in T-Sign.</li>
                  <li>Mobile: Pagination – Pagination added across multiple mobile sections for better performance.</li>
                  <li>Preferred Staff Matching – Staff preferences now support filtering by Gender, Language, and Nationality.</li>
                  <li>Xero Integration – Full Xero integration for invoice and payroll synchronisation.</li>
                  <li>Participant Bulk Upload – Users can now upload participant data in bulk.</li>
                  <li>Journal Module – Introduced a new journal flow with history tracking.</li>
                  <li>Funds Tracker Enhancements – Revamped UI with improved period management.</li>                                  
                </ul><br/>
                
                <h2><strong>v1.26.0</strong></h2>
                <ul class="slds-list_dotted slds-m-top_large" style="list-style: disc; padding-left: 1.25rem;">                
                    <li>Welcome Emails and Reset Password Links: Implemented a new, modern email format for welcome messages and password reset links to enhance readability and branding consistency.</li>
                    <li>Mobile - Show Participant Name in Shift Card: Updated sthe mobile view to display the participant’s name within each shift card for better context and quick identification.</li>
                    <li>Dashboard - Roster Manager Widget Dropdown Option: Added a dropdown option in the Roster Manager widget on the dashboard to easily filter and manage roster data.</li>
                    <li>Onboarding: Improved the onboarding process with a more intuitive layout and streamlined user flow.</li>
                    <li>Increase Text area Limit to 1000: Extended the character limit for all text area fields across the application from default to 1000 characters.</li>
                    <li>Multiple Document Upload Across the Application: Introduced functionality to upload multiple documents simultaneously in various modules for improved efficiency.</li>
                    <li>Roster Manager Calendar - Dynamic Expansion of the View Based on the Shifts: Enhanced the calendar to automatically expand and adjust dynamically based on the number of shifts displayed.</li>
                    <li>Time picker Over All Application: Implemented a new, consistent time picker component across the entire application for better user experience and design uniformity.</li>
                    <li>Based on the Shift Start and End Times the Billable Hours Calculation: Billable hours are now automatically calculated and displayed based on the shift start and end times.</li>
                    <li>Max Duration of Shift in Roster Settings: Added a configuration option in Roster Settings to define the maximum allowable duration for any shift.</li>
                    <li>History for Every Change in IR + Export the Contents of the Table in IR + Signature: Added history tracking for all changes in Incident Reports, enabled export of the IR table contents, and introduced digital signature functionality.</li>
                    <li>Smart Roster - Participant & Staff View (UI): Redesigned the Smart Roster interface for both Participant and Staff views to offer a cleaner, more intuitive experience.</li>
                    <li>Editing Payrates for In Progress/Completed Shifts - Sleepover Shift: Enabled the ability to edit payrates for In Progress and Completed sleepover shifts.</li>
                    <li>Editing Payrates in Timesheet - Sleepover Shift: Added functionality to edit payrates in timesheets specifically for sleepover shifts.</li>
                    <li>Adding Services for In Progress/Completed Shifts: Implemented the ability to add services to in-progress and completed.</li>
                    <li>Simplify Participant View by Adding Accordions in Personal Tab and Removing Extra Tabs: Simplified the participant view by converting sections in the Personal tab into collapsible accordions and removing unnecessary tabs.</li>
                    <li>Manage Invoices - Mail Implementation: Introduced email functionality in the Manage Invoices module to send invoices directly to recipients from the system.</li>
                    <li>Reimbursements: Manages both shift and reimbursement invoices, tracks invoice statuses, supports bulk actions, and ensures complete audit trails and compliance.</li>
                    <li>Manage Invoices: Added a yearly date picker for easier navigation and filtering by year. Introduced new tabs Cancelled and Total Value, and added a Reimbursements column under both Pending and Total Value tabs.</li>
                    <li>Funds Tracker: Implemented Shift name and Entity Name dropdowns in Add New Fund slide and Miscellaneous values in service type dropdown.</li>
                    <li>Timesheets - Feasibility for staff Break in and breakout option: Implemented feasibility for staff to record Break In and Break Out times within timesheets, allowing accurate tracking of break durations and improved payroll calculations.</li>
                    <li>Mobile – Break In and Break Out in Sign in Module: Added Break In and Break Out options in the mobile sign-in module to enable staff to accurately record break durations during their shifts.</li>
                    <li>Mobile – Participant Name in Shift Card: Updated the mobile view to display the Participant Name within each shift card for better visibility and quick identification.</li>
                    <li>Funds Tracker – Nursing Enhancements: Enhanced the Funds Tracker to allow adding multiple catalogue items, updating rates, and renaming items, improving flexibility and ease of use for nursing services.</li>
                    <li>Navigations: Implemented a new navigation feature allowing users to return to the previous window when they have navigated to the last page, improving workflow and ease of use.</li>                
                </ul><br/>

                <h2><strong>v1.25.0</strong></h2>
                  <ul class="slds-list_dotted slds-m-top_large" style="list-style: disc; padding-left: 1.25rem;">                
                      <li>Immediate Email Notifications: User creation and password reset emails are now sent instantly upon action.</li>
                      <li>Forgot Password Link: A "Forgot Password" option is now available on the login page for easier password recovery.</li>
                      <li>Custom Shift Rates: Roster Manager now supports custom shift rates, allowing greater flexibility in shift planning.</li>
                      <li>Real-Time Shift Reallocation: Introduced real-time shift reallocation for faster and more efficient scheduling adjustments.</li>
                      <li>Shift Names and Timings Display: Shift names and timings configured in Roster Settings are now shown in both Participant Schedule and Participant Availability views.</li>
                      <li>Support for Custom Shift Names (Mobile): Mobile app now displays custom shift names aligned with facility-specific settings.</li>
                      <li>"Sign Out" Checkbox (Web): A checkbox for "Sign Out" has been added to the web platform for a more streamlined sign out process.</li>
                      <li>Request Sign-Out Feature: A new "Request Sign Out" option is now available within the Sign In workflow for better tracking and control.</li>
                      <li>Email Notifications for Sign-In/Out: Email alerts are now automatically sent upon both Sign In and Sign Out requests to keep stakeholders informed.</li>
                      <li>Enhanced Search in 100 Points of ID: Improved search functionality for easier access to ID records.</li>
                      <li>UI Enhancements: "My Profile > My Availability" and "Participant Schedule" sections have been visually upgraded for a more user-friendly experience.</li>
                      <li>Preferred Names Display: Preferred names for Facilities and Participants are now displayed based on facility-specific preferences.</li>
                      <li>My Notifications: Users can now configure notification preferences for better communication and control.</li>
                      <li>"My Notifications" Section (Mobile): A dedicated "My Notifications" tab is now available in the mobile app for easier access to alerts and updates.</li>
                      <li>Smart Forms: Users can now complete Smart Forms directly from web and mobile devices, improving accessibility and efficiency.</li>
                      <li>Shift Names: Shift names and timings configured in Roster Settings are now displayed in both Participant Schedule and Participant Availability views.</li>                
                  </ul><br/>
                <h2><strong>v1.24.0</strong></h2>
                <ul

                  <li>

                <br />
                <h2><strong>v1.23.0</strong></h2>
                <ul

                  <li>

                                <li
          key={opt.value}
          class="slds-dropdown__item dropdown-option"
          data-field="notification"
          data-value={opt.value}
          data-label={opt.label}
          onclick={handleDropdownSelect}
          role="option"
        > 
            <div
              data-name={opt.label}
              data-id={opt.value}
              data-notificationread={opt.checknotifications}
              data-client-id={opt.clientId}
              onclick={handleNavigation}
              class="slds-truncate"
            >
              <div style="display: flex; justify-content: space-between;">
              <p style="font-weight: 500; font-size: 12px; color: #0099de">{opt.label}</p>
              <p class="slds-text-color_weak slds-text-body_small">
                {opt.timestamp}
              </p>
              </div>
              <p class="slds-text-body_small force-wrap">{opt.description}</p>
            </div>
            </li>
          </template>
        <!-- </li> -->
      </template>
    </ul>
  </div>
</template>
