<template>
    <div class="main-container">
        <div class="slds-grow slds-grid slds-grid_vertical" style="min-height: 0;">
            <header class="header">
                <div class="search-section">
                        <div class="floating-label">
                        <lightning-combobox class="wide-combobox" label="Role" variant="label-hidden" value={selectedRole} options={roleOptions} onchange={handlerolechange} required></lightning-combobox>
                    </div>
                </div>


            </header>

            <div class="content-wrapper slds-p-around_medium">
                <!-- Scrollable Table Section -->
                <div class="table-container custom-scroll">
                    <template if:false={noRecordsFlag}>
                    <table class="slds-table slds-table_cell-buffer fixed-table">
                        <thead>
                            <tr>

                                <th class="slds-text-align_left sortable-header"
                                    data-field="staffNickName"
                                    onclick={handleSort}>
                                    <div class="sort-header-inner">
                                        <span class="sort-label">{staffPreferredName} Name</span>
                                        <span class="sort-arrow" data-arrow={sortIcons.staffNickName}></span>
                                    </div>
                                </th>  
                                <th class="slds-text-align_left sortable-header"
                                    data-field="staffFacility"
                                    onclick={handleSort}>
                                    <div class="sort-header-inner">
                                        <span class="sort-label">{facilityPreferredName}</span>
                                        <span class="sort-arrow" data-arrow={sortIcons.staffFacility}></span>
                                    </div>
                                </th>
                                <th class="slds-text-align_left sortable-header"
                                    data-field="userType"
                                    onclick={handleSort}>
                                    <div class="sort-header-inner">
                                        <span class="sort-label">User Type</span>
                                        <span class="sort-arrow" data-arrow={sortIcons.userType}></span>
                                    </div>
                                </th>
                                <th class="slds-text-align_left sortable-header"
                                    data-field="userStatus"
                                    onclick={handleSort}>
                                    <div class="sort-header-inner">
                                        <span class="sort-label">Status</span>
                                        <span class="sort-arrow" data-arrow={sortIcons.userStatus}></span>
                                    </div>
                                </th>
                                <th class="slds-text-align_left sortable-header"
                                    data-field="staffActivatedDate"
                                    onclick={handleSort}>
                                    <div class="sort-header-inner">
                                        <span class="sort-label">Last Updated Date</span>
                                        <span class="sort-arrow" data-arrow={sortIcons.staffActivatedDate}></span>
                                    </div>
                                </th>
                                <th class="slds-text-align_left sortable-header"
                                    data-field="staffCreatedDate"
                                    onclick={handleSort}>
                                    <div class="sort-header-inner">
                                        <span class="sort-label">Created Date</span>
                                        <span class="sort-arrow" data-arrow={sortIcons.staffCreatedDate}></span>
                                    </div>
                                </th>

                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={paginatedData} for:item="user">
                                <tr key={user.userId} class="tr1">
                                    <td>{user.staffNickName}</td>                        
                                    <td>{user.staffFacility}</td>
                                    <td>{user.userType}</td>
                                    <td>
                                        <span class={user.statusClass}>
                                            {user.userStatus}
                                        </span>
                                    </td>
                                    <td>{user.staffActivatedDate}</td>
                                    <td>{user.staffCreatedDate}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    </template>
                     <template if:true={noRecordsFlag}>
                    <div class="no-data">
                        <p>No records found</p>
                    </div>
                  </template>
                </div>
            </div>
        </div>

        <!-- Pagination Section -->
        <template if:false={noRecordsFlag}>   
            <div class="pagination-container slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination">
                <div class="slds-list_inline">
                    <span style="margin-right: 5px; margin-top: 5px;">Page Size:</span>
                    <div class="slds-select_container">
                        <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                            <template for:each={pageSizeOptions} for:item="option">
                                <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="slds-align_absolute-center">
                    <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
                        class="slds-p-horizontal_x-small" alternative-text="first page"
                        onclick={firstPage}></lightning-button>
                    <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
                        alternative-text="Previous" onclick={previousPage}></lightning-button>
                    &nbsp;
                    <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                    &nbsp;
                    <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                        alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small"
                        icon-position="right"></lightning-button>
                    <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                        alternative-text="last page" onclick={lastPage}
                        icon-position="right"></lightning-button>
                </div>

                <div class="slds-clearfix">
                    <div class="slds-float_right">
                        <span class="slds-badge"> Total Records: {totalRecords}</span>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
