<template>

     <div class="main-container">
         <!-- Menu Container -->
         <div class="menu-container">
             <div class={MyPmsClass} onclick={handleMyPms}>Team Reviews</div>
             
           <!--   <div class={MyGoalsClass} onclick={handleMyGoals}>Development Goals</div> -->
            
             
         </div>
 <div class="major-cont custom-scroll">
             
    <!-- <template if:true={showDetails}>  -->
       <template if:true={MyPmsFlag}> 
    <div class="dashboard-container">

        <!-- HEADER -->
        <div class="header-section">
            <div>
                <h1 class="page-title">Manager Dashboard</h1>
                <p class="subtitle">
                    Review and evaluate your team members' performance
                </p>
            </div>

            <!-- SUMMARY CARDS -->
            <div class="summary-cards">
                <div class="summary-card blue">
                    <!-- <div>Total Team Members</div> -->
                      <div>Team Members</div>
                    <div class="count">{totalEmployees}</div>
                </div>

                <div class="summary-card light-blue">
                    <div>Pending Reviews</div>
                    <div class="count">{pendingCount}</div>
                </div>

                <div class="summary-card orange">
                    <!-- <div>Awaiting Employee</div> -->
                     <div>Awaiting</div>
                    <div class="count">{submittedCount}</div>
                </div>

                <div class="summary-card green">
                    <div>Completed</div>
                    <div class="count">{completedCount}</div>
                </div>
            </div>
        </div>

        <hr />
      <div class="tabs-container">
        <!-- TABS -->
        <div class="tabs">
            <span class={PendingClass}  data-tab="pending" onclick={handleTabChange}>Pending Reviews</span>
            <span class={CompletedClass} data-tab="completed" onclick={handleTabChange}>Completed Reviews</span>
            <span class={goalsClass} data-tab="goals" onclick={handleTabChange}>Development Goals</span>
        </div>
        <div class="back-btn">
        <lightning-button label="Back" onclick={handleback} variant="brand"></lightning-button>
        </div>
        </div>
        <!-- REVIEW LIST -->
        <div class="review-list">

            <!-- CARD -->
             <template if:true={activeTabPending}>
                <template if:true={pendingReviews.length}>
                    <template for:each={pendingReviews} for:item="review">
                        <div key={review.id} class="review-card">

                            <div class="review-left">
                                <div class="name-row">
                                    <span class="employee-name">{review.staffName}</span>
                                    <span class={review.statusClass}>{review.Staffstatus}</span>
                                </div>

                                <div class="review-info">
                                    <span>{review.roleTitle} ( {review.cycle} )</span>
                                    <span>Email: <strong>{review.Email}</strong></span>
                                    <span>
                                        Employee Submitted: <strong>{review.staffSubmittedDate}</strong>
                                    </span>
                                </div>
                            </div>

                            <div class="review-right">
                                <!-- <button class={review.buttonClass} onclick={handleReview} data-staffid={review.staffId}>
                                    Start Review
                                </button> -->
                                   <lightning-button
                                        label="Start Review"
                                        variant="brand"
                                        data-staffid={review.staffId}
                                         data-type="pending"
                                        onclick={handleReview}>
                                        <!--  label={review.pendingReviewLabel}
                                            data-name={rec.employeeName}
                                        data-email={rec.email}
                                        data-role={rec.role}
                                        data-manager={rec.manager}
                                        data-hr={rec.hrContact}
                                        data-criteria={rec.criteria}
                                        data-reviewdate={rec.reviewDate}
                                        data-coachingcreatedtype={rec.coachingCreatedtype}
                                        data-profileurl={rec.staffProfileUrl}-->
                                    </lightning-button>
                            </div>

                        </div>
                    </template>
                </template>
                <template if:false={pendingReviews.length}>
                    <div class="no-data">
                        <p>No records found</p>
                    </div>
                </template>
            </template>

            <template if:true={activeTabCompleted}>
                <template if:true={completedReviews.length}>
                    <template for:each={completedReviews} for:item="review"> 
                        <div key={review.id} class="review-card">

                            <div class="review-left">
                                <div class="name-row">
                                    <span class="employee-name">{review.staffName}</span>
                                    <span class={review.statusClass}>{review.Staffstatus}</span>
                                </div>

                                <div class="review-info">
                                    <span>{review.roleTitle} ( {review.cycle} )</span>
                                    <span>Email: <strong>{review.Email}</strong></span>
                                    <span>
                                        Employee Submitted: <strong>{review.staffSubmittedDate}</strong>
                                    </span>
                                </div>
                            </div>

                            <div class="review-right">
                                <!-- <button class={review.buttonClass} onclick={handleReview} data-staffid={review.staffId}>
                                    View
                                </button> -->
                                  <lightning-button
                                        label="View"
                                        variant="brand"
                                        data-staffid={review.staffId}
                                        data-type="completed"
                                        onclick={handleReview}>
                                        <!--  label={review.pendingReviewLabel}
                                            data-name={rec.employeeName}
                                        data-email={rec.email}
                                        data-role={rec.role}
                                        data-manager={rec.manager}
                                        data-hr={rec.hrContact}
                                        data-criteria={rec.criteria}
                                        data-reviewdate={rec.reviewDate}
                                        data-coachingcreatedtype={rec.coachingCreatedtype}
                                        data-profileurl={rec.staffProfileUrl}-->
                                    </lightning-button>
                            </div>

                        </div>
                    </template>
                </template>
                 <template if:false={completedReviews.length}>
                    <div class="no-data">
                        <p>No records found</p>
                    </div>
                </template>
            </template>

            <template if:true={activeTabGoals}>
                 <template if:true={goalsList.length}>
                    <template for:each={goalsList} for:item="goal">

                        <div key={goal.goalId} class="goal-card">

                            <div class="goal-grid">

                                <div class="goal-col">
                                    <div>
                                        <strong>Employee</strong>
                                    </div>
                                    <div class="slds-text-color_weak">{goal.staffName}</div>
                                </div>

                                <div class="goal-col">
                                    <div>
                                        <strong>Goal</strong>
                                    </div>
                                    <div class="slds-text-color_weak">{goal.goalName}</div>
                                </div>

                                <div class="goal-col">
                                    <div>
                                        <strong>Type</strong>
                                    </div>
                                    <div class="slds-text-color_weak">{goal.goalType}</div>
                                </div>

                                <div class="goal-col">
                                    <div>
                                        <strong>Timeline</strong>
                                    </div>
                                    <div class="slds-text-color_weak">{goal.dateFormatted}</div>
                                </div>

                                <div class="goal-col">
                                    <div>
                                        <strong>Status</strong>
                                    </div>
                                    <div class="slds-text-color_weak">{goal.status}</div>
                                </div>

                                <div class="goal-action">
                                    <!-- <button class="view-btn"
                                        data-id={goal.goalId}
                                        onclick={handleGoalsView}>
                                        View
                                    </button> -->
                                    <lightning-button
                                        label="View"
                                        data-id={goal.goalId}
                                        variant="brand"
                                        onclick={handleGoalsView}>
                                    </lightning-button>
                                </div>

                            </div>

                        </div>

                    </template>
                 </template>
                 <template if:false={goalsList.length}>
                    <div class="no-data">
                        <p>No records found</p>
                    </div>
                </template>
            </template>

        </div>

    </div>
    </template>
    <template if:true={ReviewFlag}>
     <div class="review-container">

            <div class="header-left">
                <h2 class="staff-name">{SelectedStaff.staffName}</h2>
                <div class="sub-info">
                    {SelectedStaff.roleTitle} ( {SelectedStaff.cycle} )
                </div>
                <div class="sub-info">
                    Email : <strong>{SelectedStaff.Email}</strong>
                </div>
                <div class="sub-info">
                    Manager : <strong>managerName</strong>
                </div>
            </div>

            <div class="header-right">
                <lightning-button label="Back"></lightning-button>
            </div>
        </div> -->

        <div class="header">

    <div class="header-left">

        <!-- NAME -->
        <div class="staff-name">
            {SelectedStaff.staffName}
        </div>

        <!-- SECOND ROW -->
        <div class="header-details">

            <div class="role-cycle">
                {SelectedStaff.roleTitle}
                ( {SelectedStaff.cycle} )
            </div>

            <div class="email">
                Email: <strong>{SelectedStaff.Email}</strong>
            </div>

            <div class="manager">
                Manager: <strong>{SelectedStaff.managerName}</strong>
            </div>

        </div>

    </div>

    <div class="header-right">
        <lightning-button label="Back" onclick={handleMyPms}></lightning-button>
    </div>

</div>

        <!-- ================= TABS ================= -->

<div class="tabs-header">
        <div class="tabs">
    <span 
        class={kpiTabClass}
        data-tab="KPI"
        onclick={handleTabClick}>
       {SelectedStaff.kpiTabLabel}
    </span>

    <span 
        class={okrTabClass}
        data-tab="OKR"
        onclick={handleTabClick}>
       {SelectedStaff.okrTabLabel}
    </span>

    <span 
        class={compTabClass}
        data-tab="COMP"

    </span>
</div>
  <!-- <template if:true={showWorkflowHelp}>
        <lightning-helptext
            content={reviewWorkflowTooltip}>
        </lightning-helptext>
    </template> -->
    <template if:true={showWorkflowHelp}>
        <div class="tooltip-container">

        <lightning-icon
            icon-name="utility:info"
            size="x-small"
            alternative-text="Info"
            onmouseover={showTooltip}
            onmouseout={hideTooltip}>
        </lightning-icon>

        <template if:true={isVisible}>
            <div class="custom-tooltip">

                <div class="title">Review Workflow</div>

                <div class="subtitle3">
                    What happens after you submit this review
                </div>
                <br />
                
                <!-- <div>
                    <b>1. Submit for Discussion</b><br/>
                    &nbsp;&nbsp;&nbsp;&nbsp; Complete your ratings and click Submit below.
                </div>


                <div>
                    <b>2. Schedule Discussion Meeting</b><br/>

                </div>


                <div>

                <div>
                    <b>1. Submit for Discussion</b>
                    <div class="tooltip-text">
                        Complete your ratings and click Submit below.
                    </div>
                </div>

                <div>
                    <b>2. Schedule Discussion Meeting</b>
                    <div class="tooltip-text">
                        Meet with {SelectedStaff.staffName} to discuss performance,
                        listen to feedback, and agree on goals.
                    </div>
                </div>

                <div>
                    <b>3. Finalize for HR</b>
                    <div class="tooltip-text">
                        After the meeting, finalize the review and send it to HR for approval.
                    </div>
                </div>

                <div>
                    <b>4. HR Final Review</b>
                    <div class="tooltip-text">
                        HR reviews and approves compensation decisions.
                    </div>
                </div>

    </div>
    </template>
</div>

        <!-- ================= KPI SECTION ================= -->
        <template if:true={isKPI}>
            <template if:true={SelectedStaff.kpis.length}>
                <template for:each={SelectedStaff.kpis} for:item="kpi">

                    <div key={kpi.Id} class="review-card2">

                        <!-- HEADER ROW -->
                        <div class="card-header">

                            <div class="title-section">
                                <div class="section-title">
                                    {kpi.Name}
                                    <span class="category-badge">
                                        {kpi.Category__c}
                                    </span>
                                </div>

                                <div class="subtitle">
                                {kpi.KPI_Description__c}
                                </div>
                            </div>

                            <div class="metrics">
                                <div>Target: <strong>{kpi.KPI_Target__c}%</strong></div>
                                <div>Weight: <strong>{kpi.KPI_Weight__c}%</strong></div>
                            </div>

                        </div>

                        <!-- BODY ROW -->
                        <div class="card-body">

                            <!-- LEFT -->
                            <div class="employee-box">

                                <div class="label">Employee Self - Rating</div>
                                <div class="rating-value">{kpi.rating}</div>

                                <div class="label">Comments & Achievements</div>
                                <div class="comment-box">{kpi.comment}</div>

                            </div>

                            <!-- RIGHT -->
                            <div class="manager-box">

                                <lightning-combobox
                                    label="Your Rating"
                                    data-id={kpi.Id}
                                    onchange={handleKpiRatingChange}
                                    value={kpi.ManagerRating}
                                    options={ratingOptions} disabled={SelectedStaff.isEditable}>
                                </lightning-combobox>

                                <lightning-textarea
                                    data-id={kpi.Id}
                                    label="Comments & Achievements"
                                    value={kpi.ManagerComment}
                                    onchange={handleKpiCommentChange} disabled={SelectedStaff.isEditable}>
                                </lightning-textarea>

                            </div>

                        </div>

                    </div>

                    

                </template>
            </template>
            <template if:false={SelectedStaff.kpis.length}>
                <div class="no-data">
                    <p>No records found</p>
                </div>
            </template>
        </template>

       <template if:true={isOKR}>
            <template if:true={SelectedStaff.okrs.length}>
                <template for:each={SelectedStaff.okrs} for:item="okr">

                    <div key={okr.Id} class="review-card2">

                        <!-- HEADER -->
                        <div class="card-header">

                            <div class="title-section">
                                <div class="section-title">
                                    {okr.OKR_Objective__c}
                                </div>

                                <div class="subtitle">
                                    {okr.OKR_Description__c}
                                </div>
                            </div>

                            <div class="metrics">
                                <div>Weight: <strong>{okr.OKR_Weight__c}%</strong></div>
                            </div>

                        </div>

                        <!-- BODY -->
                        <div class="card-body">

                            <!-- LEFT -->
                            <div class="employee-box">
                                <div class="label">Employee Self - Rating</div>
                                <div class="rating-value">{okr.rating}</div>

                                <div class="label">Comments & Achievements</div>
                                <div class="comment-box">{okr.comment}</div>
                            </div>

                            <!-- RIGHT -->
                            <div class="manager-box">
                                <lightning-combobox
                                data-id={okr.Id}
                                    label="Your Rating"
                                    value={okr.ManagerRating}
                                    options={ratingOptions}  onchange={handleOkrRatingChange} disabled={SelectedStaff.isEditable}>
                                </lightning-combobox>

                                <lightning-textarea
                                data-id={okr.Id}
                                    label="Comments & Achievements"
                                    value={okr.ManagerComment}  onchange={handleOkrCommentChange} disabled={SelectedStaff.isEditable}>
                                </lightning-textarea>
                            </div>

                        </div>

                    </div>

                </template>
            </template>
            <template if:false={SelectedStaff.okrs.length}>
                <div class="no-data">
                    No Records Found
                </div>
            </template>
        </template>

      <template if:true={isCompetency}>
        <template if:true={SelectedStaff.competencies.length}>
            <template for:each={SelectedStaff.competencies} for:item="comp">
                <div key={comp.Id} class="review-card2">

                    <!-- HEADER -->
                    <div class="card-header">

                        <div class="title-section">
                            <div class="section-title">
                                {comp.Name}
                                <span class="category-badge">
                                    {comp.Competency_Category__c}
                                </span>
                            </div>

                            <div class="subtitle">
                                {comp.Competency_Description__c}
                            </div>
                        </div>

                        <div class="metrics">
                            <div>Weight: <strong>{comp.Competency_Weight__c}%</strong></div>
                        </div>

                    </div>

                    <!-- BODY -->
                    <div class="card-body">

                        <!-- LEFT -->
                        <div class="employee-box">
                            <div class="label">Employee Self - Rating</div>
                            <div class="rating-value">{comp.rating}</div>

                            <div class="label">Comments & Achievements</div>
                            <div class="comment-box">{comp.comment}</div>
                        </div>

                        <!-- RIGHT -->
                        <div class="manager-box">
                            <lightning-combobox
                                label="Your Rating"
                                data-id={comp.Id}
                                value={comp.ManagerRating}
                                options={ratingOptions} onchange={handleCompetencyRatingChange}>
                            </lightning-combobox>

                            <lightning-textarea
                                label="Comments & Achievements"
                                data-id={comp.Id}
                                value={comp.ManagerComment}  onchange={handleCompetencyCommentChange}>
                            </lightning-textarea>
                        </div>

                    </div>

                </div>
            </template>
            <template if:false={SelectedStaff.competencies.length}>

                <div class="no-data">
                    No Competency Records Found
                </div>

            </template>
        </template>

        <lightning-textarea
            label="Manager Comments"
             
             value={SelectedStaff.ManagerComments}
            onchange={handleManagerComment}>
        </lightning-textarea>

    <!-- </div> -->


        </template>


        <!-- ================= FOOTER ================= -->
        <div class="footer">

            <lightning-button
                label="Close" onclick={handleMyPms}>
            </lightning-button>

            <lightning-button
                label="Return for Revisions" onclick={handleReassign} disabled={SelectedStaff.isEditable}>
            </lightning-button>

            <lightning-button
                variant="brand"
                label="Submit Review" onclick={handleSubmit} disabled={SelectedStaff.isEditable}>
            </lightning-button>

        </div>

    </div>
   

</template>

       <template if:true={handleReturnRequestFlag}>
        <section
            aria-describedby="modal-content-id-1"
            aria-labelledby="modal-heading-01"
            aria-modal="true"
            class="slds-modal slds-fade-in-open"
            role="dialog"
            tabindex="-1"
        >
            <div class="slds-modal__container modal-container" style="max-width: 25%">
                <header class="slds-modal__header" style="background: #002a52">
                    <h2
                        class="slds-text-heading_medium  slds-hyphenate"
                        style="color: white; font-weight: bold; text-align: center; font-size: var(--lwc-fontSize7, 1.25rem) !important;"
                    >
                        Please Confirm
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium modal-content">
                    <div class="slds-m-around_small" style="text-align: center">
                        <div>
                            <h1>
                                The Employee will be able to revise the self-review, and you will be notified once it is resubmitted. <br />
                                Do you want to return this for edits?
                                
                            </h1>
                        </div>
                        <div class="button-container slds-m-top_medium">
                            <lightning-button
                                label="No"
                                variant="brand"
                                onclick={handleNoRequestChanges}
                                class="slds-m-around_small"
                            ></lightning-button>
                            <lightning-button
                                label="Yes"
                                variant="brand"
                                onclick={handleYesRequestChanges}
                                class="slds-m-around_small"
                            ></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>      
    <template if:true={isCreateGoal}>
       <c-tesseract-apps-pms-create-edit-goal-lwc staff-id={managerId} goal-id={selectedgoalId} is-manager={isManager} is-edit-goal={isEditGoal} onclosegoal={handleCloseGoal}></c-tesseract-apps-pms-create-edit-goal-lwc> <!-- staff-name={staffName} manager-name={managerName} -->
    </template>
</template>
