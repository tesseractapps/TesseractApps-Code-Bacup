<template>
    <div class="container-box1">
        <div class="slds-grid slds-wrap" >
            <h3 slot="title">
                <span style="font-size: 100%;font-weight:bold;  margin-left:20%;">Sales</span>
            </h3>
            <div style="margin-left: 50%;">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Months</span>
                    <lightning-combobox label="month" variant="label-hidden" name="selectedMonth" 
                        value={selectedMonth} options={monthOptions} onchange={handleChangeMonth} 
                        data-field="selectedMonth" required>
                    </lightning-combobox>
                </div>
            </div>
        </div>
        <canvas width="516" height="300" lwc:dom="manual" class="chart" data-id="pieChart"></canvas>
</div>
</template>
