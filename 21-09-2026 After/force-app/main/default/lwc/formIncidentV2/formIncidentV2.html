<div class="menu-header-flex">
                <!-- Left Side - Tabs -->

        </template>
        <template if:true={showIncidents}>

                        class="search-input-field"
                        placeholder="Search Incidents"

                    <!-- <div class="search-arrow-btn">
                        <span>&rarr;</span>
                    </div> -->
                </div>

                <!-- KPI Pills -->
                <div class="kpi-pills-container">

                        <span class="kpi-count">{overdueCount}</span>
                        <span class="kpi-label">Overdue</span>
                    </div>

                    <div class={incidentKPIOpenClass} onclick={handleIncidentKPIClick} data-filter="Open">
                        <span class="kpi-count">{openCount}</span>
                        <span class="kpi-label">Open</span>
                    </div>
                    <div class={incidentKPIReportableClass} onclick={handleIncidentKPIClick} data-filter="Reportable">
                        <span class="kpi-count">{reportableCount}</span>
                        <span class="kpi-label">Reportable</span>
                    </div>
                    <div class={incidentKPIOverdueClass} onclick={handleIncidentKPIClick} data-filter="Overdue">
                        <span class="kpi-count">{overdueCount}</span>
                        <span class="kpi-label">Overdue</span>
                    </div>
                    <div class={incidentKPIProgressClass} onclick={handleIncidentKPIClick} data-filter="In Progress">
                        <span class="kpi-count">{inProgressCount}</span>
                        <span class="kpi-label">In progress</span>
                    </div>
                    <div class={incidentKPIResolvedClass} onclick={handleIncidentKPIClick} data-filter="Resolved">
                        <span class="kpi-count">{resolvedCount}</span>
                        <span class="kpi-label">Resolved</span>

        <template if:false={hasFormResponses}>
          <p class="no-records">No records found</p>

        <template if:true={hasFormResponses}>
          <div class="search-and-table table-wrapper-flex">
          <div class="table-container incidentTable">
            <div class="header-wrapper">
              <table class="staff-table">

              <thead>
                <tr>
                  <!-- 1. Incident No. -->
                  <th class="table-th sortable-header" data-field="Incident_UID__c" onclick={handleSort} title="Incident No.">
                    <div class="sort-header-inner">
                      <span class="sort-label">Incident No.</span>
                      <span class="sort-arrow" data-arrow={sortIcons.Incident_UID__c}></span>
                    </div>
                  </th>
                  <!-- 2. Participant -->
                  <th class="table-th sortable-header" data-field="participantName" onclick={handleSort} title="Participant">
                    <div class="sort-header-inner">
                      <span class="sort-label">Participant</span>
                      <span class="sort-arrow" data-arrow={sortIcons.participantName}></span>
                    </div>
                  </th>
                  <!-- 3. Incident Type -->
                  <th class="table-th sortable-header" data-field="Name__c" onclick={handleSort} title="Incident Type">
                    <div class="sort-header-inner">
                      <span class="sort-label">Incident Type</span>
                      <span class="sort-arrow" data-arrow={sortIcons.Name__c}></span>
                    </div>
                  </th>
                  <!-- 4. Priority -->
                  <th class="table-th sortable-header" data-field="severity" onclick={handleSort} title="Priority">
                    <div class="sort-header-inner">
                      <span class="sort-label">Priority</span>
                      <span class="sort-arrow" data-arrow={sortIcons.severity}></span>
                    </div>
                  </th>
                  <!-- 5. NDIS Reportable -->
                  <th class="table-th sortable-header" data-field="ndisReportable" onclick={handleSort} title="NDIS Reportable">
                    <div class="sort-header-inner">
                      <span class="sort-label slds-truncate">NDIS Reportable</span>
                      <span class="sort-arrow" data-arrow={sortIcons.ndisReportable}></span>
                    </div>
                  </th>
                  <!-- 6. Reported By -->
                  <th class="table-th sortable-header" data-field="SubmittedBy" onclick={handleSort} title="Reported By">
                    <div class="sort-header-inner">
                      <span class="sort-label">Reported By</span>
                      <span class="sort-arrow" data-arrow={sortIcons.SubmittedBy}></span>
                    </div>
                  </th>
                  <!-- 7. Reported On -->
                  <th class="table-th sortable-header" data-field="FormattedDate" onclick={handleSort} title="Reported On">
                    <div class="sort-header-inner">
                      <span class="sort-label">Reported On</span>
                      <span class="sort-arrow" data-arrow={sortIcons.FormattedDate}></span>
                    </div>
                  </th>
                  <!-- 8. Status -->
                  <th class="table-th sortable-header" data-field="Status__c" onclick={handleSort} title="Status">
                    <div class="sort-header-inner">
                      <span class="sort-label">Status</span>
                      <span class="sort-arrow" data-arrow={sortIcons.Status__c}></span>
                    </div>
                  </th>
                  <!-- 9. Assigned To -->
                  <th class="table-th sortable-header" data-field="AssignedStaffName" onclick={handleSort} title="Assigned To">
                    <div class="sort-header-inner">
                      <span class="sort-label">Assigned To</span>
                      <span class="sort-arrow" data-arrow={sortIcons.AssignedStaffName}></span>
                    </div>
                  </th>
                  <!-- 10. Actions -->
                  <th class="table-th center action-column" title="Actions">Actions</th>
                </tr>
              </thead>
              </table>
            </div>

            <div class="body-scroll custom-scroll incidentTableHeight">
            <table class="staff-table">
              <tbody>
                <template for:each={paginatedFormResponses} for:item="response">
                  <tr key={response.Id} class="table-row">
                    <!-- 1. Incident No. -->
                    <td class="table-td" title={response.Name}>
                      <div class="incident-name-wrapper">
                        <a
                          href="javascript:void(0);"
                          onclick={handleFormHistoryClick}
                          data-id={response.Id}
                          data-uid={response.Incident_UID__c}
                          style="
                            color: #0070d2;
                            text-decoration: underline;
                            cursor: pointer;
                            font-weight: 600;
                          "
                        >
                          {response.Name}
                        </a>
                        <template if:true={response.showUnreadDot}>
                          <div class="new-badge">New</div>
                        </template>
                      </div>
                    </td>

                    <!-- 2. Participant -->
                   <td class="table-td" title={response.participantName}>
                        <!-- <div class="participant-cell">

                            <template if:true={response.participantPhoto}>
                                <img
                                    src={response.participantPhoto}
                                    class="participant-avatar"
                                    alt={response.participantName}/>
                            </template>

                            <template if:false={response.participantPhoto}>
                                <div
                                    class="participant-avatar initials-avatar"
                                    style={response.participantAvatarStyle}>
                                    {response.participantInitials}
                                </div>
                            </template>

                            <span class="participant-name">
                                {response.participantName}
                            </span>

                        </div> -->
                        {response.participantName}
                    </td>

                    <!-- 3. Incident Type -->
                    <td class="table-td" title={response.Name__c}>{response.Name__c}</td>

                    <!-- 4. Priority -->
                    <td class="table-td" title={response.severity}>
                      <span class={response.priorityClass}>{response.severity}</span>
                    </td>

                    <!-- 5. NDIS Reportable -->
                    <td class="table-td" title={response.ndisReportable}>
                      <span class={response.ndisClass}>{response.ndisReportable}</span>
                    </td>

                    <!-- 6. Reported By -->
                    <td class="table-td" title={response.SubmittedBy}>
                        <!-- <div class="participant-cell">

                            <div
                                class="participant-avatar initials-avatar"
                                style={response.reportedByAvatarStyle}>
                                {response.reportedByInitials}
                            </div>

                            <span class="participant-name">
                                {response.SubmittedBy}
                            </span>

                        </div> -->
                        {response.SubmittedBy}
                    </td>

                    <!-- 7. Reported On -->
                    <td class="table-td" title={response.FormattedDate}>{response.FormattedDate}</td>

                    <!-- 8. Status -->
                    <td class="table-td" title={response.Status__c}>
                      <span class={response.statusClass} data-status={response.Status__c}>
                        {response.Status__c}
                      </span>
                    </td>

                    <!-- 9. Assigned To -->
                   <td class="table-td" title={response.AssignedStaffName}>
                      <!-- <div class="participant-cell">

                          <template if:true={response.assignedStaffPhoto}>
                              <img
                                  src={response.assignedStaffPhoto}
                                  class="participant-avatar"
                                  alt={response.AssignedStaffName}/>
                          </template>

                          <template if:false={response.assignedStaffPhoto}>
                              <div
                                  class="participant-avatar initials-avatar"
                                  style={response.assignedStaffAvatarStyle}>
                                  {response.assignedStaffInitials}
                              </div>
                          </template>

                          <span class="participant-name">
                              {response.AssignedStaffName}
                          </span>

                      </div> -->
                       {response.AssignedStaffName}
                  </td>

                    <!-- 10. Actions -->
                    <td class="table-td center action-column" title="Actions">
                      <div class="action-icons">
                          <a href="javascript:void(0);"
                              data-id={response.Id}
                              data-uid={response.Incident_UID__c}
                              onclick={handleView}
                              title="View">
                              <i class="material-icons view-icon" data-id={response.Id}>visibility</i>
                          </a>
                            &nbsp;
                          <template if:true={response.canEdit}>
                              <a href="javascript:void(0);"
                                  data-id={response.Id}
                                  data-uid={response.Incident_UID__c}
                                  onclick={handleEdit}
                                  title="Edit">
                                  <i class="material-icons view-icon" data-id={response.Id}>edit_document</i>
                              </a>
                          </template>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          </div>
          </div>

          <template if:true={showFormHistoryModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="history-modal-heading" class="slds-modal slds-fade-in-open">
              <div class="slds-modal__container incident-history-modal-container">
                <header class="slds-modal__header headercustom modal-header-custom">
                  <h2 id="history-modal-heading" class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom title-center">
                    Incident Edit History
                  </h2>
                  <button
                    class="slds-button slds-button_icon close-btn"
                    title="Close"
                    onclick={closeFormHistory}
                  >
                    <lightning-icon
                      icon-name="utility:close"
                      alternative-text="Close"
                      size="small"
                    ></lightning-icon>
                  </button>
                </header>

                <div class="slds-modal__content slds-p-around_medium custom-scroll incident-history-modal-content">
                  <div class="history-timeline">
                    <template for:each={groupedFormHistory} for:item="group">
                      <div key={group.date} class="history-date-section">
                        <div class="history-date-label">{group.date}</div>
                        <template for:each={group.entries} for:item="entry">
                          <div key={entry.timestamp} class="history-entry">
                            <div class="entry-time">{entry.time}</div>
                            <div class="entry-content">
                              <div class="entry-header">
                                <!-- <div class="avatar-circle">{entry.initials}</div> -->
                                <div class="entry-meta">
                                  <span class="entry-user">{entry.user}</span>
                                  <span class="entry-action">{entry.action}</span>
                                </div>
                              </div>
                              <div class="entry-body">{entry.content}</div>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>

                <footer class="slds-modal__footer slds-grid slds-grid_align-end">
                  <lightning-button
                    label="Close"
                    onclick={closeFormHistory}
                    variant="neutral"
                  >
                  </lightning-button>
                </footer>
              </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
          </template>

          <!-- Pagination Controls for Submitted Forms -->
          <template if:true={totalFormRecords}>
            <div
              class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread -left_xx-large fixed-pagination"
            >
              <!-- Left empty column (optional for spacing) -->
              <div class="slds-col slds-size_1-of-3">
                <div class="slds-list_inline slds-p-bottom_xx-small">
                  <label
                      class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center"
                      for="recordsPerPage"
                  >
                      Page Size:
                  </label>

                  <div class="slds-select_container">
                      <select
                            class="slds-select"
                            id="recordsPerPage"
                            value={formPageSize}
                            onchange={handleFormPageSizeChange}
                        >

                          <template for:each={pageSizeOptions} for:item="option">
                              <option key={option} value={option}>
                                  {option}
                              </option>
                          </template>
                      </select>
                  </div>
              </div>

              </div>

              


              <!-- Center: Pagination Buttons with spacing -->
              <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                <div class="slds-grid slds-gutters slds-align_absolute-center">
                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableFirstFormPage}
                    icon-name="utility:jump_to_left"
                    label="First"
                    onclick={firstFormPage}
                  >
                  </lightning-button>

                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableFirstFormPage}
                    icon-name="utility:chevronleft"
                    label="Previous"
                    onclick={previousFormPage}
                  >
                  </lightning-button>

                  <span class="slds-badge slds-m-horizontal_small">
                    Showing {formPageNumber} of {totalFormPages} Page(s)
                  </span>

                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableLastFormPage}
                    icon-name="utility:chevronright"
                    label="Next"
                    onclick={nextFormPage}
                  >
                  </lightning-button>

                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableLastFormPage}
                    icon-name="utility:jump_to_right"
                    label="Last"
                    onclick={lastFormPage}
                  >
                  </lightning-button>
                </div>
              </div>

              <!-- Right: Total Records Count -->
              <div class="slds-col slds-size_1-of-3 slds-text-align_right">
                <span class="slds-badge"
                  >Total Incidents: {totalFormRecords}</span
                >
              </div>
            </div>
          </template>

          
        </template>
      </template>

          <div class="search-and-table">
            <div class="search-kpi-row bottom_medium">

                <div class="custom-search-box">
                    <input
                        type="text"
                        class="search-input-field"
                        placeholder="Search Actions"
                        value={actionSearchKey}
                        oninput={handleActionSearchInput}
                    />
                    <div class="search-arrow-btn" onclick={handleActionSearchClick}>
                        <span>&rarr;</span>
                    </div>
                </div>

                <!-- KPI Pills -->
                <div class="kpi-pills-container">
                    <div class={actionKPICompletedClass} onclick={handleActionKPIClick} data-filter="Completed">
                        <span class="kpi-count">{actionKPICounts.Completed}</span>
                        <span class="kpi-label">Completed</span>
                    </div>
                    <div class={actionKPIOverdueClass} onclick={handleActionKPIClick} data-filter="Overdue">
                        <span class="kpi-count">{actionKPICounts.Overdue}</span>
                        <span class="kpi-label">Overdue</span>
                    </div>
                    <div class={actionKPIOpenClass} onclick={handleActionKPIClick} data-filter="Open">
                        <span class="kpi-count">{actionKPICounts.Open}</span>
                        <span class="kpi-label">Open</span>
                    </div>
                    <div class={actionKPIProgressClass} onclick={handleActionKPIClick} data-filter="In Progress">
                        <span class="kpi-count">{actionKPICounts.InProgress}</span>
                        <span class="kpi-label">In progress</span>
                    </div>
                    <div class={actionKPIDueWeekClass} onclick={handleActionKPIClick} data-filter="Due This Week">
                        <span class="kpi-count">{actionKPICounts.DueThisWeek}</span>
                        <span class="kpi-label">Due This Week</span>
                    </div>
                </div>

                <!-- Export Button -->
                <!-- <button class="custom-export-btn" onclick={handleActionExportCSV}>
                    <lightning-icon
                        icon-name="utility:download"
                        alternative-text="Export"
                        size="xx-small"
                        variant="inverse"
                        class="slds-m-right_xx-small"
                    ></lightning-icon>
                    Export
                </button> -->
                <lightning-button
                  label="Export"
                  icon-name="utility:download"
                  icon-position="left"
                  variant="brand"
                  class="custom-export-btn"
                  onclick={handleActionExportCSV}>
              </lightning-button>

                <!-- Total Records -->
                <div class="total-records-text">

                                        class="section-header"
                                        style={c.headerStyle}
                                      >
                                        {c.title}
                                      </div>
                                    </template>

                                    <!-- NON HEADER -->
                                    <template if:false={c.isSectionHeader}>

                                      <!-- CHECKBOX -->
                                      <template if:true={c.isCheckbox}>
                                    <span class="checkbox-icon">{c.checkboxIcon}</span>
                                  </template>

                                      <!-- FILE -->
                                      <template if:true={c.isUploadFile}>
                                        <template for:each={c.files} for:item="f">

                                            key={f.key}
                                            src={f.url}
                                            class="uploaded-image"
                                          />
                                        </template>
                                      </template>

                                      <!-- RICH TEXT -->
                                      <template if:true={c.isRichText}>
                                        <div
                                          class="rich-text-view"
                                          lwc:dom="manual"
                                          data-id={c.key}>
                                        </div>
                                      </template>

                                      <!-- SIGNATURE -->
                                      <template if:true={c.isSignature}>
                                        <img
                                          src={c.value}
                                          class="signature-view-img"
                                        />
                                      </template>

                                      <!-- RADIO -->
                                      <template if:true={c.isRadioButton}>
                                        <span class="value-text">
                                          {c.value}
                                        </span>
                                      </template>

                                      <!-- DEFAULT -->
                                      <template if:true={c.isRegularField}>
                                        <span class="value-text">
                                          {c.value}
                                        </span>
                                      </template>

                                    </template>

                                  </td>

                                              </template>

                                            </tr>

                                          </template>

                                        </tbody>

                                      </table>

                                    </div>

                                  </template>

                                  <!-- DEFAULT -->
                                  <template if:true={cell.isRegularField}>
                                    <span class="value-text">{cell.value}</span>
                                  </template>

                              </div>

                          </div>

                          </template>

                        </template>

                      </template>

                    </div>

                  </template>
                </template>

              </template>

            </div>
         
            </div>
          </div>
          </div>
        </template>

                <template if:true={totalRecords}>

                    <!-- Center: Pagination Buttons with spacing -->
                    <div
                      class="slds-col slds-size_1-of-3 slds-text-align_center"

                        <lightning-button

                        <span class="slds-badge slds-m-horizontal_small">

                        <lightning-button

                        <lightning-button
                          class="slds-m-horizontal_x-small"

                    <!-- Right: Total Records -->

                      class="slds-col slds-size_1-of-3 slds-text-align_right"

                      <span class="slds-badge"

                      >
                    </div>
                  </div>
                </template>

               
                <template if:true={isGrantAccessPopupOpen}>
                  <div class="grant-modal-overlay">
                    <div class="grant-modal">
                      <!-- Header -->
                      <div class="grant-modal-header">
                        <span class="grant-modal-title">
                          <template if:false={isBulkGrantMode}>
                            Grant Access to {selectedStaffName}
                          </template>
                          <template if:true={isBulkGrantMode}>
                            Grant Access to {selectedStaffNamesPreview}
                          </template>
                        </span>

                        <button
                          class="grant-modal-close"
                          onclick={closeGrantAccessPopup}
                        >
                          &times;
                        </button>
                      </div>

                      <!-- Body -->
                      <div class="grant-modal-body">
                        <!-- <p>Select the forms to grant access to this staff:</p> -->
                        <div class="floating-label-input-grant">
                          <span class="label-text-drop">Search Forms</span>
                          <lightning-input
                            type="search"
                            placeholder="Search by form name..."
                            variant="label-hidden"
                            onchange={handleFormSearch}
                          >
                          </lightning-input>

                        <template if:true={filteredAvailableForms}>
                          <div class="grant-form-list">

                      <!-- Footer -->

                          variant="brand-outline"

                        <lightning-button
                          variant="brand"
                          label="Grant Access"

              </div>
            </template>
          </div>

    <template if:true={isFormSelected}>
      <div class="form-title-container">
        <h3 class="form-title">{selectedFormType}</h3>
      </div>
      <template if:true={showProgressIndicator}>
        <div class="progress-container">
          <!-- Blue fill line -->
          <div class="progress-line">
            <div class="progress-fill" style={progressFillStyle}></div>
          </div>

          <!-- Step Circles -->
          <div class="step-wrapper">
            <template for:each={visualProgressSteps} for:item="step">
              <div
                key={step.index}
                class="step"
                data-index={step.index}
                onclick={handleStepClick}
              >
                <div class={step.circleClass}>
                  <template if:true={step.isCompleted}>
                    <lightning-icon
                      icon-name="utility:check"
                      size="x-small"
                      class="check-icon"
                    ></lightning-icon>
                  </template>
                </div>
                <div class={step.labelClass}>{step.label}</div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <div class="excel-table-container custom-scroll">

            <template for:each={tableRows} for:item="row">
              <div key={row.id} class="form-row" style={row.displayStyle}>
                <template for:each={row.cells} for:item="cell">
                  <template if:true={cell.isVisible}>
                    <!-- Only render <td> if there is a valid field -->
                    <template if:true={cell.field}>
                      <div
                        key={cell.id}
                        class="table-cell"
                        colspan={cell.colspan}
                        rowspan={cell.rowspan}
                      >
                        <template if:true={cell.hasContent}>
                          <div
                            class="floating-label"
                            style={cell.floatingLabelStyle}
                          >
                            <span class="label-text-drop">
                              <template if:true={cell.field.isRequired}>
                                <span style="color: red">*</span>
                              </template>
                              {cell.field.label}
                            </span>

                            <template if:true={cell.hasComment}>
                              <span class="tooltip-container">
                                <lightning-icon
                                  icon-name="utility:info"
                                  size="xx-small"
                                  class="info-icon"
                                ></lightning-icon>
                                <span class="tooltip-text"
                                  >{cell.field.comments}</span
                                >
                              </span>
                            </template>

                            <template if:true={cell.field.isHeader}>
                            <div
                              class="fc-header"
                              style={cell.field.inlineStyle}
                            >
                              {cell.field.text}
                            </div>
                          </template>



                            <template if:true={cell.isTextField}>
                              <input
                                type="text"
                                data-id={cell.id}
                                value={cell.field.value}
                                onchange={handleInputChange}
                                class="input-field"
                                placeholder={cell.placeholderText}
                              />
                            </template>

                            <template if:true={cell.isTextArea}>
                              <textarea
                                data-id={cell.id}
                                class="input-textarea"
                                maxlength="255"
                                placeholder={cell.placeholderText}
                                oninput={handleTextAreaInput}
                              >{cell.field.value}</textarea
                              >
                            </template>

                            <!-- ✅ AlphaNumeric Text Field (Restricts special chars) -->
                            <template if:true={cell.isAlphaNumeric}>
                              <template if:true={cell.field.isDisabled}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  maxlength={cell.maxLength}
                                  pattern="[A-Za-z0-9]*"
                                  onkeypress={restrictAlphaNumeric}
                                  oninput={validateAlphaNumeric}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                  disabled
                                />
                              </template>
                              <template if:false={cell.field.isDisabled}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  maxlength={cell.maxLength}
                                  pattern="[A-Za-z0-9]*"
                                  onkeypress={restrictAlphaNumeric}
                                  oninput={validateAlphaNumeric}
                                  onchange={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>
                            </template>

                            <!-- ✅ Only Alphabets Text Field (No numbers, no special chars) -->
                            <template if:true={cell.isOnlyAlphabets}>
                              <template if:true={cell.field.isDisabled}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  maxlength={cell.maxLength}
                                  pattern="[A-Za-z]*"
                                  onkeypress={restrictOnlyAlphabets}
                                  oninput={validateOnlyAlphabets}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                  disabled
                                />
                              </template>
                              <template if:false={cell.field.isDisabled}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  maxlength={cell.maxLength}
                                  pattern="[A-Za-z]*"
                                  onkeypress={restrictOnlyAlphabets}
                                  oninput={validateOnlyAlphabets}
                                  onchange={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>
                            </template>


                            <template if:true={cell.isRichText}>
                                  <div
                                      class="rich-text-editor"
                                      data-id={cell.id}
                                      data-placeholder={cell.placeholderText}
                                      lwc:dom="manual">
                                  </div>
                            </template>

                            <template if:true={cell.isNumberField}>
                              <template if:true={cell.isContactNumber}>
                                <template if:true={cell.field.isDisabled}>
                                  <input
                                    type="text"
                                    data-id={cell.id}
                                    value={cell.field.value}
                                    maxlength={cell.maxLength}
                                    pattern="[0-9]*"
                                    onkeypress={restrictNumbersOnly}
                                    oninput={validateNumbersOnly}
                                    class="input-field"
                                    placeholder={cell.placeholderText}
                                    disabled
                                  />
                                </template>
                                <template if:false={cell.field.isDisabled}>
                                  <input
                                    type="text"
                                    data-id={cell.id}
                                    value={cell.field.value}
                                    maxlength={cell.maxLength}
                                    pattern="[0-9]*"
                                    onkeypress={restrictNumbersOnly}
                                    oninput={validateNumbersOnly}
                                    onchange={handleInputChange}
                                    class="input-field"
                                    placeholder={cell.placeholderText}
                                  />
                                </template>
                              </template>

                              <template if:true={cell.isCurrency}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  data-decimals={cell.field.decimalValue}
                                  value={cell.field.value}
                                  onkeypress={restrictCurrencyInput}
                                  oninput={validateCurrencyInput}
                                  onchange={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>

                              <template if:true={cell.isDefaultNumber}>
                                <input
                                  type="number"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  onchange={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>
                            </template>

                            <!-- ✅ Time Field (No Formatting) -->
                            <template if:true={cell.isTimeField}>
                              <input
                                type="time"
                                data-id={cell.id}
                                value={cell.field.value}
                                onchange={handleInputChange}
                                class="input-field"
                                placeholder={cell.placeholderText}
                              />
                            </template>

                            <!-- ✅ Date Field (No Formatting) -->
                            <template if:true={cell.isDateField}>
                              <input
                                type="date"
                                data-id={cell.id}
                                value={cell.field.value}
                                onchange={handleInputChange}
                                class="input-field"
                                placeholder={cell.placeholderText}
                              />
                            </template>

                            <!-- ✅ Checkbox Field (Slider Toggle) -->
                            <template if:true={cell.isCheckboxField}>
                                <label class="checkbox-container">
                                  <input
                                    type="checkbox"
                                    data-id={cell.id}
                                    checked={cell.field.value}
                                    oninput={handleInputChange}
                                    class="blue-checkbox"
                                  />
                                  <span class="checkbox-label"></span>
                                </label>
                              </template>

                            <template if:true={cell.isDropdownField}>
                              <template if:false={cell.isMultiSelect}>
                                <template if:true={cell.field.isDisabled}>
                                  <!-- Disabled Single Select Dropdown -->
                                  <select
                                    data-id={cell.id}
                                    value={cell.field.value}
                                    class="input-dropdown"
                                    disabled
                                  >
                                    <option
                                      value=""
                                      disabled
                                      class="dropdown-placeholder"
                                    >
                                      {cell.placeholderText}
                                    </option>
                                    <option value="None">None</option>
                                    <template
                                      for:each={cell.field.options}
                                      for:item="option"
                                    >
                                      <option
                                        key={option.label}
                                        value={option.value}
                                        selected={option.isSelected}
                                      >
                                        {option.label}
                                      </option>
                                    </template>
                                  </select>
                                </template>
                                <template if:false={cell.field.isDisabled}>
                                  <!-- Enabled Single Select Dropdown -->
                                  <select
                                    data-id={cell.id}
                                    value={cell.field.value}
                                    onchange={handleInputChange}
                                    class="input-dropdown"
                                  >
                                    <option
                                      value=""
                                      disabled
                                      class="dropdown-placeholder"
                                    >
                                      {cell.placeholderText}
                                    </option>
                                    <option value="None">None</option>
                                    <template
                                      for:each={cell.field.options}
                                      for:item="option"
                                    >
                                      <option
                                        key={option.label}
                                        value={option.value}
                                        selected={option.isSelected}
                                      >
                                        {option.label}
                                      </option>
                                    </template>
                                  </select>
                                </template>
                              </template>

                              <template if:true={cell.isMultiSelect}>
                                <div class="multi-dropdown-container">
                                  <!-- Selected Options Display -->
                                  <div
                                    class="multi-selected-values"
                                    data-id={cell.id}
                                    onclick={toggleDropdown}
                                  >
                                    <template
                                      for:each={cell.field.options}
                                      for:item="option"
                                    >
                                      <template if:true={option.isSelected}>
                                        <span
                                          key={option.label}
                                          class="selected-option"
                                        >
                                          {option.label}
                                          <span
                                            class="remove-option"
                                            data-id={cell.id}
                                            data-value={option.label}
                                            onclick={removeSelectedOption}
                                            >&times;</span
                                          >
                                        </span>
                                      </template>
                                    </template>
                                    <span
                                      class="multi-select-icon"
                                      title="Multi-select"
                                      data-id={cell.id}
                                      onclick={handleIconClick}
                                      >&#10507;</span
                                    >
                                  </div>

                                  <!-- Dropdown Options -->
                                  <div
                                    class="multi-dropdown-options"
                                    if:true={cell.isDropdownOpen}
                                  >
                                    <template
                                      for:each={cell.field.options}
                                      for:item="option"
                                    >
                                      <label
                                        key={option.label}
                                        class="multi-dropdown-item"
                                      >
                                        <input
                                          type="checkbox"
                                          value={option.label}
                                          data-id={cell.id}
                                          checked={option.isSelected}
                                          onchange={handleMultiSelectChange}
                                        />
                                        {option.label}
                                      </label>
                                    </template>
                                    <div class="multi-dropdown-footer">
                                      <button
                                        class="multi-dropdown-save"
                                        data-id={cell.id}
                                        onclick={saveMultiSelect}
                                      >
                                        Save
                                      </button>
                                    </div>
                                  </div>
                                </div>
                              </template>
                            </template>


                            <template if:true={cell.isUploadField}>
                                <div>
                                  <!-- Hidden actual input -->
                                  <input
                                    type="file"
                                    data-id={cell.id}
                                    class="hidden-file-input"
                                    onchange={handleFileUploadInputChange}
                                    data-cell-id={cell.id}
                                    accept="image/*"
                                    multiple
                                  />

                                  <!-- Styled button -->
                                  <button

        <div class="slds-modal__container notify-modal-container">

            <header class="slds-modal__header notify-modal-header">

                <!-- Close X -->
                <!-- <button
                    class="slds-button slds-button_icon slds-modal__close notify-close-x"
                    title="Close"
                    onclick={handleCloseNotifyModal}>
                    <lightning-icon
                        icon-name="utility:close"

                          </i>

                    </h2>
                </div>

                </p>

            </header>

            <!-- ────────────────────────
                 BODY
                 ──────────────────────── -->
            <div id="modal-notify-content"
                class="slds-modal__content slds-p-around_medium notify-modal-body">

                <!-- Loading spinner -->
                <template if:true={isNotifyLoading}>
                    <div class="notify-loader">
                        <div class="notify-spinner"></div>
                        <span>Loading users...</span>
                    </div>
                </template>

                <template if:false={isNotifyLoading}>

                    <!-- ══════════════════════════════════════════
                        SAME ROW — Priority (left) + Users (right)
                        ══════════════════════════════════════════ -->
                    <div class="notify-two-col-row">

                        <!-- ── LEFT CARD: Priority ── -->
                        <div class="notify-card notify-card-priority">

                            <div class="notify-section-label">
                                <span class="notify-step-badge">1</span>
                                Priority Level
                                <span class="notify-required">*</span>
                            </div>

                            <div class="notify-priority-group">

                              <!-- CRITICAL -->
                                <button data-value="Critical" onclick={handlePrioritySelect} class={notifyCriticalClass}>
                                    <span class="
                                                notify-priority-dot
                                                notify-dot-critical"></span>
                                    Critical
                                    <template if:true={notifyCriticalCount}>
                                        <span class="notify-count-badge">
                                            {notifyCriticalCount}
                                        </span>
                                    </template>
                                </button>


                                <!-- HIGH -->
                                <button
                                    data-value="High"
                                    onclick={handlePrioritySelect}
                                    class={notifyHighClass}>
                                    <span class="notify-priority-dot notify-dot-high"></span>
                                    High
                                    <template if:true={notifyHighCount}>
                                        <span class="notify-count-badge">{notifyHighCount}</span>
                                    </template>
                                </button>

                                <!-- MEDIUM -->
                                <button
                                    data-value="Medium"
                                    onclick={handlePrioritySelect}
                                    class={notifyMediumClass}>
                                    <span class="notify-priority-dot notify-dot-medium"></span>
                                    Medium
                                    <template if:true={notifyMediumCount}>
                                        <span class="notify-count-badge">{notifyMediumCount}</span>
                                    </template>
                                </button>

                                <!-- LOW -->
                                <button
                                    data-value="Low"
                                    onclick={handlePrioritySelect}
                                    class={notifyLowClass}>
                                    <span class="notify-priority-dot notify-dot-low"></span>
                                    Low
                                    <template if:true={notifyLowCount}>
                                        <span class="notify-count-badge">{notifyLowCount}</span>
                                    </template>
                                </button>

                            </div>

                            <p class="notify-helper-text">
                                Click a priority then pick users on the right.
                            </p>

                        </div>

                        <!-- ── RIGHT CARD: User Selection ── -->
                        <div class="notify-card notify-card-users">

                            <div class="notify-section-label">
                                <span class="notify-step-badge">2</span>
                                Users to Notify
                                <span class="notify-required">*</span>
                                <span class="notify-role-hint">(Admins &amp; Managers)</span>
                            </div>

                            <!-- Placeholder before priority is chosen -->
                            <template if:false={notifySelectedPriority}>
                                <div class="notify-pick-priority-hint">
                                     <i class="material-icons">
                                        chevron_left
                                    </i>
                                    <span>Select a priority first</span>
                                </div>
                            </template>

                            <!-- Combobox — shown after priority selected -->
                            <template if:true={notifySelectedPriority}>

                                <div class="notify-active-priority-label">
                                    Configuring:&nbsp;
                                    <span class="notify-priority-pill notify-pill-{notifySelectedPriorityLower}">
                                        {notifySelectedPriority}
                                    </span>
                                </div>

                                <template if:true={notifyUserComboboxOptions.length}>
                                    <c-tesseract-apps-multi-combobox
                                        required
                                        data-id="notify-user-combobox"
                                        data-label="Users to Notify"
                                        options={notifyUserComboboxOptions}
                                        placeholder="Search and select users..."
                                        value={notifySelectedUserValues}
                                        onchange={handleNotifyComboboxChange}>
                                    </c-tesseract-apps-multi-combobox>
                                </template>

                                <!-- No users fallback -->
                                <template if:false={notifyUserComboboxOptions.length}>
                                    <div class="notify-empty-state">
                                        <lightning-icon
                                            icon-name="utility:warning"
                                            size="x-small"
                                            style="color: #dd7a01;">
                                        </lightning-icon>
                                        <span>No admin or manager users found.</span>
                                    </div>
                                </template>

                                <!-- Selected chips -->
                                <template if:true={hasNotifySelectedUsers}>
                                    <div class="notify-chips-wrap notify-chips-inline">
                                        <template for:each={notifySelectedUserChips} for:item="chip">
                                            <span key={chip.value} class="notify-chip">
                                                <span class="notify-chip-avatar">{chip.initials}</span>
                                                {chip.label}
                                                <template if:true={chip.role}>
                                                    <span class="notify-chip-role">{chip.role}</span>
                                                </template>
                                            </span>
                                        </template>
                                    </div>
                                </template>

                            </template>

                        </div>
                        <!-- end right card -->

                    </div>
                    <!-- end two-col-row -->


                    <!-- ══════════════════════════════════════════
                        SUMMARY BOX
                        ══════════════════════════════════════════ -->
                    <template if:true={notifyModalSummary}>
                        <div class="notify-summary-box">
                            <lightning-icon
                                icon-name="utility:check"
                                size="x-small"
                                style="margin-right: 8px; color: #2e7d32; flex-shrink: 0;">
                            </lightning-icon>
                            {notifyModalSummary}
                        </div>
                    </template>


                    <!-- ══════════════════════════════════════════
                        CONFIG OVERVIEW (all 3 priorities)
                        ══════════════════════════════════════════ -->
                    <template if:true={hasAnyNotifyConfig}>
                        <div class="notify-config-overview">

                            <div class="notify-config-title">Current Notification Setup</div>
                            <!-- Critical -->
                            <div class="notify-config-row">
                                <span class="
                                            notify-dot-sm
                                            notify-dot-critical"></span>
                                <span class="
                                                notify-config-priority-label">
                                    Critical
                                </span>
                                <span class="
                                                notify-config-names">
                                    {notifyCriticalSummary}
                                </span>
                                <template if:true={notifyCriticalCount}>
                                    <span class="
                                                        notify-config-badge
                                                        notify-badge-critical">
                                        {notifyCriticalCount}
                                                    user(s)
                                    </span>
                                </template>
                            </div>

                            <!-- High -->
                            <div class="notify-config-row">
                                <span class="notify-dot-sm notify-dot-high"></span>
                                <span class="notify-config-priority-label">High</span>
                                <span class="notify-config-names">{notifyHighSummary}</span>
                                <template if:true={notifyHighCount}>
                                    <span class="notify-config-badge notify-badge-high">
                                        {notifyHighCount} user(s)
                                    </span>
                                </template>
                            </div>

                            <!-- Medium -->
                            <div class="notify-config-row">
                                <span class="notify-dot-sm notify-dot-medium"></span>
                                <span class="notify-config-priority-label">Medium</span>
                                <span class="notify-config-names">{notifyMediumSummary}</span>
                                <template if:true={notifyMediumCount}>
                                    <span class="notify-config-badge notify-badge-medium">
                                        {notifyMediumCount} user(s)
                                    </span>
                                </template>
                            </div>

                            <!-- Low -->
                            <div class="notify-config-row">
                                <span class="notify-dot-sm notify-dot-low"></span>
                                <span class="notify-config-priority-label">Low</span>
                                <span class="notify-config-names">{notifyLowSummary}</span>
                                <template if:true={notifyLowCount}>
                                    <span class="notify-config-badge notify-badge-low">
                                        {notifyLowCount} user(s)
                                    </span>
                                </template>
                            </div>

                        </div>
                    </template>

                </template>
                <!-- end if:false isNotifyLoading -->

            </div>
            <!-- end modal body -->


            <!-- ────────────────────────
                 FOOTER
                 ──────────────────────── -->
            <footer class="slds-modal__footer notify-modal-footer">

                <lightning-button
                    label="Cancel"
                    variant="brand-outline"
                    onclick={handleCloseNotifyModal}>
                </lightning-button>

                <lightning-button
                    label="Save Preferences"
                    variant="brand"
                    disabled={isSaveNotifyDisabled}
                    onclick={handleSaveNotifyPreferences}>
                </lightning-button>

            </footer>

        </div>
    </section>

    <!-- Backdrop -->
    <div class="slds-backdrop slds-backdrop_open"></div>

</template>
 

</template>
