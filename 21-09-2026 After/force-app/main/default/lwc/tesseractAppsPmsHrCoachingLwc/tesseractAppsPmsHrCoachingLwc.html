<template>
    <div class="main-container">
        <template if:true={isHome}>
            <div class="menu-container">
                <div class={pendingReviewTabClass} onclick={handlePendingReviewClick}>Pending Reviews</div>
                <div class={hrTabClass} onclick={handleHrClick}>Created by HR</div>
                 <div style="margin-left: auto; margin-right: 0.5%;">

                    <lightning-button
                        label="Back"
                        variant="brand"
                        onclick={handleBack1}>
                    </lightning-button>

                </div>
            </div>

        </template>

        
        <template if:true={isPendingReviewTab}>
             
            <template if:true={pendingRecords.length}>
                <div class="coaching  custom-scroll">
                <template for:each={pendingRecords} for:item="rec">

                    <div key={rec.Id} class="slds-box slds-m-around_small">

                        <div class="slds-grid slds-wrap slds-m-bottom_small">

                            <div class="slds-col slds-size_3-of-4">

                                <span class="slds-text-heading_small slds-text-title_bold slds-m-right_small">
                                    {rec.coachingTitle}
                                </span>

                                <!-- <span class="slds-badge slds-theme_warning slds-badge_light slds-truncate coaching-badge" -->
                                    <span class={rec.createdTypeClass}
                                        title={rec.coachingCreatedtype}>
                                    {rec.coachingCreatedtype}
                                </span>

                                    <span  class={rec.statusClass}
                                        title={rec.statusBadge}
                                        style="margin-left:6px;">
                                    {rec.statusBadge}
                                </span>

                            </div>
                            <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                                <lightning-button
                                    label={rec.hrReviewLabel}
                                    variant="brand"
                                    data-id={rec.Id}
                                    onclick={handleHrReview}>
                                    
                                </lightning-button>
                            </div>
                            <div class="slds-col slds-size_3-of-4">

                                <span class="slds-text-heading_small slds-m-right_small">
                                    {rec.coachingDescription}
                                </span>
                            </div>

                            

                        </div>

                        
                        <div class="slds-grid slds-wrap slds-gutters">

                            <!-- COLUMN 1 -->
                            <div class="slds-col slds-size_1-of-5">
                                <template if:true={rec.isIndividual}>
                                    <strong>Employee:</strong>
                                    <p class="slds-text-color_weak slds-truncate" title={rec.employeeName}>{rec.employeeName}</p>
                                </template>
                                    <template if:true={rec.isRc}>
                                    <strong>Employee:</strong>
                                    <p class="slds-text-color_weak slds-truncate" title={rec.employeeName}>{rec.employeeName}</p>
                                </template>

                                <template if:true={rec.isGroup}>
                                    <strong>Employees:</strong>
                                    <p>{rec.employeeCount}</p>
                                </template>

                                <template if:true={rec.isManagerHr}>
                                    <strong>Managers:</strong>
                                    <p>{rec.managerCount}</p>
                                </template>

                                <template if:true={rec.isManagerOnly}>
                                    <strong>Managers:</strong>
                                    <p>{rec.managerCount}</p>
                                </template>
                                 <template if:true={rec.isHrOnly}>
                                    <strong>HRs:</strong>
                                    <p>{rec.hrCount}</p>
                                </template>
                            </div>

                            <!--  COLUMN 2 (ONLY IF HAS DATA) -->
                            <template if:true={rec.isIndividual}>
                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Email:</strong>
                                    <p class="slds-text-color_weak slds-truncate" title={rec.email}>{rec.email}</p>
                                </div>
                            </template>
                            <template if:true={rec.isRc}>
                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Email:</strong>
                                    <p class="slds-text-color_weak slds-truncate" title={rec.email}>{rec.email}</p>
                                </div>
                            </template>

                            <template if:true={rec.isManagerHr}>
                                <div class="slds-col slds-size_1-of-5">
                                    <strong>HRs:</strong>
                                    <p>{rec.hrCount}</p>
                                </div>
                            </template>

                            <!-- COLUMN 3 -->
                            <template if:true={rec.isIndividual}>
                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Role:</strong>
                                    <p>{rec.role}</p>
                                </div>
                            </template>
                            <template if:true={rec.isRc}>
                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Role:</strong>
                                    <p>{rec.role}</p>
                                </div>
                            </template>

                            <!-- COLUMN 4 -->
                            <template if:true={rec.isIndividual}>
                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Manager:</strong>
                                    <p>{rec.manager}</p>
                                </div>
                            </template>
                            <template if:true={rec.isRc}>
                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Manager:</strong>
                                    <p>{rec.manager}</p>
                                </div>
                            </template>

                            <!-- COLUMN 5 -->

                                <div class="slds-col slds-size_1-of-5">
                                    <strong>HR:</strong>
                                    <p>{rec.hrContact}</p>
                                </div>
                            </template>
                            <template if:true={rec.isRc}>
                                <div class="slds-col slds-size_1-of-5">
                                    <strong>HR:</strong>
                                    <p>{rec.hrContact}</p>
                                </div>
                            </template>

                            <!-- NOW THESE WILL FILL SAME ROW AUTOMATICALLY -->

                            <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                <strong>Session Date:</strong>
                                <p>{rec.meetingDate}</p>
                            </div>

                            <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                <strong>Session Time:</strong>
                                <p>{rec.meetingTime}</p>
                            </div>

                            <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                <strong>Coaching Created:</strong>
                                <p>{rec.coachingCreatedDate}</p>
                            </div>
                            <template if:true={rec.isRc}>
                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                    <strong>Review Cycle Name:</strong>
                                    <p  class="slds-text-color_weak slds-truncate" title={rec.reviewCycleName}>{rec.reviewCycleName}</p>
                                </div>
                            </template>
                            <template if:true={rec.isRc}>
                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                    <strong>Role Criteria:</strong>
                                    <p class="slds-text-color_weak slds-truncate" title={rec.criteria}>{rec.criteria}</p>
                                </div>
                            </template>
                            
                            <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                <strong>Strengths:</strong>
                                <p>{rec.strengthsCount}</p>
                            </div>

                            <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                <strong>Development:</strong>
                                <p>{rec.developmentAreasCount}</p>
                            </div>

                            <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                <strong>Support:</strong>

                            </div>

                        </div>

                        <!-- <template if:true={rec.isFinalized}>
                            <div class="slds-m-top_small slds-text-color_success">
                                This coaching session has been finalized and submitted to HR. No further edits are allowed.
                            </div>
                        </template> -->

                    </div>

                </template>
                </div>
            </template>

            <template if:false={pendingRecords.length}>
                <!-- <p class="slds-text-align_center slds-m-top_medium">
                    No Pending Coaching Sessions
                </p> -->
                 <div class="no-data">
                    <p>No records found</p>
                </div>
            </template>
        </template>

                                <div class="slds-col slds-size_3-of-4">

                                    </span>
                                </div>

                              

                            </div>

                           
                           <div class="slds-grid slds-wrap slds-gutters">

                                    </template>

                                </div>

                                <!--  COLUMN 2 (ONLY IF HAS DATA) -->
                                <template if:true={rec.isIndividual}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Email:</strong>
                                        <p class="slds-text-color_weak slds-truncate" title={rec.email}>{rec.email}</p>
                                    </div>
                                </template>

                                <template if:true={rec.isManagerHr}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>HRs:</strong>
                                        <p>{rec.hrCount}</p>
                                    </div>
                                </template>

                                <!-- COLUMN 3 -->
                                <template if:true={rec.isIndividual}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Role:</strong>
                                        <p>{rec.role}</p>
                                    </div>
                                </template>

                                <!-- COLUMN 4 -->
                                <template if:true={rec.isIndividual}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Manager:</strong>
                                        <p>{rec.manager}</p>
                                    </div>
                                </template>

                                <!-- COLUMN 5 -->
                                <template if:true={rec.isIndividual}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>HR:</strong>
                                        <p>{rec.hrContact}</p>
                                    </div>
                                </template>

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">

                                    <p>{rec.coachingCreatedDate}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">

                                    <p>{rec.strengthsCount}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">

                                <div class="slds-m-top_small slds-text-color_success">

                                </div>

                            <template if:true={rec.hrSubmitted}>

            <c-tesseract-apps-pms-create-edit-coaching-lwc create-mode={isCoachingCreateMode}  view-mode={isCoachingViewMode} source={source} coaching-id={coachingRecordId}
