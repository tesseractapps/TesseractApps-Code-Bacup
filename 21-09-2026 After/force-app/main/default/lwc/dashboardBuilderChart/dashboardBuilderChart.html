<template>
    <div class="chart-wrapper">
        <!-- Canvas graphical charts (Bar, Column, Line, Area, Pie, Donut, etc.) -->
        <template if:true={isCanvasChart}>
            <div class="canvas-container">
                <canvas class="chart-canvas" lwc:dom="manual"></canvas>
            </div>
        </template>

        <!-- Custom SVG Progress Ring -->
        <template if:true={isSvgProgressRing}>
            <div class="svg-ring-container">
                <svg viewBox="0 0 100 100" class="progress-ring-svg">
                    <circle class="ring-track" cx="50" cy="50" r="40" stroke="#f1f5f9" stroke-width="8" fill="transparent"/>
                    <circle class="ring-indicator" cx="50" cy="50" r="40" stroke="#0ea5e9" stroke-width="8" fill="transparent"
                            stroke-dasharray={ringDashArray} stroke-linecap="round" transform="rotate(-90 50 50)"/>
                    <text x="50" y="55" text-anchor="middle" class="ring-text-val">{ringPercentage}%</text>
                </svg>
            </div>
        </template>

        <!-- Custom SVG Semicircle Gauge -->
        <template if:true={isSvgGauge}>
            <div class="svg-gauge-container">
                <svg viewBox="0 0 100 65" class="gauge-svg">
                    <path class="gauge-track" d="M 15 50 A 35 35 0 0 1 85 50" stroke="#f1f5f9" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path class="gauge-indicator" d="M 15 50 A 35 35 0 0 1 85 50" stroke="#6366f1" stroke-width="8" fill="none" stroke-linecap="round"
                          stroke-dasharray={gaugeDashArray}/>
                    <!-- Needle -->
                    <polygon points="50,15 48,50 52,50" fill="#0f172a" transform={gaugeNeedleTransform} transform-origin="50 50"/>
                    <circle cx="50" cy="50" r="4" fill="#0f172a"/>
                    <!-- Value text -->
                    <text x="50" y="62" text-anchor="middle" class="gauge-text-val">{gaugePercentage}%</text>
                </svg>
            </div>
        </template>
    </div>
</template>
