<template>
  <div class="main-container">
    <div class="menu-container">
      <div class={designTabClass} onclick={handleDesignTab}>
        Design New Form
      </div>
      <div class={draftTabClass} onclick={handleDraftTab}>Published Forms</div>
      <!-- <div class={createdTabClass} onclick={handleCreatedTab}>
        Published Forms
      </div> -->
      <!-- <div class={submitTabClass} onclick={handleSubmitTab}>
      Submitted Forms
    </div> -->

      <div style="margin-left: auto; margin-right: 0.5%">
        <lightning-button
          label="Close"
          title="Close"
          onclick={handleBackClick}
          variant="brand"
        ></lightning-button>
      </div>
    </div>

    <div class="content-wrapper custom-scroll">
      <!-- Design New Forms Tab -->
      <template if:true={isDesignTabSelected}>
        <template if:true={shouldRenderFormRender}>
          <div class="form-render-wrapper">
            <c-form-create
              orgid={orgid}
              layout-data={receivedLayoutData}
              onnavigateaway={handleConfirmedTabSwitch}
            ></c-form-create>
          </div>
        </template>
      </template>
      <template if:true={isDraftTabSelected}>
        <div class="draft-wrapper">
          <c-layout-list-component
            layout-data={receivedLayoutData}
            orgid={orgid}
            form-module="Customisable Form"
          ></c-layout-list-component>
        </div>
      </template>

      <!-- <template if:true={isCreatedTabSelected}>

            orgid={orgid}
            viewmode="create"
          ></c-forms-access>
        </div>
      </template> -->

  </div>

</template>
