<template>
    <lightning-card>
        <div if:true={isDesktop}>
            <table
                class="slds-table slds-border_left slds-border_right  slds-table_cell-buffer slds-table_bordered slds-table_col-bordered"
                style="table-layout: fixed;margin-top:3%">
                <thead>
                    <tr>
                        <th class="slds-cell-wrap">
                            <div class="slds-align_absolute-center">Name</div>
                        </th>
                        <th class="slds-cell-wrap">
                            <div class="slds-align_absolute-center">Application Status</div>
                        </th>
                        <th class="slds-cell-wrap">
                            <div class="slds-align_absolute-center">Contact Number</div>
                        </th>
                        <th class="slds-cell-wrap">
                            <div class="slds-align_absolute-center">Email</div>
                        </th>
                        <th class="slds-cell-wrap">
                            <div class="slds-align_absolute-center">Interview Date</div>
                        </th>
                        <th class="slds-cell-wrap">
                            <div class="slds-align_absolute-center">Job Titile</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={interviewdata} for:item="acc">
                        <tr key={acc.Id}>
                            <td class="slds-cell-wrap">
                                <div class="slds-align_absolute-center">
                                    <lightning-formatted-url value={acc.Name}
                                        label={acc.fullname}></lightning-formatted-url>
                                </div>
                            </td>
                            <td class="slds-cell-wrap">
                                <div class="slds-align_absolute-center">{acc.Application_status__c}</div>
                            </td>
                            <td class="slds-cell-wrap">
                                <div class="slds-align_absolute-center">{acc.Contact_Number__c}</div>
                            </td>
                            <td class="slds-cell-wrap">
                                <div class="slds-align_absolute-center">{acc.Email_Address__c}</div>
                            </td>
                            <td class="slds-cell-wrap">
                                <div class="slds-align_absolute-center">{acc.interviewDate}</div>
                            </td>
                            <td class="slds-cell-wrap">
                                <div class="slds-align_absolute-center">
                                    <lightning-formatted-url value={acc.jobTitile}
                                        label={acc.Job_Title__c}></lightning-formatted-url>
                                </div>
                            </td>
                        </tr>
                    </template>

                </tbody>
            </table>
        </div>
        <div if:true={isMobile}>
            <table
                class="slds-table slds-border_left slds-border_right  slds-table_cell-buffer slds-table_bordered slds-table_col-bordered"
                style="table-layout: fixed;margin-top:3%">
                <thead>
                    <tr>
                        <th class="slds-cell-wrap">
                            <div class="slds-align_absolute-center">Name</div>
                        </th>
                        <!--<th class="slds-cell-wrap"><div class="slds-align_absolute-center">Application Status</div></th>-->
                        <th class="slds-cell-wrap">Contact Number</th>
                        <th class="slds-cell-wrap">Email</th>
                        <th class="slds-cell-wrap">Interview Date</th>
                        <th class="slds-cell-wrap">Job Titile</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={interviewdata} for:item="acc">
                        <tr key={acc.Id}>
                            <td class="slds-cell-wrap">
                                <lightning-formatted-url value={acc.Name}
                                    label={acc.fullname}></lightning-formatted-url>
                            </td>
                            <!--<td class="slds-cell-wrap">
                            <div class="slds-align_absolute-center">{acc.Application_status__c}</div>
                        </td>-->
                            <td class="slds-cell-wrap">
                                {acc.Contact_Number__c}
                            </td>
                            <td class="slds-cell-wrap">
                                {acc.Email_Address__c}
                            </td>
                            <td class="slds-cell-wrap">
                                {acc.interviewDate}
                            </td>
                            <td class="slds-cell-wrap">
                                <div class="slds-align_absolute-center">
                                    <lightning-formatted-url value={acc.jobTitile}
                                        label={acc.Job_Title__c}></lightning-formatted-url>
                                </div>
                            </td>
                        </tr>
                    </template>

                </tbody>
            </table>
        </div>
    </lightning-card>
</template>
