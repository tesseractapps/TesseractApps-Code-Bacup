<template>
    <lightning-card>
    
    <div class="demo-only demo-only--sizing slds-grid slds-wrap">
              <div class="slds-size_2-of-4 slds-m-left_large slds-m-right_large slds-m-top_large slds-m-left_large">
                  <lightning-textarea
                      value={abouturSelfAns}
                      name="abouturSelfAns"
                      label={label.Tell_us_about_yourselves}
                      onchange={questionCapture}>
                  </lightning-textarea>   
              </div>
              <div class="rate slds-size_1-of-4 slds-m-left_large slds-m-right_large slds-m-top_large">
                
                      <input type="radio" id="star15" name="urSelfRating" value="5" onchange={rating} checked={urSelfRating5}/>
                      <label for="star15" title="text">5 stars</label>
                      <input type="radio" id="star14" name="urSelfRating" value="4" onchange={rating} checked={urSelfRating4}/>
                      <label for="star14" title="text">4 stars</label>
                      <input type="radio" id="star13" name="urSelfRating" value="3" onchange={rating} checked={urSelfRating3}/>
                      <label for="star13" title="text">3 stars</label>
                      <input type="radio" id="star12" name="urSelfRating" value="2" onchange={rating} checked={urSelfRating2}/>
                      <label for="star12" title="text">2 stars</label>
                      <input type="radio" id="star11" name="urSelfRating" value="1" onchange={rating} checked={urSelfRating1}/>
                      <label for="star11" title="text" >1 star</label>
              </div>

              <div class="slds-size_2-of-4 slds-m-left_large slds-m-right_large slds-m-left_large">
                <lightning-textarea
                    name="anyConfilictAns"
                    value={anyConfilictAns}
                    label={label.Tell_us_about_your_experience_in_NDIS}
                    onchange={questionCapture}>
                </lightning-textarea>   
            </div>
            <div class="rate slds-size_1-of-4 slds-m-left_large slds-m-right_large">
                    <input type="radio" id="star10" name="experienceInNDIS" value="5" onchange={rating} checked={experienceInNDIS5}/>
                    <label for="star10" title="text">5 stars</label>
                    <input type="radio" id="star9" name="experienceInNDIS" value="4" onchange={rating} checked={experienceInNDIS4}/>
                    <label for="star9" title="text">4 stars</label>
                    <input type="radio" id="star8" name="experienceInNDIS" value="3" onchange={rating} checked={experienceInNDIS3}/>
                    <label for="star8" title="text">3 stars</label>
                    <input type="radio" id="star7" name="experienceInNDIS" value="2" onchange={rating} checked={experienceInNDIS2}/>
                    <label for="star7" title="text">2 stars</label>
                    <input type="radio" id="star6" name="experienceInNDIS" value="1" onchange={rating} checked={experienceInNDIS1}/>
                    <label for="star6" title="text">1 star</label>
            </div>
            
              <div class="slds-size_2-of-4 slds-m-left_large slds-m-right_large slds-m-left_large">
                <lightning-textarea
                    name="experienceInNDISAns"
                    value={experienceInNDISAns}
                    label={label.Have_you_ever_faced_any_confilict}
                    onchange={questionCapture}>
                </lightning-textarea>   
            </div>
            <div class="rate slds-size_1-of-4 slds-m-left_large slds-m-right_large">
                    <input type="radio" id="star5" name="anyConfilict" value="5" onchange={rating} checked={anyConfilict5}/>
                    <label for="star5" title="text">5 stars</label>
                    <input type="radio" id="star4" name="anyConfilict" value="4" onchange={rating} checked={anyConfilict4}/>
                    <label for="star4" title="text">4 stars</label>
                    <input type="radio" id="star3" name="anyConfilict" value="3" onchange={rating} checked={anyConfilict3}/>
                    <label for="star3" title="text">3 stars</label>
                    <input type="radio" id="star2" name="anyConfilict" value="2" onchange={rating} checked={anyConfilict2}/>
                    <label for="star2" title="text">2 stars</label>
                    <input type="radio" id="star1" name="anyConfilict" value="1" onchange={rating} checked={anyConfilict1}/>
                    <label for="star1" title="text">1 star</label>
            </div>
            
            <div if:true={saveboolean} class="slds-size_4-of-4  slds-align_absolute-center" style="margin-top: 2%;">
                    <lightning-button 
                            variant="brand"
                            label="Save"
                            onclick={handleSave}>
                    </lightning-button>
            </div>
              
          </div> 
        </lightning-card>
</template>
