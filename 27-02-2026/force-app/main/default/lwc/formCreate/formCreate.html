                <span class="dot"></span>
                <span class="dot"></span>

          <template if:false={msg.isThinking}>

        </div>
      </template>
    </div>
  </template>
</div>

                     data-cols="1"

                     onkeydown={handleTileKeydown}>

                    <rect x="8" y="8" width="104" height="64" rx="8" class="fillout-shell"></rect>
                    <rect x="20" y="18" width="80" height="44" rx="6" class="fillout-col"></rect>

                </div>
              </div>

          </template>

          <!-- From PDF (dummy) -->

<div class="fillout-panel" role="tabpanel" aria-label="From PDF">


  <div class="fillout-pdf-actions">

<div class="upload-button-container"
     ondragover={onDragOver}
     ondragleave={onDragLeave}
     ondrop={onDrop}>
  <label for="uploadPdf" class="upload-label">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"
         viewBox="0 0 24 24" width="48" height="48">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
    </svg>
    <p>Click or drop a PDF here (Max: 3MB)</p>
  </label>

  <input
    type="file"
    id="uploadPdf"
    accept=".pdf,application/pdf"
    onclick={handlePdfPick}
    class="visually-hidden"/>
</div>

<template if:true={pdfFileName}>
  <p class="fillout-muted">Selected: {pdfFileName}</p>
</template>


    <lightning-button variant="brand"

                      disabled={isExtractDisabled}>
    </lightning-button>

  </div>

</div>


<template if:true={showPdfModal}>
  <section class="fillout-modal" role="dialog" aria-modal="true" aria-labelledby="fillout-pdf-modal-title">
    <div class="fillout-modal__container">
      <header class="fillout-modal__header">
        <h2 id="fillout-pdf-modal-title">Detected Labels</h2>
        <button class="fillout-modal__close" title="Close" onclick={closePdfModal} aria-label="Close">×</button>
      </header>

      <div class="fillout-modal__content">
        <template if:true={pdfLabels.length}>
          <div class="fillout-labels-list">
            <div class="fillout-labels-toolbar">
              <lightning-input type="checkbox" label="Select all" onchange={toggleSelectAll}></lightning-input>
              <lightning-button variant="neutral" label="Clear" onclick={clearSelection}></lightning-button>
            </div>

            <template for:each={pdfLabels} for:item="lbl">
              <label class="fillout-label-item" key={lbl.id}>
                <input type="checkbox" data-id={lbl.id} checked={lbl.selected} onchange={toggleOne}/>
                <span>{lbl.text}</span>
              </label>
            </template>
          </div>
        </template>

        <template if:false={pdfLabels.length}>
          <p class="fillout-muted">No labels detected. Try OCR fallback or a different PDF.</p>
        </template>
      </div>

      <footer class="fillout-modal__footer">
        <lightning-button variant="neutral" label="Cancel" onclick={closePdfModal}></lightning-button>
        <lightning-button variant="brand" label="Import selected" onclick={importSelectedLabels} disabled={importDisabled}></lightning-button>
      </footer>
    </div>
  </section>
  <div class="fillout-modal__backdrop"></div>
</template>

          </template>

        </div>

    </template>
  </span>

        </div>

          <template if:true={cell.field.isNumber}>

          </template>
          <template if:true={cell.field.isDate}>
            <lightning-input type="date" variant="label-hidden" disabled></lightning-input>
          </template>
          <template if:true={cell.field.isTime}>
            <lightning-input type="time" variant="label-hidden" disabled></lightning-input>
          </template>
          <template if:true={cell.field.isDropdown}>

          </template>
          <template if:true={cell.field.isCheckbox}>

                                                        &#8684; Upload File
                                                    </button>

    {cell.field.text}

</template>

        </div>

                                                                </lightning-icon>
                                                                
                                                            </li>
                                                        </ul>
                                                    
                                                    </template>
                                                </div>
                                                
                                                
                                            </div>

<template if:true={isPreviewModalOpen}>
    <div class="preview-modal-backdrop"></div>
    <div class="preview-modal">
        <div class="preview-modal-header">
            <h2 class="preview-title">Preview</h2>
            <button class="close-preview" onclick={closePreviewModal}>×</button>
        </div>
        <div class="preview-modal-body">
            <table class="preview-table">
                <tbody>
                    <template for:each={previewTableRows} for:item="row">
                        <tr key={row.id}>
                            <template for:each={row.cells} for:item="cell">
                                <template if:true={cell.shouldRender}>

                                <td key={cell.id}  class="table-cell-preview" colspan={cell.colspan} rowspan={cell.rowspan}>
                                    <template if:true={cell.field}>

                                        <template if:true={cell.isHeader}>
                                                <div class="preview-header" style={cell.headerStyle}>
                                                {cell.headerText}
                                                </div>
                                            </template>
                                          <template if:false={cell.isHeader}>
                                        <template if:true={cell.field.label}>
                                        <div class={cell.wrapperClass} style={cell.floatingLabelStyle}>
                                            <span class="label-text-drop">
                                                <template if:true={cell.field.isRequired}>
                                                    <span style="color:red">*</span>
                                                </template>
                                                {cell.field.label}
                                            </span>

                                            <!-- TEXT FIELD -->
                                            <template if:true={cell.isTextField}>
                                                <input type="text" class="input-field" placeholder={cell.placeholderText} value={cell.field.value} readonly />
                                            </template>

                                            <!-- TEXTAREA -->
                                            <template if:true={cell.isTextArea}>
                                                <lightning-textarea variant="label-hidden" class="input-textarea" maxlength="255" placeholder={cell.placeholderText} readonly>{cell.field.value}</lightning-textarea>
                                            </template>

                                            <!-- ALPHANUMERIC -->
                                            <template if:true={cell.isAlphaNumeric}>
                                                <input type="text" class="input-field" placeholder={cell.placeholderText} maxlength={cell.maxLength} pattern="[A-Za-z0-9]*" value={cell.field.value} readonly />
                                            </template>

                                            <!-- NUMBER FIELD -->
                                            <template if:true={cell.isNumberField}>
                                                <input type="number" class="input-field" value={cell.field.value} readonly />
                                            </template>

                                            <!-- DATE -->
                                            <template if:true={cell.isDateField}>
                                                <input type="date" class="input-field" value={cell.field.value} readonly />
                                            </template>

                                            <!-- TIME -->
                                            <template if:true={cell.isTimeField}>
                                                <input type="time" class="input-field" value={cell.field.value} readonly />
                                            </template>

                                            <!-- CHECKBOX -->
                                            <template if:true={cell.isCheckboxField}>
                                                <input type="checkbox" checked={cell.field.value} disabled />
                                            </template>

                                            <!-- DROPDOWN -->
                                            <template if:true={cell.isDropdownField}>
                                                <select disabled class="input-dropdown" data-id={cell.dataId}>
                                                    <!-- Placeholder Option -->
                                                    <option value="" disabled selected class="dropdown-placeholder">{cell.placeholderText}</option>

                                                    <!-- "None" Option -->
                                                    <option value="None">None</option>

                                                    <!-- Actual Options -->
                                                    <template for:each={cell.singleSelectOptions} for:item="opt">
                                                        <option key={opt.value} value={opt.value} selected={opt.isSelected}>{opt.label}</option>
                                                    </template>
                                                </select>
                                            </template>


                                            <template if:true={cell.isUploadField}>
                                                <div>
                                                    <!-- Hidden actual input -->
                                                    <input type="file"
                                                        data-id={cell.id}
                                                        class="hidden-file-input"
                                                        onchange={handleFileUpload}
                                                        data-cell-id={cell.id}
                                                    />

                                                    <!-- Styled button -->
                                                    <button type="button"
                                                            class="file-upload-button"
                                                            data-id={cell.id}
                                                            onclick={triggerFileInput}>
                                                        &#8684; Upload File
                                                    </button>
                                                </div>
                                            </template>


                                            <!-- RADIO BUTTON -->
                                            <template if:true={cell.isRadioButton}>
                                                <template for:each={cell.radioOptions} for:item="opt">
                                                    <label key={opt.optionLabel} class="radio-option-label">
                                                        <input type="radio" name={cell.id} value={opt.optionLabel} checked={opt.isChecked} disabled />
                                                        {opt.optionLabel}
                                                    </label>
                                                </template>
                                            </template>

                                        </div>
                                        </template>
                                          </template>

                                          
                                    </template>
                                </td>
                                </template>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</template>


<template if:true={isLoading}>
    <div class="overlay-logo"></div>

    <div class="spinner-wrapper">
      <div class="loader-container">
        <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
        <img src={imageUrl} alt="T Logo" class="Tlogo" />
      </div>

      <!-- Progress text instead of progress bar -->
      <p class="progress-text">Please wait...</p>
    </div>
  </template>

</template>
