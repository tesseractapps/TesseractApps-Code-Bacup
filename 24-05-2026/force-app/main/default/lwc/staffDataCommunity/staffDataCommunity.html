<template>

    <!-- <div class="Adminlayout scrollbar" >   -->
        <template if:true={adminFlag}>     
  <div class="main-container">

            <div class="content-wrapper">
            <header class="header">
                <div class="search-section">

                    <div class="floating-label slds-small-size_1-of-1 slds-medium-size_1-of-2">
                        <span class="label-text-drop">Search</span>
                        <div class="custom-search-wrapper">
                            <lightning-input
                                type="search"
                                
                                label="Staff Name"
                                name="searchName"
                                value={searchName}
                                variant="label-hidden"
                                onchange={handleSearchInput}>
                            </lightning-input>
                        </div>
                    </div>

                     <div class="button-group filter-toggle-group">
                            <button type="button"
                                    class={activeButtonClass}
                                    onclick={handleActiveToggle}>
                                Active
                            </button>

                            <button type="button"
                                    class={inactiveButtonClass}
                                    onclick={handleInactiveToggle}>
                                Inactive
                            </button>
                        </div>
                       <div>
                        
                       </div>
 
                </div>
                <div class="action-section">
                    
                     <button class="view-toggle-button">
                            <i class="material-icons toggle-icon" data-name={viewToggleTarget}
                                onclick={handleChange}
                                title={viewToggleTitle}>{viewToggleIcon}</i>
                        </button>
                        <button class="custom-create-btn" onclick={handleSwitchToMultiStaffUpload} title="Bulk Upload(Ctrl + Shift + U)" style="margin-right: 8px;">
                            Bulk Upload
                        </button>
                        <button class="custom-create-btn" onclick={handleCreateNewStaff} title="Create(Ctrl + Shift + C)">
                            Create Staff
                        </button>
                    
                </div>
            </header>
    
        <!-- search Employee start -->
        <!-- Card view Display Code-->
        <template if:true={cardFlag}>
            <template if:false={noRecordsFlag}>
                <div if:true={isDesktop}>
                    <!--Refresh Button-->
                     <div class="slds-float_right">
                    </div>
                     <template if:true={showSpinner}>
                       <lightning-spinner alternative-text="Refreshing Data" size="medium"></lightning-spinner>
                   </template>

                    <div class="slds-grid slds-gutters slds-wrap" style="margin-right:0.1%;margin-left:0.1%;">
                        <template for:each={recordsWithToggleStyle} for:item="fac" for:index="index">
                            <div key={fac.Id} class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4" style="padding:1%;">
                               
                                <div key={fac.Id} style="border-radius: 4px; border: 1px solid rgba(0, 41, 70, 0.6);box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
                                    
                                    <span style="border-top-left-radius: 4px; border-top-right-radius: 4px; height:40px;display:flex;align-items: center; justify-content: space-between;background-color:#003466;border-bottom: 1px black;padding:2px; overflow: hidden;">
                                        
                                        <b style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;color:white;"> 
                                            <lightning-formatted-text
                                                    style="font-size:17px;color:white;padding-left:15px;flex-shrink:1;" class="name"
                                                    value={fac.Display_Nickname__c}></lightning-formatted-text>
                                            </b>
                                        
                                
                                    <template if:true={fac.picture__c} >
                                        <lightning-avatar variant="circle" src={fac.picture__c} initials="AW" fallback-icon-name="standard:person_account" alternative-text="image" style="margin-right:0.4rem;flex-shrink: 0;"></lightning-avatar>
                                </template> 
                                <template if:false={fac.picture__c}>
                                                            <div class="material-avatar-fallback">
                                                                <i class="material-icons person">account_circle</i>
                                                            </div>
                                                        </template>
                                    </span>
                                    <span>
                                        <table style="margin-bottom:5px;margin-top:0.5rem;table-layout:fixed">
                                    
                                            <tr>
                                                    <td class="label-cell">&nbsp;Contact</td>
                                                    <td class="colon-cell">:</td>
                                                    <td class="value-cell">
                                                        <lightning-formatted-text value={fac.Contact_Number__c}></lightning-formatted-text>
                                                    </td>
                                                </tr>
                                            
                                        <template if:false={ictUserType}>
                                            <tr>
                                                    <td class="label-cell">&nbsp;Role</td>
                                                    <td class="colon-cell">:</td>
                                                    <td class="value-cell">
                                                    <p title={fac.activeRolesDisplay} style ="overflow: hidden; text-overflow: ellipsis">{fac.activeRolesDisplay}</p>
                                                    </td>
                                            </tr>
                                        </template>
                                    
                                            <tr>
                                                    <td class="label-cell">&nbsp;{facilityPreferredName}</td>
                                                    <td class="colon-cell">:</td>
                                                    <td class="value-cell">
                                                      <!--   <lightning-formatted-text value={fac.Facility__r.Name}></lightning-formatted-text> -->
                                                          <p title={fac.activeFaciltyDisplay} style ="overflow: hidden; text-overflow: ellipsis">{fac.activeFaciltyDisplay}</p>
                                                    </td>
                                                </tr>
                                                                                 

                                            <tr>
                                                    <td class="label-cell">&nbsp;Status</td>
                                                    <td class="colon-cell">:</td>
                                                    <td class="value-cell" style="display: flex; align-items: center; justify-content: space-between;">

                                                       <div class="custom-toggle-wrapper"
                                                            >
                                                            <div class={fac.toggleTrackClass} onclick={handlefacStatus}
                                                            data-id={fac.Id} data-name={fac.Status__c} data-staffname={fac.NameToDisplay__c}>
                                                                <div class={fac.toggleKnobClass} data-id={fac.Id} data-name={fac.Status__c} data-staffname={fac.NameToDisplay__c}></div>
                                                            </div>
                                                            <span class={fac.toggleLabelClass}>{fac.toggleLabel}</span>
                                                        </div>



                                                        
                                                        <i class="material-icons view-icon"
                                                        onclick={handleEditStaff}
                                                        data-id={fac.Id}
                                                        style="
                                                            background: #0C78BA;
                                                            color: white;
                                                            width: 24px;
                                                            height: 24px;
                                                            display: flex;
                                                            align-items: center;
                                                            justify-content: center;
                                                            border-radius: 20px;
                                                            font-size: 16px;
                                                            cursor: pointer;
                                                            margin-right: 0.5rem;">
                                                        visibility
                                                        </i>
                                                    </td>
                                                </tr>
                                            
                                        </table>
                                    </span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                </template>
        
        </template>
        <!-- Card view Display Code end-->
        <!-- List view Display Code Start-->
        <template if:true={listFlag}>
            <template if:false={noRecordsFlag}>
        <div class={tableClass}>
            <div class="header-wrapper">
                <table class="staff-table">
                    <thead>
                        <tr>
                            <th class="table-th">
                                Staff Name</th>
                            <th class="table-th">
                                Contact Number</th>
                        <template if:false={ictUserType}>
                            <th class="table-th">
                                Role</th>
                        </template>
                            <th class="table-th">
                                {facilityPreferredName}</th>
                            <th class="table-th center">
                                Status</th>
                            <th class="table-th center">
                                Action</th>
                        </tr>
                    </thead>
                </table>
            </div>
                    
            <!-- BODY -->
            <div class="body-scroll custom-scroll staffTableHeight">
                <table class="staff-table">
                    <tbody>
                        <template for:each={recordsToDisplay} for:item="acc">
                            <tr key={acc.Id}>
                                <td class="table-td" title={acc.Display_Nickname__c}> 
                                    {acc.Display_Nickname__c}                                    
                                </td>
                                <td class="table-td" title={acc.Contact_Number__c}>{acc.Contact_Number__c}</td>
                                  <template if:false={ictUserType}>
                                <td class="table-td value-cell" title={acc.Role__c}>
                                    {acc.activeRolesDisplay}
                                </td>
                                </template>
                                <td class="table-td" title={acc.activeFaciltyDisplay}>
                                  {acc.activeFaciltyDisplay}
                                </td>
                                <td class="table-td center">
                                    <!-- {acc.Staff_Status__c} -->
                                <span class={acc.statusClass} title={acc.Staff_Status__c}>
                                    {acc.Staff_Status__c}
                                </span>                                
                                </td>
                                <td class="table-td center" title="View">
                                    <a href="javascript:void(0)"  title="View" onclick={handleEditStaff} data-id={acc.Id} style="text-decoration: none;">
                                        <i class="material-icons view-icon">visibility</i>
                                    </a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
        </div>
    </div>
            </template>
        </template>
        <!-- List view Display Code End-->
         <!-- if there is no facilities -->
        <template if:true={noRecordsFlag}>
            <div class="no-data">
            <p>No records found</p>
         </div>
        </template>
    </div>
       <template if:true={adminFlag}>
        <template if:false={noRecordsFlag}>
            <div if:true={isDesktop}>
                <div if:true={visible} class="fixed-pagination">
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
                        style="padding-top: 0.5em;">

                        <!--PAGE NAVIGATION-->
                        <div class="slds-align_absolute-center" >
                            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
                                class="slds-p-horizontal_x-small" alternative-text="first page"
                                onclick={firstPage}></lightning-button>
                            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
                                alternative-text="Previous" onclick={previousPage}></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                                &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                                alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small"
                                icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                                alternative-text="last page" onclick={lastPage}
                                icon-position="right"></lightning-button>
                        </div>

                        <!--TOTAL RECORDS-->
                        <div class="slds-clearfix">
                            <div class="slds-float_right ">
                                <span class="slds-badge"> Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        
      </template> 
      <template if:true={isShowSpinner}>
      <!-- <div >
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </div> -->
      <div class="overlay-logo"></div>

      <div class="spinner-wrapper">
        <div class="loader-container">
          <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
          <img src={imageUrl} alt="T Logo" class="Tlogo" />
        </div>

        <!-- Progress text instead of progress bar -->
        <p class="progress-text">Loading<br />Please Wait...</p>
      </div>
    </template> 

     <template if:true={showUpgradeModal}> 
                    <c-upgrade-modal is-open={showUpgradeModal} onclose={closeUpgradeModal}></c-upgrade-modal>
    </template>
   
    </div>
        </template> 
        <template if:true={showPreTaxRecordEditForm}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_medium" >
                <div class="slds-modal__container custom-modal-container">
                 <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
                <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
                </svg>
                <span class="slds-assistive-text">Cancel and close</span>
                </button>
                <div class="slds-modal__header">
                <h1 class="slds-modal__title slds-hyphenate">Edit Staff Documentation</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium" >
                    <lightning-record-edit-form object-api-name="Child_Staff__c" record-id={preTaxRecId} data-recid="PreTaxForm" data-message="Doctable" onsuccess={handlePreTaxSuccess} onsubmit={handlePreTaxRecordFormSubmit}>
                        <lightning-messages></lightning-messages>
                            <div class="slds-grid slds-wrap">
                                <div class="slds-size_1-of-2">
                                    <div class="slds-m-right_medium slds-m-left_medium" >
                                        <lightning-input-field field-name="Name"  ></lightning-input-field>
                                    </div>
                                </div>
                                <div class="slds-size_1-of-2">
                                    <div class="slds-m-right_medium slds-m-left_medium" >
                                        <lightning-input-field field-name="Type__c"   ></lightning-input-field>
                                    </div>
                                </div>
                                <div class="slds-size_1-of-2">
                                   <div class="slds-m-right_medium slds-m-left_medium" >
                                       <lightning-input-field field-name="Expiry_Date__c"  ></lightning-input-field>
                                   </div>
                               </div>
                               <div class="slds-size_1-of-2">
                                <div class="slds-m-right_medium slds-m-left_medium" >
                                    <lightning-input-field field-name="Comments__c" maxlength="225"  ></lightning-input-field>
                                </div>
                                 </div>
                               <div class="slds-size_1-of-2">
                                   <div class="slds-m-right_medium slds-m-left_medium" >
                                       <lightning-input-field field-name="Staff__c" value={parentStaffId} disabled="true"></lightning-input-field>
                                   </div>
                               </div>
                               <div class="slds-size_1-of-2">
                                <div class="slds-m-right_medium slds-m-left_medium" >
                                    <lightning-input type="file" onchange={onFileUpload} name="uploadFile" label="Upload File">  
                                    </lightning-input>
                                    <div class="slds-text-body_small">{fileName}
                                        <!-- <template if:true={showSpinner}>
                                            <lightning-spinner alternative-text="Uploading the file......" size="medium"></lightning-spinner>
                                        </template> -->
                                    </div>
                                    <template if:true={isattachError}>
                                        <p style="color:red">File Size Can not exceed 512MB </p>  
                                    </template>
                                </div>
                               </div>
                                
                            </div>
                    
                        <div class="slds-align_absolute-center slds-m-around_small">
                            <lightning-button type="submit" variant="brand" label="Save"></lightning-button>
                          <lightning-button label="Cancel" variant="Brand-Outline"  data-message="Doctable"  onclick={closePreTaxRecordEditForm}
                            class="slds-m-around_small"></lightning-button> 
                        </div>
                    </lightning-record-edit-form>
                </div>
                <div class="slds-modal__footer">
                </div>
                </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>

        </template>
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Uploading the file......" size="medium"> Your Documnets are being uploaded</lightning-spinner>
        </template>
        <template if:true={showStaffDocumentSection}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_large" style="height: 100%;">
                <div class="slds-modal__container custom-modal-container" >
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
                <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
                </svg>
                <span class="slds-assistive-text">Cancel and close</span>
                </button>
                <div class="slds-modal__header">
                <h1  class="slds-modal__title slds-hyphenate">Staff Document Section</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium" >
                    <div  style="margin-left:5%;margin-right:5%;margin-top:3%" >          
                        <table class="slds-table  slds-m-top_x-large" >
                            <thead>
                                <tr class="slds-text-title--caps">
                                    <th class="slds-cell-wrap">S.No</th>
                                    <th class="slds-cell-wrap">Document Name</th>
                                    <th class="slds-cell-wrap">Upload File</th>
                                    <th class="slds-cell-wrap">Comments</th>
                                    <th class="slds-cell-wrap">Date Of Expiry</th>
                                    <th class="slds-cell-wrap">Action</th>
                                </tr>
                            </thead>
                        <tbody>
                            <template for:each={accountRecList} for:item="rec">
                                <tr key={rec} class="slds-hint-parent">
                                    <td style="font-weight: bold ; vertical-align: middle;" >
                                        <lightning-formatted-number value={rec.index}></lightning-formatted-number>.
                                    </td>
                                    <td style="vertical-align: middle;">
                                        <lightning-combobox name="typeOfDocument" label="" data-id={rec.index} value={rec.Description} placeholder="Select Document" options={options} onchange={handleDocumentchange} ></lightning-combobox>
                                    </td>
                                    <td style="vertical-align: middle;">
                                        <lightning-input type="file" label={rec.fileName} data-id={rec.index} name="file" value={rec.Quantity} onchange={handleDocumentchange} ></lightning-input>
                                    </td>
                                    <td style="vertical-align: middle;">
                                        <lightning-input type="text" variant="label-hidden" label="" data-id={rec.index} name="comment" value={rec.comment} onchange={handleDocumentchange}></lightning-input>
                                    </td>
                                     <td style="vertical-align: middle;">
                                        <lightning-input type="date" variant="label-hidden" label="" data-id={rec.index} name="staffExpirydate" value={rec.preTaxDate} onchange={handleDocumentchange}></lightning-input>
                                    </td>
                                    <td style="vertical-align: middle;">
                                        <lightning-button-icon icon-name="utility:delete" alternative-text="Remove" title="Remove" name={rec.index} onclick={removeRow}></lightning-button-icon>
                                    </td>
                                </tr>
                            </template>
                            </tbody>
        
                        </table>
                    </div>
                    
                </div>
                <div class="slds-modal__footer">
                    <div class="slds-align_absolute-center slds-m-top_medium">
                        <lightning-button class="slds-m-right--small" label="Cancel" onclick={closeDocumentSection}
                        variant="Brand-Outline"></lightning-button>
                        <div >
                            <lightning-button class="slds-m-right--small" label="Add Document" onclick={addDocumentRow}
                            variant="brand">
                            </lightning-button>
                            <lightning-button label="Save" onclick={handleSubmitDocuments} variant="brand"></lightning-button>
                        </div>                        
                    </div>
                </div>
                </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
                

        </template>
        <template if:true={editstaffflag}>
        <c-create-edit-staff-lwc staff-id={recordId} typeof-user={typeOfUser} onstaffevent={childevent} faclist={finalListFacilities}></c-create-edit-staff-lwc>
        </template>
        
    <!-- </div> -->
        <template if:true={isModalOpen}>
            <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
            class="slds-modal slds-fade-in-open slds-modal_large" style="height: 750px;" role="dialog" tabindex="-1">
            
            <div class="slds-modal__container">
                <!-- modal header start -->
                <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                    onclick={closeModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                    size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2  class="slds-text-heading_medium slds-hyphenate">View Attachment</h2>
                </header>
                <!-- modal body start -->
                <div class="slds-modal__content slds-p-around_medium">
                <iframe src={currentUrl} width="1300px" height="1000px" ></iframe>
                </div>
                <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
                </footer>
                <!-- modal footer start-->
            </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <template if:true={handleStatusFlag}>
            <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
                        
                <div class="slds-modal__container modal-container" style="max-width:25%;">
                    <header class="slds-modal__header" style="background: #002A52;">
                                
                        <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
                    </header> 
                    <div class="slds-modal__content slds-p-around_medium modal-content"  >         <!-- style="border-radius:0 0 15px 15px" -->                       
                        <div class="slds-m-around_small" style="text-align:center">
                            <div><p style="text-align: center;">Are you sure you want to change status of the <br/> {staffname}?</p></div>
                            <div class="button-container slds-m-top_medium">
                                <lightning-button label="No" variant="brand" onclick={handlestatusclose}
                                class="slds-m-around_small"></lightning-button>
                                <lightning-button label="Yes" variant="brand" onclick={handlestatuschange} class="slds-m-around_small" ></lightning-button>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        
        <template if:true={hasFutureShifts}>
            <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
            
                <div class="slds-modal__container modal-container" style="max-width:25%;">
                    <header class="slds-modal__header" style="background: #002A52;">
                    
                        <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Warning</h2>
                    </header> 
                    <div class="slds-modal__content slds-p-around_medium modal-content"  >         <!-- style="border-radius:0 0 15px 15px" -->                       
                        <div class="slds-m-around_small" style="text-align:center">
                            <div>
                                <p> Status cannot be changed for <strong>{staffname}</strong> because there are scheduled shifts on the following dates:
                                        <br/>
                                    <strong>{shiftDatesMessage}</strong>
                                </p>
                            </div>
                            <div class="slds-m-top_medium">
                                <lightning-button 
                                    label="OK"
                                    variant="brand"
                                    onclick={handleFutureShiftClose}>
                                </lightning-button>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

            <div class="blur-overlay"></div>

                <div style="display: flex; align-items: center; justify-content: space-between;">

<template if:false={ictUserType}>
                    <h3 class="slds-text-title_bold">Contacts</h3>
                <div style="padding:1%">
                    <table class="slds-table slds-table_bordered ">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th style="width: 12%;">Contact Type</th>
                                <th style="width: 17%;">First Name</th>
                                <th style="width: 17%;">Last Name</th>
                                <th style="width: 17%;">Relationship</th>
                                <th style="width: 17%;">Contact Number</th>
                                <th style="width: 22%;">Email Address</th>

                                <th style="width:5%; text-align:center;">
                                </th>
                            </tr>
                        </thead>

                        <tbody>
                            <template for:each={contactList} for:item="con" for:index="index">
                                <tr key={con.id}>

                                    <td class="slds-size_small" style="max-width:10rem">
                                        <template if:false={con.showNewTypeInput}>
                                            <lightning-combobox
                                                name="contactType"
                                                variant="label-hidden"
                                                title={con.contactType}
                                                value={con.contactType}
                                                data-index={index}
                                                options={contactTypeOptions}
                                                disabled={con.isDisabled}
                                                onchange={handleContactsChange}>
                                            </lightning-combobox>
                                        </template>
                                    </td>


                                    <td>
                                        <lightning-input 
                                            name="firstName"
                                            variant="label-hidden"
                                            data-index={index}
                                            value={con.firstName}
                                            placeholder={con.firstNamePlaceholder}
                                            disabled={con.isDisabled}
                                            onchange={handleContactsChange}>
                                        </lightning-input>
                                    </td>

                                    <td>
                                        <lightning-input 
                                            name="lastName"
                                            variant="label-hidden"
                                            data-index={index}
                                            value={con.lastName}
                                            placeholder={con.lastNamePlaceholder}
                                            disabled={con.isDisabled}
                                            onchange={handleContactsChange}>
                                        </lightning-input>
                                    </td>

                                    <td>
                                        <lightning-input 
                                            name="relationship"
                                            variant="label-hidden"
                                            data-index={index}
                                            value={con.relationship}
                                            placeholder={con.relationshipPlaceholder}
                                            disabled={con.isDisabled}
                                            onchange={handleContactsChange}>
                                        </lightning-input>
                                    </td>

                                    <td>
                                        <lightning-input 
                                            name="contactNumber"
                                            type="tel"
                                            variant="label-hidden"
                                            data-index={index}
                                            value={con.contactNumber}
                                            placeholder={con.phonePlaceholder}
                                            disabled={con.isDisabled}
                                            onchange={handleContactsChange}
                                            maxlength="10"
                                            pattern="[0-9]{10}"
                                            message-when-pattern-mismatch="Enter a valid 10-digit number">
                                        </lightning-input>
                                    </td>

                                    <td>
                                        <lightning-input 
                                            name="email"
                                            type="email"
                                            class="contact-email" 
                                            variant="label-hidden"
                                            data-index={index}
                                            value={con.email}
                                            placeholder={con.emailPlaceholder}
                                            disabled={con.isDisabled}
                                            onchange={handleContactsChange}>
                                        </lightning-input>
                                    </td>
                                    
                                    <td style="text-align:center;">
                                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-center action-cell">
                                        <lightning-button-icon 
                                            icon-name="utility:delete"
                                            alternative-text="Delete Row"
                                            data-index={index}
                                            disabled={con.isDisabled}
                                            class="slds-m-right_x-small"
                                            onclick={removeContactRow}>
                                        </lightning-button-icon>
                                        <lightning-button-icon
                                            icon-name="utility:add"
                                            alternative-text="Add Row"
                                            data-index={index}
                                            variant="brand"
                                            class={con.addButtonClass}
                                            onclick={addContactRow}>
                                        </lightning-button-icon>
                                    </div>
                                    </td>

                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
</template>
