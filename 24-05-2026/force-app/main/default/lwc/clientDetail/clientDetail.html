<!-- CONTACT ATTACHMENT MODAL -->
<template if:true={showContactAttachmentModal}>
    <section role="dialog"
             tabindex="-1"
             aria-modal="true"
             class="slds-modal slds-fade-in-open popup-zindex">

        <div class="slds-modal__container modal-custom">

            <!-- HEADER -->
            <header class="slds-modal__header headercustom">
                <h2 class="slds-modal__title slds-text-heading_medium h2custom">
                    Attach Files
                </h2>
            </header>

            <!-- BODY -->
            <div class="slds-modal__content slds-p-around_medium custom-scroll">

                <!-- File Upload -->
                <div class="slds-box drag-drop"
                     ondragover={handleDragOver}
                     ondrop={handleDrop}>

                    <p class="slds-text-align_center">
                        Drag and drop files here<br/>

                        <a href="javascript:void(0);"
                           onclick={triggerAttachInput}>
                            Click to browse
                        </a>
                    </p>

                    <input
                        type="file"
                        class="hidden-file-input contact-upload-input"
                        onchange={handleFileUploadInputChange}
                        multiple />
                </div>

                <template if:true={isFileExpand}>
                    <c-document-office-service
                        record-id={recordIdForFileUpload}
                        module-path-from-parent="ticket"
                        onuploadcomplete={handleAwsUploadComplete}
                        onfiledeleted={handleFileDeleted}
                        oncancel={handlefilecancel}>
                    </c-document-office-service>
                </template>

            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCloseContactAttachmentModal}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    label="Save"
                    variant="brand"
                    onclick={handleSaveContactAttachment}>
                </lightning-button>

            </footer>
        </div>
    </section>

    <div class="blur-overlay-popup"></div>
</template>

<template if:true={showAttachmentListModal}>

    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        class="slds-modal slds-fade-in-open popup-zindex">

        <div class="slds-modal__container modal-custom">

            <!-- HEADER -->
            <header class="slds-modal__header headercustom">

                <h2 class="slds-modal__title slds-text-heading_medium h2custom">
                    Uploaded Files
                </h2>

            </header>

            <!-- BODY -->
            <div class="slds-modal__content slds-p-around_medium custom-scroll">

                <template if:true={contactAttachments.length}>

                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">

                        <thead>
                            <tr>
                                <th>File Name</th>
                                <th>Size</th>
                                <th style="width:120px; text-align:center;">
                                    Actions
                                </th>
                            </tr>
                        </thead>

                        <tbody>

                            <template
                                for:each={contactAttachments}
                                for:item="file">

                                <tr key={file.Id}>

                                    <td>
                                        {file.File_Name__c}
                                    </td>

                                    <td>
                                        {file.Size__c}
                                    </td>

                                    <td style="text-align:center;">

                                        <!-- VIEW -->
                                        <lightning-button-icon
                                            icon-name="utility:preview"
                                            alternative-text="View"
                                            title="View"
                                            class="slds-m-right_small"
                                            data-url={file.viewUrl}
                                            onclick={handleViewAttachment}>
                                        </lightning-button-icon>

                                        <!-- DELETE -->
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            alternative-text="Delete"
                                            title="Delete"
                                            variant="destructive"
                                            data-id={file.Id}
                                            onclick={handleDeleteAttachment}>
                                        </lightning-button-icon>

                                    </td>

                                </tr>

                            </template>

                        </tbody>

                    </table>

                </template>

                <template if:false={contactAttachments.length}>

                    <div class="slds-align_absolute-center slds-p-around_large">
                        No files uploaded
                    </div>

                </template>

            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer">

                <lightning-button
                    label="Close"
                    variant="neutral"
                    onclick={closeAttachmentListModal}>
                </lightning-button>

            </footer>

        </div>

    </section>

    <div class="blur-overlay-popup"></div>

</template>

<template if:true={isViewDoc}>
    <div class="slds-grid slds-grid_align-end">
        <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
        onclick={handlereturn} style="margin-right:1%;margin-top: 1%;"></lightning-button>
    </div>
    <div class="main-container-iframe custom-scroll">
      <iframe src={currentUrl} width="100%" height="1300px" ></iframe>
    </div>
</template>
</template>
