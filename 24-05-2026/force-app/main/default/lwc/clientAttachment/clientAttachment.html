        <div style="margin: 0 5%;">

            <span style="font-size:13px;">All Documents</span>
        </div>        

        <template for:each={folderTree} for:item="folder">
            <c-treefolder-Lwc
                key={folder.Id}
                node={folder}
                level="0"
                is-staff={isStaff}
                selected-id={currentFolderId}
                onfolderselect={handleFolderSelect}
                onpermissions={handleFolderPermissions}
                onrefreshfolders={loadFolders}>
            </c-treefolder-Lwc>
        </template>
        </div>

      </div>

      <div class="slds-col right-panel">

        <div class="top-header">

            <div class="header-left">

                <div class="selected-folder-label">

                      Folder: {currentFolderName}
                  </span>

                </div>

            </div>

            <!-- RIGHT -->
            <div class="header-right">

              <template if:true={isStaff}>

                <lightning-button
                    variant="neutral"
                    label="Archive"
                    icon-name="utility:archive"
                    onclick={openArchiveModal}>
                </lightning-button>

              </template>

                <lightning-button
                    variant="brand"
                    label="Add Attachment"
                    onclick={handleAttachment}
                    disabled={disableContactUploads}>
                </lightning-button>

              <button
                  class="slds-button slds-button_icon slds-button_icon-border"
                  title="Refresh"
                  onclick={RefreshAttachmentsData}>

                  <svg class="slds-button__icon" aria-hidden="true">
                      <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#refresh"></use>
                  </svg>

              </button>

            </div>

        </div>

        <div class="table-wrapper">

            <div class="table-container attachmentTable">

                <!-- HEADER -->
                <div class="header-wrapper">
                    <table class="staff-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Size (MB)</th>
                                <th>Comments</th>
                                <th>User</th>
                                <th>Date</th>
                                <th class="center">Actions</th>
                            </tr>
                        </thead>
                    </table>
                </div> 

              <!-- BODY -->
              <div class="custom-scroll attachmentTableHeight">
                  <table class="staff-table">
                      <tbody>

                        <!-- TABLE -->
                        <template if:false={noRecordsFlag}>

                          <template for:each={data} for:item="attachment">
                              <tr key={attachment.Id}>

                                  <td>{attachment.Name}</td>
                                  <td>{attachment.type}</td>
                                  <td>{attachment.fileSize}</td>
                                  <td>{attachment.comment}</td>
                                  <td>{attachment.UserName}</td>
                                  <td>{attachment.Date}</td>

                                  <!-- ACTION -->
                                  <td class="table-td center action-cell">

                                      <!-- VIEW -->
                                      <a href={attachment.AmazonURL}
                                          data-id={attachment.Id}
                                          data-url={attachment.AmazonURL}
                                          onclick={handleView}
                                          title="View Attachment"
                                          class="icon-link">
                                          <i class="material-icons view-icon">visibility</i>
                                      </a>
                                      <template if:false={isContactsContext}>
                                      <!-- STAFF ACTIONS -->
                                      <template if:true={isStaff}>

                                          <!-- EDIT -->
                                          <a href="javascript:void(0)"
                                              data-id={attachment.Id}
                                              data-key={attachment.Key__c}
                                              onclick={handleEdit}
                                              title="Edit"
                                              class="icon-link">
                                              <i class="material-icons edit-icon">edit</i>
                                          </a>
                                          

                                          <!-- DELETE -->
                                          <a href="javascript:void(0)"
                                              data-id={attachment.Id}
                                              onclick={handleDelete}
                                              title="Delete"
                                              class="icon-link">
                                              <i class="material-icons delete-icon">delete</i>
                                          </a>

                                          <!-- ARCHIVE -->
                                          <a href="javascript:void(0)"
                                              data-id={attachment.Id}
                                              onclick={handleArchive}
                                              title="Archive"
                                              class="icon-link">

                                              <i class="material-icons archive-icon">
                                                  archive
                                              </i>

                                          </a>

                                          <!-- PERMISSIONS -->
                                          <!-- <template if:true={showPermissionIcon}>

                                                  onclick={handleShare}

                                                  <i class="material-icons permissions-icon">passkey</i>
                                              </a>
                                          </template> -->


                                          <template if:true={showPermissionIcon}>
                                          
                                          <a href="javascript:void(0)"

                                                      data-id={attachment.Id}

                                                      onclick={handleShare}

                                                      title="Permissions"

                                                      class="icon-link">
                                          <i class="material-icons permissions-icon">passkey</i>
                                          </a>
                                          </template>
                                          </template>
 
                                      </template>

                                  </td>

                              </tr>
                          </template>

                        </template>

                      </tbody>

                <template if:true={noRecordsFlag}>

      <template if:false={noRecordsFlag}>

        >
          <!--RECORDS PER PAGE-->
          <div class="slds-col">
            <div class="slds-list_inline slds-p-bottom_xx-small">
              <label
                class="slds-text-color_weak slds-p-horizontal_x-small"
                for="recordsPerPage"
                >Page Size:</label
              >
              <div class="slds-select_container">
                <select
                  class="slds-select"
                  id="recordsPerPage"
                  onchange={handleRecordsPerPage}
                >
                  <template for:each={pageSizeOptions} for:item="option">
                    <option key={option} value={option}>{option}</option>
                  </template>
                </select>
              </div>
            </div>
          </div>

          <!--PAGE NAVIGATION-->
          <div class="slds-align_absolute-center" style="height: 5rem">
            <lightning-button
              disabled={bDisableFirst}
              icon-name="utility:jump_to_left"
              label="First"
              class="slds-p-horizontal_x-small"
              alternative-text="first page"
              onclick={firstPage}
            ></lightning-button>
            <lightning-button
              disabled={bDisableFirst}
              icon-name="utility:chevronleft"
              label="Previous"
              alternative-text="Previous"
              onclick={previousPage}
            ></lightning-button>
            &nbsp;
            <span class="slds-badge"
              >Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
              &nbsp;&nbsp;Page(s)</span
            >
            &nbsp;
            <lightning-button
              disabled={bDisableLast}
              icon-name="utility:chevronright"
              label="Next"
              alternative-text="Next"
              onclick={nextPage}
              class="slds-p-horizontal_x-small"
              icon-position="right"
            ></lightning-button>
            <lightning-button
              disabled={bDisableLast}
              icon-name="utility:jump_to_right"
              label="Last"
              alternative-text="last page"
              onclick={lastPage}
              icon-position="right"
            ></lightning-button>
          </div>

          <div class="slds-clearfix">
            <div class="slds-float_right">
              <span class="slds-badge"> Total Records: {totalRecords}</span>
            </div>
          </div>
        </div>

    </div>
    
    <div class="slds-align_absolute-center">
      <lightning-button label="Cancel" variant="brand-outline" onclick={handleShareClose} type="close" class="slds-m-around_small"></lightning-button>
      <lightning-button label="Save" variant="brand" onclick={handleassignmentinsert}  class="slds-m-around_small" disabled={saveButtonDisable}></lightning-button>
    </div>

    </div>

  </template>

  <!-- CREATE FOLDER MODAL -->
  <template if:true={isCreateFolderModalOpen}>
      <div class="blur-overlay"></div>

      <section class="slds-modal slds-fade-in-open" role="dialog">
          <div class="slds-modal__container" style="max-width: 30%;">

              <!-- HEADER -->
              <header class="slds-modal__header" style="background:#002a52;">
                  <h2 class="slds-text-heading_medium" style="color:white; text-align:center;">
                      Create New Folder
                  </h2>
              </header>

              <!-- BODY -->
              <div class="slds-modal__content slds-p-around_medium">

                  <!-- Folder Name -->
                  <lightning-input
                      label="Folder Name"
                      value={folderName}
                      onchange={handleFolderNameChange}
                      required>
                  </lightning-input>

                  <!-- Parent Folder (READ ONLY) -->
                  <div style="margin-top:15px;">
                      <lightning-combobox
                          label="Parent Folder"
                          value={selectedParentFolderId}
                          options={folderOptions}
                          onchange={handleParentFolderChange}>
                      </lightning-combobox>
                  </div>

              </div>

              <!-- FOOTER -->
              <footer class="slds-modal__footer">

                  <lightning-button
                      label="Cancel"
                      onclick={closeFolderModal}>
                  </lightning-button>

                  <lightning-button
                      variant="brand"
                      label="Create Folder"
                      onclick={createFolder}
                      class="slds-m-left_small">
                  </lightning-button>

              </footer>

          </div>
      </section>

      <!-- BACKDROP -->
      <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  
  <template if:true={isShowSpinner}>
    <div class="overlay-logo"></div>

    <div class="spinner-wrapper">
      <div class="loader-container">
        <img
          src={logoUrl}
          alt="Breathing Frame"
          class="breathing-frame"
        />
        <img src={imageUrl} alt="T Logo" class="Tlogo" />
      </div>

      <!-- Progress text instead of progress bar -->
      <p class="progress-text">Loading<br />Please Wait...</p>
    </div>
  </template>

  <!-- FOLDER SHARE MODAL -->
  <template if:true={folderAssignmentFlag}>

      <div class="blur-overlay"></div>

      <div class="right-align" style="width:40%;">

          <div
              style="
                  display:flex;
                  align-items:center;
                  justify-content:space-between;
              ">

              <h3
                  style="
                      font-weight:bold;
                      font-size:150%;
                      margin:0;
                      padding:2% 0 0 2%;
                  ">

                  Share Folder

              </h3>

          </div>

          <div class="right-content custom-scroll">

              <div class="seperator">

                  <div
                      class="slds-grid slds-wrap"
                      style="padding:20px 0px 20px 0px;">

                      <div
                          class="
                              slds-size_1-of-1
                              slds-large-size_1-of-1
                              slds-p-around_small
                          ">

                          <lightning-dual-listbox

                              name="folderShare"

                              label="Select Staff"

                              source-label="Available Staff"

                              selected-label="Selected Staff"

                              field-level-help="Select staff for folder access"

                              options={filteredStaffOptions}

                              value={selectedFolderStaffIds}

                              onchange={handleFolderStaffChange}>

                          </lightning-dual-listbox>

                      </div>

                  </div>

              </div>

          </div>

          <div class="slds-align_absolute-center">

              <lightning-button
                  label="Cancel"
                  variant="brand-outline"
                  onclick={closeFolderShare}
                  class="slds-m-around_small">
              </lightning-button>

              <lightning-button
                  label="Save"
                  variant="brand"
                  onclick={saveFolderSharing}
                  class="slds-m-around_small"
                  disabled={folderSaveButtonDisable}>
              </lightning-button>

          </div>

      </div>

  </template>
  
  <template if:true={archiveModal}>

      <section
          class="slds-modal slds-fade-in-open"
          role="dialog">

          <div class="slds-modal__container modal-custom">

              <!-- HEADER -->
              <header class="slds-modal__header headercustom">

                  <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">
                      Archived Documents
                  </h2>

              </header>

 
<!-- BODY CONTENT --> 
              <div class="slds-modal__content slds-p-around_medium custom-scroll">  
                <div class="table-container archive-table">

                  <!-- HEADER -->
                  <div class="header-wrapper">

                      <table class="staff-table">

                          <thead>
                              <tr>
                                  <th>Name</th>
                                  <th>Type</th>
                                  <th>Archived Date</th>
                                  <th class="center">Actions</th>
                              </tr>
                          </thead>

                      </table>

                  </div>

                  <!-- BODY -->
                  <div class="custom-scroll attachmentTableHeight">

                      <table class="staff-table">

                          <tbody>

                              <template if:true={archivedRecords.length}>

                                  <template
                                      for:each={archivedRecords}
                                      for:item="file">

                                      <tr key={file.Id}>

                                          <td>{file.Name}</td>

                                          <td>{file.Type}</td>

                                          <td>{file.ArchivedDate}</td>

                                          <td class="table-td center action-cell">

                                              <!-- RESTORE -->
                                              <a href="javascript:void(0)"
                                                  data-id={file.Id}
                                                  onclick={handleRestore}
                                                  title="Restore">

                                                  <i class="material-icons">
                                                      restore_from_trash
                                                  </i>

                                              </a>

                                          </td>

                                      </tr>

                                  </template>

                              </template>

                              <template if:false={archivedRecords.length}>

                                  <tr>

                                      <td colspan="4" class="no-data">
                                          No archived documents found
                                      </td>

                                  </tr>

                              </template>

                          </tbody>

                      </table>

                  </div>

              </div>
              </div>

              <!-- FOOTER -->
              <footer class="slds-modal__footer">

                  <lightning-button
                      label="Close"
                      onclick={closeArchiveModal}>
                  </lightning-button>

              </footer>

          </div>

      </section>

      <div class="slds-backdrop slds-backdrop_open"></div>

  </template>

</template>
