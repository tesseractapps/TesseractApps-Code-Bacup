<template>
  <div class="main-container">
    <template if:true={isHome}>
    <template if:false={hideSubmittedForms}>
      <template if:false={isFormSelected}>

        <template if:true={showPublishedForms}>
          <div class="blur-overlay">
            <div class="right-align custom-scroll" style="width: 65%">
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                "
              >
                <h3
                  style="
                    font-size: 140%;
                    font-weight: bold;
                    margin-bottom: 0.5%;
                    margin-top: 1%;
                    margin-left: 2%;
                  "
                >
                  Published Incidents
                </h3>
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    padding-right: 2%;
                  "
                >
                  <lightning-button
                    variant="brand-outline"
                    label="Cancel"
                    title="Cancel"
                    onclick={handleCancelPublishedForms}
                  >
                  </lightning-button>
                </div>
              </div>

              <div style="flex: 1; display: flex; justify-content: center">
                <div class="floating-label-search">
                  <span class="label-text-drop">Search Incidents</span>
                  <lightning-input
                    type="search"
                    variant="label-hidden"
                    placeholder="Search by incident name..."
                    onchange={handleSearchChange}
                  >
                  </lightning-input>
                </div>
              </div>

              <div class="form-3d-container">
                <template for:each={filteredForms} for:item="form">
                  <div
                    key={form.Id}
                    class="form-card"
                    data-id={form.Id}
                    onclick={handleFormClick}
                    onmouseover={handleHover}
                    onmouseout={handleMouseOut}
                  >
                    <img
                      src={form.formImageUrl}
                      alt="Form Preview"
                      class="form-image"
                    />
                    <div class="form-card-footer">
                      <div class="layout-title">{form.Name__c}</div>
                    </div>
                  </div>
                </template>

                <template if:false={filteredForms.length}>
                  <p>No forms found.</p>
                </template>
              </div>
            </div>
          </div></template
        >
        <template if:false={hideSearchAndActions}>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding-right: 1%;
            "
          >
            <div class="floating-label-input">
              <span class="label-text-drop">Search</span>
              <lightning-input
                type="search"
                value={submittedFormsSearchKey}
                onchange={handleSubmittedFormsSearch}
                variant="label-hidden"
                placeholder="Search by Incident Name, Assigned To, Date..."
              >
              </lightning-input>
            </div>
            <div style="display: flex; margin-left: auto">
              <template if:true={showFormsAccessClick}>
                <lightning-button
                  label="Manage Incident"
                  variant="brand-outline"
                  onclick={handleAccessButtonClick}
                  style="margin-right: 10px"
                >
                </lightning-button>
                 <lightning-button
                    label="Get Notified"
                    variant="brand-outline"
                    icon-name="utility:notification"
                    onclick={handleOpenNotifyModal}
                    style="margin-right: 10px">
                </lightning-button>
              </template>
              <lightning-button
                label="Create Incident"
                variant="brand"
                onclick={togglePublishedForms}
              >
              </lightning-button>
            </div>
          </div>

          <template if:false={hasFormResponses}>
          <p class="no-records">No submitted forms available.</p>
        </template>
        </template>
        <template if:true={hasFormResponses}>

          <div class="table-container custom-scroll">
            <table class="custom-table">
              <thead>
                <tr class="custom-table-header">
                  <th class="custom-th">Incident Name</th>
                  <!-- <th class="custom-th">Form Type</th> -->
                  <th class="custom-th">Assigned To</th>
                  <th class="custom-th">Submitted By</th>
                  <th class="custom-th">Submission Date</th>
                  <th class="custom-th">Status</th>
                  <th class="custom-th">Actions</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={paginatedFormResponses} for:item="response">
                  <tr key={response.Id} class="custom-tr">
                    <td class="custom-td">
                      <a
                        href="javascript:void(0);"
                        onclick={handleFormHistoryClick}
                        data-id={response.Id}
                        style="
                          color: #0070d2;
                          text-decoration: underline;
                          cursor: pointer;
                        "
                      >
                        {response.Name__c}
                      </a>
                    </td>

                    <!-- <td class="custom-td">{response.Form_Type__c}</td> -->

                    <td class="custom-td">{response.AssignedStaffName}</td>
                     <td class="custom-td">{response.SubmittedBy}</td>
                    <td class="custom-td">{response.FormattedDate}</td>
                    <td class="custom-td">
                      <span
                        class="status-indicator"
                        data-status={response.Status__c}
                      >
                        {response.Status__c}
                      </span>
                    </td>
                    <td class="custom-td custom-actions">

                      <!-- VIEW -->
                      <a
                          href="javascript:void(0);"
                          data-id={response.Id}
                          onclick={handleView}
                          title="View"
                          class="action-link"
                      >
                          <i class="material-icons view-icon" data-id={response.Id}>
                              visibility
                          </i>
                      </a>

                      &nbsp;
                     <!-- EDIT -->
                      <template if:true={response.canEdit}>
                        <a
                            href="javascript:void(0);"
                            data-id={response.Id}
                            onclick={handleEdit}
                            title="Edit"
                            class="action-link"
                        >
                            <i
                              class="material-icons edit-icon"
                              data-id={response.Id}
                            >
                                edit_document
                            </i>
                        </a>

                        &nbsp;
                      </template>

                      <!-- DELETE -->
                      <!-- <template if:true={response.canDelete}>
                        <a
                            href="javascript:void(0);"
                            data-id={response.Id}
                            onclick={handleDelete}
                            title="Delete"
                            class="action-link"
                        >
                            <i
                              class="material-icons delete-icon"
                              data-id={response.Id}
                            >
                                delete
                            </i>
                        </a>
                      </template> -->


                  </td>

                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <template if:true={showFormHistoryModal}>
            <div class="incident-history-backdrop">
              <div class="incident-history-modal">
                <div class="incident-history-header">
                  <h2>Incident Edit History</h2>
                  <button
                    class="incident-history-close"
                    onclick={closeFormHistory}
                  >
                    ×
                  </button>
                </div>
                <div class="history-timeline">
                  <template for:each={groupedFormHistory} for:item="group">
                    <div key={group.date} class="history-date-section">
                      <div class="history-date-label">{group.date}</div>
                      <template for:each={group.entries} for:item="entry">
                        <div key={entry.timestamp} class="history-entry">
                          <div class="entry-time">{entry.time}</div>
                          <div class="entry-content">
                            <div class="entry-header">
                              <div class="avatar-circle">{entry.initials}</div>
                              <div class="entry-meta">
                                <span class="entry-user">{entry.user}</span>
                                <span class="entry-action">{entry.action}</span>
                              </div>
                            </div>
                            <div class="entry-body">{entry.content}</div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <div class="incident-history-footer">
                  <lightning-button
                    label="Close"
                    onclick={closeFormHistory}
                    variant="brand-outline"
                  >
                  </lightning-button>
                </div>
              </div>
            </div>
          </template>

          <!-- Pagination Controls for Submitted Forms -->
          <template if:true={totalFormRecords}>
            <div
              class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-left_xx-large fixed-pagination" style="padding-top: 0.5em;"
            >
              <!-- Left empty column (optional for spacing) -->
              <div class="slds-col slds-size_1-of-3">
                <div class="slds-list_inline slds-p-bottom_xx-small">
                  <label
                      class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center"
                      for="recordsPerPage"
                  >
                      Page Size:
                  </label>

                  <div class="slds-select_container">
                      <select
                            class="slds-select"
                            id="recordsPerPage"
                            value={formPageSize}
                            onchange={handleFormPageSizeChange}
                        >

                          <template for:each={pageSizeOptions} for:item="option">
                              <option key={option} value={option}>
                                  {option}
                              </option>
                          </template>
                      </select>
                  </div>
              </div>

              </div>

              


              <!-- Center: Pagination Buttons with spacing -->
              <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                <div class="slds-grid slds-gutters slds-align_absolute-center">
                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableFirstFormPage}
                    icon-name="utility:jump_to_left"
                    label="First"
                    onclick={firstFormPage}
                  >
                  </lightning-button>

                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableFirstFormPage}
                    icon-name="utility:chevronleft"
                    label="Previous"
                    onclick={previousFormPage}
                  >
                  </lightning-button>

                  <span class="slds-badge slds-m-horizontal_small">
                    Showing {formPageNumber} of {totalFormPages} Page(s)
                  </span>

                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableLastFormPage}
                    icon-name="utility:chevronright"
                    label="Next"
                    onclick={nextFormPage}
                  >
                  </lightning-button>

                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableLastFormPage}
                    icon-name="utility:jump_to_right"
                    label="Last"
                    onclick={lastFormPage}
                  >
                  </lightning-button>
                </div>
              </div>

              <!-- Right: Total Records Count -->
              <div class="slds-col slds-size_1-of-3 slds-text-align_right">
                <span class="slds-badge"
                  >Total Submitted Forms: {totalFormRecords}</span
                >
              </div>
            </div>
          </template>

          
        </template>
        

      </template>

      <!-- View Mode -->
      <!-- View Mode -->
      <template if:true={isViewMode}>
          <div class="view-popup-container">
          <div class="view-popup-content">
            <div class="view-popup-header">
              <span class="view-popup-title">
                Preview: {selectedFormTitle}
              </span>

              <div class="view-popup-actions">

 <!-- PREVIOUS PAGE -->
  <span
    class="icon-btn"
    role="button"
    tabindex="0"
    title="Previous Page"
    onclick={goToPreviousViewPage}
  >
    <i class="material-icons chevron-icon">chevron_left</i>
  </span>

  <!-- PAGE INFO -->
  <span class="page-indicator">
    Page {currentViewPage} of {totalViewPages}
  </span>

  <!-- NEXT PAGE -->
  <span
    class="icon-btn"
    role="button"
    tabindex="0"
    title="Next Page"
    onclick={goToNextViewPage}
  >
    <i class="material-icons chevron-icon">chevron_right</i>
  </span>


                <span
                  class="icon-btn"
                  role="button"
                  tabindex="0"
                  title="Download PDF"
                  aria-label="Download PDF"
                  onclick={printViewPageWise}
                  onkeydown={handleIconKeydown}
                >
                  <i class="material-icons download-icon">file_download</i>
                </span>

                <span
                  class="icon-btn"
                  role="button"
                  tabindex="0"
                  title="Close"
                  aria-label="Close"
                  onclick={closeView}
                  onkeydown={handleIconKeydown}
                >
                  <i class="material-icons close-icon">close</i>
                </span>
              </div>
            </div>

            <!-- ✅ Table Container -->
            <div class="view-popup-table-container custom-scroll">
             <div class="view-grid-container">

              <template for:each={viewTableData} for:item="row">


                <!-- FORM ROW -->
                <template if:false={row.isPageBreak}>
                  <template if:true={row.isVisible}>

                   <div key={row.id} data-row-id={row.id} class="form-row">

                      <template for:each={row.cells} for:item="cell">

                        <!-- EMPTY CELL (preserves grid spacing) -->
                        <template if:true={cell.isEmpty}>
                          <div key={cell.id} class="form-cell empty-cell"></div>
                        </template>


                        <!-- NON EMPTY CELL -->
                        <template if:false={cell.isEmpty}>

                          <!-- SECTION HEADER -->
                          <template if:true={cell.isSectionHeader}>
                            <div
                              key={cell.id}
                              class="section-header"
                              style={cell.headerStyle}
                              data-type="header"
                            >
                              {cell.title}
                            </div>
                          </template>


                          <!-- NORMAL FIELD -->
                          <template if:false={cell.isSectionHeader}>

                            <div key={cell.id} class="form-field-card">

                              <div class="field-label">
                                  {cell.label}
                              </div>

                              <div class="field-value">

                                  <!-- CHECKBOX -->
                                  <template if:true={cell.isCheckbox}>
                                    <span class="checkbox-icon">{cell.value}</span>
                                  </template>

                                  <!-- FILE -->
                                  <template if:true={cell.isUploadFile}>
                                      <template for:each={cell.files} for:item="f">
                                          <img key={f.key} src={f.url} class="uploaded-image"/>
                                      </template>
                                  </template>

                                  <!-- RICH TEXT -->
                                  <template if:true={cell.isRichText}>
                                      <div class="rich-text-view"
                                          lwc:dom="manual"
                                          data-id={cell.id}>
                                      </div>
                                  </template>

                                  <!-- SIGNATURE -->
                                  <template if:true={cell.isSignature}>
                                      <img src={cell.value} class="signature-view-img"/>
                                  </template>

                                  <!-- RADIO BUTTON -->
                                  <template if:true={cell.isRadioButton}>
                                    <span class="value-text">{cell.value}</span>
                                  </template>

                                  <!-- TABLE BLOCK -->
<template if:true={cell.isTableBlock}>

  <div class="view-table-wrapper">

    <table class={cell.tableClass}>

      <!-- HEADER -->
      <template if:true={cell.hasHeader}>
        <thead>
          <tr>
            <template for:each={cell.headers} for:item="h">
              <th key={h.key}>
                {h.header}
              </th>
            </template>
          </tr>
        </thead>
      </template>

      <!-- BODY -->
      <tbody>

        <template for:each={cell.rows} for:item="r">

          <tr key={r.key}>

            <template for:each={r.cells} for:item="c">

              <td key={c.key} class={c.cellClass}>

  <!-- SECTION HEADER -->
  <template if:true={c.isSectionHeader}>
    <div
      class="section-header"
      style={c.headerStyle}
    >
      {c.title}
    </div>
  </template>

  <!-- NON HEADER -->
  <template if:false={c.isSectionHeader}>

    <!-- CHECKBOX -->
    <template if:true={c.isCheckbox}>
  <span class="checkbox-icon">{c.checkboxIcon}</span>
</template>

    <!-- FILE -->
    <template if:true={c.isUploadFile}>
      <template for:each={c.files} for:item="f">
        <img
          key={f.key}
          src={f.url}
          class="uploaded-image"
        />
      </template>
    </template>

    <!-- RICH TEXT -->
    <template if:true={c.isRichText}>
      <div
        class="rich-text-view"
        lwc:dom="manual"
        data-id={c.key}>
      </div>
    </template>

    <!-- SIGNATURE -->
    <template if:true={c.isSignature}>
      <img
        src={c.value}
        class="signature-view-img"
      />
    </template>

    <!-- RADIO -->
    <template if:true={c.isRadioButton}>
      <span class="value-text">
        {c.value}
      </span>
    </template>

    <!-- DEFAULT -->
    <template if:true={c.isRegularField}>
      <span class="value-text">
        {c.value}
      </span>
    </template>

  </template>

</td>

            </template>

          </tr>

        </template>

      </tbody>

    </table>

  </div>

</template>

                                  <!-- DEFAULT -->
                                  <template if:true={cell.isRegularField}>
                                    <span class="value-text">{cell.value}</span>
                                  </template>

                              </div>

                          </div>

                          </template>

                        </template>

                      </template>

                    </div>

                  </template>
                </template>

              </template>

            </div>
         
            </div>
          </div>
          </div>
        </template>
    </template>
    <template if:false={isFormSelected}>
      <template if:false={hideFormAccessTable}>
        <template if:true={showFormsAccess}>
          <div class="menu-container">
            <div class={designTabClass} onclick={handleDesignTab}>
              Design New Incident
            </div>
            <div class={draftTabClass} onclick={handleDraftTab}>
              Published Incidents
            </div>
            <!-- <div class={createdTabClass} onclick={handleCreatedTab}>
              Published Forms
            </div> -->

            <div style="margin-left: auto; margin-right: 0.5%">
              <lightning-button
                label="Close"
                title="Close"
                onclick={handleBackFromAccess}
                variant="brand"
              ></lightning-button>
            </div>
          </div>

          <div class="content-wrapper custom-scroll">
            <!-- Design New Forms Tab -->
            <template if:true={isDesignTabSelected}>
              <template if:true={shouldRenderFormRender}>
                <div class="form-render-wrapper">
                  <c-form-create-incident
                    orgid={orgid}
                    layout-data={receivedLayoutData}
                    onnavigateaway={handleConfirmedTabSwitch}
                    lwc:ref="formCreateIncident"
                    selected-module-type="Incident Register"
                    
                  ></c-form-create-incident>
                  <!-- trigger-new-design -->
                </div>
              </template>
            </template>
            <template if:true={isDraftTabSelected}>
              <div class="draft-wrapper">
                <c-layout-list-incident
                  layout-data={receivedLayoutData}
                  orgid={orgid}
                  form-module="Incident Register"
                ></c-layout-list-incident>
              </div>
            </template>

            <template if:true={isCreatedTabSelected}>
              <div class="incident-wrapper">
               
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 2%;
                    width: 100%;
                    padding-right: 1%;
                  "
                >
             
                  <div class="floating-label-input" style="width: 280px">
                    <span class="label-text-drop">Search Staff</span>
                    <lightning-input
                      type="search"
                      value={formAccessSearchKey}
                      onchange={handleFormAccessSearch}
                      variant="label-hidden"
                      placeholder="Search by Staff Name"
                    >
                    </lightning-input>
                  </div>

                 
                  <div
                    class="menu-icon"
                    onclick={togglePopover}
                    style="cursor: pointer"
                  >
                    <div></div>
                    <div></div>
                    <div></div>
                  </div>

                  <lightning-button
                    label="Grant Access"
                    onclick={handleBulkGrantAccessClick}
                    variant="brand"
                    style="margin-left: auto"
                  >
                  </lightning-button>
             
                </div>

                <template if:true={isPopoverVisible}>
                  <div class="blur-overlay">
                    <div class="right-align" style="width: 30%">
                      <div class="sidebar-content">
                        <div class="sidebar-header">
                          <span class="sidebar-title">Filter Staff</span>
                          <span class="close-btn" onclick={closePopover}
                            >&times;</span
                          >
                        </div>

                        <div class="filter-section">
                          <label class="section-title">Facility Name</label>
                          <div class="filter-scroll">
                            <template if:true={staffFacilityOptions}>
                              <lightning-checkbox-group
                                name="Facility"
                                options={staffFacilityOptions}
                                value={chosenFacilityValues}
                                onchange={handleCheckBoxChange}
                              >
                              </lightning-checkbox-group>
                            </template>
                          </div>
                        </div>

                        <div class="filter-section">
                          <label class="section-title">Select Role Type</label>
                          <div class="filter-scroll">
                            <template if:true={staffRoleOptions}>
                              <lightning-checkbox-group
                                name="progress"
                                options={staffRoleOptions}
                                value={chosenRoleValues}
                                onchange={handleCheckBoxChange}
                              >
                              </lightning-checkbox-group>
                            </template>
                          </div>
                        </div>
                      
                        <div class="filter-footer">
                          <lightning-button
                            label="Apply Filters"
                            onclick={closePopover}
                            variant="brand"
                            class="submit-button"
                          >
                          </lightning-button>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>

                <template if:true={recordsToDisplay}>
                  <div class="table-container">
                    <table class="custom-table">
                      <thead>
                        <tr class="custom-table-header">
                          <th class="custom-th">
                            <div style="display: flex; align-items: center">
                              <lightning-input
                                type="checkbox"
                                onchange={toggleSelectAllStaff}
                                checked={isAllStaffSelected}
                              ></lightning-input>
                              <span>Select</span>
                            </div>
                          </th>
                          <th class="custom-th">Staff Name</th>
                       
                          <th class="custom-th">Facility</th>
                     
                          <th class="custom-th">Role</th>
                          <th class="custom-th">Staff Status</th>
                        
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={recordsToDisplay} for:item="staff">
                          <tr key={staff.Id} class="custom-tr">
                            <td class="custom-td">
                              <lightning-input
                                type="checkbox"
                                data-id={staff.Id}
                                checked={staff.isSelected}
                                onchange={handleStaffSelection}
                              ></lightning-input>
                            </td>
                            <td class="custom-td">
                              {staff.firstName} {staff.lastName}
                            </td>
                                                     -->
                            <td class="custom-td">{staff.facilityName}</td>
                            <td class="custom-td">{staff.role}</td>
                            <td class="custom-td">{staff.displayStatus}</td>
                          
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>

             
                <template if:true={totalRecords}>
                  <div
                    class="slds-grid slds-align_absolute-center slds-p-around_medium"
                  >
                    <!-- Left empty column (optional) -->
                    <div class="slds-col slds-size_1-of-3"></div>

                    <!-- Center: Pagination Buttons with spacing -->
                    <div
                      class="slds-col slds-size_1-of-3 slds-text-align_center"
                    >
                      <div
                        class="slds-grid slds-gutters slds-align_absolute-center"
                      >
                        <lightning-button
                          class="slds-m-horizontal_x-small"
                          disabled={bDisableFirst}
                          icon-name="utility:jump_to_left"
                          label="First"
                          onclick={firstPage}
                        >
                        </lightning-button>

                        <lightning-button
                          class="slds-m-horizontal_x-small"
                          disabled={bDisableFirst}
                          icon-name="utility:chevronleft"
                          label="Previous"
                          onclick={previousPage}
                        >
                        </lightning-button>

                        <span class="slds-badge slds-m-horizontal_small">
                          Showing {pageNumber} of {totalPages} Page(s)
                        </span>

                        <lightning-button
                          class="slds-m-horizontal_x-small"
                          disabled={bDisableLast}
                          icon-name="utility:chevronright"
                          label="Next"
                          onclick={nextPage}
                        >
                        </lightning-button>

                        <lightning-button
                          class="slds-m-horizontal_x-small"
                          disabled={bDisableLast}
                          icon-name="utility:jump_to_right"
                          label="Last"
                          onclick={lastPage}
                        >
                        </lightning-button>
                      </div>
                    </div>

                    <!-- Right: Total Records -->
                    <div
                      class="slds-col slds-size_1-of-3 slds-text-align_right"
                    >
                      <span class="slds-badge"
                        >Total Staff: {totalRecords}</span
                      >
                    </div>
                  </div>

                <template if:true={isGrantAccessPopupOpen}>
                  <div class="grant-modal-overlay">
                    <div class="grant-modal">
                      <!-- Header -->
                      <div class="grant-modal-header">
                        <span class="grant-modal-title">
                          <template if:false={isBulkGrantMode}>
                            Grant Access to {selectedStaffName}
                          </template>
                          <template if:true={isBulkGrantMode}>
                            Grant Access to {selectedStaffNamesPreview}
                          </template>
                        </span>

                        <button
                          class="grant-modal-close"
                          onclick={closeGrantAccessPopup}
                        >
                          &times;
                        </button>
                      </div>

                      <!-- Body -->
                      <div class="grant-modal-body">
                        <!-- <p>Select the forms to grant access to this staff:</p> -->
                        <div class="floating-label-input-grant">
                          <span class="label-text-drop">Search Forms</span>
                          <lightning-input
                            type="search"
                            placeholder="Search by form name..."
                            variant="label-hidden"
                            onchange={handleFormSearch}
                          >
                          </lightning-input>
                        </div>
                        <template if:true={filteredAvailableForms}>
                          <div class="grant-form-list">
                            <template
                              for:each={filteredAvailableForms}
                              for:item="form"
                            >
                              <div key={form.Id} class="grant-form-item">
                                <label class="grant-radio-container">
                                  <input
                                    type="radio"
                                    name="form-selection"
                                    value={form.Id}
                                    checked={form.isSelected}
                                    data-id={form.Id}
                                    onchange={handleFormSelection}
                                  />
                                  <span class="grant-custom-radio"></span>
                                  <span class="grant-radio-label"
                                    >{form.Name__c}</span
                                  >
                                </label>
                              </div>
                            </template>
                          </div>
                        </template>

                        <template if:false={filteredAvailableForms}>
                          <p>No published forms available.</p>
                        </template>
                      </div>

                      <!-- Footer -->
                      <div class="grant-modal-footer">
                        <lightning-button
                          variant="brand-outline"
                          label="Cancel"
                          onclick={closeGrantAccessPopup}
                        ></lightning-button>
                        <lightning-button
                          variant="brand"
                          label="Grant Access"
                          onclick={grantAccess}
                        ></lightning-button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </template>
    </template>

    <template if:true={isFormSelected}>

      </div>

          <div class="progress-line">
            <div class="progress-fill" style={progressFillStyle}></div>
          </div>

          <!-- Step Circles -->
          <div class="step-wrapper">
            <template for:each={visualProgressSteps} for:item="step">
              <div
                key={step.index}
                class="step"
                data-index={step.index}
                onclick={handleStepClick}
              >
                <div class={step.circleClass}>
                  <template if:true={step.isCompleted}>
                    <lightning-icon
                      icon-name="utility:check"
                      size="x-small"
                      class="check-icon"
                    ></lightning-icon>
                  </template>
                </div>
                <div class={step.labelClass}>{step.label}</div>

            </template>
          </div>
        </div>

      <div class="excel-table-container custom-scroll">

                                  oninput={validateOnlyAlphabets}
                                  class="input-field"

                              <template if:false={cell.field.isDisabled}>

                            <template if:true={cell.isNumberField}>

                                    value={cell.field.value}

                                    pattern="[0-9]*"

                                    onchange={handleInputChange}
                                    class="input-field"
                                    placeholder={cell.placeholderText}

                              <template if:true={cell.isCurrency}>

                              <template if:true={cell.isDefaultNumber}>

                            <!-- ✅ Time Field (No Formatting) -->

                            <!-- ✅ Date Field (No Formatting) -->

                            <!-- ✅ Checkbox Field (Slider Toggle) -->
                            <template if:true={cell.isCheckboxField}>
                                <label class="checkbox-container">

                            <template if:true={cell.isDropdownField}>

                                      {cell.placeholderText}

                                    <option value="None">None</option>
                                    <template
                                      for:each={cell.field.options}

                                      <option

                                        value={option.value}

                                        {option.label}
                                      </option>
                                    </template>
                                  </select>
                                </template>
                                <template if:false={cell.field.isDisabled}>
                                  <!-- Enabled Single Select Dropdown -->
                                  <select
                                    data-id={cell.id}
                                    value={cell.field.value}
                                    onchange={handleInputChange}
                                    class="input-dropdown"
                                  >
                                    <option
                                      value=""
                                      disabled
                                      class="dropdown-placeholder"
                                    >
                                      {cell.placeholderText}
                                    </option>
                                    <option value="None">None</option>
                                    <template
                                      for:each={cell.field.options}
                                      for:item="option"

                                      <option
                                        key={option.label}
                                        value={option.value}
                                        selected={option.isSelected}

                              <template if:true={cell.isMultiSelect}>
                                <div class="multi-dropdown-container">

                                        <span
                                          key={option.label}

                                        >
                                          {option.label}

                                            class="remove-option"
                                            data-id={cell.id}

                                          >
                                        </span>
                                      </template>
                                    </template>
                                    <span
                                      class="multi-select-icon"

                                  <!-- Dropdown Options -->
                                  <div
                                    class="multi-dropdown-options"

                                    <template

                                    </div>
                                  </div>
                                </div>
                              </template>
                            </template>


                            <template if:true={cell.isUploadField}>

                                    &#8684; Upload Image
                                  </button>

                              
                                </div>

                             

                                <c-document-office-service
                                    data-cell-id={cell.id}
                                    context-cell-id={cell.id}

                                  >
                                  </c-document-office-service>

                                  <!-- Existing uploaded files list -->

                                      <template if:true={cell.hasUploadedFiles}>

                                            <button

                                              data-index={idx}

                                              data-url={file.url}        
                                              data-fileid={file.fileId}  
                                              onclick={handleDeleteUploadedFile}
                                            >
                                              <i class="material-icons Exupload-mi" aria-hidden="true">delete</i>
                                            </button>
                                          </div>
                                        </template>
                                      </div>
                                    </template>

                                    <!-- Fallback if meta.uploadedFiles not present but value exists -->
                                    <!-- <template if:false={cell.field.meta.uploadedFiles}>
                                      <template if:true={cell.field.value}>
                                        <div class="Exupload-filesWrap slds-m-top_small">
                                          <template for:each={cell.field.value} for:item="url" for:index="idx">
                                            <div key={url} class="Exupload-fileRow">

                                                <i class="material-icons Exupload-mi Exupload-miOpen" aria-hidden="true">file_open</i>
                                                <span class="Exupload-fileName" title={url}>File {idx}</span>

                                              <button

                                                <i class="material-icons Exupload-mi" aria-hidden="true">delete</i>

                                          </template>
                                        </div>
                                      </template>
                                    </template> -->




                              </template>

                            <!-- ✅ RADIO BUTTON TYPE -->
                            <template if:true={cell.isRadioButton}>
                              <div class="incident-radio-group">
                                <template
                                  for:each={cell.radioOptionsProcessed}
                                  for:item="option"
                                >
                                  <div
                                    key={option.optionLabel}
                                    class="incident-radio-option"
                                  >
                                    <input
                                      type="radio"
                                      class="incident-radio-input"
                                      name={cell.id}
                                      value={option.optionLabel}
                                      data-id={cell.id}
                                      data-subtype={option.subType}
                                      onchange={handleRadioChange}
                                      checked={option.isSelected}
                                    />
                                    <label class="incident-radio-label"
                                      >{option.optionLabel}</label
                                    >

                                    <template if:true={option.isSelected}>
                                      <template if:true={option.hasSubInput}>
                                        <div
                                          class="incident-radio-sub-question"
                                        >
                                          <label
                                            class="incident-radio-sub-label"
                                            >{option.subQuestion}</label
                                          >

                                          <template if:true={option.isDropdown}>
                                              <select
                                                  class="incident-radio-sub-dropdown"
                                                  data-id={cell.id}
                                                  onchange={handleRadioSubInputChange}
                                              >
                                                  <option value="">-- Select --</option>
                                                  <template
                                                      for:each={option.processedSubOptions}
                                                      for:item="val"
                                                  >
                                                      <option
                                                          key={val.value}
                                                          value={val.value}
                                                          selected={val.isSelected}
                                                      >
                                                          {val.label}
                                                      </option>
                                                  </template>
                                              </select>
                                          </template>

                                          <template
                                            if:true={option.isTextInput}
                                          >
                                            <input
                                              type="text"
                                              class="incident-radio-sub-input"
                                              data-id={cell.id}
                                              value={cell.subInputValue}
                                              onchange={handleRadioSubInputChange}
                                              placeholder="Enter here..."
                                            />
                                          </template>

                                          <template
                                            if:true={option.isRadioList}
                                          >
                                            <div
                                              class="incident-radio-sub-radiolist"
                                            >
                                              <template
                                                for:each={option.processedSubOptions}
                                                for:item="val"
                                              >
                                                <label
                                                  key={val.label}
                                                  class="incident-radio-sub-option"
                                                >
                                                  <input
                                                    type="radio"
                                                    name={cell.subRadioName}
                                                    value={val.label}
                                                    data-id={cell.id}
                                                    checked={val.isSelected}
                                                    onchange={handleRadioSubInputChange}
                                                  />
                                                  {val.label}
                                                </label>
                                              </template>
                                            </div>
                                          </template>
                                        </div>
                                      </template>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>

                            <!-- ✍️ SIGNATURE FIELD -->
                              <template if:true={cell.isSignature}>
                                <div class="signature-container">

                                  <!-- ✅ SHOW BUTTON ONLY WHEN NO SIGNATURE -->
                                  <template if:false={cell.field.value}>
                                    <button
                                      type="button"
                                      class="file-upload-button signature-upload-btn"
                                      data-id={cell.id}
                                      onclick={openSignatureModal}
                                    >
                                      &#9998; Add Signature
                                    </button>

                                  </template>

                                  <!-- ✅ SHOW PREVIEW WHEN SIGNED -->
                                  <template if:true={cell.field.value}>
                                    <div class="signature-preview-wrapper">

                                        src={cell.field.value}
                                        class="signature-preview-img"
                                        alt="signature"
                                      />

                                        class="signature-delete-btn"
                                        data-id={cell.id}
                                        onclick={handleSignatureDelete}

                                        ✕
                                      </button>

                                    </div>
                                  </template>

                                </div>
                              </template>


                              <!-- 📊 TABLE BLOCK RENDER -->
                  
                           <template if:true={cell.isTableBlock}>
