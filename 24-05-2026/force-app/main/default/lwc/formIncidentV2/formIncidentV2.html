                              <div class="ftable-wrapper">

                                <template if:true={cell.showTableNameSafe}>
                                  <div class="ftable-title">
                                    {cell.safeTableName}
                                  </div>
                                </template>

                                <table class="ftable-grid">

                                  <!-- HEADER -->
                                  <thead if:true={cell.hasHeaderSafe}>
                                    <tr>
                                     <template for:each={cell.safeColumns} for:item="col">
                                        <th key={col.key} class="ftable-head">
                                          {col.header}
                                        </th>
                                      </template>
                                    </tr>
                                  </thead>

                                  <!-- BODY -->
                                <tbody>
                                  <template if:true={cell.hasRowsSafe}>
                                  <template for:each={cell.safeRenderRows} for:item="row" for:index="rIndex">

                                    <tr key={row.value}>

                                      <template for:each={row.renderCells} for:item="col" for:index="cIndex">

                                        <td key={col.id} class="ftable-cell">

                                          <!-- ROW LABEL -->
                                          <template if:true={col.isRowLabel}>
                                            <span class="ftable-row-label">
                                              {row.value}
                                            </span>
                                          </template>

                                          <!-- EDITABLE CELL -->
                                          <template if:false={col.isRowLabel}>

                                            <template if:true={col.field}>

                                              <!-- HEADER -->
                                              <template if:true={col.field.isHeader}>
                                                <div class="fc-header" style={col.field.inlineStyle}>
                                                  {col.field.text}
                                                </div>
                                              </template>

                                              <!-- TEXT FIELD -->
                                              <template if:true={col.isTextField}>
                                                <input
                                              
                                                  type="text"
                                                  data-id={col.id}
                                                  value={col.field.value}
                                                  oninput={handleInputChange}
                                                  class="input-field"
                                                  placeholder={col.placeholderText}
                                                />
                                              </template>

                                              <!-- TEXT AREA -->
                                              <template if:true={col.isTextArea}>
                                                <textarea
                                                  data-id={col.id}
                                                  class="input-textarea"
                                                  maxlength="255"
                                                  value={col.field.value}
                                                  oninput={handleTextAreaInput}
                                                  placeholder={col.placeholderText}
                                                >
                                                </textarea>
                                              </template>

                                              <!-- ALPHA NUMERIC -->
                                              <template if:true={col.isAlphaNumeric}>
                                                <input
                                                  type="text"
                                                  data-id={col.id}
                                                  maxlength={col.field.alphaNumericLength}
                                                  pattern="[A-Za-z0-9]*"
                                                  onkeypress={restrictAlphaNumeric}
                                                  oninput={validateAlphaNumeric}
                                                  onchange={handleInputChange}
                                                  class="input-field"
                                                  value={col.field.value}
                                                  placeholder={col.placeholderText}
                                                />
                                              </template>

                                              <!-- ONLY ALPHABETS -->
                                              <template if:true={col.isOnlyAlphabets}>
                                                <input
                                                  type="text"
                                                  data-id={col.id}
                                                  maxlength={col.field.onlyAlphabetsLength}
                                                  pattern="[A-Za-z]*"
                                                  onkeypress={restrictOnlyAlphabets}
                                                  oninput={validateOnlyAlphabets}
                                                  onchange={handleInputChange}
                                                  class="input-field"
                                                  value={col.field.value}
                                                  placeholder={col.placeholderText}
                                                />
                                              </template>

                                              <!-- RICH TEXT -->
                                              <template if:true={col.isRichText}>
                                                <div
                                                  class="rich-text-editor"
                                                  data-id={col.id}
                                                  data-placeholder={col.placeholderText}
                                                  lwc:dom="manual">
                                                </div>
                                              </template>

                                              <!-- NUMBER FIELD -->
                                              <template if:true={col.isNumberField}>

                                                <!-- CONTACT NUMBER -->
                                                <template if:true={col.isContactNumber}>
                                                  <input
                                                    type="text"
                                                    data-id={col.id}
                                                    maxlength={col.field.contactNumberDigits}
                                                    pattern="[0-9]*"
                                                    onkeypress={restrictNumbersOnly}
                                                    oninput={validateNumbersOnly}
                                                    onchange={handleInputChange}
                                                    class="input-field"
                                                    value={col.field.value}
                                                    placeholder={col.placeholderText}
                                                  />
                                                </template>

                                                <!-- CURRENCY -->
                                                <template if:true={col.isCurrency}>
                                                  <input
                                                    type="text"
                                                    data-id={col.id}
                                                    data-decimals={col.field.decimalValue}
                                                    value={col.field.value}
                                                    onkeypress={restrictCurrencyInput}
                                                    oninput={validateCurrencyInput}
                                                    onchange={handleInputChange}
                                                    class="input-field"
                                                    placeholder={col.placeholderText}
                                                  />
                                                </template>

                                                <!-- DEFAULT NUMBER -->
                                                <template if:true={col.isDefaultNumber}>
                                                  <input
                                                    type="number"
                                                    data-id={col.id}
                                                    value={col.field.value}
                                                    oninput={handleInputChange}
                                                    class="input-field"
                                                    placeholder={col.placeholderText}
                                                  />
                                                </template>

                                              </template>

                                              <!-- DATE FIELD -->
                                              <template if:true={col.isDateField}>
                                                <input
                                                  type="date"
                                                  data-id={col.id}
                                                  value={col.field.value}
                                                  oninput={handleInputChange}
                                                  class="input-field"
                                                  placeholder={col.placeholderText}
                                                />
                                              </template>

                                              <!-- TIME FIELD -->
                                              <template if:true={col.isTimeField}>
                                                <input
                                                  type="time"
                                                  data-id={col.id}
                                                  value={col.field.value}
                                                  oninput={handleInputChange}
                                                  class="input-field"
                                                  placeholder={col.placeholderText}
                                                />
                                              </template>

                                              <!-- CHECKBOX -->
                                              <!-- <template if:true={col.isCheckboxField}>
                                                <label class="switch">
                                                  <input
                                                    type="checkbox"
                                                    data-id={col.id}
                                                    checked={col.field.value}
                                                    oninput={handleInputChange}
                                                  />
                                                  <span class="slider"></span>
                                                </label>
                                              </template> -->

                                            <template if:true={col.isCheckboxField}>
                                            <label class="checkbox-container">
                                              <input
                                                type="checkbox"
                                                data-id={col.id}
                                                checked={col.field.value}
                                                oninput={handleInputChange}
                                                class="blue-checkbox"
                                              />
                                              <span class="checkbox-label"></span>
                                            </label>
                                          </template>

                                              <!-- DROPDOWN -->
                                               <template if:true={col.isDropdownField}>
                                <template if:false={col.isMultiSelect}>
                                  <template if:true={col.field.isDisabled}>
                                    <!-- Disabled Single Select Dropdown -->
                                    <select
                                      data-id={col.id}
                                      value={col.field.value}
                                      class="input-dropdown"
                                      disabled
                                    >
                                      <option
                                        value=""
                                        disabled
                                        class="dropdown-placeholder"
                                      >
                                        {col.placeholderText}
                                      </option>
                                      <option value="None">None</option>
                                      <template
                                        for:each={col.field.options}
                                        for:item="option"
                                      >
                                        <option
                                          key={option.value}
                                          value={option.value}
                                          selected={option.isSelected}
                                        >
                                          {option.label}
                                        </option>
                                      </template>
                                    </select>
                                  </template>
                                  <template if:false={col.field.isDisabled}>
                                    <!-- Enabled Single Select Dropdown -->
                                    <select
                                      data-id={col.id}
                                      value={col.field.value}
                                      onchange={handleInputChange}
                                      class="input-dropdown"
                                    >
                                      <option
                                        value=""
                                        disabled
                                        class="dropdown-placeholder"
                                      >
                                        {col.placeholderText}
                                      </option>
                                      <option value="None">None</option>
                                      <template
                                        for:each={col.field.options}
                                        for:item="option"
                                      >
                                        <option
                                          key={option.value}
                                          value={option.value}
                                          selected={option.isSelected}
                                        >
                                          {option.label}
                                        </option>
                                      </template>
                                    </select>
                                  </template>
                                </template>

                                <template if:true={col.isMultiSelect}>
                                  <div class="multi-dropdown-container">
                                    <!-- Selected Options Display -->
                                    <div
                                      class="multi-selected-values"
                                      data-id={col.id}
                                      onclick={toggleDropdown}
                                    >
                                      <template
                                        for:each={col.field.options}
                                        for:item="option"
                                      >
                                        <template if:true={option.isSelected}>
                                          <span
                                            key={option.label}
                                            class="selected-option"
                                          >
                                            {option.label}
                                            <span
                                              class="remove-option"
                                              data-id={col.id}
                                              data-value={option.label}
                                              onclick={removeSelectedOption}
                                              >&times;</span
                                            >
                                          </span>
                                        </template>
                                      </template>
                                      <span
                                        class="multi-select-icon"
                                        title="Multi-select"
                                        data-id={col.id}
                                        onclick={handleIconClick}
                                        >&#10507;</span
                                      >
                                    </div>

                                    <!-- Dropdown Options -->
                                    <div
                                      class="multi-dropdown-options"
                                      if:true={col.isDropdownOpen}
                                    >
                                      <!-- ✅ SCROLLABLE OPTIONS -->
                                      <div class="multi-dropdown-list">
                                        <template
                                          for:each={col.field.options}
                                          for:item="option"
                                        >
                                          <label
                                            key={option.label}
                                            class="multi-dropdown-item"
                                          >
                                            <input
                                              type="checkbox"
                                              value={option.label}
                                              data-id={col.id}
                                              checked={option.isSelected}
                                              onchange={handleMultiSelectChange}
                                            />
                                            {option.label}
                                          </label>
                                        </template>
                                      </div>

                                      <!-- ✅ FIXED FOOTER -->
                                      <div class="multi-dropdown-footer">
                                        <button
                                          class="multi-dropdown-save"
                                          data-id={col.id}
                                          onclick={saveMultiSelect}
                                        >
                                          Save
                                        </button>
                                      </div>
                                    </div>
                                  </div>
                                </template>
                              </template>

                                              <!-- FILE UPLOAD -->
                                 


                                        <template if:true={col.isUploadField}>
                                          <div>

                                            <!-- Hidden actual input -->
                                            <input
                                              type="file"
                                              data-id={col.id}
                                              data-cell-id={col.id}
                                              class="hidden-file-input"
                                              onchange={handleFileUploadInputChange}
                                              accept="image/*"
                                              multiple
                                            />

                                            <!-- Styled button -->
                                            <button
                                              type="button"
                                              class="file-upload-button"
                                              data-id={col.id}
                                              onclick={triggerFileInput}
                                            >
                                              &#8684; Upload Image
                                            </button>

                                          </div>

                                          <!-- Upload Service -->
                                          <c-document-office-service
                                            data-cell-id={col.id}
                                            context-cell-id={col.id}
                                            record-id={recordId}
                                            module-path-from-parent="ticket"
                                            onuploadcomplete={handleAwsUploadComplete}
                                          >
                                          </c-document-office-service>

                                          <!-- Existing uploaded files -->
                                          <template if:true={col.field.meta.uploadedFiles}>
                                            <div class="Exupload-filesWrap">

                                              <template
                                                for:each={col.field.meta.uploadedFiles}
                                                for:item="file"
                                                for:index="idx"
                                              >

                                                <div key={file.fileId} class="Exupload-fileRow">

                                                  <a
                                                    class="Exupload-fileLink"
                                                    href={file.url}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                  >
                                                    <i class="material-icons Exupload-mi Exupload-miOpen">file_open</i>

                                                    <span
                                                      class="Exupload-fileName"
                                                      title={file.originalName}
                                                    >
                                                      {file.originalName}
                                                    </span>

                                                  </a>

                                                  <button
                                                    type="button"
                                                    class="Exupload-iconBtn Exupload-iconBtnDanger"
                                                    title="Delete file"
                                                    aria-label="Delete file"
                                                    data-cellid={col.id}
                                                    data-index={idx}
                                                    data-key={file.key}
                                                    data-url={file.url}
                                                    data-fileid={file.fileId}
                                                    onclick={handleDeleteUploadedFile}
                                                  >
                                                    <i class="material-icons Exupload-mi">delete</i>
                                                  </button>

                                                </div>

                                              </template>

                                            </div>
                                          </template>

                                        </template>

                                              <!-- RADIO BUTTON -->
                              

                                              <template if:true={col.isRadioButton}>
                                <div class="incident-radio-group">
                                  <template
                                    for:each={col.radioOptionsProcessed}
                                    for:item="option"
                                  >
                                    <div
                                      key={option.optionLabel}
                                      class="incident-radio-option"
                                    >
                                      <input
                                        type="radio"
                                        class="incident-radio-input"
                                        name={col.id}
                                        value={option.optionLabel}
                                        data-id={col.id}
                                        data-subtype={option.subType}
                                        onchange={handleRadioChange}
                                        onclick={stopPropagation}
                                        checked={option.isSelected}
                                      />
                                      <label class="incident-radio-label"
                                        >{option.optionLabel}</label
                                      >

                                      <template if:true={option.isSelected}>
                                        <template if:true={option.hasSubInput}>
                                          <div
                                            class="incident-radio-sub-question"
                                          >
                                            <label
                                              class="incident-radio-sub-label"
                                              >{option.subQuestion}</label
                                            >

                                            <template
                                              if:true={option.isDropdown}
                                            >
                                              <select
                                                class="incident-radio-sub-dropdown"
                                                data-id={col.id}
                                                onchange={handleRadioSubInputChange}
                                              >
                                                <option value="">
                                                  -- Select --
                                                </option>
                                                <template
                                                  for:each={option.processedSubOptions}
                                                  for:item="val"
                                                >
                                                  <option
                                                    key={val.value}
                                                    value={val.value}
                                                    selected={val.isSelected}
                                                  >
                                                    {val.label}
                                                  </option>
                                                </template>
                                              </select>
                                            </template>

                                            <template
                                              if:true={option.isTextInput}
                                            >
                                              <input
                                                type="text"
                                                class="incident-radio-sub-input"
                                                data-id={col.id}
                                                value={col.subInputValue}
                                                onchange={handleRadioSubInputChange}
                                                placeholder="Enter here..."
                                              />
                                            </template>

                                            <template
                                              if:true={option.isRadioList}
                                            >
                                              <div
                                                class="incident-radio-sub-radiolist"
                                              >
                                                <template
                                                  for:each={option.processedSubOptions}
                                                  for:item="val"
                                                >
                                                  <label
                                                    key={val.label}
                                                    class="incident-radio-sub-option"
                                                  >
                                                    <input
                                                      type="radio"
                                                      name={col.subRadioName}
                                                      value={val.label}
                                                      data-id={col.id}
                                                      checked={val.isSelected}
                                                      onchange={handleRadioSubInputChange}
                                                    />
                                                    {val.label}
                                                  </label>
                                                </template>
                                              </div>
                                            </template>
                                          </div>
                                        </template>
                                      </template>
                                    </div>
                                  </template>
                                </div>
                              </template>

                                              <!-- SIGNATURE -->
                                              <template if:true={col.isSignature}>

                                                <div class="signature-container">

                                                  <template if:false={col.field.value}>

                                                    <button
                                                      type="button"
                                                      class="file-upload-button signature-upload-btn"
                                                      data-id={col.id}
                                                      onclick={openSignatureModal}
                                                    >
                                                      Add Signature
                                                    </button>

                                                  </template>

                                                  <template if:true={col.field.value}>

                                                    <div class="signature-preview-wrapper">

                                                      <img
                                                        src={col.field.value}
                                                        class="signature-preview-img"
                                                      />

                                                      <button
                                                        class="signature-delete-btn"
                                                        data-id={col.id}
                                                        onclick={handleSignatureDelete}
                                                      >
                                                        ✕
                                                      </button>

                                                    </div>

                                                  </template>

                                                </div>

                                              </template>

                                                <!-- Rich Text Field -->
                                              <template if:true={col.field.isRichTextDisplay}>
                                                  <div class="rich-text-preview-container">
                                                      <div
                                                          class="rich-text-preview"
                                                          data-id={col.id}
                                                          lwc:dom="manual">
                                                      </div>
                                                  </div>
                                              </template>

                                            </template>

                                          </template>

                                        </td>

                                      </template>

                                    </tr>

                                  </template>
                                  </template>
                                </tbody>

                                </table>

                              </div>
                              </template>
                            </template>
                        <!-- TABLE BLOCK complete -->

                          <!-- Rich Text Field -->
                            <template if:true={cell.field.isRichTextDisplay}>
                              <div class="rich-text-preview-container">
                                  <div
                                      class="rich-text-preview"
                                      data-id={cell.id}
                                      lwc:dom="manual">
                                  </div>
                              </div>
                          </template>


                          </div>
                        </template>
                      </div>
                    </template>
                  </template>
                </template>
              </div>
            </template>

      </div>

      <div class="form-actions">
        <lightning-button
          variant="brand-outline"
          label="Cancel"
          onclick={handleinputCancel}
        ></lightning-button>
        <div class="form-navigation-buttons">
          <button
            class="circle-btn prev"
            onclick={goToPreviousPage}
            disabled={isFirstPage}
          >
            &#8592;
          </button>

          <span class="page-info"
            >Page {currentPageDisplay} of {totalFormPages}</span
          >

          <button
            class="circle-btn next"
            onclick={goToNextPage}
            disabled={isLastPage}
          >
            &#8594;
          </button>
        </div>
        <lightning-button
          variant="brand"
          label="Submit"
          onclick={handleSubmit}
        ></lightning-button>
      </div>
    </template>
    </template>
  </div>


<template if:true={showDeleteConfirm}>
  <section
    aria-describedby="modal-content-id-delete"
    aria-labelledby="modal-heading-delete"
    aria-modal="true"
    class="slds-modal slds-fade-in-open"
    role="dialog"
    tabindex="-1"

        <h2
          class="slds-text-heading_medium slds-hyphenate"

          Delete Confirmation
        </h2>
      </header>

      <!-- Modal Content -->
      <div class="slds-modal__content slds-p-around_medium modal-content">
        <div class="slds-m-around_small" style="text-align:center">
          <h1>
            <p>Are you sure you want to delete this form response?</p>
          </h1>
          <p class="slds-m-top_small">

          <!-- Centered Buttons -->

<template if:true={isLoading}>
    <div class="overlay-logo"></div>

    <div class="spinner-wrapper">
      <div class="loader-container">
        <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
        <img src={imageUrl} alt="T Logo" class="Tlogo" />
      </div>

  <template if:true={showSignatureModal}>

  <div class="assign-modal-backdrop">

      <div class="assign-modal-header">
        <span class="assign-title">
          Add Signature
        </span>

        <button
          class="assign-close-button"
          onclick={closeSignatureModal}>
          ×
        </button>
      </div>

  <div class="signature-mode-panel">

        <button
          class="signature-clear-inline"

      {signatureTypedText}
    </div>

</template>


        <!-- UPLOAD MODE -->

      </div>

      <!-- ================= FOOTER ================= -->
      <div class="assign-modal-footer">
        <button
          class="assign-primary slds-button slds-button_brand"
          onclick={saveSignature}>
          Save Signature
        </button>
      </div>

    </div>

  </div>

</template>

 <template if:true={showUpgradeModal}>

<!-- ========================================================
     GET NOTIFIED MODAL
     ======================================================== -->
<template if:true={showNotifyModal}>
    <section
        aria-describedby="modal-notify-content"
        aria-labelledby="modal-notify-heading"
        aria-modal="true"
        class="slds-modal slds-fade-in-open"
        role="dialog"
        tabindex="-1">

        <div class="slds-modal__container notify-modal-container">

            <!-- ────────────────────────
                 HEADER
                 ──────────────────────── -->
            <header class="slds-modal__header notify-modal-header">

                <!-- Close X -->
                <!-- <button
                    class="slds-button slds-button_icon slds-modal__close notify-close-x"
                    title="Close"
                    onclick={handleCloseNotifyModal}>
                    <lightning-icon
                        icon-name="utility:close"
                        size="small"
                        alternative-text="Close">
                    </lightning-icon>
                </button> -->

                <div class="notify-header-inner">
                   
                    <i class="material-icons view-icon" style="margin-right: 8px;">
                              notifications
                          </i>
                    <h2 id="modal-notify-heading" class="notify-modal-title">
                        Get Notified
                    </h2>
                </div>

                <p class="notify-modal-subtitle">
                    Configure who receives email alerts when an incident is raised, based on priority.
                </p>

            </header>

            <!-- ────────────────────────
                 BODY
                 ──────────────────────── -->
            <div id="modal-notify-content"
                class="slds-modal__content slds-p-around_medium notify-modal-body">

                <!-- Loading spinner -->
                <template if:true={isNotifyLoading}>
                    <div class="notify-loader">
                        <div class="notify-spinner"></div>
                        <span>Loading users...</span>
                    </div>
                </template>

                <template if:false={isNotifyLoading}>

                    <!-- ══════════════════════════════════════════
                        SAME ROW — Priority (left) + Users (right)
                        ══════════════════════════════════════════ -->
                    <div class="notify-two-col-row">

                        <!-- ── LEFT CARD: Priority ── -->
                        <div class="notify-card notify-card-priority">

                            <div class="notify-section-label">
                                <span class="notify-step-badge">1</span>
                                Priority Level
                                <span class="notify-required">*</span>
                            </div>

                            <div class="notify-priority-group">

                                <!-- HIGH -->
                                <button
                                    data-value="High"
                                    onclick={handlePrioritySelect}
                                    class={notifyHighClass}>
                                    <span class="notify-priority-dot notify-dot-high"></span>
                                    High
                                    <template if:true={notifyHighCount}>
                                        <span class="notify-count-badge">{notifyHighCount}</span>
                                    </template>
                                </button>

                                <!-- MEDIUM -->
                                <button
                                    data-value="Medium"
                                    onclick={handlePrioritySelect}
                                    class={notifyMediumClass}>
                                    <span class="notify-priority-dot notify-dot-medium"></span>
                                    Medium
                                    <template if:true={notifyMediumCount}>
                                        <span class="notify-count-badge">{notifyMediumCount}</span>
                                    </template>
                                </button>

                                <!-- LOW -->
                                <button
                                    data-value="Low"
                                    onclick={handlePrioritySelect}
                                    class={notifyLowClass}>
                                    <span class="notify-priority-dot notify-dot-low"></span>
                                    Low
                                    <template if:true={notifyLowCount}>
                                        <span class="notify-count-badge">{notifyLowCount}</span>
                                    </template>
                                </button>

                            </div>

                            <p class="notify-helper-text">
                                Click a priority then pick users on the right.
                            </p>

                        </div>

                        <!-- ── RIGHT CARD: User Selection ── -->
                        <div class="notify-card notify-card-users">

                            <div class="notify-section-label">
                                <span class="notify-step-badge">2</span>
                                Users to Notify
                                <span class="notify-required">*</span>
                                <span class="notify-role-hint">(Admins &amp; Managers)</span>
                            </div>

                            <!-- Placeholder before priority is chosen -->
                            <template if:false={notifySelectedPriority}>
                                <div class="notify-pick-priority-hint">
                                     <i class="material-icons">
                                        chevron_left
                                    </i>
                                    <span>Select a priority first</span>
                                </div>
                            </template>

                            <!-- Combobox — shown after priority selected -->
                            <template if:true={notifySelectedPriority}>

                                <div class="notify-active-priority-label">
                                    Configuring:&nbsp;
                                    <span class="notify-priority-pill notify-pill-{notifySelectedPriorityLower}">
                                        {notifySelectedPriority}
                                    </span>
                                </div>

                                <template if:true={notifyUserComboboxOptions.length}>
                                    <c-tesseract-apps-multi-combobox
                                        required
                                        data-id="notify-user-combobox"
                                        data-label="Users to Notify"
                                        options={notifyUserComboboxOptions}
                                        placeholder="Search and select users..."
                                        value={notifySelectedUserValues}
                                        onchange={handleNotifyComboboxChange}>
                                    </c-tesseract-apps-multi-combobox>
                                </template>

                                <!-- No users fallback -->
                                <template if:false={notifyUserComboboxOptions.length}>
                                    <div class="notify-empty-state">
                                        <lightning-icon
                                            icon-name="utility:warning"
                                            size="x-small"
                                            style="color: #dd7a01;">
                                        </lightning-icon>
                                        <span>No admin or manager users found.</span>
                                    </div>
                                </template>

                                <!-- Selected chips -->
                                <template if:true={hasNotifySelectedUsers}>
                                    <div class="notify-chips-wrap notify-chips-inline">
                                        <template for:each={notifySelectedUserChips} for:item="chip">
                                            <span key={chip.value} class="notify-chip">
                                                <span class="notify-chip-avatar">{chip.initials}</span>
                                                {chip.label}
                                                <template if:true={chip.role}>
                                                    <span class="notify-chip-role">{chip.role}</span>
                                                </template>
                                            </span>
                                        </template>
                                    </div>
                                </template>

                            </template>

                        </div>
                        <!-- end right card -->

                    </div>
                    <!-- end two-col-row -->


                    <!-- ══════════════════════════════════════════
                        SUMMARY BOX
                        ══════════════════════════════════════════ -->
                    <template if:true={notifyModalSummary}>
                        <div class="notify-summary-box">
                            <lightning-icon
                                icon-name="utility:check"
                                size="x-small"
                                style="margin-right: 8px; color: #2e7d32; flex-shrink: 0;">
                            </lightning-icon>
                            {notifyModalSummary}
                        </div>
                    </template>


                    <!-- ══════════════════════════════════════════
                        CONFIG OVERVIEW (all 3 priorities)
                        ══════════════════════════════════════════ -->
                    <template if:true={hasAnyNotifyConfig}>
                        <div class="notify-config-overview">

                            <div class="notify-config-title">Current Notification Setup</div>

                            <!-- High -->
                            <div class="notify-config-row">
                                <span class="notify-dot-sm notify-dot-high"></span>
                                <span class="notify-config-priority-label">High</span>
                                <span class="notify-config-names">{notifyHighSummary}</span>
                                <template if:true={notifyHighCount}>
                                    <span class="notify-config-badge notify-badge-high">
                                        {notifyHighCount} user(s)
                                    </span>
                                </template>
                            </div>

                            <!-- Medium -->
                            <div class="notify-config-row">
                                <span class="notify-dot-sm notify-dot-medium"></span>
                                <span class="notify-config-priority-label">Medium</span>
                                <span class="notify-config-names">{notifyMediumSummary}</span>
                                <template if:true={notifyMediumCount}>
                                    <span class="notify-config-badge notify-badge-medium">
                                        {notifyMediumCount} user(s)
                                    </span>
                                </template>
                            </div>

                            <!-- Low -->
                            <div class="notify-config-row">
                                <span class="notify-dot-sm notify-dot-low"></span>
                                <span class="notify-config-priority-label">Low</span>
                                <span class="notify-config-names">{notifyLowSummary}</span>
                                <template if:true={notifyLowCount}>
                                    <span class="notify-config-badge notify-badge-low">
                                        {notifyLowCount} user(s)
                                    </span>
                                </template>
                            </div>

                        </div>
                    </template>

                </template>
                <!-- end if:false isNotifyLoading -->

            </div>
            <!-- end modal body -->


            <!-- ────────────────────────
                 FOOTER
                 ──────────────────────── -->
            <footer class="slds-modal__footer notify-modal-footer">

                <lightning-button
                    label="Cancel"
                    variant="brand-outline"
                    onclick={handleCloseNotifyModal}>
                </lightning-button>

                <lightning-button
                    label="Save Preferences"
                    variant="brand"
                    disabled={isSaveNotifyDisabled}
                    onclick={handleSaveNotifyPreferences}>
                </lightning-button>

            </footer>

        </div>
    </section>

    <!-- Backdrop -->
    <div class="slds-backdrop slds-backdrop_open"></div>

</template>


</template>
