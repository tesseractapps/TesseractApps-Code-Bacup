<template>
    <div class="container-box">
        <div style="padding: 8px 0px 0 20px;"> 
            <h3 slot="title">
                <span style="font-size: 100%;font-weight:bold;">{preferredParticipantName} Schedule</span>
            </h3>
        </div>
        <br>

        <div class="schedule-wrapper">
            <!-- Time Slots Column -->
            <div class="time-slots">
                <div class="time-header">
                    <lightning-icon icon-name="utility:clock" size="x-small"></lightning-icon>
                </div>
                <div class="time-slots-content">
                    <template for:each={timeSlots} for:item="timeSlot">
                        <div key={timeSlot} class="time-slot">
                            {timeSlot}
                        </div>
                    </template>
                </div>
            </div>

            <!-- Schedule Grid -->
            <div class="schedule-grid">
                <!-- Header with overlap indicator -->
                <div class="schedule-header">
                    <span class="header-text">Services</span>
                </div>

                <!-- Grid Lines -->
                <div class="grid-lines">
                    <template for:each={timeSlots} for:item="timeSlot">
                        <div key={timeSlot} class="grid-line"></div>
                    </template>
                </div>

                <!-- Events Container -->
                <div class="events-container">
                    <template for:each={positionedEvents} for:item="event">
                        <div key={event.id} class="event-card" style={event.cardStyle}>
                            <div class="event-content">
                                <div class="event-header">
                                    <div class="event-time-display">
                                        <lightning-icon icon-name="utility:clock" size="xx-small"></lightning-icon>
                                        <span class="time-text">{event.timeDisplay}</span>
                                    </div>
                                </div>
                                
                                <div class="event-details">
                                    <div class="service-icon" style={event.iconStyle}>
                                        <lightning-icon icon-name={event.iconName} size="xx-small"></lightning-icon>
                                    </div>
                                    <div class="event-info">
                                        <p class="event-title">{event.title}</p>
                                        <template if:true={event.resourceName}>
                                            <p class="event-resource">{event.resourceName}</p>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
