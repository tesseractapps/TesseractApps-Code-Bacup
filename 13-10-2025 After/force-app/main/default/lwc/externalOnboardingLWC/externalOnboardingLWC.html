<template>
 <template if:true={showForm}>
    <template if:false={isSubmitted}>
  <div class="page-wrap">
    <!-- LEFT HERO -->
   <aside class="hero">
  <div class="hero-card">
    <!-- org name with animated gradient -->
    <template if:true={orgDisplayName}>
      <div class="brand-name brand-name--animated" title={orgDisplayName}>
        {orgDisplayName}
      </div>
    </template>

    <h2 class="hero-title">Welcome to the Team!</h2>
    <p class="hero-copy">
      We're glad to have you here.<br/>
      Provide your details now and be ready<br/>
      to dive into your role with ease.
    </p>
    <p class="hero-foot">Your information stays private and secure.</p>

    <!-- Illustration centered under the text -->
    <img class="hero-illust" src={onboardUrl} alt="Onboarding" />

    <!-- Watermark bottom-right -->

  </div>
</aside>


    <!-- RIGHT FORM -->
    <main class="form-wrap">
      <div class="form-header">
        <h1 class="form-title">We just need a few details to set up your account.</h1>
        <hr class="form-rule" />
      </div>
          <div class="content-wrapper">
              <!-- Form Fields -->
              <div class="slds-grid slds-wrap" style="padding: 20px 0px;">
                  <!-- First Name -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>First Name</span>
                          <lightning-input label="First Name" variant="label-hidden" value={firstName}
                              onchange={handleFieldChange} data-field="firstName" required></lightning-input>
                      </div>
                  </div>

                  <!-- Last Name -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Last Name</span>
                          <lightning-input label="Last Name" variant="label-hidden" value={lastName}
                              onchange={handleFieldChange} data-field="lastName" required></lightning-input>
                      </div>
                  </div>

                  <!-- Gender -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Gender</span>
                          <lightning-combobox label="Gender" value={selectedGender} options={genderOptions}
                              onchange={handleGenderChange} required variant="label-hidden"></lightning-combobox>
                      </div>
                  </div>

                  <!-- Contact Number -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Contact Number</span>
                          <lightning-input label="Phone Number" variant="label-hidden" type="tel" value={phoneNumber}
                              onchange={PhonenumberChange} pattern="[0-9]{10}" maxlength="10" required></lightning-input>
                      </div>
                  </div>

                  <!-- Email ID -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Email ID</span>
                          <lightning-input label="Email Address" variant="label-hidden" type="email" value={email}
                              onchange={handleFieldChange} disabled data-field="email" required></lightning-input>
                      </div>
                  </div>

                  <!-- Date of Birth -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Date of Birth</span>
                          <lightning-input label="Date of Birth" variant="label-hidden" type="date" value={dateOfBirth}
                              onchange={handleFieldChange} data-field="dateOfBirth" required></lightning-input>
                      </div>
                  </div>

                   <!-- Facility -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop"><span style="color:red">*</span>Facility</span>
                           <lightning-combobox
                                data-id="facility"
                                name="StaffFacility"
                                class="StaffFacility"
                                variant="label-hidden"
                                disabled
                                options={finalListFacilities}
                                value={StaffFacility}
                                onchange={handleFacilityChange}>
                                </lightning-combobox>

                        </div>
                  </div>


                  <!-- Role -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Manager</span>
                          <lightning-input variant="label-hidden" value={managerName} disabled></lightning-input>
                      </div>
                  </div>

                 <template if:false={hideEmploymentFields}>
                  <!-- Hourly Rate -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Hourly Rate</span>
                          <lightning-input label="Hourly Rate" variant="label-hidden" type="number" value={hourlyRate}
                              onchange={handleFieldChange} data-field="hourlyRate" step="0.01" min="0" required></lightning-input>
                      </div>
                  </div>

                  <!-- Tax File Number -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Tax File Number</span>
                          <lightning-input label="Tax File Number" type="text" value={taxFileNumber}
                              onchange={handleFieldChange} data-field="taxFileNumber" pattern="[0-9]*" required
                              variant="label-hidden"></lightning-input>
                      </div>
                  </div>

                  <!-- Tax Free Threshold -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Tax Free Threshold</span>
                          <lightning-combobox label="Tax Free Threshold" value={selectedTaxFree} options={taxFreeOptions}
                              onchange={handleTaxFreeThreesholdChange} required variant="label-hidden"></lightning-combobox>
                      </div>
                  </div>

                  <!-- Start Date -->
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
                      <div class="floating-label">
                          <span class="label-text-drop"><span style="color:red">*</span>Start Date</span>
                          <lightning-input label="Start Date" type="date" value={startDate} onchange={handleFieldChange}
                              data-field="startDate" required variant="label-hidden"></lightning-input>
                      </div>
                  </div>

                 </template>

                 <template if:true={hideEmploymentFields}>
  <!-- Primary Contact - First Name -->
  <!-- ===== Primary Contact (Section Header + Divider) ===== -->
<div class="slds-size_1-of-1 slds-p-horizontal_small slds-m-top_large">
  <h2 class="slds-text-title_caps slds-m-bottom_x-small">Primary Contact</h2>
  <div class="slds-border_bottom slds-m-bottom_small"></div>
</div>

<!-- Primary Contact - First Name -->
<div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
  <div class="floating-label">
    <span class="label-text-drop"><span style="color:red">*</span>First Name</span>
    <lightning-input
      label="First Name"
      variant="label-hidden"
      type="text"
      value={pcFirstName}
      data-field="pcFirstName"
      onchange={handleFieldChange}
      required>
    </lightning-input>
  </div>
</div>

<!-- Primary Contact - Last Name -->
<div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
  <div class="floating-label">
    <span class="label-text-drop"><span style="color:red">*</span>Last Name</span>
    <lightning-input
      label="Last Name"
      variant="label-hidden"
      type="text"
      value={pcLastName}
      data-field="pcLastName"
      onchange={handleFieldChange}
      required>
    </lightning-input>
  </div>
</div>

<!-- Primary Contact - Relationship -->
<div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
  <div class="floating-label">
    <span class="label-text-drop"><span style="color:red">*</span>Relationship</span>
    <lightning-input
      label="Relationship"
      variant="label-hidden"
      type="text"
      value={pcRelationship}
      data-field="pcRelationship"
      onchange={handleFieldChange}
      required>
    </lightning-input>
  </div>
</div>

<!-- Primary Contact - Primary Contact Number -->
<div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_small">
  <div class="floating-label">
    <span class="label-text-drop"><span style="color:red">*</span>Primary Contact Number</span>
    <lightning-input
      label="Primary Contact Number"
      variant="label-hidden"
      type="tel"
      value={pcPhone}
      onchange={handlePrimaryContactPhoneChange}
      required
      pattern="[0-9]*"
      message-when-pattern-mismatch="Use digits only">
    </lightning-input>
  </div>
</div>

</template>

              </div>

              <!-- Address Section -->
              <div class="slds-grid slds-wrap slds-gutters" style="padding-left: 23px;">
                  <div style="color:red;">{errorMessage}</div>
                  <lightning-input-address address-label="Address" street-label="Street" city-label="Suburb"
                      country-label="Country" province-label="State" postal-code-label="Post Code" street={street}
                      city={city} country={country} province={province} postal-code={postalcode}
                      onchange={addressInputChange} show-address-lookup required="true"></lightning-input-address>
              </div>
          </div>

          <div class="button-row">
        <div class="custom-edit-btn" data-id={recordId} onclick={handleUserCreation}>
          SUBMIT
        </div>
      </div>
          <img class="hero-watermark" src={tesseractLogoUrl} alt="Tesseract logo" />
    </main>
  </div>
    </template>

    <template if:true={isSubmitted}>
  <section class="ty-wrap">
    <!-- celebratory burst behind the card -->
    <div class="ty-burst"></div>

    <div class="ty-card">
      <div class="ty-icon">🎉</div>
      <h1 class="ty-title">Thank you!</h1>
      <p class="ty-sub">Your details have been submitted successfully.</p>
      <div class="ty-subtle">You can safely close this tab.</div>
    </div>

   <div class={confettiHostClass} style={confettiHostStyle}>
  <template for:each={confettiPieces} for:item="c">
    <span key={c.id} class={c.className} style={c.style}></span>
  </template>
</div>



  </section>
</template>
  </template>


<template if:true={linkInactive}>
  <section class="inactive-wrap">
    <div class="inactive-card" role="status" aria-live="polite">
      <h1 class="inactive-title">This link is no longer active</h1>
    </div>
  </section>
</template>

<template if:true={linkExpired}>
  <section class="inactive-wrap">
    <div class="inactive-card">
      <h1 class="inactive-title">This link has expired</h1>
      <p class="inactive-sub">
        The onboarding link expired on {decoded.exp}.
      </p>
      <div class="inactive-subtle">
        Please contact your HR team or manager to request a new link.
      </div>
    </div>
  </section>
</template>



</template>
