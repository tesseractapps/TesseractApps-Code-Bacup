<template>
    <lightning-card>
        <div if:true={isDesktop}>
            <div class="slds-grid slds-gutters ">
                <div style="width:50%;float:left;margin-left:3%" class="slds-grid">
                    <div class="slds-size_1-of-4 ">
                        <span class="  slds-size_1-of-4 geeks  ">
                            <img class="slds-m-around_large" style="max-height: 95px; max-width: 95px;" title="Admin"
                                alt="Administration" name="Administration" src={admin}
                                onclick={navigateToAdministrationPage} />
                        </span>
                        <span class=" slds-size_1-of-4 geeks slds-m-around_large slds-m-bottom_medium">
                            <img class="slds-m-around_large" style="max-height: 95px; max-width: 95px"
                                title="Issue Register" alt="Issue" name="Issue" src={Issue}
                                onclick={navigateToIssueRegisterPage} />
                        </span>
                        <span class="  slds-size_1-of-4 geeks slds-m-around_large slds-m-bottom_medium">
                            <img class="slds-m-around_large" style="max-height: 95px; max-width: 95px"
                                title="Facilities" alt="facility" name="facility" src={facility}
                                onclick={navigateToFacilityPage} />
                        </span>
                    </div>
                    <div class="slds-size_1-of-4 ">
                        <span class=" slds-size_1-of-4 geeks slds-m-around_large ">
                            <img class="slds-m-around_large" style="max-height: 95px; max-width: 95px" title="Auditor"
                                alt="audit" name="audit" src={audit} onclick={navigateToAuditPage} />
                        </span>
                        <span class="  slds-size_1-of-4 geeks slds-m-around_large ">
                            <img class="slds-m-around_large" style="max-height: 95px; max-width: 95px"
                                title="Human Resources" alt="HR" name="HR" src={HR} onclick={navigateToHRPage} />
                        </span>
                        <span class=" slds-size_1-of-4 geeks slds-m-around_large ">
                            <img class="slds-m-around_large" style="max-height: 95px; max-width: 95px"
                                title="Participants" alt="Search" name="Search" src={Search}
                                onclick={navigateToClientSearchPage} />
                        </span>

                    </div>
                    <div class="slds-size_1-of-4 ">
                        <span class="  slds-size_1-of-4 geeks slds-m-around_large ">
                            <img class="slds-m-around_large" style="max-height: 95px; max-width: 95px"
                                title="Roster Management" alt="Attendence" name="Attendence" src={Notification}
                                onclick={navigateToRoasterManagement} />
                        </span>
                        <span class="  slds-size_1-of-4 geeks slds-m-around_large ">
                            <img class="slds-m-around_large" style="max-height: 95px; max-width: 95px" title="Pay Roll"
                                alt="payroll" name="payroll" src={payroll} onclick={navigateToPayRoll} />
                        </span>
                        <span class="  slds-size_1-of-4 geeks slds-m-around_large">
                            <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px" title="Repository"
                                alt="Valut" name="Valut" src={valut} onclick={navigateToRepository} />
                        </span>
                    </div>
                </div>
                <div style="width:50%;float:right" class="slds-m-around_medium ">
                    <img class="slds-m-around_large" style="max-height: 45px; max-width: 45px" title="Tasks" alt="Tasks"
                        name="Valut" src={tasks} />
                    <b style="font-size:15px">Tasks : {todayDate}</b>

                    <div>
                        <div class="slds-box slds-m-right_medium">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered ">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th class="" scope="col">
                                            Description
                                        </th>
                                        <th class="" scope="col">
                                            Status
                                        </th>
                                        <th class="" scope="col">
                                            Due Date
                                        </th>
                                        <th class="" scope="col">
                                            Created By
                                        </th>
                                        <th class="" scope="col">
                                            Action
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template if:true={taskDetailsValues}>
                                        <template for:each={taskDetailsValues} for:item="taskRec">
                                            <template if:true={taskRec.NewValue__c}>
                                                <tr class="slds-hint-parent" key={taskRec.Id}>
                                                    <td>
                                                        <div class="slds-cell-wrap">{taskRec.Subject}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap slds-badge slds-theme_warning">
                                                            {taskRec.Status}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap">{taskRec.dueDate}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap">
                                                            <img src={taskRec.CreatedBy.SmallPhotoUrl} height="40px" width="40px" style="border-radius: 50%;"/>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap slds-align_absolute-center">
                                                            <lightning-button icon-name="utility:edit"
                                                                data-id={taskRec.Id} onclick={taskEdit}
                                                                variant="base"></lightning-button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                            <template if:true={taskRec.InProgressValue__c}>
                                                <tr class="slds-hint-parent" key={taskRec.Id}>
                                                    <td>
                                                        <div class="slds-cell-wrap">{taskRec.Subject}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap slds-badge slds-theme_error">
                                                            {taskRec.Status}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap">{taskRec.dueDate}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap">
                                                            <img src={taskRec.CreatedBy.SmallPhotoUrl} height="40px" width="40px" style="border-radius: 50%;"/>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap slds-align_absolute-center">
                                                            <lightning-button icon-name="utility:edit"
                                                                data-id={taskRec.Id} onclick={taskEdit}
                                                                variant="base"></lightning-button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                            <template if:true={taskRec.Completed__c}>
                                                <tr class="slds-hint-parent" key={taskRec.Id}>
                                                    <td>
                                                        <div class="slds-cell-wrap">{taskRec.Subject}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap slds-badge slds-theme_success">
                                                            {taskRec.Status}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap">{taskRec.dueDate}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap">
                                                            <img src={taskRec.CreatedBy.SmallPhotoUrl} height="40px" width="40px" style="border-radius: 50%;"/>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-cell-wrap slds-align_absolute-center">
                                                            <lightning-button icon-name="utility:edit"
                                                                data-id={taskRec.Id} onclick={taskEdit}
                                                                variant="base"></lightning-button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </template>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>                   
                </div>
            </div>
        </div>
        <div if:true={isMobile}>
            <div class="slds-grid slds-wrap">
                <div class="slds-size_1-of-3 ">
                    <span class="  slds-size_1-of-4 geeks  ">
                        <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px;" title="Admin"
                            alt="Administration" name="Administration" src={admin}
                            onclick={navigateToAdministrationPage} />
                    </span>
                    <span class=" slds-size_1-of-4 geeks slds-m-around_large slds-m-bottom_medium">
                        <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px"
                            title="Issue Register" alt="Issue" name="Issue" src={Issue}
                            onclick={navigateToIssueRegisterPage} />
                    </span>
                    <span class="  slds-size_1-of-4 geeks slds-m-around_large slds-m-bottom_medium">
                        <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px" title="Facilities"
                            alt="facility" name="facility" src={facility} onclick={navigateToFacilityPage} />
                    </span>
                </div>
                <div class="slds-size_1-of-3 ">
                    <span class=" slds-size_1-of-4 geeks slds-m-around_large ">
                        <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px" title="Auditor"
                            alt="audit" name="audit" src={audit} onclick={navigateToAuditPage} />
                    </span>
                    <span class="  slds-size_1-of-4 geeks slds-m-around_large ">
                        <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px"
                            title="Human Resources" alt="HR" name="HR" src={HR} onclick={navigateToHRPage} />
                    </span>
                    <span class=" slds-size_1-of-4 geeks slds-m-around_large ">
                        <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px" title="Participants"
                            alt="Search" name="Search" src={Search} onclick={navigateToClientSearchPage} />
                    </span>

                </div>
                <div class="slds-size_1-of-3 ">
                    <span class="  slds-size_1-of-4 geeks slds-m-around_large ">
                        <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px"
                            title="Roster Management" alt="Attendence" name="Attendence" src={Notification}
                            onclick={navigateToRoasterManagement} />
                    </span>
                    <span class="  slds-size_1-of-4 geeks slds-m-around_large ">
                        <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px" title="Pay Roll"
                            alt="payroll" name="payroll" src={payroll} onclick={navigateToPayRoll} />
                    </span>
                    <span class="  slds-size_1-of-4 geeks slds-m-around_large">
                        <img class="slds-m-around_small" style="max-height: 80px; max-width: 80px" title="Repository"
                            alt="Valut" name="Valut" src={valut} onclick={navigateToRepository} />
                    </span>
                    
                </div>
            </div>
            <div class="slds-grid slds-wrap">
                <img class="slds-m-around_large" style="max-height: 45px; max-width: 45px" title="Tasks" alt="Tasks"
                    name="Valut" src={tasks} />
                <b style="font-size:15px;margin-top:10%" >Tasks : {todayDate}</b>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-box " style="table-layout: fixed;">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="slds-cell-wrap" scope="col">
                                Description
                            </th>
                            <th class="slds-cell-wrap" scope="col">
                                Status
                            </th>
                            <th class="slds-cell-wrap" scope="col">
                                Due Date
                            </th>
                            <th class="slds-cell-wrap" scope="col">
                                Created By
                            </th>
                            <th class="slds-cell-wrap" scope="col">

                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template if:true={taskDetailsValues}>
                            <template for:each={taskDetailsValues} for:item="taskRec">
                                <template if:true={taskRec.NewValue__c}>
                                    <tr class="slds-hint-parent" key={taskRec.Id}>
                                        <td>
                                            <div class="slds-cell-wrap">{taskRec.Subject}</div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap slds-badge slds-theme_warning">
                                                {taskRec.Status}</div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap">{taskRec.dueDate}</div>
                                        </td>
                                        <td>
                                           <!-- <div class="slds-cell-wrap">{taskRec.Owner.Name}</div> -->
                                            <div class="slds-cell-wrap">
                                                <img src={taskRec.CreatedBy.SmallPhotoUrl} height="40px" width="40px" style="border-radius: 50%;"/>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap slds-align_absolute-center">
                                                <lightning-button icon-name="utility:edit" data-id={taskRec.Id}
                                                    onclick={taskEdit} variant="base"></lightning-button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                                <template if:true={taskRec.InProgressValue__c}>
                                    <tr class="slds-hint-parent" key={taskRec.Id}>
                                        <td>
                                            <div class="slds-cell-wrap">{taskRec.Subject}</div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap slds-badge slds-theme_error">
                                                {taskRec.Status}</div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap">{taskRec.dueDate}</div>
                                        </td>
                                        <td>

                                                <img src={taskRec.CreatedBy.SmallPhotoUrl} height="40px" width="40px" style="border-radius: 50%;"/>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap slds-align_absolute-center">
                                                <lightning-button icon-name="utility:edit" data-id={taskRec.Id}
                                                    onclick={taskEdit} variant="base"></lightning-button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                                <template if:true={taskRec.Completed__c}>
                                    <tr class="slds-hint-parent" key={taskRec.Id}>
                                        <td>
                                            <div class="slds-cell-wrap">{taskRec.Subject}</div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap slds-badge slds-theme_success">
                                                {taskRec.Status}</div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap">{taskRec.dueDate}</div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap">
                                                <img src={taskRec.CreatedBy.SmallPhotoUrl} height="40px" width="40px" style="border-radius: 50%;"/>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="slds-cell-wrap slds-align_absolute-center">
                                                <lightning-button icon-name="utility:edit" data-id={taskRec.Id}
                                                    onclick={taskEdit} variant="base"></lightning-button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>


                            </template>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
        <c-footer-lwc></c-footer-lwc>
    </lightning-card>
</template>
