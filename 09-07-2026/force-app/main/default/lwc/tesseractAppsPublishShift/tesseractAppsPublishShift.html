                        <th class="table-th" title="Class">Class</th>

  <template if:true={fatigueManagementFlag}>
    <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
      class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2 class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center">
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium">
          <div class="slds-m-around_small" style="text-align: center">
            <div>
              <p>
                The interval between shifts is less than 8 hours for the
                following staff
                <span><b>{fatigueConfirmationMessge}</b></span>. Would you like to assign this shift?
              </p>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container slds-m-top_medium">
              <lightning-button label="No" variant="brand" onclick={handleDeselectStaff}
                class="slds-m-around_small"></lightning-button>
              <lightning-button label="Yes" variant="brand" onclick={handleFinalAllocate}
                class="slds-m-around_small"></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <template if:true={setHoursIndicatorflag}>
    <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
      class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2 class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center">
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">
            <div>
              <p>
                Set hours for the following staff is exceeded.<span><b>{setHoursIndiactorConfirmation}</b></span>.
                Would you like to assign this shift?
              </p>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container slds-m-top_medium">
              <lightning-button label="No" variant="brand" onclick={handleDeselectStaff}
                class="slds-m-around_small"></lightning-button>
              <lightning-button label="Yes" variant="brand" onclick={HandleNavigateToFatigue}
                class="slds-m-around_small"></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <template if:true={showErrorModal}>
    <section class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
      <div class="slds-modal__container" style="max-width: 25%; min-width: 400px;">
        <!-- Modal Header -->
        <header class="slds-modal__header" style="background: #002a52;">
          <h2 class="slds-text-heading_medium" style="color: white; text-align: center;">

            Shift Assignment Failed

          </h2>
        </header>

        <!-- Modal Body -->
        <div class="slds-modal__content slds-p-around_medium slds-text-align_center custom-scroll">
          <!-- Conditional Message -->
          <p class="slds-m-bottom_medium">Cannot proceed with shift assignment. Issues found:</p>


          <div class="center-list">
            <ul>
              <template for:each={staffDateConflicts} for:item="staff">
                <li key={staff.staffId}>
                  <strong>{staff.staffName}</strong>
                  <ul class="slds-m-top_xx-small">
                    <template for:each={staff.conflictDates} for:item="conflict">
                      <li key={conflict.date} class="conflict-row">
                        <span class="conflict-date">{conflict.displayDate}: </span>
                        <!--  <span class="conflict-reason">{conflict.reason}</span> -->
                        <lightning-formatted-rich-text class="conflict-reason"
                          value={conflict.reason}></lightning-formatted-rich-text>
                      </li>
                    </template>
                  </ul>
                </li>
              </template>
            </ul>
          </div>

        </div>

        <!-- Modal Footer -->
        <footer class="slds-modal__footer">


          <lightning-button label="OK" onclick={closeErrorModal} variant="brand"></lightning-button>



        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <template if:true={unavailableTemplate}>
    <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
      class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
      <div class="slds-modal__container modal-container" style="max-width: 35%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2 class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center">
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">

            <div style="text-align: center">

              <!-- 🔴 Rejected Shifts Section -->
              <template if:true={hasRejectedStaff}>
                <b class="slds-m-top_medium slds-text-align_left">Rejected Shift Information :</b>
                <p>
                  The following staff member(s) have rejected shifts overlapping this time:
                </p>

                <template for:each={rejectedStaffNames} for:item="name">
                  <p key={name}>
                    <strong>{name}</strong>
                  </p>
                </template>
              </template>

              <!-- ⚠️ Availability Section -->
              <template if:true={hasUnavailableStaff}>
                <template if:true={hasRejectedStaff}>
                  <div class="slds-border_top slds-m-vertical_medium"></div>
                </template>

                <b class="slds-m-top_medium slds-text-align_left">Unavailable Information :</b>
                <p>
                  This shift is outside the stated availability for the following staff member(s):
                </p>

                <template for:each={unavailableStaffNames} for:item="name">
                  <p key={name}>
                    <strong>{name}</strong>
                  </p>
                </template>

                <p>
                  They have not marked this time as unavailable.
                </p>
              </template>

              <!-- 😴 Fatigue Section -->
              <template if:true={hasFatigueStaff}>

                <div class="slds-border_top slds-m-vertical_medium"></div>

                <b class="slds-m-top_medium slds-text-align_left">
                  Fatigue Information :
                </b>

                <p>
                  The following {staffPreferredName} member(s) have less than 8 hours break between shifts:
                </p>

                <template for:each={fatigueStaffNames} for:item="name">
                  <p key={name}>
                    <strong>{name}</strong>
                  </p>
                </template>

              </template>

              <!-- SCHADS Sleepover Warning -->
              <template if:true={hasSchadsSleepoverWarning}>

                <div class="slds-border_top slds-m-vertical_medium"></div>

                <b class="slds-m-top_medium slds-text-align_left">
                  SCHADS Sleepover Warning :
                </b>

                <p>
                  A shift created directly before or after a sleepover must generally meet the 4-hour minimum
                  engagement rule.
                  This shift is currently below the recommended minimum duration.
                </p>

                <!--  <template for:each={schadsSleepoverWarningStaff} for:item="name">
                      <p key={name}>
                          <strong>{name}</strong>
                          <strong>{name}</strong>
                      </p>
                  </template> -->

              </template>


              <!-- ✅ Final Message (only if anything exists) -->

              <p class="slds-m-top_medium">
                Do you still want to create this shift?
              </p>


            </div>

            <!-- Buttons -->
            <div class="button-container slds-m-top_medium">
              <lightning-button label="Cancel" variant="brand" onclick={closeErrorModal}></lightning-button>

              <lightning-button label="Proceed" variant="brand" onclick={handleFinalAllocate}></lightning-button>
            </div>

          </div>
        </div>
