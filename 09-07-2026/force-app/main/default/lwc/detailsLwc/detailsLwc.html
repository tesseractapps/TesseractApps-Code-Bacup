                <!-- HEADER -->
                <header class="slds-modal__header headercustom journal-header">

        <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">
            {viewModalTitle}
        </h2>

        <button
            class="slds-button slds-button_icon close-btn"
            title="Close"
            onclick={closeViewModal}>

            <lightning-icon
                icon-name="utility:close"
                variant="inverse"
                alternative-text="Close"
                size="small">
            </lightning-icon>

        </button>

    </header>

                <!-- BODY -->

                <div class="slds-modal__content slds-p-around_small custom-scroll">
                    <template if:true={isViewMode}>
                    <!-- Journal Information -->

                    <div class="journal-info-card">

                        <div class="slds-grid slds-wrap slds-gutters">

                            <div class="slds-col slds-size_1-of-4">
                                <div class="field-label">
                                    Type of Notes
                                </div>

                                <div class="field-value">
                                    {selectedJournal.Care_Notes__c}
                                </div>
                            </div>

                            <div class="slds-col slds-size_1-of-4">
                                <div class="field-label">
                                    Created By
                                </div>

                                <div class="field-value">
                                    {selectedJournal.createdname}
                                </div>
                            </div>

                            <div class="slds-col slds-size_1-of-4">
                                <div class="field-label">
                                    Created On
                                </div>

                                <div class="field-value">
                                    {selectedJournal.createdOnFormatted}
                                </div>
                            </div>

                            <div class="slds-col slds-size_1-of-4  ">

                                <div class="field-label">
                                    Shift Details
                                </div>

                                <div class="field-value">
                                    {selectedJournal.shiftDetails}
                              </div>
                            </div>
                        </div>
                    </div>
                    <!-- Description -->
                    <div class="slds-m-top_small">

                        <h3 class="section-heading">
                            Description
                        </h3>

                        <div class="description-view">

                            <lightning-formatted-rich-text
                                value={selectedJournal.Description__c}>
                            </lightning-formatted-rich-text>

                        </div>

                    </div>
                    <!-- Attachments -->
                    <template if:true={selectedJournal.attachments.length}>

                        <div class="slds-m-top_large">

                            <h3 class="section-heading">
                                Attachments
                            </h3>

                            <div class="attachment-grid">

                                <template
                                    for:each={selectedJournal.attachments}
                                    for:item="file">

                                    <div
                                        key={file.Id}
                                        class="attachment-card">

                                        <span
                                            class="attachment-name"
                                            title={file.File_Name__c}>

                                            {file.File_Name__c}

                                        </span>

                                      <span
                                          class="material-icons action-icon view-icon"
                                          title="View"
                                          data-url={file.File_URL__c}
                                          onclick={handleViewJournalAttachment}>
                                          visibility
                                        </span>

                                    </div>

                                </template>

                            </div>

                        </div>

                    </template>
                    </template>
                    <!-- HISTORY -->

                    <template if:true={isHistoryMode}>

                        <div class="history-container">

                            <h2 class="timeline-title">
                                Timeline Information
                            </h2>

                            <div class="timeline-wrapper">

                                <template
                                    for:each={selectedJournal.corrections}
                                    for:item="corr"
                                    for:index="index">

                                    <div
                                        key={corr.label}
                                        class="timeline-item">

                                        <!-- Left Timeline -->

                                        <div class="timeline-left">

                                            <div class="timeline-circle"></div>

                                            <div class="timeline-line"></div>

                                        </div>

                                        <!-- Right Card -->

                                        <div class="timeline-card">

                                            <!-- Badge -->

                                            <div class="timeline-badge">

                                                {corr.label}

                                            </div>

                                            <!-- Content -->

                                            <div class="timeline-grid">

                                                <!-- Left -->

                                                <div>

                                                    <div class="timeline-label">
                                                        Reason
                                                    </div>

                                                    <div class="timeline-value">
                                                        {corr.reason}
                                                    </div>

                                                </div>

                                                <!-- Middle -->

                                                <div>

                                                    <div class="timeline-label">
                                                        Description
                                                    </div>

                                                    <div class="timeline-description">

                                                        <lightning-formatted-rich-text
                                                            value={corr.description}>
                                                        </lightning-formatted-rich-text>

                                                    </div>

                                                </div>

                                                <!-- Right -->

                                                <div>

                                                    <div class="timeline-label">
                                                        Updated By
                                                    </div>

                                                    <div class="timeline-value">

                                                        {corr.createdBy}

                                                    </div>
                                                    
                                                    <div class="timeline-date">

                                                        {corr.modifiedOn}

                                                    </div>


                                                </div>

                                            </div>

                                            <!-- Attachments -->

                                            <template if:true={corr.attachments.length}>

                                                <div class="history-attachments">

                                                    <div class="timeline-label">

                                                        Attachments

                                                    </div>

                                                    <div class="attachment-grid">

                                                        <template
                                                            for:each={corr.attachments}
                                                            for:item="file">

                                                            <div
                                                                key={file.Id}
                                                                class="attachment-card">

                                                                <span
                                                                    class="attachment-name"
                                                                    title={file.File_Name__c}>

                                                                    {file.File_Name__c}

                                                                </span>

                                                                <span
                                                                  class="material-icons action-icon view-icon"
                                                                  title="View"
                                                                  data-url={file.File_URL__c}
                                                                  onclick={handleViewJournalAttachment}>
                                                                  visibility
                                                                </span>

                                                            </div>

                                                        </template>

                                                    </div>

                                                </div>

                                            </template>

                                        </div>

                                    </div>

                                </template>

                            </div>

                        </div>

                    </template>
                </div>

                <!-- FOOTER -->

                <footer class="slds-modal__footer">

                    <lightning-button
                        variant="neutral"
                        label="Close"
                        onclick={closeViewModal}>
                    </lightning-button>

                </footer>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>


    <template if:true={showFormatModal}>

    <section
        role="dialog"
        tabindex="-1"
        class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container export-modal">

            <!-- Header -->
            <header class="slds-modal__header" style="background: #002a52">
                <h2 class="slds-text-heading_medium slds-hyphenate"
                    style="color: white; font-weight: bold; text-align: center">
                    Select Export Format
                </h2>
            </header>

            <!-- Body -->
                       <div class="slds-modal__content slds-p-around_medium slds-scrollable_y">
                <div class="slds-grid slds-grid_align-center">

                <lightning-radio-group
                    name="format"
                    label="Choose Format"
                    options={formatOptions}
                    value={selectedFormat}
                    onchange={handleFormatChange}>
                </lightning-radio-group>
                </div>
            </div>

            <!-- Footer -->
            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={closeFormatModal}>
                </lightning-button>

                <lightning-button
                    label="Download"
                    variant="brand"
                    class="slds-m-left_small"
                    onclick={handleDownloadConfirm}>
                </lightning-button>

            </footer>

        </div>

    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>

</template>
