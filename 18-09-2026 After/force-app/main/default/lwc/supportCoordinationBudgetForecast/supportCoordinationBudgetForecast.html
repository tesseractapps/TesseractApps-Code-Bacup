                        <div class={card.valueClass}>{card.value}</div>
                        <div class="summary-label">{card.label}</div>
                    </div>
                </div>
            </template>
        </div>

        <template for:each={participants} for:item="p">
            <div key={p.id} class="participant-card slds-m-bottom_medium">

                <!-- HEADER -->
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <div>
                        <strong>{p.name}</strong>
                        <div class="slds-text-body_small">{p.planDate}</div>
                    </div>
                    <span class={p.riskClass}>{p.risk}</span>
                </div>

                <!-- MAIN ROW -->
                <div class="forecast-row">

                    <!-- Plan Progress -->
                    <div class="forecast-col wide">
                        <div class="forecast-header">
                            <span class="label">Plan Progress</span>
                            <span class="value">{p.planProgress}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style={p.planStyle}></div>
                        </div>
                    </div>

                    <!-- Budget Used -->
                    <div class="forecast-col wide">
                        <div class="forecast-header">
                            <span class="label">Budget Used</span>
                            <span class="value green">{p.budgetUsed}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill green" style={p.budgetStyle}></div>
                        </div>
                    </div>

                    <!-- Monthly Burn -->
                    <div class="forecast-col narrow">
                        <div class="label">Monthly Burn</div>
                        <div class="burn-value">${p.monthlyBurn}</div>
                    </div>

                </div>

                <!-- FOOTER LINK -->
                <div class="forecast-footer">
                    <a href="javascript:void(0)" class="view-link">
                        View Detailed Forecast →
                    </a>
                </div>

            </div>
        </template>

        </div>
</template>
