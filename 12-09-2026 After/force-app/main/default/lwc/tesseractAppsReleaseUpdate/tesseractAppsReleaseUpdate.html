<template>
    <template if:true={isOpen}>
        <div class="popup-overlay" onclick={handleOverlayClick}></div>

        <div class="popup-container" onclick={handleStopPropagation}>
            <div class="topSection">
            <div class="media-section">
                <template if:true={currentIsVideo}>
                    <video src={currentMediaUrl} class="media-content" autoplay loop muted playsinline></video>
                </template>
                <template if:false={currentIsVideo}>
                    <img src={currentMediaUrl} alt={currentTitle} class="media-content" onload={handleImgLoad} onerror={handleImgError} />
                </template>
            </div>

            <div class="progress-bar-container">
                <div class="progress-fill" style={progressBarStyle}></div>
            </div>

            </div>

            <div class="nav-row">
                <button class="nav-arrow" onclick={handlePrevious} disabled={isPreviousDisabled}>
                    <i class="material-icons">chevron_left</i>
                </button>

                <span class="counter-text">
                    <b>{currentStepNumber}</b> <span class="text-gray"> of {totalSteps}</span>
                </span>

                <template if:false={isLastSlide}>
                    <button class="nav-arrow" onclick={handleNext} disabled={isNextDisabled}>
                        <i class="material-icons">chevron_right</i>
                    </button>
                </template>
                <template if:true={isLastSlide}>
                    <button class="nav-arrow finish-btn" onclick={handleFinish}>
                        <i class="material-icons">check</i>
                    </button>
                </template>
            </div>

            <div class="text-content">
                <h2 class="title">
                    <span class="title-label">New Update :</span> {currentTitle}
                </h2>
                <lightning-formatted-rich-text class="description" value={currentDescription}>
                </lightning-formatted-rich-text>
            </div>

            <!-- <div class="footer-section">
                <button class="learn-more-btn">Learn More <i class="material-icons arrow-icon">arrow_forward</i></button>
            </div> -->
        </div>
    </template>
</template>
