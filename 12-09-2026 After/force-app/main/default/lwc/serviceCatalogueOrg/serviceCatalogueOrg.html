        <!-- </template>
        </template> -->
        <template if:false={noRecordsFlag}>
            <template if:true={paginationVisible}>
                <div
                    class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread  slds-p-around_small pagination-row fixed-pagination-ft"
                   
                >
                    <!--RECORDS PER PAGE-->
                    <div class="slds-col">
                        <div class="slds-list_inline slds-p-bottom_xx-small">
                            <label
                            class="slds-text-color_weak slds-p-horizontal_x-small"
                            for="recordsPerPage"
                            >Page Size:</label
                            >
                            <div class="slds-select_container">
                                <select
                                    class="slds-select"
                                    id="recordsPerPage"
                                    value={pageSize}
                                    onchange={handleRecordsPerPage}
                                >
                                    <template
                                        for:each={pageSizeOptions}
                                        for:item="option"
                                    >
                                        <option key={option} value={option}>
                                            {option}
                                        </option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!--PAGE NAVIGATION-->
                    <div class="slds-align_absolute-center">
                        <lightning-button
                            disabled={bDisableFirst}
                            icon-name="utility:jump_to_left"
                            label="First"
                            class="slds-p-horizontal_x-small"
                            alternative-text="first page"
                            onclick={firstPage}
                        ></lightning-button>
                        <lightning-button
                            disabled={bDisableFirst}
                            icon-name="utility:chevronleft"
                            label="Previous"
                            alternative-text="Previous"
                            onclick={previousPage}
                        ></lightning-button>
                        &nbsp;
                        <span class="slds-badge"
                            >Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                            &nbsp;&nbsp;Page(s)</span
                        >
                        &nbsp;
                        <lightning-button
                            disabled={bDisableLast}
                            icon-name="utility:chevronright"
                            label="Next"
                            alternative-text="Next"
                            onclick={nextPage}
                            class="slds-p-horizontal_x-small"
                            icon-position="right"
                        ></lightning-button>
                        <lightning-button
                            disabled={bDisableLast}
                            icon-name="utility:jump_to_right"
                            label="Last"
                            alternative-text="last page"
                            onclick={lastPage}
                            icon-position="right"
                        ></lightning-button>
                    </div>
                    <!--TOTAL RECORDS-->
                    <div class="slds-clearfix">
                        <div class="slds-float_right">
                            <span class="slds-badge">
                            Total Records: {totalRecords}</span
                            >
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!--Spinner Starting-->

                alternative-text="Loading"
                size="large"
            ></lightning-spinner>
        </div>
            <!-- </lightning-card> -->
        </div>

    <template if:true={isCreateCatalogueModalOpen}> 
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open"> 
            <div class="slds-modal__container modal-custom "> 
                <!-- HEADER --> 
                <header class="slds-modal__header headercustom"> 
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">{CreateorEditCatalogueName}</h2> 
                </header> 
                <!-- BODY CONTENT --> 
                <div class="slds-modal__content slds-p-around_medium custom-scroll">  
                    <div class="slds-grid slds-wrap slds-gutters">
                    
                    <div class="slds-size_1-of-3 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop"><span style="color:red">*</span>Type of Industry</span>
                            <!-- <lightning-combobox
                                variant="label-hidden"
                                value={formData.industryType}

                                required
                                disabled={isCloneCatalogue}>
                            </lightning-combobox> -->
                            <c-tesseract-apps-single-combobox
                                variant="label-hidden"
                                placeholder=""
                                value={formData.industryType}
                                options={typeOfIndustryOptions}
                                data-field="industryType"
                                onchange={handleChangeserviceCatalogue}
                                required
                                disabled={isCatalogueFieldsDisabled}
                                >
                            </c-tesseract-apps-single-combobox> 
                            
                        </div>
                    </div>
                    <!-- Service Type -->
                    <div class="slds-size_1-of-3 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop"><span style="color:red">*</span>Service Type</span>
                            <!-- <lightning-combobox
                                variant="label-hidden"
                                value={formData.serviceType}
                                options={serviceTypeOptions}
                                data-field="serviceType"
                                onchange={handleChangeserviceCatalogue}
                                required>
                            </lightning-combobox> -->
                            <c-tesseract-apps-single-combobox
                                variant="label-hidden"
                                placeholder=""
                                data-field="serviceType"
                                value={formData.serviceType}
                                options={serviceTypeOptions}
                                onchange={handleChangeserviceCatalogue}
                                disabled={isCatalogueFieldsDisabled}
                                title={serviceTypeTitle}>
                            </c-tesseract-apps-single-combobox>    <!-- title={formData.serviceType}-->
                        </div>
                    </div>

                    <!-- Support Item Name -->
                    <div class="slds-size_1-of-3 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop"><span style="color:red">*</span>Support Item Name</span>
                            <lightning-input
                                type="text"
                                variant="label-hidden"
                                data-field="supportItemName"
                                value={formData.supportItemName}
                                title={supportItemNameTitle}
                                onchange={handleChangeserviceCatalogue}
                                required
                                disabled={isCatalogueFieldsDisabled}>
                            </lightning-input>   <!-- title={formData.supportItemName}-->
                        </div>
                    </div>

                    <!-- Support Item Number -->
                    <div class="slds-size_1-of-3 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop"><span style="color:red">*</span>Support Item Number</span>
                            <lightning-input
                                type="text"
                                variant="label-hidden"
                                data-field="supportItemNumber"
                                value={formData.supportItemNumber}
                                onchange={handleChangeserviceCatalogue}
                                disabled={lineItemNumberFlag}> 
                            </lightning-input>
                        </div>
                    </div>

                    <!-- Rates -->
                    <template for:each={computedRateFields} for:item="rate">
                        <div key={rate.field} class="slds-size_1-of-3 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop">{rate.label}</span>
                                <lightning-input
                                    
                                    
                                    value={rate.value}
                                    variant="label-hidden"
                                    data-field={rate.field}
                                    onchange={handleChangeserviceCatalogue}>
                                </lightning-input>
                            </div>
                        </div>
                    </template>
                </div>
                </div> 

                <!-- FOOTER --> 
                <footer class="slds-modal__footer"> 
                    <lightning-button 
                    variant="neutral" 
                    label="Cancel" 
                    onclick={handleCancelCreateCatalogue}> 
                    </lightning-button> 

                    <lightning-button 
                    class="slds-m-left_small" 
                    variant="brand" 
                    label="Save" 
                    onclick={handleSaveCreateCatalogue}> 
                    </lightning-button> 
                </footer> 
            </div>
        </section> 
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
