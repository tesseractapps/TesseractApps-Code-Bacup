<template>
     <template if:true={isCreateGoal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open"> 
          <div class="slds-modal__container modal-custom "> 
                <header class="slds-modal__header headercustom"> 
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">Development Goals</h2> 
                    <!-- <p class="slds-text-body_small slds-p-top_x-small h2custom">Convert coaching outcomes into trackable goals for {staffName}</p> -->
                </header> 
                
                <div class="slds-modal__content slds-p-around_medium custom-scroll">  
                    <div class="form-section" style="margin-top: 2%; margin-left: 1.5%; margin-right: 1.5%" >
                        <!-- <c-tesseract-apps-custom-stepper
                            steps={steps}
                            current-step={currentStep}>
                        </c-tesseract-apps-custom-stepper> -->
                         <lightning-progress-indicator current-step={currentStep} type="path">
                        <lightning-progress-step
                            label="Goal Info"
                            value="step1"
                        ></lightning-progress-step>
                        <!-- onclick={handleStepClick}-->
                        <lightning-progress-step
                            label="Milestones"
                            value="step2"
                        ></lightning-progress-step>
                        <!-- onclick={handleStepClick}-->
                        <lightning-progress-step
                            label="Success Criteria"
                            value="step3"
                        ></lightning-progress-step>
                        <!-- onclick={handleStepClick}-->
                        <lightning-progress-step
                            label="Review"
                            value="step4"
                        ></lightning-progress-step>
                       
                        </lightning-progress-indicator>
                    </div>
                    <div> 
                          <div class="right-content custom-scroll">
                            <template if:true={isStep1}>
                                <div class="slds-box slds-m-around_medium">
                                    <div class="slds-grid slds-wrap slds-gutters_medium">

                                        <!-- KPI Name -->
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                
                                                <span class="label-text-drop">
                                                    <span style="color:red">*</span>Goal Type
                                                </span>
                                                <lightning-combobox
                                                    name="selectedGoalType"
                                                    variant="label-hidden"
                                                    options={goalTypeOptions}
                                                    value={selectedGoalType}
                                                    required
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-combobox>
                                            </div>
                                        </div>

                                        <!-- Category -->
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                    <span style="color:red">*</span>Goal Title
                                                </span>
                                                <lightning-input
                                                    type="text"
                                                    name="goalTitle"
                                                    variant="label-hidden"
                                                    value={goalTitle}
                                                    required
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-long-text-area kpi-description">
                                                <span class="label-text-drop1">
                                                    <span style="color:red">*</span>Description
                                                </span>

                                                <lightning-textarea
                                                    name="goalDescription"
                                                    variant="label-hidden"
                                                    value={goalDescription}
                                                    onchange={handleGoalChange}
                                                    required
                                                    disabled={disableAllFields}
                                                    placeholder="Description...">
                                                </lightning-textarea>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-wrap slds-gutters_medium">
                                        <!-- Target -->
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                    <span style="color:red">*</span>Priority
                                                </span>
                                                    <lightning-combobox
                                                    name="goalPriority"
                                                    variant="label-hidden"
                                                    value={goalPriority}
                                                    options={goalPriorityOptions}
                                                    required
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-combobox>
                                            </div>
                                        </div>

                                        <!-- Unit -->
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                    <span style="color:red">*</span>Owner
                                                </span>
                                                <lightning-input
                                                    type="text"
                                                    name="staffName"
                                                    variant="label-hidden"
                                                    value={staffName}
                                                    required 
                                                    disabled>
                                                </lightning-input>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                        </div>
                                    </div>     
                                    <div class="slds-grid slds-wrap slds-gutters_medium">
                                        <!-- Weight -->
                                        <div class="slds-col slds-large-size_1-of-3  slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                    <span style="color:red">*</span>Manager
                                                </span>
                                                <lightning-input
                                                    type="text"
                                                    name="managerName"
                                                    variant="label-hidden"
                                                    value={managerName}
                                                    required
                                                    disabled
                                                    >   <!-- onchange={handleGoalChange}-->
                                                </lightning-input>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                        <span style="color:red">*</span>Start Date
                                                </span>
                                                <lightning-input
                                                    type="date"
                                                    name="goalStartDate"
                                                    variant="label-hidden"
                                                    value={goalStartDate}
                                                    max={goalEndDate} 
                                                    required
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>  
                                                </lightning-input>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                    <span style="color:red">*</span>End Date
                                                </span>
                                                <lightning-input
                                                    type="date"
                                                    name="goalEndDate"
                                                    variant="label-hidden"
                                                    value={goalEndDate}
                                                    min={goalStartDate}
                                                    required
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}> 
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </div>     
                                </div>                        
                            </template>
                            
                            <template if:true={isStep2}>
                                <div class="slds-box" style="margin: 2%;">
                                   <div class="slds-grid slds-wrap slds-gutters_medium">
                                        <div class="slds-col slds-large-size_2-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                    Milestone Title
                                                </span>

                                                <lightning-input
                                                    type="text"
                                                    name="milestoneTitle"
                                                    variant="label-hidden"
                                                    value={milestoneTitle}
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-input>
                                            </div>
                                        </div>

                                        <!-- Description -->
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-long-text-area">
                                                <span class="label-text-drop1">
                                                    Description
                                                </span>

                                                <lightning-textarea
                                                    name="milestoneDescription"
                                                    variant="label-hidden"
                                                    value={milestoneDescription}
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-textarea>
                                            </div>
                                        </div>

                                   </div>
                                   <div class="slds-grid slds-wrap slds-gutters_medium">
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                    <template if:true={isDueDateRequired}>
                                                        <span style="color:red">*</span>
                                                    </template>
                                                    Due Date
                                                </span>

                                                <lightning-input
                                                    type="date"
                                                    name="milestoneDueDate"
                                                    variant="label-hidden"
                                                    value={milestoneDueDate}
                                                    required={isDueDateRequired}
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-input>
                                            </div>
                                        </div>

                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                    Status
                                                </span>

                                                <lightning-combobox
                                                    name="milestoneStatus"
                                                    variant="label-hidden"
                                                    value={milestoneStatus}
                                                    options={goalStatusOptions}
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-combobox>
                                            </div>
                                        </div>

                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-text-align_right slds-m-top_medium">
                                        <!-- <lightning-button
                                            label="Add Milestone"
                                            variant="brand-outline"
                                            onclick={handleAddMilestone}>
                                        </lightning-button> -->
                                        <template if:true={showMilestoneActions}>
                                            <template if:false={isEditingMilestone}>
                                                <lightning-button
                                                    label="Add Milestone"
                                                    variant="brand-outline"
                                                    onclick={handleAddMilestone}>
                                                </lightning-button>
                                            </template>

                                            <template if:true={isEditingMilestone}>
                                                <lightning-button
                                                    label="Update Milestone"
                                                    variant="brand" 
                                                    onclick={handleUpdateMilestone}>
                                                </lightning-button>
                                            </template>
                                        </template>
                                        
                                    </div>
                                    <template if:true={milestoneList.length}>
                                        <div class="ndis-table-container custom-scroll">
                                            <table class="ndis-table">
                                                <thead>
                                                    <tr>
                                                        <th class="table-td-service">Milestone Title</th>
                                                        <th class="table-td-service">Due Date</th>
                                                        <th class="table-td-service">Status</th>
                                                        <template if:true={showMilestoneActions}>
                                                             <th class="table-td-service" style="width:8%">Action</th>
                                                        </template>
                                                       
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={milestoneList} for:item="mile">
                                                        <tr key={mile.key} class="ndis-tr">
                                                            <td class="table-td-service">{mile.milestoneTitle}</td>
                                                            <td class="table-td-service">{mile.dueDateDisplay}</td>
                                                            <td class="table-td-service">{mile.status}</td>
                                                            <template if:true={showMilestoneActions}>
                                                                <td class="table-td-service ndis-center">
                                                            
                                                                    <span 
                                                                    data-key={mile.key}
                                                                    data-id={mile.id}
                                                                    onclick={handleEditMilestone}
                                                                    title="Edit"
                                                                    style="text-decoration: none;">
                                                                    <i class="material-icons edit-icon">edit</i>
                                                                </span>&nbsp;
                                                                <span  
                                                                    data-key={mile.key}
                                                                    data-id={mile.id}
                                                                    onclick={handleDeleteMilestone}
                                                                    title="Delete"
                                                                    style="text-decoration: none;">
                                                                    <i class="material-icons delete-icon">delete</i>
                                                                </span>
                                                                </td>
                                                            </template>
                                                            
                                                            
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>
                                    
                                </div>
                            </template>
        
                            <template if:true={isStep3}>
                                <div class="slds-box" style="margin: 2%;">
                                     <div class="slds-grid slds-wrap slds-gutters_medium">
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                   Measurement Type
                                                </span>
                                                <lightning-combobox
                                                    name="measurementType"
                                                    variant="label-hidden"
                                                    value={measurementType}
                                                    options={measurementTypeOptions}
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-combobox>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="floating-label-new">
                                                <span class="label-text-drop">
                                                    Check In Frequency
                                                </span>

                                                <lightning-combobox
                                                    name="checkInFrequency"
                                                    variant="label-hidden"
                                                    value={checkInFrequency}
                                                    options={checkInFrequencyOptions}
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-combobox>
                                            </div>
                                        </div>
                                       <!-- <div class="slds-col slds-large-size_1-of-3 slds-p-around_small">
                                             <span class="label-text-drop">Upload Supporting Files</span>

                                            <lightning-file-upload
                                                label="Choose File"
                                                name="fileUploader"
                                                record-id={recordId}
                                                multiple>
                                            </lightning-file-upload> 
                                        </div>-->

                                    </div>

                                    <div class="slds-grid slds-wrap slds-gutters_medium">
                                        <div class="slds-col slds-large-size_1-of-1 slds-p-around_small">
                                            <div class="floating-label-long-text-area">
                                                <span class="label-text-drop">
                                                    <span style="color:red">*</span>Success Indicators
                                                </span>
                                                <lightning-textarea
                                                    name="successIndicators"
                                                    variant="label-hidden"
                                                    value={successIndicators}
                                                    required
                                                    disabled={disableAllFields}
                                                    onchange={handleGoalChange}>
                                                </lightning-textarea>
                                            </div>
                                        </div>

                                    </div>

                                    <div class="slds-grid slds-wrap slds-gutters_medium">
                                        <div class="slds-col slds-large-size_1-of-1 slds-p-around_small">
                                            <div class="floating-label-long-text-area">
                                                <span class="label-text-drop">
                                                    Manager Comments
                                                </span>
                                                <lightning-textarea
                                                    name="managerComments"
                                                    variant="label-hidden"
                                                    value={managerComments}
                                                    disabled={disableManagerComment}
                                                    onchange={handleGoalChange}>
                                                </lightning-textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>

                             <template if:true={isStep4}>
                                <div class="slds-box slds-theme_default goal-summary-card" style="margin: 2%;">
                                    <div class="slds-grid slds-wrap slds-align_absolute-center slds-m-bottom_small">

                                        <div class="slds-col slds-size_1-of-1">

                                            <span class="goal-title">
                                                {goalTitle}
                                            </span>
                                            <span class="slds-badge light-goal-type slds-m-left_small">
                                                {selectedGoalType}
                                            </span>

                                            <span class="slds-badge  light-goal-priority slds-m-left_x-small">
                                                {goalPriority}
                                            </span>
                                        </div>

                                        <div class="slds-col slds-size_1-of-1 slds-text-color_weak slds-m-top_xx-small">
                                            {goalDescription}
                                        </div>

                                    </div>

                                    <hr class="slds-m-vertical_small"/>

                                    <!-- Success Criteria -->
                                    <!-- <div class="slds-m-bottom_small">

                                        <span class="label-title">
                                            Success Criteria:&nbsp;
                                        </span>

                                        <span>
                                           {successIndicators}
                                        </span>

                                    </div>

                                    <div class="slds-m-bottom_medium">

                                        <span class="label-title">
                                            Milestones:&nbsp;
                                        </span>

                                        <strong>{milestoneList.length}</strong>

                                    </div>

                                    <div class="slds-grid slds-wrap slds-gutters_medium">

                                        <div class="slds-col slds-large-size_1-of-4">
                                            <span class="label-title">Owner: &nbsp;</span>
                                            <strong>{staffName}</strong>
                                        </div>

                                        <div class="slds-col slds-large-size_1-of-4">
                                            <span class="label-title">Date: &nbsp;</span>
                                            <strong>{startToEndDate}</strong>
                                        </div>

                                        <div class="slds-col slds-large-size_1-of-4">
                                            <span class="label-title">Manager: &nbsp;</span>
                                            <strong>{managerName}</strong>
                                        </div>

                                        <div class="slds-col slds-large-size_1-of-4">
                                            <span class="label-title">Review Frequency: &nbsp;</span>
                                            <strong>{reviewFrequency}</strong>
                                        </div>

                                    </div> -->
                                    <div class="slds-m-bottom_small">
                                        <strong>Success Criteria:</strong>
                                        <p class="slds-text-color_weak">{successIndicators}</p>
                                    </div>

                                    <div class="slds-m-bottom_medium">
                                        <strong>Milestones:</strong>
                                        <p class="slds-text-color_weak">{milestoneList.length}</p>
                                    </div>

                                    <!-- Bottom Info -->
                                    <div class="slds-grid slds-wrap slds-gutters_medium">

                                        <div class="slds-col slds-large-size_1-of-4">
                                            <strong>Owner:</strong>
                                            <p class="slds-text-color_weak">{staffName}</p>
                                        </div>

                                        <div class="slds-col slds-large-size_1-of-4">
                                            <strong>Date:</strong>
                                            <p class="slds-text-color_weak">{startToEndDate}</p>
                                        </div>

                                        <div class="slds-col slds-large-size_1-of-4">
                                            <strong>Manager:</strong>
                                            <p class="slds-text-color_weak">{managerName}</p>
                                        </div>

                                        <div class="slds-col slds-large-size_1-of-4">
                                            <strong>Review Frequency:</strong>
                                            <p class="slds-text-color_weak">{reviewFrequency}</p>
                                        </div>

                                    </div>
                                </div>
                             </template>
                        </div>
                    </div> 
                    
                </div> 

                <footer class="slds-modal__footer slds-grid slds-grid_align-spread slds-grid_vertical-align-center" style="padding-left: 3.5%; padding-right:4.5%;"> 
                     <div>
                       <template if:true={showSkip}>
                            <lightning-button 
                                label="Skip"
                                variant="neutral"
                                onclick={handleSkip}>
                            </lightning-button>
                        </template>
                    </div>
                    <div class="slds-grid slds-gutters_small">
                        <template if:true={showCancel}>
                        
                             <lightning-button
                                variant="neutral"
                                label="Cancel"
                                onclick={cancelCreateGoal}>
                            </lightning-button>
                        
                        </template>

                        <template if:true={showPrevious}>
                            <div class="slds-m-left_small">
                                <lightning-button
                                    variant="neutral"
                                    label="Previous"
                                    onclick={handlePrevious}>
                                </lightning-button>
                            </div>
                        </template>

                        <template if:true={showNext}>
                            <div class="slds-m-left_small">
                                <lightning-button
                                    variant="brand"
                                    label="Next"
                                    onclick={handleNext}>
                                </lightning-button>
                            </div>
                        </template>

                        <template if:true={showSave}>
                            <div class="slds-m-left_small">
                                <lightning-button
                                    variant="brand"
                                    label={saveLabel}
                                    disabled={isSaveDisabled}
                                    onclick={handleSave}>
                                </lightning-button>
                            </div>
                        </template>
                        <template if:true={showCompleted}>
                            <div class="slds-m-left_small">
                                <lightning-button
                                    variant="brand"
                                    label="Completed"
                                    disabled={isCompletedDisabled}
                                    onclick={handleCompleted}>
                                </lightning-button>   <!-- label="Completed"-->
                            </div>
                        </template>
                    </div>
                    
                </footer> 
            </div> 
        </section> 
        <div class="slds-backdrop slds-backdrop_open"></div> 
    </template>
</template>
