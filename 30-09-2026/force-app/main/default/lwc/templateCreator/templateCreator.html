<template>
  <template if:false={isFileUploaded}>
    <div class="main-outer-container  custom-scroll">
      <template if:true={isHome}>

        <div class="home-container">

          <!-- =====================================================
                STATUS CARDS
            ====================================================== -->
          <div class="status-card-container">

            <!-- Action Required -->
            <div class="status-card action-required-card">
              <div class="status-card-content">

                <div class="status-card-title">
                  Action Required
                </div>

                <div class="status-card-description">
                  Document waiting for signature
                </div>

                <div class="status-card-footer">

                  <span class="view-all-text" data-card="actionRequired" onclick={handleDashboardCardClick}>
                    View All →
                  </span>

                  <span class="status-count action-count">
                    {actionRequiredCount}
                  </span>

                </div>
              </div>
            </div>


            <!-- Waiting For Others -->
            <div class="status-card waiting-card">
              <div class="status-card-content">

                <div class="status-card-title">
                  Waiting for others
                </div>

                <div class="status-card-description">
                  Document pending receipts
                </div>

                <div class="status-card-footer">

                  <span class="view-all-text" data-card="waitingForOthers" onclick={handleDashboardCardClick}>
                    View All →
                  </span>

                  <span class="status-count waiting-count">
                    {waitingForOthersCount}
                  </span>

                </div>
              </div>
            </div>


            <!-- Expiring Soon -->
            <div class="status-card expiring-card">

              <div class="status-card-content">

                <div class="status-card-title">
                  Expiring soon
                </div>

                <div class="status-card-description">
                  Documents expiring within 7 days
                </div>

                <div class="status-card-footer">

                  <span class="view-all-text" data-card="expiringSoon" onclick={handleDashboardCardClick}>
                    View All →
                  </span>

                  <span class="status-count expiring-count">
                    {expiringSoonCount}
                  </span>

                </div>

              </div>

              <div class="notification-icon">
                🔔
              </div>

            </div>


            <!-- Completed -->
            <div class="status-card completed-card">
              <div class="status-card-content">

                <div class="status-card-title">
                  Completed
                </div>

                <div class="status-card-description">
                  Successfully signed Documents
                </div>

                <div class="status-card-footer">

                  <span class="view-all-text" data-card="completed" onclick={handleDashboardCardClick}>
                    View All →
                  </span>

                  <span class="status-count completed-count">
                    {completedCount}
                  </span>

                </div>

              </div>
            </div>

          </div>


          <!-- =====================================================
                MAIN HOME CONTENT
            ====================================================== -->
          <div class="home-content">


            <!-- =================================================
                    QUICK ACTION
                ================================================== -->
            <div class="quick-action-section">

              <div class="section-heading">

                <div class="section-title">
                  Quick Action
                </div>

              </div>


              <!-- =================================================
                        VIEW ALL DOCUMENTS
                    ================================================== -->
              <!-- <div class="quick-action-buttons">

                <button type="button" class="quick-action-button secondary-button" onclick={handleViewAllDocuments}>
                  View All Documents
                </button>

              </div> -->
<!-- =================================================
          VIEW ALL DOCUMENTS
     ================================================== -->
<div class="quick-action-buttons">

    <lightning-button
        class="view-all-documents-button"
        variant="brand"
        label="View All Documents"
        stretch
        onclick={handleViewAllDocuments}>
    </lightning-button>

</div>



              <!-- =================================================
                        UPLOAD INFORMATION
                    ================================================== -->
              <div class="upload-information">




                <!--
                            Entire upload container is clickable.

                            Existing functionality:
                            triggerNativeFileUpload()
                                ↓
                            #uploadPdf.click()
                                ↓
                            onFileUpload()
                        -->
                <div class="upload-drop-zone" onclick={triggerNativeFileUpload}>

                  <svg class="upload-cloud-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <!-- Cloud -->
                    <path d="M7.5 18.5h9.25a4.75 4.75 0 0 0 .72-9.45A6.5 6.5 0 0 0 5 10.5a4 4 0 0 0 2.5 8Z" />

                    <!-- Upload arrow -->
                    <path d="M12 15V7" />

                    <path d="m8.75 10.25 3.25-3.25 3.25 3.25" />
                  </svg>


                  <div class="upload-drop-text">
                    Drag &amp; drop files or 
                    <span class="browse-text">
                      Browse
                    </span>
                  </div>


                  <div class="upload-supported-text">
                    Supported formats: Word , PDF
                  </div>

                  <div class="upload-size-text">
                    Max 10 MB files are allowed
                  </div>

                </div>

              </div>


              <!-- =================================================
                        EXISTING FILE INPUT

                        KEEP THIS.

                        This is what eventually invokes:
                        onFileUpload()
                    ================================================== -->
              <input type="file" id="uploadPdf"
                accept=".pdf, .docx, .doc, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                onchange={onFileUpload} class="visually-hidden" />

            </div>


            <!-- =================================================
                    RECENT ACTIVITY
                ================================================== -->
            <div class="recent-activity-section">

              <div class="recent-activity-header">

                <div class="section-title">
                  Recent Activity
                </div>

                <span class="recent-activity-count-badge">
                  {recentActivitiesCount}
                </span>

              </div>

              <template if:true={hasRecentActivities}>
                <div class="recent-activity-list custom-scroll">
                  <template for:each={recentActivities} for:item="activity">
                    <div key={activity.id} class="recent-activity-item" data-record-id={activity.id}
                      data-category={activity.category} onclick={handleRecentActivityClick} tabindex="0" role="button"
                      onkeydown={handleRecentActivityKeyDown}>
                      <div class="recent-activity-item-header">
                        <div class="recent-activity-filename" title={activity.fileName}>
                          {activity.fileName}
                        </div>
                        <span class={activity.categoryClass}>
                          {activity.category}
                        </span>
                      </div>
                      <div class="recent-activity-description">
                        {activity.description}
                      </div>
                      <div class="recent-activity-datetime">
                        {activity.formattedDateTime}
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <template if:false={hasRecentActivities}>
                <div class="recent-activity-content">

                  <div class="no-activity-text">
                    No Recent Activities Data to show
                  </div>


                  <!-- Placeholder illustration -->
                  <div class="no-activity-image">

                    <div class="empty-state-illustration">

                      <div class="empty-state-circle">
                        ×
                      </div>

                    </div>

                  </div>

                </div>
              </template>

            </div>

          </div>


          <!-- =====================================================
                EXISTING FILE PROCESSING COMPONENTS

                IMPORTANT:
                These are kept exactly as they were.

                Your existing JS controls:
                isFileExpand
                isFileExpand1
            ====================================================== -->

          <div class="file-processing-container">

            <template if:true={isFileExpand}>

              <c-document-office-service record-id={recordId} module-path-from-parent="ticket"
                onuploadcomplete={handleAwsUploadComplete} onfiledeleted={handleFileDeleted}
                oncancel={handlefilecancel}>
              </c-document-office-service>

            </template>


            <template if:true={isFileExpand1}>

              <c-convert-word-to-pdf-lwc record-id={recordId} module-path-from-parent="ticket"
                onuploadcomplete={handleAwsUploadComplete}>
              </c-convert-word-to-pdf-lwc>

            </template>

          </div>


          <!-- Existing logo -->
          <div class="logo-container">
            <img src={logo} alt="Te_sign Logo" class="logo-image" />
          </div>

        </div>

      </template>

      <template if:true={isDashboardRecords}>

        <div class="dashboard-records-screen">

          <!-- =====================================================
                  HEADER
              ====================================================== -->
          <div class="dashboard-records-top">

            <div class="dashboard-records-heading">

              <div class="dashboard-records-title">
                {selectedCardTitle}
                <span class="dashboard-record-count">
                  : {dashboardTotalRecords}
                </span>
              </div>

              <div class="dashboard-records-description">
                {selectedCardDescription}
              </div>

            </div>


            <!-- =================================================
                      SEARCH
                  ================================================== -->
            <div class="dashboard-records-actions">

              <div class="dashboard-search-box">

                <input type="text" class="dashboard-search-input" placeholder="Search" value={dashboardSearchTerm}
                  oninput={handleDashboardSearch} />

                <button type="button" class="dashboard-search-button" onclick={handleDashboardSearchClick}
                  title="Search">
                  →
                </button>

              </div>


              <!-- Filter -->
              <!-- <button type="button" class="dashboard-filter-button" onclick={handleDashboardFilterClick} title="Filter">

                <svg class="dashboard-filter-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 6h16"></path>
                  <path d="M7 12h10"></path>
                  <path d="M10 18h4"></path>
                </svg>

              </button> -->


              <lightning-button
                variant="brand"
                label="Close"
                onclick={handleDashboardBack}
              ></lightning-button>

            </div>

          </div>


          <!-- =====================================================
                  TABLE
              ====================================================== -->

          <div class="dashboard-table-container">

            <div class="dashboard-table-scroll">

              <table class={tableClass}>

                <thead>

                  <tr>

                    <th class="dashboard-col-number">
                      No.
                    </th>

                    <th class="dashboard-col-date">
                      Created By
                    </th>

                    <th class="dashboard-col-document">
                      Document Name
                    </th>

                    <th class="dashboard-col-recipient">
                      Recipient List
                    </th>

                    <template if:false={isCompletedCard}>
                      <th class="dashboard-col-individual-status">
                        Individual Recipient Status
                      </th>
                    </template>

                    <template if:true={isExpiringSoonCard}>
                      <th class="dashboard-col-date">
                        Expiry Date
                      </th>
                      <th class="dashboard-col-date">
                        Remaining Time
                      </th>
                    </template>

                    <template if:true={showDocumentUrlColumn}>
                      <th class="dashboard-col-url">
                        Document URL
                      </th>
                    </template>

                    <th class="dashboard-col-status">
                      Status Indicator
                    </th>

                    <th class="dashboard-col-action">
                      Action
                    </th>

                  </tr>

                </thead>


                <tbody>

                  <!-- =====================================
                                  DATA
                              ====================================== -->

                  <template if:true={hasDashboardRecords}>

                    <template for:each={dashboardVisibleRecords} for:item="record" for:index="index">

                      <tr key={record.id} data-record-id={record.id}>

                        <!-- No. -->
                        <td class="dashboard-col-number">
                          {record.dashboardRowNumber}
                        </td>


                        <!-- Created By -->
                        <td class="dashboard-col-date">
                          <div class="created-user">
                            <!-- <div class="user-avatar">
                              {record.createdByInitials}
                            </div> -->

                            <div class="user-info">
                              <div class="user-name" title={record.createdByName}>
                                {record.createdByName}
                              </div>

                              <div class="user-date">
                                {record.createdDateDisplay}
                              </div>
                            </div>
                          </div>
                        </td>


                        <!-- Document -->
                        <td class="dashboard-col-document" title={record.fileName}>
                          <span class="dashboard-document-name">
                            {record.fileName}
                          </span>
                        </td>


                        <!-- =========================================
                                                RECIPIENT LIST
                                            ========================================= -->

                        <td class="dashboard-col-recipient" title={record.recipientListTooltip}>
                          <div class="dashboard-recipient-list">
                            {record.recipientListDisplay}
                          </div>
                        </td>


                        <!-- =========================================
                                                INDIVIDUAL RECIPIENT STATUS
                                            ========================================= -->

                        <template if:false={isCompletedCard}>
                          <td class="dashboard-col-individual-status">

                            <template if:true={record.recipientStatuses}>

                              <div class="dashboard-recipient-status-list">

                                <template for:each={record.recipientStatuses} for:item="recipientStatus">

                                  <span key={recipientStatus.key} class={recipientStatus.className}
                                    title={recipientStatus.label}>
                                    {recipientStatus.label}
                                  </span>

                                </template>

                              </div>

                            </template>

                            <template if:false={record.recipientStatuses}>

                              <span class="dashboard-current-recipient-status">
                                {record.currentRecipientStatusDisplay}
                              </span>

                            </template>

                          </td>
                        </template>


                        <template if:true={isExpiringSoonCard}>
                          <td class="dashboard-col-date">
                            {record.formattedExpiryDate}
                          </td>
                          <td class="dashboard-col-date">
                            <span class={record.remainingTimeClass}>
                              {record.remainingTimeText}
                            </span>
                          </td>
                        </template>

                        <!-- Document URL -->
                        <template if:true={showDocumentUrlColumn}>
                          <td class="dashboard-col-url">

                            <template if:true={record.secureDocumentUrl}>

                              <a href={record.secureDocumentUrl} target="_blank" rel="noopener noreferrer"
                                class="dashboard-document-link" title={record.secureDocumentUrl}>
                                View & Sign
                              </a>

                            </template>

                            <template if:false={record.secureDocumentUrl}>
                              —
                            </template>

                          </td>
                        </template>


                        <!-- Status -->
                        <td class="dashboard-col-status">

                          <span class={record.statusClass}>
                            {record.status}
                          </span>

                        </td>


                        <!-- Action -->
                        <!-- <td class="dashboard-col-action">

                          <div class="dashboard-action-icons">

                            <template if:true={record.showViewAction}>
                              <div class="dashboard-action-icon-wrapper" onclick={handleViewDocument}
                                data-url={record.previousDocumentUrl} title="View Document">
                                <lightning-icon icon-name="utility:preview" size="xx-small"
                                  class="dashboard-action-icon view-icon"></lightning-icon>
                              </div>
                            </template>

                            <template if:true={record.showDownloadAction}>
                              <div class="dashboard-action-icon-wrapper" onclick={handleDownloadDocument}
                                data-url={record.previousDocumentUrl} title="Download Document">
                                <lightning-icon icon-name="utility:download" size="xx-small"
                                  class="dashboard-action-icon download-icon"></lightning-icon>
                              </div>
                            </template>

                          </div>

                        </td> -->
                        <td class="dashboard-col-action">

                          <div class="dashboard-action-icons">

                            <template if:true={record.showViewAction}>
                              <a href="javascript:void(0);"
                                class="action-icon-link"
                                onclick={handleViewDocument}
                                data-url={record.previousDocumentUrl}
                                title="View Document">
                                <i class="material-icons view-icon">visibility</i>
                              </a>
                            </template>

                            <template if:true={record.showDownloadAction}>
                              <a href="javascript:void(0);"
                                class="action-icon-link"
                                onclick={handleDownloadDocument}
                                data-url={record.previousDocumentUrl}
                                title="Download Document">
                                <i class="material-icons view-icon">download</i>
                              </a>
                            </template>

                          </div>

                        </td>
                        

                      </tr>

                    </template>

                  </template>


                  <!-- =====================================
                                  NO DATA
                              ====================================== -->

                  <template if:false={hasDashboardRecords}>

                    <tr class="dashboard-no-data-row">

                      <td colspan="8" class="dashboard-no-data">
                        No documents found.
                      </td>

                    </tr>

                  </template>

                </tbody>

              </table>

            </div>

          </div>


          <!-- =====================================================
                  PAGINATION
              ====================================================== -->

          <!-- <div class="dashboard-pagination-container">

            <div class="dashboard-page-size-container">

              <span class="dashboard-page-size-label">
                Page Size:
              </span>

              <div class="dashboard-page-size-select-container">

                <select class="dashboard-page-size-select" value={dashboardRecordsPerPage}
                  onchange={handleDashboardPageSizeChange}>

                  <template for:each={dashboardPageSizeOptions} for:item="option">

                    <option key={option.value} value={option.value}>
                      {option.label}
                    </option>

                  </template>

                </select>

              </div>

            </div>


            <div class="dashboard-pagination-controls">

              <button type="button" class="dashboard-pagination-button" disabled={dashboardDisableFirst}
                onclick={dashboardFirstPage} title="First Page">
                «
              </button>


              <button type="button" class="dashboard-pagination-button" disabled={dashboardDisableFirst}
                onclick={dashboardPreviousPage} title="Previous Page">
                ‹
              </button>


              <span class="dashboard-pagination-badge">
                Showing {dashboardPageNumber}
                &nbsp;of&nbsp;
                {dashboardTotalPages}
                &nbsp;Page(s)
              </span>


              <button type="button" class="dashboard-pagination-button" disabled={dashboardDisableLast}
                onclick={dashboardNextPage} title="Next Page">
                ›
              </button>


              <button type="button" class="dashboard-pagination-button" disabled={dashboardDisableLast}
                onclick={dashboardLastPage} title="Last Page">
                »
              </button>

            </div>


            <div class="dashboard-total-records">

              <span class="dashboard-total-badge">
                Total Records:
                {dashboardTotalRecords}
              </span>

            </div>

          </div> -->

          <div class="pagination-container slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination">

            <!-- Records Per Page -->
            <div class="slds-list_inline">
              <span style="margin-right: 5px; margin-top: 5px;">Page Size:</span>
              <div class="slds-select_container">
                <select class="slds-select" id="recordsPerPage" onchange={handleDashboardPageSizeChange}>
                  <template for:each={dashboardPageSizeOptions} for:item="option">
                    <option key={option.value} value={option.value}>{option.label}</option>
                  </template>
                </select>
              </div>
            </div>

            <!-- Page Navigation -->
            <div class="slds-align_absolute-center">
              <lightning-button
                disabled={dashboardDisableFirst}
                icon-name="utility:jump_to_left"
                label="First"
                alternative-text="first page"
                onclick={dashboardFirstPage}
                style="margin-right: 10px;">
              </lightning-button>

              <lightning-button
                disabled={dashboardDisableFirst}
                icon-name="utility:chevronleft"
                label="Previous"
                alternative-text="Previous"
                onclick={dashboardPreviousPage}
                style="margin-right: 5px;">
              </lightning-button>

              <span class="slds-badge">
                Showing {dashboardPageNumber} of {dashboardTotalPages} Page(s)
              </span>

              <lightning-button
                disabled={dashboardDisableLast}
                icon-name="utility:chevronright"
                label="Next"
                alternative-text="Next"
                onclick={dashboardNextPage}
                class="slds-p-horizontal_x-small"
                icon-position="right">
              </lightning-button>

              <lightning-button
                disabled={dashboardDisableLast}
                icon-name="utility:jump_to_right"
                label="Last"
                alternative-text="last page"
                onclick={dashboardLastPage}
                icon-position="right">
              </lightning-button>
            </div>

            <!-- Total Records -->
            <div class="slds-clearfix">
              <div class="slds-float_right">
                <span class="slds-badge">Total Records: {dashboardTotalRecords}</span>
              </div>
            </div>



          <!-- =====================================================
                  CLOSE BUTTON
              ====================================================== -->

          <!-- <div class="dashboard-bottom-actions">

            <lightning-button
              variant="brand"
              label="Close"
              onclick={handleDashboardBack}
            ></lightning-button>  -->
          

          </div> 
        </div>

      </template>

      <template if:true={isTSignDocs}>
        <c-t-sign-docs orgid={orgid} onbacktohome={handleBackToHome}>
        </c-t-sign-docs>
      </template>


    </div>
  </template>

  <!-- Error Message Display -->
  <template if:true={errorMessage}>
    <div class="error-message">
      <lightning-icon icon-name="utility:error" alternative-text="Error"></lightning-icon>
      <p>{errorMessage}</p>
    </div>
  </template>

  <template if:true={isLoading}>
    <div class="overlay-logo"></div>

    <div class="spinner-wrapper">
      <div class="loader-container">
        <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
        <img src={imageUrl} alt="T Logo" class="Tlogo" />
      </div>

      <!-- Progress text instead of progress bar -->
      <p class="progress-text">Please wait...</p>
    </div>
  </template>

  <!-- PDF View Modal -->
  <template if:true={showPdfPreviewModal}>
    <div class="pdf-preview-backdrop">
      <div class="pdf-preview-modal" style="width: 75%; height: 85%; max-height: 85%; display: flex; flex-direction: column;">
        <div class="pdf-preview-header">
          <span class="pdf-preview-title">View Document</span>
          <lightning-button-icon
            icon-name="utility:close"
            variant="bare-inverse"
            size="medium"
            onclick={closePdfPreviewModal}
            alternative-text="Close">
          </lightning-button-icon>
        </div>
        
        <div class="pdf-preview-body" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; background: #e2e8f0; position: relative;">
          <template if:true={isPreviewLoading}>
            <lightning-spinner alternative-text="Loading Page..." size="medium"></lightning-spinner>
          </template>
          
          <template if:false={isPreviewLoading}>
            <img src={previewImageSrc} alt="Document Page" class="pdf-preview-img" style="max-width: 100%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border-radius: 4px; background: white;" />
          </template>
        </div>
        
        <div class="pdf-preview-footer" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <lightning-button
              label="Previous"
              icon-name="utility:chevronleft"
              onclick={handlePrevPreviewPage}
              disabled={isFirstPreviewPage}>
            </lightning-button>
            <span style="font-size: 14px; font-weight: 500; color: #475569; user-select: none;">
              Page {previewCurrentPage} of {previewTotalPages}
            </span>
            <lightning-button
              label="Next"
              icon-name="utility:chevronright"
              icon-position="right"
              onclick={handleNextPreviewPage}
              disabled={isLastPreviewPage}>
            </lightning-button>
          </div>
          <lightning-button
            label="Close"
            variant="neutral"
            onclick={closePdfPreviewModal}>
          </lightning-button>
        </div>
      </div>
    </div>
  </template>

  <template if:true={isFileUploaded}>
    <div class="main-inner-container custom-scroll">
      <div class="editor-workspace">

        <!-- =========================================================
             LEFT SIDEBAR: Document Type, Recipients, Drag Placeholders
             ========================================================= -->
        <aside class="editor-sidebar custom-scroll">

          <!-- 1. Document Type Card -->
          <div class="sidebar-card doc-type-card">
            <div class="sidebar-card-header">
              <h3 class="sidebar-card-title">Document Type</h3>
            </div>
            <div class="sidebar-card-body">
              <!-- Custom Dropdown Selector -->
              <div class="custom-dropdown-container">
                <div class="dropdown-trigger" onclick={toggleDropdown}>
                  <span class="selected-value">{selectedDocumentTypeName}</span>
                  <span class="dropdown-caret">▼</span>
                </div>

                <template if:true={isDropdownOpen}>
                  <div class="dropdown-list-container">
                    <!-- Search Input -->
                    <div class="dropdown-search-wrapper" onclick={handleSearchWrapperClick}>
                      <input type="text" placeholder="Search document type..." value={searchKeyword}
                        oninput={handleSearchInput} class="dropdown-search-input" />
                    </div>

                    <!-- Scrollable List of Options -->
                    <ul class="dropdown-list-items">
                      <template for:each={filteredDocumentTypeOptions} for:item="option">
                        <li key={option.value} class={option.class} data-id={option.value} onclick={handleOptionSelect}>
                          <div class="option-label-container">
                            <span class="option-checkmark">
                              <template if:true={option.isSelected}>✓ </template>
                            </span>
                            <span class="option-name">{option.label}</span>
                          </div>

                          <!-- Actions for custom types only -->
                          <template if:false={option.isDefault}>
                            <div class="option-actions">
                              <button class="action-icon-btn" title="Edit Name" data-id={option.value}
                                data-name={option.label} onclick={handleEditLaunch}>✏</button>
                              <button class="action-icon-btn" title="Delete" data-id={option.value}
                                data-name={option.label} onclick={handleDeleteLaunch}>🗑</button>
                            </div>
                          </template>
                        </li>
                      </template>
                      <template if:true={isFilteredListEmpty}>
                        <li class="no-results-item">No results found</li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>

              <button class="add-document-type-btn" onclick={openDocumentTypeModal}>
                + Add Document Type
              </button>
            </div>
          </div>

          <!-- 2. Recipients List Card -->
          <div class="sidebar-card recipients-card">
            <div class="sidebar-card-header">
              <h3 class="sidebar-card-title">Recipients List ( {recipientCount} )</h3>
            </div>
            <div class="sidebar-card-body">

              <!-- Column Header -->
              <!-- <div class="recipients-table-header">
                <span class="col-active">Active</span>
                <span class="col-email">Recipients Email</span>
                <span class="col-permission">Permission</span>
              </div> -->

              <!-- Recipients List Rows -->
              <div class="recipients-list">
                <template for:each={recipientListFormatted} for:item="recipient">
                  <div key={recipient.key} class="recipient-table-row" data-index={recipient.key}
                    data-key={recipient.key} ondragover={handleRecipientReorderOver}
                    ondrop={handleRecipientReorderDrop}>

                    <!-- Drag Handle -->
                    <span class="material-icons recipient-drag-icon" draggable="true" data-index={recipient.key}
                      ondragstart={handleRecipientReorderStart} ondragend={handleRecipientReorderEnd}
                      title="Drag to reorder">
                      drag_indicator
                    </span>

                    <!-- Active Radio Circle Button -->
                    <button type="button" class={recipient.activeRadioClass} data-key={recipient.key}
                      onclick={handleActiveRecipientSelect} title="Set as active recipient"
                      style={recipient.activeRadioStyle}>
                      <span class="radio-inner-dot"></span>
                    </button>

                    <!-- Email Input Wrapper -->
                    <div class="recipient-input-wrapper" style={recipient.colorStyle}>
                      <lightning-input type="email" placeholder={recipient.label} variant="label-hidden"
                        value={recipient.email} data-index={recipient.key} onchange={handleEmailChange}>
                      </lightning-input>
                    </div>

                    <!-- Permission Tag -->
                    <!-- <div class="recipient-permission-badge">
                      <span>Signature</span>
                    </div> -->

                    <!-- Delete Button -->
                    <template if:true={recipient.canRemove}>
                      <button class="delete-recipient-btn" onclick={removeRecipient} data-index={recipient.key}
                        aria-label="Remove recipient" title="Remove recipient">
                        ✕
                      </button>
                    </template>

                  </div>
                </template>
              </div>

              <!-- Add Recipient Button -->
              <button class="add-recipient-btn-primary" onclick={addRecipient}>
                <span class="add-icon">+</span> Add New Recipient
              </button>

            </div>
          </div>

          <!-- 3. Drag & Drop Placeholders Card -->
          <div class="sidebar-card drag-drop-card">
            <div class="sidebar-card-header">
              <h3 class="sidebar-card-title">
                <template if:false={showCustomFieldEditor}>Drag & Drop ( 10 )</template>
                <template if:true={showCustomFieldEditor}>{customFieldModalTitle}</template>
              </h3>
            </div>
            <div class="sidebar-card-body">

              <template if:false={showCustomFieldEditor}>
                <div class="placeholders-grid">
                  <!-- Full Name -->
                  <div class="placeholder-item" draggable="true" data-type="FullName" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for Full Name">
                    <i class="material-icons placeholder-icon">badge</i>
                    <span class="placeholder-label">Full Name</span>
                  </div>

                  <!-- Email -->
                  <div class="placeholder-item" draggable="true" data-type="Email" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for Email">
                    <i class="material-icons placeholder-icon">email</i>
                    <span class="placeholder-label">Email</span>
                  </div>

                  <!-- Contact Number -->
                  <div class="placeholder-item" draggable="true" data-type="ContactNumber" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for Contact Number">
                    <i class="material-icons placeholder-icon">phone_android</i>
                    <span class="placeholder-label">Contact Number</span>
                  </div>

                  <!-- Address -->
                  <div class="placeholder-item" draggable="true" data-type="Address" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for Address">
                    <i class="material-icons placeholder-icon">location_on</i>
                    <span class="placeholder-label">Address</span>
                  </div>

                  <!-- Date -->
                  <div class="placeholder-item" draggable="true" data-type="Date" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for Date">
                    <i class="material-icons placeholder-icon">calendar_today</i>
                    <span class="placeholder-label">Date</span>
                  </div>

                  <!-- Date of Signing -->
                  <div class="placeholder-item" draggable="true" data-type="DateOfSigning" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for Date of Signing">
                    <i class="material-icons placeholder-icon">edit_calendar</i>
                    <span class="placeholder-label">Date of Signing</span>
                  </div>

                  <!-- Initials -->
                  <div class="placeholder-item" draggable="true" data-type="Initials" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for Initials">
                    <i class="material-icons placeholder-icon">sort_by_alpha</i>
                    <span class="placeholder-label">Initials</span>
                  </div>

                  <!-- ABN -->
                  <div class="placeholder-item" draggable="true" data-type="ABN" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for ABN">
                    <i class="material-icons placeholder-icon">domain</i>
                    <span class="placeholder-label">ABN</span>
                  </div>

                  <!-- Signature -->
                  <div class="placeholder-item" draggable="true" data-type="Signature" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for Signature">
                    <i class="material-icons placeholder-icon">draw</i>
                    <span class="placeholder-label">Signature</span>
                  </div>

                  <!-- First Name -->
                  <div class="placeholder-item" draggable="true" data-type="Name" ondragstart={handleDragStart}
                    aria-label="Draggable placeholder for First Name">
                    <i class="material-icons placeholder-icon">person</i>
                    <span class="placeholder-label">First Name</span>
                  </div>

                  <!-- Custom Fields List inside the same grid -->
                  <template for:each={customFields} for:item="cf">
                    <div key={cf.key} class="placeholder-item custom-placeholder-item" draggable="true"
                      data-type={cf.dataType} data-custom-key={cf.key} ondragstart={handleDragStart}
                      onclick={handleEditCustomField} data-key={cf.key} aria-label={cf.label}>
                      <i class="material-icons placeholder-icon">
                        {cf.icon}
                      </i>
                      <span class="placeholder-label">{cf.label}</span>
                      <i class="material-icons delete-custom-field-def-btn" onclick={deleteCustomFieldDefinition}
                        data-key={cf.key}>
                        delete
                      </i>
                    </div>
                  </template>
                </div>

                <!-- Add Custom Field Button always at the bottom -->
                <button class="add-custom-field-btn" onclick={openCustomFieldModal}>
                  <span class="add-icon">+</span> Add Custom Field
                </button>
              </template>

              <template if:true={showCustomFieldEditor}>
                <div class="custom-field-editor"
                  style="display: flex; flex-direction: column; gap: 12px; padding-top: 4px;">
                  <lightning-input type="text" label="Field Label" value={customFieldLabel}
                    onchange={handleCustomFieldLabelChange} required placeholder="e.g. Employee ID">
                  </lightning-input>

                  <lightning-combobox label="Data Type" value={customFieldDataType} options={customFieldDataTypeOptions}
                    onchange={handleCustomFieldDataTypeChange} required>
                  </lightning-combobox>

                  <template if:true={isCustomFieldPicklist}>
                    <lightning-textarea label="Picklist Options (one per line)" value={customFieldOptions}
                      onchange={handleCustomFieldOptionsChange}
                      placeholder="Enter options, e.g.&#10;Full Time&#10;Part Time&#10;Contractor" required>
                    </lightning-textarea>
                  </template>

                  <div style="display: flex; gap: 8px; margin-top: 8px; width: 100%;">
                    <lightning-button label="Cancel" variant="neutral" onclick={closeCustomFieldModal}
                      style="flex: 1;"></lightning-button>
                    <lightning-button label={customFieldModalButtonLabel} variant="brand"
                      onclick={handleCreateCustomField} style="flex: 1;"></lightning-button>
                  </div>
                </div>
              </template>

            </div>
          </div>

        </aside>

        <!-- =========================================================
             RIGHT MAIN: Canvas & Document Preview Area
             ========================================================= -->
        <main class="editor-canvas-container custom-scroll">

          <!-- Top Floating Toolbar -->
          <!-- <div class="canvas-top-toolbar">
            <button class="toolbar-icon-btn" title="Undo" type="button" disabled>
              <i class="material-icons">undo</i>
            </button>
            <button class="toolbar-icon-btn" title="Redo" type="button" disabled>
              <i class="material-icons">redo</i>
            </button>
            <button class="toolbar-icon-btn" title="Reset / Reload" type="button" onclick={handleReset}>
              <i class="material-icons">refresh</i>
            </button>
            <button class="toolbar-icon-btn" title="Preview" type="button">
              <i class="material-icons">visibility</i>
            </button>
          </div> -->

          <!-- Document Canvas Viewport -->
          <template if:true={imageSrc}>
            <div class="canvas-viewport custom-scroll" ondrop={handleDrop} ondragover={allowDrop}>
              <div class="image-container" style={containerStyle}>
                <img src={imageSrc} alt="Rendered PDF Page" />

                <!-- Render Dropped Placeholders -->
                <template for:each={placeholdersForCurrentPage} for:item="placeholder">
                  <div key={placeholder.id} class="placeholder-container measurable-placeholder"
                    style={placeholder.combinedStyle} onmousedown={handleRearrangeStart}
                    onclick={handleRecipientBadgeClick} data-id={placeholder.id} data-type={placeholder.type}>

                    <template if:true={placeholder.isName}>
                      <input type="text" class="placeholder-input" placeholder="Enter First Name"
                        value={placeholder.value} disabled data-id={placeholder.id} />
                    </template>
                    <!-- Full Name Placeholder -->
                    <template if:true={placeholder.isFullName}>
                      <input type="text" class="placeholder-input" placeholder="Enter Full Name"
                        value={placeholder.value} disabled data-id={placeholder.id} />
                    </template>
                    <template if:true={placeholder.isLastName}>
                      <input type="text" class="placeholder-input" placeholder="Enter Last Name"
                        value={placeholder.value} disabled data-id={placeholder.id} />
                    </template>
                    <!-- Email Placeholder -->
                    <template if:true={placeholder.isEmail}>
                      <input type="email" class="placeholder-input" placeholder="Enter Email" value={placeholder.value}
                        disabled data-id={placeholder.id} />
                    </template>

                    <!-- Contact Number Placeholder -->
                    <template if:true={placeholder.isContactNumber}>
                      <input type="text" class="placeholder-input" placeholder="Enter Contact No"
                        value={placeholder.value} disabled data-id={placeholder.id} />
                    </template>

                    <!-- Address Placeholder -->
                    <template if:true={placeholder.isAddress}>
                      <textarea class="placeholder-textarea" placeholder="Enter Address" value={placeholder.value}
                        disabled data-id={placeholder.id}></textarea>
                    </template>

                    <!-- Date Placeholder -->
                    <template if:true={placeholder.isDate}>
                      <input type="date" class="placeholder-input" value={placeholder.value} disabled
                        data-id={placeholder.id} />
                    </template>

                    <!-- Date of Signing Placeholder -->
                    <template if:true={placeholder.isDateOfSigning}>
                      <input type="date" class="placeholder-input" value={placeholder.value} disabled
                        data-id={placeholder.id} />
                    </template>

                    <!-- Initials Placeholder -->
                    <template if:true={placeholder.isInitials}>
                      <!-- Dropdown for initials -->
                      <select class="placeholder-dropdown" onchange={handleInitialsSelection} data-id={placeholder.id}>
                        <option value="">Init.</option>
                        <option value="Mr">Mr</option>
                        <option value="Mrs">Mrs</option>
                        <option value="Miss">Miss</option>
                        <option value="Dr">Dr</option>
                      </select>
                    </template>

                    <!-- ABN Placeholder -->
                    <template if:true={placeholder.isABN}>
                      <input type="text" class="placeholder-input" placeholder="Enter ABN" value={placeholder.value}
                        disabled data-id={placeholder.id} />
                    </template>

                    <!-- For Signature Placeholder -->
                    <template if:true={placeholder.isSignature}>
                      <!-- Upload Signature Button -->
                      <button class="placeholder-upload" disabled data-id={placeholder.id}>
                        Upload Signature
                      </button>
                    </template>

                    <!-- Custom Fields Rendering -->
                    <template if:true={placeholder.isCustom}>
                      <!-- Text / Number / Email / Phone / Currency -->
                      <template if:true={placeholder.isCustomText}>
                        <input type="text" class="placeholder-input" placeholder={placeholder.label}
                          value={placeholder.value} disabled
                          style="width: 100%; height: 100%; border: none; background: transparent; padding: 4px;" />
                      </template>
                      <template if:true={placeholder.isCustomLongText}>
                        <textarea class="placeholder-textarea" placeholder={placeholder.label} disabled
                          style="width: 100%; height: 100%; border: none; background: transparent; padding: 4px; resize: none;">{placeholder.value}</textarea>
                      </template>
                      <template if:true={placeholder.isCustomNumber}>
                        <input type="number" class="placeholder-input" placeholder={placeholder.label}
                          value={placeholder.value} disabled
                          style="width: 100%; height: 100%; border: none; background: transparent; padding: 4px;" />
                      </template>
                      <template if:true={placeholder.isCustomCurrency}>
                        <input type="text" class="placeholder-input" placeholder={placeholder.label}
                          value={placeholder.value} disabled
                          style="width: 100%; height: 100%; border: none; background: transparent; padding: 4px;" />
                      </template>
                      <template if:true={placeholder.isCustomDate}>
                        <input type="date" class="placeholder-input" value={placeholder.value} disabled
                          style="width: 100%; height: 100%; border: none; background: transparent; padding: 4px;" />
                      </template>
                      <template if:true={placeholder.isCustomEmail}>
                        <input type="email" class="placeholder-input" placeholder={placeholder.label}
                          value={placeholder.value} disabled
                          style="width: 100%; height: 100%; border: none; background: transparent; padding: 4px;" />
                      </template>
                      <template if:true={placeholder.isCustomPhone}>
                        <input type="tel" class="placeholder-input" placeholder={placeholder.label}
                          value={placeholder.value} disabled
                          style="width: 100%; height: 100%; border: none; background: transparent; padding: 4px;" />
                      </template>
                      <template if:true={placeholder.isCustomBoolean}>
                        <div
                          style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
                          <input type="checkbox" checked={placeholder.checkedValue} disabled
                            style="transform: scale(1.2);" />
                        </div>
                      </template>
                      <template if:true={placeholder.isCustomPicklist}>
                        <select class="placeholder-dropdown" disabled
                          style="width: 100%; height: 100%; border: none; background: transparent; padding: 4px; appearance: none; -webkit-appearance: none;">
                          <option value="">{placeholder.label}</option>
                          <template for:each={placeholder.options} for:item="opt">
                            <option key={opt} value={opt}>{opt}</option>
                          </template>
                        </select>
                      </template>
                    </template>

                    <template if:false={placeholder.isSignature}>
                      <div class="resize-handle" onmousedown={handleResizeStart} data-id={placeholder.id}></div>
                    </template>
                    <button class="delete-placeholder" onclick={deletePlaceholder} data-id={placeholder.id}>
                      X
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Canvas Bottom Bar: Pagination & Actions -->
          <div class="canvas-bottom-bar">
            <div class="canvas-pagination-wrapper">
              <template if:true={isPaginationVisible}>
                <div class="pagination-controls-modern">
                  <button class="pagination-arrow-btn" onclick={showPreviousPage} disabled={isFirstPage}
                    title="Previous Page">
                    ◀
                  </button>
                  <span class="pagination-page-indicator">{currentPage}/{totalPages}</span>
                  <button class="pagination-arrow-btn" onclick={showNextPage} disabled={isLastPage} title="Next Page">
                    ▶
                  </button>
                </div>
              </template>
              <template if:false={isPaginationVisible}>
                <span class="pagination-page-indicator">{currentPage}/{totalPages}</span>
              </template>
            </div>

            <div class="canvas-actions-wrapper">
              <lightning-button label="Cancel" variant="neutral" onclick={handleReset}
                class="canvas-btn-cancel"></lightning-button>
              <lightning-button label="Send" variant="brand" onclick={showConfirmationPopup}
                class="canvas-btn-send"></lightning-button>
            </div>
          </div>

        </main>

      </div>

      <template if:true={showRecipientModal}>
        <section role="dialog" tabindex="-1" class="recipient-modal-container">
          <div class="recipient-modal">
            <header class="recipient-modal-header">
              <h2 class="recipient-modal-title">Select Recipient</h2>
              <button class="recipient-modal-close" onclick={cancelRecipientSelection} aria-label="Close Modal">
                ✖
              </button>
            </header>
            <div class="recipient-modal-content">
              <lightning-radio-group name="recipientRadio" options={recipientRadioOptions} value={selectedRecipient}
                onchange={handleRecipientSelection}>
              </lightning-radio-group>
              <template if:true={showTextStylePanel}>
                <!-- Text Style Panel -->
                <div class="style-panel">
                  <div class="style-panel-header">
                    <div class="style-panel-icon">Aa</div>
                    <div class="style-panel-header-text">
                      <h3 class="style-panel-title">Text style</h3>
                      <p class="style-panel-subtitle">Customize how this field will look in the document.</p>
                    </div>
                    <lightning-input type="toggle" class="style-panel-toggle" checked={useCustomInlineStyle}
                      onchange={handleCustomInlineStyleToggle}>
                    </lightning-input>
                  </div>

                  <div class={stylePanelGridClass}>
                    <!-- LEFT: controls -->
                    <div class="style-panel-left">
                      <div class="slds-m-bottom_small">
                        <div class="floating-label">
                          <span class="label-text-drop">Font family</span>
                          <lightning-combobox name="fontFamily" variant="label-hidden" value={styleOptions.fontFamily}
                            options={fontFamilyOptions} onchange={handleStyleOptionChange}>
                          </lightning-combobox>
                        </div>
                      </div>

                      <div class="slds-m-bottom_small">
                        <div class="floating-label">
                          <span class="label-text-drop">Font size</span>
                          <lightning-combobox name="fontSize" variant="label-hidden" value={styleOptions.fontSize}
                            options={fontSizeOptions} onchange={handleStyleOptionChange}>
                          </lightning-combobox>
                        </div>
                      </div>

                      <div class="style-panel-toggle-row slds-m-bottom_small">
                        <button type="button" class={boldToggleClass} data-style-name="bold"
                          onclick={handleStyleToggleClick}>
                          B
                        </button>
                        <button type="button" class={italicToggleClass} data-style-name="italic"
                          onclick={handleStyleToggleClick}>
                          I
                        </button>
                        <button type="button" class={underlineToggleClass} data-style-name="underline"
                          onclick={handleStyleToggleClick}>
                          U
                        </button>
                      </div>

                      <div class="style-panel-color-row">
                        <lightning-input type="color" name="color" label="Text color" value={styleOptions.color}
                          onchange={handleStyleOptionChange}>
                        </lightning-input>
                      </div>
                    </div>

                    <!-- RIGHT: live preview -->
                    <div class="style-panel-right">
                      <div class="style-preview-card">
                        <div class="style-preview-label">Live preview</div>
                        <div class="style-preview-body" style={stylePreviewCss}>
                          Example: This is how text in this field will appear to the recipient.
                        </div>

                      </div>
                    </div>
                  </div>
                </div>
              </template>


            </div>
            <footer class="recipient-modal-footer">
              <button class="recipient-modal-cancel-btn" onclick={cancelRecipientSelection}>
                Cancel
              </button>
              <button class="recipient-modal-confirm-btn" onclick={confirmRecipientSelection}>
                Confirm
              </button>
            </footer>
          </div>
          <div class="recipient-modal-backdrop"></div>
        </section>
      </template>



      <!-- Add Document Type Modal -->
      <template if:true={showDocumentTypeModal}>
        <div class="template-modal-overlay">
          <div class="template-modal" style="width: 400px; max-width: 90%;">
            <div class="template-modal-header">
              <span class="template-modal-title">Add Document Type</span>
              <button class="template-modal-close" onclick={closeDocumentTypeModal}>×</button>
            </div>
            <div class="template-modal-body">
              <lightning-input type="text" label="Document Type Name" value={newDocumentTypeName}
                onchange={handleNewDocumentTypeNameChange} placeholder="Enter Document Type name">
              </lightning-input>
            </div>
            <div class="template-modal-footer">
              <lightning-button label="Cancel" class="slds-m-right_small" variant="neutral"
                onclick={closeDocumentTypeModal}></lightning-button>
              <lightning-button label="Save" variant="brand" onclick={handleSaveDocumentType}
                disabled={isSavingDocumentType}></lightning-button>
            </div>
          </div>
        </div>
      </template>

      <!-- Create Custom Field Modal -->
      <template if:true={showCustomFieldModal}>
        <div class="template-modal-overlay">
          <div class="template-modal" style="width: 450px; max-width: 90%;">
            <div class="template-modal-header">
              <span class="template-modal-title">{customFieldModalTitle}</span>
              <button class="template-modal-close" onclick={closeCustomFieldModal}>×</button>
            </div>
            <div class="template-modal-body" style="display: flex; flex-direction: column; gap: 12px; padding: 16px;">
              <lightning-input type="text" label="Field Label" value={customFieldLabel}
                onchange={handleCustomFieldLabelChange} required placeholder="e.g. Employee ID">
              </lightning-input>

              <lightning-combobox label="Data Type" value={customFieldDataType} options={customFieldDataTypeOptions}
                onchange={handleCustomFieldDataTypeChange} required>
              </lightning-combobox>

              <template if:true={isCustomFieldPicklist}>
                <lightning-textarea label="Picklist Options (one per line)" value={customFieldOptions}
                  onchange={handleCustomFieldOptionsChange}
                  placeholder="Enter options, e.g.&#10;Full Time&#10;Part Time&#10;Contractor" required>
                </lightning-textarea>
              </template>

              <lightning-input type="checkbox" label="Required Field" checked={customFieldRequired}
                onchange={handleCustomFieldRequiredChange}>
              </lightning-input>
            </div>
            <div class="template-modal-footer">
              <lightning-button label="Cancel" class="slds-m-right_small" variant="neutral"
                onclick={closeCustomFieldModal}></lightning-button>
              <lightning-button label={customFieldModalButtonLabel} variant="brand"
                onclick={handleCreateCustomField}></lightning-button>
            </div>
          </div>
        </div>
      </template>

      <!-- Edit Document Type Modal -->
      <template if:true={showEditModal}>
        <div class="template-modal-overlay">
          <div class="template-modal" style="width: 400px; max-width: 90%;">
            <div class="template-modal-header">
              <span class="template-modal-title">Edit Document Type</span>
              <button class="template-modal-close" onclick={closeEditModal}>×</button>
            </div>
            <div class="template-modal-body">
              <lightning-input type="text" label="Document Type Name" value={editingRecordName}
                onchange={handleEditNameChange} placeholder="Enter Document Type name">
              </lightning-input>
            </div>
            <div class="template-modal-footer">
              <lightning-button label="Cancel" class="slds-m-right_small" variant="neutral"
                onclick={closeEditModal}></lightning-button>
              <lightning-button label="Save" variant="brand" onclick={handleSaveEditDocumentType}
                disabled={isSavingEdit}></lightning-button>
            </div>
          </div>
        </div>
      </template>

      <!-- Delete Document Type Confirmation Modal -->
      <template if:true={showDeleteModal}>
        <div class="template-modal-overlay">
          <div class="template-modal" style="width: 400px; max-width: 90%;">
            <div class="template-modal-header">
              <span class="template-modal-title">Delete Document Type?</span>
              <button class="template-modal-close" onclick={closeDeleteModal}>×</button>
            </div>
            <div class="template-modal-body">
              <p>Are you sure you want to delete "{deletingRecordName}"?</p>
            </div>
            <div class="template-modal-footer">
              <lightning-button label="Cancel" class="slds-m-right_small" variant="neutral"
                onclick={closeDeleteModal}></lightning-button>
              <lightning-button label="Delete" variant="destructive" onclick={handleConfirmDelete}
                disabled={isDeleting}></lightning-button>
            </div>
          </div>
        </div>
      </template>

      <template if:true={isConfirmationPopupVisible}>
        <div class="confirmation-popup-backdrop">
          <div class="confirmation-popup">
            <template if:true={isSendConfirmationPopup}>
              <header class="confirmation-popup-header">
                <h2>Confirm Submission</h2>
                <!-- <button class="close-popup-btn" onclick={closeConfirmationPopup}>✖</button> -->
              </header>
              <div class="confirmation-popup-content">
                <p>Are you sure you want to send this document for signature?</p>
                <div class="document-details">
                  <h3>Recipients:</h3>
                  <ul>
                    <template for:each={recipientEmails} for:item="recipient">
                      <li key={recipient.key}>Email: {recipient.email}</li>
                    </template>
                  </ul>
                </div>
                <p class="warning-text">
                  Please review the details above carefully.<br />
                  Once sent, you will not be able to make any changes.
                </p>
              </div>
              <footer class="confirmation-popup-footer">
                <button class="cancel-btn" onclick={closeConfirmationPopup}>
                  Cancel
                </button>
                <button class="send-btn" onclick={handleSendConfirmation}>
                  Send
                </button>
              </footer>
            </template>

            <template if:false={isSendConfirmationPopup}>
              <header class="confirmation-popup-header">
                <h2>Confirm Recipient Removal</h2>
              </header>
              <div class="confirmation-popup-content">
                <p>Recipient <strong>"{recipientToRemoveName}"</strong> has {assignedPlaceholdersCount} assigned
                  placeholders.</p>
                <p class="warning-text" style="font-weight: bold; margin-top: 1rem;">What would you like to do?</p>

                <template if:true={hasOtherRecipients}>
                  <div class="document-details" style="text-align: left; margin: 1rem 0;">
                    <h3>Reassign placeholders to:</h3>
                    <lightning-combobox name="reassignRecipient" value={selectedReassignRecipientKey}
                      placeholder="-- Choose Recipient --" options={reassignRecipientOptions}
                      onchange={handleReassignRecipientChange} variant="label-hidden">
                    </lightning-combobox>
                  </div>
                </template>
              </div>
              <footer class="confirmation-popup-footer"
                style="display: flex; flex-direction: column; gap: 0.75rem; align-items: center;">
                <div style="display: flex; gap: 1rem; justify-content: center; width: 100%;">
                  <button class="cancel-btn" onclick={closeConfirmationPopup}>
                    Cancel
                  </button>
                  <button class="send-btn" onclick={handleDeleteRecipientAndPlaceholders} style="background: #C23934;">
                    Delete Recipient and All Placeholders
                  </button>
                </div>
                <template if:true={hasOtherRecipients}>
                  <button class="send-btn" onclick={handleReassignAndRemoveRecipient} disabled={isReassignDisabled}
                    style="width: 80%; text-align: center;">
                    Reassign Placeholders and Delete Recipient
                  </button>
                </template>
              </footer>
            </template>
          </div>
        </div>
      </template>

    </div>
  </template>

  <template if:true={isLoadingCircle}>
    <div class="loading-screen-container">
      <div class="loading-content">
        <!-- Rotating Loader Circle -->
        <div class="loading-circle"></div>
        <h2 class="loading-text">Processing your request...</h2>
      </div>
    </div>
  </template>

  <template if:true={showSuccessScreen}>
    <div class="success-screen-container">
      <div class="success-content">
        <!-- Animated Green Checkmark -->
        <div class="checkmark-wrapper">
          <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none" />
            <path class="checkmark-check" fill="none" d="M14 27l10 10L39 16" />
          </svg>
        </div>

        <!-- Success Message -->
        <h1 class="success-title">Document Sent Successfully</h1>
        <p class="success-description">
          Thank you for using our service.<br />
          You will receive a notification once the document is signed and
          completed.
        </p>

        <!-- Close Button -->
        <button class="success-close-btn" onclick={handleCloseScreen}>
          Done
        </button>
      </div>
    </div>
  </template>

  <template if:true={isTemplateUploadChoiceModal}>
    <div class="template-modal-overlay">
      <div class="template-modal">
        <div class="template-modal-header">
          <span class="template-modal-title">Choose Upload Option</span>
          <button class="template-modal-close" onclick={closeTemplateUploadChoiceModal}>
            ×
          </button>
        </div>

        <div class="template-modal-body slds-align_absolute-center slds-p-around_medium">
          <template if:false={isSupportCoordinator}>
            <lightning-button label="Use Existing Template" variant="brand-outline" class="slds-m-right_small"
              onclick={handleUseExistingTemplate}></lightning-button>
          </template>
          <lightning-button label="Upload New File" variant="brand"
            onclick={triggerNativeFileUpload}></lightning-button>
        </div>
      </div>
    </div>
  </template>
  <template if:true={showExistingTemplatesTable}>
    <div class="template-modal-overlay">
      <div class="template-modal1 large">
        <div class="template-modal-header">
          <span class="template-modal-title">Select a Created Template</span>
          <button class="template-modal-close" onclick={closeExistingTemplatesTable}>
            ×
          </button>
        </div>

        <div class="template-modal-body custom-scroll">
          <table class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
              <tr>
                <th style="width: 10%">Select</th>
                <th>Template Name</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={cretPaginatedListWithChecked} for:item="template">
                <tr key={template.Id}>
                  <td>
                    <input type="radio" name="selectedTemplate" value={template.Id} data-id={template.Id}
                      data-url={template.AWS_Document__c} onchange={handleTemplateRadioChange}
                      checked={template.isChecked} />
                  </td>
                  <td>{template.Document_Name__c}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <template if:true={cretTemplateTotalRecords}>
          <div
            class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-top_small fixed-pagination">
            <!-- PAGE NAVIGATION -->
            <div class="slds-align_absolute-center" style="height: 5rem">
              <lightning-button disabled={cretDisableFirst} icon-name="utility:jump_to_left" label="First"
                class="slds-p-horizontal_x-small" alternative-text="First page"
                onclick={handleCretFirst}></lightning-button>

              <lightning-button disabled={cretDisableFirst} icon-name="utility:chevronleft" label="Previous"
                alternative-text="Previous" onclick={handleCretPrevious}></lightning-button>

              &nbsp;
              <span class="slds-badge">
                Showing {cretPageNumber} of {cretTotalPages} Page(s)
              </span>
              &nbsp;

              <lightning-button disabled={cretDisableLast} icon-name="utility:chevronright" label="Next"
                alternative-text="Next" onclick={handleCretNext} class="slds-p-horizontal_x-small"
                icon-position="right"></lightning-button>

              <lightning-button disabled={cretDisableLast} icon-name="utility:jump_to_right" label="Last"
                alternative-text="Last page" onclick={handleCretLast} icon-position="right"></lightning-button>
            </div>

            <!-- TOTAL RECORDS -->
            <div class="slds-clearfix">
              <div class="slds-float_right">
                <span class="slds-badge">
                  Total Records: {cretTemplateTotalRecords}
                </span>
              </div>
            </div>
          </div>
        </template>

        <div class="template-modal-footer">
          <lightning-button variant="brand" label="Continue"
            onclick={handleContinueWithSelectedTemplate}></lightning-button>
        </div>
      </div>
    </div>
  </template>



</template>
