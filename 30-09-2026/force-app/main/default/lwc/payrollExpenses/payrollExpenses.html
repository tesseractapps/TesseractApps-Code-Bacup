<template>
    <div class="Expensescontainer">
    <!-- <lightning-card> -->
        <!-- <h3 slot="title">
            <img src={employee} alt="" width="45px" height="45px" style="margin-right:0.1%">
            Expense Details
        </h3> -->

        <template if:false={addExpenses}>
            <div style="padding-top:20px;font-size:14px;font-weight:bold;margin-left:2%">                
                <!-- <img src={employee} alt="" width="45px" height="45px" style="margin-right:0.1%">  -->
                Expense Details        
            </div>

            <div if:true={isDesktop}>
                <div class="slds-grid slds-gutters" style="margin-top:50px;margin-bottom:30px;width:100%;margin-left:2%">
                    <div  style="width:250px;margin-right:8px;">
                        <lightning-combobox  name="Facility"
                            label="Name of the Facility" required="true" value={selectedValue} placeholder="Select Facility"
                            options={facilityOptions} onchange={handleChange}>
                        </lightning-combobox>
                    </div>
                    <div  style="margin-right:8px;">
                        <lightning-input  name="startdateValueData" type="Date" label="Start Date"
                            value={startdateValueData} onchange={handleChange}> </lightning-input>
    
                    </div>
                    <div  style="margin-right:180px;">
                        <lightning-input  name="enddateValueData" type="Date" label="End Date"
                            value={enddateValueData} onchange={handleChange} > </lightning-input> 
                            <p style="color:red">{errorMessage}</p>   
                    </div>
                    <div style="margin-right:8px; margin-top:24px;">
                        <lightning-button  label="Import CSV" variant="brand" onclick={handleImport} style="margin-right:8px;" 
                        ></lightning-button>
                        <!-- <lightning-button variant="brand" label="Download Expense Format" title="Expense File"
                        onclick={handleDownloadExpense} style="margin-right:8px;"
                        ></lightning-button> -->
                        <lightning-button label="Add Expenses" variant="brand" onclick={handleaddExpenses} style="margin-right:8px;"
                        ></lightning-button>
                        <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={RefreshExpensesData}>
                            <svg class="slds-button__icon" aria-hidden="true">
                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                            </svg>
                        </button>
                    </div>  
                </div>
            </div>

            

            <div if:true={isDesktop} style="width:100%;">
                <template if:true={staffexpensesData}>
                    <div class="slds-grid">
                        <div style="margin-left:2%;margin-right:2%;width:65%">
                            <table class="slds-table" style="table-layout: fixed; margin-right:5%">
                                <thead>
                                    <tr>
                                        <th style="width:15%;" class="slds-cell-wrap th">Type of Expense</th>
                                        <!-- <th  class="slds-cell-wrap th">Description</th> -->
                                        <!-- <th><b>Comments</b></th> -->
                                        <th  class="slds-cell-wrap th">Date</th>
                                        <th  class="slds-cell-wrap th">User</th>
                                        <th  class="slds-cell-wrap th">Incl GST</th>
                                        <th  class="slds-cell-wrap th">Amount</th>
                                        <!-- <th><b>Status</b></th> -->
                                        <th  class="slds-cell-wrap th">Actions</th>

                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={Listofdata_Pagination} for:item="acc">
                                        <tr key={acc.Id} class="tr1">
                                            <td class="slds-cell-wrap"> {acc.Type_of_Expense__c}</td>
                                           <!--  <td class="slds-cell-wrap">{acc.description}</td> -->
                                            <!-- <td class="slds-cell-wrap"> {acc.Comments__c}</td> -->
                                            <td class="slds-cell-wrap">{acc.dateIssued}</td>
                                            <td class="slds-cell-wrap">{acc.User_Name__c}</td>
                                            <td class="slds-cell-wrap">$ {acc.gst}</td>
                                            <td class="slds-cell-wrap">$ {acc.amount}</td>
                                            <!-- <td class="slds-cell-wrap">{acc.Status__c}</td> -->
                                            <td>
                                                <div>
                                                <a href={acc.Amazon_URL__c} data-id={acc.Id} data-url={acc.Amazon_URL__c}  
                                                onclick={handleView} title="View Payroll">View</a></div>
                                                |
                                                <a href="javascript:void(0)" data-id={acc.Id} target="_blank"
                                                        onclick={hanldeEdit} title="View Payroll">Edit</a></div>
                                                |
                                                <a href="javascript:void(0)" data-id={acc.Id} target="_blank"
                                                        onclick={handleDelete} title="View Payroll">Delete</a></div>
                                                
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <div class="slds-float_right slds-m-right_xx-large" style="margin-right:20%">
                                <b><i>Total Amount: &nbsp;${expensesAmount}</i></b>
                            </div>
                            
                        </div>

                        <div style="width:33%" class=" slds-m-top_medium">
                            <div class=" slds-theme_default slds-m-top_large">
                                <canvas lwc:dom="manual"></canvas>
                            </div>
                        </div> 
                    </div>
                    <!--Pagination Start-->
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;width:65%;margin-left:2%">
                        <!-- RECORDS PER PAGE -->
                        <div class="slds-col">
                            <div class="slds-list_inline ">
                                <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                                <label class="slds-text-color_weak" for="recordsPerPage"></label><!--slds-p-horizontal_x-small-->
                                <div class="slds-select_container">
                                    <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                        <template for:each={pageSizeOptions} for:item="option">
                                            <option key={option} value={option}>{option}</option>
                                        </template> 
                                    </select>
                                </div>
                            </div>
                        </div>
                        <!-- PAGE NAVIGATION -->
                        <div class="slds-align_absolute-center" style="height:5rem;">
                            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                        </div>
                        <!-- TOTAL RECORDS -->
                        <div class="slds-clearfix">
                            <div class="slds-float_right">
                                <span class="slds-badge"> Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            <template if:true={staffexpensesNoData}>
                <div class="slds-m-around_large slds-p-left_x-large" style="color:green;">
                    <b>There is no Expense for the Facility</b>
                </div>
            </template>
        </template>
        
        <!--Edit Modal-->
        <template if:true={openExpenses}>
            <h3 style="font-weight: bold; margin-top:1%;margin-left:1.2%">Add New Expense</h3>
            <div class="slds-p-around_medium" style="margin-top: 1%;">
                <lightning-record-edit-form object-api-name="Expenses__c" onsuccess={handleSuccess} onsubmit={handleSubmit} record-id={recordId}>
                    <lightning-messages></lightning-messages>
                    <div class="slds-grid">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Type_of_Expense__c" name="typeofExpense" required="true" onchange={changeExpense}></lightning-input-field>
                            <lightning-input-field field-name="Code__c" value={code} required="true" disabled="true"></lightning-input-field>
                            <lightning-input-field field-name="Expense_Claims__c" value={expenseClaim} disabled="true"></lightning-input-field> 
                            <lightning-input-field field-name="Tax_Code__c" value={taxCode}></lightning-input-field>
                            
                            <!-- <lightning-input-field field-name="Comments__c"></lightning-input-field> -->
                            <lightning-input-field field-name="GST__c"></lightning-input-field>
                            <template if:true={isVisible}>	
                            <lightning-input-field field-name="Facility__c" value={facilityId}  disabled></lightning-input-field>
                            </template>
                            <lightning-input type="file" onchange={onFileUpload} name="uploadFile" label="Upload File" style="margin-left:5px;">  
                            </lightning-input>
                            <div class="slds-text-body_small">{fileName}
                                <template if:true={showSpinner}>
                                    <lightning-spinner alternative-text="Uploading the file......" size="medium">                        
                                    </lightning-spinner>
                                </template>
                            </div>
                            <template if:true={isattachError}>
                                <p style="color:red">File Size Can not exceed 512MB</p>                                  
                            </template>                                      
                        </div>
                        
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Sub_type__c" value={subType} disabled="true"></lightning-input-field>
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Description__c" value={description} disabled="true"></lightning-input-field>
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Enable_Payments__c" value={enablePayment} disabled="true"></lightning-input-field> 
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Amount__c" required="true"></lightning-input-field>
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Date__c"></lightning-input-field>
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="User__c" value={userId}></lightning-input-field>
                            </div>

                            <!-- <lightning-input-field field-name="Sub_type__c" value={subType} disabled="true"></lightning-input-field> 
                            <lightning-input-field field-name="Description__c" value={description} disabled="true"></lightning-input-field>
                            <lightning-input-field field-name="Enable_Payments__c" value={enablePayment} disabled="true"></lightning-input-field> 
                            <lightning-input-field field-name="Amount__c" required="true"></lightning-input-field>        
                            <lightning-input-field field-name="Date__c"></lightning-input-field>
                            <lightning-input-field field-name="User__c" value={userId}></lightning-input-field>  -->
                        </div>
                    </div> <br/><br/>            
                    <div style="float:right;margin-top:10px;width:55%;margin-bottom:1%">
                        <lightning-button type="submit" variant="brand" label="Save" style="margin-left: 1%;"></lightning-button>&nbsp;&nbsp;
                        <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                    </div>
                </lightning-record-edit-form>  
            </div>
        </template>
        <!--Edit Modal-->
        <template if:true={isEdit}>            
            <h2  style="font-weight: bold; margin-top:1%;margin-left:1.2%">Update Expense</h2>
            <div class="slds-p-around_medium" style="margin-top: 1%;">

                <lightning-record-edit-form object-api-name="Expenses__c" onsubmit={handleSubmit} onsuccess={handleSuccess} record-id={recordId}>
                    <lightning-messages></lightning-messages>
                    <div class="slds-grid">                            
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Type_of_Expense__c" name="typeofExpense" required="true" onchange={changeExpense}></lightning-input-field>
                            <lightning-input-field field-name="Code__c" value={code}  disabled="true"></lightning-input-field>
                            <lightning-input-field field-name="Expense_Claims__c" value={expenseClaim} disabled="true"></lightning-input-field>
                            <lightning-input-field field-name="Tax_Code__c" value={taxCode}></lightning-input-field>                            
                            <lightning-input-field field-name="User__c" value={userId}></lightning-input-field>
                            <!-- <lightning-input-field field-name="Comments__c"></lightning-input-field> -->
                            <!-- <lightning-input-field field-name="GST__c"></lightning-input-field>  -->
                            <lightning-input type="file" onchange={onFileUpload} name="uploadFile" label="Upload File">  
                            </lightning-input>                                
                            <div class="slds-text-body_small">{fileName}                                    
                                <template if:true={showSpinner}>
                                    <lightning-spinner alternative-text="Uploading the file......" size="medium">                        
                                    </lightning-spinner>
                                </template>
                            </div>
                            <template if:true={isattachError}>
                                <p style="color:red">File Size Can not exceed 512MB</p>                                  
                            </template>      
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Sub_type__c" value={subType} disabled="true"></lightning-input-field>
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Description__c" value={description} disabled="true"></lightning-input-field>
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Enable_Payments__c" value={enablePayment} disabled="true"></lightning-input-field>
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Amount__c" required="true"></lightning-input-field>
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="GST__c"></lightning-input-field> 
                            </div>
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Date__c"></lightning-input-field> 
                            </div> 
                        </div>
                    </div> 
                    <div style="float:right;margin-top:10px;width:55%;margin-bottom:1%">
                        <lightning-button type="submit" variant="brand" label="Update"></lightning-button>&nbsp;&nbsp;
                        <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                    </div>
                </lightning-record-edit-form>  
            </div>                
        </template>

        <!--Import File-->
        <template if:true={addImport}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-03" aria-modal="true" aria-describedby="modal-content-id-3" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                 <!-- modal header start -->
                   <header class="slds-modal__header">
                      <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                         <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                         <span class="slds-assistive-text">Close</span>
                      </button>
                      <h2 id="modal-heading-4" class="slds-text-heading_medium slds-hyphenate">Upload File</h2>
                   </header>
               
                   <!-- modal body start -->
                   <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-4">                       
                        <lightning-input label="Upload CSV" name="File Uploader" onchange={handleFilesChange} type="file" multiple></lightning-input><br/>
                        <div class="error-message">{fileName}</div>
                        <lightning-button class="upload-button" label={UploadFile} onclick={handleSave} variant="brand" disabled={isTrue}></lightning-button>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                        </footer>
                   </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
   <!--  </lightning-card> -->
    </div>

    <template if:true={isModalOpen}>
        <div class="slds-p-around_medium">
            <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
            onclick={handleBack} style="float:right;margin-bottom:5px;"></lightning-button>
            <iframe src={currentUrl} width="100%" height="1300px" ></iframe>
        </div>              
    </template>
</template>
