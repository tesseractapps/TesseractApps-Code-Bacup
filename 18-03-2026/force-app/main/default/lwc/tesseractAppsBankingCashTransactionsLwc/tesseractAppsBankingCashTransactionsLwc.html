    <div if:true={showtableReceit} data-id="accountListTableDropdownReceit">
        <div style={toggleDropdownAccountReceit}>   
            <table class="dropdown-table">
                <thead>
                    <tr>
                        <th>Account Number</th>
                        <th>Ledger Item Name</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={FilteredLedgerItemsReceit} for:item="item">
                        <tr key={item.id}
                            data-accno={item.accNo}
                            data-value={item.itemName}
                            data-id={item.id} 
                            onclick={handleSelectionReceit}>
                            <td>{item.accNo}</td>
                            <td>{item.itemName}</td>
                            <td>{item.category}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
    <div if:true={showtableTaxReceit} data-id="taxTableDropdownReceit">

                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Description</th>
                        <th>Rate</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={filteredTaxCodesReceit} for:item="taxCode">
                        <tr key={taxCode.id}
                            data-code={taxCode.code}
                            data-description={taxCode.description}
                            data-rate={taxCode.rate}
                            data-value={taxCode.label}
                            onclick={handleSelectionTaxReceit}>
                            <td>{taxCode.code}</td>
                            <td>{taxCode.description}</td>
                            <td>{taxCode.rate}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
