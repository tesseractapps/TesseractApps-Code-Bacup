<template>
    <div class="slds-form-element">

        <template if:true={label}>
            <label class="slds-form-element__label">
                <template if:true={required}>
                    <abbr class="slds-required">*</abbr>
                </template>
                {label}
            </label>
        </template>

        <div class="slds-combobox_container">

            <div class={comboboxClass}
                 role="combobox"
                 aria-expanded={isOpen}
                 aria-haspopup="listbox"
                 aria-controls="listbox-id">

                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                     onclick={toggleDropdown}>

                    <input
                        type="text"
                        class="slds-input slds-combobox__input"
                        value={displayValue}
                        placeholder={placeholder}
                        readonly
                        aria-activedescendant={activeDescendant}
                    />

                    <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                        <lightning-icon icon-name="utility:down" size="x-small"></lightning-icon>
                    </span>

                </div>

                <template if:true={isOpen}>
                    <div class="slds-dropdown slds-dropdown_fluid dropdown custom-scroll">

                        <!-- SEARCH -->
                        <div class="search-container">
                            <lightning-input
                                type="search"
                                placeholder="Search..."
                                value={searchKey}
                                variant="label-hidden"
                                onclick={stopPropagation}
                                onfocus={stopPropagation}
                                onkeyup={handleSearch}
                                onkeydown={handleKeyDown}>
                            </lightning-input>
                        </div>

                        <ul
                            id="listbox-id"
                            class="slds-listbox slds-listbox_vertical"
                            role="listbox">

                            <template for:each={filteredOptions} for:item="opt" for:index="index">

                                <li key={opt.value}
                                    id={opt.id}
                                    data-value={opt.value}
                                    data-index={index}
                                    class={opt.className}
                                    role="option"
                                    aria-selected={opt.checked}
                                    onclick={handleSelect}>

                                    <div class="slds-media slds-listbox__option slds-listbox__option_plain">

                                        <span class="slds-media__figure">

                                            <template if:false={opt.disabled}>
                                                <input
                                                    type="checkbox"
                                                    checked={opt.checked}
                                                    data-value={opt.value}
                                                    onchange={handleCheckbox}
                                                    onclick={stopPropagation}
                                                />
                                            </template>

                                        </span>

                                        <span class="slds-media__body">
                                            <span class="slds-truncate">
                                                {opt.label}
                                            </span>
                                        </span>

                                    </div>

                                </li>

                            </template>

                        </ul>

                    </div>
                </template>

            </div>

        </div>
    </div>
</template>
