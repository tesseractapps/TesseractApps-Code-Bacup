<template>  
    <template if:true={participantflag}>
        <div class="page-container">
            <!-- Menu Container -->
            <div class="menu-container">
                <div class="menu-left">
                    <div class={allParticipantClass} data-type="all" onclick={handleClick}>All Participants</div>
                    <div class={pinnedParticipantClass} data-type="pinned" onclick={handleClick}>Pinned Participants</div>
                </div>
                <div class="search-box">
                    <lightning-input 
                        type="search"
                        placeholder="Search"
                        variant="label-hidden"
                        value={searchParticipant}
                        onchange={handleSearchParticipant}>
                    </lightning-input>
                </div>
                <lightning-button
                    label="Create Participant"
                    variant="brand"
                    class="slds-m-right_small"
                    onclick={handleAddNewParticipant}
                ></lightning-button> 
            </div>
            <div class="slds-p-around_medium">
                <div class="table-container awardsTable adminTable">
                    <div class="header-wrapper">
                        <table class="staff-table1 participant-table">
                            <thead>
                                <tr>
                                    <th class="table-th" title="Participant Name">Participant Name</th>
                                    <th class="table-th" title="NDIS Number">NDIS Number</th>
                                    <th class="table-th" title="Plan Period">Plan Period</th>
                                    <th class="table-th" title="Date of Birth">Date of Birth</th>
                                    <th class="table-th" title="Risk">Risk</th>
                                    <th class="table-th" title="Remaining Budget">Remaining Budget</th>
                                    <th class="table-th center" title="Action">Action</th>
                                </tr>
                            </thead>
                        </table>
                    </div>

                    <div class="body-scroll custom-scroll adminTableHeight">
                        <table class="staff-table1 participant-table">
                            <tbody>
                                <template if:false={noRecordsFlag}>
                                    <template for:each={participants} for:item="participant">
                                        <tr key={participant.id} class="table-row">
                                            <td class="table-td">
                                                <div class="avatar-row">
                                                    <template if:true={participant.hasImage}>
                                                        <img
                                                            src={participant.imageUrl}
                                                            alt={participant.name}
                                                            class="provider-logo"
                                                            data-id={participant.id}
                                                            onerror={handleImageError}>
                                                    </template>

                                                    <template if:false={participant.hasImage}>
                                                        <div class="avatar-circle">
                                                            {participant.initials}
                                                        </div>
                                                    </template>

                                                    <div class="provider-name">
                                                        <span title={participant.name}>{participant.name}</span>
                                                    </div>
                                                    
                                                </div>
                                            </td>
                                            <td class="table-td slds-truncate" title={participant.ndisNumber}>
                                                {participant.ndisNumber}
                                            </td>

                                            <td class="table-td slds-truncate" title={participant.planPeriod}>
                                                {participant.planPeriod}
                                            </td>

                                            <td class="table-td slds-truncate" title={participant.dob}>
                                                {participant.dob}
                                            </td>

                                            <td class="table-td" title={participant.risk}>
                                                <div class={participant.riskClassFull}>
                                                    {participant.risk}
                                                </div>
                                            </td>

                                            <td class="table-td">
                                                <span class="remaining-green">{participant.formattedRemainingBudget}</span>
                                                <span class="darkFont">/{participant.formattedTotalBudget}</span>
                                            </td>

                                            <td class="table-td center">
                                                <div class="actions-row">
                                                    <button class="mi-btn" title="Details"
                                                        data-id={participant.id}
                                                        onclick={handleViewDetails}>
                                                        <i class="material-icons">person</i>
                                                    </button>

                                                    <button class="mi-btn" title="Edit Plan"
                                                        data-id={participant.id}
                                                        onclick={handleEditPlan}>
                                                        <i class="material-icons">edit_note</i>
                                                    </button>

                                                    <button class="mi-btn" title="Budget"
                                                        data-id={participant.id}
                                                        onclick={handleBudgetClick}>
                                                        <i class="material-icons">account_balance_wallet</i>
                                                    </button>

                                                    <button class="mi-btn" title="Add Note"
                                                        data-id={participant.id}
                                                        onclick={handleAddNotes}>
                                                        <i class="material-icons">note_add</i>
                                                    </button>

                                                    <button class="mi-btn" title="Pin"
                                                        data-id={participant.id}
                                                        onclick={handleTogglePin}>
                                                        <i class="material-icons">{participant.pinIconName}</i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </template>

                                <template if:true={noRecordsFlag}>
                                    <tr>
                                        <td class="no-data">
                                            <p>No records found</p>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <template if:true={hasParticipants}>
                <template if:true={hasParticipants}>
                    <div class="pagination-container slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination">
                        <div class="slds-list_inline">
                            <span style="margin-right: 5px; margin-top: 5px;">Page Size:</span>
                            <div class="slds-select_container">
                                <select class="slds-select" id="recordsPerPage" onchange={handlePageSizeChange}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template>
                                </select>
                            </div>
                        </div>

                        <div class="slds-align_absolute-center">
                            <lightning-button
                                disabled={isFirstPage}
                                icon-name="utility:jump_to_left"
                                label="First"
                                alternative-text="first page"
                                onclick={handleFirstPage}
                                style="margin-right: 10px;">
                            </lightning-button>

                            <lightning-button
                                disabled={isFirstPage}
                                icon-name="utility:chevronleft"
                                label="Previous"
                                alternative-text="Previous"
                                onclick={handlePreviousPage}
                                style="margin-right: 5px;">
                            </lightning-button>

                            <span class="slds-badge">
                                Showing {currentPage} of {totalPages} Page(s)
                            </span>

                            <lightning-button
                                disabled={isLastPage}
                                icon-name="utility:chevronright"
                                label="Next"
                                alternative-text="Next"
                                onclick={handleNextPage}
                                class="slds-p-horizontal_x-small"
                                icon-position="right">
                            </lightning-button>

                            <lightning-button
                                disabled={isLastPage}
                                icon-name="utility:jump_to_right"
                                label="Last"
                                alternative-text="last page"
                                onclick={handleLastPage}
                                icon-position="right">
                            </lightning-button>
                        </div>

                        <div class="slds-clearfix">
                            <div class="slds-float_right">
                                <span class="slds-badge">Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </template>
            </template>        
        </div>
            
    </template>

    <template if:true={budgetForecastflag}>
        <c-support-coordination-budget-forecast
            oncancel={handleBudgetForecastCancel}>
        </c-support-coordination-budget-forecast>
    </template>

    <template if:true={notesflag}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open slds-modal_large">

            <div class="slds-modal__container">
            <c-support-coordinator-notes
                participant-id={participantIdforchild}
                oncancel={handleCloseNotes}>
            </c-support-coordinator-notes>

            </div>
        </section>
        <!-- BACKDROP -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={providerSpendingFlag}>
    <section class="page-container">

        <!-- HEADER -->
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
            
            <!-- Title -->
            <div class="slds-col">
                <h1 class="slds-text-heading_medium slds-text-title_bold">
                    Provider Spending
                </h1>
            </div>

            <!-- Actions -->
            <div class="slds-col slds-shrink-none">
                <div class="slds-button-group" role="group">

                    <lightning-button
                        label="Back"
                        variant="neutral"
                        onclick={handleProviderSpendingBack}>
                    </lightning-button>
                    <lightning-button
                        label="Create Entry"
                        variant="brand"
                        class="slds-m-left_small"
                        onclick={handleCreateEntity}>
                    </lightning-button>
                </div>
            </div>
        </div>
        <!-- CONTENT AREA -->
        <!-- ================= PROVIDER SPENDING TABLE ================= -->
<div class="table-container providerSpendingTable">

<!-- LOADING -->
<template if:true={entryLoading}>
    <div class="slds-align_absolute-center slds-p-around_medium">
        Loading entries...
    </div>
</template>

<template if:false={entryLoading}>

    <!-- HEADER -->
    <div class="header-wrapper">
        <table class="staff-table" role="table">
            <thead>
                <tr>
                    <th class="table-th">Ref</th>
                    <th class="table-th">Date</th>
                    <th class="table-th">Participant</th>
                    <th class="table-th">Provider</th>
                    <th class="table-th">Service Type</th>
                    <th class="table-th">Hours</th>
                    <th class="table-th">Amount</th>
                    <th class="table-th">Total Amount</th>
                    <th class="table-th">Status</th>
                    <th class="table-th">Data Source</th>
                    <th class="table-th">Action</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- BODY -->
    <div class="body-scroll custom-scroll tableHeight">
        <table class="staff-table">
            <tbody>

                <template if:true={supportEntries.length}>
                    <template for:each={supportEntries} for:item="entry">
                        <tr key={entry.recordId} class="table-row">

                            <td class="table-td">{entry.referenceNumber}</td>

                            <td class="table-td">{entry.serviceDate}</td>

                            <td class="table-td">{entry.participantName}</td>

                            <td class="table-td">{entry.providerName}</td>

                            <td class="table-td">{entry.serviceType}</td>

                            <td class="table-td">{entry.hours}</td>

                            <td class="table-td">
                                <lightning-formatted-number
                                    value={entry.rate}
                                    format-style="currency"
                                    currency-code="AUD">
                                </lightning-formatted-number>
                            </td>

                            <td class="table-td">
                                <lightning-formatted-number
                                    value={entry.totalAmount}
                                    format-style="currency"
                                    currency-code="AUD">
                                </lightning-formatted-number>
                            </td>

                            <td class="table-td">
                                <span class="status-pill new-contact">
                                    {entry.claimStatus}
                                </span>
                            </td>

                            <td class="table-td">{entry.dataSource}</td>

                            <td class="table-td actions-col">
                                <lightning-button-icon
                                    icon-name="utility:edit"
                                    alternative-text="Edit"
                                    title="Edit"
                                    variant="bare"
                                    data-id={entry.recordId}
                                    onclick={handleEditEntry}>
                                </lightning-button-icon>
                            </td>

                        </tr>
                    </template>
                </template>

                <template if:false={supportEntries.length}>
                    <tr>
                        <td colspan="11" class="slds-text-align_center slds-p-around_medium">
                            No entries found.
                        </td>
                    </tr>
                </template>

            </tbody>
        </table>
    </div>

</template>

</div>
    </section>
    <template if:true={showEntryModal}>
    <section role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container modal-custom">

            <!-- HEADER -->
            <header class="slds-modal__header headercustom">
                <h2 class="slds-modal__title slds-text-heading_medium">
                    {entryModalTitle}
                </h2>
            </header>

            <!-- BODY -->
            <div class="slds-modal__content slds-p-around_medium custom-scroll">

                <div class="slds-grid slds-wrap slds-gutters">

                    <!-- Participant -->
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox
                            label="Participant"
                            value={entryForm.participantId}
                            options={participantOptions}
                            onchange={handleEntryChange}
                            data-field="participantId"
                            required>
                        </lightning-combobox>
                    </div>

                    <!-- Service Type -->
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox
                            label="Service Type"
                            value={entryForm.serviceType}
                            options={serviceTypeOptionsForEntry}
                            onchange={handleEntryChange}
                            data-field="serviceType"
                            required>
                        </lightning-combobox>
                    </div>

                    <!-- Provider -->
                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-combobox
                            label="Provider"
                            value={entryForm.providerId}
                            options={providerOptionsForEntry}
                            onchange={handleEntryChange}
                            data-field="providerId"
                            required>
                        </lightning-combobox>
                    </div>
                    <!-- Support Item -->
                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-combobox
                            label="Support Item"
                            value={entryForm.supportItemName}
                            options={supportItemOptions}
                            onchange={handleEntryChange}
                            data-field="supportItemName"
                            required>
                        </lightning-combobox>
                    </div>


                    <!-- Service Date -->
                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-input
                            type="date"
                            label="Service Date"
                            value={entryForm.serviceDate}
                            onchange={handleEntryChange}
                            data-field="serviceDate"
                            required>
                        </lightning-input>
                    </div>

                    <!-- Hours -->
                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-input
                            type="number"
                            step="0.01"
                            label="Hours"
                            value={entryForm.hours}
                            onchange={handleHoursChange}
                            required>
                        </lightning-input>
                    </div>

                    <!-- Rate (Non Editable) -->
                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-input
                            type="number"
                            label="Amount"
                            value={entryForm.rate}
                            disabled>
                        </lightning-input>
                    </div>

                    <!-- Total Amount (Auto) -->
                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-input
                            type="number"
                            label="Total Amount"
                            value={entryForm.totalAmount}
                            disabled>
                        </lightning-input>
                    </div>

                    <!-- Claim Status -->
                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-combobox
                            label="Claim Status"
                            value={entryForm.claimStatus}
                            options={claimStatusOptions}
                            onchange={handleEntryChange}
                            data-field="claimStatus">
                        </lightning-combobox>
                    </div>

                    <!-- Data Source -->
                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-combobox
                            label="Data Source"
                            value={entryForm.dataSource}
                            options={dataSourceOptions}
                            onchange={handleEntryChange}
                            data-field="dataSource">
                        </lightning-combobox>
                    </div>

                    <!-- Notes -->
                    <div class="slds-col slds-size_1-of-1 slds-m-top_small">
                        <lightning-textarea
                            label="Notes"
                            value={entryForm.notes}
                            onchange={handleEntryChange}
                            data-field="notes">
                        </lightning-textarea>
                    </div>

                </div>
            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer">
                <lightning-button
                    variant="neutral"
                    label="Cancel"
                    onclick={handleCloseEntryModal}>
                </lightning-button>

                <lightning-button
                    variant="brand"
                    label="Save"
                    class="slds-m-left_small"
                    onclick={handleSaveEntry}>
                </lightning-button>
            </footer>

        </div>
    </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    </template>

    <template if:true={showContactTypeModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open popup-zindex">
            <div class="slds-modal__container" style="max-width: 25%;">

                <!-- Header -->
                <header class="slds-modal__header" style="background: #002a52;">
                    <h2 class="slds-text-heading_medium" style="color: white; text-align: center;">
                        Add Contact Type
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        label="Contact Type Name"
                        value={newContactTypeName}
                        onchange={handleNewContactTypeInput}
                        required>   <!--required-->
                    </lightning-input>

                    <!-- Existing custom types -->
                    <template if:true={customContactTypes.length}>
                        <div class="slds-m-top_medium">
                            <p class="">Custom Contact Types</p>

                            <template for:each={customContactTypes} for:item="type">
                                <div key={type.value}
                                    class="slds-grid slds-grid_align-spread slds-m-top_x-small">

                                    <span class={type.cssClass}>
                                        {type.label}
                                    </span>

                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        alternative-text="Delete"
                                        data-value={type.value}
                                        onclick={stageDeleteContactType}>
                                    </lightning-button-icon>

                                </div>
                            </template>

                        </div>
                    </template>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                            class="slds-m-right_small"
                        onclick={closeContactTypeModal}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="Save"
                        onclick={saveContactType}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="blur-overlay-popup"></div>

        <!-- <div class="slds-backdrop slds-backdrop_open"></div> -->
    </template>
    <template if:true={showContactAttachmentModal}>
        <section role="dialog"
                tabindex="-1"
                aria-modal="true"
                class="slds-modal slds-fade-in-open popup-zindex">

            <div class="slds-modal__container modal-custom">

                <!-- HEADER -->
                <header class="slds-modal__header headercustom">
                    <h2 class="slds-modal__title slds-text-heading_medium h2custom">
                        Attach Files
                    </h2>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium custom-scroll">

                    <!-- FORM FIELDS -->
                    <div class="slds-grid slds-wrap slds-gutters_x-small">

                        <!-- Attachment Name -->
                        <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                            <!-- <lightning-input
                                label="Attachment Name"
                                data-id="attachmentName"
                                required="true">
                            </lightning-input> -->
                            <lightning-input
                            label="Attachment Name"
                            data-field="attachmentName"
                            data-id="attachmentName"
                            value={attachmentName}
                            onchange={handleAttachmentFieldChange}
                            required>
                        </lightning-input>

                        </div>

                        <!-- Type -->
                        <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                            <lightning-combobox
                                label="Type"
                                data-id="attachmentType"
                                options={attachmentTypeOptions}
                                value={attachmentType}
                                onchange={handleAttachmentTypeChange}
                                required="true">
                            </lightning-combobox>

                        </div>

                        <template if:true={showOtherField}>

                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                                <!-- <lightning-input
                                    data-id="otherComments"
                                    label="Other(Please Specify)">
                                </lightning-input> -->
                                <template if:true={showOtherField}>

                                <lightning-input
                                    data-field="otherComments"
                                    label="Other(Please Specify)"
                                    value={otherComments}
                                    onchange={handleAttachmentFieldChange}>
                                </lightning-input>

                            </template>

                            </div>

                        </template>

                        <!-- Expiry Date -->
                        <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                            <!-- <lightning-input
                                type="date"
                                label="Expiry Date"
                                data-id="expiryDate">
                            </lightning-input> -->
                            
                            <lightning-input
                                type="date"
                                label="Expiry Date"
                                data-field="expiryDate"
                                value={expiryDate}
                                onchange={handleAttachmentFieldChange}>
                            </lightning-input>

                        </div>

                        <!-- User -->
                        <!-- <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                            <lightning-input
                                label="User"
                                value={UserName}
                                data-id="userField">
                            </lightning-input>

                        </div> -->

                        <!-- Comments -->
                        <div class="slds-size_1-of-1 slds-col">

                            <!-- <lightning-textarea
                                label="Comments"
                                data-id="commentsField">
                            </lightning-textarea> -->
                            <lightning-textarea
                                label="Comments"
                                data-field="comments"
                                value={comments}
                                onchange={handleAttachmentFieldChange}>
                            </lightning-textarea>
                        </div>

                    </div>

                    <!-- FILE UPLOAD -->
                    <div class="slds-box drag-drop slds-m-around_small"
                        ondragover={handleDragOver}
                        ondrop={handleDrop}>

                        <p class="slds-text-align_center">
                            Drag and drop files here<br/>

                            <a href="javascript:void(0);"
                            onclick={triggerAttachInput}>
                                Click to browse
                            </a>
                        </p>

                        <input
                            type="file"
                            class="hidden-file-input contact-upload-input"
                            onchange={handleFileUploadInputChange}
                            multiple />
                    </div>

                    <!-- AWS COMPONENT -->
                    <template if:true={isFileExpand}>
                        <c-document-office-service
                            record-id={recordIdForFileUpload}
                            module-path-from-parent="ticket"
                            onuploadcomplete={handleAwsUploadComplete}
                            onfiledeleted={handleFileDeleted}
                            oncancel={handlefilecancel}>
                        </c-document-office-service>
                    </template>

                </div>

                <!-- FOOTER -->
                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        variant="neutral"
                        onclick={handleCloseContactAttachmentModal}>
                    </lightning-button>

                    <lightning-button
                        class="slds-m-left_small"
                        label="Save"
                        variant="brand"
                        onclick={handleSaveContactAttachment}>
                    </lightning-button>

                </footer>
            </div>
        </section>

        <div class="blur-overlay-popup"></div>
    </template>

    <template if:true={showAttachmentListModal}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open popup-zindex">

            <div class="slds-modal__container modal-custom1">

                <!-- HEADER -->
                <header class="slds-modal__header headercustom">

                    <h2 class="slds-modal__title slds-text-heading_medium h2custom">
                        Uploaded Files
                    </h2>

                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium custom-scroll">

                    <template if:true={contactAttachments.length}>

                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">

                            <thead>
                                <tr>
                                    <th>File Name</th>
                                    <th>Type</th>
                                    <th>Expiry Date</th>
