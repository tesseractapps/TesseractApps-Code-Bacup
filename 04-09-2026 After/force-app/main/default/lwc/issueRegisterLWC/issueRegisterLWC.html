<!-- sldsValidatorIgnore -->
<template>   
    
    <lightning-card>
        <div class="slds-grid">
        <img style="max-height: 35px; max-width: 35px;margin-bottom:8px;margin-left:10px;"
                                    title="Incident Register" src={Issue}/>
                                    <h2 style="margin-top:5px;">Incident Register</h2>
                                    <template if:true={issueparent}>
                                     <lightning-button style="margin-left:77%;margin-right:1%"  variant="brand" label="New Incident" slot="actions" title="New Incident" onclick={handleCreateIssue} class="slds-float_right"></lightning-button>
                                    <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={getissues}>
                                        <svg class="slds-button__icon" aria-hidden="true">
                                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                                        </svg>
                                    </button>
                                </template>
                                </div>
       <div if:true={issueparent}>
        <div> 
          <div > 
            <div if:true={isDesktop}>
                <div class="slds-grid slds-wrap"> 
                     <lightning-input class="slds-size_1-of-7 slds-m-around_small" type="search" label="Incident Number" name="searchID" value={searchID} onchange={handleSerachID}></lightning-input><br/>
                     <lightning-input  class="slds-size_1-of-7 slds-m-around_small" type="search" label="Participant Name" name="clientName" value={clientName}></lightning-input><br/>
                     <lightning-input  class="slds-size_1-of-7 slds-m-around_small" type="search" label="Facility Name" name="facilityName" value={facilityName} ></lightning-input><br/>
                     <lightning-input class="slds-size_1-of-7 slds-m-around_small" type="search" label="Status" value={value}  placeholder="" name="status" options={optionsStatus} onchange={handleChange} ></lightning-input>
                     <lightning-input class="slds-size_1-of-7 slds-m-around_small" type="search" label="Priority" value={valuePriority}  placeholder="" name="priority" options={optionsPriority} onchange={handleChange1} ></lightning-input>
                     <!-- <lightning-input  class="slds-size_1-of-7 slds-m-around_small" type="search" label="Submitted By" name="submittedBy" value={submittedBy}></lightning-input><br/> -->
                     <lightning-button style="margin-top: 35px;margin-right:2px;" variant="brand" label="Search" slot="actions" title="Search Issue" onclick={handleSearch} class="slds-float_right slds-var-m-top_x-large "></lightning-button>
                     <lightning-button style="margin-top:35px;margin-right:5px;" variant="brand" label="Clear" slot="actions" title="Clear Issue" onclick={handleClear} class="slds-float_right slds-var-m-top_x-large "></lightning-button>
                     <lightning-button style="margin-top:35px;" variant="brand" label="Export csv" slot="actions" title="Export csv" onclick={generateCsv} class="slds-float_right slds-var-m-top_x-large"></lightning-button>
                </div> 
            </div>
            
           <!--  <div class="slds-float_right">
               </div>  -->
            <div> 
                <div if:true={isDesktop}>
                <template if:true={rec}> 
                    <table class="slds-table" style="table-layout: fixed;">
                        <thead>
                            <tr>
                                <th class="slds-cell-wrap th">Incident Number</th>
                                <th class="slds-cell-wrap th">Participant Name</th>
                                <th class="slds-cell-wrap th">Facility Name</th>
                                <th class="slds-cell-wrap th">Reporter Name</th>
                                <th class="slds-cell-wrap th">Priority</th>
                                <th class="slds-cell-wrap th">Assign to</th>
                                <th class="slds-cell-wrap th">Created on</th>
                                <th class="slds-cell-wrap th">Status</th>
                                <th class="slds-cell-wrap th">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template if:true={availableIssues}>
                                <template for:each={availableIssues} for:item="issue">
                                    <tr key={issue.Id} class="tr1">
                                        <td class="slds-cell-wrap">{issue.CaseNumber}</td>
                                        <td class="slds-cell-wrap">{issue.Client_Name__c}</td>
                                        <td class="slds-cell-wrap">{issue.Facility_Name__c}</td>
                                        <td class="slds-cell-wrap">{issue.reporterName}</td>
                                        <td class="slds-cell-wrap">{issue.Priority}</td>
                                        <td class="slds-cell-wrap">{issue.assignTo}</td>
                                        <td class="slds-cell-wrap">{issue.date}</td>
                                        <td class="slds-cell-wrap">{issue.Status_1__c}</td>
                                        <td>
                                            <div>
                                                <!-- <template if:true={isStaff}> -->
                                                    <template if:false={issue.isResolved}>
                                                        <a  data-id={issue.Id} onclick={handleedit} style="margin-right:5px;"><lightning-icon icon-name="action:edit" size="xx-small" title="Certificate"></lightning-icon></a>
                                                    </template>      
                                              <!--   </template> -->
                                                <template if:true={issue.isResolved}>
                                                    <a  data-id={issue.Id} data-status={issue.Status_1__c} onclick={handlepdf}><img src={pdficon} width="35px" height="35px"><!-- <lightning-icon icon-name="action:download" size="xx-small" title="generate pdf"></lightning-icon> --></a>
                                                </template>
                                            </div>                                            
                                        </td>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                    </table>

                </template> 
                <template if:false={rec}>
                    <p style="font-weight:bold;color: #4CAF50;">No Data found</p>
                </template>
                <template if:true={error}>  
                    {error}                 
                </template> 
                </div>  
            </div>  
            </div>
            <template if:true={totalRecords}> 
                <div if:true={isDesktop}>
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;">
                
                        <!--PAGE NAVIGATION-->
                        <div class="slds-align_absolute-center" style="height:5rem">
                            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                        </div>
            
                        <!--TOTAL RECORDS-->
                        <div class="slds-clearfix">
                            <div class="slds-float_right ">
                                <span class="slds-badge"> Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
           <!-- if there is no facilities -->
           <template if:true={noRecordsFlag}>
                <div class="slds-grid  slds-grid_align-spread slds-m-left_large" style="padding-top: 0.5em; font-size:15px;">
                    <b style="color: Red"><I> No Issues Registed </I> </b>
                 </div>
            </template>
        </div>
      </div>
        <!-- <div class="slds-m-top_x-large">
            <c-footer-lwc></c-footer-lwc>
        </div> -->
    
    <template if:true={isOpenModal}>
      <div class="form-section" style="margin-top:2%;margin-left:3%;margin-right:1%">
        <!-- Lightning Progress Indicator -->
        <lightning-progress-indicator current-step={currentStep} type="path">
            <lightning-progress-step label="Reporter Details" value="step1"></lightning-progress-step> <!-- onclick={handleStepClick}-->
            <lightning-progress-step label="Incident Details" value="step2"></lightning-progress-step> <!-- onclick={handleStepClick}-->
            <lightning-progress-step label="Action Taken" value="step3"></lightning-progress-step> <!-- onclick={handleStepClick}-->
            <lightning-progress-step label="Review and Submit" value="step4"></lightning-progress-step> <!-- onclick={handleStepClick}-->
        </lightning-progress-indicator>
      </div>

    <!-- Conditional Rendering of Components based on currentStep -->
    <template if:true={isStep1}>
        <div>
            <lightning-card title="">
              <lightning-messages></lightning-messages>
                <div class="slds-m-around_medium">          
                    <div class="slds-grid slds-wrap">
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input label="First Name" value={userFName} onchange={handleFirstNameChange} required="true" disabled="true"></lightning-input>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input label="Last Name" value={userLName} onchange={handleLastNameChange} required="true" disabled="true"></lightning-input>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-combobox label="Participant" value={client}  placeholder="Select Participant" options={clientOption}
                                onchange={handleClientChange} required="true"></lightning-combobox>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-combobox name="facility" label="Facility Name" value={facilityName} placeholder="Select the Facility" options={facilityOptions} 
                                onchange={handleFacilityChange} required="true"></lightning-combobox>                               
                            </div>
                        </div>                
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input label="E-mail" value={email} onchange={handleEmailChange} required="true"></lightning-input>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input label="Phone" value={phone} onchange={handlePhoneChange} required="true"></lightning-input>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-combobox label="Role" value={role}  placeholder="Select Role" options={OrgNisationRoles}
                                 onchange={handleChangeRole} required="true" disabled="true"></lightning-combobox>
                            </div>
                        </div>                        
                        <template if:true={isStaff}>
                            <div class="slds-size_1-of-2">
                                <div class="slds-m-right_medium slds-m-left_medium">
                                    <lightning-combobox label="Status" value={status}  placeholder="Select Status" options={optionsStatus}
                                     onchange={handleChangeStatus} required="true"></lightning-combobox>
                                </div>
                            </div> 
                        </template>
                        
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-combobox label="Assign to" value={staffName1} placeholder="Select Employee" options={staffOptions2}                                        
                                    onchange={handleStaffChange1} required="true">
                                </lightning-combobox>
                            </div>
                        </div>
                                                          
                    </div>
                                    
                     <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
                        <!-- <lightning-button variant="brand" label="Save" onclick={handleSave1} style="margin-left:10px;"></lightning-button> -->
                        <lightning-button variant="brand" label="Cancel" onclick={handleCancel1} style="margin-left:10px;"></lightning-button>
                        <lightning-button variant="brand" label="Next >>" onclick={handleNext1} style="margin-left:10px;"></lightning-button>
                    </div>
                </div>
            </lightning-card>
        </div>
    </template>
    <template if:true={isStep2}>
      <div>
        <div class="slds-grid slds-wrap" style="margin-left:2.5%;margin-right:2.5%;margin-top:2%;">
            <div class="slds-col slds-size_1-of-2">
                <div class="slds-p-around_medium">
                    <div class="form-section">
                        <div class="form-group" style="margin-bottom:2%;">
                            <lightning-radio-group label="Priority of the incident" name="priority" options={priorityOptions} value={priorityValue}
                                data-id="priorityId" onchange={handlePriorityChange} required></lightning-radio-group>
                        </div>
                        <div class="form-group" style="margin-bottom:2%;">
                            <lightning-radio-group label="People involved in this incident:" name="raisedBy" options={raisedByOptions} value={raisedByValue} required
                                onchange={handleRaisedByChange}></lightning-radio-group>
                                <template if:true={showOtherDescription}>
                                    <lightning-input-rich-text  value={others} data-id="other" onchange={handleInputother}></lightning-input-rich-text>
                                </template>
                                <template if:true={showClientDropdown}>
                                    <lightning-combobox 
                                        label="Select Participant" 
                                        value={client1}  placeholder="Select Participant" options={clientOption}
                                        onchange={handleClientChange1}>
                                    </lightning-combobox>
                                </template>                            
                                <template if:true={showFacilityDropdown}>
                                    <lightning-combobox 
                                        label="Select Facility" 
                                        value={facilityName1} placeholder="Select the Facility" options={facilityOptions}                                        
                                        onchange={handleFacilityChange1}>
                                    </lightning-combobox>
                                </template>
                                <template if:true={showEmployee}>
                                    <lightning-combobox 
                                        label="Select Staff" 
                                        value={staffName} placeholder="Select Staff" options={staffOptions2}                                        
                                        onchange={handleStaffChange}>
                                    </lightning-combobox>
                                </template>
                                <template if:true={showParticipantRepresentative}>
                                    <lightning-input-rich-text  value={partcipantValue} data-id="participant" onchange={handleInputParticipantRepresent}></lightning-input-rich-text>
                                </template>
                                <template if:true={showSubContractor}>
                                    <lightning-input-rich-text  value={subContractor} data-id="subcontractor" onchange={handleInputSubContractor}></lightning-input-rich-text>
                                </template>
                        </div>
                        <div class="form-group" style="margin-bottom:2%;">
                            <lightning-radio-group label="Select the most relevant incident type:" name="issueType" options={issueTypeOptions} value={issueTypeValue}
                                onchange={handleIssueTypeChange} required></lightning-radio-group>

                                <template if:true={mostRelevantOthers}>
                                    <lightning-input-rich-text  value={mostRelevantOtherValue} data-id="mostRelevantOthers" onchange={handleInputMostRelevantOther}></lightning-input-rich-text>
                                </template>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2">
                <div class="slds-p-around_medium">
                    <div class="form-section">
                        <p style="font-weight:bold;color:#5A5A5A">Date and Time of the incident</p>
                        <div class="Date-group" style="margin-bottom:2%;">
                            
                            <lightning-input label="Date" type="date" value={incidentDate}
                                onchange={handleIncidentDateTimeChange} style="width:35%;margin-right:10px;" required="true"></lightning-input>
                            <lightning-input label="Time" type="time" value={incidentTime}
                                onchange={handleIncidentDateTimeChange} style="width:35%" required="true"></lightning-input>
                        </div>
                        <p style="font-weight:bold;color:#5A5A5A">Date and Time of the incident occurred</p>
                        <div class="Date-group" style="margin-bottom:2%;">
                            <lightning-input label="Date" type="date" value={allegedDate}
                                onchange={handleAllegedDateTimeChange} style="width:35%;margin-right:10px;" required="true"></lightning-input>
                                <lightning-input label="Time" type="time" value={allegedTime}
                                onchange={handleAllegedDateTimeChange} style="width:35%" required></lightning-input>
                        </div>
                        <div class=" form-group  slds-grid" style="margin-bottom:2%; width:90%;">
                            <p class="slds-form-element__legend slds-form-element__label"><span style="color:red">*</span>Please provide a detailed description of the incident</p>
                            <lightning-input-rich-text label="Please provide a detailed description of the alleged incident" value={description}  onfocus={handleFocus} 
                               placeholder="Enter your text here or start speaking..." onchange={handleDescriptionChange} required></lightning-input-rich-text>
                               <div class="slds-p-top_small ">
                                  <lightning-icon
                                      icon-name={iconName}
                                      alternative-text={altText}
                                      onclick={toggleListening}
                                      if:true={showMuteIcon}
                                      class="slds-button slds-button_icon mute-icon" style="margin-left:5px;"
                                      size="small">
                                  </lightning-icon>
                                  <lightning-icon
                                     icon-name="utility:clear"
                                     alternative-text="Clear Text"
                                     onclick={clearText}
                                     if:true={showClearIcon}
                                     class="slds-button slds-button_icon clear-icon"
                                     size="small" >
                                  </lightning-icon>
                               </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
            <lightning-button label="<<Previous" variant="brand" onclick={handlePrevious2}></lightning-button>&ensp;&ensp; 
            <!-- <lightning-button label="Save" variant="brand" onclick={handleSave2}></lightning-button>&ensp;&ensp;  -->
            <lightning-button label="Cancel" variant="brand" onclick={handleCancel2}></lightning-button>&ensp;&ensp; 
            <lightning-button label="Next>>" variant="brand" onclick={handleNext2}></lightning-button>
        </div>
    </div>
    </template>
    <template if:true={isStep3}>
      <div>
        <div class="slds-grid slds-wrap" style="margin-left:2.5%;margin-right:2.5%;margin-top:2%;">           
            <div class="slds-col slds-size_1-of-2">                       
                <div class="slds-p-around_medium">
                    <div class="form-group" style="margin-bottom:2%;">
                        <template if:true={showPolice}>
                            <lightning-radio-group
                                label="Has the incident been reported to the police?"
                                options={yesNoOptions}
                                value={reportedToPolice}
                                onchange={handleRadioChange}
                                data-id="reportedToPolice"
                                name ="reportedToPolice" required="true">
                            </lightning-radio-group>
                        </template>
                        <template if:true={showPoliceComments}>
                            <lightning-input-rich-text label="If yes, comments" value={policeComments} data-id="policeComments" onchange={handleInputChange}></lightning-input-rich-text>
                        </template>
                    </div>
                    <div class="slds-p-bottom_medium">
                        <lightning-radio-group
                            label="Has the affected Participant’s representative expressed any ongoing concerns regarding the incident?"
                            options={yesNoOptions}
                            value={clientConcerns}
                          onchange={handleRadioChange}
                          name ="clientConcerns"
                            data-id="clientConcerns" required="true"> <!-- onchange={handleRadioChange} -->
                        </lightning-radio-group>
                    </div>
                    <p class="slds-form-element__legend slds-form-element__label"><span style="color:red">*</span>What specific actions have been taken to ensure the health, safety and wellbeing of the Participant's involved?</p>
                    <div class="slds-p-bottom_medium">
                        <lightning-input-rich-text
                            label="What specific actions have been taken to ensure the health, safety and wellbeing of the aged  Participant’s involved?"
                            data-id="actionsTaken" value={actionsTaken} required="true"
                            onchange={handleInputChange1}></lightning-input-rich-text>
                    </div>
                </div>
            </div>
        
            <div class="slds-col slds-size_1-of-2">
                <div class="slds-p-around_medium">
                    <p class="slds-form-element__legend slds-form-element__label"><span style="color:red">*</span>Is there any other information or details you wish to include in relation to this incident?</p>
                    <div class="slds-p-bottom_medium">
                        <lightning-input-rich-text
                            label="Is there any other information or details you wish to include in relation to this incident?"
                            data-id="additionalInfo" value={additionalInfo} required="true"
                            onchange={handleInputChange2}></lightning-input-rich-text>
                    </div>
                    <p class="slds-form-element__legend slds-form-element__label"><span style="color:red">*</span>What specific actions have been taken to manage or minimise the risk of recurrence of this or a similar incident in future?</p>
                    <div class="slds-p-bottom_medium">
                        <lightning-input-rich-text
                            label="What specific actions have been taken to manage or minimise the risk of reoccurrence of this or a similar incident in future?"
                            data-id="futureActions" value={futureActions} required="true"
                            onchange={handleInputChange3}></lightning-input-rich-text>
                    </div>
                    <div if:true={viewfileName}><p class="slds-form-element__legend slds-form-element__label">Uploaded File:&nbsp;<a href={viewfileName} data-url={viewfileName}  
                        onclick={handleView} style="margin-left: 5px;">View File</a></p></div>
                </div>
            </div>
            <div class="slds-size_1-of-2">
                
              <div class="slds-m-right_medium slds-m-left_medium" if:true={viewflag} >
                  <lightning-input type="file" onchange={onFileUpload} name="uploadFile" label="Upload File" style="margin-left:5px;">  
                  </lightning-input>
                  <div class="slds-text-body_small">{fileName}</div>
              </div>
          </div>
          
          <template if:true={showSpinner}>
              <lightning-spinner alternative-text="Uploading the file......" size="medium">                        
                  </lightning-spinner>
          </template>
          <template if:true={isattachError}>
              <p style="color:red">File Size Can not exceed 512MB</p>                                  
          </template> 
        
            <div class="slds-grid slds-align_absolute-center slds-m-top_medium slds-col slds-size_2-of-2">
                <lightning-button variant="brand" label="<<Previous" onclick={handlePrevious3} class="slds-m-right_x-small"></lightning-button>
                <!-- <lightning-button variant="brand" label="Save" onclick={handleSave3} class="slds-m-right_x-small"></lightning-button> -->
                <lightning-button variant="brand" label="Cancel" onclick={handleCancel3} class="slds-m-right_x-small"></lightning-button>
                <lightning-button variant="brand" label="Next>>" onclick={handleNext3} class="slds-m-right_x-small"></lightning-button>
            </div>
        </div>
        
       </div>
    </template>
    <template if:true={isStep4}>        
            <lightning-card>
                <!-- Accordion for Sections -->
                <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                    <!-- Section A: Your Details -->
                    <lightning-accordion-section name="Reporter Details" label="Reporter Details">
                        <lightning-card title="">
                            <lightning-button-icon style="float: right;" icon-name="utility:edit" alternative-text="Edit" onclick={handleEdit1}></lightning-button-icon>
                            <div class="slds-grid slds-wrap" style="margin-left: 5%; margin-right: 2.5%;">
                                <div class="slds-size_1-of-2">
                                    <p class="slds-text-title_bold">First Name:&nbsp;<span style="font-weight:normal;margin-left:5px;">{userFName}</span></p>                                    
                                </div>
                                <div class="slds-size_1-of-2">
                                    <p class="slds-text-title_bold">Last Name:&nbsp;<span style="font-weight:normal;margin-left:5px;">{userLName}</span></p>                                    
                                </div>
                                <div class="slds-size_1-of-2">
                                    <p class="slds-text-title_bold">Participant:&nbsp;<span style="font-weight:normal;margin-left:5px;">{clientLabel}</span></p>                                    
                                </div>
                                <div class="slds-size_1-of-2">
                                    <p class="slds-text-title_bold">Facility Name:&nbsp;<span style="font-weight:normal;margin-left:5px;">{faclitylabel}</span></p>                                    
                                </div>
                                <div class="slds-size_1-of-2">
                                    <p class="slds-text-title_bold">E-mail:&nbsp;<span style="font-weight:normal;margin-left:5px;">{email}</span></p>                                
                                </div>
                                <div class="slds-size_1-of-2">
                                    <p class="slds-text-title_bold">Phone:&nbsp;<span style="font-weight:normal;margin-left:5px;">{phone}</span></p>                                    
                                </div>
                                <div class="slds-size_1-of-2">
                                    <p class="slds-text-title_bold">Role:&nbsp;<span style="font-weight:normal;margin-left:5px;">{role}</span></p>                                    
                                </div>
                                <template if:true={isStaff}>
                                    <div class="slds-size_1-of-2">
                                        <p class="slds-text-title_bold">Status:&nbsp;<span style="font-weight:normal;margin-left:5px;">{status}</span></p>                                    
                                    </div>
                                </template>
                                <div class="slds-size_1-of-2">
                                    <p class="slds-text-title_bold">Assign to:&nbsp;<span style="font-weight:normal;margin-left:5px;">{stafflabel1}</span></p>                                    
                                </div>
                            </div>
                        </lightning-card>
                        
                    </lightning-accordion-section>
                    
                    <!-- Section B: Issue Details -->
                    <lightning-accordion-section name="Incident Details" label="Incident Details">
                        <lightning-card title="">
                            <lightning-button-icon style="float: right;" icon-name="utility:edit" alternative-text="Edit" onclick={handleEdit2}></lightning-button-icon>
                            <div class="slds-grid slds-wrap" style="margin-left: 5%; margin-right: 2.5%;">
                                <div class="slds-col slds-size_1-of-2">
                                    
                                        <div class="form-section">
                                            <div class="form-group">
                                                <p class="slds-text-title_bold">Priority of the incident:&nbsp;<span style="font-weight:normal;margin-left:5px;">{priorityValue}</span></p>                                                
                                            </div>                                            
                                            <div class="form-group">
                                                <p class="slds-text-title_bold">Select the most relevant incident type:&nbsp;<span style="font-weight:normal;margin-left:5px;">{issueTypeValue}</span></p>
                                                <template if:true={mostRelevantOthers}>
                                                    <lightning-formatted-rich-text  value={mostRelevantOtherValue}></lightning-formatted-rich-text>
                                                </template>                                                
                                            </div>
                                            <div class="form-group">
                                                <p class="slds-text-title_bold">People involved in this incident:</p>
                                                <p>{raisedByValue}</p>
                                                <template if:true={showOtherDescription}>
                                                    <lightning-formatted-rich-text  value={others}></lightning-formatted-rich-text>
                                                </template>
                                                <template if:true={showParticipantRepresentative}>
                                                    <lightning-formatted-rich-text  value={partcipantValue}></lightning-formatted-rich-text>
                                                </template>
                                                <template if:true={showSubContractor}>
                                                    <lightning-formatted-rich-text  value={subContractor}></lightning-formatted-rich-text>
                                                </template>
                                                <template if:true={showClientDropdown}>
                                                    <lightning-formatted-rich-text  value={clientLabel1}></lightning-formatted-rich-text>
                                                </template>
                                                <template if:true={showFacilityDropdown}>
                                                    <lightning-formatted-rich-text  value={faclitylabel1}></lightning-formatted-rich-text>
                                                </template>
                                                
                                                <template if:true={showEmployee}>
                                                    <lightning-formatted-rich-text  value={stafflabel}></lightning-formatted-rich-text>
                                                </template>
                                                
                                                
                                            </div>
                                        </div>
                                    
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    
                                        <div class="form-section">
                                            <div class="form-group">
                                                <p class="slds-text-title_bold">Date and Time of the incident:&nbsp;<span style="font-weight:normal;margin-left:5px;">{UIincidentDateTime}</span></p>
                                            </div>
                                            <div class="form-group">
                                                <p class="slds-text-title_bold">Date and Time of the incident occurred:&nbsp;<span style="font-weight:normal;margin-left:5px;">{allegedDateTime}</span></p>
                                                
                                            </div>
                                            <div class="form-group">
                                                <p class="slds-text-title_bold">Please provide a detailed description of the incident:</p>
                                                <lightning-formatted-rich-text value={description}></lightning-formatted-rich-text>
                                            </div>
                                        </div>
                                    
                                </div>
                            </div>
                        </lightning-card>
                        
                    </lightning-accordion-section>
                    
                    <!-- Section C: Action Taken -->
                    <lightning-accordion-section name="Action Taken" label="Action Taken">
                        <lightning-card title="">
                            <lightning-button-icon style="float: right;" icon-name="utility:edit" alternative-text="Edit" onclick={handleEdit3}></lightning-button-icon>
                            <div class="slds-grid slds-wrap" style="margin-left: 5%; margin-right: 2.5%;">
                                <div class="slds-col slds-size_1-of-2">
                                    
                                        <div class="form-group">
                                            <template if:true={showPolice}>
                                            <p class="slds-text-title_bold">Has the incident been reported to the police?</p>
                                            <p>{reportedToPolice}</p>
                                            <template if:true={showPoliceComments}>
                                                <div class="form-group">
                                                    <p class="slds-text-title_bold">If yes, comments:</p>
                                                    <lightning-formatted-rich-text value={policeComments}></lightning-formatted-rich-text>
                                                </div>
                                            </template>
                                        </template>
                                        </div>
                                        <div class="slds-p-bottom_medium">
                                            <p class="slds-text-title_bold">Has the affected Participant’s representative expressed any ongoing concerns regarding the incident?</p>
                                            <p>{clientConcerns}</p>
                                        </div>
                                        <div class="slds-p-bottom_medium">
                                            <p class="slds-text-title_bold">What specific actions have been taken to ensure the health, safety and wellbeing of the Participant’s involved?</p>
                                            <lightning-formatted-rich-text value={actionsTaken}></lightning-formatted-rich-text>
                                        </div>
                                    
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    
                                        <div class="slds-p-bottom_medium">
                                            <p class="slds-text-title_bold">Is there any other information or details you wish to include in relation to this incident?</p>
                                            <lightning-formatted-rich-text value={additionalInfo}></lightning-formatted-rich-text>
                                        </div>
                                        <div class="slds-p-bottom_medium">
                                            <p class="slds-text-title_bold">What specific actions have been taken to manage or minimise the risk of recurrence of this or a similar incident in future?</p>
                                            <lightning-formatted-rich-text value={futureActions}></lightning-formatted-rich-text>
                                        </div>
                                        <div if:true={viewfileName}><p class="slds-form-element__legend slds-form-element__label">Uploaded File:&nbsp;<a href={viewfileName} data-url={viewfileName}  
                                            onclick={handleView} style="margin-left: 5px;">View File</a></p></div>
                                    
                                    
                                </div>
                            </div>
                        </lightning-card>
                        
                    </lightning-accordion-section>
                </lightning-accordion>
        
                <!-- Buttons -->
                <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
                    <lightning-button variant="brand" label="Submit" onclick={handleFinalise}></lightning-button>&ensp;&ensp;
                    <lightning-button variant="brand" label="Cancel" onclick={handleCancel4}></lightning-button>
                </div>
            </lightning-card> 
    </template>
  
    </template>

    <template if:true={isModalOpen}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
         class="slds-modal slds-fade-in-open slds-modal_large" style="height: 750px;" role="dialog" tabindex="-1">
        
          <div class="slds-modal__container">
            <!-- modal header start -->
            <header class="slds-modal__header">
              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                onclick={closeModal}>
                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                  size="small"></lightning-icon>
                <span class="slds-assistive-text">Close</span>
              </button>
              <h2  class="slds-text-heading_medium slds-hyphenate">View Attachment</h2>
            </header>
            <!-- modal body start -->
            <div class="slds-modal__content slds-p-around_medium">
              <iframe src={currentUrl} width="1300px" height="1000px" ></iframe>
              </div>
              <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
              </footer>
            <!-- modal footer start-->
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
  </lightning-card>
</template>
