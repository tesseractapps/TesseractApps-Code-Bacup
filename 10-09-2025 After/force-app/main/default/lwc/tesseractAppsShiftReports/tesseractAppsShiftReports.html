    <div class="slds-box slds-m-bottom_medium">
        <div style="display: flex; justify-content: space-between;">

            <!-- Left Section: Dropdowns -->
            <div style="display: flex; align-content: flex-start; gap: 1%; width: 50%;">
                <div >
                    <div class="floating-label-new" style="width:161px">
                        <span class="label-text-drop">Role</span>
                        <lightning-combobox
                            name="role"
                            variant="label-hidden"
                            value={selectedRole}
                            placeholder="Select Role"
                            options={roleOptions}
                            onchange={handleChange}>
                        </lightning-combobox>
                    </div>
                </div>

                <div >
                    <div class="floating-label-new" style="width:161px">
                        <span class="label-text-drop">Employment Type</span>
                        <lightning-combobox
                            name="employmentType"
                            variant="label-hidden"
                            value={selectedEmploymentType}
                            placeholder="Select Type"
                            options={employmentTypeOptions}
                            onchange={handleChange}>
                        </lightning-combobox>
                    </div>
                </div>

                <div >
                    <div class="floating-label-new" style="width:161px">
                        <span class="label-text-drop">Location</span>
                        <lightning-combobox
                            name="location"
                            variant="label-hidden"
                            value={selectedLocation}
                            placeholder="Select Location"
                            options={locationOptions}
                            onchange={handleChange}>
                        </lightning-combobox>
                    </div>
                </div>
            </div>

            <!-- Right Section: Dates + Export Button -->
            <div style="display: flex; justify-content: flex-end; gap: 1%; width: 50%;">
                <div>
                    <div class="floating-label-new">
                        <span class="label-text-drop">Start Date</span>
                        <lightning-input
                            type="date"
                            name="startDate"
                            variant="label-hidden"
                            value={selectedStartDate}
                            onchange={handleChange}>
                        </lightning-input>
                    </div>
                </div>

                <div>
                    <div class="floating-label-new">
                        <span class="label-text-drop">End Date</span>
                        <lightning-input
                            type="date"
                            name="endDate"
                            variant="label-hidden"
                            value={selectedEndDate}
                            onchange={handleChange}>
                        </lightning-input>
                    </div>
                </div>

                <div>
                    <lightning-button
                        label="Export CSV"
                        onclick={handleExport}
                        variant="brand"
                        class="export-csv-btn">
                    </lightning-button>
                </div>
            </div>

        </div>
    </div>

      <template if:false={noRecordsFlag}>
          <div class="table-container">
        <!-- Table below the header -->
          <div class="table-wrapper custom-scroll">
            <table class="staff-table">
              <thead>
                <tr>
                  <th class="table-th">Date</th>
                  <th class="table-th">Shift Type</th>
                  <th class="table-th">Staff Name</th>
                  <th class="table-th">Scheduled Time</th>
                  <th class="table-th">Participants</th>
                  <th class="table-th">Action</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={shiftDataTable} for:item="shift">
                  <tr key={shift.Id} class="table-row">
                    <td class="table-td">{shift.date}</td>
                    <td class="table-td">{shift.shiftType}</td>
                    <td class="table-td">{shift.name}</td>
                    <td class="table-td">{shift.scheduledTime}</td>
                    <td class="table-td">{shift.participants}</td>
                    <td class="table-td">
                      <div>
                        <a
                          href="javascript:void(0)"
                          data-id={shift.Id}
                          data-url={shift.amazonUrl}
                          onclick={handleView}
                          name="view_details"
                          title="View"
                          style="text-decoration: none"
                        >
                          <i class="material-icons view-icon" data-id={shift.Id}
                            >visibility</i
                          >
                        </a>
                        &nbsp;
                        <a
                          href="javascript:void(0)"
                          data-id={shift.Id}
                          onclick={handleDownload}
                          name="view_details"
                          title="Download"
                          style="text-decoration: none"
                        >
                          <i
                            class="material-icons download-icon"
                            data-id={shift.Id}
                            >download_for_offline</i
                          >
                        </a>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <template if:true={paginationVisible}>
            <!--Pagination Start-->
            <!-- <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination" style="padding-top: 0.5em;"> -->

                                  </select>
                              </div>
                          </div>
                      </div> -->
            <!--PAGE NAVIGATION-->

                          <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage} ></lightning-button>

                          <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                      </div> -->
            <!--TOTAL RECORDS-->
            <!-- <div class="slds-clearfix">
                          <div class="slds-float_right" style="margin-right:1%;">
                              <span class="slds-badge"> Total Records: {totalRecords}</span>
                          </div>
                      </div> -->
            <div class="fixed-pagination">
              <div
                class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
              >
                <!--PAGE NAVIGATION-->
                <div class="slds-align_absolute-center">
                  <lightning-button
                    disabled={bDisableFirst}
                    icon-name="utility:jump_to_left"
                    label="First"
                    class="slds-p-horizontal_x-small"
                    alternative-text="first page"
                    onclick={firstPage}
                  ></lightning-button>
                  <lightning-button
                    disabled={bDisableFirst}
                    icon-name="utility:chevronleft"
                    label="Previous"
                    alternative-text="Previous"
                    onclick={previousPage}
                  ></lightning-button>
                  &nbsp;
                  <span class="slds-badge"
                    >Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                    &nbsp;&nbsp;Page(s)</span
                  >
                  &nbsp;
                  <lightning-button
                    disabled={bDisableLast}
                    icon-name="utility:chevronright"
                    label="Next"
                    alternative-text="Next"
                    onclick={nextPage}
                    class="slds-p-horizontal_x-small"
                    icon-position="right"
                  ></lightning-button>
                  <lightning-button
                    disabled={bDisableLast}
                    icon-name="utility:jump_to_right"
                    label="Last"
                    alternative-text="last page"
                    onclick={lastPage}
                    icon-position="right"
                  ></lightning-button>
                </div>

                <!--TOTAL RECORDS-->
                <div class="slds-clearfix">
                  <div class="slds-float_right">
                    <span class="slds-badge"> Total Records: {totalRecords}</span>
                  </div>
                </div>
              </div>
            </div>
          </template>
          
        </div>
      </template>
      <template if:true={noRecordsFlag}>
        <div class="no-data">
          <p>No records found</p>
        </div>
      </template>
    </template>
    <template if:true={isViewFlag}>
      <!-- <c-sidebar-component shift-id={shiftId} onback={handleBackNavigate}></c-sidebar-component> -->
      <c-shift-reports-view-lwc
        shift-id={shiftId}
        onback={handleBackNavigate}
      ></c-shift-reports-view-lwc>
    </template>
  </div>
</template>
