<template>
   <!--  <div style="margin-top:5px;">
        <lightning-button style="margin-right:2%;margin-left:80%;" variant="brand" label="Create Invoice"
            title="Create Sales" onclick={handleCreateNewSales}></lightning-button> 
    </div> -->

    <template if:true={invoiceflag}>
        <div style="margin-left:12px;margin-top:3%;">
            <h3 slot="title">
                <!-- <img src={rewards} alt="" width="60px" height="60px" > -->
                <span style="font-size: 14px;font-weight:bold;">Invoice Details </span>
            </h3>
        </div>

            <div if:true={isDesktop}> 
                <div class="slds-grid slds-gutters" style="width:99%;margin-left:0.5%;">
                    <div style="margin-right:8px;margin-left: 20px;" >
                        <lightning-input type="date" name="sdate" value={sdate} label="Start Date" onchange={hadleDates}></lightning-input> <!--disabled={datesFlag}-->
                    </div>
                    <div style="margin-right:150px;">
                         <lightning-input type="date" value={edate} name="edate" label="End Date" onchange={hadleDates}></lightning-input> <!--disabled={datesFlag}-->
                    </div>
                    <div   style="margin-top:23px;margin-right:8px;margin-left:35%" >
                        <lightning-button label="Create New" onclick={handleInvoicFlag} variant="brand"></lightning-button>
                    </div>
                    
                    <div  style="margin-top:23px;">
                            <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={readInvoiceDetails}>
                                <svg class="slds-button__icon" aria-hidden="true">
                                    <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                                </svg>
                            </button> 
                    </div>
     
                </div>
            </div>
            <div class="slds-m-right_small" >
                    <table class="slds-table  slds-table_cell-buffer"  style="width:97%; margin-left:2%; margin-top:2%;table-layout:fixed;">
                    <thead>
                        <tr>
                            <th  class="slds-cell-wrap th">Invoice#</th>
                            <th class="slds-cell-wrap th" style="width:15%;">File Reference</th>
                            <th  class="slds-cell-wrap th">Date Generated</th>                            
                            <th  class="slds-cell-wrap th">GST</th>
                            <th  class="slds-cell-wrap th">Amount</th>
                            <th  class="slds-cell-wrap th">Status</th>
                            <th  class="slds-cell-wrap th">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={invoiceTable} for:item="acc">
                            <tr key={acc.Id} class="tr1">                               
                                    <td class="slds-cell-wrap">
                                        <a href="javascript:void(0)" data-id={acc.Id} onclick={handleedit}>  {acc.Name}
                                        </a>
                                    </td>
                               
                                <td class="slds-cell-wrap">{acc.fileReference}</td>
                                <td class="slds-cell-wrap">{acc.dateIssued}</td>                                
                                <td class="slds-cell-wrap">${acc.gst}</td>
                                <td class="slds-cell-wrap">${acc.amount}</td>
                                <td class="slds-cell-wrap">{acc.Status}</td>
                                <td>
                                    <div>                                        
                                        <a href={acc.amazonUrl} data-id={acc.Id} data-url={acc.amazonUrl}  
                                            onclick={handleView} >
                                            <lightning-icon icon-name="action:preview" size="xx-small" title="View Payslip"></lightning-icon>
                                        </a> &nbsp;
                                        <a href="javascript:void(0)" data-id={acc.Id} onclick={handleDelete}>
                                            <lightning-icon icon-name="action:delete" size="xx-small" variant="error" title="delete payslip"></lightning-icon>
                                        </a>
                                        
                                    </div>
                                </td>
                            </tr>                            
                        </template>
                    </tbody>
                </table>  

                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em; margin-left:20px;">
                    <div class="slds-col">
                        <div class="slds-list_inline slds-p-bottom_xx-small">
                            <span style="margin-top:5px;margin-left:10px;margin-right:5px;">Page Size:</span>
                            <label class="slds-text-color_weak" for="recordsPerPage"></label>
                            <div class="slds-select_container"> 
                                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template> 
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="slds-align_absolute-center" style="height:5rem">
                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage} ></lightning-button>
                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                        &nbsp;
                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                        &nbsp;
                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                    </div>
                    <div class="slds-clearfix">
                        <div class="slds-float_right" style="margin-right:15px;">
                            <span class="slds-badge"> Total Records: {totalRecords}</span>
                        </div>
                    </div>
                </div>
            </div>        
    </template>    


    <template if:true={isInvoiceflag}>       
        <div style="margin-top:2%;">
            <h3 style="margin-top:2%;margin-left:2%" slot="title">Invoice Details</h3>
            <div style="float:right;margin-top:-3%;margin-right:70px;">
                <lightning-button label="Back" variant="brand" onclick={handlemodelback}></lightning-button>
            </div>
            <template if:true={invoiceData}>
                <div class="demo-only demo-only--sizing slds-grid slds-wrap" style="margin-left:5%;margin-right:5%;">
                    <div class="slds-size_1-of-4">
                        <div class="slds-text-align_left"  style="margin-left:5px;">
                            <!-- <lightning-input name="invoiceto" type="text" required="true" label="Invoice to" value={invoiceToData} onchange={changeHandler}></lightning-input> -->
                            <lightning-combobox name="invoiceto" label="Invoice to" placeholder="Select Organisation Name" value={invoiceToData} options={optionsInvoiceTo} onchange={changeHandler} required="true">                            
                            </lightning-combobox>
                        </div>
                    </div>
                    <div class="slds-size_1-of-4">
                        <div class="slds-text-align_left" style="margin-left:5px;">
                            <lightning-input name="dateIssued"
                                type="date" label="Date Issued" value={dateIssued} required="true" onchange={changeHandler} >
                            </lightning-input>
                        
                        </div>
                    </div>
                    <div class="slds-size_1-of-4">
                        <div class="slds-text-align_left" style="margin-left:5px;">
                            <lightning-input name="duedate"
                                type="date" label="Due Date" value={duedate} onchange={changeHandler}>
                            </lightning-input>
                        </div>
                    </div>
                    <div class="slds-size_1-of-4">
                        <div class="slds-text-align_left" style="margin-left:5px;">
                            <lightning-input name="FileReference" type="text" required="true" label="File Reference" onchange={changeHandler} value={fileRefrence}></lightning-input>
                        </div>
                        </div>
                    
                    <template if:true={isInvoice}>
                        <div class="slds-size_1-of-4">
                            <div class="slds-text-align_left" style="margin-left:5px;">
                                <lightning-input name="dateIssued"
                                    label="Invoice No" value={invoiceFileName} required="true" disabled="true">
                                </lightning-input> 
                            </div>
                        </div>
                    </template>                      
                    <div class="slds-size_1-of-4" >
                        <div class="slds-text-align_left" style="margin-left:5px;">
                            <lightning-combobox name="selectOption" label="Include GST" value={selectedValue} options={options} onchange={changeHandler}>                            
                            </lightning-combobox>
                        </div>
                    </div>
                    <div class="slds-size_1-of-4">
                        <div class="slds-text-align_left" style="margin-left:5px;">
                            <lightning-combobox name="selectStatus" label="Status" placeholder="Select Status" value={invoiceStatus} options={statuOptions} onchange={changeHandler} disabled="true">                            
                            </lightning-combobox>
                        </div>
                    </div>
                    <template if:true={isInvoiceToggle}>
                        <div class="slds-size_1-of-8" style="margin-left:5px;margin-top:20px">
                            <div class="slds-text-align_left" >
                                    <!-- <lightning-icon class="receievd" icon-name="action:check" size="xx-small" onclick={handleReceived} title="mark it as received"></lightning-icon> -->
                                    <lightning-input type="toggle" data-id="statusToggle" label={statuslabel} name="input1"  message-toggle-active="" message-toggle-inactive=""
                                    onclick={handleReceived}></lightning-input>
                            </div>
                            </div>
                        </template>
                    <!-- <div class="slds-size_1-of-4">
                        <div class="slds-text-align_left" style="margin-left:5px;">
                            <lightning-input name="startDate"
                                type="date" label="Plan Start Date" value={startDate} required="true" onchange={changeHandler} >
                            </lightning-input>
                        
                        </div>
                    </div>
                    <div class="slds-size_1-of-4">
                        <div class="slds-text-align_left" style="margin-left:5px;">
                            <lightning-input name="endDate"
                                type="date" label="Plan End Date" value={endDate} onchange={changeHandler}>
                            </lightning-input>
                        </div>
                    </div> -->
                    
                    </div>
                    <div style="margin-left:75px;margin-top:5px">
                        <a href="javascript:void(0)"  data-name="orgdetails" onclick={handleHideOrgDetails} >{viewOrgLabel}
                        </a>
                    </div>
                    
                    <template if:true={viewOrgDetails}>
                        <div class="demo-only demo-only--sizing slds-grid slds-wrap" style="margin-left:5%;margin-right:5%;">
                            <div class="slds-size_1-of-4">
                                <div class="slds-text-align_left"  style="margin-left:5px;">
                                    <lightning-input name="organizationName"
                                        type="text" label="Organisation Name" value={invoiceData.Name}> 
                                    </lightning-input>
                                </div>
                            </div>
                            <div class="slds-size_1-of-4">
                                <div class="slds-text-align_left"  style="margin-left:5px;">
                                    <lightning-input name="contactNo"
                                        type="text" label="Contact No" value={invoiceData.Contact_No__c}> </lightning-input>
                                    </div>
                                </div>
                            <div class="slds-size_1-of-4">
                                <div class="slds-text-align_left"  style="margin-left:5px;">
                                    <lightning-input name="abn" type="text"
                                    label="ABN" value={invoiceData.ABN__c}> </lightning-input></div>
                                </div>
                            <div class="slds-size_1-of-4">
                                <div class="slds-text-align_left"  style="margin-left:5px;">
                                    <lightning-input name="acn" type="text"
                                    label="ACN" value={invoiceData.ACN__c}> </lightning-input></div>
                                </div>
                            <div class="slds-size_1-of-4">
                                <div class="slds-text-align_left"  style="margin-left:5px;">
                                    <lightning-input name="bank" type="text"
                                        label="Bank" value={invoiceData.Bank__c}> </lightning-input>
                                    </div>
                                </div>
                            <div class="slds-size_1-of-4">
                                <div class="slds-text-align_left"  style="margin-left:5px;">
                                    <lightning-input name="accountName"
                                        type="text" label="Account Name" value={invoiceData.Account_Name__c}> </lightning-input>
                                    </div>
                                </div>
                            <div class="slds-size_1-of-4">
                                <div class="slds-text-align_left"  style="margin-left:5px;">
                                    <lightning-input name="bsb" type="text"
                                    label="BSB" value={invoiceData.BSB__c}> </lightning-input>
                                </div>
                            </div>
                            <div class="slds-size_1-of-4">
                                <div class="slds-text-align_left"  style="margin-left:5px;">
                                    <lightning-input name="accountNumber"
                                        type="text" label="Account Number" value={invoiceData.Account_Number__c}>
                                    </lightning-input>
                                </div>
                            </div>
                            </div>
                    </template>

            </template>
            
            <div  style="margin-left:5%;margin-right:5%;margin-top:3%" >          
                <table class="slds-table slds-m-top_x-large" >
                    <thead>
                        <tr class="slds-text-title--caps">
                            <th class="slds-cell-wrap th" style="text-align:center">S.No</th>
                            <th class="slds-cell-wrap th" style="text-align:center">Description</th>
                            <th class="slds-cell-wrap th" style="text-align:center">No of Users</th>
                            <th class="slds-cell-wrap th" style="text-align:center">Billing Per User</th>
                            <th class="slds-cell-wrap th" style="text-align:center">Action</th>
                        </tr>
                    </thead>
                <tbody>
                    <template for:each={accountRecList} for:item="rec">
                        <tr key={rec} class="slds-hint-parent tr1">
                            <td style="font-weight: bold;text-align:center" >
                                <lightning-formatted-number value={rec.index}></lightning-formatted-number>.
                            </td>
                            <td>
                                <lightning-textarea type="text"  variant="label-hidden" label="" data-id={rec.index} name="Description" value={rec.Description} onchange={handleInputChange} required></lightning-textarea>
                            </td>
                            <td>
                                <lightning-input type="text"   variant="label-hidden" label="" data-id={rec.index} name="Quantity" value={rec.Quantity} onchange={handleInputChange} required></lightning-input>
                            </td>
                            <td>
                                <lightning-input type="text" variant="label-hidden" label="" data-id={rec.index} name="UnitPrice" value={rec.UnitPrice} onchange={handleInputChange} required></lightning-input>
                            </td>
                            <td style="text-align:center">
                                <lightning-button-icon icon-name="utility:delete" alternative-text="Remove" title="Remove" name={rec.index} onclick={removeRow}></lightning-button-icon>
                            </td>
                        </tr>
                    </template>
                    </tbody>

                </table>
            </div>
            <div style="margin-left:70px;margin-top:15px;">
                <lightning-button   label="Add New Line" onclick={addRow}
                variant="brand">
                </lightning-button> 
            </div> 
                
            <div class="container-total" style="border: 0; box-shadow: 0;">
                <div class="box1" style="border: 0; box-shadow: 0;">
                    <table class="invoicetotal">
                        <tr>
                            <th class="subtotal-text" style="padding-left: 115px;">Subtotal:</th>
                            <td class="subtotal" style="text-align: right;">{subTotalVal}</td>
                        </tr>
                        <tr>
                            <th style="padding-left: 165px;">GST:</th>
                            <td >{GSTVal}</td>
                        </tr>
                        <!-- Add class for the third row -->
                        <tr class="total-row">
                            <th class="totaltext" style="padding-left: 135px;"><b>Total:</b></th>
                            <td class="total" style="text-align: right;">${totalAmount}</td>
                        </tr>
                        <tr>
                            <th colspan="2" class="line"></th>
                            <td colspan="2" class="line"></td>
                        </tr>
                    </table>
                </div>
            </div>
            <div >
                <lightning-button style="margin-left:70px;" label="Save" onclick={saveInvoiceOnly} disabled={isSaveButton} variant="brand"></lightning-button>
                <lightning-button  style="margin-left:900px;" label="Generate" onclick={saveMultipleAccounts} variant="brand" disabled={isGenerateButton}></lightning-button>
                <lightning-button  style="margin-left:10px;" label="Send Email" onclick={handleOpenEmail} variant="brand" disabled={isSendButton}></lightning-button>
                <lightning-button style="margin-left:10px;"  label="Cancel" onclick={handlemodelback} variant="brand"></lightning-button>
            </div>

            <template if:true={isHistoryVisible}>
                <template if:true={isHistoryOpen}> 
                        <div style="margin-left:65px;margin-top:10px;">
                            <a href="javascript:void(0);" data-name="history" onclick={HandleOpenHistory} >Show Activity log
                            </a> 
                        </div>      
                    </template> 
                    <template if:false={isHistoryOpen}>
                        <div style="margin-left:65px;margin-top:10px;">
                            <a href="javascript:void(0);" data-name="history" onclick={closeHistory}>Hide Activity log
                            </a> 
                        </div>        
                    </template> 
                
                    <lightning-card if:true={invoiceHistory}>
                        <div class="slds-box">
                            <p style="margin-left:40px">
                            <b>Invoice Number:</b> {invoiceFileName}<br>
                            <b>Current Status: </b> {invoiceStatus}<br>
                            <b> Created Date and Time:</b> {createdDateTime}       &nbsp;  &nbsp;    &nbsp;    &nbsp;                       <b>Created by:</b> {createdBy} <br>
                            <b>Activity log  </b>
                            </p>
                        
                            <div if:true={invoiceHistory}>
                                <table class="slds-table  slds-table_cell-buffer"  style="width:93%; margin-left:40px; margin-top:0.5%;table-layout:fixed; margin-right:25px">
                                    <thead>
                                        <tr>
                                            <th  class="slds-cell-wrap th" >Modified Date and Time</th>
                                            <th  class="slds-cell-wrap th"> Modified by</th>
                                            <th class="slds-cell-wrap th" >Field Name</th>
                                            <th  class="slds-cell-wrap th"> New Value </th>
                                            <th  class="slds-cell-wrap th">Old Value</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={invoiceHistory} for:item="acc">
                                            <tr key={acc.Id} class="tr1">
                                                <td class="slds-cell-wrap ">{acc.modifiedDateAndTime}</td>
                                                <td class="slds-cell-wrap">{acc.modifiedBy}</td>
                                                <td class="slds-cell-wrap">{acc.FieldName}</td>
                                                <td class="slds-cell-wrap">{acc.Newvalue}</td>
                                                <td class="slds-cell-wrap">{acc.Oldvalue}</td>
                                            </tr>                            
                                        </template>
                                    </tbody>
                                </table>
                            </div>   
                        </div>
                    </lightning-card>
            </template>            
        </div> 
    </template>

    <template if:true={isModalOpen}>
        <!-- <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
         class="slds-modal slds-fade-in-open slds-modal_large" style="height: 750px;" role="dialog" tabindex="-1">
        
          <div class="slds-modal__container"> -->
            <!-- modal header start -->
            <!-- <header class="slds-modal__header">
              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                onclick={closeModal}>
                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                  size="small"></lightning-icon>
                <span class="slds-assistive-text">Close</span>
              </button>
              <h2  class="slds-text-heading_medium slds-hyphenate">View Attachment</h2>
            </header> -->
            <!-- modal body start -->
            <div class="slds-p-around_medium">
                <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
                onclick={closeaddPayrollinvoice} style="float:right;margin-bottom:5px;"></lightning-button>

              <iframe src={currentUrl} width="1300px" height="1300px" ></iframe>
              </div>
              <!-- <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
              </footer>
            --> <!-- modal footer start-->
          <!-- </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div> -->
    </template>

    <template if:true={sendEmailTemplate}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                onclick={closeModal}>
                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                  size="small"></lightning-icon>
                <span class="slds-assistive-text">Close</span>
              </button>
            <div class="slds-modal__header">
            <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Email</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <lightning-combobox name="emaildropDown" label="Select Email"  placeholder="Select Saved Email" options={emaillKeyOptions}
                onchange={hadleEmailChange} ></lightning-combobox>
                <lightning-input type="text"  name="emaiText" label="Enter Email" onchange={hadleEmailChange}></lightning-input>
            </div>
            <div class="slds-modal__footer">
            <button class="slds-button slds-button_neutral" aria-label="Cancel and close"  onclick={closeModal}>Cancel</button>
            <button class="slds-button slds-button_brand" onclick={handleSendEmail}>Send Email</button>
            </div>
            </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
