<template>
  <template if:true={isHome}>
    <lightning-card title="" icon-name="">
    
        <h3 slot="title">
            <img src={Search} alt="Participants" width="45px" height="45px" style="margin-right:0.1%">
            Participant Details
        </h3>
        
        <div class="slds-grid slds-wrap"> 
            <lightning-input  type="search" label="Search Participant" onchange={handleSearch} value={inputValue} style="margin-left:25px;"></lightning-input>
            <lightning-button variant="brand" label="Clear" title="clear" onclick={handleClear} style="margin-top: 25px;margin-left:10px;"></lightning-button>
           
            <div  style="margin-left:36%;" >
                <div class="slds-grid" style="margin-top:8%;">
                    
                        <lightning-button  variant="brand" label={participantlabel} slot="actions" title="Active and Inactive participant" onclick={handleToggleparticipant} style="margin-right:10px;"></lightning-button>
                       
                    
                    <div data-name="cardview" class={cardViewClass} onclick={handleChange}
                        style="cursor:pointer;height:18px;width:100px;font-size:12px;margin-right:10px;">
                        <lightning-icon icon-name="utility:tile_card_list" size="x-small"></lightning-icon>
                        &nbsp;Card&nbsp;View
                    </div>
                    <div data-name="listview" class={listViewClass} onclick={handleChange}
                        style="cursor:pointer;height:18px;width:100px;font-size:12px;margin-right:10px;">
                        <lightning-icon icon-name="utility:list" size="x-small"></lightning-icon>
                        &nbsp;List&nbsp;View
                    </div>
                    <lightning-spinner if:true={isLoading}></lightning-spinner>
                    
                </div>
            </div>
      
            <template if:false={isStaff}>
                <lightning-button variant="brand" label="Create New Participant" slot="actions" title="New Participant"
                    onclick={handleCreateNewFacility} class="slds-float_right" style="margin-top: 23px;margin-right:22px;" ></lightning-button>
                <button class="slds-button slds-button_icon slds-button_icon-border" style="margin-top:24px;" title="Refresh" onclick={fetchParticipant}>
                    <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                    </svg>
                </button>
            </template>
        
         </div>
     
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Refreshing Data" size="medium"></lightning-spinner>
        </template>
        
        <!-- Card view Display Code start -->
        <template if:true={cardFlag}>
            <template if:true={totalRecords}>
                <div if:true={isDesktop}>
                    <div class=" slds-grid slds-gutters slds-wrap" style="margin-right:0%;margin-left:1.5%;margin-top:2%;">
                        <template for:each={recordsToDisplay} for:item="fac" for:index="index">
                            <div key={fac.Id} class="slds-size_1-of-4">
                                <div key={fac.Id} style="border-radius: 12px; border: 1px solid rgba(0, 41, 70, 0.6);box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);" class="slds-m-right_large slds-m-bottom_large">
                                    <span style="border-top-left-radius: 12px; border-top-right-radius: 12px; height:40px;display:flex;align-items: center; justify-content: space-between;background-color:#003466;border-bottom: 1px black;padding:2px;">
                                        <div style="display: flex; align-items: center; margin-right: auto;">
                                        <b> <lightning-formatted-text style="font-size:17px;color:white;padding-left:15px;" class="name" value={fac.Name__c}></lightning-formatted-text>
                                            </b>
                                        
                                    </div>
                                    <template if:true={fac.Picture__c} >
                                        <lightning-avatar variant="circle" src={fac.Picture__c} initials="AW" fallback-icon-name="standard:person_account" alternative-text="image" style="margin-right:0.4rem;"></lightning-avatar>
                                    
                                      </template>

                                    </span>
                                    <span>
                                        <table style="margin-bottom:5px;margin-top:0.5rem;">
                                            <tr>
                                                <td style="font-weight:bold;width:5rem;padding-left:15px;">&nbsp;Contact:</td>
                                                <td style="padding-left:0.5rem;"><lightning-formatted-text
                                                        value={fac.Contact_Number__c}></lightning-formatted-text>
                                                </td>
                                            </tr>
                                            
                                            <tr>
                                                <td style="font-weight:bold;width:5rem;padding-left:15px;">&nbsp;Address:</td>
                                                <td style="padding-left:0.5rem;" class="facility"><lightning-formatted-text
                                                        value={fac.Address1__c}></lightning-formatted-text>
                                                </td>
                                            </tr>
                                          
                                            <tr>
                                                <td style="font-weight:bold;width:5rem;padding-left:15px;">&nbsp;</td>
                                                <td  style="padding-left:0.5rem;" class="facility"> 
                                                        {fac.Address__City__s},&nbsp;{fac.Address__StateCode__s},&nbsp;{fac.Address__PostalCode__s}
                                                </td>
                                            </tr>
                                            
                                            <tr>
                                                <td style="font-weight:bold;width:5rem;padding-left:15px;">&nbsp;Facility:</td>
                                                <td style="padding-left:0.5rem;" class="facility"><lightning-formatted-text
                                                        value={fac.Facility_Name__c}></lightning-formatted-text>
                                                </td>
                                            </tr>
                                            
                                            <tr>
                                                <template if:true={statusFlag}>
                                                    <td style="font-weight:bold;width:5rem;padding-left:15px;">&nbsp;Status:</td>
                                                </template>
                                                <template if:false={statusFlag}>
                                                    <td style="font-weight:bold;width:5rem;padding-left:15px;">&nbsp;</td>
                                                </template>
                                                <td style="display: flex; align-items: center;">
                                                    <template if:true={statusFlag}>
                                                        <lightning-input data-id={fac.Id} data-name={fac.Status__c}
                                                            type="toggle" onchange={handlefacStatus} label=""
                                                            checked={fac.Status__c} message-toggle-active=""
                                                            message-toggle-inactive="" style="margin-right:60%">

                                                        </lightning-input>
                                                    </template>
                                            
                                                    <lightning-icon icon-name="action:preview" alternative-text="Participant Details" title="Participant Details"
                                                        onclick={handleEditFacility} data-id={fac.Id} size="xx-small"
                                                        style="cursor:pointer;color:white;background:#0099DE;">
                                                    </lightning-icon>
                                
                                                </td>
                                                

                                            </tr>
                                            
                                        </table>
                                    </span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </template>
        <!-- Card view Display Code end-->
        <!--LIGHTNING DATATABLE start-->
        <template if:true={listFlag}>
            <div class="slds-m-top_x-large" style="margin-left:25px;margin-right:25px;">
                <table
                class="slds-table slds-table_cell-buffer table"
                style="table-layout:fixed">
                    <thead >
                        <tr>
                            <th class="slds-cell-wrap th table_th">
                                Participant Name</th>
                            <th class="slds-cell-wrap th table_th" style="width:10%;">
                                Contact Number</th>
                            <th class="slds-cell-wrap th table_th">
                                Address</th>
                            <th class="slds-cell-wrap th table_th">
                                Facility</th>
                            <template if:true={statusFlag}>
                                <th class="slds-cell-wrap th table_th" style="width:6%;">
                                    Status</th>
                            </template>
                            <th class="slds-cell-wrap th table_th" style="width:6%;">
                                Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={recordsToDisplay} for:item="acc">
                            <tr key={acc.Id} class="tr1">
                                <td class="slds-cell-wrap table_td"> 
                                    {acc.Name__c}                                    
                                </td>
                                <td class="slds-cell-wrap table_td">{acc.Contact_Number__c}</td>
                                <td class="slds-cell-wrap table_td">
                                    {acc.AddressData__c}
                                </td>
                                <td class="slds-cell-wrap table_td">
                                    {acc.Facility_Name__c}
                                </td>
                                <template if:true={statusFlag}>
                                    <td class="slds-cell-wrap table_td">
                                        {acc.Status_A__c}
                                    </td>
                                </template>
                                <td class="slds-cell-wrap table_td">
                                    <lightning-icon icon-name="utility:preview" variant="base" data-id={acc.Id} title="Participant Details"
                                    alternative-text="Participant Details" size="small" onclick={handleEditFacility} class="my-icon1"></lightning-icon>
                                </td>
                            </tr>
                        </template>

                    </tbody>
                </table>
            </div>
        </template>
        <!--LIGHTNING DATATABLE start-->
        <template if:true={totalRecords}>
            <div if:true={isDesktop}>
                <div if:true={visible}>
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
                        style="padding-top: 0.5em;">

                        <!--PAGE NAVIGATION-->
                        <div class="slds-align_absolute-center" style="height:5rem">
                            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
                                class="slds-p-horizontal_x-small" alternative-text="first page"
                                onclick={firstPage}></lightning-button>
                            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
                                alternative-text="Previous" onclick={previousPage}></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                                &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                                alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small"
                                icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                                alternative-text="last page" onclick={lastPage}
                                icon-position="right"></lightning-button>
                        </div>

                        <!--TOTAL RECORDS-->
                        <div class="slds-clearfix">
                            <div class="slds-float_right slds-m-right_xx-large">
                                <span class="slds-badge"> Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <!-- if there is no facilities -->
        <template if:false={noRecordsFlag}>
            <div class="slds-grid  slds-grid_align-spread slds-m-left_large"
                style="padding-top: 0.5em; font-size:20px;">
                <b style="color: #4CAF50;">No Participants are registered for this organisation.</b>
            </div>
        </template>
    </lightning-card>
    </template>

    <template if:true={ParticpantRecordForm}>
        
        <div class="slds-modal__content slds-p-around_medium">
            <h3 style="font-weight:bold;margin-bottom:2%;">Create New Participant<lightning-button style="margin-left:90%;margin-top:-1%;" label="Back" variant="brand" onclick={handleeditClose}></lightning-button></h3>
           
              <lightning-record-edit-form object-api-name="Client__c" record-id={recordId} onsuccess={handleSuccess} onsubmit={handleSubmit}>
                <lightning-messages></lightning-messages>
                
                <div class="slds-grid slds-wrap">
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="First_Name__c" required="true" name="fname" value={firstName} onchange={handleNameChange}></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Last_Name__c" name="lname" value={lastName} onchange={handleNameChange}></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Gendar__c"></lightning-input-field>
                        </div>
                    </div> 
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Date_Of_Birth__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Status__c" value={status}></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Contact_Number__c" required="true"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Facility__c" value={facilityId} onchange={handleFacilityChange} required="true"></lightning-input-field>
                        </div>
                    </div>
                    <!-- <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Name" required="true" disabled="true" value={fullName}></lightning-input-field>
                        </div>
                    </div> -->
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Email__c"></lightning-input-field>
                        </div>
                    </div>
                    <!-- <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                           <lightning-combobox label="Role" value={role}  placeholder="Select Role" options={OrgNisationRoles}
                             onchange={handleChangeRole} required="true" ></lightning-combobox>
                        </div>
                    </div>   
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium" >
                           <lightning-dual-listbox name="staff" class="list-box"
                              label="Select Staff"
                              source-label="Available"
                              selected-label="Selected" required="true"
                              options={staffOptions} value={selectedRoles}
                              onchange={handleStaffChange}>
                           </lightning-dual-listbox>
                        </div>
                   </div>             -->
                    
                   <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-left_medium">
                      
                         <lightning-input type="file" onchange={onFileUpload} name="Upload Profile Picture" label="Upload Profile Picture" style="margin-left:5px;">  
                         </lightning-input>
                         <div class="slds-text-body_small">{fileName}</div>
                         
                       
                     </div> 
                  </div>
                  <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-left_medium  slds-m-top_medium"  >
                      <lightning-button  variant="brand" label="Add Multiple Staff" slot="actions"
                      title="Multiple Staff" onclick={handleAddMultiUsers} style="margin-left:auto;" disabled={addStaffDisable}>
                     </lightning-button>
                    </div>
                  </div>
                    
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Staff__c"></lightning-input-field>
                        </div>
                    </div>
                    
                
                    <h3 style="width:100%;height:30px" class=" slds-page-header slds-page-header__row slds-section slds-is-open slds-section__title slds-m-right_medium slds-m-left_small">Address</h3>
                  
                    <div class="slds-size_1-of-1">
                        <div class="slds-m-right_medium slds-m-left_medium">    
                            <div style="color:red;">{errorMessage}</div>                   
                            <lightning-input-address
                                address-label="Address"
                                street-label="Street"
                                city-label="Suburb"
                                country-label="Country"
                                province-label="State"
                                postal-code-label="Post Code"
                                street={street}
                                city={city}
                                country={country}
                                province={province}
                                postal-code={postalcode}
                                onchange={addressInputChange}
                                show-address-lookup required="true">
                                </lightning-input-address>
                        </div>
                    </div>
                    <h3 style="width:100%;height:30px" class=" slds-page-header slds-page-header__row slds-section slds-is-open slds-section__title slds-m-right_medium slds-m-left_small">Identification Details</h3>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="NDIS_Participant_ID__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Medicare_Card_ID__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Passport_Details__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium" >
                            <lightning-input-field field-name="Drivers_Licence__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Photo_ID__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="State__c"></lightning-input-field>
                        </div>
                    </div>
                    <h3 style="width:100%;height:30px" class=" slds-page-header slds-page-header__row slds-section slds-is-open slds-section__title slds-m-right_medium slds-m-left_small">Insurance Details</h3>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Membership_Number__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Insurance_Provider__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Health_Concession_Cards__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="DVA_Card__c"></lightning-input-field>
                        </div>
                    </div>
                    <h3 style="width:100%;height:30px" class=" slds-page-header slds-page-header__row slds-section slds-is-open slds-section__title slds-m-right_medium slds-m-left_small">Primary Contact</h3>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Primay_Contact_First_Name__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Primay_Contact_Last_Name__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Relationship__c" required="true"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Primary_Contact_Number__c" required="true"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Primary_Email_ID__c"></lightning-input-field>
                        </div>
                    </div>
                    <h3 style="width:100%;height:30px" class=" slds-page-header slds-page-header__row slds-section slds-is-open slds-section__title slds-m-right_medium slds-m-left_small">Secondary Contact</h3>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Secondary_Contact_First_Name__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Secondary_Contact_Last_Name__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Secondary_Contact_Relationship__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Secondary_Contact_Number__c"></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-input-field field-name="Secondary_Contact_Email_ID__c"></lightning-input-field>
                        </div>
                    </div>
                    
                </div>
                <div class="slds-align_absolute-center slds-m-around_small">
                    <lightning-button label={buttonLabel} variant="brand" type="submit" class="slds-m-around_small" disabled={saveButtonDisable}></lightning-button>
                    <lightning-button label="Cancel" variant="brand" onclick={handleeditClose} class="slds-m-around_small"></lightning-button>
                </div>
              </lightning-record-edit-form>
          </div>
          <template if:true={roleStaffFlag}> 
            <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                 class="slds-modal slds-fade-in-open slds-modal_small" role="dialog" tabindex="-1" style="width:60%;margin-left:20%">
                 <div class="slds-modal__container ">
                    <!-- modal header start -->
                     <header class="slds-modal__header">
                       <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                          onclick={handleEditStaffClose}>
                          <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                          size="small"></lightning-icon>
                          <span class="slds-assistive-text">Close</span>
                       </button>
                       <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{headeringName}</h2>
                     </header> 
                        <!-- modal body start -->
                     <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1" >
                         <div class="slds-grid slds-wrap">
                            <div class="slds-size_1-of-3">
                                <div class="slds-m-right_medium slds-m-left_medium">
                                   <lightning-combobox label="Role" value={role}  placeholder="Select Role" options={OrgNisationRoles}
                                     onchange={handleChangeRole} required="true" style="width:60%;" ></lightning-combobox>
                                </div>
                            </div>       
                            <div class="slds-size_1-of-1">
                                <div class="slds-m-right_medium slds-m-left_medium slds-m-top_medium">
                                   <lightning-dual-listbox name="staff" class="list-box"
                                     label="Select Staff"
                                     source-label="Available"
                                     selected-label="Selected" required="true"
                                     options={staffOptions} value={staffName}
                                     onchange={handleStaffChange}></lightning-dual-listbox>
                                </div>
                            </div>           
                        </div>
                          
                        <div class="slds-align_absolute-center slds-m-around_small">
                           <!--<lightning-button label="Save" variant="brand" onclick={handleSave} class="slds-m-around_small"></lightning-button>  -->
                           <lightning-button label="Cancel" variant="brand" onclick={handleEditStaffClose} class="slds-float_right"></lightning-button>
                        </div>
                    </div>
                 </div> 
             </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    
    </template>
    
    <template if:true={isDetails}>
        <c-details-lwc record-id={recordId} selected-name={orgId}></c-details-lwc>
    </template>
    <template if:true={handleStatusFlag}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                        class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" style="width:5%;margin-left:45%;">
                    
                        <div class="slds-modal__container" >
                         <header class="slds-modal__header" style="background:#124795;border-radius:15px 15px 0 0">
                            
                            <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:left;">Please Confirm</h2>
                        </header> 
                        <div class="slds-modal__content slds-p-around_medium"  style="border-radius:0 0 15px 15px">                                
                            <div class="slds-m-around_small">
                                <div><h1>Are you sure you want to change status of the participant?</h1></div>
                                <div style="margin-top:10px;align-items:center;">
                                    <lightning-button label="Yes" variant="brand" onclick={handlestatuschange} class="slds-m-around_small" style="margin-left:4rem;"></lightning-button>
                                    <lightning-button label="No" variant="brand" onclick={handlestatusclose}
                                    class="slds-m-around_small"></lightning-button>
                                </div>
                            </div>
                        </div>
                        </div>
                    </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
      </template>
      <template if:true={editstaffflag}>
        <!-- <c-create-edit-staff-lwc staff-id={recordId} onstaffevent={childevent}></c-create-edit-staff-lwc> -->
        <c-details-lwc record-id={recordId} onclose={modalCloseHandler} state={state}></c-details-lwc>
      </template>
      
</template>
