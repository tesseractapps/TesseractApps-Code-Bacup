<div class="table-container servicePlanTable">

    <!-- HEADER -->
    <div class="header-wrapper">
        <table class="staff-table">
            <thead>
                <tr>
                    <th class="table-th center">
                        <lightning-input 
                            type="checkbox" 
                            checked={selectAllChecked} 
                            onchange={handleSelectAll}>
                        </lightning-input>
                    </th>

                    <th class="table-th" title="Resource Name">Resource Name</th>
                    <th class="table-th" title="Service Type">Service Type</th>
                    <th class="table-th" title="Line Item">Line Item</th>
                    <th class="table-th" title="Available Funds">Available Funds</th>
                    <th class="table-th" title="Service Date">Service Date</th>
                    <th class="table-th center" title="Qty">Qty</th>
                    <th class="table-th" title="Unit Price">Unit Price</th>
                    <th class="table-th" title="GST">GST</th>
                    <th class="table-th" title="Amount">Amount</th>
                    <th class="table-th center" title="Status">Status</th>
                    <th class="table-th center" title="Action">Action</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- BODY -->
    <div class="body-scroll custom-scroll servicePlanTableHeight">
        <table class="staff-table">
            <tbody>

                <template for:each={accList} for:item="acc">
                    <tr key={acc.Id} class="table-row">

                        <!-- CHECKBOX -->
                        <td class="table-td center">
                            <lightning-input
                                type="checkbox"
                                data-id={acc.Id}
                                data-status={acc.Status__c}
                                checked={acc.isChecked}
                                onchange={handleCheckboxChange}>
                            </lightning-input>
                        </td>

                        <!-- RESOURCE -->
                        <td class="table-td" title={acc.Resource_Name__c}>
                            {acc.Resource_Name__c}
                        </td>

                        <!-- SERVICE -->
                        <td class="table-td" title={acc.Service_Type_Name__c}>
                            {acc.Service_Type_Name__c}
                        </td>

                        <!-- LINE ITEM -->
                        <td class="table-td" title={acc.Lineitem__c}>
                            {acc.Lineitem__c}
                        </td>

                        <!-- FUNDS -->
                        <td class="table-td" title={acc.availableFunds}>
                            {acc.availableFunds}
                        </td>

                        <!-- DATE -->
                        <td class="table-td" title={acc.ServiceDate}>
                            {acc.ServiceDate}
                        </td>

                        <!-- QTY -->
                        <td class="table-td center" title={acc.Qty__c}>
                            {acc.Qty__c}
                        </td>

                        <!-- PRICE -->
                        <td class="table-td" title={acc.unitprice}>
                            {acc.unitprice}
                        </td>

                        <!-- GST -->
                        <td class="table-td" title={acc.GST__c}>
                            {acc.GST__c}
                        </td>

                        <!-- AMOUNT -->
                        <td class="table-td" title={acc.amount}>
                            {acc.amount}
                        </td>

                        <!-- STATUS BADGE -->
                        <td class="table-td center" title={acc.uistatus}>
                            <span class={acc.statusClass} title={acc.uistatus}>
                                {acc.uistatus}
                            </span>
                        </td>

                        <!-- ACTION -->
                        <td class="table-td center action-cell" title="edit_document delete">

                            <a href="javascript:void(0)"
                                data-name="edit"
                                data-id={acc.Id}
                                data-fund={acc.Funds_Tracker__c}
                                data-date={acc.Date_of_Service__c}
                                data-state={acc.State__c}
                                data-client={acc.Client__c}
                                data-service={acc.Service_Type_Name__c}
                                data-servicetype={acc.Service_Type__c}
                                onclick={handleRowActions}
                                title="Edit"
                                class="icon-link">

                                <i class="material-icons edit-icon">edit_document</i>
                            </a>

                            <a href="javascript:void(0)"
                                data-id={acc.Id}
                                data-status={acc.shiftStatus}
                                data-uistatus={acc.uistatus}
                                onclick={handleDeleteClick}
                                title="Delete"
                                class="icon-link">

                                <i class="material-icons delete-icon">delete</i>
                            </a>

                        </td>

                    </tr>
                </template>

            </tbody>
        </table>
    </div>

<div class="table-container invoiceTable">

    <!-- HEADER -->
    <div class="header-wrapper">
        <table class="staff-table">
            <thead>
                <tr>
                    <th class="table-th" title="Sales">Sales</th>
                    <th class="table-th" title="File Reference">File Reference</th>
                    <th class="table-th" title="Date Generated">Date Generated</th>
                    <th class="table-th" title="GST">GST</th>
                    <th class="table-th" title="Amount">Amount</th>
                    <th class="table-th center" title="Status">Status</th>
                    <th class="table-th center" title="Action">Action</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- BODY -->
    <div class="body-scroll custom-scroll invoiceTableHeight">
        <table class="staff-table">
            <tbody>

                <template for:each={bulkServices} for:item="invoice">
                    <tr key={invoice.Id} class="table-row">

                        <!-- SALES -->
                        <td class="table-td" title={invoice.Name}>
                            {invoice.Name}
                        </td>

                        <!-- FILE REF -->
                        <td class="table-td" title={invoice.fileReference}>
                            {invoice.fileReference}
                        </td>

                        <!-- DATE -->
                        <td class="table-td" title={invoice.invoiceDate}>
                            {invoice.invoiceDate}
                        </td>

                        <!-- GST -->
                        <td class="table-td" title={invoice.GST__c}>
                            ${invoice.GST__c}
                        </td>

                        <!-- AMOUNT -->
                        <td class="table-td" title={invoice.Total_Amount__c}>
                            ${invoice.Total_Amount__c}
                        </td>

                        <!-- STATUS BADGE -->
                        <td class="table-td center" title={invoice.Status__c}>
                            <span class={invoice.statusClass} title={invoice.Status__c}>
                                {invoice.Status__c}
                            </span>
                        </td>

                        <!-- ACTION -->
                        <td class="table-td center action-cell" title="visibility delete">

                            <a href={invoice.amazonUrl}
                                data-id={invoice.Id}
                                data-url={invoice.amazonUrl}
                                onclick={handleView}
                                title="View"
                                class="icon-link">

                                <i class="material-icons view-icon">visibility</i>
                            </a>

                            <a href="javascript:void(0)"
                                data-id={invoice.Id}
                                data-participantname={invoice.fileReference}
                                onclick={handleDeleteConfirmation}
                                title="Delete"
                                class="icon-link">

                                <i class="material-icons delete-icon">delete</i>
                            </a>

                        </td>

                    </tr>
                </template>

                <!-- NO DATA -->
                <template if:false={bulkServices.length}>
                    <tr>
                        <td class="no-data" title="No records found">No records found</td>
                    </tr>
                </template>

            </tbody>
        </table>
    </div>

</div>

                                            <label class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center" for="recordsPerPage">Page Size:</label>
                                            <div class="slds-select_container">
                                                <select class="slds-select"  onchange={handleRecordsPerPage1}>
                                                    <template for:each={pageSizeOptions1} for:item="option">
                                                        <option key={option} value={option}>{option}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                        <lightning-button disabled={bDisableFirst1} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage1}></lightning-button>
                                        &nbsp;
                                        <span class="slds-badge">Showing {pageNumber1} &nbsp;of&nbsp; {totalPages1} &nbsp;&nbsp;Page(s)</span>
                                        &nbsp;
                                        <lightning-button disabled={bDisableLast1} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage1} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                        <lightning-button disabled={bDisableLast1} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage1} icon-position="right"></lightning-button>
                                    </div>
                                    <!--TOTAL RECORDS-->
                                    <div class="slds-clearfix">
                                        <div class="slds-float_right">
                                            <span class="slds-badge"> Total Records: {totalRecords1}</span>
                                        </div>
                                    </div>

                    <div class="button-container slds-m-top_medium">

                        class="slds-m-around_small"></lightning-button>
                        <lightning-button label="Yes" variant="brand" onclick={handleDeleteService} class="slds-m-around_small"></lightning-button>
                        
                    </div>
                </div>
            </div>
            </div>
           </section>
           <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
    </div>
