          <div class="">
            <lightning-record-view-form object-api-name="Payroll_Setting__c" record-id={paysetId}>
                <div class="slds-grid slds-wrap">
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-output-field field-name="Facility_Name__c"> </lightning-output-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-output-field field-name="Frequency__c"> </lightning-output-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-output-field field-name="Period_Start_Date__c"> </lightning-output-field>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">

                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-m-right_medium slds-m-left_medium">
                            <lightning-output-field field-name="Status__c"> </lightning-output-field>
                        </div>
                    </div>
                </div>
            </lightning-record-view-form>
        </div>

        <div class="">
        <div class="table-container payroll-staff-table slds-m-around_small">
            <!-- HEADER -->
            <div class="header-wrapper">
                <table class="staff-table fixed-table">
                    <thead>
                        <tr class="table-row">
                            <th class="table-th" title="First Name">First Name</th>
                            <th class="table-th" title="Last Name">Last Name</th>
                            <th class="table-th" title="Frequency">Frequency</th>
                            <th class="table-th" title="Contact Number">Contact Number</th>
                            <th if:true={iststaus} class="table-th center" title="Action">Action</th>
                        </tr>
                    </thead>
                </table>
            </div>
            <!-- BODY -->
            <div class="table-body custom-scroll">
                <table class="staff-table fixed-table">
                    <tbody>
                        <template if:true={payrollStaff}>
                            <template for:each={payrollStaff} for:item="acc">
                                <tr key={acc.Id} class="table-row">
                                    <td class="table-td" title={acc.Staff__r.Name}>{acc.Staff__r.Name}</td>
                                    <td class="table-td" title={acc.Staff__r.Last_Name__c}>{acc.Staff__r.Last_Name__c}</td>
                                    <td class="table-td" title={acc.Staff__r.Employment_type__c}>{acc.Staff__r.Employment_type__c}</td>
                                    <td class="table-td" title={acc.Staff__r.Contact_Number__c}>{acc.Staff__r.Contact_Number__c}</td>
                                    <td  if:true={iststaus} class="table-td center">
                                        <a href="javascript:void(0)"
                                            data-id={acc.Id}
                                            onclick={handleDelete}
                                            title="Delete"
                                            style="text-decoration: none;">

                                            <i class="material-icons delete-icon">delete</i>
                                        </a>

                                    </td>
                                </tr>
                            </template>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
        <div if:false={isstaffList} class="sticky-footer">
            <lightning-button if:true={iststaus} label="Add Staff" onclick={displayStaffList} variant="brand"></lightning-button>
        </div>
       
    </div> 
    <template if:true={isstaffList}>

<div class="datatable-theme slds-m-around_small">
    <lightning-datatable
        key-field="Id"
        data={staffrecords}
        columns={columns}
        onrowselection={onRowSelection}>
    </lightning-datatable>
</div>        

        <template if:true={buttonsONPayroll}>
            <div class="sticky-footer">
                <lightning-button class="slds-m-left_medium" label="Close" variant="brand"

                <lightning-button class="slds-m-left_medium" label="Save" variant="brand"
                    onclick={savePayrunSetting}></lightning-button>
            </div>
        </template>
    </template>

             <div class="blur-overlay"></div>
             <div class="right-align" style="width:40%;">
              <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
              <h3 style="font-weight: bold;font-size:150%; margin: 0; padding: 3% 0 0 3%;">Edit Pay Setting</h3> 
              </div>
            <div class=" slds-p-around_medium">
              <lightning-record-edit-form object-api-name="Payroll_Setting__c" record-id={paysetId} onsuccess={handleSuccess} onsubmit={handleSubmit}>
               <div class="seperator"> 
               <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                  
                   <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop"><span style="color:red">*</span>Facility Name</span>
                               <lightning-input-field field-name="Facility_Name__c"  required="true" variant="label-hidden"></lightning-input-field>
                            </div>
                     </div>
                  
                  <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop"><span style="color:red">*</span>Frequency</span>
                               <lightning-input-field field-name="Frequency__c" required="true" onchange={handleFrequencyChange} name="frequency" variant="label-hidden"></lightning-input-field>
                            </div>
                     </div>
                  
                   <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop"><span style="color:red">*</span>Period Start Date</span>
                               <lightning-input-field field-name="Period_Start_Date__c" required="true" onchange={handleDateChange} value={sdate} variant="label-hidden"></lightning-input-field>
                            </div>
                     </div>
                  
                   <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop">Period End Date</span>
                               <lightning-input-field field-name="Period_End_Date__c" disabled="true" value={edate} variant="label-hidden"></lightning-input-field>
                            </div>
                     </div>
                  
                  
                  
                   <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop"><span style="color:red">*</span>Payment Date</span>
                               <lightning-input-field field-name="Next_Pay_Date__c" onchange={handleNextpayChange} required="true" variant="label-hidden"></lightning-input-field>
                            </div>
                     </div>
                  
                   <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label">
                                <span class="label-text-drop">Status</span>
                               <lightning-input-field field-name="Status__c" variant="label-hidden"></lightning-input-field>
                            </div>
                     </div>
                </div>
             </div>
                <div class="slds-grid slds-grid_align-center">
                   
                  <lightning-button label="Cancel"  variant="outline" onclick={handleeditClose}
                    class="slds-m-around_small"></lightning-button>
                <lightning-button label="Update" variant="brand" type="submit"
                    class="slds-m-around_small"></lightning-button>
                </div>
              </lightning-record-edit-form>
