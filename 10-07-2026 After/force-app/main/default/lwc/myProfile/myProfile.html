<div class={docTableClass}>

    <!-- HEADER -->
    <div class="header-wrapper">
        <table class="staff-table">
            <thead>
                <tr>
                    <th class="table-th" title="Doc No">Doc No</th>
                    <th class="table-th" title="Type of Document">Type of Document</th>
                    <th class="table-th" title="Comments">Comments</th>
                    <th class="table-th" title="Expiry Date">Expiry Date</th>
                    <th class="table-th center" title="Compliance">Compliance</th>
                    <th class="table-th center" title="Points">Points</th>
                    <template if:false={ictUserType}>
                        <th class="table-th center" title="Status">Status</th>
                    </template>                    
                    <th class="table-th center" title="Action">Action</th>


                </tr>
            </thead>
        </table>
    </div>

    <!-- BODY -->
    <div class="body-scroll custom-scroll docTableHeight">
        <table class="staff-table">
            <tbody>

                <template for:each={DocumentTableData} for:item="docdata">
                    <tr key={docdata.Id} class="table-row">

                        <td class="table-td" title={docdata.Name}>
                            {docdata.Name}
                        </td>

                        <td class="table-td" title={docdata.Document_Type__c}>
                            {docdata.Document_Type__c}
                        </td>

                        <td class="table-td" title={docdata.Comments__c}>
                            {docdata.Comments__c}
                        </td>

                        <td class="table-td" title={docdata.FormattedDate}>
                            {docdata.FormattedDate}
                        </td>

                        <td class="table-td center" title={docdata.ComplianceFormatted}>

                            <span class={docdata.complianceClass} title={docdata.ComplianceFormatted}>
                                {docdata.ComplianceFormatted}
                            </span>

                        </td>

                        <td class="table-td center" title={docdata.Points__c}>
                            {docdata.Points__c}
                        </td>

                        <!-- STATUS -->
                        <template if:false={ictUserType}>
                            <td class="table-td center" title={docdata.Status__c}>

                                <template if:true={docdata.isRejected}>
                                    <a href="javascript:void(0);"
                                        data-id={docdata.Id}
                                        onclick={handleRejectedcomments}
                                        class="reject-link">
                                        Rejected
                                    </a>
                                </template>

                                <template if:false={docdata.isRejected}>
                                    <span class={docdata.statusClass} title={docdata.Status__c}>
                                        {docdata.Status__c}
                                    </span>
                                </template>

                            </td>
                        </template>
                        <!-- ACTION -->
                        <td class="table-td center" title="View">
                            <a href="javascript:void(0)"
                                data-id={docdata.Id}
                                data-url={docdata.View_File__c}
                                name="view_details"
                                onclick={handleRowActions}
                                title="View"
                                class="icon-link">

                                <i class="material-icons view-icon">visibility</i>
                            </a>
                        </td>



                    </tr>
                </template>

                <!-- NO DATA -->
                <template if:false={DocumentTableData.length}>
                    <tr>
                        <td class="no-data">No records found</td>
                    </tr>
                </template>

            </tbody>
        </table>
    </div>

<div class={documentTableClass}>
    <!-- HEADER -->
    <div class="header-wrapper">
        <table class="staff-table">
            <thead>
                <tr>
                    <th class="table-th" title="Doc No">Doc No</th>
                    <th class="table-th" title="Type of Document">Type of Document</th>
                    <th class="table-th" title="Comments">Comments</th>
                    <th class="table-th" title="Expiry Date">Expiry Date</th>
                    <th class="table-th center" title="Compliance">Compliance</th>
                    <th class="table-th center" title="Points">Points</th>
                    <th class="table-th center" title="Action">Action</th>

                    <template if:false={ictUserType}>
                        <th class="table-th center" title="Status">Status</th>
                    </template>
                </tr>
            </thead>
        </table>
    </div>

    <!-- BODY -->
    <div class="body-scroll custom-scroll documentTableHeight">
        <table class="staff-table">
            <tbody>

                <template for:each={DocumentTableData} for:item="docdata">
                    <tr key={docdata.Id} class="table-row">

                        <!-- DOC NO -->
                        <td class="table-td" title={docdata.Name}>
                            {docdata.Name}
                        </td>

                        <!-- TYPE -->
                        <td class="table-td" title={docdata.Document_Type__c}>
                            {docdata.Document_Type__c}
                        </td>

                        <!-- COMMENTS -->
                        <td class="table-td" title={docdata.Comments__c}>
                            {docdata.Comments__c}
                        </td>

                        <!-- DATE -->
                        <td class="table-td" title={docdata.FormattedDate}>
                            {docdata.FormattedDate}
                        </td>

                        <!-- ✅ COMPLIANCE BADGE -->
                        <td class="table-td center" title={docdata.ComplianceFormatted}>
                            <span class={docdata.complianceClass} title={docdata.ComplianceFormatted}>
                                {docdata.ComplianceFormatted}
                            </span>
                        </td>

                        <!-- POINTS -->
                        <td class="table-td center" title={docdata.Points__c}>
                            {docdata.Points__c}
                        </td>

                        <!-- ACTION -->
                        <td class="table-td center action-cell">

                            <a href="javascript:void(0)"
                                data-id={docdata.Id}
                                data-staff={docdata.Staff__c}
                                data-key={docdata.KeyVal}
                                data-url={docdata.View_File__c}
                                name="view_details"
                                onclick={handleRowActions}
                                title="View Document">

                                <i class="material-icons view-icon">visibility</i>
                            </a>

                            <a href="javascript:void(0)"
                                data-id={docdata.Id}
                                data-expiryrequired={docdata.isExpiryRequired}
                                data-staff={docdata.Staff__c}
                                data-key={docdata.KeyVal}
                                data-type={docdata.Document_Type__c}
                                name="edit"
                                onclick={handleRowActions}
                                title="Edit"
                                class="icon-link">

                                <i class="material-icons edit-icon">edit_document</i>
                            </a>

                            <a href="javascript:void(0)"
                                data-id={docdata.Id}
                                data-expiryrequired={docdata.isExpiryRequired}
                                data-staff={docdata.Staff__c}
                                data-key={docdata.KeyVal}
                                name="delete"
                                onclick={handleRowActions}
                                title="Delete"
                                class="icon-link">

                                <i class="material-icons delete-icon">delete</i>
                            </a>

                            <a href="javascript:void(0)"
                                data-id={docdata.Id}
                                data-staff={docdata.Staff__c}
                                data-key={docdata.KeyVal}
                                name="archive"
                                onclick={handleRowActions}
                                title="Archive">

                                <i class="material-icons archive-icon">archive</i>
                            </a>

                        </td>

                        <!-- ✅ STATUS -->
                        <template if:false={ictUserType}>
                            <td class="table-td center" title={docdata.Status__c}>

                                <template if:true={docdata.isRejected}>
                                    <a href="javascript:void(0);"
                                        data-id={docdata.Id}
                                        onclick={handleRejectedcomments}
                                        class="reject-link">
                                        Rejected
                                    </a>
                                </template>

                                <template if:false={docdata.isRejected}>
                                    <span class={docdata.statusClass} title={docdata.Status__c}>
                                        {docdata.Status__c}
                                    </span>
                                </template>

                            </td>
                        </template>

                    </tr>
                </template>

                <!-- NO DATA -->
                <template if:false={DocumentTableData.length}>
                    <tr>
                        <td class="no-data">No records found</td>
                    </tr>
                </template>

            </tbody>
        </table>
    </div>

</div>

                        <lightning-input
                            type="search"
                            label="Search Documents"
                            placeholder="Search by Doc No"
                            value={archiveSearchKey}
                            onchange={handleArchiveSearch}>
                        </lightning-input>
                    </div>

                    <div class="table-container archive-table">

                    <!-- HEADER -->
                    <div class="header-wrapper">

                        <table class="staff-table">

                            <thead>
                                <tr class="table-row">
                                    <th class="table-th" title="Doc No">Doc No</th>
                                    <th class="table-th" title="Type of Document">Type of Document</th>
                                    <th class="table-th" title="Archived Date">Archived Date</th>
                                    <th class="table-th" title="Archived By">Archived By</th>
                                    <th class="table-th center" title="Actions">Actions</th>
                                </tr>
                            </thead>
                        </table>
                    </div>

                                <template if:true={archivedRecords.length}>

                                        for:each={archivedRecords}

                                            <td class="table-td" title={file.Type}>{file.Type}</td>
                                            <td class="table-td" title={file.ArchivedDate}>{file.ArchivedDate}</td>
                                            <td class="table-td" title={file.ArchivedBy}>{file.ArchivedBy}</td>
                                            <td class="table-td center action-cell">

                                                <!-- VIEW -->
                                                <a href="javascript:void(0)"
                                                    data-id={file.Id}
                                                    data-staff={file.StaffId}
                                                    data-key={file.Key}
                                                    data-url={file.FileUrl}
                                                    name="view_docs"
                                                    onclick={handleRowActions}
                                                    title="View Attachment">

                                                    <i class="material-icons view-icon">visibility</i>
                                                </a>

                                                <!-- DOWNLOAD -->
                                                <a href="javascript:void(0)"
                                                    data-id={file.Id}
                                                    data-staff={file.StaffId}
                                                    data-key={file.Key}
                                                    data-url={file.FileUrl}
                                                    data-name={file.Name}
                                                    name="download"
                                                    onclick={handleRowActions}
                                                    title="Download Attachment">

                                                    <i class="material-icons download-icon">download</i>
                                                </a>

                                                <!-- RESTORE -->
                                                <a href="javascript:void(0)"
                                                    data-id={file.Id}
                                                    data-staff={file.StaffId}
                                                    name="restore"
                                                    onclick={handleRowActions}
                                                    title="Unarchive">
                                                    <i class="material-icons unarchive-icon">unarchive</i>
                                                </a>
                                            </td>
                                        </tr>
                                    </template>
                                </template>

                                <template if:false={archivedRecords.length}>
                                    <tr>
                                        <td colspan="4" class="no-data">
                                            No archived documents found
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
