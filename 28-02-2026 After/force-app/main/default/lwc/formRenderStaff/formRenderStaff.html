<div class="table-container formResponseTable">

    <!-- ================= HEADER ================= -->
    <div class="header-wrapper">
        <table class="staff-table" role="table">
            <thead>
                <tr>
                    <th class="table-th">Form Name</th>
                    <th class="table-th">Created By</th>
                    <th class="table-th">Submitted On</th>
                    <th class="table-th">Status</th>
                    <th class="table-th">Actions</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- ================= BODY ================= -->
    <div class="body-scroll custom-scroll tableHeight">
        <table class="staff-table">
            <tbody>

                <template for:each={paginatedFormResponses} for:item="response">
                    <tr key={response.Id} class="table-row">

                        <!-- FORM NAME -->
                        <td class="table-td">
                            <div class="cell-text" title={response.Name__c}>
                                {response.Name__c}
                            </div>
                        </td>

                        <!-- CREATED BY -->
                        <td class="table-td" title={response.CreatedByName}>
                            {response.CreatedByName}
                        </td>

                        <!-- DATE -->
                        <td class="table-td">
                            {response.FormattedDate}
                        </td>

                        <!-- STATUS -->
                        <!-- <td class="table-td">
                            <span class="status-pill">
                                <span class={response.statusDotClass}></span>
                                {response.Status__c}
                            </span>
                        </td> -->

                        <!-- STATUS -->
                        <td class="table-td">
                            <span class={response.statusBadgeClass}>
                                {response.Status__c}
                            </span>
                        </td>



                        <!-- ACTIONS -->
                        <td class="table-td actions-col">

                            <!-- SIGNED -->
                            <template if:true={response.isSigned}>

                                <template if:true={response.canEditOrDelete}>
                                    <i class="material-icons delete-icon"
                                       data-id={response.Id}
                                       onclick={handleDelete}>
                                       delete
                                    </i>
                                </template>

                                <lightning-button
                                    label="Signed"
                                    variant="success"
                                    data-id={response.Id}
                                    data-signature-url={response.signatureUrl}
                                    onclick={handleTsignFromForms}>
                                </lightning-button>

                            </template>

                            <!-- NOT SIGNED -->
                            <template if:false={response.isSigned}>

                                <i class="material-icons view-icon"
                                   data-id={response.Id}
                                   onclick={handleView}>
                                   visibility
                                </i>

                                <template if:true={response.canEditOrDelete}>

                                    <i class="material-icons edit-icon"
                                       data-id={response.Id}
                                       onclick={handleEdit}>
                                       edit_document
                                    </i>

                                    <i class="material-icons delete-icon"
                                       data-id={response.Id}
                                       onclick={handleDelete}>
                                       delete
                                    </i>

                                </template>

                                <!-- <i class="material-icons tsign-icon"
                                   data-id={response.Id}
                                   data-url={response.AWS_Url__c}
                                   onclick={handleTsignFromForms}>
                                   stylus_note
                                </i> -->

                            </template>

                        </td>

                    </tr>
                </template>

            </tbody>
        </table>
    </div>

</div>
                  </template>
                </div>
              </div>
            </div>

            <template if:true={totalFormRecords}>
              <div
                class="slds-grid slds-p-around_medium slds-grid_vertical-align-center paginationcontrol"
              >
                <!-- Left spacer grows to push center into true middle -->
                <div class="slds-col slds-grow"></div>

                <!-- Center: Pagination Controls (no grow) -->
                <div class="slds-col">
                  <div
                    class="slds-grid slds-gutters slds-align_absolute-center"
                  >
                    <lightning-button
                      class="slds-m-horizontal_x-small"
                      disabled={disableFirstFormPage}
                      icon-name="utility:chevronleft"
                      label="Previous"
                      onclick={previousFormPage}
                    >
                    </lightning-button>

                    <span class="slds-badge slds-m-horizontal_small">
                      Showing {formPageNumber} of {totalFormPages} Page(s)
                    </span>

                    <lightning-button
                      class="slds-m-horizontal_x-small"
                      disabled={disableLastFormPage}
                      icon-name="utility:chevronright"
                      label="Next"
                      onclick={nextFormPage}
                    >
                    </lightning-button>
                  </div>
                </div>

                <!-- Right: Total count grows and aligns to extreme right -->
                <div class="slds-col slds-grow slds-text-align_right">
                  <span class="slds-badge"
                    >Total Submitted Forms: {totalFormRecords}</span
                  >
                </div>
              </div>
            </template>
          </template>
        </template>
      </div>
    </template>

    <template if:true={hasResponses}>
      <template if:true={isViewModeON}>
        <template if:false={isViewMode}>
          <div class="view-popup-content">
            <div
              class="empty-view slds-p-around_large slds-text-align_center"
              role="region"
              aria-label="No form selected"
            >
              <i class="material-icons empty-view__icon" aria-hidden="true"
                >description</i
              >
              <p class="slds-text-heading_small slds-text-title_bold">
                Select a form response to view details
              </p>
              <p class="slds-text-color_weak slds-m-top_x-small">
                Tip: click the eye icon in the table to open a preview.
              </p>
            </div>
          </div>
        </template>

        <!-- View Mode -->
        <template if:true={isViewMode}>
          <!-- <div class="view-popup-container"> -->
          <div class={viewPopupContentClass}>
            <div class="view-popup-header">
              <span class="view-popup-title">
                Preview: {selectedFormTitle} ({selectedFormType})
              </span>

              <div class="view-popup-actions">
                <span
                  class="icon-btn"
                  role="button"
                  tabindex="0"
                  title="Download PDF"
                  aria-label="Download PDF"
                  onclick={downloadPdfinView}
                  onkeydown={handleIconKeydown}
                >
                  <i class="material-icons download-icon">file_download</i>
                </span>

                <span
                  class="icon-btn"
                  role="button"
                  tabindex="0"
                  title={expandButtonTitle}
                  aria-label={expandButtonTitle}
                  onclick={expandview}
                  onkeydown={handleIconKeydown}
                >
                  <i class="material-icons expand-icon">{expandIconName}</i>
                </span>

                <span
                  class="icon-btn"
                  role="button"
                  tabindex="0"
                  title="Close"
                  aria-label="Close"
                  onclick={closeView}
                  onkeydown={handleIconKeydown}
                >
                  <i class="material-icons close-icon">close</i>
                </span>
              </div>
            </div>

            <!-- ✅ Table Container -->
            <div class="view-popup-table-container custom-scroll">
              <table class="view-popup-table">
                <thead>
                  <tr>
                    <th>Field Name</th>
                    <th>Value</th>
                  </tr>
                </thead>
                <tbody>
                  <template iterator:item={viewTableData}>
                    <!-- 🔹 Page Break Divider -->
                    <template if:true={item.value.isPageBreak}>
                      <tr key={item.value.key}>
                        <td
                          colspan="2"
                          class="page-break-row"
                          onclick={togglePageSection}
                          data-page={item.value.pageNumber}
                        >
                          <div class="page-divider">
                            <span>
                              <span class="arrow">{item.value.arrow}</span>
                              Page {item.value.pageNumber}
                            </span>
                          </div>
                        </td>
                      </tr>
                    </template>

                    <!-- 🔹 Render Visible Fields Only -->
                    <template if:false={item.value.isPageBreak}>
                      <template if:true={item.value.isSectionHeader}>
                        <tr key={item.value.id} if:true={item.value.isVisible}>
                          <!-- Optional inline style coming from headerStyle -->
                          <td
                            class="section-cell"
                            colspan="2"
                            style={item.value.headerStyle}
                          >
                            {item.value.title}
                          </td>
                        </tr>
                      </template>
                      <template if:false={item.value.isSectionHeader}>
                        <template if:true={item.value.isVisible}>
                          <tr key={item.value.id}>
                            <td class="view-table-label">{item.value.label}</td>
                            <td class="view-table-value">
                              <template if:true={item.value.isCheckbox}>
                                
                                <lightning-icon
                                  icon-name={item.value.value}
                                   size="xx-small"
                                ></lightning-icon>
                               
                              </template>

                              <template if:true={item.value.isUploadFile}>
                                <!-- Prefer the normalized array -->
                                <template if:true={item.value.files}>
                                  <template
                                    for:each={item.value.files}
                                    for:item="f"
                                  >
                                    <div key={f.key} class="uploaded-file">
                                      <template if:true={f.isImage}>
                                        <img
                                          src={f.url}
                                          alt="Uploaded File"
                                          class="uploaded-image"
                                        />
                                      </template>
                                      <!-- <a href={f.downloadUrl} target="_blank" download class="download-link">
                <lightning-icon icon-name="utility:download" size="xx-small"
                  alternative-text="Download" class="download-icon">
                </lightning-icon>
                Download File
              </a> -->
                                    </div>
                                  </template>
                                </template>

                                <!-- Legacy single-url fallback -->
                                <template if:false={item.value.files}>
                                  <template if:true={item.value.uploadUrl}>
                                    <template if:true={item.value.isImageFile}>
                                      <img
                                        src={item.value.uploadUrl}
                                        alt="Uploaded File"
                                        class="uploaded-image"
                                      />
                                    </template>
                                    <a
                                      href={item.value.finalDownloadUrl}
                                      target="_blank"
                                      download
                                      class="download-link"
                                    >
                                      <lightning-icon
                                        icon-name="utility:download"
                                        size="xx-small"
                                        alternative-text="Download"
                                        class="download-icon"
                                      >
                                      </lightning-icon>
                                      Download File
                                    </a>
                                  </template>
                                  <template if:false={item.value.uploadUrl}>
                                    <span>No File Uploaded</span>
                                  </template>
                                </template>
                              </template>

                              <!-- ✅ Rich Text Field -->
                              <template if:true={item.value.isRichText}>
                                <div class="rich-text-view-container">
                                  <div
                                    class="rich-text-view"
                                    lwc:dom="manual"
                                    data-id={item.value.id}
                                  ></div>
                                </div>
                              </template>

                              <!-- ✅ Radio Button Text (Basic Display) -->
                              <template if:true={item.value.isRadioButton}>
                                <span class="view-radio-value"
                                  >{item.value.value}</span
                                >
                              </template>
                              <!-- ⭐ Signature Display -->
                              <template if:true={item.value.isSignature}>
                                <div class="signature-view-wrapper">
                                  <img
                                    src={item.value.value}
                                    alt="Signature"
                                    class="signature-view-img"
                                  />
                                </div>
                              </template>


                              <!-- ✅ Fallback for Text/Date/Dropdown -->
                              <template if:true={item.value.isRegularField}>
                                <span>{item.value.value}</span>
                              </template>
                            </td>
                          </tr>
                        </template>
                      </template>
                    </template>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </template>
    </template>

    <template if:true={isFormSelected}>
      <div class={unitedContentClass}>
        <div class="title-step">
          <div class="form-title-container">
            <span class="form-title"
              >{selectedFormTitle} - {selectedFormType}</span
            >
          </div>

          <div class="form-navigation-buttons">
            <template if:true={showStepProgressIndicator}>
              <div class="pagination-bar">
                <button
                  class="icon-btn"
                  aria-label="Previous page"
                  onclick={goToPreviousStepPage}
                  disabled={isFirstStepPage}
                >
                  <i class="material-icons material-icons-page">chevron_left</i>
                </button>

                <span class="page-info">
                  Page <strong>{stepCurrentPageDisplay}</strong>
                  <span class="page-of">of {totalStepPages}</span>
                </span>

                <button
                  class="icon-btn"
                  aria-label="Next page"
                  onclick={goToNextStepPage}
                  disabled={isLastStepPage}
                >
                  <i class="material-icons material-icons-page"
                    >chevron_right</i
                  >
                </button>
              </div>
            </template>

            <span
              class="icon-btn"
              role="button"
              tabindex="0"
              title={expandButtonTitle}
              aria-label={expandButtonTitle}
              onclick={expandview}
              onkeydown={handleIconKeydown}
            >
              <i class="material-icons expand-icon">{expandIconName}</i>
            </span>
          </div>
        </div>

        <div class="excel-table-container custom-scroll">
          <table class="excel-table">
            <tbody>
              <template for:each={tableRows} for:item="row">
                <tr key={row.id}>
                  <template for:each={row.cells} for:item="cell">
                    <template if:true={cell.isVisible}>
                      <!-- Only render <td> if there is a valid field -->
                      <template if:true={cell.field}>
                        <td
                          key={cell.domKey}
                          class="table-cell"
                          colspan={cell.colspan}
                          rowspan={cell.rowspan}
                        >
                          <template if:true={cell.hasContent}>
                            <div
                              class="floating-label"
                              style={cell.floatingLabelStyle}
                            >
                              <span class="label-text-drop">
                                <template if:true={cell.field.isRequired}>
                                  <span style="color: red">*</span>
                                </template>
                                {cell.field.label}
                              </span>

                              <template if:true={cell.hasComment}>
                                <span class="tooltip-container">
                                  <lightning-icon
                                    icon-name="utility:info"
                                    size="xx-small"
                                    class="info-icon"
                                  ></lightning-icon>
                                  <span class="tooltip-text"
                                    >{cell.field.comments}</span
                                  >
                                </span>
                              </template>

                              <template if:true={cell.field.isHeader}>
                                <div
                                  class="fc-header"
                                  style={cell.field.inlineStyle}
                                >
                                  {cell.field.text}
                                </div>
                              </template>

                              <template if:true={cell.isTextField}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  oninput={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>

                              <template if:true={cell.isTextArea}>
                                <textarea
                                  key={cell.domKey}
                                  data-id={cell.id}
                                  class="input-textarea"
                                  maxlength="255"
                                  placeholder={cell.placeholderText}
                                  value={cell.field.value}
                                  oninput={handleTextAreaInput}
                                ></textarea>
                              </template>

                              <!-- ✅ AlphaNumeric Text Field (Restricts special chars) -->
                              <template if:true={cell.isAlphaNumeric}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  maxlength={cell.maxLength}
                                  pattern="[A-Za-z0-9]*"
                                  onkeypress={restrictAlphaNumeric}
                                  oninput={validateAlphaNumeric}
                                  onchange={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>

                              <!-- ✅ Only Alphabets Text Field (No numbers, no special chars) -->
                              <template if:true={cell.isOnlyAlphabets}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  maxlength={cell.maxLength}

      onchange={handleSignatureUpload}
      data-role="signature-upload"
    />

    <button
      type="button"
      class="file-upload-button"
      onclick={triggerSignatureFileInput}>
      &#8684; Upload Image
    </button>

    <template if:true={pendingSignatureBase64}>
      <div class="signature-upload-preview">

        <img src={pendingSignatureBase64} class="signature-preview-img"/>

        <button
          class="signature-delete-btn"
          onclick={clearUploadedSignature}>
          ✕
        </button>

      </div>
    </template>

  </div>
</template>



        <!-- DRAW MODE -->
        <template if:true={isDrawMode}>
  <div class="signature-mode-panel">

    <canvas class="signature-canvas"></canvas>

    <div class="signature-draw-actions">
      <button
        class="signature-clear-canvas"
        onclick={clearDrawSignature}>
        Clear
      </button>
    </div>

  </div>
</template>


      </div>

      <!-- ================= FOOTER ================= -->
      <div class="assign-modal-footer">
        <button
          class="assign-primary slds-button slds-button_brand"
          onclick={saveSignature}>
          Save Signature
        </button>
      </div>

    </div>

  </div>

</template>





</template>
