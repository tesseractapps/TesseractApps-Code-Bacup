<template>
    <div class={panelClass}>
        <!-- Panel Header -->
        <div class="panel-header slds-grid slds-grid_vertical-align-center slds-p-around_medium">
            <h2 class="panel-title slds-col">Widget Settings</h2>
            <button class="panel-close-btn" onclick={handleClose} title="Close Settings">
                <lightning-icon icon-name="utility:close" size="x-small" variant="inverse"></lightning-icon>
            </button>
        </div>

        <!-- Panel Body Form -->
        <div class="panel-body custom-scroll slds-p-around_medium">
            <template if:true={hasWidget}>
                <!-- SECTION: VISUALIZATION SETTINGS -->
                <template if:true={isChart}>
                    <div class="settings-section">
                        <h3 class="section-heading">Visualization</h3>
                        <div class="slds-m-bottom_medium">
                            <lightning-combobox
                                label="Chart Type"
                                value={widget.chartType}
                                options={chartTypeOptions}
                                data-field="chartType"
                                data-top-level="true"
                                onchange={handleFieldChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                </template>
            </template>

            <!-- Empty Selection State -->
            <template if:false={hasWidget}>
                <div class="empty-panel-state">
                    <lightning-icon icon-name="utility:settings" size="large" class="panel-empty-icon"></lightning-icon>
                    <h3>Select a Widget</h3>
                    <p>Click on the widget options menu in edit mode to load and customize its specific visual properties.</p>
                </div>
            </template>
        </div>
    </div>
</template>
