<template>
      <div  role="dialog" aria-modal="true" aria-labelledby="modal-heading" class="slds-p-around_medium">
       
            <!-- Header Content -->
            <div class="slds-p-bottom_medium slds-text-align_left">

                <!-- Title -->
                <h2 class="slds-text-heading_medium">
                    {headerText}
                </h2>

                <!-- Description -->
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                    Select specific dates from your recurring shift pattern
                </p>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                    Recurring Period: <strong>{recurringStartDate}</strong> to <strong>{recurringEndDate}</strong>
                </p>


            </div>

            <!-- Body -->
            <div class="slds-modal__content">
        
                <!-- Quick Day Selection Buttons -->
                    <!-- <div class="slds-grid slds-wrap slds-grid_align-spread slds-m-bottom_small"> -->
                    <div>
                    <!-- LEFT : WEEKDAY BUTTONS -->
                    <div class="slds-col slds-grow">
                        <div class="slds-button-group slds-wrap" role="group">

                            <template for:each={weekDays} for:item="day">
                                <button key={day.value}
                                        data-day={day.value}
                                        onclick={handleDayToggle}
                                        class={day.class}>

                                    <span class="slds-text-body_small">All</span><br/>
                                    <span class="slds-text-title_bold">{day.label}</span>

                                </button>
                            </template>

                        </div>
                    </div>

                    <!-- RIGHT : ACTION LINKS -->
                    <div class="slds-col slds-shrink-none slds-align-middle slds-m-bottom_small">
                        <a onclick={handleSelectAll}
                        class="slds-m-right_medium slds-text-link">
                            Select All
                        </a>

                        <a onclick={handleDeselectAll}
                        class="slds-text-link">
                            Deselect All
                        </a>
                    </div>

                </div>



                <!-- Calendar -->
                <div class="slds-m-bottom_medium">
                    <!-- Calendar Header -->
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">

                        <!-- LEFT ARROW -->
                        <div class="slds-col">
                            <a href="javascript:void(0)"
                            onclick={handlePreviousMonth}
                            class="slds-p-around_x-small slds-text-link_reset"
                            title="Previous">
                                <i class="material-icons arrows">line_start_arrow_notch</i>
                            </a>
                        </div>

                        <!-- MONTH TITLE -->
                        <div class="slds-col slds-text-align_center">
                            <h3 class="slds-text-heading_medium">{currentMonthYear}</h3>
                        </div>

                        <!-- RIGHT ARROW -->
                        <div class="slds-col slds-text-align_right">
                            <a href="javascript:void(0)"
                            onclick={handleNextMonth}
                            class="slds-p-around_x-small slds-text-link_reset"
                            title="Next">
                                <i class="material-icons arrows">line_end_arrow_notch</i>
                            </a>
                        </div>

                    </div>


                    <div class="slds-grid slds-wrap">

                        <!-- Day Headers -->
                        <div class="slds-col slds-size_1-of-7 slds-text-align_center slds-p-around_x-small">
                            <strong class="slds-text-body_small">Sun</strong>
                        </div>
                        <div class="slds-col slds-size_1-of-7 slds-text-align_center slds-p-around_x-small">
                            <strong class="slds-text-body_small">Mon</strong>
                        </div>
                        <div class="slds-col slds-size_1-of-7 slds-text-align_center slds-p-around_x-small">
                            <strong class="slds-text-body_small">Tue</strong>
                        </div>
                        <div class="slds-col slds-size_1-of-7 slds-text-align_center slds-p-around_x-small">
                            <strong class="slds-text-body_small">Wed</strong>
                        </div>
                        <div class="slds-col slds-size_1-of-7 slds-text-align_center slds-p-around_x-small">
                            <strong class="slds-text-body_small">Thu</strong>
                        </div>
                        <div class="slds-col slds-size_1-of-7 slds-text-align_center slds-p-around_x-small">
                            <strong class="slds-text-body_small">Fri</strong>
                        </div>
                        <div class="slds-col slds-size_1-of-7 slds-text-align_center slds-p-around_x-small">
                            <strong class="slds-text-body_small">Sat</strong>
                        </div>

                        <!-- Calendar Days -->
                        <template for:each={calendarDays} for:item="day">
                            <div
                                key={day.key}
                                class={day.class}
                                data-date={day.date}
                                onclick={handleDateClick}>
                                {day.day}
                            </div>
                        </template>
                    </div>
                </div>

              
                <!-- Summary -->
                <div class="slds-theme_default slds-m-top_medium">

                    <p class="slds-text-body_small">
                        <strong>{summaryLine}</strong>
                    </p>

                    <p class="slds-text-body_small slds-m-top_xx-small">
                        {dateRangeLabel}
                        <strong>{dateRange}</strong>
                    </p>

                </div>


            </div>

        
    </div>
</template>
