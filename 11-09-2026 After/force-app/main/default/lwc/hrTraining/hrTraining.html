<template>
  <div class="main-container custom-scroll">
    <template if:true={showUpgradeModal}>
                <c-upgrade-modal 
                    is-open={showUpgradeModal} 
                    onclose={closeUpgradeModal}>
                </c-upgrade-modal>
     </template>

  <template if:true={isHome}>    
        

    <template if:true={isStaffVisible}>

         <div style="padding-top:1%;display: flex;justify-content: flex-end;margin-right:1%;">
          <!-- <lightning-button label="Create New Training " onclick={handleCreateNewtraining} variant="brand" style="margin-right:1%;">
          </lightning-button> -->
          <button class="custom-create-btn" onclick={navigateToWyzedAdmin} style="margin-right:1%;" title="Go to Wyzed (Ctrl + Shift + C)">
          Go to Wyzed
           </button>
      
      </div>
      <div class="slds-p-horizontal_medium slds-p-top_medium custom-scroll">

       <template if:true={showSpinner}>
        <!-- <lightning-spinner alternative-text="Refreshing Data" size="medium"></lightning-spinner> -->

            <div class="overlay-logo"></div>
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
                <p class="progress-text">Loading</br>Please Wait...</p>
            </div>
      </template>

      </div>
      
           
        
      </template>

       <div>
       
        <template if:true={individualstaffflag}>
                <template if:true={individualstaffassigments}>

                    <!-- Outer container with proper spacing -->
                    <div class="slds-box slds-p-around_medium slds-m-around_medium">

                        <!-- Grid layout -->
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-start">

                            <!-- Left side text -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_9-of-12">
                                <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
                                    Wyzed is a training platform for accessing learning resources and videos.
                                    Your assigned training content is provided by administrators.
                                    Clicking this button will securely redirect you to the Wyzed portal.
                                </p>
                            </div>

                            <!-- Right side button -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-text-align_right">
                                <button 
                                    class="custom-create-btn slds-m-top_x-small"
                                    onclick={navigateToWyzedAdmin} 
                                    title="Go to Wyzed (Ctrl + Shift + C)">
                                    Go to Trainings
                                </button>
                            </div>

                        </div>

                    </div>

                     <div class="table-container trainingTable adminTable slds-m-around_medium">

        <!-- HEADER -->
        <div class="header-wrapper">
            <table class="staff-table">

                <thead>
                    <tr>
                        <th class="table-th sortable-header"
                            data-field="courseName"
                            onclick={handleSort}>
                            <div class="sort-header-inner">
                                <span class="sort-label">Course Name</span>
                                <span class="sort-arrow"
                                    data-arrow={sortIcons.courseName}></span>
                            </div>
                        </th>

                        <th class="table-th sortable-header"
                            data-field="enrolledDate"
                            onclick={handleSort}>
                            <div class="sort-header-inner">
                                <span class="sort-label">Enrolled Date</span>
                                <span class="sort-arrow"
                                    data-arrow={sortIcons.enrolledDate}></span>
                            </div>
                        </th>

                        <th class="table-th sortable-header"
                            data-field="completedDate"
                            onclick={handleSort}>
                            <div class="sort-header-inner">
                                <span class="sort-label">Completed Date</span>
                                <span class="sort-arrow"
                                    data-arrow={sortIcons.completedDate}></span>
                            </div>
                        </th>

                        <th class="table-th center sortable-header"
                            data-field="status"
                            onclick={handleSort}>
                            <div class="sort-header-inner">
                                <span class="sort-label">Status</span>
                                <span class="sort-arrow"
                                    data-arrow={sortIcons.status}></span>
                            </div>
                        </th>

                        <th class="table-th center sortable-header"
                            data-field="isPass"
                            onclick={handleSort}>
                            <div class="sort-header-inner">
                                <span class="sort-label">Pass/Fail</span>
                                <span class="sort-arrow"
                                    data-arrow={sortIcons.isPass}></span>
                            </div>
                        </th>

                        <th class="table-th center sortable-header"
                            data-field="score"
                            onclick={handleSort}>
                            <div class="sort-header-inner">
                                <span class="sort-label">Score (%)</span>
                                <span class="sort-arrow"
                                    data-arrow={sortIcons.score}></span>
                            </div>
                        </th>

                        <th class="table-th center sortable-header"
                            data-field="completionPercentage"
                            onclick={handleSort}>
                            <div class="sort-header-inner">
                                <span class="sort-label">Completion (%)</span>
                                <span class="sort-arrow"
                                    data-arrow={sortIcons.completionPercentage}></span>
                            </div>
                        </th>

                        <th class="table-th center sortable-header"
                            title="Total Activities"
                            data-field="totalActivities"
                            onclick={handleSort}>
                            <div class="sort-header-inner">
                                <span class="sort-label">Total Activities</span>
                                <span class="sort-arrow"
                                    data-arrow={sortIcons.totalActivities}></span>
                            </div>
                        </th>

                        <th class="table-th center sortable-header"
                            title="Completed Count"
                            data-field="completedCount"
                            onclick={handleSort}>
                            <div class="sort-header-inner">
                                <span class="sort-label">Completed Count</span>
                                <span class="sort-arrow"
                                    data-arrow={sortIcons.completedCount}></span>
                            </div>
                        </th>
                    </tr>
                </thead>
            </table>
        </div>

        <!-- BODY -->
        <div class="body-scroll custom-scroll yourTableHeight">
            <table class="staff-table">
                <tbody>

                    <template if:false={noRecordsFlag}>
                        <template for:each={myCompletedCourses} for:item="rec">
                            <tr key={rec.id} class="table-row">
                                  
                                <td class="table-td" title={rec.courseName}>{rec.courseName}</td>
                                <td class="table-td">{rec.enrolledDate}</td>
                                <template if:true={rec.completedDate} >
                                    <td class="table-td">{rec.completedDate}</td>
                                </template>
                                 <template if:false={rec.completedDate} >
                                     <td class="table-td center">-</td>
                                </template>
                                
                               
                                <td class="table-td center">{rec.status}</td>
                                <td class="table-td center">
                                    <span if:true={rec.isPass} style="color:green;">Pass</span>
                                    <span if:false={rec.isPass} style="color:red;">Fail</span>
                                </td>
                                <td class="table-td center">{rec.score}%</td>
                                <td class="table-td center">{rec.completionPercentage}%</td>
                                <td class="table-td center">{rec.totalActivities}</td>
                                <td class="table-td center">{rec.completedCount}</td>

                            </tr>
                        </template>
                    </template>

                    <template if:true={noRecordsFlag}>
                        <tr class="no-data-border">
                            <td class="no-data">
                                <p>No records found</p>
                            </td>
                        </tr>
                    </template>

                </tbody>
            </table>
        </div>
    </div>

    <!-- PAGINATION (EXACT STYLE REUSED) -->
    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="width:95%;margin-left:2%">

        <!-- PAGE SIZE -->
        <div class="slds-col">
            <div class="slds-list_inline ">
                <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                <div class="slds-select_container">
                    <select class="slds-select" onchange={handleMyPageSizeChange}>
                        <template for:each={myPageSizeOptions} for:item="opt">
                            <option key={opt} value={opt}>{opt}</option>
                        </template>
                    </select>
                </div>
            </div>
        </div>

        <!-- NAVIGATION -->
        <div class="slds-align_absolute-center" style="height:5rem;">

            <lightning-button disabled={myDisableFirst} label="First" onclick={myFirstPage}></lightning-button>
            <lightning-button disabled={myDisableFirst} label="Previous" onclick={myPreviousPage} class="slds-p-around_x-small"></lightning-button>

            <span class="slds-badge">
                Showing {myPageNumber} of {myTotalPages} Page(s)
            </span>

            <lightning-button disabled={myDisableLast} label="Next" onclick={myNextPage} class="slds-p-around_x-small"></lightning-button>
            <lightning-button disabled={myDisableLast} label="Last" onclick={myLastPage}></lightning-button>

        </div>

        <!-- TOTAL -->
        <div class="slds-clearfix">
            <div class="slds-float_right">
                <span class="slds-badge">
                    Total Records: {myTotalRecords}
                </span>
            </div>
        </div>

    </div>


                </template>
        </template>
       </div>

        


  </template>
  </div>
       
     
      
      <template if:true={showSpinner}>
        <!-- <lightning-spinner alternative-text="Refreshing Data" size="medium"></lightning-spinner> -->

            <div class="overlay-logo"></div>
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
                <p class="progress-text">Loading</br>Please Wait...</p>
            </div>
      </template>

     
  
</template>
