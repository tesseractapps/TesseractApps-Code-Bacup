<template>
    <div class="slds-form-element">

        <!-- LABEL -->
        <template if:true={label}>
            <label class="slds-form-element__label">
                <template if:true={required}>
                    <abbr class="slds-required">*</abbr>
                </template>
                {label}
            </label>
        </template>

        <div class="slds-combobox_container">

            <div class={comboboxClass}
                 role="combobox"
                 aria-expanded={isOpen}
                 aria-haspopup="listbox">

                <!-- INPUT -->
                <div class={triggerClass}
                     onclick={toggleDropdown}>

                    <input
                        type="text"
                        class={inputClass}
                        value={displayValue}
                        placeholder={placeholder}
                        disabled={disabled}
                        readonly
                    />

                    <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                        <lightning-icon icon-name="utility:down" size="x-small"></lightning-icon>
                    </span>
                </div>

                <!-- DROPDOWN -->
                <template if:true={isOpen}>
                    <!-- ✅ NEW — uses dropdown-fixed, JS will set position:fixed on it -->
                    <div class="dropdown-fixed custom-scroll"
                        role="listbox"
                        onclick={stopPropagation}>
                        <!-- SEARCH -->
                        <div class="search-container">
                            <lightning-input
                                type="search"
                                placeholder="Search..."
                                value={searchKey}
                                variant="label-hidden"
                                onclick={stopPropagation}
                                onfocus={stopPropagation}
                                onchange={handleSearch}
                                oninput={handleSearch}
                                onkeydown={handleKeyDown}>
                            </lightning-input>
                        </div>

                        <!-- OPTIONS -->
                        <ul class="slds-listbox slds-listbox_vertical" role="listbox">

                            <template for:each={filteredOptions} for:item="opt" for:index="index">
                                <li key={opt.value}
                                    data-value={opt.value}
                                    data-index={index}
                                    class={opt.className}
                                    onclick={handleOptionClick}>

                                    <div class="slds-media slds-listbox__option slds-listbox__option_plain">

                                        <!-- Render Material Icon only if present -->
                                        <template if:true={opt.icon}>
                                            <span class="material-icons option-icon">
                                                {opt.icon}
                                            </span>
                                        </template>                                        
                                        <span class="slds-media__body">
                                            <span class="slds-truncate" title= {opt.label}>
                                                {opt.label}
                                            </span>
                                        </span>
                                    </div>

                                </li>
                            </template>

                        </ul>

                    </div>
                </template>

            </div>

        </div>
    </div>
</template>
