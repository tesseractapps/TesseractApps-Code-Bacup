<template>
    <div class="menu-container">
      <div class={customizableformsClass} onclick={handleCustomisableForms}>
        Customisable Forms
      </div>
      <div class={incidentClass} onclick={handleIncidentRegister}>
        Incident Register
      </div>
    </div>
  
    <!-- Incident Register Tab -->
    <template if:true={isIncidentRegisterSelected}>
      <div class="incident-wrapper">
        <!-- <c-form-incident
          orgid={orgid}
          clientid={clientId}
          hide-submitted-forms="true">
        </c-form-incident> -->
      </div>
    </template>
  
    <!-- Customisable Forms Tab -->
    <template if:true={isCustomisableFormSelected}>
      <template if:true={shouldRenderFormRender}>
        <div class="form-render-wrapper">
          <c-form-render key={renderKey} orgid={orgid}></c-form-render>
        </div>
      </template>
    </template>
  </template>
