<template>
    <div class="dropdown-container" lwc:ref="dropdownContainer" style={containerStyle}>
        <!-- Dropdown Button -->
        <button 
            class={dropdownButtonClass}
            onclick={toggleDropdown}
            type="button"
        >
            <div class="dropdown-button-content">
                <span class={selectedLabelClass}>
                    {displayLabel}
                </span>
                <lightning-icon 
                    icon-name="utility:chevrondown" 
                    alternative-text="Toggle dropdown"
                    size="x-small"
                    class={chevronClass}>
                </lightning-icon>
            </div>
        </button>

        <!-- Dropdown Menu -->
        <div if:true={isOpen} class="dropdown-menu">
            <div class="dropdown-content">
                <template for:each={flattenedOptions} for:item="option">
                    <div key={option.id} class="option-container">
                        <div 
                            class={option.cssClass}
                            onclick={handleOptionClick}
                            data-option-id={option.id}
                            data-option-value={option.value}
                            data-has-children={option.hasChildren}
                            style={option.style}
                        >
                            <div class="option-content">
                                <!-- Expand/Collapse Button -->
                                <template if:true={option.hasChildren}>
                                    <button 
                                        class="expand-button"
                                        onclick={handleToggleClick}
                                        data-option-id={option.id}
                                    >
                                        <lightning-icon 
                                            icon-name={option.expandIcon}
                                            alternative-text="Toggle expand"
                                            size="xx-small">
                                        </lightning-icon>
                                    </button>
                                </template>
                                
                                <!-- Option Label -->
                                <span class={option.labelClass}>
                                    {option.label}
                                </span>
                                
                                <!-- Selection Indicator -->
                                <template if:true={option.isSelected}>
                                    <div class="selection-indicator"></div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
