                        <div class="goal-header-top">
                            <h2 class="goal-title">

                            </h2>
                            <span class="step-badge">

                <header class="slds-modal__header headercustom  modal-header-custom"> 
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom title-center">
                        {modalTitle}
                    </h2>
                    <button class="slds-button slds-button_icon close-btn" title="Close" onclick={closeGoalModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                </header>  
                <!-- BODY -->  
                <div class="slds-modal__content slds-p-around_medium custom-scroll">
                    <!-- STAGE PATH (INDICATOR ONLY) -->
                    <div class="slds-path slds-m-bottom_medium">
                        <div class="slds-grid slds-path__track">
                            <div class="slds-grid slds-path__scroller-container">
                                <div class="slds-path__scroller">
                                    <div class="slds-path__scroller_inner">
                                        <ul class="slds-path__nav" role="listbox">

                                            <li class={basicsClass} role="presentation">
                                                <span
                                                    class="slds-path__link"
                                                    data-stage="BASICS"
                                                    onclick={handlePathClick}>
                                                    <span class="slds-path__title">Basics</span>
                                                </span>
                                            </li>

                                            <li class={smartClass} role="presentation">
                                                <span
                                                    class="slds-path__link"
                                                    data-stage="SMART"
                                                    onclick={handlePathClick}>
                                                    <span class="slds-path__title">Smart</span>
                                                </span>
                                            </li>

                                            <li class={actionsClass} role="presentation">
                                                <span
                                                    class="slds-path__link"
                                                    data-stage="ACTIONS"
                                                    onclick={handlePathClick}>
                                                    <span class="slds-path__title">Actions</span>
                                                </span>
                                            </li>

                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BASICS STAGE -->
                    <template if:true={isBasicsStage}>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <!-- Participant -->
                        <!-- Participant (Global Add Goal) -->
                        <template if:false={isParticipantPreselected}>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <lightning-combobox
                                    label="Participant"
                                    placeholder="Select Participant"
                                    value={goal.SupportClient_To_Goals__c}
                                    options={participantOptions}
                                    data-field="SupportClient_To_Goals__c"
                                    onchange={handleGoalChange}
                                    required>
                                </lightning-combobox>
                            </div>
                        </template>

                        <!-- Participant (Preselected from card, e.g. Sai) -->
                        <template if:true={isParticipantPreselected}>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <lightning-input
                                    label="Participant"
                                    value={selectedParticipantName}
                                    disabled>
                                </lightning-input>
                            </div>
                        </template>

                            <!-- Goal Title -->
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <lightning-input
                                    label="Goal Title"
                                    value={goal.Name}
                                    data-field="Name"
                                    onchange={handleGoalChange}
                                    required>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-combobox
                                label="Status"
                                placeholder="Select Status"
                                value={goal.Status__c}
                                options={statusOptions}
                                data-field="Status__c"
                                onchange={handleGoalChange}
                                required>
                            </lightning-combobox>
                        </div>
                        <!-- Priority -->
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <lightning-combobox
                                    label="Priority"
                                    placeholder="Select Priority"
                                    value={goal.Priority__c}
                                    options={priorityOptions}
                                    data-field="Priority__c"
                                    onchange={handleGoalChange}
                                    required>
                                </lightning-combobox>
                            </div>
                            <!-- Goal Category -->
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <lightning-combobox
                                    label="Goal Category"
                                    placeholder="Select Category"
                                    value={goal.Goal_Category__c}
                                    options={goalCategoryOptions}
                                    data-field="Goal_Category__c"
                                    onchange={handleGoalChange}
                                    required>
                                </lightning-combobox>
                            </div>
                            <!-- Review Frequency -->
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <lightning-combobox
                                    label="Review Frequency"
                                    placeholder="Select Review Frequency"
                                    value={goal.Review_Frequency__c}
                                    options={reviewFrequencyOptions}
                                    data-field="Review_Frequency__c"
                                    onchange={handleGoalChange}
                                    required>
                                </lightning-combobox>
                            </div>
                        </div>
                    </template>

                    <template if:true={isSmartStage}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-textarea
                                label="Specific - What exactly do you want to achieve?"
                                value={goal.Specific__c}
                                data-field="Specific__c"
                                onchange={handleGoalChange}
                                required>
                            </lightning-textarea>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-textarea
                                label="Measurable - How will we know when you've achieved this?"
                                value={goal.Measurable__c}
                                data-field="Measurable__c"
                                onchange={handleGoalChange}
                                required>
                            </lightning-textarea>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-textarea
                                label="Achievable - What support do you need to make this happen?"
                                value={goal.Achievable__c}
                                data-field="Achievable__c"
                                onchange={handleGoalChange}
                                required>
                            </lightning-textarea>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-textarea
                                label="Relevant - Why is this goal important to you?"
                                value={goal.Relevant__c}
                                data-field="Relevant__c"
                                onchange={handleGoalChange}
                                required>
                            </lightning-textarea>
                        </div>
                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                        <div class="slds-text-heading_small slds-m-bottom_x-small">
                            Time-bound – When do you want to achieve this by?
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <!-- Target Date -->
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    type="date"
                                    label="Target Date"
                                    value={goal.Target_Date__c}
                                    data-field="Target_Date__c"
                                    onchange={handleGoalChange}
                                    min={todayDate}
                                    required>
                                </lightning-input>
                            </div>
                            <!-- Timeline Description -->
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    type="text"
                                    label="Timeline Description"
                                    placeholder="e.g., By end of next month"
                                    value={goal.Timeline_Description__c}
                                    data-field="Timeline_Description__c"
                                    onchange={handleGoalChange}
                                    required>
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                    </div>
                    </template>

                    <template if:true={isActionsStage}>
                        <div class="slds-box slds-theme_default">
                            <!-- Header -->
                            <div class="slds-text-heading_small slds-m-bottom_small">
                                Sub-Goals & Action Steps
                            </div>
                            <!-- Sub-Goals List -->
                            <template for:each={subGoals} for:item="sg" for:index="index">
                                <div key={sg.id} class="slds-box slds-m-bottom_small slds-theme_shade">
                                    <!-- Delete icon -->
                                    <div class="slds-grid slds-grid_align-end">
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            alternative-text="Delete"
                                            title="Delete"
                                            data-index={index}
                                            onclick={handleDeleteSubGoal}>
                                        </lightning-button-icon>
                                    </div>
                                    <!-- Sub-goal title -->
                                    <lightning-input
                                        label="Sub-Goal Title"
                                        value={sg.title}
                                        data-index={index}
                                        data-field="title"
                                        onchange={handleSubGoalChange}>
                                    </lightning-input>

                                    <!-- Action steps -->
                                    <lightning-textarea
                                        label="Action Steps"
                                        value={sg.description}
                                        data-index={index}
                                        data-field="description"
                                        onchange={handleSubGoalChange}>
                                    </lightning-textarea>
                                </div>
                            </template>
                            <!-- Add Sub-Goal -->
                            <div class="slds-align_absolute-center slds-m-top_small">
                                <lightning-button
                                    label="Add Sub-Goal"
                                    icon-name="utility:add"
                                    onclick={handleAddSubGoal}>
                                </lightning-button>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="slds-modal__footer slds-grid slds-grid_align-spread">
                    <!-- LEFT: Back -->
                    <div>
                        
                    </div>
                    <!-- RIGHT: Cancel + Next -->
                    <div>

                        <template if:false={isBasicsStage}>
                            <lightning-button
                                label="Back"
                                onclick={handleBack}
                                class="slds-m-right_small"
                                disabled={isBasicsStage}>
                            </lightning-button>
                        </template>

                        <lightning-button
                            label="Cancel"
                            class="slds-m-right_small"
                            onclick={closeGoalModal}>
                        </lightning-button>
                        <template if:false={isLastStage}>
                            <lightning-button
                                variant="brand"
                                label="Next"
                                onclick={handleNext}>
                            </lightning-button>
                        </template>
                        <template if:true={isLastStage}>
                            <lightning-button
                                variant="brand"
                                label={saveButtonLabel}
                                onclick={saveGoal}>
                            </lightning-button>
                        </template>
                    </div>
                </div>
            </div>
        </section>
        <!-- BACKDROP -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- review goal -->
    <!-- ================= REVIEW GOAL MODAL ================= -->
    <template if:true={showReviewModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container modal-custom">

                <!-- HEADER -->
                <!-- <header class="slds-modal__header headercustom">
                    <div class="goal-header">
                        <div class="goal-header-top">
                            <h2 class="goal-title">
                                {reviewModalTitle}
                            </h2>

                            <span class="step-badge">
                                Remaining: {remainingProgress}%
                            </span>
                        </div>

                        <p class="goal-subtitle">
                            Record progress, evidence, and next steps for this goal
                        </p>
                    </div>
                </header> -->

                <header class="slds-modal__header headercustom  modal-header-custom"> 
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom title-center">
                        {reviewModalTitle}
                    </h2>
                    <button class="slds-button slds-button_icon close-btn" title="Close" onclick={closeReviewModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                </header>                  



                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium custom-scroll">

                    <div class="slds-grid slds-wrap slds-gutters">

                        <!-- Progress Summary -->
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-textarea
                                label="Progress Summary"
                                value={reviewForm.Progress_Summary__c}
                                data-field="Progress_Summary__c"
                                onchange={handleReviewChange}
                                required>
                            </lightning-textarea>
                        </div>

                        <!-- Evidence of Progress -->
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-textarea
                                label="Evidence of Progress"
                                value={reviewForm.Evidence_Of_Progress__c}
                                data-field="Evidence_Of_Progress__c"
                                onchange={handleReviewChange}>
                            </lightning-textarea>
                        </div>

                        <!-- Barriers Identified -->
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-textarea
                                label="Barriers Identified"
                                value={reviewForm.Barriers_Identified__c}
                                data-field="Barriers_Identified__c"
                                onchange={handleReviewChange}>
                            </lightning-textarea>
                        </div>

                        <!-- Enablers -->
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-textarea
                                label="Enablers / What Worked Well"
                                value={reviewForm.Enablers__c}
                                data-field="Enablers__c"
                                onchange={handleReviewChange}>
                            </lightning-textarea>
                        </div>

                        <!-- Next Steps -->
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-textarea
                                label="Next Steps & Recommendations"
                                value={reviewForm.Next_Steps__c}
                                data-field="Next_Steps__c"
                                onchange={handleReviewChange}>
                            </lightning-textarea>
                        </div>

                        <!-- Review Date -->
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <lightning-input
                                type="date"
                                label="Next Review Date"
                                value={reviewForm.Review_Date__c}
                                data-field="Review_Date__c"
                                onchange={handleReviewChange}
                                required>
                            </lightning-input>
                        </div>

                        <!-- Update Progress -->
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Update Progress %"
                            placeholder="Enter progress %"
                            value={reviewForm.Update_Progress__c}
                            data-field="Update_Progress__c"
                            onchange={handleReviewChange}
                            min="1"
                            max="100"
                            step="1"
                            required>
                        </lightning-input>
                        </div>
                        <!-- <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Budget Spent ($)"
                            placeholder="Enter spent amount"
                            value={reviewForm.BudgetSpent__c}
                            data-field="BudgetSpent__c"
                            onchange={handleReviewChange}
                            min="0"
                            step="0.01">
                        </lightning-input>
                    </div> -->
                    </div>
                </div>

                <!-- FOOTER -->
                <!-- <footer class="slds-modal__footer slds-grid slds-grid_align-spread">

                    <lightning-button
                        label="Cancel"
                        onclick={closeReviewModal}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label={reviewSaveLabel}
                        onclick={saveReviewGoal}>
                    </lightning-button>

                </footer> -->
                <div class="slds-modal__footer slds-grid slds-grid_align-spread">
                    <!-- LEFT: Back -->
                    <div>
                        
                    </div>
                    <!-- RIGHT: Cancel + Next -->
                    <div>


                        <lightning-button
                            label="Cancel"
                            class="slds-m-right_small"
                            onclick={closeReviewModal}>
                        </lightning-button>

                            <lightning-button
                                variant="brand"
                                label={reviewSaveLabel}
                                onclick={saveReviewGoal}>
                            </lightning-button>
                    </div>
                </div>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showNotesModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-custom">
                <c-support-coordinator-notes
                    participant-id={selectedParticipantId}
                    goal-id={selectedGoalId}
                    oncancel={handleCloseNotes}
                    onsuccess={handleNoteSaved}>
                </c-support-coordinator-notes>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
</template>
