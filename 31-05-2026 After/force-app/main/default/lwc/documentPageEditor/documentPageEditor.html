<template>

  <template if:true={isTemplateCreate1}>
    <div class="main-container">
      <template if:false={isFileUploaded}>
        <div class="upload-button-container">
          <label for="uploadPdf" class="upload-label">
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              width="48"
              height="48"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
              />
            </svg>
            <p>Click here to upload a PDF, Word file(Multiple Allowed)</p>
          </label>
          <input
            type="file"
            id="uploadPdf"
            accept=".pdf,.docx"
            multiple
            onchange={handleFileUploadOrg}
            class="file-input"
          />
        </div>

        <div class="button-wrapper">
          <lightning-button
            label="Close"
            variant="brand"
            onclick={cancelcreateTemplate}
          ></lightning-button>
        </div>
      </template>
      <template if:true={pageImages.length}>
        <div class="listview custom-scroll">
          <div class="page-grid">
            <template for:each={pageImages} for:item="page" for:index="index">
              <div
                key={page.id}
                class={page.cardClass}
                draggable="true"
                data-id={page.id}
                data-page-number={page.pageNumber} 
                ondragstart={handleDragStart}
                ondragenter={handleDragEnter}
                ondragleave={handleDragLeave}
                ondrop={handleDrop}
                ondragover={allowDrop}
                onclick={handlePageClick}

              >
                <!-- Top-right Action Icons -->
                <div class="card-actions" onclick={stopCardActionClick}>
                  <button class="zoom-btn" onclick={openZoom} data-id={page.id}>
                    <i class="material-icons">zoom_in</i>
                  </button>
                  <button
                    class="delete-btn"
                    onclick={deletePage}
                    data-id={page.id}
                  >
                    <i class="material-icons">delete</i>
                  </button>
                </div>

                <!-- Page Image -->
                <img
                  src={page.dataUrl}
                  alt={page.pageNumber}
                  class="thumbnail"
                />

                <!-- Page Number -->
                <div class="label-wrapper">
                  <p class="page-label">{page.pageNumber}</p>
                </div>
              </div>
            </template>
          </div>
        </div>
        <div class="button-wrapper">
          <lightning-button
            label="Reset"
            variant="brand-outline"
            onclick={handleReset}
            class="slds-m-top_medium"
          ></lightning-button>
          <lightning-button
            label="Proceed"
            variant="brand"
            onclick={handleGenerateNewPdf}
          ></lightning-button>
        </div>
        <template if:true={isFileExpand}>
              <c-document-office-service
                  record-id={recordId}
                  module-path-from-parent="ticket"
                  onuploadcomplete={handleAwsUploadComplete}
                  onfiledeleted={handleFileDeleted}
                  oncancel={handlefilecancel}>
              </c-document-office-service>
          </template>
      </template>


  <!-- Editor Modal -->
<template if:true={showEditorModal}>
  <section class="editor-modal" role="dialog" aria-modal="true" aria-labelledby="editor-modal-title">
    <div class="editor-modal__backdrop" onclick={closeEditorModal}></div>

    <div class="editor-modal__container" onclick={stopModalClick}>


       <div class="assign-modal-header">
      <span class="assign-title">Edit Page-{currentEditPage}</span>
      <button class="assign-close-button" onclick={closeEditorModal}>×</button></div>

      <!-- Body -->
      <div class="editor-modal__body">
        <!-- 🔎 Find/Replace row + Regenerate + Refresh -->
        <div class="fr-row fr-row--one-line">
  <!-- Find -->
  <div class="floating-label">
    <span class="label-text-drop">Find</span>
    <lightning-input
      data-ref="find-input"
      type="text"
      variant="label-hidden"
      value={findText}
      onchange={onFindChange}>
    </lightning-input>
  </div>

  <!-- Replace -->
  <div class="floating-label">
    <span class="label-text-drop">Replace with</span>
    <lightning-input
      data-ref="replace-input"
      type="text"
      variant="label-hidden"
      value={replaceText}
      onchange={onReplaceChange}>
    </lightning-input>
  </div>

  <!-- Actions (snip + regenerate) pinned to the right -->
  <div class="actions">
    <!-- Snip Select toggle button -->
    <button
      class={viewToggleButtonClass}
      title={viewToggleTitle}
      aria-pressed={snipMode}
      onclick={snipButtonClick}>
      <i class="material-icons toggle-icon">
        {viewToggleIcon}
      </i>
    </button>

    <lightning-button
      variant="brand-outline"
      label="Regenerate page"
      onclick={regeneratePage}
      title="Apply find/replace and re-render preview">
    </lightning-button>
  </div>
</div>


        <!-- PDF preview (select text with the mouse here) -->
        <div class="pdf-viewer">
          <div class="pdf-pages" data-ref="viewer"></div>
          <!-- <div class="pdf-toolbar">
            <span class="pdf-hint">
              Tip: drag to select text; the selection will populate the “Find” field.
            </span>
          </div> -->
        </div>
        <footer class="editor-modal__footer" style="display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid #e5e7eb;">
  <lightning-button variant="neutral" label="Close" onclick={closeEditorModal}></lightning-button>
  <lightning-button variant="brand" label="Done" title="Replace the clicked page in the grid" onclick={confirmEditorUpdate}></lightning-button>
</footer>

      </div>
    </div>
  </section>
</template>



<template if:true={showInsertDialog}>
  <section class="mini-insert" role="dialog" aria-modal="true" aria-label="Insert text">
    <div class="mini-insert__panel" onclick={stopModalClick}>
      <h3 class="mini-insert__title">Insert text</h3>

    <lightning-textarea
  data-ref="insert-ta"
  name="insertText"
  value={insertText}
  placeholder="Type the text to place into the selected area"
  onchange={handleInsertTextChange}>
</lightning-textarea>


      <div class="mini-insert__actions">
        <lightning-button variant="neutral" label="Cancel" onclick={_cancelInsertDialog}></lightning-button>
        <lightning-button variant="brand"   label="Insert" onclick={_confirmInsertDialog}></lightning-button>
      </div>
    </div>
  </section>
</template>


      <template if:true={isLoading}>
        <div class="overlay-logo"></div>

        <div class="spinner-wrapper">
          <div class="loader-container">

    <template if:true={isZoomOpen}>
      <div class="modal-backdrop" onclick={closeZoom}>
        <div class={zoomModalClass} onclick={stopPropagation}>
          <div class="zoom-header">
            <button class="modal-close-btn" onclick={closeZoom}>×</button>
          </div>
          <button
            class="zoom-nav left"
            onclick={goToPreviousPage}
            title="Previous Page"
          >
            ❮
          </button>
          <div class="zoompic-controls">
            <template if:true={showZoomOut}>
              <button class="zoompic-btn" onclick={zoomOut}>−</button>
            </template>
            <button class="zoompic-btn" onclick={zoomIn}>＋</button>
          </div>

          <!-- Zoomed Image Container with drag -->
          <div class="zoompic-image-wrapper">
            <img
              src={zoomedPage.dataUrl}
              class="zoompic-image"
              style={zoomStyle}
              onmousedown={startDragZoom}
              onmouseup={stopDragZoom}
              onmouseleave={stopDragZoom}
              onmousemove={handleDragZoom}
            />
          </div>

          <button
            class="zoom-nav right"
            onclick={goToNextPage}
            title="Next Page"
          >
            ❯
          </button>
          <span class="zoom-page-label">{zoomedPage.pageNumber}</span>
        </div>
      </div>
    </template>
  </template>

<div class="table-container adminTable templateTable">

    <!-- HEADER -->
    <div class="header-wrapper">
        <table class="staff-table">
            <thead>
                <tr>
                    <th class="table-th" title="Template Name">Template Name</th>
                    <th class="table-th" title="Document Type">Document Type</th>
                    <th class="table-th center" title="Actions">Actions</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- BODY -->
    <div class="body-scroll custom-scroll yourTableHeight">
        <table class="staff-table">
            <tbody>

                <template for:each={templateListPaginated} for:item="template">
                    <tr key={template.id} class="table-row">

                        <!-- Template Name -->
                        <td class="table-td" title={template.name}>
                            {template.name}
                        </td>

                        <!-- Document Type -->
                        <td class="table-td" title={template.documentType}>
                            {template.documentType}
                        </td>

                        <!-- ACTIONS -->
                        <td class="table-td center">

                            <div>
                                <!-- View -->
                                <a href="javascript:void(0)"
                                   title="View"
                                   onclick={handleViewTemplate}
                                   data-id={template.id}>
                                    <i class="material-icons view-icon">visibility</i>
                                </a>

                                <!-- Edit -->
                                <a href="javascript:void(0)"
                                   title="Edit"
                                   onclick={handleEditTemplate}
                                   data-id={template.id}
                                   data-key={template.awsKey}>
                                    <i class="material-icons edit-icon">edit</i>
                                </a>

                                <!-- Delete -->
                                <a href="javascript:void(0)"
                                   title="Delete"
                                   onclick={handleDeleteTemplate}
                                   data-id={template.id}
                                   data-key={template.awsKey}>
                                    <i class="material-icons delete-icon">delete</i>
                                </a>
                            </div>

                        </td>

                    </tr>
                </template>

                <!-- NO DATA -->
                <template if:false={templateListPaginated.length}>
                    <tr>
                        <td class="no-data">
                            <p>No records found</p>
                        </td>
                    </tr>
                </template>

            </tbody>
        </table>
    </div>

  <template if:true={isPopPdfPreviewOpen}>
    <div class="modal-overlay">
      <section class="pdf-preview-modal">
        <div class="modal-header">
          <h2>PDF Preview</h2>
          <lightning-icon
            icon-name="utility:close"
            alternative-text="Close"
            onclick={closePopPdfViewer}
            style="background-color: transparent; border: none; cursor: pointer"
          ></lightning-icon>
        </div>

        <div class="pdf-title">
          <div><strong>Template Name:</strong> {popSelectedTemplateName}</div>
          <div><strong>Document Type:</strong> {popSelectedDocumentType}</div>
        </div>

        <div class="pop-pdf-image-wrapper custom-scroll">
          <template for:each={popPreviewPages} for:item="img">
            <div key={img.pageNumber} class="pop-pdf-page">
              <img
                src={img.dataUrl}
                alt={img.altText}
                style="width: 100%"
                onload={handlePopImageLoad}
                onerror={handlePopImageError}
              />
              <div
                class="slds-text-align_center slds-text-title_caps slds-m-vertical_x-small"
              >
                {img.altText}
              </div>
            </div>
          </template>
        </div>
      </section>
    </div>
  </template>

  <template if:true={isPdfViewerVisible1}>
    <div class="modal-overlay">

          <div><strong>Template Name:</strong> {selectedTemplateName}</div>

        <iframe

    </div>

  <template if:true={isTemplatePickerOpen}>
    <div class="template-modal-overlay">
      <div class="template-modal-temp">
        <div class="template-modal-header">
          <span class="template-modal-title">Select Templates</span>
          <button class="template-modal-close" onclick={closeTemplatePicker}>
            &times;
          </button>
        </div>

        <!-- Body -->
        <div class="template-modal-body-temp custom-scroll">
          <div style="padding: 1% 0% 0% 1%">
            <div class="floating-label">
              <span class="label-text-drop">Search</span>
              <lightning-input
                type="search"
                value={searchKeyword}
                onchange={handleSearchChange}
                placeholder="Search by Name"
                class="slds-m-bottom_small"
                variant="label-hidden"
              ></lightning-input>
            </div>
          </div>
          <div class="template-checkboxes">
            <template for:each={templateListPaginated} for:item="tpl">
              <div key={tpl.id}>
                <lightning-input
                  type="checkbox"
                  label={tpl.name}
                  value={tpl.id}
                  data-url={tpl.AWS_Document__c}
                  onchange={handleTemplateSelect}
                ></lightning-input>
              </div>
            </template>
          </div>
        </div>
        <template if:true={templateListTotalRecords}>
          <div
            class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-top_small"
          >
            <!-- PAGE NAVIGATION -->
            <div class="slds-align_absolute-center" style="height: 5rem">
              <lightning-button
                disabled={disableTemplateFirst}
                icon-name="utility:jump_to_left"
                label="First"
                class="slds-p-horizontal_x-small"
                alternative-text="First page"
                onclick={handleTemplateFirst}
              ></lightning-button>

              <lightning-button
                disabled={disableTemplateFirst}
                icon-name="utility:chevronleft"
                label="Previous"
                alternative-text="Previous"
                onclick={handleTemplatePrevious}
              ></lightning-button>

              &nbsp;
              <span class="slds-badge"
                >Showing {templatePageNumber} of {templateTotalPages}
                Page(s)</span
              >
              &nbsp;

              <lightning-button
                disabled={disableTemplateLast}
                icon-name="utility:chevronright"
                label="Next"
                alternative-text="Next"
                onclick={handleTemplateNext}
                class="slds-p-horizontal_x-small"
                icon-position="right"
              ></lightning-button>

              <lightning-button
                disabled={disableTemplateLast}
                icon-name="utility:jump_to_right"
                label="Last"
                alternative-text="Last page"
                onclick={handleTemplateLast}
                icon-position="right"
              ></lightning-button>
            </div>

            <!-- TOTAL RECORDS -->
            <!-- <div class="slds-clearfix">
                <div class="slds-float_right">
                  <span class="slds-badge"
                    >Total Records: {templateListTotalRecords}</span
                  >
                </div>
              </div> -->
          </div>
        </template>

        <div class="popup-options">
          <lightning-button
            label="Load"
            variant="brand"
            onclick={handleLoadSelectedTemplatesTemp}
          ></lightning-button>
        </div>
      </div>
    </div>
  </template>

          <lightning-button
