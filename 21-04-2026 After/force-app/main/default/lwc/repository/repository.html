                    <template for:each={group.repositories} for:item="repo">

                        <template if:true={repo.Repository_Attachments__r}>

                                <div key={att.Id} class="doc-row">

                                    <div class="doc-left">

                                        <template if:false={isExec}>
                                            <span class="file-name" title={att.File_Name__c}>

                                            </span>&nbsp;
                                        </template>
                                        <template if:true={isExec}>
                                            <a href="javascript:void(0);"
                                                data-id={repo.Id}
                                                    data-child={att.Id}
                                                onclick={handleShowRepositoryHistory}
                                                class="repo-link">
                                                {repo.Name}
                                            </a>
                                        </template>
                                            <span class="file-size">
                                                {att.Size__c}
                                            </span>

                                        </div>
                                    
                                        <!-- <div class="doc-meta">
                                            Uploaded by {repo.User_Name__c}

                                        </div> -->

                                            <span class="separator"> • </span>

                                                {repo.Date_Format__c}
                                            </span>
                                            <span class="separator"> • </span>
                                            <span class="doc-comments" title={repo.Comments__c}>
                                                {repo.Comments__c}
                                            </span>
                                        </div>

                                    </div>

                                    <!-- RIGHT (CHILD) -->
                                    <div class="doc-actions inline-attachments">
                                        <div class="attachment-pill">

                                            <span class="file-name" title={repo.Name}>
                                                {repo.Name}
                                            </span>

                                            <template if:true={att.HasReadAccess}>
                                                <span class="material-icons view-icon"
                                                      data-url={att.Awsurl__c}  data-child={att.Id}  data-id={repo.Id}
                                    
                                                    data-key={att.key__c}
                                                      onclick={handleView}>
                                                    visibility
                                                </span>
                                            </template>

                                            <template if:true={att.HasEditAccess}>
                                                <span class="material-icons edit-icon"
                                                      data-id={repo.Id}
                                                    data-child={att.Id} 
                                                    data-key={att.key__c}

                                                </span>
                                            </template>

                                            <template if:true={att.HasDeleteAccess}>
                                                <span class="material-icons delete-icon"
                                                      data-id={att.Id}  data-child={att.Id} 
                                                    data-key={att.key__c}

                                            </template>

                                            <template if:true={isExec}>
                                                <span class="material-icons rule-icon"

                                                    data-child={att.Id} 
                                                      onclick={handleConsent}>
                                                    assignment_turned_in
                                                </span>
                                            </template>

                                        </div>
                                    </div>

                                </div>
                            </template>

                        </template>
                    </template>

                </template>
            </div>
            <!-- </template> -->
        </template>
    </template>

                                placeholder="Search by name, email, or user type"
                                 title="Search by name, email, or user type"
                                onchange={handleSearch2}
                                class="slds-p-left_small slds-p-top_small slds-size_1-of-3" variant="label-hidden">
                            </lightning-input>
                            <div class="table-round-wrapper">
                            <div class="table-container-permission custom-scroll">
                            <table class="slds-table slds-table_cell-buffer" style="table-layout:fixed">
                                <thead>
                                    <tr>
                                        
                                        <th class="slds-cell-wrap th">User Name</th>
                                        <th class="slds-cell-wrap th">User Type</th>
                                        <th class="slds-cell-wrap th">Email ID</th> 
                                        <th class="slds-cell-wrap th" >
                                           <!--  <lightning-input
                                            type="checkbox"
                                            label="View Access"
                                            checked={isAllViewSelected}
                                            onchange={handleSelectAllView} variant="label-hidden">
                                        </lightning-input>View Access -->
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-input
                                                    type="checkbox"
                                                    checked={isAllViewSelected}
                                                    onchange={handleSelectAllView}
                                                    variant="label-hidden">
                                                </lightning-input>
                                                <span class="slds-m-left_x-small">View Access</span>
                                            </div>
                                    </th>
                                        <th class="slds-cell-wrap th">
                                           <!-- <lightning-input
                                            type="checkbox"
                                            label="Consent Required"
                                            checked={isAllConsentSelected}
                                            onchange={handleSelectAllConsent} variant="label-hidden">
                                         </lightning-input>Consent Required -->
                                         <div class="slds-grid slds-grid_vertical-align-center">
                                            <lightning-input
                                                type="checkbox"
                                                checked={isAllConsentSelected}
                                                onchange={handleSelectAllConsent}
                                                variant="label-hidden">
                                            </lightning-input>
                                            <span class="slds-m-left_x-small">Consent Required</span>
                                        </div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={finalUsers} for:item="user">
                                        <tr key={user.Id} class="tr1">
                                           
                                            <td class="slds-cell-wrap description">{user.FirstName} {user.LastName}</td>
                                            <td class="slds-cell-wrap description" title={user.User_Type__c}>{user.User_Type__c}</td>
                                            <td class="slds-cell-wrap description" title={user.Email}>{user.Email}</td> 
                                             <td><lightning-input type="checkbox" data-id={user.Id} data-type="view" checked={user.hasViewPermission} onchange={handleUserPermissionChange}></lightning-input></td>
                                            <td>
                                              <lightning-input
                                                  type="checkbox"
                                                  data-id={user.Id}
                                                  data-type="consent"
                                                  checked={user.consentRequired}
                                                  disabled={user.disableConsent}
                                                  onchange={handleUserPermissionChange}>
                                              </lightning-input>
                                          </td>
                                            
                                        </tr>
                                    </template>
                                </tbody>
                            </table> 
                            </div>
                            </div>
                             <template if:false={noRecordsFlag1}>
                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread  fixed-pagination" style="padding-top: 0.5em;">
                            <!--RECORDS PER PAGE-->
                            <div class="slds-col">
                                    <div class="slds-list_inline slds-p-bottom_xx-small">
                                    <label class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center" for="recordsPerPage">Page Size:</label>
                                    <div class="slds-select_container">
                                        <select class="slds-select"  onchange={handleRecordsPerPage1}>
                                                <template for:each={pageSizeOptions1} for:item="option">
                                                <option key={option} value={option}>{option}</option>
                                                </template>
                                        </select>
                                    </div>
                                    </div>
                            </div>

                            <!--PAGE NAVIGATION-->
                            <div class="slds-align_absolute-center" style="height:5rem">
                                    <lightning-button disabled={bDisableFirst1} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage1}></lightning-button>
                                    <lightning-button disabled={bDisableFirst1} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage1}></lightning-button>
                                    &nbsp;
                                    <span class="slds-badge">Showing {pageNumber1} &nbsp;of&nbsp; {totalPages1} &nbsp;&nbsp;Page(s)</span>
                                    &nbsp;
                                    <lightning-button disabled={bDisableLast1} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage1} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                    <lightning-button disabled={bDisableLast1} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage1} icon-position="right"></lightning-button>
                            </div>
                            <!--TOTAL RECORDS-->
                            <div class="slds-clearfix slds-m-right_xx-large">
                                    <div class="slds-float_right">
                                    <span class="slds-badge"> Total Records: {totalRecords1}</span>
                                    </div>
                            </div>
                            </div>  
                            </template> 
                        </template>          

                        <!-- Permissions Checkboxes -->
                        <div class="permissions">
                        
                            <div style="flex: 1; display: flex; justify-content: flex-start;">
                                <template if:true={isViewEnable}> 
                                    <lightning-input type="checkbox" name="view" label="View" onclick={handlePermissionChange} ></lightning-input>
                                </template>
                            </div> 
                              
                            
                            <div style="flex: 1; display: flex; justify-content:center; gap: 10px; margin-right:32%;">
                                <lightning-button label="Cancel" variant="brand-outline" onclick={hideModalBox} ></lightning-button>
                                <lightning-button label="Submit" variant="brand" onclick={handleSubmitPermissions}  disabled={saveDisabled}></lightning-button>
                            </div>
                        </div>   
                        <!-- Submit and Close Buttons -->
                    </div>     
                </div>
            </div>
      </template>
    
  </div>
  <template if:true={DeleteFlag}>
      <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
          class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
      
          <div class="slds-modal__container modal-container" style="max-width:25%;">
          <header class="slds-modal__header" style="background: #002A52;">
              
              <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
          </header> 
          <div class="slds-modal__content slds-p-around_medium modal-content" >                                
              <div class="slds-m-around_small" style="text-align:center">
                  <div><p style="text-align: center;">Are you sure you want to delete this attachment?</p></div>
                  <div class="button-container slds-m-top_medium">
                      <lightning-button label="No" variant="brand" onclick={handleclose}
                      class="slds-m-around_small"></lightning-button>
                      <lightning-button label="Yes" variant="brand"  onclick={handleDelete} class="slds-m-around_small" ></lightning-button>
                      
                  </div>
              </div>
          </div>
          </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

 <template if:true={showLoadingSpinner}>
      <div class="overlay-logo"></div>
        
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
        
                <!-- Progress text instead of progress bar -->
                <p class="progress-text"></br>Please Wait...</p>
            </div>
  </template>

    <template if:true={showFormHistoryModal}>
        <div class="incident-history-backdrop">
            <div class="incident-history-modal">

            <!-- Header -->
            <div class="incident-history-header">
                <h2 class="slds-text-heading_medium h2custom">
                    Document History
                </h2>
                <button
                class="incident-history-close"
                onclick={closeFormHistory}
                aria-label="Close"
                >
                ×
                </button>
            </div>

            <!-- Timeline -->
            <div class="history-timeline custom-scroll">

                <template for:each={groupedFormHistory} for:item="group">
                <div key={group.date} class="history-date-section">

                    <div class="history-date-label">
                    {group.date}
                    </div>

                    <template for:each={group.entries} for:item="entry">
                    <div key={entry.timestamp} class="history-entry">

                        <!-- Left rail -->
                        <div class="entry-time">
                        <span class="timeline-dot"></span>
                        {entry.time}
                        </div>

                        <!-- Content -->
                        <div class="entry-content">
                        <div class="entry-header">
                            <div class="avatar-circle">
                            {entry.initials}
                            </div>

                            <div class="entry-meta">
                            <span class="entry-user">
                                {entry.user}
                            </span>
                            <span class="entry-action">
                                {entry.action}
                            </span>
                            </div>
                        </div>

                        <lightning-formatted-rich-text
                            value={entry.changes}
                        ></lightning-formatted-rich-text>
                        </div>

                    </div>
                    </template>

                </div>
                </template>

                <template if:false={hasFormHistory}>
                <div class="no-history-message">
                    No history available.
                </div>
                </template>

            </div>
            </div>
        </div>
    </template>

    <!-- RENAME MODAL -->
    <template if:true={isRenameModalOpen}>
        <section role="dialog"
                tabindex="-1"
                aria-modal="true"
                class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header" style="background: #002A52;">
                    <h2 class="slds-text-heading_medium" style="color: white;">
                        Rename Folder
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-input
                        label="Folder Name"
                        value={renameValue}
                        maxlength="50"
                        onchange={handleRenameInputChange}
                        message-when-too-long="Maximum 50 characters allowed">
                    </lightning-input>

                    <template if:true={renameError}>
                        <div class="slds-text-color_error slds-m-top_x-small">
                            {renameError}
                        </div>
                    </template>

                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeRenameModal}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="Save"
                        class="slds-m-left_small"
                        onclick={handleRenameSave}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- DELETE CONFIRMATION MODAL -->
    <template if:true={isDeleteModalOpen}>
        <section role="dialog"
                tabindex="-1"
                aria-modal="true"
                class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header" style="background: #002A52;">
                    <h2 class="slds-text-heading_medium" style="color: white;">
                        Confirm Delete
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    Are you sure you want to delete the folder
                    <strong>{folderToDelete}</strong>?
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeDeleteModal}>
                    </lightning-button>

                    <lightning-button
                        variant="destructive"
                        label="Delete"
                        class="slds-m-left_small"
                        onclick={confirmDeleteFolder}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
 

</template>
