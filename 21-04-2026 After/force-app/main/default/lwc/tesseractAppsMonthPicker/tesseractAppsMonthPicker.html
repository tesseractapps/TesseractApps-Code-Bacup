<template>
    <div class="month-picker-container" onclick={stopPropagation}>

        <!-- DISPLAY -->
        <div class="month-display"
             tabindex="0"
             onclick={toggleDropdown}
             onkeydown={handleKeyDown}>
            <span>{displayValue}</span>
            <lightning-icon icon-name="utility:down" size="x-small"></lightning-icon>
        </div>

        <!-- DROPDOWN -->
        <template if:true={showDropdown}>
            <div class="month-dropdown" onkeydown={handleKeyDown}>

                <!-- HEADER -->
                <div class="year-header">
                    <lightning-button-icon icon-name="utility:chevronleft" onclick={prevYear}></lightning-button-icon>

                    <span class="year-label">{pickerYear}</span>

                    <lightning-button-icon icon-name="utility:chevronright" onclick={nextYear}></lightning-button-icon>
                </div>

                <!-- MONTH GRID -->
                <div class="month-grid">
                    <template for:each={computedMonths} for:item="m">
                        <div key={m.value}
                             class={m.class}
                             data-month={m.value}
                             onclick={handleSelect}>
                            {m.label}
                        </div>
                    </template>
                </div>

                <!-- FOOTER -->
                <div class="footer">
                    <button class="today-btn" onclick={goToToday}>Today</button>
                </div>

            </div>
        </template>

    </div>
</template>
