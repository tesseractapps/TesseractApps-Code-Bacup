<template>
    <template if:true={showICtinvoice}>
        <div class="main-container custom-scroll">
       
            <!-- <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <h3 style="font-weight: bold;font-size:150%; margin: 0; padding: 2.5% 0 0 3%;">ICT Invoice</h3>
            
                <lightning-button class="slds-m-left_small" label="Back" onclick={handlecloseInvoice} variant="brand" style="padding-right: 2.5%;padding-top:2%;"></lightning-button>
            </div> -->
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <span style="font-weight: bold; font-size: 140%; margin-left: 1%; ">
                    ICT Invoice
                </span>
                <lightning-button label="Back" variant="brand" onclick={handlecloseInvoice} style="margin-right:1%; "></lightning-button>
            </div>

            <div class="slds-grid slds-wrap">
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop"><span style="color:red">*</span>Company Name</span>
                        <lightning-combobox variant="label-hidden" name="company" options={companyOptions} value={companyId} disabled onchange={handleChange}>   
                        ></lightning-combobox>
                    </div>
                </div>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop"><span style="color:red">*</span>Entities Name</span>
                        <lightning-combobox  name="entityName"  variant="label-hidden" options={entryNameOptions} value={selectedEntityName}  onchange={handleChange}
                        ></lightning-combobox>
                    </div>
                </div>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop"><span style="color:red">*</span>Invoice Date</span>
                        <lightning-input type="date"  name="InvoiceDate" variant="label-hidden" value={invoiceDate} onchange={handleChange} ></lightning-input>
                    </div>
                </div>
                    
                    <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Full Name</span>
                        <lightning-input name="StaffFullName" type="text" label="Full Name"  value={staffFullname} disabled="true" variant="label-hidden"> </lightning-input>                
                    </div>
                </div>
                    
                <!-- <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Role</span>
                        <lightning-input name="staffRole"
                            type="text" label="Role"  value={staffRole} disabled="true" variant="label-hidden" > </lightning-input>
                    </div>
                </div> -->
                    
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop"><span style="color:red">*</span>Start Date</span>
                        <lightning-input name="StartDate" required="true"
                            type="date" label="Start Date" onchange={handleChange} value={invoiceStartDate} variant="label-hidden"> </lightning-input>
                    </div>
                </div>
                
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop"><span style="color:red">*</span>End Date</span>
                        <lightning-input name="EndDate" required="true" 
                            type="date" label="End Date" value={invoiceEndDate} onchange={handleChange} variant="label-hidden"> </lightning-input>
                    </div>
                </div>
                
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop"><span style="color:red">*</span>Due Date</span>
                        <lightning-input name="dateIssued" 
                            type="date" label="Date Issued" required="true" value={dateIssued} onchange={handleChange} variant="label-hidden"> <!--backend issued date is used as due date in ICT Timesheet Invoice-->
                        </lightning-input>
                    </div>
                </div>
                
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Invoice Rate</span>
                        <lightning-input name="InvoiceRate"  type="number" step=".01"
                            label="Invoice Rate" value={invoiceRate} disabled="true" variant="label-hidden" > </lightning-input>
                    </div>
                </div>

                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Invoice Number</span>
                        <lightning-input type="text" name="InvoiceNo" variant="label-hidden" value={invoiceNo} onchange={handleChange} disabled={disabledInvoiceNo}></lightning-input>
                    </div>
                </div>

                <!--  <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Status</span>
                        <lightning-combobox   name="entityType" variant="label-hidden" options={options} value={selectedGSTValue}   onchange={handleChange}> 
                        ></lightning-combobox>
                    </div>
                </div> -->
                    
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Description</span>
                        <lightning-input name="description"  type="text" 
                            label="Description" value={description} disabled="true" variant="label-hidden"> </lightning-input>
                    </div>
                </div>
                <template if:true={ictApprovedHours}>
                    <div class="slds-size_1-of-4 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop">Approved Hours</span>
                            <lightning-input name="AprovedHours" type="text"
                                label="Approved Hours" value={ictApprovedHours} disabled="true" variant="label-hidden"> </lightning-input>
                        </div>
                    </div>
                </template>   
                <!-- <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label">
                        <span class="label-text-drop">Include Gst</span>
                        <lightning-combobox name="selectOption" label="Include Gst"   value={selectedGSTValue} options={options} onchange={handleChange} variant="label-hidden">                            
                        </lightning-combobox>
                    </div>
                </div> -->
                 <div class="slds-size_1-of-4 slds-p-around_small" style="display: flex; align-items: center; justify-content: left; padding-top:1.3%">
                    <label style="display: flex;  align-items: center;">
                        <span>Tax Inclusive</span>
                        <lightning-input 
                            type="toggle" 
                            name="taxInclusive"
                            onchange={handleChange}
                            checked={taxInclusive}
                            message-toggle-active="" 
                            size="xx-small" 
                            message-toggle-inactive="" >
                        </lightning-input>
                    </label>
                </div>
            </div>
            <div>      <!--style="padding-left:1%; padding-right:1%"-->     
                <table class="slds-table table2" style="table-layout: fixed; width: 98%; margin: 1%; ">
                    <thead>
                        <tr>
                            <th class="slds-cell-wrap th" style="text-align:center">Description</th>
                            <th class="slds-cell-wrap th" style="text-align:center">Account List</th>
                            <th class="slds-cell-wrap th" style="text-align:center">Quantity</th>
                            <th class="slds-cell-wrap th" style="text-align:center">Unit Price</th>
                            <th class="slds-cell-wrap th" style="text-align:center">Tax</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={invoiceRowList} for:item="sales">
                            <tr key={sales.Id}>
                    
                                <td>
                                    <div class="floating-label-text-area">
                                        <span class="label-text-drop1"></span>
                                        <lightning-textarea type="text" variant="label-hidden" name="Description" value={sales.Description__c}
                                            onchange={handleInputChange} data-id={sales.Id} data-field="Description__c"></lightning-textarea>
                                    </div>
                                </td>
                    
                                <td style="text-align:center;width:4.5%">
                                    <!-- <div class="floating-label-new2">
                                        <span class="label-text-drop1"></span>
                                        <div class="dropdown">
                                            <button type="button" onclick={toggleDropdownAccountList} class="dropdown-button"
                                                data-id={sales.Id}>{sales.selectedOptionAL}</button>
                                        </div>
                                    </div> -->
                                    <div class="floating-label-new2">
                                        <span class="label-text-drop1"></span>
                                        <div class="dropdown">
                                        <input type="text"  class="dropdown-input" placeholder="Search Name or Number" value={sales.selectedOptionAL}
                                                data-id={sales.Id} onclick={handleDropdownPosition}
                                                oninput={handleCustomerSearch}/>   <!-- value={customerSearchTerm}    onfocus={handleCustomerFocus} onblur={handleCustomerBlur}-->
                                        </div>
                                    </div>
                                </td>
                    
                                <td>
                                    <div class="floating-label-new1">
                                        <span class="label-text-drop1"></span>
                                        <lightning-input type="number" variant="label-hidden" name="Quantity" value={sales.Quantity__c}
                                        onchange={handleInputChange} data-id={sales.Id} data-field="Quantity__c" step="0.01"></lightning-input>
                                    </div>
                                </td>
                    
                                <td>
                                    <div class="floating-label-new1">
                                        <span class="label-text-drop1"></span>
                                        <lightning-input type="number" step="0.01" variant="label-hidden" name="UnitPrice" value={sales.UnitPrice__c}
                                        onchange={handleInputChange} data-id={sales.Id} data-field="UnitPrice__c"></lightning-input>
                                    </div>
                                </td>
                    
                                <td style="text-align:center;width:4.5%">
                                    <div class="floating-label-new2">
                                        <span class="label-text-drop1"></span>
                                        <div class="dropdown">
                                            <button type="button" onclick={toggleDropdownTax} class="dropdown-button"
                                                data-id={sales.Id}>{sales.selectedOptionTax}</button>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <div  class=" slds-grid slds-wrap slds-p-around_small ">
                <div class="slds-size_1-of-2 slds-theme_default slds-m-bottom_small">
                    <div class="floating-label-long-text-area">
                        <span class="label-text-drop1">Comments</span>
                        <lightning-textarea name="comments" variant="label-hidden" value={comments} onchange={handleChangeComments}  
                        placeholder="Comments..." style="width: 100%;"></lightning-textarea>
                    </div>
                </div>
                <div class="slds-col slds-wrap slds-size_1-of-2 slds-theme_default slds-m-bottom_small slds-text-align_right">
                    <div class="slds-size_1-of-2 slds-p-around_small" style="margin-left: 52%;">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Sub Total</span>
                            <lightning-input type="number"  variant="label-hidden"  name="subTotal"  value={subTotal} onchange={handleChange} step="0.01" disabled ></lightning-input>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2 slds-p-around_small" style="margin-left: 52%;">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Tax Amount</span>
                            <lightning-input type="number"  variant="label-hidden"   name="TaxAmount"  value={taxAmount} step="0.01" disabled></lightning-input>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2 slds-p-around_small" style="margin-left: 52%;">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Total</span>
                            <lightning-input type="number" name="totalAmount" variant="label-hidden"  value={totalAmount} step="0.01" disabled ></lightning-input>
                        </div>
                    </div>
                </div>

            </div>
            <div  style="display: flex; justify-content: flex-end; padding: 1%;">
                <div>
                    <lightning-button label="Generate Invoice" onclick={saveMultipleAccounts} variant="brand"></lightning-button>   <!-- disabled={saveDisabled}-->
                </div>
                <div style=" margin-left:10px" >
                    <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={fetchInvoices}>
                        <svg class="slds-button__icon" aria-hidden="true">
                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                        </svg>
                    </button>
                </div>
            </div>

            <template if:true={invoiceTableFlag}>
                <div style="padding-top: 1%;" >
                    <table class="slds-table slds-table_cell-buffer table2" style="width: 98%; margin: 1%;">
                        <thead>
                            <tr>
                                <th  class="description">Invoice No</th>
                                <th  class="slds-cell-wrap th">Entity Name</th>
                                <th class="description slds-cell-wrap th">Ledger Item</th>
                                <th  class="slds-cell-wrap th">Start Date</th>
                                <th  class="slds-cell-wrap th">End Date</th>
                                <th  class="slds-cell-wrap th">Due Date</th>
                                <th  class="slds-cell-wrap th">GST</th>
                                <th  class="slds-cell-wrap th">Amount</th>
                                <th  class="slds-cell-wrap th">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={invoiceTable} for:item="list">
                                <tr key={list.Id} class="tr1">
                                    <td class="description" title="ICT Timesheet Invoice">{list.Name}</td>
                                    <td class="slds-cell-wrap description">{list.entityName}</td>
                                    <td class="slds-cell-wrap">{list.ledgerItem}</td>
                                    <td class="slds-cell-wrap">{list.startDate}</td>
                                    <td class="slds-cell-wrap">{list.endDate}</td>
                                    <td class="slds-cell-wrap">{list.Issueddate}</td>
                                    <td class="slds-cell-wrap">${list.GST__c}</td>
                                    <td class="slds-cell-wrap">${list.Total_Amount__c}</td>
                                    <td>
                                        
                                        <a href="javascript:void(0)" data-id={list.Id} data-url={list.Url}  
                                            onclick={handleRowAction} name="view_details" title="View"
                                            style="text-decoration: none;">
                                                <i class="material-icons view-icon" data-id={list.Id}>visibility</i>
                                        </a> &nbsp;

                                        <a href="javascript:void(0)" data-id={list.Id} data-url={list.Url}  data-invoicedate={list.invoiceDate} 
                                            onclick={handleRowAction} name="email" title="Send Email"
                                            style="text-decoration: none;">
                                                <i class="material-icons view-icon" data-id={list.Id}>outgoing_mail</i>
                                                  <span class="email-count">{list.emailCount}</span>
                                        </a> &nbsp;

                                        <a href="javascript:void(0)" data-id={list.Id} name="delete" onclick={handleRowAction} title="Delete"  
                                            style="text-decoration: none;">
                                                <i class="material-icons delete-icon">delete</i>
                                        </a>
    
                                    </td>  
                                </tr>
                            </template>
                        </tbody>
                    </table>
                      
                    <!-- <lightning-datatable  key-field="Id" data={invoiceTable} columns={columns} column-width-mode="fixed"  onrowselection={handleSelected}  onrowaction={handleRowAction}  class="custom-width" ></lightning-datatable> -->
                </div>
            </template>
            <div style="display: flex; justify-content: flex-end; padding: 3%;">
                <button class="slds-button slds-button_neutral" aria-label="Cancel and close" onclick={handlecloseInvoice} variant="brand-outline">Cancel</button>
            </div>
      
            <div if:true={showtable} data-id="accountListTableDropdown">
                <div style={toggleDropdownAccount}>
                    <table class="dropdown-table">
                        <thead>
                            <tr>
                                <th>Account Number</th>
                                <th>Ledger Item Name</th>
                                <th>Category</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={FilteredLedgerItems} for:item="item">
                                <tr key={item.id} 
                                    data-accno={item.accNo} 
                                    data-value={item.itemName} 
                                    data-id={item.id} 
                                    onclick={handleSelection}>
                                    <td>{item.accNo}</td>
                                    <td>{item.itemName}</td>
                                    <td>{item.category}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            <div if:true={showtableTax} data-id="taxTableDropdown">
                <div style={taxDropdownStyle}>
                    <table class="dropdown-table">
                        <thead>
                            <tr>
                                <th style="width: 2%;">Code</th>
                                <th style="width: 30%;">Description</th>
                                <th style="width: 2%;">Rate</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={taxCodes} for:item="taxCode">
                                <tr key={taxCode.id} 
                                    data-code={taxCode.code} 
                                    data-description={taxCode.description} 
                                    data-rate={taxCode.rate} 
                                    data-value={taxCode.label}
                                    onclick={handleSelectionTax}>
                                    <td>{taxCode.code}</td>
                                    <td>{taxCode.description}</td>
                                    <td>{taxCode.rate}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            <template if:true={invoiceDeleteFlag}>
                <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                    class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
                
                    <div class="slds-modal__container modal-container" style="max-width:25%;">
                        <header class="slds-modal__header" style="background: #002A52;">
                        
                        <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium modal-content"  >         <!-- style="border-radius:0 0 15px 15px" -->                      
                        <div class="slds-m-around_small" style="text-align:center">
                            <div><p style="text-align: center;">Are you sure you want to delete the invoice ?</p></div>
                            <div class="button-container slds-m-top_medium">
                                <lightning-button label="No" variant="brand" onclick={handledeleteclose}
                                class="slds-m-around_small"></lightning-button>
                                <lightning-button label="Yes" variant="brand" onclick={handledelete} class="slds-m-around_small" ></lightning-button>
                                
                            </div>
                        </div>
                    </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
            <template if:true={emailSentConfirmation}>
           
                <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                    class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
                
                    <div class="slds-modal__container modal-container" style="max-width:25%;">
                        <header class="slds-modal__header" style="background: #002A52;">
                        
                            <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
                        </header>
                    <div class="slds-modal__content slds-p-around_medium modal-content"  >         <!-- style="border-radius:0 0 15px 15px" -->                      
                        <div class="slds-m-around_small" style="text-align:center">
                            <div><p style="text-align: center;">Do you want to email this invoice?</p></div>
                            <div class="button-container slds-m-top_medium">
                                <lightning-button label="No" variant="brand" onclick={handleEmailClose}
                                     class="slds-m-around_small"></lightning-button>
                                <lightning-button label="Yes" variant="brand" onclick={handleYesEmail} class="slds-m-around_small" ></lightning-button>
                            </div>
                        </div>
                    </div>
                    </div>
                </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        </div>
    </template> 

    <template if:true={isModalOpen}>
       <div class="main-container custom-scroll">
        <div class="slds-p-around_medium">
            <lightning-button class="slds-m-left_medium"  label="Back" variant="brand"
            onclick={closeaddPayrollinvoice} style="float:right;margin-bottom:5px;"></lightning-button>

          <iframe src={currentUrl} width="100%" height="1300px" ></iframe>
          </div>
      </div>
    </template>
   
    <template if:true={ictTimesheet}>
        <c-ict-time-sheet></c-ict-time-sheet>
    </template>

    <template if:true={invoiceEmailFlag}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true" 
                class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
                    <div class="slds-modal__container modal-container" style="max-width:25%;">
                        <header class="slds-modal__header" style="background: #002A52;">
                            <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align: center;">Please Confirm</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium" style="text-align: center;">
                            <div class="slds-m-around_small center-container-pop">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>To Address</span>
                                    <lightning-input 
                                        type="text" 
                                        label="To Address"
                                        name="toAddress" 
                                        variant="label-hidden" 
                                        value={toAddress}
                                        onchange={handleEmailOnChange} 
                                        required>
                                    </lightning-input>
                                </div>
                                <br/>
                                <div class="floating-label">
                                    <span class="label-text-drop">Cc Address</span>
                                    <lightning-input 
                                        type="text" 
                                        label="CC Address" 
                                        variant="label-hidden"
                                        name="ccAddress" 
                                        value={ccAddress}
                                        onchange={handleEmailOnChange} 
                                        required>
                                    </lightning-input>
                                </div>
                                 <br/>
                                <div class="floating-label">
                                    <span class="label-text-drop">Email Subject</span>
                                    <lightning-input
                                        name="emailSubject"
                                        label="Email Subject"
                                         variant="label-hidden"
                                        value={emailSubject}
                                        onchange={handleEmailOnChange}
                                        class="slds-m-bottom_small">
                                    </lightning-input>
                                </div>  <br/>
                                <div class="custom-rich-text-container">
                                    <span class="label-text-drop">Email Body</span>
                                    <lightning-input-rich-text
                                        name="emailBody"
                                        value={emailBody}
                                        onchange={handleEmailOnChange}
                                        variant="label-hidden"
                                         class="rich-text-editor"
                                        >                        <!--class="slds-m-top_small"
                                        style="min-height: 250px;"-->
                                    </lightning-input-rich-text>
                                </div>
                            <div class="button-container slds-m-top_medium">
                                <lightning-button label="Cancel" variant="Brand-Outline" onclick={handleCloseModal}
                                class="slds-m-around_small"></lightning-button>
                                <lightning-button label="Send Email" variant="brand" onclick={handleSendEmail}
                                    class="slds-m-around_small"></lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
     <template if:true={showLoadingSpinner}>
      <div class="overlay-logo"></div>
        
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
        
                <!-- Progress text instead of progress bar -->
                <p class="progress-text">Loading...</p>
            </div>
   </template>

</template>
