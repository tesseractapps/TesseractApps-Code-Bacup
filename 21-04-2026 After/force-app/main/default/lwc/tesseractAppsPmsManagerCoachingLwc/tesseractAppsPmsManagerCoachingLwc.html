<template>
    <div class="main-container">
        <template if:true={isHome}>
            <div class="menu-container">
                <div class={coachingTabClass} onclick={handlCoachingClick}>Coaching Sessions</div>
                <div class={managerTabClass} onclick={handlManagerClick}>Created by Manager</div>

                <!-- RIGHT SIDE : Back Button -->
                <div style="margin-left: auto; margin-right: 0.5%;">

                    <lightning-button
                        label="Back"
                        variant="brand"
                        onclick={handleBack}>
                    </lightning-button>

                </div>
            </div>

        </template>

        
        <template if:true={isCoachingTab}>
            <div class="slds-m-left_small tabs">
                <span  class={coachingScheduledClass} data-tab="scheduled" onclick={handleTabClick}>Schedule Coaching Sessions</span>
                <span  class={coachingPendingClass} data-tab="pending" onclick={handleTabClick}>Pending Reviews</span>
            </div>
            <template if:true={isScheduledTab}>
                 <div class="coaching  custom-scroll">
                <template if:true={scheduledRecords}>
                    <template for:each={scheduledRecords} for:item="rec">

                        <div key={rec.Id} class="slds-box slds-m-around_small">

                            <div class="slds-grid slds-wrap slds-m-bottom_small">

                                <div class="slds-col slds-size_3-of-4">

                                    <span class="slds-text-heading_small slds-m-right_small">
                                        {rec.reviewCycleName}
                                    </span>

                                    <span class={rec.createdTypeClass}
                                          title={rec.coachingCreatedtype}>
                                        {rec.coachingCreatedtype}
                                    </span>

                                    <span class="slds-badge action-badge slds-truncate"
                                          title={rec.actionTypeRequired}
                                          style="margin-left:6px;">
                                        {rec.actionTypeRequired}
                                    </span>

                                </div>

                                <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                                    <lightning-button
                                        label="Schedule Coaching Session"
                                        variant="brand"
                                        data-id={rec.Id}
                                        onclick={handleScheduleCoaching}>  <!-- data-name={rec.employeeName}
                                        data-email={rec.email}
                                        data-role={rec.role}
                                        data-manager={rec.manager}
                                        data-hr={rec.hrContact}
                                        data-criteria={rec.criteria}
                                        data-reviewdate={rec.reviewDate}
                                        data-coachingcreatedtype={rec.coachingCreatedtype}
                                        data-profileurl={rec.staffProfileUrl}-->
                                    </lightning-button>
                                </div>

                            </div>

                            <div class="slds-grid slds-wrap slds-gutters">

                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Employee:</strong>
                                    <p class="slds-text-color_weak slds-truncate" title={rec.employeeName}>{rec.employeeName}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Email:</strong>
                                    <p class="slds-text-color_weak slds-truncate" title={rec.email}>{rec.email}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Role:</strong>
                                    <p class="slds-text-color_weak">{rec.role}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Manager:</strong>
                                    <p class="slds-text-color_weak">{rec.manager}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5">
                                    <strong>HR:</strong>
                                    <p class="slds-text-color_weak">{rec.hrContact}</p>
                                </div>

                            </div>

                            <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">

                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Role Criteria:</strong>
                                    <p class="slds-text-color_weak slds-truncate" title={rec.criteria}>{rec.criteria}</p>
                                </div>

                                <!-- <div class="slds-col slds-size_1-of-5">
                                    <strong>Review Completed:</strong>
                                    <p class="slds-text-color_weak">{rec.reviewDate}</p>
                                </div> -->

                            </div>

                        </div>

                    </template>
                </template>

                <template if:false={scheduledRecords}>
                    <p class="slds-text-align_center slds-m-top_medium">
                        No Scheduled Coaching Sessions
                    </p>
                </template>
                </div>
            </template>

            <template if:true={isPendingTab}>
                <div class="coaching  custom-scroll">
                <template if:true={pendingRecords}>
                    <template for:each={pendingRecords} for:item="rec">

                        <div key={rec.Id} class="slds-box slds-m-around_small">

                            <div class="slds-grid slds-wrap slds-m-bottom_small">

                                <div class="slds-col slds-size_3-of-4">

                                    <span class="slds-text-heading_small slds-text-title_bold slds-m-right_small">
                                        {rec.coachingTitle}
                                    </span>

                                    <span class={rec.createdTypeClass}
                                          title={rec.coachingCreatedtype}>
                                        {rec.coachingCreatedtype}
                                    </span>
                                    <!-- <template if:false={rec.isPending}>
                                         <span class="slds-badge action-badge slds-truncate"
                                            title={rec.actionTypeRequired}
                                            style="margin-left:6px;">
                                            {rec.actionTypeRequired}
                                        </span>
                                    </template> -->
                                    
                                    <span  class={rec.statusClass}
                                          title={rec.statusBadge}
                                          style="margin-left:6px;">
                                        {rec.statusBadge}
                                    </span>

                                </div>
                                
                                <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                                    <lightning-button
                                        label={rec.pendingReviewLabel}
                                        variant="brand"
                                        data-id={rec.Id}
                                        onclick={handleScheduleReview}>
                                        <!-- data-name={rec.employeeName}
                                        data-email={rec.email}
                                        data-role={rec.role}
                                        data-manager={rec.manager}
                                        data-hr={rec.hrContact}
                                        data-criteria={rec.criteria}
                                        data-reviewdate={rec.reviewDate}
                                        data-coachingcreatedtype={rec.coachingCreatedtype}
                                        data-profileurl={rec.staffProfileUrl}-->
                                    </lightning-button>
                                </div>
                                <div class="slds-col slds-size_3-of-4">

                                    <span class="slds-text-heading_small slds-m-right_small">
                                        {rec.coachingDescription}
                                    </span>
                                </div>


                            </div>
                            <template if:true={rec.isRc}>
                                <div class="slds-grid slds-wrap slds-gutters">

                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Employee:</strong>
                                        <p class="slds-text-color_weak slds-truncate" title={rec.employeeName}>{rec.employeeName}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Email:</strong>
                                        <p class="slds-text-color_weak slds-truncate" title={rec.email}>{rec.email}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Role:</strong>
                                        <p class="slds-text-color_weak">{rec.role}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Manager:</strong>
                                        <p class="slds-text-color_weak">{rec.manager}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>HR:</strong>
                                        <p class="slds-text-color_weak">{rec.hrContact}</p>
                                    </div>

                                </div>

                                <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">

                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Review Cycle Name:</strong>
                                        <p class="slds-text-color_weak slds-truncate" title={rec.reviewCycleName}>{rec.reviewCycleName}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Role Criteria:</strong>
                                        <p class="slds-text-color_weak slds-truncate" title={rec.criteria}>{rec.criteria}</p>
                                    </div>

                                    <!-- <div class="slds-col slds-size_1-of-5">
                                        <strong>Review Completed:</strong>
                                        <p class="slds-text-color_weak">{rec.reviewDate}</p>
                                    </div> -->
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Coaching Created:</strong>
                                        <p class="slds-text-color_weak">{rec.coachingCreatedDate}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Last Updated on:</strong>
                                        <p class="slds-text-color_weak">{rec.coachingLastUpdated}</p>
                                    </div>

                                </div>
                            </template>
                            <template if:true={rec.isCreatedByHR}>
                                <div class="slds-grid slds-wrap slds-gutters">

                                    <div class="slds-col slds-size_1-of-5">
                                        <template if:true={rec.isIndividual}>
                                            <strong>Employee:</strong>
                                            <p class="slds-text-color_weak slds-truncate" title={rec.employeeName}>{rec.employeeName}</p>
                                        </template>

                                        <template if:true={rec.isGroup}>
                                            <strong>Employees:</strong>
                                            <p>{rec.employeeCount}</p>
                                        </template>

                                        <template if:true={rec.isManagerHr}>
                                            <strong>Managers:</strong>
                                            <p>{rec.managerCount}</p>
                                        </template>

                                        <template if:true={rec.isManagerOnly}>
                                            <strong>Managers:</strong>
                                            <p>{rec.managerCount}</p>
                                        </template>
                                        <template if:true={rec.isHrOnly}>
                                            <strong>HRs:</strong>
                                            <p>{rec.hrCount}</p>
                                        </template>
                                    </div>

                                    <!--  COLUMN 2 (ONLY IF HAS DATA) -->
                                    <template if:true={rec.isIndividual}>
                                        <div class="slds-col slds-size_1-of-5">
                                            <strong>Email:</strong>
                                            <p class="slds-text-color_weak slds-truncate" title={rec.email}>{rec.email}</p>
                                        </div>
                                    </template>

                                    <template if:true={rec.isManagerHr}>
                                        <div class="slds-col slds-size_1-of-5">
                                            <strong>HRs:</strong>
                                            <p>{rec.hrCount}</p>
                                        </div>
                                    </template>

                                    <!-- COLUMN 3 -->
                                    <template if:true={rec.isIndividual}>
                                        <div class="slds-col slds-size_1-of-5">
                                            <strong>Role:</strong>
                                            <p>{rec.role}</p>
                                        </div>
                                    </template>

                                    <!-- COLUMN 4 -->
                                    <template if:true={rec.isIndividual}>
                                        <div class="slds-col slds-size_1-of-5">
                                            <strong>Manager:</strong>
                                            <p>{rec.manager}</p>
                                        </div>
                                    </template>

                                    <!-- COLUMN 5 -->
                                    <template if:true={rec.isIndividual}>
                                        <div class="slds-col slds-size_1-of-5">
                                            <strong>HR:</strong>
                                            <p>{rec.hrContact}</p>
                                        </div>
                                    </template>

                                    <!-- NOW THESE WILL FILL SAME ROW AUTOMATICALLY -->

                                    <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                        <strong>Session Date:</strong>
                                        <p>{rec.meetingDate}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                        <strong>Session Time:</strong>
                                        <p>{rec.meetingTime}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                        <strong>Coaching Created:</strong>
                                        <p>{rec.coachingCreatedDate}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                        <strong>Strengths:</strong>
                                        <p>{rec.strengthsCount}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                        <strong>Development:</strong>
                                        <p>{rec.developmentAreasCount}</p>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                        <strong>Support:</strong>
                                        <p>{rec.supportCount}</p>
                                    </div>

                                </div>
                            </template>
                            
                            <template if:true={rec.isFinalized}>
                                <div class="slds-m-top_small slds-text-color_success">
                                    This coaching session has been finalized and submitted to HR. No further edits are allowed.
                                </div>
                            </template>
                            <template if:true={rec.hrSubmitted}>
                                <div class="slds-m-top_small slds-text-color_success">
                                    This coaching session has been submitted by HR. No further edits are allowed.
                                </div>
                            </template>
                            <!-- <div class="slds-grid slds-wrap slds-m-top_small">

                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Strengths Identified:</strong>
                                    <p class="slds-text-color_weak">{rec.strengthsCount}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5">
                                    <strong>Development Areas:</strong>
                                    <p class="slds-text-color_weak">{rec.developmentAreasCount}</p>
                                </div>

                            </div> -->

                        </div>

                    </template>
                </template>
               

                <template if:false={pendingRecords}>
                    <p class="slds-text-align_center slds-m-top_medium">
                        No Pending Coaching Sessions
                    </p>
                </template>
                 </div>
            </template>

        </template>
        <template if:true={isManagerTab}>
            <div>
                
               
                <div class="slds-grid slds-align-center slds-p-around_small">

                    <div class="slds-col slds-size_3-of-4">
                        <div class="slds-text-heading_medium">
                            <strong>Created by Manager</strong>
                        </div>

                        <div class="slds-text-body_small slds-text-color_weak">
                            All coaching sessions initiated directly by the manager, independent of review cycle
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                        <lightning-button 
                            label="Create Coaching Note"
                            variant="brand"
                            onclick={handleCreateCoachingNote}>
                        </lightning-button>
                    </div>

                </div>
                <!-- <hr /> -->
                 <div>
                    <div class="section-line slds-m-top_x-small slds-m-bottom_x-small"></div>
                </div>

                    <div class="coaching  custom-scroll">
                    <template for:each={managerCreatedRecords} for:item="rec">

                        <div key={rec.Id} class="slds-box slds-m-around_small">

                            <div class="slds-grid slds-wrap slds-m-bottom_small">

                                <div class="slds-col slds-size_3-of-4">

                                    <span class="slds-text-heading_small slds-text-title_bold slds-m-right_small">
                                        {rec.coachingTitle}
                                    </span>

                                    <!-- <span class="slds-badge slds-theme_warning slds-badge_light slds-truncate coaching-badge"
                                          title={rec.coachingCreatedtype}>
                                        {rec.coachingCreatedtype}
                                    </span> -->
                                    <span class={rec.createdTypeClass}
                                          title={rec.coachingCreatedtype}>
                                        {rec.coachingCreatedtype}
                                    </span>

                                    <!-- <span class="slds-badge action-badge slds-truncate"
                                          title={rec.actionTypeRequired}
                                          style="margin-left:6px;">

                                    </span> -->
                                    <span  class={rec.statusClass}
                                          title={rec.statusBadge}
                                          style="margin-left:6px;">
                                        {rec.statusBadge}
                                    </span>

                                </div>
                                 <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                                    <lightning-button
                                        label={rec.managerCreatedReviewLabel}
                                        variant="brand"
                                        data-id={rec.Id}
                                        onclick={handleManagerReview}>
                                       
                                    </lightning-button>
                                </div>
                                <div class="slds-col slds-size_3-of-4">

                                    <span class="slds-text-heading_small slds-m-right_small">
                                        {rec.coachingDescription}
                                    </span>
                                </div>
                            </div>
                           <div class="slds-grid slds-wrap slds-gutters">

                                <!-- COLUMN 1 -->
                                <div class="slds-col slds-size_1-of-5">
                                    <template if:true={rec.isIndividual}>
                                        <strong>Employee:</strong>
                                        <p class="slds-text-color_weak slds-truncate" title={rec.employeeName}>{rec.employeeName}</p>
                                    </template>

                                    <template if:true={rec.isGroup}>
                                        <strong>Employees:</strong>
                                        <p>{rec.employeeCount}</p>
                                    </template>

                                    <template if:true={rec.isManagerHr}>
                                        <strong>Managers:</strong>
                                        <p>{rec.managerCount}</p>
                                    </template>

                                    <template if:true={rec.isManagerOnly}>
                                        <strong>Managers:</strong>
                                        <p>{rec.managerCount}</p>
                                    </template>
                                </div>

                                <!--  COLUMN 2 (ONLY IF HAS DATA) -->
                                <template if:true={rec.isIndividual}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Email:</strong>
                                        <p class="slds-text-color_weak slds-truncate" title={rec.email}>{rec.email}</p>
                                    </div>
                                </template>

                                <template if:true={rec.isManagerHr}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>HRs:</strong>
                                        <p>{rec.hrCount}</p>
                                    </div>
                                </template>

                                <!-- COLUMN 3 -->
                                <template if:true={rec.isIndividual}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Role:</strong>
                                        <p>{rec.role}</p>
                                    </div>
                                </template>

                                <!-- COLUMN 4 -->
                                <template if:true={rec.isIndividual}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>Manager:</strong>

                                    </div>
                                </template>

                                <!-- COLUMN 5 -->
                                <template if:true={rec.isIndividual}>
                                    <div class="slds-col slds-size_1-of-5">
                                        <strong>HR:</strong>

                                    </div>
                                </template>

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                    <strong>Session Date:</strong>
                                    <p>{rec.meetingDate}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">

                                    <p>{rec.meetingTime}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                    <strong>Coaching Created:</strong>
                                    <p>{rec.coachingCreatedDate}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                    <strong>Strengths:</strong>
                                    <p>{rec.strengthsCount}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                    <strong>Development:</strong>
                                    <p>{rec.developmentAreasCount}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-5 slds-m-top_small">
                                    <strong>Support:</strong>
                                    <p>{rec.supportCount}</p>
                                </div>

                            </div>

                           <template if:true={rec.isFinalized}>
                                <div class="slds-m-top_small slds-text-color_success">

                                </div>
                            </template>
                            <template if:true={rec.hrSubmitted}>

        <template if:true={isReviewManagerCoaching}>

        </template>
