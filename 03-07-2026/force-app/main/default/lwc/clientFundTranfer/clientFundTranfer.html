   <template if:true={isNewEntityFlag}>
      <div class="right-align-company custom-scroll" style="width: 100%">
        <c-tesseract-apps-accounting-entities
         is-customer={selectedCardType} 
         editcompanyname={companyname}
          selectedid={companyId}
           oncancel={handleCancel}
            onhidefacilityevent={handleHideFacilityEvent}>
       </c-tesseract-apps-accounting-entities>   
      </div>
  </template>

  <template if:true={xeroEntityNameFlag}>
    <c-tesseract-apps-entity-for-xero selected-name={orgId}   onbacktoxero={handleBackToFundsTracker}></c-tesseract-apps-entity-for-xero>  
    <!-- xero-entity-first-name={entityName} xero-enity-email={entityEmail}  xero-id={entityXeroId} -->
  </template>

  <template if:true={hasFutureServices}> 
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open"> 

    <div class="slds-modal__container modal-custom "> 
      <!-- HEADER --> 
      <header class="slds-modal__header headercustom"> 
        <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">Warning</h2> 
      </header> 
      <!-- BODY CONTENT --> 
      <div class="slds-modal__content slds-p-around_medium custom-scroll slds-text-align_center">
        <div class="slds-m-around_medium">
          This support item cannot be deselected because future shifts are scheduled. To proceed, please delete the future shifts first.
        </div>
        <div class="slds-m-around_medium">
          <lightning-button 
            class="slds-m-left_small" 
            variant="brand" 
            label="Close" 
            onclick={handleCloseWarningModal}>
          </lightning-button> 
        </div>        
      </div> 
      <!-- FOOTER --> 
<!--       <footer class="slds-modal__footer"> 

      </footer>  -->
    </div> 
    </section> 
    <div class="slds-backdrop slds-backdrop_open"></div> 
  </template> 

   <template if:true={showDeleteFundSplitModal}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Please Confirm
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">
            <div>
              <h1>
                Are you sure you want to disable period management
              </h1>
            </div>
            <div class="button-container slds-m-top_medium">
              <lightning-button
                label="No"
                variant="brand"
                onclick={handleCancelDelete}
                class="slds-m-around_small"
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handleConfirmDelete}
                class="slds-m-around_small"
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

</template>
