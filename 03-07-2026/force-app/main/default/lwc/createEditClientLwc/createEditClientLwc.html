    <section role="dialog"
             tabindex="-1"

        <div class="slds-modal__container modal-custom">

            <!-- HEADER -->
            <header class="slds-modal__header headercustom">
                <h2 class="slds-modal__title slds-text-heading_medium h2custom">
                    Attach Files
                </h2>
            </header>

            <!-- BODY -->
            <div class="slds-modal__content slds-p-around_medium custom-scroll">

                <!-- FORM FIELDS -->
                <div class="slds-grid slds-wrap slds-gutters_x-small">

                    <!-- Attachment Name -->
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                        <lightning-input
                            label="Attachment Name"
                            data-id="attachmentName"
                            required="true">
                        </lightning-input>

                    </div>

                    <!-- Type -->
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                        <lightning-combobox
                            label="Type"
                            data-id="attachmentType"
                            options={attachmentTypeOptions}
                            value={attachmentType}
                            onchange={handleAttachmentTypeChange}
                            required="true">
                        </lightning-combobox>

                    </div>

                    <template if:true={showOtherField}>

                        <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                            <lightning-input
                                data-id="otherComments"
                                label="Other(Please Specify)">
                            </lightning-input>

                        </div>

                    </template>

                    <!-- Expiry Date -->
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                        <lightning-input
                            type="date"
                            label="Expiry Date"
                            data-id="expiryDate">
                        </lightning-input>

                    </div>

                    <!-- User -->
                    <!-- <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-col">

                        <lightning-input
                            label="User"
                            value={UserName}
                            data-id="userField">
                        </lightning-input>

                    </div> -->

                    <!-- Comments -->
                    <div class="slds-size_1-of-1 slds-col">

                        <lightning-textarea
                            label="Comments"
                            data-id="commentsField">
                        </lightning-textarea>

                    </div>

                </div>

                <!-- FILE UPLOAD -->
                <div class="slds-box drag-drop slds-m-around_small"
                    ondragover={handleDragOver}
                    ondrop={handleDrop}>

                    <p class="slds-text-align_center">
                        Drag and drop files here<br/>

                        <a href="javascript:void(0);"
                          onclick={triggerAttachInput}>
                            Click to browse
                        </a>
                    </p>

                    <input
                        type="file"
                        class="hidden-file-input contact-upload-input"
                        onchange={handleFileUploadInputChange}
                        multiple />
                </div>

                <!-- AWS COMPONENT -->
                <template if:true={isFileExpand}>
                    <c-document-office-service
                        record-id={recordIdForFileUpload}
                        module-path-from-parent="ticket"
                        onuploadcomplete={handleAwsUploadComplete}
                        onfiledeleted={handleFileDeleted}
                        oncancel={handlefilecancel}>
                    </c-document-office-service>
                </template>

            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCloseContactAttachmentModal}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    label="Save"
                    variant="brand"
                    onclick={handleSaveContactAttachment}>
                </lightning-button>

            </footer>
        </div>
    </section>

    <div class="blur-overlay-popup"></div>
</template>

            <!-- FOOTER -->
            <footer class="slds-modal__footer">

                <lightning-button
                    label="Close"
                    variant="neutral"
                    onclick={closeAttachmentListModal}>
                </lightning-button>

            </footer>

        </div>

    </section>

    <div class="blur-overlay-popup"></div>

</template>

<template if:true={isViewDoc}>
    <div class="slds-grid slds-grid_align-end">
        <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
        onclick={handlereturn} style="margin-right:1%;margin-top: 1%;"></lightning-button>
    </div>
    <div class="main-container-iframe custom-scroll">
      <iframe src={currentUrl} width="100%" height="1300px" ></iframe>
    </div>
</template>
    
</template>
