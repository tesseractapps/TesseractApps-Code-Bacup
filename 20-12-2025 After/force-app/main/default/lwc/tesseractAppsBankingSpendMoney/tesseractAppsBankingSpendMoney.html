        <div class="slds-size_1-of-4 slds-p-around_small" style="margin-top: 1%;">

    <template if:true={isEntityPayment}>
    <!-- <div class="container"> -->
            <div class="slds-grid slds-wrap">
                <template if:true={isEntityFlag}>
                    <div class="slds-size_1-of-4 slds-p-around_small">
                        <div class="floating-label-new">
                            <span class="label-text-drop">Entity Name</span>
                                <lightning-combobox  name="entityName"  variant="label-hidden" options={entityNameOptions} value={entityName} onchange={handleSpenMoneyChange}
                                ></lightning-combobox>
                        </div>
                    </div>
                </template>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Date</span>
                        <lightning-input type="date"  name="date" variant="label-hidden" value={date} onchange={handleSpenMoneyChange} ></lightning-input>
                    </div>
                </div>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-text-area">
                        <span class="label-text-drop">Payee</span>
                        <lightning-textarea type="text"  name="payee" variant="label-hidden" value={payee} onchange={handleSpenMoneyChange} ></lightning-textarea>
                    </div>
                </div>
                <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="floating-label-new">
                        <span class="label-text-drop">Amount</span>
                        <lightning-input type="number" name="amount" variant="label-hidden" 
                             formatter="currency" value={amount} step="0.01" onchange={handleSpenMoneyChange}></lightning-input>
                    </div>
                </div>
            </div>
        <!-- </div> -->
            <!-- <div class="custom-scroll create-edit-table" style="padding-left:1%; padding-right:1%"> -->
     
            <div class="custom-scroll" style="padding-left:1%; padding-right:1%">
                <table  class="slds-table" style="table-layout: fixed;">
                    <thead>
                        <tr>
                            <!-- <th class="slds-cell-wrap th" style="text-align:center; width:25%;">Account No</th>
                            <th class="slds-cell-wrap th" style="text-align:center; width:20%;">Account Name</th> -->
                            <th class="slds-cell-wrap th" style="width:2%;" >
                                <input 
                                    type="checkbox" 
                                    checked={isAllSelected}
                                    onchange={handleSelectAll}
                                />
                            </th>
                            <th class="slds-cell-wrap th" style="text-align:left">Invoice Number</th>
                            <th class="slds-cell-wrap th" style="text-align:left">Invoice Date</th>
                            <th class="slds-cell-wrap th" style="text-align:left">Invoice Amount</th>
                        
                            <!-- <th class="slds-cell-wrap th" style="text-align:left">Invoice Paid</th> -->
                            <th class="slds-cell-wrap th" style="text-align:left">Amount Paid</th> 
                            <!-- <th class="slds-cell-wrap th" style="text-align:left">To Pay</th> -->
                            <th class="slds-cell-wrap th" style="text-align:left">Payment</th>
                            <th class="slds-cell-wrap th" style="text-align:left">Balance</th>
                            <!-- <th class="slds-cell-wrap th" style="text-align:left">Tax</th> -->
                            <th class="slds-cell-wrap th" style="text-align:left; width:5%">Action</th>
                        </tr>
                    </thead>
                <tbody>
                    <template if:true={showInvoiceTable}>
                        <template for:each={invoiceRecordsTable} for:item="invoice">
                            <!-- Parent Invoice Row -->
                            <tr key={invoice.Id} class="tr1">
                                <td class="slds-cell-wrap" >
                                    <input 
                                        type="checkbox" 
                                        data-id={invoice.Id} 
                                        data-name={invoice.Name} 
                                        onchange={handleRadioSelection}
                                        checked={invoice.isSelected}
                                    />

                                    <!-- Expand/Collapse Icon -->
                                    <!-- <template if:true={invoice.hasDetails}>
                                        <a href="javascript:void(0)" style="margin-left: 8px;" onclick={toggleExpand} data-id={invoice.Id}>
                                            <i class="material-icons" style="font-size: 18px;">
                                                <template if:true={invoice.isExpanded}>expand_more</template>
                                                <template if:false={invoice.isExpanded}>chevron_right</template>
                                            </i>
                                        </a>
                                    </template> -->
                                </td>
                                <td class="slds-cell-wrap">{invoice.invoiceNo}</td>
                                <td class="slds-cell-wrap">{invoice.invoiceDate}</td>
                                <td class="slds-cell-wrap">{invoice.invoiceAmount}</td>
                                <td class="slds-cell-wrap">{invoice.invoicePaid}</td>
                                
                            
                                <td class="description slds-cell-wrap" >
                                    <template if:true={invoice.isEditing}>
                                        <div class="qty-edit-container">
                                            <lightning-input type="number" name="toPayValue"
                                                class="qty-value"
                                                value={invoice.toPayValue}
                                                data-id={invoice.Id}
                                                onchange={handlePaidChange}
                                                step="0.01"
                                                formatter="currency"
                                                onkeydown={handleQtyKeyDown}
                                                variant="label-hidden">
                                            </lightning-input>

                                            <a href="javascript:void(0)"
                                                class="save-link"
                                                data-id={invoice.Id}
                                                title="Save"
                                                onclick={saveRow} style="margin-top: -6%;">
                                                <i class="material-icons save-icon">check</i>
                                            </a>
                                        </div>
                                    </template>

                                    <template if:false={invoice.isEditing}>
                                        {invoice.toPay}
                                        <template if:true={invoice.isEditIcon}>
                                            <a href="javascript:void(0)" title="Edit" style="float: right; text-decoration: none;">
                                                <i class="material-icons edit-icon" data-id={invoice.Id}
                                                    onclick={handleEdit}>edit</i>
                                            </a>
                                        </template>
                                    </template>
                                </td>
                                <td class="slds-cell-wrap">{invoice.balance}</td>
                                <td class="slds-cell-wrap">
                                     <template if:true={invoice.isOverPayment}>
                                        <div>     
                                            <a href="javascript:void(0)" data-id={invoice.Id} 
                                                onclick={handleView} name="view_details"  title="Overpayment Info"
                                                        style="text-decoration: none;">
                                                <i class="material-icons view-icon" data-id={invoice.Id}>quick_reference</i>
                                            </a> 
                                        </div>
                                     </template>
                                    
                                </td>
                            </tr>

                        </template>
                    </template>
                   
                </tbody>
            </table>
        </div>
      
            <!-- <div class="slds-size_1-of-2 slds-theme_default slds-m-bottom_small" style=" margin-top: 1%; margin-left: 1%;">
                <template if:true={showAddOverPayment}>
                    
                    <div style="margin-top: 10px;">
                        <lightning-button label="Add OverPayment" onclick={addRow} icon-name="utility:add" variant="brand" disabled={disabledAddRow}></lightning-button>
                    </div> 
                </template>
            
            </div> -->
            <div style="display: flex; flex-direction: column; align-items: flex-end; margin-top: 0%; margin-right: 1%;">
                <div class="slds-size_1-of-4 slds-p-around_small" >
                    <div class="floating-label-new">
                        <span class="label-text-drop">Total Allocated</span>
                        <lightning-input type="number" formatter="currency" variant="label-hidden"  name="totalAllocated"  value={totalAllocated} disabled step="0.01" ></lightning-input>
                    </div>
                </div>
                <!-- <div class="slds-size_1-of-4 slds-p-around_small" >
                    <div class="floating-label-new">

                        <lightning-input type="number"  variant="label-hidden"   name="rowTaxAmount"  value={rowTaxAmount} step="0.01" ></lightning-input>
                    </div>
                </div> -->
                <div class="slds-size_1-of-4 slds-p-around_small" >
                    <div class="floating-label-new">
                        <span class="label-text-drop">Total Paid</span>
                        <lightning-input type="number" formatter="currency" name="totalPaid" variant="label-hidden"  value={totalPaid} disabled step="0.01"  ></lightning-input>   <!--onchange={handleSpenMoneyChange}-->
                    </div>
                </div>
                <div class="slds-size_1-of-4 slds-p-around_small" >
                    <div class="floating-label-new">
                        <span class="label-text-drop">Out of Balance</span>
                        <lightning-input type="number" formatter="currency" name="outOfBalance" variant="label-hidden"  value={outOfBalance} disabled step="0.01"></lightning-input>
                    </div>
                </div>
            
            </div>
        <div style="display: flex;justify-content: flex-end; align-items: center; gap: 10px;margin-right:1.7%; margin-top: 0%; margin-bottom: 1%;">     
        
            <!-- <lightning-button  variant="outline"  label="Cancel" title="Cancel"  onclick={handleClear}> </lightning-button> -->
            <!-- <lightning-button variant="brand" label="Update" title="Update" onclick={handleUpdate} disabled={disabledUpdate}> </lightning-button> -->
            <lightning-button variant="brand" label=Submit title="Submit" onclick={handleSubmit} disabled={disabledSubmit}> </lightning-button>
        </div>
    </template>

         <template if:true={isRemittanceFlag}>
           
            <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
            
                <div class="slds-modal__container modal-container" style="max-width:25%;">
                    <header class="slds-modal__header" style="background: #002A52;">
                    
                    <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium modal-content"  >                          
                    <div class="slds-m-around_small" style="text-align:center">
                        <!-- <div><p style="text-align: center;">would you like to submit the invoice  </p></div> -->
                           <div>
                                <p style="text-align: center;">
                                    You are about to submit the selected invoice(s).  <br>
                                    Please choose how you’d like to proceed:
                                </p>
                            </div>

                       
                            <div class="recurring-section">
                                

                                <div class="radio-wrapper">
                                <lightning-radio-group
                                     name="radioGroup"
                                    options={submitOptions}
                                    value={selectedSubmitOption}
                                    type="radio"
                                    onchange={handleSubmitOptionChange}
                                >
                                </lightning-radio-group>
                                </div>
                            </div>
                            
                        <div class="button-container slds-m-top_medium">
                            <lightning-button label="Cancel" variant="brand" onclick={handleRemittanceClose}
                            class="slds-m-around_small"></lightning-button>
                            <lightning-button label="Confirm" variant="brand" onclick={handleRemittanceSubmit} class="slds-m-around_small" ></lightning-button>
                            
                        </div>
                    </div>
                </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
            
        </template>
         <template if:true={invoiceEmailFlag}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true" 
                class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
                    <div class="slds-modal__container modal-container" style="max-width:25%;">
                        <header class="slds-modal__header" style="background: #002A52;">
                            <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align: center;">Please Confirm</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium" style="text-align: center;">
                            <div class="slds-m-around_small center-container-pop">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>To Address</span>
                                    <lightning-input 
                                        type="text" 
                                        label="To Address"
                                        name="toAddress" 
                                        variant="label-hidden" 
                                        value={toAddress}
                                        onchange={handleEmailOnChange} 
                                        required>
                                    </lightning-input>
                                </div>
                                <br/>
                                <div class="floating-label">
                                    <span class="label-text-drop">CC Address</span>
                                    <lightning-input 
                                        type="text" 
                                        label="CC Address" 
                                        variant="label-hidden"
                                        name="ccAddress" 
                                        value={ccAddress}
                                        onchange={handleEmailOnChange} 
                                        required>
                                    </lightning-input>
                                </div>
                                <br/>
                                <div class="floating-label">
                                    <span class="label-text-drop">Email Subject</span>
                                    <lightning-input
                                        name="emailSubject"
                                        label="Email Subject"
                                         variant="label-hidden"
                                        value={emailSubject}
                                        onchange={handleEmailOnChange}
                                        class="slds-m-bottom_small">
                                    </lightning-input>
                                </div>  <br/>
                                <div class="custom-rich-text-container">
                                    <span class="label-text-drop">Email Body</span>
                                    <lightning-input-rich-text
                                        name="emailBody"
                                        value={emailBody}
                                        onchange={handleEmailOnChange}
                                        variant="label-hidden"
                                         class="rich-text-editor"
                                        >                        <!--class="slds-m-top_small"
                                        style="min-height: 250px;"-->
                                    </lightning-input-rich-text>
                                </div>
                            <div class="button-container slds-m-top_medium">
                                <lightning-button label="Cancel" variant="Brand-Outline" onclick={handleCloseModal}
                                class="slds-m-around_small"></lightning-button>
                                <lightning-button label="Send Email" variant="brand" onclick={handleSendEmail}
                                    class="slds-m-around_small"></lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template> 
</template>
