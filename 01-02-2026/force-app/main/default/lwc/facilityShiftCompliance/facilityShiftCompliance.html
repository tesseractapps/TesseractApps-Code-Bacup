<template>
        <!-- HEADER -->  
    <div class="dashboard-container slds-p-top_small">
        <div class="page-header">
            <div class="title-block">
                <h1>Shift Compliance Rules</h1>
                <p class="sub">Configure work hour limits to ensure staff safety and compliance</p>
            </div>
            <div class="save-container">
                <lightning-button 
                    label="Save Changes"
                    variant="brand"
                    onclick={saveSettingsHandler}>
                </lightning-button>
            </div>
        </div>

            <!-- METRIC TILES ROW -->
            <div class="metrics-grid tiles">

                <!-- Active Rules -->
                <div class="metric-card active">
                    <div class="metric-title">Active Rules</div>
                    <div class="metric-value ">{activeRules}</div>
                </div>

                <!-- Role-Specific Rules -->
                <div class="metric-card role">
                    <div class="metric-title">Role-Specific Rules</div>
                    <div class="metric-value ">{roleSpecificRules}</div>

                </div>
            </div>
        <div class="slds-scrollable_y my-scroll custom-scroll custom-scroll1 ">

<div class="rule-box">
    <div class="rule-header">
        <lightning-input 
            type="toggle" 
            message-toggle-active=""
            message-toggle-inactive=""
            class="small-toggle"
            checked={maxDays.active}
            data-rule="maxDays"
            onchange={toggleRule}>
        </lightning-input>

        <div>
            <div class="rule-title">Maximum Consecutive Days</div>
            <p class="rule-desc">Prevent burnout by limiting consecutive working days</p>
        </div>
    </div>

    <!-- SHOW BELOW BLOCK ONLY WHEN main toggle active -->
    <template if:true={maxDays.active}>

        <div class="sub-row roles-inline">
            <div class="slds-grid">

                    message-toggle-active=""

                    class="small-toggle1"
                    checked={maxDays.applyRoles}
                    data-rule="maxDays"
                    data-field="applyRoles"
                    variant="label-hidden"
                    onchange={toggleField}>
                </lightning-input>
                <label class="apply-roles-label">Apply to specific roles only</label>
            </div>

            <template if:true={maxDays.applyRoles}>
                <div class="roles-container">

                    <div class="dropdown-container" lwc:ref="maxDaysDropdown">
                        
                        <button 
                            type="button"
                            class="dropdown-button1"
                            onclick={toggleMaxDaysDropdown}
                            aria-expanded={isMaxDaysOpen}
                            aria-haspopup="listbox">

                            <span class={maxDaysSelectedClass} title={maxDaysDisplayText}>
                                {maxDaysDisplayText}
                            </span>

                            <lightning-icon 
                                icon-name={chevronIcon}
                                size="x-small"
                                class="chevron-icon">
                            </lightning-icon>
                        </button>

                        <div if:true={isMaxDaysOpen} class="dropdown-menu custom-scroll">
                            <div class="options-list">
                                <template for:each={maxDaysRolesUI} for:item="role">
                                    <div 
                                        key={role.id} 
                                        class="option-item"
                                        data-role-id={role.id}

                                    >
                                        <div class="option-label slds-truncate">{role.label}</div>
                                        <div class="option-controls">
                                            <!-- <span class={role.badgeClass}>{role.statusText}</span> -->
                                            <div class="toggle-switch-container">
                                                <lightning-input
                                                    type="toggle"

                                                    data-role-id={role.id}

                                                    variant="label-hidden"
                                                    message-toggle-active=""

                                                </lightning-input>
                                            </div>
                                        </div>
                                    </div>

            </lightning-input>
        </div>

    </template>
