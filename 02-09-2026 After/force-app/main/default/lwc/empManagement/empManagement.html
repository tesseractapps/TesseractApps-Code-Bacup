<template>
    <lightning-card title="Add Employee">
   <lightning-accordion allow-multiple-sections-open class="accordionClass" active-section-name={activeSections}>
        <lightning-accordion-section name="EmployeeDetails" label="Employee Details" >
            <div class="slds-grid slds-wrap">
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="fname" type="text" label="First Name" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"> <lightning-input name="lname" type="text" label="Last Name" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="contact" type="text" label="Contact details" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="dob" type="text" label="Date of Birth" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="email" type="text" label="Email Address" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small">
                    <lightning-combobox  name="etype" label="Contract Type"   value={selectedEmp} placeholder="Employement Type"  options={empOptions} onchange={handleChange}>

                    </lightning-combobox>
                </div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="tfn" type="text" label="TFN Number " onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="abn" type="text" label="ABN Number " onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="acc" type="text" label="Accreditations" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-right_medium slds-m-left_medium">
                    <lightning-combobox name="facility"  label="Name of the Facility" onchange={handleChange} value={selectedFacility} placeholder="Select Facility"   options={facilityOptions}>

                </lightning-combobox> </div>
            </div>
            <div class="slds-size_1-of-1">     
                <div class="slds-m-right_medium slds-m-left_medium">
                    <lightning-input-address
                        address-label="Address"
                        street-label="Street"
                        city-label="City"
                        country-label="Country"
                        province-label="State/ Province"
                        postal-code-label="Zip/ Postal Code"
                        onchange={addressInputChange}
                        show-address-lookup>
                    </lightning-input-address>  
                </div>
            </div>
            </div>
        </lightning-accordion-section> 
        <lightning-accordion-section name="EmergencyContact" label="Emergency Contact" >
            <div class="slds-grid slds-wrap">
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="efname" type="text" label="First Name" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"> <lightning-input name="elname" type="text" label="Last Name" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="relation" type="text" label="Relationship" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="econtact" type="text" label="Phone Number" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="eemail" type="text" label="Email Address" onchange={handleChange}> </lightning-input></div>
            </div>
           
            </div>
        </lightning-accordion-section> 
        <lightning-accordion-section name="BankDetails" label="Bank Details" >
            <div class="slds-grid slds-wrap">
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="acname" type="text" label="Account Name" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"> <lightning-input name="acnumber" type="text" label="Account#" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"> <lightning-input name="bsb" type="text" label="BSB" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"><lightning-input name="sname" type="text" label="Superannuation Name" onchange={handleChange}> </lightning-input></div>
            </div>
            <div class="slds-size_1-of-2">     
                <div class="slds-m-left_small slds-m-right_small"> <lightning-input name="snumber" type="text" label="Superannuation Number" onchange={handleChange}> </lightning-input></div>
            </div>
            
            </div>
        </lightning-accordion-section> 
        <lightning-accordion-section name="Attachments" label="Attachments" > 
            <lightning-file-upload label="Attach file"
            name="fileUploader"
            accept='.pdf,.png'></lightning-file-upload>
        </lightning-accordion-section>     
    </lightning-accordion> 
</lightning-card>
</template>
