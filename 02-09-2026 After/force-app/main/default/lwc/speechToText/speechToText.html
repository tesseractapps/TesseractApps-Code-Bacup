<template>
    <div class="slds-p-top_medium">
        <template if:true={shouldShowMute}>
            <lightning-icon
                icon-name={iconName}
                alternative-text={altText}
                onclick={toggleListening}
                class="slds-button slds-button_icon mute-icon"
                style="margin-left: 5px"
                size="small"
            >
            </lightning-icon>
        </template>
        <template if:true={showClearIcon}>
            <lightning-icon
                icon-name="utility:clear"
                alternative-text="Clear Text"
                onclick={clearText}
                class="slds-button slds-button_icon clear-icon"
                size="small"
            >
            </lightning-icon>
        </template>
    </div>
</template>
