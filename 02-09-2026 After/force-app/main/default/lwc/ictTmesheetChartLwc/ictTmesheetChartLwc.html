<template>
    <div class="container-box">
        <!-- Top filter row with combobox -->
        <div class="filter-header">
            <div class="range-select-container">
                <lightning-combobox 
                    class="compact-combobox" 
                    label="Range" 
                    variant="label-hidden" 
                    value={selectedRange} 
                    options={rangeOptions} 
                    onchange={handleRangeChange}>
                </lightning-combobox>
            </div>
        </div>

        <!-- Responsive Chart Area -->
        <div class="chart-wrapper">
            <canvas class="barChart"></canvas>
        </div>
    </div>
</template>
