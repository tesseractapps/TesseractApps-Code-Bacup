<template>
    <div class="timeline-container">
        <h3 class="timeline-title">Activity</h3>
        <div class="timeline-items">
            <template for:each={timelineItems} for:item="item">
                <div key={item.index} class="timeline-item">
                    <div class="timeline-badge-wrap">
                        <span class={item.badgeClass}>{item.index}</span>
                        <div class="timeline-line"></div>
                    </div>
                    <div class="timeline-content">
                        <div class="item-header">{item.Activity_Type__c}</div>
                        <div class="item-meta">
                            {item.Activity_DateTime__c}
                            &nbsp;by&nbsp;{item.userName}
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</template>
