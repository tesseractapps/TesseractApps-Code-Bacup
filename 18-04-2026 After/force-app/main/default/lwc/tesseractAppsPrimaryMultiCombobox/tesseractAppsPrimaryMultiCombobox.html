<template>

<div class="slds-form-element slds-form-element_stacked">

    <label if:false={hideLabel} class="slds-form-element__label">
        <abbr if:true={required} class="slds-required">*</abbr>
        {label}
    </label>

    <div class="slds-combobox_container">

        <div class={comboboxClass}
             role="combobox"
             aria-expanded={isOpen}>

            <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                 onclick={toggleDropdown}>

                <input
                    type="text"
                    class="slds-input slds-combobox__input"
                    readonly
                    value={displayValue}
                    placeholder={placeholder}
                />

                <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                    <lightning-icon icon-name="utility:down" size="x-small"></lightning-icon>
                </span>

            </div>

            <template if:true={isOpen}>

                <div class="slds-dropdown slds-dropdown_fluid">

                    <div class="">

                        <!-- 🔍 Search -->
                        <div class="search-container">
                            <lightning-input
                                type="search"
                                variant="label-hidden"
                                placeholder="Search..."
                                value={searchKey}
                                onkeydown={handleKeyDown}
                                onkeypress={handleKeyDown}
                                onchange={handleSearch}>
                            </lightning-input>
                        </div>

                        <!-- Scrollable List -->
                        <div class="dropdown custom-scroll">

                            <ul class="slds-listbox slds-listbox_vertical">

                                <template if:true={filteredOptions.length}>

                                    <template for:each={filteredOptions} for:item="opt">

                                        <!-- <li key={opt.value} class="option-row"> -->
                                        <li key={opt.value}
                                            class={opt.className}
                                            data-index={opt.index}
                                            data-value={opt.value}
                                            onclick={handleOptionClick}>


                                            <input
                                                type="checkbox"
                                                checked={opt.checked}
                                                data-value={opt.value}
                                                onchange={handleCheckbox}
                                                onclick={stopPropagation}
                                            />

                                            <!-- <div class="option-label">

                                                <span class="main-label">
                                                    {opt.label}
                                                </span>

                                                <template if:true={opt.subLabel}>
                                                    <span class="sub-label">
                                                        {opt.subLabel}
                                                    </span>
                                                </template>



                                            </div> -->


                                            <div class="option-label slds-truncate"
                                                title={opt.label}>

                                                <span class="slds-truncate" title={opt.label}>
                                                    {opt.label}
                                                </span>

                                                <template if:true={opt.subLabel}>
                                                    <span class="sub-label slds-truncate"
                                                        title={opt.subLabel}>
                                                        {opt.subLabel}
                                                    </span>
                                                </template>

                                            </div>

                                            <!-- <template if:true={opt.badge}>
                                                <span class="service-badge">
                                                    {opt.badge}
                                                </span>
                                            </template>


                                            <template if:true={opt.isPrimary}>
                                                <span class="primary-badge">
                                                    Primary
                                                </span>
                                            </template>

                                            <template if:false={opt.isPrimary}>
                                                <a if:true={opt.checked}
                                                class="set-primary"
                                                data-value={opt.value}
                                                onclick={setPrimary}>
                                                    Set as Primary
                                                </a>
                                            </template> -->

                                            <div class="badge-container">

                                                <template if:true={opt.badge}>
                                                    <span class="service-badge">
                                                        {opt.badge}
                                                    </span>
                                                </template>

                                                <template if:true={opt.isPrimary}>
                                                    <span class="primary-badge">
                                                        Primary
                                                    </span>
                                                </template>

                                                <template if:false={opt.isPrimary}>
                                                    <span class="primary-placeholder">
                                                        <a if:true={opt.checked}
                                                            class="set-primary"
                                                            data-value={opt.value}
                                                            onclick={setPrimary}>
                                                            Set as Primary
                                                        </a>
                                                    </span>
                                                </template>

                                            </div>                                        
                                        
                                        </li>

                                    </template>

                                </template>

                                <!-- 🚫 No Records -->
                                <template if:false={filteredOptions.length}>
                                    <li class="option-row no-records">
                                        {noRecordsMessage}
                                    </li>
                                </template>

                            </ul>

                        </div>

                    </div>

                    <!-- Apply Button -->
                    <!-- <div class="footer">
                        <lightning-button
                            label="Apply"
                            variant="brand"
                            onclick={handleApply}>
                        </lightning-button>
                    </div> -->

                </div>

            </template>

        </div>

    </div>

</div>

</template>
