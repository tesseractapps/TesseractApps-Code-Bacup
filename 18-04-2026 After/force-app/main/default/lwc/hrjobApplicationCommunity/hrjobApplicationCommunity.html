<template>
    <template if:false={addAppStatus}>
        <lightning-button label="Add Application" name="AddApplication"
                class="slds-float_right slds-m-bottom_medium slds-m-top_medium" slot="actions" onclick={handleAdd}
                variant="brand"></lightning-button>
             </template>
    <template if:true={addAppStatus}>
        <lightning-card title="Create New Job Application">
            <div class="slds-grid slds-wrap">
                <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-left_medium">
                        <lightning-input name="fname" required="true" type="text" label="First Name"
                            onchange={handleChangeApp}>
                        </lightning-input>
                    </div>
                </div>
                <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-left_medium">
                        <lightning-input name="lname" required="true" type="text" label="Last Name"
                            onchange={handleChangeApp}>
                        </lightning-input>
                    </div>
                </div>
                <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-left_medium">
                        <lightning-input name="contact" required="true" type="phone" label="Contact Number"
                            onchange={handleChangeApp}>
                        </lightning-input>
                    </div>

                </div>
                <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-left_medium">
                        <lightning-input name="email" type="email" required="true" label="Email Address"
                            onchange={handleChangeApp}>
                        </lightning-input>
                    </div>

                </div>
                <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-bottom_medium slds-m-left_medium">
                        <lightning-combobox name="jobtitle" required="true" label="Job Title" onchange={handleChangeApp}
                            value={selectedJob} placeholder="Select Job" options={jobOptions}>
                        </lightning-combobox>
                    </div>
                </div>
                <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium  slds-m-left_medium">
                        <lightning-input name="intdate" required="true" type="date" label="Interview Date"
                            onchange={handleChangeApp}> </lightning-input>
                    </div>
                </div>
                <div class="slds-size_1-of-2">
                    <div class="slds-m-right_medium slds-m-bottom_medium slds-m-left_medium">
                        <lightning-combobox name="appstatus" required="true" label="Application Status"
                            onchange={handleChangeApp} value={selectedAppstatus}
                            placeholder="Select Appplication Status" options={appstatusPicklistValues.data.values}>

                        </lightning-combobox>
                    </div>
                </div>
            </div>
            <div class="slds-align_absolute-center slds-m-around_small">
                <lightning-button label="Save" variant="brand" type="submit" onclick={handleSubmitApp}
                    class="slds-m-around_small"></lightning-button>
                <lightning-button label="Cancel" variant="brand" onclick={closeAppstatusModal}
                    class="slds-m-around_small"></lightning-button>
                <lightning-button label="Publish" variant="brand" class="slds-m-around_small"></lightning-button>
            </div>
        </lightning-card>
    </template>
    <div if:false={addAppStatus}>
        <div if:true={isDesktop}> 
            <table
                class="slds-table slds-table_cell-buffer"
                style="table-layout: fixed;">
                <thead>
                    <tr>
                        <th class="slds-cell-wrap">
                            Name
                        </th>
                        <th class="slds-cell-wrap">
                            Application Status
                        </th>
                        <th class="slds-cell-wrap">
                            Contact Number
                        </th>
                        <th class="slds-cell-wrap">
                            Email
                        </th>
                        <th class="slds-cell-wrap">
                            Interview Date
                        </th>
                        <th class="slds-cell-wrap">
                            Job Title
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={data} for:item="acc">
                        <tr key={acc.Id} class="tr1">
                            <td class="slds-cell-wrap">
                                    <a href={acc.Name}  target="_self">  {acc.fullname}</a>
                            </td>
                            <td class="slds-cell-wrap">
                                    {acc.Application_status__c}
                            </td>
                            <td class="slds-cell-wrap">
                                {acc.Contact_Number__c}
                            </td>
                            <td class="slds-cell-wrap">
                                {acc.Email_Address__c}
                            </td>
                            <td class="slds-cell-wrap">
                                {acc.interviewDate}
                            </td>
                            <td class="slds-cell-wrap">
                                    <a href={acc.jobTitile} target="_self">  {acc.Job_Title__c}</a>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</template>
