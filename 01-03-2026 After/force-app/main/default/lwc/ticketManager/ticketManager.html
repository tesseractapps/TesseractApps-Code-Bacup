<template>
<div class="main-container">
    <div class="slds-grid slds-grid_align-spread" style="padding-left: 1%; padding-top: 1%; gap: 1rem;">

    <!-- Left: Filter and Priority Dropdowns -->
    <div class="slds-grid" style="gap: 1rem;">
        <!-- Filter Tickets Dropdown -->
        <div class="slds-size_1-of-1">
            <div class="floating-label">
                <span class="label-text-drop">Filter Tickets</span>
                <lightning-combobox
                    variant="label-hidden"
                    class="filter-combobox"
                    value={selectedFilter}
                    options={filterOptions}
                    onchange={handleFilterChange}>
                </lightning-combobox>
            </div>
        </div>

        <!-- Priority Filter Dropdown -->
        <div class="slds-size_1-of-1">
            <div class="floating-label">
                <span class="label-text-drop">Priority</span>
                <lightning-combobox
                    variant="label-hidden"
                    value={selectedPriority}
                    options={priorityOptions}
                    onchange={handlePriorityFilterChange}>
                </lightning-combobox>
            </div>
        </div>
    </div>

    <!-- Right: Action Buttons -->
    <div class="slds-grid slds-gutters" style="position: relative;padding-right: 2%;">
        <lightning-button 
            label="Create New Ticket" 
            variant="brand" 
            onclick={handleNewTicketClick}
            class="slds-m-right_small">
        </lightning-button>

        <lightning-button 
            variant="brand-outline" 
            onclick={closeTicketPanel}
            label="Close">
        </lightning-button>
    </div>

</div>

            
<div class="content-wrapper">
       
<div class="table-container custom-scroll">
     <table class="slds-table slds-table_cell-buffer" style="table-layout:fixed; width: 98%;">
          <thead>
          <tr>
          <th class="slds-cell-wrap th">Ticket Number</th>
          <template if:true={isTesseractOrg}>
          <th class="slds-cell-wrap th">Raised By </th>
        </template>
          <th class="slds-cell-wrap th">Subject</th>
          <th class="slds-cell-wrap th">Username</th>
          <th class="slds-cell-wrap th">Date of Issue</th>
          <th class="slds-cell-wrap th">Priority</th>
          <th class="slds-cell-wrap th">Assigned to</th>
          <th class="slds-cell-wrap th">Status</th>
          <template if:true={canEditTickets}>
            <th class="slds-cell-wrap th">Action</th>
        </template>
        
          </tr>
          </thead>
          <tbody>
               <template for:each={paginatedTickets} for:item="t">
                   <tr key={t.Id} class="tr1">
                    <td class="slds-cell-wrap">
                         <a href="javascript:void(0);" 
                            class="slds-text-link"
                            data-id={t.Id}
                            onclick={handleTicketClick}>
                            {t.Ticket_Name__c}
                         </a>
                     </td>
                     <template if:true={isTesseractOrg}>
                        <td title={t.fullOrganizationName}>{t.organizationName}</td>
                    </template>
                       <td class="description" title={t.Subject__c}>{t.Subject__c}</td>
                       <td class="slds-cell-wrap">{t.User_Name__c}</td>
                       <td class="slds-cell-wrap">{t.formattedDateOfIssue}</td>
                       <td class="slds-cell-wrap" style={t.priorityStyle}>
    {t.Priority__c}
</td>

                       <td class="slds-cell-wrap">
                         <template if:true={t.Assigned_To__r}>
                             {t.Assigned_To__r.Name}
                         </template>
                         <template if:false={t.Assigned_To__r}>
                             -
                         </template>
                     </td>                     
                       <td class="slds-cell-wrap">{t.Status__c}</td>
                       <template if:true={canEditTickets}>
                        <td class="slds-cell-wrap">
                            <template if:true={t.showEdit}>
                                <!-- <lightning-icon
                                    icon-name="action:edit"
                                    size="xx-small"
                                    title="Edit"
                                    data-id={t.Id}
                                    onclick={openEditPopup}
                                    style="cursor: pointer; color: white; background: #0099DE; border-radius: 50%; padding: 4px;">
                                </lightning-icon> -->
                                <a href="javascript:void(0);"
                                    title="Edit"
                                    data-id={t.Id}
                                    onclick={openEditPopup}
                                    class="edit-icon-link">
                                        <i class="material-icons edit-icon" data-id={t.Id}>edit_document</i>
                                    </a>
                            </template>
                        </td>
                        
                    </template>
                                       
                     
                   </tr>
               </template>
               <template if:true={showNoTicketsMessage}>
                <tr>
                    <td colspan={computedColSpan} style="text-align: center;">No tickets found.</td>
                  </tr>
                  
            </template>
            
           </tbody>
           
     </table>
</div>     
</div>

          <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination" style="padding-top: 0.5em;">
    
               <!-- RECORDS PER PAGE -->
               <div class="slds-col" style="padding-left: 1%;">
                   <div class="slds-list_inline slds-p-bottom_xx-small">
                       <label class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center" for="recordsPerPage">
                           Page Size:
                       </label>
                       <div class="slds-select_container">
                           <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPageTickets}>
                               <template for:each={pageSizeOptions} for:item="option">
                                   <option key={option} value={option}>{option}</option>
                               </template>
                           </select>
                       </div>
                   </div>
               </div>
           
               <!-- PAGE NAVIGATION -->
               <div class="slds-align_absolute-center" style="height:5rem">
                   <lightning-button 
                       disabled={bDisableFirst}
                       icon-name="utility:jump_to_left"
                       label="First"
                       class="slds-p-horizontal_x-small"
                       alternative-text="First Page"
                       onclick={firstPageTickets}>
                   </lightning-button>
           
                   <lightning-button 
                       disabled={bDisableFirst}
                       icon-name="utility:chevronleft"
                       label="Previous"
                       alternative-text="Previous Page"
                       onclick={previousPageTickets}>
                   </lightning-button>
           
                   &nbsp;
                   <span class="slds-badge">
                       Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)
                   </span>
                   &nbsp;
           
                   <lightning-button 
                       disabled={bDisableLast}
                       icon-name="utility:chevronright"
                       label="Next"
                       class="slds-p-horizontal_x-small"
                       alternative-text="Next Page"
                       icon-position="right"
                       onclick={nextPageTickets}>
                   </lightning-button>
           
                   <lightning-button 
                       disabled={bDisableLast}
                       icon-name="utility:jump_to_right"
                       label="Last"
                       alternative-text="Last Page"
                       icon-position="right"
                       onclick={lastPageTickets}>
                   </lightning-button>
               </div>
           
               <!-- TOTAL RECORDS -->
               <div class="slds-clearfix slds-m-right_xx-large">
                   <div class="slds-float_right">
                       <span class="slds-badge">Total Tickets: {totalRecords}</span>
                   </div>
               </div>
           </div>
           
          

</div>


          
    <template if:true={showEditPopup}>
               <div class="overview-modal-backdrop">
                   <div class="overview-modal-tabbed" style="max-width: 800px;">
                       <div class="overview-modal-header-tabbed">
                           <div class="overview-header-title">
                              <h3>Edit Ticket:</h3>
                              <h2>#{selectedTicket.Ticket_Name__c} — {selectedTicket.Subject__c}</h2>
                           </div>
                           <button class="overview-close-btn" onclick={closeEditPopup}>×</button>
                       </div>
           
                       <div class="overview-tab-content">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                                 <div class="floating-label">
                                      <span class="label-text-drop">Assigned to</span>
                           <lightning-combobox
                               name="Assigned_To__c"
                               variant="label-hidden"
                               value={editTicket.Assigned_To__c}
                               options={ticketingMembers}
                               onchange={handleEditInputChange}>
                           </lightning-combobox>
                                 </div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                     <span class="label-text-drop">Status</span>
                           <lightning-combobox
                               name="Status__c"
                               variant="label-hidden"
                               value={editTicket.Status__c}
                               options={statusOptions}
                               onchange={handleEditInputChange}>
                           </lightning-combobox>
                                </div></div>
                                <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                                    <div class="floating-label-textarea-comments">
                                        <span class="label-text-drop">Comments</span>
                                        <lightning-textarea
                                            name="commentText"
                                            variant="label-hidden"
                                            value={editTicket.commentText}
                                            onchange={handleEditInputChange}
                                            maxlength="1000">
                                        </lightning-textarea>
                                    </div>
                                </div>
                       </div>
                            </div>
                       <div class="overview-modal-footer">
                         <lightning-button variant="brand-outline" label="Cancel" onclick={closeEditPopup}></lightning-button>
                           <lightning-button variant="brand" label="Save" onclick={saveTicketEdits} class="slds-m-left_small"></lightning-button>
                          
                       </div>
                   </div>
                   </div>
               
           </template>
     <template if:true={showCreateTicketForm}>
          <div class="blur-overlay"></div>
          <div class="right-align1" style="width:70%;">
               <!-- <p style="font-weight: bold; font-size: 140%; padding:1% 0% 1% 1%">Create New Ticket</p> -->
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 1% 0% 1% 0.5%;">
                <p style="font-weight: bold; font-size: 140%; margin: 0;">Create New Ticket</p>
                <!-- <lightning-button 
                    label="Back" 
                    onclick={resetForm} 
                    variant="brand">
                </lightning-button> -->
            </div>

               <div class="container custom-scroll">
                
           <div class="slds-grid slds-wrap">
               <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Organisation Name</span>
                         <lightning-input 
                         variant="label-hidden"
                         data-field="Organization_Name__c"
                         value={ticket.Organization_Name__c}
                         onchange={handleInputChange}
                         disabled>
                         </lightning-input>
                    </div>
               </div>
               <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Submitted by</span>
                         <lightning-combobox
                              variant="label-hidden"
                              data-field="Submitted_By__c"
                              options={submittedByOptions}
                              value={ticket.Submitted_By__c}
                              onchange={handleInputChange}>
                         </lightning-combobox>
                    </div>
               </div>
               <template if:true={showUserDetails}>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop"><span style="color:red">*</span>User Name</span>
                            <!-- <lightning-input 
                                variant="label-hidden"
                                data-field="User_Name__c"
                                value={ticket.User_Name__c}
                                onchange={handleInputChange}>
                            </lightning-input> -->

                            <lightning-combobox
                                variant="label-hidden"
                                value={selectedUserId}
                                options={orgUsers}
                                onchange={handleUserSelect}>
                            </lightning-combobox>

                        </div>
                    </div>
                </template>
                <template if:true={showUserDetails}>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                        <div class="floating-label">
                            <span class="label-text-drop"><span style="color:red">*</span>Email-ID</span>
                            <lightning-input 
                                variant="label-hidden"
                                type="email"
                                data-field="Email_ID__c"
                                value={ticket.Email_ID__c}
                                onchange={handleInputChange}
                                disabled>
                            </lightning-input>
                        </div>
                    </div>
                </template>
               <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Contact Number</span>
          
     
                         <lightning-input 
                         variant="label-hidden"
                         type="tel"
                         data-field="Contact_Number__c"
                         value={ticket.Contact_Number__c}
                         onchange={handleInputChange}
                         disabled>
                         </lightning-input>
                    </div>
               </div>
               <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Manager Name</span>
                         <lightning-input 
                         variant="label-hidden"
                         data-field="Manager_Name__c"
                         value={ticket.Manager_Name__c}
                         onchange={handleInputChange}
                         disabled>
                         </lightning-input>
                    </div>
               </div>

               
            
            
               <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Date of Issue</span>
                         <lightning-input 
                         variant="label-hidden"
                         type="date"
                         data-field="Date_Of_Issue__c"
                         value={ticket.Date_Of_Issue__c}
                         onchange={handleInputChange}>
                         </lightning-input>
                    </div>
               </div>
               <div class="slds-col slds-size_1-of-2 slds-p-around_small">
               
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Priority</span>
     
               
                         <lightning-combobox
                              variant="label-hidden"
                              data-field="Priority__c"
                              options={priorityOptions}
                              value={ticket.Priority__c}
                              onchange={handleInputChange}>
                         </lightning-combobox>
                    </div>  
               </div>
     
               
          <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Module</span>  
     
                  <lightning-combobox
                   variant="label-hidden"
                   data-field="Module__c"
                   options={moduleOptions}
                   value={ticket.Module__c}
                   onchange={handleInputChange}>
                  </lightning-combobox>
                  </div>
          </div>
               <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Category</span>   
                
                    <lightning-combobox
                    variant="label-hidden"
                    data-field="Category__c"
                    options={categoryOptions}
                    value={ticket.Category__c}
                    onchange={handleInputChange}>
                    </lightning-combobox>
               </div>
               </div>
               <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Platform</span>   
     
                 
                   <lightning-combobox
                    variant="label-hidden"
                    data-field="Platform__c"
                    options={PlatformOptions}
                    value={ticket.Platform__c}
                    onchange={handleInputChange}>
                    </lightning-combobox>
               </div>
               </div>
               <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Status</span> 
                         <lightning-input 
                         variant="label-hidden"
                         data-field="Status__c"
                         value={ticket.Status__c}
                         onchange={handleInputChange}
                         disabled>
                         </lightning-input>
                   </div>
               </div>

               <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                    <div class="floating-label">
                         <span class="label-text-drop"><span style="color:red">*</span>Subject</span>
                         <lightning-input
                                   variant="label-hidden"
                                   data-field="Subject__c"
                                   value={ticket.Subject__c}
                                   onchange={handleInputChange}
                                   maxlength="225">
                         </lightning-input>
                         </div>
               </div>

               <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                    <div class="floating-label-textarea">
                        <span class="label-text-drop"><span style="color:red">*</span>Description</span>
                        <textarea
                            data-field="Description__c"
                            style="width:100%;resize: none;"
                            onchange={handleInputChange}
                            maxlength="1000"
                        >{ticket.Description__c}</textarea>
                    </div>
                </div>
                <template if:false={isTesseractEmployee}>
                <div class="slds-col slds-size_1-of-2">
                    <!-- <div class="floating-label-button">
                        <span class="label-text-drop"><span style="color:red">*</span>Do you want to raise the ticket Externally?</span> -->
                        <div class="slds-radio-button-group" style="padding-top: 2%;padding-left:7%">
                            <!-- <lightning-radio-group
                                name="submittingTo"
                                variant="label-hidden"
                                options={submittingToOptions}
                                value={ticket.Submitting_To__c}
                                type="button"   
                                onchange={handleInputChange}
                                data-field="Submitting_To__c">
                            </lightning-radio-group> -->
    
                            <lightning-input
            type="checkbox"
            label="Do you want to raise the ticket Externally?"
            checked={isSubmittingToExternal}
            onchange={handleCheckboxChange}
            style="font-weight: bolder;padding-top:3%">
        </lightning-input>
                        </div>
                    <!-- </div> -->
                </div>
            </template>
                <div class="slds-col slds-size_1-of-2 slds-p-left_small slds-p-right_small">
                    <template if:true={isSubmittingToInternal}>
                        <div class="floating-label" style="margin-top: 1rem;">
                            <span class="label-text-drop"><span style="color:red">*</span>Assign to</span>
                            <lightning-combobox
                                variant="label-hidden"
                                data-field="Assigned_To__c"
                                value={ticket.Assigned_To__c}
                                options={ticketingMembers}
                                onchange={handleInputChange}>
                            </lightning-combobox>
                        </div>
                    </template>
                    
                    <template if:true={isSubmittingToExternal}>
                        <p style="color: #003466;padding-top:5%">Submitting externally to <strong>TesseractApps</strong></p>
                    </template>
                </div>
                

              <!--  <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                    <div class="floating-label">
                         <input type="file" id="fileInput" multiple onchange={onFileUpload} accept=".jpg, .jpeg, .png, .gif" name="uploadFile" style="display: none;">
                         <button type="button" onclick={triggerFileInput} class="file-upload-button">
                         &#8684; Upload File
                         </button>
                          
                                 <div class="slds-text-body_small">

                                           <li key={file.name}>{file.name}</li>
                                       </template>
                                   </ul>
                               </template>
                               
                         <template if:true={showSpinner}>
                         <lightning-spinner alternative-text="Uploading the file......" size="medium"></lightning-spinner>

                         </div>
                          
                                 <template if:true={isattachError}>
                         <p style="color:red">File Size Cannot exceed 512MB</p>
                         </template>
                         </div>
               </div> -->
               <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                <div class="slds-box slds-m-top_medium drag-drop" ondragover={handleDragOver} ondrop={handleDrop}>
                    <p class="slds-text-align_center">
                        Drag and drop files here<br />
                        <a href="javascript:void(0);" onclick={triggerFileDialog}>Click to browse</a>
                    </p>

                    <input
                        class="file-input"
                        type="file"
                        multiple
                        accept=".pdf,.png,.jpg,.jpeg"
                        onchange={handleFileUploadInputChange}
                        style="display:none;" />
                </div>
                <template if:true={isEdit}>
                    <div class="slds-text-body_small" style="display: flex;align-items:center;">
                        {fileName}  <!-- <i class="material-icons delete-icon" onclick={handleDeleteClick}>delete</i> -->
                    </div>
                </template>
                <template if:true={isFileExpand}>
                        <c-document-office-service
                            record-id={recordId}
                            module-path-from-parent="ticket"
                            onuploadcomplete={handleAwsUploadComplete}
                            onfiledeleted={handleFileDeleted}
                            oncancel={handlefilecancel}>
                        </c-document-office-service>
                </template>
                </div>

               
               
           </div>
     
          </div>

             <div class="slds-grid slds-grid_align-center">
            <lightning-button 
                label="Submit" 
                variant="brand" 
                onclick={submitTicket}
                class="slds-m-around_small">
            </lightning-button>
        
            <lightning-button 
                label="Cancel" 
                variant="brand-outline" 
                onclick={resetForm}
                class="slds-m-around_small">
            </lightning-button>
        </div>
          </div>
          </template>


<template if:true={showTicketPopup}>
          <div class="overview-modal-backdrop">
               <div class="overview-modal-tabbed1">
                   <!-- Header -->
                   <div class="overview-modal-header-tabbed">
                       <div class="overview-header-title">
                           <h2 title={selectedTicket.Subject__c}>#{selectedTicket.Ticket_Name__c} &mdash; {selectedTicket.Subject__c}</h2>
                           <span class="overview-meta">
                               {selectedTicket.User_Name__c} &bull;
                               {selectedTicket.formattedDateOfIssue}
                           </span>
                       </div>
                       <button class="overview-close-btn" onclick={closeTicketPopup}>×</button>
                   </div>
           
                   <!-- Tabs -->
                   <div class="overview-tabs">
                       <div class={ticketTabClass} onclick={showTicketInfoTab}>Ticket Info</div>
                       <div class={conversationTabClass} onclick={showConversationTab}>Interactions</div>
                       <div class={resolutionTabClass} onclick={showResolutionTab}>Resolution</div>
                       <div class={attachmentTabClass} onclick={showAttachmentTab}>Attachment</div>
                       <div class={historyTabClass} onclick={showHistoryTab}>History</div>
                   </div>
           
                   <!-- Tab Content -->
                   <div class="overview-tab-content1 custom-scroll">
                       <template if:true={showTicketInfo}>
                         <div class="overview-info-grid">
                              <div><strong>Status:</strong> {selectedTicket.Status__c}</div>
                              <div><strong>Submitted By:</strong> {selectedTicket.Submitted_By__c}</div>
                              <div><strong>Email:</strong> {selectedTicket.Email_ID__c}</div>
                              <div><strong>Phone:</strong> {selectedTicket.Contact_Number__c}</div>
                              <div><strong>Manager:</strong> {selectedTicket.Manager_Name__c}</div>
                              <div><strong>Priority:</strong> {selectedTicket.Priority__c}</div>
                              <div><strong>Module:</strong> {selectedTicket.Module__c}</div>
                              <div><strong>Category:</strong> {selectedTicket.Category__c}</div>
                              <div><strong>Platform:</strong> {selectedTicket.Platform__c}</div>
                              <div><strong>Attachment:</strong><!-- <template if:true={uploadedFileDetails}>
                                   <div class="ticket-info-row">
                                       
                                       <div class="slds-media slds-media_center">
                                           <div class="slds-media__figure">
                                               <lightning-icon icon-name={uploadedFileDetails.iconName} alternative-text="File" size="small"></lightning-icon>
                                           </div>
                                           <div class="slds-media__body">
                                               <a href={uploadedFileDetails.url} target="_blank" class="file-link">{uploadedFileDetails.filename}</a>
                                           </div>
                                       </div>
                                   </div>
                               </template> -->
                               <template if:true={uploadedFileDetails}>
                                <template for:each={uploadedFileDetails} for:item="file">
                                    <div key={file.id} class="ticket-info-row">
                                        <div class="slds-media slds-media_center">
                                            <div class="slds-media__figure">
                                                <lightning-icon icon-name={file.iconName} alternative-text="File" size="small"></lightning-icon>
                                            </div>
                                            <div class="slds-media__body">
                                                <a href={file.url} target="_blank" class="file-link">{file.filename}</a>
                                                <!-- <template if:true={file.size}>
                                                    <span class="file-size">({file.size})</span>
                                                </template> -->
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </template>
                               </div>
                          </div>
                          <p style="margin-top:1rem;"><strong>Description:</strong></p>
                          <p>{descriptionfromTicket}</p>
                          
                       </template>
                       <!-- Conversation Container -->
                       <template if:true={showConversation}>
                        <template if:true={noConversations}>
                            <div class="start-conversation-wrapper">
                                <button class="start-conversation-button" onclick={toggleMessageInput}>
                                    💬 Start Conversation
                                </button>
                            </div>
                        </template>
                        <template if:false={noConversations}>
                        <div class="reply-button-container">
                            
                                <template if:false={showMessageInput}>
                                    <button class="reply-icon-button" onclick={toggleMessageInput}>
                                        💬 Reply
                                    </button>
                                </template>
                            
                    
                        </div>
                    
                        <!-- 📩 Message Thread Area -->
                        <div class="conversation-thread">
                    
                            <!-- Rendered messages go here -->
                            <div class="conversation-content" lwc:dom="manual"></div>
                    
                            <!-- ✍️ Input field (only when replying) -->
                            <template if:true={showMessageInput}>
                                <div class="new-message-container">
                                    <lightning-textarea
                                        class="reply-textarea"
                                        value={newMessage}
                                        onchange={handleNewMessageInput}
                                        placeholder="Type your reply...">
                                    </lightning-textarea>
                                    <lightning-button-icon
                                        icon-name="utility:send"
                                        variant="brand"
                                        alternative-text="Send"
                                        onclick={sendMessageToConversation}>
                                    </lightning-button-icon>
                                </div>
                            </template>
                        </div>
                    </template>
                    </template>
                    
                    
 
                     
 <template if:true={showResolution}>
     <div class="resolution-container">
 
         <!-- Show saved resolution -->
         <template if:true={resolutionInput}>
            <template if:false={showResolutionInput}>
          <div class="resolution-block"
               onmouseover={showResolutionActions}
               onmouseout={hideResolutionActions}>
              
              <div class="resolution-header">
                  <div class="avatar-circle">{resolutionInitials}</div>
                  <strong>{resolutionSubmittedBy}</strong>
                  <div class="resolution-timestamp-wrapper">
                    <div class="resolution-date">{resolutionDate}</div>
                    <div class="resolution-time">{resolutionTime}</div>
                </div>                             
                  <span class="resolution-actions" style="display:none">
                      <lightning-icon icon-name="utility:edit" size="xx-small" class="icon-action" onclick={editResolution}></lightning-icon>
                      <lightning-icon icon-name="utility:delete" size="xx-small" class="icon-action" onclick={deleteResolution}></lightning-icon>
                  </span>
              </div>
               
              <div class="resolution-message">{resolutionInput}</div>
          </div>
        </template>
      </template>      
 
         <!-- Resolution input (conditionally shown) -->
         <template if:true={showResolutionInput}>
          <div class="floating-label-textarea-resolution">
               <span class="label-text-drop"><span style="color:red">*</span>Add Resolution</span>
             <lightning-textarea
                 class="resolution-textarea"
                 value={resolutionInput}
                 variant="label-hidden"
                 placeholder="Write your resolution..."
                 onchange={handleResolutionChange}
                 maxlength="1000">
             </lightning-textarea>
          </div>
 
             <div class="save-resolution-wrapper">
                 <lightning-button 
                     label="Save"
                     variant="brand"
                     onclick={saveResolution}>
                 </lightning-button>
                 &nbsp;
                 <lightning-button
                variant="brand-outline"
                label="Cancel"
                onclick={cancelResolutionEdit}
                class="slds-m-left_small">
            </lightning-button>
             </div>
         </template>
 
         <!-- Centered Add Resolution button (only if no resolution and not adding) -->
         <template if:false={resolutionAdded}>
         <template if:false={selectedTicket.Resolution__c}>
             <template if:false={showResolutionInput}>
                 <div class="add-resolution-wrapper">
                     <button class="add-resolution-btn" onclick={showResolutionInputField}>
                         ➕ Add Resolution
                     </button>
                 </div>
             </template>
         </template>
         </template>
 
     </div>
 </template>
 
 
 
 
 
 
 <template if:true={showAttachment}>

    <!-- 🔖 POST ATTACHMENT PREVIEW -->
    <template if:false={uploadcontainer}>
        <div class="attachment-post-title">Post Attachments</div>

        <template for:each={postAttachments} for:item="att">
            <div key={att.id} class="slds-media slds-media_center attachment-post-preview" style="padding:1% 0 1% 0;">
                <div class="slds-media__figure">
                    <lightning-icon icon-name={att.iconName} size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <a href={att.url} target="_blank">{att.filename}</a>
                </div>
                <div class="attachment-post-actions slds-m-left_x-small">
                    <div onclick={handleEditPostAttachment} data-id={att.id} data-key={att.key} style="cursor:pointer;" title="Edit">
                        <lightning-icon 
                            icon-name="action:edit" 
                            size="x-small" 
                            alternative-text="Edit"
                            class="slds-icon-text-default"
                            style="cursor:pointer;color:white;background:#0099DE;">
                        </lightning-icon>
                    </div>
                    &nbsp;
                    <div onclick={confirmDeletePostAttachment}  data-key={att.key}  data-filename={att.filename} data-id={att.id} style="cursor:pointer;" title="Delete">
                        <lightning-icon 
                            icon-name="action:delete" 
                            size="x-small" 
                            alternative-text="Delete"
                            class="slds-icon-text-default">
                        </lightning-icon>
                    </div>
                </div>
            </div>
        </template>
    </template>

    <!-- 📤 UPLOAD CONTAINER -->
    <template if:true={uploadcontainer}>
        <div class="slds-box slds-m-top_medium drag-drop" 
             ondragover={handleDragOver} 
             ondrop={handleDrop}>
            <p class="slds-text-align_center">
                Drag and drop files here<br />
                <a href="javascript:void(0);" onclick={triggerFileDialog}>Click to browse</a>
            </p>

            <input
                class="file-input"
                type="file"
                multiple={allowMultiple}
                accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"
                onchange={handleFileUploadInputChange}
                style="display:none;" />
        </div>

        <template if:true={isEdit}>
            <div class="slds-text-body_small" style="display: flex;align-items:center;">
                {fileName}  
            </div>
        </template>

        <template if:true={isFileExpand}>
            <c-document-office-service
                record-id={recordId}
                module-path-from-parent="ticket"
                onuploadcomplete={handleAwsUploadComplete}
                onfiledeleted={handleFileDeleted}
                 oncancel={handlefilecancel}>
            </c-document-office-service>
        </template>
    </template>

    
   

    <template if:true={showAttachmentDeleteModal}>
         <section class="slds-modal slds-fade-in-open attachment-delete-modal">
             <div class="slds-modal__container">
                 <header class="slds-modal__header" style="background: #003466; color: white;">
                     <h2 class="slds-modal__title">Delete Post Attachment</h2>
                 </header>
                 <div class="slds-modal__content slds-p-around_medium">
                     Are you sure you want to delete this attachment?
                 </div>
                 <footer class="slds-modal__footer">
                     <lightning-button label="Cancel" onclick={cancelDeletePostAttachment}></lightning-button>
                     <lightning-button variant="destructive" label="Delete" onclick={deletePostAttachment}></lightning-button>
                 </footer>
             </div>
         </section>
         <div class="slds-backdrop slds-backdrop_open"></div>
     </template>

</template>
