<div class="table-container attachmentTable">

    <!-- HEADER -->
    <div class="header-wrapper">
        <table class="staff-table">
            <thead>
                <tr>
                    <th class="table-th" title="Name">Name</th>
                    <th class="table-th" title="Type">Type</th>
                    <th class="table-th" title="Size in MB">Size in MB</th>
                    <th class="table-th" title="Comments">Comments</th>
                    <th class="table-th" title="User">User</th>
                    <th class="table-th" title="Date">Date</th>
                    <th class="table-th center" title="Actions">Actions</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- BODY -->
    <div class="body-scroll custom-scroll attachmentTableHeight">
        <table class="staff-table">
            <tbody>

                <template for:each={data} for:item="attachment">
                    <tr key={attachment.Id} class="table-row">

                        <!-- NAME -->
                        <td class="table-td" title={attachment.Name}>
                            {attachment.Name}
                        </td>

                        <!-- TYPE -->
                        <td class="table-td" title={attachment.type}>
                            {attachment.type}
                        </td>

                        <!-- SIZE -->
                        <td class="table-td" title={attachment.fileSize}>
                            {attachment.fileSize}
                        </td>

                        <!-- COMMENTS -->
                        <td class="table-td" title={attachment.comment}>
                            {attachment.comment}
                        </td>

                        <!-- USER -->
                        <td class="table-td" title={attachment.UserName}>
                            {attachment.UserName}
                        </td>

                        <!-- DATE -->
                        <td class="table-td" title={attachment.Date}>
                            {attachment.Date}
                        </td>

                        <!-- ACTION -->
                        <td class="table-td center action-cell">

                            <!-- VIEW -->
                            <a href={attachment.AmazonURL}
                                data-id={attachment.Id}
                                data-url={attachment.AmazonURL}
                                onclick={handleView}
                                title="View Attachment"
                                class="icon-link">
                                <i class="material-icons view-icon">visibility</i>
                            </a>

                            <!-- STAFF ACTIONS -->
                            <template if:true={isStaff}>

                                <!-- EDIT -->
                                <a href="javascript:void(0)"
                                    data-id={attachment.Id}
                                    data-key={attachment.Key__c}
                                    onclick={handleEdit}
                                    title="Edit"
                                    class="icon-link">
                                    <i class="material-icons edit-icon">edit</i>
                                </a>

                                <!-- DELETE -->
                                <a href="javascript:void(0)"
                                    data-id={attachment.Id}
                                    onclick={handleDelete}
                                    title="Delete"
                                    class="icon-link">
                                    <i class="material-icons delete-icon">delete</i>
                                </a>

                                <!-- PERMISSIONS -->
                                <template if:true={showPermissionIcon}>
                                    <a href="javascript:void(0)"
                                        data-id={attachment.Id}
                                        onclick={handleShare}
                                        title="Permissions"
                                        class="icon-link">
                                        <i class="material-icons permissions-icon">passkey</i>
                                    </a>
                                </template>

                            </template>

                        </td>

                    </tr>
                </template>

            </tbody>
        </table>
    </div>

</div>

    <template if:false={noRecordsFlag}>
      <div
        class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
        style="padding-top: 0.5em"
      >
        <!--RECORDS PER PAGE-->
        <div class="slds-col">
          <div class="slds-list_inline slds-p-bottom_xx-small">
            <label
              class="slds-text-color_weak slds-p-horizontal_x-small"
              for="recordsPerPage"
              >Page Size:</label
            >
            <div class="slds-select_container">
              <select
                class="slds-select"
                id="recordsPerPage"
                onchange={handleRecordsPerPage}
              >
                <template for:each={pageSizeOptions} for:item="option">

                </template>
              </select>
            </div>
          </div>
        </div>

        <!--PAGE NAVIGATION-->
        <div class="slds-align_absolute-center" style="height: 5rem">
          <lightning-button
            disabled={bDisableFirst}
            icon-name="utility:jump_to_left"
            label="First"
            class="slds-p-horizontal_x-small"
            alternative-text="first page"
            onclick={firstPage}
          ></lightning-button>
          <lightning-button
            disabled={bDisableFirst}
            icon-name="utility:chevronleft"
            label="Previous"
            alternative-text="Previous"
            onclick={previousPage}
          ></lightning-button>
          &nbsp;
          <span class="slds-badge"
            >Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
            &nbsp;&nbsp;Page(s)</span
          >
          &nbsp;
          <lightning-button
            disabled={bDisableLast}
            icon-name="utility:chevronright"
            label="Next"
            alternative-text="Next"
            onclick={nextPage}
            class="slds-p-horizontal_x-small"
            icon-position="right"
          ></lightning-button>
          <lightning-button
            disabled={bDisableLast}
            icon-name="utility:jump_to_right"
            label="Last"
            alternative-text="last page"
            onclick={lastPage}
            icon-position="right"

        </div>
        <!--TOTAL RECORDS-->
        <div class="slds-clearfix">

        </div>

  <template if:true={isCreateFolderModalOpen}>

              <footer class="slds-modal__footer">

                  <lightning-button
                      label="Cancel"
                      onclick={closeFolderModal}>
                  </lightning-button>

                  <lightning-button
                      variant="brand"
                      label="Create Folder"
                      onclick={createFolder}
                      class="slds-m-left_small">
                  </lightning-button>

              </footer>

          </div>
      </section>

      <!-- BACKDROP -->
      <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  
</template>
