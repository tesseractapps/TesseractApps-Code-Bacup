<template>
  <div class="main-container">
    <!--custom-scroll-->
    <template if:true={isHome}>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
        "
      >
        <p style="font-weight: bold; font-size: 140%">Shift Reports</p>

        <div
          style="display: flex; justify-content: flex-end; padding-bottom: 1%; gap: 10px;"
        >
                <div>
                    <lightning-button
                        label="Export CSV"
                        onclick={handleExport}
                        variant="brand"
                        class="export-csv-btn">
                    </lightning-button>
                </div>
                <div class="slds-col">
                <lightning-button-menu
                    label="Export Detailed"
                    variant="brand"
                    icon-name="utility:down"
                    icon-position="right"
                    menu-alignment="right"
                    class="export-csv-btn"
                    onselect={handleExportDetailedSelect}>

                    <lightning-menu-item
                        value="exportAll"
                        label="Export All Fields">
                    </lightning-menu-item>

                    <lightning-menu-item
                        value="configure"
                        label="Configure Fields">
                    </lightning-menu-item>

                </lightning-button-menu>
            </div>        


          <lightning-button
            label="Back"
            onclick={handleBack}
            variant="brand"
            class="export-csv-btn"
          >
          </lightning-button>
        </div>
      </div>

    
    <div class="slds-box slds-m-bottom_medium">
        <div style="display: flex; justify-content: space-between;">

            <div style="display: flex; align-content: flex-start; gap: 1%; width: 50%;">
                <div >
                    <div class="floating-label-new" style="width:161px">
                        <span class="label-text-drop">Role</span>
                        <lightning-combobox
                            name="role"
                            variant="label-hidden"
                            value={selectedRole}
                            placeholder="Select Role"
                            options={roleOptions}
                            onchange={handleChange}>
                        </lightning-combobox>
                    </div>
                </div>

                <div >
                    <div class="floating-label-new" style="width:161px">
                        <span class="label-text-drop">Employment Type</span>
                        <lightning-combobox
                            name="employmentType"
                            variant="label-hidden"
                            value={selectedEmploymentType}
                            placeholder="Select Type"
                            options={employmentTypeOptions}
                            onchange={handleChange}>
                        </lightning-combobox>
                    </div>
                </div>

                <div >
                    <div class="floating-label-new" style="width:161px">
                        <span class="label-text-drop">Location</span>
                        <lightning-combobox
                            name="location"
                            variant="label-hidden"
                            value={selectedLocation}
                            placeholder="Select Location"
                            options={locationOptions}
                            onchange={handleChange}>
                        </lightning-combobox>
                    </div>
                </div>
                 <div >
                    <div class="floating-label-new" style="width:161px">
                        <span class="label-text-drop">Participant</span>
                        <lightning-combobox
                            name="participant"
                            variant="label-hidden"
                            value={selectedParticipant}
                            placeholder="Select Participant"
                            options={participantOptions}
                            onchange={handleChange}>
                        </lightning-combobox>
                    </div>
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1%; width: 50%;">
                <div>
                    <div class="floating-label-new">
                        <span class="label-text-drop">Start Date</span>
                        <lightning-input
                            type="date"
                            name="startDate"
                            variant="label-hidden"
                            value={selectedStartDate}
                            onchange={handleChange}>
                        </lightning-input>
                    </div>
                </div>

                <div>
                    <div class="floating-label-new">
                        <span class="label-text-drop">End Date</span>
                        <lightning-input
                            type="date"
                            name="endDate"
                            variant="label-hidden"
                            value={selectedEndDate}
                            onchange={handleChange}>
                        </lightning-input>
                    </div>
                </div>


            </div>

        </div>
    </div>

      <template if:false={noRecordsFlag}>
          <div class="table-container">
        <!-- Table below the header -->
          <div class="table-wrapper custom-scroll">
            <table class="staff-table">
              <thead>
                <tr>
                  <th class="table-th">Date</th>
                  <th class="table-th">Shift Type</th>
                  <th class="table-th">Staff Name</th>
                  <th class="table-th">Scheduled Time</th>
                  <th class="table-th">Participants</th>
                  <th class="table-th">Action</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={shiftDataTable} for:item="shift">
                  <tr key={shift.Id} class="table-row">
                    <td class="table-td">{shift.date}</td>
                    <td class="table-td">{shift.shiftType}</td>
                    <td class="table-td">{shift.name}</td>
                    <td class="table-td">{shift.scheduledTime}</td>
                    <td class="table-td">{shift.participants}</td>
                    <td class="table-td">
                      <div>
                        <a
                          href="javascript:void(0)"
                          data-id={shift.Id}
                          data-url={shift.amazonUrl}
                          onclick={handleView}
                          name="view_details"
                          title="View"
                          style="text-decoration: none"
                        >
                          <i class="material-icons view-icon" data-id={shift.Id}
                            >visibility</i
                          >
                        </a>
                        &nbsp;
                        <a
                          href="javascript:void(0)"
                          data-id={shift.Id}
                          onclick={handleDownload}
                          name="view_details"
                          title="Download"
                          style="text-decoration: none"
                        >
                          <i
                            class="material-icons download-icon"
                            data-id={shift.Id}
                            >download_for_offline</i
                          >
                        </a>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <template if:true={paginationVisible}>
        
            <div class="fixed-pagination">
              <div
                class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
              >
                <!--PAGE NAVIGATION-->
                <div class="slds-align_absolute-center">
                  <lightning-button
                    disabled={bDisableFirst}
                    icon-name="utility:jump_to_left"
                    label="First"
                    class="slds-p-horizontal_x-small"
                    alternative-text="first page"
                    onclick={firstPage}
                  ></lightning-button>
                  <lightning-button
                    disabled={bDisableFirst}
                    icon-name="utility:chevronleft"
                    label="Previous"
                    alternative-text="Previous"
                    onclick={previousPage}
                  ></lightning-button>
                  &nbsp;
                  <span class="slds-badge"
                    >Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                    &nbsp;&nbsp;Page(s)</span
                  >
                  &nbsp;
                  <lightning-button
                    disabled={bDisableLast}
                    icon-name="utility:chevronright"
                    label="Next"
                    alternative-text="Next"
                    onclick={nextPage}
                    class="slds-p-horizontal_x-small"
                    icon-position="right"
                  ></lightning-button>
                  <lightning-button
                    disabled={bDisableLast}
                    icon-name="utility:jump_to_right"
                    label="Last"
                    alternative-text="last page"
                    onclick={lastPage}
                    icon-position="right"
                  ></lightning-button>
                </div>

                <!--TOTAL RECORDS-->
                <div class="slds-clearfix">
                  <div class="slds-float_right">
                    <span class="slds-badge"> Total Records: {totalRecords}</span>
                  </div>
                </div>
              </div>
            </div>
          </template>
          
        </div>
      </template>
      <template if:true={noRecordsFlag}>
        <div class="no-data">
          <p>No records found</p>
        </div>
      </template>
    </template>
    <template if:true={isViewFlag}>
      <!-- <c-sidebar-component shift-id={shiftId} onback={handleBackNavigate}></c-sidebar-component> -->
      <c-shift-reports-view-lwc
        shift-id={shiftId}
        onback={handleBackNavigate}
      ></c-shift-reports-view-lwc>
    </template>
    <!-- exportcsv -->
<template if:true={showConfigureModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container slds-modal_large">
            <!-- Header -->
            <header class="slds-modal__header" style="background: #002a52">
                <h2 class="slds-text-heading_medium slds-hyphenate"
              style="color: white; font-weight: bold; text-align: center">
                    Configure Detailed Report Fields
                </h2>                
            </header>
            
            <!-- Body -->
            <div class="slds-modal__content slds-p-around_medium slds-scrollable_y">
                <!-- Load Template Row - Moved inside header -->
                <div class="slds-grid slds-grid_align-space">
                    <!-- Template Dropdown aligned to left -->
                    <div class="slds-col slds-size_11-of-12">
                        <div class="slds-grid slds-grid_align-spread slds-gutters">
                            <div class="slds-col slds-size_3-of-12 slds-align-middle">
                                <span class="slds-text-body_regular slds-m-right_small">Load Template:</span>
                            </div>
                            <div class="slds-col slds-size_8-of-12">
                                <lightning-combobox
                                    key={templateDropdownKey}
                                    label=""
                                    value={selectedTemplateId}
                                    options={templates}
                                    variant="label-hidden"
                                    onchange={handleTemplateChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-12 slds-align_absolute-center">
                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    variant="bare"
                                    alternative-text="Delete Template"
                                    title="Delete Template"
                                    onclick={handleDeleteTemplate}
                                    disabled={isDeleteDisabled}>
                                </lightning-button-icon>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-grid slds-wrap">
                    <template for:each={sections} for:item="section">
                        <div key={section.key} class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <lightning-input
                                type="checkbox"
                                label={section.label}
                                data-key={section.key}
                                checked={section.checked}
                                onchange={handleSectionChange}>
                            </lightning-input>
                        </div>
                    </template>
                </div>
            </div>
            
            <!-- Footer -->
            <footer class="slds-modal__footer">
                <template if:true={isNewTemplate}>
                    <lightning-button
                        label="Save Template"
                        variant="neutral"
                        class="slds-m-left_small"
                        onclick={openSaveTemplate}>
                    </lightning-button>
                </template>
                <!-- Update Template (only for existing) -->
                <template if:false={isNewTemplate}>
                    <lightning-button
                        label="Update"
                        variant="neutral"
                        class="slds-m-left_small"
                        onclick={updateTemplate}
                        disabled={isUpdateDisabled}>
                    </lightning-button>
                </template>
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    class="slds-m-left_small"
                    onclick={closeConfigureModal}>
                </lightning-button>

                <lightning-button
                    label="Export Report"
                    variant="brand"
                    class="slds-m-left_small"
                    onclick={handleExportReportCSV}
                    disabled={isContinueDisabled}>
                </lightning-button>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
<template if:true={showNameModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container slds-modal_small" style="width: 25%;">
            <header class="slds-modal__header" style="background: #002a52">
                <h2  class="slds-text-heading_medium slds-hyphenate"
              style="color: white; font-weight: bold; text-align: center">Save Template</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-input
                    label="Template Name"
                    value={newTemplateName}
                    onchange={handleTemplateNameChange}
                    required>
                </lightning-input>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button
                    label="Cancel"
                    onclick={closeSaveNameModal}>
                </lightning-button>
                <lightning-button
                    label="Save"
                    variant="brand"
                    class="slds-m-left_small"
                    onclick={saveTemplate}>
                </lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

<template if:true={showFormatModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container slds-modal_large" style="max-width: 20%;">
            
            <!-- Header (MATCHED STYLE) -->
            <header class="slds-modal__header" style="background: #002a52">
                <h2 class="slds-text-heading_medium slds-hyphenate"
                    style="color: white; font-weight: bold; text-align: center">
                    Select Export Format
                </h2>
            </header>

            <!-- Body -->
            <div class="slds-modal__content slds-p-around_medium slds-scrollable_y">
                <div class="slds-grid slds-grid_align-center">
                    <div class="">
                        <lightning-radio-group
                            name="format"
                            label="Choose Format"
                            options={formatOptions}
                            value={selectedFormat}
                            onchange={handleFormatChange}>
                        </lightning-radio-group>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="slds-modal__footer">
                <lightning-button 
                    label="Cancel" 
                    variant="neutral"
                    onclick={closeFormatModal}>
                </lightning-button>

                <lightning-button 
                    label="Download" 
                    class="slds-m-left_small"  
                    variant="brand" 
                    onclick={handleDownloadConfirm}>
                </lightning-button>
            </footer>

        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
</div>
</template>
