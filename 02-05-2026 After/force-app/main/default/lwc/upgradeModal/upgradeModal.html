<template>
    <template if:true={isOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open custom-modal">
            <div class="slds-modal__container custom-container">

                <!-- Header -->
                <header class="slds-modal__header">

                    <div class="icon-circle">
                        <lightning-icon icon-name="utility:lock" size="small"></lightning-icon>
                    </div>

                    <h2 class="slds-text-heading_medium">Upgrade Required</h2>


                </header>

                <!-- Content -->
                <div class="slds-modal__content custom-content" style="
                        TEXT-ALIGN: CENTER;
                    ">
                    <p class="slds-m-bottom_medium">
                        This feature is not included in your current plan.
                    </p>

                    <p class="slds-m-bottom_medium">
                        To access this module, please upgrade your subscription plan.<br/>
                        For upgrade assistance, kindly contact our Sales Team.
                    </p>

                    <div class="contact-box">
                        <p><strong>Sales Contact:</strong></p>
                        <p>
                        Email :&nbsp;
                        <span>{label.SALES_EMAIL}</span>
                    </p>
                        <p>Support Hours : Monday – Friday | 9:00 AM – 5:00 PM</p>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer custom-footer">
                    <lightning-button 
                        label="Upgrade" 
                        variant="brand"
                        onclick={handleUpgrade}>
                    </lightning-button>

                    <lightning-button 
                        label="Cancel" 
                        class="slds-m-left_small"
                        variant="neutral"
                        onclick={handleClose}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <!-- Backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
