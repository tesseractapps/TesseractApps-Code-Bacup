                        <lightning-input  type="search" label="Search Participant" onchange={handleSearch} value={inputValue} variant="label-hidden" ></lightning-input>
                    </div>
                
                        <div class="button-group filter-toggle-group">
                            <button type="button"
                                    class={activeButtonClass}
                                    onclick={handleActiveToggle}>
                                Active
                            </button>

                            <button type="button"
                                    class={inactiveButtonClass}

                                Inactive
                            </button>
                        </div>
        <div class="slds-col">
            <div class="facility-multiselect" onclick={showFacilityDropdown}>
                <div class="facility-bubble-container facility-scroll-horizontal">
                    <template for:each={selectedFacilities} for:item="facility">
                        <span key={facility.value} class="facility-bubble">
                            {facility.label}
                            <span class="facility-remove" data-id={facility.value} onclick={removeFacility}>×</span>
                        </span>
                    </template>

                    <input type="text"
                        class="facility-search-input"
                        placeholder="Search"
                        value={facilitySearchTerm}
                        oninput={handleFacilitySearchChange}
                        onfocus={showFacilityDropdown}
                        onclick={stopPropagation} />
                </div>

                <template if:true={showFacilityOptions}>
                    <div class="facility-dropdown custom-scroll" onclick={stopPropagation}>
                        <template for:each={facilityCheckboxOptions} for:item="facility">
                            <label key={facility.value} class="facility-option">
                                <input type="checkbox"
                                    value={facility.value}
                                    data-label={facility.label}
                                    checked={facility.checked}
                                    onchange={handleFacilityCheckboxChange} />
                                &nbsp;{facility.label}
                            </label>
                        </template>
                    </div>
                </template>
            </div>

        </div>



                </div>
                <div class="action-section">
                       
                                     <button class="view-toggle-button"

                            </template>

                                                            background: #0C78BA;
                                                            color: white;
                                                            width: 24px;
                                                            height: 24px;
                                                            display: flex;
                                                            align-items: center;
                                                            justify-content: center;
                                                            border-radius: 20px;
                                                            font-size: 16px;
                                                            cursor: pointer;
                                                            margin-right: 0.5rem;">
                                                        visibility

                                                </template>
                                                <template if:true={isStaff}>
                                                    <td class="label-cell" style="visibility: hidden;">&nbsp;Status</td>
                                                    <td class="colon-cell" style="visibility: hidden;">:</td>
                                                    <td class="value-cell" style="display: flex; align-items: center; justify-content: space-between;">
                                                        <div class="custom-toggle-wrapper" style="visibility: hidden;">
                                                                <div class={fac.toggleTrackClass} onclick={handlefacStatus}
                                                                data-id={fac.Id} data-name={fac.Status__c} data-client={fac.Display_Nickname__c}>
                                                                    <div class={fac.toggleKnobClass} data-id={fac.Id} data-name={fac.Status__c} data-client={fac.Display_Nickname__c}></div>
                                                                </div>
                                                                <span class={fac.toggleLabelClass}>{fac.toggleLabel}</span>
                                                        </div> 
                                                        <i class="material-icons view-icon"
                                                        onclick={handleEditFacility}

                                                        data-typeofservice={fac.typeOfServiceInUI}
                                                        data-participanttype={fac.ParticipantType__c}

                                                            background: #0C78BA;
                                                            color: white;
                                                            width: 24px;
                                                            height: 24px;
                                                            display: flex;
                                                            align-items: center;
                                                            justify-content: center;
                                                            border-radius: 20px;
                                                            font-size: 16px;
                                                            cursor: pointer;
                                                            margin-right: 0.5rem;">
                                                        visibility
                                                        </i>    
                                                    </td>
                                                </template>
                                                </tr>
                                              
                                          </table>
                                        </span>
                                  </div>
                              </div>
                          </template>
                      </div>
                  </div>
              </template>
          </template>

<div class={tableClass}>

    <!-- HEADER -->
    <div class="header-wrapper">
        <table class="staff-table">
            <thead>
                <tr>
                    <th class="table-th" title={participantPreferredName}>
                        {participantPreferredName} Name
                    </th>
                    <th class="table-th" title="Contact Number">
                        Contact Number
                    </th>
                    <th class="table-th" title="Address">
                        Address
                    </th>
                    <th class="table-th" title={facilityPreferredName}>
                        {facilityPreferredName}
                    </th>

                    <template if:true={statusFlag}>
                        <th class="table-th center" title="Status">
                            Status
                        </th>
                    </template>

                    <th class="table-th center" title="Action">
                        Action
                    </th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- BODY -->
    <div class="body-scroll custom-scroll listview">
        <table class="staff-table">
            <tbody>

                <template for:each={recordsToDisplay} for:item="acc">
                    <tr key={acc.Id}>

                        <!-- Name -->
                        <td class="table-td name" title={acc.Display_Nickname__c}>
                            {acc.Display_Nickname__c}
                        </td>

                        <!-- Contact -->
                        <td class="table-td" title={acc.Contact_Number__c}>
                            {acc.Contact_Number__c}
                        </td>

                        <!-- Address -->
                        <td class="table-td" title={acc.AddressData__c}>
                            {acc.AddressData__c}
                        </td>

                        <!-- Facility -->
                        <td class="table-td" title={acc.activeFaciltyDisplay}>
                            {acc.activeFaciltyDisplay}
                        </td>

                        <!-- Status -->
                        <template if:true={statusFlag}>
                            <td class="table-td center">
                                <span class={acc.statusClass}>
                                    {acc.Participant_Status__c}
                                </span>
                            </td>
                        </template>

                        <!-- Action -->
                        <td class="table-td center">
                            <a
                                href="javascript:void(0)"
                                data-id={acc.Id}
                                data-name={acc.Display_Nickname__c}
                                data-typeofservice={acc.typeOfServiceInUI}
                                data-participanttype={acc.ParticipantType__c}
                                onclick={handleEditFacility}
                                title="View">
                                <i class="material-icons view-icon">visibility</i>
                            </a>
                        </td>

                    </tr>
                </template>

                <!-- NO DATA -->
                <template if:false={recordsToDisplay.length}>
                    <tr>
                        <td class="no-data">
                            <p>No records found</p>
                        </td>
                    </tr>
                </template>

            </tbody>
        </table>
    </div>
</div>
                  
              </div>
              </template>
          </template>
          

          <!--LIGHTNING DATATABLE start-->
          <template if:false={noRecordsFlag}>
          
              <div if:true={isDesktop}>
                  <div if:true={visible} class="fixed-pagination">
                      <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
  
                          <!--PAGE NAVIGATION-->
                          <div class="slds-align_absolute-center">
                              <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
                                  class="slds-p-horizontal_x-small" alternative-text="first page"
                                  onclick={firstPage}></lightning-button>
                              <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
                                  alternative-text="Previous" onclick={previousPage}></lightning-button>
                              &nbsp;
                              <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages}
                                  &nbsp;&nbsp;Page(s)</span>
                              &nbsp;
                              <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
                                  alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small"
                                  icon-position="right"></lightning-button>
                              <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                                  alternative-text="last page" onclick={lastPage}
                                  icon-position="right"></lightning-button>
                          </div>
  
                          <!--TOTAL RECORDS-->
                          <div class="slds-clearfix">
                              <div class="slds-float_right slds-m-right_xx-large">
                                  <span class="slds-badge"> Total Records: {totalRecords}</span>
                              </div>
                          </div>
                      </div>
                  </div>
              </div>
          
          </template>
          <!-- if there is no facilities -->
          <template if:true={noRecordsFlag}>
          <div class="no-data">
            <p>No records found</p>
         </div>
         </template>

     <template if:true={isShowSpinner}>
        
        <div class="overlay-logo"></div>

        <div class="spinner-wrapper">
            <div class="loader-container">
            <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
            <img src={imageUrl} alt="T Logo" class="Tlogo" />
            </div>

            <!-- Progress text instead of progress bar -->
            <p class="progress-text">Loading<br />Please Wait...</p>
         </div>
        </template>
         </div>
      
      </template>
  
      
      
      <template if:true={isDetails}>
        <div class="main-container">
          <c-details-lwc record-id={recordId} selected-name={orgId} facility-options-from-parent={facilityDropdownOptions} ></c-details-lwc>
        </div>
      </template>
        <template if:true={handleStatusFlag}>
            <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
                
                <div class="slds-modal__container modal-container" style="max-width:25%;">
                    <header class="slds-modal__header" style="background: #002A52;">
                    
                        <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
                    </header> 
                    <div class="slds-modal__content slds-p-around_medium modal-content" >                                
                        <div class="slds-m-around_small" style="text-align:center">
                            <div><p style="text-align: center;">Are you sure you want to change status of the </br>{client}?</p></div>
                            <div  style="margin-top:10px;text-align: center;">
                                <lightning-button label="No" variant="brand" onclick={handlestatusclose}
                                class="slds-m-around_small"></lightning-button>
                                <lightning-button label="Yes" variant="brand" onclick={handlestatuschange} class="slds-m-around_small"></lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={hasFutureShifts}>
            <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
                class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1" >
            
                <div class="slds-modal__container modal-container" style="max-width:25%;">
                    <header class="slds-modal__header" style="background: #002A52;">
                    
                        <h2  class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Warning</h2>
                    </header> 
                    <div class="slds-modal__content slds-p-around_medium modal-content"  >         <!-- style="border-radius:0 0 15px 15px" -->                       
                        <div class="slds-m-around_small" style="text-align:center">
                            <div>
                                <p> Status cannot be changed for <strong>{client}</strong> because there are scheduled services on the following dates:
                                        <br/>
                                    <strong>{shiftDatesMessage}</strong>
                                </p>
                            </div>
                            <div class="slds-m-top_medium">
                                <lightning-button 
                                    label="OK"
                                    variant="brand"
                                    onclick={handleFutureShiftClose}>
                                </lightning-button>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={editstaffflag}>
        <div class="main-container">
            <c-details-lwc record-id={recordId} onclientevent={childevent} riskindexdetailsfromparent={riskindexdetails} participantdetails={participantdetails} state={state} ndisflag={ndisFlag} participant={participant} individualflag={individualFlag} companyflag={CompanyFlag} ndiscreateflag={ndisCreateFlag} onhidefacilityevent={handleHideFacilityEvent} navigated-from-notifications={navigatedFromNotifications}></c-details-lwc>
        </div>
        </template>
        <!-- Multi-Upload Section -->
        <template if:true={isMultiClientUpload}>

            <c-tesseract-apps-participant-bulk-upload-lwc  onclienteventfrombulk={childeventNavigate}></c-tesseract-apps-participant-bulk-upload-lwc>    

        </template>
    <!-- </div> -->

                          >
                            <lightning-icon
                              icon-name="action:user"
                              size="small"
                              style="background: #02275b; margin-left: -15%; "
                              class="avatar-small fallback-icon"
                            ></lightning-icon>
                          </div>
                        <div class="slds-truncate" title={staff.Name}>
                          {staff.Name}
                        </div>
                      </div>
                      </td>
                      <template for:each={staff.roleData} for:item="roleInfo">
                        <td
                          key={roleInfo.roleId}
                          class="slds-text-align_center role-cell slds-table_striped"
                          data-label={roleInfo.roleName}
                        >
                          <template if:true={roleInfo.hasRoleinstaff}>
                            <lightning-input
                              type="checkbox"
                              checked={roleInfo.hasRole}
                              data-staff-id={staff.Id}
                              data-role-id={roleInfo.roleId}
                              onchange={handleRoleToggle}
                              variant="label-hidden"
                              class="role-checkbox"
                            >
                            </lightning-input>
                          </template>
                          <template if:false={roleInfo.hasRoleinstaff}>
                            <span style="opacity: 0.3">—</span>
                          </template>
                        </td>
                      </template>
                    </tr>
                  </template>
                </template>
                <template if:false={groupedStaffRoleData.length}>
                  <tr>
                    <td colspan="100%">
                      <div class="slds-text-align_center slds-p-around_medium">
                        No staff found matching the search.
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="slds-align_absolute-center slds-m-around_small">
            <lightning-button
              label="Cancel"
              variant="brand-outline"
              onclick={handleeditClose1}
              class="slds-m-around_small"
            ></lightning-button>
            <lightning-button
              label="Save"
              variant="brand"
              onclick={handleUpdateStaff}
              class="slds-m-around_small"
              disabled={saveButtonDisable}
            ></lightning-button>
          </div>
        </div>
    
    
    </template>
      <template if:true={showUpgradeModal}>
            <c-upgrade-modal 
                is-open={showUpgradeModal} 
                onclose={closeUpgradeModal}>
            </c-upgrade-modal>
        </template>
      <template if:true={showClientCreationTemplate}>
          <section class="slds-modal slds-fade-in-open" role="dialog">
              <div class="slds-modal__container" style="max-width:25%">

                  <!-- HEADER -->
                  <header class="slds-modal__header slds-theme_brand" style="background: #002a52" >
                      <h2 class="slds-text-heading_medium slds-text-align_center" style="color: white; text-align: center;">
                          Login & Access
                      </h2>
                  </header>

                  <!-- BODY -->
                  <div class="slds-modal__content slds-p-around_medium custom-scroll">

                      <lightning-radio-group
                          label="How should this participant access the system?"
                          options={clientCreationTypes}
                          value={clientCreationTypeName}
                          data-field="clientCreationTypeName"
                          onchange={handleClientCreationChange}>
                      </lightning-radio-group>
                      <!-- Helper Text -->
                      <div class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                          <p>
                             Selecting the first option will create a user account and allow the participant to log in. The second option will not create a user account.
                          
                          </p>
                      </div>
                  </div>

                  <!-- FOOTER -->
                <footer class="slds-modal__footer">
                    <div class="slds-grid slds-grid_align-end slds-gutters_xx-small">
                        <div class="slds-col">
                            <lightning-button
                                label="Cancel"
                                onclick={closeClientCreation}>
                            </lightning-button>
                        </div>
                       
                    </div>
              </footer>

              </div>
          </section>

          <div class="slds-backdrop slds-backdrop_open"></div>
      </template>
      
  </template>
