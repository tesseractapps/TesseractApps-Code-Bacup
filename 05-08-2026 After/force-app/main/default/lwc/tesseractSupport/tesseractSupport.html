<template>
    <template if:true={isHome}>
        <lightning-card title="Support" icon-name="custom:custom63" >
            <div style="float:right;margin-top:-50px;margin-right:30px;">
                <lightning-button style="margin-right: 5px;" label="Back" variant="brand" onclick={handleback}></lightning-button>
                <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={refreshIssues}>
                    <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                    </svg>
                </button>
            </div>

            <!-- <div class="slds-float_right">
                <button class="slds-button slds-button_icon slds-button_icon-border" title="Refresh" onclick={refreshIssues}>
                    <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                    </svg>
                </button>
            </div> -->

            <div class="slds-m-around_large slds-m-top_x-large" > 
                <div class="slds-m-around_medium"> 
                    <div if:true={isDesktop}>
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-large-size_2-of-12 slds-medium-size_1-of-12 slds-size_1-of-12">
                                <lightning-input  type="search" label="Case Number" name="searchID" value={searchID}></lightning-input>
                            </div>
                            <div class="slds-col slds-large-size_2-of-12 slds-medium-size_1-of-12 slds-size_1-of-12">
                                <lightning-combobox name="status" class="comboInput" label="Status"  value={StatusValue} placeholder="Select Status" options={StatusOptions}
                                onchange={handleChange} >
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-large-size_2-of-12 slds-medium-size_1-of-12 slds-size_1-of-12">
                                <lightning-combobox name="Priority" class="comboInput"  label="Priority" value={PriorityValue} placeholder="Select Priority" options={PriorityOptions}
                                onchange={handleChange} >
                                </lightning-combobox>
        
                            </div>
                            <div class="slds-col slds-large-size_2-of-12 slds-medium-size_1-of-12 slds-size_1-of-12">
                                <lightning-input type="date" name="sdate" value={sdate} label="Start Date"></lightning-input> <!--disabled={datesFlag}-->
                            </div>
                            <div class="slds-col slds-large-size_2-of-12 slds-medium-size_1-of-12 slds-size_1-of-12">
                                <lightning-input type="date"  name="edate" value={edate}  label="End Date"  ></lightning-input> <!--disabled={datesFlag}-->
                            </div>
                            <div class="slds-col slds-large-size_1-of-12 slds-medium-size_1-of-12 slds-size_1-of-12">
                                <lightning-button style="margin-top: 26px;" variant="brand" label="Search" slot="actions" title="Search Issue" onclick={handleSearch} class="slds-float_right  slds-var-m-top_x-large "></lightning-button>
                            </div>
                            <div class="slds-col slds-large-size_1-of-12 slds-medium-size_1-of-12 slds-size_1-of-12">
                                <lightning-button style="margin-top:26px;" variant="brand" label="Clear Issue" slot="actions" title="Clear Issue" onclick={handleClear} class="slds-float_right  slds-var-m-top_x-large "></lightning-button>
                            </div>
                        </div>
                        
                    </div>
                    
            <!-- form div -->
                <div>
                    <!-- <template if:true={payRollinvoiceFlag}> -->
                        <table class="slds-table  slds-table_cell-buffer"  style="width:99%; margin-left:0.5%; margin-top:2%;table-layout:fixed;">
                        <thead>
                            <tr>
                                <th  class="slds-cell-wrap th">Case Number</th>
                                <th  class="slds-cell-wrap th" >Status</th>
                                <th  class="slds-cell-wrap th">Priority</th>
                                <th class="slds-cell-wrap th" >Organisation</th>
                                <th  class="slds-cell-wrap th" style="width:30%;">Description</th>
                                <th  class="slds-cell-wrap th">Assigned to</th>
                                <th  class="slds-cell-wrap th">Raised by</th>
                                <th  class="slds-cell-wrap th">Created Date</th>
                                <th  class="slds-cell-wrap th">View</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={availableIssues} for:item="acc">
                                <tr key={acc.Id} class="tr1">
                                    <td class="slds-cell-wrap">
                                        <a href="javascript:void(0)" data-id={acc.Id} data-actionname="View" data-casenum={acc.CaseNumber} onclick={handleRowActions}> {acc.CaseNumber}
                        
                                        </a>
                                    
                                    </td>
                                    <td class="slds-cell-wrap ">{acc.Status}</td>
                                    <td class="slds-cell-wrap">{acc.Priority}</td>
                                    <td class="slds-cell-wrap">{acc.orgName}</td>
                                    <td class="slds-cell-wrap description">{acc.Description}</td>
                                    <td class="slds-cell-wrap description">{acc.AssignedStaff}</td>
                                    <td class="slds-cell-wrap">{acc.Username}</td>
                                    <td class="slds-cell-wrap">{acc.Date}</td>
                                    <td>
                                        <div>                                        
                                            <a href={acc.amazonUrl} data-id={acc.Id} data-url={acc.amazonUrl}  
                                                onclick={handleView} >
                                                <lightning-icon icon-name="action:preview" size="xx-small" title="View Payslip"></lightning-icon>
                                            </a>
                                        </div>
                                    </td>
                                </tr>                            
                            </template>
                        </tbody>
                    </table>
                
                    <!--Pagination Start-->
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em; margin-left:20px;">
                        <!--RECORDS PER PAGE-->
                        <div class="slds-col">
                            <div class="slds-list_inline slds-p-bottom_xx-small">
                                <span style="margin-top:5px;margin-left:10px;margin-right:5px;">Page Size:</span>
                                <label class="slds-text-color_weak" for="recordsPerPage"></label>
                                <div class="slds-select_container">
                                    <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                        <template for:each={pageSizeOptions} for:item="option">
                                            <option key={option} value={option}>{option}</option>
                                        </template> 
                                    </select>
                                </div>
                            </div>
                        </div>
                        <!--PAGE NAVIGATION-->
                        <div class="slds-align_absolute-center" style="height:5rem">
                            <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage} ></lightning-button>
                            <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                            &nbsp;
                            <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                            &nbsp;
                            <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                            <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                        </div>
                        <!--TOTAL RECORDS-->
                        <div class="slds-clearfix">
                            <div class="slds-float_right" style="margin-right:15px;">
                                <span class="slds-badge"> Total Records: {totalRecords}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Pagination End-->

                    <!-- if there is no facilities -->
                    <template if:true={noRecordsFlag}>
                        <div class="slds-grid  slds-grid_align-spread slds-m-left_large" style="padding-top: 0.5em; font-size:15px;">
                            <b style="color: Red"><I> No Issues Registed </I> </b>
                        </div>
                    </template>
                </div>
            </div>
        </lightning-card>
    </template>
    <template if:true={isOpenModal}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
          class="slds-modal slds-fade-in-open slds-modal_medium" role="dialog" tabindex="-1">
        
          <div class="slds-modal__container ">
            <!-- modal header start -->
            <header class="slds-modal__header">
              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                onclick={hideModalBox}>
                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                  size="small"></lightning-icon>
                <span class="slds-assistive-text">Close</span>
              </button>
              <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{headeringName}</h2>
            </header>
            <!-- modal body start -->
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
              <lightning-record-edit-form object-api-name="Case" record-id={recordId}  >
                <lightning-messages></lightning-messages>
                <div class="slds-grid slds-wrap">
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-output-field field-name="Issue_Description__c" required="true" ></lightning-output-field>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-output-field field-name="Date__c" value={selectedDate} required="true" ></lightning-output-field>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-output-field field-name="Subject" required="true" ></lightning-output-field>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-output-field field-name="Priority" required="true" ></lightning-output-field>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-output-field field-name="Description" required="true" ></lightning-output-field>
                            </div>
                        </div> 
        
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium" >
                                    <lightning-output-field field-name="Raised_By__c"  required="true" ></lightning-output-field>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-output-field field-name="Email__c" ></lightning-output-field>
                            </div>
                        </div> 
                        
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium" >
                                <lightning-output-field field-name="Status_1__c"  required="true" ></lightning-output-field>
                            </div>
                        </div> 
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-input-field field-name="Assign_Tesseract_Staff__c"></lightning-input-field>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2">
                            <div class="slds-m-right_medium slds-m-left_medium">
                                <lightning-output-field field-name="Comments_Added_by_Tesseract_Teams__c"></lightning-output-field>
                            </div>
                        </div>
                   
                    <div if:true={viewfileName}><!-- Uploaded File:&nbsp;<a href={viewfileName} target="_blank">view file</a> -->
                        <div class="slds-m-right_medium slds-m-left_medium" style="margin-top:20px;">
                            <label style="margin-right:65px;color:#5A5A5A;font:12px;">Uploaded File</label>
                            <a href={viewfileName} data-url={viewfileName}  
                            onclick={handleView}>view file</a>
                        </div>
                    </div>
                </div>
                <div class="slds-align_absolute-center slds-m-around_small">
                   <!--  <lightning-button label={buttonName} variant="brand" type="submit" class="slds-m-around_small"></lightning-button> -->
                  <lightning-button label="Cancel" variant="brand" onclick={hideModalBox}
                    class="slds-m-around_small"></lightning-button>
                </div>
              </lightning-record-edit-form>
            </div>
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isModalOpen}>        
        <div class="slds-p-around_medium">
            <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
                onclick={closelinvoice} style="float:right;margin-bottom:5px;"></lightning-button>
            <iframe src={currentUrl} width="100%" height="1300px"></iframe>
        </div>            
    </template>
    
</template>
