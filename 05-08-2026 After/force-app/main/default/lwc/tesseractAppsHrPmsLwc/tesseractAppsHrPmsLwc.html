<template>
    <template if:true={isHome}>
        <div class="main-container">
            <div class="menu-container">
                <div class="menu-item1">
                    <!-- HR Management -->
                    <strong style="font-size: 20px;">
                        HR Management
                    </strong> &nbsp;
                    <span style="font-size: 14px; font-weight: normal;">
                        Manage all aspects of performance management
                    </span>
                </div>    
            </div>
            <!-- <div style="display: flex; align-items: center; justify-content: space-between;">
            
                <p style="font-weight: bold; padding: 1% 0% 1% 1%;font-size:140% "></p> 
                <lightning-button label="Manage Templates" variant="brand" onclick={handleManageTemplates} style=" margin-top:1%;margin-bottom:1%; margin-right:1%; "></lightning-button> 
            </div> -->
            <template if:true={isCardGrid}>
                <div class="dashboard-container custom-scroll">
                    <div class="card-grid">

                        <template for:each={cards} for:item="card">
                            <div key={card.id} class="card">

                                <!-- Header -->
                                <div class="card-header">

                                    <div class="left-section">
                                        <!-- Material Icon -->
                                        <div class={card.iconWrapperClass}>
                                            <span class="material-icons icon-symbol">
                                                {card.materialIcon}
                                            </span>
                                        </div>
                                        <div>
                                            <h2 class="card-title">{card.title}</h2>
                                            <p class="card-description">{card.description}</p>
                                        </div>
                                    </div>

                                    <lightning-button
                                        variant="brand"
                                        label={card.buttonLabel}
                                        data-id={card.id}
                                        onclick={handleClick}>
                                    </lightning-button>

                                </div>

                                <div class="divider"></div>

                                <div class="card-body">
                                    <p class="sub-text">{card.subText}</p>

                                    <template if:true={card.badgeText}>
                                        <span class={card.badgeClass}>
                                            {card.badgeText}
                                        </span>
                                    </template>
                                </div>

                            </div>
                        </template>

                    </div>
                </div>
            </template>        
        </div>
    </template>
    <template if:true={isManageTemplates}>
        <div class="main-container">
            <div class="menu-container">
                <!-- <div class="menu-item2" style="font-size: 20px;">Role Templates</div>     -->
                 <!-- Left Title -->
                <div class="menu-item2" style="font-size: 20px;">
                    Role Templates
                </div>

                <!-- Search Bar -->
                <div class="search-box">
                    <lightning-input 
                        type="search"
                        placeholder="Search"
                        variant="label-hidden"
                        value={searchTemplate}
                        onchange={handleSearchTemplates}>
                    </lightning-input>
                </div>

                <!-- Roles Dropdown -->
                <div class="roles-section">
                    <span class="roles-label">Roles:</span>
                    
                    <div class="multi-select custom-scroll" >

                        <!-- Dropdown Button -->
                        <div  class={selectedOptionClass} title={selectedRolesLabel} onclick={toggleDropdown}>
                             {selectedRolesLabel}
                            <lightning-icon 
                                icon-name="utility:chevrondown"
                                size="x-small">
                            </lightning-icon>
                        </div>

                        <!-- Dropdown List -->
                        <template if:true={isDropdownOpen}>
                            <div class="dropdown custom-scroll" data-id="roleDropdown">

                                <template for:each={roleOptions} for:item="role">
                                    <div key={role.value} class="dropdown-item" >
                                        <lightning-input
                                            type="checkbox"
                                            label={role.label}
                                            value={role.value}
                                            checked={role.checked}
                                            onchange={handleRoleSelection}>
                                        </lightning-input>
                                    </div>
                                </template>

                            </div>
                        </template>

                    </div>
                </div>

                <!-- Button -->
                <div class="create-btn">
                    <lightning-button 
                        label="Create Template"
                        icon-name="utility:add"
                        variant="brand"
                        onclick={handleCreateTemplate}>
                    </lightning-button>
                </div>

                    
            </div>
            <div class="slds-grid slds-wrap slds-align_absolute-center slds-p-around_medium">

                <!-- LEFT SIDE : Summary Boxes -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_10-of-12">

                    <div class="summary-container slds-grid">

                        <div class="summary-box total-box">
                            <div class="summary-title">Total Templates</div>
                            <div class="summary-value">{totalTemplates}</div>
                        </div>

                        <div class="summary-box role-box">
                            <div class="summary-title">Roles</div>
                            <div class="summary-value">{totalRoles}</div>
                        </div>

                    </div>

                </div>

                <!-- RIGHT SIDE : Back Button -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-12 slds-text-align_right">

                    <lightning-button
                        label="Back"
                        variant="brand"
                        onclick={handleBackManageTemplates}>
                    </lightning-button>

                </div>

            </div>
            <template if:true={templateList}>
                <template if:true={templateList.length}>
                     
                    <div class="custom-scroll template-container">
                         <template for:each={templateList} for:item="template">

                        <div key={template.Id} class="slds-card slds-p-around_small custom-card slds-m-around_small">

                            <div class="slds-grid slds-wrap slds-align_absolute-center">

                                <!-- Left Content -->
                                <div class="slds-col slds-size_1-of-1 slds-large-size_12-of-12">

                                    <!-- Title + Badge -->
                                    <div class="slds-grid slds-align-center slds-m-bottom_small">

                                        <h2 class="slds-text-heading_medium slds-m-right_small">
                                            {template.roleTitle}
                                        </h2>

                                        <!-- <span class="slds-badge slds-theme_warning slds-badge_light slds-truncate" title={template.appliedRoles}  style="max-width: 120px; display: inline-block;">{template.appliedRoles}
                                          
                                        </span>      -->
                                        <!-- {template.appliedRoles} -->

                                    </div>

                                    <!-- Description -->
                                    <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                                        {template.description}
                                    </p>

                                    <!-- KPI / OKR / Competency Row -->
                                    <!-- <div class="slds-grid slds-gutters_large slds-text-body_medium slds-m-left_small" style="margin-left: 0%;">

                                        <div>
                                            <span class="slds-text-color_weak">KPIs :</span>
                                            <span class="metric-value slds-m-right_small">{template.kpiCount}</span>
                                        </div>

                                        <div>
                                            <span class="slds-text-color_weak">OKRs :</span>
                                            <span class="metric-value slds-m-right_small">{template.okrCount}</span>
                                        </div>

                                        <div>
                                            <span class="slds-text-color_weak">Competencies :</span>
                                            <span class="metric-value slds-m-right_small">{template.competencyCount}</span>
                                        </div>

                                        <div>
                                            <span class="slds-text-color_weak">Permissions :</span>
                                            <span class="metric-value slds-m-right_small">{template.permissionCount}</span>
                                        </div>

                                    </div> -->
                                    <div class="slds-grid slds-grid_align-spread slds-text-body_medium slds-m-top_small">

                                        <!-- Left Metrics -->
                                        <div class="slds-grid metrics-row">

                                            <div>
                                                <span class="metric-label-new">KPIs:</span>
                                                <span class="metric-value-new">{template.kpiCount}</span>
                                            </div>

                                            <div>
                                                <span class="metric-label-new">OKRs:</span>
                                                <span class="metric-value-new">{template.okrCount}</span>
                                            </div>

                                            <div>
                                                <span class="metric-label-new">Competencies:</span>
                                                <span class="metric-value-new">{template.competencyCount}</span>
                                            </div>

                                            <div>
                                                <span class="metric-label-new">Permissions:</span>
                                                <span class="metric-value-new">{template.permissionCount}</span>
                                            </div>

                                        </div>

                                        <!-- Right Button -->
                                        <div>
                                            <lightning-button
                                                label="View Details"
                                                variant="brand"
                                                data-id={template.Id}
                                                onclick={handleViewDetails}>
                                            </lightning-button>
                                        </div>

                                    </div>


                                </div>

                                <!-- Right Button -->
                                <!-- <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-12 slds-text-align_right">

                                    <lightning-button
                                        label="View Details"
                                        variant="brand"
                                        data-id={template.Id}
                                        onclick={handleViewDetails}>
                                    </lightning-button>

                                </div> -->

                            </div>

                        </div>

                    </template>
                    </div>
                   
                </template>
                <template if:false={templateList.length}>
                    <div class="no-data">
                        <p>No records found</p>
                    </div>
                </template>
            </template>
            
        </div>
    </template>

                                                </div>

                                            </div>

                                        </div>

                                                    slds-size_1-of-1">

                                            <div class="slds-grid slds-wrap slds-gutters_medium">

                                                    <div class="floating-label-new ">
                                                        <span class="label-text-drop">
                                                            <span style="color:red">*</span>KPI Name

                                                        </lightning-input>

                                    <template if:true={kpiList.length}>
                                        <div class="ndis-table-container custom-scroll">
                                            <table class="ndis-table">
                                                <thead>
                                                    <tr>

                                                        <th class="table-td-service">Category</th>
                                                        <th class="table-td-service">Target</th>
                                                        <th class="table-td-service">Unit</th>
                                                        <th class="table-td-service">Weight %</th>
                                                        <th class="table-td-service" style="width:8%">Action</th>
                                                    </tr>
                                                </thead>
