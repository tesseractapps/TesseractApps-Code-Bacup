        <template if:true={showThresholdPopup}>
    <section role="dialog"
             tabindex="-1"
             class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container customModal">

            <!-- Header -->
            <div class="warningHeader">

                    <lightning-icon
                        icon-name="utility:warning"
                        variant="warning"
                        size="medium">
                    </lightning-icon>

                    <div class="headerText">

                        <p>

                        </p>
                    </div>
                </div>

                <lightning-button-icon
                    icon-name="utility:close"
                    onclick={handlePopupCancel}
                    alternative-text="Close">
                </lightning-button-icon>

            </div>

            <!-- Body -->
            <div class="slds-modal__content slds-p-around_medium">

                <p class="description1">
                    The system evaluated each day in this leave period and found
                    that <b>30% or more staff are already on approved leave.</b>
                </p>

                <template for:each={thresholdData} for:item="day" for:index="index">

                    <div key={day.leaveDate}
                         class="warningCard">

                        <div class="cardHeader">

                            <div style="display:flex;align-items:center;">

                                <lightning-icon
                                    icon-name="utility:event"
                                    size="x-small">
                                </lightning-icon>

                                <span class="slds-m-left_small">{day.leaveDate}</span>

                            </div>

                           <!--  <div class="countText">

                                {day.approvedLeaveCount} staff already on leave

                            </div> -->
                             <div class="headerRight">

                            <span class="countText">
                                {day.approvedLeaveCount} staff already on leave
                            </span>

                            <!-- <lightning-button-icon
                                data-index={index}
                                icon-name={day.iconName}
                                onclick={handleToggle}
                                alternative-text="Expand">
                            </lightning-button-icon> -->
                             <span
                                class="material-icons toggleIcon"
                                data-index={index}
                                onclick={handleToggle}>
                                {day.iconName}
                            </span>

                        </div>

                        </div>

                        <template if:true={day.isOpen}>

                        <div class="cardBody">

                            <ul>

                                <template
                                    for:each={day.staffNames}
                                    for:item="staff">

                                    <li key={staff}>
                                        • {staff}
                                    </li>

                                </template>

                            </ul>

                          <!--   <hr> -->

                            <p class="currentRequest">

                                • {currentstaff} &nbsp;
                                <span>(this request)</span>

                            </p>

                        </div>
                        </template>

                    </div>

                </template>

                <div class="footerNote">

                    Threshold: 30% concurrent staff on leave.
                    Review before proceeding.

                </div>

            </div>

            <!-- Footer -->

            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    onclick={handlePopupCancel}>
                </lightning-button>

                <lightning-button
                   class="slds-m-left_small"
                    variant="brand"
                    label="Approve Anyway"
                    onclick={handleContinue}>
                </lightning-button>

            </footer>

        </div>

    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>
