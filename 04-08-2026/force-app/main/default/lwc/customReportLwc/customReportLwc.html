                                <!-- CSV -->
                                <label class="custom-radio">
                                    <input type="radio" name="exportType" value="EXCEL" checked={isCSV} onchange={handleExportTypeChange} />
                                    <span class="radio-circle"></span>
                                    <span class="radio-label">CSV</span>
                                </label>

                            </div>

                            <!-- Load Template Row -->
                            <div class="radio-wrapper slds-p-around_medium">

                                <div class="slds-col slds-size_8-of-12">
                                    <div class="slds-grid slds-gutters_large">
                                        <div class="slds-col slds-size_2-of-12 slds-align-middle">
                                            <span class="slds-text-body_regular slds-m-right_small">
                                                Template:
                                            </span>
                                        </div>

                                        <!-- combobox OR new template input -->
                                        <div class="slds-col slds-size_10-of-12">

                                            <!-- Normal mode (combobox) -->
                                            <template if:false={showNewTemplateInput}>
                                                <lightning-combobox label="" value={selectedTemplateId} options={templatesforShiftReport} variant="label-hidden" onchange={handleTemplateChange}>
                                                </lightning-combobox>
                                            </template>

                                            <!-- NEW template mode (text input) -->
                                            <template if:true={showNewTemplateInput}>
                                                <lightning-input type="text" label="" placeholder="Enter template name" value={newTemplateName} variant="label-hidden" onchange={handleNewTemplateNameChange}>
                                                </lightning-input>
                                            </template>

                                        </div>

                                        <!-- right side icons -->
                                        <div class="slds-col slds-size_2-of-12 slds-align_absolute-center">

                                            <!-- delete icon (normal mode) -->
                                            <!-- <template if:false={showNewTemplateInput}>
                                                <lightning-button-icon
                                                    icon-name="utility:delete"
                                                    variant="bare"
                                                    alternative-text="Delete Template"
                                                    title="Delete Template"
                                                    onclick={handleDeleteTemplate}
                                                    disabled={isDeleteDisabled}>
                                                </lightning-button-icon>
                                            </template> -->

                                            <!-- confirm / cancel icons (NEW mode) -->
                                            <template if:true={showNewTemplateInput}>

                                                <lightning-button-icon icon-name="utility:check" variant="bare" alternative-text="Confirm" title="Confirm" onclick={handleConfirmNewTemplate}>
                                                </lightning-button-icon>

                                                <lightning-button-icon icon-name="utility:close" variant="bare" alternative-text="Cancel" title="Cancel" class="slds-m-left_x-small" onclick={handleCancelNewTemplate}>
                                                </lightning-button-icon>

                                            </template>

                                        </div>

                                    </div>
                                </div>
                            </div>
                            <!-- Drag & Drop Sections -->
                            <template for:each={sections} for:item="section" for:index="index">

                                <div key={section.key} class="drag-row" draggable="true" data-index={index} ondragstart={handleDragStart} ondragover={handleDragOver} ondrop={handleDrop}>

                                    <!-- <div class="row-number">
                                        {section.order}.
                                    </div> -->

                                    <div class="drag-handle">
                                        <lightning-icon icon-name="utility:rows" size="x-small"></lightning-icon>
                                    </div>

                                    <div class="row-label">
                                        {section.label}
                                    </div>

                                    <div class="row-checkbox">
                                        <lightning-input type="checkbox" label={section.label} variant="label-hidden" data-key={section.key} checked={section.checked} onchange={handleSectionChange}>
                                        </lightning-input>
                                    </div>

                                </div>

                            </template>

                        </div>

                        <!-- FOOTER -->
                        <footer class="slds-modal__footer">

                            <lightning-button variant="neutral" label="Cancel" onclick={StaffBasedReportshowModalclose}>
                            </lightning-button>

                            <lightning-button class="slds-m-left_small" variant="brand" label="Save" onclick={StaffBasedReportshowModalsave}>
                            </lightning-button>

                        </footer>

                    </div>
                </section>

                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <template if:true={isExportPopupOpen}>
                <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">

                    <div class="slds-modal__container modal-custom ">

                        <!-- HEADER -->
                        <header class="slds-modal__header headercustom">
                            <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">Export Report</h2>
                        </header>

                        <!-- BODY CONTENT -->
                        <div class="slds-modal__content slds-p-around_medium custom-scroll">
                            <div class="slds-grid slds-wrap slds-gutters">
                                <lightning-radio-group name="exportType" label="Select export type" options={exportTypeOptions} value={selectedExportType} type="radio" orientation="horizontal" onchange={handleExportTypeChange}>
                                </lightning-radio-group>
                            </div>
                        </div>

                        <!-- FOOTER -->
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Cancel" onclick={closeExportPopup}>
                            </lightning-button>

                            <lightning-button class="slds-m-left_small" variant="brand" label="Export" onclick={handleExport}>
                            </lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <template if:true={invoiceEmailFlag}>
                <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
                    <div class="slds-modal__container modal-container" style="max-width:25%;">
                        <header class="slds-modal__header" style="background: #002A52;">
                            <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align: center;">Please Confirm</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium custom-scroll">
                            <div class="slds-m-around_small center-container-pop">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>To Address</span>
                                    <lightning-input type="text" label="To Address" name="toAddress" variant="label-hidden" value={toAddress} onchange={handleEmailOnChange} required>
                                    </lightning-input>
                                </div>
                                <br/>
                                <div class="floating-label">
                                    <span class="label-text-drop">Cc Address</span>
                                    <lightning-input type="text" label="CC Address" variant="label-hidden" name="ccAddress" value={ccAddress} onchange={handleEmailOnChange} required>
                                    </lightning-input>
                                </div>
                                <br/>
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>Email Subject</span>
                                    <lightning-input name="emailSubject" label="Email Subject" variant="label-hidden" value={emailSubject} onchange={handleEmailOnChange} class="slds-m-bottom_small" required>
                                    </lightning-input>
                                </div>
                                <br/>
                                <div class="custom-rich-text-container">
                                    <span class="label-text-drop"><span style="color:red">*</span>Email Body</span>
                                    <lightning-input-rich-text name="emailBody" value={emailBody} onchange={handleEmailOnChange} variant="label-hidden" class="rich-text-editor" required>
                                    </lightning-input-rich-text>
                                </div>
                                <!-- <div class="button-container slds-m-top_medium">
                                    <lightning-button label="Cancel" variant="Brand-Outline" onclick={handleCloseModal}
                                    class="slds-m-around_small"></lightning-button>
                                    <lightning-button label="Send Email" variant="brand" onclick={handleSendEmailtoStaff}
                                        class="slds-m-around_small"></lightning-button>
                                </div> -->

                                <!-- FOOTER -->


                            </div>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Cancel" onclick={handleCloseModal}>
                            </lightning-button>
                            <lightning-button class="slds-m-left_small" variant="brand" label="Send Email" onclick={handleSendEmailtoStaff}>
                            </lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <template if:true={handlePreviewflag}>
                <div class="spinner-container">
                    <lightning-spinner alternative-text="Loading" size="large" variant="brand">
                    </lightning-spinner>
                </div>
            </template>
        </template>
    </div>
    <template if:true={showUpgradeModal}>
        <c-upgrade-modal is-open={showUpgradeModal} onclose={closeUpgradeModal}>
        </c-upgrade-modal>
    </template>
</template>
