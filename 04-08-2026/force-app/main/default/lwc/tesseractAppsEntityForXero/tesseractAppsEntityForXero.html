<template>

    <template if:true={createEntity}>
        <div class="blur-overlay"></div>
        <div class="right-align " style="width:40%;padding-right:1%;">
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <h3 style="font-weight: bold;font-size:150%; margin: 0; padding: 0% 0 0 1%;">Create Entity</h3>
                <!-- <lightning-button label="Back" variant="brand" onclick={handleback}></lightning-button> -->

                <!-- <lightning-button class="slds-m-left_small" label="Back" onclick={hideModalBox} variant="brand" style="padding-right: 3.5%;padding-top:2%;"></lightning-button> -->
            </div>
            
                
                <div class="seperator right-content custom-scroll">
                    <div class="slds-grid slds-wrap">
                        <!-- <div class="slds-grid slds-wrap" style="padding-top: 1%;"> -->

                        <div class="slds-size_1-of-2 slds-p-around_small">
                        
                            <div class="floating-label-new">
                                <span class="label-text-drop"><span style="color:red">*</span> First Name</span>
                                
                                <lightning-input  type="text" name="entityFirstName"  variant="label-hidden"  value={entityFirstName} required="true" onchange={handleChange}
                                ></lightning-input>
                            </div>
                        
                        </div>
                        
                        <div class="slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Last Name</span>
                                <lightning-input  type="text" name="entityLastName" variant="label-hidden" value={entityLastName}  onchange={handleChange} ></lightning-input>
                            </div>
                        </div>

                        <div class="slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop"><span style="color:red">*</span>Email</span>
                                <lightning-input type="email"  name="email" variant="label-hidden" value={entityEmail}  required="true"  onchange={handleChange} ></lightning-input>
                            </div>
                        </div>
                        <div class="slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop"><span style="color:red">*</span>Contact</span>
                                <lightning-input type="text"  name="contact" variant="label-hidden" value={contactNo}  required="true" onchange={handleChange} ></lightning-input>
                            </div>
                        </div>

                        <div class="slds-size_1-of-2 slds-p-around_small">
                            <div class="floating-label-new">
                                <span class="label-text-drop">ABN</span>
                                <lightning-input type="text" pattern="^\d+$" name="abn" variant="label-hidden" value={abn} onchange={handleChange}  ></lightning-input>
                            </div>
                        </div> 
                    </div>
                    <div class="slds-grid slds-wrap">
                            <div class="slds-grid slds-wrap">
                                <div class="slds-m-right_medium slds-m-left_medium">  
                                    <div style="color:red;">{errorMessage}</div>                      
                                    <lightning-input-address
                                        address-label="Address"
                                        street-label="Street"
                                        city-label="Suburb"
                                        country-label="Country"
                                        province-label="State"
                                        postal-code-label="Post Code"
                                        street={street}
                                        city={city}
                                        country={country}
                                        province={province}
                                        postal-code={postalCode}
                                        onchange={addressInputChange}
                                        show-address-lookup required="true">
                                    </lightning-input-address>     
                                </div> 
                            </div>
 
                    </div>
                </div>

            <div style="display: flex;justify-content: center; align-items: center; gap: 10px; margin-top:2%;">    
               
                <lightning-button  variant="outline"  label="Cancel" title="Cancel"  onclick={handleClear}> </lightning-button>
                <lightning-button variant="brand" label="Save" title="Save" onclick={handleSave}> </lightning-button>
            </div>
        </div>
    </template>
</template>
