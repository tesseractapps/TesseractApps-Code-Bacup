<template>
  <template if:true={isHome}>
    <div class="main-container">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
        "
      >
        <!-- Right side: Back button and image icon -->
        <div style="display: flex; align-items: center; gap: 10px">
          <!-- <span><button class="button" onclick={handleclonealert} >Clone</button></span> -->
          <template if:true={cloneflag}>
            <section
              aria-describedby="modal-content-id-1"
              aria-labelledby="modal-heading-01"
              aria-modal="true"
              class="slds-modal slds-fade-in-open"
              role="dialog"
              tabindex="-1"
            >
              <div class="slds-modal__container" style="width: 10%">
                <header
                  class="slds-modal__header"
                  style="background: #124795; border-radius: 15px 15px 0 0"
                >
                  <h2
                    id="modal-heading-01"
                    class="slds-text-heading_medium slds-hyphenate"
                    style="color: white; font-weight: bold; text-align: left"
                  >
                    Please Confirm
                  </h2>
                </header>
                <div
                  class="slds-modal__content slds-p-around_medium"
                  id="modal-content-id-1"
                  style="border-radius: 0 0 15px 15px"
                >
                  <div class="slds-m-around_small">
                    <div>
                      <h1>
                        Are you sure you would like to clone from previous week
                      </h1>
                    </div>
                    <div style="margin-top: 10px; align-items: center">
                      <lightning-button
                        label="Yes"
                        variant="brand"
                        onclick={handleClone}
                        class="slds-m-around_small"
                        style="margin-left: 4rem"
                      ></lightning-button>
                      <lightning-button
                        label="No"
                        variant="brand"
                        onclick={handlecloneclose}
                        class="slds-m-around_small"
                      ></lightning-button>
                    </div>
                  </div>
                </div>
              </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
          </template>
        </div>
      </div>
      <header class="header">
        <div class="search-section">
          <div
            class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4"
          >
            <div class="floating-label">
              <span class="label-text-drop">Select Facility</span>
              <lightning-combobox
                name="Facility"
                label=""
                value={selectedValue}
                placeholder={faclitylabel}
                variant="label-hidden"
                options={facilityOptions}
                onchange={handleFacilityChange}
              ></lightning-combobox>
            </div>
          </div>
        </div>
        <div class="action-section">
          <div>
            <span class="Arrow">
              <lightning-button-icon
                icon-name="utility:left"
                class="slds-m-top_xx-small"
                onclick={navigateToPrevious}
              ></lightning-button-icon>
            </span>
            <span class="today">
              <lightning-button
                label="Today"
                onclick={navigateToToday}
              ></lightning-button>
            </span>
            <span class="Arrow">
              <lightning-button-icon
                icon-name="utility:right"
                class="slds-m-top_xx-small"
                onclick={navigateToNext}
              ></lightning-button-icon>
            </span>
          </div>
          <lightning-input
            label="Date"
            type="date"
            name="select-date"
            variant="label-hidden"
            class="lwc-datepicker"
            value={datePickerString}
            onchange={navigateToDay}
          ></lightning-input>
          <button
            class="slds-button slds-button_icon slds-button_icon-border"
            title="Refresh"
            onclick={handleVisbility}
          >
            <svg class="slds-button__icon" aria-hidden="true">
              <use
                xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"
              ></use>
            </svg>
          </button>
        </div>
      </header>
