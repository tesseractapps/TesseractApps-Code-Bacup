<template>
    <div class="container">
    <div class="awards-container">
        <template if:true={homeflag}>
        <p style="font-weight:bold;margin-bottom:2%; font-size: 180%">Awards History</p>
              <table class="slds-table slds-table_cell-buffer">
                  <thead>
                      <tr>
                          <th>Award</th>
                          <th>Facility</th>
                          <th>Staff</th>
                          <th>Date</th>
                          <th>Issued by</th>
                          <th>Certificate</th>
                      </tr>
                  </thead>
                  <tbody>
                      <template for:each={Awards} for:item="Award">
                          <tr key={Award.Id} class="tr1">
                              <td>{Award.Awards__c}</td>
                              <td>{Award.Facility__r.Name}</td>
                              <td>{Award.fullName}</td>
                              <td>{Award.Todate}</td>
                              <td>{Award.Issued_by__c}</td>
                              <td  class="slds-cell-wrap">
                                <div if:true={Award.Certificate__c} class="slds-align_absolute-center"> 
                                    <a href={Award.Certificate__c} data-url={Award.Certificate__c}  
                                    onclick={handleView}>
                                         <lightning-icon icon-name="action:preview" size="xx-small" title="Certificate"></lightning-icon>
                                    </a>
                                </div>
                            </td>
                          </tr>
                      </template>
                      
                  </tbody>
              </table>
            </template>
        <template if:true={isModalOpen}>
        
            <div class="slds-p-around_medium">
                <lightning-button class="slds-m-left_medium" slot="footer" label="Back" variant="brand"
                onclick={closepdf} style="float:right;margin-bottom:5px;"></lightning-button>

            <iframe src={currentUrl} width="100%" height="1300px" ></iframe>
            </div>
        
        </template>
          
      </div>
    </div>
</template>
