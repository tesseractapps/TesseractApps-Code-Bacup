<template>
  <div class="dashboard-container">
    <template if:false={tilesflag}>
      <div style="padding: 1%">
        <div class="metrics-grid">
          <div
            class="metric-card highlighted"
            onclick={handleMetricClick}
            data-id="Pending"
          >
            <div class="invoiceTiles">
              <div>
                <h3 class="metric-title">Pending</h3>
                <p class="metric-value">{pendingInvoices}</p>
              </div>
              <!-- <template if:true="{selectedMetricId" ="" ="" ="Pending" }>
                <i class="material-icons metric-icon">task_alt</i>
              </template> -->
              <template if:true={pendingInvoicestask}>
                <i class="material-iconsInvoice">task_alt</i>
              </template>
            </div>
          </div>

          <div
            class="metric-card highlighted1"
            onclick={handleMetricClick}
            data-id="Generated"
          >
            <div class="invoiceTiles">
              <div>
                <h3 class="metric-title">Generated</h3>
                <p class="metric-value">{generatedInvoices}</p>
              </div>
              <!-- <template if:true="{selectedMetricId" ="" ="" ="Generated" }>
                <i class="material-icons metric-icon">task_alt</i>
              </template> -->
              <template if:true={generatedInvoicestask}>
                <i class="material-iconsInvoice">task_alt</i>
              </template>
            </div>
          </div>

          <div
            class="metric-card highlighted2"
            onclick={handleMetricClick}
            data-id="Overdue"
          >
            <div class="invoiceTiles">
              <div>
                <h3 class="metric-title">Cancelled Invoices</h3>
                <p class="metric-value">{overdueInvoices}</p>
              </div>
              <!-- <template if:true="{selectedMetricId" ="" ="" ="Overdue" }>
                <i class="material-icons metric-icon">task_alt</i>
              </template> -->
              <template if:true={overdueInvoicestask}>
                <i class="material-iconsInvoice">task_alt</i>
              </template>
            </div>
          </div>

          <div
            class="metric-card highlighted3"
            onclick={handleMetricClick}
            data-id="Total"
          >
            <div class="invoiceTiles">
              <div>
                <h3 class="metric-title">Total Value</h3>
                <p class="metric-value">${totalAmount}</p>
              </div>
              <!-- <template if:true="{selectedMetricId" ="" ="" ="Total" }>
                <i class="material-icons metric-icon">task_alt</i>
              </template> -->
              <template if:true={totalAmounttask}>
                <i class="material-iconsInvoice">task_alt</i>
              </template>
            </div>
          </div>
        </div>
        <template if:true={isModalRelate}>
          <header class="header1">
            <div class="search-section">
              <div class="floating-label-new">
                <span class="label-text-drop">Start Date</span>
                <lightning-input
                  type="date"
                  label="Start Date"
                  name="start"
                  value={startDate}
                  variant="label-hidden"
                  onchange={handleDateChange}
                ></lightning-input>
              </div>
              <div class="floating-label-new">
                <span class="label-text-drop">End Date</span>
                <lightning-input
                  type="date"
                  label="End Date"
                  name="end"
                  value={endDate}
                  variant="label-hidden"
                  onchange={handleDateChange}
                ></lightning-input>
              </div>
  <!-- <div class="floating-label-new">
      <span class="label-text-drop">{participantPreferredName}</span>
      <c-tesseract-apps-multi-combobox
          placeholder="Select Participants"
          options={ParticipantOptions}
          value={partcipantIdList}
          onchange={handleServiceStaffchange}>
      </c-tesseract-apps-multi-combobox>
  </div> -->
              <!-- <lightning-button  variant="brand"  label="Participants" title="Participants"  onclick={handleCheckBoxVisible}> </lightning-button> -->
              <!-- <i
                class="material-icons"
                title={participantPreferredName}
                onclick={handleCheckBoxVisible}
                >filter_alt</i
              > -->
            </div>
            <div class="action-section">
              <template if:true={addServiceVisible}>
                <template if:false={generatedflag}>
              <template if:false={cancelledflag}>
                  <lightning-button
                  variant="brand"
                  label="Add Service"
                  title="Add Service"
                  onclick={handleAddService}
                  class="slds-m-left_small"
                >
                </lightning-button>
              </template>
              </template>
              </template>

            
              <template if:false={generatedflag}>
                <lightning-button
                  variant="brand"
                  label="Generate Invoice"
                  title="Generate Invoice"
                  onclick={handleGenerateInvoice}
                  disabled={disableBool}
                >
                </lightning-button>
              </template>
              <!-- <lightning-button
                variant="brand"
                label="Back"
                title="Back"
                onclick={HandleBack}
                style="margin-left: 1px"
              >
              </lightning-button> -->
            </div>
          </header>
        </template>
      </div>
    </template>

    <div>
      <template if:true={participantCheckBox}>
        <div class="sidebar">
          <div class="close-btn" onclick={handleCheckBoxVisible}>&times;</div>

          <div style="border-radius: 5px 5px 0 0">
            <h5 class="facility-header">{participantPreferredName}</h5>
            <div
              class="box-facility-role"
              style="
                margin-bottom: 10px;
                padding: 0px 15px;
                overflow-x: HIDDEN;
                overflow-y: AUTO;
                height: 30vh;
              "
            >
              <lightning-checkbox-group
                label=""
                name="progress"
                options={ParticipantOptions}
                value={partcipantIdList}
                onchange={handleServiceStaffchange}
              ></lightning-checkbox-group>
            </div>
          </div>
          <div style="border-radius: 5px 5px 0 0">
            <h5 class="facility-header">Status</h5>
            <div
              class="box-facility-role"
              style="
                margin-bottom: 10px;
                padding: 0px 15px;
                overflow-x: HIDDEN;
                overflow-y: AUTO;
                height: 13vh;
              "
            >
              <lightning-checkbox-group
                label=""
                name="progress"
                options={serviceStatusOption}
                value={statusService}
                onchange={handleServiceChange}
              ></lightning-checkbox-group>
            </div>
          </div>
        </div>
      </template>
      
      <template if:true={pendingflag}>
        <template if:true={isInvoiceflag}>
          <div class="invoiceTable custom-scroll">
             <div style="padding: 1% 1% 0 2%">
                <header class="bulk-action-header">
                    <div class="table-title table-header">{participantPreferredName} Services</div>
                    <div class="action-section" style="padding-bottom:1%; display:flex; gap:12px; align-items:center; flex-wrap:nowrap;">
                        <div style="min-width:150px;">
                            <div class="floating-label-new">
                                <span class="label-text-drop">Plan Type</span>
                                <lightning-combobox
                                    name="planType"
                                    value={servicesPlanType}
                                    options={planTypeOptions}
                                    variant="label-hidden"
                                    onchange={handlePlanTypeChange}>
                                </lightning-combobox>
                            </div>
                        </div>
                        <div style="min-width:180px;">
                            <div class="floating-label-new">
                                <span class="label-text-drop">{staffPreferredName}</span>
                                <lightning-input
                                    label="Client ID or Name"
                                    onchange={handleSearchInput}
                                    type="search"
                                    variant="label-hidden"
                                    value={searchKey}>
                                </lightning-input>
                            </div>
                        </div>
                        <div style="min-width:200px;">
                            <div class="floating-label-new">
                                <span class="label-text-drop">{participantPreferredName}</span>
                                <c-tesseract-apps-multi-combobox
                                    placeholder="Select Participants"
                                    options={ParticipantOptions}
                                    value={partcipantIdList}
                                    onchange={handleServiceStaffchange}>
                                </c-tesseract-apps-multi-combobox>
                            </div>
                        </div>
                    </div>
                </header>
            </div>
            <template if:true={noRecordsFlag}>
             <!--  <div style="padding: 1%">
                <p class="table-title table-header">
                  {participantPreferredName} Services
                </p>

                
              </div> -->
              <div class="no-data">
                <p>No records found</p>
              </div>
              
            </template>
            <template if:false={noRecordsFlag}>
              <!-- <div style="padding: 1%">
                <p class="table-title table-header">
                  {participantPreferredName} Services
                </p> -->
                  <div style="padding: 0 0% 1% 0%">
                <div class="listview custom-scroll">
                  <div>
                    <div class="table-container yourInvoiceTable">

                        <!-- HEADER -->
                        <div class="header-wrapper">
                            <table class="staff-table">
                                <thead>
                                    <tr>
                                        <th class="table-th tableCheckbox">
                                            <lightning-input
                                                type="checkbox"
                                                onchange={handleSelectAll}>
                                            </lightning-input>
                                        </th>

                                        <th class="table-th">{staffPreferredName} Name</th>
                                        <th class="table-th">{participantPreferredName} Name</th>
                                        <th class="table-th">Service Type</th>
                                        <th class="table-th">Service Date</th>
                                        <th class="table-th">Billable Hours</th>
                                        <th class="table-th">Reimbursement</th>
                                        <th class="table-th">Unit Price</th>
                                        <th class="table-th">GST</th>
                                        <th class="table-th">Amount</th>
                                        <th class="table-th">Status</th>
                                    </tr>
                                </thead>
                            </table>
                        </div>

                        <!-- BODY -->
                        <div class="table-body custom-scroll">
                            <table class="staff-table">
                                <tbody>
                                    <template for:each={accList} for:item="acc">
                                        <tr key={acc.Id} class="table-row">

                                            <td class="table-td tableCheckbox">
                                                <lightning-input
                                                  type="checkbox"
                                                  checked={acc.isChecked}
                                                  data-id={acc.Id}
                                                  data-status={acc.Status__c}
                                                  data-bill={acc.Bill_Participant__c}
                                                  data-fundstrackerid={acc.fundsTrackerId}
                                                  onchange={handleCheckboxChange}
                                                ></lightning-input>
                                            </td>

                                            <td class="table-td description">{acc.Resource_Name__c}</td>

                                            <td class="table-td description">
                                                {acc.participantFullName}
                                            </td>

                                            <td class="table-td description">{acc.Service_Type_Name__c}</td>

                                            <td class="table-td">{acc.ServiceDate}</td>

                                            <td class="table-td">
                                              <template if:true={acc.isEditingQty}>
                                                <div class="qty-edit-container">
                                                  <lightning-input
                                                    type="number"
                                                    step="0.01"
                                                    min="0"
                                                    value={acc.Qty__c}
                                                    variant="label-hidden"
                                                    onchange={handleQtyChange}
                                                    data-id={acc.Id}
                                                    data-quantity={acc.Qty__c}
                                                    onkeydown={handleQtyKeyDown}
                                                    class="qty-value"
                                                  >
                                                  </lightning-input>
                                                  <a
                                                    href="javascript:void(0)"
                                                    class="save-link"
                                                    data-id={acc.Id}
                                                    title="Save"
                                                    onclick={saveRow}
                                                  >
                                                    <i class="material-icons save-icon"
                                                      >check</i
                                                    >
                                                  </a>
                                                </div>
                                              </template>

                                              <template if:false={acc.isEditingQty}>
                                                <div class="qty-edit-container">
                                                  <span class="qty-value"
                                                    >{acc.Qty__c}</span
                                                  >
                                                  <a
                                                    href="javascript:void(0)"
                                                    data-id={acc.Id}
                                                    data-status={acc.Status__c}
                                                    data-quantity={acc.Qty__c}
                                                    onclick={enableQtyEdit}
                                                    title="Edit Service"
                                                  >
                                                    <i class="material-icons edit-icon"
                                                      >edit</i
                                                    >
                                                  </a>
                                                </div>
                                              </template>
                                            </td>

                                            <td class="table-td">{acc.reimbursementAmount}</td>

                                            <td class="table-td">
                                                <lightning-formatted-number
                                                    value={acc.unitprice}
                                                    format-style="currency"
                                                    currency-code="AUD">
                                                </lightning-formatted-number>
                                            </td>

                                            <td class="table-td">{acc.GST__c}</td>

                                            <td class="table-td">
                                                <lightning-formatted-number
                                                    value={acc.participantInvoiceAmount}
                                                    format-style="currency"
                                                    currency-code="AUD">
                                                </lightning-formatted-number>
                                            </td>

                                            <td class="table-td">
                                                <span class="slds-badge status-badge pending-status">
                                                    {acc.uistatus}
                                                </span>
                                                <template if:true={acc.showCreateCompanyIcon}>
                                                  <a
                                                      href="javascript:void(0);"
                                                      data-id={acc.Id}
                                                      data-facility-id={acc.matchedFacilityId}
                                                      data-fundstrackerid={acc.fundsTrackerId}
                                                      onclick={handleOpenCreateCompany}
                                                      title="Create Company/Entity"
                                                      class="status-icon-link"
                                                  >
                                                      <i class="material-icons view-icon">
                                                          add_home_work
                                                      </i>
                                                  </a>
                                                </template>
                                            </td>

                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                    </div>                 
                  </div>
                </div>
              </div>
              <div class="report-footer">
                  <div class="pagination-container slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-p-around_medium">

                      <!-- Page size -->
                      <div class="slds-list_inline slds-grid slds-grid_vertical-align-center">

                          <span class="slds-m-right_x-small">
                              Page Size:
                          </span>

                          <div class="slds-select_container">
                              <select
                                  class="slds-select"
                                  onchange={handleRecordsPerPage}>

                                  <template for:each={pageSizeOptions} for:item="option">
                                      <option key={option} value={option}>
                                          {option}
                                      </option>
                                  </template>

                              </select>
                          </div>

                      </div>

                      <!-- Pagination buttons -->
                      <div class="slds-align_absolute-center">

                          <lightning-button
                              disabled={bDisableFirst}
                              icon-name="utility:jump_to_left"
                              label="First"
                              alternative-text="first page"
                              onclick={firstPage}
                              class="slds-m-right_x-small">
                          </lightning-button>

                          <lightning-button
                              disabled={bDisableFirst}
                              icon-name="utility:chevronleft"
                              label="Previous"
                              alternative-text="Previous"
                              onclick={previousPage}
                              class="slds-m-right_x-small">
                          </lightning-button>

                          <span class="slds-badge slds-m-horizontal_x-small">
                              Showing {pageNumber} of {totalPages} Page(s)
                          </span>

                          <lightning-button
                              disabled={bDisableLast}
                              icon-name="utility:chevronright"
                              label="Next"
                              alternative-text="Next"
                              onclick={nextPage}
                              icon-position="right"
                              class="slds-m-left_x-small">
                          </lightning-button>

                          <lightning-button
                              disabled={bDisableLast}
                              icon-name="utility:jump_to_right"
                              label="Last"
                              alternative-text="last page"
                              onclick={lastPage}
                              icon-position="right"
                              class="slds-m-left_x-small">
                          </lightning-button>

                      </div>

                      <!-- Total records -->
                      <div class="slds-clearfix">
                          <div class="slds-float_right">
                              <span class="slds-badge">
                                  Total Records: {totalRecords}
                              </span>
                          </div>
                      </div>

                  </div>
              </div>
              
            </template>
          </div>
        </template>
      </template>

      <template if:true={generatedflag}>
        <div>
          <div style="padding: 1% 1% 0 2%">
            <header class="bulk-action-header">
                <div class="table-title table-header">{participantPreferredName} Invoices</div>
                <div class="action-section" style="padding-bottom:1%; display:flex; gap:12px; align-items:center; flex-wrap:nowrap;">
                      <div style="min-width:180px;">
        <div class="floating-label-new">
            <span class="label-text-drop">Plan Type</span>
            <lightning-combobox
                value={invoicePlanType}
                options={planTypeOptions}
                onchange={handleInvoicePlanTypeChange}
                variant="label-hidden">
            </lightning-combobox>
        </div>
    </div>
                    <div style="min-width:200px;">
                        <div class="floating-label-new">
                            <span class="label-text-drop">{participantPreferredName}</span>
                            <c-tesseract-apps-multi-combobox
                                placeholder="Select Participants"
                                options={ParticipantOptions}
                                value={invoicePartcipantIdList}
                                onchange={handleInvoiceParticipantChange}>
                            </c-tesseract-apps-multi-combobox>
                        </div>
                    </div>
                    <template if:true={showExportCSV}>
                        <lightning-button
                            label="Export CSV"
                            title="Export CSV"
                            variant="brand"
                            onclick={handleExportCSV}
                            class="slds-m-left_small">
                        </lightning-button>
                    </template>
                    <lightning-button
                        variant="brand"
                        label="Bulk Action"
                        title="Bulk Action"
                        onclick={handleBulkInvoiceEmail}
                        disabled={disableBulkInvoice}>
                    </lightning-button>
                </div>
            </header>
        </div>
          <template if:true={noRecordsInvoiceFlag}>

            <div class="no-data">
              <p>No records found</p>
            </div>
          </template>
          <template if:false={noRecordsInvoiceFlag}>
            <div style="padding: 0 1% 1% 1%">

              <div class="listview custom-scroll yourInvoiceTable">
                <div class={tableContainerClass}>
                    <!-- HEADER (FIXED) -->
                    <div class="header-wrapper">
                        <table class="staff-table">
                            <thead>
                                <tr>

                                    <!-- SELECT ALL -->
                                    <th class="table-th tableCheckbox">
                                        <lightning-input
                                            type="checkbox"
                                            variant="label-hidden"
                                            checked={isIssuedHeaderChecked}
                                            onchange={handleSelectAllInvoices}>
                                        </lightning-input>
                                    </th>

                                    <th class="table-th">Invoice No</th>
                                    <th class="table-th">{participantPreferredName} Name</th>
                                    <th class="table-th">Entity Name</th>
                                    <th class="table-th">Ledger Item</th>
                                    <th class="table-th">Date Generated</th>
                                    <th class="table-th">GST</th>
                                    <th class="table-th">Amount</th>
                                    <th class="table-th">Status</th>
                                    <template if:true={accountingServiceflag}>
                                      <th class="table-th">{accountingStatusLabel}</th>
                                    </template>
                                    <th class="table-th">Invoice Type</th>
                                    <th class="table-th center">Action</th>

                                </tr>
                            </thead>
                        </table>
                    </div>
                    <!-- BODY -->
                    <div class="table-body custom-scroll">
                        <table class="staff-table">
                            <tbody>

                                <template for:each={issuedPageList} for:item="invoice">
                                    <tr key={invoice.Id} class="table-row">

                                        <!-- ROW CHECKBOX -->
                                        <td class="table-td tableCheckbox">
                                            <lightning-input
                                                type="checkbox"
                                                variant="label-hidden"
                                                checked={invoice.isChecked}
                                                data-id={invoice.Id}
                                                onchange={handleBulkInvoiceCheckboxChange}>
                                            </lightning-input>
                                        </td>

                                        <td class="table-td" title={invoice.invoiceNo}>{invoice.invoiceNo}</td>

                                        <td class="table-td">{invoice.fileReference}</td>

                                        <!-- <td class="table-td">{invoice.invoiceEntityName}</td> -->
                                        <td class="table-td generatedtabledropdown">
                                              <template if:true={invoice.isEditingEntity}>
                                                <div class="qty-edit-container">
                                                  <!-- <lightning-combobox
                                                      variant="label-hidden"
                                                      value={invoice.invoiceEntityName}
                                                      options={entityOptions} 
                                                      data-id={invoice.Id}
                                                      onchange={handleEntityChange}
                                                      class="qty-value">
                                                  </lightning-combobox> -->

                                                  <c-tesseract-apps-single-combobox
                                                      variant="label-hidden"
                                                      value={invoice.invoiceEntityName}
                                                      options={entityOptions} 
                                                      data-id={invoice.Id}
                                                      onchange={handleEntityChange}
                                                      class="qty-value">
                                                  </c-tesseract-apps-single-combobox>
                                                    <a
                                                      href="javascript:void(0)"
                                                      class="save-link"
                                                      title="Save"
                                                      data-id={invoice.Id}
                                                      onclick={saveentityRow}
                                                    >
                                                      <i class="material-icons save-icon"
                                                        >check</i
                                                      >
                                                    </a>
                                                </div>
                                              </template>

                                              <template if:false={invoice.isEditingEntity}>
                                                <div class="qty-edit-container">
                                                  <span class="qty-value-myob"
                                                    >{invoice.invoiceEntityName}</span
                                                  >
                                                  <template if:true={invoice.isXeroInvoiceMissing}>
                                                    <a
                                                      href="javascript:void(0)"
                                                      data-id={invoice.Id}
                                                      onclick={enableEntityEdit}
                                                      title="Edit Entity"
                                                    >
                                                      <i class="material-icons edit-icon"
                                                        >edit</i
                                                      >
                                                    </a>
                                                  </template>
                                                </div>
                                              </template>
                                        </td>

                                        <td class="table-td">{invoice.entityLedgerItem}</td>

                                        <td class="table-td">{invoice.invoiceDate}</td>

                                        <td class="table-td">
                                            <lightning-formatted-number
                                                value={invoice.GST__c}
                                                format-style="currency"
                                                currency-code="AUD"
                                                minimum-fraction-digits="2"
                                                maximum-fraction-digits="2">
                                            </lightning-formatted-number>
                                        </td>

                                        <td class="table-td">
                                            <lightning-formatted-number
                                                value={invoice.Total_Amount__c}
                                                format-style="currency"
                                                currency-code="AUD"
                                                minimum-fraction-digits="2"
                                                maximum-fraction-digits="2">
                                            </lightning-formatted-number>
                                        </td>

                                        <td class="table-td">{invoice.Status__c}</td>
                                        <template if:true={accountingServiceflag}>
                                          <td class="table-td">{invoice.xeroInvoiceStatus}</td>
                                        </template>

                                        <td class="table-td">{invoice.invoiceType}</td>

                                        <!-- ACTIONS -->
                                        <td class="table-td action-col center">

                                            <div class="center">

                                               <a 
                                                    href={invoice.amazonUrl}
                                                    data-id={invoice.Id}
                                                    data-url={invoice.amazonUrl}
                                                    onclick={handleView}
                                                    title="View Invoice"
                                                    >
                                                    <i class="material-icons view-icon">visibility</i>
                                                </a>
                                                <a 
                                                  href={invoice.amazonUrl}
                                                  data-id={invoice.Id}
                                                  data-url={invoice.amazonUrl}
                                                  onclick={handleCancel}
                                                  title="Cancel Invoice">
                                                    <i class="material-icons view-icon">cancel</i>
                                                </a>

                                                  <a href={invoice.amazonUrl}
                                                  data-id={invoice.Id}
                                                  data-url={invoice.amazonUrl}
                                                  onclick={handleDownload}
                                                  title="Download Invoice" 
                                                  >
                                                    <i class="material-icons view-icon">download</i>
                                                </a>
                                               
                                 &nbsp;  <!--href="javascript:void(0)" -->   <!-- data-invoicetype={invoice.invoiceType} data-entryid={invoice.entryId} data-startdate={invoice.invoiceStartDate}  
                                    data-enddate={invoice.invoiceEndDate}    -->
                                 <a      
                                    href="javascript:void(0)"
                                    data-id={invoice.Id} 
                                    data-url={invoice.amazonUrl}  
                                    data-status={invoice.Status__c}
                                    data-invoicedate={invoice.invoiceDate}
