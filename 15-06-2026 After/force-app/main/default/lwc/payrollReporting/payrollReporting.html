<template>
  
    <div>
        <template if:true={isHome}>
            <div style="top:25px;">
                <lightning-accordion allow-multiple-sections-open class="accordionClass" active-section-name="Organisation Details">
                    <lightning-accordion-section name="Organisation Details" label="Organisation Details" >
                        <div>
                            <div style="margin-left: 5%;margin-top:2%;">
                                <lightning-record-view-form record-id={Picklist_Value} object-api-name={objectApiName}
                                    mode="view" onsubmit={handleSubmit}>
                                    <div class="slds-grid slds-wrap">
                                        <div class="slds-size_1-of-2">
                                            <div class="slds-m-right_medium slds-m-left_medium">
                                                <lightning-output-field field-name="Name"></lightning-output-field>
                                            </div>
                                        </div>
                                        <div class="slds-size_1-of-2">
                                            <div class=" slds-m-left_large">
                                                <lightning-output-field field-name="ABN__c"></lightning-output-field>
                                            </div>
                                        </div>                                
                                        <div class="slds-size_1-of-2">
                                            <div class="slds-m-right_medium slds-m-bottom_medium slds-m-left_medium">
                                                <lightning-icon icon-name="utility:call" variant="error" size="x-small"
                                                    class="btnIconOverlay"></lightning-icon>
                                                <lightning-output-field field-name="Contact_No__c"></lightning-output-field>
                                            </div>
                                        </div>
                                        <div class="slds-size_1-of-2">
                                            <div class="slds-m-left_large">
                                                <lightning-icon icon-name="utility:email" variant="error" size="x-small"
                                                    class="btnIconOverlayemail"></lightning-icon>
                                                <lightning-output-field field-name="Email__c"></lightning-output-field>
                                            </div>
                                        </div>
                                        <div class="slds-size_1-of-2">
                                            <div class="slds-m-right_medium  slds-m-left_medium">
                                                <lightning-output-field field-name="Address__c"></lightning-output-field>
                                            </div>
                                        </div>
                                    </div>
                                </lightning-record-view-form>
                            </div><br/>
                        </div>                
        
                        <div class="slds-grid" style="margin-bottom:20px;">

                                <div> <lightning-input type="date" name="sdate"
                                        value={sdate} label="Start Date" onchange={hadleDates}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-size_1-of-5">
                                <div class="slds-m-left_small"> <lightning-input type="date" value={edate}
                                        name="edate" label="End Date" onchange={hadleDates}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-size_1-of-5">
                                <lightning-combobox  name="Facility" class="slds-m-left_small"
                                label="Name of the Facility" required="true" value={selectedFacilityValue} placeholder="Select Facility"
                                options={facilityOptions} onchange={hadleDates}>
                            </lightning-combobox>
                            </div>&emsp;          
                            <p class="slds-m-top--large">
                                <lightning-button variant="brand" label="Export Report" title="Export Report" onclick={downloadWagesExcel}></lightning-button><!--downloadExpenseExcel  downloadWagesExcel-->

                            <div  style="margin-top:25px; margin-left:20px;">
                                <lightning-button label="Import Statement" variant="brand" onclick={handleNavigateImport}></lightning-button>
                            </div> 
                            <!-- <div  style="margin-top:25px; margin-left:20px;">
                                <lightning-button label="Activity Statement" variant="brand" onclick={handleNavigateActivityStatement}></lightning-button>
                            </div>   -->     
                        </div>
                    </lightning-accordion-section>
                    <lightning-accordion-section name="Activity Statement" label="Activity Statement" >

                            <div style="margin-left:85%;margin-top:10px;margin-bottom:2%;">
                                <lightning-button style="margin-right: 5px;" variant="brand" label="Add New" onclick={handleCreate}></lightning-button>

                                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                                    </svg>
                                </button> 
                            </div>

                                <div class="slds-size_1-of-5">

                                </lightning-combobox>
                                </div> 
                                <div class="slds-size_1-of-5" >
                                    <div class="slds-m-left_small"> <lightning-input type="date" name="sdate1"
                                            value={startDatainputvalue} label="Start Date" onchange={hadleFormtypeChange}></lightning-input>
                                    </div>
                                </div>
                                <div class="slds-size_1-of-5">
                                    <div class="slds-m-left_small"> <lightning-input type="date" value={endDateinputvalue}
                                            name="edate1" label="End Date" onchange={hadleFormtypeChange}></lightning-input>
                                    </div>
                                </div> &nbsp;&nbsp;&nbsp;
                               <!--  <lightning-button style="margin-top: 25px;margin-right:2px;" variant="brand" label="Search" slot="actions" title="Search Form Type" onclick={handleSearch} class="slds-float_right slds-var-m-top_x-large "></lightning-button> --> &nbsp;&nbsp;
                                <lightning-button style="margin-top:25px;margin-right:5px;" variant="brand" label="Clear" slot="actions" title="Clear Form Type" onclick={handleClear} class="slds-float_right slds-var-m-top_x-large "></lightning-button>
                            </div>
                            
                            <template if:true={staffexpensesData}>
                                <div class="slds-grid">
                                    <div style="margin-left:-1%;margin-right:2%;width:100%;margin-top:2%">
                                        <table class="slds-table" style="table-layout: fixed;">
                                            <thead>
                                                <tr>
                                                    <th class="slds-cell-wrap th">Form Type</th>
                                                    <th class="slds-cell-wrap th">Start Date</th>
                                                    <th class="slds-cell-wrap th">End Date</th>                                  
                                                    <th class="slds-cell-wrap th">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={Listofdata_Pagination} for:item="acc">
                                                    <tr key={acc.Id} class="tr1">
                                                        <td class="slds-cell-wrap description"> {acc.formType}</td>
                                                        <td class="slds-cell-wrap">{acc.startDate}</td>                                        
                                                        <td class="slds-cell-wrap">{acc.endDate}</td>                                        
                                                        <td>
                                                            <div>
                                                                <a href={acc.amazonUrl} data-id={acc.Id} data-url={acc.Amazon_URL__c}  
                                                                onclick={handleView} title="View Statement">View</a> &nbsp;
                                                                | &nbsp;
                                                                <a href="javascript:void(0)" data-id={acc.Id} data-type={acc.Form_Type__c} target="_blank"
                                                                        onclick={handleEdit} title="View Statement">Edit</a>
                                                            </div>                                                        
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <!--Pagination Start-->
                                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;width:95%;margin-left:2%">
                                    <!-- RECORDS PER PAGE -->
                                    <div class="slds-col">
                                        <div class="slds-list_inline ">
                                            <span style="margin-right:5px;margin-top:5px;">Page Size:</span>
                                            <label class="slds-text-color_weak" for="recordsPerPage"></label>
                                            <div class="slds-select_container">
                                                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                                    <template for:each={pageSizeOptions} for:item="option">
                                                        <option key={option} value={option}>{option}</option>
                                                    </template> 
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- PAGE NAVIGATION -->
                                    <div class="slds-align_absolute-center" style="height:5rem;">
                                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" alternative-text="first page" onclick={firstPage} style="margin-right:10px;"></lightning-button><!--class="slds-p-horizontal_x-small" -->
                                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage} style="margin-right:5px;"></lightning-button>
                                        &nbsp;
                                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                                        &nbsp;
                                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                                    </div>
                                    <!-- TOTAL RECORDS -->
                                    <div class="slds-clearfix">
                                        <div class="slds-float_right">
                                            <span class="slds-badge"> Total Records: {totalRecords}</span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template if:true={staffexpensesNoData}>
                                <div class="slds-m-around_large slds-p-left_x-large" style="color:green;">
                                    <b>There is no activity statements</b>
                                </div>
                            </template>
                        </template>               
                        
                    </lightning-accordion-section>
                </lightning-accordion>            
            </div>    
        </template>

                                        <lightning-input-field field-name="Amount_Withheld_Where_no_ABN_is_Quoted__c" required="true" name="amount2" value={paygAmountW2} onchange={handleValueChange}></lightning-input-field>
                                        <lightning-input-field field-name="Other_Amounts_Withheld__c" required="true" value={paygAmountW4} name="amount4" onchange={handleValueChange}></lightning-input-field>
                                    </div>
                                </div>
                                <div style="float:right;margin-top:10px;width:55%;">
                                    <lightning-button type="submit" variant="brand" label="Save" style="margin-left: 1%;" disabled={saveButtonDisable}></lightning-button>&nbsp;&nbsp;
                                    <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                                </div>
                            </div>
                            <div if:true={ZBas}>
                                <lightning-messages></lightning-messages>
                                <div class="slds-grid slds-p-around_medium border">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="Start_Date__c" name="start" value={startDate} required="true" onchange={handleStartDateChange}></lightning-input-field>
                                        <lightning-input-field field-name="Client_Name__c" value={orgname} required="true" disabled="true"></lightning-input-field>
                                        <lightning-input-field field-name="Document_Id__c"></lightning-input-field>
                                        <lightning-input-field field-name="PAYG_Tax_Withheld__c" required="true"></lightning-input-field>                                       
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="End_Date__c" name="end" value={endDate} required="true" onchange={handleStartDateChange}></lightning-input-field>
                                        <lightning-input-field field-name="TFN__c"></lightning-input-field>
                                        <lightning-input-field field-name="ABN__c" value={abn} disabled="true"></lightning-input-field>
                                        <lightning-input-field field-name="Nothing_due_or_Refundable__c" required="true"></lightning-input-field>                                       
                                    </div>
                                </div>
                                <div style="float:right;margin-top:10px;width:55%;">
                                    <lightning-button type="submit" variant="brand" label="Save" style="margin-left: 1%;" disabled={saveButtonDisable}></lightning-button>&nbsp;&nbsp;
                                    <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                                </div>
                            </div>

                        </div>                     
                    </div> <br/><br/>
                    
                </lightning-record-edit-form>  
            </div>
