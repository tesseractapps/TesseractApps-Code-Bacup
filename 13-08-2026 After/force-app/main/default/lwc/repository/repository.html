    <div class="slds-grid slds-grid_vertical-align-center slds-p-horizontal_medium slds-m-bottom_medium">

        <!-- Search -->
        <div class="slds-size_4-of-12 slds-p-right_small">

        </div>

        <!-- Type Filter -->
        <div class="slds-size_2-of-12">

                onchange={handleTypeFilter}

      <div class="content-wrapper">
        <div class="table-container custom-scroll" style="padding: 1%;">

          <!-- Table -->
         <template if:false={noRecordsFlag}>
            <template if:true={isDocTypeView}>
                <template for:each={data} for:item="group">
                <!--  <template if:true={group.attachmentCount}> -->
                    <div key={group.key} class="staff-card">

                        <!-- DOCUMENT TYPE HEADER -->
                        <div class="staff-header"
                            data-id={group.key}
                            onclick={toggleSection}>
                            <div class="left">
                                <span class="material-icons arrow">
                                    <template if:true={group.expand}>keyboard_arrow_down</template>
                                    <template if:false={group.expand}>keyboard_arrow_right</template>
                                </span>

                                <span class="doc-type-title">
                                    {group.documentTypeName}
                                </span>          

                                <span class="doc-count">
                                    {group.attachmentCount} document
                                </span>
                                
                                <template if:true={isExec}>
                                    <template if:true={group.showEdit}>
                                        <span class="material-icons edit-folder-icon"
                                            data-type={group.key}
                                            onclick={handleEditFolder}>
                                            edit
                                        </span>
                                    </template>

                                    <template if:true={group.showDelete}>
                                        <span class="material-icons delete-icon"
                                            data-type={group.key}
                                            onclick={handleDeleteFolder}>
                                            delete
                                        </span>
                                    </template>
                                </template>
                            </div>
                        </div>

                        <!-- EXPANDED -->
                        <template if:true={group.expand}>

                            <!-- 🔴 MISSING LOOP – THIS IS REQUIRED -->
                            <template for:each={group.repositories} for:item="repo">

                                <!-- SAFETY CHECK -->
                                <template if:true={repo.Repository_Attachments__r}>

                                    <!-- ONE ROW PER ATTACHMENT -->
                                    <template for:each={repo.Repository_Attachments__r} for:item="att">
                                        <div key={att.Id} class="doc-row">

                                            <!-- LEFT (PARENT INFO) -->
                                            <div class="doc-left">
                                                <div class="doc-title">
                                                <template if:false={isExec}>
                                                    <span class="file-name" title={att.File_Name__c}>
                                                        {att.File_Name__c}
                                                    </span>&nbsp;
                                                </template>
                                                <template if:true={isExec}>
                                                    <a href="javascript:void(0);"
                                                        data-id={repo.Id}
                                                            data-child={att.Id}
                                                        onclick={handleShowRepositoryHistory}
                                                        class="repo-link">
                                                        {repo.Name}
                                                    </a>
                                                </template>
                                                    <span class="file-size">
                                                        {att.Size__c}
                                                    </span>

                                                </div>
                                            
                                                <!-- <div class="doc-meta">
                                                    Uploaded by {repo.User_Name__c}
                                                    • {repo.Date_Format__c} • {repo.Comments__c}
                                                </div> -->
                                                <div class="doc-meta">
                                                    <span class="uploaded-by">
                                                        Uploaded by {repo.User_Name__c}
                                                    </span>
                                                    <span class="separator"> • </span>
                                                    <span class="uploaded-date">
                                                        {repo.Date_Format__c}
                                                    </span>
                                                    <span class="separator"> • </span>
                                                    <span class="doc-comments" title={repo.Comments__c}>
                                                        {repo.Comments__c}
                                                    </span>
                                                </div>

                                            </div>

                                            <!-- RIGHT (CHILD) -->
                                            <div class="doc-actions inline-attachments">
                                                <div class="attachment-pill">

                                                    <!-- <span class="file-name" title={repo.Name}>
                                                        {repo.Name}
                                                    </span> -->

                                                    <template if:true={att.HasReadAccess}>
                                                        <span class="material-icons view-icon"
                                                            data-url={att.Awsurl__c}  data-child={att.Id}  data-id={repo.Id}
                                            
                                                            data-key={att.key__c}
                                                            onclick={handleView} title="View">
                                                            visibility
                                                        </span>
                                                    </template>

                                                    <template if:true={att.HasEditAccess}>
                                                        <span class="material-icons edit-icon"
                                                            data-id={repo.Id}
                                                            data-child={att.Id} 
                                                            data-key={att.key__c}
                                                            onclick={handleEdit} title="Edit">
                                                            edit_document
                                                        </span>
                                                    </template>

                                                    <template if:true={isExec}>
                                                        <span class="material-icons rule-icon"
                                                            data-id={repo.Id}
                                                                data-child={att.Id} 
                                                                onclick={handlePermission}
                                                                title="Permissions">
                                                            passkey
                                                        </span>

                                                        <span class="material-icons rule-icon"
                                                                data-id={repo.Id}
                                                                data-child={att.Id} 
                                                                onclick={handleConsent} title="Consent">
                                                                assignment_turned_in
                                                        </span>
                                                        
                                                        <span class="material-icons archive-icon"
                                                                data-id={repo.Id}
                                                                data-child={att.Id}
                                                                onclick={handleArchive}
                                                                title="Archive">
                                                            archive
                                                        </span>
            
                                                    </template>

                                                    <template if:true={att.HasDeleteAccess}>
                                                        <span class="material-icons delete-icon"
                                                            data-id={att.Id}  data-child={att.Id} 
                                                            data-key={att.key__c}
                                                            onclick={handleDeleteattachment} title="Delete">
                                                            delete
                                                        </span>
                                                    </template>

                                                </div>
                                            </div>

                                        </div>
                                    </template>

                                </template>
                            </template>

                        </template>
                    </div>
                    <!-- </template> -->
                </template>
            </template>
        </template>


          <!-- No Records -->
          <template if:true={noRecordsFlag}>
            <div class="no-data">
              <p>No records found</p>
            </div>
          </template>

        </div>
      </div>
    </template>

          </div>

          <div class="slds-clearfix -m-right_xx-large">

                  <span class="slds-badge"> Total Records: {totalRecords}</span>
                </div>

                                    <th class="slds-cell-wrap th table-th" title="User Type">User Type</th>
                                    <th class="slds-cell-wrap th table-th" title="Email ID">Email ID</th>

                                            <lightning-input
                                                type="checkbox"
                                                checked={isAllViewSelected}
                                                onchange={handleSelectAllView}

                                                type="checkbox"
                                                checked={isAllConsentSelected}
                                                onchange={handleSelectAllConsent}

                                            <span class="slds-m-left_x-small">Consent Required</span>
                                        </div>
                                    </th>
                                </tr>

                                <template for:each={finalUsers} for:item="user">

                                        <td class="slds-cell-wrap description table-td" title={user.staffName}>{user.staffName}</td>
                                        <td class="slds-cell-wrap description table-td" title={user.User_Type__c}>{user.User_Type__c}</td>
                                        <td class="slds-cell-wrap description table-td" title={user.Email}>{user.Email}</td> 
                                        <td class="table-td" title="View Access"><lightning-input type="checkbox" data-id={user.Id} data-type="view" checked={user.hasViewPermission} onchange={handleUserPermissionChange}></lightning-input></td>
                                        <td class="table-td" title="Consent Required">
                                            <lightning-input
                                                type="checkbox"
                                                data-id={user.Id}
                                                data-type="consent"
                                                checked={user.consentRequired}

                                            </lightning-input>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table> 
                        </div>
                        </div>
                    </template>
                </div>
                
                <!-- Fixed Footer at the bottom -->
                <div class="fixed-pagination" style="padding: 10px 2%; flex-shrink: 0; background-color: #F3F5F7;">
                    <!-- Table Pagination -->
                    <template if:true={userListTable}>
                        <template if:false={noRecordsFlag1}>
                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-bottom: 8px;">
                                <!-- RECORDS PER PAGE -->
                                <div class="slds-col">
                                    <div class="slds-list_inline">
                                        <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage1">Page Size:</label>
                                        <div class="slds-select_container">
                                            <select class="slds-select" id="recordsPerPage1" onchange={handleRecordsPerPage1}>
                                                <template for:each={pageSizeOptions1} for:item="option">
                                                    <option key={option} value={option}>{option}</option>
                                                </template>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <!-- PAGE NAVIGATION -->
                                <div class="slds-align_absolute-center">
                                    <lightning-button disabled={bDisableFirst1} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" onclick={firstPage1}></lightning-button>
                                    <lightning-button disabled={bDisableFirst1} icon-name="utility:chevronleft" label="Previous" onclick={previousPage1}></lightning-button>
                                    &nbsp;
                                    <span class="slds-badge">Showing {pageNumber1} of {totalPages1}</span>
                                    &nbsp;
                                    <lightning-button disabled={bDisableLast1} icon-name="utility:chevronright" label="Next" onclick={nextPage1} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                    <lightning-button disabled={bDisableLast1} icon-name="utility:jump_to_right" label="Last" onclick={lastPage1} icon-position="right"></lightning-button>
                                </div>
                                <!-- TOTAL RECORDS -->
                                <div class="slds-clearfix">
                                    <div class="slds-float_right">
                                        <span class="slds-badge">Total: {totalRecords1}</span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>
                    
                    <!-- Permissions Action Buttons -->
                    <div class="permissions" style="border-top: 1px solid #ddd; padding-top: 8px; margin-top: 0;">
                        <div style="flex: 1; display: flex; justify-content: flex-start; align-items: center;">
                            <template if:true={isViewEnable}> 
                                <lightning-input type="checkbox" name="view" label="View" onclick={handlePermissionChange} ></lightning-input>
                            </template>
                        </div> 
                        <div style="flex: 1; display: flex; justify-content: flex-end; gap: 10px;">
                            <lightning-button label="Cancel" variant="brand-outline" onclick={hideModalBox} ></lightning-button>
                            <lightning-button label="Submit" variant="brand" onclick={handleSubmitPermissions} disabled={saveDisabled}></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
      </template>
    
  </div>
  <template if:true={DeleteFlag}>

          class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
      
          <div class="slds-modal__container modal-container" style="max-width:25%;">
          <header class="slds-modal__header" style="background: #002A52;">
              
              <h2 class="slds-text-heading_medium slds-hyphenate" style="color:white;font-weight:bold;text-align:center;">Please Confirm</h2>
          </header> 
          <div class="slds-modal__content slds-p-around_medium modal-content" >

 <template if:true={showLoadingSpinner}>

                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />

    <template if:true={showFormHistoryModal}>
        <div class="incident-history-backdrop">
            <div class="incident-history-modal">

            <!-- Header -->
            <div class="incident-history-header">
                <h2 class="slds-text-heading_medium h2custom">
                    Document History
                </h2>
                <button
                class="incident-history-close"
                onclick={closeFormHistory}
                aria-label="Close"
                >
                ×
                </button>
            </div>

            <!-- Timeline -->
            <div class="history-timeline custom-scroll">

                <template for:each={groupedFormHistory} for:item="group">
                <div key={group.date} class="history-date-section">

                    <div class="history-date-label">
                    {group.date}
                    </div>

                    <template for:each={group.entries} for:item="entry">
                    <div key={entry.timestamp} class="history-entry">

                        <!-- Left rail -->
                        <div class="entry-time">
                        <span class="timeline-dot"></span>
                        {entry.time}
                        </div>

                        <!-- Content -->
                        <div class="entry-content">
                        <div class="entry-header">
                            <div class="avatar-circle">
                            {entry.initials}
                            </div>

                            <div class="entry-meta">
                            <span class="entry-user">
                                {entry.user}
                            </span>
                            <span class="entry-action">
                                {entry.action}
                            </span>
                            </div>
                        </div>

                        <lightning-formatted-rich-text
                            value={entry.changes}
                        ></lightning-formatted-rich-text>
                        </div>

                    </div>
                    </template>

                </div>
                </template>

                <template if:false={hasFormHistory}>
                <div class="no-history-message">
                    No history available.
                </div>
                </template>

            </div>
            </div>
        </div>
    </template>

    <!-- RENAME MODAL -->
    <template if:true={isRenameModalOpen}>
        <section role="dialog"
                tabindex="-1"
                aria-modal="true"
                class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header" style="background: #002A52;">
                    <h2 class="slds-text-heading_medium" style="color: white;">
                        Rename Folder
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-input
                        label="Folder Name"
                        value={renameValue}
                        maxlength="50"
                        onchange={handleRenameInputChange}
                        message-when-too-long="Maximum 50 characters allowed">
                    </lightning-input>

                    <template if:true={renameError}>
                        <div class="slds-text-color_error slds-m-top_x-small">
                            {renameError}
                        </div>
                    </template>

                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeRenameModal}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="Save"
                        class="slds-m-left_small"
                        onclick={handleRenameSave}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- DELETE CONFIRMATION MODAL -->
    <template if:true={isDeleteModalOpen}>
        <section role="dialog"
                tabindex="-1"
                aria-modal="true"
                class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header" style="background: #002A52;">
                    <h2 class="slds-text-heading_medium" style="color: white;">
                        Confirm Delete
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium" style="text-align: center;">
                    Are you sure you want to delete the folder
                    <strong> {folderToDelete}</strong>?
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeDeleteModal}>
                    </lightning-button>

                    <lightning-button
                        variant="destructive"
                        label="Delete"
                        class="slds-m-left_small"

                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    <template if:true={archiveModal}>
        <section
            class="slds-modal slds-fade-in-open"
            role="dialog">
            <div class="slds-modal__container modal-custom">
                <!-- HEADER -->
                <header class="slds-modal__header headercustom modal-header-custom"> 
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom title-center">
                        Archived Documents
                    </h2>
                    <button
                        class="slds-button slds-button_icon close-btn"
                        title="Close"
                        onclick={closeArchiveModal}>

                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="close"
                            size="small">
                        </lightning-icon>
                    </button>  
                </header>

                <!-- BODY CONTENT --> 
                <div class="slds-modal__content slds-p-around_small custom-scroll"> 
                    
                    <div class="slds-m-bottom_small slds-size_1-of-2">
                        <lightning-input
                            type="search"
                            label="Search Documents"
                            placeholder="Search by Name or Type of Doc"
                            value={archiveSearchKey}
                            onchange={handleArchiveSearch}>
                        </lightning-input>
                    </div>

                    <div class="table-container archive-table">

                    <!-- HEADER -->
                    <div class="header-wrapper">

                        <table class="staff-table">

                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Type of Document</th>
                                    <th>Archived Date</th>
                                    <th>Archived By</th>
                                    <th class="center">Actions</th>
                                </tr>
                            </thead>
                        </table>
                    </div>

                    <!-- BODY -->
                    <div class="custom-scroll attachmentTableHeight">
                        <table class="staff-table">
                            <tbody>
                                <template if:true={archivedRecords.length}>
                                    <template
                                        for:each={archivedRecords}
                                        for:item="file">
                                        <tr key={file.Id}>
                                            <td title={file.Name}>{file.Name}</td>
                                            <td title={file.Type}>{file.Type}</td>
                                            <td title={file.ArchivedDate}>{file.ArchivedDate}</td>
                                            <td title={file.ArchivedBy}>{file.ArchivedBy}</td>

                                            <td class="table-td center action-cell">

                                                <!-- VIEW -->
                                                <a href="javascript:void(0)"
                                                    data-url={file.FileUrl}
                                                    data-child={file.Id}
                                                    data-id={file.RepositoryId}
                                                    data-key={file.Key}
                                                    onclick={handleView}
                                                    title="View">

                                                    <i class="material-icons view-icon">
                                                        visibility
                                                    </i>
                                                </a>

                                                <!-- DOWNLOAD -->
                                                <a href="javascript:void(0)"
                                                    data-url={file.FileUrl}
                                                    data-child={file.Id}
                                                    data-id={file.RepositoryId}
                                                    data-key={file.Key}
                                                    onclick={handleArchiveDownload}
                                                    title="Download">

                                                    <i class="material-icons download-icon">
                                                        download
                                                    </i>
                                                </a>

                                                <!-- RESTORE -->
                                                <a href="javascript:void(0)"
                                                    data-id={file.RepositoryId}
                                                    data-child={file.Id}
                                                    data-key={file.Key}
                                                    onclick={handleRestore}
                                                    title="Restore">

                                                    <i class="material-icons unarchive-icon">
                                                        unarchive
                                                    </i>
                                                </a>

                                            </td>
                                        </tr>
                                    </template>
                                </template>

                                <template if:false={archivedRecords.length}>
                                    <tr>
                                        <td colspan="4" class="no-data">
                                            No archived documents found
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
                </div>
                <!-- FOOTER -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        onclick={closeArchiveModal}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
        <!-- <div class="blur-overlay-popup"></div> -->
    </template>
 

</template>
