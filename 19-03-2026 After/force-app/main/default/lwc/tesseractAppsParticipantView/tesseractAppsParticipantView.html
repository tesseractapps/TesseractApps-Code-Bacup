<template>
  <template if:true={participantDataflag}>
    <template if:true={participantData}>
      <div class="role-content">
        <div class="slds-table" style="background-color: transparent">
          <table
            class="slds-table slds-table_fixed-layout slds-table_resizable-cols weekly-table glow-hover table2"
            role="grid"
          >
            <thead>
              <tr>
                <td class={getFirstCellClass}>
                  <div class="staff-member">
                    <div class="floating-label-new">
                      <span class="label-text-drop">Search by Name</span>
                      <lightning-input
                        type="search"
                        variant="label-hidden"
                        value={searchName}
                        onchange={handleSearchName}
                      ></lightning-input>
                    </div>
                  </div>
                </td>

                <template
                  for:each={participantData.weekData}
                  for:item="weekDay"
                >
                  <td key={weekDay.date} class={weekDay.holidayColor}>
                    <div class={dayCellClass}>
                    <!-- <div class={weekDay.holidayColor}> -->
                    <div class="day-left">
                      <div class="day-name">{weekDay.day}</div>
                      <div class="day-date">{weekDay.UiFormattedDate}</div>
                    </div>

                    <!-- <p><b>{weekDay.day}</b> <br><b>{weekDay.UiFormattedDate}</b></p> -->
                    <div class="holiday-spacer-bottom">
                      <template if:true={weekDay.isHoliday}>
                        <div class="holiday-label" title={weekDay.holidayName}>
                          {weekDay.holidayName}
                        </div>
                      </template>
                    </div>
                    </div>
                  </td>
                </template>
              </tr>
            </thead>
          </table>
          <div class="calendar-part custom-scroll">
            <table
              class="slds-table slds-table_bordered slds-table_fixed-layout table1"
              role="grid"
            >
              <tbody>
                <template
                  for:each={participantData.Participnat}
                  for:item="participantdata"
                >
                  <tr key={participantdata.participantId}>
                    <!-- Staff Name and Info Column -->
                    <!-- <td style="width:16%"> -->
                    <td class={getStaffCellClass}>
                      <div
                        class="card"
                        data-id={participantdata.participantId}
                        draggable="true"
                        ondragstart={handleDragStart}
                      >
                        <div
                          class="avatar"
                          if:true={participantdata.profileUrl}
                        >
                          <lightning-avatar
                            variant="circle"
                            src={participantdata.profileUrl}
                            class="avatar-small"
                            fallback-icon-name="standard:person_account"
                          >
                          </lightning-avatar>
                        </div>
                        <div
                          class="avatar"
                          if:false={participantdata.profileUrl}
                        >
                          <lightning-icon
                            icon-name="action:user"
                            variant="error"
                            size="small"
                            style="background: #02275b"
                            class="avatar-small fallback-icon"
                          ></lightning-icon>
                        </div>
                        <div class={infoClass}>
                          <!-- <span class="name"
                          >{participantdata.firstName}&nbsp;{participantdata.lastName}</span
                        > -->
                          <span class={getNameClass}>{participantdata.fullName} </span>
                            <template if:true={participantdata.isNdisService}>
                                  <a
                            href="javascript:void(0);"
                            class="details"
                            style="color: black"
                            onclick={handleRiskNavigation}
                            data-participantid={participantdata.participantId}
                            data-typeofservice={participantdata.typeOfService}
                            >{participantdata.riskStatus}</a
                          >
                            </template>
                        
                          <!--   <span  class="details">{participantdata.riskStatus}</span >  -->
                          <span class="meta">
                            <lightning-formatted-number
                              value={participantdata.wages}
                              format-style="currency"
                              currency-code="AUD"
                              minimum-fraction-digits="2"
                              maximum-fraction-digits="2"
                            >
                            </lightning-formatted-number>
                          </span>
                        </div>
                      </div>
                    </td>
                    <template
                      for:each={participantdata.servicesByDay}
                      for:item="dayShift"
                    >
                      <td
                        key={dayShift.day}
                        class="day-cell"
                        ondragover={handleDragOver}
                        data-sizezero={dayShift.isSizeZeroFlag}
                        data-facvalue={participantdata.facilityIdValue}
                        ondrop={handleOpenParticipantShiftView}
                        data-participantid={participantdata.participantId}
                        data-weekname="{dayShift.day"
                        data-weekdate={dayShift.Shiftdate}
                        data-isholiday={dayShift.isHoliday}
                      >
                        <div class="day-cell-wrapper">
                          <div class={getIconContainerClass}>
                            <!-- day with no services -->
                            <template if:true={dayShift.isSizeZeroFlag}>
                              <div class="no-shifts">
                                <a
                                  href="javascript:void(0)"
                                  class="add-icon-link"
                                >
                                  <lightning-icon
                                    icon-name="utility:add"
                                    size="xx-small"
                                    style="transform: scale(0.7)"
                                    data-participantid={participantdata.participantId}
                                    data-facvalue={participantdata.facilityIdValue}
                                    data-weekname={dayShift.day}
                                    data-weekdate={dayShift.Shiftdate}
                                    data-isholiday={dayShift.isHoliday}
                                    onclick={handleOpenParticipantShiftView}
                                  >
                                  </lightning-icon>
                                </a>
                              </div>
                            </template>

                            <template if:false={dayShift.isSizeZeroFlag}>
                              <template if:false={dayShift.hasHovered}>
                                <div class="no-shifts1">
                                  <a
                                    href="javascript:void(0)"
                                    class="add-icon-link"
                                  >
                                    <i
                                      class={getAddIconClass}
                                      title="Add Shift"
                                      style="position: relative"
                                      data-participantid={participantdata.participantId}
                                      data-facvalue={participantdata.facilityIdValue}
                                      data-weekname={dayShift.day}
                                      data-weekdate={dayShift.Shiftdate}
                                      data-isholiday={dayShift.isHoliday}
                                      onclick={handleOpenParticipantShiftView}
                                      >add_circle</i
                                    >
                                  </a>
                                </div>
                              </template>
                            </template>

                            <!-- day with more than one services -->
                            <template if:false={dayShift.isSizeZeroFlag}>
                              <template if:true={dayShift.nonNdisMoreflag}>
                                <template if:false={dayShift.hasHovered}>
                                  <template
                                    for:each={dayShift.services}
                                    for:item="serv"
                                  >
                                    <div
                                      key={serv.Id}
                                      class={getIconItemClass}
                                      style={serv.inLineHeight}
                                      data-serviceid={serv.Id}
                                      data-participantid={participantdata.participantId}
                                      data-day={dayShift.Shiftdate}
                                    >
                                      <template if:true={isCompactView}>
                                        <div
                                          class="expanded-two-shift-row"
                                          style="
                                            display: flex;
                                            justify-content: space-between;
                                            align-items: flex-start;
                                            flex-direction: column;
                                          "
                                        >
                                          <div class="singleexp-details">
                                            <div class={getOverflowTextClass}>

                                            <div class="slds-grid slds-grid_vertical-align-center">
                                              <template
                                                if:true={serv.showSplitIcon}
                                              >
                                                <i
                                                  class={getTypeIconClass}
                                                  title="Split Shift"
                                                  >splitscreen_top</i
                                                >
                                              </template>
                                              <template
                                                if:true={serv.showGroupShiftIcon}
                                              >
                                                <i
                                                  class={getTypeIconClass}
                                                  title="Group Shift"
                                                  >group</i
                                                >
                                              </template>
                                              <template
                                                if:true={serv.showBrokenShiftIcon}
                                              >
                                                <i
                                                  class={getTypeIconClass}
                                                  title="Broken Shift"
                                                  >restaurant</i
                                                >
                                              </template>                                              
                                              <!-- {serv.serviceStaffName} -->
                                              <template
                                                if:true={serv.unassignedService}
                                              >
                                                <b>{serv.RoleName}</b>
                                              </template>
                                              <template
                                                if:false={serv.unassignedService}
                                              >
                                                <template
                                                  if:false={serv.serviceStaffName}
                                                >
                                                  <b>{serv.RoleName}</b>
                                                </template>

                                                <template
                                                  if:true={serv.serviceStaffName}
                                                >
                                                  <b>{serv.serviceStaffName}</b>
                                                </template>
                                              </template>
                                              </div>
                                            </div>

                                            <div class={getFontSizeClass}>
                                              <a
                                                href="javascript:void(0)"
                                                onclick={handleEditShiftScreen}
                                                 data-serviceid={serv.Id}
                                                data-participantid={participantdata.participantId}
                                                data-shiftstaffid={serv.shiftWithStaffId}
                                                style="color: inherit"
                                              >
                                                {serv.ShiftTime}
                                              </a>
                                            </div>

                                           
                                          </div>
                                        </div>

                                        <div
                                          class="statuspart"
                                          style="width: 100%"
                                        >
                                          <div
                                            class="slds-grid slds-grid_align-center slds-col"
                                          >
                                            <span class="status-gap">{serv.uiStatus} </span>
                                            <span class={serv.cssUiStatus}
                                              >&#x2B24;</span
                                            >
                                          </div>
                                        </div>
                                      </template>
                                      <template if:true={isExpandedView}>
                                        <div
                                          class="expanded-two-shift-row"
                                          style="
                                            display: flex;
                                            justify-content: space-between;
                                            align-items: flex-start;
                                            flex-direction: column;
                                          "
                                        >
                                          <div class="singleexp-details">
                                            <div class="overflowtext">
                                              <!-- {serv.serviceStaffName} -->

                                            <div class="slds-grid slds-grid_vertical-align-center">
                                              <template
                                                if:true={serv.showSplitIcon}
                                              >
                                                <i
                                                  class={getTypeIconClass}
                                                  title="Split Shift"
                                                  >splitscreen_top</i
                                                >
                                              </template>
                                              <template
                                                if:true={serv.showGroupShiftIcon}
                                              >
                                                <i
                                                  class={getTypeIconClass}
                                                  title="Group Shift"
                                                  >group</i
                                                >
                                              </template>
                                              <template
                                                if:true={serv.showBrokenShiftIcon}
                                              >
                                                <i
                                                  class={getTypeIconClass}
                                                  title="Broken Shift"
                                                  >restaurant</i
                                                >
                                              </template>


                                              <template
                                                if:true={serv.unassignedService}
                                              >
                                                <b>{serv.RoleName}</b>
                                              </template>
                                              <template
                                                if:false={serv.unassignedService}
                                              >
                                                <template
                                                  if:false={serv.serviceStaffName}
                                                >
                                                  <b>{serv.RoleName}</b>
                                                </template>

                                                <template
                                                  if:true={serv.serviceStaffName}
                                                >
                                                  <b>{serv.serviceStaffName}</b>
                                                </template>
                                              </template>
                                              </div>
                                            </div>

                                            <div class="overflowtext">
                                              <a
                                                href="javascript:void(0)"
                                                onclick={handleEditShiftScreen}
                                                 data-serviceid={serv.Id}
                                                data-participantid={participantdata.participantId}
                                                data-shiftstaffid={serv.shiftWithStaffId}
                                                style="color: inherit"
                                              >
                                                {serv.ShiftTime}
                                              </a>
                                            </div>

                                            <!-- <div class="overflowtext">
                                              {serv.Facility}
                                            </div> -->

                                            <div class="overflowtext">
                                              {serv.ShiftStreet},{serv.ShiftCity}
                                            </div>

                                            <div class="singleexp-detail-row">
                                              <span class="singleexp-label"
                                                >Services:</span
                                              >
                                              <span class="overflowtext"
                                                >{serv.serviceTypeName}</span
                                              >
                                            </div>

                                            <div class="singleexp-detail-row">
                                              <span class="singleexp-label"
                                                >Notes:</span
                                              >
                                              <span
                                                class="overflowtext"
                                                style="white-space: normal"
                                                >{serv.Notes}</span
                                              >
                                            </div>
                                          </div>
                                        </div>
                                        <div
                                          class="statuspart"
                                          style="width: 100%"
                                        >
                                          <div
                                            class="slds-grid slds-grid_align-center slds-col"
                                          >
                                            <span class="status-gap">{serv.uiStatus} </span>
                                            <span class={serv.cssUiStatus}
                                              >&#x2B24;</span
                                            >
                                          </div>
                                        </div>
                                      </template>
                                    </div>
                                  </template>
                                </template>
                              </template>
                            </template>
                          </div>
                        </div>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>
  </template>
  <template if:true={isTooltip}>
    <div
      class="tooltip"
      style={shiftTooltipInformation.position}
      onclick={stopPropagation}
    >
      <span class="close-icon" onclick={closeTooltip}>✖</span>

      <div class="top-recordToopTip">
        <!-- Left Side: Image or Icon -->
        <template if:false={shiftTooltipInformation.servicestaffimage}>
          <lightning-icon
            icon-name="standard:user"
            alternative-text="user"
            size="small"
            title="user"
            class="toolTipIcon"
            data-id={shiftTooltipInformation.serviceid}
            data-shifttime={shiftTooltipInformation.shiftTime}
            data-staffname={shiftTooltipInformation.staffname}
            data-servicestaffimage={shiftTooltipInformation.serviceStaffImage}
            data-participantid={shiftTooltipInformation.participantid}
            data-shiftstaffid={shiftTooltipInformation.shiftstaffid}
            onclick={showTooltip}
          >
          </lightning-icon>
        </template>

        <template if:true={shiftTooltipInformation.servicestaffimage}>
          <lightning-avatar
            variant="circle"
            src={shiftTooltipInformation.servicestaffimage}
            initials="P"
            fallback-icon-name="standard:person_account"
            data-id={shiftTooltipInformation.serviceid}
            data-shifttime={shiftTooltipInformation.shiftTime}
            data-staffname={shiftTooltipInformation.staffname}
            data-servicestaffimage={shiftTooltipInformation.serviceStaffImage}
            data-participantid={shiftTooltipInformation.participantid}
            data-shiftstaffid={shiftTooltipInformation.shiftstaffid}
            onclick={showTooltip}
            class="toolTipAvatar"
          >
          </lightning-avatar>
        </template>

        <!-- Right Side: Name & Shift Time -->
        <div class="service-detailstooltip">
          <template if:true={shiftTooltipInformation.unassignedservice}>
            <span><b>{shiftTooltipInformation.rolename}</b></span>
            <span> {shiftTooltipInformation.shiftTime} </span>
          </template>
          <template if:false={shiftTooltipInformation.unassignedservice}>
            <span><b>{shiftTooltipInformation.staffname}</b></span>
            <span>
              <a
                href="javascript:void(0)"
                onclick={handleEditShiftScreen}
                data-participantid={shiftTooltipInformation.participantid}
                data-shiftstaffid={shiftTooltipInformation.shiftstaffid}
              >
                {shiftTooltipInformation.shiftTime}
              </a>
            </span>
          </template>
          <span class={shiftTooltipInformation.cssUiStatus}>
            <span class="tooltipstatus">
              <span class={shiftTooltipInformation.cssUiStatus}
                >{shiftTooltipInformation.uiStatus}</span
              >
              <span
                class={shiftTooltipInformation.cssUiStatus}
                style="margin-left: 3%"
                >&#x2B24;</span
              >
            </span>
          </span>
        </div>
      </div>
    </div>
  </template>

  <template if:true={isModalOpen}>
    <div class="blur-overlay"></div>
    <div class="right-align1 fade-in" style="width: 25%">
      <div
        class="slds-m-around_xx-small slds-m-right_large"
        style="
          padding: 1% 5% 1% 1%;
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <p style="font-weight: bold; margin: 0; font-size: 140%">
          Service Details
        </p>
        <lightning-button
          label="Close"
          title="Back"
          variant="brand"
          onclick={handleCloseModal}
        ></lightning-button>
      </div>
      <div class="service_details_slide custom-scroll">
        <template if:true={moreShiftlist.length}>
          <template for:each={moreShiftlist} for:item="shift">
            <div key={shift.Id} class="shift-card" style={shift.newInlineStyle}>
              <div class="shift-info-more">
                <div class="shift-left">
                  <template if:true={shift.unassignedService}>
                    <p class="staff-name-more">
                      <b>{shift.ShiftwithStaff__r.Role_formula__c}</b>
                    </p>
                    <a
                      href="javascript:void(0)"
                      style="color: inherit"
                      onclick={handleEditShiftScreen}
                      data-shiftstaffid={shift.ShiftwithStaff__c}
                      data-participantid={shift.Client__c}
                    >
                      {shift.Start_Time_Formula__c}-{shift.End_Time_Formula__c}
                    </a>
                  </template>
                  <template if:false={shift.unassignedService}>
                    <p class="staff-name-more">
                      <b>{shift.Resource_Name__c}</b>
                    </p>
                    <a
                      href="javascript:void(0)"
                      style="color: inherit"
                      onclick={handleEditShiftScreen}
                      data-shiftstaffid={shift.ShiftwithStaff__c}
                      data-participantid={shift.Client__c}
                    >
                      {shift.Start_Time_Formula__c}-{shift.End_Time_Formula__c}
                    </a>
                    <span
                      >{shift.ShiftwithStaff__r.Add_Shift__r.Location__Street__s},{shift.ShiftwithStaff__r.Add_Shift__r.Location__City__s}</span
                    >
                    <!--   <span>{shift.ShiftwithStaff__r.Add_Shift__r.Facility_Name__c}</span> -->
                    <span>{shift.Service_Type_Name__c}</span>
                    <span
                      >{shift.ShiftwithStaff__r.Add_Shift__r.Shift_Notes__c}</span
                    >
                  </template>
                </div>

                <div class="shift-status">
                  <span class="shift-time-more-status">{shift.uiStatus}</span>
                  <span class={shift.cssUiStatus} style="margin-left: 3%"
                    >&#x2B24;</span
                  >
                </div>
              </div>
            </div>
          </template>
        </template>
        <template if:false={moreShiftlist.length}>
          <p class="no-shift">No shift details to display.</p>
        </template>
      </div>
    </div>
   
  </template>

  <template if:true={openParticipantshiftView}>
    <div>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 1% 1% 0 1%;
        "
      >
        <!-- <p style="font-weight: bold; font-size: 140%">
          {headingLabel}-{selectedParticipantLabel}
        </p> -->

            <!-- Heading -->
            <div class="slds-col slds-grid slds-grid_vertical-align-center">
                <p class="slds-text-heading_medium slds-text-title_bold">
                    {headingLabel}
                </p>
                <p>-{selectedParticipantLabel}</p>
            </div>
        <div style="display: flex; justify-content: flex-end">
          <lightning-button
            label="Back"
            onclick={handleCloseCalenderParticipantView}
            variant="brand"
            class="export-csv-btn"
          >
          </lightning-button>
        </div>
      </div>
      <div class="right-content custom-scroll">
        <div class="slds-grid slds-wrap">
          <!--  First Column  -->
          <div
            class="slds-large-size_12-of-12 slds-medium-size_6-of-12 slds-small-size_12-of-12"
          >
            <div class="slds-box slds-theme_default">
              <!-- box one starts -->
              <div class="container-box">
                <span>Shift Details</span>
                <div class="slds-grid slds-wrap">
                  <div class="slds-size_1-of-5 shiftFirstRowDetails">
                    <div class="floating-label-new">
                      <span class="label-text-drop">Date</span>
                      <lightning-input
                        type="date"
                        class="AddShiftStartDate"
                        name="AddShiftStartDate"
                        variant="label-hidden"
                        value={addShiftData.AddShiftStartDate}
                        onchange={handleAddShiftChange}
                        disabled={disablePostInsertButtons}
                      ></lightning-input>
                    </div>
                  </div>

                  <div class="slds-size_1-of-5 shiftFirstRowDetails">
                    <div class="floating-label-new">
                      <span class="label-text-drop"
                        >{facilityPreferredName}</span
                      >
                      <lightning-combobox
                        name="AddShiftFacilityValue"
                        class="AddShiftFacilityValue"
                        variant="label-hidden"
                        options={finalSelectedFacilities}
                        value={addShiftData.AddShiftFacilityValue}
                        onchange={handleAddShiftChange}
                    
                      ></lightning-combobox>
                    </div>
                  </div>

                  <div class="slds-size_1-of-5 shiftFirstRowDetails">
                    <div class="floating-label-new">
                      <span class="label-text-drop">Shift Name</span>
                      <lightning-combobox
                        name="AddShiftTypeName"
                        class="AddShiftTypeName"
                        variant="label-hidden"
                        options={shiftNameOptions}
                        value={addShiftData.AddShiftTypeName}
                        onchange={handleAddShiftChange}
                        disabled={disablePostInsertButtons}
                      ></lightning-combobox>
                    </div>
                  </div>
                  <div class="slds-size_1-of-5 shiftFirstRowDetails">
                    <div class="floating-label-new">
                      <span class="label-text-drop">Shift Type</span>
                      <lightning-combobox
                        name="AddShiftType"
                        class="AddShiftType"
                        variant="label-hidden"
                        options={shiftTypeOptions}
                        value={addShiftData.AddShiftType}
                        onchange={handleAddShiftChange}
                        disabled="true"
                      ></lightning-combobox>
                    </div>
                  </div>

                  <div class="slds-size_1-of-5 shiftFirstRowDetails">
                    <div class="floating-label-new">
                      <span class="label-text-drop">Role</span>
                      <lightning-combobox
                        name="AddShiftRole"
                        class="AddShiftRole"
                        variant="label-hidden"
                        options={OrgNisationRoles}
                        value={addShiftData.AddShiftRole}
                        onchange={handleAddShiftChange}
                        disabled={disablePostInsertButtons}
                      ></lightning-combobox>
                    </div>
                  </div>

                  <div class="slds-size_1-of-5 shiftFirstRowDetails">
                    <div class="floating-label-new">
                      <span class="label-text-drop">Start Time</span>
                     
                      <c-tesseract-apps-time-picker
                        data-timetype="AddShiftStartTime"
                        selected-hour={startTimeSelectedHour}
                        selected-minute={startTimeSelectedMinute}
                        data-ampm="AddShiftStartTimeAMPM"
                        displayed-time={addShiftData.AddShiftStartTimeAMPM}
                        is-am={startTimeAMPM}
                        disable-time-button={disableTimeButton}
                        onsavetimefromchild={handleAddShiftTimeData}
                      >
                      </c-tesseract-apps-time-picker>
                    </div>
                  </div>
                  <div class="slds-size_1-of-5 shiftFirstRowDetails">
                    <div class="floating-label-new">
                      <span class="label-text-drop">End Time</span>
                      <c-tesseract-apps-time-picker
                        data-timetype="AddShiftEndTime"
                        data-ampm="AddShiftEndTimeAMPM"
                        selected-hour={endTimeSelectedHour}
                        selected-minute={endTimeSelectedMinute}
                        displayed-time={addShiftData.AddShiftEndTimeAMPM}
                        is-am={endTimeAMPM}
                        disable-time-button={disableTimeButton}
                        onsavetimefromchild={handleAddShiftTimeData}
                      ></c-tesseract-apps-time-picker>
                    </div>
                  </div>
                  <div class="slds-size_1-of-5 shiftFirstRowDetails">
                    <div class="floating-label-new">
                      <span class="label-text-drop">Break(mins)</span>
                      <lightning-input
                        type="number"
                        name="AddShiftBreak"
                        variant="label-hidden"
                        value={addShiftData.AddShiftBreak}
                        onchange={handleAddShiftChange}
                        disabled="true"
                      ></lightning-input>
                    </div>
                  </div>
                  <template if:true={rowShiftTimingsEnable}>
                    <div class="slds-size_1-of-5 shiftFirstRowDetails">
                      <div class="floating-label-new">
                        <span class="label-text-drop"
                          >{staffPreferredName}</span
                        >
                        <lightning-combobox
                          name="AddShiftStaffValue"
                          class="AddShiftStaffValue"
                          variant="label-hidden"
                          options={staffOptions}
                          value={addShiftData.AddShiftStaffValue}
                          onchange={handleAddShiftChange}
                          disabled={disablePostInsertButtons}
                        ></lightning-combobox>
                      </div>
                    </div>
                  </template>

                        <span>{facilityPreferredName}</span>
                      </div>
                    </div>
                  </div>
                  <div class="slds-size_1-of-3 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-6">
                        <lightning-input
                          type="checkbox"
                          name="participantAddressCheckBox"

                      <lightning-input-address

                        city={address.citySuburb}
                        country={address.country}
                        province={address.provinceState}

                      </lightning-input-address>

                      <!-- Show read-only text for Facility or Participant -->
                      <template if:false={addNewAddressCheckBox}>
                      
                        <strong>Address:</strong> {formattedAddress}
                      </template>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div

                    class={staffTrackingClass}

                  <div
                    class={shiftLocationClass}
                    style="height: 160px; width: 100%"
                  ></div>
                </div>
              </div>
            </div>
          </div>

              </div>

                      type="checkbox"
                      label="Split Shift"
                      checked={splitShift}
                      onchange={handleShiftOptionChange}
                      data-name="splitShift"
                      disabled={disableSplitShift}
                    >

 -->

                              <template if:false={rowShiftTimingsEnable}>
                                <th scope="col">{staffPreferredName}</th>
                              </template>
                            </template>

                            <th scope="col">Service Type</th>
                            <th scope="col">Service Item</th>
                            <th scope="col" style="width: 6%">Unit Price</th>

                              <th scope="col" style="width: 8%">Shift Type</th>
                            </template>
                            <template if:true={rowShiftTimingsEnable}>
                              <th scope="col" style="width: 8%">Start Time</th>

                                        onclick={toggleDropdownForCustomisation}
                                        data-index={index}
                                        data-field="staff"
                                      >
                                        <span class="dropdown-text" title={row.stafflabel}
                                          >{row.stafflabel}</span
                                        >
                                        <lightning-icon
                                          icon-name="utility:chevrondown"
                                          size="x-small"
                                          class={row.staffchevronclass}
                                        >
                                        </lightning-icon>
                                      </div>
                                      <template if:true={row.showstaffdropdown}>
                                        <div
                                          class="table-options slds-dropdown slds-dropdown_left custom-scroll"
                                          data-dropdown-content="staff"
                                        >
                                          <div
                                            class="slds-p-horizontal_x-small"
                                            onclick={stopPropagation}
                                          >
                                            <lightning-input
                                              type="text"
                                              placeholder="Search Staff"
                                              value={row.staffsearch}

                                              data-field="staff"

                                              variant="label-hidden"

                                              text-align: left;
                                              padding: 0 15px;

                                                data-label={opt.label}
                                                onclick={handleDropdownSelect}

                                                <span class="slds-truncate"

                                                >
                                              </li>
                                            </template>
                                          </ul>
                                        </div>
                                      </template>

                                  </td>
                                </template>

                                        onclick={stopPropagation}

                                        <lightning-input
                                          type="text"
                                          placeholder="Search Service Type"
                                          value={row.servicetypesearch}
                                          data-index={index}
                                          data-field="servicetype"
                                          onchange={handleSearchInput}
                                          onclick={stopPropagation}
                                          variant="label-hidden"

                                        </lightning-input>

                                      <ul

                                        style="

                                          padding: 0 15px;
                                        "

                                        <template
                                          for:each={row.filteredservicetypes}
                                          for:item="opt"
                                        >
                                          <li
                                            key={opt.value}
                                            class="slds-dropdown__item dropdown-option"
                                            data-index={index}

                                            data-label={opt.label}
                                            onclick={handleDropdownSelect}
                                            role="option"
                                          >
                                            <span class="slds-truncate"
                                              >{opt.label}</span
                                            >
                                          </li>
                                        </template>
                                      </ul>
                                    </div>
                                  </template>

              <lightning-button
                label="Cancel"
                variant="brand"
                onclick={handleCloseUnavailabletemplate}
              ></lightning-button>
              <lightning-button
                label="Proceed"
                variant="brand"
                onclick={handleFinalRosterCreation}
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={autoschdulePopup}>
    <div class="blur-overlay"></div>
    <div class="right-align1 fade-in" style="width: 45%">
      <div
        class="slds-m-around_xx-small slds-m-right_large"
        style="
          padding: 1% 2%;
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <p style="font-weight: bold; margin: 0; font-size: 140%">
          Auto Schedule
        </p>
        <!-- <lightning-button label="Back" title="Back" variant="brand" onclick={handleCloseautoSchedule}></lightning-button> -->
      </div>
      <div
        class="slds-modal__content slds-p-around_medium"
        style="background-color: #f3f5f7"
      >
        <div style="display: flex">
          <!-- Static Serial Numbers -->
          <div class="serial-number-column">
            <div class="serial-number">1.</div>
            <div class="serial-number">2.</div>
            <div class="serial-number">3.</div>
            <div class="serial-number">4.</div>
            <div class="serial-number">5.</div>
            <div class="serial-number">6.</div>
          </div>

          <!-- Table Content -->
          <div style="width: 100%">
            <table
              class="slds-table slds-table_cell-buffer slds-table_bordered"
            >
              <tbody>
                <template for:each={rows} for:item="row" for:index="index">
                  <tr
                    key={row.id}
                    ondragover={handleDragOver}
                    ondrop={handleDrop}
                    data-index={index}
                  >
                    <td
                      style="width: 40px"
                      draggable="true"
                      data-index={index}
                      ondragstart={handleDragStart}
                    >
                      <lightning-icon
                        icon-name="utility:rows"
                        alternative-text="Drag"
                        size="x-small"
                        class="drag-icon"
                      ></lightning-icon>
                    </td>

                    <td style="border-right: none">
                      <div if:true={row.isSlider}>
                        <div>
                          <strong>Geo Location</strong><br />
                          <span style="font-size: 80%">Radius (km)</span>
                        </div>
                      </div>
                      <template if:false={row.isSlider}>
                        <strong>{row.label}</strong>
                      </template>
                    </td>

                    <td style="border-left: none">
                      <template if:true={row.isCheckbox}>
                        <lightning-input
                          type="checkbox"
                          data-index={index}
                          checked={row.value}
                          onchange={handleInputChange}
                        ></lightning-input>
                      </template>

                     <!--  <template if:true={row.isRadio}>
                        <div class="radio-group">
                          <lightning-radio-group
                            data-index={index}
                            options={employmentTypeOptions}
                            value={row.value}
                            onchange={handleInputChange}
                            type="radio"
                            variant="label-hidden"
                          ></lightning-radio-group>
                        </div>
                      </template> -->
                      <template if:true={row.isCheckboxGroup}>
                        <lightning-checkbox-group
                          data-index={index}
                          options={employmentTypeOptions}
                          value={row.value}
                          onchange={handleInputChange}
                          variant="label-hidden"
                        >
                        </lightning-checkbox-group>
                      </template>


                      <template if:true={row.isIcon}>
                        <div
                          onclick={toggleArrow}
                          data-index={index}
                          style="
                            cursor: pointer;
                            display: flex;
                            align-items: center;
                            gap: 5px;
                          "
                        >
                          <lightning-icon
                            icon-name={row.iconName}
                            alternative-text="Arrow"
                            size="x-small"
                          ></lightning-icon>
                          <span>{row.directionLabel}</span>
                        </div>
                      </template>
                      <template if:true={row.isSlider}>
                        <div style="display: flex; flex-direction: column">
                          <lightning-slider
                            label="Radius (km)"
                            variant="label-hidden"
                            size="small"
                            value={row.value}
                            min="0"
                            max="200"
                            step="1"
                            data-index={index}
                            onchange={handleInputChange}
                            onmousedown={stopDragPropagation}
                            ontouchstart={stopDragPropagation}
                          ></lightning-slider>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="slds-p-around_medium slds-text-align_center">
        <lightning-button
          label="Cancel"
          onclick={handleCloseautoSchedule}
          class="slds-m-right_small"
        ></lightning-button>
        <lightning-button
          variant="brand"
          label="Run"
          onclick={handleRun}
        ></lightning-button>
      </div>
    </div>
  </template>
  <template if:true={publishTempalte}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Confirmation
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small">
            <!-- <div style="text-align:center">
                        <h1>
                            <p>
                               Are you sure want to publish the shifts? If yes please click on Submit.
                            </p>
                        </h1>
                    </div> -->
            <div
              style="display: flex; flex-direction: column; align-items: center"
            >
              <div class="slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Start Date</span>
                  <lightning-input
                    type="date"
                    name="start"
                    variant="label-hidden"
                    value={publishStartDate}
                    onchange={handlePublishDateChange}
                  >
                  </lightning-input>
                </div>
              </div>
              <div class="slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">End Date</span>
                  <lightning-input
                    type="date"
                    name="end"
                    variant="label-hidden"
                    value={publishEndDate}
                    onchange={handlePublishDateChange}
                  >
                  </lightning-input>
                </div>
              </div>
              <div>
                <lightning-input
                  type="checkbox"
                  label="I confirm that the roster between these dates is ready to publish."
                  checked={isCheckboxChecked}
                  onchange={handlePublishCheckboxChange}
                >
                </lightning-input>
              </div>
              <p>
                <b>Note: </b>End Date is required and must be after Start Date.
              </p>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container">
              <lightning-button
                label="Cancel"
                variant="brand-outline"
                onclick={handlePublishClose}
              ></lightning-button>
              <lightning-button
                label="Submit"
                variant="brand"
                onclick={handleFinalPublish}
                disabled={isPublishDisable}
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

   <template if:true={unassignedFlagConfirmation}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container">
        <!-- Centered Header -->
       <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">
            <div style="text-align: center">
              <h1>
               <p style="text-align: center">
                No staff member(s) have been assigned to this shift.
                Would you like to proceed and {headingLabel} as <strong>unassigned</strong>?
              </p>

              </h1>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container slds-m-top_medium">
               <lightning-button
                label="No"
                variant="brand"
                onclick={handleCloseUnassigned}
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handleUnassignedFinalAllocate}
              ></lightning-button>
             
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

   <template if:true={showComplianceWarningModal}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 35%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Shift Compliance Warning
          </h2>
        </header>

      
        <div class="slds-modal__content modal-content slds-text-align_center custom-scroll">
          <div  style="text-align: center">
        
              <div class="center-list">
                  <ul>
                    <template for:each={staffDateWarnings} for:item="staff">
                        <li key={staff.staffId} class="slds-m-bottom_small">
                            <strong>{staff.staffName}</strong>

                            <ul class="slds-m-top_x-small slds-m-left_medium slds-text-align_center">
                                <template for:each={staff.conflictDates} for:item="conflict">
                                    <li key={conflict.key} class="conflict-row slds-grid slds-grid_align-center slds-text-align_center">
                                        <span class="conflict-date">
                                            {conflict.displayDate}:
                                        </span>
                                        <span class="conflict-reason">
                                            {conflict.reason}
                                        </span>
                                    </li>
                                </template>
                            </ul>
                        </li>
                    </template>
                  </ul>
              </div>

          </div>
        </div>
           <!-- Centered Buttons -->
        <footer class="slds-modal__footer">
        <div class="slds-grid slds-grid_align-center slds-gutters_xx-small">
            <div class="slds-col">
              <lightning-button
                label="Cancel"
                variant="brand"
                onclick={handleCloseUnavailabletemplate}
              ></lightning-button>
            </div>
            <div class="slds-col" >
                <lightning-button
                  label="Proceed"
                  variant="brand"
                  onclick={hanleProceedWithShiftCompliance}
                ></lightning-button>
            </div>
          </div>

        </footer>

      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={showFormsModal}>
    <section role="dialog" tabindex="-1"
        class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container">

           <header class="slds-modal__header slds-text-align_center"
                     style="background:#002a52;">

                <h2 id="modal-heading-02"
                    class="slds-text-heading_small slds-text-color_inverse"
                    style="margin:0; font-weight:700;">
                      Participant Forms
                </h2>

          </header>

            <!-- BODY -->
            <div class="slds-modal__content slds-p-around_medium custom-scroll">

                <div class="slds-grid slds-wrap">

                    <template for:each={allParticipantForms} for:item="form">
                        <div key={form.formId}
                             class="slds-col slds-size_1-of-2 slds-p-around_x-small">

                            <div class="slds-box slds-theme_default">
                                <lightning-input
                                    type="checkbox"
                                    label={form.formName}
                                    value={form.formId}
                                    checked={form.isSelected}
                                    onchange={handleFormSelection}>
                                </lightning-input>
                            </div>

                        </div>
                    </template>

                </div>

            </div>

            <!-- FOOTER -->

            <footer class="slds-modal__footer">

               <button class="slds-button slds-button_neutral" onclick={closeFormsModal}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={applySelectedForms}>Apply</button>
               
            </footer>

        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <template if:true={openRecurCheckList}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 37%">
        <header class="slds-modal__header" style="background: #002a52">
          
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
             Recurring Shifts
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeWarningMessage}>
                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
              </button>
          </h2>
        </header>
        <div class="slds-modal__content modal-content">
            <div style="text-align: center; font-weight: bold">
            
               <template if:true={recurredShiftsDelete}>
                      <c-recurring-day-selector
                            initial-selected-dates={recurringDatesForChild}
                            onselectedchange={handleChildSelection}
                            typeofaction="checklist"
                            slectedchecklistdates={recuringShiftsToDelete}> 
                      </c-recurring-day-selector>   

                        <footer class="slds-modal__footer"> 
                              
                              <lightning-button 
                                  label="Apply"
                                  class="slds-m-left_small"
                                  variant="brand"
                                  onclick={closeWarningMessage}>
                              </lightning-button> 
                              </footer>  
                </template>
            </div>

           <!-- <div class="button-container">
                          <lightning-button
                            label="No"
                            variant="brand"
                            onclick={closeWarningMessage}
                          ></lightning-button>
                          <lightning-button
                            label="Apply"
                            variant="brand"
                            onclick={closeWarningMessageForCheckList}
                          ></lightning-button>
            </div> -->
        </div>
        
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
