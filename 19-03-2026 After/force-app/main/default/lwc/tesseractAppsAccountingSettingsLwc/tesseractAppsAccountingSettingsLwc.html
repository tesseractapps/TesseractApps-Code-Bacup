                                    <label class="labelClass" style="display: flex; align-items: left;">

                                            <div style="flex: 0 0 5%; font-weight: bold; text-align: center;">:</div>
                                            <div style="flex: 1 1 55%; text-align: left; padding-left: 8px; margin: 0;">
                                                <lightning-output-field field-name="Accountant_Name__c" variant="label-hidden"></lightning-output-field>
                                            </div>

                </div>

                    <div class="container-box">

                                {sectionIcons.payGroup.icon}

                                <c-payrun-setting onhidesettings={handleHideSettings}

            <template if:true={accountingSettingsFlag}>

        <template if:true={isEditIcon}>
            <div class="custom-edit-btn" onclick={handleEditOrg}>
                    Edit

        </template>
    </div>
    <template if:true={payrolleditflag}>
        <div class="blur-overlay"></div>
        <div class="right-align1" style="width:50%;">
        
        <!-- <div style="display:flex;justify-content: flex-end;padding-right:1%;"><lightning-button label="Back" variant="brand" onclick={handleeditClose} ></lightning-button></div> -->
        <div class="container-box">
            <div  class="toggle-bar" onclick={handleSectionToggle} data-id="payroll1" style="cursor: pointer;">
                <span>Payroll Settings</span>
                <!-- <span>{sectionIcons.payroll1}</span>       -->
                <span class={sectionIcons.payroll1.class}>
                    {sectionIcons.payroll1.icon}
                </span>

            </div>
            <div class="section-content" data-section="payroll1">
            <template if:true={sectionFlags.payroll1}>
                <lightning-record-edit-form object-api-name="Organisation__c" record-id={Picklist_Value} onsuccess={HandleSuccess} onsubmit={handlesave} data-recid="security">
                    <lightning-messages></lightning-messages>   
                    <div class="slds-grid slds-wrap" style="padding: 20px 0px 20px 0px;">
                            
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>BMS Identifier</span>
                                    <lightning-input-field field-name="BMSI_Identifier__c" required="true" value={BMSIDValue} disabled={isBMSIDDisbale} variant="label-hidden"></lightning-input-field>
                                </div>
                            </div> 
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop"><span style="color:red">*</span>Software ID</span>
                                    <lightning-input-field field-name="SoftwareId__c" required="true" value={softwareIDValue} disabled="true" variant="label-hidden"></lightning-input-field> 
                                </div>
                            </div>
                            
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop">Agent Name</span>
                                    <lightning-input-field field-name="Agent_Name__c" variant="label-hidden"></lightning-input-field>
                                </div>
                            </div>
                            <!-- <div class="slds-size_1-of-2">
                                <div class="slds-m-right_medium slds-m-left_medium">
                                    <lightning-input-field field-name="Agent_Number_1__c"></lightning-input-field>
                                </div>
                            </div> -->
                            
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop">Tax Agency</span>
                                    <lightning-input-field field-name="Tax_Agency__c" variant="label-hidden"></lightning-input-field>
                                </div>
                            </div>
                            
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">
                                    <span class="label-text-drop">Contact Number</span>
                                    <lightning-input-field field-name="Agent_Contact_Number__c" variant="label-hidden"></lightning-input-field>
                                </div>
                            </div>
                            
                            <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_small">
                                <div class="floating-label">

                                    <lightning-input-field field-name="Agent_Number__c" variant="label-hidden"></lightning-input-field>
                                </div>

                                    </div>
                                </div>
                            </template> -->
                                                        
                        </div>
                    <div class="slds-align_absolute-center slds-m-around_small">
                         <lightning-button label="Cancel" variant="brand-outline" onclick={handleeditClose}
                        class="slds-m-around_small"></lightning-button>
                        <lightning-button   label="Generate BMS ID" variant="brand"  disabled={bmsIdButtonDisable}
                        class="slds-m-around_small" name="bmsid" onclick={handleOpenBMSSoftwareID}></lightning-button>
                    <lightning-button label="Generate Software ID" name="generatesoftwareid" variant="brand" onclick={handleOpenBMSSoftwareID}
                        class="slds-m-around_small" disabled={softwareButtonDisbale} ></lightning-button>
                       
                        <lightning-button type="submit"  label="Update" variant="brand" 
                        class="slds-m-around_small"></lightning-button>
                    </div>
                </lightning-record-edit-form>
            </template>
        </div>
            </div>
            </div>
            <template if:true={isShowSpinner}>
                <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
            </template>
            
        
    </template>
    <template if:true={BMSconfirmMessgeTemplate}>
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
        class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
        
        <div class="slds-modal__container modal-container" style="width:30%;">
            <!-- Centered Header -->
            <header class="slds-modal__header modal-header">
                <h2 class="slds-text-heading_medium slds-hyphenate modal-title">Confirm</h2>
            </header> 
    
            <!-- Modal Content -->
            <div class="slds-modal__content slds-p-around_medium modal-content">                                
                <div class="slds-m-around_small">
                    <div>
                            <h1>
                                <p style="text-align: center;">
                                    Do you want to copy a BMS ID? Please click "Yes" to proceed, or click "Generate New" to create a new one.<br />
                                    <strong>Note:</strong> This ID is unique and can only be generated once.
                                    </p>
                            </h1>


                    </div>
                    
                    <!-- Centered Buttons -->
                    <div class="button-container">
                        <lightning-button label="Yes" variant="brand" onclick={handleCopyBmsId} class="slds-m-around_xx-small"></lightning-button>
                        <lightning-button label="No" variant="brand" onclick={ConfirmClose} class="slds-m-around_xx-small"></lightning-button>
                        <lightning-button label="Generate New" variant="brand" onclick={handleBmsId} class="slds-m-around_xx-small"></lightning-button>
                        
                        
                    </div>
                </div>
            </div>
        </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={SoftwareIDconfirmMessgeTemplate}>
    <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
    class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
    
    <div class="slds-modal__container modal-container"  style="width:30%;">
        <!-- Centered Header -->
        <header class="slds-modal__header modal-header">
            <h2 class="slds-text-heading_medium slds-hyphenate modal-title">Confirm</h2>
        </header> 

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">                                
            <div class="slds-m-around_small">
                <div>
                    <h1>
                        <p style="text-align: center;">
                            Do you want to Generate Sofware ID?<br/>
                            <strong>Note:</strong> This ID is unique and can only be generated once.
                        </p>
                    </h1>
                </div>
                
                <!-- Centered Buttons -->
                <div class="button-container">
                    <lightning-button label="Yes" variant="brand" onclick={GenerateSoftwareId} class="slds-m-around_small"></lightning-button>
                    <lightning-button label="No" variant="brand" onclick={ConfirmClose} class="slds-m-around_small"></lightning-button>
                    
                </div>
            </div>
        </div>
    </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
   
    
</template>
