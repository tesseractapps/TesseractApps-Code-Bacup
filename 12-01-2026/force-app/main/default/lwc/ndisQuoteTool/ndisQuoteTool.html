            <template if:true={isNewContactsTab}>

                             </template>

                             <div class="slds-box slds-m-bottom_large quoteCardSelected">
                                    <h2 class="slds-text-title_bold slds-m-bottom_medium">Quote Configuration</h2>
                                <!-- ROW 1: 4 Fields -->
                                <div class="slds-grid slds-gutters">
                                    
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-input 
                                            label="Quote Number" 
                                            value={quoteNumber}
                                            required
                                            disabled
                                            onchange={handleQuoteNumber}>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-combobox 
                                            label="State" 
                                            value={state} 
                                            required
                                            options={stateOptions}
                                            onchange={handleQuoteStateChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-combobox 
                                            label="Valid for (days)" 
                                            value={validFor} 
                                            required
                                            options={validForOptions}
                                            onchange={handleValidForChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-input 
                                            type="text"
                                            label="Prepared By (Optional)" 
                                            value={preparedBy}
                                            onchange={handlePreparedBy}>
                                        </lightning-input>
                                    </div>

                                </div>

                                <!-- ROW 2: Date Fields (still 4 columns) -->
                                <div class="slds-grid slds-gutters">

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-input 
                                            type="date" 
                                            label="Service Period Start" 
                                            required
                                            value={serviceStart} 
                                            onchange={handleStartDate}>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-input 
                                            type="date" 
                                            label="Service Period End" 
                                            required
                                            value={serviceEnd} 
                                            onchange={handleEndDate}>
                                        </lightning-input>
                                    </div>

                                </div>


                                <template if:true={hasQuoteCoverage}>
                                    <div class="quote-coverage-card slds-m-top_medium">
                                        <span class="material-icons info-icon">info</span>

                                        <div>
                                            <strong>
                                                Quote Coverage: {quoteCoverage.weeks} weeks ({quoteCoverage.months} months)
                                            </strong>
                                            <p class="slds-m-top_x-small">
                                                This is the period that supports will be delivered. The quote total represents the maximum projected cost
                                                for this duration. Actual spending occurs as services are delivered.
                                            </p>
                                        </div>
                                    </div>

                                </template>
                                </div>

                                        </div>
                                    </div>

                                            <div class="summary-value">{totalHours}</div>
                                        </div>
                                    </div>

                                                </lightning-formatted-number>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                            <p class="subtitle">Easily adjust the quantity, frequency, and duration of your supports to calculate an estimate of total costs</p>
                                        </div>

                                        <lightning-button variant="neutral" label="+ Add Support Item" onclick={addSupportRow}></lightning-button>
                                    </div>
                                    <div class="table-container">
                                        <!-- HEADER (fixed inside scroll wrapper) -->
                                        <div class="header-wrapper">
                                            <table class="quote-table" role="table">
                                                <thead>
                                                    <tr>
                                                        <th>Service Type</th>
                                                        <th>Support Item</th>
                                                        <th>Price</th>
                                                        <th>Qty(hrs)</th>
                                                        <th>Freq</th>
                                                        <th>Interval</th>
                                                        <th>Duration</th>
                                                        <th>Period</th>
                                                        <th>Cost</th>
                                                        <th>Action</th>
                                                    </tr>
                                                </thead>
                                            </table>
                                        </div>

                                        <!-- SCROLLABLE BODY -->
                                        <div class="body-scroll custom-scroll tableHeight" style="overflow:visible;">
                                            <table class="quote-table">
                                                <tbody>
                                                    <template for:each={quoteSupportItems} for:item="row">
                                                        <tr key={row.id}>

                                                            <!-- Service Type -->
                                                            <td>
                                                                <lightning-combobox
                                                                    variant="label-hidden"
                                                                    data-id={row.id}
                                                                    options={serviceTypeOptions}
                                                                    value={row.serviceType}
                                                                    onchange={handleRowServiceTypeChange}>
                                                                </lightning-combobox>
                                                            </td>

                                                            <!-- Support Item -->
                                                            <td>

        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModal}>
                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                </button>
                <div class="slds-modal__content slds-p-around_large">
                    <h2 class="slds-text-heading_medium slds-m-bottom_x-small">Create New Contact</h2>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_large">Enter contact details to generate a quote.</p>

                <lightning-input 
                    label="Name"
                    value={name} 
                    onchange={handleNameChange} 
                    required>
                </lightning-input>

                    <lightning-combobox label="State"
                        value={state} options={stateOptions} 
                        onchange={handleStateChange} 
                        class="slds-m-top_medium" 
                        required></lightning-combobox>
                    
                    <lightning-input type="email" 
                    label="Email"
                    value={email} onchange={handleEmailChange} 
                    class="slds-m-top_medium" required>
                </lightning-input>
                
                    <lightning-input label="Phone"
                        value={phone} 
                        onchange={handlePhoneChange} class="slds-m-top_medium" 
                        required>
                    </lightning-input>

                    <lightning-combobox label="Role"
                        value={role} 
                        options={roleList}
                        onchange={handleRoleChange} class="slds-m-top_medium" 
                        required>
                    </lightning-combobox>

                <lightning-input label="Organization (Optional)" 
                    value={organization} 
                    onchange={handleOrgChange} class="slds-m-top_medium">
                </lightning-input>

                    <div class="slds-grid slds-grid_align-spread slds-m-top_x-large">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button variant="brand" label="Create & Continue" onclick={handleSave}></lightning-button>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
