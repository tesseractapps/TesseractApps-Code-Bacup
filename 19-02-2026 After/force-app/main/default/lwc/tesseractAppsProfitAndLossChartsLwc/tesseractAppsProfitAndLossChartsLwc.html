<template>
    <div class="container-box1">
        <div class="slds-grid slds-wrap" >
            <h3 slot="title">
                <span style="font-size: 100%;font-weight:bold; margin-left:0%;">Profit & Loss</span>
            </h3>
            <div class="slds-size_1-of-3 slds-p-around_small slds-m-left_small" style="margin-left: 52%;">
                <div class="floating-label">
                    <span class="label-text-drop"><span style="color:red">*</span>Months</span>
                    <lightning-combobox label="month" variant="label-hidden" name="selectedOption" 
                        value={selectedOption} options={monthOptions} onchange={handleChangeMonth} 
                        data-field="selectedOption" required>
                    </lightning-combobox>
                </div>
            </div>
        </div>
        <div class="chart-container">
                
            <canvas data-id="pieChart"></canvas>
        </div>
    </div>
</template>
