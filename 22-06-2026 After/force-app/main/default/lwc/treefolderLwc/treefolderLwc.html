<template>
    <div class={computedClass} style={indentStyle}>

        <div class="folder-row"  onclick={handleClick}>

            <!-- LEFT SIDE -->
            <div class="folder-left">

                <!-- TOGGLE -->
                <span class="material-icons toggle-icon" onclick={toggle}>
                    <template if:true={hasChildren}>
                        {toggleIcon}
                    </template>
                </span>

                <!-- ICON -->
                <span class="material-icons folder-icon">
                    {folderIcon}
                </span>

                <!-- NAME -->
                <span class="folder-name">
                    {node.Name}
                </span>

            </div>

            <template if:false={isContactFolder}>
                <template if:true={isStaff}>
            <!-- RIGHT SIDE (ACTIONS) -->
            <div class="folder-actions">

                <span class="material-icons more-icon"
                    onclick={toggleMenu}>
                    more_vert
                </span>

                <template if:true={showMenu}>
                    <div class="menu-dropdown">

                        <div class="menu-item" data-id={node.Id} onclick={handlePermissions}>
                            <span class="material-icons menu-icon">lock</span>
                            <span>Permissions</span>
                        </div>

                        <div class="menu-item delete"
                            data-id={node.Id}
                            onclick={handleDelete}>

                            <span class="material-icons menu-icon">delete</span>
                            <span>Delete Folder</span>

                        </div>

                        <!-- <div class="menu-item edit" onclick={handleEdit}>
                            <span class="material-icons menu-icon">edit</span>
                            <span>Edit Folder</span>
                        </div> -->

                    </div>
                </template>

            </div>

            </template>
            </template>

        </div>

    </div>

    <!-- CHILDREN -->
    <template if:true={isOpen}>
        <template for:each={node.children} for:item="child">
            <c-treefolder-Lwc
                key={child.Id}
                node={child}
                level={nextLevel}
                selected-id={selectedId}
                is-staff={isStaff}
                onfolderselect={handleChildSelect}
                onpermissions={handleChildPermissions}
                onrefreshfolders={handleRefreshFolders}>
            </c-treefolder-Lwc>
        </template>

    </template>
