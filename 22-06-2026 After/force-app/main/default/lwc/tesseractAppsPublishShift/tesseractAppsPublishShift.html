<template>
  <!--    <div class="slds-grid slds-wrap" >
            <div class="slds-col slds-large-size_8-of-12 slds-medium-size_1-of-12 slds-size_1-of-12 slds-p-around_small">

           </template>
            
            <div class="slds-col slds-large-size_2-of-12 slds-medium-size_1-of-12 slds-size_1-of-12 slds-p-around_small">

  <div
    style="display: flex; align-items: center; justify-content: space-between"
  >
    <!-- Left side: Staff Details -->
    <p style="font-weight: bold; padding: 1% 0% 2% 1%; font-size: 140%">
      {headingLabel}
    </p>

    <!-- Right side: Back button and image icon -->
    <div
      style="display: flex; align-items: center; gap: 10px; margin-right: 1.5%"
    >
      <template if:true={isVisibleSaveButton}>
        <lightning-button
          variant="brand"
          label={allocateLabel}
          title={allocateLabel}
          onclick={handleAddShiftSave}
          disabled={savButtonDisable}
        >
        </lightning-button>
      </template>
      <lightning-button
        variant="brand"
        label="Back"
        title="Back"
        onclick={HandleBack}
      >
      </lightning-button>
    </div>
  </div>
  <div class="right-content custom-scroll">
    <div
      class="slds-grid slds-gutters slds-wrap slds-p-left_small slds-p-right_small slds-p-bottom_small"
    >
      <template if:true={isHomeFlag}>
        <div
          class="slds-col slds-large-size_12-of-12 slds-medium-size_6-of-12 slds-small-size_12-of-12"
        >
          <div class="slds-box slds-theme_default slds-m-bottom_small">
            <!-- Box 1  -->
            <div class="container-box">
              <div class="toggle-bar">
                <span>Quantity</span>
              </div>
            </div>
            <div class="slds-grid slds-wrap">
              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop"
                    ><span style="color: red">*</span>Quantity</span
                  >
                  <lightning-input
                    type="number"
                    class="AddShiftQuantity"
                    name="AddShiftQuantity"
                    value={addShiftData.AddShiftQuantity}
                    variant="label-hidden"
                    onchange={handleAddShiftChange}
                  ></lightning-input>
                </div>
              </div>
              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop"
                    ><span style="color: red">*</span>Date</span
                  >
                  <lightning-input
                    type="date"
                    name="AddShiftStartDate"
                    value={addShiftData.AddShiftStartDate}
                    variant="label-hidden"
                    onchange={handleAddShiftChange}
                    disabled="true"
                  ></lightning-input>
                </div>
              </div>
              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop"
                    ><span style="color: red">*</span
                    >{facilityPreferredName}</span
                  >
                  <lightning-combobox
                    class="AddShiftFacilityValue"
                    name="AddShiftFacilityValue"
                    variant="label-hidden"
                    options={finalSelectedFacilities}
                    disabled={disableRole}
                    value={addShiftData.AddShiftFacilityValue}
                    onchange={handleAddShiftChange}
                  ></lightning-combobox>
                </div>
              </div>
              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop"
                    ><span style="color: red">*</span>Role</span
                  >
                  <lightning-combobox
                    class="AddShiftRole"
                    name="AddShiftRole"
                    variant="label-hidden"
                    options={RoleFilter}
                    value={addShiftData.AddShiftRole}
                    onchange={handleAddShiftChange}
                    disabled={disableRole}
                  ></lightning-combobox>
                </div>
              </div>

              <template if:false={otherThanNDISUser}>
                <template if:true={isNotificationVisible}>
                  <div class="slds-size_1-of-2 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2">
                        <span>Notifications</span>
                      </div>
                      <div class="slds-size_1-of-2">
                        <lightning-input
                          type="checkbox"
                          variant="label-hidden"
                          name="AddShiftnotification"
                          checked={addShiftData.AddShiftnotification}
                          onchange={handleAddShiftChange}
                        ></lightning-input>
                      </div>
                    </div>
                  </div>
                </template>

                <template if:true={isEoICheckBoxVisible}>
                  <div class="slds-size_1-of-2 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2">
                        <span>EOI</span>
                      </div>
                      <div class="slds-size_1-of-2">
                        <div class="slds-grid slds-grid_align-spread">
                          <!-- Checkbox on the left -->
                          <lightning-input
                            type="checkbox"
                            name="AddShiftEOI"
                            variant="label-hidden"
                            checked={addShiftData.AddShiftEOI}
                            onchange={handleAddShiftChange}
                            disabled={isEditMode}
                          >
                          </lightning-input>

                          <!-- Hyperlink on the right -->
                          <template if:true={addShiftEOI}>
                            <a
                              href="javascript:void(0);"
                              onclick={handleOpenEOIModal}
                              style="text-decoration: underline; color: #0070d2"
                            >
                              {staffPreferredName} Details
                            </a>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </template>

              <template if:true={otherThanNDISUser}>
                <template if:true={isNotificationVisible}>
                  <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2">
                        <span>Notifications</span>
                      </div>
                      <div class="slds-size_1-of-2">
                        <lightning-input
                          type="checkbox"
                          variant="label-hidden"
                          name="AddShiftnotification"
                          checked={addShiftData.AddShiftnotification}
                          onchange={handleAddShiftChange}
                        ></lightning-input>
                      </div>
                    </div>
                  </div>
                </template>
                <template if:true={isEoICheckBoxVisible}>
                  <div class="slds-size_1-of-4 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2">
                        <span>EOI</span>
                      </div>
                      <div class="slds-size_1-of-2">
                        <div class="slds-grid slds-grid_align-spread">
                          <!-- Checkbox on the left -->
                          <lightning-input
                            type="checkbox"
                            name="AddShiftEOI"
                            variant="label-hidden"
                            checked={addShiftData.AddShiftEOI}
                            onchange={handleAddShiftChange}
                            disabled={isEditMode}
                          >
                          </lightning-input>

                          <!-- Hyperlink on the right -->
                          <template if:true={addShiftEOI}>
                            <a
                              href="javascript:void(0);"
                              onclick={handleOpenEOIModal}
                              style="text-decoration: underline; color: #0070d2"
                            >
                              {staffPreferredName} Details
                            </a>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </template>

              <template if:true={isEoICheckBoxtrue}>
                <section
                  aria-describedby="modal-content-id-1"
                  aria-labelledby="modal-heading-01"
                  aria-modal="true"
                  class="slds-modal slds-fade-in-open"
                  role="dialog"
                  tabindex="-1"
                >
                  <div
                    class="slds-modal__container modal-container"
                    style="max-width: 40%"
                  >
                    <header
                      class="slds-modal__header"
                      style="background: #002a52"
                    >
                      <h2
                        class="slds-text-heading_medium slds-hyphenate"
                        style="
                          color: white;
                          font-weight: bold;
                          text-align: center;
                        "
                      >
                        Staff Details
                      </h2>
                    </header>
                    <div class="slds-modal__content modal-content">
                      <div class="slds-m-around_small">
                        <div class="content-wrapper">
                          <!-- Scrollable Table Section -->
                          <div
                            class="table-container right-content1 custom-scroll"
                          >
                            <table
                              class="slds-table slds-table_cell-buffer fixed-table"
                            >
                              <thead>
                                <tr>
                                  <th>Select</th>
                                  <th>{staffPreferredName} Name</th>
                                  <th>Classicfication Level</th>
                                </tr>
                              </thead>
                              <tbody>
                                <template for:each={staffData} for:item="staff">
                                  <tr key={staff.Id}>
                                    <td>
                                      <input
                                        type="checkbox"
                                        data-id={staff.Id}
                                        checked={staff.isSelected}
                                        onchange={handleStaffCheckboxChange}
                                        disabled={staff.isDisabled}
                                      />
                                    </td>
                                    <td>{staff.Display_Nickname__c}</td>
                                    <td>{staff.Class_and_Paypont__c}</td>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                          </div>
                        </div>
                        <!-- <div style="margin-top: 10px; display: flex; justify-content: center; gap: 8px; align-items: center;"> -->
                        <div
                          class="slds-grid slds-align_absolute-center slds-m-top_medium"
                        >
                          <lightning-button
                            label="Cancel"
                            variant="Brand-Outline"
                            class="slds-m-around_small"
                            onclick={handleCloseModalEOIStaff}
                          ></lightning-button>
                          <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={handleInsertEOIStaff}
                            class="slds-m-around_small"
                          ></lightning-button>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
               
              </template>
            </div>
          </div>

          <div>
            <div class="slds-box slds-theme_default slds-m-bottom_small">
              <!-- Box 6 starts -->
              <div class="container-box">
                <div class="toggle-bar">
                  <span>Geo Location</span>
                </div>
                <div style="padding: 2%">
             
                  <div style="display: flex; flex-direction: column">
                    <h2 class="slds-text-heading_small slds-m-bottom_x-small">
                      Shift Location
                    </h2>
                    <div
                      class="map-markers-only"
                      style="height: 160px; width: 100%"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <template if:false={otherThanNDISUser}>
            <div class="slds-box slds-theme_default slds-m-bottom_small">
              <!-- Box 2  -->
              <div class="container-box">
                <div class="toggle-bar">
                  <span>Address</span>
                </div>
                <div class="slds-grid slds-wrap">
                  <div class="slds-size_1-of-2 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2">
                        <span>{facilityPreferredName}</span>
                      </div>
                      <div class="slds-size_1-of-2">
                        <lightning-input
                          type="checkbox"
                          variant="label-hidden"
                          name="facilityAddressCheckbox"
                          checked={facilityAddressCheckbox}
                          onchange={AdreesCheckboxChange}
                        ></lightning-input>
                      </div>
                    </div>
                  </div>

                  <div class="slds-size_1-of-2 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2">
                        <span>Add New</span>
                      </div>
                      <div class="slds-size_1-of-2">
                        <lightning-input
                          type="checkbox"
                          name="addNewAddressCheckBox"
                          checked={addNewAddressCheckBox}
                          variant="label-hidden"
                          onchange={AdreesCheckboxChange}
                        ></lightning-input>
                      </div>
                    </div>
                  </div>
                  <div class="slds-grid slds-wrap slds-p-left_x-small">
                    <div class="slds-m-left_large">
                      <lightning-input-address
                        class="addressClass"
                        street-label="Street"
                        city-label="Suburb"
                        country-label="Country"
                        province-label="State"
                        postal-code-label="Post Code"
                        street={address.street}
                        city={address.citySuburb}
                        country={address.country}
                        province={address.provinceState}
                        postal-code={address.postalcode}
                        onchange={addressInputChange}
                        show-address-lookup
                        required
                        style={addressComponentStyle}
                      >
                      </lightning-input-address>

                      <template if:false={addNewAddressCheckBox}>
                        <template if:true={facilityAddressCheckbox}>
                         <!--  <div class="slds-box slds-theme_default">
                            <p>
                              <strong>Address:</strong> {address.street},
                              {address.citySuburb}, {address.provinceState},
                              {address.postalcode}
                            </p>
                          </div> -->
                           <strong>Address:</strong> {formattedAddress}
                        </template>
                      </template>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <template if:true={otherThanNDISUser}>
            <div class="slds-box slds-theme_default slds-m-bottom_small">
              <!-- Box 2  -->
              <div class="container-box">
                <div class="toggle-bar">
                  <span>Address</span>
                </div>
                <div class="slds-grid slds-wrap">
                  <div class="slds-size_1-of-3 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2">
                        <span>{facilityPreferredName}</span>
                      </div>
                      <div class="slds-size_1-of-2">
                        <lightning-input
                          type="checkbox"
                          variant="label-hidden"
                          name="facilityAddressCheckbox"
                          checked={facilityAddressCheckbox}
                          onchange={AdreesCheckboxChange}
                        ></lightning-input>
                      </div>
                    </div>
                  </div>

                  <div class="slds-size_1-of-3 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2">
                        <span>{participantPreferredName}</span>
                      </div>
                      <div class="slds-size_1-of-2">
                        <lightning-input
                          type="checkbox"
                          variant="label-hidden"
                          name="participantAddressCheckBox"
                          checked={participantAddressCheckBox}
                          onchange={AdreesCheckboxChange}
                        ></lightning-input>
                      </div>
                    </div>
                  </div>

                  <div class="slds-size_1-of-3 slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                      <div class="slds-size_1-of-2">
                        <span>Add New</span>
                      </div>
                      <div class="slds-size_1-of-2">
                        <lightning-input
                          type="checkbox"
                          name="addNewAddressCheckBox"
                          checked={addNewAddressCheckBox}
                          variant="label-hidden"
                          onchange={AdreesCheckboxChange}
                        ></lightning-input>
                      </div>
                    </div>
                  </div>
                  <div class="slds-grid slds-wrap slds-p-left_x-small">
                    <div class="slds-m-left_large">
                      <lightning-input-address
                        class="addressClass"
                        street-label="Street"
                        city-label="Suburb"
                        country-label="Country"
                        province-label="State"
                        postal-code-label="Post Code"
                        street={address.street}
                        city={address.citySuburb}
                        country={address.country}
                        province={address.provinceState}
                        postal-code={address.postalcode}
                        onchange={addressInputChange}
                        show-address-lookup
                        required
                        style={addressComponentStyle}
                      >
                      </lightning-input-address>

                      <template if:false={addNewAddressCheckBox}>
                        <template if:true={addressValueCheckbox}>
                          <div class="slds-box slds-theme_default">
                            <p>
                              <strong>Address:</strong> {address.street},
                              {address.citySuburb}, {address.provinceState},
                              {address.postalcode}
                            </p>
                          </div>
                        </template>
                      </template>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <div
          class="slds-col slds-large-size_12-of-12 slds-medium-size_6-of-12 slds-small-size_12-of-12"
        >
          <div class="slds-box slds-theme_default slds-m-bottom_small">
            <!-- Box 3  -->
            <div class="container-box">
              <div class="toggle-bar">
                <span>Shift Type</span>
              </div>
            </div>
            <div class="slds-grid slds-wrap">
              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop"
                    ><span style="color: red">*</span>Shift Name</span
                  >
                  <lightning-combobox
                    class="AddShiftTypeName"
                    name="AddShiftTypeName"
                    variant="label-hidden"
                    options={shiftNameOptions}
                    value={addShiftData.AddShiftTypeName}
                    onchange={handleAddShiftChange}
                    disabled={disableRole}
                  ></lightning-combobox>
                </div>
              </div>
              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop"
                    ><span style="color: red">*</span>Shift Type</span
                  >
                  <lightning-combobox
                    class="AddShiftType"
                    name="AddShiftType"
                    variant="label-hidden"
                    options={shiftTypeOptions}
                    value={addShiftData.AddShiftType}
                    onchange={handleAddShiftChange}
                    disabled="true"
                  ></lightning-combobox>
                </div>
              </div>

              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop"
                    ><span style="color: red">*</span>Start Time</span
                  >
                  <c-tesseract-apps-time-picker
                    data-timetype="AddShiftStartTime"
                    selected-hour={startTimeSelectedHour}
                    selected-minute={startTimeSelectedMinute}
                    data-ampm="AddShiftStartTimeAMPM"
                    displayed-time={addShiftData.AddShiftStartTimeAMPM}
                    is-am={startTimeAMPM}
                    disable-time-button={disableTimeButton}
                    onsavetimefromchild={handleAddShiftTimeData}
                  ></c-tesseract-apps-time-picker>
                </div>
              </div>
              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop"
                    ><span style="color: red">*</span>End Time</span
                  >
                  <c-tesseract-apps-time-picker
                    data-timetype="AddShiftEndTime"
                    data-ampm="AddShiftEndTimeAMPM"
                    selected-hour={endTimeSelectedHour}
                    selected-minute={endTimeSelectedMinute}
                    displayed-time={addShiftData.AddShiftEndTimeAMPM}
                    is-am={endTimeAMPM}
                    disable-time-button={disableTimeButton}
                    onsavetimefromchild={handleAddShiftTimeData}
                  ></c-tesseract-apps-time-picker>
                </div>
              </div>
              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Duration</span>
                  <lightning-input
                    type="number"
                    class="AddShiftDuration"
                    name="AddShiftDuration"
                    variant="label-hidden"
                    value={addShiftData.AddShiftDuration}
                    disabled="true"
                  ></lightning-input>
                </div>
              </div>
              <div class="slds-size_1-of-4 slds-p-around_small">
                <div class="floating-label-new">
                  <span class="label-text-drop">Break(mins)</span>
                  <lightning-input
                    type="number"
                    name="AddShiftBreak"
                    variant="label-hidden"
                    value={addShiftData.AddShiftBreak}
                    onchange={handleAddShiftChange}
                    disabled="true"
                  ></lightning-input>
                </div>
              </div>
              <template if:true={otherThanNDISUser}>
                <div class="slds-size_1-of-4 slds-p-around_small">
                  <div class="floating-label-new">
                    <span class="label-text-drop"
                      ><span style="color: red">*</span
                      >{participantPreferredName}</span
                    >
                    <lightning-combobox
                      variant="label-hidden"
                      name="AddShiftParticipantValue"
                      options={ParticipantOptions}
                      onchange={handleAddShiftChange}
                      disabled={disableRole}
                      value={addShiftData.AddShiftParticipantValue}
                    ></lightning-combobox>
                  </div>
                </div>

                <div
                  class="slds-size_1-of-1"
                  style="padding-left: 3%; margin-left: 48%"
                >
                  <template if:true={serviceType}>
                    <div class="slds-box slds-theme_default">
                      <!--   <p><strong>Service:</strong> Other, Miscellaneous Services</p> -->
                      <p><strong>Service:</strong> {serviceNameDisplay}</p>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
          <div class="slds-box slds-theme_default slds-m-bottom_small">
            <!-- Box 4  -->
            <div class="container-box">
              <div class="toggle-bar">
                <span>Shift Information</span>
              </div>
              <div style="padding: 2%">
                <lightning-textarea
                  name="AddShiftNotes"
                  variant="label-hidden"
                  data-paste-ignore="true"
                  value={addShiftData.AddShiftNotes}
                  onchange={handleAddShiftChange}
                  onfocus={handleFocus}
                  placeholder="Enter your text here or start speaking..."
                   maxlength="1000"
                    message-when-too-long="Notes cannot exceed 1000 characters."
                ></lightning-textarea>
                <div class="slds-p-bottom_x-large slds-m-top_medium">
                  <lightning-icon
                    icon-name={iconName}
                    alternative-text={altText}
                    onclick={toggleListening}
                    if:true={showMuteIcon}
                    class="slds-button slds-button_icon mute-icon"
                    style="margin-left: 5px"
                    size="small"
                  >
                  </lightning-icon>
                  <lightning-icon
                    icon-name="utility:clear"
                    alternative-text="Clear Text"
                    onclick={clearText}
                    if:true={showClearIcon}
                    class="slds-button slds-button_icon clear-icon"
                    size="small"
                  >
                  </lightning-icon>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={isUnallocateTable}>
        <div class="slds-col slds-size_12-of-12 slds-p-horizontal_small">
          <div class="slds-box slds-theme_default slds-m-bottom_small">
            <table>
              <thead>
                <tr>
                  <th>Sl.No</th>
                  <th>Quantity</th>
                  <th>Unallocated</th>
                  <th>Date</th>
                  <th>Start Time-End Time</th>
                  <th>Duration</th>
                  <th>Shift Type</th>
                  <th>Role</th>
                  <th>{facilityPreferredName}</th>
                  <th>EOI</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={unAllocatedTableList} for:item="shift">
                  <tr key={shift.Id} class="tr1">
                    <!-- class={shift.className} -->
                    <td>{shift.serialNumber}</td>
                    <td>{shift.Quantity__c}</td>
                    <td>{shift.Un_Allocated__c}</td>
                    <td>{shift.date}</td>
                    <td>{shift.Shift_Start_End_Time__c}</td>
                    <td>{shift.duration}</td>
                    <td>{shift.Shift_Type__c}</td>
                    <td>{shift.Role__c}</td>
                    <td>{shift.Facility_Name__c}</td>
                    <td>{shift.EOIvalue}</td>
                    <td>
                      <p>
                        <a
                          href="javascript:void(0)"
                          data-shiftid={shift.Id}
                          onclick={handleUnAllocatedEdit}
                        >
                          Edit</a
                        >&nbsp;|&nbsp;
                        <a
                          href="javascript:void(0)"
                          data-shiftid={shift.Id}
                          data-quantity={shift.Un_Allocated__c}
                          data-eoivalue={shift.EOIvalue}
                          data-startdate={shift.Start_Date__c}
                          data-fac={shift.Facility__c}
                          data-shifttype={shift.Shift_Type__c}
                          data-time={shift.Shift_Start_End_Time__c}
                          onclick={handleUnAllocated}
                        >
                          Allocate</a
                        >
                      </p>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <template if:true={isAllocateTable}>
        <div class="slds-col slds-size_12-of-12 slds-p-horizontal_small">
          <div class="slds-box slds-theme_default slds-m-bottom_small">
            <!--  Box 5 -->
            <table>
              <thead>
                <tr>
                  <th>Sl.No</th>
                  <th>{staffPreferredName} Name</th>
                  <th>Role</th>
                  <th>{facilityPreferredName}</th>
                 <!--  <th>Hourly Rate</th> -->
                   <th>{hourlyRateLabel}</th>
                  <th>Shift Duration</th>
                  <th>Shift Wages</th>
                  <th>Status</th>
                  <th>SCR</th>
                  <th>Class</th>
                  <th>Allocate</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={staffHorlyRateList} for:item="staff">
                  <tr key={staff.Id} class="tr1">
                    <!-- class={staff.className} -->
                    <td>{staff.serialNumber}</td>
                    <td>{staff.fullName}</td>
                    <td>{staff.role}</td>
                    <td>{staff.facilityname}</td>
                    <!-- <td>${staff.Hourlyrate}</td> -->
                    <td>
                        <lightning-formatted-number
                            value={staff.Hourlyrate}
                            format-style="currency"
                            currency-code="AUD"
                            minimum-fraction-digits="2"
                            maximum-fraction-digits="2">
                        </lightning-formatted-number>
                    </td>
                    <td>{staff.duration}</td>
                    <!-- <td>${staff.shiftWage}</td> -->
                    <td>
                      <lightning-formatted-number
                          value={staff.shiftWage}
                          format-style="currency"
                          currency-code="AUD"
                          minimum-fraction-digits="2"
                          maximum-fraction-digits="2">
                      </lightning-formatted-number>
                    </td>
                    <td>{staff.activeOrInactive}</td>
                    <td>{staff.scr}</td>
                    <td>{staff.ClassAndLevel}</td>

                    
                    <td>
                      <lightning-input
                        type="toggle"
                        variant="label-hidden"
                        data-id={staff.Id}
                        message-toggle-active=""
                        size="xx-small"
                        message-toggle-inactive=""
                        onchange={handleAllocateToggle}
                        checked={staff.isAllocate}
                      ></lightning-input>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div style="display: flex; justify-content: flex-end">
            <lightning-button
              label="Allocate"
              title="Allocate"
              onclick={HandleAllocate}
              variant="brand"
              disabled={isDisableAllocated}
            ></lightning-button>
          </div>
        </div>
      </template>
    </div>
    <template if:true={isShowSpinner}>
      <div>
        <lightning-spinner
          alternative-text="Loading"
          size="large"
        ></lightning-spinner>
      </div>
    </template>
  </div>
  <template if:true={fatigueManagementFlag}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium">
          <div class="slds-m-around_small" style="text-align: center">
            <div>
              <p>
                The interval between shifts is less than 8 hours for the
                following staff
                <span><b>{fatigueConfirmationMessge}</b></span
                >. Would you like to assign this shift?
              </p>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container slds-m-top_medium">
              <lightning-button
                label="No"
                variant="brand"
                onclick={handleDeselectStaff}
                class="slds-m-around_small"
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={handleFinalAllocate}
                class="slds-m-around_small"
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <template if:true={setHoursIndicatorflag}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">
            <div>
              <p>
                Set hours for the following staff is exceeded.<span
                  ><b>{setHoursIndiactorConfirmation}</b></span
                >. Would you like to assign this shift?
              </p>
            </div>

            <!-- Centered Buttons -->
            <div class="button-container slds-m-top_medium">
              <lightning-button
                label="No"
                variant="brand"
                onclick={handleDeselectStaff}
                class="slds-m-around_small"
              ></lightning-button>
              <lightning-button
                label="Yes"
                variant="brand"
                onclick={HandleNavigateToFatigue}
                class="slds-m-around_small"
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <template if:true={showErrorModal}>
    <section class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
        <div class="slds-modal__container" style="max-width: 25%; min-width: 400px;">
            <!-- Modal Header -->
            <header class="slds-modal__header" style="background: #002a52;">
                <h2 class="slds-text-heading_medium" style="color: white; text-align: center;">
                  
                        Shift Assignment Failed
                  
                </h2>
            </header>
            
            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium slds-text-align_center custom-scroll">
                <!-- Conditional Message -->
                    <p class="slds-m-bottom_medium">Cannot proceed with shift assignment. Issues found:</p>
             

                  <div class="center-list">
                  <ul>
                      <template for:each={staffDateConflicts} for:item="staff">
                          <li key={staff.staffId}>
                              <strong>{staff.staffName}</strong>
                              <ul class="slds-m-top_xx-small">
                                  <template for:each={staff.conflictDates} for:item="conflict">
                                      <li key={conflict.date} class="conflict-row">
                                          <span class="conflict-date">{conflict.displayDate}: </span>
                                         <!--  <span class="conflict-reason">{conflict.reason}</span> -->
                                            <lightning-formatted-rich-text class="conflict-reason" value={conflict.reason}></lightning-formatted-rich-text>
                                      </li>
                                  </template>
                              </ul>
                          </li>
                      </template>
                  </ul>
                  </div>

            </div>
            
            <!-- Modal Footer -->
            <footer class="slds-modal__footer" >
              
                 
                    <lightning-button 
                    label="OK" 
                    onclick={closeErrorModal} 
                    variant="brand"
                   ></lightning-button>

               
              
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
<template if:true={unavailableTemplate}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 35%">
        <!-- Centered Header -->
        <header class="slds-modal__header" style="background: #002a52">
          <h2
            class="slds-text-heading_medium slds-hyphenate"
            style="color: white; font-weight: bold; text-align: center"
          >
            Warning
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content slds-p-around_medium modal-content">
          <div class="slds-m-around_small" style="text-align: center">

            <div style="text-align: center">

              <!-- 🔴 Rejected Shifts Section -->
              <template if:true={hasRejectedStaff}>
               <b class="slds-m-top_medium slds-text-align_left">Rejected Shift Information :</b>
                <p>
                  The following staff member(s) have rejected shifts overlapping this time:
                </p>

                <template for:each={rejectedStaffNames} for:item="name">
                  <p key={name}>
                    <strong>{name}</strong>
                  </p>
                </template>
              </template>

              <!-- ⚠️ Availability Section -->
              <template if:true={hasUnavailableStaff}>
                <template if:true={hasRejectedStaff}>
                     <div class="slds-border_top slds-m-vertical_medium"></div>
                </template>
                 
                 <b class="slds-m-top_medium slds-text-align_left">Unavailable Information :</b>
                <p >
                  This shift is outside the stated availability for the following staff member(s):
                </p>

                <template for:each={unavailableStaffNames} for:item="name">
                  <p key={name}>
                    <strong>{name}</strong>
                  </p>
                </template>

                <p>
                  They have not marked this time as unavailable.
                </p>
              </template>

              <!-- 😴 Fatigue Section -->
                <template if:true={hasFatigueStaff}>

                    <div class="slds-border_top slds-m-vertical_medium"></div>

                    <b class="slds-m-top_medium slds-text-align_left">
                        Fatigue Information :
                    </b>

                    <p>
                        The following {staffPreferredName} member(s) have less than 8 hours break between shifts:
                    </p>

                    <template for:each={fatigueStaffNames} for:item="name">
                        <p key={name}>
                            <strong>{name}</strong>
                        </p>
                    </template>

                </template>

                <!-- SCHADS Sleepover Warning -->
                <template if:true={hasSchadsSleepoverWarning}>

                    <div class="slds-border_top slds-m-vertical_medium"></div>

                    <b class="slds-m-top_medium slds-text-align_left">
                        SCHADS Sleepover Warning :
                    </b>

                    <p>
                       A shift created directly before or after a sleepover must generally meet the 4-hour minimum engagement rule. 
                       This shift is currently below the recommended minimum duration. 
                    </p>

                   <!--  <template for:each={schadsSleepoverWarningStaff} for:item="name">
                        <p key={name}>
                            <strong>{name}</strong>
                        </p>
                    </template> -->

                </template>


              <!-- ✅ Final Message (only if anything exists) -->
            
                <p class="slds-m-top_medium">
                  Do you still want to create this shift?
                </p>
             

            </div>

            <!-- Buttons -->
            <div class="button-container slds-m-top_medium">
              <lightning-button
                label="Cancel"
                variant="brand"
                onclick={closeErrorModal}
              ></lightning-button>

              <lightning-button
                label="Proceed"
                variant="brand"
                onclick={handleFinalAllocate}
              ></lightning-button>
            </div>

          </div>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
