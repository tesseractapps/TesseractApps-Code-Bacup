<template>
    <div>
        <div if:true={isDesktop}>
            <div> 
                <div class="slds-grid slds-var-m-left_x-large slds-var-m-right_x-large" style="margin-top:20px;">
                    
                    <div class={orgClass} data-name="Organisation" title="Invoices" alt="Invoices" name="Organisation"  onclick={navigateToFacilityPage}
                    style="cursor:pointer;text-align:center" > 
                        Invoices                               
                    </div>                        
                    
                    <div class={selectedClass} data-name="Facility" title="Billing" alt="Billing" name="Facility" onclick={navigateToFacilityPage}
                            style="cursor:pointer;text-align:center" > 
                        Billing                               
                    </div>                       
                        
                </div>
            </div>
            <div>
                <template if:true={isOrgButton}>
                    <div style="margin-top:-9px;">
                        <c-tesseract-invoice-billing></c-tesseract-invoice-billing>
                     </div>
                </template>
                <template if:true={isFacilityButton}>
                    <div style="margin-top:-9px;">
                       <!--  <c-facility-data-community
                            selected-name={searchValue}></c-facility-data-community> -->
                    </div>
                </template>
            </div>
        </div>            
    </div>
</template>
