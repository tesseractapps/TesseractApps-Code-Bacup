                                <lightning-button
                                    disabled={underOverDisableLast}
                                    icon-name="utility:jump_to_right"
                                    label="Last"
                                    alternative-text="last page"
                                    onclick={underOverLastPage}

                                    class="slds-m-left_x-small">
                                </lightning-button>

                            <!-- Total records -->
                            <div class="slds-clearfix">
                                <div class="slds-float_right">
                                    <span class="slds-badge">
                                        Total Records: {underOverTotalRecords}
                                    </span>
                                </div>
                            </div>

                        </div>
                    </div>
                </template>

            </template>
        </template>

        <template if:false={isExpandedView}>
            <!-- favoriteReports.html -->
            <template if:true={favoritesflag}>
                <div class="favorite-reports-container">
                    <!-- FAVORITE REPORTS SECTION -->
                    <div class="section-header">
                        <div class="section-title">Favourites</div>
                        <span class="section-badge">{favoriteCount} Reports</span>
                    </div>
                <div class="favorites-container">

                    <template if:true={hasFavorites}>
                        <template for:each={favoriteRows} for:item="row">

                            <div key={row.rowId} class="favorites-row">

                                <template for:each={row.reports} for:item="report">

                                    <div key={report.id}
                                        class="favorite-pill"
                                        data-id={report.id}
                                        data-type={report.type}
                                        onclick={handleFavoriteClick}>

                                        <span class="favorite-name">
                                            {report.name}
                                        </span>

                                        <lightning-icon
                                            icon-name="utility:favorite"
                                            size="x-small"
                                            class="favorite-star"
                                            data-id={report.id}

                                        </lightning-icon>

                                    </div>

                                </template>

                            </div>

                        </template>
                    </template>

                    <template if:false={hasFavorites}>
                        <div class="no-records">No Records Found</div>
                    </template>

                </div>

                <!-- GENERATED REPORT SECTION -->
                <div class="section-header">
                    <div class="section-title">Generated Reports</div>
                    <!-- Expand link -->
                    <!-- <a href="#" onclick={handleExpand} class="expand-link">
                        <lightning-icon icon-name="utility:expand" size="x-small"></lightning-icon>
                        Expand Generated Report View
                    </a> -->
                    <span class="section-badge">{generatedCount} Reports</span>

                <div class="table-container favoriteTabel slds-grid slds-grid_vertical">
                    <template if:true={paginatedAllReports}>

                        
                <!-- SCROLL AREA -->
                    <div class="generated-content">                        
                        <!-- HEADER -->
                        <div class="header-wrapper">
                                <table class="staff-table">
                                    <thead>
                                        <tr>
                                            <th>Report Name</th>
                                            <th>Export Type</th>
                                            <th>Date Range</th>
                                            <th>Generated Date</th>
                                            <th>Generated by</th>

                                        </tr>
                                    </thead>
                                </table>
                        </div>
                        <!-- BODY -->

                                                <!-- <td class="center">

                                                        alternative-text="View"
                                                        data-id={row.id}
                                                        onclick={handlePreview}>

                                                    <lightning-button-icon
                                                        icon-name="utility:download"
                                                        alternative-text="Download"
                                                        data-id={row.id}
                                                        onclick={handleDownloadReport}>
                                                    </lightning-button-icon>
                                                </td> -->

                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                        </div>

                    </template>
                </div>
                    <!-- Pagination Section -->
                    <div class="pagination-container slds-m-top_auto slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-p-around_medium">

                        <!-- Page size -->
                        <div class="slds-list_inline slds-grid slds-grid_vertical-align-center">

                            <span class="slds-m-right_x-small">
                                Page Size:
                            </span>

                            <div class="slds-select_container">
                                <select
                                    class="slds-select"
                                    onchange={handleGeneratedPageSizeChange}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>
                                            {option}
                                        </option>
                                    </template>

                                </select>
                            </div>

                        </div>

                        <!-- Pagination buttons -->
                        <div class="slds-align_absolute-center">

                            <lightning-button
                                disabled={generatedDisableFirst}
                                icon-name="utility:jump_to_left"
                                label="First"
                                alternative-text="first page"
                                onclick={firstGeneratedPage}
                                class="slds-m-right_x-small">
                            </lightning-button>

                            <lightning-button
                                disabled={generatedDisableFirst}
                                icon-name="utility:chevronleft"
                                label="Previous"

                                onclick={previousGeneratedPage}
                                class="slds-m-right_x-small">
                            </lightning-button>

                            </span>

                                disabled={generatedDisableLast}
                                icon-name="utility:chevronright"
                                label="Next"
                                alternative-text="Next"

                                icon-position="right"
                                class="slds-m-left_x-small">

                                disabled={generatedDisableLast}
                                icon-name="utility:jump_to_right"
                                label="Last"

                                icon-position="right"
                                class="slds-m-left_x-small">

        <template if:true={isStaffBasedReportshowModal}> 
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open"> 
                <div class="slds-modal__container modal-custom "> 

                    <!-- HEADER --> 
                    <header class="slds-modal__header headercustom"> 
                        <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">
                            Save as PDF/ CSV
                        </h2> 
                    </header> 

                    <!-- BODY CONTENT --> 
                    <div class="slds-modal__content slds-p-around_medium slds-scrollable_y">

                        <div class="radio-wrapper">

                            <!-- PDF -->
                            <label class="custom-radio">
                                <input
                                    type="radio"
                                    name="exportType"
                                    value="PDF"
                                    checked={isPDF}
                                    onchange={handleExportTypeChange} />
                                <span class="radio-circle"></span>
                                <span class="radio-label">PDF</span>
                            </label>

                            <!-- CSV -->
                            <label class="custom-radio">
                                <input
                                    type="radio"
                                    name="exportType"
                                    value="EXCEL"
                                    checked={isCSV}
                                    onchange={handleExportTypeChange} />
                                <span class="radio-circle"></span>
                                <span class="radio-label">CSV</span>
                            </label>

                        </div>

                        <!-- Load Template Row -->
                        <div class="radio-wrapper slds-p-around_medium">

                            <div class="slds-col slds-size_8-of-12">
                                <div class="slds-grid">
                                    <div class="slds-col slds-size_2-of-12 slds-align-middle">
                                        <span class="slds-text-body_regular slds-m-right_small">
                                            Template:
                                        </span>
                                    </div>

                                    <!-- combobox OR new template input -->
                                    <div class="slds-col slds-size_10-of-12">

                                        <!-- Normal mode (combobox) -->
                                        <template if:false={showNewTemplateInput}>
                                            <lightning-combobox
                                                label=""
                                                value={selectedTemplateId}
                                                options={templatesforShiftReport}
                                                variant="label-hidden"
                                                onchange={handleTemplateChange}>
                                            </lightning-combobox>
                                        </template>

                                        <!-- NEW template mode (text input) -->
                                        <template if:true={showNewTemplateInput}>
                                            <lightning-input
                                                type="text"
                                                label=""
                                                placeholder="Enter template name"
                                                value={newTemplateName}
                                                variant="label-hidden"
                                                onchange={handleNewTemplateNameChange}>
                                            </lightning-input>
                                        </template>

                                    </div>

                                    <!-- right side icons -->
                                    <div class="slds-col slds-size_2-of-12 slds-align_absolute-center">

                                        <!-- delete icon (normal mode) -->
                                        <!-- <template if:false={showNewTemplateInput}>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                variant="bare"
                                                alternative-text="Delete Template"
                                                title="Delete Template"
                                                onclick={handleDeleteTemplate}
                                                disabled={isDeleteDisabled}>
                                            </lightning-button-icon>
                                        </template> -->

                                        <!-- confirm / cancel icons (NEW mode) -->
                                        <template if:true={showNewTemplateInput}>

                                            <lightning-button-icon
                                                icon-name="utility:check"
                                                variant="bare"
                                                alternative-text="Confirm"
                                                title="Confirm"
                                                onclick={handleConfirmNewTemplate}>
                                            </lightning-button-icon>

                                            <lightning-button-icon
                                                icon-name="utility:close"
                                                variant="bare"
                                                alternative-text="Cancel"
                                                title="Cancel"
                                                class="slds-m-left_x-small"
                                                onclick={handleCancelNewTemplate}>
                                            </lightning-button-icon>

                                        </template>

                                    </div>

                                </div>
                            </div>
                        </div>
                        <!-- Drag & Drop Sections -->
                        <template for:each={sections} for:item="section" for:index="index">

                            <div key={section.key}
                                class="drag-row"
                                draggable="true"
                                data-index={index}
                                ondragstart={handleDragStart}
                                ondragover={handleDragOver}
                                ondrop={handleDrop}>

                                <!-- <div class="row-number">
                                    {section.order}.
                                </div> -->

                                <div class="drag-handle">
                                    <lightning-icon icon-name="utility:rows" size="x-small"></lightning-icon>
                                </div>

                                <div class="row-label">
                                    {section.label}
                                </div>

                                <div class="row-checkbox">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        data-key={section.key}
                                        checked={section.checked}
                                        onchange={handleSectionChange}>
                                    </lightning-input>
                                </div>

                            </div>

                        </template>

                    </div>

                    <!-- FOOTER --> 
                    <footer class="slds-modal__footer"> 

                        <lightning-button 
                            variant="neutral" 
                            label="Cancel" 
                            onclick={StaffBasedReportshowModalclose}> 
                        </lightning-button> 

                        <lightning-button 
                            class="slds-m-left_small" 
                            variant="brand" 
                            label="Save" 
                            onclick={StaffBasedReportshowModalsave}> 
                        </lightning-button> 

                    </footer>

                </div> 
            </section> 

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={isExportPopupOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open"> 

                <div class="slds-modal__container modal-custom "> 

                    <!-- HEADER --> 
                    <header class="slds-modal__header headercustom"> 
                        <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">Export Report</h2> 
                    </header> 

                    <!-- BODY CONTENT --> 
                    <div class="slds-modal__content slds-p-around_medium custom-scroll">  
                        <div class="slds-grid slds-wrap slds-gutters"> 
                            <lightning-radio-group
                                name="exportType"
                                label="Select export type"
                                options={exportTypeOptions}
                                value={selectedExportType}
                                type="radio"
                                orientation="horizontal"
                                onchange={handleExportTypeChange}>
                            </lightning-radio-group>
                        </div> 
                    </div> 

                    <!-- FOOTER --> 
                    <footer class="slds-modal__footer"> 
                        <lightning-button 
                            variant="neutral" 
                            label="Cancel" 
                            onclick={closeExportPopup}> 
                        </lightning-button> 

                        <lightning-button 
                            class="slds-m-left_small" 
                            variant="brand" 
                            label="Export" 
                            onclick={handleExport}> 
                        </lightning-button> 
                    </footer> 
                </div> 
            </section> 
            <div class="slds-backdrop slds-backdrop_open"></div> 
        </template>
    </div>
</template>
