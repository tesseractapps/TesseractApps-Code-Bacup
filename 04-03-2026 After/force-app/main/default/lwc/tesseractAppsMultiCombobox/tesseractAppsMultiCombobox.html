<template>
    <div class="slds-form-element">

        <!-- LABEL -->
        <template if:true={label}>
            <label class="slds-form-element__label">
                <template if:true={required}>
                    <abbr class="slds-required">*</abbr>
                </template>
                {label}
            </label>
        </template>

        <!-- COMBOBOX -->
        <div class="slds-combobox_container custom-width">
            <div class={comboboxClass}>

                <!-- SEARCHABLE INPUT -->
                <div class="slds-combobox__form-element
                            slds-input-has-icon
                            slds-input-has-icon_right">

                    <input
                        type="text"
                        class="slds-input"
                        value={inputValue}
                        placeholder="Select"
                        onfocus={openDropdown}
                        oninput={handleSearch}
                    />

                    <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                        <lightning-icon icon-name="utility:down" size="x-small">
                        </lightning-icon>
                    </span>

                </div>

                <!-- DROPDOWN -->
                <template if:true={isOpen}>
                    <div class="slds-dropdown slds-dropdown_fluid custom-dropdown custom-scroll">

                        <ul class="slds-listbox slds-listbox_vertical">

                            <template for:each={computedOptions} for:item="opt">
                                <li key={opt.value}
                                    class="slds-listbox__item"
                                    data-value={opt.value}
                                    onclick={handleRowClick}>

                                    <div class="slds-media
                                                slds-listbox__option
                                                slds-listbox__option_plain
                                                slds-media_small">

                                        <!-- CHECKBOX -->
                                        <span class="slds-media__figure">
                                            <lightning-input
                                                type="checkbox"
                                                variant="label-hidden"
                                                value={opt.value}
                                                checked={opt.checked}
                                                onchange={handleSelect}>
                                            </lightning-input>
                                        </span>

                                        <!-- LABEL -->
                                        <span class="slds-media__body">
                                            <span class="slds-truncate" title={opt.label}>
                                                {opt.label}
                                            </span>
                                        </span>

                                    </div>
                                </li>
                            </template>

                        </ul>

                    </div>
                </template>

            </div>
        </div>
    </div>
</template>
