<template>
    <div class="document-editor-page">
        <template if:true={isLoading1}>
            <div class="overlay-logo"></div>
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
                <p class="progress-text">Setting Up Things,<br />Please Wait...</p>
            </div>
        </template>
        <div class="document-editor-header">
            <div class="document-name-field">
                <span class="document-name-label">Document Name</span>
                <input type="text" class="document-name-input" value={documentName} placeholder="Enter document name"
                    oninput={handleDocumentNameChange}>
            </div>

            <div class="document-save-container">
                <lightning-button label="Save" variant="brand" onclick={handleSavePdf}>
                </lightning-button>
                <lightning-button label="Back" variant="neutral" onclick={handleBack}>
                </lightning-button>
            </div>
        </div>

        <div class="rich-text-container">
            <div class="rich-text-editor-wrapper">

                <div class="page-shadows-container" aria-hidden="true">
                    <template for:each={pages} for:item="page">
                        <div key={page.id} class="page-shadow" style={page.style}></div>
                    </template>
                </div>

                <!-- Header/footer bands built in JS (renderPageChrome); the
                     content is authored in the template. -->
                <div class="page-chrome-layer" lwc:dom="manual"></div>

                <div class="rich-text-editor" data-id="documentEditor">
                </div>

            </div>
        </div>

        <c-aws-batch-lwc data-id="awsUploader" module-name="CreateDocumentemplate" organisation-id={orgid}>
        </c-aws-batch-lwc>

        <!-- Choose Signature Action - same options as TesseractappstemplatesLwc -->
        <template if:true={showSignatureModal}>
            <div class="signature-modal-backdrop"></div>
            <div class="signature-modal-container" role="dialog" aria-modal="true">
                <div class="signature-modal-header">
                    <span>Choose Signature Action</span>
                    <button type="button" onclick={closeSignatureModal} aria-label="Close Modal">&times;</button>
                </div>
                <div class="signature-modal-content">
                    <div class="signature-btn">
                        <lightning-button label="Upload Signature" onclick={handleUploadOption} stretch variant="brand">
                        </lightning-button>
                    </div>
                    <div class="signature-btn">
                        <lightning-button label="Draw Signature" onclick={handleDrawOption} stretch variant="neutral">
                        </lightning-button>
                    </div>
                    <div class="signature-btn">
                        <lightning-button label="Enter Name for Signature" onclick={openNameSignatureModal} stretch
                            variant="neutral">
                        </lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Draw Signature -->
        <template if:true={showDrawingModal}>
            <div class="signature-modal-backdrop"></div>
            <div class="drawing-modal-container" role="dialog" aria-modal="true">
                <div class="signature-modal-header">
                    <span>Draw Your Signature</span>
                    <button type="button" onclick={closeDrawingModal} aria-label="Close Modal">&times;</button>
                </div>
                <div class="drawing-modal-content">
                    <canvas class="signature-canvas" onpointerdown={startDrawing} onpointermove={draw}
                        onpointerup={stopDrawing} onpointerleave={stopDrawing}></canvas>
                </div>
                <div class="drawing-modal-footer">
                    <lightning-button label="Save" variant="brand" onclick={saveDrawnSignature}></lightning-button>
                    <lightning-button label="Clear" variant="neutral" onclick={clearCanvas}></lightning-button>
                </div>
            </div>
        </template>

        <!-- Enter Name for Signature -->
        <template if:true={showNameSignatureModal}>
            <div class="signature-modal-backdrop"></div>
            <div class="signature-modal-container name-signature-modal" role="dialog" aria-modal="true">
                <div class="signature-modal-header">
                    <span>Enter Name for Signature</span>
                    <button type="button" onclick={closeNameSignatureModal} aria-label="Close Modal">&times;</button>
                </div>
                <div class="signature-modal-body">
                    <input type="text" placeholder="Enter Your Name" oninput={handleNameInput}
                        class="signature-name-input" />
                    <div class="signature-font-previews">
                        <template for:each={styledPreviews} for:item="style">
                            <div key={style.id} class="signature-font-style" data-id={style.id}
                                onclick={handleStyleSelection}>
                                <canvas data-id={style.id} class="signature-styled-canvas"></canvas>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <template if:true={showSuccessModal}>
            <section role="dialog" tabindex="-1" aria-modal="true"
                style="position:fixed;inset:0;width:100%;height:100%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2147483647;">

                <div
                    style="background:#fff;width:700px;max-width:90vw;padding:40px;border-radius:14px;box-sizing:border-box;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);">

                    <div style="display:flex;justify-content:center;margin-bottom:24px;">
                        <div
                            style="width:82px;height:82px;border:4px solid #0176d3;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0176d3;font-size:54px;line-height:1;">
                            ✓
                        </div>
                    </div>

                    <h2 style="margin:0;color:#0c78ba;font-size:28px;font-weight:700;line-height:1.3;">
                        Your document has been created successfully.
                    </h2>

                    <p style="margin:18px 0 30px;color:#6b7280;font-size:20px;line-height:1.5;">
                        You can go to Documents to view it later,
                        <br />
                        or continue to TSign to send it for signature.
                    </p>

                    <div style="display:flex;align-items:center;justify-content:center;gap:70px;">

                        <button type="button" onclick={handleGoToDocuments}
                            style="min-width:168px;height:42px;padding:0 20px;border-radius:5px;font-size:16px;font-weight:500;cursor:pointer;background:#fff;color:#0176d3;border:1px solid #c9c9c9;">
                            Go to Documents
                        </button>

                        <button type="button" onclick={handleContinueToTSign}
                            style="min-width:168px;height:42px;padding:0 20px;border-radius:5px;font-size:16px;font-weight:500;cursor:pointer;background:#0c9bdc;color:#fff;border:1px solid #0c9bdc;">
                            Continue to TSign
                        </button>

                    </div>

                </div>

            </section>
        </template>

    </div>
</template>
