                  >
                    <div class="floating-label">
                      <span class="label-text-drop"
                        ><span style="color: red">*</span>Type of Vehicle</span
                      >
                      <lightning-combobox
                        name="vehicle"
                        value={vehicleValue}
                        placeholder="Select Type of Vehicle"
                        options={vehicleOptions}
                        variant="label-hidden"
                        onchange={handleChange}
                        required
                      >
                      </lightning-combobox>
                    </div>
                  </div>

                  <!-- Mileage in Km's -->
                  <div
                    class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12"
                  >
                    <div class="floating-label">
                      <span class="label-text-drop"
                        ><span style="color: red">*</span>Mileage in Km's</span
                      >
                      <lightning-input
                        type="number"
                        step=".01"
                        value={others}
                        name="others"
                        variant="label-hidden"
                        onchange={handleChange}
                        max="300.00"
                        required
                      >
                      </lightning-input>
                    </div>
                  </div>

                  <!-- Amount -->
                  <div
                    class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12"
                  >
                    <div class="floating-label">
                      <span class="label-text-drop"
                        ><span style="color: red">*</span>Amount</span
                      >
                      <lightning-input
                        type="number"
                        step=".01"
                        value={amount}
                        name="Amount"
                        variant="label-hidden"
                        onchange={handleChange}
                        max="999999.99"
                        message-when-range-overflow="Amount cannot exceed 999999.99"
                        required
                      >
                      </lightning-input>
                    </div>
                  </div>
                  <!-- File Upload -->
                  <div
                    class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12"
                  >
                    <div class="floating-label">
                      <input
                        type="file"
                        id="fileInput"
                        onchange={onFileUpload}
                        accept=".jpg, .jpeg, .png, .gif"
                        name="file"
                        style="display: none"
                      />
                      <button
                        type="button"
                        onclick={triggerFileInput}
                        class="file-upload-button"
                      >
                        &#8684; Upload File
                      </button>
                      <div class="slds-text-body_small">
                        {fileName}
                        <template if:true={showSpinner}>
                          <lightning-spinner
                            alternative-text="Uploading the file..."
                            size="medium"
                          >
                          </lightning-spinner>
                        </template>
                      </div>
                      <template if:true={isattachError}>
                        <p style="color: red">File size cannot exceed 512MB</p>
                      </template>
                    </div>
                  </div>

                  <!-- Comment -->
                  <div
                    class="slds-col slds-size_1-of-1 slds-medium-size_12-of-12"
                  >
                    <div class="floating-label-comment">
                      <span class="label-text-drop"
                        ><span style="color: red">*</span>Comment</span
                      >
                      <lightning-textarea
                        name="comment"
                        value={comments}
                        variant="label-hidden"
                        onchange={handleChange}
                        required
                      >
                      </lightning-textarea>
                    </div>
                  </div>
                </div>
              </div>
              <!-- Submit Button -->
              <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                  variant="brand"
                  label="Send for Approval"
                  onclick={onSubmitForApproval}
                  disabled={attachDisable}
                >
                </lightning-button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Modal for File Preview -->
    <template if:true={isModalOpen}>
      <div class="slds-p-around_medium">
        <lightning-button
          class="slds-m-left_medium"
          slot="footer"
          label="Back"
          variant="brand"
          onclick={closeModal}
          style="float: right; margin-bottom: 5px"
        ></lightning-button>

        <iframe src={currentUrl} width="100%" height="750vh"></iframe>
      </div>
    </template>

    <template if:true={showSpinner}>
      <lightning-spinner
        alternative-text="Processing..."
        size="large"
      ></lightning-spinner>
    </template>
  </div>

  <!-- Modal for Approval Process -->
  <template if:true={showApprovalModal}>
    <div class="blur-overlay"></div>
    <div class="right-align" style="width: 50%">
      <!-- Header -->
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          width: 100%;
        "
      >
        <h3
          style="
            font-weight: bold;
            font-size: 150%;
            margin: 0;
            padding: 3% 0 0 3%;
          "
        >
          Reimbursement Details - {reimbursementNameforApprove}
        </h3>
        <lightning-button
          label="Back"
          onclick={handleClose}
          variant="brand"
          style="padding-right: 3.5%; padding-top: 2%"
        ></lightning-button>
      </div>

      <!-- Record Edit Form -->
      <lightning-record-edit-form
        object-api-name="Reimbursement__c"
        record-id={reimbursementId}
        onsuccess={handleSuccess}
        onsubmit={handleSubmit}
      >
        <lightning-messages></lightning-messages>

        <div class="seperator-rem">
          <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap">
              <!-- Shift Date -->
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Shift Date</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long">
                    <lightning-output-field
                      field-name="ShiftDate__c"
                      variant="label-hidden"
                    ></lightning-output-field>
                  </div>
                </label>
              </div>

              <!-- Submitted Date -->
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Submitted Date</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long">
                    <lightning-output-field
                      field-name="Submitted_Date__c"
                      variant="label-hidden"
                    ></lightning-output-field>
                  </div>
                </label>
              </div>

              <!-- Login Time -->
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Login Time</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long">
                    <lightning-output-field
                      field-name="Shift_login_time_Formula__c"
                      variant="label-hidden"
                    ></lightning-output-field>
                  </div>
                </label>
              </div>

              <!-- Logout Time -->
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Logout Time</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long">
                    <lightning-output-field
                      field-name="Shift_log_out_time_formula__c"
                      variant="label-hidden"
                    ></lightning-output-field>
                  </div>
                </label>
              </div>

              <!-- Cost per Km -->
              <!-- <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Cost per Km</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long">
                    <lightning-output-field
                      field-name="Cost_per_KM__c"
                      variant="label-hidden"
                    ></lightning-output-field>
                  </div>
                </label>
              </div> -->

              <!-- Mileage Amount -->
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Mileage Amount</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long">
                    <lightning-output-field
                      field-name="Mileage_Amount__c"
                      variant="label-hidden"
                    ></lightning-output-field>
                  </div>
                </label>
              </div>

              <!-- Amount -->
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Amount</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long">
                    <lightning-output-field
                      field-name="Amount__c"
                      variant="label-hidden"
                    ></lightning-output-field>
                  </div>
                </label>
              </div>

              <!-- Total Amount -->
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Total Amount</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long">
                    <lightning-output-field
                      field-name="Total_Amount__c"
                      variant="label-hidden"
                    ></lightning-output-field>
                  </div>
                </label>
              </div>

              <!-- Comments -->
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Comments</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long">
                    <lightning-output-field
                      field-name="Comments__c"
                      variant="label-hidden"
                    ></lightning-output-field>
                  </div>
                </label>
              </div>

              <!-- <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              ></div> -->

              <template if:false={showrejectedModal}>
                <!-- Mileage Bill (Custom Display) -->
                <div
                  class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
                >
                  <label
                    class="labelClass"
                    style="display: flex; align-items: left"
                  >
                    <div class="label-text-long">Mileage Bill</div>
                    <div class="label-separator">:</div>
                    <div class="label-field-long">
                      ${reimbursementmileageAmountforApprove}
                    </div>
                  </label>
                </div>
                <div
                  class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
                >
                  <div class="floating-label-submission" style="width: 100%">
                    <span class="label-text-drop"
                      ><span style="color: red">*</span>Route for Mileage
                      Amount</span
                    >
                    <lightning-input-field
                      field-name="Mileage_Bill__c"
                      variant="label-hidden"
                      required="true"
                    ></lightning-input-field>
                  </div>
                </div>

                <!-- Service Amount (Custom Display) -->
                <div
                  class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
                >
                  <label
                    class="labelClass"
                    style="display: flex; align-items: left"
                  >
                    <div class="label-text-long">Service Amount</div>
                    <div class="label-separator">:</div>
                    <div class="label-field-long">
                      ${reimbursementAmountforApprove}
                    </div>
                  </label>
                </div>
                <div
                  class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
                >
                  <div class="floating-label-submission" style="width: 100%">
                    <span class="label-text-drop"
                      ><span style="color: red">*</span>Route for Service
                      Amount</span
                    >
                    <lightning-input-field
                      field-name="Service_Amount__c"
                      variant="label-hidden"
                      required="true"
                    ></lightning-input-field>
                  </div>
                </div>
              </template>

              <!-- Service Amount (Custom Display) -->
              <!-- <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small"
              >
                <label
                  class="labelClass"
                  style="display: flex; align-items: left"
                >
                  <div class="label-text-long">Approver Comments</div>
                  <div class="label-separator">:</div>
                  <div class="label-field-long"></div>
                </label>
              </div> -->
              <div
                class="slds-size_1-of-1 slds-medium-size_2-of-2 slds-p-around_small"
              >
                <div class="floating-label-comment1" style="width: 100%">
                  <span class="label-text-drop">Approver Comments</span>
                  <lightning-input-field
                    field-name="Approver_Comments__c"
                    variant="label-hidden"
                  ></lightning-input-field>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="slds-p-around_medium slds-text-align_center">
          <lightning-button
            label="Cancel"
            onclick={handleClose}
            variant="neutral"
            class="slds-m-right_small"
          ></lightning-button>
          <lightning-button
            type="submit"
            label="Update"
            variant="brand"
          ></lightning-button>
        </div>
      </lightning-record-edit-form>
    </div>
  </template>

</template>
