<template>
  <div class="main-container">
    <template if:false={hideSubmittedForms}>
      <template if:false={isFormSelected}>

        <template if:true={showPublishedForms}>
          <div class="blur-overlay">
            <div class="right-align" style="width: 65%">
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                "
              >
                <h3
                  style="
                    font-size: 140%;
                    font-weight: bold;
                    margin-bottom: 0.5%;
                    margin-top: 1%;
                    margin-left: 2%;
                  "
                >
                  Published Forms
                </h3>
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    padding-right: 2%;
                  "
                >
                  <lightning-button
                    variant="brand-outline"
                    label="Cancel"
                    title="Cancel"
                    onclick={handleCancelPublishedForms}
                  >
                  </lightning-button>
                </div>
              </div>

              <div style="flex: 1; display: flex; justify-content: center">
                <div class="floating-label">
                  <span class="label-text-drop">Search Forms</span>
                  <lightning-input
                    type="search"
                    variant="label-hidden"
                    placeholder="Search by form name..."
                    onchange={handleSearchChange}
                  >
                  </lightning-input>
                </div>
              </div>

              <!-- <div class="form-3d-container">
                <template for:each={filteredForms} for:item="form">
                  <div
                    key={form.Id}
                    class="article"
                    data-id={form.Id}
                    onclick={handleFormClick}
                  >
                    <div class="back"></div>
                    <div class="content-wrapper">
                      <img src={form3D} alt="Document" />
                      <span class="filename">{form.Name__c}</span>
                    </div>
                  </div>
                </template>
              </div>

              <template if:false={filteredForms.length}>
                <p>No forms found.</p>
              </template> -->

              <div class="form-3d-container">
                <template for:each={filteredForms} for:item="form">
                  <div
                    key={form.Id}
                    class="form-card"
                    data-id={form.Id}
                    onclick={handleFormClick}
                    onmouseover={handleHover}
                    onmouseout={handleMouseOut}
                  >
                    <img
                      src={form.formImageUrl}
                      alt="Form Preview"
                      class="form-image"
                    />
                    <div class="form-card-footer">
                      <div class="layout-title">{form.Name__c}</div>
                    </div>
                  </div>
                </template>

                <template if:false={filteredForms.length}>
                  <p>No forms found.</p>
                </template>
              </div>
            </div>
          </div></template
        >
        <template if:false={hideSearchAndActions}>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding-right: 1%;
            "
          >
            <div class="floating-label-input">
              <span class="label-text-drop">Search</span>
              <lightning-input
                type="search"
                value={submittedFormsSearchKey}
                onchange={handleSubmittedFormsSearch}
                variant="label-hidden"
                placeholder="Search by Form Name, Type, Assigned To, Date..."
              >
              </lightning-input>
            </div>
            <div style="display: flex; gap: 10px; margin-left: auto">
              <template if:true={showFormsAccessClick}>
                <lightning-button
                  label="Manage Incident"
                  variant="brand-outline"
                  onclick={handleAccessButtonClick}
                  style="margin-right: 10px"
                >
                </lightning-button>
              </template>
              <lightning-button
                label="Create Incident"
                variant="brand"
                onclick={togglePublishedForms}
              >
              </lightning-button>
              <!-- <lightning-button 
            label="Create form"
            onclick={handleRedirectClick}
            variant="brand">
        </lightning-button> -->
            </div>
          </div>

          <template if:false={hasFormResponses}>
          <p class="no-records">No submitted forms available.</p>
        </template>
        </template>
        <template if:true={hasFormResponses}>

          <div class="table-container custom-scroll">
            <table class="custom-table">
              <thead>
                <tr class="custom-table-header">
                  <th class="custom-th">Form Name</th>
                  <!-- <th class="custom-th">Form Type</th> -->
                  <th class="custom-th">Assigned To</th>
                  <th class="custom-th">Submitted By</th>
                  <th class="custom-th">Submission Date</th>
                  <th class="custom-th">Status</th>
                  <th class="custom-th">Actions</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={paginatedFormResponses} for:item="response">
                  <tr key={response.Id} class="custom-tr">
                    <td class="custom-td">
                      <a
                        href="javascript:void(0);"
                        onclick={handleFormHistoryClick}
                        data-id={response.Id}
                        style="
                          color: #0070d2;
                          text-decoration: underline;
                          cursor: pointer;
                        "
                      >
                        {response.Name__c}
                      </a>
                    </td>

                    <!-- <td class="custom-td">{response.Form_Type__c}</td> -->

                    <td class="custom-td">{response.AssignedStaffName}</td>
                     <td class="custom-td">{response.SubmittedBy}</td>
                    <td class="custom-td">{response.FormattedDate}</td>
                    <td class="custom-td">
                      <span
                        class="status-indicator"
                        data-status={response.Status__c}
                      >
                        {response.Status__c}
                      </span>
                    </td>
                    <td class="custom-td custom-actions">

                      <!-- VIEW -->
                      <a
                          href="javascript:void(0);"
                          data-id={response.Id}
                          onclick={handleView}
                          title="View"
                          class="action-link"
                      >
                          <i class="material-icons view-icon" data-id={response.Id}>
                              visibility
                          </i>
                      </a>

                      &nbsp;
                     <!-- EDIT -->
                      <template if:true={response.canEdit}>
                        <a
                            href="javascript:void(0);"
                            data-id={response.Id}
                            onclick={handleEdit}
                            title="Edit"
                            class="action-link"
                        >
                            <i
                              class="material-icons edit-icon"
                              data-id={response.Id}
                            >
                                edit_document
                            </i>
                        </a>

                        &nbsp;
                      </template>

                      <!-- DELETE -->
                      <template if:true={response.canDelete}>
                        <a
                            href="javascript:void(0);"
                            data-id={response.Id}
                            onclick={handleDelete}
                            title="Delete"
                            class="action-link"
                        >
                            <i
                              class="material-icons delete-icon"
                              data-id={response.Id}
                            >
                                delete
                            </i>
                        </a>
                      </template>


                  </td>

                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <template if:true={showFormHistoryModal}>
            <div class="incident-history-backdrop">
              <div class="incident-history-modal">
                <div class="incident-history-header">
                  <h2>Incident Edit History</h2>
                  <button
                    class="incident-history-close"
                    onclick={closeFormHistory}
                  >
                    ×
                  </button>
                </div>
                <div class="history-timeline">
                  <template for:each={groupedFormHistory} for:item="group">
                    <div key={group.date} class="history-date-section">
                      <div class="history-date-label">{group.date}</div>
                      <template for:each={group.entries} for:item="entry">
                        <div key={entry.timestamp} class="history-entry">
                          <div class="entry-time">{entry.time}</div>
                          <div class="entry-content">
                            <div class="entry-header">
                              <div class="avatar-circle">{entry.initials}</div>
                              <div class="entry-meta">
                                <span class="entry-user">{entry.user}</span>
                                <span class="entry-action">{entry.action}</span>
                              </div>
                            </div>
                            <div class="entry-body">{entry.content}</div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <div class="incident-history-footer">
                  <lightning-button
                    label="Close"
                    onclick={closeFormHistory}
                    variant="brand-outline"
                  >
                  </lightning-button>
                </div>
              </div>
            </div>
          </template>

          <!-- Pagination Controls for Submitted Forms -->
          <template if:true={totalFormRecords}>
            <div
              class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-left_xx-large fixed-pagination" style="padding-top: 0.5em;"
            >
              <!-- Left empty column (optional for spacing) -->
              <div class="slds-col slds-size_1-of-3">
                <div class="slds-list_inline slds-p-bottom_xx-small">
                  <label
                      class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center"
                      for="recordsPerPage"
                  >
                      Page Size:
                  </label>

                  <div class="slds-select_container">
                      <select
                            class="slds-select"
                            id="recordsPerPage"
                            value={formPageSize}
                            onchange={handleFormPageSizeChange}
                        >

                          <template for:each={pageSizeOptions} for:item="option">
                              <option key={option} value={option}>
                                  {option}
                              </option>
                          </template>
                      </select>
                  </div>
              </div>

              </div>

              


              <!-- Center: Pagination Buttons with spacing -->
              <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                <div class="slds-grid slds-gutters slds-align_absolute-center">
                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableFirstFormPage}
                    icon-name="utility:jump_to_left"
                    label="First"
                    onclick={firstFormPage}
                  >
                  </lightning-button>

                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableFirstFormPage}
                    icon-name="utility:chevronleft"
                    label="Previous"
                    onclick={previousFormPage}
                  >
                  </lightning-button>

                  <span class="slds-badge slds-m-horizontal_small">
                    Showing {formPageNumber} of {totalFormPages} Page(s)
                  </span>

                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableLastFormPage}
                    icon-name="utility:chevronright"
                    label="Next"
                    onclick={nextFormPage}
                  >
                  </lightning-button>

                  <lightning-button
                    class="slds-m-horizontal_x-small"
                    disabled={disableLastFormPage}
                    icon-name="utility:jump_to_right"
                    label="Last"
                    onclick={lastFormPage}
                  >
                  </lightning-button>
                </div>
              </div>

              <!-- Right: Total Records Count -->
              <div class="slds-col slds-size_1-of-3 slds-text-align_right">
                <span class="slds-badge"
                  >Total Submitted Forms: {totalFormRecords}</span
                >
              </div>
            </div>
          </template>

          
        </template>
        

      </template>

      <!-- View Mode -->
      <!-- View Mode -->
      <template if:true={isViewMode}>
        <div class="view-popup-container">
          <div class="view-popup-content">
            <!-- ✅ Popup Header -->
            <div class="view-popup-header">
              <div class="form-header-grid">
                <div class="field-group">
                  <span class="field-label">Form Name:</span>
                  <span class="field-value">{selectedForm.Name__c}</span>
                </div>
                <div class="field-group">
                  <span class="field-label">Form Type:</span>
                  <span class="field-value">{selectedForm.Form_Type__c}</span>
                </div>
                <div class="field-group">
                  <span class="field-label">Assigned To:</span>
                  <span class="field-value"
                    >{selectedForm.Incident_Assigned_Staff__r.Name}</span
                  >
                </div>
                <div class="field-group">
                  <span class="field-label">Submission Date:</span>
                  <span class="field-value">{formattedSubmissionDate}</span>
                </div>
              </div>
              <button class="view-popup-close" onclick={closeView}>
                &times;
              </button>
            </div>

            <!-- ✅ Table Container -->
            <div class="view-popup-table-container custom-scroll">
              <table class="view-popup-table">
                <thead>
                  <tr>
                    <th>Field Name</th>
                    <th>Value</th>
                  </tr>
                </thead>
                <tbody>
                  <template iterator:item={viewTableData}>

                    <!-- ================================= -->
                    <!-- 🔹 PAGE BREAK ROW -->
                    <!-- ================================= -->
                    <template if:true={item.value.isPageBreak}>
                      <!-- Page Header: Accordion Toggle Row -->
                      <tr key={item.value.key}>
                        <td
                          colspan="2"
                          class="page-break-row"
                          onclick={togglePageSection}
                          data-page={item.value.pageNumber}
                        >
                          <div class="page-divider">
                            <span>
                              <span class="arrow">{item.value.arrow}</span>
                              <span class="material-icons page-icon"
                                >description</span
                              >
                              Page {item.value.pageNumber}
                            </span>
                          </div>
                        </td>
                      </tr>
                    </template>

                    <!-- ================================= -->
                    <!-- 🔹 NON PAGE-BREAK ROW -->
                    <!-- ================================= -->
                    <template if:false={item.value.isPageBreak}>

                      <!-- ================================= -->
                      <!-- ✅ SECTION HEADER -->
                      <!-- ================================= -->
                      <template if:true={item.value.isSectionHeader}>
                        <tr key={item.value.key} if:true={item.value.isVisible}>
                          <td
                            colspan="2"
                            class="section-cell"
                            style={item.value.headerStyle}
                          >
                            {item.value.title}
                          </td>
                        </tr>
                      </template>

                      <!-- ================================= -->
                      <!-- ✅ NORMAL FIELD ROW -->
                      <!-- ================================= -->
                      <template if:false={item.value.isSectionHeader}>
                        <template if:true={item.value.isVisible}>
                          <tr key={item.value.key}>
                            <td class="view-table-label">
                              {item.value.label}
                            </td>

                            <td class="view-table-value">

                              <!-- Checkbox -->
                              <template if:true={item.value.isCheckbox}>
                                <lightning-icon
                                  class="view-checkbox-icon"
                                  icon-name={item.value.value}
                                  alternative-text="Checkbox"
                                  size="xx-small"
                                  style="transform: scale(0.6)"
                                >
                                </lightning-icon>
                              </template>

                              <!-- File Upload -->
                              <!-- ============================= -->
                                <!-- 📎 FILE UPLOAD -->
                                <!-- ============================= -->
                                <template if:true={item.value.isUploadFile}>

                                  <!-- ✅ Files exist -->
                                  <template if:true={item.value.uploadedFiles.length}>

                                    <template
                                      for:each={item.value.uploadedFiles}
                                      for:item="file"
                                    >
                                      <div
                                        key={file.fileId}
                                        class="upload-view-row"
                                      >

                                        <!-- 🖼️ Image Preview -->
                                        <template if:true={file.isImage}>
                                          <img
                                            src={file.url}
                                            alt={file.originalName}
                                            class="uploaded-image"
                                          />
                                        </template>

                                        <!-- ⬇️ Download Link -->
                                        <a
                                            href="javascript:void(0);"
                                            class="download-link"
                                            data-url={file.url}
                                            data-name={file.originalName}
                                            onclick={handleDownloadFile}
                                          >
                                            <lightning-icon
                                              icon-name="utility:download"
                                              size="xx-small"
                                              alternative-text="Download"
                                              class="download-icon"
                                            >
                                            </lightning-icon>

                                            {file.originalName}
                                          </a>


                                      </div>
                                    </template>

                                  </template>

                                  <!-- 🚫 No files -->
                                  <template if:false={item.value.uploadedFiles.length}>
                                    <span>No File Uploaded</span>
                                  </template>

                                </template>


                              <!-- Rich Text -->
                              <template if:true={item.value.isRichText}>
                                <div class="rich-text-view-container">
                                  <div
                                    class="rich-text-view"
                                    lwc:dom="manual"
                                    data-id={item.value.id}
                                  ></div>
                                </div>
                              </template>

                              <!-- Radio Button -->
                              <template if:true={item.value.isRadioButton}>
                                <span class="view-radio-value">
                                  {item.value.value}
                                </span>
                              </template>

                              <!-- ============================= -->
                              <!-- ✍️ SIGNATURE FIELD -->
                              <!-- ============================= -->
                              <template if:true={item.value.isSignature}>
                                <template if:true={item.value.value}>
                                  <img
                                    src={item.value.value}
                                    alt="Signature"
                                    class="signature-preview-img"
                                  />
                                </template>
                                <template if:false={item.value.value}>
                                  <span>No Signature</span>
                                </template>
                              </template>

                              <!-- Regular Field -->
                              <template if:true={item.value.isRegularField}>
                                <span>{item.value.value}</span>
                              </template>

                            </td>
                          </tr>
                        </template>
                      </template>

                    </template>

                  </template>

                </tbody>
              </table>
            </div>

            <!-- ✅ Popup Footer -->
            <div class="view-popup-footer">
              <lightning-button
                label="Download PDF"
                variant="brand"
                onclick={downloadPdf}
              >
              </lightning-button>

              <lightning-button
                label="Export CSV"
                variant="brand"
                onclick={handleDownloadCSV}
              >
              </lightning-button>

              <lightning-button
                label="Close"
                variant="brand-outline"
                onclick={closeView}
              >
              </lightning-button>
            </div>
          </div>
        </div>
      </template>
    </template>
    <template if:false={isFormSelected}>
      <template if:false={hideFormAccessTable}>
        <template if:true={showFormsAccess}>
          <div class="menu-container">
            <div class={designTabClass} onclick={handleDesignTab}>
              Design New Form
            </div>
            <div class={draftTabClass} onclick={handleDraftTab}>
              Draft & Published Forms
            </div>
            <!-- <div class={createdTabClass} onclick={handleCreatedTab}>
              Published Forms
            </div> -->

            <div style="margin-left: auto; margin-right: 0.5%">
              <lightning-button
                label="Close"
                title="Close"
                onclick={handleBackFromAccess}
                variant="brand"
              ></lightning-button>
            </div>
          </div>

          <div class="content-wrapper custom-scroll">
            <!-- Design New Forms Tab -->
            <template if:true={isDesignTabSelected}>
              <template if:true={shouldRenderFormRender}>
                <div class="form-render-wrapper">
                  <c-form-create-incident
                    orgid={orgid}
                    layout-data={receivedLayoutData}
                    onnavigateaway={handleConfirmedTabSwitch}
                    lwc:ref="formCreateIncident"
                    selected-module-type="Incident Register"
                    
                  ></c-form-create-incident>
                  <!-- trigger-new-design -->
                </div>
              </template>
            </template>
            <template if:true={isDraftTabSelected}>
              <div class="draft-wrapper">
                <c-layout-list-incident
                  layout-data={receivedLayoutData}
                  orgid={orgid}
                  form-module="Incident Register"
                ></c-layout-list-incident>
              </div>
            </template>

            <template if:true={isCreatedTabSelected}>
              <div class="incident-wrapper">
               
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 2%;
                    width: 100%;
                    padding-right: 1%;
                  "
                >
             
                  <div class="floating-label-input" style="width: 280px">
                    <span class="label-text-drop">Search Staff</span>
                    <lightning-input
                      type="search"
                      value={formAccessSearchKey}
                      onchange={handleFormAccessSearch}
                      variant="label-hidden"
                      placeholder="Search by Staff Name"
                    >
                    </lightning-input>
                  </div>

                 
                  <div
                    class="menu-icon"
                    onclick={togglePopover}
                    style="cursor: pointer"
                  >
                    <div></div>
                    <div></div>
                    <div></div>
                  </div>

                  <lightning-button
                    label="Grant Access"
                    onclick={handleBulkGrantAccessClick}
                    variant="brand"
                    style="margin-left: auto"
                  >
                  </lightning-button>
             
                </div>

                <template if:true={isPopoverVisible}>
                  <div class="blur-overlay">
                    <div class="right-align" style="width: 30%">
                      <div class="sidebar-content">
                        <div class="sidebar-header">
                          <span class="sidebar-title">Filter Staff</span>
                          <span class="close-btn" onclick={closePopover}
                            >&times;</span
                          >
                        </div>

                        <div class="filter-section">
                          <label class="section-title">Facility Name</label>
                          <div class="filter-scroll">
                            <template if:true={staffFacilityOptions}>
                              <lightning-checkbox-group
                                name="Facility"
                                options={staffFacilityOptions}
                                value={chosenFacilityValues}
                                onchange={handleCheckBoxChange}
                              >
                              </lightning-checkbox-group>
                            </template>
                          </div>
                        </div>

                        <div class="filter-section">
                          <label class="section-title">Select Role Type</label>
                          <div class="filter-scroll">
                            <template if:true={staffRoleOptions}>
                              <lightning-checkbox-group
                                name="progress"
                                options={staffRoleOptions}
                                value={chosenRoleValues}
                                onchange={handleCheckBoxChange}
                              >
                              </lightning-checkbox-group>
                            </template>
                          </div>
                        </div>
                      
                        <div class="filter-footer">
                          <lightning-button
                            label="Apply Filters"
                            onclick={closePopover}
                            variant="brand"
                            class="submit-button"
                          >
                          </lightning-button>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>

                <template if:true={recordsToDisplay}>
                  <div class="table-container">
                    <table class="custom-table">
                      <thead>
                        <tr class="custom-table-header">
                          <th class="custom-th">
                            <div style="display: flex; align-items: center">
                              <lightning-input
                                type="checkbox"
                                onchange={toggleSelectAllStaff}
                                checked={isAllStaffSelected}
                              ></lightning-input>
                              <span>Select</span>
                            </div>
                          </th>
                          <th class="custom-th">Staff Name</th>
                       
                          <th class="custom-th">Facility</th>
                     
                          <th class="custom-th">Role</th>
                          <th class="custom-th">Staff Status</th>
                        
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={recordsToDisplay} for:item="staff">
                          <tr key={staff.Id} class="custom-tr">
                            <td class="custom-td">
                              <lightning-input
                                type="checkbox"
                                data-id={staff.Id}
                                checked={staff.isSelected}
                                onchange={handleStaffSelection}
                              ></lightning-input>
                            </td>
                            <td class="custom-td">
                              {staff.firstName} {staff.lastName}
                            </td>
                                                     -->
                            <td class="custom-td">{staff.facilityName}</td>
                            <td class="custom-td">{staff.role}</td>
                            <td class="custom-td">{staff.displayStatus}</td>
                          
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>

             
                <template if:true={totalRecords}>
                  <div
                    class="slds-grid slds-align_absolute-center slds-p-around_medium"
                  >
                    <!-- Left empty column (optional) -->
                    <div class="slds-col slds-size_1-of-3"></div>

                    <!-- Center: Pagination Buttons with spacing -->
                    <div
                      class="slds-col slds-size_1-of-3 slds-text-align_center"
                    >
                      <div
                        class="slds-grid slds-gutters slds-align_absolute-center"
                      >
                        <lightning-button
                          class="slds-m-horizontal_x-small"
                          disabled={bDisableFirst}
                          icon-name="utility:jump_to_left"
                          label="First"
                          onclick={firstPage}
                        >
                        </lightning-button>

                        <lightning-button
                          class="slds-m-horizontal_x-small"
                          disabled={bDisableFirst}
                          icon-name="utility:chevronleft"
                          label="Previous"
                          onclick={previousPage}
                        >
                        </lightning-button>

                        <span class="slds-badge slds-m-horizontal_small">
                          Showing {pageNumber} of {totalPages} Page(s)
                        </span>

                        <lightning-button
                          class="slds-m-horizontal_x-small"
                          disabled={bDisableLast}
                          icon-name="utility:chevronright"
                          label="Next"
                          onclick={nextPage}
                        >
                        </lightning-button>

                        <lightning-button
                          class="slds-m-horizontal_x-small"
                          disabled={bDisableLast}
                          icon-name="utility:jump_to_right"
                          label="Last"
                          onclick={lastPage}
                        >
                        </lightning-button>
                      </div>
                    </div>

                    <!-- Right: Total Records -->
                    <div
                      class="slds-col slds-size_1-of-3 slds-text-align_right"
                    >
                      <span class="slds-badge"
                        >Total Staff: {totalRecords}</span
                      >
                    </div>
                  </div>
                </template>

               
                <template if:true={isGrantAccessPopupOpen}>
                  <div class="grant-modal-overlay">
                    <div class="grant-modal">
                      <!-- Header -->
                      <div class="grant-modal-header">
                        <span class="grant-modal-title">
                          <template if:false={isBulkGrantMode}>
                            Grant Access to {selectedStaffName}
                          </template>
                          <template if:true={isBulkGrantMode}>
                            Grant Access to {selectedStaffNamesPreview}
                          </template>
                        </span>

                        <button
                          class="grant-modal-close"
                          onclick={closeGrantAccessPopup}
                        >
                          &times;
                        </button>
                      </div>

                      <!-- Body -->
                      <div class="grant-modal-body">
                        <!-- <p>Select the forms to grant access to this staff:</p> -->
                        <div class="floating-label-input-grant">
                          <span class="label-text-drop">Search Forms</span>
                          <lightning-input
                            type="search"
                            placeholder="Search by form name..."
                            variant="label-hidden"
                            onchange={handleFormSearch}
                          >
                          </lightning-input>
                        </div>
                        <template if:true={filteredAvailableForms}>
                          <div class="grant-form-list">
                            <template
                              for:each={filteredAvailableForms}
                              for:item="form"
                            >
                              <div key={form.Id} class="grant-form-item">
                                <label class="grant-radio-container">
                                  <input
                                    type="radio"
                                    name="form-selection"
                                    value={form.Id}
                                    checked={form.isSelected}
                                    data-id={form.Id}
                                    onchange={handleFormSelection}
                                  />
                                  <span class="grant-custom-radio"></span>
                                  <span class="grant-radio-label"
                                    >{form.Name__c}</span
                                  >
                                </label>
                              </div>
                            </template>
                          </div>
                        </template>

                        <template if:false={filteredAvailableForms}>
                          <p>No published forms available.</p>
                        </template>
                      </div>

                      <!-- Footer -->
                      <div class="grant-modal-footer">
                        <lightning-button
                          variant="brand-outline"
                          label="Cancel"
                          onclick={closeGrantAccessPopup}
                        ></lightning-button>
                        <lightning-button
                          variant="brand"
                          label="Grant Access"
                          onclick={grantAccess}
                        ></lightning-button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </template>
    </template>

    <template if:true={isFormSelected}>
      <div class="form-title-container">
        <h3 class="form-title">{selectedFormType}</h3>
      </div>
      <template if:true={showProgressIndicator}>
        <div class="progress-container">
          <!-- Blue fill line -->
          <div class="progress-line">
            <div class="progress-fill" style={progressFillStyle}></div>
          </div>

          <!-- Step Circles -->
          <div class="step-wrapper">
            <template for:each={visualProgressSteps} for:item="step">
              <div
                key={step.index}
                class="step"
                data-index={step.index}
                onclick={handleStepClick}
              >
                <div class={step.circleClass}>
                  <template if:true={step.isCompleted}>
                    <lightning-icon
                      icon-name="utility:check"
                      size="x-small"
                      class="check-icon"
                    ></lightning-icon>
                  </template>
                </div>
                <div class={step.labelClass}>{step.label}</div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <div class="excel-table-container">
        <table class="excel-table">
          <tbody>
            <template for:each={tableRows} for:item="row">
              <tr key={row.id} style={row.displayStyle}>
                <template for:each={row.cells} for:item="cell">
                  <template if:true={cell.isVisible}>
                    <!-- Only render <td> if there is a valid field -->
                    <template if:true={cell.field}>
                      <td
                        key={cell.id}
                        class="table-cell"
                        colspan={cell.colspan}
                        rowspan={cell.rowspan}
                      >
                        <template if:true={cell.hasContent}>
                          <div
                            class="floating-label"
                            style={cell.floatingLabelStyle}
                          >
                            <span class="label-text-drop">
                              <template if:true={cell.field.isRequired}>
                                <span style="color: red">*</span>
                              </template>
                              {cell.field.label}
                            </span>

                            <template if:true={cell.hasComment}>
                              <span class="tooltip-container">
                                <lightning-icon
                                  icon-name="utility:info"
                                  size="xx-small"
                                  class="info-icon"
                                ></lightning-icon>
                                <span class="tooltip-text"
                                  >{cell.field.comments}</span
                                >
                              </span>
                            </template>

                            <template if:true={cell.field.isHeader}>
                            <div
                              class="fc-header"
                              style={cell.field.inlineStyle}
                            >
                              {cell.field.text}
                            </div>
                          </template>



                            <template if:true={cell.isTextField}>
                              <input
                                type="text"
                                data-id={cell.id}
                                value={cell.field.value}
                                onchange={handleInputChange}
                                class="input-field"
                                placeholder={cell.placeholderText}
                              />
                            </template>

                            <template if:true={cell.isTextArea}>
                              <textarea
                                data-id={cell.id}
                                class="input-textarea"
                                maxlength="255"
                                placeholder={cell.placeholderText}
                                oninput={handleTextAreaInput}
                              >
{cell.field.value}</textarea
                              >
                            </template>

                            <!-- ✅ AlphaNumeric Text Field (Restricts special chars) -->
                            <template if:true={cell.isAlphaNumeric}>

                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  maxlength={cell.maxLength}
                                  pattern="[A-Za-z0-9]*"
                                  onkeypress={restrictAlphaNumeric}
                                  oninput={validateAlphaNumeric}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                  disabled
                                />
                              </template>
                              <template if:false={cell.field.isDisabled}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}

                                  pattern="[A-Za-z0-9]*"

                                  oninput={validateAlphaNumeric}
                                  onchange={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>
                            </template>

                            <!-- ✅ Only Alphabets Text Field (No numbers, no special chars) -->
                            <template if:true={cell.isOnlyAlphabets}>

                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  maxlength={cell.maxLength}
                                  pattern="[A-Za-z]*"
                                  onkeypress={restrictOnlyAlphabets}
                                  oninput={validateOnlyAlphabets}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                  disabled
                                />
                              </template>
                              <template if:false={cell.field.isDisabled}>
                                <input
                                  type="text"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  maxlength={cell.maxLength}
                                  pattern="[A-Za-z]*"
                                  onkeypress={restrictOnlyAlphabets}
                                  oninput={validateOnlyAlphabets}
                                  onchange={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>
                            </template>

                            <template if:true={cell.isRichText}>
                              <lightning-input-rich-text

                                value={cell.field.value}

                                placeholder={cell.placeholderText}
                                class="rich-text-editor"
                              >
                              </lightning-input-rich-text>
                            </template>

                            <template if:true={cell.isNumberField}>
                              <template if:true={cell.isContactNumber}>
                                <template if:true={cell.field.isDisabled}>

                                    type="text"
                                    data-id={cell.id}
                                    value={cell.field.value}
                                    maxlength={cell.maxLength}

                                    oninput={validateNumbersOnly}
                                    class="input-field"
                                    placeholder={cell.placeholderText}
                                    disabled
                                  />
                                </template>
                                <template if:false={cell.field.isDisabled}>
                                  <input
                                    type="text"
                                    data-id={cell.id}
                                    value={cell.field.value}
                                    maxlength={cell.maxLength}
                                    pattern="[0-9]*"
                                    onkeypress={restrictNumbersOnly}
                                    oninput={validateNumbersOnly}
                                    onchange={handleInputChange}
                                    class="input-field"
                                    placeholder={cell.placeholderText}
                                  />
                                </template>
                              </template>

                              <template if:true={cell.isCurrency}>

                                  onkeypress={restrictCurrencyInput}
                                  oninput={validateCurrencyInput}
                                  onchange={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>

                              <template if:true={cell.isDefaultNumber}>
                                <input
                                  type="number"
                                  data-id={cell.id}
                                  value={cell.field.value}
                                  onchange={handleInputChange}
                                  class="input-field"
                                  placeholder={cell.placeholderText}
                                />
                              </template>
                            </template>

                            <!-- ✅ Time Field (No Formatting) -->
                            <template if:true={cell.isTimeField}>
                              <input
                                type="time"
                                data-id={cell.id}
                                value={cell.field.value}
                                onchange={handleInputChange}
                                class="input-field"
                                placeholder={cell.placeholderText}
                              />
                            </template>

                            <!-- ✅ Date Field (No Formatting) -->
                            <template if:true={cell.isDateField}>
                              <input
                                type="date"
                                data-id={cell.id}
                                value={cell.field.value}
                                onchange={handleInputChange}
                                class="input-field"
                                placeholder={cell.placeholderText}
                              />
                            </template>

                            <!-- ✅ Checkbox Field (Slider Toggle) -->
                            <template if:true={cell.isCheckboxField}>
                              <label class="switch">
                                <input
                                  type="checkbox"

                                />
                                <span class="slider"></span>
                              </label>
                            </template>

                            <template if:true={cell.isDropdownField}>
                              <template if:false={cell.isMultiSelect}>

                                    data-id={cell.id}
                                    value={cell.field.value}
                                    class="input-dropdown"
                                    disabled
                                  >
                                    <option
                                      value=""
                                      disabled
                                      class="dropdown-placeholder"
                                    >
                                      {cell.placeholderText}
                                    </option>
                                    <option value="None">None</option>
                                    <template
                                      for:each={cell.field.options}
                                      for:item="option"
                                    >
                                      <option
                                        key={option.label}
                                        value={option.value}
                                        selected={option.isSelected}
                                      >
                                        {option.label}
                                      </option>
                                    </template>
                                  </select>
                                </template>
                                <template if:false={cell.field.isDisabled}>
                                  <!-- Enabled Single Select Dropdown -->
                                  <select
                                    data-id={cell.id}
                                    value={cell.field.value}
                                    onchange={handleInputChange}
                                    class="input-dropdown"
                                  >
                                    <option
                                      value=""
                                      disabled
                                      class="dropdown-placeholder"
                                    >
                                      {cell.placeholderText}
                                    </option>
                                    <option value="None">None</option>
                                    <template
                                      for:each={cell.field.options}
                                      for:item="option"
                                    >
                                      <option
                                        key={option.label}
                                        value={option.value}
                                        selected={option.isSelected}
                                      >
                                        {option.label}
                                      </option>
                                    </template>
                                  </select>
                                </template>
                              </template>

                              <template if:true={cell.isMultiSelect}>
                                <div class="multi-dropdown-container">
                                  <!-- Selected Options Display -->
                                  <div
                                    class="multi-selected-values"
                                    data-id={cell.id}
                                    onclick={toggleDropdown}
                                  >
                                    <template
                                      for:each={cell.field.options}
                                      for:item="option"
                                    >
                                      <template if:true={option.isSelected}>
                                        <span
                                          key={option.label}
                                          class="selected-option"
                                        >
                                          {option.label}
                                          <span
                                            class="remove-option"
                                            data-id={cell.id}
                                            data-value={option.label}
                                            onclick={removeSelectedOption}
                                            >&times;</span
                                          >
                                        </span>
                                      </template>
                                    </template>
                                    <span
                                      class="multi-select-icon"
                                      title="Multi-select"
                                      data-id={cell.id}
                                      onclick={handleIconClick}
                                      >&#10507;</span
                                    >
                                  </div>

                                  <!-- Dropdown Options -->
                                  <div
                                    class="multi-dropdown-options"
                                    if:true={cell.isDropdownOpen}
                                  >
                                    <template
                                      for:each={cell.field.options}
                                      for:item="option"
                                    >
                                      <label
                                        key={option.label}
                                        class="multi-dropdown-item"
                                      >
                                        <input
                                          type="checkbox"
                                          value={option.label}
                                          data-id={cell.id}
                                          checked={option.isSelected}
                                          onchange={handleMultiSelectChange}
                                        />
                                        {option.label}
                                      </label>
                                    </template>
                                    <div class="multi-dropdown-footer">
                                      <button
                                        class="multi-dropdown-save"
                                        data-id={cell.id}
                                        onclick={saveMultiSelect}
                                      >
                                        Save
                                      </button>
                                    </div>
                                  </div>
                                </div>
                              </template>
                            </template>

                            <!-- ✅ RADIO BUTTON TYPE -->
                            <template if:true={cell.isRadioButton}>
                              <div class="incident-radio-group">
                                <template
                                  for:each={cell.radioOptionsProcessed}
                                  for:item="option"
                                >
                                  <div
                                    key={option.optionLabel}
                                    class="incident-radio-option"
                                  >
                                    <input
                                      type="radio"
                                      class="incident-radio-input"
                                      name={cell.id}
                                      value={option.optionLabel}
                                      data-id={cell.id}

                                          >

            &#8592;
          </button>

          <span class="page-info"
            >Page {currentPageDisplay} of {totalFormPages}</span
          >

          <button
            class="circle-btn next"
            onclick={goToNextPage}
            disabled={isLastPage}
          >
            &#8594;
          </button>
        </div>
        <lightning-button
          variant="brand"
          label="Submit"
          onclick={handleSubmit}
        ></lightning-button>
      </div>
    </template>
  </div>


<template if:true={showDeleteConfirm}>
  <section
    aria-describedby="modal-content-id-delete"
    aria-labelledby="modal-heading-delete"
    aria-modal="true"
    class="slds-modal slds-fade-in-open"
    role="dialog"
    tabindex="-1"
  >
    <div class="slds-modal__container modal-container" style="max-width: 25%;">
      <!-- Header -->
      <header class="slds-modal__header" style="background:#002A52;">
        <h2
          class="slds-text-heading_medium slds-hyphenate"
          style="color:white;font-weight:bold;text-align: center;"
        >
          Delete Confirmation
        </h2>
      </header>

      <!-- Modal Content -->
      <div class="slds-modal__content slds-p-around_medium modal-content">
        <div class="slds-m-around_small" style="text-align:center">
          <h1>
            <p>Are you sure you want to delete this form response?</p>
          </h1>
          <p class="slds-m-top_small">
    <strong>Form Name:</strong> {deleteFormName}
  </p>

          <!-- Centered Buttons -->
          <div class="button-container slds-m-top_medium">
            <lightning-button
              label="Delete"
              variant="brand"
              onclick={handleDeleteConfirm}
              class="slds-m-around_small"
            >
            </lightning-button>

            <lightning-button
              label="Cancel"
              variant="brand-outline"
              onclick={handleDeleteCancel}
              class="slds-m-around_small"
            >
            </lightning-button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="slds-backdrop slds-backdrop_open"></div>
</template>

<template if:true={isLoading}>
    <div class="overlay-logo"></div>

    <div class="spinner-wrapper">
      <div class="loader-container">
        <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
        <img src={imageUrl} alt="T Logo" class="Tlogo" />
      </div>

      <!-- Progress text instead of progress bar -->
      <p class="progress-text">Please wait...</p>
    </div>
  </template>


  
  <template if:true={showSignatureModal}>

  <div class="assign-modal-backdrop">

    <div class="assign-modal signature-modal">

      <!-- ================= HEADER ================= -->
      <div class="assign-modal-header">
        <span class="assign-title">
          Add Signature
        </span>

        <button
          class="assign-close-button"
          onclick={closeSignatureModal}>
          ×
        </button>
      </div>

      <!-- ================= BODY ================= -->
      <div class="assign-modal-body signature-body">

        <!-- ================= MODE TOGGLE (NEW) ================= -->
        <div class="signature-toggle">

          <!-- TYPE -->
          <button
            class={typeBtnClass}
            data-mode="type"
            onclick={selectSignatureMode}>
            <i class="material-icons open-icon">edit</i>
            Type Signature
          </button>

          <!-- DRAW -->
          <button
            class={drawBtnClass}
            data-mode="draw"
            onclick={selectSignatureMode}>
            <i class="material-icons open-icon">gesture</i>
            Draw Signature
          </button>

          <!-- UPLOAD -->
          <button
            class={uploadBtnClass}
            data-mode="upload"
            onclick={selectSignatureMode}>
            <i class="material-icons open-icon">file_open</i>
            Upload Signature
          </button>

        </div>

        <!-- ================= MODE CONTENT ================= -->

        <!-- TYPE MODE -->
        <template if:true={isTypeMode}>
  <div class="signature-mode-panel">

    <div class="signature-type-row">

      <input
        type="text"
        class="signature-type-input"
        placeholder="Enter your name here..."
        value={signatureTypedText}
        oninput={handleSignatureTyped}/>

      <template if:true={signatureTypedText}>
        <button
          class="signature-clear-inline"
          onclick={clearTypedSignature}
          title="Clear">
          ✕
        </button>
      </template>

    </div>

    <div class="signature-preview-basic">
      {signatureTypedText}
    </div>

  </div>
</template>


        <!-- UPLOAD MODE -->
       <template if:true={isUploadMode}>
  <div class="signature-mode-panel">

    <input
      type="file"
      class="hidden-file-input"
      accept="image/*"
      onchange={handleSignatureUpload}
      data-role="signature-upload"
    />

    <button
      type="button"
      class="file-upload-button"
      onclick={triggerSignatureFileInput}>
      &#8684; Upload Image
    </button>

    <template if:true={pendingSignatureBase64}>
      <div class="signature-upload-preview">

        <img src={pendingSignatureBase64} class="signature-preview-img"/>

        <button
          class="signature-delete-btn"
          onclick={clearUploadedSignature}>
          ✕
        </button>

      </div>
    </template>

  </div>
</template>



        <!-- DRAW MODE -->
        <template if:true={isDrawMode}>
  <div class="signature-mode-panel">

    <canvas class="signature-canvas"></canvas>

    <div class="signature-draw-actions">
      <button
        class="signature-clear-canvas"
        onclick={clearDrawSignature}>
        Clear
      </button>
    </div>

  </div>
</template>


      </div>

      <!-- ================= FOOTER ================= -->
      <div class="assign-modal-footer">
        <button
          class="assign-primary slds-button slds-button_brand"
          onclick={saveSignature}>
          Save Signature
        </button>
      </div>

    </div>

  </div>

</template>


</template>
