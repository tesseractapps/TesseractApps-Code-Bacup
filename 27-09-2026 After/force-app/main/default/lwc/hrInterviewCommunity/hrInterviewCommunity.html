<template>
    <lightning-card>
        <div if:true={isDesktop} >
            <table
                class="slds-table  slds-table_cell-buffer"
                style="table-layout: fixed;margin-top:3%">
                <thead>
                    <tr>
                        <th class="slds-cell-wrap">
                            Name
                        </th>
                        <th class="slds-cell-wrap">
                            Application Status
                        </th>
                        <th class="slds-cell-wrap">
                            Contact Number
                        </th>
                        <th class="slds-cell-wrap">
                            Email
                        </th>
                        <th class="slds-cell-wrap">
                            Interview Date
                        </th>
                        <th class="slds-cell-wrap">
                            Job Title
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={interviewdata} for:item="acc">
                        <tr key={acc.Id} class="tr1">
                            <td class="slds-cell-wrap">                                 
                                    <a href={acc.Name}  target="_self">  {acc.fullname}</a>
                            </td>
                            <td class="slds-cell-wrap">
                                {acc.Application_status__c}
                            </td>
                            <td class="slds-cell-wrap">
                                {acc.Contact_Number__c}
                            </td>
                            <td class="slds-cell-wrap">
                                {acc.Email_Address__c}
                            </td>
                            <td class="slds-cell-wrap">
                                {acc.interviewDate}
                            </td>
                            <td class="slds-cell-wrap">
                                    <a href={acc.jobTitile} target="_self">  {acc.Job_Title__c}</a>
                            </td>
                        </tr>
                    </template>

                </tbody>
            </table>
        </div>
    </lightning-card>
</template>
