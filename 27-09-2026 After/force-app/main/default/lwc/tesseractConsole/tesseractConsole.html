<template>
    <div>
        <div if:true={isDesktop}>
            <div> 
                <div class="slds-grid slds-var-m-left_x-large slds-var-m-right_x-large" style="margin-top:20px;">
                    <template if:true={istesseractSupport}>
                        <div class={orgClass} data-name="TesseractSupport" title="Tesseract Support" alt="Tesseract Support" name="TesseractSupport" src={Organisation} onclick={navigateToFacilityPage}
                            style="cursor:pointer;text-align:center" > 
                            Tesseract Support                                
                        </div> 
                    </template>                       
                    <template if:true={istesseractSales}> 
                        <div class={selectedClass} data-name="Sales" title="Sales" alt="Sales" name="Sales" src={facility} onclick={navigateToFacilityPage}
                            style="cursor:pointer;text-align:center" > 
                        Tesseract Sales                                
                        </div>  
                     </template>
                    <template if:true={maintenance}>
                        <div class={clientClass} data-name="Maintenance" title="Maintenance" alt="Maintenance" name="Maintenance" src={client}
                        onclick={navigateToFacilityPage} style="cursor:pointer;text-align:center"> 
                        Maintenance
                        </div>
                     </template>  
                    <template if:true={isInvoiceBilling}>
                        <div class={staffClass} data-name="InvoicesandBilling" title="Invoices and Billing" alt="Invoices and Billing" name="InvoicesandBilling" src={employee}
                        onclick={navigateToFacilityPage}
                            style="cursor:pointer;text-align:center">
                            Invoices and Billing
                        </div>
                    </template>
                    <template if:true={isFinance}> 
                        <div class={accountClass} data-name="Finance" title="Tesseract FInance" alt="Tesseract FInance" name="Finance" src={employee}
                        onclick={navigateToFacilityPage}
                            style="cursor:pointer;text-align:center">
                            Tesseract Finance
                        </div>
                     </template> 
                </div>
            </div>
                   
            <div>
                <template if:true={isOrgButton}>
                    <c-tesseract-support ongetsearchvalue={handleSearchValue}></c-tesseract-support>
                </template>
                <template if:true={isFacilityButton}>
                    <div style="margin-top:-9px;">
                        <c-tesseract-sales-tab></c-tesseract-sales-tab>
                    </div>
                </template>
                <template if:true={isMaintenance}>
                    <div style="margin-top:-9px;">
                        <c-tesseract-maintenance></c-tesseract-maintenance>
                    </div>
                </template>
                <template if:true={isStaffButton}>
                    <div style="margin-top:-9px;">                        
                        <!-- <c-tesseract-invoice></c-tesseract-invoice> -->
                        <c-tesseract-invoice-billing></c-tesseract-invoice-billing>
                    </div>
                </template>
                <template if:true={isManageSubscriptionButton}>
                    <div style="margin-top:3px;">                        
                        <!-- <c-tesseract-invoice-billing></c-tesseract-invoice-billing> -->
                         <p style="margin-top:1px;">Working on this page</p>
                    </div>
                </template>
            </div>
        </div>            
    </div>
</template>
