<template>
    <div class="main-container">
        <div class="menu-container">
        <div
            style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            "
        >
            <!-- Tabs -->
            <div style="display: flex">
            <div
                class={payrollTabClass}
                onclick={handleTabChange}
                data-tab="payroll"
            >
                Employees
            </div>
            <div
                class={invoicesTabClass}
                onclick={handleTabChange}
                data-tab="invoices"
            >
                Contacts
            </div>
            </div>
        </div>
        </div>

        <template if:true={showPayroll}>
        <div style="padding: 1%">

            <div class="metrics-grid">

                <div
                class="metric-card highlighted2"
                onclick={handleAllStaff}
                data-id="All"
                >
                <div class="invoiceTiles">
                    <div>
                    <h3 class="metric-title">All</h3>
                    <p class="metric-value">{totalCount}</p>
                    </div>
                    <!-- <template if:true="{selectedMetricId" ="" ="" ="Pending" }>
                    <i class="material-icons metric-icon">task_alt</i>
                    </template> -->
                    <template if:true={allStaff}>
                    <i class="material-iconsInvoice">task_alt</i>
                    </template>
                </div>
                </div>

                <div
                class="metric-card highlighted3"
                onclick={handleMatchedStaff}
                data-id="Sync"
                >
                <div class="invoiceTiles">
                    <div>
                    <h3 class="metric-title">Sync</h3>
                    <p class="metric-value">{matchedCount}</p>
                    </div>
                    <!-- <template if:true="{selectedMetricId" ="" ="" ="Pending" }>
                    <i class="material-icons metric-icon">task_alt</i>
                    </template> -->
                    <template if:true={matchedStaff}>
                    <i class="material-iconsInvoice">task_alt</i>
                    </template>
                </div>
                </div>

                <div
                class="metric-card highlighted1"
                onclick={handleSystemStaff}
                data-id="System Only"
                >
                <div class="invoiceTiles">
                    <div>
                    <h3 class="metric-title">System Only</h3>
                    <p class="metric-value">{onlyInSystemCount}</p>
                    </div>
                    <!-- <template if:true="{selectedMetricId" ="" ="" ="Generated" }>
                    <i class="material-icons metric-icon">task_alt</i>
                    </template> -->
                    <template if:true={systemStaff}>
                    <i class="material-iconsInvoice">task_alt</i>
                    </template>
                </div>
                </div>

                <div
                class="metric-card highlighted"
                onclick={handleXeroStaff}
                data-id="Xero Only"
                >
                <div class="invoiceTiles">
                    <div>
                    <h3 class="metric-title">MYOB Only</h3>
                    <p class="metric-value">{onlyInXeroCount}</p>
                    </div>
                    <!-- <template if:true="{selectedMetricId" ="" ="" ="Overdue" }>
                    <i class="material-icons metric-icon">task_alt</i>
                    </template> -->
                    <template if:true={xeroStaff}>
                    <i class="material-iconsInvoice">task_alt</i>
                    </template>
                </div>
                </div>
            </div>

            <!-- ✅ All Staff Table -->
            <template if:true={allStaff}>
            <div class="table-container custom-scroll">
                <table class="staff-table" role="grid" style="table-layout: fixed">
                    <thead>
                    <tr>
                        <th class="table-th" scope="col">
                        <div title="Staff Member">Staff Member</div>
                        </th>
                        <th class="table-th" scope="col">
                        <div  title="Email Address">Email Address</div>
                        </th>
                        <th class="table-th" scope="col" style="width:17%">
                        <div  title="Date of Birth">Date of Birth</div>
                        </th>
                        <th class="table-th" scope="col" style="width:12%">
                        <div title="Sync Status">Sync Status</div>
                        </th>
                        <th class="table-th" scope="col" style="width:12%">
                        <div title="Actions">Actions</div>
                        </th>
                    </tr>
                    </thead>

                    <tbody>
                    <template if:true={hasNoStaff}>
                        <tr class="tr1">
                        <td colspan="5" class="slds-text-align_center slds-p-vertical_xx-large">
                            <div class="no-data">
                            <p>No records found</p>
                            </div>
                        </td>
                        </tr>
                    </template>

                    <template if:false={hasNoStaff}>
                        <template for:each={paginatedStaffList} for:item="staff">
                        <tr key={staff.id} class="tr1 {staff.rowClass}">
                            <!-- Staff Member -->
                            <td data-label="Staff Member" class="table-td">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-avatar
                                variant="circle"
                                initials={staff.initials}
                                fallback-icon-name="standard:user"
                                size="medium"
                                class="slds-m-right_small">
                                </lightning-avatar>
                                <span class="slds-text-body_regular staff-name description">{staff.name}</span>
                            </div>
                            </td>

                            <!-- Email -->
                            <td data-label="Email Address" class="table-td description">
                            <span class="slds-text-body_regular">{staff.email}</span>
                            </td>

                            <!-- Date of Birth -->
                            <td data-label="Date of Birth" class="table-td description" style="width:17%">
                            <span class="slds-text-body_regular">{staff.dateOfBirth}</span>
                            </td>

                            <!-- Sync Status -->
                            <td data-label="Sync Status" class="table-td" style="width:12%">
                            <lightning-badge
                                label={staff.statusLabel}
                                class={staff.statusClass}>
                            </lightning-badge>
                            </td>

                            <!-- Actions -->
                            <td data-label="Actions" class="table-td" style="width:12%">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <template if:true={staff.showXeroButton}>
                                <!-- <lightning-button
                                    label="Add to Xero"
                                    icon-name="utility:add"
                                    variant="brand"
                                    class="xero-button slds-m-right_x-small"
                                    onclick={handleCreateInXero}
                                    data-id={staff.id}>
                                </lightning-button> -->
                                    <span class="material-symbols-outlined xero-icon"
                                            title="Add to MYOB"
                                            onclick={handleCreateInXero}
                                            data-id={staff.id}>
                                        receipt_long
                                    </span>
                                </template>

                                <template if:true={staff.showSystemButton}>
                                <!-- <lightning-button
                                    label="Add to System"
                                    icon-name="utility:add"
                                    variant="brand"
                                    class="system-button"
                                    onclick={handleCreateInSystem}
                                    data-id={staff.id}
                                    data-firstname={staff.firstName}
                                    data-lastname={staff.lastName}
                                    data-email={staff.email}
                                    data-xero-id={staff.xeroId}>
                                </lightning-button> -->
                                <span class="material-symbols-outlined system-icon"
                                            title="Add to System"
                                            onclick={handleCreateInSystem}
                                            data-id={staff.id}
                                            data-firstname={staff.firstName}
                                            data-lastname={staff.lastName}
                                            data-email={staff.email}
                                            data-xero-id={staff.xeroId}>
                                        browser_updated
                                    </span>
                                </template>

                                <template if:true={staff.showAllSet}>
                                <div class="all-set-container">
                                    <!-- <lightning-icon
                                    icon-name="utility:check"
                                    size="x-small"
                                    class="slds-m-right_xx-small success-icon">
                                    </lightning-icon>
                                    <span class="slds-text-body_small success-text">All Set</span> -->
                                    <lightning-badge
                                    label="All Set"
                                    class={staff.statusClass}>
                                    </lightning-badge>
                                </div>
                                </template>
                            </div>
                            </td>
                        </tr>
                        </template>
                    </template>
                    </tbody>
                </table>
            </div>

            <!-- ✅ Pagination for All Staff -->
            <div

                    style="padding-top: 0.5em"
                >
                    <!--RECORDS PER PAGE-->
                    <div class="slds-col">
                    <div class="slds-list_inline slds-p-bottom_xx-small">
                        <label
                        class="slds-text-color_weak slds-p-horizontal_x-small"
                        for="recordsPerPage"
                        style="padding-top: 4%"
                        >Page Size:</label
                        >
                        <div
                        class="slds-select_container slds-align_absolute-center"
                        >
                        <select
                            class="slds-select"
                            id="recordsPerPage"
                            onchange={handleAllPageSizeChange}
                        >
                            <template for:each={pageSizeOptions} for:item="option">
                            <option key={option} value={option}>{option}</option>
                            </template>
                        </select>
                        </div>
                    </div>
                    </div>

                    <!--PAGE NAVIGATION-->
                    <div class="slds-align_absolute-center">
                    <lightning-button
                        label="« First"
                        onclick={handleAllFirstPage}
                        disabled={allDisableFirstPrev}
                        class="slds-p-horizontal_x-small">
                    </lightning-button>

                    <lightning-button
                        label="‹ Prev"
                        onclick={handleAllPrevPage}
                        disabled={allDisableFirstPrev}
                        class="slds-p-horizontal_x-small">
                    </lightning-button>

                    <span class="slds-badge">

                    </span>
                    &nbsp;

                    <lightning-button
                        label="Next ›"
                        onclick={handleAllNextPage}
                        disabled={allDisableNextLast}
                        class="slds-p-horizontal_x-small">
                    </lightning-button>

                    <lightning-button
                        label="Last »"
                        onclick={handleAllLastPage}
                        disabled={allDisableNextLast}
                        class="slds-p-horizontal_x-small">
                    </lightning-button>
                    </div>

                    <div class="slds-clearfix">
                    <div class="slds-float_right">
                        <span class="slds-badge">
                        Total Records: {allTotalRecords}</span

                    </div>
                    </div>
            </div>
            </template>

                    </th>
                    <th class="table-th" scope="col">
                        <div title="Email Address">Email Address</div>

                    </th>

                </thead>

                    <template if:false={hasNoMatchedStaff}>

                            <div class="slds-grid slds-grid_vertical-align-center">
                            <template if:true={staff.showXeroButton}>
                                <!-- <lightning-button
                                label="Add to Xero"
                                icon-name="utility:add"
                                variant="brand"
                                class="xero-button slds-m-right_x-small"
                                onclick={handleCreateInXero}
                                data-id={staff.id}>
                                </lightning-button> -->
                                <span class="material-symbols-outlined xero-icon slds-m-right_x-small"
                                        title="Add to MYOB"
                                        onclick={handleCreateInXero}
                                        data-id={staff.id}>
                                    receipt_long
                                </span>
                            </template>

                            <template if:true={staff.showSystemButton}>
                                <!-- <lightning-button
                                label="Add to System"
                                icon-name="utility:add"
                                variant="brand"
                                class="system-button"
                                onclick={handleCreateInSystem}
                                data-id={staff.id}
                                data-firstname={staff.firstName}
                                data-lastname={staff.lastName}
                                data-email={staff.email}
                                data-xero-id={staff.xeroId}>
                                </lightning-button> -->
                                <span class="material-symbols-outlined system-icon"
                                    title="Add to System"
                                    onclick={handleCreateInSystem}
                                    data-id={staff.id}
                                    data-firstname={staff.firstName}
                                    data-lastname={staff.lastName}
                                    data-email={staff.email}
                                    data-xero-id={staff.xeroId}>
                                browser_updated
                                </span>
                            </template>

                            <template if:true={staff.showAllSet}>
                                <div class="all-set-container">
                                <!-- <lightning-icon
                                    icon-name="utility:check"
                                    size="x-small"
                                    class="slds-m-right_xx-small success-icon">
                                </lightning-icon>
                                <span class="slds-text-body_small success-text">All Set</span> -->
                                <lightning-badge
                                    label="All Set"
                                    class={staff.statusClass}>
                                </lightning-badge>
                                </div>
                            </template>
                            </div>
                        </td>
                        </tr>
                    </template>
                    </template>
                </tbody>
                </table>

            </div>

            <!-- ✅ Pagination for Sync Staff -->
            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread fixed-pagination"
                style="padding-top: 0.5em"
                >
                <!-- RECORDS PER PAGE -->
                <div class="slds-col">
                    <div class="slds-list_inline slds-p-bottom_xx-small">
                    <label
                        class="slds-text-color_weak slds-p-horizontal_x-small"
                        for="matchedRecordsPerPage"
                        style="padding-top: 4%"
                        >Page Size:</label
                    >
                    <div class="slds-select_container slds-align_absolute-center">
                        <select
                        class="slds-select"
                        id="matchedRecordsPerPage"
                        onchange={handleMatchedPageSizeChange}
                        >
                        <template for:each={pageSizeOptions} for:item="option">
                            <option key={option} value={option}>{option}</option>
                        </template>
                        </select>
                    </div>
                    </div>
                </div>

                <!-- PAGE NAVIGATION -->
                <div class="slds-align_absolute-center">
                    <lightning-button
                    label="« First"
                    onclick={handleMatchedFirstPage}
                    disabled={matchedDisableFirstPrev}
                    class="slds-p-horizontal_x-small"
                    ></lightning-button>

                    <lightning-button
                    label="‹ Prev"
                    onclick={handleMatchedPrevPage}
                    disabled={matchedDisableFirstPrev}

                    ></lightning-button>

                    &nbsp;

                    <lightning-button
                    label="Next ›"
                    onclick={handleMatchedNextPage}
                    disabled={matchedDisableNextLast}
                    class="slds-p-horizontal_x-small"
                    ></lightning-button>

                    <lightning-button
                    label="Last »"
                    onclick={handleMatchedLastPage}
                    disabled={matchedDisableNextLast}
                    class="slds-p-horizontal_x-small"
                    ></lightning-button>
                </div>

                <!-- TOTAL RECORDS -->
                <div class="slds-clearfix">
                    <div class="slds-float_right">
                    <span class="slds-badge">Total Records: {matchedTotalRecords}</span>
                    </div>
                </div>
                </div>

                    <th class="table-th" scope="col" style="width:17%">

                    </td>
                    </tr>
                </template>

                <template if:false={hasNoSystemStaff}>
                    <template for:each={paginatedSystemList} for:item="staff">
                    <tr key={staff.id} class="tr1 {staff.rowClass}">
                        <!-- Staff Member -->
                        <td data-label="Staff Member" class="table-td">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <lightning-avatar
                            variant="circle"

                            class="slds-m-right_small">
                            </lightning-avatar>

                        <td data-label="Email Address" class="table-td description">

                                label="Add to Xero"
                                icon-name="utility:add"

                            </lightning-button> -->
