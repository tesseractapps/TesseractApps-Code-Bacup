<template>
  <div class="slds-form-element">
    <div class="slds-form-element__control">
      <div
        class={dropdownClass}
        aria-expanded={isDropdownOpen}
        aria-haspopup="listbox"
        role="combobox"
      >
        <!-- Input wrapper to hold input + clear button -->
        <div class="slds-input-has-icon slds-input-has-icon_right">
          <input
            type="text"
            class="slds-input"
            placeholder="Select Time"
            value={searchKey}
            data-timeinput="true"
            onkeyup={handleSearch}
            onkeydown={handleKeyDown}
            onfocus={openDropdown}
            onclick={openDropdown}
            disabled={disableTimeButton}
          />

          <!-- Clear Button (only if value exists and input is NOT disabled) -->
          <template if:true={searchKey}>
            <template if:false={disableTimeButton}>
              <button
                class="clear-btn"
                onclick={handleClear}
                title="Clear"
              >
                <span class="material-symbols-outlined">cancel</span>
              </button>
            </template>
          </template>
        </div>

        <!-- Dropdown -->
        <template if:true={isDropdownOpen}>
          <div
            class="slds-dropdown slds-dropdown_length-5 custom-scroll"
            role="listbox"
            style="width: 100%"
          >
            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
              <template
                for:each={filteredTimes}
                for:item="time"
                for:index="idx"
              >
                <li
                  key={time.value}
                  class="slds-listbox__item"
                  role="presentation"
                >
                  <div
                    class={time.optionClass}
                    role="option"
                    data-value={time.value}
                    data-label={time.label}
                    onclick={handleSelect}
                  >
                    <span>{time.label}</span>
                  </div>
                </li>
              </template>
            </ul>
            <template if:true={noResults}>
              <div class="slds-p-around_small">No times found</div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>
