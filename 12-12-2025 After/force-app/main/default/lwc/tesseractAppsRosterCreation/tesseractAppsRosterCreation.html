<template>
  <template if:true={isHome}>
    <div class="main-container">
      <template if:true={isStaffView}>
        <div
          class="slds-grid slds-wrap slds-grid_align-spread slds-p-around_x-small"
        >
          <div class="slds-grid slds-grid_align-start">
            <div style="display: flex; align-items: center">
              <div class="roster-toggle-container">
                <div class="tab-view-wrapper">
                  <button
                    class={participantTabClass}
                    onclick={handleParticipantView}
                  >
                    {participantPreferredName} View
                  </button>
                  <button class={staffTabClass} onclick={handleStaffView}>
                    {staffPreferredName} View
                  </button>
                </div>
              </div>
            </div>
            <div class="slds-col">
              <div class="facility-multiselect" onclick={showFacilityDropdown}>
                <!-- BUBBLE SCROLLER -->
                <div
                  class="facility-bubble-container facility-scroll-horizontal"
                >
                  <template for:each={selectedFacilities} for:item="facility">
                    <span key={facility.value} class="facility-bubble">
                      {facility.label}
                      <span
                        class="facility-remove"
                        data-id={facility.value}
                        onclick={removeFacility}
                        >×</span
                      >
                    </span>
                  </template>

                  <!-- Input appears inline with bubbles -->
                  <input
                    type="text"
                    class="facility-search-input"
                    placeholder="Search"
                    value={facilitySearchTerm}
                    oninput={handleFacilitySearchChange}
                    onfocus={showFacilityDropdown}
                    onclick={stopPropagation}
                  />
                </div>

                <!-- DROPDOWN BELOW -->
                <template if:true={showFacilityOptions}>
                  <div
                    class="facility-dropdown custom-scroll"
                    onclick={stopPropagation}
                  >
                    <template
                      for:each={facilityCheckboxOptions}
                      for:item="facility"
                    >
                      <label key={facility.value} class="facility-option">
                        <input
                          type="checkbox"
                          value={facility.value}
                          checked={facility.checked}
                          onchange={handleFacilityCheckboxChange}
                        />
                        {facility.label}
                      </label>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <div
            class="slds-col"
            style="
              flex: 1 1 auto;
              justify-content: flex-end;
              display: flex;
              gap: 10px;
            "
          >
            <div style="display: flex; gap: 10px; align-items: center">
              <!-- RIGHT SIDE: Filter + Pagination (always right-aligned) -->

              <div
                class="slds-grid slds-grid_align-end slds-grid_vertical-align-center"
                style="gap: 0.5rem; padding-right: 1%"
              >
                <!-- <div>
                  <template if:true={shiftPublishStatus}>
                    <p
                      class="status-text"
                      style="
                        font-size: 14px;
                        white-space: nowrap;
                        font-weight: bold;
                      "
                    >
                      <i
                        class={statusIconClass}
                        style="vertical-align: middle; margin-right: 4px"
                      >
                        {statusIcon}
                      </i>

                      <span style={statusColorStyle}>{shiftPublishStatus}</span>
                    </p>
                  </template>
                </div> -->

                <button
                  class="toggle-button"
                  onclick={togglePopoverforShiftType}
                  style="
                    background: none;
                    border: none;
                    display: flex;
                    align-items: center;
                  "
                >
                  <i class="material-icons edit-icon">filter_alt</i>
                </button>
            <div class="slds-m-horizontal_small">
              <lightning-combobox
              name="viewType"
              value={selectedViewType}
              placeholder="Select View"
              options={viewOptions}
               variant="label-hidden"
              onchange={handleViewTypeChange}
              ></lightning-combobox>
            </div>

                <lightning-button-icon
                  icon-name="utility:chevronleft"
                  onclick={loadPreviousWeek}
                  style="cursor: pointer"
                >
                </lightning-button-icon>


                <div class={dateClass} style={datePickerStyle}>
                  <span class="label-text-drop">Date</span>
                  <lightning-input
                    type="date"
                    variant="label-hidden"
                    onchange={handleDatePickerChange}
                    value={formattedDate}
                    name="date"
                  >
                  </lightning-input>
                </div>

                <lightning-button-icon
                  icon-name="utility:chevronright"
                  onclick={loadNextWeek}
                  style="cursor: pointer"
                >
                </lightning-button-icon>
              </div>

            </div>
            <div>
              <div class="settings-dropdown-container">
                <!-- Settings Button -->
                <button
                  class="settings-button slds-button slds-button_icon slds-button_icon-container"
                  style="margin-top: 6px"
                  onclick={toggleDropdown}
                  aria-label="Settings menu"
                  aria-expanded={isOpen}
                  aria-haspopup="true"
                >
                  <i
                    class="material-icons add-icon"
                    style="font-size: 36px; color: black !important"
                    >more_vert</i
                  >
                </button>

                <!-- Dropdown Menu -->
                <div if:true={isOpen} class="dropdown-container">
                  <div
                    class={dropdownClass}
                    role="menu"
                    aria-orientation="vertical"
                  >
                    <!-- In this chat -->
                    <button
                      class="menu-item"
                      data-action="autoSchedule"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >acute</i
                      >
                      <span class="menu-label">Auto Schedule</span>
                    </button>

                    <!-- Open in new window -->
                    <button
                      class="menu-item"
                      data-action="publish"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >published_with_changes</i
                      >
                      <span class="menu-label">Publish</span>
                    </button>

                    <!-- Schedule meeting -->
                    <button
                      class="menu-item"
                      data-action="Rejectedshifts"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >event_busy</i
                      >
                      <span class="menu-label">Rejected Shifts</span>
                    </button>

                    <!-- Screen sharing -->
                    <button
                      class="menu-item"
                      data-action="rosterSettings"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >settings</i
                      >
                      <span class="menu-label">Roster Settings</span>
                    </button>

                    <!-- Mark as unread -->
                    <button
                      class="menu-item"
                      data-action="underOverRoasting"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >difference</i
                      >
                      <span class="menu-label"
                        >Under/Over Efficiency Report</span
                      >
                    </button>

                    <template if:true={isExpandedView}>
                      <button
                        class="menu-item"
                        data-action="compactView"
                        onclick={handleMenuItemClick}
                        role="menuitem"
                      >
                        <i
                          class="material-icons add-icon"
                          style="font-size: 24px"
                          >collapse_content</i
                        >
                        <span class="menu-label">Compact View</span>
                        <span class="shortcut-hint">Ctrl + Shift + C</span>
                      </button>
                    </template>

                    <template if:false={isExpandedView}>
                      <button
                        class="menu-item"
                        data-action="expandView"
                        onclick={handleMenuItemClick}
                        role="menuitem"
                      >
                        <i
                          class="material-icons add-icon"
                          style="font-size: 24px"
                          >pan_zoom</i
                        >
                        <span class="menu-label">Expand View</span>
                        <span class="shortcut-hint">Ctrl + Shift + E</span>
                      </button>
                    </template>

                    <button
                      class="menu-item"
                      data-action="shiftReport"
                      onclick={handleMenuItemClick}
                      role="menuitem"
                    >
                      <i class="material-icons add-icon" style="font-size: 24px"
                        >assignment</i
                      >
                      <span class="menu-label">Shift Report</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <template if:false={isParticipanTViewEnable}>
          <div
            class="sidebar1"
            if:true={isPopoverVisibleforShiftType}
            data-id="shift-type-popover"
          >
            <div class="sidebar-content" onclick={stopPropagation}>
              <div class="close-btn" onclick={closePopoverforShiftType}>
                &times;
              </div>
              <!-- <lightning-icon   icon-name="utility:close"  size="x-small" style="float: right;" onclick={closePopover} > -->

              <div style="border-radius: 5px 5px 0 0">
                <h5 class="facility-header">Shift Type</h5>
                <div
                  class="box-facility-role"
                  style="
                    margin-bottom: 10px;
                    padding: 0px 15px;
                    overflow-x: HIDDEN;
                    overflow-y: AUTO;
                    height: 12vh;
                  "
                >
                  <lightning-checkbox-group
                    label=""
                    name="ShiftTypeforFilter"
                    options={shiftTypeOptions}
                    value={shiftTypefilterValue}
                    onchange={handleCheckBoxChange}
                  ></lightning-checkbox-group>
                </div>
              </div>
              <div></div>
            </div>
          </div>
        </template>
        <div
          class="slds-grid slds-p-bottom_x-small"
          style="width: 100%; align-items: center"
        >
          <!-- LEFT SIDE: role-tabs-bar (conditionally shown) -->
          <div style="flex-grow: 1">
            <template if:false={isParticipanTViewEnable}>
              <div class="role-tab-scroll-container">
                <lightning-button-icon
                  icon-name="utility:chevronleft"
                  onclick={scrollTabsLeft}
                  alternative-text="Scroll Left"
                  variant="bare"
                  size="small"
                >
                </lightning-button-icon>

                <div
                  class="role-tab-wrapper"
                  data-id="roleTabsContainer"
                  onscroll={handleScroll}
                >
                  <!-- <template for:each={computedRoleTabs} for:item="role">
                    <button
                      key={role.value}
                      class={role.computedClass}
                      data-role={role.value}
                      onclick={handleRoleTabClick}
                    >
                      {role.label}
                    </button>
                  </template> -->
                  <template for:each={computedRoleTabs} for:item="role">
                      <div key={role.value}
                          draggable="true"
                          ondragstart={handleRoleDragStart}
                          ondragover={handleRoleDragOver}
                          ondrop={handleRoleDrop}
                          data-role={role.value}
                          class="draggable-item">

                          <button
                              class={role.computedClass}
                              data-role={role.value}
                              onclick={handleRoleTabClick}>
                              {role.label}
                          </button>

                      </div>
                  </template>
                </div>

                <lightning-button-icon
                  icon-name="utility:chevronright"
                  onclick={scrollTabsRight}
                  alternative-text="Scroll Right"
                  variant="bare"
                  size="small"
                >
                </lightning-button-icon>
              </div>
            </template>
          </div>


          <!-- RIGHT SIDE: Legend + Filter + Pagination -->
          <div
            class="slds-grid slds-grid_align-end slds-grid_vertical-align-center"
            style="gap: 0.5rem; padding-right: 1%"
          >
                        <template if:true={shiftPublishStatus}>
                <p
                  class="status-text"
                  style="
                    font-size: 14px;
                    white-space: nowrap;
                    font-weight: bold;
                  "
                >
                  <i
                    class={statusIconClass}
                    style="vertical-align: middle; margin-right: 4px"
                  >
                    {statusIcon}
                  </i>

                  <span style={statusColorStyle}>{shiftPublishStatus}</span>
                </p>
              </template>
            <!-- ✅ LEGEND added just before filter -->
            <div
              class="status-legend slds-grid slds-grid_vertical-align-center slds-theme_default slds-border_left slds-border_right slds-border_bottom"
              style="
                gap: 1rem;
                padding: 0.5%;
                border-radius: 0.25rem;
                background: #f4f6f9;
              "
            >
              <template for:each={processedStatusOptions} for:item="status">
                <span
                  key={status.value}
                  class={status.wrapperClass}
                  data-value={status.value}
                  onclick={handleStatusLegendClick}
                >
                  <span class={status.dotClass}></span> {status.label}
                </span>
              </template>
            </div>
          </div>
        </div>

        <template if:true={isParticipanTViewEnable}>
          <div
            class="sidebarInParticpantView"
            if:true={isPopoverVisible}
            data-id="participant-popover"
          >
            <div class="sidebar-content" onclick={stopPropagation}>
              <div class="close-btn" onclick={closePopover}>&times;</div>
              <!-- <lightning-icon   icon-name="utility:close"  size="x-small" style="float: right;" onclick={closePopover} > -->

              <div style="border-radius: 5px 5px 0 0">
                <h5 class="facility-header">{facilityPreferredName} Name</h5>
                <div
                  class="box-facility-role"
                  style="
                    margin-bottom: 10px;
                    padding: 0px 15px;
                    overflow-x: HIDDEN;
                    overflow-y: AUTO;
                    height: 30vh;
                  "
                >
                  <template if:true={facilityOptions}>
                    <lightning-checkbox-group
                      label=""
                      name="Facility"
                      options={facilityOptions}
                      value={facilityValue}
                      onchange={handleCheckBoxChange}
                    >
                    </lightning-checkbox-group>
                  </template>
                </div>
              </div>
            </div>
          </div>
          <div
            class="sidebar2"
            if:true={isPopoverVisibleforShiftType}
            data-id="shift-type-popover-participant"
          >
            <div class="sidebar-content" onclick={stopPropagation}>
              <div class="close-btn" onclick={closePopoverforShiftType}>
                &times;
              </div>
              <!-- <lightning-icon   icon-name="utility:close"  size="x-small" style="float: right;" onclick={closePopover} > -->

              <div style="border-radius: 5px 5px 0 0">
                <h5 class="facility-header">Shift Type</h5>
                <div
                  class="box-facility-role"
                  style="
                    margin-bottom: 10px;
                    padding: 0px 15px;
                    overflow-x: HIDDEN;
                    overflow-y: AUTO;
                    height: 18vh;
                  "
                >
                  <lightning-checkbox-group
                    label=""
                    name="ShiftTypeforFilter"
                    options={shiftTypeOptions}
                    value={shiftTypefilterValue}
                    onchange={handleCheckBoxChange}
                  ></lightning-checkbox-group>
                </div>
      
              </div>
              <div></div>
            </div>
          </div>
        </template>

        <template if:false={isParticipanTViewEnable}>
          <template for:each={staffData} for:item="role">
            <template if:true={role.isExpanded}>
              <div
                class="role-content role-section"
                key={role.roleName}
                name={role.roleName}
              >
                <div class="slds-table" style="background-color: transparent">
                  <table
                    class="slds-table slds-table_fixed-layout slds-table_resizable-cols glow-hover table1"
                    role="grid"
                  >
                    <thead>
                      <tr>
                        <td style={role.firstcellwidth}>
                          <div class="staff-member">
                            <div class="floating-label-new">
                              <span class="label-text-drop"
                                >Search by Name</span
                              >
                              <lightning-input
                                type="search"
                                variant="label-hidden"
                                value={searchName}
                                onchange={handleSearchName}
                              ></lightning-input>
                            </div>
                          </div>
                        </td>

                        <template for:each={role.weekData} for:item="weekDay">
                          <td key={weekDay.date} class={weekDay.holidayColor}>
                            <div class={dayCellClass}>
                              <div class="day-content-wrapper">
                                <!-- Left: Day + Date + Holiday -->
                                <div class="day-left">
                                  <div class="day-name">{weekDay.day}</div>
                                  <div class="day-date">
                                    {weekDay.UiFormattedDate}
                                  </div>
                                </div>
                                <div class={weekDay.Today}>
                                  <!-- Right: Qty + Unallocated -->
                                  <div class="day-right">
                                    <div class="qty">
                                      Qty: {weekDay.quantity}
                                    </div>
                                    <a
                                      href="javascript:void(0)"
                                      class="unallocated-link"
                                      data-role={role.roleName}
                                      data-date={weekDay.weekDays}
                                      data-isholiday={weekDay.isHoliday}
                                      data-unallocated={weekDay.quantity}
                                      onclick={handleUnAllocated}
                                    >
                                      Unallocated: {weekDay.unallocated}
                                    </a>
                                  </div>
                                </div>
                              </div>
                              <div class="add-shift-wrapper">
                                <a href="javascript:void(0)">
                                  <lightning-icon
                                    icon-name="utility:add"
                                    size="xx-small"
                                    class="add-icon-link1"
                                    data-role={role.roleName}
                                    data-date={weekDay.weekDays}
                                    data-isholiday={weekDay.isHoliday}
                                    onclick={handlePublishShift}
                                    style="transform: scale(0.7)"
                                  >
                                  </lightning-icon>
                                </a>
                              </div>
                              <div class="holiday-spacer-bottom">
                                <template if:true={weekDay.isHoliday}>
                                  <div
                                    class="holiday-label"
                                    title={weekDay.holidayName}
                                  >
                                    {weekDay.holidayName}
                                  </div>
                                </template>
                              </div>
                            </div>
                          </td>
                        </template>
                      </tr>
                    </thead>
                  </table>

                  <div class="calendar-part custom-scroll">
                    <table
                      class="slds-table slds-table_bordered slds-table_fixed-layout table1"
                      role="grid"
                    >
                      <tbody>
                        <template for:each={role.staffData} for:item="staff">
                          <tr key={staff.staffId}>
                            <!-- Staff Name and Info Column -->
                            <td style={staff.staffWidth}>
                              <div
                                class="card"
                                data-id={staff.staffId}
                                data-facilityval={staff.facilityIdValue}
                                draggable="true"
                                ondragstart={handleDragStart}
                                data-role={role.roleName}
                                data-param="draggingFromStaff"
                                data-exceedhours={staff.completedHours}
                                data-sethours={staff.setHours}
                                 
                              >
                                <div
                                  class="avatar"
                                  if:true={staff.profileUrl}
                                  draggable="false"
                                >
                                  <lightning-avatar
                                    variant="circle"
                                    src={staff.profileUrl}
                                    class="avatar-small"
                                    fallback-icon-name="standard:person_account"
                                  >
                                  </lightning-avatar>
                                </div>
                                <div
                                  class="avatar"
                                  if:false={staff.profileUrl}
                                  draggable="false"
                                >
                                  <lightning-icon
                                    icon-name="action:user"
                                    variant="error"
                                    size="small"
                                    style="background: #02275b"
                                    class="avatar-small fallback-icon"
                                  ></lightning-icon>
                                </div>
                                <div class={infoClass}>
                                  <a
                                    href="javascript:void(0);"
                                    class="name"
                                    data-staffroll={role.roleName}
                                    data-stafffirstname={staff.firstName}
                                    data-stafflastname={staff.lastName}
                                    data-fullname={staff.disPlayName}
                                    onclick={handleWeeklyCalander}
                                    >{staff.disPlayName}</a
                                  >
                                  <span class="details"
                                    >{staff.completedHours}/{staff.setHours}h
                                    ${staff.wages}</span
                                  >
                                  <span class="meta"
                                    >SCR {staff.SCR}, Class
                                    {staff.ClassAndLevel}</span
                                  >
                                </div>
                              </div>
                            </td>

                            <!-- Days Data Column (7 days) -->
                            <template
                              for:each={staff.shiftsByDay}
                              for:item="dayShift"
                            >
                              <td
                                key={dayShift.day}
                                colspan={dayShift.rowSpan}
                                class="day-cell"
                                ondragover={handleDragOver}
                                data-weekname={dayShift.day}
                                data-staffid={staff.staffId}
                                data-fullname={staff.disPlayName}
                                data-weekdate={dayShift.Shiftdate}
                                data-isholiday={dayShift.isHoliday}
                                data-role={dayShift.shiftRoleName}
                                data-facilityval={staff.facilityIdValue}
                                data-exceedhours={staff.completedHours}
                                data-sethours={staff.setHours}
                                data-isleave={dayShift.isLeave}
                                ondrop={handleDrop}
                                style={dayShift.inlineStyle}
                              >
                                <div class="day-cell-wrapper">
                                  <template if:true={dayShift.isLeave}>
                                    <template if:true={dayShift.isVisible}>
                                      <div class="centered-content">
                                        <b>{dayShift.leaveType}</b>
                                      </div>
                                    </template>
                                  </template>
                                  <template if:false={dayShift.isLeave}>
                                    <template if:true={dayShift.newUIGroupOfShifts.length}>
                                      <div class={getIconContainerClass}>
                                        <template
                                          for:each={dayShift.newUIGroupOfShifts}
                                          for:item="shift"
                                        >
                                          <!-- COLLAPSED VIEW -->
                                          <template if:false={shift.isHovered}>
                                            <template
                                              if:false={dayShift.anyShiftInGroupHovered}
                                            >
                                              <div
                                                key={shift.Id}
                                                class={getIconItemClass}
                                                data-id={shift.Id}
                                                draggable="true"
                                                ondragstart={handleShiftTranfer}
                                                data-shiftrate={shift.shiftRate}
                                                data-param="draggingFromShift"
                                                data-shifttime={shift.ShiftTime}
                                                data-shifttype={shift.shiftType}
                                                data-recurstatus={shift.isRecurring}
                                                data-refid={shift.refID}
                                                data-staffid={staff.staffId}
                                                data-day={dayShift.Shiftdate}
                                                data-shiftstreet={shift.ShiftStreet}
                                                data-status={shift.status}
                                                data-index={shift.index}
                                                data-exceedhours={staff.completedHours}
                                                data-role={shift.shiftRoleName}
                                                data-facilityid={shift.facilityId}
                                                data-sethours={staff.setHours}
                                                style={shift.inLineHeight}
                                                ondragover={handleDragOver}
                                                ondrop={handleShiftTransferDrop}
                                              >
                                                <!-- SINGLE -->
                                                <template
                                                  if:true={dayShift.isSingleGroupRecord}
                                                >
                                                  <div
                                                    class="staff-info-time1"
                                                    data-id={shift.Id}
                                                    onclick={handleShiftCardClick}
                                                    data-day={dayShift.Shiftdate}
                                                    data-staffid={staff.staffId}
                                                  >
                                                    <div class={staffInfoClass}>
                                                      <template
                                                        if:true={isCompactView}
                                                      >
                                                        <template
                                                          if:false={shift.participantName}
                                                        >
                                                          <span
                                                            class="rolename-firsticon"
                                                            ><b
                                                              >{shift.shiftRoleName}</b
                                                            ></span
                                                          >
                                                        </template>
                                                        <template
                                                          if:true={shift.participantName}
                                                        >
                                                          <span
                                                            class="rolename-firsticon"
                                                            onmouseout={handleMouseOut}
                                                          >
                                                            <b
                                                              >{shift.participantName}</b
                                                            >
                                                          </span>
                                                        </template>
                                                        <div
                                                          class="staff-info-time1"
                                                        >
                                                          <a
                                                            href="javascript:void(0)"
                                                            onclick={handleEditShiftScreen}
                                                            data-shiftstaffid={shift.Id}
                                                            class="hyperlink-time"
                                                          >
                                                            {shift.ShiftTime}
                                                          </a>
                                                        </div>
                                                      </template>
                                                      <template
                                                        if:true={isExpandedView}
                                                      >
                                                        <div
                                                          class={getSingleExpDetailsClass}
                                                        >
                                                          <template
                                                            if:false={shift.participantName}
                                                          >
                                                            <div
                                                              class="singleexp-value"
                                                            >
                                                              <b
                                                                >{shift.shiftRoleName}</b
                                                              >
                                                            </div>
                                                          </template>

                                                          <template
                                                            if:true={shift.participantName}
                                                          >
                                                            <div

  <template if:true={showErrorModal}>
    <section class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">

                <h2 class="slds-text-heading_medium" style="color: white; text-align: center;">
                    <template if:true={AddShiftRecurringCheckboxValue}>
                        Recurring Shift Conflicts
                    </template>
                    <template if:false={AddShiftRecurringCheckboxValue}>
                        Shift Assignment Failed
                    </template>
                </h2>
            </header>
            
            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium slds-text-align_center custom-scroll">
                <!-- Conditional Message -->
                <template if:true={AddShiftRecurringCheckboxValue}>
                    <p>Conflicts found in recurring shift dates:</p>
                    <div class="slds-text-color_weak slds-m-bottom_small">
                        <small><strong>Note: </strong> Conflicting dates will be skipped during creation</small>
                    </div>

                    <p class="slds-m-bottom_medium">Cannot proceed with shift assignment. Issues found:</p>
                </template>

                  <div class="center-list">
                  <ul>
                      <template for:each={staffDateConflicts} for:item="staff">
                          <li key={staff.staffId}>
                              <strong>{staff.staffName}</strong>
                              <ul class="slds-m-top_xx-small">
                                  <template for:each={staff.conflictDates} for:item="conflict">
                                      <li key={conflict.date} class="conflict-row">
                                          <span class="conflict-date">{conflict.displayDate}:</span>
                                          <span class="conflict-reason">{conflict.reason}</span>
                                      </li>
                                  </template>
                              </ul>
                          </li>
                      </template>
                  </ul>
                  </div>

            </div>
            
            <!-- Modal Footer -->
            <footer class="slds-modal__footer" >
               <template if:true={AddShiftRecurringCheckboxValue}>
                    <div class="slds-align_absolute-center">
                        <lightning-button
                            label="Cancel"
                            variant="brand"
                            onclick={closeErrorModal}
                        ></lightning-button>
                        <lightning-button class="slds-p-left_medium"
                            label="Create Shifts"

                            variant="brand"
                        ></lightning-button>
                    </div>
                </template>
                  <template if:false={AddShiftRecurringCheckboxValue}>
                    <lightning-button 
                    label="OK" 
                    onclick={closeErrorModal} 
                    variant="brand"
                   ></lightning-button>

                </template>
              
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

                    data-field="staffPayment"
                    label="Enter Total Staff Payment Amount"
                    variant="label-hidden"
                    value={shifCancelData.staffPayment}
                    onchange={handleShiftCancelChange}>
                  </lightning-input>

                  <div>
                    <lightning-radio-group
                      name="billParticipant"
                      data-field="billParticipant"
                      options={billOptions}
                      value={combinedBillValue}
                      onchange={handleShiftCancelChange}>
                    </lightning-radio-group>
                  </div>
                  <template if:true={shifCancelData.billParticipant}>
                     <label class="slds-form-element__label" >Enter Total {participantPreferredName} Payment Amount</label>
                  <div>
                      <lightning-input
                          type="number"
                          step="0.01"
                          name="participantPayment"
                          data-field="participantPayment"
                          label="Enter Total Participant Payment Amount"
                           variant="label-hidden"
                          value={shifCancelData.participantPayment}
                          onchange={handleShiftCancelChange}>
                      </lightning-input>
                  </div>
                  </template>
                  
                  <div class="slds-m-top_small">
                    <strong>Original combined value:</strong>
                    <lightning-formatted-number value={shifCancelData.originalStaffValue} format-style="currency" currency-code="AUD" minimum-fraction-digits="2"></lightning-formatted-number>
                  </div>
                </div>
              </template>

                <!-- INDIVIDUAL MODE: service rows editable -->
                <template if:true={isIndividualMode}>
                  <div class="slds-section">
                    <p><strong>Service-level Payment:</strong></p>

                    <template for:each={shifCancelData.services} for:item="svc">
                      <div key={svc.id} class="slds-box slds-m-bottom_x-small slds-grid slds-grid_align-spread slds-align-top">
                        <div class="slds-col">
                          <p class="slds-text-body_small"><strong>Participant: </strong>{svc.displayName}</p>
                          <p class="slds-text-body_small"><strong>Service: </strong>{svc.serviceName}</p>
                          <p class="slds-text-body_small"><strong>Original: </strong>
                            <lightning-formatted-number value={svc.originalAmount} format-style="currency" currency-code="AUD" minimum-fraction-digits="2"></lightning-formatted-number>
                          </p>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                           <label > {staffPreferredName} Payment</label>
                          <lightning-input
                            type="number"
                            step="0.01"
                            label="Staff Payment (service)"
                            data-field="servicePayment"
                            variant="label-hidden"
                            data-service-id={svc.id}
                            value={svc.payment}
                            onchange={handleShiftCancelChange}>
                          </lightning-input>

                          <div class="slds-m-top_x-small">
                            <lightning-radio-group
                              name={svc.id}
                              data-field="serviceBill"
                              data-service-id={svc.id}
                              options={billOptions}
                              value={svc.billValue}
                              onchange={handleShiftCancelChange}>
                            </lightning-radio-group>
                          </div>
                           <template if:true={svc.billParticipant}>
                      <div class="slds-m-top_small">
                         <label >{participantPreferredName} Amount</label>
                        <lightning-input
                          type="number"
                          step="0.01"
                          label="Participant Amount"
                          data-field="serviceParticipantAmount"
                          data-service-id={svc.id}
                           variant="label-hidden"
                          value={svc.participantAmount}
                          onchange={handleShiftCancelChange}>
                        </lightning-input>
                       
                      </div>
                    </template>

                        </div>
                      </div>
                    </template>

                    <!-- Running total -->
                    <div class="slds-m-top_small">
                      <strong>Total {staffPreferredName} Payment: </strong>
                      <lightning-formatted-number value={shifCancelData.staffPayment} format-style="currency" currency-code="AUD" minimum-fraction-digits="2"></lightning-formatted-number>
                    </div>
                  </div>
                </template>
            </template>
            <div class="slds-col slds-size_1-of-1">
              <lightning-textarea
                name="note"
                data-field="note"
                label="Note (optional)"
                value={shifCancelData.note}
                onchange={handleShiftCancelChange}>
              </lightning-textarea>
            </div>
          </div>
        </div>
       
    <div class="slds-box slds-theme_shade slds-m-top_medium">   
    <div class="slds-text-body_regular">
        <p>
            <strong class="slds-m-right_x-small">Shift:</strong>
            {shifCancelData.shiftLabel}
        </p>
        <p>
            <strong class="slds-m-right_x-small">Cancelled by:</strong>
            {shifCancelData.cancelledBy}
        </p>
        <p>
            <strong class="slds-m-right_x-small">Short Notice (&lt;7 days):</strong>
            {shifCancelData.shortNotice}
        </p>
        <p>
            <strong class="slds-m-right_x-small">{staffPreferredName} Pay:</strong>
            ${shifCancelData.staffPayment}
        </p>
       <!--  <p>
            <strong class="slds-m-right_x-small">Bill Participant:</strong>
            {billParticipantText}
        </p> -->
        <p>
            <strong class="slds-m-right_x-small">Reason:</strong>
            {shifCancelData.reason}
        </p>
    </div>
</div>
      </div>

      <!-- Footer -->
      <footer class="slds-modal__footer slds-grid slds-grid_align-end">
        <button class="slds-button slds-button_neutral" onclick={handleShiftCancelClose}>Cancel</button>
        <button class="slds-button slds-button_brand" onclick={handleShiftCancelConfirm}>Confirm Cancellation</button>
      </footer>
    </div>
  </section>

  <div class="slds-backdrop slds-backdrop_open"></div>
</template>

  <template if:true={isShiftDragAndDrop}>
    <section
      aria-describedby="modal-content-id-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      class="slds-modal slds-fade-in-open"
      role="dialog"
      tabindex="-1"
    >
      <div class="slds-modal__container modal-container" style="max-width: 25%">
         <template if:false={dragAndDropValiadtion}>
              <header class="slds-modal__header" style="background: #002a52">
            <h2
              class="slds-text-heading_medium slds-hyphenate"
              style="color: white; font-weight: bold; text-align: center"
            >
              Warning
            </h2>
          </header>
      <template if:false={draggingShiftFatigueCheck}>
          <div class="slds-modal__content slds-p-around_medium modal-content">
            <div class="slds-m-around_small" style="text-align: center">
              <div>
                <p style="text-align: center">
                  You’re about to reassign this shift to
                  <b> {draggingStaffFullName}</b>. <br />Do you want to
                  continue?
                </p>
                <template if:true={darggingShiftRecurtempalte}>
                  <div class="recurring-section">
                    <p class="recurring-label">
                      This is a recurring shift. Would you like to apply this
                      change to:
                    </p>

                    <div class="radio-wrapper">
                      <lightning-radio-group
                        name="radioGroup"
                        options={draggingRecurOption}
                        value={draggingRecurShiftValue}
                        type="radio"
                        onchange={handleDraagingRecurChangeValue}
                      >
                      </lightning-radio-group>
                    </div>
                  </div>
                </template>
                <br />
                <p>
                  <template if:true={draggingSleepoverFalg}>
                    <b>Note:</b> This change will update the staff Sleeopover
                    Allowance from <b> ${draggingStaffRate} </b> to
                    <b> ${droppedStaffRate}</b>.
                  </template>
                  <template if:false={draggingSleepoverFalg}>
                    <b>Note:</b> This change will update the staff pay rate from
                    <b> ${draggingStaffRate}/hr </b> to
                    <b> ${droppedStaffRate}/hr</b>.
                  </template>
                </p>
              </div>

              <!-- Centered Buttons -->
              <div class="button-container slds-m-top_medium">
                <lightning-button
                  label="No"
                  variant="brand"
                  onclick={handleSetHoursClose}
                ></lightning-button>
                <lightning-button
                  label="Yes"
                  variant="brand"
                  onclick={handleAssignDragAndDropInRecurring}
                ></lightning-button>
              </div>
            </div>
          </div>
        </template>
        <template if:true={draggingShiftFatigueCheck}>
          <div class="slds-modal__content slds-p-around_medium modal-content">
            <div class="slds-m-around_small" style="text-align: center">
              <div>
                <p style="text-align: center">
                  The interval between shifts is less than 8 hours for
                  <b> {draggingStaffFullName}</b>.<br />
                  Would you like to reassign this shift?
                </p>
                <template if:true={darggingShiftRecurtempalte}>
                  <div class="recurring-section">
                    <p class="recurring-label">
                      This is a recurring shift. Would you like to apply this
                      change to:
                    </p>

                    <div class="radio-wrapper">
                      <lightning-radio-group
                        name="radioGroup"
                        options={draggingRecurOption}
                        value={draggingRecurShiftValue}
                        type="radio"
                        onchange={handleDraagingRecurChangeValue}
                      >
                      </lightning-radio-group>
                    </div>
                  </div>
                </template>
                <p>
                  <template if:true={draggingSleepoverFalg}>
                    <b>Note:</b> This change will update the staff Sleeopover
                    Allowance from <b>${draggingStaffRate}</b> to
                    <b>${droppedStaffRate}</b>.
                  </template>
                  <template if:false={draggingSleepoverFalg}>
                    <b>Note:</b> This change will update the staff pay rate from
                    <b>${draggingStaffRate}/hr</b> to
                    <b>${droppedStaffRate}/hr</b>.
                  </template>
                </p>
              </div>

              <!-- Centered Buttons -->
              <div class="button-container slds-m-top_medium">
                <lightning-button
                  label="No"
                  variant="brand"
                  onclick={handleSetHoursClose}
                ></lightning-button>
                <lightning-button
                  label="Yes"
                  variant="brand"
                  onclick={handleAssignDragAndDropInRecurring}
                ></lightning-button>
              </div>
            </div>
          </div>
        </template>
      </template>

       <template if:true={dragAndDropValiadtion}>
              <header class="slds-modal__header" style="background: #002a52;">
                              <h2 class="slds-text-heading_medium" style="color: white; text-align: center;">
                                <!--  <template if:true={AddShiftRecurringCheckboxValue}>
                                      Recurring Shift Conflicts
                                  </template> -->
                                  <template if:false={darggingShiftRecurtempalte}>
                                      Shift Assignment Failed
                                  </template>
                                   <template if:true={darggingShiftRecurtempalte}>
                                      Recurring Shift Conflicts
                                  </template>

                              </h2>
                </header>
                 
           <div class="slds-modal__content slds-p-around_medium slds-text-align_center custom-scroll">
              
            
               <template if:true={darggingShiftRecurtempalte}>
                    <p>Conflicts found in recurring shift dates:</p>
                    <div class="slds-text-color_weak slds-m-bottom_small">
                        <small><strong>Note: </strong> Conflicting dates will be skipped during creation</small>
                    </div>
                </template>
                <template if:false={darggingShiftRecurtempalte}>
                    <p class="slds-m-bottom_medium">Cannot proceed with shift assignment. Issues found:</p>
                </template>

              
                  <div class="center-list">
                  <ul>
                      <template for:each={staffDateConflicts} for:item="staff">
                          <li key={staff.staffId}>
                              <strong>{staff.staffName}</strong>
                              <ul class="slds-m-top_xx-small">
                                  <template for:each={staff.conflictDates} for:item="conflict">
                                      <li key={conflict.date} class="conflict-row">
                                          <span class="conflict-date">{conflict.displayDate}:</span>
                                          <span class="conflict-reason">{conflict.reason}</span>
                                      </li>
                                  </template>
                              </ul>
                          </li>
                      </template>
                  </ul>
                  </div>

            </div>
            
            <!-- Modal Footer -->
            <footer class="slds-modal__footer" >
               <template if:true={darggingShiftRecurtempalte}>
                    <div class="slds-align_absolute-center">
                        <lightning-button
                            label="Cancel"
                            variant="brand"
                            onclick={closeErrorModal}
                        ></lightning-button>
                        <lightning-button class="slds-p-left_medium"
                            label="Create Shifts" 
                            onclick={handleAssignDragAndDrop} 
                            variant="brand"
                        ></lightning-button>
                    </div>
                </template>
                  <template if:false={darggingShiftRecurtempalte}>
                    <lightning-button 
                    label="OK" 
                    onclick={closeErrorModal} 
                    variant="brand"
                   ></lightning-button>

                </template>
              
            </footer>
       </template>
      
      
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
