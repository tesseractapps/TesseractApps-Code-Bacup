<template>
    <template if:false={isTemplateModalOpen}>
  <div class="main-container">
    <div class="dropdown-row">
        <!-- Document Status Dropdown -->
        <div class="dropdown-groupP">
            <div class="floating-label">
                <span class="label-text-drop">Document Status</span>
    
                <select id="documentStatus" class="custom-dropdown" onchange={handleStatusChange}>
                <option value="" disabled selected>Choose an option</option>
                <option value="Draft">Pending</option>
                <option value="Pending">In Progress</option>
                <option value="Completed">Completed</option>
                <option value="All" selected>All</option>

            </select>
            </div>
        </div>
    
        <!-- Sort Order Dropdown with Icon -->
        <div class="dropdown-group">
            <div class="floating-label">
                <span class="label-text-drop">Sort Order</span>

            <select id="sortOrder" class="custom-dropdown" onchange={handleSortOrderChange}>
                <option value="desc" selected>Newest</option>
                <option value="asc">Oldest</option>
            </select>
        </div></div>

        <div slot="title" class="custom-logo-title">
            <img src={logo} alt="Te_sign Logo" class="logo-title-image" />
        </div>

       <!-- <div style="margin-left: auto;">
    <lightning-button label="My Templates" variant="brand" onclick={openTemplateModal}></lightning-button>
</div> -->

    </div>
    <!-- <template if:true={selectedStatus}>
        <template if:true={displayedDocuments.length}>
            <div class="table-container">
                <h3>{selectedTableTitle}</h3>
                <lightning-datatable key-field="Id" data={displayedDocuments} columns={filteredColumns} hide-checkbox-column onrowaction={handleRowAction}>
                </lightning-datatable>
            </div>
        </template>
        <template if:false={displayedDocuments.length}>
            <p class="no-data-message">No records available for the selected status.</p>
        </template>
    </template> -->
    <div class="content-wrapper">
    <template if:true={selectedStatus}>
        <template if:true={displayedDocuments.length}>
            <div class="table-container1 custom-scroll">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered" style="table-layout:fixed;width:98%;">
                <thead>
                    <tr>
                        <th class="slds-cell-wrap th" style="width: 20%;">File Name</th>
                        <th class="slds-cell-wrap th" style="width: 6%;">Created Date</th>
                        <th class="slds-cell-wrap th" style="width: 20%;">Recipients</th>
    
                        <!-- Show Status Column Only if Not Draft -->
                        <template if:false={isDraftView}>
                            <th class="slds-cell-wrap th" style="width: 15%;">Status</th>
                        </template>
    
                        <th class="slds-cell-wrap th" style="width: 5%;">Comments</th>
    
                        <!-- Show Actions Column Only if Not Draft or In-Progress -->
                        <template if:false={isDraftView}>
                            <template if:false={isInProgressView}>
                                <th class="slds-cell-wrap th" style="width: 5%;">Action</th>
                            </template>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={displayedDocuments} for:item="document">
                        <tr key={document.Id} class="tr1">
                            <td class="slds-cell-wrap">{document.FileName}</td>
                            <td class="slds-cell-wrap">{document.FormattedCreatedDate}</td>
                            <td class="slds-cell-wrap" style="white-space: pre-line;" lwc:dom="manual" data-id={document.Id}></td>

    
                            <!-- Show Status Column Only if Not Draft -->
                            <template if:false={isDraftView}>
                                <td class="slds-cell-wrap" style="text-align: left; vertical-align: middle;">{document.Status}</td>
                            </template>
    
                            <!-- Comments Column -->
                            <td style="text-align: left; vertical-align: middle;">
                                <a href="javascript:void(0);" data-id={document.Id} data-action="comments" onclick={handleRowAction} title="View Comments">
                                    <i class="material-icons forum-icon">forum</i>
                                </a>&nbsp;
                            </td>
    
                            <!-- Show Actions Column Only if Not Draft or In-Progress -->
                            <template if:false={isDraftView}>
                                <template if:false={isInProgressView}>
                                    <td style="text-align: left; vertical-align: middle;">
                                        <template if:true={document.showViewIcon}>
                                            <a href="javascript:void(0);"
                                            title="View Document"
                                            data-id={document.Id}
                                            data-action="view"
                                            onclick={handleRowAction}
                                            class="view-icon-link">
                                                <i class="material-icons view-icon">visibility</i>
                                            </a>

                                            <a href="javascript:void(0);"
                                            title="Download PDF"
                                            data-id={document.Id}
                                            data-action="download"
                                            onclick={handleRowAction}
                                            class="view-icon-link"
                                            style="margin-left: 10px;">
                                                <i class="material-icons view-icon">download</i>
                                            </a>
                                        </template>

                                    </td>
                                </template>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
            </div>
        </template>
        <template if:false={displayedDocuments.length}>
           <!--  <p class="no-data-message">No records available for the selected status.</p> -->
             <div class="no-data">
            <p>No records found</p>
            </div>
        </template>
    </template>
    
    
        

       </div>
    <template if:true={selectedStatus}>
        <template if:true={displayedDocuments.length}>
<div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-left_xx-large fixed-pagination" style="padding-top: 0.5em;">
    <!--RECORDS PER PAGE-->
    <div class="slds-col">
          <div class="slds-list_inline slds-p-bottom_xx-small">
             <label class="slds-text-color_weak slds-p-horizontal_x-small slds-grid_vertical-align-center" for="recordsPerPage">Page Size:</label>
             <div class="slds-select_container">
                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                      <template for:each={pageSizeOptions} for:item="option">
                         <option key={option} value={option}>{option}</option>
                      </template>
                </select>
             </div>
          </div>
    </div>

    <!--PAGE NAVIGATION-->
    <div class="slds-align_absolute-center" style="height:5rem">
          <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
          <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
          &nbsp;
          <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
          &nbsp;
          <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
          <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
    </div>
    <!--TOTAL RECORDS-->
    <div class="slds-clearfix slds-m-right_xx-large">
          <div class="slds-float_right">
             <span class="slds-badge"> Total Records: {totalRecords}</span>
          </div>
    </div>
    </div> 
</template>   
    </template>
        <!-- PDF Viewer Modal -->
        <template if:true={showPdfViewer}>
            <div class="pdf-modal">
                <div class="modal-header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close"
                        onclick={closePdfViewer}>
                    </lightning-button-icon>
                </div>
                <iframe src={pdfViewerUrl} class="pdf-iframe"></iframe>
            </div>
            <div class="modal-backdrop"></div>
        </template>

        <template if:true={showChatterModal}>
            <div class="messenger-modal">
                <!-- Header Section -->
                <div class="modal-header">
                    <h2 class="header-title">Team Conversations</h2>
                    <span class="close-icon" onclick={closeChatterModal}>&#x2716;</span>
                </div>
                
        
                <!-- Messages Section -->
                <div class="messages-container">
                    <template for:each={messages} for:item="message">
                        <template if:true={message.isDateDivider}>
                            <div key={message.date} class="date-divider">{message.date}</div>
                        </template>
                        <template if:false={message.isDateDivider}>
                            <div
                                key={message.id}
                                class={message.class}
                                data-id={message.id}
                                ondblclick={handleDoubleClick}>
                                <template if:true={message.repliedTo}>
                                    <div class="replied-to-message" onclick={scrollToMessage}>
                                        <span class="replied-from">{message.repliedTo.from}:</span>
                                        <span class="replied-text">{message.repliedTo.text}</span>
                                    </div>
                                </template>
                                <div class="message-content">
                                    <span class="text">{message.text}</span>
                                    <span class="timestamp">
                                        {message.timestamp}
                                        <lightning-icon icon-name="utility:check" alternative-text="Saved" size="x-small"></lightning-icon>
                                    </span>
                                </div>
                            </div>
                        </template>
                    </template>
                </div>
        
                <!-- Input Section -->
                <div class="input-container">
                    <template if:true={replyToMessage}>
                        <div class="reply-preview">
                            <span class="reply-preview-text">Replying to: {replyToMessage.text}</span>
                            <span class="cancel-reply" onclick={cancelReply}>&#x2716;</span>
                        </div>
                    </template>
                    <textarea
                        class="message-input"
                        placeholder="Type your message..."
                        value={newMessage}
                        oninput={handleMessageInput}
                        onkeydown={handleKeyDown}>
                    </textarea>
                    <img
                        src={sendIcon}
                        alt="Send"
                        class="send-icon"
                        onclick={sendReply}>
                </div>
            </div>
            <div class="modal-backdrop"></div>
        </template>
        
        
        
        

        <!-- Error Message -->
        <template if:true={error}>
            <div class="error-message">
                <p>{error}</p>
            </div>
        </template>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="overlay-logo"></div>
        
            <div class="spinner-wrapper">
                <div class="loader-container">
                    <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
                    <img src={imageUrl} alt="T Logo" class="Tlogo" />
                </div>
        
                <!-- Progress text instead of progress bar -->
                <p class="progress-text">Setting Up Things,</br>Please Wait...</p>
            </div>
        </template>

        <template if:true={isPdfViewerVisible}>
            <div class="modal-overlay">
            <section class="pdf-preview-modal">
                <div class="modal-header">
                    <h2>PDF Preview</h2>
                    <lightning-icon
                        icon-name="action:close"
                        alternative-text="Close"
                        onclick={closePdfViewer}
                        style="background-color: transparent; border: none; box-shadow: none;cursor:pointer"
                    ></lightning-icon>

                </div>
        
                <div class="pdf-canvas-container custom-scroll">
                    <canvas class="pdf-canvas"></canvas>
                </div>
        
                <div class="modal-footer">
                    <lightning-button label="Previous" onclick={showPreviousPage} disabled={isPreviousDisabled}></lightning-button>
<span>Page {currentPage} of {totalPages2}</span>
<lightning-button label="Next" onclick={showNextPage} disabled={isNextDisabled}></lightning-button>

                </div>
            </section>
        </div>
        </template>
</div>
</template>
        <template if:true={isTemplateModalOpen}>

            <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
        <p style="font-weight: bold; font-size: 140%; padding:1% 0% 1% 1%">My Templates</p>
         <div class="slds-grid slds-grid_align-end slds-m-top_small">
            <button class="slds-button slds-button_icon slds-button_icon-border slds-m-right_small" title="Refresh" onclick={refreshTemplates}>
                    <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg?cache=9.28.0#refresh"></use>
                    </svg>
                    
                </button>
            <lightning-button variant="brand" label="Add Template" class="slds-m-right_small" onclick={openAddTemplateModal} disabled={disableAddTemplate}></lightning-button>
    <lightning-button variant="brand" label="Back" onclick={closeTemplateModal} class="slds-m-right_small"></lightning-button>
    
</div>

    </div>

    <table class="slds-table slds-table_cell-buffer slds-table_bordered" style="table-layout:fixed;width:98%;">
                <thead>
                    <tr>
                        <th class="slds-cell-wrap th" style="width: 30%;">Template Name</th>
                        <th class="slds-cell-wrap th" style="width: 30%;">Document Type</th>
                        <th class="slds-cell-wrap th" style="width: 30%;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <template for:each={templateList} for:item="template">
                <tr key={template.id} class="tr1">
                    <td>{template.name}</td>
                    <td>{template.documentType}</td>
                    <td>

                        <!-- View Icon -->
                        <a href="javascript:void(0);"
                        title="View"
                        onclick={handleViewTemplate}
                        data-id={template.id}
                        class="icon-link">
                            <i class="material-icons view-icon">visibility</i>
                        </a>&nbsp;

                        <!-- Edit Icon -->
                        <a href="javascript:void(0);"
                        title="Edit"
                        onclick={handleEditTemplate}
                        data-id={template.id}
                        class="icon-link">
                            <i class="material-icons edit-icon">edit_document</i>
                        </a>&nbsp;

                        <!-- Delete Icon -->
                        <a href="javascript:void(0);"
                        title="Delete"
                        onclick={handleDeleteTemplate}
                        data-id={template.id}
                        class="icon-link">
                            <i class="material-icons delete-icon">delete</i>
                        </a>

                    </td>
                </tr>
            </template>
        </tbody>
    </table>
</template>
<template if:true={isTemplateAddModalOpen}>
    <div class="template-modal-overlay">
        <div class="template-modal">
            <!-- Header -->
            <div class="template-modal-header">
                <span class="template-modal-title">Create Template</span>
                <button class="template-modal-close" onclick={closeAddTemplateModal}>&times;</button>
            </div>

            <!-- Body -->
            <div class="template-modal-body">
    <!-- First Row: Two Fields Side by Side -->
    <div class="slds-grid slds-gutters">
        <!-- Document Type -->
        <div class="slds-col slds-size_1-of-2">
            <div class="floating-label">
                <span class="label-text-drop">Document Type</span>
                <lightning-combobox
                    name="documentType"
                    variant="label-hidden"
                    value={templateDocumentType}
                    placeholder="Select Document Type"
                    options={documentTypeOptions}
                    onchange={handleDocumentTypeChange}>
                </lightning-combobox>

            </div>
        </div>

        <!-- Template Name -->
        <div class="slds-col slds-size_1-of-2">
            <div class="floating-label">
                <span class="label-text-drop">Template Name</span>
                <lightning-input variant="label-hidden"
                                 value={templateName}
                                 onchange={handleTemplateNameChange}>
                </lightning-input>
            </div>
        </div>
    </div>

    <!-- Second Row: Upload File -->
    <div class="slds-grid slds-m-top_medium">
        <div class="slds-col slds-size_1-of-1">
            <div class="floating-label">
                         <input type="file" id="fileInput" onchange={onFileUpload} accept=".pdf, .doc, .docx" name="uploadFile" style="display: none;">
                         <button type="button" onclick={triggerFileInput} class="file-upload-button">
                         &#8684; Upload File
                         </button>

                          
                         </div>
                         <div class="slds-text-body_small slds-m-top_x-small">
                <template if:true={uploadedFiles.length}>
                    <ul class="slds-list_dotted">
                        <template for:each={uploadedFiles} for:item="file">
                            <li key={file.name}>{file.name}</li>
                        </template>
                    </ul>
                </template>
            </div>
        </div>
    </div>
</div>


            <!-- Footer -->
            <div class="template-modal-footer">
                <lightning-button variant="brand-outline" label="Cancel" onclick={closeAddTemplateModal}></lightning-button>
                <lightning-button variant="brand" label="Submit" onclick={submitTemplate}></lightning-button>
            </div>
        </div>
    </div>
    </template>

<template if:true={isPdfViewerVisible1}>
    <div class="modal-overlay">
        <section class="pdf-preview-modal">
            <div class="modal-header">
                <h2>PDF Preview</h2>
                <lightning-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    onclick={closePdfViewer1}
                    style="background-color: transparent; border: none; cursor: pointer;"
                ></lightning-icon>
            </div>

            <!-- ✅ Title Section -->
            <div class="pdf-title">
                <div><strong>Template Name:</strong> {selectedTemplateName}</div>&nbsp; <div><strong>Document Type:</strong> {selectedDocumentType}</div>
                
            </div>

            <iframe src={pdfViewerUrl1} class="pdf-iframe" style="width: 100%; height: 80vh; border: none;"></iframe>
        </section>
    </div>
</template>


</template>
