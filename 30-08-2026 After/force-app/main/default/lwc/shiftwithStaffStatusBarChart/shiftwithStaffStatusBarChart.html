<template>
    <div class="container-box">
        <div>
            <div class="title-bar">
                <a href="#" data-name="Roster Manager" onclick={handleRedirectClick} class="title-link">
                    Roster Manager
                </a>
                <div class="week-selector">
                    <button onclick={handlePreviousPeriod} class="arrow-button">❮</button>


                    <div style="WIDTH: 70%;">
                        <lightning-combobox
                            name="timePeriod"
                            variant="label-hidden"
                            label="Select Time Period"
                            value={selectedTimePeriod}
                            placeholder="Choose an option"
                            options={timePeriodOptions}
                            onchange={handleTimePeriodChange}>
                        </lightning-combobox>
                    </div>
                    
                    <button onclick={handleNextPeriod} class="arrow-button">❯</button>
                </div>

            </div>

            <div class="slds-p-around_medium">
                <canvas class="barChart"></canvas>
            </div>
        </div>
    </div>
</template>
