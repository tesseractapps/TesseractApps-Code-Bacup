<template>
    <div class="mainContainer">

    <template if:true={isMenuContainer}>
                <div class="menu-container">

                    <div class={newQuoteClass}
                        onclick={handleNewQuoteClick}>
                        New Quote
                    </div>

                    <div class={quoteDraftClass}
                        onclick={handleQuoteDraftClick}>
                        Quote Draft
                    </div>

                    <template if:false={isStart}>

                        <div class={tSignClass}
                            onclick={handleTSignHistoryClick}>
                            T-Sign Quote History
                        </div>

                    </template>

                    <lightning-button
                        class="close-btn"
                        variant="brand-outline"
                        onclick={closeQuote}
                        label="Close">
                    </lightning-button>

                    

                </div>

    </template>
                 <!-- =======================
                     NEW QUOTE SCREEN
                    ======================== -->
    <template if:true={isNewQuoteScreen}>

         <!-- Sub Tabs -->
        <div class="subTabs slds-border_bottom">


                <div class="tab-view-wrapper">
                    <button
                        class={participantsTabClass}
                        onclick={handleParticipantsTabClick}
                    >
                        Participants
                    </button>

                    <button
                        class={newContactsTabClass}
                        onclick={handleNewContactsTabClick}
                    >
                        New Contacts
                    </button>

                    <template if:true={isNewContactsTab}>
                        <lightning-button
                            class="slds-float_right"
                            style="padding: 0.2%;"
                            label="Add New Contact"
                            variant="brand"
                            onclick={handleNewContact}>
                        </lightning-button>
                    </template>

                </div>
        </div>
    <!-- <template if:true={isNewQuoteScreen}> -->
            <!-- <pARTICIPANTS> -->
            <template if:true={isParticipantsTab}>
                <div class="slds-grow slds-p-around_small" style="min-height:0; display:flex; flex-direction:column;">
                    <div class="slds-grid slds-gutters slds-wrap slds-flex-shrink-none" style="padding-bottom:0.6%;">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                            <lightning-input type="search" variant="label-hidden" placeholder="Search by name, email or phone..." value={searchTerm} onchange={handleSearchKey}></lightning-input>
                        </div>
                    </div>
                       <!--  <template if:true={isLoading}>
                            <div class="slds-align_absolute-center slds-p-vertical_medium slds-flex-shrink-none">
                                <lightning-spinner alternative-text="Loading"></lightning-spinner>
                            </div>
                         </template>
                            -->

                        <template if:true={pageClients.length}>

                            <div class="table-container ndis-participants-table slds-grow" style="min-height:0; display:flex; flex-direction:column;">

                                <!-- HEADER -->
                                <div class="header-wrapper">
                                    <table class="staff-table" role="table">
                                        <thead>
                                            <tr>
                                                <th class="table-th" title="Name">Name</th>
                                                <th class="table-th" title="NDIS Number">NDIS Number</th>
                                                <th class="table-th" title="Email">Email</th>
                                                <th class="table-th" title="Phone">Phone</th>
                                                <th class="table-th" title="State">State</th>
                                                <th class="table-th" title="Action">Action</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>

                                <!-- BODY (SCROLL ONLY) -->
                                <div class="body-scroll custom-scroll tableHeight table-body">
                                    <table class="staff-table">
                                        <tbody>

                                            <template for:each={pageClients} for:item="c">
                                                <tr key={c.Id} class="table-row">

                                                    <!-- Name -->
                                                    <td class="table-td" title={c.fullName}>
                                                        <div class="avatar-name">
                                                            <div class="avatar-circle">
                                                                {c.initials}
                                                            </div>
                                                            <span class="avatar-text">{c.fullName}</span>
                                                        </div>
                                                    </td>

                                                    <!-- NDIS Number -->
                                                    <td class="table-td" title={c.ndisNumber}>{c.ndisNumber}</td>

                                                    <!-- Email -->
                                                    <td class="table-td" title={c.Email__c}>{c.Email__c}</td>

                                                    <!-- Phone -->
                                                    <td class="table-td" title={c.Contact_Number__c}>{c.Contact_Number__c}</td>

                                                    <!-- State -->
                                                    <td class="table-td" title={c.State__c}>{c.State__c}</td>

                                                    <!-- Action -->
                                                    <td class="table-td" title="Select">
                                                       <!--  <lightning-button
                                                            label="Select"
                                                            variant="brand"
                                                            data-id={c.Id}
                                                            data-quoteid={c.qid}
                                                            onclick={handleParticipantSelect}>
                                                        </lightning-button> -->

                                                        <span class="material-icons edit-icon"
                                                            data-id={c.Id}
                                                            data-quoteid={c.qid}
                                                            data-industry ={c.industry}
                                                            onclick={handleParticipantSelect} title="Generate Quote" style="cursor: pointer;">
                                                         Receipt_Long 
                                                      </span>
                                                    </td>

                                                </tr>
                                            </template>

                                            <!-- Empty State -->
                                            <template if:true={noResults}>
                                                <tr>
                                                    <td colspan="6" class="table-td no-data" title="No contacts found">
                                                        No contacts found
                                                    </td>
                                                </tr>
                                            </template>

                                        </tbody>
                                    </table>
                                </div>

                            </div>

                          
                        </template>
                        <template if:false={pageClients.length}>
                            <div class="no-data">
                                <p>No records found</p>
                            </div>
                        </template>


                        <template if:true={hasError}>
                            <div class="slds-text-color_error slds-p-around_small slds-flex-shrink-none">{errorMessage}</div>
                        </template>

                        <template if:true={noResults}>
                            <div class="slds-text-align_center slds-p-vertical_medium slds-text-color_weak slds-flex-shrink-none">No contacts found.</div>
                        </template>
                </div>
                            <!-- PAGINATION -->
                         <template if:true={paginationVisible}>
                            <div class="fixed-pagination">
                                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-p-horizontal_small">

                                    <div class="slds-col">
                                        <div class="slds-list_inline">
                                            <span style="margin-right:5px;">Page Size:</span>
                                            <div class="slds-select_container">
                                                <select class="slds-select" onchange={handleRecordsPerPage}>
                                                    <template for:each={pageSizeOptions} for:item="option">
                                                        <option key={option} value={option}>{option}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="slds-align_absolute-center">
                                    <lightning-button
                                            class="slds-m-horizontal_xx-small"
                                            disabled={isFirstPage}
                                            icon-name="utility:jump_to_left"
                                            label="First"
                                            onclick={firstPage}>
                                        </lightning-button>

                                        <lightning-button
                                            class="slds-m-horizontal_xx-small"
                                            disabled={isFirstPage}
                                            icon-name="utility:chevronleft"
                                            label="Previous"
                                            onclick={previousPage}>
                                        </lightning-button>

                                        <span class="slds-badge slds-m-horizontal_xx-small">
                                            Showing {pageNumber} of {totalPages} Page(s)
                                        </span>

                                        <lightning-button
                                            class="slds-m-horizontal_xx-small"
                                            disabled={isLastPage}
                                            icon-name="utility:chevronright"
                                            label="Next"
                                            onclick={nextPage}>
                                        </lightning-button>

                                        <lightning-button
                                            class="slds-m-horizontal_xx-small"
                                            disabled={isLastPage}
                                            icon-name="utility:jump_to_right"
                                            label="Last"
                                            onclick={lastPage}>
                                        </lightning-button>
                                    </div>

                                    <div class="slds-col slds-text-align_right">
                                        <span class="slds-badge">Total Records: {totalRecords}</span>
                                    </div>

                                </div>
                            </div>
                         </template>                  
            </template>

                 NEW CONTACTS LIST + New Contact
            ========================== -->

                <div class="contact-scroll custom-scroll">


                                    <table class="quote-table slds-m-around_small">

                                                        </lightning-button>

            <template if:true={isNewContactsTab}>
                <div class="slds-grow slds-p-around_small" style="min-height:0; display:flex; flex-direction:column;">
                    <template if:false={noContactRecordsFlag}>
                        <div class="table-container ndis-new-contacts-table slds-grow" style="min-height:0; display:flex; flex-direction:column;">

                            <!-- HEADER -->
                            <div class="header-wrapper">
                                <table class="staff-table" role="table">
                                    <thead>
                                        <tr>
                                            <th class="table-th" title="Name">Name</th>
                                            <th class="table-th" title="Email">Email</th>
                                            <th class="table-th" title="Phone">Phone</th>
                                            <th class="table-th" title="State">State</th>
                                            <th class="table-th" title="Status">Status</th>
                                            <th class="table-th" title="Action">Action</th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>

                            <!-- BODY -->
                            <div class="body-scroll custom-scroll tableHeight table-body">
                                <table class="staff-table">
                                    <tbody>
                                        
                                        <template for:each={pageNewContacts} for:item="contact">
                                            <tr key={contact.Id} class="table-row">

                                                <!-- Avatar + Name (SAME TD) -->
                                                <td class="table-td" title={contact.Name}>
                                                    <div class="avatar-name">
                                                        <div class="avatar-circle">
                                                            {contact.initials}
                                                        </div>
                                                        <span class="avatar-text">
                                                            {contact.Name}
                                                        </span>
                                                    </div>
                                                </td>

                                                <td class="table-td" title={contact.Email__c}>{contact.Email__c}</td>
                                                <td class="table-td" title={contact.Phone__c}>{contact.Phone__c}</td>
                                                <td class="table-td" title={contact.State__c}>{contact.State__c}</td>

                                                <td class="table-td" title="New Contact">
                                                    <span class="status-pill new-contact">
                                                        New Contact
                                                    </span>
                                                </td>

                                                <td class="table-td" title="Select">
                                                <!--  <lightning-button
                                                        label="Select"
                                                        variant="brand"
                                                        data-id={contact.Id}
                                                        onclick={handleNewContactSelect}>
                                                    </lightning-button> -->
                                                    <span class="material-icons edit-icon"
                                                        data-id={contact.Id}
                                                        data-industry ={contact.industryType}
                                                        onclick={handleNewContactSelect} title="Generate Quote" style="cursor: pointer;">
                                                    Receipt_Long 
                                                    </span>
                                                    <span class="material-icons edit-icon"
                                                        data-id={contact.Id}
                                                        onclick={handleEditNewContact} title="Edit" style="cursor: pointer;">
                                                        edit_document
                                                    </span>
                                                </td>

                                            </tr>
                                        </template>

                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </template>
                    <template if:true={noContactRecordsFlag}>
                        <div class="no-data">
                            <p>No records found</p>
                        </div>
                    </template>
                </div>
            <template if:true={paginationVisible}>
            <div class="fixed-pagination">
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-p-horizontal_small">

                    <div class="slds-col">
                        <div class="slds-list_inline">
                            <span style="margin-right:5px;">Page Size:</span>
                            <div class="slds-select_container">
                                <select class="slds-select" onchange={handleRecordsPerPage}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="slds-align_absolute-center">
                        <lightning-button
                        class="slds-m-horizontal_xx-small"
                            disabled={isFirstPage}
                            icon-name="utility:jump_to_left"
                            label="First"
                            onclick={firstPage}>
                        </lightning-button>

                        <lightning-button
                            disabled={isFirstPage}
                            class="slds-m-horizontal_xx-small"
                            icon-name="utility:chevronleft"
                            label="Previous"
                            onclick={previousPage}>
                        </lightning-button>

                        <span class="slds-badge slds-m-horizontal_xx-small">
                            Showing {pageNumber} of {totalPages} Page(s)
                        </span>

                        <lightning-button
                            disabled={isLastPage}
                            class="slds-m-horizontal_xx-small"
                            icon-name="utility:chevronright"
                            label="Next"
                            onclick={nextPage}>
                        </lightning-button>

                        <lightning-button
                            disabled={isLastPage}
                            class="slds-m-horizontal_xx-small"
                            icon-name="utility:jump_to_right"
                            label="Last"
                            onclick={lastPage}>
                        </lightning-button>
                    </div>

                    <div class="slds-col slds-text-align_right">
                        <span class="slds-badge">
                            Total Records: {totalRecordsContact}
                        </span>
                    </div>

                </div>
            </div>
        </template>                
            </template>




    </template>
               <!-- BUILDER SCREEN -->
              <template if:true={isBuilderScreen}>
                <div class="slds-grow" style="min-height:0; display:flex; flex-direction:column;">
                  <div class="selectedCard slds-grow slds-scrollable_y custom-scroll slds-p-around_small" style="min-height:0;">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center" style="Padding: 0 0 0.8% 0.1%;">
                                    <div>
                                        <h2 class="slds-text-title_bold">NDIS Quote Tool</h2>
                                        <p class="slds-text-color_weak">Add support items and configure the quote</p>
                                    </div>

                                    <div>
                                        <lightning-button 
                                            label="Back" 
                                            title="Back"
                                            variant="brand" 
                                            onclick={goBackToList}>
                                        </lightning-button>
                                    </div>
                                </div>

                            <template if:true={clientflag}>
                                <template if:true={selectedClient}>
                                <div class="slds-box slds-m-bottom_medium quoteCardSelected">
                                    <p class="slds-text-title_bold">{selectedClient.fullName}</p>
                                    <p class="slds-text-body_small">NDIS: {selectedClient.NDIS_Number__c} · {selectedClient.Email__c} · {selectedClient.Contact_Number__c}</p>
                                </div>
                             </template>
                             </template>
                            <template if:true={contactflag}>
                             <template if:true={selectedContact}>
                                <div class="slds-box slds-m-bottom_medium quoteCardSelected">
                                    <p class="slds-text-title_bold">{selectedContact.Name}</p>
                                    <p class="slds-text-body_small">{selectedContact.Email__c}·{selectedContact.Phone__c}.{selectedContact.State__c}</p>
                                </div>
                             </template>
                             </template>

                             <div class="slds-box slds-m-bottom_medium quoteCardSelected">
                                    <h2 class="slds-text-title_bold slds-m-bottom_medium">Quote Configuration</h2>
                                <!-- ROW 1: 4 Fields -->
                                <div class="slds-grid slds-gutters">
                                    
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                         <lightning-input 
                                            label="Quote Number" 
                                            value={quoteNumber}
                                            required
                                            disabled
                                            onchange={handleQuoteNumber}>
                                        </lightning-input>

                                        
                                    </div>

                                   <!--  <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4"> -->
                                       <!--  <lightning-combobox 
                                            label="State" 
                                            value={state} 
                                            required
                                            options={stateOptions}
                                            onchange={handleQuoteStateChange}>
                                        </lightning-combobox>
 -->
                                       <!--  <c-tesseract-apps-single-combobox
                                            
                                            options={stateOptions}
                                            value={state} 
                                             onchange={handleQuoteStateChange}>
                                        </c-tesseract-apps-single-combobox>
                                    </div> -->

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <div class="slds-form-element">
                                            <label class="slds-form-element__label">
                                                <abbr class="slds-required" title="required">*</abbr>
                                                State
                                            </label>

                                            <c-tesseract-apps-single-combobox
                                                options={stateOptions}
                                                value={state}
                                                onchange={handleQuoteStateChange}>
                                            </c-tesseract-apps-single-combobox>
                                        </div>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-combobox 
                                            label="Valid for (days)" 
                                            value={validFor} 
                                            required
                                            options={validForOptions}
                                            onchange={handleValidForChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-input 
                                            type="text"
                                            label="Prepared By (Optional)" 
                                            value={preparedBy}
                                            onchange={handlePreparedBy}>
                                        </lightning-input>
                                    </div>

                                </div>

                                <!-- ROW 2: Date Fields (still 4 columns) -->
                                <div class="slds-grid slds-gutters">

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-input 
                                            type="date" 
                                            label="Service Period Start" 
                                            required
                                            value={serviceStart} 
                                            onchange={handleStartDate}>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                        <lightning-input 
                                            type="date" 
                                            label="Service Period End" 
                                            required
                                            value={serviceEnd} 
                                            onchange={handleEndDate}>
                                        </lightning-input>
                                    </div>

                                </div>


                                <template if:true={hasQuoteCoverage}>
                                    <div class="quote-coverage-card slds-m-top_medium">
                                        <span class="material-icons info-icon">info</span>

                                        <div>
                                            <strong>
                                                Quote Coverage: {quoteCoverage.weeks} weeks ({quoteCoverage.months} months)
                                            </strong>
                                            <p class="slds-m-top_x-small">
                                                This is the period that supports will be delivered. The quote total represents the maximum projected cost
                                                for this duration. Actual spending occurs as services are delivered.
                                            </p>
                                        </div>
                                    </div>

                                </template>
                                </div>
                                <div class="slds-grid slds-gutters slds-m-bottom_medium summary-grid">

                                    <div class="slds-col">
                                        <div class="summary-card card-line-items">
                                            <div class="summary-title">Line Items</div>
                                            <div class="summary-value">{lineItemCount}</div>
                                        </div>
                                    </div>

                                    <div class="slds-col">
                                        <div class="summary-card card-total-hours">
                                            <div class="summary-title">Total Hours</div>
                                            <div class="summary-value">{totalHours}</div>
                                        </div>
                                    </div>

                                    <div class="slds-col">
                                        <div class="summary-card card-avg-rate">
                                            <div class="summary-title">Avg. Rate / Hour</div>
                                            <div class="summary-value">
                                                <lightning-formatted-number
                                                    value={avgRatePerHour}
                                                    format-style="currency"
                                                    currency-code="AUD">
                                                </lightning-formatted-number>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                                <!-- Calculate costs + inline rows -->
                                <div class="slds-box slds-m-bottom_medium" style="padding:0; border-radius:0.75rem;">
                                    <div class="section-header">
                                        <div class="left">
                                            <h2 class="slds-text-title_bold">Calculate costs</h2>
                                            <p class="subtitle">Easily adjust the quantity, frequency, and duration of your supports to calculate an estimate of total costs</p>
                                        </div>

                                        <lightning-button variant="neutral" label="+ Add Support Item" onclick={addSupportRow}></lightning-button>
                                    </div>
                                    <div class="table-container">
                                        <!-- HEADER (fixed inside scroll wrapper) -->
                                        <div class="header-wrapper">
                                            <table class="quote-table" role="table">
                                                <thead>
                                                    <tr>
                                                        <th class="table-th quotepd" title="Service Type">Service Type</th>
                                                        <th class="table-th quotepd" title="Support Item">Support Item</th>
                                                        <th class="table-th quotepd" title="Price">Price</th>
                                                        <th class="table-th quotepd" title="Qty(hrs)">Qty(hrs)</th>
                                                        <th class="table-th quotepd1" title="Freq">Freq</th>
                                                        <th class="table-th quotepd" title="Interval">Interval</th>
                                                        <th class="table-th quotepd" title="Duration">Duration</th>
                                                        <th class="table-th quotepd1" title="Period">Period</th>
                                                        <th class="table-th quotepd" title="Cost">Cost</th>
                                                        <th class="table-th quotepd" title="Action">Action</th>
                                                    </tr>
                                                </thead>
                                            </table>
                                        </div>

                                        <!-- SCROLLABLE BODY -->
                                        <div class="body-scroll custom-scroll tableHeight" style="overflow:visible;">
                                            <table class="quote-table">
                                                <tbody>
                                                    <template for:each={quoteSupportItems} for:item="row">
                                                        <tr key={row.id}>

                                                            <!-- Service Type -->
                                                            <td class="table-td" title={row.serviceTypeLabel}>
                                                                 <c-tesseract-apps-single-combobox
                                                                    variant="label-hidden"
                                                                    data-id={row.id}
                                                                    options={serviceTypeOptions}
                                                                    title={row.serviceTypeLabel}
                                                                    value={row.serviceType}
                                                                    onchange={handleRowServiceTypeChange}>
                                                                 </c-tesseract-apps-single-combobox>
                                                            </td>

                                                            <!-- Support Item -->
                                                            <td class="table-td" title={row.supportItemLabel}>
                                                                 <c-tesseract-apps-single-combobox
                                                                    variant="label-hidden"
                                                                    data-id={row.id}
                                                                    options={row.supportItemOptions}
                                                                    title={row.supportItemLabel}
                                                                    value={row.supportItem}
                                                                    onchange={handleRowSupportItemChange}>
                                                                 </c-tesseract-apps-single-combobox>
                                                            </td>

                                                            <!-- Price -->
                                                            <td class="table-td" title={row.priceDisplay}>
                                                                {row.priceDisplay}
                                                            </td>

                                                            <!-- Qty -->
                                                            <td class="table-td" title={row.qty}>
                                                                <lightning-input 
                                                                    variant="label-hidden"
                                                                    type="number"
                                                                    min="0"
                                                                    step="0.01"
                                                                      formatter="decimal"
                                                                    data-id={row.id}
                                                                    value={row.qty}
                                                                    onchange={handleRowQtyChange}>
                                                                </lightning-input>

                    <lightning-input type="email"

                    value={email} onchange={handleEmailChange} 
                    class="slds-m-top_medium" required>
                    </lightning-input>
                
                    <lightning-input label="Phone"
                        value={phone} 
                        onchange={handlePhoneChange} class="slds-m-top_medium" 
                        required>
                    </lightning-input>

                    <lightning-combobox label="Role"
                        value={role} 
                        options={roleList}
                        onchange={handleRoleChange} class="slds-m-top_medium" 
                        required>

                     <lightning-input label="NDIS ID"
                        value={NdisId}

                        >
