<template>
        <template if:true={isFileViewOpen}>
        <div style="display:flex; justify-content:flex-end; margin: 8px 1%;">
            <lightning-button 
                label="Back" 
                variant="brand" 
                onclick={closeFileView}>
            </lightning-button>
        </div>
        <div class="main-container-iframe custom-scroll">
            <iframe src={currentUrl} width="100%" height="1200px"></iframe>
        </div>
    </template>
    <template if:false={isFileViewOpen}>
    <div class="notes-header">
        <div class="slds-float_right">
            <lightning-button 
                label="Create Note" 
                variant="brand"
                onclick={openCreateModal}>
            </lightning-button>
        </div>
        <div class="slds-clearfix"></div>
    </div>

    <div class="notes-container">
        <template if:true={hasNotes}>
            <template for:each={notesList} for:item="note">
<div class="custom-note-card" key={note.Id}>

    <!-- HEADER -->
    <div class="card-header">
        <div class="header-left">
            <h2 class="note-title">{note.Title__c}</h2>
        </div>

        <!-- EDIT ICON -->
        <div class="header-right">
            <div class="meta-row">
                <div class="meta-item">
                    <lightning-icon icon-name="standard:user" size="x-small"></lightning-icon>
                    <span>{note.CreatedBy.Name}</span>
                </div>

                <div class="meta-item">
                    <lightning-icon icon-name="utility:event" size="x-small"></lightning-icon>
                    <lightning-formatted-date-time 
                        value={note.CreatedDate}
                        year="numeric"
                        month="short"
                        day="2-digit">
                    </lightning-formatted-date-time>
                </div>
            </div>            
            <lightning-button-icon 
                icon-name="utility:edit"
                variant="bare"
                data-id={note.Id}
                onclick={handleEditNote}>
            </lightning-button-icon>
        </div>
    </div>

    <!-- DESCRIPTION -->
    <lightning-formatted-rich-text
    value={note.Description__c}>
</lightning-formatted-rich-text>

    <!-- ATTACHMENTS -->
    <div class="attachments-section">
        <div class="attachments-label">
            <!-- <lightning-icon icon-name="utility:attach" size="xx-small"></lightning-icon> -->
            <span>Attachments ({note.Note_Attachments__r.length})</span>
        </div>

        <div class="attachments-container">
            <template for:each={note.Note_Attachments__r} for:item="att">
                <div key={att.Id} class="attachment-box">

                    <span class="file-name">{att.File_Name__c}</span>

                    <div class="attachment-actions">
                        <lightning-button-icon 
                            icon-name="utility:preview"
                            size="small"
                            variant="bare"
                            data-url={att.Awsurl__c}
                            onclick={handleViewAttachment}>
                        </lightning-button-icon>

                        <lightning-button-icon 
                            icon-name="utility:delete"
                            size="small"
                            variant="bare"
                            data-id={att.Id}
                            data-key={att.key__c}
                            onclick={handleDeleteNoteAttachment}>
                        </lightning-button-icon>
                    </div>

                </div>
            </template>
        </div>
    </div>

</div>
            </template>
        </template>

        <template if:false={hasNotes}>
            <!-- <div class="slds-text-align_center slds-p-around_large empty-state">
                <lightning-icon icon-name="utility:note" size="large"></lightning-icon>
                <p class="slds-m-top_small">No notes yet. Click "Create Note" to add one.</p>
            </div> -->
          <div class="no-data">
            <p>No records found</p>
          </div>            
        </template>
    </div>

    <!-- CREATE / EDIT MODAL -->
    <template if:true={showNotesModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-custom">
                <header class="slds-modal__header headercustom">
                    <h2 class="slds-modal__title slds-text-heading_medium slds-hyphenate h2custom">
                        {modalTitle}
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium custom-scroll">
                    <div class="slds-grid slds-wrap slds-gutters">

                      <!-- TITLE -->
<div class="slds-col slds-size_1-of-1">
    <div class="sil-floating-label">
        <span class="sil-label-text"><span style="color:red">*</span>Title</span>

        <lightning-input
            variant="label-hidden"
            value={title}
            maxlength="255"
            required
            onchange={handleTitleChange}>
        </lightning-input>
    </div>
</div>

<!-- DESCRIPTION -->
<div class="slds-col slds-size_1-of-1 slds-m-top_small">
    <div class="sil-floating-label">
        <span class="sil-label-text">Description</span>

        <lightning-input-rich-text
            value={description}
            onchange={handleDescriptionChange}>
        </lightning-input-rich-text>
    </div>
</div>

                        <!-- File Upload — identical structure to Repository -->
                        <div class="slds-col slds-size_1-of-1 slds-m-top_medium">
                            <div class="slds-box drag-drop"
                                ondragover={handleDragOver}
                                ondrop={handleDrop}>
                                <p class="slds-text-align_center">
                                    Drag and drop files here<br/>
                                    <a href="javascript:void(0);" onclick={triggerFileInput}>
                                        Click to browse
                                    </a>
                                </p>
                                <input
                                    type="file"
                                    class="hidden-file-input"
                                    onchange={handleFileUploadInputChange}
                                    multiple={allowMultiple}/>
                            </div>

                            <template if:true={isFileExpand}>
                                <c-document-office-service
                                    record-id={recordIdForFileUpload}
                                    module-path-from-parent="ticket"
                                    onuploadcomplete={handleAwsUploadComplete}
                                    onfiledeleted={handleFileDeleted}
                                    oncancel={handlefilecancel}>
                                </c-document-office-service>
                            </template>
                        </div>

                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleCancel}>
                    </lightning-button>
                    <lightning-button
                        class="slds-m-left_small"
                        variant="brand"
                        label={saveButtonLabel}
                        onclick={handleSave}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>


</template>
    <!-- Loading spinner -->
    <template if:true={showSpinner}>
            <div class="overlay-logo"></div>

    <div class="spinner-wrapper">
      <div class="loader-container">
        <img src={logoUrl} alt="Breathing Frame" class="breathing-frame" />
        <img src={imageUrl} alt="T Logo" class="Tlogo" />
      </div>

      <!-- Progress text instead of progress bar -->
      <p class="progress-text">Setting Up Things,<br />Please Wait...</p>
    </div>
    </template>
</template>
