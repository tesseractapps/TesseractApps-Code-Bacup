<template>
    <div class="container-box">
        <div>
            <div class="slds-p-around_small" style="display: flex; justify-content: space-between;">
                <!-- Left side: ICT Timesheet -->
                <div class="slds-col slds-size_1-of-2 slds-align-middle">
                    <h3 style="padding: 8px 0px 0 20px;">
                       <!--  <span style="font-size: 100%; font-weight: bold;">ICT TimeSheet</span> -->
                        <a href="#" data-name="ICT Timesheet" onclick={grandchildevent} style="font-size: 100%;font-weight:bold;color:black">ICT TimeSheet</a>
                    </h3>
                </div>

                <!-- Right side: Combobox -->
                <div class="slds-col slds-size_1-of-3 slds-align-middle">
                    <div class="floating-label">
                        <lightning-combobox class="wide-combobox" label="Role" variant="label-hidden" value={selectedRange} options={rangeOptions} onchange={handleRangeChange}></lightning-combobox>
                    </div>
                </div>
            </div>
            <div class="slds-p-around_medium">
                <canvas class="barChart"></canvas>
            </div>
        </div>
    </div>
