<template>
<div style="background-color: #E2EBEF;height:auto;width:100%;margin-bottom:10px;">
    <div>
        <div class="slds-grid slds-var-m-left_x-large slds-var-m-right_x-large" style="font-weight:bold;margin-top:10px;"> 
               <div class={selectedClassprofile} data-name="profile" title=" My Profile"  onclick={handleprofile}
                        style="cursor:pointer;text-align:center" > 
                        My Profile                             
               </div> 
               <div class={selectedClassrewards} data-name="rewards" title="Awards & Recognition" alt="Rewards & Recognition" name="rewards" src={rewards} onclick={handleRewards}
                        style="cursor:pointer;text-align:center" > 
                     Awards&nbsp;&&nbsp;Recognition                                
                </div>   
                <div class={selectedClasstraining} data-name="training" title="Training and Evaluation" alt="Training and Evaluation" name="training" src={training} onclick={handleTraining}
                style="cursor:pointer;text-align:center" > 
                Training&nbsp;and&nbsp;Evaluation                                
                </div> 
                <div class={selectedClassleave} data-name="Apply leave" title="Apply Leave" alt="Apply Leave" name="Apply Leave" src={Leave} onclick={handleLeave}
                style="cursor:pointer;text-align:center" > 
                Leave&nbsp;Management                                
                </div>  
                <div class={selectedClassreports} data-name="Reports" title="Reports" alt="Reports" name="Reports" src={Reports} onclick={handleReports}
                style="cursor:pointer;text-align:center" > 
                Reports                                
                </div>                       
        </div>
        <template if:true={profileflag}>
            <c-my-profile  org-id={orgid} staff-id={StaffId} superior-flag={superiors}></c-my-profile>
        </template>
        <template if:true={rewardsFlag}>
            <div><c-awards-and-recognization-lwc orgid={orgid}></c-awards-and-recognization-lwc> </div>
        </template>
        <template if:true={trainingFlag}>
            <div><c-hr-training  org-id={orgid} selected-name={orgid}></c-hr-training> </div>
        </template>
        <template if:true={leaveFlag}>
            <div><c-staff-leave-management-lwc  org-id={orgid} staff-id={StaffId}></c-staff-leave-management-lwc> </div>
        </template>
        <template if:true={reportsFlag}>
            <div><c-my-profile-staff-reports-lwc  org-name={orgname} staff-id={StaffId} ></c-my-profile-staff-reports-lwc> </div>
        </template>
    </div>
</div>
    
</template>
