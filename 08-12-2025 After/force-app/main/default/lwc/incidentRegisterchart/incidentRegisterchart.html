<template>
    <div class="container-box">
        <div>
            <h3 slot="title" style="padding: 8px 0px 0 20px;">
                <!-- <span style="font-size: 100%;font-weight:bold;cursor:pointer;"  onclick={grandchildevent}>Incident Register</span> -->
                <a href="#" data-name="Incident Register" onclick={handleRedirectClick} style="font-size: 100%;font-weight:bold;color:black">Incident Register</a>
            </h3>
        <div class="slds-grid slds-align_absolute-center slds-wrap">
            <!-- Open Cases -->
            <span
                class="slds-size_1-of-8 geeks slds-m-around_medium AdminButton large-cases"
                onclick={handleOpenCasesClick}>
                <div class="case-count">
                    <p class="slds-text-heading_medium slds-text-color_success">
                        {openCaseCount}
                    </p>
                    <p class="slds-text-body_medium slds-text-color_weak">

                    </p>
                </div>
            </span>

            <!-- In Progress Cases -->
            <span
                class="slds-size_1-of-8 geeks slds-m-around_medium AdminButton large-cases"
                onclick={handleInProgressCasesClick}>
                <div class="case-count">
                    <p class="slds-text-heading_medium slds-text-color_success">
                        {inProgressCaseCount}
                    </p>
                    <p class="slds-text-body_medium slds-text-color_weak">
                        In Progress
                    </p>
                </div>
            </span>

            <!-- Resolved Cases -->
            <span
                class="slds-size_1-of-8 geeks slds-m-around_medium AdminButton large-cases"
                onclick={handleResolvedCasesClick}>
                <div class="case-count">
                    <p class="slds-text-heading_medium slds-text-color_success">
                        {resolvedCaseCount}
                    </p>
                    <p class="slds-text-body_medium slds-text-color_weak">
                        Resolved
                    </p>
                </div>
            </span>
        </div>
