<template>
    <lightning-card>
        <div if:true={isDesktop}>
            <c-home-lwc></c-home-lwc>
            <div style="margin-right:10%;">

                <div class="slds-grid slds-wrap">

                    <div class="slds-size_1-of-8" style="background-color:rgb(248, 248, 197);margin-top:-1.2%">
                        <div class={selectedClass} style="height:110px">
                            <img style="max-height: 70px; max-width: 70px;position:absolute;left:3%"
                                data-name="Facility" title="Facility" alt="Facility" name="Facility" src={facility}
                                onclick={navigateToFacilityPage} />
                        </div>
                        <div class={clientClass} style="height:110px">
                            <img style="max-height: 70px; max-width: 70px;position:absolute;left:3%;"
                                data-name="Clients" title="Clients" alt="Clients" name="Clients" src={client}
                                onclick={navigateToFacilityPage} />
                        </div>
                        <div class={staffClass} style="height:110px">
                            <img style="max-height: 70px; max-width: 70px;position:absolute;left:3%" data-name="Staff"
                                title="Staff" alt="Staff" name="Staff" src={employee}
                                onclick={navigateToFacilityPage} />
                        </div>
                        <div class={accountClass} style="height:110px">
                            <img style="max-height: 70px; max-width: 70px;position:absolute;left:3%"
                                data-name="Accounts" title="Accounts" alt="Accounts" name="Accounts" src={repository}
                                onclick={navigateToFacilityPage} />
                        </div>
                    </div>


                    <div class="slds-size_7-of-8">
                      <c-org-lwc ongetsearchvalue={handleSearchValue}></c-org-lwc>
                        <template if:true={isFacilityButton}>
                            <div class="slds-border_top" style="margin-left:5%">
                                <c-facility-data-with-pagination
                                    selected-name={searchValue}></c-facility-data-with-pagination>
                            </div>
                        </template>
                        <template if:true={isClientButton}>
                            <div class="slds-border_top" style="margin-left:5%">
                                <c-client-data-with-pagination
                                    selected-name={searchValue}></c-client-data-with-pagination>
                            </div>
                        </template>
                        <template if:true={isStaffButton}>
                            <div class="slds-border_top" style="margin-left:5%">
                                <c-staff-data-with-pagination
                                    selected-name={searchValue}></c-staff-data-with-pagination>
                            </div>
                        </template>
                        <template if:true={isManageSubscriptionButton}>
                            <div class="slds-grid  slds-m-left_large slds-border_top"
                                style="padding-top: 0.5em; font-size:15px;margin-left:5%">
                                <b style="color: Red"><I> Working on this page</I> </b>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
        <div if:true={isMobile}>
            <div class="slds-grid slds-wrap" style="background-color:rgb(248, 248, 197);">
                <span class="slds-size_1-of-4">
                    <div class={selectedClass} style="height:90px">
                        <img style="max-height: 50px; max-width: 50px;position:absolute;" data-name="Facility"
                            title="Facility" alt="Facility" name="Facility" src={facility}
                            onclick={navigateToFacilityPage} />
                    </div>
                </span>
                <span class="slds-size_1-of-4">
                    <div class={clientClass} style="height:90px">
                        <img style="max-height: 50px; max-width: 50px;position:absolute;" data-name="Clients"
                            title="Clients" alt="Clients" name="Clients" src={client}
                            onclick={navigateToFacilityPage} />
                    </div>
                </span>
                <span class="slds-size_1-of-4">
                    <div class={staffClass} style="height:90px">
                        <img style="max-height: 50px; max-width: 50px;position:absolute;" data-name="Staff"
                            title="Staff" alt="Staff" name="Staff" src={employee} onclick={navigateToFacilityPage} />
                    </div>
                </span>
                <span class="slds-size_1-of-4">
                    <div class={accountClass} style="height:90px">
                        <img style="max-height: 50px; max-width: 50px;position:absolute;" data-name="Accounts"
                            title="Accounts" alt="Accounts" name="Accounts" src={repository}
                            onclick={navigateToFacilityPage} />
                    </div>
                </span>
            </div>
            <div class="slds-grid slds-wrap">
                <div class="slds-size_1-of-1">
                    <c-org-lwc ongetsearchvalue={handleSearchValue}></c-org-lwc>
                </div>
                <div class="slds-size_1-of-1">
                    <template if:true={isFacilityButton}>
                        <div class="slds-border_top">
                            <c-facility-data-with-pagination
                                selected-name={searchValue}></c-facility-data-with-pagination>
                        </div>
                    </template>
                    <template if:true={isClientButton}>
                        <div class="slds-border_top">
                            <c-client-data-with-pagination selected-name={searchValue}></c-client-data-with-pagination>
                        </div>
                    </template>
                    <template if:true={isStaffButton}>
                        <div class="slds-border_top">
                            <c-staff-data-with-pagination selected-name={searchValue}></c-staff-data-with-pagination>
                        </div>
                    </template>
                    <template if:true={isManageSubscriptionButton}>
                        <div class="slds-grid  slds-m-left_large slds-border_top"
                            style="padding-top: 0.5em; font-size:15px;margin-left:5%">
                            <b style="color: Red"><I> Working on this page</I> </b>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        <c-footer-lwc></c-footer-lwc>
    </lightning-card>
</template>
