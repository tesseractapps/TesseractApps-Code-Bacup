<template>
    <template lwc:if={shouldRenderComponent}>
        <div class="upload-container">
            <input
                type="file"
                multiple={allowMultiple}
                accept={acceptedFormats}
                onchange={handleFileSelection}
                class="hidden-input"
                data-id="fileInput" />

            <div class={uploadBoxClass}
                 onclick={openFileDialog}
                 ondragover={handleDragOver}
                 ondragleave={handleDragLeave}
                 ondrop={handleDrop}>
                <div class="upload-content">
                    <p class="upload-text">Click to Upload or Drag & Drop</p>
                    <p class="upload-subtext">Supported: {formattedFormats}</p>
                    <template lwc:if={maxFileSize}>
                        <p class="upload-subtext size-text">Max Size: {formattedMaxSize}</p>
                    </template>
                </div>
            </div>

            <!-- Upload progress list -->
            <template lwc:if={uploadFileList.length}>
                <div class="file-list">
                    <template for:each={uploadFileList} for:item="item">
                        <div key={item.name} class="file-item">
                            <span class="file-name">{item.name}</span>
                            <div class="progress-bar-container">
                                <div class="progress-bar" style={item.progressStyle}></div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </template>
</template>
