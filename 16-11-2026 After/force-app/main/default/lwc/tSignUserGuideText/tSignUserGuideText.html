<template>
  <template for:each={segments} for:item="s">
    <template lwc:if={s.bold}><strong key={s.key} class="b">{s.text}</strong></template>
    <template lwc:elseif={s.isLink}><a key={s.key} href="#" class="a" data-href={s.href} onclick={handleClick}>{s.text}</a></template>
    <template lwc:else><span key={s.key}>{s.text}</span></template>
  </template>
</template>
