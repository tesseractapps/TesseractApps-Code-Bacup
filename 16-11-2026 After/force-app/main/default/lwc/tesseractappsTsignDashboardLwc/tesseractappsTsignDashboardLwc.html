                  width: 16.5rem;
                  display: flex;

                        variant="label-hidden"

                        onchange={handleFacilitySearch}>
                    </lightning-input>
                </div>

                    role="presentation"
                  >

                        role="menuitem"

                        data-facility-label={facility.label}
                        data-facility-preferred-name={facility.facilityPreferredName}
                        data-participant-preferred-name={facility.participantPreferredName}
                        data-staff-preferred-name={facility.staffPreferredName}
                        onclick={handleFacilitySelect}
                        disabled={facility.disabled}
                    >
                        <div class="facility-label">{facility.label}</div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>

        </template>

        </template>

        </template>

        </template>

                <h2 class="slds-text-heading_medium">What's New?</h2>
                <br />
                <h2><strong>v1.26.1</strong></h2>
                <h2><strong>Product Overview</strong></h2>

                <p class="slds-m-top_large">
                    T sign is an electronic signature application designed to simplify and streamline document signing and management. It provides a centralised platform for organisations to manage documents, templates, users, contacts, and electronic signatures securely and efficiently.
                </p><br/>
                <h2><strong>Modules and Features</strong></h2>

                <ul class="slds-list_dotted slds-m-top_large" style="list-style: disc; padding-left: 1.25rem;">

                    <!-- 1. Folders -->
                    <li>
                        <strong>1. Folders</strong>
                        <p>The Folders module provides a centralised location for managing and accessing documents organised into folders.</p>
                        <ul style="list-style: circle; padding-left: 1.25rem;">
                            <li>View and manage documents organised within folders.</li>
                            <li>Provides Organisation Administrators (Org Admins) with access to all documents across the organisation.</li>
                            <li>Simplifies document organisation and accessibility.</li>
                        </ul>
                    </li>

                    <br/>

                    <!-- 2. My Organisation -->
                    <li>
                        <strong>2. My Organisation</strong>
                        <p>The My Organisation module enables organisation-level administration and management.</p>
                        <p>It consists of the following sections:</p>
                        <ul style="list-style: circle; padding-left: 1.25rem;">
                            <li><strong>Organisation Management:</strong> Manage organisation-related information and details.</li>
                            <li><strong>Facilities Management:</strong> Manage facilities associated with the organisation.</li>
                            <li><strong>User Management:</strong> Create, manage, and maintain users within the organisation.</li>
                        </ul>
                    </li>

                    <br/>

                    <!-- 3. My Profile -->
                    <li>
                        <strong>3. My Profile</strong>
                        <p>The My Profile module allows users to manage their personal account information and electronic signature details.</p>
                        <ul style="list-style: circle; padding-left: 1.25rem;">
                            <li><strong>My Profile:</strong> View and manage personal profile information.</li>
                            <li><strong>My Signature:</strong> Create and manage electronic signatures for document signing.</li>
                        </ul>
                    </li>

                    <br/>

                    <!-- 4. Templates -->
                    <li>
                        <strong>4. Templates</strong>
                        <p>The Templates module provides access to document and template management functionalities.</p>
                        <ul style="list-style: circle; padding-left: 1.25rem;">
                            <li><strong>All Documents:</strong> Access and manage documents available within T sign.</li>
                            <li><strong>Templates:</strong> Create, view, and manage reusable document templates to simplify the document preparation and signing process.</li>
                        </ul>
                    </li>

                    <br/>

                    <!-- 5. Contacts -->
                    <li>
                        <strong>5. Contacts</strong>
                        <p>The Contacts module enables users to maintain and manage their contact information.</p>
                        <ul style="list-style: circle; padding-left: 1.25rem;">
                            <li>Create new contacts.</li>
                            <li>Edit existing contact details.</li>
                            <li>Archive contacts that are no longer actively required.</li>
                        </ul>
                    </li>

                    <br/>

                    <!-- 6. Reports -->
                    <li>
                        <strong>6. Reports</strong>
                        <p>The Reports module provides access to T sign reporting data.</p>
                        <ul style="list-style: circle; padding-left: 1.25rem;">
                            <li>View reports containing relevant T sign data.</li>
                            <li>Access information to monitor document and signing activities.</li>
                        </ul>
                    </li>

                    <br/>

                    <!-- 7. Plan Upgrade -->
                    <li>
                        <strong>7. Plan Upgrade</strong>
                        <p>The Plan Upgrade module allows users and organisations to upgrade their subscription plans based on their requirements.</p>
                        <ul style="list-style: circle; padding-left: 1.25rem;">
                            <li><strong>Individual to Business Upgrade:</strong> Individual users can upgrade their existing subscription to a Business plan to access additional organisation-level features and benefits.</li>
                            <li><strong>Monthly to Yearly Upgrade:</strong> Business users can upgrade their subscription from a monthly plan to a yearly plan.</li>
                            <li><strong>Business Plan Benefits:</strong> Business subscriptions provide organisation management capabilities and additional business-specific features.</li>
                        </ul>
                    </li>

                </ul>
                <br/>

              </div>
            </div>

  <template if:true={showNotifications}>
  <div class="table-options custom-scroll" data-id="notification-container">
    
    <!-- ✅ Heading and Action -->
    <div class="slds-p-around_x-small slds-grid slds-grid_align-spread" style="padding: 0.8rem">
      <p style="font-size: 1.25rem; font-weight:600">Notifications</p>
      <a href="javascript:void(0);" onclick={handleMarkAllAsRead} class="slds-text-link slds-text-body_small">
        Mark all as read
      </a>
    </div>

    <!-- ✅ Search Bar -->
    <div class="slds-p-horizontal_x-small slds-p-bottom_x-small" style="padding: 0 0.8rem 0.6rem">
      <div class="slds-input-has-icon slds-input-has-icon_left" style="width:100%">
        <lightning-icon
          icon-name="utility:search"
          size="x-small"
          class="slds-input__icon slds-input__icon_left"
        ></lightning-icon>
        <input
          type="search"
          class="slds-input"
          placeholder="Search Notifications"
          value={notificationSearchTerm}
          oninput={handleNotificationSearch}
          onclick={stopPropagationHandler}
        />
      </div>
    </div>

    <!-- ✅ No Results -->
    <template if:true={notificationSearchTerm}>
      <template if:false={filterednotification.length}>
        <p class="slds-text-align_center slds-text-color_weak slds-p-around_small">No notifications found.</p>
      </template>
    </template>

    <!-- ✅ Notification List -->
    <ul class="slds-dropdown__list" role="listbox" style="text-align: left">
      <template for:each={filterednotification} for:item="opt">
        <!-- <li
          key={opt.value}
          class="slds-dropdown__item dropdown-option"
          data-field="notification"
          data-value={opt.value}
          data-label={opt.label}
          onclick={handleDropdownSelect}
          role="option"
        >  -->
          <template if:true={opt.checknotifications}>
                    <li
          key={opt.value}
          class="slds-dropdown__item dropdown-option"
          data-field="notification"
          data-value={opt.value}
          data-label={opt.label}
          onclick={handleDropdownSelect}
          role="option"
        > 
            <div 
              data-name={opt.label}
              data-id={opt.value}
              data-record-id={opt.recordId}
              data-description={opt.description}              
              onclick={handleNavigation}
              class="slds-truncate"
            >
              <div style="display: flex; justify-content: space-between">
              <p style="font-weight: 500; font-size: 12px">{opt.label}</p>
              <p class="slds-text-color_weak slds-text-body_small">
                {opt.timestamp}
              </p>
              </div>
              <p class="slds-text-body_small force-wrap">{opt.description}</p>
            </div>
                    </li>
          </template>
          <template if:false={opt.checknotifications}>
                                <li
          key={opt.value}
          class="slds-dropdown__item dropdown-option"
          data-field="notification"
          data-value={opt.value}
          data-label={opt.label}
          onclick={handleDropdownSelect}
          role="option"
        > 
            <div
              data-name={opt.label}
              data-id={opt.value}
              data-record-id={opt.recordId}
              data-description={opt.description}              
              data-notificationread={opt.checknotifications}
              data-client-id={opt.clientId}
              data-staff-id={opt.staffId}
              onclick={handleNavigation}
              class="slds-truncate"
            >
              <div style="display: flex; justify-content: space-between;">
              <p style="font-weight: 500; font-size: 12px; color: #0099de">{opt.label}</p>
              <p class="slds-text-color_weak slds-text-body_small">
                {opt.timestamp}
              </p>
              </div>
              <p class="slds-text-body_small force-wrap">{opt.description}</p>
            </div>
            </li>
          </template>
        <!-- </li> -->
      </template>
    </ul>
  </div>
</template>
