<template>
    <template if:false={isCreateUser}>
        <div class="menu-container">
            <div class={detailsClass} onclick={handleOrganisationDetails}>
                Organisation Details
            </div>
            <div class={facilityClass} onclick={handleFacility}>
                Facilities
            </div>
            <div class={UserManagementClass} onclick={handleUserManagement}>
                User Management
            </div>
            <template if:true={isUserManagement}>
                <div style="margin-left: auto; margin-right: 0.5%;">
                    <!-- <lightning-button 
                        label="Bulk Upload" 
                        variant="brand" 
                        onclick={handleBulkCreateUser} 
                        class="slds-m-right_small">
                    </lightning-button> -->

                    <lightning-button 
                        label="Create User" 
                        variant="brand" 
                        onclick={handleCreateUser} 
                        title="Create"
                        class="slds-m-right_small">
                    </lightning-button>
                </div>
            </template>
             <template if:true={isOrgDetails}>
                <div style="margin-left: auto; margin-right: 1.5%;">
                    <lightning-button
                        label="Edit"
                        variant="brand"
                        onclick={handleEditOrganisation}>
                    </lightning-button>
                </div>
            </template>
            <template if:true={isfacility}>
                <div style="margin-left: auto; margin-right: 1.5%;">
                    <lightning-button
                        label="Create Facility"
                        variant="brand"
                        onclick={handleCreateFacility}>
                    </lightning-button>
                </div>
            </template>
        </div>
    </template>

    <template if:true={isOrgDetails}>
       <!--  <c-tesseract-apps-user-access-lwc></c-tesseract-apps-user-access-lwc> -->
        <c-t-sign-organisation-lwc onrefreshorgdata={handleRefreshOrgData}></c-t-sign-organisation-lwc>
    </template>

    <template if:true={isfacility}>
      <!--   <c-tesseract-apps-staff-management-lwc></c-tesseract-apps-staff-management-lwc> -->
         <c-t-sign-facility-lwc onrefreshfacilitydropdown={handleRefreshDashboard}></c-t-sign-facility-lwc>
    </template>

    <template if:true={isUserManagement}>
        <c-tesseract-apps-tsign-user-managment ></c-tesseract-apps-tsign-user-managment>
    </template>

    <template if:true={isCreateUser}>
        <c-tsign-create-user-lwc onback={handleCreateUserBack}></c-tsign-create-user-lwc>
    </template>
</template>
