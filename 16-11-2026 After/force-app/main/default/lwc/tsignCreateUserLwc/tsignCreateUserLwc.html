<template>
    <div class="create-user-container">

        <!-- Header with Back button -->
        <header class="page-header">
            <h2 class="page-title">Create User</h2>
            <lightning-button
                label="Back"
                variant="brand"
                onclick={handleBack}>
            </lightning-button>
        </header>

        <!-- Form (scrolls; header and buttons stay put) -->
        <div class="page-body custom-scroll">
            <div class="form-grid">
                <!-- First Name -->

                
                <div class="floating-label">
                    <span class="label-text-drop"><span class="required-mark">*</span>First Name</span>
                    <lightning-input label="First Name" variant="label-hidden" value={firstName} disabled={disableMode}
                        onchange={handleFieldChange} data-field="firstName" required></lightning-input>
                </div>

                <!-- Last Name -->
                <div class="floating-label">
                    <span class="label-text-drop"><span class="required-mark">*</span>Last Name</span>
                    <lightning-input label="Last Name" variant="label-hidden" value={lastName} disabled={disableMode}
                        onchange={handleFieldChange} data-field="lastName" required></lightning-input>
                </div>

                <!-- Contact Number -->
                <div class="floating-label">
                    <span class="label-text-drop"><span class="required-mark">*</span>Contact Number</span>
                    <lightning-input label="Phone Number" variant="label-hidden" type="tel" value={phoneNumber} disabled={disableMode}
                        onchange={PhonenumberChange}  required></lightning-input>
                </div>

                <!-- Email ID -->
                <div class="floating-label">
                    <span class="label-text-drop"><span class="required-mark">*</span>Email ID</span>
                    <lightning-input label="Email Address" variant="label-hidden" type="email" value={email} disabled={disableMode}
                        onchange={handleFieldChange} data-field="email" required></lightning-input>
                </div>

                <!-- User Type -->
                <div class="floating-label">
                    <span class="label-text-drop"><span class="required-mark">*</span>User Type</span>
                    <lightning-combobox label="User Type" variant="label-hidden" value={selectedUserType} disabled={disableMode}
                        options={filteredUserTypeValues} onchange={handleUserTypeChange}
                        required></lightning-combobox>
                </div>

                <!-- Facility -->
                <div class="floating-label">
                    <span class="label-text-drop"><span class="required-mark">*</span>Facility</span>
                    <lightning-combobox label="Facility" variant="label-hidden" value={selectedFacility} disabled={disableMode}
                        options={filteredFacilityValues} onchange={handleFacilityChange}
                        required></lightning-combobox>
                </div>
                <!-- Profile Picture -->
                <template if:true={orgId}>
                 <!-- Profile Picture -->
                        <c-t-signaws-batch-lwc
                            is-used-for-profile-pic 
                            module-name="MyProfilePic"
                            organisation-id={orgId}
                            onuploadsuccess={handleUplodadProfilePic}
                        >
                        </c-t-signaws-batch-lwc> 
                </template>
            </div>
            <div>
               
              
                 
            </div>
           
            

            <!-- Profile Picture: "Change Profile Picture" button (your current version) -->
           <!--    <div class="upload-field">
              <input type="file" accept="image/png, image/jpeg, image/jpg" onchange={handleFileSelect} style="display:none;" class="hidden-profile-input" />
                <lightning-button
                    label="Change Profile Picture"
                    icon-name="utility:upload"
                    onclick={triggerFileInput}
                    disabled={isUploading}
                    stretch
                    class="full-width-button">
                </lightning-button>
                <template if:true={isattachError}>
                    <p class="form-error">File Size Cannot exceed 50MB</p>
                </template>
            </div> -->
           <!--  <template if:true={isFileExpand}>
                <div class="upload-service">
                    <c-document-office-service
                        record-id={selectedRecordId}
                        module-path-from-parent="ticket"
                        allow-multiple="false"
                        onuploadcomplete={handleAwsUploadComplete}
                        onfiledeleted={handleFileDeleted}>
                    </c-document-office-service>
                </div>
            </template> -->

            <!-- Address Section -->
            <div class="form-full">
                <template if:true={errorMessage}>
                    <p class="form-error">{errorMessage}</p>
                </template>
                <c-t-sign-address-selector
                    address={childAddress}
                    onaddresschange={addressInputChange}>
                </c-t-sign-address-selector>
            </div>

            <template if:true={isLoading}>
                <div class="slds-spinner_container custom-spinner-container">
                    <div role="status" class="slds-spinner slds-spinner_large slds-is-relative">
                        <span class="slds-assistive-text">Loading</span>
                        <div class="slds-spinner__dot-a"></div>
                        <div class="slds-spinner__dot-b"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Actions -->
        <footer class="page-footer">
            <lightning-button label="Cancel" variant="neutral" onclick={handleBack}></lightning-button>
            <lightning-button label="Save" variant="brand" onclick={handleSave}></lightning-button>
        </footer>
    </div>
</template>
