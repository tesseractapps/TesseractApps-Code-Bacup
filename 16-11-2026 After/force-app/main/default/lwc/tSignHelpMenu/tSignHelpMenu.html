<template>
  <div class="help" onkeydown={handleKeydown}>
    <button type="button" class="help-btn" aria-haspopup="menu" aria-expanded={ariaExpanded} onclick={handleToggle}>
      <span class="ms help-icon" aria-hidden="true">help</span>
      <span class="help-label">Help</span>
      <span class="ms help-chevron" aria-hidden="true">{chevronIcon}</span>
    </button>

    <template lwc:if={isOpen}>
      <div class="help-backdrop" onclick={handleClose}></div>
      <div class="help-menu" role="menu" aria-label="Help">
        <p class="help-eyebrow">Help</p>
        <template lwc:if={hasUserGuide}>
          <button type="button" role="menuitem" class="help-item" onclick={handleUserGuide}>
            <span class="ms help-item-icon" aria-hidden="true">menu_book</span>
            <span class="help-item-text">
              <span class="help-item-title">User Guide</span>
              <span class="help-item-sub">Step-by-step help for every T sign feature</span>
            </span>
          </button>
        </template>
        <button type="button" role="menuitem" class="help-item" onclick={handleTour}>
          <span class="ms help-item-icon" aria-hidden="true">tour</span>
          <span class="help-item-text">
            <span class="help-item-title">Take the guided tour</span>
            <span class="help-item-sub">A short walk-through of T sign</span>
          </span>
        </button>
        <button type="button" role="menuitem" class="help-item" onclick={handleSupport}>
          <span class="ms help-item-icon" aria-hidden="true">support_agent</span>
          <span class="help-item-text">
            <span class="help-item-title">Contact support</span>
            <span class="help-item-sub">Raise a ticket with our support team</span>
          </span>
        </button>
      </div>
    </template>
  </div>
</template>
