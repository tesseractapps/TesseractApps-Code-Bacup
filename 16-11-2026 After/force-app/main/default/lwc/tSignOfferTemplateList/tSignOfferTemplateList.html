<template>
    <template if:true={imageSrc}>
        <div class={hamburgerClass} style={hamburgerStyle} onclick={toggleSidebar}>
            <i class="material-icons">
                {hamburgerIcon}
            </i>
        </div>

        <div class={sidebarClass}>

            <div class="thumbnail-sidebar custom-scroll">
                <!-- OLD UI START (H4: thumbnails loop)
        <template for:each={thumbnails} for:item="thumb">
            <div 
                key={thumb.page}
                class={thumb.className}
                data-page={thumb.page}
                onclick={handleThumbnailClick}
            >
                <img src={thumb.src} />
                <div class="page-label">Page {thumb.page}</div>
            </div>
        </template>
        OLD UI END (H4) -->
                <!-- NEW UI (H4): pages rail with a fields-left pill per page -->
                <div class="ui-rail-head">PAGES <span class="ui-rail-count">{totalPages}</span></div>
                <template for:each={uiThumbnails} for:item="thumb">
                    <div key={thumb.page} class={thumb.className} data-page={thumb.page} onclick={handleThumbnailClick}>
                        <img src={thumb.src} alt="" crossorigin="anonymous" data-page={thumb.page} data-thumb="true"
                            onload={handleThumbnailImageLoad} onerror={handleThumbnailImageError} loading="lazy"
                            decoding="async" />
                        <div class="page-label">
                            <span class="ui-thumb-page">Page {thumb.page}</span>
                            <span class={thumb.uiPillClass}>{thumb.uiLeftText}</span>
                        </div>
                    </div>
                </template>
            </div>

        </div>
    </template>
    <!-- OLD UI START (H1: root lightning-card)
    <lightning-card class="custom-card" icon-name="utility:document">
    OLD UI END (H1) -->
    <!-- NEW UI (H1): plain wrapper so the signing page can use the full width -->
    <div class="custom-card ui-app">
        <!-- OLD UI START (H2: logo section)
        <!~~ Logo Section ~~>
        <div class="logo-container">
            <img src={logo} alt="Te_sign Logo" width="300px" height="300px" />
        </div>
        OLD UI END (H2) -->
        <!-- NEW UI (H2): header bar -->
        <header class="ui-header">
            <div class="ui-header-brand">
                <img src={logo} alt="Te_sign Logo" class="ui-header-logo" />
            </div>
            <template if:true={imageSrc}>
                <div class="ui-header-divider"></div>
                <div class="ui-header-doc">
                    <!-- OLD UI: <div class="ui-header-doc-title">Your document</div> -->
                    <div class="ui-header-doc-title" title={uiDocumentTitle}>{uiDocumentTitle}</div>
                    <div class="ui-header-doc-meta">{totalPages} pages · {uiRequiredLeftText}</div>
                </div>
                <div class="ui-progress">
                    <div class="ui-progress-top">
                        <span class="ui-progress-text">{uiProgressText}</span>
                        <span class="ui-progress-pct">{uiProgressPercent}%</span>
                    </div>
                    <div class="ui-progress-track">
                        <div class="ui-progress-fill" style={uiProgressBarStyle}></div>
                    </div>
                </div>
                <div class="ui-header-actions">
                    <button type="button" class="ui-btn ui-btn--secondary ui-header-ask"
                        onclick={openConversationModal}>
                        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path>
                        </svg>
                        <span>Ask a question</span>
                    </button>
                    <!-- NEW UI (H3): the Proceed button now lives here; same class and handler -->
                    <!-- OLD CODE (commented out): always enabled
                    <button class="preview-confirmation-preview-button ui-btn ui-btn--primary"
                        onclick={handlePreviewClick}>
                    -->
                    <!-- NEW CODE: disabled until every required field is filled -->
                    <button class="preview-confirmation-preview-button ui-btn ui-btn--primary"
                        onclick={handlePreviewClick} disabled={isReviewSubmitDisabled}>
                        <span>Review &amp; submit</span>
                        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 12h14M13 6l6 6-6 6"></path>
                        </svg>
                    </button>
                </div>
            </template>
        </header>

        <!-- Loading Animation -->
        <template if:true={isLoading}>
            <div class="loading-animation">
                <div class="spinner"></div>
                <!-- OLD UI START (H19: loading text)
                <p>Loading Document, please wait...</p>
                OLD UI END (H19) -->
                <p class="ui-loading-title">Opening your document</p>
                <p class="ui-loading-sub">This only takes a few seconds.</p>
            </div>
        </template>

        <template if:true={isLoadingpop}>
            <div class="load-overlay">
                <div class="load-content">
                    <div class="loading-animation">
                        <div class="spinner"></div>
                        <!-- OLD UI START (H19: loading overlay text)
                        <p>Loading Document, please wait...</p>
                        OLD UI END (H19) -->
                        <p class="ui-loading-title">Opening your document</p>
                        <p class="ui-loading-sub">This only takes a few seconds.</p>
                    </div>
                </div>
            </div>
        </template>




        <!-- PDF Viewer Section -->
        <template if:true={imageSrc}>
            <!-- NEW UI (H5): workspace = stage (viewer + page bar) + fields panel -->
            <div class="ui-workspace">
                <div class="ui-stage">
                    <div class="pdf-viewer-container">
                        <template if:true={hasPages}>
                            <!-- OLD UI START (H6: pages loop)
                    <template for:each={renderedPages} for:item="page">
                    OLD UI END (H6) -->
                            <!-- NEW UI (H6): same pages, plus a status class and label per field -->
                            <template for:each={uiRenderedPages} for:item="page">
                                <div key={page.pageNumber} class="image-container" data-page-number={page.pageNumber}
                                    style={page.containerStyle}>
                                    <!-- FIELD GUIDE TAB FOR SIGNER -->
                                    <template if:true={page.isGuidePage}>
                                        <div class="fg-tab-wrapper" style={guideTabStyle} data-fg="tab"
                                            onclick={handleGuideWrapperClick}>
                                            <template if:true={showPrevButton}>
                                                <button class="fg-prev-btn" onclick={handleGuidePrev}
                                                    aria-label="Previous field" title="Previous field" data-fg="tab">
                                                    <svg class="fg-prev-icon" viewBox="0 0 24 24" fill="none"
                                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                                        stroke-linejoin="round" data-fg="tab">
                                                        <polyline points="18 15 12 9 6 15" data-fg="tab"></polyline>
                                                    </svg>
                                                </button>
                                            </template>
                                            <!-- OLD CODE (commented out)
                                            <button class={guideTabClass} onclick={handleGuideClick}
                                                aria-label={guideAriaLabel} title={guideTitle} data-fg="tab">
                                            -->
                                            <!-- NEW CODE: disabled when no fields are left -->
                                            <button class={guideTabClass} onclick={handleGuideClick}
                                                aria-label={guideAriaLabel} title={guideTitle} data-fg="tab"
                                                disabled={isGuideNextDisabled}>
                                                <template if:false={isGuideCompact}>
                                                    <span class="fg-tab-label" data-fg="tab">{guideLabel}</span>
                                                </template>
                                                <template if:true={isGuideCompact}>
                                                    <svg class="fg-arrow-icon" viewBox="0 0 24 24" fill="currentColor"
                                                        data-fg="tab">
                                                        <path d="M8 5v14l11-7z" data-fg="tab" />
                                                    </svg>
                                                </template>
                                            </button>
                                            <!-- NEW UI (H7): "5 of 7" counter under the guide tab -->
                                            <template if:true={uiHasGuideCounter}>
                                                <span class="ui-guide-counter" data-fg="tab">{uiGuideCounterText}</span>
                                            </template>
                                        </div>
                                    </template>

                                    <img src={page.imageSrc} alt={page.pageLabel} class="pdf-image"
                                        crossorigin="anonymous" data-page={page.pageNumber}
                                        data-page-number={page.pageNumber} onload={handlePageImageLoad}
                                        onerror={handlePageImageError} loading="lazy" decoding="async" />
                                    <div class="page-number-label">{page.pageLabel}</div>
                                    <template for:each={page.placeholders} for:item="placeholder">
                                        <!-- OLD UI START (H6: field container opening tag)
                                <div
                                    key={placeholder.id}
                                    class="placeholder-container"
                                    style={placeholder.style}
                                    data-id={placeholder.id}
                                    data-type={placeholder.type}
                                    data-page-number={page.pageNumber}
                                >
                                OLD UI END (H6) -->
                                        <!-- NEW UI (H6): same element and data attributes; class now carries the field state -->
                                        <div key={placeholder.id} class={placeholder.uiContainerClass}
                                            style={placeholder.style} data-id={placeholder.id}
                                            data-type={placeholder.type} data-page-number={page.pageNumber}>
                                            <!-- <span class="ui-field-label">{placeholder.uiLabel}</span> -->
                                            <!-- NEW CODE: red * on required fields until filled -->
                                            <template if:true={placeholder.uiShowRequiredStar}>
                                                <span class={placeholder.uiRequiredStarClass} title="Required"
                                                    aria-label="Required">*</span>
                                            </template>
                                            <!-- FirstName Placeholder -->
                                            <template if:true={placeholder.isName}>
                                                <div class="name-placeholder text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" onclick={handleEditPlaceholder}
                                                            data-id={placeholder.id} title="Edit">
                                                            <lightning-icon icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit"
                                                                onclick={handleEditOrg} size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <!-- Input Field -->
                                                        <input type="text" class="placeholder-input"
                                                            placeholder="First Name" value={placeholder.value}
                                                            oninput={handleFNameInputChange} data-id={placeholder.id}
                                                            aria-label="Enter Name" style={placeholder.inputStyle} />
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Last Name -->
                                            <template if:true={placeholder.isLastName}>
                                                <div class="name-placeholder text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <input type="text" class="placeholder-input"
                                                            placeholder="Last Name" value={placeholder.value}
                                                            oninput={handleLNameInputChange} data-id={placeholder.id}
                                                            style={placeholder.inputStyle} />
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Initials -->
                                            <template if:true={placeholder.isInitials}>
                                                <div class="text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <select class="placeholder-dropdown initials-dropdown"
                                                            onchange={handleInitialsInputChange}
                                                            data-id={placeholder.id} aria-label="Select Title">
                                                            <option value="">Title</option>
                                                            <option value="Mr">Mr</option>
                                                            <option value="Mrs">Mrs</option>
                                                            <option value="Miss">Miss</option>
                                                            <option value="Dr">Dr</option>
                                                        </select>
                                                    </template>


                                                </div>
                                            </template>

                                            <!-- NameInitials -->
                                            <template if:true={placeholder.isNameInitials}>
                                                <div class="text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <input type="text" class="placeholder-input"
                                                            placeholder="Initials" maxlength="60"
                                                            title="Type your initials (e.g. SV) or your full name (e.g. Surya Vamsi)"
                                                            aria-label="Initials: type your initials or full name"
                                                            value={placeholder.initialsSource}
                                                            oninput={handleNameInitialsInputChange}
                                                            onblur={handleNameInitialsChange}
                                                            onkeydown={handleNameInitialsKeyDown}
                                                            data-id={placeholder.id} style={placeholder.inputStyle} />
                                                    </template>
                                                </div>
                                            </template>
                                            <!-- Full Name -->
                                            <template if:true={placeholder.isFullName}>
                                                <div class="text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <input type="text" class="placeholder-input"
                                                            placeholder="Full Name" value={placeholder.value}
                                                            oninput={handleFullNameInputChange} data-id={placeholder.id}
                                                            style={placeholder.inputStyle} />
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Email -->
                                            <template if:true={placeholder.isEmail}>
                                                <div class="text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <input type="email" class="placeholder-input"
                                                            placeholder="Email" value={placeholder.value}
                                                            oninput={handleEmailInputChange} data-id={placeholder.id}
                                                            style={placeholder.inputStyle} />
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Contact Number -->
                                            <template if:true={placeholder.isContactNumber}>
                                                <div class="text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <input type="tel" inputmode="numeric" pattern="[0-9]*"
                                                            onkeypress={allowOnlyNumbers} class="placeholder-input"
                                                            placeholder="Contact Number" value={placeholder.value}
                                                            oninput={handlePhoneInputChange} data-id={placeholder.id}
                                                            style={placeholder.inputStyle} />
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Address -->
                                            <template if:true={placeholder.isAddress}>
                                                <div class="text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <textarea class="placeholder-input" placeholder="Address"
                                                            value={placeholder.value} oninput={handleAddressInputChange}
                                                            data-id={placeholder.id}
                                                            style={placeholder.inputStyle}></textarea>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- ABN -->
                                            <template if:true={placeholder.isABN}>
                                                <div class="text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;"></lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>

                                                    <template if:false={placeholder.hasImage}>
                                                        <input type="text" class="placeholder-input" placeholder="ABN"
                                                            value={placeholder.value} oninput={handleAbnInputChange}
                                                            data-id={placeholder.id} inputmode="numeric"
                                                            pattern="\d{11}" maxlength="11" aria-label="Enter ABN"
                                                            style={placeholder.inputStyle} />
                                                    </template>
                                                </div>
                                            </template>


                                            <!-- Date -->
                                            <template if:true={placeholder.isDate}>
                                                <div class="text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <input type="date" class="placeholder-input"
                                                            value={placeholder.value} oninput={handleDateInputChange}
                                                            data-id={placeholder.id} style={placeholder.inputStyle} />

                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Date of Signing: auto-filled with today's date, read-only (no edit icon, no date picker) -->
                                            <template if:true={placeholder.isDateOfSigning}>
                                                <div class="text-placeholder-wrapper">
                                                    <div style={placeholder.textStyleCss} class="rendered-native-text"
                                                        data-id={placeholder.id}>
                                                        {placeholder.displayValue}
                                                    </div>
                                                </div>
                                            </template>
                                            <!-- OLD CODE START (Date of Signing: editable picker + edit icon)
                                            <template if:true={placeholder.isDateOfSigning}>
                                                <div class="text-placeholder-wrapper">
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class="edit-icon" title="Edit">
                                                            <lightning-icon onclick={handleEditPlaceholder}
                                                                data-id={placeholder.id} icon-name="action:edit"
                                                                alternative-text="Edit" title="Edit" size="xx-small"
                                                                style="cursor:pointer;color:white;background:#0099DE;">
                                                            </lightning-icon>
                                                        </div>
                                                        <div style={placeholder.textStyleCss}
                                                            class="rendered-native-text" data-id={placeholder.id}>
                                                            {placeholder.displayValue}
                                                        </div>
                                                    </template>
                                                    <template if:false={placeholder.hasImage}>
                                                        <input type="date" class="placeholder-input"
                                                            value={placeholder.value}
                                                            oninput={handleDateOfSigningInputChange}
                                                            data-id={placeholder.id} style={placeholder.inputStyle} />
                                                    </template>
                                                </div>
                                            </template>
                                            OLD CODE END (Date of Signing) -->





                                            <!-- Signature Placeholder -->
                                            <template if:true={placeholder.isSignature}>
                                                <div class="signature-placeholder">
                                                    <!-- If the image is uploaded -->
                                                    <template if:true={placeholder.hasImage}>
                                                        <div class={signatureImageContainerClass}>
                                                            <img src={placeholder.imageSrc} alt="Uploaded Signature"
                                                                class="signature-image" />
                                                            <!-- Edit / Delete toolbar (Google Material icons) inside the box on hover -->
                                                            <div class="signature-review-actions">
                                                                <button type="button"
                                                                    class="signature-review-btn signature-review-edit"
                                                                    title="Edit Signature" aria-label="Edit Signature"
                                                                    data-id={placeholder.id}
                                                                    onclick={handleUploadSignature}>
                                                                    <svg class="signature-review-icon"
                                                                        viewBox="0 0 24 24" aria-hidden="true">
                                                                        <path
                                                                            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM5.92 19H5v-.92l9.06-9.06.92.92L5.92 19zM20.71 5.63l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83a1 1 0 0 0 0-1.41z">
                                                                        </path>
                                                                    </svg>
                                                                </button>
                                                                <span class="signature-review-sep"></span>
                                                                <button type="button"
                                                                    class="signature-review-btn signature-review-delete"
                                                                    title="Delete Signature"
                                                                    aria-label="Delete Signature"
                                                                    data-id={placeholder.id}
                                                                    onclick={handleDeleteSignature}>
                                                                    <svg class="signature-review-icon"
                                                                        viewBox="0 0 24 24" aria-hidden="true">
                                                                        <path
                                                                            d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5l-1-1h-5l-1 1H5v2h14V4h-3.5z">
                                                                        </path>
                                                                    </svg>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <!-- <template if:true={placeholder.hasImage}>
    <div class="esign-block">


        <div class="esign-border"></div>

      
        <div class="esign-content">
            <div class="esign-label">TSigned by:</div>

            <img
                src={placeholder.imageSrc}
                alt="Signature"
                class="esign-signature"
            />

            <div class="esign-guid">
                {sessionGuid}
            </div>
        </div>

    </div>
</template> -->

                                                    <!-- If the image is not uploaded -->
                                                    <template if:false={placeholder.hasImage}>
                                                        <!-- OLD UI START (H6: empty signature box text)
                                        <div class="placeholder-sign" onclick={handleUploadSignature} data-id={placeholder.id}>
                                            Upload Signature
                                        </div>
                                        OLD UI END (H6) -->
                                                        <div class="placeholder-sign" onclick={handleUploadSignature}
                                                            data-id={placeholder.id}>
                                                            <svg class="placeholder-sign-icon"
                                                                xmlns="http://www.w3.org/2000/svg" height="18px"
                                                                viewBox="0 -960 960 960" width="18px"
                                                                fill="currentColor" aria-hidden="true">
                                                                <path
